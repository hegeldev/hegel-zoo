[[bug]]
id = "apd/15"
title = "Floor and Ceil with the result aliased to the operand lose the step when the integral part is zero: c.Floor(x, x) of -0.01 is -0, not -1"
kind = "wrong-result"
severity = "high"
test = "TestHegelFloorAndCeilWithAliasedOperand"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Context documents that "Arguments for any method can safely be used as both result and
operand".  With x = -0.01, `c.Floor(&d, x)` is `-1` but `c.Floor(x, x)` is `-0`; with
x = 0.01, `c.Ceil(&d, x)` is `1` but `c.Ceil(x, x)` is `0`; the same for -1E-30, 1E-30,
-7.58E-40.  Values with a non-zero integral part are right either way (`Floor(-2.5)` = `-3`).
Floor/Ceil evidently truncate into d and then look at the (now overwritten) operand to
decide whether to step, and a zero integral part looks exact.  The zoo's general
Floor/Ceil property runs with a separate result and this pin covers the aliased call.
"""

