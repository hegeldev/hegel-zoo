[[bug]]
id = "apd/5"
title = "Exp is not correctly rounded: wrong by up to 40% at precision 1–3 for arguments with a fractional part, and more than one ulp off at higher precisions"
kind = "wrong-result"
severity = "high"
test = "TestHegelExpIsAccurateAtLowPrecision"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Exp(42.42)` is `1.7E+18` at precision 2 and `2.59E+18` at precision 3 (e^42.42 =
2.6471…E+18, so `2.6E+18` and `2.65E+18`); `Exp(20.5)` at precision 2 is `4.9E+8` (want
`8.0E+8`); `Exp(12.3)` at precision 2 is `1.6E+5` (want `2.2E+5`); `Exp(-5.3)` at precision 1
is `0.007` (want `0.005`); `Exp(-42.42)` at precision 2 is `5.7E-19` (want `3.8E-19`).  At
precision 5, `Exp(10.000047)` is `22026` where the value is 22027.50… (`22028` half-even,
`22027` rounded down) — 1.5 ulp off.  Integer arguments (`Exp(42)` = `1.7E+18`) are right,
and apd's GDA suite runs exp at precision 9 and up.  GDA requires exp to be correctly
rounded; the README promises "enough internal precision to produce a correct result at the
requested precision".  The zoo's general functions property leaves Exp out and this pin
allows 1 ulp against Python.
"""

[[bug]]
id = "apd/6"
title = "Exp overflows or underflows for arguments beyond about ±23 000 although the result lies within the context's exponent range"
kind = "wrong-result"
severity = "medium"
test = "TestHegelExpStaysFiniteWithinTheExponentRange"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With MaxExponent 99999 / MinExponent -99999: `Exp(20000)` = `7.76E+8685` and `Exp(-20000)`
= `1.29E-8686` (correct), but `Exp(-30000)` is `0E-100003` with Underflow (want
`1.4640E-13029`), `Exp(-40000)` is `0` and `Exp(60000)` is `Infinity` with Overflow (want
`…E+26058`).  The cut-off does not move with MaxExponent/MinExponent (the same happens with
MaxExponent 99, MinExponent -99999), so an intermediate hits the system limit of ±100000
before the result, which fits, is formed.
"""

