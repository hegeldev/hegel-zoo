# Bugs found in cockroachdb/apd by the zoo's Hegel tests (hegel_test.go in hegel.patch).
# Oracle: Python's decimal module (the reference implementation of the General Decimal
# Arithmetic specification apd implements) run as a child process with the same precision,
# rounding, exponent range and no traps; math/big for BigInt; apd's own documentation.

[[bug]]
id = "apd/1"
title = "Quantize and RoundToIntegral{Exact,Value} of a value smaller than one unit return zero under every rounding mode: RoundUp, RoundCeiling, RoundFloor and Round05Up must give one unit"
kind = "wrong-result"
severity = "high"
test = "TestHegelQuantizeRoundsTinyValuesInTheRoundingDirection"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With `Rounding: RoundUp`, `Quantize(d, 0.001, 0)` is `0` and `Quantize(d, 0.001, -2)` is
`0.00` — rounding away from zero should give `1` and `0.01` (Python: `1`, `0.01`; GDA
quantize with round-up).  `Quantize(0.4, 0)` with RoundUp or RoundCeiling is `1`, correct: the
bug appears once the whole coefficient falls below the target exponent (|x| < 10^exp), when
the discarded part is no longer consulted.  Same for RoundCeiling on positives,
RoundFloor on negatives (`Quantize(-0.001, 0)` = `-0`, want `-1`), and for
`RoundToIntegralValue`/`RoundToIntegralExact` (`RoundToIntegralValue(1E-30)` with RoundCeiling
= `0`, want `1`).  `Ceil` and `Floor` are right (`Ceil(1E-30)` = `1`), so are `Add`/`Mul`
through `Round`.  Rounding a price up to whole cents with RoundUp silently drops amounts
under a cent.
"""

[[bug]]
id = "apd/2"
title = "In the subnormal range, RoundCeiling and RoundFloor treat a negative number as positive: ceiling moves it away from zero, floor towards it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelSubnormalDirectedRoundingRespectsTheSign"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Precision 2, MinExponent -5 (Etiny -6): `Mul(-3.06E-8, 1)` with RoundCeiling is `-0.000001`
(want `-0.000000`: ceiling of a negative moves towards +∞) and with RoundFloor `-0.000000`
(want `-0.000001`); `Add(-1.7134E-6, 0)` with RoundCeiling is `-0.000002` (want
`-0.000001`), with RoundFloor `-0.000001` (want `-0.000002`).  The positive counterparts are
right, and outside the subnormal range (`Quantize(-0.4, 0)` with RoundCeiling = `-0`) so is
the negative case: the subnormal path (`Rounder.Round` → `setExponent`) rounds without the
sign.  Python's decimal gives the expected results.
"""

[[bug]]
