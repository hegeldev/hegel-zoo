[[bug]]
id = "apd/8"
title = "Results with more digits than the precision: a quotient whose rounding carries keeps precision+1 digits (Quo(9.6, 1) at precision 1 is 10, not 1E+1); Rem by an infinity returns the dividend unrounded, and Floor/Ceil never round the integral part to the precision"
kind = "wrong-result"
severity = "medium"
test = "TestHegelResultsFitThePrecision"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Precision 1: `Quo(9.6, 1)` = `10`, `Quo(0.95, 1)` = `1.0`, `Quo(0.77, 8)` = `0.10`,
`Quo(0.77, -8E8)` = `-1.0E-9` — two-digit coefficients.  Precision 2: `Quo(99.6, 1)` = `100`,
`Quo(1, 1.005)` = `1.00` (Python `1.0`).  The value is right, the coefficient is not reduced
after the carry; `Add(9.6, 0)`, `Mul(9.6, 1)` and `Sqrt(99)` at precision 1 give `1E+1`.
Code that reads `Coeff`/`Exponent` or relies on `NumDigits() <= Precision` sees the extra
digit, and `CmpTotal` distinguishes `10` from `1E+1`.  `Rem(-12345, Infinity)` at precision
1 returns `-12345` with no condition (Python: `-1E+4`, Inexact and Rounded), and
`Floor(-10)`, `Ceil(-10.1)` and `Floor(10.1)` at precision 1 return `-10`, `-10` and `10`
(Python: `-1E+1`, `-1E+1`, `1E+1`): Floor and Ceil check the exponent range (`Ceil(5.39E15)`
with MaxExponent 6 overflows) but never round the integral part to the precision.
"""

[[bug]]
id = "apd/9"
title = "Result exponents differ from GDA's ideal exponent: an exact quotient keeps trailing zeros, the square root of a zero halves the exponent towards zero, RoundToIntegral drops a positive exponent"
kind = "contract"
severity = "low"
test = "TestHegelResultsHaveTheIdealExponent"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Quo(46E7, 1E-3)` at precision 5 is `4.6000E+11` (GDA: exponent of x minus exponent of y
when exact, `4.6E+11`); `Sqrt(1)` at precision 2 is `1.0` and `Sqrt(-0E-5)` is `-0.00` (GDA:
`1` and `-0.000`, exponent floor(exp/2) for an exact root);
`RoundToIntegralValue(1E+2)` is `100` (GDA: the operand unchanged, `1E+2`); `Exp(1E-5)` at
precision 4 is `1` (GDA rounds to the precision: `1.000`) and `Pow(1, -1)` at precision 2 is
`1.0` (GDA: `1`).  Values are equal; the representation is what `CmpTotal`, `String` and `Coeff`/`Exponent` expose.
apd's own GDA harness compares finite results with `Cmp` ("Don't worry about trailing
zeros") and its gda_test.go notes the first as a TODO ("after upscaling, operations need to
remove the 0s added").
"""

