[[bug]]
id = "apd/17"
title = "Quantize returns NaN with InvalidOperation whenever it discards digits and the result has more than MaxExponent+1 digits, however small the result"
kind = "wrong-result"
severity = "medium"
test = "TestHegelQuantizeAcceptsResultsWithMoreDigitsThanMaxExponent"
found = { commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5", version = "v3.2.3", hegel = "v0.6.33", date = "2026-03-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With MaxExponent 2 (any precision, any rounding): `Quantize(1.2345, -3)` is `NaN` with
InvalidOperation (want `1.235`), `Quantize(0.0012345, -6)` is `NaN` (want `0.001235`), while
`Quantize(1.234, -3)` (nothing discarded) and `Quantize(0.0012345, -5)` (three-digit result)
are fine; `Quantize(1.000, -2)` at precision 3, MaxExponent 1 is `NaN` (want `1.00`).  The
rule: when `exp > x.Exponent`, `quantize()` rounds the operand to `NumDigits(x) - (exp -
x.Exponent)` digits at exponent 0 ("using 0 instead of exp as the target", context.go) and
`setExponent` applies the MaxExponent check to that intermediate, so a result with more than
MaxExponent+1 digits overflows to Infinity, which `Quantize` then turns into `NaN`.  Only
contexts with a small MaxExponent are affected (the default is 100000).
"""
