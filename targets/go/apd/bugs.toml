upstream_issue = ""
fixed_in = ""
notes = """
Precision 3, MaxExponent 6: `Add(1E7, 0)` is `Infinity` under every Rounder.  GDA (and
Python) give `9.99E+6` for RoundDown, Round05Up and RoundFloor, and `-9.99E+6` for a negative
