name = "apd"
language = "go"
upstream = "https://github.com/cockroachdb/apd"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "6d9c587326e78bcfbea630bf52893ff45f6f9ed5"
date = "2026-03-23"
version = "v3.2.3"

[hegel]
version = "v0.6.33"

[run]
command = "go test -count=1 -v ."
setup = ["python3 -c 'import decimal'"]

[expected_failures]
# Unsteered 2026-10-06 (STYLE.md rule 11): the wide properties draw every recorded shape and fail
# naming it ("the shape of apd/N" at the end of the failure); each is mapped to the bug it most
# often shrinks to (a shared fail helper is one shrink group, so the shrink goes to the smallest
# shape hit, apd/3 at precision 1 mostly). Arithmetic, Text, SetFloat64 and DecimalHelpers fail
# every run; the others in most runs at 100 cases (shape rates 2-7%) and every run at 1000.
# HEGEL_NO_KNOWN=1 leaves the shapes out (shaped generators, sub-checks following the library).
TestHegelArithmeticAgreesWithPythonDecimal = "apd/3" # shrinks to apd/4 (Floor(Infinity)) at 1000 cases; draws /1, /2, /8, /9, /15, /16, /19 too
TestHegelTextFormatsAgreeWithTheModel = "apd/13"
TestHegelSetFloat64RoundTrips = "apd/14"
TestHegelDecimalHelpersAgreeWithTheModel = "apd/12"
TestHegelQuantizeAgreesWithPythonDecimal = { bug = "apd/1", intermittent = true } # 7.4% of cases; also /17
TestHegelExponentLimitsAgreeWithPythonDecimal = { bug = "apd/3", intermittent = true } # also /1, /2, /16, /17
TestHegelSetStringAgreesWithPythonDecimal = { bug = "apd/3", intermittent = true } # also /2
TestHegelDivisionAgreesWithPythonDecimal = { bug = "apd/3", intermittent = true } # also /2, /7, /8, /9, /11, /20
TestHegelFunctionsAgreeWithPythonDecimal = { bug = "apd/9", intermittent = true } # also /3, /5, /6, /10
# One narrow property per bug, over its shape alone: deterministic.
TestHegelQuantizeRoundsTinyValuesInTheRoundingDirection = "apd/1"
TestHegelSubnormalDirectedRoundingRespectsTheSign = "apd/2"
TestHegelOverflowRoundsToTheLargestFiniteNumber = "apd/3"
TestHegelCeilAndFloorOfSpecialValues = "apd/4"
TestHegelExpIsAccurateAtLowPrecision = "apd/5"
TestHegelExpStaysFiniteWithinTheExponentRange = "apd/6"
TestHegelQuoIntegerRespectsMaxExponent = "apd/7"
TestHegelResultsFitThePrecision = "apd/8"
TestHegelResultsHaveTheIdealExponent = "apd/9"
TestHegelLog10OfPowersOfTenIsExact = "apd/10"
TestHegelNaNResultsAreUnsigned = "apd/11"
TestHegelReduceKeepsTheSignOfZero = "apd/12"
TestHegelTextExponentHasTwoDigits = "apd/13"
TestHegelSetFloat64IsExact = "apd/14"
TestHegelFloorAndCeilWithAliasedOperand = "apd/15"
TestHegelReduceStripsZerosMadeByRounding = "apd/16"
TestHegelQuantizeAcceptsResultsWithMoreDigitsThanMaxExponent = "apd/17"
# apd/18 (Ln spinning when a trap fires in its series): the wide property probes the Ln step in a
# child process and reaches the shape at roughly one case in ten thousand, so intermittent.
TestHegelErrDecimalMatchesContext = { bug = "apd/18", intermittent = true }
TestHegelLnReturnsWhenATermOfItsSeriesIsSubnormal = "apd/18"
TestHegelPinLnSpinsWhenASeriesTermIsSubnormal = "apd/18"
TestHegelFloorAndCeilOverflowBeyondMaxExponent = "apd/19"
TestHegelPinFloorAndCeilOverflowBeyondMaxExponent = "apd/19"
TestHegelSubnormalQuotientsFlagInexactAndUnderflow = "apd/20"
TestHegelPinSubnormalQuotientsFlagInexactAndUnderflow = "apd/20"
