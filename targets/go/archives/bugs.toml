[[bug]]
id = "archives/1"
title = "Zip archives written with ZipMethodXz cannot be read: the xz stream header precedes each local file header"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinZipXzHeaderOffset"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Zip{Compression: ZipMethodXz}.Archive succeeds, but Extract on the result fails for every
entry with "zip: not a valid zip file", and so do archive/zip's OpenRaw, unzip (-324%
compression, cannot extract) and Python's zipfile. zip.go registers ulikunitz/xz's
xz.NewWriter as the compressor for method 95; that writer emits the 24-byte xz stream header
at construction, and archive/zip (klauspost's fork alike) constructs the compressor before it
writes the local file header and records the header's offset after: the header lands 24
bytes after the offset the central directory points at, so no reader finds "PK\x03\x04"
there. The other registered methods (bzip2, zstd) write nothing until the first Write.
Every entry of every xz zip is unreadable, without any error at writing time.
'''

[[bug]]
id = "archives/2"
title = "Tar.Insert after an archive whose last entry is a directory, a link or a 512-multiple file leaves a zero block, and the archive no longer reads past it"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinTarInsertBlockAligned"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Tar.Insert computes where to write from the position after the last header plus the last
entry's size, then rounds up with `newOffset += blockSize - (newOffset % blockSize)`: when the
offset is already on a block boundary (the last entry's size is 0 or a multiple of 512, so
every directory, symlink, empty file and empty archive) it adds a full block, and the new
entries are written after one zero block. archive/tar reads a single zero block followed by a
header as "archive/tar: invalid tar header", so Extract returns the old entries and then an
error; the inserted files are unreachable. Insert into an empty archive writes at offset 512
with the same effect. Insert returns no error.
'''

[[bug]]
id = "archives/3"
title = "Zip.Insert returns after a directory entry, and the files after it are silently not inserted"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinZipInsertDirStops"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In Zip.Insert the loop over the files has `if file.IsDir() { return nil }` where the archiving
path has a `continue`: after appending a directory header the method returns nil, and every
file after the directory in the list is dropped without an error. FilesFromDisk/FilesFromFS
list a directory before its contents, so inserting any directory tree inserts only the
directory. Example: Insert of [d/, z.txt] into an archive holding a.txt gives [a.txt, d/].
'''

[[bug]]
id = "archives/4"
title = "ArchiveFS.Open of a directory before the index is built returns a descendant file opened as the directory"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinOpenImplicitDirFile"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Before ReadDir has indexed the archive, ArchiveFS.Open walks the entries with a handler that
opens the first entry whose name is the requested one or under it. When the directory has no
entry of its own (an implicit directory, as tar and zip archives commonly have) or its entry
comes after one of its descendants, the first descendant matches: Open("a") on an archive
holding only a/b.txt returns a/b.txt's content with Stat().Name() "b.txt", not a directory
file, and Open("a") when a/b.txt precedes the a/ entry does the same. After ReadDir(".") the
index is used and Open returns a directory. testing/fstest.TestFS reports it on any archive
with an implicit directory ("Open returned File type archives.fileInArchive, not a
fs.ReadDirFile"). ArchiveFS.Open has a value receiver, so the index its own call to ReadDir
builds is discarded, and Open never indexes for itself.
'''

[[bug]]
id = "archives/5"
title = "ArchiveFS.Open of a directory before the index is built lists the files of later or implicit subdirectories, and of ./ names, as its own"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinOpenDirFreshEntries"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The un-indexed Open handler appends every entry under the requested directory to the
directory file's entries, and stops descending into a subdirectory only when it meets that
subdirectory's own entry (fs.SkipDir). A subdirectory without an entry, or whose entry comes
after its files, therefore contributes its files, listed by their base names, as children of
the requested directory, and its own name is missing: Open("a") on [a/, a/b/c.txt] lists
[c.txt], not [b]. A file whose name is written with a "./" prefix is never skipped either:
the skip list holds the cleaned directory name while fileIsIncluded compares the raw name, so
./a/b/c.txt is listed under a even when a/b/ has an entry before it. fs.ReadDir (indexed)
lists the right children, so the two ways of reading a directory disagree.
'''

[[bug]]
id = "archives/6"
title = "ArchiveFS.Stat of a missing name that is a prefix of an entry name returns an implicit directory"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStatPrefixMissing"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Before the index is built, Stat walks the entries and, failing an exact match, falls back to
an implicit directory when `strings.HasPrefix(cleanName, name)` holds for some entry: a
string prefix, not a path prefix. Stat("a/b") on an archive holding a/bc.txt returns a
FileInfo named "a/b" with IsDir true; Stat("e.ta") on one holding e.tar does the same. After
ReadDir(".") the same names are fs.ErrNotExist. The Open handler guards the same test with a
trailing "/" ("a/b/c.jpg.json" must not match "a/b/c.jpg", as its comment says).
'''

[[bug]]
id = "archives/7"
title = "ArchiveFS.Stat of an implicit directory returns its full path as Name() before indexing, and a child's name after"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStatImplicitDirName"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
fs.FileInfo.Name() is the base name. Before the index, Stat's fallback builds
implicitDirInfo{implicitDirEntry{name}} with the full requested path: Stat("a/b") on an
archive holding a/b/c.txt has Name() "a/b". After ReadDir, the index loop in ReadDir walks
the parents of each entry as (dir, base) pairs and stores `f.contents[dir] = implicitDirInfo{
base}`: the entry stored under the parent's path is named after the child, so Stat("a") then
has Name() "b" (and Stat("a/b"), stored under "a/b" from a deeper entry, "c.txt"'s parent
name). Directories with an entry of their own are unaffected.
'''

