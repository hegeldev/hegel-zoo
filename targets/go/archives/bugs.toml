[[bug]]
id = "archives/24"
title = "Lzip's writer closed without a Write produces a stream its reader rejects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLzipEmptyStream"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Lzip{}.OpenWriter(w) then Close() with no Write in between writes 30 bytes without the LZIP
header (lzip-go v0.3.8 writes the header on the first Write, the LZMA trailer on Close):
Lzip{}.OpenReader on them fails with "lzip: invalid magic number", Lzip.Match does not
match, and the lzip tool refuses them. A Write of zero bytes first gives a valid 36-byte
stream. Compressing an empty file with io.Copy, which never calls Write for an empty source,
takes the failing path. The other formats' writers give a valid empty stream (Sz and MinLZ
give one without a stream header, which their readers accept but Match cannot see).
'''

[[bug]]
id = "archives/25"
title = "Brotli.Match rejects streams longer than 1 KiB whose first kibibyte does not decode to its end, so Identify finds no format for them"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBrotliMatchTruncated"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Brotli has no magic number; isValidBrotliStream reads at most 1024 bytes and decodes them,
returning false on any decoder error other than io.EOF. A stream longer than that is cut
mid-block, the decoder returns an unexpected-EOF error on the truncated input, and the
stream is not matched: Brotli{}.Match on a 4004-byte brotli stream of random data (which
does not compress) gives ByStream false and Identify("", stream) returns NoMatch, while the
same data below 1 KiB, or compressible data whose first kibibyte holds whole blocks, is
matched. The heuristic's own first-byte check (0x1b, 0x0b, 0x8b) would have accepted it but
is never reached.
'''

[[bug]]
id = "archives/26"
title = "Identify by name does not know .tgz, which PathIsArchive and DeepFS treat as an archive"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinIdentifyTgzByName"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Identify(ctx, "x.tgz", nil) returns NoMatch: Gz.Match wants the extension ".gz" and Tar.Match
a ".tar" component, and no format knows the ".tgz" (or ".tbz2", ".txz") spelling, while
archiveExtensions in fs.go lists ".tgz" so PathIsArchive("x.tgz") is true and DeepFS walks
into such files. Identify("x.tar.gz", nil) returns the CompressedArchive. With a stream the
content decides and .tgz files are read; only the name-based path (choosing a format for a
file to write, or a name without content) is affected.
'''

[[bug]]
id = "archives/27"
title = "FilesFromDisk and FilesFromFS with FollowSymlinks never return on a symbolic link to an ancestor directory"
kind = "hang"
severity = "high"
test = "TestHegelPinFollowAncestorLinkHang"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With FollowSymlinks, a link to a directory is handled by calling FilesFromDisk (FilesFromFS)
again on the directory, and the walk of that directory meets the link again: for d/self -> .
(or any link to a directory above itself, as /usr/bin/X11 -> . or lib64 -> ../lib on many
systems) the functions recurse without end, the stack and the gathered file list grow until
the process runs out of stack, and no error is ever returned. Nothing records the directories
already being followed; followSymlink's own loop detection covers chains of links only.
Found when a generated tree held a link to its parent's directory: the property's disk side
hung for thirteen minutes. The pin runs the call in a child process with an eight-second
limit.
'''
