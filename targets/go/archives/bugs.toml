[[bug]]
id = "archives/14"
title = "FilesFromDisk and FilesFromFS with the in-archive root . give names with a leading slash"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFsRootDotLeadingSlash"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The value "." is documented in nameOnDiskToNameInArchive as the escape hatch that puts a
directory's contents in the root of the archive. It sets rootInArchive to "" and then joins it
with strings.TrimPrefix(nameOnDisk, rootOnDisk), which for a key without a trailing separator
keeps the separator: {"dir": "."} on dir/f.txt gives path.Join("", "/f.txt") = "/f.txt", and
the directory itself is "/" (not skipped: the skip is for an empty name). Tar and zip archives
are then written with absolute names, which most extractors refuse or strip with a warning.
The same key with the value "" gives dir/f.txt, and "dir/" with "." gives f.txt.
'''

