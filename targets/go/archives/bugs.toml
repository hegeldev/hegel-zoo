[[bug]]
id = "archives/9"
title = "An empty zip is not identified by its stream: Zip.Match reads new bytes for each candidate header"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZipEmptyStreamMatch"
found = { commit = "9bf66b8e091c2318c7de7b2054c19ddf7b2702ce", version = "v0.1.5+8 (9bf66b8)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
zipHeaders lists PK\x03\x04 (an entry) and PK\x05\x06 (the end record of an empty archive).
Zip.Match loops over them calling readAtMost(stream, 4) each time, so the second header is
compared with bytes 4-7 of the stream, never with its start; an empty zip (22 bytes starting
PK\x05\x06) is not matched, and Identify("", stream) returns NoMatch for it while
Identify("x.zip", nil) returns Zip. The stream is returned in the right position (Identify
rewinds), only the match is wrong.
'''

[[bug]]
