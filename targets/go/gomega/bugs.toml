[[bug]]
id = "gomega/1"
title = "BeNumerically converts a signed and an unsigned integer to the actual's kind, so -1 == uint64 max and uint 5 is not > -3"
kind = "logic"
severity = "medium"
test = "TestHegelPinSignedUnsigned"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
BeNumericallyMatcher.Match (be_numerically_matcher.go) picks the comparison by the kind of the
actual: for a signed actual it converts every argument with toInteger (int64(value.Uint())),
for an unsigned actual with toUnsignedInteger (uint64(value.Int())). A negative signed number
and a large unsigned one therefore become the same bit pattern: BeNumerically("==",
uint64(math.MaxUint64)) succeeds on -1, BeNumerically("==", -1) succeeds on
uint64(math.MaxUint64), BeNumerically(">", -3) fails on uint(5) (the -3 becomes 2^64-3) and
BeNumerically("<", uint64(1)<<63) fails on 5 (the bound becomes math.MinInt64). The matcher is
documented as comparing "numbers of any type" by value, "in a way that ... does not care about
the exact type"; a sign check (or comparing through big.Int/float when the kinds mix) would
do it. Found by TestHegelNumerically, whose model converts as the package does while
Known.mixedSignConversion is on.
'''

[[bug]]
id = "gomega/2"
title = "BeNumerically ~ and == on integers subtract in int64 and wrap, so MinInt64 ~ MaxInt64 within 1"
kind = "logic"
severity = "low"
test = "TestHegelPinIntegerDifference"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
matchIntegers computes `diff := actual - compareTo` in int64 and tests -threshold <= diff <=
threshold. The subtraction overflows for operands far apart: math.MinInt64 - math.MaxInt64 wraps
to 1, so BeNumerically("~", int64(math.MaxInt64), 1) succeeds on int64(math.MinInt64) and
BeNumerically("==", int64(math.MaxInt64)) succeeds on int64(math.MinInt64); -1 ~ MaxInt64
within MaxInt64 also succeeds (the true distance is MaxInt64 + 1). The unsigned path orders the
operands before subtracting and does not wrap. Found by TestHegelNumerically, whose model wraps
the difference while Known.intDiffOverflow is on.
'''

[[bug]]
id = "gomega/3"
title = "BeNumerically compares an integer with a float after rounding the integer to float64, so 2^53+1 == float64(2^53)"
kind = "logic"
severity = "low"
test = "TestHegelPinIntegerFloat"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
When either operand is a float, Match converts both with toFloat (float64(value.Int()) or
float64(value.Uint())) and compares the float64s. Integers above 2^53 lose their low bits:
BeNumerically("==", float64(1<<53)) succeeds on int64(1<<53+1), BeNumerically(">",
float64(1<<53)) fails on it, and BeNumerically("==", 1e19) succeeds on uint64(1e19+1). The
documented comparison is by value. Found by TestHegelNumerically, whose model rounds the
integer while Known.intFloatRounding is on; exact comparison (big.Rat) is the oracle.
'''

[[bug]]
id = "gomega/4"
title = "HaveKeyWithValue with a key matcher judges only the first key (in map order) the key matcher accepts, so the result depends on the iteration order"
kind = "logic"
severity = "medium"
test = "TestHegelPinKeyWithValueAnyKey"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HaveKeyWithValueMatcher.Match (have_key_with_value_matcher.go) walks the map's keys and, at the
first key the key matcher accepts, runs the value matcher on that key's value and returns its
result (`return success, nil`) without looking at the other keys. With a key matcher that
accepts several keys the outcome is whichever key Go's map iteration yields first:
HaveKeyWithValue(MatchRegexp(`.+Foo$`), "Bar") on {"aFoo": "x", "bFoo": "Bar", "cFoo": "y",
"dFoo": "z"} succeeds on some runs and fails on others. The documentation says the matcher
"succeeds if actual is a map with the passed in key and value" and that "both key and value
can be a matcher", which reads as "some key matching the key matcher has a value matching the
value matcher". Found by TestHegelMaps, whose model accepts the set of per-key outcomes while
Known.keyMatcherFirstKey is on.
'''

[[bug]]
id = "gomega/5"
title = "MatchJSON ignores json.Unmarshal errors, so two documents with out-of-range numbers match each other and 1e400 matches null"
kind = "logic"
severity = "medium"
test = "TestHegelPinJSONDecodeError"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MatchJSONMatcher.Match validates both strings with json.Indent (which accepts any syntactically
valid document) and then calls json.Unmarshal into `any` for each, discarding the returned
error (match_json_matcher.go lines 26-27). A number outside float64's range such as 1e400 is
valid JSON but fails to unmarshal ("cannot unmarshal number 1e400 into Go value of type
float64"), leaving the interface nil, so `1e400` matches `1e401`, `1e400` matches `null`, and
`{"a": 1e400}` matches `{"a": 1e999}` (the object is partly decoded, the number left nil in
both). The documented behaviour is a comparison of the two documents as JSON; a decode failure
should be reported as an error. Found by TestHegelJSON, whose model treats two undecodable
documents as equal while Known.jsonDecodeErrorIgnored is on.
'''

[[bug]]
id = "gomega/6"
title = "MatchJSON compares numbers as float64, so 12345678901234567890 matches 12345678901234567891"
kind = "logic"
severity = "low"
test = "TestHegelPinJSONNumbers"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The documents are decoded with json.Unmarshal into `any`, which represents every number as a
float64, and compared with reflect.DeepEqual. Integers that differ only beyond 53 bits of
precision decode to the same float64: MatchJSON(`12345678901234567891`) succeeds on
`12345678901234567890`, MatchJSON(`9007199254740992`) on `9007199254740993`, and
MatchJSON(`[0.10000000000000002]`) on `[0.1]` is a legitimate float comparison but the same
mechanism. Decoding with json.Decoder.UseNumber and comparing the numbers exactly would
distinguish them. Found by TestHegelJSON, whose model rounds numbers to float64 while
Known.jsonNumbersFloat64 is on.
'''

[[bug]]
id = "gomega/7"
title = "MatchXML compares namespace prefixes and xmlns declarations literally, so the same document with another prefix does not match"
kind = "logic"
severity = "low"
test = "TestHegelPinXMLNamespaces"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parseXmlContent (match_xml_matcher.go) keeps each element's xml.Name and its sorted []xml.Attr
as the decoder delivers them, and the trees are compared with reflect.DeepEqual. encoding/xml
resolves an element's namespace to its URI but leaves the xmlns:prefix declarations in the
attribute list (as attributes in the "xmlns" space) and, for a prefixed attribute, resolves the
Space to the URI while the declaration itself still differs by prefix. So `<a xmlns:p="urn:u">
<p:b/></a>` does not match `<a xmlns:q="urn:u"><q:b/></a>`, `<a xmlns="urn:u"><b/></a>` does
not match `<p:a xmlns:p="urn:u"><p:b/></p:a>`, while a different URI with the same prefix is
correctly a mismatch. The documentation promises a match when the actual "is an XML document
which is semantically equivalent to the expected"; XML namespaces are identified by URI, the
prefix being a local spelling. Found by TestHegelXML, whose renderer uses one prefix for both
documents while Known.xmlPrefixLiteral is on.
'''

[[bug]]
id = "gomega/8"
title = "MatchYAML reads only the first document of a stream, so a: 1 matches a: 1 followed by --- b: 2"
kind = "logic"
severity = "low"
test = "TestHegelPinYAMLStream"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MatchYAMLMatcher.Match decodes each string with yaml.Unmarshal (match_yaml_matcher.go lines
25-28), which parses the first document of a stream and ignores the rest. MatchYAML("a: 1")
therefore succeeds on "a: 1\n---\nb: 2", and two streams differing only in their second
document match. The matcher is documented as succeeding when the actual "is a YAML document
which is semantically equivalent to the expected"; a stream with more documents than the
expected is not, and a yaml.Decoder loop (or an error on a second document) would catch it.
Found by TestHegelYAML, whose generator appends a second document only while
Known.yamlFirstDocument is off.
'''

[[bug]]
id = "gomega/9"
title = "HaveExactElements' failure message omits where the missing or extra elements start when that index is 0"
kind = "logic"
severity = "low"
test = "TestHegelPinExactElementsIndexZero"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HaveExactElementsMatcher records missingIndex / extraIndex when the actual is shorter or longer
than the expectations and FailureMessage appends "the missing elements start from index %d" /
"the extra elements start from index %d" only `if matcher.missingIndex > 0` / `if
matcher.extraIndex > 0` (have_exact_elements.go lines 113-117). Index 0 is a valid start:
HaveExactElements("a") on an empty slice and HaveExactElements() on []string{"x"} report
"to have exact elements with" and nothing about the missing or extra elements, while the same
situation one element later is explained. The zero value doubles as "not set"; a separate flag
(or -1 as the unset value) would fix it. Pinned directly (the model does not read messages).
'''

[[bug]]
id = "gomega/10"
title = "WithTransform and Satisfy reject a nil actual for a pointer, slice, map, func or chan parameter that could hold it"
kind = "logic"
severity = "low"
test = "TestHegelPinNilArgument"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
WithTransformMatcher.Match (with_transform.go lines 49-60) and SatisfyMatcher.Match
(satisfy_matcher.go lines 41-52) build the argument from the actual: a non-nil actual whose
type is assignable to the parameter is passed, a nil actual is turned into reflect.Zero of the
parameter type only when the parameter is an interface, and every other case errors with
"Transform function expects '*int' but we have '<nil>'". A nil untyped actual is a valid value
of every pointer, slice, map, function and channel type, and the comment's reasoning ("the
dynamic type of actual is unknown, so there's no way to make its reflect.Value") applies to
them as it does to interfaces: WithTransform(func(p *int) bool { return p == nil }, BeTrue())
and Satisfy(func(p []int) bool { return p == nil }) on nil should call the function with a nil
of the parameter type instead of failing. Pinned directly.
'''

[[bug]]
id = "gomega/11"
title = "Equal on two []byte uses bytes.Equal, so a nil byte slice equals an empty one while every other slice type is DeepEqual"
kind = "logic"
severity = "low"
test = "TestHegelPinEqualBytes"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
EqualMatcher.Match (equal_matcher.go lines 20-25) special-cases two byte slices with
bytes.Equal, which treats nil and []byte{} as equal, and uses reflect.DeepEqual otherwise,
which does not: Equal([]byte{}) succeeds on []byte(nil) while Equal([]int{}) fails on
[]int(nil). Equal is documented as "reflect.DeepEqual", with the difference between nil and
empty being one of the things the doc comment warns about, and the special case is not
mentioned. Found by TestHegelValues and TestHegelCollections (ContainElement, BeElementOf and
ConsistOf wrap plain values in Equal), whose model uses bytes.Equal for two byte slices while
Known.equalBytesSpecial is on.
'''

[[bug]]
id = "gomega/12"
title = "HaveKey and HaveKeyWithValue return the key matcher's error for the first key it errors on, so a map with a matching key succeeds or errors depending on the iteration order"
kind = "logic"
severity = "low"
test = "TestHegelPinKeyMatcherError"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HaveKeyMatcher.Match and HaveKeyWithValueMatcher.Match walk the map's keys in Go's iteration
order and return `false, err` as soon as the key matcher errors on a key (have_key_matcher.go,
have_key_with_value_matcher.go line 58). With a key matcher that errors on some keys and
accepts another, such as BeNumerically(">", 1) on map[any]int{"a": 1, 2: 2, "b": 3, 4: 4}
(BeNumerically errors on a string), HaveKey succeeds when key 2 or 4 is visited before "a" and
"b" and errors otherwise; the same holds for HaveKeyWithValue(BeNumerically(">", 1), 2). A
result that depends on the map order is not a result; the matchers could try every key and
report the error only when no key matched (as ConsistOf treats a matcher error as a non-match).
Found by TestHegelMaps, whose model accepts either outcome while Known.keyMatcherErrorOrder is
on.
'''

[[bug]]
id = "gomega/13"
title = "ContainElement(nil), HaveEach(nil) and HaveKeyWithValue(k, nil) error on a nil element instead of matching it, unlike ConsistOf(nil)"
kind = "logic"
severity = "low"
test = "TestHegelPinNilElement"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
matchers() in consist_of.go wraps a nil expected element in BeNilMatcher for ConsistOf,
ContainElements and HaveExactElements, so ConsistOf(nil) matches a nil element. ContainElement
(contain_element_matcher.go line 126), HaveEach and HaveKeyWithValue wrap a non-matcher
argument in EqualMatcher{Expected: nil}, which refuses to compare nil with nil: ContainElement
(nil) on []any{1, nil} or []*int{nil} errors with "Refusing to compare <nil> to <nil>", HaveEach
(nil) on []any{nil, nil} errors, and HaveKeyWithValue("a", nil) on map[string]any{"a": nil}
errors, while a typed nil element in an []any (such as []byte(nil)) is simply not equal to the
untyped nil. The documentation of the three matchers says the element or value "can be a
matcher", falling back to Equal, without mentioning that nil is unusable; the collection
matchers' BeNil rule should apply to them too. Found by TestHegelCollections and
TestHegelMaps, whose model errors on a nil element while Known.nilElementEqual is on.
'''

[[bug]]
id = "gomega/14"
title = "BeNumerically == with a threshold behaves as ~ for integers and as exact equality for floats"
kind = "logic"
severity = "low"
test = "TestHegelPinEqualsThreshold"
found = { commit = "47f0f871af5eaab0b4a7b5bba625c2f01cadbbb1", version = "untagged (24 commits after v1.39.1, 2026-09-17)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
matchIntegers and matchUnsignedIntegers share one case for "==" and "~" and apply the
threshold to both, so BeNumerically("==", 5, 10) succeeds on 7 and BeNumerically("==",
uint(5), 10) on uint(7); matchFloats has a separate "==" case with actual == compareTo, so
BeNumerically("==", 5.0, 10) fails on 7.0. The documentation reserves the threshold for "~"
("BeNumerically("~", 0.1, 0.01)") and describes "==" as equality; whichever reading is meant,
the three kinds should agree. Found by TestHegelNumerically, whose model turns == with a
threshold into ~ for integers while Known.equalsThresholdInts is on.
'''
