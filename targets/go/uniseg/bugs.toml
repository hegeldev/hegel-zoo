# Bugs found in rivo/uniseg by the Hegel properties. Each is pinned by the test named in
# `test`, listed as an expected failure in target.toml.

[[bug]]
id = "uniseg/1"
title = "A text-presentation emoji followed by an emoji modifier or a ZWJ sequence keeps width 1, though the documentation says any additional code point forces width 2"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmojiModifierSequencesAreTwoCellsWide"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
doc.go: "For grapheme clusters starting with an Extended Pictographic, any additional code
point will force a total width of 2, except if the Variation Selector-15 (U+FE0E) is included,
in which case the total width is always 1." grapheme.go/step.go implement only the two
selectors: `if firstProp == prExtendedPictographic { if r == vs15 { width = 1 } else if r ==
vs16 { width = 2 } }` — any other continuation leaves the base's own width. So ☝🏻 (U+261D,
Emoji_Presentation=No, + U+1F3FB), ✌🏿, ©‍© and ❤‍🔥 (without VS16) are width 1, though UTS #51
gives emoji modifier sequences and ZWJ sequences emoji presentation and terminals draw them in
two cells; ☝️ (with VS16) is 2. Fix: `width = 2` for any continuation code point unless VS15
was seen, as documented.
'''

[[bug]]
id = "uniseg/2"
title = "A precomposed Hangul syllable followed by a trailing jamo is one cluster of width 3"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHangulSyllableWithTrailingJamoIsTwoCellsWide"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
doc.go: "For Hangul grapheme clusters composed of conjoining Jamo …, all code points except the
first one have a width of 0." The width loop only applies that when the cluster starts with a
leading jamo (`firstProp != prRegionalIndicator && firstProp != prL` guards the addition), so
an LV or LVT syllable (U+AC00–D7A3, East_Asian_Width W, width 2) followed by a trailing jamo
(U+11A8–11FF or D7CB–D7FB, East_Asian_Width N, width 1) — one cluster by GB7/GB8 — is 2 + 1 = 3:
`StringWidth("각")` (U+AC00 U+11A8) = 3 while `StringWidth("각")` (U+AC01) = 2 and
`StringWidth("각")` (U+1100 U+1161 U+11A8) = 2, the same syllable three ways. NFC-normalised
text does not produce this shape but decomposed or partially composed text (input methods,
Old Hangul) does. Fix: guard on prL, prLV and prLVT.
'''

[[bug]]
id = "uniseg/3"
title = "Step and Graphemes cannot report the word, sentence and line boundaries that fall inside a grapheme cluster, so they segment differently from FirstWord, FirstSentence and FirstLineSegment"
kind = "contract"
severity = "low"
test = "TestHegelPinStepReportsTheBoundariesInsideClusters"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
UAX #29 treats Prepend characters (U+0600–0605, U+0890, U+110BD, U+11A3A, …) as Format for word
and sentence breaking, so there is a word boundary after them, inside the grapheme cluster GB9b
forms with the following base; emoji modifiers are Extend for grapheme and word breaking but
not for sentence breaking (SB11 breaks after "｡" before U+1F3FC); UAX #14 lets a line break
between a non-emoji base and an emoji modifier (LB31), inside their grapheme cluster. `FirstWord`,
`FirstSentence` and `FirstLineSegment` report those boundaries (`FirstWordInString("؀낙")` gives
two words), while `Step`, `StepString` and the `Graphemes` methods `IsWordBoundary`/
`IsSentenceBoundary`/`LineBreak` only flag the end of each cluster ("؀낙" is one cluster with
one word), although Step is documented as "a combination of FirstGraphemeCluster, FirstWord,
FirstSentence, and FirstLineSegment". Word counts, sentence splits and wrap points differ
between the two APIs on such text. Fix: document the limitation on Step/Graphemes, or split the
cluster at a word/sentence/line boundary as the segmenter in [Graphemes] could.
'''

[[bug]]
id = "uniseg/4"
title = "A mandatory line break is reported after every emoji modifier sequence"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNoMandatoryBreakAfterAnEmojiModifierSequence"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
linerules.go `transitionLineBreakState`, the LB30b branch: `if nextProperty == prEM { if state ==
lbEB || state == lbExtPicCn { return prAny, LineDontBreak } }` returns the *property* constant
`prAny` as the new line-break *state*; `prAny` happens to equal the state that follows a
mandatory break class (BK/NL), so the boundary after the modifier is reported as
`LineMustBreak`: `FirstLineSegmentInString("👧🏼a", -1)` returns "👧🏼" with mustBreak = true,
`Step` flags `LineMustBreak` after "👧🏼", and the same for 🧑🏽, ☝🏿, ✊🏿… followed by any text. Only
BK, CR, LF and NL may force a break (LB4, LB5); LB30b just forbids the break between base and
modifier. Any text layout built on this (tview, bubbletea's wrapping) starts a new line after
each skin-toned emoji. Fix: `return lbAny, LineDontBreak` (or the state for the base class).
Not caught by the embedded LineBreakTest.txt cases, which end right after the EB EM pair.
'''

[[bug]]
id = "uniseg/5"
title = "The SB8 sentence look-ahead stops at U+FFFD, so a replacement character or invalid byte after a period forces a sentence break"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSentenceLookAheadReadsPastReplacementCharacters"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
sentencerules.go `transitionSentenceBreakState`, the SB8 block: the look-ahead loop that scans
past non-terminating characters for a Lower does `r, length = utf8.DecodeRune(b)` then `if r ==
utf8.RuneError { break }` — meant as an end-of-input check, but U+FFFD is also what a genuine
REPLACEMENT CHARACTER decodes to and what every byte that is not UTF-8 decodes to (with length
1). The loop then stops with `nextProperty` still the last class seen, SB8 does not apply, and
SB11 breaks: `FirstSentenceInString("a. �� b")` gives "a. " | "�� b";
`"a. \xff\xff b"` and `"a. (\xc0\x80 b"` likewise, while `"a. x b"` and `"a. \xff b"` (one
FFFD, which is the first look-ahead character and is classified before the loop) are one
sentence. Text with a lone U+FFFD from a lossy decode is common. Fix: `if length == 0 { break }`
(DecodeRune returns (RuneError, 0) for empty input and (RuneError, 1) for a bad byte).
The word look-ahead (wordrules.go, WB6/WB7b/WB12) has the same check; not observed to matter
there because the classes it looks for (AHLetter, Numeric) end the scan immediately.
'''

[[bug]]
id = "uniseg/6"
title = "After a sentence terminator a CR LF pair is split into two sentences, and with spaces in between the sentence ends before the CR"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSentenceTerminatorBeforeCRLF"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
SB3 (CR × LF) and SB9/SB10 (SATerm Close* Sp* × (Close | Sp | ParaSep)) say the sentence
"Hello!\r\n" ends after the LF. sentencerules.go's states after a terminator (sbSTerm/sbATerm,
sbSB8Close, sbSB8Sp) transition on CR straight to the paragraph-separator state, so:
`FirstSentenceInString("a!\r\nb")` → "a!\r" | "\n" | "b" (CR and LF split, a sentence consisting
of "\n"); `"a.\r\nb"` and `"a!)\r\nb"` the same; `"a! \r\nb"` → "a! " | "\r\n" | "b" (the break
lands before the CR, SB10 says none there); `"a!  b"` → "a! " | " " | "b". Without a
terminator `"a\r\nb"` is right ("a\r\n" | "b"), and the pair tests in SentenceBreakTest.txt end
after the CR, so they pass. Every Windows-line-ended text with sentence punctuation before a
line break is affected (two extra sentence boundaries per line). Fix: the terminator states
must go through the CR state (SB3) and treat CR/LF/Sep as ParaSep only after it.
'''

[[bug]]
id = "uniseg/7"
title = "A hyphen followed by a digit removes the line break opportunity before it, including the mandatory break after a newline"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMandatoryBreakSurvivesAHyphenAndDigit"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
linerules.go `transitionLineBreakState`, the "LB25 (look ahead)" block:

    if rule > 250 &&
        (state == lbPR || state == lbPO) &&
        nextProperty == prOP || nextProperty == prHY {

`&&` binds tighter than `||`, so this reads `(rule > 250 && (PR|PO) && OP) || HY`: whenever the
next character is a hyphen (HY, U+002D) and the one after it is a digit (NU), the function
returns `lbNU, LineDontBreak` whatever the state and whatever rule already decided. LB25 only
means `(PR | PO)? (OP | HY)? NU` is kept together; it never removes a break that LB4–LB18
decided. Observed: `Step`/`StepString` report `LineDontBreak` after "\n", "\r", "\r\n", U+2028
in "a\n-0", "a\r-1", "a\r\n-5", "a -9" (LB4/LB5 say a mandatory break), and after the
space in "a -0" (LB18 says a break opportunity); `FirstLineSegment[InString]` returns the whole
text as one segment in every case, so a wrapper never breaks before "-1" and, worse, ignores the
newline before a line starting with a negative number or a date ("-2024", "-5 °C"). "a\n-x" and
"a\n0" are right. The intended condition needs parentheses:
`rule > 250 && (state == lbPR || state == lbPO) && (nextProperty == prOP || nextProperty == prHY)`.
'''

[[bug]]
id = "uniseg/8"
title = "A ZWJ between two spaces joins them into one word, though WB3d does not apply through a ZWJ"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZWJBetweenSpacesDoesNotJoinThem"
found = { commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf", version = "v0.4.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
UAX #29 orders WB3d (WSegSpace × WSegSpace) before WB4 (X (Extend | Format | ZWJ)* → X), so a
space, an ignorable, a space has a word boundary before the second space: the UCD test file has
`÷ 0020 × 0308 ÷ 0020 ÷` and uniseg gets that right (`FirstWordInString(" ̈ ")` gives two
words). With a ZWJ instead of U+0308 (`" ‍ "`, `"a ‍ b"`) the two spaces come out as
one word: the WSegSpace state survives the ZWJ (kept for WB3c), and the following space then
matches WB3d. `Step`'s word flag and `FirstWord[InString]` agree with each other. The
WordBreakTest file has no WSegSpace ZWJ WSegSpace case, so the embedded tests do not see it.
Fix: after a ZWJ, a WSegSpace must not take the WB3d transition (treat the state as wbAny for
that purpose, as the Extend path does).
'''
