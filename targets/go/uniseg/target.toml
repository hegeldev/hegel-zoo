ai_policy_checked = "2026-09-15"

[base]
commit = "087b3e4194c1feb0856b68d0e7c425c0994829cf"
date = "2024-04-13"
version = "v0.4.7+"

[hegel]
version = "v0.9.6"

[run]
command = "go test -count=1 -run TestHegel -v ."
# The oracle reads the Unicode 15.0.0 property files (the version the package implements). They
# are fetched once into ~/.cache/hegel-zoo/ucd-15.0.0/ with their sha256 checked; the tests also
# honour HEGEL_UCD=/path/to/that/directory.
setup = ['''
d="${HEGEL_UCD:-$HOME/.cache/hegel-zoo/ucd-15.0.0}"; mkdir -p "$d"
fetch() { f="$1"; s="$2"; u="$3"; if [ ! -s "$d/$f" ]; then
  curl -fsSL -o "$d/$f.tmp" "https://www.unicode.org/Public/15.0.0/ucd/$u" &&
  echo "$s  $d/$f.tmp" | sha256sum -c - >/dev/null && mv "$d/$f.tmp" "$d/$f"; fi; }
fetch GraphemeBreakProperty.txt 5a0f8748575432f8ff95e1dd5bfaa27bda1a844809e17d6939ee912bba6568a1 auxiliary/GraphemeBreakProperty.txt
fetch WordBreakProperty.txt 5188a56e91593467c2e912601ebc78750e6adc9b04541b8c5becb5441e388ce2 auxiliary/WordBreakProperty.txt
fetch SentenceBreakProperty.txt 61e4ba975b0a5bc1a76ee931b94914395d7289ef624e3c0d4d6b9460ee387bea auxiliary/SentenceBreakProperty.txt
fetch EastAsianWidth.txt 743e7bc435c04ab1a8459710b1c3cad56eedced5b806b4659b6e69b85d0adf2a EastAsianWidth.txt
fetch emoji-data.txt 29071dba22c72c27783a73016afb8ffaeb025866740791f9c2d0b55cc45a3470 emoji/emoji-data.txt
ls "$d"/GraphemeBreakProperty.txt "$d"/WordBreakProperty.txt "$d"/SentenceBreakProperty.txt "$d"/EastAsianWidth.txt "$d"/emoji-data.txt >/dev/null
''']

