[[bug]]
id = "terminfo/1"
title = "Decode panics on an entry whose acsc string has an odd length"
kind = "crash"
severity = "medium"
test = "TestHegelPinOddAcsc"
found = { commit = "c203b35f1e27854a768ec0e95c1ca692d87da606", version = "v1.2.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
canonicalizeAscChars (dec.go) walks the acsc string two bytes at a time and reads z[i+1]
without checking that it exists, so an acsc of odd length (tic compiles `acsc=abc` without
complaint and infocmp prints it back) makes Decode, Open and Load panic with an index out of
range instead of returning the entry or an error. Found by TestHegelDecode; the property
recovers the panic and counts it while Known.oddAcscPanics is on.
'''

[[bug]]
id = "terminfo/2"
title = "Printf never treats a number as true: %t, %! and %A/%O on a parameter or an arithmetic result behave as if it were false, and a comparison prints as 0"
kind = "logic"
severity = "high"
test = "TestHegelPinIntsAreTrue"
found = { commit = "c203b35f1e27854a768ec0e95c1ca692d87da606", version = "v1.2.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
terminfo(5) makes every stack value a number: %? expr %t is taken when the popped value is
non-zero, %! is logical not, %A and %O are logical and/or, and %= %< %> push 1 or 0. The
parametizer keeps Go-typed values instead: popBool only accepts a Go bool, so an int
parameter (%p6 in xterm's `sgr=...%?%p6%t;1%;...`) or the result of %| or arithmetic is
always false, %! of any number pushes true, and popInt of a comparison's bool gives 0, so
`%p1%p2%=%d` prints 0 for equal values. With ncurses' tput as the oracle: Printf("%?%p1%tX%eY%;",
1) = "Y" (want "X"), Printf("%?%p6%t;1%;", 0,0,0,0,0,1) = "" (want ";1"),
Printf("%p1%p2%=%d", 3, 3) = "0" (want "1"), Printf("%p1%!%d", 0) = "0" (want "1"). Every
terminal's sgr, and any conditional on a parameter, evaluates wrongly through Printf with int
arguments (which is what Colorf and Goto pass). Found by TestHegelPrintf.
'''

[[bug]]
id = "terminfo/3"
title = "Printf treats %'c' constants and %c as a separate byte type: a %'c' constant is 0 in arithmetic and %c of a number writes a NUL byte"
kind = "logic"
severity = "high"
test = "TestHegelPinCharsAreInts"
found = { commit = "c203b35f1e27854a768ec0e95c1ca692d87da606", version = "v1.2.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
terminfo(5): %'c' pushes the character constant (a number) and %c prints pop() like %c in
printf. The parametizer pushes %'c' as a Go byte and %c pops only a Go byte: popInt of the
byte is 0, so `%p1%'A'%+%c` gives NUL instead of "B", and popByte of an int parameter is 0,
so Printf("%p1%c", 65) = "\x00" instead of "A". tic rewrites every %{n} with a printable n as
%'c', so compiled databases are full of these: the classic `cup=\E=%p1%' '%+%c%p2%' '%+%c`
(adm3a, and the many entries that address the cursor by adding a space) yields "\E=\x00\x00"
for every position. With ncurses' tput as the oracle, TestHegelPrintf found it on the first
run.
'''

[[bug]]
id = "terminfo/4"
title = "An entry without acsc decodes with an empty acsc present"
kind = "logic"
severity = "low"
test = "TestHegelPinNoAcscWhenAbsent"
found = { commit = "c203b35f1e27854a768ec0e95c1ca692d87da606", version = "v1.2.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readStrings canonicalizes Strings[AcsChars] whatever it holds; for an absent capability the
value is nil and canonicalizeAscChars returns an empty non-nil slice, so every entry whose
string table reaches the acsc slot (any entry with a later capability such as setaf) reports
acsc as present and empty: Strings[AcsChars] is "" instead of nil and StringCaps() lists
"acsc" while infocmp lists nothing. 485 of 2000 samples of the installed database
(/usr/share/terminfo) show it. Found by TestHegelDecode and TestHegelDatabase.
'''

[[bug]]
id = "terminfo/5"
title = "Printf misreads %: followed directly by the conversion character and swallows the following text as a format"
kind = "logic"
severity = "low"
test = "TestHegelPinColonConversion"
found = { commit = "c203b35f1e27854a768ec0e95c1ca692d87da606", version = "v1.2.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
terminfo(5) gives the format as %[[:]flags][width[.precision]][doxXs], every part but the
conversion optional, so %:d is a plain %d (ncurses prints 5 for Printf("%p1%:d", 5)). After
the colon scanFormatFn takes the next character as the start of the flags/width and keeps
reading until it meets a conversion character, so the conversion itself becomes part of the
format string and the text up to the next d/o/x/X/s/c is handed to fmt.Fprintf as a format:
Printf("%p1%:d|%p1%d", 5) = "5|%!p(MISSING)1%!d(MISSING)", Printf("%p1%:X", 5) = "".
Found by TestHegelPrintf.
'''

[[bug]]
id = "terminfo/6"
title = "The canonical acsc keeps the first mapping of a repeated key where ncurses keeps the last"
kind = "logic"
severity = "low"
test = "TestHegelPinAcscRepeatedKey"
found = { commit = "c203b35f1e27854a768ec0e95c1ca692d87da606", version = "v1.2.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
canonicalizeAscChars says it follows repair_ascc of ncurses (progs/dump_entry.c), which
infocmp applies to an acsc whose keys are not in strictly increasing order: it fills a table
mapped[key] = value over the string, so the last mapping of a repeated key wins, then writes
the table out sorted. The package skips a key it has already seen, so the first mapping wins:
for acsc=xa~egHg9oU (tic compiles it as written) infocmp prints acsc=g9oUxa~e and
Strings[AcsChars] is "gHoUxa~e". Found by TestHegelDecode, whose generator draws acsc
mappings with repeated keys.
'''
