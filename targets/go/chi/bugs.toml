[[bug]]
id = "chi/1"
title = "A regexp placeholder with a top-level alternation is anchored on its outer alternatives only, so {x:a|b} matches ab and cb"
kind = "logic"
severity = "medium"
test = "TestHegelPinRegexpAlternation"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
patNextSegment (tree.go) anchors the placeholder's regular expression by prepending "^" and
appending "$" to its source when they are absent at the ends, so `{x:a|b}` becomes `^a|b$`,
which is "starts with a" or "ends with b": /alt/{x:a|b} serves /alt/ab and /alt/cb with x = "ab"
and "cb", and the common /data.{format:json|xml} serves /data.jsonx with format = "jsonx". The
documentation says a placeholder "allows a regular expression match" of the value (chi.go,
"URL patterns"), and TestTreeRegexMatchWholeParam asserts the whole value is matched; wrapping
the source as `^(?:...)$` would do it. Found by TestHegelRoute, which draws a top-level
alternation among its regexp sources; the narrow TestHegelAlternationMatchesTheWholeValue is
its deterministic face.
'''

[[bug]]
id = "chi/2"
title = "A regexp placeholder followed by a suffix matches across a slash"
kind = "logic"
severity = "medium"
test = "TestHegelPinRegexpSlash"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
chi.go documents regexp placeholders with "except that / will never be matched". findRoute
(tree.go) takes a placeholder's value up to the first occurrence of its tail byte (the byte
after the closing brace) and, for a plain {name}, rejects a value holding a slash; for a
regexp placeholder that check is replaced by the regexp match alone, so with a tail other than
"/" the value may span segments: /cross/{x:.+}-y serves /cross/a/b-y with x = "a/b", and
/dot/{x:[^.]+}.json serves /dot/a/b.json with x = "a/b". Found by TestHegelRoute, which
inserts a slash into placeholder values; the narrow TestHegelRegexpValuesStopAtTheSlash is its
deterministic face.
'''

[[bug]]
id = "chi/3"
title = "An empty regexp placeholder value is tried only on the last regexp node of its group, without checking the regular expression"
kind = "logic"
severity = "medium"
test = "TestHegelPinEmptyRegexp"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In findRoute (tree.go) the loop over the regexp nodes of a level skips an empty value (p == 0);
an empty value is reached only by the code after the loop, which appends "" and descends into
whichever node the loop ended on, the last of the group, without matching its regexp. So with
/{x:.+}/foo registered before /{p:[0-9]*}/test, //test is served with p = "" and //foo is a
404 (TestMuxRegexp and TestTreeRegexMatchWholeParam assert exactly this); registered in the
other order, //foo is served with x = "" although `.+` does not accept the empty string, and
//test is a 404 although `[0-9]*` does. The result depends on the registration order and, for
the served case, contradicts the regexp. Found by TestHegelRoute, which draws empty values;
the narrow TestHegelEmptyValuesFollowTheRegexp is its deterministic face (two regexp routes at
one level with different sources, one accepting the empty string).
'''

[[bug]]
id = "chi/4"
title = "RouteHeaders picks the header to route on in Go map order, so a request carrying two routed headers is routed at random"
kind = "logic"
severity = "medium"
test = "TestHegelPinHeaderRouteOrder"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HeaderRouter (middleware/route_headers.go) is a map from header name to routes, and Handler
looks for the "first matching header route" with `for header, matchers := range hr`, whose
order Go randomizes. A router built as Route("Host", "example.com", A).Route("Origin", "*", B)
sends a request that carries both headers to A about nine times in ten and to B otherwise (the
Host map key is visited first more often for this map size); which handler answers is not a
function of the request. The routes within one header keep their order (a slice). Found by
TestHegelRouteHeaders; the model accepts either header's outcome while
Known.headerRouteMapOrder is on.
'''

[[bug]]
id = "chi/5"
title = "Only the last regexp node ending its segment is moved after the suffixed ones, so the precedence among regexp placeholders depends on the registration order"
kind = "logic"
severity = "low"
test = "TestHegelPinRegexpOrder"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
nodes.tailSort (tree.go) "pushes nodes with '/' as the tail to the end of the list", so that a
placeholder followed by a suffix (/{c}.json) is tried before one ending the segment (/{a});
it moves a single node, the last one with that tail, and stops. Plain {name} placeholders at
one level share a node per tail, so at most one such node exists and the rule holds; regexp
placeholders have a node per regular expression, and with two of them ending the segment the
first stays where it was: after Get("/{a:.+}"), Get("/{b:[a-z]+}"), Get("/{c:.+}.json") the
order is a, c, b and GET /abc.json is served by /{a:.+} with a = "abc.json", while registering
c first serves it by /{c:.+}.json with c = "abc". Found by TestHegelRoute (rarely: three
sibling regexps are needed, about one case in 3000); the narrow TestHegelSuffixedRegexpsComeFirst
is its deterministic face (the suffixed regexp must reject the empty value, or chi/3 answers
first).
'''

[[bug]]
id = "chi/6"
title = "A request with an unknown method is answered 405 without an Allow header, whatever its path"
kind = "logic"
severity = "low"
test = "TestHegelPinUnknownMethod"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
routeHTTP (mux.go) looks the request method up in methodMap before routing and, when it is
not there, calls MethodNotAllowedHandler() with no allowed methods: a 405 with no Allow header
for every path, including paths that have no route (a 404 for any known method). RFC 9110
15.5.6 requires Allow in a 405 ("MUST generate an Allow header field"), and 9.1 says an
unrecognized method "SHOULD respond with the 501 (Not Implemented) status code". Found while
writing TestHegelRoute, which sends the method BREW in a few percent of its requests and
expects 501; the narrow TestHegelUnknownMethodsAreNotImplemented is its deterministic face.
'''

[[bug]]
id = "chi/7"
title = "URL parameter values are percent-decoded only when the request path has no non-canonical escape"
kind = "logic"
severity = "low"
test = "TestHegelPinParamDecoding"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
routeHTTP (mux.go) routes r.URL.RawPath when it is set and r.URL.Path otherwise, and the
parameter values are slices of the routed string. net/url sets RawPath only when the request's
escaping differs from the canonical one, so /u/a%20b is routed decoded (id = "a b") while
/u/%41 is routed raw (id = "%41", although /u/A gives "A") and /u/a%2Fb gives "a%2Fb": whether
a handler receives the decoded segment depends on how the client spelled the escapes.
TestEscapedURLParams asserts the raw form for %2f. Routing on the raw path keeps an escaped
slash from splitting a segment, but the value handed to the handler could be unescaped
afterwards. Found by TestHegelRoute, which writes a percent escape into a value in a few
percent of its paths (a canonical escape such as %20 is routed decoded both ways and is not
the shape; %41 and %2F are); the narrow TestHegelParamsAreDecoded is its deterministic face.
StripSlashes sets the route path from the decoded r.URL.Path whenever that ends in a slash,
so such a request is routed decoded whatever its escapes: with /x/{v}, GET /x/a%2F is stripped
to /x/a and v = "a", and GET /x/%41/ gives v = "A" (checked standalone 2026-10-10).
'''

[[bug]]
id = "chi/8"
title = "RoutePattern and r.Pattern drop the trailing slash of a route registered with one"
kind = "logic"
severity = "low"
test = "TestHegelPinPatternTrailingSlash"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Context.RoutePattern (context.go) joins the pattern stack, replaces "/*/" by "/" to splice
mounted routers and then trims a trailing "//" and "/" (unless the result is "/"), which is
meant for a mount's "P/*" + "/" join but applies to every pattern: a route registered as
Get("/a/", h) reports RoutePattern() == "/a" and r.Pattern == "/a" (routeHTTP sets r.Pattern
from RoutePattern), the pattern of the distinct route "/a". Find returns "/a/" for the same
request (TestMuxFind asserts "/api/groups/v2/"). The trim applies to mounted routes too: with
Mount("/m", sub) and sub.Get("/a/", h), GET /m/a/ reports "/m/a" (the stack ["/m/*", "/a/"]),
while Find gives "/m/a/"; sub.Get("/", h) on GET /m/ reports "/m" (the stack ["/m/", "/"]).
Found by TestHegelRoute, which draws routes with a trailing slash and reports the shape
(the pattern as registered, a mount's splice with its trailing slash kept); the narrow
TestHegelPatternsKeepTheirTrailingSlash is its deterministic face.
'''

[[bug]]
id = "chi/9"
title = "Match and Find report the bare path of a mount as matched for every method, and GetHead then does not fall back to GET there"
kind = "logic"
severity = "low"
test = "TestHegelPinMountMatch"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Mount (mux.go) registers the mount handler for every method on "P" and "P/" besides "P/*",
and only the "P/*" node carries the sub-router (n.subroutes). Find (mux.go) descends into the
sub-router only when node.subroutes is set, so for the bare paths P and P/ it returns the
stub's pattern for any method: with a sub-router that has only Post("/"), Match(GET, "/m") is
true and Find(GET, "/m") is "/m", while GET /m is served a 405. middleware.GetHead uses
Match(HEAD, path) to decide whether to route a HEAD request as GET, so HEAD /m with a
sub-router that has Get("/") gets a 405 instead of the GET handler, unlike HEAD /m/x. Found by
TestHegelRoute (the Find check), which draws requests for the bare mount path; the narrow
TestHegelBareMountPathsMatchOnlyServedMethods is its deterministic face (a sub-router with no
"/" route for the method, and GetHead with a GET "/" alone).
'''

[[bug]]
id = "chi/10"
title = "AllowContentEncoding reads a comma-separated Content-Encoding as one coding and rejects it"
kind = "logic"
severity = "low"
test = "TestHegelPinContentEncodingList"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Content-Encoding is a list, `1#content-coding` (RFC 9110 8.4), and a client may send several
codings in one field ("gzip, br") as well as in several fields. AllowContentEncoding
(middleware/content_encoding.go) iterates r.Header["Content-Encoding"], one element per field,
and looks each whole element up in the allowed set, so "gzip, br" is not allowed even when gzip
and br both are (415), while two separate Content-Encoding fields pass. Found by
TestHegelContentChecks; the generator writes one coding per field while
Known.encodingListUnsplit is on.
'''

[[bug]]
id = "chi/11"
title = "ContentCharset finds the charset by substring, so a quoted charset value is rejected"
kind = "logic"
severity = "low"
test = "TestHegelPinCharsetQuoted"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
contentEncoding (middleware/content_charset.go) lowercases the Content-Type, cuts it at the
first ";", then at "charset=", then at the next ";", and compares the piece with the allowed
charsets. A parameter value may be a quoted-string (RFC 9110 5.6.6, 8.3.1), so
`text/plain; charset="utf-8"` is a valid spelling of charset utf-8, but the piece compared is
`"utf-8"` with its quotes and the request gets a 415 with ContentCharset("utf-8"); a quoted
value of another parameter that contains "charset=" (boundary="charset=a"; charset=utf-8, valid
syntax, charset utf-8 to mime.ParseMediaType) also misleads the cut, to `a"` and a 415 (checked
standalone 2026-10-10; unquoted, boundary=charset=a is not a valid parameter and
mime.ParseMediaType rejects it). Optional whitespace around the ";" is handled (split trims).
mime.ParseMediaType gives the parameter. Found by TestHegelContentChecks, which draws quoted
charsets and the misleading parameter; the narrow TestHegelQuotedCharsetsAreRead is its
deterministic face.
'''

[[bug]]
id = "chi/12"
title = "Compress matches Accept-Encoding by substring: a coding with q=0 is still used and * is not honoured"
kind = "logic"
severity = "low"
test = "TestHegelPinAcceptEncodingWeights"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
selectEncoder (middleware/compress.go) splits Accept-Encoding at commas and takes an encoder
whose name is a substring of an element (matchAcceptEncoding), so "gzip;q=0", which RFC 9110
12.5.3 defines as "gzip is not acceptable", selects gzip, "deflate, gzip;q=0" selects gzip over
the acceptable deflate, and "*" (any coding not listed) selects nothing. Found by
TestHegelCompress; the model matches by substring while Known.acceptEncodingSubstring is on.
'''

[[bug]]
id = "chi/13"
title = "Compress compares the response media type case-sensitively and without trimming, so Text/HTML and text/html ; charset=utf-8 are not compressed"
kind = "logic"
severity = "low"
test = "TestHegelPinContentTypeCase"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isCompressible (middleware/compress.go) cuts the response Content-Type at the first ";" and
looks the prefix up in the allowed set as is. Media type names are case-insensitive and OWS
may precede the ";" (RFC 9110 8.3.1), so a handler setting "Text/HTML" or
"text/html ; charset=utf-8" produces an uncompressed response with Compress(5) although
"text/html" is in the default list. Found by TestHegelCompress; the model compares as chi does
while Known.contentTypeExact is on.
'''

[[bug]]
id = "chi/14"
title = "RouteHeaders lowercases the request header value but not the route's pattern, so a pattern with a capital never matches"
kind = "logic"
severity = "low"
test = "TestHegelPinHeaderPatternCase"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HeaderRouter.Handler (middleware/route_headers.go) lowercases the header value before
matching (so Host values match regardless of case) while Route and NewPattern keep the pattern
as given: Route("Host", "Example.com", h) matches neither "example.com" nor "Example.com".
Found while writing TestHegelRouteHeaders; the generator writes lower-case patterns while
Known.headerPatternCase is on.
'''

[[bug]]
id = "chi/15"
title = "Sunset sets the Deprecation header as an HTTP-date, while RFC 9745 defines it as a Date structured field"
kind = "logic"
severity = "low"
test = "TestHegelPinDeprecationHeader"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
middleware.Sunset (middleware/sunset.go) sets both Sunset and Deprecation to
sunsetAt.Format(http.TimeFormat). Sunset is an HTTP-date (RFC 8594, which the middleware
cites), but the Deprecation header field is defined by RFC 9745 (March 2025) as a Structured
Field Date, "@" followed by the Unix seconds ("Deprecation: @1688169599"); the IMF-fixdate
form was that of early drafts. Clients parsing the header per the RFC reject chi's value.
Found while reading the middleware; the pin asserts the RFC form.
'''

[[bug]]
id = "chi/16"
title = "RealIP does not trim the first X-Forwarded-For entry, so a space before the comma disables it"
kind = "logic"
severity = "low"
test = "TestHegelPinRealIPTrim"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
realIP (middleware/realip.go) takes the first X-Forwarded-For entry with strings.Cut(xff, ",")
and passes it to net.ParseIP without trimming: "1.2.3.4 , 5.6.7.8" (a space before the comma,
which the list syntax allows: OWS around the delimiter) or " 1.2.3.4" does not parse and
RemoteAddr is left as it was, while "1.2.3.4, 5.6.7.8" works. The middleware is deprecated in
favour of the ClientIPFrom* family, which trims (walkXFF), but it is still shipped. Found by
TestHegelClientIP; the model skips the trim while Known.realIPUntrimmed is on.
'''

[[bug]]
id = "chi/17"
title = "Sunset formats a time in a zone other than UTC with http.TimeFormat, writing its local wall clock labelled GMT"
kind = "logic"
severity = "low"
test = "TestHegelPinSunsetUTC"
found = { commit = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc", version = "untagged (13 commits after v5.3.2, 2026-09-18)", hegel = "v0.6.33", date = "2026-10-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
middleware.Sunset (middleware/sunset.go) sets Sunset and Deprecation to
sunsetAt.Format(http.TimeFormat). http.TimeFormat is a layout ending in the literal "GMT", and
its documentation says to format a time as an HTTP-date with t.UTC().Format(http.TimeFormat):
Format on a time in another zone writes that zone's wall clock under the GMT label. For the
instant 2030-01-01T00:04:05Z given as a time in +05:30 the headers say
"Tue, 01 Jan 2030 05:34:05 GMT", five and a half hours late, and in -05:00
"Mon, 31 Dec 2029 19:04:05 GMT", a day early; a client reading the HTTP-date gets the wrong
instant. Found by the narrow property TestHegelSunsetAnnouncesTheDateInBothForms drawing times
in fixed zones (checked standalone 2026-10-10); TestHegelSunsetDatesAreInGMT is its
deterministic face.
'''
