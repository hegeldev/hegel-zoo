# Bugs found in github.com/tailscale/hujson by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure
# in target.toml.

[[bug]]
id = "hujson/1"
title = "Patch \"add\" with an array index greater than the length appends instead of failing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAddBeyondArrayEndFails"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
On [10,20], the patch [{"op":"add","path":"/3","value":30}] succeeds and yields [10,20,30];
so do "/100" and "/18446744073709551615". RFC 6902 §4.1: "The specified index MUST NOT be
greater than the number of elements in the array" — the patch must fail. In find.go the
array case sets s.idx = comp.length() before looking at the index and only overrides it when
the index is in range, so any out-of-range index comes back as errNotFound with the pointer
fully consumed, which patchAdd treats exactly like "-" (append). Found by the Patch property
comparing against an RFC 6902 model (the generator drew an index a few past the end).
"""

[[bug]]
id = "hujson/2"
title = "Find and Patch accept an array index with leading zeros (\"/01\")"
kind = "contract"
severity = "low"
test = "TestHegelPinLeadingZeroIndexIsInvalid"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Value.Find("/01") on [10,20] returns 20, and a patch with path "/01" adds, removes or replaces
element 1. RFC 6901 §4 gives array-index = %x30 / ( %x31-39 *(%x30-39) ): leading zeros are
not allowed, so "/01" refers to nothing (Find must return nil, Patch must fail). find.go
parses the segment with strconv.ParseUint and rejects only the zero spellings ("00", "000":
`i == 0 && name != "0"`); a non-zero index with leading zeros slips through. Seen while
writing the Find property against the RFC grammar (the mutation "0" + index).
"""

[[bug]]
id = "hujson/3"
title = "Patch refuses \"move\" onto the same location and \"copy\" from the root"
kind = "contract"
severity = "low"
test = "TestHegelPinMoveToSelfAndCopyFromRootAreAllowed"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
[{"op":"move","from":"/a","path":"/a"}] fails with `cannot move "/a" into "/a"`, and
[{"op":"copy","from":"","path":"/b"}] with `cannot copy "" into "/b"`. RFC 6902 §4.4 forbids
"from" being a *proper* prefix of "path" ("a location cannot be moved into one of its
children"); a location moved onto itself is allowed (remove then add at the same place), and
§4.5 puts no such restriction on copy at all, so copying the whole document into one of its
members is a valid operation. patch.go's patchMoveOrCopy rejects `op.from == ""` for both
operations and uses hasPathPrefix, which is true for equal strings, for move. Found by the
Patch property's RFC 6902 model when the generator drew the same pointer for both ends and the
root as a copy source.
"""

[[bug]]
id = "hujson/4"
title = "Patch refuses \"replace\" at the root"
kind = "contract"
severity = "low"
test = "TestHegelPinReplaceAtRootIsAllowed"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
[{"op":"replace","path":"","value":7}] fails with `cannot replace root value`, while
[{"op":"add","path":"","value":7}] replaces the whole document as RFC 6902 §4.1 says it should.
§4.3 requires only that the target location exist; the empty pointer denotes the whole
document (RFC 6901 §5), which always exists, and replace "is functionally identical to a
remove followed by an add at the same location" — the add works. patchRemoveOrReplace returns
an error whenever the found value has no parent, for both remove and replace. (Removing the
root is not asserted by the pin: the RFC leaves what remains undefined.) Found by the Patch
property when its generator drew the root as a replace target.
"""

[[bug]]
id = "hujson/5"
title = "Literal.IsValid accepts objects and arrays"
kind = "contract"
severity = "low"
test = "TestHegelPinLiteralIsValidRejectsComposites"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Literal("[1]").IsValid(), Literal("{}").IsValid() and Literal(`{"a":1}`).IsValid() are true.
The documentation: "IsValid reports whether b is a valid JSON null, boolean, string, or
number." The implementation is json.Valid(b) plus a no-surrounding-whitespace check, and
json.Valid accepts any JSON value. Kind() of the same literals is 0 (invalid), so a Literal
can be valid by IsValid and of no kind at once. Harmless inside the parser (it only calls
IsValid on text it scanned as a literal) but wrong for a caller validating a Literal it
built. Found by the Literal property comparing IsValid with the documented grammar.
"""

[[bug]]
id = "hujson/6"
title = "Standardize and Format overwrite the caller's input buffer"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStandardizeAndFormatLeaveTheInputAlone"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
in := []byte("/*c*/ [1, /*d*/ 2,]\n"); out, _ := hujson.Standardize(in) returns
"      [1,       2 ]\n" and leaves in as "      [1,       2,]\n": the comments were blanked in
place but the trailing comma is still there, so the caller's buffer is neither the original
nor the standardized text. Format does the same: on "// hello\n{\"a\": 1, // x\n \"b\": 2}\n"
the input afterwards reads "// hello\n{\"a\": 1, // x\n\t\"b\": 2}\n" (a tab written into it).
Parse documents that Extra and Literal values alias the input, and the *methods* Standardize
and Format document that they mutate the Value in place; but the *functions* Standardize,
Minimize and Format take a []byte and return a new one, say nothing about the input, and
promise "b is returned as is along with the error" on failure — the shape of a
non-destructive transformation, and the documented usage `b, err := hujson.Standardize(b)`
hides the damage. Extra.standardize writes `(*b)[i] = ' '` and Extra.format
`*b = append((*b)[:0], out...)` into the aliased slices. Minimize only drops slices and is
clean. Found when the Format property's documents changed between two checks that shared a
buffer.
"""

[[bug]]
id = "hujson/7"
title = "Clone drops a trailing comma that directly follows the last value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCloneKeepsTrailingCommas"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Parse("[1,]").Clone().Pack() is "[1]" (also {"a":1,} → {"a":1}, [[1,],] → [[1]], [1, ] → [1 ]),
while Parse("[1 ,]").Clone().Pack() keeps its comma. A trailing comma is represented by a non-nil
Value.AfterExtra on the last member or element ("A trailing comma is emitted only if the
Value.AfterExtra on the last value is non-nil"), which the parser sets to an empty non-nil
slice when nothing separates the value from the comma. copyBytes copies with
`append([]byte(nil), b...)`, which yields nil for an empty slice, so the clone forgets the
comma. Clone is documented as a deep copy and is the recommended way to keep the original
before Format/Patch; Patch's copyAt also goes through clone, so a copied value loses the
trailing commas inside it. Found by the Clone property (Pack of the clone versus the input).
"""

[[bug]]
id = "hujson/8"
title = "A Patch \"test\" against a JSON null never succeeds"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTestAgainstNullSucceeds"
found = { commit = "b80ff77dac4f3b606c8bf0a28a84b33e68d07f60", version = "master (untagged), 2026-07-27", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
On {"a":null}, [{"op":"test","path":"/a","value":null}] fails with `values differ at "/a"`;
so does testing a null document against null. [{"op":"test","path":"/b","value":[null]}] on
{"b":[null]} passes, so it is only a top-level null. RFC 6902 §4.6: test succeeds when the
target's value "is equal to the value" — null equals null. patch.go's equalValue decodes both
sides with json.Unmarshal into an interface{}, where a JSON null becomes a nil interface, and
then requires `vx != nil && vy != nil` (meant to catch decode failures, which also yield nil).
Every test of a null therefore reports a mismatch, and a patch that guards an assignment with
such a test never applies. Found by the Patch property when a generated "add" made the
document null and a following "test" checked it.
"""
