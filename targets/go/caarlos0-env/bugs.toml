[[bug]]
id = "caarlos0-env/1"
title = "int and uint fields are parsed with a 32-bit range on every platform"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIntIsPlatformSized"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    type cfg struct { I int `env:"I"`; U uint `env:"U"` }
    ParseWithOptions(&c, Options{Environment: {"I": "2147483648", "U": "4294967296"}})
    -> parse error on field "I" of type "int": strconv.ParseInt: parsing "2147483648": value out of range
       parse error on field "U" of type "uint": strconv.ParseUint: parsing "4294967296": value out of range

defaultBuiltInParsers parses reflect.Int with strconv.ParseInt(v, 10, 32) and reflect.Uint with
ParseUint(v, 10, 32); on 64-bit platforms int and uint hold 64 bits, and the README lists
"int" and "uint" among the supported types without a limit. []int, map values and *int fields
inherit the limit. int64/uint64 are parsed with 64 bits.

Found by the parse property (the model uses strconv.IntSize).
'''

[[bug]]
id = "caarlos0-env/2"
title = "UseFieldNameByDefault does not separate a final uppercase letter: PortB becomes PORTB while PortBx becomes PORT_BX"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinFieldNameConversionIsConsistent"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    toEnvName("PortB")  = "PORTB"
    toEnvName("PortBx") = "PORT_BX"
    toEnvName("fooB")   = "FOOB"      (but "userID" = "USER_ID")

toEnvName inserts an underscore before an uppercase letter only when a following character
exists (`if len(input) > i+1`), and only then looks at whether the previous or next character
is lowercase; a trailing uppercase letter after a lowercase one therefore never gets its
separator, unlike the same letter followed by anything.

Found while writing the model's conversion; pin only.
'''

[[bug]]
id = "caarlos0-env/3"
title = "SetDefaultsForZeroValuesOnly also ignores values from the environment for non-zero fields, not only envDefault"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinZeroValuesOnlyAppliesToDefaults"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    c := cfg{Port: 8080, Name: "pre"}        // Port `env:"PORT" envDefault:"1"`, Name `env:"NAME"`
    ParseWithOptions(&c, Options{SetDefaultsForZeroValuesOnly: true, Environment: {"PORT": "9090", "NAME": "fromenv"}})
    -> {Port:8080 Name:pre}

The option's documentation: "If the env variable for the value is not set and envDefault is set
and the value is not a zero value for the type and SetDefaultsForZeroValuesOnly=true, the value
from envDefault will be ignored. Useful for mixing default values from envDefault and struct
initialization." setField applies the test to every value: `value != "" &&
(!opts.SetDefaultsForZeroValuesOnly || refField.IsZero())`, so a variable that is set in the
environment is ignored too whenever the field was initialized, and its parse errors are never
reported (the value is not parsed at all).

Found by the parse property (fields initialized before parsing).
'''

[[bug]]
id = "caarlos0-env/4"
title = "Struct types handled by a parser (url.URL, TextUnmarshalers, FuncMap types) are recursed into afterwards: with UseFieldNameByDefault their fields are overwritten from PATH, HOST, SCHEME..., with RequiredIfNoDef they are required"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinParserTypesAreNotRecursed"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    type cfg struct { URL url.URL `env:"URL"` }
    ParseWithOptions(&c, Options{UseFieldNameByDefault: true,
        Environment: {"URL": "http://example.com/a/b", "PATH": "/usr/bin", "HOST": "evil"}})
    -> c.URL.String() == "http://evil/usr/bin"

    ParseWithOptions(&c, Options{UseFieldNameByDefault: true, RequiredIfNoDef: true, Environment: {"URL": "http://example.com/a"}})
    -> required environment variable "SCHEME" is not set; "OPAQUE"; "USER"; "HOST"; "PATH"; "FRAGMENT";
       "RAW_QUERY"; "RAW_PATH"; "RAW_FRAGMENT"; "FORCE_QUERY"; "OMIT_HOST"

doParseField sets the field through its parser (FuncMap has url.URL; the same happens for a
TextUnmarshaler struct or a custom FuncMap struct) and then, because `refField.Kind() ==
reflect.Struct`, calls doParse on it, treating url.URL's exported fields (Scheme, Opaque, User,
Host, Path, RawPath, OmitHost, ForceQuery, RawQuery, Fragment, RawFragment) as configuration.
Without UseFieldNameByDefault they have no key and nothing happens; with it, PATH is set in
every real environment, so every url.URL field parsed with that option has its Path replaced
by the shell's search path, and HOST/SCHEME/USER are common variable names too. With
RequiredIfNoDef as well, no url.URL field can be parsed at all.

Found by the parse property (url.URL field, UseFieldNameByDefault, extra PATH/HOST/SCHEME
variables in the generated environment).
'''

[[bug]]
id = "caarlos0-env/5"
title = "Nested struct, pointer-to-struct and slice-of-struct fields are also processed as values: under UseFieldNameByDefault their name is a key, required by RequiredIfNoDef and no parser when the variable exists"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNestedStructIsNotAValue"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    type cfg struct { Named inner `envPrefix:"NM_"`; Items []inner `envPrefix:"IT_"` }
    ParseWithOptions(&c, Options{UseFieldNameByDefault: true, RequiredIfNoDef: true, Environment: {"NM_V": "1", "IT_0_V": "2"}})
    -> required environment variable "NAMED" is not set; required environment variable "ITEMS" is not set
       (and Named.V, Items are not parsed: the error returns before the recursion)

    ParseWithOptions(&c, Options{UseFieldNameByDefault: true, Environment: {"NM_V": "1", "NAMED": "x"}})
    -> no parser found for field "Named" of type "inner"   (Named.V stays 0)

A named struct field (or *struct, []struct) goes through parseFieldParams and setField before
doParseField recurses into it. Without a key that is harmless; UseFieldNameByDefault gives it
one, so RequiredIfNoDef demands a variable named after the struct, any variable of that name
is fed to a parser that does not exist, and in both cases the error returns before the struct's
own fields are parsed. The two options cannot be combined with nested structs, and the
documentation of neither says so.

Found by the parse property.
'''

[[bug]]
id = "caarlos0-env/6"
title = "unset unsets the process variable even when the value came from Options.Environment"
kind = "contract"
severity = "low"
test = "TestHegelPinUnsetActsOnTheGivenEnvironment"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    os.Setenv("K", "process")
    type cfg struct { K string `env:"K,unset"` }
    ParseWithOptions(&c, Options{Environment: {"K": "given"}})
    -> c.K == "given"; os.LookupEnv("K") finds nothing; the map still has "K"

Options.Environment is "keys and values to be used instead of os.Environ()" and `unset` "unset
the environment variable after use"; get() runs `defer os.Unsetenv(fieldParams.Key)` regardless
of where the value came from, so the process loses a variable the parse never read while the
variable it did read stays.

Pin only (the properties never touch the process environment).
'''

[[bug]]
id = "caarlos0-env/7"
title = "OnSet is called for every keyed field, also when nothing is set"
kind = "contract"
severity = "low"
test = "TestHegelPinOnSetOnlyWhenSet"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    type cfg struct { A string `env:"A"`; B string `env:"B"`; C string `env:"C"` }
    ParseWithOptions(&c, Options{Environment: {"B": "", "C": "v"}, OnSet: record})
    -> OnSet("A", "", false), OnSet("B", "", false), OnSet("C", "v", false)

"OnSet is a hook that can be run when a value is set" / "OnSet allows to run a function when a
value is set"; get() calls it for every field with a key before setField decides that an empty
value sets nothing, so the hook fires for absent and empty variables with value "" and cannot
tell them from a variable set to "" that was ignored.

Found by the parse property (OnSet calls against the fields the model sets).
'''

[[bug]]
id = "caarlos0-env/8"
title = "A pre-initialized *[]struct loses its items where []struct keeps them"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinPointerSliceKeepsItems"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    c := cfg{Items: []item{{5}, {6}}, Ptr: &[]item{{7}, {8}}}      // envPrefix IT_ and PT_
    ParseWithOptions(&c, Options{Environment: {"IT_0_N": "1", "PT_0_N": "9"}})
    -> Items = [{1} {6}]      (item 1 kept)
       *Ptr  = [{9}]          (item 1 gone)

doParseSlice sizes the result by max(indices found, ref.Len()) and copies the existing items
for a slice, but for a pointer to a slice sets `initialized = 0` ("Due to the rest of code the
pre-initialized slice has no chance for this situation"), so the items behind the pointer are
dropped whenever any variable under the prefix exists.

Found by the parse property (pre-initialized *[]Inner).
'''

[[bug]]
id = "caarlos0-env/9"
title = "A nil pointer field is allocated before its value is parsed, so a parse error leaves a pointer to the zero value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFailedParseLeavesPointerNil"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    type cfg struct { P *int `env:"P"` }
    ParseWithOptions(&c, Options{Environment: {"P": "abc"}})
    -> error "parse error on field P of type *int", and c.P == &0

set() first calls asTextUnmarshaler, which allocates any nil pointer field (`field.Set(
reflect.New(...))`) before checking whether the type implements TextUnmarshaler; when the
built-in parser then fails, the allocation stays. A nil pointer is how callers tell "not
configured" from "configured to zero", and after a rejected value the field says the latter.
The same allocation happens for a *struct field given a variable of its own name ("no parser"
error, pointer allocated).

Found by the parse property (nil *int with an invalid value).
'''

[[bug]]
id = "caarlos0-env/10"
title = "A variable whose expansion refers to itself, directly or through another variable, overflows the stack: a fatal error that ends the process"
kind = "crash"
severity = "high"
test = "TestHegelPinExpandCycleIsAnError"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    type cfg struct { A string `env:"A,expand"` }
    ParseWithOptions(&c, Options{Environment: {"A": "x${B}", "B": "y${B}"}})
    -> runtime: goroutine stack exceeds 1000000000-byte limit
       fatal error: stack overflow

Options.getRawEnv resolves a name and calls os.Expand on the result with itself as the mapping,
with no depth limit or visited set, so any cycle among the referenced values recurses until the
stack limit. A fatal error cannot be recovered: the process dies rather than Parse returning an
error. The cycle need not be in the field's own value: an `expand` field referring to a plain
variable whose value happens to contain "${ITSELF}" (as PATH-like variables written by a shell
snippet may) is enough.

Found when the generator produced STR="${STR}" for an expand field referring to STR: the test
binary died. The pin runs the parse in a child process.
'''

[[bug]]
id = "caarlos0-env/11"
title = "A parse error in one item of a slice of structs discards every item and the errors of the following items"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinSliceItemsAreIndependent"
found = { commit = "fb6403538040f91bb1d4e3fac6c55905ebd10b2d", version = "v11.4.1-8-gfb64035", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    type cfg struct { Items []item `envPrefix:"IT_"` }        // item{ N int `env:"N"` }
    ParseWithOptions(&c, Options{Environment: {"IT_0_N": "1", "IT_1_N": "abc", "IT_2_N": "x"}})
    -> one error (item 1), c.Items == nil

Everywhere else the package aggregates: doParse collects every field's error into an
AggregateError and the fields that parsed are set. doParseSlice returns at the first item whose
doParse fails (`return err`) before `ref.Set(result)`, so the items that parsed - including
pre-initialized ones re-parsed with their defaults - are lost with the slice, and the caller
learns about one bad item at a time.

Found by the parse property (invalid values in slice items).
'''
