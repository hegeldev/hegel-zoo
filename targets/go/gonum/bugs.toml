notes = '''
Mean is sqrt 2 exp(lgamma((K+1)/2) - lgamma(K/2)), a difference of two lgammas that loses
digits from K = 1e6 (1e-8 off at K = 1e8, 2e-4 at K = 1e12) and everything at K = 1e16:
