[[bug]]
id = "gonum/17"
title = "distuv.NoncentralT.Quantile returns NaN or its bracket bound instead of the quantile"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinNctQuantile"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Quantile brackets the root of CDF(x) - p by doubling from +-1 up to 2^24 and runs Brent inside
the bracket. When the bracket never closes it returns NaN: NoncentralT{Nu: 0.543, Mu:
-53}.Quantile(0.7654) = NaN (want -48.3695, the root of the exact CDF; the CDF itself is wrong
for |Mu| above 38, gonum/18, so the search sees no sign change). When the quantile lies
beyond 2^24 it returns the bound itself: NoncentralT{Nu: 0.018, Mu: -2.5e-9}.Quantile(0.01) =
-16777216 where the quantile is -1.648e93 (the heavy tail of Nu = 0.018). A quantile function
should widen its bracket (or return +-Inf) rather than a made-up number.
'''

[[bug]]
id = "gonum/18"
title = "distuv.NoncentralT is wrong for |Mu| above about 38"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinNctLargeMu"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The CDF is the series of Lenth (AS 243), whose author states it is valid for |delta| <= 37.62;
the code applies it to any Mu and the normal term exp(-Mu^2/2) underflows: NoncentralT{Nu:
171, Mu: 236}.CDF(-2) = 1 (want 0), NoncentralT{Nu: 171, Mu: 40}.CDF(-2) = 1 while Mu = 38
gives 0, NoncentralT{Nu: 171, Mu: 40}.CDF(40) = 0.4902105384640944 (want 0.4875192635114088,
the quadrature of the definition checked two ways), NoncentralT{Nu: 9, Mu: 256}.LogProb(127) =
-13.006 (want -11.807). Prob and LogProb are differences of CDFs and Quantile inverts the CDF,
so all four are wrong. R's pt() falls back to a normal approximation beyond 37.62; a quadrature
of the definition is exact.
'''

