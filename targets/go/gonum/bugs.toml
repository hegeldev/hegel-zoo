[[bug]]
id = "gonum/3"
title = "mathext.Lbeta and Beta lose their value when one argument is large"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinLbetaLarge"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Lbeta is lgamma(a) + lgamma(b) - lgamma(a+b), which cancels once a + b and a round to the same
lgamma: Lbeta(1e20, 8.75) = 0 (want -392.879), Lbeta(3.29e49, 8.75) = 0 (want -987.6),
Beta(450000, 4.39e40) = 1 (want 0). The loss is gradual: Lbeta(1e10, 8.75) = -191.403045654 is
already 6.5e-9 off (want -191.403044401). The Stirling difference lgamma(a) - lgamma(a+b) =
-b log a - b(b-1)/(2a) + ... is what a large a needs.
'''

[[bug]]
id = "gonum/4"
title = "mathext.GammaIncRegInv returns 0 or a wrong value where the answer is tiny but representable"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinGammaIncInvUnderflow"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a shape below 1 the inverse of the regularised lower incomplete gamma is tiny for a small y
(P(a, x) ~ x^a / Gamma(a+1)): GammaIncRegInv(0.016, 0.0867) = 0 (want 2.405e-67),
GammaIncRegInv(0.126, 0.0007) = 0 (want 5.7e-26), GammaIncRegInv(0.444, 1e-7) =
4.292786675684392e-16 (want 1.3048226184847452e-16, 3.3 times too large). The distributions
inherit it: ChiSquared{K: 1}.Quantile(1e-11) = 0 (want 1.57e-22), Gamma{Alpha: 0.444, Beta:
190}.Quantile(1e-7) is 3.3 times too large, StudentsT{Mu: 1024, Sigma: 1, Nu: 0.013}.Quantile(
0.001) = -Inf (want -7.6e152). The leading term x = (y Gamma(a+1))^(1/a), evaluated in logs,
is exact to 1e-16 relative whenever x is below 1e-18.
'''

[[bug]]
id = "gonum/5"
title = "mathext.GammaIncRegCompInv loses digits as y approaches 1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGammaIncCompInvNearOne"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The inverse of Q(a, x) for a y near 1 is a small x, and the iteration converges on 1 - y's
rounding: GammaIncRegCompInv(1, 0.9999999) = 1.0000000520820078e-07 where Q(1, x) = e^-x gives
-log(0.9999999) = 1.0000000494736474e-07 (2.6e-9 off); GammaIncRegCompInv(0.754, 1 - 1e-12) is
6e-4 off; GammaIncRegCompInv(300, 1 - 1e-15) = 182.3568 (want 182.3734). GammaIncRegInv(a, 1-y)
is the accurate route for y > 0.5, the mirror of what GammaIncRegInv itself does.
'''

