[[bug]]
id = "gonum/8"
title = "mathext.EllipticF and EllipticE are wrong for an amplitude beyond pi/2"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinEllipticAmplitude"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Both evaluate sin(phi) R_F(cos^2 phi, 1 - m sin^2 phi, 1), Carlson's form, which equals the
Legendre integral for |phi| <= pi/2 only; beyond, F(phi, m) = 2n K(m) + F(phi - n pi, m) is
needed. EllipticF(-1.7656, 0) = -1.3759926535897933 where the integral of 1 from 0 to -1.7656
is -1.7656 (the returned value is -(pi - 1.7656)); EllipticE(-3.1856, 0.1238) = 0.044 (want
-3.0859839664961943). The documentation states only 0 <= m < 1 and gives the integral from 0
to phi.
'''

[[bug]]
id = "gonum/9"
title = "mathext.Digamma is accurate to 3e-11 absolute only"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDigammaPrecision"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Digamma shifts x up to 7 by the recurrence and applies a five-term asymptotic series, whose
truncation error at 7 is about 3e-11: Digamma(1.5) = 0.03648997395322118 where 2 - gamma - 2
log 2 = 0.03648997397857652 (2.5e-11 off, 7e-10 relative). Two more terms of the series or a
shift to 10 would give double precision. Beta.Entropy, Chi.Entropy and the other entropies
built on Digamma inherit the error.
'''

[[bug]]
id = "gonum/10"
title = "mathext.Digamma loses digits next to its negative poles"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDigammaNearPole"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The reflection formula psi(1 - x) - pi / tan(pi x) evaluates tan at pi x without reducing x to
its fractional part, so the error grows like |x| / (x - round(x)): Digamma(-18.999999997) =
-3.33333298640814e+08 (want -3.3333330278268796e+08, 1.3e-7 off), Digamma(-199.9999999) =
-9.999995291857155e+06 (want -9.999994699184388e+06, 6e-8 off). tan(pi (x - round(x))) is
exact.
'''

