# Bugs found in gonum/gonum by the Hegel zoo. Every id is pinned by a TestHegelPin test
# (hegel.patch) listed in target.toml's expected_failures. Reference values are mpmath's
# (30 to 80 digits) or exact closed forms.

[[bug]]
id = "gonum/1"
title = "mathext.Hypergeo is NaN, Inf, garbage or a panic where 2F1 is defined"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinHypergeoNaN"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
At z = 1 with c - a - b > 0, where Gauss's theorem gives Gamma(c) Gamma(c-a-b) / (Gamma(c-a)
Gamma(c-b)), Hypergeo(-4.8, 0.5, 1, 1) and Hypergeo(1, 2, 5, 1) are NaN (want 0.2509 and 2).
Hypergeo(-5.15, 0, -5, 8) is NaN (b = 0: the series is 1), Hypergeo(1, 8, -2.5, -67.7) is NaN
(want -0.0074687), Hypergeo(4, 0.02, -5, 0) is +Inf (z = 0: 1). When c is a nonpositive integer
but the series terminates first (a a nonpositive integer with |a| < |c|) the polynomial is
defined: Hypergeo(-3, -26.2, -10, -1) returns -2.9e8 where the cubic sums to 53.0594, and
Hypergeo(-4.5, -10, -5.5, 0.999) panics "cephes: function singularity" where the degree-10
polynomial is 1.8174e-27. Every other mathext function documents its panics; Hypergeo's
documentation promises the value of 2F1.
'''

