[[bug]]
id = "gonum/20"
title = "distuv.NoncentralT.CDF collapses for |x| above about 3e7 sqrt(Nu)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNctLargeX"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The series works in t = x^2 / (Nu + x^2), which loses digits as it approaches 1 (an error of
about 1e-16 x^2 / Nu: NoncentralT{Nu: 0.112, Mu: 0}.CDF(-289000) = 0.10056830 where the central
t gives 0.10056852) and is meaningless once t rounds to 1: NoncentralT{Nu: 0.087, Mu:
