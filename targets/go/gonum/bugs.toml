[[bug]]
id = "gonum/12"
title = "mathext.Zeta is NaN for a very large exponent"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZetaOverflow"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Zeta(1e20, 2) = NaN (want 0, as Zeta(1e13, 2) = 0 is). Once (k + q)^-x underflows to 0 the
Euler-Maclaurin coefficient x(x+1)...(x+2j) overflows to +Inf and multiplies the zero tail:
0 * Inf. A check that the tail is 0 (or x above about 1e13) would return the direct sum.
'''

[[bug]]
id = "gonum/13"
title = "mathext.Zeta cancels catastrophically and overflows for a negative q"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinZetaNegativeQ"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For q < 0 the code sums (k + q)^-x until k + q > 9 instead of using a reflection or shift
(the source comments that it should): the terms of alternating sign reach 512 for Zeta(9,
-7.5) and cancel to 7.117828755121893e-09 where the exact value is 7.117802962369177e-09
(3.6e-6 off); Zeta(2501, -0.25) = NaN where -Inf is due (the first two terms are -Inf and
+Inf; Zeta(2001, -0.25) = -Inf is right). Summing the finitely many negative terms exactly
(they are the only source of cancellation) and adding Zeta(x, q + n) for the first q + n > 0
is exact.
'''

[[bug]]
id = "gonum/14"
title = "distuv.Logistic.LogProb ignores Mu and S"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinLogisticLogProb"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
LogProb returns x - 2 log(e^x + 1), the standard logistic log density, for every Mu and S:
Logistic{Mu: 3, S: 630}.LogProb(-80.2) = -80.2 where log(Prob(-80.2)) = -7.8363712071237615.
Only the standard distribution gets the right answer. (-z - log S - 2 log1p(e^-z) with z =
(x - Mu)/S is the density, and is stable in both tails when z is reflected to |z|.)
'''

[[bug]]
id = "gonum/15"
title = "distuv.Logistic.Prob is NaN or 0 in the tails where the density is representable"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLogisticProbOverflow"
found = { commit = "2b52c28fc756441b75b3af99cddc1649f4439ded", version = "v0.17.0+1 (2b52c28)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Prob is E / (S (1 + E)^2) with E = exp(-(x - Mu)/S). Below Mu - 709 S E is +Inf and Prob is
Inf/Inf = NaN: Logistic{Mu: 6, S: 0.5}.Prob(-400) = NaN (want 0). Before that, from |x - Mu|
above about 355 S, (1 + E)^2 overflows and Prob is 0 where the density is far from underflow:
Logistic{Mu: 0, S: 0.002}.Prob(-1) = 0 (want 3.562288203370643e-215). The reflection z -> |z|
(the density is even) and the form e^-|z| / (S (1 + e^-|z|)^2) never overflow.
'''

[[bug]]
id = "gonum/16"
title = "distuv.Logistic.Quantile and NoncentralT.Quantile do not check p"
kind = "contract"
severity = "low"
