# Bugs found in github.com/urfave/cli/v3 by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure in
# target.toml.

[[bug]]
id = "cli/1"
title = "A lone - argument ends the parsing and drops every argument after it"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDashKeepsRest"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
app - file.txt --lang fr: the Action receives Args() == ["-"] - "file.txt" is gone and --lang
is never parsed (lang keeps its default), with no error. parseFlags (command_parse.go) handles
an argument of length 1 starting with '-' as "posArgs = append(posArgs, firstArg); break": the
break leaves the loop over the remaining arguments, and the function returns the positionals
collected so far. "-" conventionally names stdin (e.g. `tool - other.txt`); every argument
after it is silently lost. v3 documents that flags may appear anywhere (StopOnNthArg: "A nil
value means normal v3 flag parsing behavior (flags can appear anywhere)"). Found by
TestHegelRun.
"""

[[bug]]
id = "cli/2"
title = "In a combined short-option token a value-taking flag that is not the last letter is silently ignored"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCombinedShortValueFlag"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With UseShortOptionHandling, -o a StringFlag and -v a BoolFlag: `app -ov file.txt` sets
verbose, leaves out unset and makes "file.txt" a positional argument, without an error; `-vo
file.txt` sets both. parseFlags (command_parse.go) walks the letters of a combined token: a
bool flag is set, the last letter may take a value ("else if index == len(flagName)-1"), and
any other letter that names a value-taking flag falls through both branches and is dropped.
The documentation describes the token as a combination of "single-character bool arguments";
a value-taking letter in the middle is therefore a usage error, and getopt-style parsers either
reject it or give it the rest of the token - neither loses it silently. Found by TestHegelRun
(the model follows the code; the property counts the cases).
"""

[[bug]]
id = "cli/3"
title = "A BoolWithInverseFlag in a combined short-option token is set to false"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCombinedShortInverseFlag"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
BoolWithInverseFlag{Name: "color", Aliases: []string{"c"}} and BoolFlag -v with
UseShortOptionHandling: `app -cv` gives color == false (IsSet true) while `app -c` gives true.
parseFlags (command_parse.go) calls cmd.set(flagName, sf, fv) with flagName the whole combined
token ("cv"); BoolWithInverseFlag.Set(name, val) decides between the positive and the inverse
form by whether name is one of the flag's names - "cv" is not, so it takes the inverse branch
and sets false. The ordinary flags ignore the name argument, so only inverse flags are hit;
`-vc` likewise sets false. Found by TestHegelRun.
"""

[[bug]]
id = "cli/4"
title = "A parent's Local flag is set from a subcommand through its short-option form"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLocalFlagNotInSubcommand"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Root flag StringFlag{Name: "loc", Aliases: []string{"L"}, Local: true} and a subcommand,
UseShortOptionHandling on: `app sub --loc x` is "flag provided but not defined: -loc" (Local:
"whether the flag needs to be applied to subcommands as well" - it is not applied), but `app sub
-L x` sets loc to "x". parseFlags (command_parse.go) looks a flag up in cmd.appliedFlags (own
and inherited flags) first; when that fails and short-option handling is on it splits the token
into letters and looks each up with cmd.lookupFlag, which searches the whole lineage, Local
flags included. A one-letter alias thus bypasses the Local restriction; the same happens for a
letter inside a combined token. Found by TestHegelRun.
"""

[[bug]]
id = "cli/5"
title = "A subcommand named right after -- is dispatched and the arguments after it are parsed as its flags"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDoubleDashEndsCommands"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Root with StringFlag --lang and a subcommand "sub": `app -- sub --lang fr` runs sub with
Args() == [] and lang == "fr". parseFlags (command_parse.go) treats "--" as documented - it
stops the flag parsing and returns the rest as positional arguments - but run
(command_run.go) then takes the first positional as a subcommand name whatever came before it,
and the subcommand's own run parses the rest again, flags included: the "--" is undone one
level down. The conventional meaning of "--" ("everything after this is an operand") is not
kept: an operand that happens to equal a subcommand name changes the command that runs, and
the flags after it are interpreted. Found by TestHegelRun.
"""

[[bug]]
id = "cli/6"
title = "A subcommand name that is not the first positional argument stops the flag parsing but is not run"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommandNameAfterPositional"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Root with StringFlag --lang and a subcommand "sub": `app foo sub --lang fr` runs the root
Action with Args() == ["foo", "sub", "--lang", "fr"] and lang at its default, without an error
- `app foo --lang fr` sets lang. parseFlags (command_parse.go) stops at any positional that
names a subcommand ("if there is a command by that name let the command handle the rest of the
parsing") and returns the rest unparsed; run (command_run.go) only dispatches when the FIRST
positional is a command name, so here nothing parses the rest: flags after the name are
silently positional, and undefined flags there raise no error either. Either the name should
be an ordinary positional (only the first positional selects a command) or the parsing should
go on. Found by TestHegelRun.
"""

[[bug]]
id = "cli/7"
title = "Two forms of one flag in an invocation are documented as an error but accepted"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTwoFormsOfOneFlag"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
docs/v3/examples/flags/advanced.md ("Alternate Names"): "Note that giving two different forms
of the same flag in the same command invocation is an error." `app --lang fr -l de` with
Aliases: ["l"] returns no error and lang == "de" (Count 2): parseFlags resolves both names to
the same Flag and sets it twice, as it does for the same form repeated ("only the last value
entered for the flag will be provided"). Only OnlyOnce makes a repetition an error. The code or
the documentation is wrong. Found while probing for TestHegelRun (the model follows the
code).
"""

[[bug]]
id = "cli/8"
title = "BoolWithInverseFlag.Get panics before the flag has been prepared by a run"
kind = "crash"
severity = "low"
test = "TestHegelPinInverseFlagGet"
found = { commit = "ae1fde92d52c18cb0e713172915a0b94f1c5daa3", version = "v3.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
(&cli.BoolWithInverseFlag{Name: "color", Value: true}).Get() panics with a nil pointer
dereference: Get (flag_bool_with_inverse.go) returns bif.value.Get() and value is created in
PreParse, which Command.run calls for the flags of the commands it reaches; FlagBase.Get
returns f.Value when value is nil. Get is part of the Flag interface, so generic code walking
Command.Flags (documentation generators, a subcommand's flags before it runs) crashes on an
inverse flag where every other flag type answers with its default. Found by TestHegelRun (the
property reads every flag of the tree after the run).
"""
