[[bug]]
id = "mergo/5"
title = "Map panics on a typed nil pointer value for a non-pointer field"
kind = "crash"
severity = "low"
test = "TestHegelPinNilPointerValue"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
mergo.Map(&Foo{}, map[string]interface{}{"i": (*int)(nil)}) with Foo.I an int panics: "reflect:
call of reflect.Value.Interface on zero Value". deepMap (map.go) dereferences a pointer value when
the field is not a pointer (srcElement = srcElement.Elem()) and then asks
reflect.TypeOf(srcElement.Interface()) for its kind; the Elem of a nil pointer is the zero Value.
An untyped nil value is skipped; a typed nil pointer should be skipped the same way. Found while
probing before writing TestHegelMapModel.
"""

[[bug]]
id = "mergo/6"
title = "WithSliceDeepCopy merges no slice element that is not a pointer or a map"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSliceDeepCopy"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dst := []int{1, 0}; Merge(&dst, []int{3, 4, 5}, WithSliceDeepCopy) leaves dst as [1 0]; []Foo{{S:
"d"}, {}} merged with []Foo{{I: 1}, {S: "s"}} is unchanged too. The option's documentation:
"WithSliceDeepCopy will merge slice element one by one with Overwrite flag". deepMerge (merge.go,
the Slice case and the slice branch of the Map case) merges
reflect.ValueOf(dstElement.Interface()) with reflect.ValueOf(srcElement.Interface()): taking the
element out through Interface() makes it unaddressable, so nothing can be set on it; only what an
element references (a pointer's target, a map's entries) is merged. Since the option also turns
Overwrite on but skips the whole-slice branch (!sliceDeepCopy), a slice of scalars or structs
cannot change at all under it. dst.Index(i) is addressable and would do. Found by
TestHegelMergeModel (switch sliceDeepCopyPointersOnly) after a probe.
"""

[[bug]]
id = "mergo/7"
title = "An array is never an empty value: a zero array field is not filled and a zero source array overrides"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroArray"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
type T struct { A [2]int }; Merge(&T{}, T{A: [2]int{1, 2}}) leaves A as [0 0]; and Merge(&T{A:
[2]int{1, 2}}, T{}, WithOverride) zeroes it. isEmptyValue (mergo.go, copied from encoding/json's
omitempty) says an array is empty when its length is 0, which a [2]int never is; deepMerge treats
the array as one scalar-like value. The README: "Mergo merges same-type structs and maps by
setting default values in zero-value fields"; WithOverride "will make merge override non-empty dst
attributes with non-empty src attributes values". A zero array is a zero-value field, and not a
non-empty source. Found by TestHegelMergeModel and TestHegelMergeLaws (switch arraysNeverEmpty).
"""

[[bug]]
id = "mergo/8"
title = "WithoutDereference with WithOverride leaves a pointer to a struct untouched"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNoDerefStructPointer"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
type T struct { P *Foo }; Merge(&T{P: &Foo{S: "d"}}, T{P: &Foo{S: "s", I: 1}}, WithOverride,
WithoutDereference) changes nothing: the destination keeps its pointer and its target is not
merged either. The README: "If you need to override pointers, so the source pointer's value is
assigned to the destination's pointer, you must use WithoutDereference" (with WithOverride; the
example uses a *string, which works). deepMerge (merge.go, the Ptr case) under
ShouldNotDereference assigns the pointer only when src.Elem().Kind() != reflect.Struct and does
nothing at all for a pointer to a struct. Found by TestHegelMergeModel (switch
noDerefStructPointer) after a probe.
"""

[[bug]]
id = "mergo/9"
title = "Map into a non-nil interface field fails with ErrDifferentArgumentsTypes when the value has another type"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMapInterfaceField"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
type T struct { Any interface{} }; Map(&T{Any: 5}, map[string]interface{}{"any": "str"}) returns
"src and dst must be of same type" (ErrDifferentArgumentsTypes, the error for arguments of
different types) and Map(&T{Any: &Foo{S: "d"}}, map[string]interface{}{"any": &Foo{I: 1}}) does
too, the pointer having been dereferenced to a Foo first. Without WithOverride the non-empty field
should simply be left alone (as it is when the dynamic types are equal); deepMerge (merge.go, the
Ptr/Interface case for a non-interface source) reaches "else return ErrDifferentArgumentsTypes"
for any other type. Found by TestHegelMapModel (switch ifaceMismatchError) after a probe.
"""

[[bug]]
id = "mergo/10"
title = "Map into a struct removes the destination's map entries and pointers that the source map lacks"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMapKeepsEntries"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
type T struct { M map[string]int; P *int }; Map(&T{M: {"a": 1}}, map[string]interface{}{"m":
map[string]int{"b": 2}}) gives M = {"b": 2}: the entry "a" is deleted, where Merge(&t, T{M: {"b":
2}}) gives {"a": 1, "b": 2}. Map(&T{P: &x}, map[string]interface{}{"p": (*int)(nil)}) sets P to
nil. deepMap (map.go, the Struct case) sets config.overwriteWithEmptyValue = true for every key
before merging the value, so the nested merges run as if WithOverwriteWithEmptyValue had been
given: deepMerge then deletes the map entries absent from the source and assigns nil pointers.
Map's documentation promises "the same restrictions as in Merge()" and that only "Missing key in
src that doesn't match a field in dst will be skipped". Found by TestHegelMapModel (switch
mapForcesEmptyOverwrite) after a probe.
"""

