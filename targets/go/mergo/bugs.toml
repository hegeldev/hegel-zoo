# Bugs found in dario.cat/mergo by the Hegel properties. Each has a pin test (TestHegelPin...)
# that asserts the correct behaviour and is listed as an expected failure in target.toml.

[[bug]]
id = "mergo/1"
title = "Merge and Map panic on a typed nil pointer source instead of returning ErrNilArguments"
kind = "crash"
severity = "medium"
test = "TestHegelPinNilPointerSource"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
var src *Foo; mergo.Merge(&dst, src) panics with "reflect: call of reflect.Value.Type on zero
Value" (Map with a nil *map[string]interface{} likewise). resolveValues (mergo.go) rejects an
untyped nil (ErrNilArguments, "src and dst must not be nil") but dereferences a pointer source
without checking it: vSrc = reflect.ValueOf(src).Elem() is the zero Value, and merge then calls
vSrc.Type() on it. A nil pointer to a config struct is a common source (an optional override that
was not set). Found while probing before writing TestHegelMergeModel.
"""

[[bug]]
id = "mergo/2"
title = "WithOverwriteWithEmptyValue panics on a non-nil unexported map field"
kind = "crash"
severity = "low"
test = "TestHegelPinUnexportedMap"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
type T struct { N int; m map[string]int }; Merge(&T{m: {"a": 1}}, T{m: {"b": 2}},
WithOverwriteWithEmptyValue) panics: "reflect.Value.SetMapIndex using value obtained using
unexported field". deepMerge (merge.go) visits every field of a struct with exported fields, the
unexported ones included, relying on CanSet to keep them untouched; the Map case does not check
it: the loop that removes the destination's entries missing from the source calls dst.SetMapIndex
on the unexported map. The README says "Mergo won't merge unexported (private) fields". Found
while probing before writing TestHegelMergeModel.
"""

[[bug]]
id = "mergo/3"
title = "Map into a struct panics when a value has the kind of its field but another type"
kind = "crash"
severity = "medium"
test = "TestHegelPinMapValueType"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
type Color string; type T struct { C Color; M map[string]int; S []int }. Map(&t,
map[string]interface{}{"c": "red"}) panics: "reflect.Set: value of type string is not assignable
to type Color". Map(&t, map[string]interface{}{"m": map[string]interface{}{"a": 1}}) panics:
"reflect.Value.SetMapIndex: value of type interface {} is not assignable to type int"; a
[]interface{} for the []int field panics in reflect.Set too. deepMap (map.go) compares only the
kinds of the value and the field ("if srcKind == dstKind") before handing them to deepMerge, which
sets or inserts the value as is. The documented use is mapping a decoded JSON document
(map[string]interface{} all the way down) onto a config struct: any map-typed field other than
map[string]interface{} panics on its nested object, and any named string or numeric type panics on
its scalar. A type mismatch is otherwise an error ("type mismatch on C field: found string,
expected int"): these should be errors too, or conversions where reflect allows them. Found while
probing before writing TestHegelMapModel.
"""

