[[bug]]
id = "mergo/12"
title = "WithOverride on a map of interfaces merges into the replaced pointer's target before replacing it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinReplacedPointerUntouched"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
old := &Foo{S: "d"}; dst := map[string]interface{}{"a": old}; Merge(&dst, map[string]
interface{}{"a": &Foo{I: 1}}, WithOverride) sets dst["a"] to the source's pointer, as expected,
but *old is now {S: "d", I: 1}: deepMerge (merge.go, the Map case) first merges the source's
target into the destination's target through the pointers, then the post-step replaces the entry
because srcElement.Kind() is Interface (not Ptr) under Overwrite. The value the caller still holds
through the old pointer is modified by a merge that discarded it. Found while probing before
writing TestHegelMergeModel.
"""

