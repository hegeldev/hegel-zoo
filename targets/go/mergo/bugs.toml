[[bug]]
id = "mergo/15"
title = "A nil slice, map or interface entry of the source map overrides under WithOverride alone, a nil pointer entry never"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNilMapEntries"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dst := map[string]interface{}{"a": []int{1}, "b": map[string]interface{}{"x": 1}}; Merge(&dst,
map[string]interface{}{"a": []int(nil), "b": nil}, WithOverride) gives {"a": [], "b": nil}: the
nil entries wiped the destination's, though WithOverride is documented to "override non-empty dst
attributes with non-empty src attributes values" and a nil is the emptiest value there is (a nil
struct field never overrides). The other way round, dp := map[string]*Foo{"a": &Foo{}}; Merge(&dp,
map[string]*Foo{"a": nil}, WithOverwriteWithEmptyValue) keeps the pointer, though that option is
documented to "override non empty dst attributes with empty src attributes values". deepMerge
(merge.go, the Map case): the case list "Chan, Func, Map, Interface, Slice" sets a nil entry under
Overwrite and leaves Ptr out, so a nil pointer entry falls to the default path where a pointer
never overrides. Found by TestHegelMergeModel (switch nilMapEntries).
"""

[[bug]]
id = "mergo/16"
title = "WithOverride replaces a struct without exported fields (time.Time) with a zero source value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroTimeOverride"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
type T struct { At time.Time }; Merge(&T{At: t1}, T{}, WithOverride) zeroes At. deepMerge
(merge.go, the Struct case) sets a struct that has no exported fields whenever Overwrite is on and
!isEmptyValue(src), and isEmptyValue never says a struct is empty. The README: "It won't merge
empty structs value as they are zero values too", and WithOverride overrides with "non-empty src
attributes values". A zero time.Time in the source (a config value that was not set) erases the
destination's. Found by TestHegelMergeLaws (the zero-source law, switch zeroStructOverrides).
"""

[[bug]]
id = "mergo/17"
title = "WithSliceDeepCopy panics on []interface{} elements of different kinds"
kind = "crash"
severity = "medium"
test = "TestHegelPinDeepCopyKinds"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dst := []interface{}{Foo{S: "d"}}; Merge(&dst, []interface{}{"x"}, WithSliceDeepCopy) panics:
"reflect: call of reflect.Value.Field on string Value"; dst := []interface{}{map[string]
interface{}(nil)} against []interface{}{Foo{}} panics: "reflect: call of reflect.Value.IsNil on
struct Value". deepMerge (merge.go) is called element by element on the dynamic values and assumes
the source has the destination's kind: the Struct case reads src.Field(i), the Map case asks
src.IsNil(). []interface{} is what a JSON array decodes to, and the option exists for such
documents (TestIssue220 covers a map against a string, which happens to be safe). Found by
TestHegelMergeModel (switch deepCopyKindPanic).
"""

[[bug]]
id = "mergo/18"
title = "Merge panics when interface entries hold maps of different types"
kind = "crash"
severity = "low"
test = "TestHegelPinTypedMapsInInterfaces"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dst := map[string]interface{}{"a": map[string]int{"x": 1}}; Merge(&dst, map[string]
interface{}{"a": map[string]string{"y": "s"}}) panics: "reflect.Value.SetMapIndex: value of type
string is not assignable to type int". deepMerge (merge.go, the Map case) merges two map entries
into each other whenever both dynamic values are maps, with no type check: the entries of the
source's map are inserted into the destination's. Under WithOverride the entry is replaced
afterwards anyway; without it the two maps are simply of different types and the destination's
should stay (or the mismatch be an error, as WithTypeCheck makes it for slices). Found while
probing before writing TestHegelMergeModel.
"""

[[bug]]
id = "mergo/19"
title = "WithoutDereference with WithOverride panics on pointer entries of maps and slices of interfaces"
kind = "crash"
severity = "low"
test = "TestHegelPinNoDerefMapEntries"
found = { commit = "7b33b2b01026fbbbbfcfbb1ee2c9c0a5e0c9a9f7", version = "v1.0.2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
x, y := 1, 2; dst := map[string]interface{}{"a": &x}; Merge(&dst, map[string]interface{}{"a": &y},
WithOverride, WithoutDereference) panics: "reflect: reflect.Value.Set using unaddressable value".
deepMerge (merge.go, the Ptr case under ShouldNotDereference) assigns the source pointer with
dst.Set(src) without checking dst.CanSet(), and the entries of a map (or the elements of a
[]interface{} under WithSliceDeepCopy) are unaddressable; every other assignment in deepMerge is
guarded by CanSet. The Map case would then replace the entry itself. Found by TestHegelMergeModel
(switch noDerefUnaddressablePanic).
"""
