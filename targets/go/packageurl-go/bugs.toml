[[bug]]
id = "packageurl-go/1"
title = "A type may start with a period, dash or plus and contain a plus; the specification allows letters, digits, period and dash, starting with a letter"
kind = "spec"
severity = "low"
test = "TestHegelPinTypeStartsWithALetter"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
FromString("pkg:+type/name"), "pkg:.type/name", "pkg:-type/name" and "pkg:ty+pe/name" are
accepted (type "+type" and so on), and Normalize accepts the same types. Specification 5.6.2
(purl-spec 9d6b901, docs/specification/standard/specification.md, the commit upstream's
testdata submodule pins): "The package type shall be composed only of ASCII letters and
numbers, period '.', and dash '-'. The type shall start with an ASCII letter."

validType in packageurl.go allows '.', '-' and '+' as the first character and '+' anywhere
(TypePattern is `^[A-Za-z\.\-\+][0-9A-Za-z\.\-\+]*$`); the specification's own test suite
only checks a type starting with a digit and one holding '&'.

Found by the parse property (the generator includes such types) and the build property.
'''

[[bug]]
id = "packageurl-go/2"
title = "A qualifier key may start with a period, dash or underscore; the specification says a key shall start with an ASCII letter"
kind = "spec"
severity = "low"
test = "TestHegelPinQualifierKeyStartsWithALetter"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
FromString("pkg:generic/name?_k=v") = qualifier {_k v}; ".k" and "-k" likewise, and
Normalize accepts them on a struct. Specification 5.6.6: "The key shall be composed only of
lowercase ASCII letters and numbers, period '.', dash '-' and underscore '_'. A key shall start
with an ASCII letter." validQualifierKey allows '.', '-' and '_' first (its comment says only
"A key cannot start with a number", which is what the specification's test suite checks).

Found by the parse and build properties.
'''

[[bug]]
id = "packageurl-go/3"
title = "A percent-encoded slash inside a namespace or subpath segment is accepted and becomes a segment separator"
kind = "spec"
severity = "medium"
test = "TestHegelPinEncodedSlashInASegmentIsRejected"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    FromString("pkg:generic/ns%2Fx/name").Namespace = "ns/x"     -> ToString "pkg:generic/ns/x/name"
    FromString("pkg:generic/name#a%2Fb").Subpath    = "a/b"      -> ToString "pkg:generic/name#a/b"

Specification 5.6.3 and 5.6.7: when percent-decoded, a namespace or subpath segment "shall not
contain any slash '/' characters"; the parse procedure for the subpath says "Report an error
if any segment contains a slash". Upstream decodes each segment (separateNamespaceNameVersion,
percentDecodeSubpath - the latter added precisely so that "an encoded slash inside a segment is
not treated as a segment separator") and joins the results with '/', so the decoded slash
becomes a separator: one segment "ns/x" turns into the two segments "ns" and "x", and the
canonical string no longer says what the input said. A name may contain a slash (5.6.4 has no
such rule) and there "n%2Fame" round-trips as "n%2Fame".

Found by the parse property.
'''

[[bug]]
id = "packageurl-go/4"
title = "Subpath segments that are empty, '.' or '..' are kept when leading and rejected otherwise; the specification discards them"
kind = "spec"
severity = "low"
test = "TestHegelPinSubpathDotSegmentsAreDiscarded"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    FromString("pkg:generic/name#./a").Subpath  = "./a"     (ToString keeps "#./a")
    FromString("pkg:generic/name#..").Subpath   = ".."
    FromString("pkg:generic/name#a/./b")        = error "invalid Package URL subpath"
    FromString("pkg:generic/name#a//b")         = error
    Normalize(Subpath: "s//t") keeps "s//t"; ToString writes "#s//t"

The parse procedure: "Split the right side on '/' ... Discard any segment that is empty, or
equal to '.' or '..'"; the build procedure: "Discard empty, '.' and '..' segments";
5.6.7: a segment "shall not be empty" and "shall not be any of '..' or '.'". Upstream's
Normalize rejects '.' and '..' at any position but the first and keeps the first (its own
TestNormalize documents "'./' is a valid subpath prefix"), and keeps empty segments
everywhere. The specification's test suite has no case with such segments, and either
discarding or rejecting them would satisfy 5.6.7; keeping a leading "./" and rejecting an inner
one satisfies neither reading.

Found by the parse property and the build property.
'''

[[bug]]
id = "packageurl-go/5"
title = "Normalize keeps slashes around the name and empty namespace segments, so a normalized value differs from what its own string parses to"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinNormalizeAgreesWithItsString"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    p := PackageURL{Type: "generic", Namespace: "a//b", Name: "n"}
    p.Normalize()        -> Namespace "a//b"
    p.ToString()         -> "pkg:generic/a/b/n"        (ToString drops the empty segment)
    FromString(that)     -> Namespace "a/b"

    p = PackageURL{Type: "generic", Name: "/n/"}
    p.Normalize()        -> Name "/n/"
    p.ToString()         -> "pkg:generic/%2Fn%2F"
    FromString(that)     -> Name "/n/"

The build procedure says "Strip the namespace from leading and trailing '/'", "Split on '/' as
segments" and "Strip the name from leading and trailing '/'" (5.6.4: leading and trailing
slashes "are not significant and should be stripped. They are not part of the name"). Normalize
trims the namespace's outer slashes only and does not touch the name, so the normalized struct
is not the canonical form: for the namespace, Normalize(p) != FromString(p.ToString()); for the
name, the slashes that should be stripped are percent-encoded into the canonical string.

Found by the build property (Normalize against the build procedure; the round-trip property
skips the shape).
'''

[[bug]]
id = "packageurl-go/6"
title = "Components the type definitions mark case insensitive are not lowercased for hex, luarocks, oci, otp, pub, pypi, vscode-extension and yocto"
kind = "spec"
severity = "medium"
test = "TestHegelPinCaseInsensitiveComponentsAreLowercased"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    FromString("pkg:hex/NS/Name").ToString()                = "pkg:hex/NS/Name"          want pkg:hex/ns/name
    FromString("pkg:luarocks/NS/Name").ToString()           = "pkg:luarocks/NS/Name"
    FromString("pkg:oci/Name@V").ToString()                 = "pkg:oci/Name@V"           want pkg:oci/name@v
    FromString("pkg:otp/Name").ToString()                   = "pkg:otp/Name"
    FromString("pkg:pub/Name").ToString()                   = "pkg:pub/Name"
    FromString("pkg:pypi/name@V1").ToString()               = "pkg:pypi/name@V1"         want pkg:pypi/name@v1
    FromString("pkg:vscode-extension/NS/Name@V").ToString() = "pkg:vscode-extension/NS/Name@V"
    FromString("pkg:yocto/NS/Name").ToString()              = "pkg:yocto/NS/Name"        want pkg:yocto/ns/Name

The type definitions at purl-spec 9d6b901 (types/<type>-definition.json) set
"case_sensitive": false on the hex, luarocks, otp, pub and vscode-extension names, the hex,
luarocks, yocto and vscode-extension namespaces and the oci, pypi and vscode-extension versions;
the type-definition schema (Clause 6.6.7, 6.7.4): "true if this PURL component is case
sensitive. If false, the form shall be lowercase." typeAdjustNamespace, typeAdjustName and
typeAdjustVersion in packageurl.go list alpm, apk, bitbucket, bitnami, brew, chrome-extension,
composer, deb, github, golang, qpkg, rpm, pypi (name) and huggingface (version) only. The
specification's test suite has no mixed-case input for these types, so upstream passes it.

Found by the build and parse properties (the model applies the definitions' case rules).
'''

