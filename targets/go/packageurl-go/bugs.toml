[[bug]]
id = "packageurl-go/8"
title = "The namespace requirement of the type definitions is checked for six types only"
kind = "spec"
severity = "medium"
test = "TestHegelPinNamespaceRequirementIsChecked"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    FromString("pkg:maven/name")     ok    (the maven definition: namespace "required")
    FromString("pkg:github/name")    ok    (required)
    FromString("pkg:golang/name")    ok    (required)
    FromString("pkg:pypi/ns/name")   ok    (the pypi definition: namespace "prohibited")
    FromString("pkg:cargo/ns/name")  ok    (prohibited)
    FromString("pkg:gem/ns/name")    ok    (prohibited)

validCustomRules checks the requirement for swift and vscode-extension (required) and for
chrome-extension, julia, otp and vcpkg (prohibited). At purl-spec 9d6b901 the definitions
require a namespace for alpm, apk, bitbucket, composer, deb, github, golang, huggingface, maven,
qpkg, rpm, swift and vscode-extension and prohibit one for bazel, bitnami, cargo,
chrome-extension, cocoapods, conda, cran, gem, hackage, julia, mlflow, nuget, oci, opam, otp,
pub, pypi and vcpkg; 5.7: "If the PURL type is registered, then the PURL is invalid if it does
not conform to all of the rules from the corresponding PURL type definition." The test suite
exercises the rule only for the six types upstream checks (and cran and hackage with a missing
name, which fails for another reason).

Found by the build and parse properties.
'''

[[bug]]
id = "packageurl-go/9"
title = "Empty-valued qualifiers: ToString writes them (keys percent-encoded) before Normalize drops them, and FromString rejects an invalid key with an empty value that Normalize discards"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinToStringDropsEmptyQualifiers"
found = { commit = "3417966624e2ee493063ad63483fd8ce363eaae5", version = "v0.1.7-2-g3417966", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    p := PackageURL{Type: "generic", Name: "name", Qualifiers: Qualifiers{{"k", ""}, {"a", "b"}}}
    p.ToString()                     = "pkg:generic/name?a=b&k="        want pkg:generic/name?a=b
    p = PackageURL{Type: "generic", Name: "name", Qualifiers: Qualifiers{{"1k", ""}}}
    p.Normalize()                    = nil (the pair is dropped before the key is checked)
    FromString(p.ToString())         = error: invalid qualifier key: '1k'
    Qualifiers{{"k é", ""}}.String() = "k%20%C3%A9="

    FromString("pkg:generic/name?1k=")   = error: invalid qualifier key: '1k'   (Normalize on the same pair: ok)

The build procedure: "Discard any pair where the value is empty" (5.6.6: "a key=value pair
with an empty value is the same as if no key=value pair exists for this key"), and a key "shall
not be percent-encoded"; the parse procedure likewise discards pairs with an empty value, while
parseQualifiers validates the key first, so FromString and Normalize disagree on the same pair. Qualifiers.String, which ToString uses, writes every pair, encoding
the key with escapeQualifier; Normalize drops empty-valued pairs, so a value Normalize accepts
can have a ToString that FromString rejects. ToString documents itself as "a canonical string
representation".

Found by the build property (FromString of the string ToString writes before Normalize).
'''

