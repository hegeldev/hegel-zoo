# Bugs found in github.com/fxamacker/cbor/v2 by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure
# in target.toml.

[[bug]]
id = "cbor/1"
title = "TimeUnixMicro encodes times outside 1678–2262 as garbage: the float is computed from an overflowing UnixNano"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnixMicroTimeFarFromEpochRoundTrips"
found = { commit = "d1789e88328ac1a37a3ea50f17649aeb2e501509", version = "v2.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
EncOptions{Time: TimeUnixMicro} on time.Date(1000, 1, 1, 0, 0, 0, 0, UTC) writes
c1fb41f768300936b4a6 = 1(6285284947.419…), which decodes to 2169-02-08T23:09:07Z; the year
9999 becomes 1816. encodeTime does `float64(t.UnixNano()) / 1e9`, and time.Time.UnixNano is
documented to be undefined outside the years 1678–2262 (it wraps). TimeUnixDynamic, right
next to it, computes `float64(secs) + float64(nsecs)/1e9` and is correct for every year, as
are TimeUnix and the RFC 3339 modes. The option's documentation promises "seconds elapsed
(with up to 1-microsecond precision) since UNIX Epoch UTC" with no range restriction.
"""

[[bug]]
id = "cbor/2"
title = "MaxNestedLevels does not count a tag unless it is directly inside another tag"
kind = "contract"
severity = "low"
test = "TestHegelPinNestedTagsCountTowardMaxNestedLevels"
found = { commit = "d1789e88328ac1a37a3ea50f17649aeb2e501509", version = "v2.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
DecOptions.MaxNestedLevels is "the max nested levels allowed for any combination of CBOR
array, maps, and tags". With MaxNestedLevels 4, Wellformed and Unmarshal accept
37([[[[0]]]]) (5 levels), 37(37(37(37(37(0))))) (5 levels: a chain of n tags counts n−1) and
[37([37([37([37(0)])])])] (8 levels; every tag has an array as parent, so none is counted),
while [[[[[0]]]]] is rejected. wellformedInternal increments depth for arrays and maps and,
in the tag case, only for each *further* tag head found after the first (valid.go: the loop
over consecutive tags). A limit meant to bound recursion lets alternating tag/array nesting
go twice as deep as configured; the same accounting is used by Unmarshal, so the documented
limit is off by the number of tag runs.
"""
