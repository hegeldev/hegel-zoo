name = "cbor"
language = "go"
upstream = "https://github.com/fxamacker/cbor"
subdir = ""
license = "MIT"
# README.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md and .github/pull_request_template.md:
# signing requirements for pull requests (the zoo files none), nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "d1789e88328ac1a37a3ea50f17649aeb2e501509"
date = "2026-09-15"
version = "v2.9.4+"

[hegel]
version = "v0.6.33"

[run]
# Python with the cbor2 package is the second oracle; the harness looks for it in
# .hegel/venv (created here) or in HEGEL_CBOR2_PYTHON, and skips that property without it.
setup = ["python3 -m venv .hegel/venv && .hegel/venv/bin/pip install --quiet cbor2"]
command = "go test -count=1 -run TestHegel -v ."

[expected_failures]
TestHegelPinUnixMicroTimeFarFromEpochRoundTrips = "cbor/1"
TestHegelPinNestedTagsCountTowardMaxNestedLevels = "cbor/2"
