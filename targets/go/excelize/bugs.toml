[[bug]]
id = "excelize/29"
title = "ROUNDDOWN, TRUNC, MROUND and the FLOOR family round the binary quotient, one unit off"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTruncBinary"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
round() divides by the significance 10^-digits (itself inexact) and truncates the binary
quotient, so a number that is exact at the requested digits can come out one unit low:
ROUNDDOWN(0.0031,5) = 0.00309 (want 0.0031), ROUNDDOWN(0.0004,5) = 0.00039, ROUNDDOWN(374,8) =
373.99999999, and TRUNC (int(number * 10^digits) / 10^digits) likewise: TRUNC(11.54,7) =
11.5399999. FLOOR, FLOOR.MATH, FLOOR.PRECISE, CEILING.PRECISE and ISO.CEILING take the binary
floor or ceiling of number / significance the same way: FLOOR(5460.2,0.2) = 5460 (5460.2 / 0.2
is 27300.999999999996 in binary; want 5460.2), CEILING.PRECISE(-56.8,0.2) = -56.6 (want -56.8).
MROUND rounds the binary quotient too, so a decimal half goes the wrong way: MROUND(0.15,0.1) =
0.1 and MROUND(0.35,0.1) = 0.3 (want 0.2 and 0.4; 0.15 / 0.1 is 1.4999999999999998 in binary),
where ROUND(0.15,1) = 0.2 is right. CEILING, computed differently, is right. Excel works on
the decimal representation (15 significant digits), so these are the numbers themselves.
'''

