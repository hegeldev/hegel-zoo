# Bugs found in xuri/excelize by the Hegel zoo. Every id is pinned by a TestHegelPin test
# (hegel.patch) listed in target.toml's expected_failures.

[[bug]]
id = "excelize/1"
title = "PERCENTILE.EXC and QUARTILE.EXC panic for a k outside the range"
kind = "crash"
severity = "high"
test = "TestHegelPinPercentileExcPanics"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PERCENTILEdotEXC checks only 0 < k < 1, then indexes the sorted numbers at floor(k(n+1)) and
floor(k(n+1)) - 1 without checking them against the length. A k below 1/(n+1) indexes -1, a k
at or above n/(n+1) indexes n: PERCENTILE.EXC(A1:A5,0.9) and PERCENTILE.EXC(A1:A5,0.1) panic
with an index out of range, and so does QUARTILE.EXC(A1:A1,2) (and AGGREGATE 18/19), killing
the caller. Excel returns #NUM! for a k outside [1/(n+1), n/(n+1)] and the largest value at
n/(n+1) itself (PERCENTILE.EXC(A1:A5,0.8333333333333334) = 5, where the code indexes 5).
'''

[[bug]]
id = "excelize/2"
title = "SEC returns the cosine instead of its reciprocal"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSecIsCos"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SEC is `math.Cos(number)`: SEC(2.401) = -0.738068809912392, where the secant 1/cos(2.401) is
-1.35488722266790. Every result but SEC(0) = 1 is wrong. CSC, COT, SECH and CSCH are right.
'''

[[bug]]
id = "excelize/3"
title = "HARMEAN of a range is always #N/A"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinHarmeanRange"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HARMEAN walks the argument tokens and reads only ArgString and ArgNumber ones; a range token
(ArgMatrix) leaves `number` at 0, which fails the positivity check, so HARMEAN(A1:A5) over 1..5
is #N/A where Excel gives 2.18978102189781. Only the literal form HARMEAN(1,2,3,4,5) works.
GEOMEAN, which flattens its arguments, is right.
'''

[[bug]]
id = "excelize/4"
title = "AVEDEV of a range takes the range as one value"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinAvedevRange"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
AVEDEV computes the mean over the flattened arguments but then walks the argument tokens, one
term per token, so a range is one term (its ToNumber) and the count is 1: AVEDEV(A1:A4) over
1, 2, 3, 4 is 1.5 (want 1), AVEDEV(A1:A4,5) is 2 (want 1.2), and AVEDEV of 13 values gave 14.3
where 7.11 was due. The literal form AVEDEV(1,2,3,4) = 1 is right.
'''

[[bug]]
id = "excelize/5"
title = "CORREL, SUMX2MY2, SUMX2PY2 and SUMXMY2 drop every pair containing a zero"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinZeroPairsDropped"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CORREL and sumx (SUMX2MY2, SUMX2PY2, SUMXMY2) keep a pair only if `lhs.Number != 0 &&
rhs.Number != 0`, meant for empty cells but true of the value 0 as well. With A = 0, 1, 2, 3
and B = 1, 2, 3, 5: SUMXMY2(A1:A4,B1:B4) = 6 (want 7), CORREL(A1:A4,B1:B4) = 0.981980506061966
where PEARSON (a separate implementation) gives the right 0.982707629823991.
'''

[[bug]]
id = "excelize/6"
title = "COMBIN rounds its floating-point product up"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCombinRounding"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
COMBIN multiplies (n + 1 - c) / c for c = 1..k in floating point and returns math.Ceil of the
product, so a product a few ulps above the integer is rounded up: COMBIN(20,18) = 191 (want
190; COMBIN(20,2) = 190 is right, the k = 2 loop being exact). COMBINA(19,2) = COMBIN(20,18)
inherits it. Rounding to the nearest integer, or multiplying in the order that keeps the
partial products integral, would be exact below 2^53.
'''

[[bug]]
id = "excelize/7"
title = "ODD of a number between 0 and 1 is 3"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOddUnit"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ODD computes Modf((x - 1) / 2), whose integer part is -0 for 0 < x < 1, then adds 2 for the
positive sign: ODD(0.5) = 3, ODD(0.02) = 3, ODD(0.99) = 3, where Excel rounds up to the nearest
odd integer, 1. Negative values (ODD(-0.5) = -1) and x >= 1 are right; EVEN is right.
'''

[[bug]]
id = "excelize/8"
title = "ROUND, ROUNDUP and ROUNDDOWN use a fractional num_digits as a power of ten"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRoundFractionalDigits"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
round() forms the significance as 10^-digits without truncating digits, so a fractional
num_digits rounds to a multiple of an irrational number: ROUNDUP(2.567,1.5) = 2.59306768133807
(want 2.57), ROUND(2.567,1.5) = 2.56144490473639 (want 2.6), ROUNDDOWN(685,-1.5) =
664.07830863536 (want 680). Excel truncates num_digits to an integer, as TRUNC here does for
positive digits (TRUNC(2.567,1.5) = 2.5).
'''

[[bug]]
id = "excelize/9"
title = "CEILING.MATH and FLOOR.MATH misread mode and the sign of significance"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCeilingFloorMath"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Excel documents that any nonzero mode rounds negative numbers away from zero in CEILING.MATH
and toward zero in FLOOR.MATH, and that the sign of significance is ignored. CEILING.MATH tests
`mode < 0` and FLOOR.MATH `mode > 0` (defaulting mode to 1), and both divide by the signed
significance: CEILING.MATH(-5.5,2,1) = -4 (want -6), FLOOR.MATH(-5.5,2,0) = -4 (want -6),
FLOOR.MATH(-5.5,2,1) = -6 (want -4), CEILING.MATH(5.5,-2) = 2 (want 6), FLOOR.MATH(-0.159,-2)
= 2 (want -2). A significance of 0 gives #NUM! in CEILING, CEILING.MATH and FLOOR.MATH where
Excel returns 0 (CEILING(502,0) = 0), and FLOOR rejects a number of 0 with a negative
significance (FLOOR(0,-0.5) is #NUM!, want 0; Excel's rule is for a positive number).
'''

[[bug]]
id = "excelize/10"
title = "Infinite results are returned as +INF or -INF instead of #NUM!"
kind = "contract"
severity = "medium"
test = "TestHegelPinInfinityResults"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
An infinite float64 is formatted by CalcCellValue as the text "+INF" or "-INF" and stored as
the cell's value; Excel has no infinity and returns #NUM! wherever a computation overflows.
LN(0) = -INF, ATANH(-1) = -INF, FACT(171) = +INF, GAMMALN(172) = +INF, BINOM.DIST(50,171,0.3,
FALSE) = +INF, BESSELK(0.006,100) = +INF, SKEW.P of a constant range = -INF (0/0 becomes
+-Inf through the intermediate steps). A check for IsInf in the number path of CalcCellValue
would turn them all into #NUM!.
'''

[[bug]]
id = "excelize/11"
title = "The cumulative normal distribution flushes its lower tail to 0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFarTails"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NORMDIST (and NORM.DIST, NORM.S.DIST, NORMSDIST, LOGNORM.DIST through it) computes the
cumulative probability as 0.5 (1 + erf(z / sqrt 2)), which cancels to 0 when erf reaches -1:
NORM.S.DIST(-8.5,TRUE) = 0 (want 9.48E-18), NORMSDIST(-37) = 0 (want 5.7E-300), and the values
just above are rounding residue (NORMSDIST(-8) = 6.11E-16, want 6.22E-16; NORMSDIST(-8.3) =
5.55E-17, want 5.21E-17). Excel keeps the tail to about 1E-308. 0.5 erfc(-z / sqrt 2) has no
cancellation. F.DIST and the other beta-based cumulatives lose their far tails the same way
(F.DIST(0.007,31,3,TRUE) = 0, want 3.1E-18).
'''

[[bug]]
id = "excelize/12"
title = "NORM.S.INV is accurate to about 1e-9 only"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNormSInvPrecision"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
norminv is Peter Acklam's rational approximation without the one Newton/Halley refinement step
that makes it exact to double precision, so its relative error is about 1.15e-9: NORM.S.INV
(0.975) = 1.95996398612019 (want 1.95996398454005), NORM.S.INV(0.001) = -3.0902323047094
(want -3.09023230616781). NORM.INV, NORMINV, NORMSINV, LOGNORM.INV, LOGINV and CONFIDENCE.NORM
inherit it, LOGNORM.INV magnifying the error by the standard deviation in the exponent
(LOGNORM.INV(0.271,0,100) is 5e-8 off). Excel gives 15 digits.
'''

[[bug]]
id = "excelize/13"
title = "The inverse searches of CHISQ.INV.RT, CHIINV, GAMMA.INV and BETA.INV return their bounds"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinChisqInvRight"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
gammainv searches the quantile between 0 and 5 alpha beta with a Newton step falling back to
bisection, over the incompleteGamma of excelize/27, and returns x after 256 iterations
whatever the state. The result is the upper bound whenever the quantile lies above it or the
incomplete gamma fails: CHISQ.INV.RT(0.5,50) = 250 (want 49.33), CHIINV(0.5,100) = 500 (want
99.33), CHISQ.INV.RT(0.001,1) = 5 (want 10.83), GAMMA.INV(0.9,20,1) = 100 (want 25.90); every
result with df >= 30 is 5 df. Where it converges the precision is poor: CHISQ.INV.RT(0.001,10)
= 29.5891887622336 (want 29.5882984450744), CHISQ.INV.RT(0.001,20) is 0.8% off. CHISQ.INV
(the left tail, a different path) is right. BETA.INV's Newton search has the same failure for
small equal shapes near the median, where the U-shaped distribution's CDF is flat: BETA.INV
(0.51,0.1,0.1) = 1 and BETA.INV(0.49,0.1,0.1) = 3E-308 (want 0.556398588620883 and
0.443601411379117; 0.4 and 0.6 are right, and so are shapes of 0.2).
'''

[[bug]]
id = "excelize/14"
title = "Cumulative HYPGEOM.DIST sums impossible outcomes and exceeds 1"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHypgeomCumulative"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The cumulative branch of HYPGEOMdotDIST sums binomCoeff(M,i) binomCoeff(N-M,n-i) /
binomCoeff(N,n) for i from 0 to x, but the support starts at max(0, n - N + M): for the terms
below it n - i exceeds N - M and binomCoeff returns a nonzero value instead of 0.
HYPGEOM.DIST(9,11,10,13,TRUE) = 1.51113612660488 (want 0.961538461538462, a probability
above 1), HYPGEOM.DIST(3,11,4,13,TRUE) = 0.543706293706294 (want 0.538461538461538). The
density branch rejects such an x with #NUM!, as Excel does.
'''

