notes = '''
YEARFRAC returns 0 for equal dates before validating the basis, where Excel gives #NUM! for a
basis outside 0..4: YEARFRAC(43840,43840,-1) = 0 and YEARFRAC(43840,43840,7) = 0 (want #NUM!).
WORKDAY.INTL returns the start date for 0 days before validating the weekend argument, where Excel
gives #NUM! for a code that is not 1..7 or 11..17 and #VALUE! for a mask of seven 1s:
WORKDAY.INTL(43840,0,10) = 43840 and WORKDAY.INTL(43840,0,"1111111") = 43840.
'''
