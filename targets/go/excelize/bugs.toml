[[bug]]
id = "excelize/22"
title = "The variance functions use the one-pass formula and lose the digits of a narrow range"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNaiveVariance"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
vars() (VAR, VAR.S, VAR.P, VARP, VARA, VARPA, and STDEV.P, STDEVP, STDEVPA, SKEW.P, SUBTOTAL
8/10/11 and AGGREGATE through it) computes (n sum x^2 - (sum x)^2) / (n (n - d)), which
cancels catastrophically when the mean is large against the spread: STDEVP of nine 31.2s is
4.23855251736111E-07 (want 0), VARP of 48 0.005s is -2.71E-20 and STDEVP of them #NUM! (the
square root of a negative variance), SKEW.P of nine 31.2s is 5.9E-25 instead of #DIV/0!. The
relative error is about (mean / sd)^2 1e-16, so a range with mean 1000 and spread 0.1 is
already 1e-8 off. STDEV and STDEV.S, which subtract the mean first, are exact. Excel's are
two-pass.
'''

[[bug]]
id = "excelize/23"
title = "COMBIN, PERMUT and MULTINOMIAL accept negative counts"
kind = "contract"
