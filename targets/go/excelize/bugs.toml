[[bug]]
id = "excelize/17"
title = "COTH and FISHERINV overflow for large arguments and COTH loses digits for small ones"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHyperbolicOverflow"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
COTH is (e^x + e^-x) / (e^x - e^-x) and FISHERINV is (e^2y - 1) / (e^2y + 1); when the
exponential overflows the quotient is NaN and the result #NUM!: COTH(710) and COTH(-710) are
#NUM! (want 1 and -1; COTH(700) = 1), FISHERINV(355) is #NUM! (want 1; FISHERINV(354) = 1).
The same COTH formula cancels for small x: COTH(0.0000016) = 625000.000026196 (want
625000.000000533), a relative error of 4e-11 growing as 1/x. 1/tanh(x) and tanh(y) have
neither problem.
'''

[[bug]]
id = "excelize/18"
title = "ROMAN accepts numbers and forms out of range and reads TRUE as the concise form"
kind = "contract"
severity = "low"
test = "TestHegelPinRomanArgs"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Excel's ROMAN returns #VALUE! for a number outside 0..3999 and for a form outside 0..4, and
treats TRUE as form 0 (classic) and FALSE as form 4 (simplified). Here ROMAN(-1) = "" and
