[[bug]]
id = "excelize/19"
title = "BASE checks neither the number nor min_length, and DECIMAL accepts radix 0"
kind = "contract"
severity = "low"
test = "TestHegelPinBaseChecks"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Excel documents #NUM! for a number below 0 or at or above 2^53 and for a min_length below 0 or
above 255. BASE(-1,8) = "-1", BASE(9007199254740992,26) = "2BKO8JF78BB6", BASE(131072,3,-1)
