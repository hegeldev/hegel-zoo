notes = '''
The US 30/360 rule of YEARFRAC basis 0 sets the end day to 30 when the start day is the last
day of February and the end day is 31 (after moving both last days of February to 30 when the
start is one). The calculator moves the start day only: YEARFRAC(DATE(2019,2,28),DATE(2020,1,31),
0) = 0.919444444444444 (want 0.916666666666667), YEARFRAC(DATE(2020,2,29),DATE(2020,5,31),0) =
0.252777777777778 (want 0.25). DAYS360, which shares the rule, is right.
'''

[[bug]]
id = "excelize/44"
title = "WEEKNUM with return type 21 gives the calendar week where the ISO year differs"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIsoWeekYear"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Return type 21 of WEEKNUM is the ISO week number, the same as ISOWEEKNUM. The calculator has
its own count for type 21 that goes wrong whenever the ISO year is not the calendar year: the
first days of January belonging to week 52 or 53 of the previous year, WEEKNUM(DATE(2016,1,1),21)
= 52 (want 53), WEEKNUM(DATE(2021,1,1),21) = 53 is right, and the last days of December belonging
to week 1 of the next year, which come out as 53: WEEKNUM(DATE(2019,12,30),21) = 53 (want 1),
WEEKNUM(DATE(2024,12,30),21) = 53 (want 1). ISOWEEKNUM(DATE(2019,12,30)) = 1 is right.
'''

[[bug]]
id = "excelize/45"
title = "NETWORKDAYS and WORKDAY count a holiday listed twice as two days"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHolidayDuplicates"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Excel treats the holidays range as a set: a date listed twice is one holiday. The calculator
subtracts one working day per entry: with 6 January 2020 in both cells of A1:A2,
NETWORKDAYS(DATE(2020,1,1),DATE(2020,1,31),A1:A2) = 21 (want 22) and WORKDAY(DATE(2020,1,1),5,
A1:A2) = 43840 (want 43839, 9 January 2020). NETWORKDAYS.INTL and WORKDAY.INTL share the code.
'''

[[bug]]
id = "excelize/46"
title = "WORKDAY with negative days skips only the holidays before the first one found"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWorkdayNegativeHolidays"
found = { commit = "57de10731fd42ad0ebbf7ba29030d5032b5f7d18", version = "v2.11.0+38 (57de107)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Walking backwards, WORKDAY and WORKDAY.INTL step over the holidays in a loop over the sorted
holiday list that breaks at the first holiday before the current day, so when a holiday earlier
than the span precedes one inside it, the inside one is not skipped: with holidays 2 December
2019 and 8 January 2020 in A1:A2, WORKDAY(43840,-3,A1:A2) = 43837 (7 January 2020; want 43836,
6 January 2020: 9, 7 and 6 January, the 8th being a holiday). With the 8th alone, or with a
positive count, the result is right.
'''

