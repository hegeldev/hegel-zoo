[[bug]]
id = "koanf/1"
title = "A strict Load that fails with a type error has already merged part of the map, and Keys() no longer matches Raw()"
kind = "logic"
severity = "medium"
test = "TestHegelPinStrictLoadIsAtomic"
found = { commit = "6ad56fee6a6b24eaf57ad96063ff2021a7acb6b7", version = "v2.3.6+ (master, 2026-08-09)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
maps.MergeStrict merges key by key and returns at the first type mismatch, so the keys visited
before it (which ones depends on Go's map iteration order) are already written into confMap
when Load returns the error; koanf.merge then returns without recomputing confMapFlat and
keyMap. With StrictMerge, `{m: {k: 1}}` loaded and then `{m: {k: "x"}, n: 2}`: Load fails as
documented, but in about one run in eight Raw() is `{m: {k: 1}, n: 2}` while Keys() is still
`[m.k]` and Exists("n") is false; the next successful Load makes n visible. The README
presents strict merging as the way to refuse a conflicting file; the refused file must not be
half applied. The same holds for Merge, MergeAt and Set on a strict instance. Fix: check the
types first (or merge into a copy) and assign confMap only on success.
'''

[[bug]]
id = "koanf/2"
title = "Set with a map value merges it into the existing map at the key instead of setting it"
kind = "logic"
severity = "low"
test = "TestHegelPinSetReplacesTheValue"
found = { commit = "6ad56fee6a6b24eaf57ad96063ff2021a7acb6b7", version = "v2.3.6+ (master, 2026-08-09)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Set is documented as "sets the value at a specific key" and is implemented as a merge of
`Unflatten({key: val})`. A scalar value replaces whatever is at the key, but a map value is
merged into the existing map: with `{db: {host: h, port: 1}}` loaded, `Set("db", {host: x})`
leaves `{db: {host: x, port: 1}}`, and `Set("db", map[string]any{})` changes nothing, so
Get("db") is not the value that was set. Either Set should replace the sub map (delete the
path first) or its documentation should say that a map value is merged.
'''

[[bug]]
id = "koanf/3"
title = "Load keeps the provider's maps and slices by reference: a later Load writes into the first provider's map"
kind = "logic"
severity = "medium"
test = "TestHegelPinLoadCopiesTheProvider"
found = { commit = "6ad56fee6a6b24eaf57ad96063ff2021a7acb6b7", version = "v2.3.6+ (master, 2026-08-09)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
koanf.merge hands the provider's map to maps.Merge, which stores its nested maps and slices
in confMap without copying (its own comment says so), and IntfaceKeysToStrings rewrites the
provider's slices in place. Consequences: `defaults := {server: {port: 8080}}`;
`k.Load(confmap.Provider(defaults, ""), nil)`; `k.Load(<file with server.port 9090>)` sets
`defaults["server"]["port"]` to 9090, so a defaults map shared by several instances (or
reused after a reload) is silently changed by the second file; and a slice in the provider's
map is the configuration's slice, so `defaults["tags"][0] = "changed"` changes k.Strings("tags").
Get, Raw, All, Cut and Copy all copy on the way out (Get "copies with maps.Copy or
json.Marshal" so that callers cannot alter the configuration), so the asymmetry on the way in
looks unintended. Fix: maps.Copy the incoming map in merge before merging it.
'''

[[bug]]
id = "koanf/4"
title = "Float64 returns +/-Inf for a numeric string outside float64's range, while Float64s and Float64Map return nothing for it"
kind = "logic"
severity = "low"
test = "TestHegelPinFloat64OutOfRangeIsZero"
found = { commit = "6ad56fee6a6b24eaf57ad96063ff2021a7acb6b7", version = "v2.3.6+ (master, 2026-08-09)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
toFloat64 returns strconv.ParseFloat's value together with its error; on a range error that
value is +/-Inf (or 0 for an underflow). Float64 ignores the error and returns the value, so
Float64("a") with a = "1e400" is +Inf although the documentation says "0 if ... the value is
not a valid float64"; Float64s and Float64Map check the error and return an empty slice / map
for the same string. toInt64 by contrast rejects out-of-range values explicitly. Fix: return 0
when err != nil in Float64 (or in toFloat64).
'''

[[bug]]
id = "koanf/5"
title = "IntfaceKeysToStrings misses a map[any]any inside a slice inside a slice"
kind = "logic"
severity = "low"
test = "TestHegelPinNestedSliceMapsConverted"
found = { commit = "6ad56fee6a6b24eaf57ad96063ff2021a7acb6b7", version = "v2.3.6+ (master, 2026-08-09)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
maps.IntfaceKeysToStrings is documented to "recursively convert map[any]any to
map[string]any"; it handles a map inside a []any element but does not descend into a []any
element of a []any, so `{a: [[{b: 1}]]}` with the inner map keyed by interface (as YAML's
`a: [[{b: 1}]]` gives with yaml.v2-style decoders) stays a map[interface{}]interface{} in the
configuration: Get("a") returns it unconverted, JSON marshalling of the configuration fails
on it, and Unmarshal into a struct sees a map it cannot match by name. Fix: make the slice
case recursive (a helper that converts any value).
'''

[[bug]]
id = "koanf/6"
title = "Set on an existing key path whose key contains the delimiter creates a second structure, and Get then returns either value at random"
kind = "logic"
severity = "medium"
test = "TestHegelPinSetOnKeyWithDelimiterIsDeterministic"
found = { commit = "6ad56fee6a6b24eaf57ad96063ff2021a7acb6b7", version = "v2.3.6+ (master, 2026-08-09)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A loaded map may contain keys with the delimiter in them (`{hosts: {"example.com": {port: 1}}}`
with delimiter "."): Flatten joins them to "hosts.example.com.port", the key map remembers
the parts, and Exists/Get/Delete work through it. Set (and MergeAt) instead split the given
path on the delimiter, so `Set("hosts.example.com.port", 2)` builds
`{hosts: {example: {com: {port: 2}}}}` and merges it beside the existing entry. Both flatten
to the same key, and which one the key map keeps depends on map iteration order: across 100
runs Get("hosts.example.com.port") was 2 in 88 and 1 in 12. Keys() and All() show one entry
and Raw() two structures. Set should resolve an existing path through the key map (as Get and
Delete do) before falling back to splitting, or refuse a path that is ambiguous.
'''
