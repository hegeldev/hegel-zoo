[[bug]]
id = "simplefeatures/5"
title = "TWKB round trip of a MultiPolygon or GeometryCollection with an empty member loses Z and M"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTWKBEmptyMemberLosesZ"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MarshalTWKB(MULTIPOLYGON Z (EMPTY, ((0 0 1, 1 0 1, 1 1 1, 0 0 1))), 0) is
06 08 01 02 00 01 03 00 00 02 02 00 00 00 02 00: the extended-dimensions byte declares Z and
the Z deltas are written, yet UnmarshalTWKB gives MULTIPOLYGON (EMPTY, ((0 0, 1 0, 1 1, 0 0))):
the empty polygon is rebuilt as XY and the multipolygon is forced to the lowest dimension. The
same with M, and with an empty polygon anywhere in the multipolygon; a MultiLineString with an
empty member keeps its Z. A GeometryCollection loses it another way: its empty member is
written as a bare empty flag (01 10, no extended byte), so GEOMETRYCOLLECTION Z (POINT Z EMPTY,
POINT Z (1 1 2)) comes back as GEOMETRYCOLLECTION (POINT EMPTY, POINT (1 1)). Found by
TestHegelTWKBRoundTrip.
'''

[[bug]]
id = "simplefeatures/6"
title = "A prepared polygon's Contains and Covers fail with a recovered panic when the test geometry holds an empty point or a nested MultiPoint"
kind = "crash"
severity = "medium"
test = "TestHegelPinPreparedPuntalPanics"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With p, _ := geom.Prepare(POLYGON ((0 0.25, 0.25 0.25, 0.25 0, 0 0, 0 0.25))):

- p.Contains(MULTIPOINT ((0.1 0.1), EMPTY)) and p.Covers of it return (false, "panic: runtime
  error: invalid memory address or nil pointer dereference"); geom.Contains gives true. The same
  for GEOMETRYCOLLECTION (POINT (0.1 0.1), POINT EMPTY).
- p.Contains(GEOMETRYCOLLECTION (MULTIPOINT ((0.2 0.2)))) returns (false, "panic: cannot cast
  *jts.Geom_MultiPoint to *jts.Geom_Point"), and a nested collection "cannot cast
  *jts.Geom_GeometryCollection to *jts.Geom_Point"; geom.Contains gives true.

The prepared geometry is the JTS port's PreparedPolygon (internal/jtsport/jts). For a test
geometry of dimension 0 AbstractPreparedPolygonContains.eval takes the point path,
PreparedPolygonPredicate.isAllTestPointsInTarget, which casts every top-level member to a Point
and passes its coordinate to the point locator: an empty point's coordinate is nil and a
MultiPoint or collection member is not a Point (the line and polygon paths go through
ComponentCoordinateExtracter, which skips empty components and descends). PreparedGeometry.eval
recovers the panic into the error, so callers see a runtime error message for valid inputs the
plain predicates answer. A MultiPoint that does not reach the polygon's envelope is answered
first by the envelope test and does not fail; a prepared line or point is unaffected;
ContainsProperly, Intersects, Disjoint, Within, CoveredBy take other paths. Found by
TestHegelPreparedAgrees.
'''

[[bug]]
id = "simplefeatures/7"
title = "Prepared predicates misjudge a GeometryCollection whose members overlap: a point inside a polygon member touches it, overlapping areal members fail with a recovered panic"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPreparedCollectionOverlap"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
a = POINT (-2 0), b = GEOMETRYCOLLECTION (LINESTRING (-1 2, -2 0), POLYGON ((2 3, 0 4, -4 -2,
-3 -4, -2 -4, 2 3))), both valid: the point ends the line and lies inside the polygon, so
geom.Relate(a, b) is 0FFFFF212 (as GEOS says), geom.Touches false and geom.Within true. With
p, _ := geom.Prepare(a): p.Touches(b) is true and p.Within(b) false; geom.Prepare(b) then
Touches(a) is true as well. The point is taken to lie on b's boundary because it ends the line
member, and the polygon member's interior around it is not consulted: the JTS port's RelateOp
labels each member of a collection on its own and does not resolve a collection's overlapping
members (the plain predicates do, and so does GEOS's RelateNG).

With two areal members that overlap, b = GEOMETRYCOLLECTION (LINESTRING (-1 2, 4 -3, 4 2, 4 -2,
-2 0), MULTIPOLYGON (((-1 0, 0 0, 0 -2, -1 -2, -1 0))), POLYGON ((2 3, 0 4, -4 -2, -3 -4, -2 -4,
2 3))), p.Touches, p.CoveredBy, p.Within and p.Overlaps return (false, "panic: side location
conflict [ (-0.857..., -2, NaN) ]") (a JTS TopologyException recovered by
PreparedGeometry.eval) while the plain predicates answer; p.ContainsProperly of a collection
returns "panic: Operation does not support GeometryCollection arguments". Nothing in the
PreparedGeometry documentation excludes collections, which the plain predicates accept. Found by
TestHegelPreparedAgrees.
'''

