[[bug]]
id = "simplefeatures/12"
title = "Prepared Overlaps is false for two lines that share a segment which a segment of one of them crosses at a non-representable point"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPreparedOverlapsSharedSegmentCrossed"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-09-28" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
a = LINESTRING (0 0, 0 1, 4 0, 0 0), b = LINESTRING (0 1, 4 0, 3 2, 2.9 0.1): the two share the
segment (0 1)-(4 0), and b's segment (3 2)-(2.9 0.1) crosses it properly at a point that is not
representable in floating point. Plain geom.Overlaps is true and geom.Relate gives 101FFF102
(GEOS RelateNG agrees); the prepared Overlaps is false. With the crossing at a grid point
((3 2)-(3 0.1)) the two agree; a need not be closed (LINESTRING (-4 2, 4 0) fails too).
Over random such pairs about 62% of inexact crossings fail and no exact one does. JTS 1.20's
old RelateOp gives 0F1FFF1F2 (interior-interior dimension 0) for the pair, so the defect is
inherited from the JTS port. Found under HEGEL_NO_KNOWN=1 while triaging the weekly run of
2026-09-28.
'''
