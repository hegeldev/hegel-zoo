[[bug]]
id = "simplefeatures/1"
title = "Simplify is not Ramer-Douglas-Peucker: it drops vertices farther than the threshold from its result"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSimplifyStrays"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Geometry.Simplify is documented as the Ramer-Douglas-Peucker algorithm. geom/alg_simplify.go
instead sweeps forward: from the current start it shrinks the candidate end until every vertex
between is within the threshold of the infinite line through start and end, then makes that end
the next start. Two consequences, both absent from RDP (and from GEOS/JTS, which keep the
farthest vertex recursively and measure the distance to the segment):

- a vertex can end up farther than the threshold from the result. Simplify(0.5) of
  LINESTRING (0.1 4.06, 0.64 7.11, -0.25 -3.79, -1.28 -0.96) gives
  LINESTRING (0.1 4.06, -0.25 -3.79, -1.28 -0.96): the dropped vertex (0.64 7.11) is 3.10 from it.
  The sweep accepted it because it is 0.4 from the infinite line through (0.1 4.06) and
  (-0.25 -3.79), whose segment ends far before it.
- vertices RDP keeps are dropped, and vice versa: LINESTRING (-3 3, -4 4, 3 -4, -3 2) at 0.25
  loses (-4 4), which is 1.41 from the segment (-3 3)-(3 -4) that replaces it (0.11 from the
  infinite line); LINESTRING (1 2, 3 -3, 3 3, -3 -1, -4 -1, 0 3) at 1 keeps (-3 -1) where RDP
  keeps (-4 -1).

TestHegelSimplifyStaysClose checks the guarantee (every input vertex within the threshold of the
result) and reaches this on about 2% of generated lines; TestHegelDensifySimplifyMatchesGEOS
compares against GEOS's RDP.
'''

[[bug]]
id = "simplefeatures/2"
title = "MarshalTWKB of an empty geometry writes the size and bounding box bytes without setting their header bits"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTWKBEmptyHeaders"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MarshalTWKB(POINT EMPTY, 0) is 01 10 (type/precision, then the metadata byte with only the
is-empty bit). With TWKBSizeHeader() it is 01 10 00, with TWKBBoundingBoxHeader() 01 10 00 00
00 00, with both 01 10 04 00 00 00 00: the size varint and the bounding box are appended, but the
metadata byte still says neither is present (twkb_write.go's writeIsEmptyHeader writes only the
empty bit, "we do not write any extended info, size, bbox, or ids", while the buffers assembled
afterwards keep them). A reader following the header finds trailing bytes, and
UnmarshalTWKBSize reports has=false for the output of a writer asked for a size header (the size
header exists for skipping over geometries in a stream; a consumer relying on it cannot). The
same for every empty geometry type, and for empty members of a collection, whose child writers
inherit the size header: MarshalTWKB(GEOMETRYCOLLECTION (POINT EMPTY, POINT (1 1)), 0,
TWKBSizeHeader()) is 07 02 09 02 01 10 00 01 02 02 02 02, and UnmarshalTWKB fails on it ("TWKB
parsing error at byte 12: unsupported geometry type 0"): the undeclared 00 after the empty
point's flag is read as the next member's type. Found by TestHegelTWKBRoundTrip.
'''

[[bug]]
id = "simplefeatures/3"
title = "MarshalTWKB writes an all-zero bounding box for a GeometryCollection"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTWKBCollectionBBox"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MarshalTWKB(GEOMETRYCOLLECTION (POINT (-1 -2)), 0, TWKBBoundingBoxHeader()) is
07 01 00 00 00 00 01 01 00 01 03: the bbox bit is set and the four bounding box varints are all
zero, so UnmarshalTWKBEnvelope gives ENVELOPE(0 0, 0 0) for a geometry at (-1 -2). The
sub-geometries are written by child writers ("No bbox in sub-geometries", twkb_write.go) and
the parent's bounding box is never widened by their coordinates; for every other type the box
is right. A consumer filtering a TWKB stream by its bounding boxes never finds a collection.
Found by TestHegelTWKBRoundTrip.
'''

