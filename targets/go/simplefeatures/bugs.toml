[[bug]]
id = "simplefeatures/15"
title = "Intersects of a point an ulp off a segment is true: the plain float64 cross product absorbs the nudge, while Relate's robust orientation says disjoint and Disjoint is true at the same time"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIntersectsPointAnUlpOffASegment"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-10-08" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Intersects(LINESTRING (0 -2, -4 0), POINT (-2 -0.9999999999999999)) is true: the point is
1.1e-16 above the segment's midpoint (-2 -1), off the segment in exact arithmetic, and
geom/line.go's intersectsXY decides by (x-ax)*(by-ay) == (y-ay)*(bx-ax) in float64, where
y-ay = 1.0000000000000001 rounds to 1 and the two products agree. Relate uses robust
orientation and gives FF1FF00F2 (disjoint), so Disjoint, which goes through it, is true at the
same time; GEOS 3.13.1 says intersects false. The smallest case: LINESTRING (0 1, 1 0) and
POINT (0.5 0.49999999999999994). Over every segment between integer vertices in [-10, 10]^2
off the axes, the midpoint nudged one ulp in one coordinate, toward or away from zero,
intersects exactly when the float64 cross product vanishes (no exception in 176400 segments);
about half the nudges are absorbed and three segments in four have an absorbed nudge. The
order of the operands does not matter, and a polygon whose edge the segment is intersects the
point too. Found by the predicate property under HEGEL_NO_KNOWN=1 at a thousand cases, once in
about six thousand (a wild coordinate), once the shapes of bugs 13 and 14 were named; counted
as a candidate (2026-10-08) and reproduced standalone the same day.
'''
