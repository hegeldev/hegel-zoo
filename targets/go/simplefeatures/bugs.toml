[[bug]]
id = "simplefeatures/13"
title = "Buffer of a closed line whose inside the distance erodes keeps the hole-side offset curve: a mitre spike at a sharp notch pokes past the outer curve, a tiny triangle gets a spurious hole"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBufferErodedRingHoleSide"
found = { commit = "896784c3b5d5bee03a3a71f76bfa27028ebd1af1", version = "v0.59.0+17", hegel = "v0.6.33", date = "2026-10-08" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Buffer(2, mitre limit 5) of LINESTRING (0 0, 3 0, 1 1, 3 2, 0 2, 0 0), a ring with a notch from
its right side to the tip (1 1), reaches x = -3.47 (area 63.92): nothing of the ring is left of
x = 0, and the outer offset curve's mitres at the right-angled corners stay at x = -2. GEOS 3.13.1
(and JTS 1.20) give the polygon (-2 -2, -2 4, 11.47 4, 5.47 1, 11.47 -2, -2 -2), area 62.83.
The extra is the mitre spike of the hole-side offset curve at the notch tip: the inside of the
ring is eroded completely at distance 2 (the ring is 2 high), so that curve should not exist, but
the port's addRingBothSides (internal/jtsport/jts/operation_buffer_buffer_curve_set_builder.go)
always generates both sides of a ring. JTS 1.20's addLinearRingSides skips the hole side when
isRingFullyEroded says the inside is gone (a triangle whose inradius is under the distance, a
longer ring whose envelope is narrower than twice the distance), which GEOS 3.13 adopted to
remove such artifacts (libgeos/geos#1223). The spike is min(limit, 1/sin(half the notch's
opening angle)) times the distance long, so it shows when the tip is nearer the far side than
that: every one of 720 notched rings (width 3-6, height 1-2, tip 0.5-1 from the far side,
distance 2-3, limit 2 or 5, mirrored, rotated and offset) differs from GEOS, chevrons with a
blunt notch agree, and at mitre limit 1 only a very sharp notch differs (the star
LINESTRING (0 2, 0 0, 2 1, 0 -1, 3 1, 0 2) at distance 2: area 38.82 against 38.71 at limit 1,
53.63 against 50.06 at 2, 80.26 against 66.00 at 5). Round and bevel joins agree there, but a
triangle with sides of a hundredth of the distance or less shows the same missing skip under
any join: Buffer(1) of LINESTRING (0 0, 0 0.01, 0.01 0, 0 0) is a disc with a triangular hole
(area 2.01 against GEOS's 3.16), and at sides of 0.005 and 0.002 the hole is nearly the whole
disc (area 0.03 and 0.01); squares that small, and triangles of a fiftieth of the distance,
agree. The spike was counted as a candidate by the buffer property while its generators were
rewritten (2026-10-08) and reproduced standalone the same day; the hole was found by the same
property once the shape was named.
'''

