# Bugs found in muesli/reflow by the Hegel properties. Each is pinned by the test named in
# `test`, listed as an expected failure in target.toml.

[[bug]]
id = "reflow/1"
title = "wordwrap writes a breakpoint character without counting it, so lines with hyphens exceed the limit"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinWordWrapCountsBreakpoints"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`wordwrap.String("ab-cd-ef", 5)` = "ab-cd-\nef": the first line is six cells wide;
`wordwrap.String("aa-bb", 4)` = "aa-bb" (five). wordwrap.go `Write`, the Breakpoints branch:
`w.addSpace(); w.addWord(); w.buf.WriteRune(c)` — the hyphen goes to the buffer but `lineLen`
is not increased, so every breakpoint on a line is a cell the wrapper does not know about and
the next word is allowed one cell too many per hyphen. The README's promise is lines within
the limit; hyphenated words are ordinary text, and the wrap+wordwrap combination the README
recommends then splits the overflowing line at an arbitrary character. Fix: `w.lineLen +=
runewidth.RuneWidth(c)` after writing the breakpoint (and consider breaking before it when
the line is already full).
'''

[[bug]]
id = "reflow/2"
title = "wordwrap does not move a word at least as wide as the limit to its own line when the current line holds at most two cells"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWordWrapBreaksBeforeAWordAsWideAsTheLimit"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`wordwrap.String("a bc", 1)` = "a bc" (want "a\nbc"), `wordwrap.String("a 日", 2)` = "a 日"
(want "a\n日"), `wordwrap.String(" 😀A", 3)` keeps the leading space and is four cells wide
although "😀A" fits the limit alone. The break condition in `Write` is `lineLen + spaces +
wordWidth > Limit && wordWidth < Limit`: the second clause means "do not break before a word
that will not fit anyway", but it is evaluated at the rune that overflows, when the word may
have just reached the limit — then the word would fit on a line of its own and is not given
one. The shape needs the preceding content to be at most two cells (a one-character word plus
a space, a leading space, or any content at limits 1 and 2), so it mostly bites narrow columns
and wide characters. Fix: break whenever there is content before the word (`lineLen > 0 ||
spaces > 0`), independent of the word's width.
'''

[[bug]]
id = "reflow/3"
title = "wordwrap measures whitespace in bytes, so a no-break space counts two cells and an ideographic space three"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWordWrapMeasuresSpacesByWidth"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`wordwrap.String("a bc", 4)` = "a\nbc": the text is four cells wide and fits, but
`addSpace` adds `w.space.Len()` — the byte length of the whitespace buffer — to `lineLen`, and
the overflow test uses the same byte count, so U+00A0 counts 2 and U+3000 counts 3 (its
real width is 2). Texts using no-break spaces (the usual way to keep "10 km" together) wrap a
cell or two early, and the space that caused it is dropped at the break. Fix: keep the
whitespace buffer's printable width (an `ansi.Buffer`, as the word buffer is) instead of its
length.
'''

[[bug]]
id = "reflow/4"
title = "wordwrap keeps trailing whitespace past the limit when an escape sequence follows it before the newline"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWordWrapIsTransparentToASequenceBeforeANewline"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`wordwrap.String("a \n b", 1)` drops the trailing space that would exceed the limit ("a\nb");
`wordwrap.String("a \x1b[0m\nb", 1)` keeps it: "a \x1b[0m\nb". At a newline the code asks
`w.word.Len() == 0` to decide whether it is looking at trailing whitespace, and the word buffer
also collects escape sequences, so a reset (or any sequence) between the whitespace and the
newline makes the whitespace look like a word and it is flushed with `addWord`. The output
therefore depends on the styling, which the README says never affects the algorithm. Fix:
test the word buffer's printable width, not its length.
'''

[[bug]]
id = "reflow/5"
title = "wrap writes a chunk that fits the limit raw: tabs are not expanded and newlines are kept with KeepNewlines = false"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWrapFastPathExpandsTabsAndDropsNewlines"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`wrap.String("a\tb", 10)` = "a\tb" but `wrap.String("a\tb", 5)` = "a    \nb"; a writer with
`KeepNewlines = false` turns "ab\ncd" into "ab\ncd" at limit 10 and into "abcd" at limit 3.
wrap.go `Write` computes `s` (tabs replaced by TabWidth spaces, newlines removed when not
kept) and its width, then `if w.Limit <= 0 || w.lineLen+width <= w.Limit { return
w.buf.Write(b) }` — the original bytes, not `s`. Whether the documented TabWidth and
KeepNewlines settings take effect thus depends on whether the text happens to fit, and
short texts are the common case. Fix: write `s`.
'''

[[bug]]
id = "reflow/6"
title = "wrap's fast path ignores the wrapping state: a fitting chunk adds its whole width to the current line and skips the whitespace handling after a forced break"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWrapWriterTracksTheCurrentLine"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
A `wrap.Writer` with limit 4 given "ab\ncd" and then "ef" produces "ab\ncd\nef"; the same
text in one write is "ab\ncdef". When a chunk fits whole, `Write` does `w.lineLen += width`
with the chunk's total printable width — across its newlines — so after "ab\ncd" the writer
believes the current line is four cells long, not two, and breaks the next chunk at once.
The same path writes the chunk without looking at `forcefulNewline`, so leading whitespace
that the previous chunk's forced break should drop is kept when it arrives in a chunk of its
own (`"  "` then `" "` at limit 1: " \n " instead of " \n"), and a chunk that splits an escape
sequence has its tail counted as text. An io.Writer fed line by line, the natural use, wraps
wrongly from the second write on. Fix: run every chunk through the rune loop, or make the
fast path update `lineLen` from the width after the last newline and respect the state.
'''

[[bug]]
id = "reflow/7"
title = "indent and padding end an escape sequence only at a letter, while ansi.IsTerminator also ends it at '@'"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIndentAndPaddingTerminateSequencesLikeAnsi"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
indent.go and padding.go carry their own copy of the terminator test, `(c >= 0x41 && c <=
0x5a) || (c >= 0x61 && c <= 0x7a)`, while ansi.go's `IsTerminator` (used by wordwrap, wrap,
truncate and `PrintableRuneWidth`) starts the range at 0x40. A CSI sequence ending in '@'
(ICH, "insert characters": `ESC [ 2 @`) is complete for the width functions but not for indent
and padding, which stay in "inside a sequence" mode until the next letter of the text:
`indent.String("\x1b[1@ab\ncd", 2)` puts the indentation between "a" and "b", and
`padding.String` pads the line one cell too far because the "a" was not counted. Fix: use
`ansi.IsTerminator` in both packages.
'''

[[bug]]
id = "reflow/8"
title = "padding resets the active style at the end of every line and does not restore it, so a style spanning lines ends after the first"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPaddingKeepsStylesAcrossLines"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`padding.String("\x1b[31ma\nb\x1b[0m", 3)` = "\x1b[31ma  \x1b[0m\nb  ": in the input "b" is
red, in the output it is not. padding.go `Write`, on a newline: `w.pad(); w.ansiWriter.
ResetAnsi()` — the reset is written before the newline so the padding does not bleed into the
next line, but nothing re-emits the sequences that were in force (`ansi.Writer` keeps them in
`LastSequence()` and indent.go calls `RestoreAnsi()` for exactly this). Any multi-line styled
block (a coloured code listing, a highlighted paragraph) loses its style on every line but the
first when padded — and `margin`, which is indent then padding, inherits it. Fix: `RestoreAnsi()`
after the newline (or reset only when a style is active and restore it before the next
printable rune, as indent does).
'''

[[bug]]
id = "reflow/9"
title = "margin.Writer.Write feeds the whole indented buffer so far to the padder on every call, duplicating earlier chunks"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinMarginWriterDoesNotRepeatEarlierWrites"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
A `margin.Writer` (width 6, margin 2) given "ab\n" and then "cd" produces "  ab  \n  ab  \n
cd  " — the first chunk twice; `margin.String("ab\ncd", 6, 2)` is "  ab  \n  cd  ". margin.go
`Write`: `w.iw.Write(b); w.pw.Write(w.iw.Bytes())` — `iw.Bytes()` is the indent writer's whole
accumulated buffer, never reset, so the n-th Write pads chunks 1..n again. Every io.Writer use
of the package (the README's `f.Write(b)` pattern with more than one write, `io.Copy`,
`fmt.Fprintf` per line) produces output that grows quadratically with the input and repeats
lines. Fix: pipe the indent writer into the padding writer (`indent.NewWriterPipe(pw, …)`) or
reset the indent buffer after handing it over.
'''

[[bug]]
id = "reflow/10"
title = "truncate.Writer restarts the printed width at zero in every Write, so text spread over several writes is never truncated"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTruncateWriterCountsAcrossWrites"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`truncate.NewWriter(6, "")` given "abcde" and then "fghij" holds "abcdefghij" — ten cells for
a width of six. truncate.go `Write` declares `var curWidth uint` inside the method: each call
counts from zero, only a single Write wider than the width is ever cut, and the buffer keeps
growing. The Writer type exists for streaming (`NewWriterPipe` forwards to another writer),
and with it a column that must stay within a width does not. Fix: keep the printed width in
the Writer.
'''

[[bug]]
id = "reflow/11"
title = "truncate.Writer subtracts the tail's width from its width on every Write"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTruncateWriterSubtractsTheTailOnce"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`truncate.NewWriter(10, "...")` given "abc", "def", "gh" holds "abcdefg...": eight cells fit
in ten, but `Write` does `w.width -= uint(tw)` unconditionally, so after three calls the width
is 1 and the third chunk is cut (and with reflow/10 the count restarted, so "g" survived and
"h" did not — the cut is at a meaningless place). A long-lived writer with a tail shrinks to
nothing and, once `w.width < tw`, emits the tail for every write. Fix: compute the budget
from a constant width, not by mutating it.
'''

[[bug]]
id = "reflow/12"
title = "truncate emits the tail whatever the input when the tail is wider than the width, even for text that fits or is empty"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTruncateKeepsInputThatFitsWhenTheTailIsWider"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`truncate.StringWithTail("ab", 2, "...")` = "..." and `truncate.StringWithTail("", 2, "...")`
= "...": the input fits (or is empty) yet is replaced by a tail three cells wide, wider than
the width itself. truncate.go `Write`: `if w.width < uint(tw) { return w.buf.WriteString(
w.tail) }` before looking at the input. A tail like "..." or "…" with narrow columns (a
two-cell status column) turns every value, including blanks, into dots. Fix: return the
input when it fits; when it does not and the tail cannot fit either, cut without a tail (or
cut the tail).
'''

[[bug]]
id = "reflow/13"
title = "dedent ignores lines without indentation when computing the common indentation, so indented lines lose theirs"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDedentCountsUnindentedLines"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`dedent.String("a\n  b")` = "a\nb" (want the input: the lines share no indentation);
`dedent.String("  a\nb\n    c")` = "a\nb\n  c". dedent.go `minIndent`: `if curIndent > 0 &&
(minIndent == 0 || curIndent < minIndent)` — a non-blank line with zero indentation never sets
the minimum, so the minimum is taken over the indented lines only and the documented
"maximum indentation shared by all lines" becomes "shared by the indented lines". Relative
indentation — a heading followed by an indented paragraph, a code block under a list item — is
flattened, and the function is not idempotent (`dedent(dedent(" 1\n  2"))` = "1\n2"). Fix:
record zero for a line whose first byte is not whitespace (blank lines excepted, as now).
'''

[[bug]]
id = "reflow/14"
title = "dedent counts a tab and a space as the same indentation, so lines indented with different characters are both stripped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDedentDoesNotMixTabsAndSpaces"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`dedent.String("\ta\n b")` = "a\nb": one line is indented with a tab, the other with a space,
they share no indentation, and both lose their first byte. `minIndent` counts `' '` and `'\t'`
alike and `dedent` removes that many bytes of either kind. Python's textwrap.dedent, which the
package mirrors, compares the whitespace prefixes as strings and leaves such text alone. In
mixed files the result changes the relative indentation of tab- and space-indented lines. Fix:
take the longest common whitespace prefix of the non-blank lines, byte by byte.
'''

[[bug]]
id = "reflow/15"
title = "every writer decodes each Write on its own, so a multi-byte rune split over two writes becomes two U+FFFD"
kind = "contract"
severity = "medium"
test = "TestHegelPinWritersKeepRunesSplitAcrossWrites"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`indent.NewWriter(1, nil)` given the two bytes of "é" one per Write holds " ��";
padding, truncate, wordwrap, wrap and ansi.Writer do the same. Each `Write` runs `for _, c :=
range string(b)` and re-encodes `c`, so a rune whose bytes straddle a Write boundary is
decoded as two invalid bytes and written as two replacement characters. io.Writer makes no
promise about chunk boundaries — `io.Copy` with a small buffer, `bufio.Writer` flushes and
network reads all split runes — and the packages are offered as io.Writers. Fix: keep the
incomplete trailing bytes of a Write (up to utf8.UTFMax - 1) and prepend them to the next.
'''

[[bug]]
id = "reflow/16"
title = "every writer rewrites invalid UTF-8 bytes as U+FFFD instead of passing them through"
kind = "contract"
severity = "low"
test = "TestHegelPinWritersPassInvalidBytesThrough"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`indent.String("a\xffb", 1)` = " a�b": the invalid byte comes out as the three bytes
EF BF BD; padding, truncate, wordwrap and wrap (when the text does not fit) do the same, since
each writes `string(c)` of the decoded rune. A text filter that changes bytes it does not
understand is not transparent: Latin-1 log lines or binary-ish terminal output grow and lose
their original bytes. Fix: write the original byte slice for an invalid sequence (`utf8.
DecodeRune` reports size 1 for it) or state the UTF-8 requirement.
'''

[[bug]]
id = "reflow/17"
title = "widths are summed per rune, so ZWJ emoji sequences and modifier sequences count more cells than go-runewidth's StringWidth"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPrintableRuneWidthMeasuresGraphemeClusters"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`ansi.PrintableRuneWidth("\U0001F468‍\U0001F469")` = 4 and `truncate.String` of it at
width 2 cuts it in half, while `runewidth.StringWidth` — the library's own width dependency,
which measures grapheme clusters — says 2, as terminals render it. `PrintableRuneWidth`,
wordwrap, wrap, truncate and padding all add `runewidth.RuneWidth` per rune (padding calls
`StringWidth(string(c))`, also per rune). A family emoji or a skin-toned thumbs-up is counted
as two glyphs: truncation cuts inside the cluster (leaving a broken sequence), padding falls
short, wrapping happens early. Fix: measure whole strings with `runewidth.StringWidth` (or
uniseg's grapheme iterator) at the word/line level.
'''

[[bug]]
id = "reflow/18"
title = "truncate reserves the tail's width even when the text fits, truncating text wider than width minus the tail"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTruncateKeepsTextThatFits"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`truncate.StringWithTail("Hello", 5, "…")` = "Hell…" and `truncate.StringWithTail("ab", 2,
".")` = "a.": the text fits the width exactly and is still cut to make room for a tail that is
only needed when something is cut. truncate.go `Write` does `w.width -= uint(tw)` up front
and truncates at that reduced width regardless of the text's total width. go-runewidth's
`Truncate` (and every "ellipsize" function) returns the text unchanged when it fits; here
every value exactly filling a column loses its last character to an ellipsis. Fix: compare
the full text's width with the width first; reserve the tail only when truncation happens.
'''

[[bug]]
id = "reflow/19"
title = "wordwrap with KeepNewlines = false trims every Write call on its own, losing whitespace at chunk boundaries"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWordWrapFoldsAcrossWrites"
found = { commit = "83f63799117108248750298720ed34dd55d5201a", version = "v0.3.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
A `wordwrap.Writer` with `KeepNewlines = false` given "a " and then "b" holds "ab"; given
"a b" in one write it holds "a b". wordwrap.go `Write`: `s = strings.Replace(strings.TrimSpace(s),
"\n", " ", -1)` is applied to each chunk, so the space between the chunks is trimmed away
and words are glued together; a chunk ending in a newline likewise loses it and the line
break it stood for. Streaming a paragraph through the writer (the io.Writer use the README
shows) yields different words from the one-shot `String`. Fix: fold newlines into spaces per
chunk but trim only at Close.
'''
