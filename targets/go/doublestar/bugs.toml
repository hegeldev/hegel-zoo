[[bug]]
id = "doublestar/10"
title = "A `**` at the start of an alternative is treated as a segment-start doublestar even mid-segment: b{**} matches b/- although b** does not, and Glob(\"b{**}\") lists nothing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAlternativeLeadingDoublestar"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
A `**` "must begin with a path separator, otherwise we'll treat it like a single star like
bash" (match.go), tracked by the startOfSegment flag. Alternatives are matched by splicing the
alternative into the pattern and calling doMatchWithSeparator recursively from the group's
position — and the recursive call initialises startOfSegment to true. So in Match("b{**}",
"b/-") the spliced `**` right after `b` is taken as a doublestar and crosses the separator:
true, while Match("b**", "b/-") is false and the reference matcher (and bash's b{**} → b**)
say false; Match("b{**,x}", "b/-") and Match("a{**}", "a-1/a") likewise. Glob("b{**}") lists
only names starting with b in the current directory, so Match and Glob disagree. Fix: pass the
current startOfSegment into the recursive call (it is known: the rune before the `{`).
'''

