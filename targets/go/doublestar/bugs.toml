[[bug]]
id = "doublestar/8"
title = "FilepathGlob cleans the pattern, so a trailing slash no longer restricts to directories: dir/*/ returns regular files (filepath.Glob returns nothing, Glob returns directories only)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFilepathGlobTrailingSlash"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
FilepathGlob is documented as a drop-in replacement for filepath.Glob that "runs
filepath.Clean() and ToSlash() on the pattern". Clean removes a trailing slash, so
FilepathGlob(dir + "/*/") globs dir/* and returns the regular file dir/f along with the
directories, whereas filepath.Glob(dir + "/*/") returns nothing (no file name ends in a slash)
and doublestar's own Glob(fsys, "*/") returns directories only. The Clean is documented; its
consequence — three different answers for the same pattern across the three functions, and
files from a directories-only pattern — is not. Fix: remember whether the pattern ended in a
slash before cleaning and pass the restriction on to Glob.
'''

