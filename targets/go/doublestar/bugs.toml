[[bug]]
id = "doublestar/4"
title = "Whether a malformed alternative is reported depends on the name: Match(\"{a,[}\", \"a\") succeeds while Match(\"{a,[}\", \"b\") is ErrBadPattern"
kind = "contract"
severity = "low"
test = "TestHegelPinAlternativeValidationDependsOnTheName"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Alternatives are tried in order by splicing each into the pattern and recursing, returning as
soon as one matches ("if result || err != nil { return }"). A malformed alternative after a
matching one is therefore never looked at: Match("{a,[}", "a") is true, nil; Match("{a,[}",
"b") is false, ErrBadPattern; Match("{[,a}", "a") is ErrBadPattern. The doc promises "The only
possible returned error is ErrBadPattern, when pattern is malformed" — for this pattern the
error appears or not depending on the name. ValidatePattern("{a,[}") is false and Glob refuses
the pattern, so Glob and Match disagree too. Fix: validate the whole pattern once up front (as
path.Match has since Go 1.16) instead of lazily.
'''

