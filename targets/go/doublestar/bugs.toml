[[bug]]
id = "doublestar/6"
title = "Glob finds nothing when the pattern escapes a character that is not a meta character (\\f, a/\\e, \\.i), although Match accepts the same pattern"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGlobEscapedPlainCharacter"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The doc says "Any character with a special meaning can be escaped with a backslash", and Match
treats `\c` as the literal c for every c: Match("\\f", "f") is true, as in bash and
path.Match. Glob, however, decides a pattern segment has no meta characters, unescapes it with
unescapeMeta — a Replacer that only knows `\* \? \[ \] \{ \}` — and stats the result: the
path `\f` does not exist, so Glob(fsys, "\\f") is [] while the file f is there; Glob("a/\\e")
misses a/e and Glob("\\.i") misses .i (the natural way to spell "a dotfile, explicitly" under
WithNoHidden). SplitPattern's base unescaping has the same limitation. Fix: unescape every
`\c` pair, not just the six meta characters.
'''

