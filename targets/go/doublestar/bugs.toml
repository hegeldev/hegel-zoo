[[bug]]
id = "doublestar/2"
title = "Glob lists a name once per way the pattern can match it: a/**/**, **/?/** and overlapping alternatives return duplicates"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGlobDuplicatesWithConsecutiveDoublestar"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Glob and GlobWalk explore each way a pattern can be split over the tree and append every hit,
never deduplicating. For a tree with a/b/c and a/d, Glob("a/**/**") returns ["a" "a/b" "a/b/c"
"a/d" "a/b" "a/b/c"]: "a/b" and "a/b/c" once for `**` = "" and once for `**` = "b". The same
happens for two `**` segments anywhere (Glob("**/?/**") on the zoo's tree lists 1/2, 1/2/3,
1/2/3/4, a/b, a/b/c … twice, Glob("**/*/**/*/") likewise) and for alternatives that overlap
(Glob("{?,*}") on the same tree lists 1, _, a, b and f twice, since `?` and `*` both match
them; with a file f, Glob("{f,?}") lists f twice). io/fs.Glob, filepath.Glob and bash's
globstar return each name once (bash dedupes
`a/**/**`). Callers that count or iterate matches see phantom entries; GlobWalk calls the
callback twice for the same path. Fix: keep a set of emitted paths in doGlob/doGlobWalk, or
canonicalise the pattern (collapse `**/**`) and dedupe alternatives.
'''

