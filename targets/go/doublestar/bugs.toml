[[bug]]
id = "doublestar/9"
title = "With WithNoHidden a character class at the start of a segment matches a leading dot ([.a]i and [!b]i list .i), which shells never allow"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNoHiddenClassMatchesDotfile"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
WithNoHidden's doc: "This follows traditional shell glob behavior where `*` or a `?` at the
start will not match dotfiles by default. Hidden files can still be matched by explicitly
including them in the pattern." The rule as implemented covers exactly `*` and `?`: a class
is left alone, so Glob(fsys, "[.a]i", WithNoHidden()) and Glob("[!b]i", WithNoHidden()) both
list .i (Glob("?i") correctly does not). POSIX (2.13.3) and bash require a leading period to be
matched by a literal period: `[.a]i` and `[!b]i` do not match `.i` in bash without dotglob.
Fix: in the hidden check, treat a segment starting with `[` like one starting with `*` or `?`.
'''

