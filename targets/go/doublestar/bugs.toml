[[bug]]
id = "doublestar/3"
title = "An unmatched `}` is a literal when Match consumes it but ErrBadPattern when Match validates it after a mismatch; ValidatePattern and Glob refuse it"
kind = "contract"
severity = "low"
test = "TestHegelPinUnmatchedCloseBrace"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Match's default branch compares a `}` like any other rune, so Match("a}", "a}") is true with no
error; but doValidatePattern returns false for a `}` with no open group, so Match("a}", "b")
— where the mismatch on `b` makes Match validate the rest — is false with ErrBadPattern, and
ValidatePattern("a}") is false, and Glob(fsys, "a}") returns ErrBadPattern even when a file
named "a}" exists. glob.go's own comment says "technically Match() will treat an unmatched `}`
as nothing special, so... we will, too!", which is the intent; the validator disagrees. Whether
the result depends on the name (true/nil for one name, false/ErrBadPattern for another) is the
observable defect. Fix: either make doValidatePattern accept a stray `}` (and Match's
documented grammar say so) or make Match reject it always.
'''

