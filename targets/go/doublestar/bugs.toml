# Bugs found in bmatcuk/doublestar by the Hegel zoo. Oracles: path.Match / filepath.Match /
# io/fs.Glob on the shared syntax (the README calls Match, PathMatch and Glob drop-in
# replacements), a reference matcher written from the documented grammar, and bash with
# globstar on a fixed directory tree.

[[bug]]
id = "doublestar/1"
title = "Once the name is exhausted the rest of the pattern is recognised as matching the empty string only in fixed shapes: a/**/** and a*/** do not match a (a/** and */** do), **/** does not match \"\", and -**/ matches - because `**/` is special-cased even mid-segment"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinConsecutiveDoublestarZeroDirs"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
When doMatchWithSeparator runs out of name it calls isZeroLengthPattern on the remaining
pattern, which compares the remainder against a handful of literal strings: "", "*", "**",
"/**", "**/", "/**/" (and recurses into a leading `{...}`); anything else is validated and
rejected. So the documented rule "a pattern such as path/to/a/** should match path/to/a because
a might be a directory" holds for exactly one trailing `**`: Match("a/**", "a") is true but
Match("a/**/**", "a") is false, Match("**", "") is true but Match("**/**", "") is false, and
Match("*/**", "a") is true (the star consumed `a` and left "/**") but Match("a*/**", "a") is
false (the literal consumed `a` and left "*/**", not in the list). The list is also applied
without regard to segment boundaries: Match("-**/", "-") is true because the remainder "**/"
is one of the strings, although a mid-segment `**` is documented to behave like `*` and
Match("-*/", "-") is false. Glob("a/**/**") does list "a", so Match and Glob disagree on the
same pattern. Fix: decide zero-length matching structurally — every remaining segment must be
`**`, or a `*`-only segment when the name ended in a separator — instead of by string equality.
'''

