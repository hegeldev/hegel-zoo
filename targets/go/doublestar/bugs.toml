[[bug]]
id = "doublestar/7"
title = "Glob drops an empty alternative: the README's own some{thing,} lists \"something\" but not \"some\"; {,f} and {f,} list only f"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGlobEmptyAlternative"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
README ("Globs Are Not Regular Expressions"): "empty alternatives can be used to build some
more complicated globs. For example, some{thing,} will match both 'something' and 'some'".
Match agrees (Match("some{thing,}", "some") is true), bash agrees, but with files some and
something present Glob(fsys, "some{thing,}") returns ["something"] only; Glob("{,something}")
likewise, Glob("{f,}") and Glob("{,f}") return ["f"] and never the empty alternative's match
(Glob("{}f") returns nothing at all). globAlts iterates the alternatives with indexNextAlt and
handles the text between commas; an empty alternative produces an empty pattern piece that the
directory walk treats as "nothing to match" rather than "match the prefix alone". Fix: expand an
empty alternative to the surrounding text and glob that.
'''

