[[bug]]
id = "doublestar/12"
title = "A group nested inside a group makes Glob descend one level too far: Glob(\"*/{{*}}/*\") lists 1/2/3/4 (four segments for a three-segment pattern), Glob(\"*/{*}/*\") and Match do not"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGlobNestedAlternativesDescendTooFar"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The README allows nested alternatives ("some{thing{new,},}"). With files 1/2/3/4, a/b/c/f,
a/b/d, a/x and f, Glob(fsys, "*/{{*}}/*") returns ["1/2/3" "1/2/3/4" "a/b/c" "a/b/d"]: the
four-segment 1/2/3/4 is listed for a pattern of three segments, and with WithFilesOnly the
result is ["1/2/3/4" "a/b/d"]. Glob("*/{*}/*"), Glob("*/*/*") and Glob("*/{*,x}/*") return the
three-segment names only, and Match("*/{{*}}/*", "1/2/3/4") is false, so Glob and Match
disagree. On the zoo's larger tree the same pattern also lists 1/2/3/4 and a/b/c/f several
times each (doublestar/2). doGlob's lastIndexSlashOrAlt/indexMatchedOpeningAlt split the
pattern at the outer `}`; globAlts then re-enters doGlob with the alternative spliced in, and
the inner group's `}` is taken for a split point once more, so one `*` segment is globbed
twice. Fix: match the inner `{` to its own `}` when splitting, or expand alternatives fully
before globbing.
'''

