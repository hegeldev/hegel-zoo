[[bug]]
id = "doublestar/5"
title = "Glob with a trailing slash on a pattern without meta characters returns a regular file (\"f/\") and keeps the slash in the result (\"a/\"), unlike every wildcard pattern"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGlobTrailingSlashOnLiteral"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
doGlob's no-meta branch stats the pattern as a path and returns it verbatim. For a regular
file f, Glob(fsys, "f/") returns ["f/"] (bash, filepath.Glob and io/fs.Glob return nothing: a
trailing slash means a directory), and for a directory a, Glob("a/") returns ["a/"] while
Glob("*/") returns ["a"] and Glob("**/") returns [".", "a", ...] without slashes. So the same
directory is spelt two ways depending on whether the pattern had a wildcard, and a file is
matched by a directory-only pattern. Fix: in the no-meta branch, strip the trailing slash,
require IsDir when it was present, and return the cleaned name.
'''

