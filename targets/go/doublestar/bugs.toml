[[bug]]
id = "doublestar/11"
title = "A character class matches the path separator — a negated class always, a range spanning 0x2F too: a[!1]b matches a/b and a[.-c]a matches a/a (path.Match: false; the doc says a class matches a single non-path-separator character)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNegatedClassMatchesSeparator"
found = { commit = "a9ad9e0ef4d6b7e4443090e9a7201d847a881711", version = "v4.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The `?` branch checks "nameRune == separator → cannot match", the `[` branch does not: a class
is matched against the next name rune whatever it is, so a negated class, which matches
everything not listed, matches `/`, and so does any range that spans 0x2F (`[.-c]`, `[!-z]`,
`[--9]`). Match("a[!1]b", "a/b"), Match("a[^1]b", "a/b"), Match("a[.-c]a", "a/a") and
Match("[!a]", "/") are all true; path.Match("a[^1]b", "a/b") is false, bash's a[!1]b never
matches a/b, and the README's table says `[class]` "matches any single non-path-separator
character against a class of characters". PathMatch inherits it. Glob cannot produce such a
match (it walks real directories), so Match("a[!1]b", "a/b") is true while a/b is absent from
Glob("a[!1]b") — the shape the zoo's Match/Glob consistency check caught. Fix: refuse the
separator in the `[` branch as the `?` branch does.
'''

