'''

[[bug]]
id = "bubbles/18"
title = "textarea: the line-number gutter is sized at render time from MaxHeight's digits, the text width at SetWidth: with MaxHeight 0 line 10 pushes the text one column right"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNoLimitGutterShiftsTheText"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`SetWidth` reserves `numDigits(MaxHeight) + 2` columns for line numbers; `lineNumberView` formats
each number with `%*v` and `len(strconv.Itoa(MaxHeight))` digits but never narrower than the
number itself. `MaxHeight = 0` is documented as "no limit": the gutter is reserved for one digit
and lines 10 and beyond render a two-digit number, shifting their text right by one column (and
past 99 by two), so the rows no longer line up and their last column is cut by the viewport.
Raising `MaxHeight` to 100 after `SetWidth` (the field is public) has the same effect on every row.
'''

