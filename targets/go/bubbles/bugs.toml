status = "open"
notes = '''
`startKeyboardSelection` anchors at the cursor only when `hasSelection` is false — the flag that
says a selection was ever started, not `HasSelection()`, which also asks for it to be non-empty.
A shift+right at the end of the buffer (or shift+left at its start, or shift+right then
shift+left) leaves `hasSelection = true` with anchor == head. Movement keys clear it, but typing
and deleting only clear a *non-empty* selection, so the anchor survives any number of edits:
`o`, shift+right, ctrl+u, type `abc`, shift+left selects `b` (anchor still at column 1) instead
of `c`. The anchor can also name a line that no longer exists: `a` / `` with the cursor on the
empty second line, shift+right (nothing to select, anchor (1,0)), backspace (the lines join),
shift+left (a "selection" from (1,0) to (0,0)) and any typed character — `deleteSelection`
indexes `m.value[1]` of a one-line value and the program panics (`SelectedText` too). Four
keystrokes from a normal editing session.
'''

