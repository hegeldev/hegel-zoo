of `c`. The anchor can also name a line that no longer exists: `a` / `` with the cursor on the
empty second line, shift+right (nothing to select, anchor (1,0)), backspace (the lines join),
shift+left (a "selection" from (1,0) to (0,0)) and any typed character — `deleteSelection`
indexes `m.value[1]` of a one-line value and the program panics (`SelectedText` too). Four
keystrokes from a normal editing session.
'''

