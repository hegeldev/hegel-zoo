[[bug]]
id = "bubbles/78"
title = "tree: SetSize does not scroll the viewport, so a smaller height leaves the selected node out of view"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTreeShrinkHidesTheSelection"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`SetSize` resizes the viewport and re-sets the tree width but never calls `updateViewport`, whose scroll-off logic is the only thing that keeps the selection visible; a selection near the bottom stays below the window (and `viewport.SetHeight` does not clamp the offset) until the next movement. `SetStyles` does call `updateViewport(0)`, which skips the scroll when the selection is the root. Counted by the property as the selected line outside the window after a resize with no scroll since.
'''

[[bug]]
id = "bubbles/79"
title = "tree: a node wider than the width is word-wrapped by the tree style, so every row below it shifts and the cursor is drawn on the wrong line"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTreeWideValueWrapsTheCursor"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The tree is given `width − cursor − frame` but lipgloss's tree `Width` only pads; `updateViewport` then renders it through `TreeStyle.Width(m.width).MaxWidth(m.width)`, and `Style.Width` wraps: a value longer than the width becomes two or more rows while `lineOffset`/`Height()` count it as one (they render the unwrapped subtree), so the cursor column — built from `root.Height()` rows — is one row short per wrapped line and the selected node's arrow sits on the previous node's continuation. The property counts the shape whenever a rendered row is wider than the width and takes the scroll as the library's while it lasts.
'''

[[bug]]
