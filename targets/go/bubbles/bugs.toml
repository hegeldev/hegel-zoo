[[bug]]
id = "bubbles/14"
title = "textarea: Up and Down mis-step across short wrapped rows: Down skips a row of two runes or fewer, Up sticks below it, Down on a lone trailing-space row goes up, Up onto a row ending in a wide rune falls through"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinVerticalMotionSkipsShortWrappedRows"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`setCursorLineRelative` moves between the rows of a soft-wrapped line by arithmetic on the
rune index: down `col = min(StartColumn + Width + 2, len(line) - 1)`, up
`col = StartColumn - 2` ("2 columns to account for the trailing space wrapping"), then it reads
`LineInfo()` to find the row it landed on, resets `col` to that row's start and walks right to the
remembered column, bounded by `offset >= CharWidth - 1`. Each piece breaks on a short row:

- Down from `abcd ` in `abcd e fghi` (width 5; rows `abcd `, `e `, `fghi `) sets `col = 7`, which is
  the *end* of the two-rune row `e ` — `LineInfo` reports that as the start of `fghi `, so the
  cursor skips a row. A one-rune row is jumped over outright.
- Up from `fghi ` sets `col = 5`, the end of `abcd ` = the start of `e `; `LineInfo`'s wrap-around
  branch then reports `e ` with the *previous* row's `CharWidth` (bubbles/15), so the walk to the
  remembered column runs through `e ` back into `fghi `: Up never leaves the last row.
- Down at the end of a line whose last row is the wrap's lone trailing space (`eVu 本éac`, rows
  `eVu `, `本éac`, ` `) clamps `col` to `len - 1`, which is on the row *above*: Down moves up.
- Up onto a row ending in a double-width rune (`slsu漢`) walks `offset` 4 -> 6 over the wide rune,
  reaching the row's end, which `LineInfo` again reports as the next row's start.

Rows of two runes or fewer are common in narrow text areas: a one-letter word and its space.
The property gates its mismatches on the rows around the move being that short or ending in a
wide rune; everything else moves by exactly one visual row.
'''

[[bug]]
id = "bubbles/15"
title = "textarea: LineInfo at the start of a wrapped row reports the previous row's CharWidth"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLineInfoCharWidthIsThePreviousRows"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`LineInfo`'s wrap-around branch (the cursor at the end of a row that is not the last is reported
at the start of the next) fills `Width` from `grid[i+1]` but `CharWidth` from `line` = `grid[i]`.
For `abc defgh` at width 5 (rows `abc `, `defgh `) and the cursor at column 4 it returns
`{RowOffset 1, Width 6, CharWidth 4}`. `CharWidth` bounds the column-restoring walk of
`setCursorLineRelative`, which is how Up sticks below a short row (bubbles/14).
'''

[[bug]]
id = "bubbles/16"
title = "textarea: a double-width rune after width-1 columns of a word makes a wrap row wider than the width; the view truncates it and the rune vanishes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWideRuneOverflowsTheRowAndVanishes"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`wrap` hard-breaks a word by appending the rune first and then asking whether *another* rune of
the same width would still fit: `StringWidth(word) + lastCharLen > width`. A word of width-1
columns followed by a 2-column rune becomes width+1 columns wide and is flushed as one row
(`abcd日` at width 5 is a 6-column row). `view()` assumes a row can only overflow by a trailing
space ("guaranteed to be a space") and trims nothing; the viewport then cuts the row to its
width, and the wide rune — half of which would be beyond the edge — is not drawn at all: the
view of `abcd日` shows `abcd `. When the cursor is on that rune it vanishes too (in a text area
one column wide every CJK rune does). The real cursor and `PositionAt` still count the rune.
'''

[[bug]]
