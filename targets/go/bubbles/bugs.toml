status = "open"
notes = '''
`setYOffsets` and `AllNodes` walk `tree.Children()`, which still holds hidden children (`Hidden` is a flag the renderer skips), so `Size` counts them, `Down` selects them (`NodeAtCurrentOffset().Hidden()` is true and the cursor is drawn on the next node's row), every node below is one line off, and at the last node `cursorView` indexes `cursor[lineOffset]` past `root.Height()` lines: `index out of range`. Hiding any child but the first also panics inside lipgloss's renderer, which calls the enumerator style function with an index past the shortened sibling list (recorded there as lipgloss/30). Pinned only: the property's trees have no hidden nodes.
'''

