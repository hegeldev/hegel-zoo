[[bug]]
id = "bubbles/1"
title = "textinput: delete-word-forward steps past the rune under the cursor: it panics on the last rune and eats the next word"
kind = "panic"
severity = "high"
test = "TestHegelPinDeleteWordForwardStartsOneRuneTooFar"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`deleteWordForward` (alt+d, alt+delete, ctrl+delete) begins with `m.SetCursor(m.pos + 1)` and
only then looks for whitespace with `unicode.IsSpace(m.value[m.pos])`. With the cursor on the
last rune (`a|b`, or any value whose cursor sits one before the end) the new position is
`len(value)` and the index panics — a crash from a single keystroke in any program with a
textinput. When the rune under the cursor is the last of its word (`a|b c`) the step skips it,
the whitespace loop skips the space and the word loop deletes the *next* word: the result is
`"a"` where every other editor gives `"a c"`. The property gates both shapes (`bubbles/1-shape`)
and does not press the key there; `deleteWordBackward` has no such step and behaves.
'''

[[bug]]
id = "bubbles/2"
title = "textinput: without a width the placeholder is cut to its first rune"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlaceholderIsCutToOneRuneWithoutWidth"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`placeholderView` copies the placeholder into `make([]rune, m.Width()+1)` — one rune when no
width is set (the default) — and returns after drawing that rune under the cursor because
`m.Width() < 1 && len(p) <= 1`. A default `textinput.New()` with `Placeholder = "Hello"` shows
`> H`. The branch meant for this case ("if there is no width, the placeholder can be any
length") is unreachable. Upstream's own `TestPlaceholderTruncate`/`TestChinesePlaceholder` are
skipped as "flaky, the returned view seems incorrect".
'''

[[bug]]
id = "bubbles/3"
title = "textinput: the placeholder is sliced by display width, writing NUL runes after wide characters and overflowing the width"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlaceholderIsSlicedByDisplayWidth"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With a width set, `placeholderView` takes `minWidth := lipgloss.Width(m.Placeholder)` (cells)
and slices the rune buffer `p[1:minWidth]`. For a placeholder of wide runes the cell width is
twice the rune count, so the slice runs into the zero-filled tail of the buffer and the view
contains NUL runes: `"输入消息..."` at width 20 renders `输入消息...\x00\x00\x00\x00`. When the
placeholder is wider than the field, `availWidth` goes negative and is added back to
`minWidth`, again in cells: `"输入消息"` at width 3 renders all four runes, eight cells in a
field of four. ASCII placeholders (one cell per rune) are fine, which the property checks
exactly; wide ones are counted (`bubbles/3-shape`).
'''

[[bug]]
id = "bubbles/4"
title = "textinput: a negative width with a placeholder panics in View"
kind = "panic"
severity = "low"
test = "TestHegelPinNegativeWidthPlaceholderPanics"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`SetWidth` documents that a width of 0 or less is ignored, and every other path treats
`Width() <= 0` as unset, but `placeholderView` allocates `make([]rune, m.Width()+1)` — zero
runes for -1 — and slices `p[:1]`: `slice bounds out of range [:1] with capacity 0`. A
window-size handler that subtracts a prompt or border width from a small terminal reaches it.
'''

[[bug]]
id = "bubbles/5"
title = "textinput: SetValue and Reset keep the previous value's matched suggestions; tab then completes the wrong text or panics"
kind = "panic"
severity = "medium"
test = "TestHegelPinSetValueKeepsStaleSuggestions"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`updateSuggestions` runs only from `SetSuggestions` and after a key press, not from `SetValue`
or `Reset`, so `matchedSuggestions` describes the value before the call. With suggestion
`apple` and a typed `a`, `SetValue("zzz")` leaves `CurrentSuggestion()` at `apple` and tab
appends `apple[len("zzz"):]`: `"zzzle"`. `SetValue("apple pie")` then tab slices
`apple[9:]` and panics (`slice bounds out of range [9:5]`). After `Reset()` the empty field
still shows the ghost completion `pple` and tab fills in `apple`. The property ends a sequence
at SetValue/Reset (`bubbles/5-shape`).
'''

[[bug]]
id = "bubbles/6"
title = "textinput: up with no matched suggestion sets the index to -1 and CurrentSuggestion panics"
kind = "panic"
severity = "low"
test = "TestHegelPinPrevSuggestionWithoutMatchesPanics"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`previousSuggestion` computes `index - 1` and wraps to `len(matched) - 1` when negative — which
is -1 when nothing matches. `CurrentSuggestionIndex()` then reports -1 and
`CurrentSuggestion()`, whose only guard is `index >= len(matched)`, panics with
`index out of range [-1]`. `nextSuggestion` wraps to 0 and is fine. The property does not press
up without a match (`bubbles/6-shape`).
'''

[[bug]]
id = "bubbles/7"
title = "textinput: the scrolling window is only re-fitted when the cursor crosses an edge; SetWidth, typing inside the window and ctrl+u leave it wider than the width"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSetWidthDoesNotScrollTheView"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`handleOverflow` adjusts `offset`/`offsetRight` only in the branches `pos < offset` and
`pos >= offsetRight`; otherwise the window is kept as it is. So after `SetValue("abcdefghij")`
and `SetWidth(5)` (the usual order under a window-size message) the whole value stays visible
until the cursor crosses an edge; typing a rune inside a scrolled window widens the window by
that rune (a wide one by two cells); `deleteBeforeCursor` (ctrl+u, and ctrl+w/alt+backspace in
password mode) resets `offset` to 0 but keeps `offsetRight`, showing `offsetRight` runes in a
field of `width`. The view property checks the field is exactly width+1 cells and counts the
wider windows (`bubbles/7-shape`); the pin uses the SetWidth case.
'''

[[bug]]
id = "bubbles/8"
title = "textinput: Cursor() places the real cursor at prompt + rune index, ignoring the scrolled window and wide runes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRealCursorIgnoresTheScroll"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With the virtual cursor off, `Cursor()` returns `x = Position() + promptWidth`, capped at
`width + promptWidth`. The view draws the cursor at `promptWidth + width(value[offset:pos])`.
Once the field has scrolled (`offset > 0`) the real cursor sits `offset` cells too far right —
at the cap, the last cell — for every position in the window; a wide rune before the cursor
puts it one cell left of the glyph. Width 5, value `abcdefghij`, cursor at 5 (the first
visible cell): `Cursor().Position.X` is 7, the view's cursor is at 2. The property compares the
two and counts the scrolled/wide cases (`bubbles/8-shape`).
'''

[[bug]]
id = "bubbles/9"
title = "textinput: backspace on an empty input clears Err without asking the validator"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBackspaceOnEmptyClearsErr"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The backspace branch sets `m.Err = nil` first and revalidates only `if len(m.value) > 0`. A
validator that rejects the empty string (a required field) has its error shown after the
last rune is deleted and cleared by the next backspace, with the value unchanged. Every
other edit, including a delete at the end of the value, revalidates.
'''

[[bug]]
id = "bubbles/10"
title = "textinput: ctrl+w on a word at the start of the input deletes the single space before it as well"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDeleteWordBackwardEatsTheLeadingSpace"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`deleteWordBackward` walks back while `m.pos > 0` and stops one past a space it finds; when
the loop ends because `pos` reached 0 it never looks at `value[0]`, so for `" ab|"` the space
at index 0 goes with the word and the result is `""` rather than `" "`. Two leading spaces
(`"  ab|"` → `"  "`) and words further in are handled as documented.
'''

[[bug]]
id = "bubbles/11"
title = "textinput: scrolling forward, the rune under the cursor is not shown; the cursor is a blank at the right edge"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinForwardScrollHidesTheRuneUnderTheCursor"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
When the cursor moves past the right edge, `handleOverflow` sets `offsetRight = pos`, so the
window ends *at* the cursor and `View` draws the cursor as a blank after the last visible
rune, as it does at the end of the value. Moving right through `abcdefghij` in a field of
width 5, at position 6 the view is `bcdef▮` with `g` — the rune a Delete would remove and a
typed rune would precede — invisible; each further step reveals the previous one. Moving left
(`pos < offset`) the window starts at the cursor and the rune under it is shown. The property
counts the shape (`bubbles/11-shape`) and checks the rest of the window.
'''

[[bug]]
id = "bubbles/12"
title = "textinput: with EchoNone the padding is computed from the hidden value, so the field shrinks as text is typed"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEchoNonePadsByTheHiddenWidth"
found = { commit = "0a69b19b0690e9504a511fc231f69cea59ba1cc6", version = "v2 (charm.land/bubbles/v2), untagged main 2026-09-01", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`View` pads the field to `width + 1` cells using `valWidth = uniseg.StringWidth(string(value))`,
the width of the *unechoed* value, while `EchoNone` renders nothing for it. An empty field of
width 3 is `> ` plus 4 cells; after typing `ab` it is `> ` plus 2. With a background colour on
the text style the box visibly shortens with every keystroke, and past the width it vanishes.
`EchoPassword` echoes one mask per cell and keeps the width.
'''

