the `readDirMsg` handler only ever widens `maxIdx`. A window `[0, 4]` saved at height 5 comes
back as five rows at height 2, or as two rows over blank ones at height 8 (`max(maxIdx,
bottomIdx(minIdx))` widens it only downward, where entries may be missing). Found by the
property: a window wider or shorter than the height right after a `Back` whose height differs
from the saved one.
'''

