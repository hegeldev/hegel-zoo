# Bugs found in valyala/fasthttp by the zoo's Hegel tests (hegel/ in the patch). Each pin (test)
# fails while the bug is open. The reference is Go's standard library (net/http, net/url, netip)
# and the RFCs (6265 and 6265bis for cookies, 9110/9112 for HTTP/1.1, 3986/6874 for URIs).

[[bug]]
id = "fasthttp/1"
title = "Cookie.Parse rejects a Set-Cookie header whose Max-Age is negative (Max-Age=-1), although RFC 6265 5.2.2 makes a delta of zero or less mean expire now, as net/http reads it (MaxAge -1)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNegativeMaxAge"
found = { commit = "0e13c85e8ed5b41b489c502eeccdf90a45eb8dfe", version = "post-v1.69.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a=b; Max-Age=-1`: net/http's Response.Cookies gives the cookie with MaxAge -1 (its convention for
"expire at once", the same value it gives Max-Age=0); fasthttp's Cookie.ParseBytes calls ParseUint
on the attribute value and returns its error ("unexpected trailing char found: expecting 0-9"), so
`ResponseHeader.Cookie` reports no such cookie and a client loses it. RFC 6265 5.2.2: "If
delta-seconds is less than or equal to zero (0), let expiry-time be the earliest representable
date and time"; the attribute grammar allows a leading '-'. Found by the Set-Cookie differential
against net/http; the property gates the shape.
'''

[[bug]]
id = "fasthttp/2"
title = "A Max-Age or Expires attribute fasthttp cannot parse (Max-Age=abc, Expires=garbage, or an RFC 1123 date with a zone other than GMT) makes Cookie.Parse fail and drops the whole cookie; RFC 6265 says ignore the attribute"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnparsableAttributeDropsCookie"
found = { commit = "0e13c85e8ed5b41b489c502eeccdf90a45eb8dfe", version = "post-v1.69.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a=b; Max-Age=abc`, `a=b; Max-Age=1.5`, `a=b; Expires=garbage`: net/http keeps the cookie a=b with
the attribute ignored; fasthttp's ParseBytes returns the ParseUint or time.Parse error and the cookie
is lost (`ResponseHeader.Cookie` false). RFC 6265 5.2.1 ("If the attribute-value failed to parse as
a cookie date, ignore the cookie-av") and 5.2.2 ("If the first character of the attribute-value is
not a DIGIT or a "-" character, ignore the cookie-av") both keep the cookie. `Expires=Thu, 01 Jan
1970 00:01:44 UTC` is also rejected: parseCookieExpires accepts a strict RFC 1123 date ending in
GMT, then http.TimeFormat (GMT again), then the legacy dashed form, so a valid RFC 1123 date with
another zone name fails all three, while net/http reads it with time.RFC1123. Found by the Set-Cookie
differential; the property gates the shape.
'''

[[bug]]
id = "fasthttp/3"
title = "The close token of a Connection header is recognised only when the whole value is exactly close: Connection: Close, Connection: TE, close, or a close followed by another Connection header leave ConnectionClose false"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinConnectionCloseToken"
found = { commit = "0e13c85e8ed5b41b489c502eeccdf90a45eb8dfe", version = "post-v1.69.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 9110 7.6.1: Connection is a list of case-insensitive connection options; "close" anywhere in
the list means the connection is to be closed after the message. RequestHeader.parseHeaders and
ResponseHeader.parseHeaders test `bytes.Equal(s.value, strClose)`: `Connection: Close` (net/http:
Close true), `Connection: TE, close` and `Connection: close, x` are stored as ordinary headers
with connectionClose false, so the server keeps the connection open after a request that asked
for it to be closed and a client keeps reading a connection the server said it would close. A
second Connection header with another value (`Connection: close` then `Connection: keep-alive`)
runs the `else` branch, which sets connectionClose back to false. The keep-alive test for
HTTP/1.0 (hasHeaderValue) does split the list case-insensitively, but looks at the first stored
Connection header only (peekArgBytes), so `Connection: upgrade` followed by `Connection:
keep-alive` on an HTTP/1.0 request closes the connection where net/http keeps it open.
Found by the request and response differentials against net/http; the property gates the shape.
'''

[[bug]]
id = "fasthttp/4"
title = "ParseIPv4 accepts octets with leading zeros and reads them as decimal (1.2.3.010 is 1.2.3.10); Go's net and netip reject them because other parsers (inet_aton) read them as octal"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinParseIPv4LeadingZeros"
found = { commit = "0e13c85e8ed5b41b489c502eeccdf90a45eb8dfe", version = "post-v1.69.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ParseIPv4(nil, "1.2.3.010")` gives 1.2.3.10 and no error; `netip.ParseAddr` and `net.ParseIP`
reject the string ("IPv4 field has octet with leading zero") since Go 1.17, because inet_aton and
the parsers derived from it read a leading zero as octal (010 is 8), so the same text names
different hosts in different software (an SSRF/allow-list bypass vector). parseIPv4Octet only
checks the digit count against 255. Found by the ParseIPv4 differential against netip; the
property gates the shape.
'''

[[bug]]
id = "fasthttp/5"
title = "SameSite with an unknown or empty value (SameSite=Foo, SameSite=) is read as no SameSite attribute at all; RFC 6265bis 5.6.7 makes such a value mean the Default enforcement, as net/http reports and as fasthttp does for a bare SameSite"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSameSiteUnknownValue"
found = { commit = "0e13c85e8ed5b41b489c502eeccdf90a45eb8dfe", version = "post-v1.69.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a=b; SameSite=Foo` and `a=b; SameSite=`: net/http gives SameSiteDefaultMode; fasthttp's
Cookie.SameSite() stays CookieSameSiteDisabled, while a bare `SameSite` gives
CookieSameSiteDefaultMode. draft-ietf-httpbis-rfc6265bis 5.6.7 (The SameSite Attribute): if the
value is none of None/Strict/Lax, "let enforcement be Default". The switch on the value's first
byte in ParseBytes has no default case. Found by the Set-Cookie differential; the property gates
the shape.
'''

[[bug]]
id = "fasthttp/6"
title = "A host with an IPv6 zone identifier ([fe80::1%25eth0]) is unescaped on parsing and written back as is by FullURI/String ([fe80::1%eth0]), a URI that is not valid (RFC 6874: the zone's percent is %25) and that net/url rejects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZoneIdentifierInFullURI"
found = { commit = "0e13c85e8ed5b41b489c502eeccdf90a45eb8dfe", version = "post-v1.69.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`u.Parse(nil, "http://[fe80::1%25eth0]/")` then `u.String()` gives "http://[fe80::1%eth0]/":
parseHost unescapes the zone (as net/url does for URL.Host) but appendSchemeHost writes the
stored host without escaping it again (net/url's URL.String re-escapes the host with encodeHost,
giving %25). `url.Parse` of the result fails with "invalid URL escape "%et"", and a request written
with such a URI has an invalid Host/request-target. RFC 6874 2: the zone identifier's delimiter is
written "%25" in a URI. Found by the URI differential against net/url (re-serialisation check);
the property gates the shape.
'''

[[bug]]
id = "fasthttp/7"
title = "Secure, HttpOnly and Partitioned given with a value (Secure=1, HttpOnly=false) are not recognised by Cookie.Parse; RFC 6265 5.2.5 and 5.2.6 set the flag whatever the attribute-value, as net/http does"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFlagAttributeWithValue"
found = { commit = "0e13c85e8ed5b41b489c502eeccdf90a45eb8dfe", version = "post-v1.69.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a=b; Secure=1; HttpOnly=false; Partitioned=x`: net/http gives Secure, HttpOnly and Partitioned
true; fasthttp leaves all three false. In ParseBytes the flag attributes are matched only in the
`len(k) == 0` branch (no '=' in the cookie-av); with a value the attribute name lands in k and the
switch on k has no case for them. RFC 6265 5.2.5 (Secure) and 5.2.6 (HttpOnly): "the user agent
MUST append an attribute ... with an empty attribute-value" regardless of the value given.
Found by a probe of the differential; the property gates the shape.
'''
