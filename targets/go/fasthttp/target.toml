name = "fasthttp"
language = "go"
upstream = "https://github.com/valyala/fasthttp"
subdir = ""
license = "MIT"  # LICENSE; README has no CONTRIBUTING and says nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "5687435d22d12c3bedb8080e66703720c40c017f"
date = "2026-09-20"
version = "v1.74.0+"

[hegel]
version = "v0.6.33"

[run]
# The tests live in hegel/ and compare fasthttp's reading and writing of generated requests,
# responses, cookies, query strings and URIs with Go's net/http and net/url; no tools needed.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinNegativeMaxAge = "fasthttp/1"
TestHegelPinUnparsableAttributeDropsCookie = "fasthttp/2"
TestHegelPinConnectionCloseToken = "fasthttp/3"
TestHegelPinParseIPv4LeadingZeros = "fasthttp/4"
TestHegelPinSameSiteUnknownValue = "fasthttp/5"
TestHegelPinZoneIdentifierInFullURI = "fasthttp/6"
TestHegelPinFlagAttributeWithValue = "fasthttp/7"
