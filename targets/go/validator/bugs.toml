# Bugs found in go-playground/validator by the Hegel zoo. Each has a pin test (hegel_pins_test.go)
# listed as an expected failure in target.toml.

[[bug]]
id = "validator/1"
title = "Numeric tag parameters are parsed with base 0: max=010 means 8 and len=08 panics"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDecimalParams"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
asInt and asUint (util.go) call strconv.ParseInt(param, 0, 64): base 0 reads a leading "0" as
octal and accepts 0x/0b/0o prefixes and underscores. So `max=010` on 9 fails (the limit is 8),
`min=0x10` is 16, `min=1_0` is 10, and `len=08` or `eq=09` panic with "strconv.ParseInt:
parsing "08": invalid syntax" since 8 and 9 are not octal digits. The documentation shows only
decimal parameters (len=10, max=10, gt=10); a zero-padded parameter such as `len=08` silently
changes meaning or takes the process down. Float parameters use ParseFloat and are decimal.
'''

[[bug]]
id = "validator/2"
title = "gtfield/gtefield/ltfield/ltefield on strings compare byte lengths where gt/gte/lt/lte count characters"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinFieldComparisonCountsRunes"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
gt/gte/lt/lte/len/min/max measure a string with utf8.RuneCountInString ("the string length is
greater than that number of characters"). The cross-field variants fall through to
`len(field.String()) > len(currentField.String())`, a byte count: with A = "éé" (2 characters,
4 bytes) and B = "aaa", `gtfield=B` passes and `ltfield=B` fails. The docs list gtfield as valid
for numbers, time.Duration and time.Time only, but strings are accepted without complaint and
measured differently from every other length tag.
'''

[[bug]]
id = "validator/3"
title = "nefield panics on a type convertible to time.Time (eqfield converts it)"
kind = "panic"
severity = "medium"
test = "TestHegelPinNeFieldNamedTime"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isEqField, isNeCrossStructField, isGtField and the rest convert the values before asserting:
`getValue(field.Convert(timeType)).(time.Time)`. isNeField alone asserts without converting:
`getValue(currentField).(time.Time)`, so a field whose type is `type Stamp time.Time` (or any
struct convertible to time.Time) panics with "interface conversion: interface {} is main.Stamp,
not time.Time" under `nefield`, while `eqfield` on the same pair works.
'''

[[bug]]
id = "validator/4"
title = "rgba/hsla alpha accepts only 0, 1 or 0.[1-9]*: 0.05, 0.50, 1.0 and .5 fail, 0X passes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinColorAlpha"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The alpha component of rgbaRegexString and hslaRegexString is `(?:(?:0.[1-9]*)|[01])`: the dot
is unescaped (any character) and the fraction may only use digits 1-9. rgba(0,0,0,0.05),
rgba(0,0,0,0.50), rgba(0,0,0,1.0) and rgba(0,0,0,.5), all valid CSS, are rejected, while
rgba(0,0,0,0X) and rgba(0,0,0,0.) are accepted. hsla has the same component.
'''

[[bug]]
id = "validator/5"
title = "hostname_port rejects bracketed IPv6 hosts while accepting IPv4 ones"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHostnamePortIPv6"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isHostnamePort splits with net.SplitHostPort (which understands "[::1]:80") and then requires
the host to match the RFC 1123 hostname regex. An IPv4 host such as 127.0.0.1:80 passes only
because digits and dots happen to match that regex; an IPv6 host never does, so "[::1]:80" and
"[2001:db8::1]:443", the socket addresses the tag is documented for ("fields typically passed
to sockets and connections"), are rejected.
'''

[[bug]]
id = "validator/6"
title = "required_if and co compare a bool field with the literal text true only (eq accepts True, 1, t)"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinRequiredIfBool"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
requireCheckFieldValue's bool case is `field.Bool() == (value == "true")`, so `required_if=Flag
True` or `required_if=Flag 1` never fire when Flag is true (the parameter is read as false) and
fire when Flag is false. `eq=True` and `eq=1` on the same bool use asBool (strconv.ParseBool)
and accept the spellings 1, t, T, TRUE, True. The same code serves required_unless, excluded_if,
excluded_unless and skip_unless.
'''

[[bug]]
id = "validator/7"
title = "excluded_without takes a single field where excluded_with, required_without and the _all variants take a list"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinExcludedWithoutList"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Every other member of the family splits its parameter with parseOneOfParam2 and loops over the
fields; excludedWithout passes strings.TrimSpace(fl.Param()) as one field name. With
`excluded_without=A B` the field "A B" is looked up, not found, and treated as absent
(defaultNotFoundValue = true), so F must always be empty: with A and B both present and F set
the struct still fails, whereas `required_without=A B` handles the list.
'''

[[bug]]
id = "validator/8"
title = "A oneof value cannot contain an apostrophe: every quote character is stripped after splitting"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOneOfApostrophe"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parseOneOfParam2 splits the parameter with `'[^']*'|\S+` and then applies
strings.ReplaceAll(v, "'", "") to every value, quoted or not. `oneof=don't x` therefore accepts
"dont" and rejects "don't"; there is no escape for an apostrophe inside a value (0x2C and 0x7C
exist for comma and pipe). The same splitter serves oneofci, noneof, noneofci and the
required_if family's parameters.
'''

[[bug]]
id = "validator/9"
title = "ipv4 and cidrv4 accept the IPv6 text of an IPv4-mapped address that ipv6 and cidrv6 reject"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinMappedAddressIsIPv6"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isIPv4 is `net.ParseIP(s) != nil && ip.To4() != nil` and isIPv6 is `ip.To4() == nil`. The
string "::ffff:192.0.2.1" is IPv6 syntax (RFC 4291 2.5.5.2) yet To4 succeeds on it, so
`ipv4` accepts it and `ipv6` rejects it; likewise "::ffff:10.0.0.0/104" passes cidrv4 and
fails cidrv6. A field validated as ipv6 thus rejects a well-formed IPv6 literal, and one
validated as ipv4 lets an IPv6 literal through to code expecting dotted quads.
'''

[[bug]]
id = "validator/10"
title = "html_encoded rejects single-digit character references (&#9;, &#x9;) and accepts &ampx"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHTMLEncodedReferences"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
hTMLEncodedRegexString is `&#[x]?([0-9a-fA-F]{2})|(&gt)|(&lt)|(&quot)|(&amp)+[;]?`: a numeric
reference must have exactly two hex digits after "&#" or "&#x" (a match anywhere in the string
suffices since the pattern is unanchored), so "&#9;" and "&#x9;" (tab) fail while "&#65;" and
"&#128512;" pass (the first two digits match), and "&ampx" passes because the semicolon is
optional. The docs: "validates that a string value is a proper character reference in decimal or
hexadecimal format".
'''

[[bug]]
id = "validator/11"
title = "ssn accepts area numbers 000, 666 and 900-999, which are never issued"
kind = "spec"
severity = "low"
test = "TestHegelPinSSNAreas"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
sSNRegexString checks the group (not 00) and serial (not 0000) but lets the area be any three
digits. The Social Security Administration never assigns area 000, 666 or 900-999 (the latter
are reserved; ITINs use them), so "000-12-3456", "666-12-3456" and "900-12-3456" are not
valid SSNs, while the tag is documented as "a valid U.S. Social Security Number".
'''

[[bug]]
id = "validator/12"
title = "unique panics on an unexported field under WithPrivateFieldValidation"
kind = "panic"
severity = "medium"
test = "TestHegelPinUniquePrivateField"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
WithPrivateFieldValidation makes the validator visit unexported fields; validators read such
values through getValue, which uses unsafe access when CanInterface is false. isUnique calls
elem.Interface() and sf.Interface() directly, so a private slice tagged `unique` panics with
"reflect.Value.Interface: cannot return value obtained from unexported field or method" (the
same slice exported validates fine). isUnique's map branch has the same call.
'''

[[bug]]
id = "validator/13"
title = "fqdn accepts labels ending in a hyphen"
kind = "spec"
severity = "low"
test = "TestHegelPinFQDNLabelHyphen"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
fqdnRegexStringRFC1123 writes each label as `[a-zA-Z0-9]{1}[a-zA-Z0-9-]{0,62}`, so a label may
end in "-": "exa-.com" and "example.com-" pass. RFC 1123 2.1 (and RFC 952) require a label to
end in a letter or digit, and hostnameRegexStringRFC1123 in the same file gets it right with
`([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?`.
'''

[[bug]]
id = "validator/14"
title = "The docs say an upper-case UUID does not pass uuid/uuid3/uuid4/uuid5; it does"
kind = "documentation"
severity = "low"
test = "TestHegelPinUUIDUpperCaseDocumented"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
doc.go: "This validates that a string value contains a valid UUID. Uppercase UUID values will
not pass - use `uuid_rfc4122` instead", repeated for uuid3/uuid4/uuid5. uUIDRegexString is
`^[0-9a-fA-F]{8}-...$` and accepts both cases, so `uuid` and `uuid_rfc4122` differ only in
the version/variant nibbles, and users choosing `uuid` to enforce lower case get no check.
(uuid3/uuid4/uuid5 are still lower-case only, so the four tags disagree among themselves too.)
'''

[[bug]]
id = "validator/15"
title = "ulid accepts a first character above 7 (a value that does not fit 128 bits)"
kind = "spec"
severity = "low"
test = "TestHegelPinULIDRange"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A ULID is 128 bits written as 26 Crockford base32 characters (130 bits), so the first character
must be 0-7; the specification's largest valid ULID is 7ZZZZZZZZZZZZZZZZZZZZZZZZZ and
implementations (oklog/ulid, the reference JavaScript) reject "8..." as overflow.
uLIDRegexString is `^(?i)[A-HJKMNP-TV-Z0-9]{26}$`, so "80000000000000000000000000" passes.
'''

[[bug]]
id = "validator/16"
title = "datauri requires a media type and a base64 payload; RFC 2397 makes both optional"
kind = "spec"
severity = "low"
test = "TestHegelPinDataURIPlain"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 2397: `data:[<mediatype>][;base64],<data>`, where the data is base64 only when ";base64"
is present and is otherwise percent-encoded text, and the media type defaults to
text/plain;charset=US-ASCII. isDataURI matches the head against dataURIRegexString (which
needs a type/subtype) and always requires the payload to match base64Regex, so
"data:text/plain,hello", "data:,hello" and "data:text/plain;charset=utf-8,hello%20world" are
rejected. doc.go notes "this will also validate that the data portion is valid base64", which
describes the check but not the plain form the RFC allows; the URI parsed by every browser is
rejected by a tag named datauri.
'''

[[bug]]
id = "validator/17"
title = "cidrv4 rejects a prefix with host bits set (10.1.2.3/8) while cidrv6 accepts one (2001:db8::1/32)"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinCIDRHostBitsConsistent"
found = { commit = "6a9b66661aec1c9f9172781187b6638b7a3f7d31", version = "v10.30.5", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isCIDRv4 is `err == nil && ip.To4() != nil && net.IP.Equal(ip)`: the address must be the
network address, so "10.1.2.3/8" fails. isCIDRv6 is `err == nil && ip.To4() == nil` with no
such check, so "2001:db8::1/32" passes, and `cidr` accepts both. Whichever reading is intended
(net.ParseCIDR accepts host bits; the v4 check was added deliberately), the two families should
agree; the docs describe both as "a valid v4/v6 CIDR address".
'''
