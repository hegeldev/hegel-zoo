name = "cascadia"
language = "go"
upstream = "https://github.com/andybalholm/cascadia"
license = "BSD-2-Clause"
ai_policy_checked = "2026-09-19"

[base]
commit = "154416acceb25b62dec074c428dd255bd950711d"
date = "2026-09-15"
version = "v1.3.5+"

[hegel]
version = "v0.6.33"

[run]
# Needs python3 with soupsieve 2.9 and beautifulsoup4 on PATH (the oracle child process).
setup = []
command = "go test -count=1 -v ."

[expected_failures]
TestHegelPinPseudoClassesMatchOnlyElements = "cascadia/1"
TestHegelPinStringEscapesAttributeValues = "cascadia/2"
TestHegelPinStringEscapesLeadingDigits = "cascadia/3"
TestHegelPinNeverMatchingPseudoClassSpecificity = "cascadia/4"
TestHegelPinOptionInDisabledOptgroup = "cascadia/5"
TestHegelPinHasIsScoped = "cascadia/6"
TestHegelPinLinksAreNotEnabled = "cascadia/7"
TestHegelPinBlankValuesMatchSubstrings = "cascadia/8"
TestHegelPinLangIsCaseInsensitive = "cascadia/9"
TestHegelPinLangUsesTheNearestAttribute = "cascadia/10"
TestHegelPinEmptyKeepsNonBreakingSpace = "cascadia/11"
TestHegelPinHTMLAttributeValuesCaseInsensitive = "cascadia/12"
TestHegelPinZeroEscapeIsReplacementCharacter = "cascadia/13"
TestHegelPinNestedFieldsetIsDisabled = "cascadia/14"

# The wide matching properties draw the shapes of the ten matching bugs at the pools' natural
# rates and fail when a case meets one: mapped to the plurality basin of forty rounds at a
# hundred cases (2026-10-10: the soupsieve property 12 of forty, cascadia/9 and 7 three each,
# the tie broken by the thirty-round figure to 7; the model property 24 of forty, cascadia/1
# nineteen); one narrow property per matching bug fails every run.
TestHegelSelectorsAgreeWithSoupsieve = { bug = "cascadia/7", intermittent = true }
TestHegelSelectorsAgreeWithTheModel = { bug = "cascadia/1", intermittent = true }
TestHegelSelectorsMatchOnlyElements = "cascadia/1"
TestHegelOptionsInDisabledOptgroupsAreDisabled = "cascadia/5"
TestHegelHasIsAnchoredAtTheSubject = "cascadia/6"
TestHegelLinksAreNotEnabled = "cascadia/7"
TestHegelBlankValuesMatchSubstrings = "cascadia/8"
TestHegelLangIsCaseInsensitive = "cascadia/9"
TestHegelLangUsesTheNearestAttribute = "cascadia/10"
TestHegelEmptyKeepsNonBreakingSpace = "cascadia/11"
TestHegelHTMLAttributeValuesAreCaseInsensitive = "cascadia/12"
TestHegelNestedFieldsetsAreDisabled = "cascadia/14"

# The four syntax properties draw the shapes of cascadia/2, 3, 4 and 13 (2026-10-10): the
# round-trip and pseudo-element properties reach 2 and 3 through the pools' quotes, backslashes
# and digit-leading class names, the specificity property 4 through the never-matching
# pseudo-classes, the spelling property 13 through the zero-escape spelling of U+FFFD.
TestHegelSerializationRoundTrips = { bug = "cascadia/3", intermittent = true }
TestHegelSpecificityFollowsTheSpec = { bug = "cascadia/4", intermittent = true }
TestHegelPseudoElements = { bug = "cascadia/3", intermittent = true }
TestHegelParserIgnoresSpelling = { bug = "cascadia/13", intermittent = true }
TestHegelSerializationEscapesAttributeValues = "cascadia/2"
TestHegelSerializationEscapesLeadingDigits = "cascadia/3"
TestHegelNeverMatchingPseudoClassesCount = "cascadia/4"
TestHegelZeroEscapeIsReplacementCharacter = "cascadia/13"
