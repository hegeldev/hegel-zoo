# Bugs found in andybalholm/cascadia (v1.3.5+) by the Hegel zoo. One [[bug]] per finding; `test`
# names the plain Go test in hegel_pins_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracles: soupsieve 2.9 (the Python CSS selector engine,
# as a child process) over generated HTML documents, a model of the Selectors Level 4 and HTML
# specifications for the pseudo-classes and the library's own extensions, and CSS Syntax Level 3
# for escapes. No AI policy in README.md (no CONTRIBUTING file; checked 2026-09-19).

[[bug]]
id = "cascadia/1"
title = ":lang, :contains and :matches match text, comment and document nodes, so QueryAll returns them and :has and ~ see them"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPseudoClassesMatchOnlyElements"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
langPseudoClassSelector, containsPseudoClassSelector and regexpPseudoClassSelector (pseudo_classes.go)
do not check n.Type == html.ElementNode as every other selector does. A text node under
<div lang="en"> has no lang attribute of its own, so :lang(en) recurses to the parent and matches
it; the text node's nodeText is its own data, so :contains("text") matches it; the document node,
the doctype and comments have an empty own text, so :matchesown(^$) matches them all. The
consequences: QueryAll(doc, ":lang(en)") returns the div, its text and its comment nodes;
MatchAll(:matchesown(^$)) returns the document node itself; :has(:lang(fr)) matches an element
whose text node is under a lang="fr" ancestor although no element does (hasDescendantMatch tests
every child); and ":lang(fr) ~ span" matches a span preceded only by a text node in a lang="fr"
parent (the ~ walk tests text siblings, unlike the + walk which skips them). Found by
TestHegelSelectorsAgreeWithSoupsieve (QueryAll positions of non-elements) and
TestHegelSelectorsAgreeWithTheModel; the properties now drop non-element results and do not put
these pseudo-classes in :has or before ~ while the bug is open.
'''

[[bug]]
id = "cascadia/2"
title = "String() does not escape quotes and backslashes in attribute values and :contains arguments, so the output does not parse or parses to another selector"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinStringEscapesAttributeValues"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
attrSelector.String (serialize.go) prints the value with fmt.Sprintf(`"%s"`, val) and
containsPseudoClassSelector.String likewise, without escaping. Sel.String is documented as
"a CSS input compiling to this selector", but Parse(`[title="a\"b"]`).String() is `[title="a"b"]`,
which fails to parse (expected ']', found 'b'), and Parse(`[title="a\\b"]`).String() is
`[title="a\b"]`, which parses back with the value U+000B (\b is a hex escape). Identifiers (ids
and classes) are escaped by escape(), attribute values and :contains strings are not. Found by
TestHegelSerializationRoundTrips; the property skips values containing a quote or a backslash
while the bug is open.
'''

[[bug]]
id = "cascadia/3"
title = "String() does not escape a leading digit of a class name, so .\\31 x prints as .1x which does not parse"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinStringEscapesLeadingDigits"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
escape() (serialize.go) backslash-escapes a fixed list of punctuation but nothing else, so a
class (or id) whose name starts with a digit, or with a hyphen and a digit, is printed unescaped:
Parse(`.\31 x`) (the class "1x", which HTML allows) prints `.1x`, and reparsing fails with
"expected identifier, found 1 instead" because parseIdentifier requires a name-start character.
CSS Syntax serialises such identifiers with a hex escape (`.\31 x`). Ids reparse by accident
(parseIDSelector uses parseName, which allows a leading digit). Found by
TestHegelSerializationRoundTrips; the property avoids such names while the bug is open.
'''

[[bug]]
id = "cascadia/4"
title = "The never-matching pseudo-classes :hover, :visited, :active, :focus and :target have specificity (0,0,0) instead of (0,1,0)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNeverMatchingPseudoClassSpecificity"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
neverMatchSelector.Specificity (selector.go) returns the zero Specificity. Every pseudo-class
counts as (0,1,0) in the Selectors specification whatever it matches in a static context, and
the library counts its other pseudo-classes so, but Parse(":hover").Specificity() is [0 0 0] and
Parse("a:hover").Specificity() equals Parse("a").Specificity(). Found by
TestHegelSpecificityFollowsTheSpec; the model returns 0 for these while the bug is open.
'''

[[bug]]
id = "cascadia/5"
title = "An option inside a disabled optgroup is :enabled and not :disabled"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOptionInDisabledOptgroup"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HTML defines an option as actually disabled when it has a disabled attribute or when its parent
is a disabled optgroup; enabledPseudoClassSelector and disabledPseudoClassSelector
(pseudo_classes.go) know only the attribute and the disabled-fieldset ancestry. For
<optgroup disabled><option id="o"></option></optgroup>, QueryAll(":disabled") returns the
optgroup only and QueryAll(":enabled") returns the option; soupsieve returns both for :disabled
and nothing for :enabled. Found by TestHegelSelectorsAgreeWithSoupsieve; the generator does not
disable optgroups while the bug is open.
'''

[[bug]]
id = "cascadia/6"
title = ":has() relative selectors are not anchored at the subject, so span:has(div b) matches a span whose div ancestor is outside it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHasIsScoped"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Selectors Level 4 defines the argument of :has() as a relative selector anchored at :scope, the
element being tested: `span:has(div b)` means a span with a descendant b that has a div ancestor
inside the span. relativeMatch (pseudo_classes.go) instead tests each descendant (or sibling)
against the whole complex selector with no bound on where its earlier compounds are found, so for
<div><span><b></b></span></div>, QueryAll("span:has(div b)") returns the span (the div is above
it) and ":has(* *)" matches the span too (b has an ancestor, outside the span). The same holds
for :haschild and for the explicit combinators (`span:has(> div > b)` matches the span). soupsieve
returns nothing for these. Found by TestHegelSelectorsAgreeWithSoupsieve; the generator gives
:has arguments a single compound while the bug is open.
'''

[[bug]]
id = "cascadia/7"
title = ":enabled matches a, area and link elements with an href"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLinksAreNotEnabled"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
enabledPseudoClassSelector (pseudo_classes.go) returns true for atom.A, atom.Area and atom.Link
with an href attribute. HTML defines :enabled as matching button, input, select, textarea,
optgroup, option, fieldset and form-associated custom elements that are not actually disabled;
hyperlinks are not in the list (nor can they be :disabled, so the library's :enabled and
:disabled are not complementary over form controls and links alike). soupsieve returns only the
form controls. Found by TestHegelSelectorsAgreeWithSoupsieve; the soupsieve property does not
use :enabled and the model accepts the links while the bug is open.
'''

[[bug]]
id = "cascadia/8"
title = "[attr^=val], [attr$=val] and [attr*=val] never match a white-space-only attribute value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBlankValuesMatchSubstrings"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
attributePrefixMatch, attributeSuffixMatch and attributeSubstringMatch (selector.go) return
false when strings.TrimSpace(attribute value) is empty, so for <div title=" "> the selectors
`[title^=" "]`, `[title$=" "]` and `[title*=" "]` match nothing although the value begins with,
ends with and contains the (non-empty) operand; only an empty operand is defined to match
nothing. soupsieve matches the div. Found by TestHegelSelectorsAgreeWithSoupsieve; the generator
avoids white-space-only operands with these operators while the bug is open.
'''

[[bug]]
id = "cascadia/9"
title = ":lang compares the lang attribute case-sensitively, so :lang(en) misses lang=EN and :lang(en-us) misses lang=en-US"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLangIsCaseInsensitive"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The parser lowercases the :lang argument but langPseudoClassSelector.Match (pseudo_classes.go)
compares it with the raw attribute value (val == s.lang || strings.HasPrefix(val, s.lang+"-")).
Language tags are case-insensitive (BCP 47, and Selectors: "the comparison is performed
case-insensitively"), and lang="en-US" is the usual spelling: :lang(en-us) does not match it,
and :lang(en) does not match lang="EN". soupsieve matches both. Found by
TestHegelSelectorsAgreeWithSoupsieve; the generator writes lang attributes in lower case while
the bug is open.
'''

[[bug]]
id = "cascadia/10"
title = ":lang looks past an element's own lang attribute to its ancestors, so :lang(en) matches a lang=fr child of an English element"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLangUsesTheNearestAttribute"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
langPseudoClassSelector.Match (pseudo_classes.go) returns own || s.Match(n.Parent): when the
element's own lang attribute does not match it keeps climbing. The language of an element is
determined by its nearest lang attribute (HTML, "the lang and xml:lang attributes"), so for
<div lang="en"><span lang="fr"></span><em lang=""></em></div>, :lang(en) should match only the
div; the library matches the span (French) and the em (unknown language) as well. soupsieve
matches the div only. Found by TestHegelSelectorsAgreeWithSoupsieve; the generator does not
nest lang attributes while the bug is open.
'''

[[bug]]
id = "cascadia/11"
title = ":empty treats a text node of Unicode white space such as U+00A0 as empty"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyKeepsNonBreakingSpace"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
emptyElementPseudoClassSelector (pseudo_classes.go) ignores a text child when
strings.TrimSpace(c.Data) == "", and TrimSpace trims all Unicode white space (U+00A0, U+2003,
U+0085, ...). Selectors Level 4 lets :empty ignore only document white space (space, tab, line
feed, carriage return, form feed), so <p>&nbsp;</p> is not empty; soupsieve does not match it.
Found by TestHegelSelectorsAgreeWithSoupsieve; the generator does not produce such text nodes
while the bug is open.
'''

[[bug]]
id = "cascadia/12"
title = "Attribute selectors compare the values of type, dir, lang and the other case-insensitive HTML attributes case-sensitively"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHTMLAttributeValuesCaseInsensitive"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HTML ("Case-sensitivity of selectors") lists the attributes whose values attribute selectors
must match ASCII case-insensitively in HTML documents: type, dir, lang, checked, disabled,
selected, rel, method, ... For <input type="CHECKBOX">, `[type=checkbox]` and `[type^=check]`
match nothing in the library (attrSelector.Match compares exactly unless the i flag is given)
while :checked accepts the upper-case type; soupsieve matches. Found by
TestHegelSelectorsAgreeWithSoupsieve; the generator adds the i flag on these attributes while
the bug is open.
'''

[[bug]]
id = "cascadia/13"
title = "A zero hex escape yields U+0000 instead of U+FFFD"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroEscapeIsReplacementCharacter"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Syntax Level 3 (consume an escaped code point): if the hex number is zero, a surrogate, or
greater than the maximum allowed code point, return U+FFFD. parseEscape (parser.go) returns
string(rune(v)), which gives U+FFFD for surrogates and out-of-range values through Go's rune
conversion but U+0000 for zero, so `#a\0 b` looks for the id "a\x00b" and does not match an
element with id="a�b" (the form the HTML parser produces from a literal NUL as well).
Found while writing the escape renderer for TestHegelParserIgnoresSpelling, which does not
generate zero escapes.
'''

[[bug]]
id = "cascadia/14"
title = "A fieldset inside a disabled fieldset is :enabled and not :disabled"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNestedFieldsetIsDisabled"
found = { commit = "154416acceb25b62dec074c428dd255bd950711d", version = "v1.3.5+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HTML defines a fieldset as disabled when it has the attribute or when it is a descendant of
another disabled fieldset outside that fieldset's first legend. enabledPseudoClassSelector and
disabledPseudoClassSelector (pseudo_classes.go) apply the ancestry rule (inDisabledFieldset) to
button, input, select, textarea and option but test only the attribute for fieldset, optgroup
and menuitem, so for <fieldset disabled><fieldset id="g"><input></fieldset></fieldset> the inner
fieldset is :enabled and not :disabled while its input is :disabled. soupsieve returns the inner
fieldset for :disabled. Found by the pin written from the HTML definition (the model in
TestHegelSelectorsAgreeWithTheModel accepts the behaviour while the bug is open).
'''
