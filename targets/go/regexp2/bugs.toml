# Bugs found in dlclark/regexp2 by the Hegel properties. Each is pinned by the test named in
# `test`, listed as an expected failure in target.toml.

[[bug]]
id = "regexp2/1"
title = "A branch beginning with a literal or positive class before a branch beginning with `.` or a negated class is never matched: the first-character filter merges the two sets into a negation"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinAlternationKeepsTheLiteralBranch"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`a|.` does not match "a"; `a|.` on "ba" matches at 1, not 0; `x|a|.` finds nothing in "xa";
`\\.|[^"\\]` (the usual string-literal tokenizer) never matches an escape; `(a)|.`, `a*.`,
`(a||b)+.` and `é|.` fail the same way, with and without the RE2 option. The engine is right —
anchored with \G at the position every one of these matches — the start-position search is
wrong: syntax/prefixanalyzer.go `tryFindFirstCharClass` collects the characters that can begin
a match into one CharSet; on a "not one" node (`.`, which is `[^\n]`) it does `cc.addChar(node.Ch);
cc.negate = true` — right when the set is still empty, but when the set already holds the
positive characters of an earlier branch or of a zero-minimum loop ({a}) the result is `[^a\n]`
instead of "anything but \n", and `IsMergeable` (which only refuses already-negated sets) does
not stop it. A negated NtSet (`[^x]`, `\D`, `\W`, `\S`) merged into a positive set goes the same
way. The set becomes the FixedDistanceSet at distance 0 (`FindMode` LeadingSet_LeftToRight) or
the FcPrefix, and every start position whose character is in the positive part is skipped.
Any alternation that lists specific words before a catch-all — `if|else|.`, `"|[^"]`,
`\d+|\D` — silently loses the specific branches. Fix: when merging a negated set into a
non-empty non-negated set, either compute the real union (complement of the negated set's
characters minus the positive ones) or give up on the optimisation (return 0), as the comment
above `findFirstCharClass` says the code means to. The reverse order (`.|a`) is right because
the negated set arrives first and is then unmergeable.
'''

[[bug]]
id = "regexp2/2"
title = "compat's FindAll, FindAllIndex and FindAllStringIndex return an empty non-nil slice, not nil, when n is positive and nothing matches"
kind = "contract"
severity = "low"
test = "TestHegelPinCompatFindAllReturnsNilWhenNothingMatches"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
regexp documents "A return value of nil indicates no match" for every Find method, and the
compat package exists to give regexp.Regexp's signatures and results. With n = -1 the adapter
returns nil, with n = 1 or 2 it returns `[][]int{}` / `[][]byte{}`: `Regexp.FindAllRunesIndex`
pre-allocates `make([][]int, 0, n)` for a positive n and returns it unfilled, and
`compat.FindAllIndex`/`FindAll`/`FindAllStringIndex` pass it on (the string/submatch variants
build their own slices and are right). `if locs == nil` checks in callers — the idiom regexp
teaches — see a match that is not there. Fix: return nil when no match was found.
'''

[[bug]]
id = "regexp2/3"
title = "Replace and ReplaceFunc with count 0 return the empty string instead of the input"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReplaceWithCountZeroReturnsTheInput"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
replace.go `replace()`: `if count == 0 { return "", nil }`. Count is "the maximum number of
times the replacement can occur" (.NET's Regex.Replace(input, replacement, count, startat),
which this ports, returns the input unchanged for count 0); a caller computing a limit that
comes out as 0 loses the whole text. `Replace("a-b", "+", -1, 0)` = "" (want "a-b"), same for
ReplaceFunc. Fix: `return input, nil`.
'''

[[bug]]
id = "regexp2/4"
title = "Split's count is the number of matches used, not the number of pieces: count 2 makes two splits and exactly one split is unreachable"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSplitCountIsTheNumberOfPieces"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Split("a-b-c-d", 2)` = ["a" "b" "c-d"], `Split("a-b-c-d", 3)` = ["a" "b" "c" "d"]. .NET's
Regex.Split(input, count) — the method this ports, with the same special cases (0 → nothing,
1 → the input) — returns at most count substrings: ["a" "b-c-d"] and ["a" "b" "c-d"]. split.go
special-cases count == 1 and then runs the loop `for ; m != nil && count > 0; …count--`, using
count matches, so count 1 gives no split and count 2 gives two; no count value yields one
split, and the documentation's "Count limits the number of matches to process. If Count is 1,
returns the original input" cannot be read consistently either. strings.SplitN-style callers
(`Split(s, 2)` to cut at the first separator) get three pieces. Fix: `count--` after the
count == 1 check, as .NET does.
'''

[[bug]]
id = "regexp2/5"
title = "Split adds an empty string for every capturing group that did not take part in the match"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSplitOmitsGroupsThatDidNotTakePart"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
Documented: "If capturing parentheses are used in the Regex expression, any captured text is
included in the resulting string array". A group that did not participate captured no text,
and Regex.Split adds only groups with `IsMatched(i)`. split.go adds `""` for every group
regardless (its comment: "Preserve group order and empty strings for unmatched groups"):
`Split("a-b", -1)` with `-(x)?` gives ["a" "" "b"] (want ["a" "b"]), with `(x)|-` the same,
with `(-)|(x)` ["a" "-" "" "b"]. A pattern of alternatives with one group each — the natural
way to tag which separator was seen — yields a slice interleaved with blanks, and the length
of the result no longer tells how many separators matched.
'''

[[bug]]
id = "regexp2/6"
title = "In RE2 mode \\b and \\B use Unicode word characters while \\w is ASCII, so the compat adapter disagrees with regexp around accented and CJK letters"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRE2ModeWordBoundaryIsASCII"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The RE2 option documents `\d`, `\s`, `\w` as "RE2 definitions" (ASCII), and `\w` is: in RE2
mode `\w` finds nothing in "é". `\b` is "between \w and \W" and in RE2 (and Go's regexp) it is
ASCII too, but regexp2's word-boundary check still uses the .NET Unicode word class:
`compat.MustCompile("\\bb", RE2).FindStringIndex("éb")` is nil (regexp: [2 3]),
`\B日` matches "a日" (regexp: no match), `\b` matches at 0 in "é" (regexp: nowhere), `é\b` finds
nothing in "éa" (regexp: [0 2]). Any `\b`-delimited search over text with accented letters
gives different words from the standard library it claims compatibility with, and is
inconsistent with the mode's own `\w`. Fix: when RE2 is set (and not ECMAScript), `\b`/`\B`
should test RE2's ASCII word class, as `\w` does.
'''

[[bug]]
id = "regexp2/7"
title = "compat returns submatches in .NET group order (unnamed first) when named and unnamed groups are mixed, permuting them against regexp"
kind = "contract"
severity = "low"
test = "TestHegelPinCompatSubmatchesFollowRegexpOrder"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
regexp numbers groups in order of appearance; .NET numbers unnamed groups first and named
groups after them, and regexp2 follows .NET unless `OptionMaintainCaptureOrder()` is given.
The compat adapter, whose purpose is regexp.Regexp's results for regexp2's engine, keeps the
.NET order: `compat.MustCompile("(?P<g1>a)(b)", RE2).FindStringSubmatch("ab")` is
["ab" "b" "a"] (regexp: ["ab" "a" "b"]); `(a)(?P<g2>b)(c)` gives ["abc" "a" "c" "b"]. Every
*Submatch* and *SubmatchIndex* method is affected whenever a pattern mixes `(?P<name>…)` with
plain groups — `SubexpIndex`-style code and positional destructuring silently read the wrong
group. Fix: compat.Compile should add OptionMaintainCaptureOrder (or the RE2 option should
imply it), or the README should say the compat package requires it.
'''

[[bug]]
id = "regexp2/8"
title = "A greedy loop of non-word characters followed by \\B is made atomic, so \\D+\\B, \\W+\\B and -+\\B never give back a character: \\D+\\B finds nothing in \"ba\""
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNonBoundaryAfterANonWordLoopBacktracks"
found = { commit = "9d0d2ffe88a8b90012f7979ec85424e46d5ef48f", version = "v2.8.0", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`\D+\B` on "ba": `\D+` takes "ba", `\B` at the end fails (a is a word character, the end is
not), and the loop must give back "a" so that `\B` sits between "b" and "a" — Perl, and
regexp2 itself in RE2 mode (where `\D` is the plain range `[^0-9]`), answer 0+1. In the default
mode there is no match; `\D+\B|a` on "ba" finds only the "a" at 1; `\W+\B` on "--a", `\W{2,}\B`
on "---a", `(\D+)\B`, `\D{1,2}\B`, `[\D]+\B` and `\D+(?:\B)` all fail the same way, and
`-+\B` on "--a", ` +\B` on "  a", `-{1,3}\B` fail in both modes (`\G`-anchored at 0 too, so it
is the matcher, not the start-position search). syntax/tree.go `canBeMadeAtomic`: a set loop
with M > 0 whose set equals NotWordClass or NotDigitClass, or a one-character loop of a
non-word character, is treated as unaffected by backtracking when a `\B` follows ("goto end"
then, with nothing after `\B`, the loop becomes Setloopatomic/Oneloopatomic). The reasoning
holds for `\b` after word characters (`\w+\b`: the greedy loop stops before a non-word
character or the end, where the boundary always holds) but not for `\B` after non-word
characters: the greedy loop stops before a word character, where `\B` fails, and one step
back — between two non-word characters — `\B` holds; and `\D` contains word characters in
the first place. Any pattern tokenising runs of separators up to but excluding the last one
(`\W+\B`, `-+\B`) or a non-digit run not ending at a word edge is affected. Fix: drop the
NtNonboundary/NtNonECMABoundary lines from the set-loop and one-loop rules (keep the `\b`
ones), or restrict them to loops that cannot be followed by a word character.
'''
