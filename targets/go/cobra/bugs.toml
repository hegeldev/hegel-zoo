# Bugs found in github.com/spf13/cobra by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure in
# target.toml.

[[bug]]
id = "cobra/1"
title = "The dispatcher does not see that the last letter of a combined short token takes the next argument"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCombinedShortValue"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root with a persistent bool -a and a persistent string -f, and a subcommand sub: `root -af x
sub` fails with `unknown command "x" for "root"`; with TraverseChildren it runs root with the
argument [sub] and --file=x. pflag's grammar (parseShortArg) reads -af x as -a and -f x, so
the command line names sub with --file=x; `root -a -f x sub` and `root -fx sub` do run sub.
stripFlags and argsMinusFirstX (command.go) only skip the argument after a token of length 2
(`-f`) or a long flag; a token of three or more characters without '=' is skipped alone, so its
value is taken for the command name. Traverse has the same rule (isFlagArg without inFlag).
`root -af sub` is `flag needs an argument: 'f' in -f`, reported by sub, where pflag would set
--file=sub. Found by TestHegelExecute.
"""

[[bug]]
id = "cobra/2"
title = "With TraverseChildren, -- is taken for a flag with a value and the command names after it are still dispatched"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinTraverseDashDash"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root (TraverseChildren) with a subcommand sub: `root -- x sub` runs sub with no arguments;
without TraverseChildren it runs root with [x sub], as "--" terminates the flags and the
command names (stripFlags: `case s == "--": break Loop`). Traverse (command.go) matches "--"
with `strings.HasPrefix(arg, "--") && !strings.Contains(arg, "=")`, looks up the flag named ""
(hasNoOptDefVal returns false) and sets inFlag: "--" and the argument after it are collected
as a flag with its value, the next argument is matched against the subcommands, and the
collected "flags" are parsed by the parent - whose positional arguments (x) are dropped, since
only the child's remaining arguments reach a Run. `root -- x y` (no command name after)
happens to work, with x and y positional for root. Found by TestHegelExecute.
"""

[[bug]]
id = "cobra/3"
title = "With TraverseChildren a root with subcommands accepts an unknown command as an argument"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinTraverseUnknownCommand"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root (runnable, subcommands, Args nil): `root extra` is `unknown command "extra" for "root"`,
as args.go documents for legacyArgs ("root commands with subcommands will do subcommand
validity checking"); with root.TraverseChildren = true it runs root with the argument [extra].
Find applies legacyArgs when the found command has no Args validator; Traverse returns
without it (ExecuteC calls one or the other), so the check documented for a nil Args depends
on TraverseChildren, whose documentation only speaks of parsing the parents' flags. Found by
TestHegelExecute.
"""

[[bug]]
id = "cobra/4"
title = "OnlyValidArgs computes its suggestions for the first argument, not for the invalid one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidArgsSuggestion"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root with Args = OnlyValidArgs, ValidArgs [alpha beta] and a subcommand list: `root alpha lis`
is `invalid argument "lis" for "root"` with no suggestion, while `root lis alpha` suggests
list. args.go: `fmt.Errorf("invalid argument %q for %q%s", v, cmd.CommandPath(),
cmd.findSuggestions(args[0]))` - the message names the invalid argument v but asks for the
suggestions of args[0]. Found by TestHegelExecute.
"""

[[bug]]
id = "cobra/5"
title = "With prefix matching and TraverseChildren an empty argument dispatches a command's only subcommand"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyArgPrefix"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
EnablePrefixMatching and root.TraverseChildren; sub has a single subcommand child: `root sub
""` runs child with no arguments instead of sub with the argument [""]. Traverse passes every
argument that is not a flag to findNext; hasNameOrAliasPrefix (`strings.HasPrefix(c.Name(),
prefix)`) holds for the empty prefix, so with exactly one subcommand there is exactly one
match. Find never gets there (stripFlags skips empty arguments: `case s != "" &&
!strings.HasPrefix(s, "-")`), so `root sub ""` runs sub without TraverseChildren. Found by
TestHegelExecute.
"""

[[bug]]
id = "cobra/6"
title = "With TraverseChildren a help flag on a parent followed by an argument and a command name is the error pflag: help requested"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTraverseHelpFlag"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root (TraverseChildren) with a subcommand sub: `root --help x sub` and `root -h x sub` fail
with `pflag: help requested` (Error: pflag: help requested / Run 'root --help' for usage.)
and no help is shown; `root sub --help x child` the same. The help flag is only defined by
execute() (InitDefaultHelpFlag, "at the last point possible to allow for user overriding"),
so when Traverse parses a parent's flags (c.ParseFlags(flags) before descending) --help is
unknown to pflag, which treats an undefined help flag specially and returns its sentinel
ErrHelp; Traverse returns that error and ExecuteC prints it as any other. Found by
TestHegelExecute.
"""

[[bug]]
id = "cobra/7"
title = "The help command is refused when a required persistent flag or a flag group of the root is not satisfied"
kind = "contract"
severity = "medium"
test = "TestHegelPinHelpCommandRequiredFlag"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root with a persistent --file marked required (MarkPersistentFlagRequired) and a subcommand
sub: `root help` and `root help sub` fail with `required flag(s) "file" not set` and show no
help, while `root --help` and `root sub --help` show it. The same with MarkFlagsOneRequired on
persistent flags: `root help sub` is `at least one of the flags in the group [json yaml] is
required`. The help command (InitDefaultHelpCmd) is an ordinary runnable subcommand, so
execute() validates the required flags and flag groups it inherits before its Run; the help
flag is checked before them ("If help is called, regardless of other flags, return we want
help"). Found by TestHegelExecute.
"""

[[bug]]
id = "cobra/8"
title = "The dispatcher takes the argument after --help, -h, --version or -v for the flag's value"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHelpFlagBeforeCommand"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root with subcommand sub, itself with subcommand child: `root --help sub child` and `root -h
sub child` fail with `unknown command "child" for "root"`; `root --help sub` shows the help of
root, not of sub, while `root --all sub` (a persistent bool flag) runs sub. With root.Version
set, `root -v sub child` is the same unknown-command error and `root --version sub` prints the
version without a word about sub. The help and version flags are added by execute(), after
Find or Traverse has run, so the dispatcher does not know them (hasNoOptDefVal is false for an
unknown name), assumes they take a value and skips the argument after them; the command name
becomes the value and the next argument an unknown command. `--help=false sub` does dispatch
sub (a token with '=' is skipped alone). Found by TestHegelExecute.
"""

[[bug]]
id = "cobra/9"
title = "Prefix matching ignores EnableCaseInsensitive"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinPrefixCaseInsensitive"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
EnablePrefixMatching and EnableCaseInsensitive, root with a subcommand sub: `root SUB` and
`root su` run sub, `root Su` is `unknown command "Su" for "root"` (with sub suggested, since
the suggestions compare lower-cased). findNext uses commandNameMatches (EqualFold when
EnableCaseInsensitive) for the exact names and aliases but hasNameOrAliasPrefix uses
strings.HasPrefix as it is. EnableCaseInsensitive is documented as "allows case-insensitive
commands names" with no exception for prefixes. Found by TestHegelExecute.
"""

[[bug]]
id = "cobra/10"
title = "A command whose name is within the distance and whose SuggestFor matches is suggested twice"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDuplicateSuggestion"
found = { commit = "adbc8813901bba65827259daa8e22ff94ec1f30e", version = "v1.10.2+", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
root with a subcommand ls whose SuggestFor is [ps]: `root ps` is `unknown command "ps" for
"root"` followed by "Did you mean this?" listing ls twice. SuggestionsFor (command.go)
appends the name once for the Levenshtein distance (ld("ps", "ls") = 1 <= 2) or prefix match
and once more for each SuggestFor entry that matches, without checking that the name is
already listed. Found by TestHegelExecute.
"""
