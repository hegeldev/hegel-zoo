name = "cobra"
language = "go"
upstream = "https://github.com/spf13/cobra"
subdir = ""
license = "Apache-2.0"  # LICENSE.txt; CONTRIBUTING.md (commit adbc881, 2026-07-11) asks for a CLA and tests and says nothing about AI-written code (checked 2026-09-22; no AGENTS.md or CLAUDE.md in the tree)
ai_policy_checked = "2026-09-22"

[base]
commit = "adbc8813901bba65827259daa8e22ff94ec1f30e"
date = "2026-07-11"
version = "v1.10.2+"  # the commits on main after the newest release tag, v1.10.2

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
TestHegelPinCombinedShortValue = "cobra/1"
TestHegelPinTraverseDashDash = "cobra/2"
TestHegelPinTraverseUnknownCommand = "cobra/3"
TestHegelPinValidArgsSuggestion = "cobra/4"
TestHegelPinEmptyArgPrefix = "cobra/5"
TestHegelPinTraverseHelpFlag = "cobra/6"
TestHegelPinHelpCommandRequiredFlag = "cobra/7"
TestHegelPinHelpFlagBeforeCommand = "cobra/8"
TestHegelPinPrefixCaseInsensitive = "cobra/9"
TestHegelPinDuplicateSuggestion = "cobra/10"
TestHegelPinCompletionFlagsParsedOnce = "cobra/11"
TestHegelPinCompletionCombinedShort = "cobra/12"
TestHegelPinCompletionCaseInsensitive = "cobra/13"
TestHegelPinCompletionTraversePersistentFlag = "cobra/14"
TestHegelPinCompletionNoDescPrefix = "cobra/15"
# The wide property of the dispatcher draws the shapes of cobra/1 to 10 (the corner shapes at
# 35 % of its cases): 39 of forty runs at a hundred cases failed (a second forty 40 of 40),
# the plurality basin cobra/1 (10 runs; 9 in nine, 3 in seven, 2 and 8 in five each); mapped
# intermittent to it. The ten narrow properties each draw one bug's shape region and fail on
# it every run (40 of 40 each).
TestHegelExecute = { bug = "cobra/1", intermittent = true }
TestHegelExecuteCombinedShortValuesAreSkipped = "cobra/1"
TestHegelExecuteDashDashEndsTheCommandNames = "cobra/2"
TestHegelExecuteTraverseRejectsUnknownCommands = "cobra/3"
TestHegelExecuteInvalidArgumentsAreSuggested = "cobra/4"
TestHegelExecuteEmptyArgumentsNameNoCommand = "cobra/5"
TestHegelExecuteHelpFlagsOnParentsShowHelp = "cobra/6"
TestHegelExecuteHelpCommandNeedsNoFlags = "cobra/7"
TestHegelExecuteHelpFlagsTakeNoValue = "cobra/8"
TestHegelExecutePrefixesAreCaseInsensitive = "cobra/9"
TestHegelExecuteSuggestionsAreUnique = "cobra/10"
# The completion property draws cobra/11 at 1.8 % of its cases and the dispatcher's shapes
# through its cut execution prefixes: 38 of forty runs at a hundred cases failed, the
# plurality basin cobra/11 (15 runs; 2 in six, 1 and 8 in five each); mapped intermittent to
# it. The five narrow properties fail on their bug every run (40 of 40 each).
TestHegelComplete = { bug = "cobra/11", intermittent = true }
TestHegelCompleteFunctionsSeeFlagsOnce = "cobra/11"
TestHegelCompleteCombinedShortValuesKeepTheirLetters = "cobra/12"
TestHegelCompleteSubcommandPrefixesAreCaseInsensitive = "cobra/13"
TestHegelCompleteTraversePersistentFlagsBeforeNames = "cobra/14"
TestHegelCompleteNoDescHidesDescriptions = "cobra/15"
