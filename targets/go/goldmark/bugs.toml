[[bug]]
id = "goldmark/35"
title = "A one-character info string of a fence on the document's last line is dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFenceInfoAtEndOfDocumentIsKept"
found = { commit = "63f3cd21f55491378043e54cfb5996c27f95afce", version = "v2.1.5+", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
"```x" — a fence opened on the document's last line, no final newline — gives
`<pre><code></code></pre>`; commonmark.js and micromark give
`<pre><code class="language-x"></code></pre>`. "~~~x", "````x" and the fence inside a container
("> ```x", "- ~~~x") lose the class the same way; "```x\n", "```xy" and "``` x" keep it. Spec 4.5:
"The line with the opening code fence may optionally contain some text following the code fence;
this is trimmed of leading and trailing spaces or tabs and called the info string."
`parser/fcode_block.go`, `fencedCodeBlockParser.Open`: `if i < len(line)-1` reads the info string
only when at least two bytes follow the fence, which on every line but an unterminated last one
are the character and its line ending. v1.8.6 does the same. Found by the CommonMark property in
the rewrite of 2026-10-07.
'''

[[bug]]
id = "goldmark/36"
title = "\"<pre/>\" opens a type-1 HTML block that runs to the end of the document"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSelfClosingPreEndsAtBlankLine"
found = { commit = "63f3cd21f55491378043e54cfb5996c27f95afce", version = "v2.1.5+", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`"<pre/>\na\n\nb"` gives `<pre/>\na\n\nb` — the whole document copied as raw HTML; commonmark.js
and micromark give `<pre/>\na\n<p>b</p>` (an HTML block ending at the blank line). `<script/>`,
`<style/>`, `<textarea/>` and `<PRE/>` the same, and `"<pre/>a\n\nb"` (text after the tag) is a
type-1 block too where the references read a paragraph. Spec 4.6, start condition 1: "line begins
with the string <pre, <script, <style, or <textarea (case-insensitive), followed by a space, a tab,
the string >, or the end of the line" — a `/` is none of these (`<pre />`, with a space, is type 1
everywhere). The references read the complete tag as a type-7 start (their type-7 scanners do not
exclude the raw names, which the spec's wording "with any tag name other than pre, script, style,
or textarea" does; under that strict reading the line is a paragraph, and goldmark is wrong either
way). `parser/html_block.go`, `scanHTMLBlockOpen1`: the clause
`(c == '/' && len(rest) > 1 && rest[1] == '>')` accepts `/>` right after the name. `<div/>` (type 6)
is fine. v1.8.6 does the same. Found by the CommonMark property in the rewrite of 2026-10-07.
'''

