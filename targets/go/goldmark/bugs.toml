title = "A backslash before a hard break's two trailing spaces escapes the next line's first character"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBackslashBeforeHardBreakDoesNotEscapeNextLine"
found = { commit = "63f3cd21f55491378043e54cfb5996c27f95afce", version = "v2.1.5+", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`"a\\  \n\\[b"` (Go literal: `a`, a backslash, two spaces, a line ending, an escaped bracket)
gives `<p>a\\<br />\n\\[b</p>` — the second line's backslash is kept and the bracket's escape is
lost; commonmark.js and micromark give `<p>a\\<br />\n[b</p>`. `"a\\  \n\\*b*"` gives
`<p>a\\<br />\n\\<em>b</em></p>` where the references give `<p>a\\<br />\n*b*</p>`: the escaped
star opens emphasis. Exactly two trailing spaces trigger it (with one, three or more, a space
takes the escape); an even run of backslashes before the spaces is fine; inside a block quote,
under CRLF and with a space before the next line's backslash the same. Spec 6.7 (the hard line
break is the two spaces; the backslash before them is text) and 2.4 ("Any ASCII punctuation
character may be backslash-escaped"). `parser/parser.go`, `parseBlock`: the two trailing spaces
are cut off the line (`lineLength = end - 2`) before the character loop runs, so the `escaped`
flag the final backslash sets is never cleared and carries into the next line, whose first byte is
then taken as escaped. v1.8.6 does the same. Found by the 20000-case HEGEL_NO_KNOWN=1 sweeps of
the rewrite of 2026-10-07.
'''

