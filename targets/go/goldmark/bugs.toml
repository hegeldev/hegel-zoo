[[bug]]
id = "goldmark/12"
title = "A delimiter run right after a bare block quote marker can close emphasis"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDelimiterAfterQuoteMarkerCannotClose"
found = { commit = "710cc2656aa3e91c5f026b41bed303f0125ce5e4", version = "v2.1.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`"> **a\\n>** b"` gives `<strong>a\\n</strong> b`. In the paragraph's content the second `**` is
preceded by a line ending (whitespace) and followed by a space, so it is neither left- nor
right-flanking and cannot close (spec 6.2); the oracles give `<p>**a\\n** b</p>`. `> ** b`
(marker, space, run) is fine, and so is the same text without the quote. GFM strikethrough
shows the same shape: `"> ~~a\\n>~~ b"` gives `<del>`. The quote marker's removal leaves the run
looking as if it began the line.
"""

