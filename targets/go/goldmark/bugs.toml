`"[a]: /u\n-\nb"` gives `<ul>\n<li></li>\n</ul>\n<p>b</p>`; commonmark.js and micromark give
`<p>-\nb</p>`. With a title (`"[a]: /u \"t\"\n-"`), the destination or the title on its own line,
