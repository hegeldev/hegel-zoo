[[bug]]
id = "goldmark/7"
title = "U+0000 is replaced on output instead of on input"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNulIsReplacedOnInput"
found = { commit = "710cc2656aa3e91c5f026b41bed303f0125ce5e4", version = "v2.1.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Spec 2.3: "For security reasons, the Unicode character U+0000 must be replaced with the
REPLACEMENT CHARACTER (U+FFFD)" — on the input, before parsing. goldmark replaces it when
writing text, so `"[a](/\\x00)"` gives `href="/%00"` (want `/%EF%BF%BD`), `"<http://\\x00.b>"`
is not an autolink (want a link to `http://%EF%BF%BD.b`), and a NUL next to a delimiter run is
neither whitespace nor punctuation for the flanking rules.
"""

