[[bug]]
id = "goldmark/33"
title = "The rule of three is applied with a closer's remaining length after a partial match"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRuleOfThreeUsesOriginalRunLengths"
found = { commit = "63f3cd21f55491378043e54cfb5996c27f95afce", version = "v2.1.5+", hegel = "v0.6.33", date = "2026-09-28" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`"**a*b*c **d***e\n"` gives `<p>**a<em>b</em>c <strong>d</strong>*e</p>`; commonmark.js, cmark
(cmark-gfm 0.29.0.gfm.13), markdown-it and goldmark v1.8.6 give
`<p>*<em>a<em>b</em>c <strong>d</strong></em>e</p>`. The closing run `***` can both open and
close; after two of its delimiters close `**d`, the remaining `*` looks for an opener and finds
the leading `**`. The spec's rule of three sums the lengths of the delimiter runs (2 + 3 = 5, so
the match is allowed); v2 sums with the closer's remaining length (2 + 1 = 3) and refuses it, and
keys the openers-bottom slot by that length too (`parser/delimiter.go`). micromark is the one
implementation that sides with v2. A v2 regression.
'''

