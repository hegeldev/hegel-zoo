id = "goldmark/9"
title = "After \"> \" a tab prevents block starts inside the quote"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTabAfterQuoteMarkerStartsBlocks"
found = { commit = "710cc2656aa3e91c5f026b41bed303f0125ce5e4", version = "v2.1.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`"> \\t- a"` gives `<blockquote><p>- a</p></blockquote>`; `"> \\t<div>"` a paragraph; a fence
after `> \\t` is read with one space of extra indentation. After `> ` (marker plus one space,
column 2) the tab reaches column 4 = two columns of indentation, well under four (spec 2.2 and
example 6); commonmark.js and micromark give a list, an HTML block, a clean fence. Headings and
thematic breaks after `> \\t` are fine, and `>\\t- a` (no space) is fine too.
"""

