id = "goldmark/16"
title = "A tab after a list item's content indent hides the next line's block start"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTabAfterContentIndentNestsList"
found = { commit = "710cc2656aa3e91c5f026b41bed303f0125ce5e4", version = "v2.1.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`"- a\\n  \\t- b"` gives `<li>a\\n- b</li>`. The item's content starts at column 2; the tab
reaches column 4, two columns of indentation relative to the content, so `- b` is a nested list
(the oracles give `<li>a<ul><li>b</li></ul></li>`). `"- a\\n  \\t> b"` is fine, so it is the
list-item (and HTML-block, fence) starts that see the tab as four columns; the same happens
deeper in nested items, where a line `<a href='x'>` after a blank line becomes inline HTML in a
new paragraph instead of an HTML block.
"""

