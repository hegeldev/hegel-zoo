# Bugs found in goldmark v2 by the Hegel tests in hegel.patch. Each row's `test` is the pin that
# asserts the correct (CommonMark 0.31.2 / GFM) behaviour and fails while the bug exists.
# commonmark.js 0.31.2 and micromark 4.0.2 (+ micromark-extension-gfm 3.0.0) are the oracles;
# every row below is a case where both give the spec's answer. Unless a row says otherwise the
# bug is also in goldmark v1.8.6 (the last v1 release, tested through the same properties).

[[bug]]
id = "goldmark/1"
title = "A leading byte order mark is rendered as text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLeadingBomIsSkipped"
found = { commit = "710cc2656aa3e91c5f026b41bed303f0125ce5e4", version = "v2.1.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`"\\uFEFF# a"` gives `<p>\\uFEFF# a</p>`: the U+FEFF stays in the text and hides the heading.
commonmark.js, micromark and cmark skip a leading BOM (the spec is silent; every reference
implementation strips it, as editors on Windows write it).
"""

