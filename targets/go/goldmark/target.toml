name = "goldmark"
language = "go"
upstream = "https://github.com/yuin/goldmark"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # AGENTS.md (CLAUDE.md includes it) gives agents build, lint and commit-message instructions; the README recommends LLMs for the v1 to v2 migration; no restriction anywhere. The zoo files no issues and opens no PRs upstream.

[base]
commit = "63f3cd21f55491378043e54cfb5996c27f95afce"
date = "2026-09-19"
version = "v2.1.5+"

[hegel]
version = "v0.6.33"

[run]
# The oracles run under node (22 in CI): commonmark.js 0.31.2, micromark 4.0.2 and its GFM
# extensions, installed under .hegel/ so they stay out of the patch. goldmark v1.8.6, the other
# oracle, is a Go module requirement added by the patch.
setup = ["npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel commonmark@0.31.2 micromark@4.0.2 micromark-extension-gfm@3.0.0"]
command = "go test -count=1 -v ."

