# Bugs found in holiman/uint256 by the Hegel zoo. Oracle: math/big.

[[bug]]
id = "uint256/1"
title = "Float64 truncates the mantissa instead of returning the nearest float64"
kind = "wrong-result"
severity = "medium"
test = "TestHegelFloat64IsTheNearestFloat"
found = { commit = "3b6e9cdebb7a0462a2748bf24d7fac2b8a943666", version = "v1.3.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Float64 is documented as "the float64 value nearest to x". For values of 65 bits or more it
takes the top 52 bits below the leading one as the mantissa and drops the rest, i.e. it rounds
toward zero: `0x1ffffffffffffffff` (2^65-1) gives 9007199254740991p+12 = 2^65-2^13 where the
nearest float64 is 2^65; `0x10000000000000fff` gives 2^64 where the nearest is 2^64+2^12;
`2^256-1` gives 2^256-2^204 where big.Float gives 2^256. Values below 2^64 go through
float64(uint64) and are rounded correctly, which is why upstream's TestFloat64 (powers of two
only) passes; upstream's FuzzFloat64 compares against big.Float and fails on the first random
input when run with -fuzz.
'''

[[bug]]
id = "uint256/2"
title = "UnmarshalJSON rejects the JSON null that encoding/json hands to Unmarshalers"
kind = "wrong-result"
severity = "low"
test = "TestHegelUnmarshalJSONAcceptsNull"
found = { commit = "3b6e9cdebb7a0462a2748bf24d7fac2b8a943666", version = "v1.3.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json passes the literal `null` to a type's UnmarshalJSON (for a non-pointer field it
cannot set nil), and by the package's convention Unmarshalers treat it as a no-op; math/big's
Int.UnmarshalJSON does ("Ignore null, like in the main JSON package"). uint256 hands it to
SetFromDecimal and fails with `strconv.ParseUint: parsing "null": invalid syntax`, so
`json.Unmarshal([]byte(`{"A":null}`), &struct{ A uint256.Int }{})` errors while the same
document decodes into a struct with a big.Int field.
'''

[[bug]]
id = "uint256/3"
title = "String, Dec, Hex, MarshalText, MarshalJSON and Value panic on a nil *Int"
kind = "crash"
severity = "low"
test = "TestHegelNilReceiversDoNotPanic"
found = { commit = "3b6e9cdebb7a0462a2748bf24d7fac2b8a943666", version = "v1.3.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The library handles a nil receiver in Format (prints `<nil>`), ToBig and IntoBig (documented:
"Return nil if z is nil") and EncodeRLP (writes 0x80), and math/big's Int returns "<nil>" from
String and MarshalText and "null" from MarshalJSON on a nil pointer. uint256's String, Dec,
Hex, MarshalText, MarshalJSON and Value dereference the receiver and panic with a nil pointer
dereference. fmt catches the panic for `%s` of a Stringer, and encoding/json never calls
MarshalJSON on a nil pointer, so it shows on direct calls and through text/template or
database/sql drivers that call Value/String themselves.
'''

[[bug]]
id = "uint256/4"
title = "MulDivOverflowRem mishandles aliasing: m == d panics, m == z loses the remainder"
kind = "crash"
severity = "medium"
test = "TestHegelMulDivOverflowRemHandlesAliasing"
found = { commit = "3b6e9cdebb7a0462a2748bf24d7fac2b8a943666", version = "v1.3.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
MulDivOverflowRem clears the remainder argument `m` before udivrem reads the divisor `d`, so
`z.MulDivOverflowRem(x, y, d, d)` divides by a zeroed divisor and panics with `index out of
range [-1]` inside udivrem (7, 9, 5 is enough). When the remainder aliases the receiver,
`z.MulDivOverflowRem(x, y, d, z)`, udivrem writes the remainder into z and the quotient is then
stored over it, so both returned pointers hold the quotient (12, 12 instead of 12, 3). The
library otherwise supports aliasing — DivMod explicitly un-aliases z == m, and upstream's own
tests check every "reuse an argument as the result" form for the binary and ternary
operations; the other aliases of this method (z == x, m == x, m == y) do work.
'''

[[bug]]
id = "uint256/5"
title = "PaddedBytes drops the high bytes when n is shorter than the value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPaddedBytesKeepsTheValue"
found = { commit = "3b6e9cdebb7a0462a2748bf24d7fac2b8a943666", version = "v1.3.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
PaddedBytes is documented as encoding the value "as a 0-padded byte slice. The length of the
slice is at least n bytes" — padding, not truncation. The implementation allocates exactly n
bytes and copies the low n bytes into it: `NewInt(0x1234).PaddedBytes(1)` is `[0x34]`,
`PaddedBytes(0)` is empty, and `SetAllOne().PaddedBytes(20)` is 20 bytes of 0xff. A caller
following the documentation (pad to at least 20 bytes) silently loses the value for anything
wider than 20 bytes.
'''
