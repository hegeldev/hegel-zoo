# Bugs found in go-jose/go-jose by the zoo's Hegel tests (hegel/ in the patch). Each pin (test)
# fails while the bug is open. The reference is joserfc 1.7.5 (Python, RFC 7515-7519 and 7638)
# reading what go-jose writes and writing what go-jose reads, plus the RFC text and go-jose's
# own documentation where the two disagree.

[[bug]]
id = "go-jose/1"
title = "JSONWebKey.Thumbprint fails for a symmetric key ([]byte) with unknown key type, though RFC 7638 section 3.2 defines the thumbprint of an oct key and JSONWebKey documents []byte as a supported Key"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSymmetricThumbprint"
found = { commit = "25b55feb059b8b08e16a73c601c8b80571fa5208", version = "v4.1.5+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jose.JSONWebKey{Key: []byte(...)}.Thumbprint(crypto.SHA256)` returns `go-jose/go-jose:
unknown key type '[]uint8'`. The type switch in `Thumbprint` (jwk.go) handles ed25519, ecdsa
and rsa keys and OpaqueSigner, not `[]byte`, although the `Key` field's documentation lists
`[]byte (a symmetric key)` among its types and the key marshals as `{"kty":"oct","k":...}`.
RFC 7638 section 3.2 gives the required members of a symmetric key's thumbprint input as
`{"k":..., "kty":"oct"}` in that order; joserfc computes it for every key type. Found by
TestHegelThumbprintMatchesJoserfc (all oct keys of the pool, every hash).
'''

[[bug]]
id = "go-jose/2"
title = "JSONWebKey.Valid returns false for a symmetric key ([]byte), one of the documented Key types, so a key that marshals, unmarshals and signs is reported invalid"
kind = "contract"
severity = "low"
test = "TestHegelPinSymmetricValid"
found = { commit = "25b55feb059b8b08e16a73c601c8b80571fa5208", version = "v4.1.5+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Valid` (jwk.go) is documented as 'checks that the key contains the expected parameters'; its
type switch covers ecdsa, rsa and ed25519 keys and has `default: return false`, so a
`JSONWebKey` holding a `[]byte` (an `oct` key, as read from `{"kty":"oct","k":...}` or built
in memory) is never valid, while the same key signs, verifies, encrypts and marshals. Found by
TestHegelKeyJSONReadByJoserfc and TestHegelJoserfcKeyReadByGoJose (joserfc reads and generates
the same keys without complaint).
'''

[[bug]]
id = "go-jose/3"
title = "NewSigner with a *JSONWebKey holding a symmetric key ignores its KeyID: no kid header is written, while an asymmetric JSONWebKey with the same KeyID gets one"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinSymmetricKeyID"
found = { commit = "25b55feb059b8b08e16a73c601c8b80571fa5208", version = "v4.1.5+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jose.NewSigner(jose.SigningKey{Algorithm: jose.HS256, Key: &jose.JSONWebKey{Key: secret,
KeyID: "k1"}}, nil)` signs with the protected header `{"alg":"HS256"}`; the same call with an
Ed25519, RSA or ECDSA private key writes `{"alg":..., "kid":"k1"}`. `genericSigner.Sign`
(signing.go) writes the kid (or embeds the JWK) only when `recipient.getPublicKey()` is
non-nil, and `newSymmetricSigner` leaves `publicKey` nil, so `newJWKSigner`'s copying of the
JWK's KeyID never reaches the header for HMAC keys. `SigningKey.Key` documents `*JSONWebKey`
as a supported type without such a restriction. With `NewMultiSigner` over several HMAC keys
the JSON serialization has no kid on any signature, and a verifier with a key set (joserfc:
`No key for kid: 'None'`) cannot pick the key. The same happens for `jwt.Signed`. Found by
TestHegelSignVerifiedByJoserfc, TestHegelSignJSONVerifiedByJoserfc and
TestHegelTokenSignedReadByJoserfc.
'''

[[bug]]
id = "go-jose/4"
title = "A header member whose value is JSON null is dropped when parsing (Header.ExtraHeaders lacks it), though the header documents every unknown member as unmarshalled and stored; a signer can write such a member"
kind = "contract"
severity = "low"
test = "TestHegelPinNullHeaderDropped"
found = { commit = "25b55feb059b8b08e16a73c601c8b80571fa5208", version = "v4.1.5+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`(&jose.SignerOptions{}).WithHeader("x-custom", nil)` writes the protected header
`{"alg":"HS256","x-custom":null}`; `ParseSigned` of that token gives
`Signatures[0].Protected.ExtraHeaders` without `x-custom`. `rawHeader.sanitized` (shared.go)
iterates the parsed `map[HeaderKey]*json.RawMessage` and skips every nil value, which is what a
JSON null unmarshals to, so null-valued members (private ones as well as standard ones such as
`typ`) vanish from `Header`, `Protected` and `Unprotected`. `Header.ExtraHeaders` is documented
as 'At parse time, each header parameter with a name other than "kid", "jwk", "alg", "nonce",
or "x5c" will have its value passed to json.Unmarshal ... The resulting value will be stored in
this map'. joserfc reads the member with value None. The same happens for JWE headers. Found
by TestHegelSignVerifiedByJoserfc (go-jose reading its own output) and
TestHegelJoserfcSignVerifiedByGoJose.
'''
