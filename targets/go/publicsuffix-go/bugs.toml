# Bugs found in weppos/publicsuffix-go by the Hegel tests of this target.

[[bug]]
id = "publicsuffix-go/1"
title = "CookieJarList.PublicSuffix returns an empty string for a public suffix, so a cookie jar accepts Domain=co.uk cookies"
kind = "contract"
severity = "medium"
test = "TestHegelPinCookieJarPublicSuffix"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
cookiejarList.PublicSuffix (publicsuffix.go) returns rule.Decompose(domain)[1], and Decompose
returns two empty strings when the name has no more labels than the rule, so
CookieJarList.PublicSuffix("co.uk") and ("com") are "" (golang.org/x/net/publicsuffix.List
returns "co.uk" and "com"). net/http/cookiejar checks a cookie's Domain attribute against a
public suffix only when PublicSuffix returns a non-empty string (jar.go, domainAndType), so a
jar built with cookiejar.Options{PublicSuffixList: publicsuffix.CookieJarList} accepts a cookie
with Domain=co.uk set from http://foo.co.uk/ and returns it for that host and its subdomains,
where the same jar with x/net's list rejects it (errIllegalDomain). The README recommends
CookieJarList for exactly this use. Found by TestHegelDefaultList (CookieJarList.PublicSuffix)
and TestHegelCookieJar (two jars, one with the model's list) with the suffixPublicSuffixEmpty
switch off.
"""

[[bug]]
id = "publicsuffix-go/2"
title = "net/publicsuffix.PublicSuffix returns an empty string for a name that is itself a public suffix"
kind = "contract"
severity = "low"
test = "TestHegelPinAdapterPublicSuffix"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The adapter (net/publicsuffix/publicsuffix.go) is documented as a drop-in replacement for
golang.org/x/net/publicsuffix ("100% compatibility"), but PublicSuffix("com") returns ("", true)
and PublicSuffix("example") returns ("", false) where x/net returns ("com", true) and
("example", false): the same Decompose(...)[1] as publicsuffix-go/1. Its own test compares the
two packages on names with a registrable part only. Found by TestHegelDefaultList with the
suffixPublicSuffixEmpty switch off.
"""

[[bug]]
id = "publicsuffix-go/3"
title = "A rule line is read whole instead of up to its first whitespace"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRuleLineWhitespace"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The list format (https://publicsuffix.org/list/) says "Each line is only read up to the first
whitespace". List.parse (publicsuffix.go) trims the line and passes the rest to NewRule whole,
so "com // the rule is com" becomes the rule "com // the rule is com" and Find("example.com")
falls back to the default rule; "xn--p1ai b" even fails the whole load with "idna: invalid
label", since the trailing text is punycode-validated with the label. Found by TestHegelList
with the wholeLineIsRule switch off.
"""

[[bug]]
id = "publicsuffix-go/4"
title = "Rules with the same value overwrite each other in a list (foo after *.foo drops the wildcard)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSameValueRules"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
List.rules is a map keyed by Rule.Value, and a wildcard "*.foo", an exception "!foo" and a
normal "foo" all have the value "foo": AddRule keeps the last one. For the list "*.foo\\nfoo\\n"
Size() is 1 and Domain("a.foo") is "a.foo", while the algorithm ("the prevailing rule is the
one with the most labels") makes a.foo a public suffix. The packaged list has no such pair, so
only custom lists are affected. Found by TestHegelList with the sameValueOverwrites switch off.
"""

[[bug]]
id = "publicsuffix-go/5"
title = "A matching normal rule with more labels prevails over an exception rule"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinExceptionPrevails"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The algorithm says "If more than one rule matches, the prevailing rule is the one which is an
exception rule". List.Find walks the name's suffixes from the longest and returns the first
rule found, so with "*.ck", "!www.ck" and "x.www.ck" the name y.x.www.ck gets the rule
x.www.ck and Domain returns "y.x.www.ck" instead of "www.ck". No such combination is in the
packaged list. Found by TestHegelList with the longestBeatsException switch off (rare: 1 in
2000 cases).
"""

[[bug]]
id = "publicsuffix-go/6"
title = "A DefaultRule other than publicsuffix.DefaultRule decomposes names wrongly (TLD co. for an own * rule)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCustomDefaultRule"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
FindOptions.DefaultRule is documented for consumers with "different needs", but
Rule.Decompose special-cases the package's DefaultRule by pointer and otherwise assumes the
rule matched the name: with FindOptions{DefaultRule: MustNewRule("*")} Parse("www.example.com")
gives TLD "co.", SLD "example" (the wildcard branch trims the empty value and then a byte it
takes for the dot), and a "*" line loaded from a list behaves the same; with an own normal
default rule "zz" the result is TLD "zz", SLD "co", TRD "www.example". Found by TestHegelList
with the foreignStarMisdecomposes switch off (own "*" default rule and "*" list lines; the
normal default rule is pinned only).
"""

[[bug]]
id = "publicsuffix-go/7"
title = "NewRule panics on empty content and reads any content starting with * as a wildcard of content[2:]"
kind = "crash"
severity = "low"
test = "TestHegelPinNewRuleMalformed"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
NewRule returns (*Rule, error) but never an error: content[0] on "" is an index-out-of-range
panic (MustNewRule("") panics with the runtime error, not a parse error), and any content
starting with "*" other than "*" itself takes content[2:] as the wildcard's value, so "* b" is
the wildcard "*.b" and "*x" is "*". Found by TestHegelList with the starTakesTwoBytes switch off
(list lines such as "* b"); the panic is pinned only.
"""

[[bug]]
id = "publicsuffix-go/8"
title = "Rule.Length counts the empty value of the * rule as a label (DefaultRule.Length is 2)"
kind = "contract"
severity = "low"
test = "TestHegelPinStarLength"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Length is the number of labels of the rule as written (the tests: "com" 1, "*.example.com" 3,
"!example.com" 2). NewRule computes len(Labels(value)) + 1 for a wildcard, and Labels("") is
[""] (one label), so MustNewRule("*") and DefaultRule have Length 2 for one label, and
NewRule("!") gives Length 1. Found by TestHegelList and TestHegelDefaultList with the
emptyValueHasOneLabel switch off.
"""

[[bug]]
id = "publicsuffix-go/9"
title = "NewRuleUnicode reads an exception rule whose first label is Unicode as a normal rule"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnicodeException"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
NewRuleUnicode converts the whole content to A-labels before NewRule looks at its first byte,
and idna.ToASCII (the Punycode profile, no validation) encodes the label "!<nihon>" together
with its "!": NewRuleUnicode("!<nihon>.ck") is the normal rule "xn--!-kn6bt1b.ck" instead of the
exception "xn--wgv71a.ck", so a list in U-labels loses such exceptions. The packaged list's
eight exceptions are ASCII. Found by TestHegelList with the unicodeExceptionPrefixEncoded
switch off.
"""

[[bug]]
id = "publicsuffix-go/10"
title = "A name with an empty label is accepted and decomposed while a leading dot is rejected"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyLabel"
found = { commit = "dd2f3a17e733ce944e8200791ffa1074bff8d012", version = "v0.50.3+44 (PSL 645b36)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
normalize rejects "" and a leading dot, but "a..com" parses to DomainName{TLD "com", SLD "",
TRD "a"} whose String() is "com" (the TRD is dropped once the SLD is empty, against "Empty
labels are skipped"), Domain("a..com") is ".com", and under the wildcard *.ck the name a..ck
gets the TLD ".ck". Found by TestHegelList with the emptySLDDropsTRD switch off (the String
face); the acceptance itself is pinned only.
"""
