# Bugs found in gocarina/gocsv by the Hegel zoo. Each has a pin test (hegel_pins_test.go) listed
# as an expected failure in target.toml.

[[bug]]
id = "gocsv/1"
title = "csv[] columns out of order or with gaps panic in reflect SetLen"
kind = "panic"
severity = "medium"
test = "TestHegelPinSliceColumnsInAnyOrder"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A slice field with a csv[] tag is read one column at a time; setInnerField grows the slice
when the index is at or beyond its capacity, to `cap + cap/2` (4 at least), then calls SetLen
(index+1). The new capacity is not checked against the index: with a field `V []int csv:"v"
csv[]:"6"` and the header `id,v[5],v[0]`, the first column has index 5, the empty slice grows to
capacity 4 and SetLen(6) panics with "reflect: slice length out of range in SetLen". The same
with `id,v[4]` (a column missing), and for slices of structs (`w[4].a` first). Columns in
increasing order with none missing happen to work because each growth covers the next index.
'''

[[bug]]
id = "gocsv/2"
title = "Unmarshal into a struct with an interface{} field panics"
kind = "panic"
severity = "medium"
test = "TestHegelPinInterfaceFieldDoesNotPanic"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Marshal writes an interface{} field as its dynamic value (`Any interface{} csv:"any"` holding
"x" gives the cell `x`). Unmarshal of that output reaches unmarshall(), whose loop for
interface and pointer kinds does `reflect.New(field.Type().Elem())` on a nil interface value;
Elem() of an interface type panics: "reflect: Elem of invalid type interface {}". Every entry
point panics the same way, with a nil or a non-nil cell.
'''

[[bug]]
id = "gocsv/3"
title = "UnmarshalToChanWithoutHeaders panics on a row with more columns than struct fields"
kind = "panic"
severity = "medium"
test = "TestHegelPinHeaderlessChanIgnoresExtraColumns"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readToWithoutHeaders (UnmarshalWithoutHeaders, UnmarshalCSVWithoutHeaders) stops at the last
struct field (`if j >= len(outInnerStructInfo.Fields) { break }`) and ignores the extra columns
of a row. readEachWithoutHeaders (UnmarshalToChanWithoutHeaders) has no such check and indexes
`Fields[j]` past the end: a struct of two fields and the row `1,2,3` panic with "index out of
range [2] with length 2". A CSV with more columns than the struct describes is the ordinary
case for a struct that maps a subset of a file.
'''

[[bug]]
id = "gocsv/4"
title = "An integer cell wider than the field wraps silently (300 into int8 is 44)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIntegerOverflowIsAnError"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
toInt and toUint parse every cell with strconv at 64 bits (`ParseInt(s, 10, 64)`) and setField
stores the result with reflect's SetInt/SetUint, which truncate to the field's width without a
check. `300` into an int8 field is 44 and into a uint8 field 44, `70000` into an int16 is 4464,
`4294967296` into a uint32 is 0, all without an error; only a cell beyond 64 bits fails. The
sibling conversion in encoding/json rejects such values ("cannot unmarshal number 300 into Go
struct field ... of type int8"); parsing with the field's bit size (`v.Type().Bits()`) gives a
strconv range error for free.
'''

[[bug]]
id = "gocsv/5"
title = "A uint cell containing a dot is parsed as a float and converted: -1.5 is 18446744073709551615, 1.5e2 is 150 (1 for an int field)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUintCellsParseLikeIntCells"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
toInt drops what follows the first '.' and parses the integer part (`1.5` is 1, `1.5e2` is 1,
`-1.5` is -1). toUint instead, when the cell contains a '.', parses it with ParseFloat and
converts with uint64(f): `-1.5` gives 18446744073709551615 (the conversion of a negative float
to uint64 is implementation-defined in Go; `-1` without a dot is an error), `1.5e2` gives 150
where the int field of the same row gets 1, `1e30.0` gives a large implementation-defined
value, and `1.2.3` is an error where the int rule gives 1. The two integer conversions should
agree, and a negative value in an unsigned field should be an error.
'''

[[bug]]
id = "gocsv/6"
title = "float32 cells are parsed at 64 bits and rounded, so a value out of range becomes +Inf without error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFloat32OutOfRangeIsAnError"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
toFloat calls `strconv.ParseFloat(s, 64)` for float32 fields too and SetFloat rounds the result
to float32: the cell `1e40` (or `3.5e38`) becomes +Inf silently, where ParseFloat(s, 32)
returns +Inf with a range error, as it does for `1e400` into a float64 field (which gocsv does
report). Parsing at 64 bits and rounding can also differ from a direct 32-bit parse by one ulp
on long decimals (double rounding); the property gates and counts those, none appeared in
several thousand random cells.
'''

[[bug]]
id = "gocsv/7"
title = "Several keys on a nested struct field produce the columns p.a and q.p.a instead of p.a and q.a"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMultiKeyNestedHeaders"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A field may list several keys (`csv:"p,q"`: the first is written, any matches on read). For a
nested struct with such a tag, getFieldInfos builds the cartesian product of parent and child
keys, but assigns `currFieldInfo.keys = keys` inside the loop over the parent keys, so the
second parent key is combined with the products already made instead of the child's keys:
`Bar pinBar csv:"p,q"` with `A int csv:"a"` gets the keys [p.a, q.p.a] (the Unmarshaller's
MismatchedStructFields lists them). A CSV with the header `q.a,q.b` leaves the struct empty
while `q.p.a,q.p.b` fills it.
'''

[[bug]]
id = "gocsv/8"
title = "An array field without a csv[] tag is written as JSON that Unmarshal then rejects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinArrayFieldRoundTrips"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
getFieldAsString handles reflect.Slice and reflect.Array alike, falling back to json.Marshal
(`A [2]int csv:"a"` holding {3, 4} is written as `[3,4]`). setField's fallback handles
`reflect.Slice, reflect.Struct` only: Unmarshal of the same text fails with "No known
conversion from string to , it does not implement TypeUnmarshaller" (the type name is empty
for an unnamed array). Slices round-trip through JSON; arrays need reflect.Array in the same
case.
'''

[[bug]]
id = "gocsv/9"
title = "A map field is written as an empty cell without error, and Unmarshal rejects it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMapFieldRoundTrips"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a map field (`M map[string]int csv:"m"`), getFieldAsString finds no marshalling method and
its kind switch has no reflect.Map case, so it falls out of the switch and returns ("", nil):
the data is dropped and Marshal reports success. Unmarshal of the output fails on the empty cell
with "No known conversion from string to , it does not implement TypeUnmarshaller". Either
Marshal should return the NoMarshalFuncError it computed (as it does for other unsupported
kinds) or maps should go through JSON like slices.
'''

[[bug]]
id = "gocsv/10"
title = "FailIfUnmatchedStructTags and the Unmarshaller's mismatch lists compare headers exactly while the column mapping trims spaces and zero-width characters"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTrimmedHeaderCountsAsMatched"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
fieldInfo.matchesKey maps a column to a field when the header equals a key, or does after
TrimSpace, or after removing zero-width characters (U+200B, U+FEFF, U+200C, U+200D: a UTF-8
BOM before the first header), or contains the key for a `partial` field. mismatchStructFields
and mismatchHeaderFields use a set of the exact header strings instead. With
FailIfUnmatchedStructTags a file starting with a BOM (`﻿a,b`) or with ` a,b` fails with
"found unmatched struct field with tags [a]" although every column was mapped and the rows
decode without the flag; NewUnmarshaller on the same text reports MismatchedHeaders [" a"] and
MismatchedStructFields [a] while ReadUnmatched fills field a and returns no unmatched columns.
'''

[[bug]]
id = "gocsv/11"
title = "Unmarshal into a slice longer than the CSV keeps the stale trailing elements"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnmarshalReplacesTheSlice"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ensureOutCapacity replaces the slice only when it is shorter than the number of rows; a slice
that is already longer is kept and only its first elements are overwritten. Unmarshal of one
row into `[]T{x, y, z}` returns `[]T{row, y, z}`, which is not the CSV. encoding/json resets
the slice length to zero before appending; a slice given to Unmarshal should hold the rows and
nothing else.
'''

[[bug]]
id = "gocsv/12"
title = "CSVToMaps and CSVToChanMaps panic on a row shorter than the header under a reader with FieldsPerRecord = -1"
kind = "panic"
severity = "low"
test = "TestHegelPinRaggedRowsDoNotPanic"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSVToMaps uses the configured reader (SetCSVReader) and indexes `record[i]` for every header
index; with a reader that allows ragged rows (`FieldsPerRecord = -1`, the documented way to
read files with a variable number of fields) a short row panics with "index out of range [1]
with length 1". CSVToChanMaps has the same loop (over a fixed csv.NewReader, so it needs a
short header row instead: a longer data row is silently cut). The default reader rejects
ragged rows before the loop, so the panic needs the custom reader.
'''

[[bug]]
id = "gocsv/13"
title = "Marshal writes a Stringer's output for a named integer type (time.Duration) that Unmarshal cannot read"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringerOutputReadsBack"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
marshall() prefers TypeMarshaller, then encoding.TextMarshaler, then fmt.Stringer; unmarshall()
has TypeUnmarshaller and TextUnmarshaler only, and the fallback for a named integer kind is
toInt. A `time.Duration` field of 1.5s is written `1.5s` and 2s `2s`; reading the file back
gives 1ns for the first (toInt drops the fraction and parses "1") and "strconv.ParseInt:
parsing "2s": invalid syntax" for the second. Any named integer type with a String() method
(enums) has the same asymmetry; encoding/json ignores Stringer for that reason.
'''

[[bug]]
id = "gocsv/14"
title = "The WithoutHeaders entry points ignore the default= tag option"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHeaderlessAppliesDefault"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readTo, readEach and the Unmarshaller replace an empty cell by the field's `default=` value
before setting it. readToWithoutHeaders and readEachWithoutHeaders pass the cell straight to
setInnerField: `D string csv:"d,default=7"` is "7" after UnmarshalString("d,x\n,x\n") and ""
after UnmarshalWithoutHeaders(",x\n"). The same applies to UnmarshalCSVWithoutHeaders and
UnmarshalToChanWithoutHeaders.
'''

[[bug]]
id = "gocsv/15"
title = "UnmarshalToChanWithoutHeaders reports a conversion error one line too far"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHeaderlessChanErrorLine"
found = { commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5", version = "master (untagged), 2026-09-08", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readEachWithoutHeaders builds its csv.ParseError with `Line: i + 2, //add 2 to account for the
header`, copied from the path with headers; there is no header on this path, and
readToWithoutHeaders uses `i + 1`. UnmarshalToChanWithoutHeaders on the single line `1,x` for
two int fields reports "parse error on line 2, column 2"; UnmarshalWithoutHeaders on the same
text reports line 1.
'''
