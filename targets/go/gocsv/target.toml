name = "gocsv"
language = "go"
upstream = "https://github.com/gocarina/gocsv"
subdir = ""
license = "MIT"  # LICENSE (MIT); no CONTRIBUTING, no agent instructions, nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "9ab82d65b1cc572edb8a151defa1d84afa9da2b5"
date = "2026-09-08"
version = "master (untagged), 2026-09-08"

[hegel]
version = "v0.6.33"

[run]
# -vet=off: under the go 1.26 directive hegel needs, vet fails the build on upstream's own
# `fmt.Errorf(nonConstant)` calls (csv.go, decode.go, encode.go, types.go).
command = "go test -count=1 -vet=off -run TestHegel -v ."
setup = []

[expected_failures]
TestHegelPinSliceColumnsInAnyOrder = "gocsv/1"
TestHegelPinInterfaceFieldDoesNotPanic = "gocsv/2"
TestHegelPinHeaderlessChanIgnoresExtraColumns = "gocsv/3"
TestHegelPinIntegerOverflowIsAnError = "gocsv/4"
TestHegelPinUintCellsParseLikeIntCells = "gocsv/5"
TestHegelPinFloat32OutOfRangeIsAnError = "gocsv/6"
TestHegelPinMultiKeyNestedHeaders = "gocsv/7"
TestHegelPinArrayFieldRoundTrips = "gocsv/8"
TestHegelPinMapFieldRoundTrips = "gocsv/9"
TestHegelPinTrimmedHeaderCountsAsMatched = "gocsv/10"
TestHegelPinUnmarshalReplacesTheSlice = "gocsv/11"
TestHegelPinRaggedRowsDoNotPanic = "gocsv/12"
TestHegelPinStringerOutputReadsBack = "gocsv/13"
TestHegelPinHeaderlessAppliesDefault = "gocsv/14"
TestHegelPinHeaderlessChanErrorLine = "gocsv/15"
