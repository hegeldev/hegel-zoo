# Bugs found in sjson by the Hegel properties. Each has a pin test (TestHegelPin...) that
# asserts the correct behaviour and is listed as an expected failure in target.toml.

[[bug]]
id = "sjson/1"
title = "A huge array index wraps around: the value lands at a small index, or the padding loop exhausts memory"
kind = "crash"
severity = "high"
test = "TestHegelPinHugeIndexIsAnError"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
atoui (sjson.go ~165) accumulates `n = n*10 + digit` in an int with no overflow check, so
Set(`[]`, "18446744073709551617", 1) is `[null,1]` (2^64+1 wraps to 1) and
Set(`[]`, "9223372036854775808", 1) is `[1]` (2^63 wraps to MinInt64, so no padding) with a nil
error. When the wrapped count is large the padding loop appendRepeat("null,", n) runs until the
process is killed: Set(`[1]`, "9223372036854775808", 1) asks for MinInt64-1 = MaxInt64 nulls and
Set(`[]`, "99999999999999999999", 1) for about 7.8e18. A path from untrusted input is therefore a
denial of service. gjson, which sjson uses to look the index up first, saturates its integer
parsing instead. The pin only uses the two indices whose wrapped count is 0 or 1; the
properties keep generated indices within three digits of the array's length.
'''

[[bug]]
id = "sjson/2"
title = "NaN and the infinities are written as NaN, +Inf and -Inf, which is not JSON"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNonFiniteFloatsAreRefused"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SetBytesOptions formats float32 and float64 values with strconv.FormatFloat(v, 'f', -1, 64)
(sjson.go ~715), so Set(`{}`, "a", math.NaN()) is `{"a":NaN}` and math.Inf(1) gives `{"a":+Inf}`,
both with a nil error. encoding/json, which sjson falls back to for every other type, returns
"json: unsupported value: NaN" for the same input. Every finite float is fine (1e21 is written
as 1000000000000000000000, which is valid).
'''

[[bug]]
id = "sjson/3"
title = "With Optimistic and ReplaceInPlace, a string value that needs escaping is silently not written"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInPlaceWritesEscapedStrings"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SetBytesOptions([]byte(`{"a":"xyz","b":1}`), "a", "q\"", &Options{Optimistic: true,
ReplaceInPlace: true}) returns the input unchanged with a nil error. In set() (sjson.go ~530)
the in-place branch is taken whenever the new size fits (`inplace && sz <= len(jstr)`); inside
it, a string that mustMarshalString (a quote, a backslash, a control or non-ASCII byte) is not
handled and the code returns `[]byte(jstr), nil` instead of falling through to the allocating
path. The same string is written correctly by SetBytesOptions without ReplaceInPlace and by
SetOptions (which clears ReplaceInPlace for strings). A value that does not fit is also fine,
since the in-place branch is skipped.
'''

[[bug]]
id = "sjson/4"
title = "An empty path component is the key of an existing object but index 0 of a container being created, and appends to an existing array"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyComponentIsTheEmptyKey"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Set(`{"a":{}}`, "a.", 1) is `{"a":{"":1}}` (the empty key, as gjson reads "a." too), but
Set(`{}`, "a.", 1) is `{"a":[1]}` and Set(`{"a":5}`, "a.", 1) is `{"a":[1]}`: atoui accepts the
empty string as the number 0 (its loop never runs), so appendBuild makes an array. On an existing
array the empty component is numeric too, but gjson finds nothing for it, so
Set(`{"a":[1,2]}`, "a.", 9) appends: `{"a":[1,2,9]}` rather than replacing element 0 or
reporting the non-numeric key error that `a.:` (the forced empty key) gets. A lone trailing
backslash (`a.\`) has the same effect, since its component is also empty.
'''

[[bug]]
id = "sjson/5"
title = "A colon-forced key on an array replaces the element when it exists but is an error when it does not"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinForcedKeyOnArrayIsAnError"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README says the colon forces a numeric key to be an object key. On an array,
Set(`[1]`, ":1", 2) fails with "cannot set array element for non-numeric key '1'", but
Set(`[1]`, ":0", 2) is `[2]`: appendRawPaths looks the component up with gjson using gpart, which
has the colon stripped, so element 0 is found and replaced before the forced flag is consulted.
Delete(`[1,2]`, ":0") likewise deletes element 0 (`[2]`).
'''

[[bug]]
id = "sjson/6"
title = "-1 creates an object with the key -1 under a scalar or on an empty document, but an array under a missing key"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMinusOneCreatesAnArrayEverywhere"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Set(`{}`, "a.-1", 1) is `{"a":[1]}` (appendBuild treats -1 as an array append) and
Set(`[]`, "-1", 1) is `[1]`, but Set(``, "-1", 1) is `{"-1":1}`, Set(`5`, "-1", 1) is `{"-1":1}`
and Set(`{"a":5}`, "a.-1", 1) is `{"a":{"-1":1}}`: when the document (or the value on the path)
is empty or a scalar, appendRawPaths (sjson.go ~330) chooses `{}` or `[]` by atoui alone, and -1
is not numeric. Set(`{"a":null}`, "a.2", 1) does make an array (`{"a":[null,null,1]}`).
'''

[[bug]]
id = "sjson/7"
title = "A key starting with [ or {, or with ! and a JSON literal, is never found unless escaped, so Set appends a duplicate key"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinKeysStartingWithABracketAreFound"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Set(`{"[a":1}`, "[a", 2) is `{"[a":1,"[a":2}` and Set(`{"{a":1}`, "{a", 2) is `{"{a":1,"{a":2}`,
with Optimistic or without. parsePath treats `[` and `{` as simple characters (only `| # @ * ?`
are not), so the path is not complex and gpart is passed to gjson unescaped, where a component
starting with `[` or `{` is a multipath and matches nothing; the key is then appended as new.
Escaping the bracket (`\[a`) finds the key. The same happens for keys gjson reads as a literal
value: `!` followed by a digit, `+`, `-`, a quote, `[`, `{`, true, false or null
(Set(`{"!1":1}`, "!1", 2) is `{"!1":1,"!1":2}`, likewise `!true`, `![`, `!-`), where gjson
returns the literal with Index 0 and sjson takes that for "not found". `!a`, `!x1` and `(a` are
found. Delete of such a key is a silent no-op for the same reason.
'''

[[bug]]
id = "sjson/8"
title = "A path with two # segments overwrites the front of the document"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinNestedHashPathsDoNotCorruptTheDocument"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Set(`[{"k":[{"x":1}]},{"k":[{"x":2},{"y":3}]}]`, "#.k.#.x", 9) is
`9:[{"x":1}]},{"k":[{"x":2},{"y":3}]}]` with a nil error, and Set(`[[{"x":1}],[{"x":2},{"y":3}]]`,
"#.#.x", 9) is `9":1}],[{"x":2},{"y":3}]]`. For a nested `#` query gjson fills Result.Indexes
with zeros (it tracks positions one level deep only; the same with gjson v1.19.0), and
setComplexPath (sjson.go ~600) writes the value at every reported index without the
`res.Index != 0` guard it applies to the single-match case, so the value is written at offset 0
once per match, each time over the length of a nested result. A single `#` (`#.k`, `#(k==1)#.k`)
is correct.
'''

[[bug]]
id = "sjson/9"
title = "An index written with an escaped digit is numeric for sjson but a key for gjson, so Set appends and Delete does nothing"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEscapedDigitsAreStillAnIndex"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Set(`[1,2]`, `\0`, 9) is `[1,2,9]` and Delete(`[1,2]`, `\0`) is `[1,2]`, where "0" gives `[9,2]`
and `[2]`. parsePath lets a backslash escape any character and strips it from the component
(part "0", numeric for atoui), but the text handed to gjson keeps the backslash (gpart `\0`),
which gjson reads as the literal key "0", never an array index. Only the dot and the colon are
documented as escapable, so this is a corner; sjson/5 (a forced key that hits an element) is the
mirror image, where gjson finds what sjson considers a key.
'''

[[bug]]
id = "sjson/10"
title = "Delete of a key that starts with a quote removes the members before it, or leaves the key with no value"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDeletingAKeyStartingWithAQuoteKeepsTheRest"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Delete(`{"a":1,"\"":2}`, `"`) is `{}` (the member a is gone too), Delete(`{"\"":2,"a":1}`, `"`)
is `{"\"":,"a":1}` (not JSON), Delete(`{"a":1,"\"x":2}`, `"x`) is `{}`; nested keys behave the
same. deleteTailItem (sjson.go ~210) walks back from the key's closing quote looking for its
opening quote and, to step over escaped quotes inside the key, skips every quote preceded by a
backslash. When the key's first character is an escaped quote, the walk lands on that quote,
sees the backslash, and skips the opening quote right before it: it then either runs off the
start of the buffer (first member: nothing is trimmed and the value alone is removed) or finds
an earlier key's quote and cuts everything back to the enclosing brace or comma. A key with an
escaped quote anywhere but first (`x"`, `x"y`, `""`) is deleted correctly, and Set of such keys
is fine. Found by TestHegelSetThenDeleteRestoresTheDocument.
'''

[[bug]]
id = "sjson/11"
title = "Delete of -1 on an object that has a member named # deletes nothing, or the member whose name is that value minus one"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMinusOneOnAnObjectIsTheKey"
found = { commit = "3a21ce7b0cab4e0f0d91eb8db4a3d0434622eeb8", version = "v1.2.5+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Delete(`{"#":true,"-1":1}`, "-1") returns the input unchanged, and Delete(`{"#":2,"1":5,"-1":1}`,
"-1") is `{"#":2,"-1":1}`: the member "1" is deleted instead of "-1". For a -1 component
appendRawPaths (sjson.go ~250) asks gjson for "#" to get the array length and, when the result's
Int() is positive, deletes the element at length-1. On an object gjson's "#" is the member named
"#", so its value (true is 1, a number is itself) is taken for a length and the member named
"<value-1>" is looked up: if it exists it is deleted, otherwise nothing is (found is true but
the result has no position, so the path is treated as absent). Without a "#" member,
Delete(`{"a":1,"-1":1}`, "-1") correctly deletes the "-1" member. Set is not affected.
'''
