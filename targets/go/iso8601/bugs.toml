# Bugs found in relvacode/iso8601 by the Hegel zoo. One [[bug]] per finding; `test` names the
# TestHegelPin... function in hegel_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracle: a model of the grammar the parser documents (ISO 8601
# calendar and ordinal dates, times, fractions, Z and +-hh[:mm] zones, with the parser's lenient
# digit counts) built from generated components, Go's time.Parse on the RFC 3339 subset, and
# encoding/json for the JSON wrapper. No contribution policy on AI (README, .github/ checked
# 2026-09-19).

[[bug]]
id = "iso8601/1"
title = "A leading Z is skipped like a leading plus sign, so Z2020-01-02T03:04:05Z parses"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLeadingZIsRejected"
found = { commit = "4ea8ed45fe2fbb1eff71640652ef68a44179a1d2", version = "v1.8.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseInLocation handles '+', 'Z' and (through a fallthrough) '-' in one switch case; its first
statement, "if i == 0 { continue }", is meant to allow a signed year ("The ISO8601 technically
allows signed year components ... let's allow a positive sign", iso8601.go), but it applies to 'Z'
as well: ParseString("Z2020-01-02T03:04:05Z") returns 2020-01-02 03:04:05 UTC instead of
UnexpectedCharacterError. ("-2020-..." is refused, as the dash case checks for a preceding digit
first.) Found by mutating valid inputs and checking every accepted string against the grammar.
'''

[[bug]]
id = "iso8601/2"
title = "ParseISOZone accepts malformed offsets (+013, +01:3, +01:) and out-of-range hours and minutes (+25:00, +01:60)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMalformedZonesAreRejected"
found = { commit = "4ea8ed45fe2fbb1eff71640652ef68a44179a1d2", version = "v1.8.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseISOZone documents the forms Z, +-hh, +-hhmm and +-hh:mm. It only checks the total length (3 to
6 characters) and that a colon can sit at index 3, and never checks the hour or minute values:
"+013" and "+01:3" give +01:03, "+01:" gives +01:00, "+25:00" gives 90000 s, "+01:60" gives +02:00,
"+99:99" gives 362340 s. Through Parse, "2020-01-02T03:04:05+25:99" parses with a +2639 zone, where
time.Parse (RFC 3339) and any ISO 8601 reading refuse it. Found by generating and mutating zone
strings and comparing with the documented grammar.
'''

[[bug]]
id = "iso8601/3"
title = "More than nine fraction digits with leading zeros are taken as nanoseconds unscaled (.0000000005 is 5 ns)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDeepFractionsAreNotMisread"
found = { commit = "4ea8ed45fe2fbb1eff71640652ef68a44179a1d2", version = "v1.8.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The fraction is accumulated as an integer and scaled by 10^(9 - digits); ErrPrecision ("Too many
characters in fraction of second precision") is only raised when the accumulated value reaches 1e9.
With ten or more digits whose value stays below 1e9 the scale is negative, the loop does nothing
and the digits are used as nanoseconds: "2020-01-02T03:04:05.0000000005Z" parses with 5 ns
(time.Parse truncates to 0 ns), ".00000000012" gives 12 ns. Either truncation to nanoseconds or
ErrPrecision would be right; the value returned is neither. Found by mutating valid inputs.
'''

[[bug]]
id = "iso8601/4"
title = "The year-only input 0000 fails with a month range error while 0000-01 parses"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinYearZeroAloneParses"
found = { commit = "4ea8ed45fe2fbb1eff71640652ef68a44179a1d2", version = "v1.8.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
After the scan, the last component is stored only "if c > 0", so a trailing component whose value
is 0 is dropped: for "0000" the year branch that also sets month and day to 1 is skipped, and the
parser reports "month 0 is not in range 1-12". "0000-01", "0000-01-01" and Go's
time.Parse("2006", "0000") all give year 0. Found by generating year-only inputs.
'''

[[bug]]
id = "iso8601/5"
title = "Time.UnmarshalJSON treats any four-byte value that shares a byte with null as null"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinShortStringsAreNotNull"
found = { commit = "4ea8ed45fe2fbb1eff71640652ef68a44179a1d2", version = "v1.8.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
json.go's null() returns false only when all four bytes differ from "null" in position
("b[0] != 'n' && b[1] != 'u' && b[2] != 'l' && b[3] != 'l'"), i.e. it uses && where || is needed. Any
four-byte JSON value with an 'u' at index 1 or an 'l' at index 2 or 3 is therefore taken for null
and UnmarshalJSON returns nil without touching the receiver: the JSON strings "1l", "u2", "al", "xl"
are silently accepted where a parse error is due, and a struct field keeps its previous value. Found
by unmarshalling short random strings and comparing with Parse.
'''
