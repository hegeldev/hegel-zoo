[[bug]]
id = "expr/5"
title = "BinaryNode.String() prints the operands of `..` bare: `(true ? 1 : 2)..3` prints as `true ? 1 : 2..3`, a different AST, and `(1 ?? 2)..3` as `1 ?? 2..3`, which does not parse"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRangeOperandsPrintWithParentheses"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (master 2026-07-07; v1.17.8 is the last release, 2026-02-14)", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ast/print.go `BinaryNode.String()` returns `fmt.Sprintf("%s..%s", n.Left, n.Right)` for `..`
before the wrapping every other operator gets (lwrap/rwrap by `operator.Less`, the
same-precedence rule for the associative side, `??`, conditionals). `..` has precedence 25
(parser/operator/operator.go), so an operand that binds looser loses its parentheses: a
conditional (`(true ? 1 : 2)..3` → "true ? 1 : 2..3", which is `true ? 1 : (2..3)`; `1..(true ?
2 : 3)` → "1..true ? 2 : 3"), a comparison or membership test at 20 (`(1 == 2)..3` → "1 == 2..3",
`1..(1 in [1])` → "1..1 in [1]"), `and`/`or` at 15/10 (`(1 < 2 or 1 > 2)..3` → "1 < 2 or 1 >
2..3"), a `??`, which the parser refuses beside any other operator (`(1 ?? 2)..3` → "1 ?? 2..3":
"Operator (..) and coalesce expressions (??) cannot be mixed. Wrap either by parentheses."),
and a range on the right, `..` being left-associative (`1..(2..3)` → "1..2..3", which is
`(1..2)..3`). Operands that bind tighter print right: `(1 + 2)..3` → "1 + 2..3" and `(-1)..3`
→ "-1..3" re-parse to the same AST. `Node.String()` is what the debug REPL and callers that
re-emit a patched AST rely on (the family of expr/2 and expr/3). Fix: drop the early return
and let `..` go through the generic wrapping, which already handles `Less`, the
same-precedence right operand, `??` and conditionals. Found by TestHegelPrintedAstReparses
(counted as candidate/go/expr-1 by the rewrite of 2026-10-07, whose even draw over the fuzz
corpus and its edit records splicing `..`, `?`, `:` and `??` pieces reached the shape; judged
the same day); the narrow property TestHegelRangeOperandsReparse draws a `..` with a
conditional, coalescing, comparison, logical or range operand in parentheses, and the wide
property names the shape (Known.rangeOperandBare).
'''

[[bug]]
id = "expr/6"
title = "A `reduce` without an initial value is typed as its predicate, but over a one-element array the predicate never runs and the element is returned: `reduce([1], #acc >= #)` is statically a bool and evaluates to the int 1"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSeedlessReduceHonoursItsStaticType"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (master 2026-07-07; v1.17.8 is the last release, 2026-02-14)", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
checker/checker.go, case "reduce": the predicate is visited with `#acc` untyped (`varScope{"acc",
Nature{}}`) and the call is typed `*predicate.Ref`, the predicate's output type, whether or not
there is a third argument (one is visited and discarded). compiler/compiler.go, case "reduce":
without an initial value the first element becomes the accumulator (OpPointer,
OpIncrementIndex, OpSetAcc) and the loop runs over the rest, as docs/language-definition.md says
("If initialValue is not given, the first element of the array is used as the initial
value"), so over one element the predicate never runs and the result is the element, of the
element's type. `reduce([1], #acc >= #)` is static bool, runtime int 1; `reduce([1],
string(#))` static string, int 1; `reduce([i], #acc and # > 0)` static bool, int; `reduce(['a'],
len(#))` static int, string "a"; `reduce([s], # == '')` static bool, string; `reduce([0.5],
int(#))` static int, float64 0.5. `expr.Compile("reduce([1], #acc >= #)", expr.AsBool())`
compiles and `Run` fails with "invalid operation: bool(int)" (docs/configuration.md: "It is
safe to assert the output to bool, if the expression is type checked as bool"), the
expr/1 argument. Where the predicate's type is unknown (`#acc + #`, since `#acc` is untyped)
the checker makes no claim and nothing is wrong; with a seed the predicate runs and the value
has its type (`reduce([1], #acc and # > 0, true)` is bool either way). Fix: without an initial
value, type the call as the element type when the predicate returns it and as any otherwise
(or type `#acc` as the element type and demand the predicate return it). Found by
TestHegelStaticTypeMatchesRuntime (counted as candidate/go/expr-2 by the rewrite of 2026-10-07,
whose even draw over the fuzz corpus reached the seedless reduce lines; judged the same day);
the narrow property TestHegelSeedlessReduceMatchesItsStaticType draws one-element int, float
and string arrays with predicates of another type, and the wide property names the shape
(Known.seedlessReduceTyped).
'''

[[bug]]
id = "expr/7"
title = "`min` and `max` are typed as their first argument but return whichever argument wins: `min(1, 0.5)` is statically an int and evaluates to the float64 0.5, `min(i64, f32)` an int64 that is a float32"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMinMaxHonourTheirStaticType"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (master 2026-07-07; v1.17.8 is the last release, 2026-02-14)", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
builtin/validation.go `validateAggregateFunc` (the Validate of `min` and `max`, builtin.go)
checks that every argument is of a numeric kind (an interface, array or slice argument makes
the call any) and then `return args[0], nil`: the type of the first argument. builtin/lib.go
`minMax` keeps the argument `runtime.Less`/`runtime.More` prefers, with its own Go type (a
tie keeps the earlier one). docs/language-definition.md: "min(n1, n2) Returns the minimum of
the two numbers n1 and n2", numbers of any kind. `min(1, 0.5)` is static int, runtime float64
0.5; `max(0.5, 1)` static float64, int 1; `min(2, 1, 0.5)` static int, float64 0.5; `max(0.5, 2,
1)` static float64, int 2; with env `i64 int64`, `f32 float32`: `min(i64, f32)` static int64,
float32 1.5, `max(f32, i64)` static float32, int64 2. Ties agree with the static type (`min(1,
1.0)` is int 1, `min(1.0, 1)` float64 1), as do calls whose arguments are of one kind. The
documented-safe `output.(int)` on `min(1, 0.5)` panics; under `expr.AsInt()` the float is cast
to 0 at run time without a compile-time warning. Fix: when the argument kinds differ, type the
call as float64 (what the comparison converts to) or as any. Found by
TestHegelStaticTypeMatchesRuntime (counted as candidate/go/expr-3 by the rewrite of 2026-10-07,
whose even draw over the fuzz corpus reached the mixed min/max lines; judged the same day); the
narrow property TestHegelMixedMinMaxMatchesItsStaticType draws an int first argument with float
rest or the other way round, ordered so the rest wins, and the wide property names the shape
(Known.mixedMinMaxTyped).
'''

[[bug]]
id = "expr/8"
title = "`sum(array)` is typed as the element type, but an empty array sums to the int 0: `sum([0.5][1:])` is statically a float64 and evaluates to the int 0, `sum(list[1:1])` over a []string to a string that is the int 0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmptySumHonoursItsStaticType"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (master 2026-07-07; v1.17.8 is the last release, 2026-02-14)", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
checker/checker.go, case "sum": without a predicate the call is typed
`collection.Elem(...)`, the element type (with one, the predicate's output type, which has the
same hole: `sum([0.5][1:], # * 2.0)` is static float64 and the int 0). compiler/compiler.go,
case "sum": the accumulator is seeded with `OpInt 0` and each element (or the predicate's
value) added, so the empty sum is the int 0 whatever the array, and a non-empty float sum a
float64 (`0 + 0.5`). `sum([0.5][1:])`, `sum(fl[1:])` (env `fl []float64`), `sum([0.5,
1.5][0:0])`, `sum(filter([0.5], false))` are static float64 and the int 0; `sum(list[1:1])` (env
`list []string`) is static string and the int 0 — docs/language-definition.md says "Returns the
sum of all numbers in the array", and the checker accepts a []string, whose non-empty sum then
fails at run time ("invalid operation: string + int"). An empty []int or []any makes no
claim (`sum(empty)` static int, `sum([][0:0])` any). The documented-safe `output.(float64)`
panics on the int (the expr/1 argument); `expr.AsFloat64()` casts the int at run time. Fix:
seed the accumulator with the zero of the element type (0.0 for a float array), or type a
non-int element sum as any. Found by TestHegelStaticTypeMatchesRuntime (counted as
candidate/go/expr-4 by the rewrite of 2026-10-07, whose even draw over the fuzz corpus reached
the float-array sums; judged the same day); the narrow property
TestHegelEmptySumMatchesItsStaticType draws float and string arrays sliced to nothing or
filtered by false, and the wide property names the shape (Known.emptySumTyped).
'''

[[bug]]
id = "expr/9"
title = "The optimizer folds `x and false` to false and `x or true` to true whatever x is, so a left operand that fails at run time is never evaluated: `(false ? 0.5 : \"bar\") and false` is a run-time error unoptimised and false optimised"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOptimizerKeepsShortCircuitErrors"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (master 2026-07-07; v1.17.8 is the last release, 2026-02-14)", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
optimizer/fold.go, `case "and", "&&"`: `(a != nil && !a.Value) || (b != nil && !b.Value)` patches
the node to `BoolNode{false}` ("x and false" or "false and x"), and `case "or", "||"` likewise
to true; `x and true` and `x or false` are patched to x itself. The VM evaluates the left
operand first and short-circuits on it (OpJumpIfFalse/OpJumpIfTrue), so `false and x` and
`true or x` agree with and without the optimizer; a left operand folded away does not: `(false
? 0.5 : "bar") and false` (typed any, a string at run time) is "interface conversion: interface
{} is string, not bool" unoptimised and false optimised, `(false ? 0.5 : "bar") or true` true;
with env `z = 0`, `arr []int{1, 2}`, `s = "ab"`: `(i % z == 1) and false` is "runtime error:
integer divide by zero" and false, `(arr[99] > 0) && false` "index out of range: 99 (array
length is 2)" and false, `(int(s) > 0) || true` "invalid operation: int(ab)" and true,
`nilmap.a.b and false` "cannot fetch b from <nil>" and false, in any context (`not (...)`,
`[...][0]`, `... ? 1 : 2`). The sibling branch leaks a value: `(false ? 0.5 : "bar") and true`,
typed bool, is the error unoptimised and the string "bar" optimised (the expr/1 standard would
make that medium; the test's recogniser names only the constant-false `and` and
constant-true `or` shapes). Optimize is on by default (`expr.Optimize(false)` turns it off),
so whether a program's error surfaces depends on a switch documented as a performance one.
Fix: fold `x and false` only when x is a constant (or keep x for its effects: `x; false` is not
available, so leave the node alone unless both sides are constants), and the same for `or
true`, `and true`, `or false`. Found by TestHegelOptimizerIsTransparent (counted as
candidate/go/expr-5 by the rewrite of 2026-10-07, whose even draw over the fuzz corpus reached
`reduce(false ? 0.5 : "bar", # and false)`; judged the same day); the narrow property
TestHegelFoldedShortCircuitKeepsErrors draws `and false`/`or true` with a left operand that
fails at run time, and the wide properties TestHegelOptimizerIsTransparent and
TestHegelModelAgrees name the shape (Known.shortCircuitFolded).
'''
