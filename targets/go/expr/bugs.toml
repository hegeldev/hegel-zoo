# Bugs found in github.com/expr-lang/expr by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure
# in target.toml.

[[bug]]
id = "expr/1"
title = "The checker's types never admit nil: find/findLast/findIndex/findLastIndex/first/last/get are typed as the element type (int) and `c ? nil : x` as x's type, but all of them return nil"
kind = "contract"
severity = "medium"
test = "TestHegelPinFindersHonourTheirStaticType"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (2026-07-07)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
docs/configuration.md: "It is safe to assert the output to bool, if the expression is type
checked as bool", and AsInt()/AsBool()/WarnOnAny() build on the checker's type. With
env `arr []int`: `find(arr, # > 5)`, `findLast`, `findIndex(arr, # > 5)`, `findLastIndex`,
`first(empty)`, `last(empty)` (documented: "If the array is empty, returns nil"),
`get(arr, 9)` (documented: "If the index is out of range, returns nil") and
`true ? nil : arr[0]`, `false ? arr[0] : nil`, `nil ?? i`, `if true { nil } else { s }` are
all typed `int` (or `string`) by checker.Check and evaluate to nil, so `output.(int)` on
the documented-safe assertion panics; findIndex/findLastIndex have no documented not-found
value at all and return nil where the static type says int. Found by the static-type
property on the upstream fuzz corpus (`find(array, !ok)` → static int, runtime nil) and the
array-function property (`findIndex(arr, # > 0)` on an empty array). Either the static type
of these constructs must be `any`/nullable or the values must have the static type.
"""

[[bug]]
id = "expr/2"
title = "FloatNode.String() prints an integral float without a decimal point, so the printed AST re-parses as an integer (`1.0` → `1`, type float → int)"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinFloatLiteralsPrintAsFloats"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (2026-07-07)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parser.Parse("1.0").Node.String()` is "1"; "0.0" → "0", "-0.0" → "-0", "100.0" → "100",
"[1.0, 2]" → "[1, 2]", "{a: 1.0}" → "{a: 1}" (2.5 and 1e21 print fine). Parsed again the
literal is an IntegerNode: `type(1.0)` is "float" but `type(<printed>)` is "int", and a
float operand becomes an int one (`1.0 + 2` → `1 + 2`, int 3 instead of float 3). The
printer is what `ast.Node.String()`, the debug REPL and users patching or re-emitting
expressions rely on. Found by the print → parse property on the fuzz corpus (`0.0`).
"""

[[bug]]
id = "expr/3"
title = "A `let` or a `;` sequence nested in another expression prints without parentheses: `1 + (let x = 1; x)` prints as `1 + let x = 1; x`, which does not parse"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinNestedLetPrintsWithParentheses"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (2026-07-07)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
VariableDeclaratorNode.String() and SequenceNode.String() print their contents bare, and
the binary/unary/conditional/array/call printers do not parenthesise them: `1 + (let x = 1;
x)` → "1 + let x = 1; x" ("unexpected token Operator(let)"); `(let x = 1; x) + 1` → "let x
= 1; x + 1", which parses but as `let x = 1; (x + 1)`; `(let x = 1; x) ? 2 : 3` likewise
re-associates; `!(1; true)` → "!1; true", which parses as `(!1); true`. Found by the print →
parse property on generated `let` expressions and a mutated corpus line.
"""

[[bug]]
id = "expr/4"
title = "DisableBuiltin and DisableAllBuiltins leave the predicate builtins (filter, map, count, sum, sortBy, reduce, find, all, groupBy, …) enabled"
kind = "contract"
severity = "medium"
test = "TestHegelPinDisableBuiltinCoversPredicates"
found = { commit = "4b31df3a2e0eefec04c017a82a00e0f08541d3e4", version = "v1.17.8+ (2026-07-07)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
expr.go: "DisableBuiltin disables builtin function", "DisableAllBuiltins disables all
builtins"; docs/language-definition.md lists all/any/one/none/map/filter/find*/groupBy/
count/sum/reduce/sortBy among the array functions with len, sort, uniq, … `count(arr, # >
0)`, `filter(arr, # > 0)`, `map(arr, #)`, `sum(arr)`, `sortBy(arr, #)`, `reduce(arr, #acc +
#)`, `find(arr, # > 0)`, `all(arr, # > 0)`, `groupBy(arr, #)` all compile under
