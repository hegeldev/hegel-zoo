# Bugs found in etcd-io/bbolt by the Hegel zoo. Oracle: an in-memory model of the key space,
# tx.Check() as the integrity observer.

[[bug]]
id = "bbolt/1"
title = "MoveBucket silently drops the changes made to the moved bucket earlier in the same transaction"
kind = "wrong-result"
severity = "high"
test = "TestHegelMoveBucketKeepsChangesMadeInTheSameTransaction"
found = { commit = "b6b954af019bff11e94dd2e0de5a2761077a353a", version = "v1.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Bucket.MoveBucket reads the sub-bucket's entry with c.seek(newKey), deletes it from the
source node, then puts `cloneBytes(v)` — the serialized bucket header as it stands in the
source's node/page — into the destination. It also removes the child from b.buckets, the
map of materialised sub-buckets whose in-memory nodes are spilled at commit. So any change
made to the sub-bucket earlier in the same transaction lives only in that orphaned in-memory
bucket and is never written:

    tx.Update: sub := a.Bucket("sub"); sub.Put("new", "2"); a.MoveBucket("sub", dst)
    → dst/sub has "old" (committed earlier) but not "new"; for a bucket created in the same
      transaction every key put into it is lost; a Delete before the move is undone
      (`big.Delete("key0000"); tx.MoveBucket("big", nil, b)` → key0000 is back).

No error is returned and tx.Check() is clean, so the loss is silent. Either MoveBucket should
spill the child first (or move the materialised child in b.buckets over to the destination),
or it should refuse to move a bucket with pending changes.
'''

[[bug]]
id = "bbolt/2"
title = "MoveBucket into the moved bucket itself or one of its descendants succeeds and deletes the bucket; tx.Check() then reports unreachable pages"
kind = "wrong-result"
severity = "high"
test = "TestHegelMoveBucketRefusesCycles"
found = { commit = "b6b954af019bff11e94dd2e0de5a2761077a353a", version = "v1.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The "same bucket" guard (ErrSameBuckets, documented case 4) compares the *source parent* with
the destination, not the bucket being moved. So with `[a]` holding `x=y` and a child `[b]`:

    tx.MoveBucket("a", nil, tx.Bucket("a"))              // move a into itself
    tx.MoveBucket("a", nil, tx.Bucket("a").Bucket("b"))  // move a into its child

both return nil; after commit no top-level bucket is left (a's entry was deleted from the
root and re-added inside a subtree that is no longer reachable), and tx.Check() reports
`page N: unreachable unfreed` for a's pages — the data is gone and the pages leak. The
destination should be rejected when it is the moved bucket or lies inside it (walk from the
destination up to the root, or compare root page ids along the path).
'''
