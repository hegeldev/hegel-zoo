# Bugs found in mvdan/gofumpt by the Hegel properties in hegel.patch (see README.md).
#
# Oracles: gofumpt's own contract (its rules are idempotent in one pass, and its output is
# gofmt-stable), the go/format it vendors, go/parser and go/types. Not judged: sources gofmt
# itself is not stable on, and formatting gofumpt inherits from the vendored go/printer.

[[bug]]
id = "gofumpt/1"
title = "Grouping adjacent lone const declarations changes the value of iota in the later ones"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinConstIotaGrouped"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    package p

    const a = iota
    const b = iota

gives

    const (
        a = iota
        b = iota
    )

b was 0 and is now 1: the program's constants change. In a lone declaration iota is 0 for
its only spec; in a group it counts the specs. The lone-declaration join (format/format.go,
applyPre, *ast.File: "Join contiguous lone var/const/import lines") appends the specs of the
following const declarations to the first without looking at iota. Any lone const whose value
mentions iota, directly or through a repeated expression, and that follows another lone const
with no empty line between, changes value; the shift also alters `1 << iota` masks. The property
compares the constant values (go/types) before and after formatting.
'''

[[bug]]
id = "gofumpt/2"
title = "An empty line before a closing brace survives the first run when the last line ends in a respaced comment"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinRespacedCommentEnd"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    func f() {
        x() //c

    }

gives `x() // c` with the empty line before the `}` kept; a second run removes it. The
comment-spacing rule sets comment.Text = "// " + body (format.go, applyPre, *ast.File,
groupLoop) without moving anything, so the comment's End() is one byte past the line end, i.e.
at the start of the next line; the rules that remove empty lines before a closing brace or
parenthesis take the last content to end on that line and see no empty line. The same End()
spill makes balance_calls skip a call whose closing line ends in a respaced comment, so the
call is balanced only in the second run. In the second run the comment is already spaced.
'''

[[bug]]
id = "gofumpt/3"
title = "A var statement with a comment before its value on the next line becomes a short assignment whose value gofmt then re-indents"
kind = "contract"
severity = "low"
test = "TestHegelPinVarCommentContinuation"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    func f() {
        var s = // c
            y
    }

gives

    func f() {
        s := // c
        y
    }

gofmt (and a second gofumpt run) indent `y` as a continuation line. The var-to-short-assignment
rewrite (format.go, applyPre, *ast.DeclStmt) builds an *ast.AssignStmt from the spec's
positions; go/printer indents the value of a ValueSpec that starts on a later line but not the
right-hand side of such an AssignStmt. The output is not gofmt-stable, against the documented
contract that running gofmt after gofumpt changes nothing.
'''

[[bug]]
id = "gofumpt/4"
title = "Lone declarations with trailing comments are joined with the comment after the closing parenthesis, and imports in the wrong order until the second run"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLoneDeclCommentMerge"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    import "os" // c
    import "github.com/x/y"

gives

    import (
        "github.com/x/y"
        "os"
    ) // c

the comment that belonged to "os" is now after the `)`, and the group has the third-party
import first; the second run then separates the imports into the std and third-party groups
(the order the first run should have produced) while the comment stays displaced. The join
(format.go, applyPre, *ast.File) sets start.Rparen = end - 1 where end is the end of the last
declaration's inline comment, so the `)` is placed after the comment; ast.SortImports is then
run on positions that no longer match the text. For var and const declarations the same join
glues the `)` to a trailing block comment (`var (\n\ta = 1 /* c */\n\tb = 2 )`-like output that
gofmt realigns), so the output is not gofmt-stable either.
'''

[[bug]]
id = "gofumpt/5"
title = "A doc comment with an indented line and a respaced last line is not reformatted as gofmt does"
kind = "contract"
severity = "low"
test = "TestHegelPinDocCommentRespacedEnd"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    //	c
    //d
    func f() {}

gives `//\tc` then `// d`; gofmt, and a second gofumpt run, print

    //	c
    //
    // d

(the indented line is a code block, which the doc-comment printer separates from the text by an
empty `//` line). The comment-spacing rule changes `//d` to `// d` after go/printer's
doc-comment formatting has looked at the group (the group's text is re-parsed only in the next
run), so the first output is not gofmt-stable.
'''

[[bug]]
id = "gofumpt/6"
title = "A one-spec var group with a comment at the end of a block leaves an empty line before the closing brace"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinVarGroupCommentBlankLine"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    func f() {
        var (
            s = c // c
        )
    }

gives

    func f() {
        s := c // c

    }

and the second run removes the empty line. The same happens with a comment on the line above
the group (`// c\n\tvar (\n\t\ts = c\n\t)` gives `// c`, an empty line, `s := c`, an empty
line, `}`), and with a comment on the last line of a multi-line value. removeParens (format.go)
unwraps the group by moving the spec's positions to the `var` line and dropping the `)` line;
the comment keeps its position, so the line of the statement's end no longer matches the text
when the rule removing empty lines before a closing brace runs.
'''

[[bug]]
id = "gofumpt/7"
title = "An import group with comments and a std import to move up is put in order only in the second run"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinImportGroupCommentSort"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    import (
        "zz.dev/q"
        "go/ast" // c
    )

gives the group sorted (gofmt's alphabetical sort: "go/ast" // c, then "zz.dev/q") but with no
empty line between the std and the third-party import; the second run adds it. joinStdImports
(format.go) never moves an import with a comment ("Moving an import leaves its comments
behind"), so in the first run "go/ast" is left in the third-party group; gofmt's sort then puts
it first anyway, and the second run, seeing it at the top, separates the groups. A comment line
inside the group also bridges an empty line for joinStdImports (lastEnd is set to the comment's
end), so a group like `"os"`, empty line, `"fmt"`, `// c`, `"sort"`, `"zz.dev/q"` gets its
empty line before "zz.dev/q" only in the second run.
'''

[[bug]]
id = "gofumpt/8"
title = "A third-party directive comment on a lone declaration is respaced by go/printer, and the second run then joins the declaration with the next, changing iota"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinPrinterRespacedDirective"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    //nolint
    const a = iota
    const b = iota

gives `// nolint` (go/printer's doc-comment formatter knows //go: and //line-style directives
but not //nolint, //noinspection, //#nosec, //NOSONAR or //sys, and spaces them) with the two
declarations still separate: the lone-declaration join does not merge a declaration whose doc
comment contains a directive (containsAnyDirective). In the second run the comment is
`// nolint`, no longer a directive, and the declarations are joined into a group: b changes
from 0 to 1 (gofumpt/1). The first run also destroys the directive for the tool it was
meant for.
'''

[[bug]]
id = "gofumpt/9"
title = "A comment on the opening line of a one-spec top-level var group becomes the declaration's doc comment, formatted as one only in the second run"
kind = "contract"
severity = "low"
test = "TestHegelPinVarGroupCommentDoc"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    var ( //  c
        y = 1
    )

gives

    //  c
    var y = 1

gofmt, and a second gofumpt run, print `// c`: as the doc comment of a declaration the comment
is formatted by go/printer's doc-comment printer, which normalises the spacing after `//`.
removeParens (format.go) unwraps the group and leaves the comment where it was, which is now
the line above the declaration, without running the doc-comment formatting that go/printer
applies when it parses the text. The same happens with a comment on the line above the spec
inside the group. The output is not gofmt-stable.
'''

[[bug]]
id = "gofumpt/10"
title = "An empty struct or interface type with a comment inside, in a parameter list, is printed over two lines, and the second run moves the closing parenthesis"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyTypeCommentFieldList"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    func f(a struct { /* c */ }, b int) {
        x()
    }

gives

    func f(a struct { /* c */
    }, b int) {
        x()
    }

and the second run, seeing a parameter list that spans lines, moves its closing parenthesis
to a line of its own (`}, b int,` then `) {`). gofmt keeps the one-line form. The empty field
list rule (format.go, applyPre, *ast.FieldList) skips field lists with comments; the comment,
inside the braces, is then printed by go/printer as a trailing comment of the `{` line, which
puts the `}` on the next line. Shapes where gofmt itself is not stable (the same type in a
result list) are not counted.
'''

[[bug]]
id = "gofumpt/11"
title = "A lone declaration spanning lines only for a two-line empty type or literal is joined with the next lone declaration in the second run, changing iota"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinLoneDeclCollapseJoin"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    const a = len([1]int{
    })
    const b = iota

gives `const a = len([1]int{})` and `const b = iota` on consecutive lines: the join of lone
declarations (format.go, applyPre, *ast.File) does not merge them because a spans two lines in
the source, and go/printer then puts the empty literal on one line. The second run sees two
adjacent one-line declarations and groups them: b changes from 0 to 1 (gofumpt/1). The same
happens with `struct {\n}{}`, `interface {\n}(nil)`, `map[string]int{\n}` and `[]int{\n}`
values, and with var and type declarations (`type T struct {\n}` before another lone type: no
value change there, but the output changes between the runs). A one-spec var group that
removeParens unwraps joins the chain in the same way.
'''

[[bug]]
id = "gofumpt/12"
title = "balance_calls: a call spanning lines in a declaration with a trailing comment, directly followed by another multi-line declaration, is balanced only in the second run"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinBalanceCallsSeparatedDecl"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With Extra.BalanceCalls, formatting

    var n = f(
        b) // c
    func f1(n int) {
    }

gives the declarations separated by an empty line (the rule that multi-line top-level
declarations are separated) but the call still unbalanced; the second run prints `b,` and
`) // c`. The separator is added to the line table (addNewline) in the *ast.File visit, before
the call is visited, and the call's closing line then no longer matches the comment's position
for the balance_calls check, which looks at the inline comment after the closing parenthesis.
'''

[[bug]]
id = "gofumpt/13"
title = "group_params: parameters whose types are the same only once go/printer has formatted them are grouped only in the second run"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinGroupParamsCollapse"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With Extra.GroupParams, formatting

    func f(a interface {
    }, b interface{}) {
    }

gives `func f(a interface{}, b interface{}) {` and the second run `func f(a, b interface{}) {`.
The rule compares the parameters' types by their printed text at the time of the visit; the
