[[bug]]
id = "gofumpt/14"
title = "A comment group directly after two lone imports, std and third-party, is printed as a trailing comment of the closing parenthesis of the group made of them"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinImportJoinTrailingComment"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    import "os"
    import "github.com/x/y"
    // c

gives

    import (
        "os"

        "github.com/x/y"
    ) // c

The comment, which stood on its own line after the imports at the end of the file, is now the
`)`'s trailing comment; a group of several comment lines has its first line moved there and
the rest left below. Conditions found: the std import sorts after the third-party one
("os" after "github.com/x/y", "strings" after "foo.com/bar"; with "fmt" before
"github.com/x/y" nothing happens), and nothing follows the comment group (with a declaration
after it, an empty line before it, two std imports, or an import group in the source, the
comment stays on its own line). The lone-declaration join (format.go, applyPre, *ast.File)
sets start.Rparen = end - 1, at the last character of the last import, and runs
ast.SortImports, which puts the third-party import first; joinStdImports then moves the std
import back to the top (setPos) and drops the line it left behind, the group's last line, from
the line table, which merges the `)` and the comment on the following line into one line. When
the group starts with a directive (`//#nosec G101` then `//c`), the comment-spacing rule skips
the whole group in the first run, and the second run, where the directive is a trailing
comment of its own, respaces `//c` to `// c`.
'''

[[bug]]
id = "gofumpt/15"
title = "A case list spanning lines is put on one line only in the second run when the length gofumpt measures for it shrinks in the first"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinCaseListLengthCollapse"
found = { commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d", version = "v0.12.0 (3e07e7e)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Formatting

    switch x {
    case yyyyyyyyyyyyyyyyyyyyyyyyyyyy,
        z: // c
        g()
    }

(two trailing spaces after the comment) keeps the list on two lines in the first run and puts
it on one, `case yyyyyyyyyyyyyyyyyyyyyyyyyyyy, z: // c`, in the second. The rule (format.go,
applyPre, *ast.CaseClause) joins a case list that spans lines when printLength of the clause
without its body, plus the text of the inline comment after it, plus 8 per block level, is at
most shortLineLimit (60). Whatever shortens that measure between the runs makes the join a
second-run change: trailing spaces in the comment (go/printer strips them), or a two-line
empty type or literal in the list, `G[interface {\n}, T2](b)`, that go/printer puts on one
line.
'''
