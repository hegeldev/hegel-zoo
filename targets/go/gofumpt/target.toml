name = "gofumpt"
language = "go"
upstream = "https://github.com/mvdan/gofumpt"
subdir = ""
license = "BSD-3-Clause"  # LICENSE (+ LICENSE.google for the gofmt fork); AGENTS.md/CLAUDE.md guide coding agents, no ban (commit 3e07e7e, checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "3e07e7e70ac93761d8e79ca0083a19e3d59f753d"
date = "2026-09-07"
version = "v0.12.0 (3e07e7e)"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
# Wide properties: the shapes of the recorded bugs are drawn by default (STYLE.md rule 11) and
# each lands in the basin it reaches most often; at natural rates TestHegelGofmtStable passes some runs.
TestHegelConstValues = "gofumpt/1"
TestHegelGofmtStable = { bug = "gofumpt/5", intermittent = true }
TestHegelIdempotent = "gofumpt/5"
# Narrow properties (hegel/hegel_shapes_test.go): one per bug, each drawing only its shape region
# with random contents; skipped under HEGEL_NO_KNOWN=1.
TestHegelLoneIotaConstantsKeepTheirValues = "gofumpt/1"
TestHegelRespacedCommentBeforeClosingBraceIsStable = "gofumpt/2"
TestHegelVarCommentBeforeValueIsGofmtStable = "gofumpt/3"
TestHegelLoneImportsWithTrailingCommentsJoinStably = "gofumpt/4"
TestHegelDocCommentWithIndentedLineIsGofmtStable = "gofumpt/5"
TestHegelOneSpecVarGroupWithCommentEndsBlockStably = "gofumpt/6"
TestHegelImportGroupCommentsSortStably = "gofumpt/7"
TestHegelDirectiveOnLoneDeclarationsIsStable = "gofumpt/8"
TestHegelOneSpecVarGroupCommentIsGofmtStable = "gofumpt/9"
TestHegelEmptyTypeWithCommentInParameterListIsStable = "gofumpt/10"
TestHegelLoneDeclarationsCollapsedByThePrinterJoinStably = "gofumpt/11"
TestHegelBalanceCallsBeforeAMultiLineDeclarationIsStable = "gofumpt/12"
TestHegelGroupParamsOnTypesEqualOncePrintedIsStable = "gofumpt/13"
TestHegelCommentGroupAfterLoneImportsStaysApart = "gofumpt/14"
TestHegelCaseListAtTheShortLineLimitCollapsesStably = "gofumpt/15"
# Pins: the regression examples.
TestHegelPinConstIotaGrouped = "gofumpt/1"
TestHegelPinRespacedCommentEnd = "gofumpt/2"
TestHegelPinVarCommentContinuation = "gofumpt/3"
TestHegelPinLoneDeclCommentMerge = "gofumpt/4"
TestHegelPinDocCommentRespacedEnd = "gofumpt/5"
TestHegelPinVarGroupCommentBlankLine = "gofumpt/6"
TestHegelPinImportGroupCommentSort = "gofumpt/7"
TestHegelPinPrinterRespacedDirective = "gofumpt/8"
TestHegelPinVarGroupCommentDoc = "gofumpt/9"
TestHegelPinEmptyTypeCommentFieldList = "gofumpt/10"
TestHegelPinLoneDeclCollapseJoin = "gofumpt/11"
TestHegelPinBalanceCallsSeparatedDecl = "gofumpt/12"
TestHegelPinGroupParamsCollapse = "gofumpt/13"
TestHegelPinImportJoinTrailingComment = "gofumpt/14"
TestHegelPinCaseListLengthCollapse = "gofumpt/15"
