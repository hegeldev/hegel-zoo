# Bugs found in beevik/etree by the Hegel zoo. Each has a pin test (hegel_pins_test.go) listed
# as an expected failure in target.toml.

[[bug]]
id = "etree/1"
title = "Remove() on a token without a parent dereferences nil instead of returning false"
kind = "panic"
severity = "medium"
test = "TestHegelPinRemoveWithoutParentReturnsFalse"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Remove, added in v1.8.0 to every token type, documents "If the element has no parent, the
function returns false". Its body is `e.Parent().RemoveChild(e) != nil`: with a nil parent,
RemoveChild runs on a nil *Element, its `t.Parent() != e` guard passes (both nil) and
RemoveChildAt reads `e.Child` of the nil receiver. etree.NewElement("a").Remove(),
NewText("a").Remove() and NewComment("a").Remove() all panic with a nil dereference.
'''

[[bug]]
id = "etree/2"
title = "RemoveChildAt and InsertChildAt panic on a negative index"
kind = "panic"
severity = "low"
test = "TestHegelPinNegativeIndexIsOutOfBounds"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RemoveChildAt documents "If the index is out of bounds, no child is removed and nil is
returned", but only checks `index >= len(e.Child)`: RemoveChildAt(-1) indexes Child[-1] and
panics. InsertChildAt(-1, t) (documented for indices beyond the end only) slices `Child[-1+1:]`
and panics as well. Both are the natural result of an Index() of -1 (an unparented token) being
passed on.
'''

[[bug]]
id = "etree/3"
title = "Copy() of a child token keeps the original's Index() without a parent"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCopyHasNoIndex"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Index documents "If the element has no parent, the function returns -1". Element.Copy (and the
dup of every token type) copies the index field, so the copy of the child at index 1 has
Parent() == nil and Index() == 1. The stale index is what InsertChildAt reads when a copy is
inserted into its original parent (`t.Parent() == e && t.Index() < index`) -- harmless there
since the parent is nil, but wrong as an answer.
'''

[[bug]]
id = "etree/4"
title = "Whitespace-only text created through the API is not IsWhitespace, unlike parsed text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWhitespaceTextIsWhitespace"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NewText, CreateText, SetText and SetTail create the CharData with flags 0, so
NewText("  ").IsWhitespace() is false, while the same text read from a document, or set with
SetData, is flagged. IsWhitespace documents "true if this CharData token contains only
whitespace". The flag drives Indent's stripping of old indentation: the tree built with
CreateElement("a").CreateText("  ") indents to `<r>\n  <a>  </a>\n</r>` and the same tree parsed
from `<r><a>  </a></r>` indents to `<r>\n  <a/>\n</r>`.
'''

[[bug]]
id = "etree/5"
title = "SetText replaces only the text before the first comment while Text() reads past it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSetTextThenText"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Text() concatenates the leading character data and skips comments (`<e>a<!--c-->b</e>` gives
"ab"). SetText replaces "all character data immediately following an element's opening tag" but
stops at the first non-CharData token, the comment included: after SetText("new") the element is
`<e>new<!--c-->b</e>` and Text() returns "newb"; with a comment first, `<e><!--c-->hi</e>`,
SetText("new") gives Text() "newhi". SetText("") likewise leaves the text after the comment.
'''

[[bug]]
id = "etree/6"
title = "The [tag] filter keeps a candidate once per matching child, so a following [n] miscounts"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinChildFilterKeepsEachCandidateOnce"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
filterChild and filterChildText append the candidate for every child that matches instead of
once (filterAttr breaks after the first match). Duplicates are removed only when results are
yielded, so a positional filter after a child filter counts them: in
`<r><a id="1"><b/><b/></a><a id="2"><b/></a></r>`, ./a[b][2] and //a[b][2] return the a with
id 1 (its two b children put it twice in the list) instead of id 2, and ./a[b][3] returns id 2.
XPath a[b][2] is the second a that has a b child.
'''

[[bug]]
id = "etree/7"
title = "The [0] filter selects the first element"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroIndexSelectsNothing"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The Path documentation says "[n] Keep the n-th element, where n is a numeric index starting from
1". parseFilter maps a positive n to index n-1 and passes any other value through as is, so [0]
becomes index 0 and ./a[0] returns the same element as ./a[1] (XPath: nothing). Negative
indices count from the end (./a[-1] is the last a), which is undocumented but coherent.
'''

[[bug]]
id = "etree/8"
title = "A quoted filter value containing '[' does not compile"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBracketInQuotedValueCompiles"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
splitPath respects quotes when splitting on '/', so [@x='a/b'] works, but parseSegment splits
the segment on '[' with strings.Split, quotes ignored: ./a[@x='['] becomes the pieces "@x='"
and "']" and CompilePath returns "path has invalid filter [brackets]". A ']' in a quoted value
happens to work. FindElement panics on the same path (MustCompilePath).
'''

[[bug]]
id = "etree/9"
title = "Default escaping writes carriage returns (and attribute tabs and newlines) raw, so they do not survive a round trip"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCarriageReturnSurvivesARoundTrip"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
escapeString in its default mode leaves '\r' alone in text and attribute values and '\t' and
'\n' alone in attribute values; XML parsers normalise a literal CR to LF (and attribute tabs and
newlines to spaces), so `<r a="x&#xD;y">` is needed to keep them. With the default
WriteSettings, a document with CreateText("a\rb") and CreateAttr("a", "x\ry") is written as
`<r a="x\ry">a\rb</r>` and read back by etree itself as "a\nb" and "x\ny"; lxml also turns the
attribute's tab and newline into spaces. The Canonical* settings escape them (`&#xD;`, `&#x9;`,
`&#xA;`) and round-trip, so the default is the odd one out.
'''

[[bug]]
id = "etree/10"
title = "SelectAttr with an unprefixed key returns a prefixed attribute that precedes the unprefixed one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCreateAttrThenSelectAttr"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SelectAttr and SelectAttrValue match with spaceMatch, where an empty prefix matches any prefix,
and return the first hit; CreateAttr and RemoveAttr match the prefix exactly. On an element
with p:x="1", CreateAttr("x", "2") adds a second attribute and SelectAttrValue("x", "") then
returns "1". Matching any prefix is a documented convenience for paths, but with attributes it
makes create-then-select return another attribute's value.
'''

[[bug]]
id = "etree/11"
title = "CDATA contents are not sanitised of forbidden characters, so the output cannot be read back"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCDataIsSanitised"
found = { commit = "02c461ac1551a5373f3fe133e78d3b47577900eb", version = "v1.8.0+1", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Since v1.7.0 text and attribute values replace characters outside the XML character range
(and invalid UTF-8) with U+FFFD when written. CDATA sections only split "]]>", comments only fix
hyphens and instructions only "?>": CreateCData("a\x01b") is written as `<![CDATA[a\x01b]]>`
and ReadFromString of that output fails with "illegal character code U+0001" (U+FFFE and invalid
bytes likewise). Comments and instructions with such characters are written too; encoding/xml
does not check them, a conforming parser rejects them.
'''
