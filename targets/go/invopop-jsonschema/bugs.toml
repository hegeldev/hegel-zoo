# Bugs found in invopop/jsonschema by the Hegel tests of this target.

[[bug]]
id = "invopop-jsonschema/1"
title = "A url.URL field is reflected as a string with format uri, while encoding/json writes it as an object"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinURLIsObject"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
reflectStruct (reflect.go) maps url.URL to {"type": "string", "format": "uri"}, but url.URL has
no MarshalJSON or MarshalText, so encoding/json writes its fields: {"Scheme": "https", "Opaque":
"", "User": null, "Host": "example.com", ...}. Every value of a struct with a url.URL field fails
validation against its own schema (type string expected). Found by TestHegelValidate (a struct
with a url.URL field marshalled and validated with python-jsonschema) and TestHegelSchema with
the urlIsString switch off.
"""

[[bug]]
id = "invopop-jsonschema/2"
title = "Maps with signed integer keys get patternProperties ^[0-9]+$, so negative keys are rejected"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNegativeIntKeys"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
reflectMap gives a map[int]T (and int8..int64) the schema {"patternProperties": {"^[0-9]+$": T},
"additionalProperties": false}. encoding/json writes negative keys as "-1", which the pattern
does not match, so {"m": {"-1": "x"}} fails validation ("'-1' does not match any of the regexes").
Unsigned keys get additionalProperties T instead (no pattern). Found by TestHegelValidate
(map[int] values with negative keys) and TestHegelSchema with the intKeysNonNegative switch off.
"""

[[bug]]
id = "invopop-jsonschema/3"
title = "A field whose json tag is -, (the key -) is left out of the schema"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDashName"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
encoding/json documents that the tag "-," names a field "-" (only the exact tag "-" drops it).
reflectFieldName tests jsonTags[0] == "-" and ignores the field for "-," and "-,omitempty" as
well, so the schema has no property "-" and additionalProperties false rejects {"-": 3}. Found by
TestHegelValidate and TestHegelSchema with the dashNameIgnored switch off.
"""

[[bug]]
id = "invopop-jsonschema/4"
title = "A later field with the same key replaces an earlier one: an embedded struct's field overrides the outer field"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmbeddedOuterWins"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
reflectStructFields sets each property with Properties.Set(name, property), so a duplicate key
takes the last field's schema, and appendUniqueString keeps the first field's required entry.
encoding/json's rule is the opposite for embedding: the shallower field wins (at the same depth
the tagged one, else both are dropped). For

    type Inner struct { A int `json:"a"`; B string `json:"b"` }
    type S struct { A string `json:"a"`; Inner }

json.Marshal writes {"a": "s", "b": ...} but the schema says "a" is an integer, so the value is
rejected; with Inner first and A second the schema is right by luck of order. Found by
TestHegelValidate and TestHegelSchema with the sameKeyOverwrites switch off.
"""

[[bug]]
id = "invopop-jsonschema/5"
title = "The json tag option inline inlines a struct field, while encoding/json knows no such option and writes the key"
kind = "contract"
severity = "low"
test = "TestHegelPinInlineOption"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
reflectFieldName ("As per JSON Marshal rules, inline nested structs that have `inline` tag")
treats json:"i,inline" as an embedding, so the fields of I appear at the top level, and a
non-struct field with the option disappears from the schema. encoding/json has no inline option
(it is yaml's) and ignores unknown options: json.Marshal writes {"i": {"a": 0, "b": ""}, "z": 0},
which the schema rejects (i unexpected, a and b missing). Found by TestHegelValidate and
TestHegelSchema with the inlineOptionEmbeds switch off. (Reasonable for FieldNameTag "yaml";
wrong for the default json tag.)
"""

[[bug]]
id = "invopop-jsonschema/6"
title = "An unexported embedded non-struct type becomes a required property that encoding/json never writes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnexportedEmbedded"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
reflectFieldName skips unexported fields only when they are not anonymous (`!f.Anonymous &&
f.PkgPath != ""`), so for `type level int; type S struct { level; Y int }` the schema has a
required property "level" of type integer, while encoding/json ignores unexported embedded
non-struct fields: {"Y": 0} is rejected ("level is a required property"). Pinned only
(reflect.StructOf cannot embed an unexported type, so the generated types do not reach it).
"""

[[bug]]
id = "invopop-jsonschema/7"
title = "The tag uniqueItems=false sets uniqueItems true"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUniqueItemsFalse"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
arrayKeywords sets t.UniqueItems = true for any uniqueItems=<value> (the value is not read), so
`jsonschema:"uniqueItems=false"` produces "uniqueItems": true and arrays with repeated elements
are rejected. (A bare `uniqueItems` without "=" is ignored.) Found by TestHegelSchema with the
uniqueItemsAlwaysTrue switch off.
"""

[[bug]]
id = "invopop-jsonschema/8"
title = "jsonschema_extras parses minimum as a number but maximum (and every other keyword) as a string, an invalid schema"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinExtrasMaximum"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
setExtra special-cases the key "minimum" (strconv.Atoi) and the values true/false; everything
else stays a string, so `jsonschema_extras:"minimum=2,maximum=5"` gives {"minimum": 2,
"maximum": "5"}, which the 2020-12 meta-schema rejects ('5' is not of type 'number') and
python-jsonschema refuses to validate with. Found by TestHegelValidate (check_schema of the
generated schema) and TestHegelSchema with the extrasMaximumString switch off.
"""

[[bug]]
id = "invopop-jsonschema/9"
title = "net.IP gets format ipv4 whatever the address, so IPv6 addresses fail format checking"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIPv6"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
reflectTypeToSchema maps net.IP to {"type": "string", "format": "ipv4"} (a TODO in the code
notes the missing ipv6 case). encoding/json writes an IPv6 net.IP as "fe80::1", which a
validator with format assertions rejects ("is not a 'ipv4'"). Found by TestHegelValidate
(python-jsonschema with its format checker) and TestHegelSchema with the ipAlwaysV4 switch off.
"""

[[bug]]
id = "invopop-jsonschema/10"
title = "Type-specific tags on a field of a named slice type are dropped along with the $ref"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNamedSliceTags"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A field of a named slice type (type IDs []int) is a {"$ref": "#/$defs/IDs"}, and
structKeywordsFromTags dispatches on the property's Type, which is empty for a $ref: minItems,
maxItems, uniqueItems, default and the items' keywords in `jsonschema:"minItems=1,
uniqueItems=true"` vanish without a word (title and description are kept). 2020-12 allows them as
siblings of $ref. Found by TestHegelSchema with the refTagsDropped switch off.
"""

[[bug]]
id = "invopop-jsonschema/11"
title = "The default= tag on an array field is a list of strings whatever the items type"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinArrayDefaultTyped"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
arrayKeywords collects default= values as strings: `[]int` with `jsonschema:"default=1,default=2"`
gives "default": ["1", "2"] and `[]bool` with default=true gives ["true"], values the schema
itself would reject; scalar fields convert (default=2 on an int is the number 2). Found by
TestHegelSchema with the arrayDefaultsAreStrings switch off.
"""

[[bug]]
id = "invopop-jsonschema/12"
title = "ExpandedStruct on a recursive type leaves $refs to the definition it removed"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinExpandedRecursive"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
ReflectFromType with ExpandedStruct copies the root type's definition into the root and deletes
it from $defs, but the type's own fields still hold {"$ref": "#/$defs/Node"}: for

    type Node struct { V int `json:"v"`; Next *Node `json:"next,omitempty"` }

the schema has "next": {"$ref": "#/$defs/Node"} and no $defs at all. Validators fail to resolve
the reference as soon as "next" is present (python-jsonschema: PointerToNowhere). The reference
should become "#". Found by TestHegelValidate and TestHegelSchema with the expandedDanglingRef
switch off.
"""

[[bug]]
id = "invopop-jsonschema/13"
title = "DoNotReference on a recursive type recurses without end (fatal stack overflow)"
kind = "crash"
severity = "medium"
test = "TestHegelPinDoNotReferenceRecursive"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With DoNotReference, refDefinition always returns nil, so refOrReflectTypeToSchema reflects a
type again wherever it occurs; a self-referential struct (Node with Next *Node) is expanded
forever and the process dies with "goroutine stack exceeds 1000000000-byte limit" (a fatal error
no recover() catches). Pinned in a child process; the generated types exclude the recursive
type under DoNotReference.
"""

[[bug]]
id = "invopop-jsonschema/14"
title = "The nullable tag wraps the schema in oneOf [schema, null], which rejects null for a field that accepts it already"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNullableAny"
found = { commit = "f678162af201cba391c9bf759b429dee5ad5c0bc", version = "v0.14.0+1 (f678162)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
For an interface{} or json.RawMessage field the property schema is true (anything), and
`jsonschema:"nullable"` turns it into {"oneOf": [true, {"type": "null"}]}: null is valid under
both branches, so oneOf fails and the one value the tag was meant to admit is rejected ("None is
valid under each of"). anyOf says what is meant. Found by TestHegelValidate (nil interface
values) and TestHegelSchema with the nullableOneOfRejectsNull switch off.
"""
