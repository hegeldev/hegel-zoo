name = "invopop-jsonschema"
language = "go"
upstream = "https://github.com/invopop/jsonschema"
subdir = ""
license = "MIT"  # COPYING; README has no contributing policy, nothing about AI-written code (commit f678162, checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "f678162af201cba391c9bf759b429dee5ad5c0bc"
date = "2026-04-23"
version = "v0.14.0+1 (f678162)"

[hegel]
version = "v0.9.6"

[run]
# The tests need python3 with the jsonschema package (4.18+) on PATH: it validates the values
# encoding/json writes against the generated schemas.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
TestHegelPinURLIsObject = "invopop-jsonschema/1"
TestHegelPinNegativeIntKeys = "invopop-jsonschema/2"
TestHegelPinDashName = "invopop-jsonschema/3"
TestHegelPinEmbeddedOuterWins = "invopop-jsonschema/4"
TestHegelPinInlineOption = "invopop-jsonschema/5"
TestHegelPinUnexportedEmbedded = "invopop-jsonschema/6"
TestHegelPinUniqueItemsFalse = "invopop-jsonschema/7"
TestHegelPinExtrasMaximum = "invopop-jsonschema/8"
TestHegelPinIPv6 = "invopop-jsonschema/9"
TestHegelPinNamedSliceTags = "invopop-jsonschema/10"
TestHegelPinArrayDefaultTyped = "invopop-jsonschema/11"
TestHegelPinExpandedRecursive = "invopop-jsonschema/12"
TestHegelPinDoNotReferenceRecursive = "invopop-jsonschema/13"
TestHegelPinNullableAny = "invopop-jsonschema/14"
