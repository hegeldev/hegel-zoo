[[bug]]
id = "termenv/1"
title = "The 256-colour conversion averages cube indices instead of channels, so greys are never chosen"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinConvertGreys"
found = { commit = "368a3572b8146cc038b3f240da6792003d7e42c5", version = "v0.16.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`hexToANSI256Color` follows tmux's `colour_find_rgb`: the nearest colour of the 6x6x6 cube and the
nearest of the 24 greys are both candidates, and the nearer of the two wins. The grey candidate is
built from the average of the three channels, but the code computes `average := (r + g + b) / 3`
after `r, g, b` have been overwritten with the *cube indices* (0..5), so the average is always at
most 5 and the grey candidate is always grey 232 (#080808).

Consequences: `ANSI256.Convert(RGBColor("#808080"))` is ANSI256Color(102) (#878787) instead of
244 (#808080), `"#bcbcbc"` becomes 250's neighbour #afafaf, `"#eeeeee"` becomes #ffffff, and
`"#121212"` becomes #080808 — 23 of the 24 xterm greys do not round-trip through their own hex
value. Very dark colours such as #040423 go the other way and become #080808 because the wrong
grey candidate is nearer than the cube's black. Every `Profile.Color("#…")` call in an ANSI256 or
ANSI terminal goes through this conversion.
'''

[[bug]]
id = "termenv/2"
title = "RGBColor.Sequence truncates a channel to one less than its value for 24 of 256 values"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRGBSequenceTruncation"
found = { commit = "368a3572b8146cc038b3f240da6792003d7e42c5", version = "v0.16.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
upstream_issue = "https://github.com/muesli/termenv/issues/217"
notes = '''
`RGBColor.Sequence` parses the hex string into a `colorful.Color` (channels as float64 in 0..1) and
emits `uint8(f.R*255)`. The division and multiplication do not round-trip exactly for 24 of the
256 channel values (e.g. 41, 45, 53, 57, 61, 82, 132 …), and the truncating conversion then loses
one: `RGBColor("#657084").Sequence(false)` is `38;2;101;112;131` rather than `…;132`. Reported
upstream as #217 (PR #218 open); a fix is `uint8(math.Round(f.R*255))` or parsing the hex string
directly.
'''

[[bug]]
id = "termenv/3"
title = "A NoColor or invalid RGBColor in a Style emits an empty SGR parameter, which resets the style"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNoColorInAStyle"
found = { commit = "368a3572b8146cc038b3f240da6792003d7e42c5", version = "v0.16.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NoColor` is documented as "a nop for terminals that don't support colors" and is what
`Ascii.Convert`, `Ascii.Color` and `Output.ForegroundColor()` on a non-TTY return. Its
`Sequence` is `""`, and `Style.Foreground`/`Background` append that empty string to the style
list whenever the colour is non-nil. `Styled` then joins the list with `;`:

    String("x").Bold().Foreground(NoColor{}).String()  ==  "\x1b[1;mx\x1b[0m"
    String("x").Foreground(NoColor{}).Bold().String()  ==  "\x1b[;1mx\x1b[0m"

An empty SGR parameter is parameter 0, a full reset: in the first form the terminal turns bold off
again, in the second the reset is harmless only by luck of ordering. The same happens with an
`RGBColor` that is not valid hex (its `Sequence` is also `""`). Only a style consisting solely of
such colours is handled (the `seq == ""` check). The zoo's `Styled` property counts NoColor steps
and pins them here; `Ascii` profiles are unaffected because they skip rendering entirely.
'''

[[bug]]
id = "termenv/4"
title = "Profile.Color accepts numbers outside 0–255, producing colours whose String() panics"
kind = "panic"
severity = "medium"
test = "TestHegelPinProfileColorOutOfRange"
found = { commit = "368a3572b8146cc038b3f240da6792003d7e42c5", version = "v0.16.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Profile.Color(s)` returns nil for text that is not a hex colour or a number, but any integer is
accepted: `< 16` becomes `ANSIColor(i)`, otherwise `ANSI256Color(i)`. `TrueColor.Color("256")` is
`ANSI256Color(256)` with sequence `38;5;256` (not a colour), `"-1"` is `ANSIColor(-1)` with
sequence `29`, and `"99999"` is `ANSI256Color(99999)`. Calling `String()` or `ConvertToRGB` on any
of them indexes the 256-entry palette table and panics with `index out of range`; `Convert` in an
ANSI profile panics the same way through `ansi256ToANSIColor`. Since colour strings often come from
user configuration or templates (`{{ Color "300" "text" }}`), `Color` should return nil outside
0–255.
'''

[[bug]]
id = "termenv/5"
title = "COLORFGBG values outside 0–15 become ANSIColors that panic in HasDarkBackground"
kind = "panic"
severity = "medium"
test = "TestHegelPinColorFGBGOutOfRange"
found = { commit = "368a3572b8146cc038b3f240da6792003d7e42c5", version = "v0.16.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
When the terminal does not answer the OSC 10/11 query, `foregroundColor`/`backgroundColor` fall
back to the `COLORFGBG` environment variable and return `ANSIColor(i)` for whatever integer they
find there, without a range check. With `COLORFGBG=7;300` (or any value above 15, or negative),
`BackgroundColor()` returns `ANSIColor(300)` and `HasDarkBackground()` — which every
lipgloss/bubbletea program calls at start-up — panics with `index out of range [300] with length
256` inside `ConvertToRGB`. Same root cause as termenv/4 (an `ANSIColor` is constructed from
untrusted input without validation), reached from the environment rather than from a string.
'''

[[bug]]
id = "termenv/6"
title = "A malformed OSC colour reply of the right length panics the parser"
kind = "panic"
severity = "medium"
test = "TestHegelPinMalformedColourReplyPanics"
found = { commit = "368a3572b8146cc038b3f240da6792003d7e42c5", version = "v0.16.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
upstream_issue = "https://github.com/muesli/termenv/issues/144"
notes = '''
`xTermColor` validates a reply only by its total length (24 or 25 bytes) and the `;rgb:` prefix,
then splits the rest on `/` and slices `h[0][:2]`, `h[1][:2]`, `h[2][:2]`. A reply with fewer than
three components, or a component shorter than two characters, panics: through the fake terminal in
the zoo's harness, `ESC ] 10 ; rgb:111111111111111 BEL` gives `index out of range [1] with length
1` and `ESC ] 10 ; rgb:1/11111111111/1 BEL` gives a slice-bounds panic. Terminals do send unusual
replies (upstream #144 was a crash report from a real terminal), and the query also races with
user keystrokes, so anything read from the TTY must be parsed defensively; the function has an
error return that should carry these cases.
'''

[[bug]]
id = "termenv/7"
title = "OSC colour replies are judged by byte length: 2-digit and rgba: replies are rejected, garbage of the right length accepted"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinColourReplyComponentWidths"
found = { commit = "368a3572b8146cc038b3f240da6792003d7e42c5", version = "v0.16.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
X11's colour syntax allows `rgb:<r>/<g>/<b>` with one to four hex digits per component (scaled to
16 bits), and some terminals answer OSC 11 with `rgba:rrrr/gggg/bbbb/aaaa` (upstream #189). Because
`xTermColor` requires the whole reply to be 24 or 25 bytes long, a `rgb:12/34/56` or `rgb:1/3/5`
reply is treated as "no answer" and the colour silently falls back to `COLORFGBG` or the default
black/grey, and an `rgba:` reply is rejected the same way. Conversely `rgb:12121/3434/565` — not
valid X11, but 24 bytes — is accepted and read as #123456 by taking the first two characters of each
component. Parsing the components by shape (`1–4` hex digits each, top byte taken) would fix all
of these and remove the panics of termenv/6.
'''
