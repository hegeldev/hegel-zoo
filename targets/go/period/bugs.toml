# Bugs found in rickb777/period by the Hegel zoo. Schema: see the zoo's README.

[[bug]]
id = "period/1"
title = "Parse rejects P0, which its godoc lists among the zero forms"
kind = "contract"
severity = "low"
test = "TestHegelPinParseAcceptsP0"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The godoc of Parse says: all of "P0Y", "P0M", "P0W", "P0D", "PT0H", PT0M", PT0S", and "P0" are
equivalent. The zero switch in Period.Parse lists the first seven; "P0" falls through to
parseNextField, whose scanDigits reports stringIsAllNumeric, and the error is "P0: missing
designator at the end". Either the doc or the switch is wrong.
'''

[[bug]]
id = "period/2"
title = "Parse accepts the designators in any order: P1D1Y, PT1S1H, P1DT1S1M"
kind = "contract"
severity = "low"
test = "TestHegelPinDesignatorsMustBeOrdered"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse says it "parses strings that specify periods using ISO-8601 rules", and ISO 8601 fixes
the order Y M W D T H M S. The parser keeps an itemState per field (unready / armed / set) and
checks only that a field is not set twice and that date fields do not follow T, so "P1D1Y" is
1 year 1 day and "PT1S1H" is 1 hour 1 second. The Python isodate library rejects both. A
misordered string is more likely a typo (or a field written under the wrong designator) than an
intended period.
'''

[[bug]]
id = "period/3"
title = "Parse accepts a T with nothing after it: P1YT is one year"
kind = "contract"
severity = "low"
test = "TestHegelPinTrailingTRejected"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The loop in Period.Parse sets isHMS on 'T' and continues; when the string ends there, the
nComponents check passes on the date fields alone, so "P1YT", "P1DT" and "-P1WT" parse as if
the T were absent. "PT" alone is rejected (no components), so the check exists but not for a
trailing T after date fields. In ISO 8601 the T must introduce at least one time component.
'''

[[bug]]
id = "period/4"
title = "Parse accepts a decimal mark without digits on one side: P.5Y, P1.Y, PT,5S"
kind = "contract"
severity = "low"
test = "TestHegelPinBareDecimalMarkRejected"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
scanDigits accepts '.' or ',' anywhere in the run of digits (it even accepts several, leaving
decimal.Parse to reject "1.5.5"), and decimal.Parse accepts ".5" and "1.". So "P.5Y" is 0.5
years and "P1.Y" is 1 year. ISO 8601 writes a fraction as digits, the mark, digits.
'''

[[bug]]
id = "period/5"
title = "A fraction of zero digits is kept as a fraction: P1.0Y is not P1Y (AddTo approximates it), P1.0Y1D and P0.0Y1D are rejected"
kind = "correctness"
severity = "medium"
test = "TestHegelPinZeroFractionIsWhole"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse stores each number as decimal.Parse returns it, scale included, while NewDecimal trims
its arguments (Trim(0)). Consequences of a written fraction that is zero:

- "P1.0Y" has years with scale 1, so wholeCalendarValues is false and AddTo takes the
  approximate Duration path: 2024-01-31 + P1.0Y = 2025-01-30 05:49:12 (imprecise), whereas
  P1Y gives 2025-01-31 (precise). The two periods also compare unequal with ==, and
  "P1.50Y" prints as "P1.50Y".
- the parser marks haveFraction from Scale() > 0, so "P1.0Y1D", "P0.0Y1D" and "PT1.00H30M"
  are rejected with "only the last field can have a fraction", although nothing fractional
  is there; SetField and NewDecimal reject the same shapes (a zero field parsed from "0.0D"
  keeps scale 1 and makes SetField(-4, Hour) fail on "P2Y8M-9W").
- a zero field parsed with a scale ("P8M0.0W") makes the period differ from Parse("P8M")
  under == although both print "P8M".

Trimming the parsed number (as NewDecimal does) fixes all of these.
'''

[[bug]]
id = "period/6"
title = "NormaliseDaysToYears leaves the remainder as a fractional days field in front of time fields: P366DT1H becomes P1Y0.7575DT1H, which Parse rejects"
kind = "correctness"
severity = "medium"
test = "TestHegelPinNormaliseDaysToYearsStaysValid"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NormaliseDaysToYears divides the days (including weeks) by 365.2425 and puts the remainder,
which has up to four decimals, back into weeks and days. When hours, minutes or seconds are
non-zero the result has a fraction on a field that is not the least significant one, which the
type documentation forbids and Parse rejects: "P366DT1H" -> "P1Y0.7575DT1H", "P400DT30M" ->
"P1Y4W6.7575DT30M", "P60WT1S" -> "P1Y7W5.7575DT1S". The string of such a period cannot be read
back (UnmarshalText, Scan, flag), so it does not survive a round trip through text or JSON.
Either the fraction should be pushed into the time fields, or whole years only should be
moved when the time part is non-zero.
'''

[[bug]]
id = "period/7"
title = "Add and Mul produce periods with fractions in more than one field, which String renders and Parse then rejects"
kind = "contract"
severity = "low"
test = "TestHegelPinArithmeticKeepsOneFraction"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The type documentation says fractions are supported on the least significant non-zero field
only and NewDecimal / SetField enforce it, but Add and Mul do not: P1Y1M * 1.5 = "P1.5Y1.5M",
P1.5Y + P1M = "P1.5Y1M", PT10.5M + PT0.5M30S = "PT11.0M30S" (the zero fraction of bug 5). Each
prints without complaint and its string is rejected by Parse, so the result cannot be stored
as text or JSON and read back. Add, which normalises its result anyway, could carry the
fraction down (1.5 years = 1 year 6 months); Mul could report an error as it does for overflow.
'''

[[bug]]
id = "period/8"
title = "Duration wraps around on overflow and reports the result as precise: PT3000000H is -2124095h34m33s, true"
kind = "correctness"
severity = "medium"
test = "TestHegelPinDurationOverflowNotPrecise"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
fieldDuration multiplies the coefficient by the nanosecond factor in int64 without an overflow
check, and Duration adds the parts the same way. The godoc notes that time.Duration is limited
to about 292 years but says nothing about what happens beyond it: PT3000000H (342 years),
PT200000000M and PT10000000000S all come back as negative durations with the precise flag true
(the calendar part is zero, so nothing marks the result as approximate). AddTo of such a
period moves the time backwards. Saturating to the maximum with precise = false, as the flag
already signals imprecision for sub-nanosecond values, would be consistent.
'''

[[bug]]
id = "period/9"
title = "Format prints numbers in floating-point notation: P1000000Y is 1e+06 years, PT0.00001S is 1e-05 second, 19-digit values are rounded"
kind = "contract"
severity = "low"
test = "TestHegelPinFormatWritesPlainNumbers"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
formatField converts the decimal field to float64 and hands it to plural's "%v" formats, so
values of a million and more, and below 0.0001, come out in exponent notation
("1.234567895e+08 days", "1e-05 second") and values with more than 15-17 digits are rounded
("1.2345678901234568e+18 days" for P1234567890123456789D). Format is the human-readable form;
the decimal's own String ("1000000") would do.
'''

[[bug]]
id = "period/10"
title = "TotalDaysApprox and TotalMonthsApprox ignore whole days held in a fractional time field: PT48.5H gives 0 days"
kind = "correctness"
severity = "low"
test = "TestHegelPinTotalDaysCountsWholeDaysOfFractionalHours"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Both totals say "whole multiples of 24 hours are also included in the calculation" and get them
from Normalise(false), whose moveWholePartsLeft declines to move anything when the remainder is
a pure fraction (r.Prec() <= r.Scale(): the comment says "more complex so no change"). So
PT48H is 2 days but PT48.5H is 0 days, PT1440.5M and PT86400.5S are 0 days, and P1DT36.5H is
1 day. The rule is a reasonable choice for Normalise itself (it avoids "PT1M0.5S" for
"PT60.5S", though it also leaves "PT61M" for "PT61M" and "PT1H1.5M" for "PT61.5M"), but the
totals should divide the time part directly.
'''

[[bug]]
id = "period/11"
title = "Parse rounds a number with more than 19 significant digits instead of rejecting it: P0.00000000000000000001D is P0D"
kind = "correctness"
severity = "medium"
test = "TestHegelPinParseRejectsMoreThan19Digits"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
decimal.Parse rejects an integer part of more than 19 digits (Parse reports "number invalid or
out of range" for P12345678901234567890D) but silently rounds a fraction to fit 19 digits in
all: "P0.00000000000000000001D" parses as P0D, "P1234567890123456789.5D" as
P1234567890123456790D, "PT1.00000000000000000000S" keeps 18 zeros. A period read from text is
thus altered without any error, while the type documentation promises up to 19 digits per
field; the same "out of range" error as for the integer part would tell the caller.
'''

[[bug]]
id = "period/12"
title = "Add, Mul and Simplify round a result that needs more than 19 digits instead of reporting an error; Simplify replaces the exact fields by rounded ones"
kind = "correctness"
severity = "medium"
test = "TestHegelPinArithmeticDoesNotRound"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
govalues/decimal rounds the fraction of a sum or product to fit 19 digits and returns an error
only when the integer part overflows. Add says "arithmetic overflow will result in an error"
but PT1S + PT0.1234567890123456789S = PT1.123456789012345679S with a nil error, and Mul
likewise (P...593.6D * 1.1 loses its last digits). Simplify promises "if the calculations would
lead to arithmetic errors, the current values are kept unaltered", yet moveToRight accepts a
rounded product: PT7310469896202390.179H.Simplify(true) = PT438628193772143410.7M, 2.4 seconds
short of the input (the exact value is ...410.74 minutes), and Simplify(false) of a period with
14-digit days turns 0.2566 seconds into a whole number. Comparing the moved value against the
original before accepting it (or checking the precision needed) would keep the promise.
'''

[[bug]]
id = "period/13"
title = "SetInt and SetField on a negative period drop the sign of the other fields: -PT1329S.SetInt(274, Month) is P274MT1329S"
kind = "correctness"
severity = "high"
test = "TestHegelPinSetFieldKeepsTheSign"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A negative period stores its fields positive with neg = true (normaliseSign). SetField builds
the new period with NewDecimal(period.years, ..., value, ...) from those raw fields and forgets
neg, so every other field changes sign: -PT1329S.SetInt(274, Month) = P274MT1329S (the seconds
are now +1329), -P1Y2M.SetInt(3, Day) = P1Y2M3D (a year and two months in the future instead
of the past). Any use of SetInt/SetField on a negative period silently gives the wrong period.
The fix is to pass the signed fields (GetField, or applySign) to NewDecimal.
'''

[[bug]]
id = "period/14"
title = "The whole-number getters round instead of truncating: PT7.6H.Hours() is 8, PT7753.87S.Seconds() is 7754, PT-0.533S.Seconds() is -1"
kind = "contract"
severity = "medium"
test = "TestHegelPinGettersTruncate"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Years, Months, Weeks, Days, DaysIncWeeks, Hours, Minutes, Seconds and GetInt are documented as
"the whole number of ... in the period" and are implemented with decimal.Int64(0), which
rounds half to even. So 7.6 hours report 8 whole hours and 7753.8732 seconds report 7754, and
a period of PT-0.533S reports -1 second; P2.5Y reports 2 years but P3.5Y reports 4. The whole
number of hours in 7.6 hours is 7 (the count a caller would use to split the period into
whole units, as the old fixed-point version did); truncation toward zero is what the doc says.
'''

[[bug]]
id = "period/15"
title = "Normalise and Simplify can leave the most significant field negative with the period sign positive: PT7H-5358M7484S.Normalise(true) is PT-80H-14M44S with Sign() +1"
kind = "correctness"
severity = "medium"
test = "TestHegelPinNormaliseKeepsTheSignConvention"
found = { commit = "0b049b527d6b683c174c57c7d22621025e3e63a9", version = "v1.1.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The type documentation makes the first non-zero field carry the sign convention (later fields
"can be independently positive or negative"), and Parse, New, NewDecimal, Add and Mul end with
normaliseSign to keep it. Normalise, NormaliseDaysToYears and Simplify do not: when carrying
whole parts left turns the leading field negative, the result has neg = false, so Sign() is 1,
IsNegative() is false and IsPositive() is true for a period that is 80 hours in the past, its
String is "PT-80H-14M44S" (a form the package never writes otherwise) and Parse of that string
gives -PT80H14M-44S, a different struct. Simplify(false) of the same period gives "PT-288796S",
Normalise(false) of P8WT7400H-335384068M gives "P-33220W-1DT-6H-28M". A normaliseSign() at the
end of these methods restores the convention.
'''
