# Bugs found in starlark-go by the zoo's Hegel tests (hegel/ in the patch). Each pin
# (test) fails while the bug is open.

[[bug]]
id = "starlark-go/1"
title = "Sequence repetition by a negative count below -2**31 fails with repeat count too large instead of yielding an empty sequence, which the spec requires (negative values of n behave like zero)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNegativeRepeatIsEmpty"
found = { commit = "89a6a09411d5c7a33409dc050c2fecdf8f4eca8f", version = "untagged (2026-09-08)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`"ab" * (-3000000000)`, `[1] * (-1 << 40)`, `(1,) * (-3000000000)` and `range(3) * (-1 << 40)` all fail with
"repeat count -3000000000 too large"; `"ab" * -1` is "" as specified. doc/spec.md, "Binary operators":
"Negative values of n behave like zero." Python returns the empty sequence for any negative count.

Cause: `stringRepeat`, `tupleRepeat` (starlark/eval.go) and the range repeat convert the count with
`AsInt32` before testing `i < 1`, so a count that does not fit in 32 bits is rejected whatever its sign.
Found by the Python-differential property (a random 64-bit multiplier).
'''

[[bug]]
id = "starlark-go/2"
title = "str.strip, lstrip and rstrip with an empty cutset strip whitespace instead of nothing: an empty cutset is treated as no argument, while the spec says the cutset names the code points removed"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyCutsetStripsNothing"
found = { commit = "89a6a09411d5c7a33409dc050c2fecdf8f4eca8f", version = "untagged (2026-09-08)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`" a ".strip("")` is "a", `"\ta".lstrip("")` is "a", `"a\n".rstrip("")` is "a"; Python (and the spec's
reading, "removes all leading and trailing Unicode code points contained in cutset") keep the string
unchanged. `string_strip` (starlark/library.go) tests `chars != ""` to tell the one-argument form from
the no-argument form, so an empty cutset computed at run time (`s.strip(t)` with `t == ""`) strips
whitespace. Found by the Python-differential property (`r"\t\tb".strip(v2)` with `v2 = ""`).
'''
