[run]
# The tests live in hegel/ and run generated programs in the subset of Starlark that is also
# Python, in starlark-go and in python3 (a child process, hegel/oracle.py; Python 3.11+).
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinNegativeRepeatIsEmpty = "starlark-go/1"
TestHegelPinEmptyCutsetStripsNothing = "starlark-go/2"
