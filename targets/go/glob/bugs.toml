# Bugs found in gobwas/glob by the Hegel properties. Each is pinned by the
# test named in `test`, listed as an expected failure in target.toml.

[[bug]]
id = "glob/1"
title = "An invalid separator rune stops `*` at U+FFFD and invalid bytes but not `?`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInvalidSeparatorRuneOnlyStopsStar"
found = { commit = "7112f00494625902fcdb8fcdcd6638e0584a3acc", version = "v1.0.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Compile("*", -1).Match("�")` is false while `Compile("?", -1).Match("�")` is true;
the same for a surrogate (0xD800) or 0x110000 as the separator, and for an invalid byte in
the string. The star's reach is computed with `strings.IndexAny(s, SepStr)`, and
`string([]rune{-1})` is "�", so the star treats U+FFFD (and, through IndexAny's
RuneError rule, every invalid byte) as a separator; `?` compares decoded runes with
`slices.Contains(Sep, r)`, which never sees -1. A garbage separator, but the two wildcards
should agree; either refuse invalid runes in Compile or drop them from SepStr.
'''

[[bug]]
id = "glob/2"
title = "QuoteMeta leaves `,` unescaped, so a quoted string inside `{…}` splits into alternatives"
kind = "contract"
severity = "low"
test = "TestHegelPinQuoteMetaCommaInsideGroup"
found = { commit = "7112f00494625902fcdb8fcdcd6638e0584a3acc", version = "v1.0.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`"{" + QuoteMeta("a,b") + ",zz}"` compiles as `{a,b,zz}`: it does not match "a,b" and matches
"a" and "b". QuoteMeta exists to embed a string literally, and a group of quoted strings is
the natural use; `\,` is accepted by the lexer everywhere (also outside groups), so escaping
the comma costs nothing. The comment on syntax.IsSpecial argues that `,`, `!` and `-` "are
special only inside {...} and [...] respectively, which are [escaped]" — but the braces
around the quoted text are the caller's, not part of it. The class case is the same in kind:
`"[" + QuoteMeta("!a") + "]"` is a negated class and `"[" + QuoteMeta("a-c") + "]"` a range.
'''

[[bug]]
id = "glob/3"
title = "Invalid UTF-8 inside a class is reported as \"unexpected end of input\""
kind = "contract"
severity = "low"
test = "TestHegelPinInvalidUTF8ReasonInsideClass"
found = { commit = "7112f00494625902fcdb8fcdcd6638e0584a3acc", version = "v1.0.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Compile("a\xffb")` says "invalid UTF-8 sequence" at 1, but `Compile("[\xff]")`,
`Compile("[a\xff]")` and `Compile("[a-\xff]")` say "unexpected end of input", and
`Compile("\\\xff")` says "trailing backslash": the lexer's peek records the UTF-8 error and
returns its eof sentinel, and fetchRange/fetchText then overwrite the error with the one for
a real end of input. The offsets point at the bad byte, only the Reason is wrong.
'''
