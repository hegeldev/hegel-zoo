[[bug]]
id = "jsonschema/7"
title = "a propertyNames failure's instanceLocation is overwritten by later validation (points at a sibling)"
kind = "correctness"
severity = "medium"
test = "TestHegelPinPropertyNamesInstanceLocation"
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
validator.go's objValidate assigns `verr.InstanceLocation = vd.vloc` without
cloning (every other error uses instanceLocation(), a clone). vloc is the
validator's path buffer, which validateVal extends with append into the same
backing array, so the next sibling or array element overwrites the recorded
location. `{"properties": {"a": {"propertyNames": {"maxLength": 1}}, "b":
{"type": "string"}}}` on {"a": {"xx": 1}, "b": "ok"} reports "at '/b':
invalid propertyName 'xx'"; `{"items": {"propertyNames": {"maxLength": 1}}}`
on [{"xx": 1}, {}] reports it at '/1'. The same assignment exists for
contentSchema.
"""

