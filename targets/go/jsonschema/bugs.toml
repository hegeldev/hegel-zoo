[[bug]]
id = "jsonschema/1"
title = "drafts 6 and 7: const beside $ref is enforced although every sibling of $ref must be ignored"
kind = "correctness"
severity = "medium"
test = "TestHegelPinRefSiblingConstIsIgnored"
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Draft-06 and draft-07 say that all other properties in a "$ref" object MUST
be ignored. objcompiler.go's compileDraft4 returns early when $ref is
present (so type, enum, format, the numeric and string keywords are
ignored), but compileDraft6 still sets Const, and the validator checks
const before it follows $ref. `{"$schema": ".../draft-07/schema#", "$ref":
"#/definitions/a", "const": 5, "definitions": {"a": true}}` rejects 6
("value must be 5"); Python's jsonschema accepts it, and the same schema
with "enum": [5] or "type": "string" instead of const is (correctly)
accepted. propertyNames, contains and if/then/else are also compiled beside
$ref but the validator returns after $ref for drafts < 2019 so they are not
reached.
"""

[bug.found]
commit = "ec6106e5f0a342f025769a4da8e2d56c2dc10321"
version = "v6.0.3"
hegel = "v0.6.33"
date = "2026-09-17"

[[bug]]
id = "jsonschema/2"
title = "minLength/maxLength/minItems/maxItems/minProperties/maxProperties beyond int64 wrap around"
kind = "correctness"
severity = "low"
test = "TestHegelPinIntegerKeywordsBeyondInt64"
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
objcompiler.go's intVal does `int(n.Num().Int64())` on the big.Rat of the
keyword's value; above MaxInt64 the result is garbage. `{"maxLength": 1e19}`
rejects "a" with "maxLength: got 1, want -8,446,744,073,709,551,616";
`{"maxLength": 18446744073709551616}` reports "want 0"; `{"maxItems":
9223372036854775808}` and `{"maxProperties": 9223372036854775808}` reject
every array/object; `{"minItems": 9223372036854775808}` accepts [1]. The
metaschemas accept these values (nonNegativeInteger), and Python's
jsonschema compares them as numbers.
"""

