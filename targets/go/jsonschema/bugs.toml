date = "2026-09-17"

[[bug]]
id = "jsonschema/4"
title = "output keywordLocation is percent-encoded (\"/properties/a%20b/type\")"
kind = "correctness"
severity = "low"
test = "TestHegelPinKeywordLocationIsAJSONPointer"
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The output format's keywordLocation MUST be a JSON pointer;
absoluteKeywordLocation is the URI. output.go builds keywordLocation from
the schema's Location (a URL with a percent-encoded fragment), so a property
named "a b" yields keywordLocation "/properties/a%20b/type" and "c%d" yields
"/properties/c%25d/type", while the same unit's instanceLocation is
"/a b" (correct). A consumer resolving keywordLocation in the schema finds
no member "a%20b".
"""

