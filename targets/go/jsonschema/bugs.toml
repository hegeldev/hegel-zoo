notes = """
validator.go's objValidate sets the propertyNames error's SchemaURL to the
propertyNames subschema's location and its ErrorKind to kind.PropertyNames,
whose KeywordPath is ["propertyNames"] again, so output.go emits
"/propertyNames/propertyNames" (and an absoluteKeywordLocation ending the
same way). `{"propertyNames": {"maxLength": 1}}` on {"ab": 1} gives units at
"/propertyNames/propertyNames" and "/propertyNames/maxLength".
