version = "v6.0.3"
hegel = "v0.6.33"
date = "2026-09-17"

[[bug]]
id = "jsonschema/3"
title = "time, date-time and ipv4 formats accept signed fields (\"+1:00:00Z\", \"1.2.3.-0\")"
kind = "correctness"
severity = "low"
test = "TestHegelPinFormatFieldsRejectSigns"
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
format.go parses the hour/minute/second, offset and dotted-quad fields with
strconv.Atoi, which accepts a leading sign, and only checks `i < 0`. With
AssertFormat, "+1:00:00Z", "12:00:00-+1:30" (time), "2020-01-01T+1:00:00Z"
(date-time), "1.2.3.-0", "1.2.3.+4" and "+1.2.3.4" (ipv4) are all valid.
RFC 3339 requires 2DIGIT fields and the dotted quad is dec-octets.
"""

