# Bugs found in github.com/ugorji/go/codec by the Hegel properties.
# Each has a deterministic pin test in hegel_pins_test.go (listed under
# [expected_failures] in target.toml) that fails while the bug exists.

[[bug]]
id = "ugorji-codec/1"
title = "omitempty compares memory: a zero-length string with a non-nil data pointer is emitted"
kind = "correctness"
severity = "medium"
test = "TestHegelPinOmitEmptyStringWithDataPointer"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
helper.go documents omitempty as "the value will be omitted if the zero value". In the default
(unsafe) build, `isEmptyValue` without RecursiveEmptyCheck is `unsafeCmpZero(ptr, size)`: a memcmp of
the field's bytes against zero. A string is a (pointer, length) header, so a zero-length string whose
data pointer is not nil - `strings.Repeat("x", 3)[:0]`, `s[:0]`, `strings.TrimSpace(" ")`, and in
practice most empty strings produced at run time - is not "empty":

    type S struct { A string `codec:"a,omitempty"`; B int `codec:"b,omitempty"` }
    empty := strings.Repeat("x", 3)[:0]                  // == ""
    NewEncoderBytes(&b, &JsonHandle{}).Encode(S{A: empty}) // {"a":""}   (want {})
    NewEncoderBytes(&b, &JsonHandle{}).Encode(&S{A: empty})// {"a":""}

The safe build (`-tags codec.safe`, helper_notunsafe.go) uses `v.Len() == 0` and omits the field, so
the two builds disagree. RecursiveEmptyCheck=true switches plain strings to a length check, but a
struct field holding such a string is still compared as memory (`isEmptyValueFallbackRecur`,
reflect.Struct case): `W{In: S{A: empty}}` with `in,omitempty` encodes as {"in":{"a":""}}.
The same memcmp makes -0.0 non-empty (reflect.Value.IsZero agrees, so that is not counted here).
Found by TestHegelStructTagsMatchEncodingJson (the generator now never produces a run-time empty
string for an omitempty field while the bug is open).
"""

[[bug]]
id = "ugorji-codec/2"
title = "CBOR negative integers below int64 wrap silently instead of erroring"
kind = "correctness"
severity = "medium"
test = "TestHegelPinCborNegativeBelowInt64IsAnError"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CBOR major type 1 encodes -1-n for a uint64 n; for n >= 2^63 the value does not fit int64. The
decoder computes -1-int64(n) with wraparound and returns it as a valid int64:

    3b 80 00 00 00 00 00 00 00   (-9223372036854775809)  -> int64 9223372036854775807, no error
    3b ff ff ff ff ff ff ff ff   (-18446744073709551616) -> int64 0, no error

both into interface{} and into an int64. The positive side is handled (tag 1 with 1b ff.. reports
"uint64 to int64 overflow"), and a bignum (tag 3) becomes a float64. Found while feeding the model
encoder's spec forms to the decoder in TestHegelCborWireMatchesModel; the model's own decoder
rejects these.
"""

[[bug]]
id = "ugorji-codec/3"
title = "JSON integers beyond int64 fail to decode into interface{} while those beyond uint64 become float64"
kind = "correctness"
severity = "low"
test = "TestHegelPinJsonIntegerBeyondInt64DecodesIntoInterface"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Schema-less decoding of a JSON number without [.eE] tries the integer parsers and falls back to
float64 only on the positive side:

    "18446744073709551616" -> float64 1.8446744073709552e+19
    "-9223372036854775809" -> error: decode number from -9223372036854775809: strconv.ParseInt: invalid syntax

With DecodeOptions.SignedInteger the same happens above int64: "9223372036854775808" and
"18446744073709551615" fail (ParseInt) although they are valid JSON numbers the handle itself writes.
The library's own output is affected: an integral float64 below -2^63 (magnitude under 1e21) is
written as an integer literal, e.g. -1.1000000000000002e+19 -> -11000000000000002000, which the
handle then cannot read back into interface{} (TestHegelUntypedRoundTrip). Found by
TestHegelJsonMatchesEncodingJson; encoding/json decodes all of these as float64.
"""

[[bug]]
id = "ugorji-codec/4"
title = "NilCollectionToZeroLength writes a nil []byte as an empty array or string, not as empty bytes"
kind = "contract"
severity = "low"
test = "TestHegelPinNilBytesAsZeroLengthBytes"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The option documents nil collections encoded "in their natural zero-length formats". A []byte's
natural format is bytes (base64 string in JSON, bin in msgpack with WriteExt, byte string in binc),
and that is what an empty non-nil []byte gets; a nil []byte gets the generic empty-slice form:

    type C struct { B []byte `codec:"b"` }
    JSON:    C{} -> {"b":[]}      C{B: []byte{}} -> {"b":""}
    msgpack: C{} -> 81 a1 62 a0   C{B: []byte{}} -> 81 a1 62 c4 00   (fixstr 0 vs bin8 0)
    binc:    C{} -> 75 45 62 64   C{B: []byte{}} -> 75 45 62 54

CBOR and simple are consistent. The library decodes both forms back into a []byte; other consumers
of the stream see an array (or a UTF-8 string in msgpack) where the schema says bytes. Found by
TestHegelOptionsMeanWhatTheySay.
"""

[[bug]]
id = "ugorji-codec/5"
title = "CBOR decoder rounds times to the microsecond, though TimeRFC3339 writes nanoseconds"
kind = "correctness"
severity = "low"
test = "TestHegelPinCborRFC3339TimeKeepsNanoseconds"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
cbor.go decodeTime ends with `t = t.UTC().Round(time.Microsecond)` for both tag 0 (RFC 3339 text)
and tag 1 (epoch). With CborHandle.TimeRFC3339 the encoder writes time.RFC3339Nano, so the
nanoseconds are on the wire and thrown away on the way back:

    time.Unix(1700000000, 123456789) -> c0 "2023-11-14T22:13:20.123456789Z" -> 2023-11-14 22:13:20.123457

Every other handle round-trips this time exactly (msgpack ext -1, JSON RFC3339Nano, binc, simple).
For tag 1 the float64 epoch limits precision anyway; the rounding is only visible for tag 0.
Found by TestHegelTypedRoundTrip.
"""

[[bug]]
id = "ugorji-codec/6"
title = "binc writes -0.0 as +0.0"
kind = "correctness"
severity = "low"
test = "TestHegelPinBincNegativeZeroKeepsItsSign"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
binc.go encSpFloat tests `f == 0` and writes the one-byte "zero float" special, which decodes as
+0.0; the sign of a negative zero is lost for float64 and float32. msgpack, CBOR, simple (and JSON,
which writes -0.0) all preserve it. Found by TestHegelUntypedRoundTrip and TestHegelTypedRoundTrip.
"""

[[bug]]
id = "ugorji-codec/7"
title = "SignedInteger turns unsigned values in [2^63, 2^64) into negative int64"
kind = "correctness"
severity = "medium"
test = "TestHegelPinSignedIntegerDoesNotWrap"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
DecodeOptions.SignedInteger: "use the int64 during schema-less decoding of unsigned values". For a
value that does not fit int64 the decoder converts with wraparound:

    msgpack cf 80 00 00 00 00 00 00 00 (2^63)   -> int64 -9223372036854775808
    msgpack cf ff ff ff ff ff ff ff ff (2^64-1) -> int64 -1
    binc    17 80 .. / 17 ff ..                  -> the same
    CBOR    1b 80 00 00 00 00 00 00 00           -> int64 -9223372036854775808
    CBOR    1b ff ff ff ff ff ff ff ff           -> error "uint64 to int64 overflow"  (inconsistent)
    simple                                       -> as CBOR
    JSON    "9223372036854775808"                -> error (ugorji-codec/3)

Keeping the uint64 or returning the overflow error are both acceptable; a silent sign flip is not.
Found by TestHegelUntypedRoundTrip.
"""

[[bug]]
id = "ugorji-codec/8"
title = "A non-string map key decoded into a string-keyed map is read as a string header (CBOR, simple)"
kind = "correctness"
severity = "high"
test = "TestHegelPinNonStringMapKeyIntoStringMap"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Decoding a map whose stream keys are integers (or bools, floats, arrays) into map[string]T, or into
interface{} with DecodeOptions.MapType = map[string]interface{}, does not convert or reject the key:
the key's first byte is consumed as a text-string header and the stream is misaligned.

    CBOR   a2 20 61 78 05 61 79   {-1:"x", 5:"y"} -> map[string]any{"": "x"}, no error
           (0x20 = -1 read as a zero-length string; "x" becomes the value; the rest is skipped)
    CBOR   a1 01 61 78            {1:"x"}          -> "unexpected EOF"
    simple f1 01 08 01 d9 01 78   {1:"x"}          -> map[string]any{"": nil}, no error
    CBOR   a1 81 01 61 78         {[1]:"x"}        -> map[string]any{"\\x01": "x"}

msgpack and binc return an error ("invalid byte descriptor for decoding bytes"); the JSON handle
converts ({1:"x"} -> {"1":"x"}); with the default MapType (map[interface{}]interface{}) all handles
decode correctly. Found by TestHegelMalformedInputIsAnError: a truncated CBOR encoding of a struct
holding a map[int64]string "decoded" into interface{} without error because the misaligned key read
swallowed the missing tail.
"""

[[bug]]
id = "ugorji-codec/9"
title = "binc changes negative integers whose 4-byte magnitude starts with 0xFF (-4294967295..-4286578688)"
kind = "correctness"
severity = "high"
test = "TestHegelPinBincNegativeInt32RangeRoundTrips"
found = { commit = "181add7c626e40eaab6511ec19058a9cb34d81e6", version = "v1.2.14+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
binc encodes a negative integer as its magnitude with a "negative int" descriptor. For magnitudes
that need 4 bytes, encIntegerPrune32 calls pruneSignExt(b, pos=false), which strips leading 0xFF
bytes as if the bytes were a two's-complement number, whenever the next byte has its high bit set.
The magnitude 0xFFFFFFFF is thus written as the single byte 0xFF:

    int64(-4294967295) -> 20 ff       -> -255
    int64(-4294837203) -> 22 fe 03 d3 -> -16647123
    int64(-4286578688) -> 22 80 00 00 -> -8388608

Every value in [-4294967295, -4286578688] (magnitude 0xFF800000..0xFFFFFFFF) changes silently; the
decoder is right to zero-extend. The 2-byte path does not prune, and for the 8-byte path an int64's
magnitude never starts with 0xFF, so only this range is affected. Positive integers are fine (0x00
prefixes are pruned and zero-extension is what the decoder does). Found by TestHegelUntypedRoundTrip.
"""
