# Bugs found in github.com/alecthomas/kong by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure in
# target.toml.

[[bug]]
id = "kong/1"
title = "A short flag declared as a non-ASCII rune can never be given on the command line"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNonASCIIShortFlag"
found = { commit = "a60008c6dae2b98a1fbec12d1aebd43ac5ab76e0", version = "v1.16.1-9-ga60008c", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
E bool `short:"é"`, then `app -é`: "unknown flag -\\xc3, did you mean one of "--e", "-é"?". The
short tag accepts any single rune (Tag.GetRune) and the flag matcher compares against
"-" + string(flag.Short), but Context.trace (context.go) splits a short-flag token by bytes:
v[1:2] is the flag and v[2:] the tail, so a multi-byte rune is cut in two and matches nothing;
the error even suggests the very spelling that was typed. Found by hand while reading the
scanner; the generated grammars use ASCII shorts.
"""

[[bug]]
id = "kong/2"
title = "A flag with a default counts as used in its xor group, so giving the other member is an error"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinXorDefaultNotUsed"
found = { commit = "a60008c6dae2b98a1fbec12d1aebd43ac5ab76e0", version = "v1.16.1-9-ga60008c", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A string `xor:"g" default:"1"`; B string `xor:"g"`, then `app --b 2`: "--a and --b can't be used
together" although --a was not given. Context.Reset applies defaults through Value.Parse, which
sets Value.Set = true, and checkXorDuplicates (context.go) counts every Set member of the group.
With two members holding defaults every command line fails, with one, the other member can
never be used. The xor tag is documented as "Only one flag in the group can be used"; a default
is not a use. Found by TestHegelRun (switch defaultsCountInGroups).
"""

[[bug]]
id = "kong/3"
title = "A flag with a default counts as used in its and group, so an empty command line is an error"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAndDefaultNotUsed"
found = { commit = "a60008c6dae2b98a1fbec12d1aebd43ac5ab76e0", version = "v1.16.1-9-ga60008c", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A string `and:"g" default:"1"`; B string `and:"g"`, then `app` with no arguments: "--a and --b
must be used together". Same cause as kong/2 (Reset marks a defaulted value Set); checkAndMissing
sees one member set and one not. A grammar with a defaulted and-group member cannot be run
without the whole group. Found by TestHegelRun (switch defaultsCountInGroups).
"""

[[bug]]
id = "kong/4"
title = "A -- after the first value of a cumulative positional ends it and the rest is unexpected"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDashDashAfterCumulative"
found = { commit = "a60008c6dae2b98a1fbec12d1aebd43ac5ab76e0", version = "v1.16.1-9-ga60008c", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A string `arg:""`; C []string `arg:"" optional:""`, then `app a x -- -y`: "unexpected argument
-y" (while `app a -- x -y` gives C = [x -y]). The slice decoder of a positional pops values while
Token.IsValue() holds (mapper.go), which stops at the untyped "--"; the positional is then done,
the trace handles "--" by ending the parsing and retyping "-y" as positional, and with no
positional left and no subcommands it is rejected. The README says a slice positional takes
"all remaining arguments" and "--" makes everything after it positional. Found by TestHegelRun
(switch dashDashStopsCumulative).
"""

[[bug]]
id = "kong/5"
title = "A required flag alone in its xor or lastwins group is not required at all"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRequiredXorMember"
found = { commit = "a60008c6dae2b98a1fbec12d1aebd43ac5ab76e0", version = "v1.16.1-9-ga60008c", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A string `xor:"g" required:""`; B string `xor:"g"`, then `app` with no arguments: no error, A and
B empty. checkMissingFlags (context.go) collects the missing required members of a choice group
and reports them only when there are at least two ("len(flags) > 1"): a group whose only required
member is missing is silently accepted, and so is the same with lastwins. The README: "When
combined with required, at least one of the xor group will be required." Found by TestHegelRun
(switch requiredChoiceMemberOptional).
"""

[[bug]]
id = "kong/6"
title = "A counter flag with a default increments from zero, not from the default"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCounterDefaultIncrement"
found = { commit = "a60008c6dae2b98a1fbec12d1aebd43ac5ab76e0", version = "v1.16.1-9-ga60008c", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
V int `type:"counter" short:"v" default:"5"`, then `app -v`: V = 1 (`app` alone gives 5, `-vv`
gives 2). The counter mapper increments the value it is handed (mapper.go), and during the trace
that is a fresh zero created by Context.getValue, not the field with its default; Apply then
overwrites the default with the count. Documented as "Increment a numeric field", which from a
default of 5 should give 6. Found by TestHegelRun (switch counterIgnoresDefault).
"""
