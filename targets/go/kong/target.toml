name = "kong"
language = "go"
upstream = "https://github.com/alecthomas/kong"
subdir = ""
license = "MIT"  # COPYING; no CONTRIBUTING file, README says nothing about AI-written code or tests (commit a60008c, checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "a60008c6dae2b98a1fbec12d1aebd43ac5ab76e0"
date = "2026-08-28"
version = "v1.16.1-9-ga60008c"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
# The wide property fails by the shape it draws most often over forty rounds at a hundred
# cases: kong/5 intermittent (34 of 40 rounds failed: 24 by kong/5, 5 by kong/1, 3 by kong/6,
# 2 by kong/4). The six narrow properties fail every run; under HEGEL_NO_KNOWN=1 the pins
# only (6).
TestHegelRun = { bug = "kong/5", intermittent = true }
TestHegelNonASCIIShortFlagsAreGiven = "kong/1"
TestHegelDefaultsDoNotCountInXorGroups = "kong/2"
TestHegelDefaultsDoNotCountInAndGroups = "kong/3"
TestHegelDashDashInsideCumulativePositionals = "kong/4"
TestHegelLoneRequiredChoiceMembersAreRequired = "kong/5"
TestHegelCountersIncrementFromTheirDefault = "kong/6"
TestHegelPinNonASCIIShortFlag = "kong/1"
TestHegelPinXorDefaultNotUsed = "kong/2"
TestHegelPinAndDefaultNotUsed = "kong/3"
TestHegelPinDashDashAfterCumulative = "kong/4"
TestHegelPinRequiredXorMember = "kong/5"
TestHegelPinCounterDefaultIncrement = "kong/6"
