name = "go-debian"
language = "go"
upstream = "https://github.com/paultag/go-debian"
subdir = ""
license = "MIT"  # LICENSE; no CONTRIBUTING, README (8 lines) says nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77"
date = "2026-06-16"
version = "v0.21.0"

[hegel]
version = "v0.9.6"

[run]
# the oracles: dpkg itself (--validate-version, --compare-versions), dpkg-parsechangelog and dpkg's
# Perl library (Dpkg::Deps, Dpkg::Arch, Dpkg::Version, Dpkg::Control::HashCore), all from dpkg / dpkg-dev
setup = ["dpkg --version >/dev/null", "dpkg-parsechangelog --version >/dev/null", "perl -MDpkg::Deps -MDpkg::Arch -MDpkg::Version -MDpkg::Control::HashCore -MJSON::PP -e 1"]
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinEmptyRevisionAccepted = "go-debian/1"
TestHegelPinEpochTooBig = "go-debian/2"
TestHegelPinArchWildcards = "go-debian/3"
TestHegelPinDeprecatedRelations = "go-debian/4"
TestHegelPinEqualsPrefixedRelation = "go-debian/5"
TestHegelPinVersionNumberTrailingSpace = "go-debian/6"
TestHegelPinListWhitespace = "go-debian/7"
TestHegelPinZeroEpochWithColon = "go-debian/8"
TestHegelPinGluedList = "go-debian/9"
TestHegelPinSubstvarString = "go-debian/10"
TestHegelPinContinuationTrailingNewline = "go-debian/11"
TestHegelPinDotLines = "go-debian/12"
TestHegelPinTabIndentedChanges = "go-debian/13"
TestHegelPinDateWithoutWeekday = "go-debian/14"
TestHegelPinDoubleSpaceInMaintainer = "go-debian/15"
TestHegelPinBlankValueLines = "go-debian/16"
TestHegelPinChangelogComment = "go-debian/17"
TestHegelPinWhitespaceLineBetweenEntries = "go-debian/18"
