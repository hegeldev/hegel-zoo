name = "go-debian"
language = "go"
upstream = "https://github.com/paultag/go-debian"
subdir = ""
license = "MIT"  # LICENSE; no CONTRIBUTING, README (8 lines) says nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77"
date = "2026-06-16"
version = "v0.21.0"

[hegel]
version = "v0.6.33"

[run]
# the oracles: dpkg itself (--validate-version, --compare-versions), dpkg-parsechangelog and dpkg's
# Perl library (Dpkg::Deps, Dpkg::Arch, Dpkg::Version, Dpkg::Control::HashCore), all from dpkg / dpkg-dev
setup = ["dpkg --version >/dev/null", "dpkg-parsechangelog --version >/dev/null", "perl -MDpkg::Deps -MDpkg::Arch -MDpkg::Version -MDpkg::Control::HashCore -MJSON::PP -e 1"]
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinEmptyRevisionAccepted = "go-debian/1"
TestHegelPinEpochTooBig = "go-debian/2"
TestHegelPinArchWildcards = "go-debian/3"
TestHegelPinDeprecatedRelations = "go-debian/4"
TestHegelPinEqualsPrefixedRelation = "go-debian/5"
TestHegelPinVersionNumberTrailingSpace = "go-debian/6"
TestHegelPinListWhitespace = "go-debian/7"
TestHegelPinZeroEpochWithColon = "go-debian/8"
TestHegelPinGluedList = "go-debian/9"
TestHegelPinSubstvarString = "go-debian/10"
TestHegelPinContinuationTrailingNewline = "go-debian/11"
TestHegelPinDotLines = "go-debian/12"
TestHegelPinTabIndentedChanges = "go-debian/13"
TestHegelPinDateWithoutWeekday = "go-debian/14"
TestHegelPinDoubleSpaceInMaintainer = "go-debian/15"
TestHegelPinBlankValueLines = "go-debian/16"
TestHegelPinChangelogComment = "go-debian/17"
TestHegelPinWhitespaceLineBetweenEntries = "go-debian/18"
TestHegelPinListWrittenBeforeVersion = "go-debian/19"
# Part 1 of the rewrite (2026-10-11): the version and dependency properties draw the shapes of
# go-debian/1 to 10 and 19 and fail by default naming them; the mapping is the plurality basin
# over forty rounds at a hundred cases, every one failing every round: VersionParse go-debian/1
# 40; DependencyParse go-debian/9 20 and go-debian/7 20 (the tie broken by the thirty rounds at
# twenty cases, 19 to 11); RoundTrip go-debian/10 21, 7 14, 3 5; Arch go-debian/3 40.
# TestHegelCompareMatchesDpkg reaches no recorded bug and passes.
TestHegelVersionParseMatchesDpkg = "go-debian/1"
TestHegelDependencyParseMatchesDpkg = "go-debian/9"
TestHegelDependencyStringRoundTrips = "go-debian/10"
TestHegelArchMatchesDpkg = "go-debian/3"
# One narrow property per bug: every case is the shape, the failure deterministic.
TestHegelEmptyRevisionsAreRefused = "go-debian/1"
TestHegelEpochsStopAtIntMax = "go-debian/2"
TestHegelWildcardsPadWithAny = "go-debian/3"
TestHegelDeprecatedRelationsAreRead = "go-debian/4"
TestHegelUnknownRelationsAreRefused = "go-debian/5"
TestHegelVersionPaddingIsTrimmed = "go-debian/6"
TestHegelListWhitespaceIsAnySpace = "go-debian/7"
TestHegelZeroEpochsKeepTheirColon = "go-debian/8"
TestHegelGluedListsAreLists = "go-debian/9"
TestHegelSubstvarsKeepTheirBraces = "go-debian/10"
TestHegelVersionsAreWrittenBeforeLists = "go-debian/19"
