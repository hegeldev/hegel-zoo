# Bugs found in paultag/go-debian by the zoo's Hegel tests (hegel/ in the patch). Each pin (test)
# fails while the bug is open. The reference is dpkg itself: dpkg --validate-version and
# --compare-versions, dpkg-parsechangelog, and dpkg's Perl library (Dpkg::Deps, Dpkg::Arch,
# Dpkg::Control::HashCore), with Debian Policy 5 (control files) and 7 (relationships).

[[bug]]
id = "go-debian/1"
title = "version.Parse accepts a version with an empty revision (1.0-) or an empty upstream part (1:-1), which dpkg refuses; the hyphen is then silently dropped by String()"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmptyRevisionAccepted"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`dpkg --validate-version 1.0-` says "revision number is empty" and `1:-1` "version number is
empty" (both errors, exit 2); Parse returns {Epoch 0, Version "1.0", Revision ""} and {1, "",
"1"} with no error, so `1.0-` prints back as `1.0`, a different text. parseInto splits at the
last hyphen and checks only the characters of each part, not that they are non-empty (the
"nothing after colon" check runs before the split). The package documents Parse as verifying
"the version string as a whole, just like dpkg(1)". Found by the version differential against
dpkg --validate-version; the property gates the shape.
'''

[[bug]]
id = "go-debian/2"
title = "version.Parse accepts an epoch above INT_MAX (2147483648:1.0), which dpkg refuses as too big"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEpochTooBig"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dpkg's parseversion rejects an epoch larger than INT_MAX ("epoch in version is too big", since
dpkg 1.17); parseInto uses strconv.ParseInt(.., 64) and stores the value in a uint, so
`2147483648:1.0` and `9223372036854775807:1` are accepted and would be written into a control
file dpkg cannot read. Found by the version differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/3"
title = "ParseArch fills the missing parts of an architecture wildcard with base/gnu instead of any: linux-any becomes base-gnu-linux-any, so Is() misses musl and eabi architectures and String() writes it as any"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinArchWildcards"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dpkg's debwildcard_to_debtuple pads a wildcard with `any` on the left: `linux-any` is
(any, any, linux, any) and `gnu-linux-any` is (any, gnu, linux, any). parseArchInto pads with
the defaults of a concrete architecture (ABI base, libc gnu), so `linux-any` becomes
base-gnu-linux-any: `musl-linux-armhf`.Is(`linux-any`) and `armhf`.Is(`gnu-linux-any`) (armhf
is eabihf-gnu-linux-arm) are false where debarch_is says true, so an architecture restriction
list `[linux-any]` excludes those architectures. archToStringWithTupletable then finds
base-gnu-linux-<cpu> in the tuple table and writes `linux-any` as `any`, and a four-part
wildcard such as `any-amd64` (any-any-any-amd64) is written out in full as `any-any-any-amd64`.
Found by the architecture and dependency differentials against Dpkg::Arch; the properties gate
the shape.
'''

[[bug]]
id = "go-debian/4"
title = "dependency.Parse refuses the deprecated relations < and > (foo (< 1.0)), which dpkg still reads as <= and >="
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDeprecatedRelations"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Policy 7.1: "The deprecated forms < and > were confusingly used to mean earlier/later or
equal ... (though dpkg still supports them)". Dpkg::Deps reads `foo (< 1.0)` as `foo (<=
1.0)`; parsePossibilityOperator always takes two characters after `(`, so the operator becomes
"< " or "<1" and Parse fails with "Unknown Operator". Old packages in the archive still carry
these. Found by the dependency differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/5"
title = "dependency.Parse accepts an unknown relation that starts with = (foo (== 1.0), (=> 1.0)) as = with the second character prepended to the version number"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEqualsPrefixedRelation"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parsePossibilityOperator returns as soon as the first character is `=`, so `(== 1.0)` gives
Operator "=" and Number "= 1.0", `(=> 1.0)` Number "> 1.0"; dpkg refuses the relation
("can't parse dependency"). String() then writes `foo (= = 1.0)`, which nothing reads. Found by
the dependency differential (the String() of an accepted text must be a relationship dpkg
reads); the property gates the shape.
'''

[[bug]]
id = "go-debian/6"
title = "Whitespace before the closing parenthesis of a version relation stays in VersionRelation.Number: foo (>= 1.0 ) gives Number 1.0 with a trailing space"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinVersionNumberTrailingSpace"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Deps allows whitespace on both sides of the version inside the parentheses and reads
`foo (>= 1.0 )` as version 1.0; parsePossibilityNumber eats the leading whitespace and then
copies everything up to `)`, so Number is "1.0 " (or "1.0\t"), which a later version.Parse
would take but which compares unequal to "1.0" and is written back with the space. Found by the
dependency differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/7"
title = "Inside [architecture] and <profile> lists, and after an arch qualifier, only a single space is whitespace: a trailing space yields an empty entry or a negation error, a tab or newline is taken into the name, and <> is accepted"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinListWhitespace"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Deps splits architecture and profile lists on any whitespace and ignores whitespace
before the closing bracket. go-debian: `foo [amd64 ]` gives two architectures, the second with
an empty CPU (parsePossibilityArch ends a name at `]` or a single space and, called again on
the trailing space, produces an empty name); `foo [!amd64 ]` fails with "Either the entire arch
list needs negations, or none of it does" (the empty entry has no `!`); `foo [!amd64\t!i386]`
fails with "You can only negate whole blocks" (the tab is not a separator, so the second `!`
is met inside a name); `foo <nocheck >` gives two stages, one with an empty name; `foo:any\t(>=
1.0)` gives the qualifier "any\t" (parseMultiarch ends at a space but not a tab or newline);
and `foo <>` is accepted (one empty stage, dropped again by String()) where dpkg refuses the
empty restriction list. Control files use tabs and continuation lines in these fields. Found by
the dependency differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/8"
title = "Version.String() omits a zero epoch even when the upstream part contains a colon, so 0:1:2 prints as 1:2, which parses back as epoch 1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroEpochWithColon"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dpkg accepts `0:1:2` (a colon is allowed in the upstream part when an epoch is present) and
Parse reads it as {0, "1:2", ""}; String() writes the epoch only when it is non-zero, giving
"1:2", which Parse reads as epoch 1, version "2" - a different version (dpkg --compare-versions
0:1:2 lt 1:2). The epoch must be written whenever the upstream part contains a colon. Found by
the version differential (String() must parse back to the same version); the property gates the
shape.
'''

[[bug]]
id = "go-debian/9"
title = "An [architecture] or <profile> list written directly after the package name or its qualifier, without whitespace (foo[amd64]), becomes part of the package name"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGluedList"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Deps allows zero or more whitespace before `[` and `<` (as before `(`), reading
`foo[amd64]` as package foo restricted to amd64. parsePossibility switches to the controllers
only on whitespace or `(`; `[` and `<` fall through to the name, so the Name becomes
"foo[amd64]" or "foo<!nocheck>" (and `foo:any<!nocheck>` gives Name "foo<!nocheck>" after the
qualifier). Found by the dependency differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/10"
title = "Possibility.String() writes a substvar without its braces: ${misc:Depends} comes back as misc:Depends, which parses as package misc on architecture Depends"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSubstvarString"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parseSubstvar stores the text between `${` and `}` as the Name with Substvar true; String()
writes the Name alone, so a Depends line `${misc:Depends}, foo` read and written back becomes
`misc:Depends, foo`: dpkg-gencontrol would no longer substitute it, and a re-parse gives a
package `misc` with the qualifier `Depends`. Found by the dependency String() round trip; the
property gates the shape.
'''

[[bug]]
id = "go-debian/11"
title = "ParagraphReader appends a newline to a value for every continuation line (a\\n b reads as a\\nb\\n), so a paragraph grows a line at each WriteTo/Parse cycle"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinContinuationTrailingNewline"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Control::HashCore joins continuation lines with "\n" and reads `Description: a\n b\n`
as "a\nb"; ParagraphReader.Next appends line + "\n" for each continuation, giving "a\nb\n".
WriteTo then turns the trailing newline into a line holding a single space (`Description:
a\n b\n \n`), which dpkg reads as the end of the paragraph and which Next reads as one more
empty continuation: "a\nb\n\n" after one cycle, another newline per cycle. Found by the
paragraph differential and the WriteTo round trip; the properties gate the shape.
'''

[[bug]]
id = "go-debian/12"
title = "A value line consisting only of dots is neither escaped by WriteTo (dpkg writes . as .. ) nor unescaped by ParagraphReader (.. reads as .), so a dot line does not survive a write and read"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDotLines"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dpkg (HashCore output and parse) writes a continuation line that is only dots with one dot
more and strips one dot when reading, so that ` .` alone stays the empty line. WriteTo writes
the value "a\n.\nb" as `a\n .\n b` - the dot line has become an empty line for every reader
including go-debian's own - and ParagraphReader reads ` ..` as "..", where dpkg reads ".".
Found by the WriteTo differential against HashCore's output; the property gates the shape.
'''

[[bug]]
id = "go-debian/13"
title = "changelog.Parse refuses a change line indented with a tab (Error! Didn't get ending line!), which dpkg-parsechangelog accepts"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTabIndentedChanges"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Changelog::Debian takes any line matching /^\s{2,}\S/ as change data, so `\t\t* Initial
release.` is read without a warning. ParseOne accepts only lines starting with a space (or
blank lines) between the header and the trailer and fails on the tab-indented line. Found by
the changelog differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/14"
title = "changelog.Parse refuses a trailer date without the day of the week or with a one-digit day (01 Jan 2026 ..., Thu, 1 Jan 2026 ...), both read cleanly by dpkg-parsechangelog"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDateWithoutWeekday"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dpkg's trailer grammar makes the day of week optional (`((\w+)\,\s*)?`) and the day of month
one or two digits (`\d{1,2}`), and dpkg-parsechangelog reads both forms without a warning.
ParseOne parses the date with time.RFC1123Z ("Mon, 02 Jan 2006 15:04:05 -0700"), which
requires the weekday and a two-digit day, and fails with "Failed parsing When". Found by the
changelog differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/15"
title = "Two consecutive spaces inside the maintainer part of a changelog trailer (Jane  Doe <..>, or before the email) make changelog.Parse split the trailer there and fail on the date"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDoubleSpaceInMaintainer"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dpkg's trailer regex anchors on the `<email>` (` \-\- (.*) \<(.*)\>(\ \ ?)(date)`), so `--
Jane  Doe <jane@example.org>  Thu, ...` and `-- Jane Doe  <jane@example.org>  Thu, ...` are
read cleanly with the maintainer text as written. ParseOne splits the trailer at the first
double space, so ChangedBy becomes "Jane" and the date parse fails on "Doe <jane@example.org>
Thu, ...". Found by the changelog differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/16"
title = "Paragraph.WriteTo writes a whitespace-only value line, the second of two consecutive empty lines and a final empty line as a line of whitespace instead of a dot line, which ends the paragraph for dpkg's reader"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBlankValueLines"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Control::HashCore writes every empty or whitespace-only line of a value as ` .`
(`Description: a\n .\n .\n b`). WriteTo indents lines with one space and then replaces the
exact sequence "\n \n" by "\n .\n" once, non-overlapping: "a\n\n\nb" comes out as `a\n .\n
\n b` (the second empty line is a lone space), "a\n  \nb" as `a\n   \n b`, and "a\n" as
`a\n \n`. dpkg's parser (s/\s+$//, then an empty line ends the stanza) stops the paragraph at
the whitespace line and reports "continued value line not in field" for what follows, so the
written file is unreadable to dpkg. Found by the WriteTo differential against HashCore's
output; the property gates the shape.
'''

[[bug]]
id = "go-debian/17"
title = "changelog.Parse refuses a comment line (# ...) among the changes, which dpkg-parsechangelog skips"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinChangelogComment"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Changelog::Debian skips lines matching /^\# / ("skip comments, even that's not
supported") without a warning; ParseOne treats any non-blank line not starting with a space as
an error ("Didn't get ending line!") and gives up on the whole changelog. Found by the changelog
differential; the property gates the shape.
'''

[[bug]]
id = "go-debian/18"
title = "changelog.Parse refuses a whitespace-only line between two entries (Unexpected line), which dpkg-parsechangelog treats as blank"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWhitespaceLineBetweenEntries"
found = { commit = "cffc6a73b84de0ea4153fee14fa7084ed6a42d77", version = "v0.21.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Dpkg::Changelog::Debian treats any line without a non-blank character (!m/\S/) as a blank line
between or inside entries. ParseOne, looking for the next header, skips only lines that are
exactly "\n"; a line of spaces or tabs starts with whitespace and is reported as "Unexpected
line", failing the whole Parse. Found by the changelog differential; the property gates the
shape.
'''
