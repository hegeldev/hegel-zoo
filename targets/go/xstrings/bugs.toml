# Bugs found in github.com/huandu/xstrings by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure
# in target.toml. The reference for the ported methods is Ruby 3.2's String.

[[bug]]
id = "xstrings/1"
title = "Scrub treats the valid rune U+FFFD as an invalid byte and replaces it, so a second pass removes the markers the first one wrote"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinScrubKeepsTheReplacementCharacter"
found = { commit = "559cb39bf044f7c257812995089d44bcfb79a0ed", version = "v1.6.0", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Scrub("a\\ufffdb", "?") returns "a?b": manipulate.go compares the decoded rune with
utf8.RuneError without looking at the size, and a literal U+FFFD (three valid bytes) decodes
to that value too. Scrub is documented to scrub invalid utf8 bytes; U+FFFD is a valid rune
and, being the conventional replacement character, is exactly what earlier scrubbing (this
function's own with repl = "\\ufffd", or any decoder) leaves in a string, so scrubbing
already-scrubbed text with an empty repl deletes those markers. The check needs
`r == utf8.RuneError && size == 1`, as Translate's does since #65. Found by the Scrub model
(the alphabet includes U+FFFD).
"""

[[bug]]
id = "xstrings/2"
title = "WordCount and WordSplit count CJK ideographs added to Unicode since 2012 as alphabetic word characters: the exclusion ranges are stale"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIdeographsAreNotWordCharacters"
found = { commit = "559cb39bf044f7c257812995089d44bcfb79a0ed", version = "v1.6.0", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
isAlphabet (count.go) excludes CJK characters by three hard-coded ranges, U+4E00-9FCC,
U+3400-4D85 and U+20000-2B81D, the extents of Unicode 6.1. Unified ideographs added since
(U+9FCD-9FFF, U+4D86-4DBF, Extensions E to I from U+2B820, Extension G at U+30000) and the
compatibility ideographs (U+F900-FAFF, U+2F800-) are letters that pass the check, so
WordCount("\\u9fff") is 1 while WordCount("\\u4e2d") is 0, and WordSplit("hello \\u9fff world")
returns three words. unicode.Is(unicode.Han, r) is the up-to-date test. Found by the
WordSplit model (the alphabet includes U+9FFF, U+4DB6, U+2B820 and U+F900).
"""

[[bug]]
id = "xstrings/3"
title = "ToCamelCase lower-cases a one-letter last word: ToCamelCase(\"point_X\") is \"pointx\""
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCamelCaseCapitalisesAOneLetterWord"
found = { commit = "559cb39bf044f7c257812995089d44bcfb79a0ed", version = "v1.6.0", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
ToCamelCase("point_X") = "pointx", ToCamelCase("some_W") = "somew", ToCamelCase("a b C") =
"aBc", while ToPascalCase gives "PointX", "SomeW", "ABC" and the documentation says words
after a connector are capitalised ("_complex__case_" => "_complex_Case_"). toCamelCase
(convert.go) tracks isFirstRuneUpper per word so that an all-caps word is lowered after its
first letter ("GOLANG_IS_GREAT" => "golangIsGreat"); after the loop it applies `if
isFirstRuneUpper && !isBig { r0 = unicode.ToLower(r0) }` to the last rune, which is meant
for the first word but fires for whatever word is last: a last word of a single upper-case
letter (its first rune is upper, and no second rune reset the flag) loses its capital. A
word of two or more upper-case letters is already lowered inside the loop, so only the
one-letter case shows. Found by the law that ToCamelCase and ToPascalCase differ only in
the first word's first rune.
"""

[[bug]]
id = "xstrings/4"
title = "ToSnakeCase and ToKebabCase leave a hyphen or underscore unconverted when it touches other punctuation"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinConnectorsNextToPunctuationAreConverted"
found = { commit = "559cb39bf044f7c257812995089d44bcfb79a0ed", version = "v1.6.0", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
ToSnakeCase("a.-b") = "a.-b" and ToKebabCase("a._b") = "a._b", ToKebabCase("a__b") =
"a--b" but ToKebabCase("a.b_c") = "a.b_c"; the documentation says a space or hyphen is
converted to the connector ("GO-PATH" => "go_path"). nextWord (convert.go) classifies a run
of runes by its first rune: '.' is punctuation, and since '-' (Pd) and '_' (Pc) satisfy
unicode.IsPunct too the run continues through them, giving a punctWord that
camelCaseToLowerCase copies verbatim. Only a connector run that starts on a connector is
converted. Found by the law that ToKebabCase is ToSnakeCase with the other connector and
that the snake form has no hyphens.
"""

[[bug]]
id = "xstrings/5"
title = "Translate leaves the last rune of a from range untranslated when the to pattern lists single runes: Translate(\"abc\", \"a-c\", \"xyz\") is \"xyc\""
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRangeMapsOntoSingleRunes"
found = { commit = "559cb39bf044f7c257812995089d44bcfb79a0ed", version = "v1.6.0", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Translate("abc", "a-c", "xyz") = "xyc", Translate("CDEF", "C-F", "1234") = "123F",
Translate("FED", "F-D", "123") = "12D": the last rune of the range is not matched at all
(TranslateRune('c') reports false), against the documented 1:1 mapping. In NewTranslator
(translate.go) the loop `for toEnd != utf8.RuneError && fromStart != fromEnd` maps one rune
per iteration while the to pattern yields single runes (toRangeStep == 0), and it stops when
fromStart reaches fromEnd, before that rune is added; the code after the loop then sees
`fromStart == fromEnd` and discards fromEnd. The range-to-range path has the "edge case"
fix for the same off-by-one, and a to pattern that runs out first maps the rest of the
range to its last rune correctly ("F-D" to "12" gives "122"), so the shape is a range whose
last rune lines up with a single rune of the to pattern. Ruby's tr, which the pattern
language copies, gives "xyz". Found by the pattern model and Ruby.

Wider than first recorded (2026-09-25): the range's last rune is lost whenever its penultimate
rune sits on a single rune of the to pattern that is not the pattern's last, so the to pattern
need not be all singles: Translate("ab", "a-b", "xy") = "xb", Translate("abcd", "a-d", "x-yzw") =
"xyzd", Translate("a", "aa-ba-a", "aaa-b") = "a" (Ruby: "xy", "xyzw", "b"). Found by the pattern
property once it drew the shape.
"""

[[bug]]
id = "xstrings/6"
title = "A U+FFFD listed in a pattern is dropped when another rune follows it, shifting the mapping"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinReplacementCharacterInAPattern"
found = { commit = "559cb39bf044f7c257812995089d44bcfb79a0ed", version = "v1.6.0", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Translate("\\ufffd1", "\\ufffd1", "AB") = "\\ufffdA" (the '1' takes the first mapping),
Translate("ab", "ab", "\\ufffdX") = "XX", Count("\\ufffd\\ufffd1", "\\ufffd1") = 1. nextRuneRange
(translate.go) uses utf8.RuneError as its "no pending rune" sentinel (`last ==
utf8.RuneError`), so a literal U+FFFD read from the pattern is taken for "nothing pending"
and overwritten by the next rune. A U+FFFD as the only or last rune of a pattern works
(Delete("a\\ufffdb", "\\ufffd") = "ab"). The sentinel needs to be a value outside the rune
range, as translateRune's `mappedRune = -1` already is. Found by the pattern model (the
pattern alphabet includes U+FFFD).

Wider than first recorded (2026-09-25): the U+FFFD is dropped from any pattern of two or more
runes, whether first, middle or last, so Translate("\\ufffd", "a\\ufffd", "") = "\\ufffd",
Delete("x\\ufffd", "x\\ufffd") = "\\ufffd" and Count("\\ufffd", "a\\ufffd") = 0; only a sole
U+FFFD works (Translate("\\ufffd", "\\ufffd", "x") = "x"). Found by the narrow property's
HEGEL_NO_KNOWN run.
"""
