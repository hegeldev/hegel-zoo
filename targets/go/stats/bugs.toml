# Bugs found in montanaflynn/stats by the Hegel tests (see README.md). Each has a pin test
# (TestHegelPin...) listed as an expected failure in target.toml.

[[bug]]
id = "stats/1"
title = "Percentile rejects percent 0 although it documents NumPy and Excel PERCENTILE.INC compatibility, where 0 gives the minimum"
kind = "contract"
severity = "low"
test = "TestHegelPinPercentileZero"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Percentile's comment says it implements Hyndman & Fan type 7, "the default in Excel
(PERCENTILE, PERCENTILE.INC), Google Sheets, NumPy, and R", and gives the algorithm
rank = (p / 100) * (n - 1). Every one of those accepts p = 0 (rank 0, the minimum), but the
bounds check is `percent <= 0 || percent > 100`, so Percentile([3 1 2], 0) is NaN with
ErrBounds while Percentile([3 1 2], 100) is 3. PercentileNearestRank accepts 0. Describe
drops a requested percentile of 0 from its output as a consequence (the error is swallowed
unless allowNaN is set).
'''

[[bug]]
id = "stats/2"
title = "A constant series whose value is not the exact mean of its copies gets a skewness of 1, a kurtosis of -2, z-scores and an autocorrelation from rounding noise"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinConstantNoise"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Skewness, Kurtosis, ZScore and AutoCorrelation detect a constant series by an exact test on
the sum of squared deviations (`sumOfSquares == 0`, `sd == 0`, `variance == 0`), which is
documented to give ErrZero (or 0 for AutoCorrelation). But the mean of n copies of v is not
always v: ten 0.1s have the mean 0.09999999999999999, seven -1.6s the mean
-1.5999999999999999, so every deviation is one rounding error and the sums are tiny but not
zero. The normalised moments of that noise come out as ordinary-looking numbers:
Skewness(ten 0.1s) = 0.9999999999999978, Kurtosis(seven -1.6s) = -2, ZScore(seven -1.6s) =
[-0.9258 ... -0.9258] (every value 0.93 standard deviations below the mean of a constant
series), AutoCorrelation(ten 0.1s, 1) = 0.9. SciPy's skew and kurtosis treat a second moment
below the resolution of the data as zero and return NaN. Whether the constant check fires
depends on the value and the length: [0.1 0.1 0.1 0.1] gives ErrZero, ten 0.1s do not.
'''

[[bug]]
id = "stats/3"
title = "TTest gives a wrong p-value for a small t statistic: t = 0.001 with one degree of freedom gives p = 0.38 instead of 0.9994, t = 1e-6 gives p = 0.0004"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinTTestSmallT"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
tSf computes the two-sided p-value as I_x(df/2, 1/2) with x = df / (df + t^2), through
regIncBeta's continued fraction (Lentz), stopped after 200 terms or a step below 1e-10. The
continued fraction for I_x(a, b) converges only for x below (a + 1) / (a + b + 2); the
standard recipe (Numerical Recipes betai, SciPy's betainc) uses the symmetry
I_x(a, b) = 1 - I_{1-x}(b, a) beyond that. regIncBeta does not, and a small t puts x next
to 1, where the fraction is far from converged when the loop stops. Measured against
scipy.stats.t.sf, with 1 - x = t^2 / (df + t^2): 1e-2 gives a relative error of 4e-10,
1e-4 of 6e-4, 1e-6 of 0.6, 1e-12 of 1 (the p-value comes out near 0.0004 instead of near 1).
Examples (one-sample, x = [1.001, -0.999], t = 0.001, df = 1): p = 0.3814 where
1 - (2/pi) atan(0.001) = 0.99936. With t = 1e-6: p = 0.0004 - a sample indistinguishable
from the hypothesised mean is reported as highly significant. Two-sample tests show the same
(t = -0.0267 on 10 degrees of freedom: 0.97714 instead of 0.97918). Statistics with
t^2 / (df + t^2) above 1e-2 agree with SciPy to 1e-9.
'''

[[bug]]
id = "stats/4"
title = "NormMoment overflows its int factorials from n = 21: NormMoment(21, 0, 1) = 0 and NormMoment(22, 0, 1) is negative"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNormMomentOverflow"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NormMoment(n, loc, scale) sums C(n, i) loc^i scale^(n-i) E[Z^(n-i)] with
E[Z^k] = k! / (2^(k/2) (k/2)!) computed from a recursive int factorial. 21! exceeds
math.MaxInt64, so factorial(21) wraps (to -4249290049419214848) and factorial(22) to a
value whose quotient is negative: NormMoment(21, 0, 1) = 0 (correct by parity) but
NormMoment(22, 0, 1) = -1.5298675721513549e+07 where E[Z^22] = 21!! = 13749310575, and
NormMoment(24, 0, 1) is wrong too. scipy.stats.norm.moment(22) = 13749310575. Up to
n = 20 the values agree with SciPy to 1e-12. Ncr has the same silent overflow for large n
(C(67, 33) does not fit an int); it is exact up to n = 40 at least.
'''

[[bug]]
id = "stats/5"
title = "Sample without replacement and StableSample panic for a negative takenum"
kind = "crash"
severity = "low"
test = "TestHegelPinSampleNegative"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Sample(input, takenum, false) checks only `takenum <= length` and then slices
perm[0:takenum]; StableSample does the same. A negative takenum passes the check and the
slice expression panics: "runtime error: slice bounds out of range [:-1]". Sample with
replacement returns an empty result and no error for the same argument (its loop runs zero
times), so the three paths disagree; ErrBounds, which the functions return for
takenum > len(input), is the documented shape of an out-of-range count.
'''

[[bug]]
id = "stats/6"
title = "LoadRawData reads a map[int]T at the keys 0..len-1, so other keys give zeros and the entries present are dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLoadMapByIndex"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For every map[int]T case LoadRawData loops `for i := 0; i < len(t); i++ { s = append(s,
float64(t[i])) }`: the map is treated as a dense array indexed 0..len-1. A map with any other
key set silently loses data: LoadRawData(map[int]int{5: 1, 7: 2}) = [0 0] (two lookups of
absent keys), map[int]int{0: 7, 2: 9} loads as [7 0]. Nothing documents the dense-key
requirement ("parses and converts a slice of mixed data types to floats"); the natural reading
of a map argument is its values (in key order, say). The same happens for map[int]string
through the string path.
'''

[[bug]]
id = "stats/7"
title = "LoadRawData drops int64, int32, float32 and the other sized numbers held in a []interface{}, and returns nil for a []float32"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLoadIfaceDrops"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The []interface{} path switches on int, uint, float64, string, bool and time.Duration only;
any other element is skipped without error: LoadRawData([]interface{}{int64(3),
float32(1.5), int32(-2), uint64(7)}) = [] (an empty Float64Data). The typed-slice paths
convert every sized integer type ([]int64, []uint32, ...) so the same values load fine when
the slice is typed, which makes the dropping in the mixed slice surprising (the README
advertises []interface{}{1.1, "2", 3}). []float32 has no case at all and loads as nil while
[]float64 and every integer width are supported.
'''

[[bug]]
id = "stats/8"
title = "ProbGeom accepts a probability outside [0, 1] and returns a negative probability, where ExpGeom and VarGeom reject it"
kind = "contract"
severity = "low"
test = "TestHegelPinProbGeomBounds"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ExpGeom(p) and VarGeom(p) return ErrNegative for p > 1 or p < 0. ProbGeom(a, b, p) checks
only a and b: ProbGeom(1, 3, -0.5) = -2.375 with a nil error (a probability below zero),
ProbGeom(1, 3, 1.5) = NaN with a nil error. For p in [0, 1] the closed form agrees with the
term-by-term sum to 1e-9.
'''

[[bug]]
id = "stats/9"
title = "Min and Max depend on the position of a NaN: Min([NaN 1]) = NaN but Min([1 NaN]) = 1"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinMinMaxNaN"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Min starts from input[0] and replaces it on `input[i] < min`; Max likewise with `>`. Every
comparison with NaN is false, so a NaN at index 0 is never replaced (the result is NaN) and a
NaN anywhere else is never adopted (it is ignored): Min([NaN 1]) = NaN, Min([1 NaN]) = 1,
Max([1 NaN 3]) = 3, Max([NaN 1 3]) = NaN. A minimum is a property of the set, not of the
order. NumPy's min/max propagate NaN, nanmin/nanmax ignore it; either would be consistent.
Range, Rescale, Histogram, CumulativeMax/Min, ArgMax/ArgMin, Clip and SoftMax inherit the
position dependence through Min and Max or the same comparison pattern.
'''

[[bug]]
id = "stats/10"
title = "The sort-based functions rank NaN below every number: Median([NaN 1 2]) = 1 while Median([NaN NaN 1 2]) = NaN"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinNaNSortsLow"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
sortedCopy uses sort.Float64s, which places NaNs first, and nothing checks for them
afterwards. So a NaN acts as a value smaller than every number: Median([NaN 1 2]) = 1,
Percentile([NaN 5 6], 50) = 5, PercentileNearestRank([NaN 5 6], 100) = 6, Quartile and
MedianAbsoluteDeviation likewise, Rank([NaN 1 2 NaN]) = [1 2 3 4] (the NaNs ranked 1 and 4
by their positions, since rankData compares with `<` and `==`), TrimmedMean and Winsorize
trim NaN as the smallest value. The treatment is not even self-consistent: Median([NaN NaN
1 2]) = NaN because the middle pair now includes a NaN, so the answer depends on how many
NaNs there are. Sum, Mean, Variance and the other arithmetic functions propagate NaN;
Round rejects it with ErrNaN; Interp documents ErrBounds for a NaN knot. NumPy's median,
percentile and rankdata propagate NaN (or nan_policy decides).
'''

[[bug]]
id = "stats/11"
title = "SampleVariance, StandardDeviationSample, SEM and Covariance of a single value return NaN with a nil error"
kind = "contract"
severity = "low"
test = "TestHegelPinSingleSampleNaN"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The sample statistics divide by n - 1, and for n = 1 that is 0/0 = NaN, returned with a nil
error: SampleVariance([5]) = NaN, StandardDeviationSample([5]) = NaN, SEM([5]) = NaN,
Covariance([5], [7]) = NaN (the population versions are 0, as they should be). Every other
undefined case in the package is an error (ErrEmptyInput for no data, ErrZero for a zero
variance in ZScore, ErrBounds in Quartile for fewer than two values), and MovingStdDev
documents this very case: "The window must satisfy 2 <= window ... since the sample standard
deviation of a single value is undefined", returning ErrBounds. CoefficientOfVariation and
ZScore of one value also give NaN / [NaN] through the same path.
'''

[[bug]]
id = "stats/12"
title = "TTest of two equal constant samples returns NaN, NaN with no error, where the one-sample form of the same case returns t = 0, p = 1"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinTTestConstantSamples"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The one-sample branch handles a zero standard deviation: mean equal to the hypothesis gives
(0, 1, nil), otherwise ErrBounds. The two-sample branch has no such check: with both samples
constant the pooled variance is 0, and TTest([1 1], [1 1], 0) = NaN, NaN, nil (0/0), while
TTest([1 1], [2 2], 0) = -Inf, 0, nil. The one-sample TTest([1 1], nil, 1) = 0, 1, nil. A NaN
statistic with a nil error is the shape the package otherwise reserves for nothing; SciPy's
ttest_ind gives nan too but warns. Two-sample tests where one sample has a single value also
give NaN with no error, through the sample variance of one value (stats/11).
'''

[[bug]]
id = "stats/13"
title = "PercentileWeighted returns the largest value, even one of weight 0, when the weights sum differently in input and sorted order"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWeightedPercentileRounding"
found = { commit = "c06ae5f864ab3128ee1124ea52b6d4da552d80e7", version = "v0.12.7", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PercentileWeighted documents "the smallest data value x such that the cumulative weight of all
values <= x is at least p% of the total weight". It sums the total weight in input order and
the cumulative weight in ascending order of the data, and compares `cumWeight >= target` with
target = percent/100 * total. Floating-point addition is not associative, so the final
cumulative weight can fall one rounding error short of the total: then no value reaches the
target and the fallback `result = pairs[l-1].value`, the largest value, is returned - even
when its weight is 0 and a smaller value already carries all the weight.
PercentileWeighted([3 1 2 4], [0.1 0.2 0.3 0], 100) = 4: in input order 0.1 + 0.2 + 0.3 + 0
= 0.6000000000000001, in sorted order 0.2 + 0.3 + 0.1 + 0 = 0.6, so the target is never
reached; the documented answer is 3. Found by the generated cases at percent 100 with a zero
weight on the largest value (about one case in ten thousand); the same one-ulp effect can
move any percent whose target lands exactly on a cumulative weight. A tolerance, or summing
the total in the same sorted order, avoids it.
'''
