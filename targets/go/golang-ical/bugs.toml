# Bugs found in arran4/golang-ical by the Hegel zoo. Each has a pin test (hegel_pins_test.go)
# listed as an expected failure in target.toml.

[[bug]]
id = "golang-ical/1"
title = "ComponentPropertyExtended returns X-X- for every name"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinExtendedPropertyName"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ComponentPropertyExtended(s) is documented as the X- form of a property name. It returns
`"X-" + strings.TrimPrefix("X-", s)`: the arguments of TrimPrefix are reversed, so the argument
is used as the prefix to trim from "X-", the result is "X-" or "" and the name is lost.
ComponentPropertyExtended("FOO") and ComponentPropertyExtended("X-FOO") are both "X-X-".
'''

[[bug]]
id = "golang-ical/2"
title = "RemovePropertyByValue and RemovePropertyByFunc remove every other property and keep the selected ones"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinRemovePropertyByValue"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RemovePropertyByFunc keeps a property when `p.IANAToken != string(removeProp) && remove(p)`,
that is only when its name differs and the predicate accepts it; the condition is the negation
of the intended "keep unless name matches and predicate accepts". On an event with UID,
ATTENDEE a, ATTENDEE b and SUMMARY, RemovePropertyByValue(ATTENDEE, "mailto:a@x") returns all
four properties as removed and leaves the component empty. RemovePropertyByValue is the only
caller; RemoveProperty (by name) is correct.
'''

[[bug]]
id = "golang-ical/3"
title = "Id() unescapes the UID a second time"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIdIsNotUnescapedTwice"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Property values are unescaped when parsed (FromText) and escaped when serialized (ToText), so
the Value field holds the logical text. Id() applies FromText to the stored UID again:
NewEvent(`a\,b`).Id() is "a,b", and after a serialize/parse round trip of a UID containing
`\n` (two characters) Id() returns a newline. GetProperty(UID).Value is right.
'''

[[bug]]
id = "golang-ical/4"
title = "Parameter values are backslash-escaped instead of quoted"
kind = "spec"
severity = "medium"
test = "TestHegelPinParameterValuesAreQuoted"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 5545 3.2 has no escaping in parameter values: a value containing : ; or , is written in
double quotes, and " cannot appear at all. escapeValueString writes a backslash before each
of , " ; : \ and ' (only ALTREP is quoted). WithCN("O'Brien") serializes as
`CN=O\'Brien`, an X- parameter "a:b;c,d" as `X-A=a\:b\;c\,d`. Other parsers do not read this
back: icalendar 7.3.0 rejects the `\'` form ("not a valid parameter string") and reads the
escaped colon form as CN=":..." with an empty value. The library's own parser unescapes them,
so the deviation is invisible in a round trip through golang-ical alone.
'''

[[bug]]
id = "golang-ical/5"
title = "A backslash inside a quoted parameter value is dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBackslashInQuotedParameter"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
QSAFE-CHAR (RFC 5545 3.1) includes the backslash, so `CN="C:\dir"` is the seven characters
C:\dir. parsePropertyParamValue treats a backslash as an escape inside quotes too and drops
one that precedes an ordinary character: the value read is "C:dir". icalendar reads the same
line as `C:\dir` (it also unescapes `\\`, `\,` and `\;` in parameters, a de-facto convention,
but keeps a backslash before other characters).
'''

[[bug]]
id = "golang-ical/6"
title = "CATEGORIES and RESOURCES lists come out of a parse/serialize round trip with their commas escaped"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCategoriesKeepTheirCommas"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CATEGORIES:a,b is a list of two TEXT values. The parser stores the value as the string "a,b"
(FromText leaves an unescaped comma alone) and the serializer applies ToText to the whole
value, writing CATEGORIES:a\,b, which every reader (icalendar, and golang-ical itself) takes
as the single category "a,b". The same for RESOURCES. AddCategory (one value per property)
is unaffected, and a category written through the API with a literal comma survives, so the
bug only shows on calendars that were parsed.
'''

[[bug]]
id = "golang-ical/7"
title = "Serialize loops forever when a multi-octet character does not fit the line length"
kind = "hang"
severity = "low"
test = "TestHegelPinSerializeTerminates"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
trimUT8StringUpTo(maxLength, s) returns the longest prefix of whole runes within maxLength
octets; when the first rune alone is longer than maxLength it returns "". The continuation
loop in BaseProperty.serialize (`for len(r) > MaxLength-1`) then makes no progress.
Serialize(WithLineLength(2)) of a DESCRIPTION containing a three-octet character never
returns; WithLineLength(3) hangs on a four-octet character. Small line lengths are a
degenerate option, but an option that never returns should refuse or clamp.
'''

[[bug]]
id = "golang-ical/8"
title = "Component names, property names and RRULE parts are matched case-sensitively"
kind = "spec"
severity = "low"
test = "TestHegelPinNamesAreCaseInsensitive"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 5545 3.1: "Property names, parameter names, and enumerated parameter values are
case-insensitive", and component names likewise (the ABNF is iana-token). ParseCalendar of
"begin:vcalendar" fails with "expected begin", "BEGIN:vevent" produces a GeneralComponent
instead of a VEvent, "summary:x" is not found by GetProperty(SUMMARY), and
ParseRecurrenceRule("freq=daily") fails with "missing FREQ" (icalendar accepts all of these).
Real feeds are almost always upper case, hence low.
'''

[[bug]]
id = "golang-ical/9"
title = "MalformedError line numbers count content lines, not physical lines"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinErrorLineNumbers"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CalendarStream.ReadLine increments its line counter once per logical (unfolded) line and not
for the blank lines it skips, and MalformedError reports that counter. A malformed property on
physical line 10, after a DESCRIPTION folded over three lines and two blank lines, is reported
as "line 6". The number is meant to locate the error in the input; users count physical lines.
'''

[[bug]]
id = "golang-ical/10"
title = "SetRefreshInterval on a parsed calendar adds a second REFRESH-INTERVAL"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRefreshIntervalRoundTrip"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PropertyRefreshInterval is the string "REFRESH-INTERVAL;VALUE=DURATION", a name with a
parameter baked in. Serialization writes it as REFRESH-INTERVAL;VALUE=DURATION:PT1H, which the
parser reads as the property REFRESH-INTERVAL with a VALUE parameter. SetRefreshInterval
then looks for a property whose token is the whole string, finds none, and appends: a parsed
calendar with one REFRESH-INTERVAL has two after SetRefreshInterval("PT2H"), and GetProperty
(PropertyRefreshInterval) does not find the parsed one.
'''

[[bug]]
id = "golang-ical/11"
title = "VTodo.SetDuration on an all-day start sets a date-time DUE"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTodoDurationAllDay"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ComponentBase.SetDuration checks whether DTSTART has VALUE=DATE and then sets an all-day
DTEND (DTEND;VALUE=DATE:20240102). VTodo overrides it with a version that always calls
SetDueAt, so a to-do with DTSTART;VALUE=DATE:20240101 and SetDuration(24h) gets
DUE:20240102T000000Z, mixing a DATE start with a DATE-TIME due, which RFC 5545 3.6.2 forbids
("the value type of DUE must be the same as DTSTART").
'''

[[bug]]
id = "golang-ical/12"
title = "RecurrenceRule.String appends Z to a floating UNTIL"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFloatingUntilStaysFloating"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parseRecurrenceTime reads UNTIL=20240101T120000 (a floating local time, legal when DTSTART is
floating) with time.Parse, which yields a UTC time, and String() formats a date-time UNTIL as
20060102T150405Z. ParseRecurrenceRule("FREQ=DAILY;UNTIL=20240101T120000").String() is
"FREQ=DAILY;UNTIL=20240101T120000Z": the round trip moves the end of the series by the
DTSTART's offset from UTC. Date-only UNTIL values keep their form (UntilDateOnly).
'''

[[bug]]
id = "golang-ical/13"
title = "ParseRecurrenceRule accepts values outside the RFC 5545 ranges"
kind = "spec"
severity = "low"
test = "TestHegelPinRecurrenceRangesAreChecked"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 5545 3.3.10 bounds every numeric part (INTERVAL and COUNT positive, BYSECOND 0-60,
BYMINUTE 0-59, BYHOUR 0-23, BYMONTHDAY +-1..31, BYYEARDAY +-1..366, BYWEEKNO +-1..53, BYMONTH
1-12). ParseRecurrenceRule only converts the integers: INTERVAL=0 (then dropped by String(),
which omits intervals of 0 and 1), COUNT=-1, BYHOUR=25, BYMONTH=13 and BYSECOND=61 all parse
without error. An RRULE parser is the place where a feed's nonsense is caught; icalendar is
equally lenient, so the pin is the RFC's word alone.
'''

[[bug]]
id = "golang-ical/14"
title = "Property and parameter names are found by an unanchored search"
kind = "spec"
severity = "low"
test = "TestHegelPinNamesAreAnchored"
found = { commit = "1cf2929fdfce18fce947b763de791c5b5fa66c89", version = "v0.3.6", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parseProperty locates the property name with the regexp `[A-Za-z0-9-]{1,}` without anchoring
it at the start of the line, and a parameter name by the same search, taking everything up to
the end of the match as the name. "###SUMMARY:x" is accepted as SUMMARY (the junk skipped),
"SUMMARY;=A=1:x" as SUMMARY with a parameter named "=A" and "SUMMARY;A=1;;B=2:x" with one
named ";B". A content line must begin with the name and a parameter name is a token (RFC 5545
3.1); these lines are malformed and should be errors, as icalendar reports them.
'''
