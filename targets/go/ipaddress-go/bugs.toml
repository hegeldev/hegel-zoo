[[bug]]
id = "ipaddress-go/1"
title = "IPv4Address.ToFullString pads segments to three digits (001.002.003.010), which the default parser reads as octal, so the full string of 1.2.3.10 parses as 1.2.3.8 and that of 1.2.3.8 (001.002.003.008) is rejected as an invalid octal digit"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinFullStringRoundTrip"
found = { commit = "cbb4aa467fd4c82f3f41c4b83b07b06fb7f4f654", version = "v1.8.4+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ToFullString on an IPv4 address writes every segment with leading zeros to three characters,
"001.002.003.010" for 1.2.3.10. NewIPAddressString with the default parameters allows inet_aton
forms, under which a segment with a leading zero is octal: the full string of 1.2.3.10 parses to
1.2.3.8, and the full strings of any address with a segment of 8 or 9 (or 18, 19, 28, ...) do not
parse at all ("IP Address error: invalid octal digit"), 1.2.3.8 -> "001.002.003.008". Every other
string form the library produces parses back to the same address (canonical, normalized,
compressed, wildcard, segmented binary, hex and reverse-DNS forms were checked); the IPv6 full
string ("0001:0000:...") is fine since hex has no octal reading. Either the default parser
should read a leading zero on a three-digit segment as decimal, as inet_aton itself does not but
as the library's own output requires, or ToFullString should not produce a string the default
parser misreads. Found by the string round-trip property: about a quarter of random IPv4
addresses have a full string that parses to a different address or not at all.
'''

[[bug]]
id = "ipaddress-go/2"
title = "IPv6Address.ToMixedString of a CIDR prefix block whose prefix length cuts one of the last two segments (97-111, 113-127) returns without error a string such as 1::0.10.0-240.0/116 that the library's own parser refuses with IncompatibleAddressError, which the IPAddressString documentation says cannot happen for a CIDR subnet"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinMixedStringRoundTrip"
found = { commit = "cbb4aa467fd4c82f3f41c4b83b07b06fb7f4f654", version = "v1.8.4+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The prefix block 1::a:*/116 has the canonical string "1::a:0-f000/116", the library's way of
writing the sixteen /116 blocks it consists of, and that string parses back to the same
subnet. Its mixed string is "1::0.10.0-240.0/116": the same convention applied to the IPv4
bytes. NewIPAddressString("1::0.10.0-240.0/116").ToAddress() fails with "IP Address error: IPv4
segment ranges cannot be converted to IPv6 segment ranges" (GetAddress returns nil while
IsValid is true), because the parser joins the byte ranges before it looks at the prefix. The
same happens for any prefix length between 97 and 127 other than 112: 1::*:*/104 ->
"1::*.0.0.0/104", 1::a:*/120 -> "1::0.10.*.0/120", ::ffff:*:*/100 -> "::ffff:0-240.0.0.0/100".
Lengths 96, 112 and 128 and unprefixed subnets are fine. The documentation of IPAddressString
lists the two situations in which ToAddress returns IncompatibleAddressError and adds that
they "cannot occur with standard CIDR prefix-based subnets"; and ToMixedString promises an
error when there is no mixed string rather than a string that cannot be read. Found by the
string round-trip property, whose mixed-string check otherwise passed.
'''

[[bug]]
id = "ipaddress-go/3"
title = "IPv6Address.ToMixedString of a prefixed subnet that is not a prefix block writes wildcard last segments as 0.0.0.0, so 1::fff:*:*/63 (2^32 addresses, canonical string 1::fff:*:*/63) becomes 1::fff:0.0.0.0/63, a single address"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMixedStringKeepsWildcards"
found = { commit = "cbb4aa467fd4c82f3f41c4b83b07b06fb7f4f654", version = "v1.8.4+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A subnet with a prefix length that is not a prefix block keeps its ranges in every string form:
1::fff:*:*/63 prints as "1::fff:*:*/63" in canonical, normalized, compressed and full form,
and IsPrefixBlock is false since segment 5 is fixed at fff. ToMixedString returns
"1::fff:0.0.0.0/63" with no error, the string of the single address 1::fff:0:0/63, as if the
IPv4 part were the zero host of a prefix block. Likewise 1::*:*/63 -> "1::0.0.0.0/63" (which
parses as the /63 prefix block 1::/63, 2^65 addresses instead of 2^32) and 1:*::fff:*:*/16 ->
"1:*::fff:0.0.0.0/16". When the last two segments are not both full wildcards the mixed string
is right: 1::fff:1-2:*/63 -> "1::fff:0.1-2.*.*/63", 1::fff:*:1/63 -> "1::fff:*.*.0.1/63"; and
without a prefix length 1::fff:*:* -> "1::fff:*.*.*.*". Found by the string round-trip
property.
'''
