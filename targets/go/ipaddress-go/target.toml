name = "ipaddress-go"
language = "go"
upstream = "https://github.com/seancfoley/ipaddress-go"
subdir = ""
license = "Apache-2.0"  # no CONTRIBUTING file; README and wiki say nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "cbb4aa467fd4c82f3f41c4b83b07b06fb7f4f654"
date = "2026-09-10"
version = "v1.8.4+"

[hegel]
version = "v0.6.33"

[run]
# The tests live in hegel/ and exercise the ipaddr package against Python's ipaddress module
# (a child process, hegel/oracle.py, needing only the standard library) and Go's net/netip.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinFullStringRoundTrip = "ipaddress-go/1"
TestHegelPinMixedStringRoundTrip = "ipaddress-go/2"
TestHegelPinMixedStringKeepsWildcards = "ipaddress-go/3"
