[[bug]]
id = "go-cty/1"
title = "A null, unknown or empty element under a dynamic element type loses its type in JSON and msgpack, and beside a known element the unmarshal panics"
kind = "panic"
severity = "medium"
test = "TestHegelPinDynamicElementListRoundTrip"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
docs/json.md: a value marshalled with its type unmarshals to an equal value when the same type is
given, and a DynamicPseudoType in the type makes the encoder store the element's own type. That
holds for known, non-empty elements, and for a null or unknown at a position whose type is
exactly DynamicPseudoType. It fails when the placeholder sits inside the element type: with
ty = List(List(DynamicPseudoType)) the value [NullVal(List(String)), ["a"]] marshals to JSON
[null,[{"value":"a","type":"string"}]] (and to the msgpack equivalent), and Unmarshal panics
"inconsistent list element types (cty.List(cty.DynamicPseudoType) then cty.List(cty.String))":
the null comes back typed List(DynamicPseudoType) while the known neighbour comes back as
List(String), and cty.ListVal refuses the mix. The same for UnknownVal(List(String)) in msgpack
and for the empty list ListValEmpty(String) in both codecs (JSON [[],[...]]). Alone, such an
element comes back with the declared type instead of its own, so the round trip is unequal
rather than a panic. Found by the JSON and msgpack round-trip properties (a null or empty
element under Map(Map(DynamicPseudoType)), Tuple([Map(DynamicPseudoType)]) etc.). Fix: the
decoders should build the element from the unmarshalled elements' types (as cty.ListVal does
for known ones) or the encoders should write the element type for nulls and empties too.
'''

[[bug]]
id = "go-cty/2"
title = "Substr with a negative offset and length 0 returns the rest of the string instead of the empty string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSubstrNegativeOffsetZeroLength"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Substr's length is "the maximum length of the result in Unicode characters", and
Substr("abcde", 3, 0) is "". Substr("abcde", -2, 0) is "de": the length-0 short circuit is the
else branch of the negative-offset adjustment (`if offset < 0 { offset += totalLen } else if
length == 0 { return "" }`), and the seek loop that follows compares the running count with the
length after incrementing it, so 0 is never reached and the whole remainder is returned. Found
by the string property (Substr against a rune model). Fix: check length == 0 after the offset
adjustment, or make the loop's test `pos >= length`.
'''

[[bug]]
id = "go-cty/3"
title = "Title leaves the letter after an underscore alone though its description says every letter after a non-letter, non-digit character is upper-cased"
kind = "spec"
severity = "low"
test = "TestHegelPinTitleAfterUnderscore"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
TitleFunc's Description: "Replaces one letter after each non-letter and non-digit character with
its uppercase equivalent." The implementation is strings.Title, whose word separators exclude the
underscore (and every non-ASCII, non-space character): Title("x_y a.b") is "X_y A.B", while the
description gives "X_Y A.B". Either the description or the implementation is wrong; the
description is what Terraform-style function catalogues show. Found by the string property.
'''

[[bug]]
id = "go-cty/4"
title = "The descriptions of LessThan, LessThanOrEqualTo, GreaterThan and GreaterThanOrEqualTo name the operands the wrong way round"
kind = "spec"
severity = "low"
test = "TestHegelPinComparisonDescriptions"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GreaterThanFunc.Description() is "Returns true if and only if the second number is greater than
the first." but GreaterThan(5, 3) is true: the function compares the first number with the
second, as Value.GreaterThan does. The same reversal in LessThan ("the second number is less
than the first"), LessThanOrEqualTo and GreaterThanOrEqualTo. Found by the number property,
which modelled the descriptions. Fix: "the first number is greater than the second" (and so on).
'''

[[bug]]
id = "go-cty/5"
title = "Range's zero-step check compares the step with == against cty.Zero, so a zero from the caller is not rejected"
kind = "logic"
severity = "low"
test = "TestHegelPinRangeZeroStep"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RangeFunc: `if step == cty.Zero { return ... "step must not be zero" }`. A cty.Value holds a
*big.Float, so == is pointer identity: only the cty.Zero singleton itself matches, and a zero the
caller built (cty.NumberIntVal(0), a parsed "0", a value from JSON) passes. Range(2, 2, 0) is then
the empty list and Range(1, 5, 0) runs to the 1024-element cap and fails with "more than 1024
values were generated; either decrease the difference between start and end or use a smaller
step". Found by the Range property. Fix: step.RawEquals(cty.Zero) (or Equals).
'''

[[bug]]
id = "go-cty/6"
title = "Format ignores a precision of 0 on %s, so %.0s gives the whole string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFormatZeroPrecision"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Format's documentation: "For strings, precision limits the length of the input to be formatted
(not the size of the output), truncating if necessary." Format("[%.0s|%.1s]", "abc", "abc") is
"[abc|a]", not "[|a]": formatAppendString truncates only `if verb.Prec > 0`, and 0 is treated as
"no precision" (Go's fmt gives "" for %.0s). Found by the Format property. Fix: track whether a
precision was given (as HasWidth does for the width) and truncate for 0 too.
'''

[[bug]]
id = "go-cty/7"
title = "JSONDecode accepts a stray ] or } after the value, and the typed json.Unmarshal accepts any trailing data"
kind = "contract"
severity = "low"
test = "TestHegelPinJSONTrailingData"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
json.ImpliedType (which JSONDecode uses) checks for data after the value with json.Decoder.More,
which reports whether another array or object element follows; at a "]" or "}" it says no, so
JSONDecode(`{"a":1}]`), JSONDecode(`[1]}`) and JSONDecode(`true]`) succeed while
JSONDecode(`1 2`) fails with "extraneous data after JSON object". json.Unmarshal with a type has
no check at all: Unmarshal(`[1] x`, List(Number)) and Unmarshal(`true false`, Bool) succeed. The
description of JSONDecode: "Parses the given string as JSON"; a document with trailing data is
not JSON. Found by the JSON functions property (a "]" appended to an encoding was still
decoded). Fix: after the value, dec.Token() must return io.EOF (or use json.Valid).
'''

[[bug]]
id = "go-cty/8"
title = "Modulo by zero returns the dividend though Value.Modulo documents an infinity"
kind = "contract"
severity = "low"
test = "TestHegelPinModuloByZero"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Value.Modulo: "If the "other" value is exactly zero, this operation will return either
PositiveInfinity or NegativeInfinity, depending on the sign of the receiver value. For some
use-cases the presence of infinities may be undesirable, in which case the caller should check
whether the other value equals zero before calling and raise an error instead." The code has `if
other.RawEquals(Zero) { return val }`: NumberIntVal(5).Modulo(Zero) is 5 and
NumberIntVal(-5).Modulo(Zero) is -5, and stdlib.Modulo(5, 0) is 5 with no error, while
NumberIntVal(5).Divide(Zero) is +Inf as documented. Found by the number property (Modulo of
integers against big.Int with a zero divisor). Fix the code or the comment; a caller following the
comment's advice to check for the infinity will not see one.
'''
[[bug]]
id = "go-cty/9"
title = "Format's %v ignores every precision, so %.1v of \"abc\" is \"abc\" and of 3.14159 is \"3.14159\" where %.1s and %.1g give \"a\" and \"3\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFormatDefaultVerbHonoursPrecision"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Format's documentation (cty/function/stdlib/format.go): "The default format selections made by
%v are: string %s, number %g, bool %t, other %#v"; "For strings, precision limits the length of
the input to be formatted (not the size of the output), truncating if necessary"; "for %g/%G
precision sets the total number of significant digits". formatAppendAsIs, the %v path, never
reads verb.Prec: a string is written as is and a number as bf.Text('g', -1), each through
formatPadWidth only, so the width is honoured and every precision ignored. Format("%.1v",
"abc") is "abc" (want "a"), "%.2v" "abc" (want "ab"), "%.0v" "abc" (want ""), "%5.1v" "  abc"
(want "    a"), Format("%.1v", 3.14159) is "3.14159" (want "3", what %.1g gives) and "%.3v"
"3.14159" (want "3.14"), while "%.1s" gives "a", "%.1q" "\"a\"" and "%.1g" "3": formatAppendString
truncates to the precision (above 0: go-cty/6) and formatAppendNumber hands the verb to
fmt.Sprintf. The family of go-cty/6 (a precision of 0 ignored on %s) but a separate code path
and every precision, not only 0. Fix: in formatAppendAsIs, truncate a string to verb.Prec
grapheme clusters as formatAppendString does (with go-cty/6's HasPrec fix) and format a number
with bf.Text('g', verb.Prec) when HasPrec. Found by the rewrite of 2026-10-07, whose
FormatStringPrecision property draws %v beside %s (counted as candidate/go/go-cty-9, judged the
same day); the narrow property TestHegelFormatDefaultVerbPrecision draws %v with a precision of 0
to 4 and a width over strings and numbers, and the wide property TestHegelFormat names the shape
(Known.formatAsIsPrecision).
'''

[[bug]]
id = "go-cty/10"
title = "The conversion Unify hands back for a tuple it unified as a list (an object as a map) applies the second conversion to the original tuple, so it fails or panics on a value Convert converts"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnifyConversionsConvertTheirInput"
found = { commit = "a918e1174fcf2a25b7a222e7e78b00ea40ace26c", version = "v1.19.0+ (main, 2026-08-21)", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
docs/convert.md: Unify and UnifyUnsafe "return, if possible, a single target type along with a
slice of conversions corresponding to each of the input types"; a safe conversion "is
guaranteed to succeed for any value of the source type", and Convert "is equivalent to testing
for an unsafe conversion for the value's type and then immediately calling any discovered
conversion". When the types are tuples beside lists only, unify (cty/convert/unify.go) goes
through unifyTuplesAsList: it unifies the tuples' element types to one list type
(unifyTupleTypesToList), re-unifies the input with that list in place of each tuple, and when
the result is a different list type wraps the two conversions for the tuple, but the wrapper
applies the second to the ORIGINAL tuple: `out, err = tupleConv(in); ...; return listConv(in)`
(line 183) instead of `listConv(out)`. unifyObjectsAsMaps is the same code for objects beside
maps (`return mapConv(in)`, line 240). The list conversion was built for the unified list
type, so applied to the tuple it runs the element conversion built for the unified element
type on each original element: an element the first conversion had to move meets a conversion
it was not built for, and the result is an error, a panic or a value of the wrong type.
Safe mode: Unify([Tuple([Set(String), Set(Bool)]), List(List(String))]) = List(List(String))
and the tuple's conversion on TupleVal([SetVal(["1"]), SetVal([true])]) fails with "element
types must all match for conversion to list" (the Set(String) -> List(String) element
conversion is applied to the Set(Bool), giving a List(Bool) beside a List(String)), while
Convert gives [["1"], ["true"]]; the same for Unify([Tuple([Tuple([String]), Tuple([Bool])]),
List(List(Number))]) = List(List(String)) on TupleVal([TupleVal(["1"]), TupleVal([true])]).
With Tuple([Tuple([Number]), Tuple([Bool])]) beside List(List(String)) the tuples do not
unify (Number and Bool have no common type among themselves), the fallback finds the direct
conversion, the second conversion is nil and the result is right. Unsafe mode:
UnifyUnsafe([Tuple([Set(String), Set(Bool)]), List(List(Bool))]) = List(List(Bool)) and the
tuple's conversion on TupleVal([SetVal(["true"]), SetVal([true])]) PANICS "not a string"
(the String -> Bool primitive conversion, conversion_primitive.go, calls AsString on the
Bool), where Convert gives [[true], [true]]; UnifyUnsafe([Tuple([List(Number), Set(String),
List(Bool)]), List(List(Number))]) on TupleVal([ListValEmpty(Number), SetValEmpty(String),
ListVal([false])]) panics the same way through conversionCollectionToList twice. The object
twin reproduces in unsafe mode only, since the map conversion re-unifies its elements at run
time (conversionUnifyCollectionElements) and that rescues the safe form:
UnifyUnsafe([Object{a: Set(String), b: Set(Bool)}, Map(List(Bool))]) = Map(List(Bool)) and the
object's conversion on {a: SetVal(["true"]), b: SetVal([true])} panics "not a string" where
Convert gives {a: [true], b: [true]}; UnifyUnsafe([Object{a: Tuple([String]), b: Set(Bool)},
Map(List(Bool))]) = Map(List(Bool)) but the conversion gives {a: ["true"], b: ["true"]} of type
Map(List(String)); UnifyUnsafe([Object{a: List(Bool), b: Set(String)}, Map(List(String))]) on
{a: [true], b: ["a"]} fails "a bool is required" where Convert gives {a: ["true"], b: ["a"]}.
UnifyUnsafe is what HCL uses for the element types of tuple and object literals. Fix: `return
listConv(out)` and `return mapConv(out)`. Found by the Unification property of the rewrite of
2026-10-07 at 1000 cases (a tuple of two one-element tuples over different primitives beside
a list of lists, a shape reachable since the target was created but drawn rarely: it needs a
tuple whose elements unify to a list type and a list beside it that moves the element type
again); the narrow property TestHegelUnifiedTuplesConvertThroughTheirListForm draws tuples
and objects of two or three collection or tuple elements over different primitive types
beside a list (map) of lists or sets of a third, in both modes, and the wide property
TestHegelUnification names the shape (Known.unifyWrapsConvertInput, unifyWrapShape).
'''
