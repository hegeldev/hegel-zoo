# Bugs found in json-iterator/go by the Hegel zoo. Oracle: the standard library's encoding/json, which
# ConfigCompatibleWithStandardLibrary promises "100% compatibility" with.

[[bug]]
id = "json-iterator/1"
title = "MarshalIndent panics (\"indent can only be space\") on an indent that is not made of spaces, such as a tab"
kind = "panic"
severity = "medium"
test = "TestHegelPinIndentMayBeAnyString"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json accepts any indent string. `MarshalIndent(v, "", "\t")` (the most common indent
after spaces) and `MarshalIndent(v, "", "xx")` panic in frozenConfig.MarshalIndent, which
counts the indent's bytes and refuses anything but ' '. The prefix argument panics too
("prefix is not supported"), but that one is documented on the function.
'''

[[bug]]
id = "json-iterator/2"
title = "Encoder.SetIndent replaces the indent string with len(indent) spaces: a tab indent produces one space"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEncoderSetIndentKeepsTheIndentString"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The adapter stores only `IndentionStep = len(indent)`, so `SetIndent("", "\t")` indents with one
space and `SetIndent("", "xx")` with two; encoding/json writes the string given.
'''

[[bug]]
id = "json-iterator/3"
title = "MarshalIndent writes an empty map as \"{\\n \\n}\" instead of \"{}\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyMapIndentsAsBraces"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`MarshalIndent(map[string]int{}, "", " ")` gives "{\n \n}" (a line holding only the indent);
encoding/json gives "{}", as json-iterator itself does for an empty slice or struct.
'''

[[bug]]
id = "json-iterator/4"
title = "MarshalIndent with an empty indent string produces compact output instead of one element per line"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyIndentStillBreaksLines"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json's `MarshalIndent(v, "", "")` still breaks lines and puts a space after each colon
("{\n\"a\": []\n}"); json-iterator treats an indent of length 0 as "no indentation" and returns
the compact form.
'''

[[bug]]
id = "json-iterator/5"
title = "MarshalIndent does not indent containers that are map values one level deeper than the key"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMapValuesIndentNested"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`MarshalIndent(map[string][]int{"k": {1}}, "", " ")` gives "{\n \"k\": [\n 1\n]\n}": the array's
element and closing bracket sit at the key's level, where encoding/json puts them one indent
deeper ("{\n \"k\": [\n  1\n ]\n}"). The same for a map value that is a map or a struct, and for
maps with integer or TextMarshaler keys; slices, arrays and struct fields nest correctly.
'''

[[bug]]
id = "json-iterator/6"
title = "Valid checks only the first value and reports true for `1 2`, `[1]]`, `truex` and `{} }`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinValidRejectsTrailingBytes"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
frozenConfig.Valid is `iter.Skip(); return iter.Error == nil`: it skips one value and never
looks at what follows, so any text that starts with a valid value is "valid". encoding/json's
Valid (and json-iterator's own Unmarshal, which reports "there are bytes left after unmarshal")
reject them.
'''

[[bug]]
id = "json-iterator/7"
title = "Valid rejects every bare top-level number (`0`, `1`, `-1`, `1.5`, `1e5`) that Unmarshal accepts, unless whitespace follows it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinValidAcceptsTopLevelNumbers"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`Valid([]byte("-1"))`, `Valid([]byte("1.5"))`, `Valid([]byte("1e5"))` and `Valid([]byte(" 1E+2"))`
are false, and so are `Valid([]byte("0"))`, `Valid([]byte("1"))` and `Valid([]byte("10"))`: no
bare number passes at top level unless whitespace follows it (`Valid([]byte("10 "))` is true).
Inside an array or object the same literals are accepted, and Unmarshal decodes all of them.
trySkipNumber reaches the end of the buffer without a terminator and hands over to the float
reader, which fails at end of input in this context. (The unsigned-integer cases were found by
the narrow property on 2026-09-26 and reproduced standalone; the first notes said unsigned
integers pass.)
'''

[[bug]]
id = "json-iterator/8"
title = "Valid rejects in-range numbers with a `0.` mantissa and an exponent of 39 or more (`[0.25e40]`, `[0.1e60]`)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidAcceptsSmallMantissaLargeExponent"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
A literal whose integer part is 0 and whose value exceeds float32 range (0.25e40 = 2.5e39,
0.5e39, 0.1e60) is rejected by Valid inside any container while Unmarshal decodes it correctly
and encoding/json's Valid accepts it; 1.5e56 and 10.25e56 pass, 0.25e39 passes. Found by the
Valid property; the boundary (3.4e38) points at a float32 path in the number skipper.
'''

[[bug]]
id = "json-iterator/9"
title = "Valid rejects syntactically valid numbers outside float64 range (`[1e400]`), which encoding/json accepts"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidAcceptsNumbersOutOfFloat64Range"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Valid is about syntax: encoding/json's Valid accepts `[1e400]` and `[-2e308]` (Unmarshal into a
float64 then fails with a range error). json-iterator's Valid parses the number as a float and
reports the range error as invalid syntax.
'''

[[bug]]
id = "json-iterator/31"
title = "Valid accepts a negative number with leading zeros or no integer digit (`[-00]`, `[-01]`, `[-.5]`) that Unmarshal rejects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidRejectsNegativeLeadingZeros"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`[00]`, `[01]` and `[.5]` are rejected by Valid, as they should be, but with a minus sign in front
(`[-00]`, `[-01]`, `[-.5]`, `[-00.5]`, `{"a":-00}`) Valid returns true; encoding/json's Valid and
json-iterator's own Unmarshal reject them. The number skipper's leading-zero check runs only on
the first byte and the sign is that byte. Found by the Valid property's mutations (a `0` inserted
after `-0`).
'''

[[bug]]
id = "json-iterator/32"
title = "Raw control characters inside a string are accepted by Valid and Unmarshal once the string also contains an escape"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRawControlCharactersAfterAnEscapeAreRejected"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
A string with an unescaped byte below 0x20 is invalid JSON, and json-iterator's fast path
rejects `"\tb"`. But as soon as the string contains a backslash escape before the control
character — `"a\nb<TAB>c"`, `["A<0x01>"]`, `"\"<0x00>"` — the slow path (readStringSlowPath,
used by Valid, Unmarshal into interface{}, the Decoder and struct fields alike) copies the raw
byte into the value and reports no error; encoding/json rejects all of them ("invalid character
'\t' in string"). Found by the Valid property (a tab inserted into a string holding an escape).
'''

[[bug]]
id = "json-iterator/10"
title = "Decoder.Decode at the end of the stream returns a syntax error instead of io.EOF when whitespace follows the last value"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDecoderReturnsEOFAtTheEnd"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The usual loop `for { if err := dec.Decode(&v); err == io.EOF { break } ... }` works with
encoding/json on "1\n" or "[1]\n{}\n": after the last value Decode returns io.EOF. json-iterator's
Decoder returns io.EOF only when its buffer is empty *and* the reader has nothing more; with a
trailing newline the buffer still holds the whitespace, ReadVal finds no value and the error is
"Read: unexpected value type: 0". Without trailing whitespace ("1") the second Decode returns
"readNumberAsString: invalid number" and only the third returns io.EOF. Every newline-terminated
stream (a file of JSON lines) hits this.
'''

[[bug]]
id = "json-iterator/11"
title = "Decoder.Decode into a RawMessage preceded by whitespace returns the wrong bytes (` 12` gives `12 `)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDecoderRawMessageLeadingWhitespace"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`NewDecoder(strings.NewReader(" 12")).Decode(&raw)` sets raw to "12 " and "\n[1]" gives "[1]\n":
SkipAndReturnBytes measures the value's length from the first non-blank byte but copies from
the position before the whitespace was skipped, so the raw bytes are shifted by the amount of
leading whitespace. Unmarshal (no reader) is not affected; encoding/json returns "12".
'''

[[bug]]
id = "json-iterator/12"
title = "An invalid RawMessage is marshalled as `null` (or copied through) with a nil error, even with ValidateJsonRawMessage on"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInvalidRawMessageIsAnError"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json returns an error for a RawMessage holding "[1," or "  " or "1 2".
ConfigCompatibleWithStandardLibrary sets ValidateJsonRawMessage, whose extension replaces a
RawMessage that fails Valid by `null` silently — so a truncated raw message becomes null in the
output with no error — and Valid itself accepts "1 2" (json-iterator/6), which is then copied
into the output verbatim, producing invalid JSON.
'''

[[bug]]
id = "json-iterator/13"
title = "Marshal of an invalid json.Number (\"abc\", \"01\", \"-\") writes it verbatim, producing invalid JSON with a nil error"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInvalidNumberLiteralIsAnError"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json validates a Number's literal and returns an error for anything that is not a JSON
number. json-iterator's Number encoder calls WriteRaw on the string, so `Marshal(json.Number("abc"))`
returns `abc` and a struct with such a field encodes to `{"N":abc}`.
'''

[[bug]]
id = "json-iterator/14"
title = "Marshaler and RawMessage output is copied verbatim: neither compacted, HTML-escaped nor re-indented by MarshalIndent"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMarshalerOutputIsCompacted"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json compacts the bytes a MarshalJSON method or a RawMessage provides (and re-indents
them under MarshalIndent). json-iterator writes them as they are: a RawMessage "\n [1,\t2] " and a
Marshaler returning " { \"v\" : 3 } " appear with their whitespace in Marshal's output, and under
MarshalIndent a Marshaler's compact `{"v":3}` stays on one line where encoding/json spreads it.
With HTML escaping on (the default), encoding/json also escapes `<`, `>` and `&` inside the
raw bytes (`"<"`); json-iterator leaves them (`"<"`).
'''

[[bug]]
id = "json-iterator/15"
title = "Invalid UTF-8 in a Go string is encoded as the escape `\\ufffd`, where encoding/json writes the raw U+FFFD bytes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInvalidUTF8IsWrittenAsRawReplacementCharacters"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`Marshal("a\xffb")` gives `"a\ufffdb"` (six-character escape); encoding/json gives `"a<U+FFFD>b"`
with the replacement character's three UTF-8 bytes. Both decode to the same string; the output
bytes differ, and json-iterator does not document the choice (goccy/go-json does, under its
DisableNormalizeUTF8 option).
'''

[[bug]]
id = "json-iterator/16"
title = "U+0008 and U+000C are written as `\\u0008` and `\\u000c` instead of encoding/json's `\\b` and `\\f`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBackspaceAndFormFeedUseShortEscapes"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json (since Go 1.22) writes the short escapes for backspace and form feed, as for
\n, \r and \t; json-iterator writes the four-hex-digit form for those two only.
'''

[[bug]]
id = "json-iterator/17"
title = "A map with bool keys is encoded as {\"true\":1} instead of returning an unsupported-type error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBoolMapKeysAreUnsupported"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json's map keys must be strings, integers or TextMarshalers; `Marshal(map[bool]int{true: 1})`
is an UnsupportedTypeError in the classic implementation and an error in Go 1.27's. json-iterator
encodes the key with its bool encoder and returns `{"true":1}`.
'''

[[bug]]
id = "json-iterator/18"
title = "The `,string` tag option is applied to slices and nil pointers (`\"[1]\"`, `\"null\"`), where encoding/json ignores it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringOptionOnlyAppliesToScalars"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The option is defined for strings, floats, integers and booleans only; encoding/json encodes a
`[]int` field tagged `,string` as `[1]` and a nil `*int` as `null`. json-iterator wraps whatever
the field encodes to in quotes: `"[1]"` and `"null"`.
'''

[[bug]]
id = "json-iterator/19"
title = "A NUL byte after a value ends the input: Valid and Unmarshal accept `1\\x00garbage`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNulByteDoesNotTerminateTheInput"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The iterator uses a byte value of 0 as its end-of-input marker, so a NUL byte in the data reads
as the end: `Valid([]byte("1\x00garbage"))` is true and Unmarshal decodes 1 with no error,
likewise `[1]\x00x`, `{}\x00{` and `true\x00false`. encoding/json rejects all of them
("invalid character '\x00' after top-level value"). Anything that treats "Valid says yes" as
"the whole buffer is one JSON document" is misled by a single embedded zero byte.
'''

[[bug]]
id = "json-iterator/20"
title = "Invalid UTF-8 inside an input string is passed through unchanged instead of being replaced by U+FFFD"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInvalidUTF8InputIsReplaced"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json documents that invalid UTF-8 in a quoted string is replaced by the Unicode
replacement character when unmarshaling. json-iterator copies the bytes: `"a\xffb"` decodes to
the invalid Go string "a\xffb" (and `{"\xff":1}` to a map with an invalid key), which then
re-encodes differently (json-iterator/15).
'''

[[bug]]
id = "json-iterator/21"
title = "A lone surrogate escape followed by a valid surrogate pair decodes the pair as two more replacement characters"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLoneSurrogateBeforeAPair"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`"\udc00\udbff\udfff"` decodes in encoding/json to U+FFFD followed by U+10FFFF (the lone low
surrogate is replaced, the pair that follows is combined). json-iterator gives three U+FFFD:
after the lone surrogate it consumes the pair's high half as another lone one and the low half
as a third. `"\ud800\ud800\udc00"` likewise loses the valid pair.
'''

[[bug]]
id = "json-iterator/22"
title = "`null` into a string, a `,string` string or a json.Number clears the field, where encoding/json leaves it unchanged"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNullIntoStringKindsIsANoOp"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json documents `null` as a no-op for anything but interfaces, maps, pointers and slices.
Unmarshaling `{"s":null,"ss":null,"n":null}` into a prefilled struct with `S string`,
`SS string `json:",string"`` and `N json.Number` sets all three to "" in json-iterator.
Numbers, bools, floats, arrays and structs are left alone as they should be.
'''

[[bug]]
id = "json-iterator/23"
title = "`null` into a value implementing TextUnmarshaler calls UnmarshalText with an empty input instead of being a no-op"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNullIntoTextUnmarshalerIsANoOp"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
For a non-pointer field whose type implements encoding.TextUnmarshaler, encoding/json treats
`null` as a no-op and never calls the method. json-iterator's textUnmarshalerDecoder reads the
value as a string (null reads as "") and calls UnmarshalText([]byte("")), so any type that
rejects the empty text (an ID, a UUID, an enum) turns `{"id":null}` into a decoding error, and
one that accepts it has its value replaced by the zero text.
'''

[[bug]]
id = "json-iterator/24"
title = "`null` into a RawMessage field stores nil instead of the bytes `null`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNullIntoRawMessageKeepsTheLiteral"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json gives a RawMessage the literal bytes of the value, `null` included, so the field
is non-nil and a later Marshal writes `"r":null` again. json-iterator's RawMessage decoder maps
`null` to a nil slice; with `omitempty` the field then disappears on re-encoding, and code that
distinguishes "absent" from "explicitly null" through a RawMessage cannot.
'''

[[bug]]
id = "json-iterator/25"
title = "A type error zeroes the target field (300 into int8 leaves 0), where encoding/json leaves it unchanged"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTypeErrorLeavesTheFieldUnchanged"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Both libraries report an error for `{"I":300,"S":5}` into `struct{ I int8; S string }`; encoding/json
leaves the prefilled I and S as they were, json-iterator writes the zero value into each field it
failed on (the partially read integer, the empty string).
'''

[[bug]]
id = "json-iterator/26"
title = "Unmarshal stops at the first type error and leaves the remaining fields undecoded, where encoding/json decodes the rest"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnmarshalKeepsGoingAfterATypeError"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json's documented behaviour for an UnmarshalTypeError is to skip the offending field,
keep going and return the first such error at the end: `{"I":true,"S":"after"}` into
`struct{ I int; S string }` sets S. json-iterator returns at the first error with S untouched.
'''

[[bug]]
id = "json-iterator/27"
title = "A JSON array shorter than the Go array leaves the remaining elements unchanged instead of zeroing them"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinShortArrayZeroesTheRest"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json: "if the JSON array is smaller than the Go array, the additional Go array elements
are set to zero values". `[9]` into a prefilled [3]int16{1, 2, 3} gives [9 0 0] there and [9 2 3]
in json-iterator.
'''

[[bug]]
id = "json-iterator/28"
title = "The `,string` option is lenient on decoding: `\" 5\"` into an int is accepted and `\"5\"` into a string yields \"\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringOptionIsStrict"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json requires the quoted content to be exactly a JSON literal of the field's type: a
leading blank in `{"is":" 5"}` is an error, and `{"ss":"5"}` (the content is not a quoted string) is
an error. json-iterator skips the blank and decodes 5, and decodes the second as the empty string
with no error.
'''

[[bug]]
id = "json-iterator/29"
title = "Unmarshal accepts a quoted string that is not a number into json.Number (\"abc\", \"\", \"01\")"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInvalidNumberStringsAreRejected"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json validates the string with its number grammar and rejects `{"n":"abc"}`, `{"n":""}`
and `{"n":"01"}`. json-iterator stores the string as the Number, and Marshal then writes it
verbatim (json-iterator/13): invalid input becomes invalid output with no error at either end.
'''

[[bug]]
id = "json-iterator/30"
title = "`,string` numbers and integer map keys are read without unescaping: `\"7\\u00344\"` and the key `\"\\u00396\"` are rejected"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringOptionAndIntegerKeysAreUnescaped"
found = { commit = "71ac16282d122fdd1e3a6d3e7f79b79b4cc3b50e", version = "v1.1.12+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json decodes the string first, so `{"is":"7\u00344"}` into an int tagged `,string` is 744
and `{"\u00396":"x"}` into a map[int32]string has the key 96. json-iterator's stringModeNumberDecoder
and integer key decoders read the digits straight out of the quoted text and fail at the
backslash ("expect \", but found \"). TextUnmarshaler keys and Number fields unescape correctly.
'''
