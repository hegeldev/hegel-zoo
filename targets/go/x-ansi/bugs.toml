id = "x-ansi/2"
title = "A CSI sequence with exactly as many parameters as the buffer loses its last one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinParameterBufferSizedSequence"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
32 parameters (`parser.MaxParamsSize`) in, 31 reported — by `DecodeSequence` and by
`Parser.Advance` alike, while 33 parameters give 32 through the Parser. Both count the last
parameter at the final byte with `p.paramsLen > 0 && p.paramsLen < len(p.params)-1`
(parser_decode.go IntermedState, parser.go `DispatchAction`): when the last parameter sits in
the last slot, `paramsLen` is `len-1` and is not incremented, so `Params()` stops one short.
The guard should be `< len(p.params)`.
'''

