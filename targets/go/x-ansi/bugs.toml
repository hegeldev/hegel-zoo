[[bug]]
id = "x-ansi/5"
title = "A grapheme cluster that starts with an ASCII character is split off after its first byte, so Truncate returns a keycap wider than the length"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinClustersStartingWithASCII"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`DecodeSequence("é")` returns "e" (width 1) and then the combining acute (width 0);
`DecodeSequence("1️⃣")` returns "1" though the keycap sequence is one grapheme of
width 2 (`StringWidth` = 2, displaywidth agrees), against the documentation ("decodes the
first ANSI escape sequence or a printable grapheme"). parser_decode.go NormalState returns
`b[i:i+1], 1, 1` for any byte in 0x21–0x7E before clustering; truncate.go takes the same
shortcut (`PrintAction` counts one cell, the rest of the cluster is then measured on its own,
where VS16 + U+20E3 is 0 wide). Consequence: `Truncate("1️⃣x", 1, "")` =
"1️⃣" (2 cells) and `Truncate(…, 2, "")` = "1️⃣x" (3 cells) — the result
is wider than the length, the invariant #541 reports for other inputs. `StringWidth` itself
clusters from the ASCII byte (`FirstGraphemeCluster(s[i:])`) and is right. Fix: cluster from
every printable byte, as `stringWidth` does, or at least in `truncate`.
'''

