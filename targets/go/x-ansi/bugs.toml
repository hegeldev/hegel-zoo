[[bug]]
id = "x-ansi/21"
title = "Whitespace followed by an escape sequence is flushed past the limit by Wordwrap and Wrap"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWhitespaceBeforeASequence"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Wordwrap("ab \x1b[1m", 2, "")` = "ab \x1b[1m" (3 cells); `Wrap("a  \x1b[m ", 2, "")` = "a  \x1b[m"
(3 cells). Both wrappers put escape sequences in the word buffer (`default: word.WriteByte`),
and `addWord` flushes the pending whitespace with `addSpace()` whenever the buffer is
non-empty — even when it holds only a sequence and `wordLen` is 0 — without checking the
limit. `Wordwrap` hits it at the end of the text (its final `addWord()` has no trailing-space
check; `wrap` has one, but its `wordLen == 0` test passes and it still calls `addWord`), `Wrap`
when another space follows the sequence. Trailing whitespace before a reset sequence is the
common shape (`"text \x1b[0m"`).
'''

