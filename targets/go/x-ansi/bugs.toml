`wordwrap`, the breakpoint case: `addSpace(); addWord(); buf.WriteByte(b[i]); curWidth++` —
the word before the hyphen is flushed and the hyphen written whatever `curWidth` is; only
the next word triggers a newline. `Wrap` has a check here (with its own defect, x-ansi/8).
Fix: when `curWidth+space.Len()+wordLen+1 > limit`, start a new line before the word.
'''

