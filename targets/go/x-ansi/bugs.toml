notes = '''
`XParseColor("rgb:f/f/f")` = (15, 15, 15) and `XParseColor("rgb:fff/fff/fff")` = (15, 15, 15)
— both are white in X11 (`rgb:` components of 1–4 hex digits are fractions of 4, 8, 12 or 16
bits); `XParseColor("rgb:1/2/3")` = (1, 2, 3) instead of (0x11, 0x22, 0x33); only two-digit
