[[bug]]
id = "x-ansi/4"
title = "A private marker after the parameters: the Parser dispatches the sequence, DecodeSequence rejects it and prints the rest"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPrivateMarkerAfterParameters"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
"\x1b[1?mx": `Parser.Advance` reports `CSI m [1]` then prints "x"; `DecodeSequence` returns
"\x1b[1" (3 bytes, command 0) and then decodes "?", "m", "x" as text. ECMA-48 puts the
private marker before the parameters only; the VT500 state machine ignores the whole
sequence (CsiIgnore) when one appears later, and the transition table here has no ignore
state, so the Parser accepts it silently while the decoder rejects it and leaks "?m" to the
screen. The two parsers should agree, and neither should print sequence bytes.
'''

