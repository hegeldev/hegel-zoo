title = "With two private markers the Parser keeps the first and DecodeSequence the last"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTwoPrivateMarkers"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
"\x1b[=>1P": `DecodeSequence` reports prefix '>' (parser_decode.go: "We only collect the last
prefix character"), `Parser.Advance` reports '=' (parser.go `PrefixAction`: "we only store the
last prefix" — but the transition table has no prefix action in CsiParamState, so the second
marker is ignored). ECMA-48 allows one private marker; either way the two parsers, and the
Parser's own comment, should agree.
'''

