date = "2026-09-20"
result = "reproduces"
[[bug]]
id = "x-ansi/22"
title = "MouseX10 encodes the payload bytes as runes: coordinates from 95 upwards become two UTF-8 bytes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMouseX10EncodesBytesAsRunes"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`MouseX10(b, x, y)` returns `"\x1b[M" + string(b+x10Offset) + string(byte(x)+x10Offset+1) +
string(byte(y)+x10Offset+1)`. In Go `string(byte)` is a rune conversion, so a byte of 0x80 or
more is encoded as two UTF-8 bytes: `MouseX10(0, 100, 0)` is 7 bytes (`\x1b[M \xc2\x85!`) where
the X10 protocol requires exactly three payload bytes (`CSI M Cb Cx Cy`, each 32 + value). Any
coordinate >= 95, and any button byte with the wheel (64) or extra-button (128) bit plus
modifiers, is mis-encoded; a terminal emulator or a parser reading three bytes (x/input's
does) gets the wrong cell and swallows the next byte of input. Found while using the function
as the oracle for `go/x-input`'s X10 mouse decoding.
'''

[[bug.observed]]
