# Bugs found in charmbracelet/x/ansi by the Hegel properties. Each is pinned by the test named
# in `test`, listed as an expected failure in target.toml.

[[bug]]
id = "x-ansi/1"
title = "DecodeSequence panics on a CSI sequence with more parameters than the parser's buffer"
kind = "panic"
severity = "high"
test = "TestHegelPinDecodeSequenceWithManyParameters"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`ansi.DecodeSequence([]byte("\x1b[1;1;…;1m"), 0, ansi.NewParser())` with 33 parameters
(the default buffer holds 32) panics with "index out of range [32] with length 32".
parser_decode.go, `decodeSequence`, ParamsState: on a digit it reads and writes
`p.params[p.paramsLen]` without the `p.paramsLen >= len(p.params)` guard that
`Parser.performAction` has for `ParamAction`; the ';' branch only guards the store after the
increment, so `paramsLen` reaches `len(params)` and the next digit indexes past the buffer.
Any program that decodes untrusted terminal output with a parser attached (the documented
use) can be crashed by a 40-byte sequence. `Parser.Advance` on the same input keeps 32
parameters and drops the rest. Fix: return early (or stop collecting) when `p.paramsLen >=
len(p.params)`, as the state-machine parser does.
'''

