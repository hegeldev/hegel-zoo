id = "x-ansi/10"
title = "Wordwrap never moves a word as wide as the limit to its own line, so one leading cell makes the line overflow"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWordwrapWordAsWideAsTheLimit"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Wordwrap(" cdefg", 5, "")` = " cdefg" (6 cells); `Wordwrap("a-bcdef", 5, "")` = "a-bcdef" (7).
wrap.go `wordwrap`: the newline condition is `curWidth+space.Len()+wordLen > limit &&
wordLen < limit`, checked as each character joins the word, so a word that first overflows
when it is exactly `limit` wide (the line held one cell before it) is never wrapped, though
it would fit on a line of its own. A word wider than the limit cannot fit anywhere; one
exactly as wide can. Fix: `wordLen <= limit`.
'''

