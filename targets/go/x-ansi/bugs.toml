[[bug]]
id = "x-ansi/3"
title = "A 0x9C byte inside a UTF-8 character terminates an OSC, DCS, SOS, PM or APC string"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinControlStringWithUTF8ContainingST"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
upstream_issue = "https://github.com/charmbracelet/x/issues/848"
notes = '''
"Ü" is C3 9C and "✳" is E2 9C B3. `DecodeSequence("\x1b]2;Ü\x07")` returns the six bytes up to
and including the 0x9C as the sequence (data "2;\xc3"), then BEL as a control;
`Strip("\x1b]2;Ü\x07")` = "\a", `StringWidth` counts the leftover; `Parser.Advance` reports
`osc 2 "2;\xc3"` and executes the BEL. parser_decode.go StringState `case ST` and the
transition table's `AddOne(0x9C, OscStringState, DispatchAction, …)` (and the DCS/SOS/PM/APC
equivalents) treat the byte as the 8-bit String Terminator wherever it appears, although the
same table lets the string collect UTF-8 (0x80–0xFF are Put). A title, hyperlink or DCS payload
with any character whose UTF-8 has a 0x9C continuation byte is cut in two and the remainder is
printed as text. Reported upstream as #848 (open). Fix: track UTF-8 sequences in the string
states (consume continuation bytes 0x80–0xBF after a lead byte without a transition).
'''

