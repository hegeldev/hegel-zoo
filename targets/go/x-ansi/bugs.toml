[[bug]]
id = "x-ansi/8"
title = "Wrap writes a breakpoint, and the whitespace before it, onto a full line"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWrapBreakpointOnAFullLine"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.11.8+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
upstream_issue = "https://github.com/charmbracelet/x/issues/785"
notes = '''
`Wrap("ab-", 2, "")` = "ab-" (3 cells); `Wrap("foo bar, fo", 7, ",")` = "foo bar,\nfo" (8);
`Wrap("a-b", 1, "")` = "a\n\n-b" (an empty line, then 2 cells); `Wrap("a  0b", 1, "0")` puts
"a  " (3 cells) on the first line. wrap.go `wrap`, the breakpoint case: `addSpace()` flushes
the pending whitespace without a limit check, and when `curWidth+wordLen >= limit` the
breakpoint is appended to the word buffer, which is then written by `addWord` at the end or
at the next break without ever wrapping. #785 (open) reports the "foo bar, fo" case; the
same code path also lets the whitespace overflow. Fix: treat a breakpoint like a word
character for the limit check (break before it when it does not fit) and drop or wrap the
pending whitespace with it.
'''

