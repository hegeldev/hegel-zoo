# Bugs found in golang.org/x/net/html (golang/net v0.59.0+) by the Hegel zoo. One [[bug]] per
# finding; `test` names the plain Go test in html/hegel/hegel_pins_test.go that fails while the bug
# exists (listed under [expected_failures] in target.toml). Oracles: parse5 8.0.1 (node) and
# html5lib 1.1 (python) on generated HTML, compared in the html5lib-tests .dat format by vote
# (x/net/html alone against two agreeing oracles is a mismatch), the `entities` package for
# character references, and x/net/html's own promises (Render round trips, Tokenizer.Raw, chunked
# reads). No AI policy (CONTRIBUTING.md points to go.dev/doc/contribute; checked 2026-09-19).

[[bug]]
id = "x-net/1"
title = "character references inside comments are decoded, so <!--&amp;--> and <!--&--> give the same tree and Render escapes every & in a comment"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommentDataIsNotUnescaped"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Tokenizer.Text unescapes the data of comment tokens as it does text tokens (token.go: `if
!z.textIsRaw { s = unescape(s, false) }` runs for CommentToken too), so Parse gives a comment
node with Data "&" for `<!--&amp;-->` and "\r" for `<!--&#13;-->`. The specification's comment
states never consume character references: browsers, parse5 and html5lib all keep "&amp;". The
tree is lossy (`<!--&amp;-->` and `<!--&-->` parse alike) and not what any other HTML parser
builds; to round-trip its own decoding, Render escapes every "&" of a comment as "&amp;"
(escape.go escapeComment), so a comment holding a literal "&amp;" comes out as "&amp;amp;". A
comment holding "&#13;" decodes to a carriage return, is rendered raw and re-parses as a
newline (a Render round trip that changes the tree). Found by the parse and fragment
properties on almost every document with a character reference inside a comment.
'''

[[bug]]
id = "x-net/2"
title = "a NUL in a doctype's name, public or system identifier is kept instead of becoming U+FFFD"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDoctypeNulBecomesReplacementCharacter"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`<!DOCTYPE html\x00 PUBLIC "a\x00b">` gives a DoctypeNode with Data "html\x00" and a public id
"a\x00b". The DOCTYPE name, public identifier and system identifier states each say "U+0000
NULL: parse error, append a U+FFFD REPLACEMENT CHARACTER" (both oracles print `<!DOCTYPE html�
"a�b" "">`). The tokenizer's NUL replacement (convertNUL) covers text and comments but the
doctype path (parseDoctype in doctype.go) reads the raw bytes.
'''

[[bug]]
id = "x-net/3"
title = "the empty end tag </> becomes an empty comment node (and splits the surrounding text) instead of being ignored"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyEndTagIsIgnored"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse("a</>b") gives body > "a", <!-- -->, "b"; the end tag open state says "U+003E (>):
missing-end-tag-name parse error, switch to the data state" - nothing is emitted, and browsers
and both oracles give one text node "ab". The tokenizer reaches its bogus comment path for
"</>" (which is right for "</3>" and "</ x>", where a bogus comment is what the specification
wants). The phantom comment also splits an otherwise single text node and is rendered as
"<!---->" by Render.
'''

[[bug]]
id = "x-net/4"
title = "ParseFragment in an SVG or MathML context returns a nil pointer dereference for content after </html>"
kind = "crash"
severity = "medium"
test = "TestHegelPinForeignFragmentAfterHtmlEndTag"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseFragment(strings.NewReader("</html>y"), &Node{Type: ElementNode, Data: "svg", Namespace:
"svg"}) returns the error "runtime error: invalid memory address or nil pointer dereference"
(the parser recovers the panic into its error). Any foreign context (svg, path, foreignObject,
desc, math, mi, annotation-xml...) and any content after the </html> end tag (text, a tag)
does it; "</html>" alone or "</body>y" does not. The </html> end tag in foreign content is
processed by the in-body rules, which move the parser to the "after after body" mode; the
following token sends it back to "in body" with an empty stack of open elements, and the
insertion dereferences a nil current node. parse5 and html5lib give the text node "y" (the end
tag is ignored). A fragment of markup parsed in an SVG context is what a templating layer does
for inline SVG; the input is attacker-reachable in a sanitizer.
'''

[[bug]]
id = "x-net/5"
title = "a script, style, title, textarea, xmp, iframe, noembed, noframes or plaintext start tag ignored by the frameset insertion modes still switches the tokenizer, swallowing what follows"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIgnoredRawTextTagInFrameset"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse("<frameset><iframe><!--x-->") gives an empty frameset; the "in frameset" mode ignores
the iframe start tag ("anything else: parse error, ignore the token"), so the tokenizer must
stay in the data state and the comment is inserted into the frameset (parse5, html5lib and
browsers: frameset > <!-- x -->). x/net/html's tokenizer switches to raw text / RCDATA /
plaintext on the start tag itself; the parser calls NextIsNotRawText when it ignores such a tag
in the other insertion modes but not in inFramesetIM or afterFramesetIM, so everything up to
the matching end tag (or the end of the input for plaintext) is read as text, which those
modes drop. A fragment parsed in a frameset context has the same fault.
'''

[[bug]]
id = "x-net/6"
title = "Render fails with an error on a parsed tree holding an SVG or MathML element named like a void element (input, wbr, keygen...) with children"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRenderForeignElementNamedLikeVoid"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse("<svg><input>x") gives svg > <svg input> > "x" (input is not one of the tags that break
out of foreign content, so it is an SVG element and takes children); Render of that tree
returns "html: void element <input> has child nodes" and writes a truncated document. render.go
checks voidElements[n.Data] without looking at n.Namespace; the specification's serialization
algorithm treats an element as void only in the HTML namespace. Same for wbr, keygen, area,
base, col, link, param, source and track inside svg or math (br, embed, hr, img and meta are
different: they break out of foreign content, so `<svg><br>x` gives an HTML br). Any program
that parses untrusted HTML and renders it back can be made to fail.
'''

[[bug]]
id = "x-net/7"
title = "character references inside a CDATA section in foreign content are decoded"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCDATAKeepsCharacterReferences"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse("<math><![CDATA[&amp;&#65;]]></math>") gives a text node "&A" under math; the CDATA
section states emit the characters literally, so browsers and both oracles give "&amp;&#65;".
The tokenizer emits the CDATA content as a text token and Tokenizer.Text unescapes every text
token that is not raw text. Same in SVG and in fragments parsed in a foreign context.
'''

[[bug]]
id = "x-net/8"
title = "a text token mixing whitespace and other characters is handled whole in the head-noscript and column-group modes, misplacing or dropping the whitespace"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNoscriptKeepsLeadingWhitespace"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With scripting disabled, ParseWithOptions("<noscript>\tx</noscript>") puts the tab after the
noscript element (head > noscript, "\t"; body > "x") where the "in head noscript" mode inserts
the whitespace character into the noscript and reprocesses only "x" (parse5, html5lib: head >
noscript > "\t"). inHeadNoscriptIM looks at the whole token: TrimLeft leaves "x", so the
token is treated as "anything else" and the tab travels with it. Also pinned
(TestHegelPinColumnGroupContextKeepsWhitespace): ParseFragment("<col>x  ", colgroup context)
drops the two spaces that the "in column group" mode inserts after ignoring "x" (parse5:
<col>, "  "). The other modes (in head, in body, in table) split the token as the specification
processes characters one by one.
'''

[[bug]]
id = "x-net/9"
title = "Render escapes the text of a script, style, xmp or other raw text element inside a MathML text integration point (mtext, mi, mo, mn, ms)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRenderRawTextInMathTextIntegrationPoint"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse("<math><mtext><style>a>b</style></mtext></math>") gives an HTML style element (mtext is
a MathML text integration point, so start tags inside it are processed by the HTML rules)
with the text "a>b"; Render writes `<style>a&gt;b</style>`, which parses back to a style
holding "a&gt;b" literally. childTextNodesAreLiteral (render.go) walks up to the nearest
element with a namespace and accepts only HTML integration points (foreignObject, desc, title,
annotation-xml with an HTML encoding) as legitimate parents of HTML content, not the MathML
text integration points, so the style is taken for a foreign element whose text must be
escaped. The same tree through the specification's serialization algorithm gives
`<style>a>b</style>`.
'''

[[bug]]
id = "x-net/10"
title = "a fragment parsed in a title, textarea, script, style or other raw text context ends its text at an end tag of the context's name, though no start tag was emitted"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRCDATAContextIgnoresItsOwnEndTag"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseFragment("a</title>b", title context) gives the text node "ab" (the end tag is consumed
and the text around it merged); the RCDATA end tag name state switches back to the data state only for an
"appropriate end tag token", one "whose tag name matches the tag name of the last start tag to
have been emitted from this tokenizer, if any. If no start tag has been emitted, then no end
tag is appropriate", so in a fragment the whole input is one text node "a</title>b" (parse5,
html5lib, and `title.innerHTML = "a</title>b"` in a browser). x/net/html's tokenizer compares
the end tag with the raw tag the parser set from the context element (rawTag) rather than with
a start tag it emitted.
'''

[[bug]]
id = "x-net/11"
title = "a carriage return from a character reference right after a pre, listing or textarea start tag is dropped like a leading newline"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCarriageReturnReferenceAfterPre"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse("<pre>&#xD;x</pre>") gives pre > "x"; the pre/listing rule ignores "the next token" if it
is a U+000A LINE FEED character token. A raw CR or CRLF in the input is normalized to LF by the
input stream preprocessing (so `<pre>\r\nx` rightly loses it), but a character reference
produces a U+000D character token, which is not a LINE FEED: parse5 and html5lib give pre >
"\rx". inBodyIM strips a leading '\r' as well as a leading '\n' from the first text token after
pre/listing, covering the raw CR case the tokenizer has already converted and catching the
decoded one.
'''

[[bug]]
id = "x-net/12"
title = "an attribute whose name holds a NUL is checked for duplicates before the NUL becomes U+FFFD, so an element can carry two attributes of the same name"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNulAttributeNameIsDeduplicated"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parse of `<a \x00="1" �="2">` gives an <a> with two attributes both named "�" (the
NUL in the first name becomes U+FFFD, as the attribute name state requires); the second is a
duplicate and the specification drops it ("duplicate-attribute parse error; the new attribute
must be removed from the token"), so parse5 and html5lib give one attribute, `�="1"`.
x/net/html compares the names as read and replaces the NUL afterwards. Two attributes of one
name cannot exist in a DOM; Render writes both and the rendering parses back to one - a Render
round trip that changes the tree, which is how the random-seed run found it.
'''

[[bug]]
id = "x-net/13"
title = "idna: a label that is the bare ACE prefix xn-- is accepted by the lookup profiles and becomes an empty label"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBareACEPrefixIsAnError"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
idna.Lookup.ToASCII("xn--") returns "" with a nil error, and Lookup.ToASCII("a.xn--.b") returns
"a..b" with a nil error (idna.Display, idna.Punycode and a MapForLookup profile alike;
idna.Registration rejects the names, but only through VerifyDNSLength's empty-label check). UTS #46
section 4 step 4 says of an xn-- label: "attempt to convert the rest of the label to Unicode
according to Punycode; if that conversion fails or if the result is the empty string, record an
error (P4)", and the conformance suite IdnaTestV2.txt has the case `xn--; ""; [P4, X4_2]`.
process() decodes the empty Punycode to "" without error and only rejects a decoded label that is
non-empty ASCII, so the empty one slips through as an empty label; node's url.domainToASCII (ada)
and the URL standard reject the name. Found with the lookup profile of the URL standard (no
VerifyDnsLength, which is what would otherwise catch the empty label).
'''

[[bug]]
id = "x-net/14"
title = "idna: the Registration profile accepts code points UTS #46 calls valid but IDNA2008 disallows (NV8) or excludes (XV8), such as U+00A1 and U+2615"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRegistrationRejectsNV8"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
idna.Registration is documented as "the recommended profile for checking whether a given IDN is
valid for registration, according to Section 4 of RFC 5891", whose 4.2.2 requires every code
point to be PVALID or CONTEXT under RFC 5892. idna.Registration.ToASCII("¡") is "xn--7a",
ToASCII("☕") is "xn--53h" and ToASCII("᧚") is "xn--pkf", all without error, though U+00A1,
U+2615 (both NV8: "valid under UTS #46 but not under IDNA2008") and U+19DA (XV8) are DISALLOWED
by RFC 5892's tables; python's idna package rejects the three. validateRegistration has a TODO
("handle the NV8 defined in the Unicode idna data set to allow for strict conformance to
IDNA2008") and simplify() folds validNV8 and validXV8 into valid. 785 ranges of the
IdnaMappingTable of Unicode 18.0.0 carry the flags, mostly symbols, punctuation and
compatibility characters.
'''

[[bug]]
id = "x-net/15"
title = "idna: the Registration profile applies none of IDNA2008's CONTEXTO rules, so a lone katakana middle dot or a middle dot between letters other than l passes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRegistrationAppliesContextO"
found = { commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1", version = "v0.59.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 5891 section 4.2.3.3 requires a registration to check the contextual rules of RFC 5892
appendix A for every CONTEXTO code point: U+00B7 MIDDLE DOT only between two l's (A.3), U+0375
GREEK LOWER NUMERAL SIGN only before a Greek letter (A.4), U+05F3 and U+05F4 only after a Hebrew
letter (A.5, A.6), U+30FB KATAKANA MIDDLE DOT only in a label with a Hiragana, Katakana or Han
character (A.7), and the Arabic-Indic and extended Arabic-Indic digits never in one label (A.8,
A.9). idna.Registration.ToASCII("・") is "xn--vek" and ToASCII("a·b") is "xn--ab-0ea", both
without error; python's idna package rejects both (InvalidCodepointContext) and accepts "l·l". The
package implements only the CONTEXTJ rules (CheckJoiners, RFC 5892 A.1 and A.2), which is all
UTS #46 asks of a lookup, and has no option for the CONTEXTO rules. (The two Arabic digit rules
are covered in practice by the Bidi rule, since U+0660-0669 are AN and U+06F0-06F9 are EN: a
label holding both breaks RFC 5893 rule 4, and x/net/idna rejects "ب٠۰".)
'''
