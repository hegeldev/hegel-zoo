name = "x-net"
language = "go"
upstream = "https://github.com/golang/net"
subdir = ""
license = "BSD-3-Clause"  # CONTRIBUTING.md points to go.dev/doc/contribute (CLA); nothing about AI-written code (checked 2026-09-19)
ai_policy_checked = "2026-09-19"

[base]
commit = "520c891fe60b2ffd4b4ee349d95cac4c1c0d9ee1"
date = "2026-09-18"
version = "v0.59.0+"

[hegel]
version = "v0.6.33"

[run]
# The tests live in html/hegel and exercise golang.org/x/net/html. The oracles are two other
# implementations of the HTML parsing algorithm: parse5 8.0.1 (node; installed under html/hegel,
# which its .gitignore keeps out of the patch; its dependency `entities` is the character
# reference oracle) and html5lib 1.1 (python3 with html5lib on PATH: the CI venv has it).
setup = ["npm install --no-audit --no-fund --no-save --no-package-lock --prefix html/hegel parse5@8.0.1"]
command = "go test -count=1 -run TestHegel -v ./html/hegel/"

[expected_failures]
TestHegelPinCommentDataIsNotUnescaped = "x-net/1"
TestHegelPinDoctypeNulBecomesReplacementCharacter = "x-net/2"
TestHegelPinEmptyEndTagIsIgnored = "x-net/3"
TestHegelPinForeignFragmentAfterHtmlEndTag = "x-net/4"
TestHegelPinIgnoredRawTextTagInFrameset = "x-net/5"
TestHegelPinRenderForeignElementNamedLikeVoid = "x-net/6"
TestHegelPinCDATAKeepsCharacterReferences = "x-net/7"
TestHegelPinNoscriptKeepsLeadingWhitespace = "x-net/8"
TestHegelPinColumnGroupContextKeepsWhitespace = "x-net/8"
TestHegelPinRenderRawTextInMathTextIntegrationPoint = "x-net/9"
TestHegelPinRCDATAContextIgnoresItsOwnEndTag = "x-net/10"
TestHegelPinCarriageReturnReferenceAfterPre = "x-net/11"
TestHegelPinNulAttributeNameIsDeduplicated = "x-net/12"
