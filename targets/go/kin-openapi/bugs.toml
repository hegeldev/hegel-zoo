# Bugs found in getkin/kin-openapi by the Hegel zoo's properties. Each has a pin test in
# hegel/hegel_zoo_pins_test.go / hegel_zoo_pins2_test.go (expected failures in target.toml).

[[bug]]
id = "kin-openapi/1"
title = "A schema's const: null is dropped by MarshalJSON and read as no const, so the schema accepts every value"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinConstNull"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
openapi3.Schema.Const is `any` with `json:"const,omitempty"`: unmarshalling {"const": null} leaves
Const nil, which visitConstOperation reads as "no const", and marshalling gives {}. The schema
{"const": null} (JSON Schema 2020-12, an OpenAPI 3.1 keyword the built-in validator implements)
must accept null and nothing else; kin-openapi's built-in and JSON Schema 2020-12 modes accept
"a", and the built-in mode rejects null (the empty schema is not nullable). Found by the JSON
round trip check of TestHegelSchema.
'''

[[bug]]
id = "kin-openapi/2"
title = "EnableJSONSchema2020 falls back to the built-in validator, silently, for every schema holding nullable: true with a type"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNullableFallback2020"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
transformOpenAPIToJSONSchema (openapi3/schema_jsonschema_validator.go) rewrites nullable: true
with a string type into schema["type"] = []string{typeVal, "null"}. The jsonschema compiler
(santhosh-tekuri/jsonschema/v6) takes a JSON-decoded document and rejects the []string against
the metaschema ("at '/type': invalid jsonType []string"), so newJSONSchemaValidator fails and
useJSONSchema2020 falls back to schema.visitJSON without a word. Effect: with
EnableJSONSchema2020, {"nullable": true, "type": "string", "enum": ["a"]} accepts null and
prints the built-in validator's error text for "b", while the equivalent
{"type": ["string", "null"], "enum": ["a"]} rejects null through the 2020-12 validator. Any
schema with a nullable sub-schema (a property, an item) is affected the same way. A []any would
compile. Found by TestHegelSchema comparing the 2020 mode with the Python jsonschema package.
'''

[[bug]]
id = "kin-openapi/3"
title = "EnableJSONSchema2020 loses nullable: true when the type is a list: null is rejected"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNullableTypeList2020"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
transformOpenAPIToJSONSchema handles nullable only for a string type or no type; for a type list
it deletes "nullable" and leaves the list as it is. {"nullable": true, "type": ["array",
"string"]} accepts null in the built-in mode (Schema.PermitsNull is true) and rejects it with
EnableJSONSchema2020 ("got null, want string or array"). Distinct from kin-openapi/2: with that
fixed, the list case still drops the null.
'''

[[bug]]
id = "kin-openapi/4"
title = "A nullable schema accepts null without applying enum, const, not, oneOf, anyOf or allOf"
kind = "spec"
severity = "low"
test = "TestHegelPinNullableSkipsKeywords"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
visitJSON returns at once for a null value when schema.PermitsNull() (nullable: true, or a type
list holding "null"), before the not, oneOf/anyOf/allOf, enum and const checks. OpenAPI 3.0.3,
Schema Object, nullable: "A true value adds "null" to the allowed type specified by the type
keyword ... Other Schema Object constraints retain their defined behavior, and therefore may
disallow the use of null as a value." So {"nullable": true, "type": "string", "enum": ["a"]}
must reject null (null is not in the enum), as must {"nullable": true, "type": "string",
"not": {"nullable": true, "type": "string"}} and a oneOf with two nullable branches; kin-openapi
accepts all three, and the 3.1 spelling {"type": ["string", "null"], "enum": ["a"]} too (the
JSON Schema 2020-12 mode rejects that one). The Python jsonschema package rejects them all.
'''

[[bug]]
id = "kin-openapi/5"
title = "A typed, non-nullable schema accepts null when a branch of its oneOf, anyOf or allOf is nullable"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNullBranchOverridesType"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
visitXOFOperations ends with `run = !((visitedOneOf || visitedAnyOf || visitedAllOf) && value
== nil)`: once a combinator accepted a null value, visitJSON returns without the type check
(the comment says the branches "could allow for a nullable value even though this one
doesn't"). That is defensible for a schema without a type, but it also skips the schema's own
type: {"type": "string", "anyOf": [{"type": "string", "nullable": true}]},
{"type": "integer", "minimum": 1, "allOf": [{"type": "integer", "nullable": true}]} and
{"type": "object", "oneOf": [{"type": "object", "nullable": true}, {"type": "string"}]} all
accept null although their type excludes it (OpenAPI 3.0: null is allowed only through
nullable on the schema whose type is checked; the JSON Schema 2020-12 mode rejects all three).
'''

[[bug]]
id = "kin-openapi/6"
title = "EnableJSONSchema2020 applies the int32 and int64 format checks to integral values of a number-typed schema"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinIntFormatOnNumber2020"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The built-in validator applies SchemaIntegerFormats only when the type requires an integer
(visitJSONNumber: Permits(integer) && !Permits(number)); on {"type": "number", "format":
"int32"} 3e9 passes. The JSON Schema 2020-12 mode's formatValidator/validateNumberFormat applies
the integer format to any integral float64, so the same schema rejects 3e9 ("3e+09 is not valid
int32"). The two modes disagree; the OpenAPI formats int32/int64 are defined for type integer.
'''

[[bug]]
id = "kin-openapi/7"
title = "EnableJSONSchema2020 converts the value to int64 before the int64 range check, so 1e300 passes format int64"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInt64Overflow2020"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
validateNumberFormat (schema_jsonschema_validator.go) calls f.Validate(int64(value)) for an
integral float64; int64(1e300) is out of range (the conversion gives math.MinInt64 on amd64),
which the int64 range validator accepts. The built-in validator's validateIntegerFormat guards
the conversion and rejects 1e300 for {"type": "integer", "format": "int64"}; the 2020 mode
accepts it.
'''

[[bug]]
id = "kin-openapi/8"
title = "multipleOf accepts an exactly representable integer that is not a multiple: 9007199254740992 passes multipleOf 10"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMultipleOfSlack"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
multipleOfFailure compares exact rationals but allows a distance of |value| * 2^-51 to the
nearest multiple ("a couple of units in the last place"). For 2^53 = 9007199254740992 the
tolerance is 4, the remainder modulo 10 is 2, and the value is accepted; 9007199254740994,
9007199254740996 (remainders 4 and 6, tolerance 4) pass or fail by the same rule. Every
float64 at or above 2^52 is an integer and exactly representable, so the slack that absorbs
decimal representation error (0.3 / 0.1) here accepts non-multiples of an integer multipleOf.
The Python jsonschema package rejects 9007199254740992 (exact integer arithmetic).
'''

[[bug]]
id = "kin-openapi/9"
title = "A schema whose only keyword is not: {} or oneOf: [{}, {}] is treated as empty and accepts every value instead of none"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNotEmptySchema"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Schema.IsEmpty looks through `not` and the oneOf/anyOf/allOf members: a schema whose
sub-schemas are all empty counts as empty, and visitJSON accepts any non-null value for an
empty schema before reaching visitNotOperation or visitXOFOperations. {"not": {}} and
{"not": {"items": {}}} accept 10, and so does {"oneOf": [{}, {}]}, whose two branches both
accept 10 (oneOf must fail). Under JSON Schema {} accepts everything, so its negation accepts
nothing; the JSON Schema 2020-12 mode and the Python jsonschema package reject all three. For
anyOf and allOf of empty schemas the conclusion happens to be right. With any other keyword
beside the combinator (a type, a minimum) the operators are applied.
'''

[[bug]]
id = "kin-openapi/10"
title = "An integer parameter accepts Go literal syntax: 0x10, 0b11, 0o17 and 1_000 decode as 16, 3, 15 and 1000"
kind = "spec"
severity = "low"
test = "TestHegelPinParamIntGoSyntax"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
openapi3filter's parsePrimitiveCase (req_resp_decoder.go) decodes an integer parameter with
strconv.ParseInt(raw, 0, 64): base 0 accepts the 0x/0b/0o prefixes and underscore digit
separators. ?color=0x10 against {type: integer} validates and the application sees 16;
0b11 gives 3, 0o17 gives 15, 1_000 gives 1000. OpenAPI integers are JSON numbers; a client
sending 0x10 should get a 400, not a decoded value. Observed for query, header and cookie
parameters.
'''

[[bug]]
id = "kin-openapi/11"
title = "A number parameter accepts hexadecimal floats and digit separators: 0x1p-2, 0X1P2 and 1_0.5 decode as 0.25, 4 and 10.5"
kind = "spec"
severity = "low"
test = "TestHegelPinParamFloatGoSyntax"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parsePrimitiveCase decodes a number parameter with strconv.ParseFloat, which accepts Go's
hexadecimal floating-point literals and underscores. "inf", "NaN" and "infinity" are parsed too
but then rejected by the schema (ErrSchemaInputInf/NaN), so only the finite spellings get
through: ?color=0x1p-2 against {type: number} validates as 0.25. Separate from kin-openapi/10:
a different parser, and ParseFloat has no base argument to restrict it.
'''

[[bug]]
id = "kin-openapi/12"
title = "A boolean parameter accepts 1, 0, t, f, T, F, TRUE, FALSE, True and False"
kind = "spec"
severity = "low"
test = "TestHegelPinParamBoolSpellings"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parsePrimitiveCase decodes a boolean parameter with strconv.ParseBool, which accepts ten
spellings besides true and false. OpenAPI booleans are JSON booleans: ?flag=T or ?flag=1 against
{type: boolean} should fail validation; kin-openapi validates them (as true) and a backend that
parses the raw query itself sees a different value. Observed for query, header and cookie
parameters.
'''

[[bug]]
id = "kin-openapi/13"
title = "The legacy router reports path not found instead of method not allowed for a templated path whose item lacks the method"
kind = "contract"
severity = "low"
test = "TestHegelPinLegacy404ForTemplated"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
routers/legacy matches "METHOD /path" as one pattern in its trie; when no node matches it
falls back to doc.Paths.Value(remainingPath), a lookup of the literal path, and only a literal
path item can yield ErrMethodNotAllowed. With GET /{x}/{name} declared, POST /abc/def gives
RouteError "no matching operation was found" (ErrPathNotFound); with GET /a/b declared, POST
/a/b gives "method not allowed". The package's documentation lists the granular errors ("path
not found", "method not allowed") as what distinguishes it from the gorillamux router, which
returns ErrMethodNotAllowed in both cases.
'''

[[bug]]
id = "kin-openapi/14"
title = "The legacy router routes a request for a concrete path lacking the method to a templated path that has it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLegacyMethodFallsThrough"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Same trie of "METHOD /path" patterns: with GET /x1 and POST /{id} declared, POST /x1 matches
"POST /{id}" and the router returns /{id} with id = "x1". OpenAPI 3.0.3 (Paths Object) matches
the path first, concrete paths before templated ones, and the operation is then looked up in
that path item: the request identifies /x1, which has no POST, so the answer is method not
allowed (what the gorillamux router gives). The same happens for two templated paths.
'''

[[bug]]
id = "kin-openapi/15"
title = "The legacy router matches a path that lacks a template's final variable segments, or ends with a slash, giving empty parameters"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLegacyTrailingVariable"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With GET /a/{x} declared, GET /a and GET /a/ are routed to /a/{x} with x = "" (and GET /a/b/ to
x = "b"); with GET /{x}/{name}/{x2} declared, GET /A is routed with name = "" and x2 = "" (any
number of trailing variables may be missing). A request for a path the document does not
declare is answered by an operation with empty required path parameters, which
openapi3filter then rejects as an empty value or the application receives. The gorillamux
router gives ErrPathNotFound for all of them. A path template matches a path of the same
number of segments, each variable taking one non-empty segment (RFC 6570 simple expansion;
OpenAPI 3.0.3 Path Templating).
'''

[[bug]]
id = "kin-openapi/16"
title = "The legacy router splits the path into segments after percent-decoding, so %2F in a parameter value acts as a separator"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLegacyDecodesBeforeSplit"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Without servers, legacy.Router.FindRoute matches url.Path, the decoded path: GET /a/b%2Fc
against /a/{x} becomes /a/b/c, three segments, and gives ErrPathNotFound. RFC 3986 3.3: a
percent-encoded slash inside a segment is data, not a delimiter, so the request names the
segment "b/c" and the route /a/{x} with x = "b/c" is the answer; the gorillamux router (mux
UseEncodedPath) finds the route (with x = "b%2Fc", see kin-openapi/17).
'''

[[bug]]
id = "kin-openapi/17"
title = "The gorillamux router returns path parameter values percent-encoded as in the request; the legacy router returns them decoded"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinGorillamuxEncodedParams"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
routers/gorillamux builds its mux with UseEncodedPath() and hands mux.RouteMatch.Vars out as
they are: GET /a/b%20c against /a/{x} gives x = "b%20c" (and %C3%A9 stays encoded), where the
legacy router without servers gives x = "b c". openapi3filter validates the value it is given
(pattern, maxLength, format, enum) and the application reads it from the same map, so the two
routers make the same request validate differently. routers.Route and the Router interface
say nothing about encoding; decoding each variable (url.PathUnescape) after the match would
keep the %2F handling and give the legacy router's values.
'''

[[bug]]
id = "kin-openapi/18"
title = "The legacy router returns percent-encoded path parameter values when the document has servers, decoded ones otherwise"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinLegacyEncodedWithServers"
found = { commit = "e7ecca9a44a420e0687072d30916fcd6a6bfba07", version = "v0.149.0+6 (e7ecca9)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
legacy.Router.FindRoute uses url.Path (decoded) when the document has no servers, and
Servers.MatchURL(parsedURL) otherwise, which matches parsedURL.String() (the raw URL) and
returns the raw remaining path. With servers: [{url: https://api.example.com}] and GET /a/{x},
the request https://api.example.com/a/b%20c gives x = "b%20c"; without servers the same
request gives x = "b c". Adding a server to a document changes every path parameter value that
holds a percent-encoded character.
'''
