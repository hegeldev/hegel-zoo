# Bugs found in github.com/hjson/hjson-go/v4 by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure
# in target.toml.

[[bug]]
id = "hjson/1"
title = "A backslash-u surrogate pair in a quoted string decodes as two U+FFFD instead of the character"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSurrogatePair"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The JSON text "<bs>ud83d<bs>ude00" (a grinning face, U+1F600, as the surrogate pair every JSON
encoder writes for a character outside the BMP) decodes with encoding/json to the character
and with hjson.Unmarshal to two replacement characters U+FFFD. readString (decode.go) writes
each backslash-u escape on its own with res.WriteRune(rune(uffff)); a surrogate half is not a
valid rune, so utf8 encodes it as U+FFFD, twice. Hjson is documented as a superset of JSON; the
two halves must be combined (as encoding/json and hjson-js do). Found by TestHegelJSON and
TestHegelParse.
"""

[[bug]]
id = "hjson/2"
title = "Node.Insert on an existing key returns nil and false instead of the old value and true"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNodeInsertExistingKey"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
node.go, Insert, case *OrderedMap: `oldVal, found := cont.Map[key]` declares new variables
that shadow the method's oldVal and found; both branches assign the shadowed ones, so the method
always returns (nil, false, nil), although it is documented to return "the old value and true
if the key already exists" (OrderedMap.Insert and Node.SetKey do). The value is updated
correctly. Found by TestHegelNodeAPI (sequence model of the Node methods).
"""

[[bug]]
id = "hjson/3"
title = "A document read into a Node is written back with its base indentation doubled"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNodeBaseIndentation"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
MarshalWithOptions(map, {BaseIndentation: "    "}) gives "    {\\n      a: 1\\n    }"; read
into an hjson.Node (WhitespaceAsComments, the default) and marshalled again with the same
options it becomes "        {\\n      a: 1\\n    }": the encoder writes the root's Cm.Before
(which holds the base indentation read from the text) and then str() with the base
indentation as the separator. The README says a document can be read and written without
altering the layout. Every root but a braceless root object is affected (there the whitespace
is the first key's Before comment, written instead of the indentation). Found by
TestHegelNodeFixedPoint.
"""

[[bug]]
id = "hjson/4"
title = "A string with a leading tab or space and a backslash or double quote loses the leading whitespace in the round trip"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMultilineLeadingWhitespace"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
quote() (encode.go) writes a string that must be quoted (it starts with a quote or a
punctuator, contains a tab, or QuoteAlways is set), needs escapes (a backslash, a double quote
or a tab) and contains no other control character and no line feed as a single-line multiline
string: {"a": "\\tx\\\\y"} becomes `a: '''<tab>x\\y'''`. readMLString skips the blanks after
the opening ''' (the syntax says the whitespace on the opening line is ignored), so Unmarshal
gives "x\\y": the leading tab (or spaces) is lost. Such strings must be written with quotes and
escapes (or the leading whitespace kept on a line of its own). Found by TestHegelRoundTrip and
TestHegelTypedRoundTrip (the typed round trip of a string field).
"""

[[bug]]
id = "hjson/5"
title = "A quoted string ending in a single quote is written as a single-line multiline string that does not read back"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMultilineTrailingQuote"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The same single-line multiline form (a string that must be quoted, with only backslashes,
double quotes or tabs to escape): {"a": `"hi" she said'`, "b": 1} is written as
`a: '''"hi" she said''''` followed by `b: 1`. The reader closes the string at the first three
quotes and the fourth quote starts a new quoted string, so Unmarshal fails ("Bad string
containing newline"); in an array, `'''<tab>'''''` (the string tab-quote-quote) reads as two
empty strings. needsEscapeML rejects strings containing ''' but not strings ending in a quote
(the multi-line form is safe, its closing ''' is on its own line). Found by
TestHegelRoundTrip and TestHegelTypedRoundTrip.
"""

[[bug]]
id = "hjson/6"
title = "A quoteless string starting or ending with a Unicode space (U+00A0, U+3000) loses it in the round trip"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinQuotelessUnicodeSpace"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
needsQuotes (encode.go) quotes strings starting or ending with ASCII whitespace (`^\\s|\\s$`);
readTfnns (decode.go) returns strings.TrimSpace(value), which trims Unicode white space too
(U+0085, U+00A0, U+1680, U+2000-U+200A, U+205F, U+3000; U+2028/9 and U+202F are quoted by the
character ranges). "x<nbsp>" is written quoteless and comes back as "x". Either the encoder
should quote such strings or the parser should trim only the whitespace Hjson defines. Found
by TestHegelRoundTrip and TestHegelTypedRoundTrip.
"""

[[bug]]
id = "hjson/7"
title = "A multi-line comment tag is split on Eol, so with Eol CRLF the later lines are not comments and the output does not parse"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommentTagCRLF"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The documentation of MarshalWithOptions: "The comment will be written on the line before the
field key, prefixed with #. Or possible several lines prefixed by #, if there are line breaks
(\\n) in the comment text." writeFields (structs.go) splits the comment with
strings.Split(fi.comment, e.Eol): with Eol = "\\r\\n" the tag `comment:"first line\\nsecond
line"` is written as `# first line\\nsecond line\\n`, "second line" is read back as a key and
Unmarshal fails ("Found whitespace in your key name"). The comment lines also end in "\\n"
instead of e.Eol. Found by TestHegelTypedRoundTrip.
"""

[[bug]]
id = "hjson/8"
title = "A CRLF document read into a Node is written back with CR CR LF line ends"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNodeCRLF"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With WhitespaceAsComments (the default for Node destinations) the whitespace after a value up
to the line feed is stored in Cm.After; commonWhite(onlyAfter) stops at '\\n', so the '\\r' of a
CRLF line end is part of it. Marshal writes After and then its own Eol, so a document written
with Eol "\\r\\n" comes back as "[\\r\\r\\n  1\\r\\r\\n]" after one Node round trip, with another
CR after each further one. The key lines whose value's bracket is on the next line
(BracesSameLine off; their line end is kept verbatim in Cm.Key) and the lines inside multiline
strings are not affected. Found by TestHegelNodeFixedPoint.
"""

[[bug]]
id = "hjson/9"
title = "A root string containing a colon is written quoteless and read back as an object"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRootStringColon"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
hjson.Marshal("key:value") gives `key:value`, which Unmarshal reads as the braceless root
object {"key": "value"} (`a: b` gives {"a": "b"}, `x1:x` gives {"x1": "x"}). quote() only
quotes strings that start with a punctuator, comment start or quote, or end or start with
whitespace; at the root a quoteless string that looks like a key and a colon is a braceless
object. Strings whose key part has a blank or a punctuator ("a b:c", "a:{b") survive because
the object parse fails and the parser falls back to a single value. Found by
TestHegelRoundTrip.
"""

[[bug]]
id = "hjson/10"
title = "A multiline string in an array gains an indented blank line at each Node round trip"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNodeMultilineInArray"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Marshal([]interface{}{"a\\nb"}) writes the element as a line holding only the element's
indentation, then the opening ''' on the next line (str() writes writeIndent for the element
and mlString another writeIndent(indent+1)). Read into a Node, the first line becomes the
element's Cm.Before; Marshal(node) writes Before and then mlString's line again, so the text
grows by an indented blank line at each round trip ("[\\n  \\n    '''\\n    a\\n    b\\n
'''\\n]" becomes "[\\n  \\n    \\n    '''..."). Object values are fine: their line end is in
Cm.Key, which mlString checks for a line feed. Found by TestHegelNodeFixedPoint.
"""

[[bug]]
id = "hjson/11"
title = "Unmarshal fails with Internal error on a number with a trailing decimal point (1.)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTrailingDecimalPoint"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
tryParseNumber accepts `1.` (and `0.`, `1.e5`): its grammar allows a decimal point with no
digits, and strconv.ParseFloat accepts the text. For an interface{} or struct destination the
text becomes json.Number("1."), which json.Marshal rejects as an invalid number, and
UnmarshalWithOptions returns the bare "Internal error"; for a Node destination the same
document gives the number 1. The Hjson number syntax is JSON's (digits are required after the
point), so `1.` should be the quoteless string "1." (or, if accepted, the number 1) with every
destination, never an internal error. Found by probing the grammar model's number generator.
"""

[[bug]]
id = "hjson/12"
title = "A number beyond float64 (1e400) is the string 1e400 in a Node but an error into interface{}"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHugeNumber"
found = { commit = "033fae8e36859aeaa9960c938ad71ce15df27043", version = "v4.7.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
For a Node destination tryParseNumber parses the text with strconv.ParseFloat and treats an
infinite result as "Invalid number", so `a: 1e400` gives the quoteless string "1e400"; for an
interface{} destination the text becomes json.Number("1e400") and json.Decode fails ("cannot
unmarshal number 1e400 into Go value of type float64", as encoding/json does on the same
JSON). The same document is a string or an error depending on the destination type; the
UseJSONNumber option gives json.Number("1e400") with both. Found by probing the grammar
model's number generator.
"""
