# Bugs found in github.com/labstack/echo/v5 by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure in
# target.toml.

[[bug]]
id = "echo/1"
title = "An escaped colon and a :param at the same position corrupt the tree: both routes lost, a panic"
kind = "crash"
severity = "high"
test = "TestHegelPinEscapedColonBesideParam"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Routes GET /name\\:verb/x (a literal colon, the syntax TestRouterParam_escapeColon documents) and
GET /name:id: registered in this order, GET /name:verb/x panics in DefaultRouter.Route with
"index out of range [-1]" (an unrecovered panic in ServeHTTP: the connection dies) and GET
/name1 is a 404; registered the other way round, GET /name:verb/x is a 404 and /nameZZ/verb/x
too. insert (router.go) looks up the child to descend into with findChildWithLabel(':'), which
returns the static child labelled ':' (the unescaped colon) before considering the paramChild;
the parameter's insert then splits that static node and turns it into a paramKind node that
still sits in staticChildren (so Route enters it by its label, and backtracking out of it does
paramIndex-- from 0), or the static insert walks into the param node and hangs "verb/x" under
it. Any route pair of this shape (/v1/name\\:verb and /v1/name:id) is affected. Found by
TestHegelRoute (the property skips such pairs while the bug exists).
"""

[[bug]]
id = "echo/2"
title = "A wildcard node without the method ends the search: a matching :param route above it is not tried"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWildcardStopsBacktracking"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Routes GET /:x/b and POST /a/*: GET /a/b is a 405 (Allow: OPTIONS, POST) instead of being served
by /:x/b with x = "a"; GET /c/b is served. The documented order is static > param > wildcard with
backtracking ("smart route prioritization"; TestRouteMultiLevelBacktracking). In Route
(router.go) the Any block, when the wildcard node has no handler for the method, records it as
the best match and calls backtrackToNextNodeKind(anyKind) from the wildcard node itself, which
yields nextNodeKind == staticKind and the loop breaks ("Not found"): the alternatives of the
nodes above - here the root's :param child - are never tried, and the request ends as a 405
from the wildcard node (or a 404). Found by TestHegelRoute.
"""

[[bug]]
id = "echo/3"
title = "A RouteNotFound route shadows a matching route of lower priority; a Group with middleware hides /:param routes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNotFoundRouteShadows"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
e.RouteNotFound("/a", h) and e.GET("/:x", h): GET /a runs the not-found handler instead of the
route /:x with x = "a" (GET /b is served). The realistic form: e.Group("/a", middleware)
registers RouteNotFound routes "/a" and "/a/*" (Group.Use, so that the group's middleware runs
for 404s under the prefix); with e.GET("/:p/b", h), GET /a/b is then a default 404 ("Not Found")
while GET /c/b is served - the group makes every /:param route unreachable for its prefix. Route
(router.go) stops the search when it reaches a node whose path is consumed that has a
notFoundHandler and no handler ("matchedRouteMethod = currentNode.methods.notFoundHandler;
break"), and likewise in the Any block, before the lower-priority alternatives (the :param
sibling above) are tried. RouteNotFound is documented as the handler "executed for 404 cases",
which a request that a route matches is not. Found by TestHegelRoute.
"""

[[bug]]
id = "echo/4"
title = "UseEscapedPathForMatching does the opposite of its documentation: the default matches RawPath"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedPathOption"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
RouterConfig.UseEscapedPathForMatching is documented as "forces router to use an escaped path
(req.URL.RawPath instead of req.URL.Path) for matching". Routes GET /a%2Fb and GET /a/b, request
GET /a%2Fb (URL.Path "/a/b", RawPath "/a%2Fb"): with the option off the router matches /a%2Fb
(RawPath), with it on /a/b (Path). Route (router.go): "if !r.useEscapedPathForRouting &&
req.URL.RawPath != "" { path = req.URL.RawPath }" - the condition is inverted with respect to
the name and the comment; the package's own TestDefaultRouter_UseEscapedPathForRouting asserts
the inverted behaviour ("ok, static route" with the option on matches the decoded "/what's
up"). One of the two - code or documentation - is wrong; v4 always matched the escaped path, so
the v5 default is the old behaviour and the option's name describes the default. Found by
TestHegelRoute (the model follows the code).
"""

[[bug]]
id = "echo/5"
title = "Text after the wildcard in a route path is silently dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTextAfterWildcard"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
e.GET("/a/*/f", h) is accepted, listed as "/a/*/f" and served as "/a/*": GET /a/c/g is a 200
with * = "c/g", GET /a/ a 200 with * = "". RouteInfo.Reverse("v") gives "/a/v/f", which the
router serves with * = "v/f". Add (router.go) inserts the wildcard node at path[:i+1] and
breaks out of the scan: whatever follows the '*' is neither rejected nor matched. The
package's TestRouteMultiLevelBacktracking registers "/a/*/f" and draws it as a node "/f" under
"*", but only requests ending in /f are tried. Found by TestHegelReverse (the round trip).
"""

[[bug]]
id = "echo/6"
title = "Remove of a route with a custom method panics with a nil pointer dereference"
kind = "crash"
severity = "medium"
test = "TestHegelPinRemoveCustomMethod"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
e.Add("COPY", "/c", h); e.Router().Remove("COPY", "/c") panics: "invalid memory address or nil
pointer dereference". Remove (router.go) calls nodeToRemove.setHandler(method, nil), and
routeMethods.set for a method outside the standard set (the anyOther map) reads r.handler on
the nil *routeMethod. The standard methods take the nil pointer as "unset". Found by
TestHegelRemove.
"""

[[bug]]
id = "echo/7"
title = "A route registered without a leading slash is listed under its original path: lookups fail, Remove deletes another route"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSlashlessRoutePath"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
e.GET("users", h): the route is served for GET /users with c.Path() == "/users" and
c.RouteInfo().Path == "/users", but Router().Routes() lists it as "users", so
Routes().FindByMethodPath("GET", "/users") is "route not found". Worse, Remove("GET", "users")
normalises the path to "/users", finds the node and clears its handler, then looks for the
RouteInfo by the normalised path, finds none, and deletes routes[0] - some other route's entry
(the rIndex zero value): after e.GET("/first", h); e.GET("users", h); Remove("GET", "users"),
Routes() lists "GET users" and "GET /first" is gone from it. Add (router.go) normalises the
path for the tree (normalizePathSlash) but stores route.ToRouteInfo(...) with the path as
given; Remove searches r.routes by the normalised path and does not check that it found one.
Found by TestHegelRemove.
"""

[[bug]]
id = "echo/8"
title = "Remove does not find registered routes: after a parameter, with an escaped colon, under another name, after a removal"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRemoveFindsRoute"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Remove (router.go) walks the tree by hand and returns "could not find route to remove by given
path" for routes that are registered and served: (1) GET /a/:id/b with GET /a/:id/c also
registered - after a :param node (whose originalPath is empty when no route ends there) it sets
prefixLen = 0 and reads path[0]; the "/" node the two routes share is not the terminal, so the
next byte is read at the wrong offset; (2) GET /file\\:x/a with GET /file.txt registered - the
node "file" is shared, the node text after it holds the unescaped colon while the path given
holds the backslash, so findStaticChild('\\\\') fails (a route whose node is reached whole is found
by the originalPath comparison before any byte is read); (3)
e.Any("/:p") then e.OPTIONS("/:name"): the node's originalPath is the last route's ("/:name"),
so Remove(RouteAny, "/:p") never matches it; (4) after Remove(GET, "/file.txt/:q"), Remove(GET,
"/file\\:undelete/new") fails although it succeeded before: nodes are not re-merged after a
removal (the TODO in Remove), so the split node "file" stays and the walk reads the backslash.
Remove(RouteNotFound, path) also fails when the node has no other handler (the isHandler checks
exclude RouteNotFound: "router has no routes to remove" for a tree of not-found routes). Found
by TestHegelRemove (the model follows the walk while the bug exists).
"""

[[bug]]
id = "echo/9"
title = "Remove prunes a RouteNotFound route on its way up the tree"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRemoveKeepsNotFound"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
e.RouteNotFound("/ab", h); e.GET("/abc", h); Remove("GET", "/abc"): GET /ab, which ran the
RouteNotFound handler before, is now a default 404 - the not-found route is gone although it was
not removed. Remove (router.go) prunes the removed route's node and then its parents while
"!parent.isLeaf || parent.isHandler" is false; isHandler does not count notFoundHandler
("RouteNotFound/404 is not considered as a handler"), so a parent that carries only a
RouteNotFound route is deleted like an empty node. The same check makes Remove(RouteNotFound,
"/x") fail with "router has no routes to remove" for a tree of not-found routes (see echo/8).
Found by TestHegelRemove.
"""

[[bug]]
id = "echo/10"
title = "The binder's case-insensitive fallback picks a random parameter when several names match"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBindCaseFoldDeterministic"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Binding a request ?ID=1&Id=2 into a struct field tagged `query:"id"` gives 1 in most runs and 2
in the others (180:20 over 200 runs on one machine): bindData (bind.go), when the tag's name is
not a key of the data, scans the map with strings.EqualFold and takes the first match - a Go map
iterates in random order, so the value bound depends on the run. The package's tests establish
the fallback (TestBindQueryParamsCaseInsensitive) and that an exact match wins over it
(TestBindQueryParamsCaseSensitivePrioritized) but nothing decides between two inexact matches.
The same holds for form fields and path values; headers are canonicalised before, so one key.
Found by TestHegelBindData (the model skips such cases while the bug exists).
"""

[[bug]]
id = "echo/11"
title = "ValueBinder slice methods do not bind after an earlier error although FailFast is off"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinValueBinderSlicesAfterError"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
QueryParamsBinder(c).FailFast(false).Int64("a", &a).Int64s("b", &bs) with ?a=x&b=1&b=2: the
chain records the one error for a, and bs stays unbound although both values of b are valid.
FailFast(false) is documented as going on binding after an error ("FailFast flags binder to
stop binding after first bind error"; the package's own test asserts that later scalar calls
still run). The slice methods (ints, uints, floats, bools, times, durations in binder.go, and
BindWithDelimiter for every type but *[]string) assign the result only "if b.errors == nil",
which is the binder's whole error list, not the call's own; the scalar methods and
Strings/BindWithDelimiter(*[]string) assign regardless. Found by TestHegelValueBinder.
"""

[[bug]]
id = "echo/12"
title = "QueryParamOr and FormValueOr return the zero value on a parse error, their documentation the default"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOrDefaultOnParseError"
found = { commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719", version = "v5.3.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The doc comments give examples: QueryParamOr[int](c, "page", 1) - "If "page" is "abc": returns
(1, BindingError)"; FormValueOr[int](c, "limit", 100) - "If "limit" is "abc": returns (100,
BindingError)". The code returns (0, BindingError) in both: ParseValueOr (binder_generic.go)
returns the zero value on a parse error and the *Or functions pass it through; PathParamOr's
example ("returns (0, BindingError)" with default 0) cannot tell the two apart, and the
package's TestQueryParamOr asserts 0. Either the examples or the code are wrong; a caller
following the examples (`page, _ := QueryParamOr[int](c, "page", 1)`) gets page 0. Found by
TestHegelParseValue (the model follows the code).
"""

