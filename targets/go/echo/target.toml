name = "echo"
language = "go"
upstream = "https://github.com/labstack/echo"
subdir = ""
license = "MIT"  # README.md and CLAUDE.md (commit ed8bbe4, 2026-07-21): the repository carries a CLAUDE.md guiding Claude Code through its layout and commands; nothing forbids AI-written tests or use (checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "ed8bbe4b6cbf519766c99e492b9cc427404b3719"
date = "2026-07-21"
version = "v5.3.1"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
# Wide properties: the shapes of the recorded bugs are drawn by default (STYLE.md rule 11) and
# each lands in the basin it reaches most often.
TestHegelRoute = "echo/4"
TestHegelRemove = "echo/8"
TestHegelParseValue = "echo/12"
TestHegelReverse = { bug = "echo/5", intermittent = true }
TestHegelValueBinder = { bug = "echo/11", intermittent = true }
TestHegelBind = { bug = "echo/10", intermittent = true }
TestHegelBindData = { bug = "echo/10", intermittent = true }
TestHegelRouteOrder = { bug = "echo/1", intermittent = true }
# Narrow properties, one per bug, over the bug's shape region with random contents.
TestHegelEscapedColonBesideParam = "echo/1"
TestHegelWildcardBelowParam = "echo/2"
TestHegelNotFoundRouteBesideParam = "echo/3"
TestHegelEscapedPathOption = "echo/4"
TestHegelTextAfterWildcard = "echo/5"
TestHegelRemoveCustomMethod = "echo/6"
TestHegelRemoveSlashlessRoute = "echo/7"
TestHegelRemoveFindsRoute = "echo/8"
TestHegelRemoveKeepsNotFound = "echo/9"
TestHegelBindCaseFold = "echo/10"
TestHegelSlicesAfterError = "echo/11"
TestHegelOrOnParseError = "echo/12"
TestHegelBindNonPointer = "echo/13"
# Pins: the regression examples.
TestHegelPinEscapedColonBesideParam = "echo/1"
TestHegelPinWildcardStopsBacktracking = "echo/2"
TestHegelPinNotFoundRouteShadows = "echo/3"
TestHegelPinEscapedPathOption = "echo/4"
TestHegelPinTextAfterWildcard = "echo/5"
TestHegelPinRemoveCustomMethod = "echo/6"
TestHegelPinSlashlessRoutePath = "echo/7"
TestHegelPinRemoveFindsRoute = "echo/8"
TestHegelPinRemoveKeepsNotFound = "echo/9"
TestHegelPinBindCaseFoldDeterministic = "echo/10"
TestHegelPinValueBinderSlicesAfterError = "echo/11"
TestHegelPinOrDefaultOnParseError = "echo/12"
TestHegelPinBindNonPointer = "echo/13"
