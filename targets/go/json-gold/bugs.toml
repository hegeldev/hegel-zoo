# Bugs found in piprate/json-gold by the zoo's Hegel tests (hegel/ in the patch). Each pin (test)
# fails while the bug is open. The reference is pyld 3.3.0 (Python, Digital Bazaar's JSON-LD 1.1
# processor) on the same documents, the JSON-LD 1.1 API and RFC 3986/3987 text where the two
# disagree, and jsonld.js 8 as the third opinion where it was consulted.

[[bug]]
id = "json-gold/1"
title = "Compaction of an IRI relative to a base ending in a slash has one ../ too many, so the relative IRI denotes another resource (http://example.org/a/c against http://example.org/a/b/ gives ../../c, which is http://example.org/c)"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinRelativeIRIClimbsTooFar"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ld.RemoveBase("http://example.org/a/b/", "http://example.org/a/c")` returns `../../c`; RFC 3986
resolution of that against the base gives `http://example.org/c`, not `.../a/c`. `RemoveBase`
(url.go) removes the common leading path segments, then emits one `../` per remaining base
segment, popping the last one only when the base does not end in `/` or its first remaining
segment is empty; when the common prefix was removed and the base ends in `/`, the empty
segment after the final slash is counted as a directory to climb. jsonld.js's `removeBase`
always pops the last segment. `Compact` of `{"@id": "http://example.org/a/c"}` with
`{"@base": "http://example.org/a/b/"}` gives `@id: ../../c`; expanding the compacted document
gives another node. The same function gives `#frag` for `http://example.org/base/#frag`
against `http://example.org/base/doc` (resolves to `.../doc#frag`; `./#frag` is right) -
pyld and jsonld.js share that second case. Found by TestHegelCompactMatchesPyld,
TestHegelFlattenMatchesPyld and TestHegelCompactExpandRoundTrip (a compacted document that
expands to different IRIs); pyld's `unresolve` gives `../c`.
'''

[[bug]]
id = "json-gold/2"
title = "Resolving a relative IRI reference percent-encodes non-ASCII characters (and spaces, backslashes), so the expanded @id and the RDF IRI differ from the IRI the document denotes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinResolveKeepsUnicode"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Expand` of `{"@context": {"@base": "http://example.org/base/doc"}, "@id": "café", ...}` gives
`@id: http://example.org/base/caf%C3%A9`; pyld (and RFC 3987 section 6.5, which applies the RFC
3986 algorithm to IRIs treating the additional characters as unreserved) gives
`http://example.org/base/café`. `Resolve` (url.go) goes through `net/url` and its `String()`
re-encodes the path, so every IRI resolved against a base is turned into a URI; an RDF IRI
`<http://example.org/base/caf%C3%A9>` is a different resource from `<.../café>` (RDF 1.1 compares
IRIs as strings). Strings reaching an IRI position through a `@type: @id` term or an index map
show the same. Found by TestHegelExpandMatchesPyld and TestHegelToRDFMatchesPyld.
'''

[[bug]]
id = "json-gold/3"
title = "Compact drops the @context when there is nothing to output: a document whose nodes have only an @id compacts to {} instead of {@context: ...}"
kind = "contract"
severity = "low"
test = "TestHegelPinCompactEmptyKeepsContext"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Compact({"@id": "_:b0"}, {"ex": "http://e/"}, opts)` returns `{}`. The JSON-LD 1.1 API's
compact(): 'If compacted output is an empty array, replace it with a new map. ... If context was
not null, add an @context entry to compacted output'. `JsonLdProcessor.Compact` (processor.go)
adds `@context` only `if len(compactedMap) > 0`. pyld and jsonld.js return
`{"@context": {"ex": "http://e/"}}`. Found by TestHegelCompactMatchesPyld.
'''

[[bug]]
id = "json-gold/4"
title = "Flatten returns a re-serialisation of the active context instead of the provided context (term definitions rewritten, @version dropped, @vocab resolved), and a bare [] instead of {@context, @graph: []} when there is nothing to output"
kind = "contract"
severity = "medium"
test = "TestHegelPinFlattenProvidedContext"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Flatten(doc, {"ex": "http://e/", "p": "http://e/p", "@version": 1.1}, opts)` returns
`{"@context": {"ex": "http://e/", "p": "ex:p"}, "@graph": [...]}`: `p` is rewritten as a
compact IRI and `@version` is gone; with `"@vocab": ""` the output has the resolved base as
`@vocab`, and `{"@id": "ex:p2"}` becomes `"ex:p2"`. The API's flatten() compacts the flattened
output with the compact() algorithm, whose output carries 'the provided context'; pyld and
jsonld.js return it verbatim. `JsonLdProcessor.Flatten` (processor.go) calls
`activeCtx.Serialize()` instead, and only `if context != nil && len(flattened) > 0`, so
`Flatten({"@id": "_:b0"}, ctx, opts)` is `[]` where the spec's result is
`{"@context": ctx, "@graph": []}` ('ensuring that the compaction result uses the @graph keyword
at the top-level, even if the context is empty'). Found by TestHegelFlattenMatchesPyld (most
flattenings with a context).
'''

[[bug]]
id = "json-gold/5"
title = "Flatten panics with a nil pointer dereference when the context maps a term to null"
kind = "crash"
severity = "medium"
test = "TestHegelPinFlattenNullTerm"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Flatten({"@id": "http://e/x", "http://e/p": 1}, {"p": null, "q": "http://e/q"}, opts)` panics:
`runtime error: invalid memory address or nil pointer dereference` in `Context.Serialize`
(context.go), which iterates `c.TermDefinitions` and reads `definition.Language` of the nil
entry a null term definition leaves (its own comment notes 'definitionVal may be nil for
terms which are set to be ignored'). `Compact` with the same context is fine (it does not
serialise the context, see json-gold/4). A context with `"term": null` is the spec's way of
removing a term. Found by TestHegelFlattenMatchesPyld.
'''

[[bug]]
id = "json-gold/6"
title = "FromRDF with UseNativeTypes yields int64 values, and ToRDF or Normalize of that output panics with interface conversion: interface {} is int64, not string"
kind = "crash"
severity = "medium"
test = "TestHegelPinNativeIntegerBackToRDF"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`RdfToObject` (node.go) converts an `xsd:integer` literal to `int64` when `useNativeTypes` is
set; `objectToRDF` (node.go) recognises `bool`, `float64` and `json.Number` and otherwise
asserts `value.(string)`, so `ToRDF` (and `Normalize`) of the document `FromRDF` itself
produced panics. The round trip works only if the document is serialised to JSON and parsed
again in between. `Compact` of the same document is fine. Found by TestHegelRDFRoundTrip.
'''

[[bug]]
id = "json-gold/7"
title = "ParseNQuads reads a literal whose text starts with @ and carries a language tag as a plain literal containing the quotes and the tag: the language-tagged string @id (language ja) becomes an xsd:string of nine characters"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinNQuadsLiteralStartingWithAt"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ld.ParseNQuads("<s> <p> \"@id\"@ja .\n")` gives a literal with value `"@id"@ja` (nine
characters, quotes included), no language and datatype `xsd:string`; `"@x"@en` and `"@"@en`
likewise. `"@id"` without a tag, `"a@b"@en` and `"@id"^^<dt>` are read correctly. The parser
is `github.com/cayleygraph/quad/nquads` (v1.3.0), whose lexer records the position of the
first `@` as the start of the language tag; json-gold's `ParseNQuadsFrom`
(serialize_nquads.go) takes the resulting `quad.String` as an xsd:string. pyld reads the
value `@id` with language `ja`. `FromRDF` of such N-Quads changes the data silently: a
language-tagged string becomes a different plain string. Found by
TestHegelNQuadsParseMatchesPyld, TestHegelFromRDFMatchesPyld and TestHegelRDFRoundTrip.
'''

[[bug]]
id = "json-gold/8"
title = "ToRDF writes a value of the form of a keyword, expanded through a @type: @vocab term with no vocabulary mapping, as the IRI <@id>: invalid N-Quads where the triple must be dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinToRDFKeywordValue"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ToRDF({"@context": {"p": {"@id": "http://e/p", "@type": "@vocab"}}, "@id": "http://e/s",
"p": "@id"}, format n-quads)` writes `<http://e/s> <http://e/p> <@id> .`. All three processors
expand the value to `{"@id": "@id"}` (the 1.1 expansion algorithm says a processor SHOULD
ignore IRIs of the form of a keyword, expand#t0122, which json-gold's conformance report lists
as failing); the Deserialize JSON-LD to RDF algorithm then drops any object that is not a
well-formed IRI or blank node, which pyld and jsonld.js do (empty output). `<@id>` is not an
IRI and json-gold's own parser refuses the line. Found by TestHegelToRDFMatchesPyld and
TestHegelNormalizeMatchesPyld.
'''

[[bug]]
id = "json-gold/9"
title = "The N-Quads serializer writes an rdf:langString literal without a language with an empty language tag (a quoted string followed by @ and a space), which ParseNQuads then refuses"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinLangStringWithoutLanguage"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ParseNQuads` accepts `"a"^^<http://www.w3.org/1999/02/22-rdf-syntax-ns#langString>` (an
ill-typed but syntactically valid literal) and `NQuadRDFSerializer.Serialize` writes it back
as `"a"@ .` (`serialize_nquads.go` appends `"@" + literal.Language` whenever the datatype is
rdf:langString); `ParseNQuads` of that output fails with `unexpected rune ' '`. pyld writes
`"a" .`. Found by TestHegelNQuadsParseMatchesPyld.
'''

[[bug]]
id = "json-gold/10"
title = "FromRDF documents useNativeTypes as defaulting to true; NewJsonLdOptions sets it to false"
kind = "documentation"
severity = "low"
test = "TestHegelPinUseNativeTypesDocumentedDefault"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The doc comment of `JsonLdProcessor.FromRDF` (processor.go): '[useNativeTypes] true to
convert XSD types into native types (boolean, integer, double), false not to (default:
true)'; `NewJsonLdOptions` (options.go) sets `UseNativeTypes: false`, and FromRDF with the
default options keeps `xsd:integer` values as typed strings. The pin reads the comment from
the source and holds the code to it, so it passes once either side is changed.
'''

[[bug]]
id = "json-gold/11"
title = "Flatten drops a named graph whose nodes have no properties: {@id: g, @graph: [{@id: n}]} flattens to [] instead of [{@id: g, @graph: []}]"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFlattenEmptyNamedGraph"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Flatten({"@id": "http://e/n3", "@graph": [{"@id": "http://e/n1"}]}, nil, opts)` returns `[]`.
The flattening algorithm adds a `@graph` entry (the graph's nodes other than those with only an
`@id`) to the graph's node in the default graph, and then keeps every default-graph node that
has more than an `@id`; the graph node n3 has `@graph: []` and stays. pyld and jsonld.js return
`[{"@id": "http://e/n3", "@graph": []}]`. The same happens when the graph's nodes only had
undefined terms (dropped on expansion). Found by TestHegelFlattenMatchesPyld.
'''

[[bug]]
id = "json-gold/12"
title = "An error while expanding the items of an explicit @set or @list is discarded: the invalid item becomes {} (or null in a list) and Expand reports success on an invalid document"
kind = "contract"
severity = "medium"
test = "TestHegelPinExpandSetItemError"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Expand({"@id": "http://e/s", "http://e/p": {"@set": [{"@id": 5}]}})` returns
`[{"@id": "http://e/s", "http://e/p": [{}]}]` and no error; the same node outside the `@set`
fails with `invalid @id value`. In `expandObject` (api_expand.go, steps 7.4.9 and 7.4.10 for
`@list` and `@set`) the recursive call is `expandedValue, _ = api.expandElement(...)`: the
error is dropped and the partial result kept, so every syntax error inside a set or list -
invalid `@id`, `@type`, `@language`, a reverse property with a literal value, an invalid
embedded context - is swallowed and the offending item silently emptied (a list item becomes
`null`). pyld reports the error. Found by TestHegelCompactMatchesPyld (pyld errors, json-gold
does not).
'''

[[bug]]
id = "json-gold/13"
title = "An empty @list value of a term with a type, language or container mapping is compacted under the full IRI instead of the term (in Compact and in Flatten with a context)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCompactEmptyListTerm"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `{"p3": {"@id": "http://ex.org/vocab#p3", "@type": "xsd:boolean"}, "p4": {"@id":
"http://ex.org/vocab#p4", "@language": "en"}}`, `Compact` of a node with
`"http://ex.org/vocab#p3": {"@list": []}` and the same for p4 gives
`"http://ex.org/vocab#p3": {"@list": []}` and `"http://ex.org/vocab#p4": {"@list": []}`; a term
with `@type: @id` or no coercion gets the term, a `@type: @vocab` term the IRI as well (also
for a list whose items are all null, which expands to an empty list). The IRI compaction algorithm sets the type
and language of an empty list to `@any`/`@none`, which the term selection matches for every
term; pyld and jsonld.js select `p3` and `p4`. The compacted document expands to the same
data, only less compact. Found by TestHegelCompactMatchesPyld.
'''

[[bug]]
id = "json-gold/14"
title = "FromRDF with UseNativeTypes fails with parse error on an xsd:integer beyond int64 or an xsd:double beyond float64, valid literals the spec converts to numbers (or keeps as typed strings)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNativeTypesBigNumbers"
found = { commit = "667ee761535c9c52c0d5c40b7dd863fa56454be9", version = "v0.8.0+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`FromRDF("<s> <p> \"12345678901234567890\"^^<xsd:integer> .", UseNativeTypes)` and the same
with `"1E400"^^<xsd:double>` fail with `parse error` (a `JsonLdError` with nil details):
`RdfToObject` (node.go) returns the error of `strconv.ParseInt`/`ParseFloat` for a lexical form
that matched its integer or double pattern. The literals are valid RDF; the RDF to Object
Conversion algorithm converts them to JSON numbers (pyld gives the exact integer) and the
test suite's fromRdf#t0027 keeps a value that cannot be a JSON number as a typed string
(jsonld.js keeps the string). An RDF dataset with one large number cannot be converted with
native types at all. Found by TestHegelFromRDFMatchesPyld.
'''
