[[bug]]
id = "go-toml/1"
title = "An integer written in hex, octal or binary cannot be decoded into a float field"
kind = "wrong-result"
severity = "medium"
test = "TestHegelNonDecimalIntegerLiteralsDecodeIntoFloatFields"
found = { commit = "686c980c47581bf19b6119b60e9a59f2aed04170", version = "v2.4.3+", hegel = "v0.6.33", date = "2026-07-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Unmarshal([]byte("a = 0x10"), &struct{ A float64 }{})` fails with `toml: unable to parse float:
strconv.ParseFloat: parsing "0x10": invalid syntax`; `0o17` and `0b11` fail the same way, for
`float32` targets too.  The same literals decode into `int64` and `interface{}` targets as 16,
15 and 3, and the decimal spelling `a = 16` decodes into the float field, so the documented
rule "a TOML integer decodes into a float target" holds only for decimal literals.  In
`unmarshaler.go`, `assignInteger` hands the raw literal to `assignFloat` for float targets,
which strips underscores and calls `strconv.ParseFloat`; Go's hex float syntax requires a `p`
exponent, and octal and binary prefixes are not floats at all.
"""

[[bug]]
id = "go-toml/2"
title = "A float literal that rounds to a finite float32 is rejected for a float32 field once it exceeds MaxFloat32 as a float64 — including the encoder's own output for math.MaxFloat32"
kind = "wrong-result"
severity = "medium"
test = "TestHegelFloat32FieldsAcceptEveryLiteralThatRoundsToAFiniteFloat32"
found = { commit = "686c980c47581bf19b6119b60e9a59f2aed04170", version = "v2.4.3+", hegel = "v0.6.33", date = "2026-07-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Marshal(map[string]float32{"f": math.MaxFloat32})` writes `f = 340282350000000000000000000000000000000.0`
(the shortest decimal that round-trips as a float32), and decoding that document into a
`float32` field fails with `toml: float value 340282349999999991754788743781432688640.000000
cannot be stored in float32`.  `3.4028235e38` — also the shortest spelling — fails the same
way.  `assignFloat` rejects any literal whose float64 value is above `math.MaxFloat32`, but
every decimal in `(MaxFloat32, MaxFloat32 × (1 + 2^-25))` rounds to the finite `MaxFloat32`
when converted to float32; only values that convert to ±Inf are out of range.  The same
check is the reason the shortest representation of the largest float32, as produced by
`strconv.FormatFloat(x, 'g', -1, 32)` or by go-toml itself, cannot be read back.
"""
