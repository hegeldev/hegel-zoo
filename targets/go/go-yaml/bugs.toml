[[bug]]
id = "go-yaml/1"
title = "A float written with an exponent and no fraction (1e+21, 5e-324) is read back as a string; 1e3 is a string too"
kind = "roundtrip"
severity = "medium"
test = "TestHegelFloatsWrittenWithAnExponentAndNoFractionRoundTrip"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"f": 1e21})` writes `f: 1e+21` (the encoder appends `.0` only when the
`%g` form has neither a dot nor an `e`) and `Unmarshal` reads `"1e+21"`, a string; the same for
`1e-07`, `1e+300`, `5e-324`, `1e+06`.  The decoder's `toNumber` (token.go) accepts a float only
when the literal contains a dot, so `f: 1e3`, `1E3`, `1e+3`, `1e-3`, `+1e3`, `0e0` and `12e-1`
are all strings in `interface{}` targets although they are floats in the YAML 1.2 core schema
(and in yaml.v3 and libyaml).  Typed `float64` fields do accept them (`convertValue` calls
`strconv.ParseFloat` on the string), so only untyped decoding and round trips are affected.
'''

[[bug]]
id = "go-yaml/2"
title = "Tabs inside plain scalars are dropped: `k: a\tb` decodes as \"ab\""
kind = "silent-corruption"
severity = "medium"
test = "TestHegelTabsInsidePlainScalarsArePreserved"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Unmarshal([]byte("k: a\tb"), &v)` gives `"ab"`; `a\t\tb` gives `"ab"`, `a \tb` gives `"a b"`,
`- a\tb` gives `["ab"]`, `[a\tb]` and `{x: a\tb}` lose the tab too, and the key `a\tb: 1`
becomes `"ab"`.  yaml.v3, libyaml and the specification keep tabs inside a plain scalar (only
tabs used as indentation are forbidden).  The scanner treats every tab in a plain scalar as
separation whitespace and removes it.
'''

[[bug]]
id = "go-yaml/3"
title = "Strings with a leading or trailing tab are written unquoted, so `\"\\t\"` reads back as null and `\"\\ta\"` as \"a\""
kind = "roundtrip"
severity = "medium"
test = "TestHegelStringsWithLeadingOrTrailingTabsAreQuoted"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"k": "\t"})` writes `k: \t` (a raw tab) which `Unmarshal` reads as
`nil` and yaml.v3 as null; `"\ta"` and `"a\t"` are written raw and read back as `"a"`,
`"\ta\t"` too.  `token.IsNeedQuoted` quotes a string whose first character is a space and one
whose last character is a space or a colon, but not tabs, although a tab at either end of a
plain scalar is not part of its content.
'''

[[bug]]
id = "go-yaml/4"
title = "Strings spelled like .inf/.nan are written unquoted and read back as floats; `+.inf` is decoded as a string"
kind = "roundtrip"
severity = "medium"
test = "TestHegelStringsSpelledLikeInfinityOrNaNAreQuoted"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"k": ".inf"})` writes `k: .inf` and `Unmarshal` gives `+Inf`; the same
for `-.inf`, `.Inf`, `.INF`, `.nan`, `.NaN`, `.NAN`, as values, as map keys (`.inf: 1` reads
back with the key `"+Inf"`) and as the whole document.  `reservedKeywords` in token.go covers
null and the booleans but not the infinity and NaN spellings the decoder recognises.  In the
other direction `k: +.inf` decodes as the string `"+.inf"` while `.inf` and `-.inf` decode as
floats; the core schema (and yaml.v3) reads `+.inf` as +Inf.
'''

[[bug]]
id = "go-yaml/5"
title = "Strings starting with `?` are written unquoted: `? a` is read back as a mapping and `k: ? a` is an error"
kind = "roundtrip"
severity = "medium"
test = "TestHegelStringsStartingWithAQuestionMarkAreQuoted"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"k": "? a"})` writes `k: ? a`, which `Unmarshal` rejects with `[1:4]
mapping value is not allowed in this context`; `Marshal("? a")` writes `? a`, read back as
`map[string]any{"a": nil}` (an explicit-key mapping) by goccy and yaml.v3 alike;
`[]any{"? a", "z"}` and the key `"? a"` fail the same way.  `Marshal("?")` writes `?`, which
yaml.v3 reads as `{null: null}`.  `IsNeedQuoted` lists `*&[{}],!|>%'"@ \` and the colon as first
characters that force quoting but not the explicit-key indicator `?`.
'''

[[bug]]
