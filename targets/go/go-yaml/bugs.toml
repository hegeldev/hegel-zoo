'''

[[bug]]
id = "go-yaml/15"
title = "Tagged scalars that cannot be converted decode silently to zero values: `!!int abc` is 0, `!!int 1.5` is 0, `!!timestamp abc` is the zero time, `!!str` is null"
kind = "wrong-result"
severity = "medium"
test = "TestHegelTaggedScalarsThatCannotConvertAreErrors"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Into `interface{}`: `k: !!int 1.5` → 0, `k: !!int 1e3` → 0, `k: !!int abc` → 0, `k: !!int
99999999999999999999` → 9223372036854775807 (saturated), `k: !!float abc` → 0, `k: !!timestamp
abc` → `0001-01-01T00:00:00Z`, `k: !!binary '!!!'` → an empty `[]byte`, all without error;
`k: !!str` with no scalar decodes as `nil` where the tag asks for the empty string.
`nodeToValue` in decode.go calls `strconv.Atoi`, `ParseFloat`, `time.Parse` and
`base64.StdEncoding.DecodeString` and discards the error.  yaml.v3 reports `cannot decode
!!str 'abc' as a !!int` for the first shapes and reads `!!str` as `""`.
'''

