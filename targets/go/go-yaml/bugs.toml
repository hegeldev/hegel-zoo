[[bug]]
id = "go-yaml/13"
title = "UseSingleQuote(true) copies Go escape sequences into single quotes, so `a\\n#b` reads back with a literal backslash-n"
kind = "roundtrip"
severity = "medium"
test = "TestHegelSingleQuoteStyleUsesNoBackslashEscapes"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`MarshalWithOptions(map[string]any{"k": "a\n#b"}, UseSingleQuote(true))` writes `k: 'a\n#b'`
(a backslash and an `n`), which `Unmarshal` and yaml.v3 read as the four-character string
`a\n#b`; `"a\n\\b"`, `" \n"`, `"a\nb: c"` and `"\"\n"` lose their newlines the same way.
`quoteWith(v, '\'')` in stdlib_quote.go is `strconv.Quote` with the quote character swapped,
but YAML single-quoted scalars have no backslash escapes (`''` is the only one).  The option
also inherits go-yaml/2 and go-yaml/3 (tabs stay unquoted).
'''

[[bug]]
