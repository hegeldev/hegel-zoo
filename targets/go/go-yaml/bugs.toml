'''

[[bug]]
id = "go-yaml/25"
title = "NodeToValue(ValueToNode(v)) keeps the quotes of quoted strings: \"\" becomes `\"\\\"\\\"\"`, \"yes\" becomes `\"\\\"yes\\\"\"`"
kind = "contract"
severity = "medium"
test = "TestHegelNodeToValueUndoesValueToNode"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ValueToNode(map[string]any{"k": ""})` produces the node text `k: ""`; `NodeToValue` of that
node gives `{"k": "\"\""}` — the two quote characters as content.  The same for every string
the encoder quotes: `"1"` → `"\"1\""`, `"yes"` → `"\"yes\""`, `" x"`, `"a: b"`, `"a #b"`,
`"'q'"`.  `ValueToNode` builds a `StringNode` whose `Value` already holds the quoted form,
while `NodeToValue` expects the unquoted value (as the parser produces), so the two halves of
the documented AST API are not inverses; `Marshal`/`Unmarshal` (which go through the parser)
are unaffected.
'''

[[bug]]
id = "go-yaml/26"
title = "Stripped literal blocks lose trailing space-only content lines: `|-` with `a` and `   ` reads \"a\\n\" instead of \"a\\n \""
kind = "silent-corruption"
severity = "medium"
test = "TestHegelStrippedLiteralBlocksKeepTrailingSpaceOnlyContentLines"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`k: |-\n  a\n   \n` (second content line: one space beyond the indentation) decodes as
`"a\n"`; yaml.v3 and libyaml give `"a\n "`, since a line indented deeper than the block's
indentation is content.  `|2-` explicit, `a` + `    ` (`"a\n  "`), and two such lines
(`"a\n \n "` → `"a\n \n"`) behave alike.  The encoder writes such strings as literal blocks, so
`Marshal(map[string]any{"k": "a\n "})` gives `k: |-\n  a\n \n`, read back as `"a"`, and
`[]string{"a\n "}` reads back as `["a\n"]`; `"a\n  \n"` reads back as `"a\n"`.
'''

[[bug]]
id = "go-yaml/27"
title = "A literal block with an explicit indentation indicator, or with keep chomping, is rejected when empty lines follow it at the end of the stream"
kind = "wrong-result"
severity = "medium"
test = "TestHegelLiteralBlocksWithAnIndentationIndicatorAndOnlyEmptyLinesParse"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`k: |1-\n a\n\n` fails with `[3:1] invalid number of indent is specified in the multi-line
header` (yaml.v3: `"a"`); `k: |2\n  a\n\n`, `k: |1-\n\n a\n\n`, `k: |2+\n  a\n\n` (the
encoder's own shape for `"a\n\n"` with an indicator), `k: |2+\n\n` (`"\n"`) and `k: |2+\n  \n\n`
all fail alike, while the same documents without the indicator, or with a comment or `...`
after the empty lines, parse.  Empty lines after a block scalar belong to it (keep) or are
trailing lines (clip/strip); they are never an indentation error.
'''

[[bug]]
id = "go-yaml/28"
title = "Literal blocks whose first content line starts with a space are written without an indentation indicator, so the space is lost or the document is invalid"
kind = "roundtrip"
severity = "medium"
test = "TestHegelLiteralBlocksWhoseFirstContentLineStartsWithASpaceRoundTrip"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"k": "\n a"})` writes `k: |-\n  \n   a\n` and `Unmarshal` (and yaml.v3)
gives `"\na"`: without an indentation indicator the block's indentation is that of its first
non-empty line, so the leading space is indentation.  `"\n  a\nb"` becomes
`k: |-\n  \n    a\n  b`, rejected by both parsers.  With `UseLiteralStyleIfMultiline(true)` every
multi-line string is a literal block, so `" a\nb"` is written `k: |-\n   a\n  b` (invalid) and
`" a\n b"` reads back as `"a\nb"`, `" é\n"` as `"é\n"`.  The encoder must write `|2-` (or
quote) when the first content line starts with a space.
'''

[[bug]]
id = "go-yaml/29"
title = "Indent(1) writes literal blocks in sequences with inconsistent indentation (`- |-` then 3 and 2 spaces), producing invalid documents"
kind = "roundtrip"
severity = "medium"
test = "TestHegelIndentOneWritesReadableLiteralBlocksInSequences"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`MarshalWithOptions([]string{"a\n b"}, Indent(1))` writes `- |-\n   a\n  b\n`: the first content
line is indented by three spaces and the second by two, so the second line ends the block and
`Unmarshal` fails with `[3:3] value is not allowed in this context` (yaml.v3: `did not find
expected '-' indicator`).  `Indent(1), IndentSequence(true)` gives ` - |-\n     a\n   b\n`, the
same shape; `map[string]any{"k": []string{"a\n b"}}` fails alike; `"é\n é"` and `"a\n b\nc"`
too.  Only strings whose later lines start with spaces show it: the literal's content lines
are indented relative to different bases.
'''

[[bug]]
id = "go-yaml/30"
title = "Stripped literal blocks lose trailing spaces on the last content line: `|-` with `a ` reads \"a\" instead of \"a \""
kind = "silent-corruption"
severity = "medium"
test = "TestHegelStrippedLiteralBlocksKeepTrailingSpacesOnTheLastLine"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`k: |-\n  a \n` decodes as `"a"`; yaml.v3 and libyaml give `"a "` — strip chomping removes the
final line break and trailing empty lines, not trailing spaces of the content.  `k: |-\n  a\n
b \n` gives `"a\nb"` (want `"a\nb "`), `k: |1-\n a\n  é \n` gives `"a\n é"`, `k: |-\n  a  \n`
gives `"a"`.  With clip or keep chomping (`|`, `|+`) the spaces survive.  The encoder quotes
strings ending in a space, so its own output is not affected; documents written by hand or by
other emitters are.
'''
