severity = "medium"
test = "TestHegelKeysEndingInTheMergeIndicatorAreOrdinaryKeys"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Unmarshal([]byte("x<<: 1"), &v)` fails with `[1:6] int was used where mapping is expected`;
`a<<: null`, a nested `k:\n  x<<: 0` and the flow form `{x<<: 1}` fail the same way, and
