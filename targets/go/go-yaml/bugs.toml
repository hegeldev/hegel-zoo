encoder has to quote it (`"<<": m` round-trips).
'''

[[bug]]
id = "go-yaml/8"
title = "Control characters (U+0000–U+001F except tab and newline, U+007F) and a BOM are written raw, producing documents other YAML parsers reject"
kind = "differential"
severity = "medium"
test = "TestHegelControlCharactersAreEscapedInMarshalOutput"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"k": "\x00"})` writes the NUL byte raw (`k: \x00`); yaml.v3 rejects the
document with `control characters are not allowed` and libyaml (PyYAML) with `unacceptable
character #x0000`.  The same for `\x01`, `\a`, `\b`, `\v`, `\f`, `\x1b[0m`, `\x1f`, `\x7f` and
`a\x00b`, as values, sequence items, keys and whole documents.  `Marshal("\ufeff")` writes a bare
BOM read as null by yaml.v3, and the key `"\ufeff"` gives a document both reject.  YAML
forbids these characters in a stream (c-printable) — they must be written as `\x00`, `\a`… in
double quotes, which the decoder understands.  goccy itself reads its output back, so the
round-trip properties do not notice.
'''

[[bug]]
id = "go-yaml/9"
title = "Carriage returns in strings are used as line breaks of a literal block, so they read back as `\\n`, vanish, or make the document invalid"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelCarriageReturnsSurviveMarshal"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"k": "a\rb"})` writes `k: |-\r  a\r  b` (the CR is used as the line
break of a literal block) and `Unmarshal` gives `"a\nb"`; `"a\r\nb"` gives `"a\nb"`, `"a\r"`
gives `"a\n"`, `"\r"` gives `""`.  With both kinds of break, `"a\rb\nc"` is written
`k: |-\n  a\rb\n  c`, which goccy rejects (`[3:1] non-map value is specified`) and yaml.v3 too.
`ast.StringNode.String()` treats `\r` as a line break when choosing the literal style; a
string containing `\r` has to be double-quoted with `\r` escaped.
'''

[[bug]]
id = "go-yaml/10"
title = "Flow(true) writes multi-line strings as literal blocks inside `{}`/`[]`, which no parser reads"
kind = "roundtrip"
severity = "medium"
test = "TestHegelMultilineStringsInFlowStyleAreReadable"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`MarshalWithOptions(map[string]any{"k": "x\ny", "z": 1}, Flow(true))` writes
`{k: |-\n  x\n  y, z: 1}`; `Unmarshal` fails with `[1:1] could not find flow mapping end token
'}'` and yaml.v3 with `found character that cannot start any token`.  Sequences (`[|-\n  x\n
y, z]`) fail alike; `"a\n\n"` is written `{k: |+\n  a\n, z: 1}` and reads back as `"a\n"`.  A
struct field tagged `yaml:"f,flow"` holding a map with a multi-line string produces the same
unreadable document.  Block scalars are not allowed in flow context; the flow encoder must use
double quotes.
'''

[[bug]]
id = "go-yaml/11"
title = "Whitespace-only multi-line strings do not round-trip: `\"\\n\"` is written `|` with nothing under it and reads back as \"\""
kind = "roundtrip"
severity = "medium"
test = "TestHegelWhitespaceOnlyMultilineStringsRoundTrip"
found = { commit = "edee2f91616c6d73112a13e7c0dbde72ce938877", version = "v1.19.2+", hegel = "v0.6.33", date = "2026-04-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal(map[string]any{"k": "\n"})` writes `k: |\n\n` and `Unmarshal` (and yaml.v3) gives `""`;
`" \n"` is written `k: |\n \n` and reads `""`; `"\n "` becomes `k: |-\n  \n \n`, read `""`;
`"  \n\n"` becomes `k: |+\n    \n\n`, read `"\n\n"`; `"\t\n"` is written `k: |\n  \t\n`, which
yaml.v3 rejects (`found a tab character where an indentation space is expected`).  Literal
blocks cannot express content whose lines are all whitespace without an indentation
indicator; double quotes would.
'''

