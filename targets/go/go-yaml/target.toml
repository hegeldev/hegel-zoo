name = "go-yaml"
language = "go"
upstream = "https://github.com/goccy/go-yaml"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-14"

[base]
commit = "edee2f91616c6d73112a13e7c0dbde72ce938877"
date = "2026-04-07"
version = "v1.19.2+"

[hegel]
version = "v0.6.33"

[run]
# -vet=off: Go 1.27's vet step fails on upstream's own decode_test.go (a %q format with an int
# argument), which would otherwise stop the package from building.
command = "go test -count=1 -vet=off -v ."
setup = ["python3 -c 'import yaml'"]

[expected_failures]
TestHegelFloatsWrittenWithAnExponentAndNoFractionRoundTrip = "go-yaml/1"
TestHegelTabsInsidePlainScalarsArePreserved = "go-yaml/2"
TestHegelStringsWithLeadingOrTrailingTabsAreQuoted = "go-yaml/3"
TestHegelStringsSpelledLikeInfinityOrNaNAreQuoted = "go-yaml/4"
TestHegelStringsStartingWithAQuestionMarkAreQuoted = "go-yaml/5"
TestHegelDocumentMarkerStringsAreQuoted = "go-yaml/6"
TestHegelTheMergeKeyStringIsQuotedAsAMapKey = "go-yaml/7"
TestHegelControlCharactersAreEscapedInMarshalOutput = "go-yaml/8"
TestHegelCarriageReturnsSurviveMarshal = "go-yaml/9"
TestHegelMultilineStringsInFlowStyleAreReadable = "go-yaml/10"
TestHegelWhitespaceOnlyMultilineStringsRoundTrip = "go-yaml/11"
TestHegelMultilineStringsAsMapKeysAreReadable = "go-yaml/12"
TestHegelSingleQuoteStyleUsesNoBackslashEscapes = "go-yaml/13"
TestHegelJSONStyleEscapesControlCharactersAsJSONDoes = "go-yaml/14"
TestHegelTaggedScalarsThatCannotConvertAreErrors = "go-yaml/15"
TestHegelTwoSignsDoNotMakeANumber = "go-yaml/16"
TestHegelIntegerLiteralsBeyondTheFieldRangeAreErrors = "go-yaml/17"
TestHegelMapsWithANilInterfaceKeyDoNotPanic = "go-yaml/18"
TestHegelMergeSequencesGiveEarlierMappingsPrecedence = "go-yaml/19"
TestHegelFlowMappingEntriesNeedASpaceAfterTheColon = "go-yaml/20"
TestHegelBlockScalarHeadersFollowedByTextAreErrors = "go-yaml/21"
TestHegelALeadingByteOrderMarkIsNotPartOfTheFirstKey = "go-yaml/22"
TestHegelFlowStyleQuotesStringsContainingFlowIndicators = "go-yaml/23"
TestHegelKeysEndingInTheMergeIndicatorAreOrdinaryKeys = "go-yaml/24"
TestHegelNodeToValueUndoesValueToNode = "go-yaml/25"
TestHegelStrippedLiteralBlocksKeepTrailingSpaceOnlyContentLines = "go-yaml/26"
TestHegelLiteralBlocksWithAnIndentationIndicatorAndOnlyEmptyLinesParse = "go-yaml/27"
TestHegelLiteralBlocksWhoseFirstContentLineStartsWithASpaceRoundTrip = "go-yaml/28"
TestHegelIndentOneWritesReadableLiteralBlocksInSequences = "go-yaml/29"
TestHegelStrippedLiteralBlocksKeepTrailingSpacesOnTheLastLine = "go-yaml/30"
