# Bugs found in golang.org/x/mod by the Hegel properties in hegel.patch.
# Pin tests named in `test` assert the correct behaviour and are listed as
# expected failures in target.toml.

[[bug]]
id = "mod/1"
title = "`module.CheckImportPath` (and `CheckPath`, `CheckFilePath`) accept a path element with two dots in a row (`example.com/a..b`), which the documentation forbids"
kind = "contract"
severity = "low"
test = "TestHegelPinImportPathRejectsTwoDotsInARow"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`module/module.go`, `CheckImportPath` doc: "A valid path element ... must not end with a dot (U+002E), nor contain two dots in a row." `checkElem` rejects an element that is all dots, a leading dot (module paths) and a trailing dot, but never looks for `..` inside, so `CheckImportPath("example.com/a..b")`, `CheckPath("example.com/a..b")` and `CheckFilePath("example.com/x/..y")` are all nil. Found by TestHegelModulePathsFollowTheDocumentedRules.
'''

[[bug]]
id = "mod/2"
title = "`module.EscapeVersion` fails with `internal error: inconsistency in EscapePath` on a version containing a non-ASCII letter, which `CheckFilePath` accepts as a valid file name"
kind = "contract"
severity = "low"
test = "TestHegelPinEscapeVersionOfAValidFileName"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`module/module.go`: `EscapeVersion` documents "Versions are allowed to be in non-semver form but must be valid file names and not contain exclamation marks", and checks the version with `checkElem(v, filePath)`, which admits every Unicode letter (`fileNameOK`). It then calls `escapeString`, whose loop rejects any rune >= utf8.RuneSelf with `fmt.Errorf("internal error: inconsistency in EscapePath")` (its comment: "This should be disallowed by CheckPath"). So `EscapeVersion("v1.0.0-café")` returns an internal error, and `UnescapeVersion` rejects such strings too, although the version is a valid file name by the package's own definition. Either the doc should say ASCII, or the escaping should handle the letters it lets through. Found by TestHegelModuleVersionsMatchTheirPaths.
'''

[[bug]]
id = "mod/3"
title = "`modfile.File.AddRetract` adds the retract line to the syntax tree but not to `f.Retract`, so `DropRetract` cannot remove it and the struct disagrees with the text"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAddRetractRecordsTheRetract"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`modfile/rule.go`, `AddRetract`: builds `r := &Retract{...}`, sets `r.Syntax = f.Syntax.addLine(...)` and the rationale comments, then `return nil` without `f.Retract = append(f.Retract, r)` (compare `AddExclude`, `AddTool`, `AddIgnore`, which append). After `AddRetract(vi, "bad")`, `len(f.Retract)` is 0; `DropRetract(vi)` iterates `f.Retract` and finds nothing, so `Cleanup` + `Format` still write `// bad\nretract v1.0.0`. Upstream's `TestAddRetract` compares only the formatted text. Found by TestHegelModfileEditsMatchTheModel.
'''

[[bug]]
id = "mod/4"
title = "`modfile.File.SetRequire` (and `SetRequireSeparateIndirect`) panic with a nil pointer dereference when a require was dropped by `DropRequire` or an earlier `SetRequire` without `Cleanup` in between"
kind = "crash"
severity = "medium"
test = "TestHegelPinSetRequireAfterDropRequire"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`modfile/rule.go`: `DropRequire` (and `SetRequire` for paths no longer needed) calls `r.markRemoved()`, which does `r.Syntax.markRemoved(); *r = Require{}`, leaving an entry with a nil `Syntax` in `f.Require` until `Cleanup` compacts the slice. `SetRequire` then walks every entry of `f.Require`: the cleared entry's path `""` is not in `need`, so it calls `r.markRemoved()` again and `(*Line).markRemoved` dereferences the nil `Syntax` (`read.go:200`). `Parse("module m\nrequire a v1.0.0"); f.DropRequire("a"); f.SetRequire(...)` panics, as does calling `SetRequire` twice when the first call removed anything. The `SetRequire` doc only says "If any existing requirements may be removed, the caller should call Cleanup after all edits are complete", not that Cleanup is needed between edits; `AddRequire` and `DropRequire` themselves tolerate the cleared entries. Found by TestHegelModfileEditsMatchTheModel.
'''

[[bug]]
id = "mod/5"
title = "`note.GenerateKey` does not check the server name, so an empty name or one with a space or plus sign yields keys that `NewSigner` and `NewVerifier` reject as malformed"
kind = "contract"
severity = "low"
test = "TestHegelPinGenerateKeyRejectsInvalidNames"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`sumdb/note/note.go`: the package doc says a name must be "non-empty, well-formed UTF-8 containing neither Unicode spaces nor plus (U+002B)" and `isValidName` implements that for `NewSigner`/`NewVerifier`/`NewEd25519VerifierKey`, but `GenerateKey` formats `PRIVATE+KEY+%s+%08x+%s` and `%s+%08x+%s` from the name without calling it. `GenerateKey(rand.Reader, "")` returns `"PRIVATE+KEY++2bb74a89+..."` and `"+2bb74a89+..."` with a nil error; `NewSigner` and `NewVerifier` on those return `malformed verifier id`. With a `+` in the name the key splits at the wrong place. Found by TestHegelNoteSignThenOpen.
'''

[[bug]]
id = "mod/6"
title = "`note.Sign` accepts a text with control characters or invalid UTF-8 and produces a message that `note.Open` rejects as `malformed note`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSignRejectsControlCharactersAndBadUTF8"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`sumdb/note/note.go`: the format section says "Signed notes must be valid UTF-8 and must not contain any ASCII control characters (those below U+0020) other than newline." `Open` enforces it, but `Sign` only checks that the text ends in a newline, so `Sign(&Note{Text: "a\tb\n"}, s)`, `"\r\n"` and `"\xff\n"` all return a signed message with a nil error, and `Open(msg, verifiers)` on each fails with `malformed note`. A signer therefore cannot tell that it has produced an unopenable note. Found by TestHegelNoteSignThenOpen.
'''

[[bug]]
id = "mod/7"
title = "`tlog.FormatRecord` accepts a record text that starts with a blank line, which its documentation forbids and which concatenated tile data cannot delimit"
kind = "contract"
severity = "low"
test = "TestHegelPinFormatRecordRejectsALeadingBlankLine"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`sumdb/tlog/note.go`, `isValidRecordText`: the blank-line check is `last == '\n' && r == '\n'` with `last` starting at 0, so a text whose first byte is a newline passes: `FormatRecord(7, "\n")` = `"7\n\n\n"` and `FormatRecord(7, "\nfoo\n")` = `"7\n\nfoo\n\n"`, both with a nil error, while `"foo\n\nbar\n"` is rejected with `malformed record data`. The doc: "It must end in a terminating newline and not contain any blank lines", and "Responses to data tiles consist of concatenated formatted records from each of which the first line, with the record ID, is removed" - in a tile the record `\nfoo\n\n` reads as an empty record followed by stray text. Found by TestHegelTlogNoteFormatsRoundTrip.
'''

[[bug]]
id = "mod/8"
title = "`modfile.File.AddIgnore` writes the directory path without quoting it, so an ignore of `./x y` produces a go.mod that `Parse` rejects (`ignore directive expects exactly one argument`)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAddIgnoreQuotesThePath"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`modfile/rule.go`, `AddIgnore`: `f.Syntax.addLine(nil, "ignore", path)` passes the path as a bare token, where `AddExclude`, `AddReplace`, `AddRetract` and `AddModuleStmt` use `AutoQuote`. An ignore path is a directory path and may contain spaces; after `AddIgnore("./x y")`, `Format` writes `ignore ./x y` and `Parse` of that text fails with `go.mod:3: ignore directive expects exactly one argument`, while `Parse` of `ignore "./x y"` reads the path back. Found by TestHegelModfileEditsMatchTheModel.
'''

[[bug]]
id = "mod/9"
title = "`modfile.File.Cleanup` does not remove the entries cleared by `DropTool` and `DropIgnore`, which stay in `f.Tool` and `f.Ignore` with an empty path"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCleanupDropsToolsAndIgnores"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`modfile/rule.go`, `Cleanup`: "Cleanup cleans out all the cleared entries" - it compacts `f.Godebug`, `f.Require`, `f.Exclude`, `f.Replace` and `f.Retract`, but not `f.Tool` or `f.Ignore`, whose `Drop*` methods clear entries the same way (`*t = Tool{}`, `*i = Ignore{}`). After `DropTool("example.com/t")`, `DropIgnore("./x")` and `Cleanup`, `len(f.Tool)` and `len(f.Ignore)` are still 1, each with `Path == ""`; the formatted text is right because the syntax lines were marked removed. Found by TestHegelModfileEditsMatchTheModel.
'''

[[bug]]
id = "mod/10"
title = "`modfile.File.AddReplace` with an empty old version over a versioned replace of the same path rewrites the line to the version-less form but keeps the version in `f.Replace[i].Old`, so a version-less `DropReplace` cannot remove it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWildcardReplaceUpdatesTheOldVersion"
found = { commit = "d0a27b2d4a48460806692bf5c87fc157c3c65292", version = "v0.39.0+ (2026-08-24)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`modfile/rule.go`, `addReplace`: for `oldVers == ""` the loop matches every existing replacement of `oldPath`; the first is updated with `r.New = new` and `syntax.updateLine(r.Syntax, tokens...)`, where `tokens` has no old version - but `r.Old` is left as it was. After `AddReplace("example.com/c", "v0.3.1", "/abs/path", "")` and `AddReplace("example.com/c", "", "example.com/b", "v1.1.0")`, the text says `replace example.com/c => example.com/b v1.1.0` while `f.Replace[0].Old` is `example.com/c@v0.3.1`. `DropReplace("example.com/c", "")` then matches nothing and the line stays; `DropReplace("example.com/c", "v0.3.1")` removes the version-less line instead. Found by TestHegelModfileEditsMatchTheModel.
'''
