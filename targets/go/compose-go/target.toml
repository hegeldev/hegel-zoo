name = "compose-go"
language = "go"
upstream = "https://github.com/compose-spec/compose-go"
subdir = ""
license = "Apache-2.0"  # no AI policy in README, CONTRIBUTING, AGENTS.md (agent build instructions) or .github (checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "f18e211cbeaf7f411179c6f7b9f94057cb0db0d7"
date = "2026-09-18"
version = "v2.15.0-13-gf18e211"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
# The wide properties reach the bugs at their natural rates (a newline in a word in about 10% of
# cases, a variable in a ? message in 17%, distinct defaults of one name in 5%) and fail every run;
# TestHegelExtractVariables covers all three and shrinks to /2 in most 100-case runs (sometimes /1
# or /3). One narrow property per bug draws its shape region and fails every run. HEGEL_NO_KNOWN=1
# switches the shapes off.
TestHegelSubstitute = "compose-go/1"
TestHegelBash = "compose-go/1"
TestHegelExtractVariables = "compose-go/2"
TestHegelNewlineInWordSubstitutes = "compose-go/1"
TestHegelMessageVariablesExtracted = "compose-go/2"
TestHegelFirstDefaultOccurrenceKept = "compose-go/3"
TestHegelPinNewlineInDefault = "compose-go/1"
TestHegelPinExtractMessageVariables = "compose-go/2"
TestHegelPinExtractFirstOccurrence = "compose-go/3"
