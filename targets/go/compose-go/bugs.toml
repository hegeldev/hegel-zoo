# Bugs found in compose-spec/compose-go (package template) by the Hegel properties (see README.md).

[[bug]]
id = "compose-go/1"
title = "A default value, alternative or error message containing a newline makes the whole template invalid"
kind = "logic"
severity = "low"
test = "TestHegelPinNewlineInDefault"
found = { commit = "f18e211cbeaf7f411179c6f7b9f94057cb0db0d7", version = "v2.15.0-13-gf18e211", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DefaultPattern captures the word after the operator with `(.*)`, and Go's `.` does not match
a newline, so `${U:-a\nb}` matches only the `${` of the invalid alternative:
Substitute("${U:-a\nb}", m) fails with `Invalid template: "${U:-a\nb}"`, and so do
`${A:+x\ny}` and `${U:?line1\nline2}` (which should report the required variable with its
two-line message). The specification describes the default as text; a multi-line value in a
YAML block scalar (`command: ${CMD:-...}` over several lines) is rejected instead of
substituted. bash accepts the same expansions.
'''

[[bug]]
id = "compose-go/2"
title = "ExtractVariables misses the variables used inside a required-variable message"
kind = "logic"
severity = "low"
test = "TestHegelPinExtractMessageVariables"
found = { commit = "f18e211cbeaf7f411179c6f7b9f94057cb0db0d7", version = "v2.15.0-13-gf18e211", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The specification lists `${VARIABLE?$FOO}` among the nested interpolations, and Substitute
does expand the message (`${U:?${B}}` fails with "required variable U is missing a value:
b b"). extractVariable recurses into the default value (`:-`, `-`) and the presence value
(`:+`, `+`) but not into the message of `:?`/`?`, so ExtractVariables of a configuration
holding `${U:?${B}}` or `${U?$B}` returns only U; B, a variable the file uses, is not
reported (and would not be validated or resolved by callers relying on the map).
'''

[[bug]]
id = "compose-go/3"
title = "ExtractVariables keeps the last, not the first, default or presence value of a variable used several times in one string, and varies between runs across keys"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinExtractFirstOccurrence"
found = { commit = "f18e211cbeaf7f411179c6f7b9f94057cb0db0d7", version = "v2.15.0-13-gf18e211", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
combineVariable documents that a variable used several times "keeps the default and presence
values of the first occurrence defining one". For `${A:-x} ${A:-y}` in one string the
result is DefaultValue "y": DefaultPattern's greedy `(.*)` matches the whole string as one
occurrence, extractVariable splits it at the first closing brace and appends the variables
of the remainder *before* the current one, so the later occurrence is combined first. In a
list (`["${A:-x}", "${A:-y}"]`) the result is "x". Across two keys of a map
(`k1: ${A:-x}`, `k2: ${A:-y}`) the result is "x" or "y" depending on map iteration order:
40 calls gave x 34 times and y 6 times. The same holds for PresenceValue.
'''
