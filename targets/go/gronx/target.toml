name = "gronx"
language = "go"
upstream = "https://github.com/adhocore/gronx"
subdir = ""
license = "MIT"
# The repository has LICENSE (MIT), README, CHANGELOG and a .github with CODEOWNERS, FUNDING and
# workflows: no CONTRIBUTING, no agent instructions, nothing about AI-written code.
ai_policy_checked = "2026-09-20"

[base]
commit = "12c77ca32c3930627eded50f234b25bbd2ecc415"
date = "2026-09-17"
version = "v1.20.4"

[hegel]
version = "v0.6.33"

[run]
command = "go test -count=1 -run TestHegel -v ."
setup = ["python3 -c 'import croniter'"]

[expected_failures]
TestHegelPinBatchDueUsesTheDayUnion = "gronx/1"
TestHegelPinValidityDoesNotDependOnTheTime = "gronx/2"
TestHegelPinImpossibleModifiersAreInvalid = "gronx/3"
TestHegelPinTrailingNewlineIsWhitespace = "gronx/4"
TestHegelPinTagsKeepTheirCase = "gronx/5"
TestHegelPinInclusiveNextTickIsTruncated = "gronx/6"
TestHegelPinSteppedYearsAreReachable = "gronx/7"
TestHegelPinAddTagRefusesInvalidExpressions = "gronx/8"
TestHegelPinAutumnTransitionKeepsEveryTick = "gronx/9"
TestHegelPinMidnightGapIsCrossed = "gronx/10"
TestHegelPinTicksExcludeTheReference = "gronx/11"
TestHegelPinExtraItemPartsAreRefused = "gronx/12"
TestHegelPinHalfHourGapKeepsItsTicks = "gronx/13"
# The wide properties fail by the shape they shrink to over forty rounds at a hundred cases:
# ValidityFollowsTheGrammar gronx/3 (31 of 40; 4 four, 2 three, 12 two), IsDueFollowsTheModel
# gronx/3 (28; 4 twelve), NextAndPrevTicksFollowTheModel gronx/6 (27; 3 eleven, 4 two),
# BatchDueAgreesWithIsDue gronx/2 (25; 1 eleven, 4 four) and TagsExpandToTheirExpression
# gronx/8 (33; 5 six) fail every round; SegmentsNormaliseAsDocumented (gronx/4, 35 of 40: the
# newline is drawn in four percent of the non-tag cases) and TicksInDSTZonesAreDueAndMinimal
# (gronx/9 31, 4 seven, 10 one; 39 of 40) pass a round now and then.
TestHegelValidityFollowsTheGrammar = "gronx/3"
TestHegelSegmentsNormaliseAsDocumented = { bug = "gronx/4", intermittent = true }
TestHegelIsDueFollowsTheModel = "gronx/3"
TestHegelNextAndPrevTicksFollowTheModel = "gronx/6"
TestHegelTicksInDSTZonesAreDueAndMinimal = { bug = "gronx/9", intermittent = true }
TestHegelBatchDueAgreesWithIsDue = "gronx/2"
TestHegelTagsExpandToTheirExpression = "gronx/8"
# The thirteen narrow properties fail every run by their bug (40/40 at a hundred cases).
TestHegelBatchesApplyTheDayUnion = "gronx/1"
TestHegelInvalidItemsAreReportedWherever = "gronx/2"
TestHegelImpossibleModifiersAreRefused = "gronx/3"
TestHegelTrailingNewlinesAreTrimmed = "gronx/4"
TestHegelUpperCaseTagsAreUsable = "gronx/5"
TestHegelInclusiveTicksAreWholeSeconds = "gronx/6"
TestHegelSteppedYearsTick = "gronx/7"
TestHegelAddedTagsAreValidated = "gronx/8"
TestHegelFallBackHoursKeepTheirTicks = "gronx/9"
TestHegelMidnightGapsAreCrossed = "gronx/10"
TestHegelExcludedReferencesAreNotReturned = "gronx/11"
TestHegelExtraItemPartsAreErrors = "gronx/12"
TestHegelHalfHourGapsKeepTheirTicks = "gronx/13"
