# Bugs found in adhocore/gronx by the Hegel properties (see README.md). Each has a pin test in
# hegel_pins_test.go listed under [expected_failures] in target.toml.

[[bug]]
id = "gronx/1"
title = "BatchDue ignores the day-of-month/weekday union: 0 0 1 * 1 is due on a Monday for IsDue and not for BatchDue"
kind = "correctness"
severity = "medium"
test = "TestHegelPinBatchDueUsesTheDayUnion"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SegmentsDue (behind IsDue) applies the Vixie rule: with both the day-of-month and the weekday
restricted, the day is due when either matches (unless the day-of-month starts with '*' or is
'?', or the weekday starts with "*/"). BatchDue has its own loop that checks every segment and
stops at the first that is not due, so "0 0 1 * 1" (the 1st of the month or a Monday) is due on
Monday 2026-03-16 for IsDue and not for BatchDue, and a task list checked in batch misses every
run the union would give. Found by TestHegelBatchDueAgreesWithIsDue. BatchDue should call
SegmentsDue (or share its day logic).
'''

[[bug]]
id = "gronx/2"
title = "Whether an out-of-range item is reported depends on the reference time: IsValid(0 0 * * 1,99) is true on Mondays"
kind = "correctness"
severity = "medium"
test = "TestHegelPinValidityDoesNotDependOnTheTime"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CheckDue walks the comma list of a segment and returns as soon as an alternative is due, and
SegmentsDue returns as soon as a segment is not due, so a malformed or out-of-range item is
only noticed when the check reaches it: IsDue("0 0 * * 1,99", Monday) is (true, nil) and on a
Tuesday it is an error; IsDue("99 0 * * 1", Tuesday) is (false, nil) because the weekday bails
out before the seconds are read. IsValid runs the same check against a SegmentChecker whose
reference is the time the process started (a package-level variable), so its answer for
"0 0 * * <today>,99" is true today and false tomorrow, and a validity check at start-up
accepts expressions that fail later. Found by TestHegelValidityFollowsTheGrammar (the
"invalid" class had to be gated to expressions with a single restricted item). Validation
should parse every item of every segment independently of a reference time.
'''

[[bug]]
id = "gronx/3"
title = "Impossible modifier values are valid: 9#1, 1#6, 32W, 0W and 15L pass IsValid and never fire (or fire on another day)"
kind = "correctness"
severity = "low"
test = "TestHegelPinImpossibleModifiersAreInvalid"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isValidWeekDay returns (false, nil) for a weekday above 7 or an occurrence outside 1..5 in
"n#k", and for "nL" it takes the weekday modulo 7 (15L is Monday); isValidMonthDay returns
(false, nil) for "nW" with n above the month's length and accepts 0 and negative n (0W fires
on the 1st or 2nd when that is a weekday). So IsValid("0 0 * * 9#1") is true and
NextTickAfter on it searches 500 iterations and fails with "tried so hard". Found by the
grammar model (the "nonsense" class is gated). The bounds of the modifiers should be checked
like those of plain values.

Checked at the rewrite (2026-10-13): a negative n in "nW" is accepted too; isValidMonthDay
tries n, n-1, n+1, n-2 and n+2 as days of the month and keeps the first that is a weekday, so
"-1W" fires on the 1st when the 1st is a weekday (2026: January, April, May, June) and never
otherwise, "-5W" never, and "0W" on the 1st or the 2nd (2026-02-02 and 2026-03-02, the Mondays
after weekend firsts). "1#0" is valid and never due, as "9#1", "1#6" and "32W" are, and
NextTickAfter fails with "tried so hard" on each of the four; "15L" is the last Monday
(2026-03-30).
'''

[[bug]]
id = "gronx/4"
title = "An expression ending in a newline is invalid, although inner whitespace is collapsed with \\s+ and trailing spaces and tabs are trimmed"
kind = "correctness"
severity = "low"
test = "TestHegelPinTrailingNewlineIsWhitespace"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
normalize trims " \t" only, then replaces every \s+ run with one space and splits on spaces,
so "0 0 * * *\n" becomes "0 0 * * * " and splits into six segments, the last empty: IsValid is
false and IsDue fails with a strconv error. A line read from a file with its terminator is
refused while the same line with trailing spaces is fine. Found by the whitespace variations
of the generator. strings.TrimSpace would do.
'''

[[bug]]
id = "gronx/5"
title = "A tag added with an upper-case letter can never be used: AddTag stores it as given, the lookup lower-cases the expression"
kind = "correctness"
severity = "low"
test = "TestHegelPinTagsKeepTheirCase"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
normalize looks the expression up with expressions[strings.ToLower(expr)], which makes the
built-in tags case-insensitive, but AddTag stores the tag under the name it is given. After
AddTag("@Nightly", "0 0 * * *") returns nil, IsValid("@Nightly") and IsValid("@nightly") are
both false and IsDue on either fails with the segment-count error. Found by
TestHegelTagsExpandToTheirExpression. AddTag should lower-case the name (and report the
conflict against the lower-cased name).
'''

[[bug]]
id = "gronx/6"
title = "NextTickAfter with inclRefTime returns the reference with its sub-second part when it is due; every other result is truncated"
kind = "correctness"
severity = "low"
test = "TestHegelPinInclusiveNextTickIsTruncated"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NextTickAfter truncates the start to the second for its search but returns the untruncated
start when it is due and inclRefTime is set; PrevTickBefore returns the truncated value in
the same case. So NextTickAfter("0 0 * * *", 00:00:00.123, true) is 00:00:00.123 while
PrevTickBefore gives 00:00:00, and a caller comparing ticks with Equal or feeding one back as
the next reference sees a tick that is not on the second. Found by
TestHegelNextAndPrevTicksFollowTheModel with fractional references.
'''

[[bug]]
id = "gronx/7"
title = "A stepped year (2000/5) is reported unreachable by NextTickAfter: isUnreachableYear strips the step before comparing"
kind = "correctness"
severity = "low"
test = "TestHegelPinSteppedYearsAreReachable"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isUnreachableYear removes "/..." from each item (dashRe) and then declares the segment
unreachable when every remaining number lies before the reference year. "2000/5" means 2000,
2005, ... 9995, so from 2026 the next tick of "0 0 1 1 * 2000/5" is 2030-01-01, but
NextTickAfter returns "unreachable year segment: 2000/5". "*/5" and "0/5" are special-cased
and work; a step from any other start is not. IsDue on the same expression is right. Found by
the year generator (gated as Known.steppedYearUnreachable).
'''

[[bug]]
id = "gronx/8"
title = "AddTag registers an invalid expression: only the segment count is checked"
kind = "correctness"
severity = "low"
test = "TestHegelPinAddTagRefusesInvalidExpressions"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
AddTag calls Segments, which only counts the segments, and stores the joined result, so
AddTag("@bad", "0 0 * * 99") returns nil and IsValid("@bad") is then false; the error surfaces
at the first IsDue of the tag instead of when the tag is defined. Found by
TestHegelTagsExpandToTheirExpression. AddTag should run the same validation as IsValid
(and, with gronx/2 fixed, that validation would be reliable).
'''

[[bug]]
id = "gronx/9"
title = "At a daylight-saving fall-back NextTickAfter lands on the second reading of the wall clock and skips up to an hour of ticks; PrevTickBefore from the first reading returns an instant after the reference"
kind = "correctness"
severity = "medium"
test = "TestHegelPinAutumnTransitionKeepsEveryTick"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
bump rebuilds the candidate with time.Date from wall-clock fields; when the wall clock occurs
twice (clocks going back), Go picks the later instant, so the search jumps over the first
reading. Europe/London, 2020-10-25, clocks back at 02:00 BST: NextTickAfter("*/15 * * * *",
00:49:19 BST) is 01:00:00 GMT, an hour and eleven minutes later, and the ticks at 01:00,
01:15, 01:30 and 01:45 BST are never returned; "@hourly" from 01:45 BST gives 02:00 GMT,
skipping 01:00 GMT (the repeated hour), a two-hour gap. IsDue itself is right at every one of
the skipped instants, so a scheduler polling IsDue runs them and one using NextTickAfter
does not. Found by TestHegelTicksInDSTZonesAreDueAndMinimal (gated by the ambiguity of the
skipped instant). Bumping by durations, or checking both instants a wall clock can denote,
would fix it.

Checked at the rewrite (2026-10-13): PrevTickBefore has the mirror image, and worse: from a
reference in the FIRST reading of the repeated hour, bumpReverse builds the previous wall clock
with time.Date, which is the second reading, an instant AFTER the reference. Europe/London
2020-10-25: PrevTickBefore("*/15 * * * *", 01:10:00 BST) is 01:00:00 GMT, fifty minutes later
than the reference (the answer is 01:00:00 BST). Australia/Lord_Howe 2021-04-04 (clocks back
half an hour at 02:00 +11): PrevTickBefore("*/15 * * * *", 01:50 +11) is 01:45 +10:30,
twenty-five minutes later; NextTickAfter from 01:20 +11 is 01:30 +10:30, skipping 01:30 and
01:45 +11. From a reference in the second reading both directions are right
(PrevTickBefore(01:10 GMT) is 01:00 GMT). The hourly case of the note holds in both
directions: from 01:00 BST, NextTickAfter("0 * * * *") is 02:00 GMT and PrevTickBefore is
00:00 BST.
'''

[[bug]]
id = "gronx/10"
title = "NextTickAfter gives up (tried so hard) when a day between the reference and the tick has no midnight (America/Santiago)"
kind = "correctness"
severity = "medium"
test = "TestHegelPinMidnightGapIsCrossed"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Chile (and Cuba, Paraguay, and others) move the clocks forward at 00:00, so the day starts
at 01:00. bump for the day and weekday segments builds time.Date(y, m, d+1, 0, 0, 0), which
for such a day is normalised into the previous evening (23:00 of the day before), so the
search never enters the day and after 500 iterations loop returns "tried so hard".
America/Santiago, Saturday 2021-09-04 22:21:04: NextTickAfter("* * 3 * 7") (every second on
the 3rd or a Sunday) fails, where Sunday 2021-09-05 01:00:00 is the answer; every expression
whose next tick lies past such a day fails the same way, once a year in those zones. Found by
TestHegelTicksInDSTZonesAreDueAndMinimal (gated by midnightMissing). Bumping the day by
24 hours from the normalised midnight, or re-reading the date after time.Date, would fix it.

Checked at the rewrite (2026-10-13): the failure needs a restricted day or weekday segment (the
day bump): "0 12 6 9 *", "0 0 * * 1", "0 12 * * 1", "0 12 6 * *" and "0 1 5 9 *" (a tick ON the
gapped day, at its first instant 01:00) all fail with "tried so hard" from Saturday 2021-09-04
22:21:04, while "0 0 * * *" (2021-09-06 00:00 -03), "30 0 * * *" (2021-09-06 00:30) and
"0 12 * * *" (2021-09-05 12:00 -03) succeed, since the hour bump crosses the day by adding
hours. From a reference on the gapped day itself the bump to the next day is fine ("0 12 6 9 *"
from 2021-09-05 03:00 is 2021-09-06 12:00). PrevTickBefore crosses the gap backwards
("0 12 3 * *" from 2021-09-06 12:00 is 2021-09-03 12:00 -04): bumpReverse builds the previous
day's last second, which exists.
'''

[[bug]]
id = "gronx/11"
title = "With the reference excluded, NextTickAfter and PrevTickBefore return the reference itself when it is due and no other tick exists"
kind = "correctness"
severity = "low"
test = "TestHegelPinTicksExcludeTheReference"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
When loop runs out of iterations it returns the start and "tried so hard"; NextTickAfter and
PrevTickBefore then clear the error ("Ignore superfluous err") whenever IsDue(expr, start) is
true, without looking at inclRefTime. So for the single tick of "0 0 1 1 * 2026",
NextTickAfter(expr, 2026-01-01 00:00:00, false) and PrevTickBefore(expr, same, false) both
return 2026-01-01 00:00:00 with no error, a tick that is not after (before) the reference;
a scheduler asking for the run after the last one gets the last one again. Found by
TestHegelNextAndPrevTicksFollowTheModel with references placed on a due instant of an
expression restricted to one year (gated as Known.lastTickIsTheReference). The error should
be cleared only when inclRefTime is set.
'''

[[bug]]
id = "gronx/12"
title = "Extra range and step parts are ignored: 1-2-3 passes IsValid and is read as 1-2, 5/2/1 is refused by IsValid but read as 5/2 by IsDue and NextTickAfter"
kind = "correctness"
severity = "low"
test = "TestHegelPinExtraItemPartsAreRefused"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-10-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
inStep splits an item on "/" and reads parts[0] as the range and parts[1] as the step; inRange
splits on "-" and reads parts[0] and parts[1]; neither looks at what follows. So "1-2-3" is
read as 1-2 and "1-2-3/1" as 1-2/1, and both pass IsValid: IsDue("1-2-3 * * * *") is true at
minute 1 and false at minute 3, NextTickAfter from 00:00 is 00:01. isSyntaxValid (gronx.go)
refuses a part with "*" or "/" that does not split on "/" into exactly two sides, so "5/2/1",
"1-2/3/4" and "*/2/3" fail IsValid, but IsDue and NextTickAfter, which do not call it, read
them as 5/2, 1-2/3 and */2 (NextTickAfter("5/2/1 * * * *", 00:00) is 00:05; IsDue("*/2/3 * *
* *") is true at :00): a validity check refuses what the scheduler then runs. Found by the
rewritten validity, due and batch properties (the malformed-text forms "1-2-3" and "5/2/1" of
the generator, which the old property never reached as an isolated item). Every item should be
parsed by one grammar with no parts left over.
'''

[[bug]]
id = "gronx/13"
title = "At a half-hour spring-forward (Australia/Lord_Howe) the hour bump steps over the half hour that exists, so NextTickAfter and PrevTickBefore skip its ticks"
kind = "correctness"
severity = "low"
test = "TestHegelPinHalfHourGapKeepsItsTicks"
found = { commit = "12c77ca32c3930627eded50f234b25bbd2ecc415", version = "v1.20.4", hegel = "v0.6.33", date = "2026-10-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Lord Howe Island moves its clocks by half an hour: on the first Sunday of October 02:00 +10:30
becomes 02:30 +11, so the wall clocks 02:00-02:29 do not exist and 02:30-02:59 do. bump for
the hour segment adds time.Hour to the reference, and from a reference in 01:30-01:59 +10:30
an hour later is 03:00-03:29 +11: hour 2 is stepped over and the search goes on to the next
day. NextTickAfter("2 * 2 * * *", 2029-10-07 01:35:47 +10:30) is 2029-10-08 02:00:02 +11,
while IsDue is true at 2029-10-07 02:30:02 +11, the answer; "30 2 * * *" and "45 2 * * *"
from the same reference give the next day's 02:30 and 02:45 too (the walk runs from the last
segment, so the hour is bumped before the minute). From 01:00-01:29 the hour bump lands in
02:30-02:59 and the search is right; the minute bump reaches the half hour ("45 * * * *" from
01:50 is 02:45 +11). Backwards, a reference in 03:00-03:29 +11 minus an hour is a wall clock in
the gap whose instant lies in hour 1, so PrevTickBefore("* 2 * * *", 2029-10-07 03:02:01 +11)
is 2029-10-06 02:59:00 +10:30 while 02:59:00 +11 on the 7th is due; from 03:30 on it is
right. Found by the rewritten DST property, whose model enumerates the instants of each wall
clock per offset in effect. Distinct from gronx/9 (the fall-back's second reading) and
gronx/10 (the day bump into a missing midnight): this is the hour bump across a partial hour.
Bumping to the next wall-clock hour and re-reading the fields would fix it.
'''
