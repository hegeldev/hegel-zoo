[[bug]]
id = "gojq/3"
title = "reduce keeps the previous state when the update produces empty instead of becoming null"
kind = "wrong-result"
severity = "medium"
test = "TestHegelReduceWithAnEmptyUpdateBecomesNull"
found = { commit = "c32933425cc6fc53d69d54acf2de6c1ec46eb217", version = "v0.12.19+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
In jq (1.7 and later) a reduce whose update yields no output sets the accumulator to null:
`reduce range(3) as $x (0; empty)` is null and `reduce range(3) as $x (10; if $x == 1 then
empty else . + $x end)` is 2 (null + 2). gojq leaves the accumulator unchanged: 0 and 12.
`foreach` agrees between the two (an empty update produces no output for that step).
'''

