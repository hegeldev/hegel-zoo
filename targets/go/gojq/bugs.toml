[[bug]]
id = "gojq/4"
title = "Global regex matching skips an empty match right after a non-empty match"
kind = "differential"
severity = "low"
test = "TestHegelGlobalMatchesIncludeAnEmptyMatchAfterANonEmptyOne"
found = { commit = "c32933425cc6fc53d69d54acf2de6c1ec46eb217", version = "v0.12.19+", hegel = "v0.6.33", date = "2026-09-14" }
status = "fixed"
fixed_in = "v0.12.19+ (8b5e03a42da9)"
notes = '''
`"aaa" | [match("a*"; "g") | .offset]` is [0, 3] in jq (Oniguruma, like Perl and Python 3.7+:
after the match "aaa" at 0 there is an empty match at the end) and [0] in gojq, which follows
Go's regexp rule that an empty match abutting the previous match is ignored. Consequently
`"aaa" | gsub("a*"; "-")` is "--" in jq and "-" in gojq, `"abba" | gsub("b*"; "-")` is
"-a--a-" vs "-a-a-", and `splits("a*")` differs the same way. gojq's README lists engine
differences for metacharacters, backreferences, look-arounds and flags, not for the iteration
of empty matches, which is jq-level behaviour.
'''

