[[bug]]
id = "gojq/2"
title = "Slices with negative fractional bounds truncate the bound before counting from the end"
kind = "wrong-result"
severity = "medium"
test = "TestHegelNegativeFractionalSliceBoundsCountFromTheEnd"
found = { commit = "c32933425cc6fc53d69d54acf2de6c1ec46eb217", version = "v0.12.19+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
jq resolves a negative slice bound by adding the length first and rounding afterwards (start
down, end up): `[1,2,3] | .[-0.5:]` is [3], `.[-1.5:]` is [2,3], `.[:-0.5]` is [1,2,3] and
`.[-2.5:-0.5]` is [1,2,3]. gojq converts the bound to an integer first, so -0.5 becomes 0 and
-1.5 becomes -1: `.[-0.5:]` is the whole array, `.[-1.5:]` is [3], `.[:-0.5]` is [] and
`.[-2.5:-0.5]` is []. Positive fractional bounds agree with jq (`.[1.5:2.5]` is [2,3] in
both). Strings slice the same way ("abc" | .[-0.5:] is "c" in jq, "abc" in gojq), and
assignment and deletion through such slices follow (`.[-0.5:] = ["x"]` → [1,2,"x"] vs
["x"]; `del(.[-0.5:])` → [1,2] vs []). Related, not pinned: `.[:nan]` is the whole array in
jq and [] in gojq.
'''

