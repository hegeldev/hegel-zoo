[[bug]]
id = "gojq/7"
title = "gamma computes the gamma function where jq's gamma is the log-gamma function"
kind = "differential"
severity = "low"
test = "TestHegelGammaIsTheLogGammaFunction"
found = { commit = "c32933425cc6fc53d69d54acf2de6c1ec46eb217", version = "v0.12.19+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
jq's `gamma` calls the C library's gamma(), which on glibc, musl and macOS is lgamma (the
natural log of |Γ(x)|): `10 | gamma` is 12.80182748008147 in jq 1.8.2, equal to `lgamma`, and
`tgamma` is the true gamma function (362880). gojq's `gamma` returns 362880 (Γ(10) = 9!),
i.e. it implements tgamma under both names, so every jq script using `gamma` gets a
different number. gojq's own tests assert the tgamma value, so this may be deliberate;
recorded because it is a silent numeric difference from the reference.
'''

