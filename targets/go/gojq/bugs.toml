# Bugs found in gojq (github.com/itchyny/gojq) by the Hegel zoo. Reference: jq 1.8.2.

[[bug]]
id = "gojq/1"
title = "Suffixes after a negative number literal are silently dropped by the parser"
kind = "wrong-result"
severity = "medium"
test = "TestHegelSuffixesAfterANegativeNumberLiteralApply"
found = { commit = "c32933425cc6fc53d69d54acf2de6c1ec46eb217", version = "v0.12.19+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`-1[0]`, `-1475[4:1]`, `-1.5[0]` and `-1 .a` evaluate to the bare literal (-1, -1475, -1.5, -1)
in gojq: the index/slice suffix after a negative numeric literal is parsed and discarded. jq
reads `-1[0]` as `-(1[0])` and errors ("Cannot index number with number (0)"), as it does for
`(-1)[0]`; gojq itself errors for `1[0]` and `(-1)[0]` ("expected an array but got: number"),
so only the `-<literal><suffix>` form is affected. Visible in arithmetic: `1 - -1[0]` is 2 in
gojq and an error in jq. Found by the jq differential (`., -1475[4:1]`).
'''

