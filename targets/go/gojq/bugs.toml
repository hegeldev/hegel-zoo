[[bug]]
id = "gojq/6"
title = "abs errors on strings, arrays and objects that jq returns unchanged"
kind = "differential"
severity = "low"
test = "TestHegelAbsLeavesNonNumbersUnchanged"
found = { commit = "c32933425cc6fc53d69d54acf2de6c1ec46eb217", version = "v0.12.19+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The jq manual defines abs "naively as: if . < 0 then - . else . end", and jq 1.8.2 behaves
so: strings, arrays and objects sort above numbers and come out unchanged (`"a" | abs` →
"a", `[1,-2] | abs` → [1,-2]), while null and booleans (which sort below) fail at the negation.
gojq raises "abs cannot be applied to: string" for every non-number.
'''

