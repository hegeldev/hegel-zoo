name = "gojq"
language = "go"
upstream = "https://github.com/itchyny/gojq"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-14"

[base]
commit = "d3fe03ca462ea7dcf2c142a45a0d84a2c43fff21"
date = "2026-09-18"
version = "v0.12.19+"

[hegel]
version = "v0.6.33"

[run]
command = "go test -count=1 -v ."
# The oracle is jq 1.8.2 (gojq tracks jq 1.8; Ubuntu's jq is 1.7.1, whose number formatting,
# limit/ltrimstr/abs semantics and string handling differ). The static release binary is
# fetched once into ~/.cache/hegel-zoo/jq-1.8.2/jq and its sha256 checked against the
# release's sha256sum.txt; the tests also honour HEGEL_JQ=/path/to/jq.
setup = ['''
d="$HOME/.cache/hegel-zoo/jq-1.8.2"; if [ ! -x "$d/jq" ]; then
  case "$(uname -s)-$(uname -m)" in
    Linux-x86_64)  f=jq-linux-amd64; s=b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f ;;
    Linux-aarch64) f=jq-linux-arm64; s=8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309 ;;
    Darwin-x86_64) f=jq-macos-amd64; s=e94b266e3c26690550006abe63152b782280f4e14374accdf04cbde844f00bc0 ;;
    Darwin-arm64)  f=jq-macos-arm64; s=2d75340ba57a4b4b4c8708a21c2dc8e958a48aaa8bba13b27f77f6e4c0eca07e ;;
    *) echo "no jq 1.8.2 binary for $(uname -s)-$(uname -m); set HEGEL_JQ" >&2; exit 1 ;;
  esac
  mkdir -p "$d" && curl -fsSL -o "$d/jq.tmp" "https://github.com/jqlang/jq/releases/download/jq-1.8.2/$f" &&
  echo "$s  $d/jq.tmp" | sha256sum -c - >/dev/null && chmod +x "$d/jq.tmp" && mv "$d/jq.tmp" "$d/jq"
fi
"$HOME/.cache/hegel-zoo/jq-1.8.2/jq" --version
''']

[expected_failures]
TestHegelSuffixesAfterANegativeNumberLiteralApply = "gojq/1"
TestHegelNegativeFractionalSliceBoundsCountFromTheEnd = "gojq/2"
TestHegelReduceWithAnEmptyUpdateBecomesNull = "gojq/3"
TestHegelGlobalMatchesIncludeAnEmptyMatchAfterANonEmptyOne = "gojq/4"
TestHegelTimeFunctionsRejectNaNAndInfinity = "gojq/5"
TestHegelAbsLeavesNonNumbersUnchanged = "gojq/6"
TestHegelGammaIsTheLogGammaFunction = "gojq/7"
