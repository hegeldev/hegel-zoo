# Bugs found in nikolalohinski/gonja (v2.9.0+) by the Hegel zoo. One [[bug]] per finding; `test`
# names the plain Go test in hegel_pins_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracle: Python Jinja2 3.1.6 as a child process over
# generated templates and contexts. Documented differences (the format filter takes Go's Sprintf
# syntax, escaping is applied immediately with no Markup type, only subsets of the Python type
# methods) are not recorded. No AI policy in CONTRIBUTING.md or README.md (checked 2026-09-19).

[[bug]]
id = "gonja/1"
title = "// and % truncate toward zero for negative operands: -7 // 2 is -3 and -7 % 3 is -1"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFloorDivModNegative"
found = { commit = "e3fe5ef58a9fd967cc141cd3566178a3855ebc7f", version = "v2.9.0+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Python floors: -7 // 2 is -4, -7 % 3 is 2, 7 % -3 is -2 and -7.5 % 2 is 0.5. Found by TestHegelExpressionsAgreeWithJinja; the generator applies // and % to |abs of the left operand while the bug is open.
'''

