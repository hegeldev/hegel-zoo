status = "open"
notes = '''
2033 is the famous "leap month problem" year: the ancient algorithm places
the intercalary month after the 7th month, the official (astronomical, since
1645) rule after the 11th, and the official calendars publish 11. The entry
for 2033 in `lunar/lunar.go`'s `years` table encodes leap month 7, so every
Gregorian date from 2033-08-25 to 2034-01-30 gets the wrong lunar month:

    lunar.NewLunar(2033, 1, 1, false).LeapMonth()             // 7, want 11
    carbon.CreateFromDate(2033, 9, 1, "Asia/Shanghai").Lunar().String() // "2033-07-08" leap, want "2033-08-08"
    carbon.CreateFromDate(2033, 12, 25, "Asia/Shanghai").Lunar().IsLeapMonth() // false, want true

All other years 1900-2100 agree with the HKO table.
'''

[[bug]]
id = "carbon/22"
title = "persian.FromStdTime reads dates before 1582-10-15 as Julian calendar dates while ToGregorian uses the proleptic Gregorian calendar, so the round trip breaks before the reform"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinPersianRoundTripBeforeGregorianReform"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
Go's `time` is proleptic Gregorian, and `persian.ToGregorian` produces
`time.Date` values in it, but `persian.FromStdTime` converts through a
Julian day number computed with the historical rule (Julian calendar before
1582-10-15). The two directions therefore disagree by the 10-day (and
growing) Julian-Gregorian difference:

    c := carbon.Parse("1500-01-01", "UTC")
    c.Persian().String()                        // "0878-10-20"
    c.Persian().ToGregorian("UTC").Time         // 1500-01-10, ten days after the input
    carbon.Parse("1582-10-04", "UTC").Persian().ToGregorian("UTC").Time  // 1582-10-14
    carbon.Parse("1582-10-15", "UTC").Persian().ToGregorian("UTC").Time  // 1582-10-15, round-trips
    carbon.Parse("1000-01-01", "UTC").Persian().String()   // "0379-10-16"; the proleptic answer is 0378-10-11

Both directions should use the same (proleptic Gregorian) calendar, as the
`hebrew` package does.
'''

[[bug]]
id = "carbon/23"
title = "NewJulian decides between a Julian day and a Modified Julian day by the number of digits: only five-digit MJDs and seven-digit JDs are accepted, anything else silently becomes JD 0 (-4712-01-01)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinModifiedJulianDayBelowTenThousand"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`julian.NewJulian(f)` (and `carbon.CreateFromJulian`) takes no kind: it
measures the digits of `ceil(f)` and treats five digits as an MJD and seven
as a JD; every other length falls to `default:` and sets both values to 0.
MJD 0 is 1858-11-17 and MJD 9999 is 1886-03-31, so no date before 1886 can be
given as an MJD, and no JD below 1,000,000 (before -1976) or MJD from 100000
(2132-08-31 on) can be given at all:

    julian.NewJulian(0).ToGregorian("UTC").Time      // -4712-01-01, want 1858-11-17
    julian.NewJulian(5000).ToGregorian("UTC").Time   // -4712-01-01; MJD 5000 is 1872-07-27
    carbon.CreateFromJulian(7715).ToDateString()     // "-4712-01-01", MJD 7715 is 1880-01-01
    carbon.CreateFromJulian(100000).ToDateString()   // "-4712-01-01" too, no Error

The kind should be an argument (or two constructors), and an unusable value
an error rather than JD 0.
'''

[[bug]]
id = "carbon/24"
title = "julian.FromStdTime uses the Julian calendar before 1582-10-15, so the Julian day is not monotonic and 1582-10-10 and 1582-10-20 share a JD"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinJulianDayIsMonotonicAcrossTheReform"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`FromStdTime` applies the "Gregorian only from 1582-10-15" rule to a
`time.Time`, which is proleptic Gregorian, so the ten days 1582-10-05 to
1582-10-14 (which exist in Go) map to the same JDs as 10-15 to 10-24 and every
earlier date is ten or more days too high:

    jd := func(y, m, d int) float64 { return carbon.CreateFromDate(y, m, d, "UTC").Julian().JD() }
    jd(1582, 10, 10) == jd(1582, 10, 20)   // true, both 2299165.5
    jd(1582, 10, 14) > jd(1582, 10, 15)    // true, 2299169.5 vs 2299160.5
    jd(1000, 1, 1)                         // 2086307.5; the instant's JD (unix/86400 + 2440587.5) is 2086302.5

`ToGregorian` applies the same rule backwards, so the round trip through
`Julian()` happens to close, but the JD itself is wrong for every date before
1582-10-15 and two different dates can share one. `JD = unixSeconds/86400 +
2440587.5` holds for every `time.Time`; the conversion should be proleptic
in both directions.
'''

