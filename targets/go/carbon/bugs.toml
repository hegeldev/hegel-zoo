[[bug]]
id = "carbon/1"
title = "ToWeekString, ToShortWeekString and Format \"D\" name the wrong weekday whenever the week does not start on Monday"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSundayIsSundayWithSundayWeekStart"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`ToWeekString`, `ToShortWeekString` and the `D` format letter index the
locale's week-name table with `DayOfWeek()`, which counts from the configured
week start; the table is fixed in Monday-first order. With
`WeekStartsAt(carbon.Sunday)` a Sunday has `DayOfWeek() == 1` and prints as
"Monday":

    c := carbon.CreateFromDate(2024, 3, 10, "UTC").SetWeekStartsAt(carbon.Sunday) // a Sunday
    c.ToWeekString()      // "Monday", want "Sunday"
    c.Format("D")         // "Mon", want "Sun"
    c.StdTime().Weekday() // Sunday

Every date is misnamed for every non-Monday week start. `ToWeekString` and
`ToShortWeekString` should use `StdTime().Weekday()`, as `Format("l")` does.
'''

[[bug]]
id = "carbon/2"
title = "DiffInSeconds, DiffInMinutes, DiffInHours, Closest and Farthest work on whole-second timestamps and ignore the sub-second parts"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDiffInSecondsOfSubSecondGap"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The clock differences are computed as `end.Timestamp() - start.Timestamp()`,
so two instants 0.2 s apart across a second boundary differ by "1 second",
while two instants 0.999 s apart within a second differ by 0:

    a := carbon.CreateFromTimestampNano(1_900_000_000)   // 00:00:01.9
    b := carbon.CreateFromTimestampNano(2_100_000_000)   // 00:00:02.1
    a.DiffInSeconds(b)            // 1, elapsed is 0.2 s
    a.DiffAbsInDuration(b)        // 200ms, which is right

`Closest` and `Farthest` compare the same whole-second differences:

    x := carbon.CreateFromTimestampNano(10_000_000_000)   // 00:00:10.0
    y := carbon.CreateFromTimestampNano(10_900_000_000)   // 0.9 s later, same second
    z := carbon.CreateFromTimestampNano(9_500_000_000)    // 0.5 s earlier
    x.Closest(y, z)   // y

The differences should be computed from `DiffInDuration` (or
`TimestampNano`) and truncated.
'''

[[bug]]
id = "carbon/3"
title = "DiffInDays and DiffInWeeks divide elapsed seconds by 86400, so a 23-hour DST day is 0 days and a 25-hour one is 1"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDiffInDaysAcrossDST"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`DiffInDays` is `DiffInSeconds() / 86400` (and `DiffInWeeks` divides by
7*86400). In a zone with daylight saving the calendar day on which clocks
spring forward has 23 hours, so the same wall-clock time one day later is "0
days" away; `DiffForHumans` then says "23 hours ago" for what the calendar
API (`AddDays`, `IsSameDay`, `DiffInMonths`) treats as one day:

    a := carbon.CreateFromDateTime(2024, 3, 10, 0, 0, 0, "America/New_York")
    b := a.AddDay()             // 2024-03-11 00:00 the next day
    a.DiffInDays(b)             // 0
    a.DiffInWeeks(a.AddWeek())  // 0 for the week of the change

The years/months functions count calendar fields; days and weeks should too.
'''

[[bug]]
id = "carbon/4"
title = "DiffInYears and DiffInMonths read each side's fields in its own zone, so the result depends on the end's location and two instants an hour apart can be a year apart"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDiffInYearsAcrossZones"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`DiffInYears`/`DiffInMonths` compute `end.Year() - start.Year()` (and month)
with each Carbon's own location and then compare `start.AddDate(...)` to
`end` as instants. Wall-clock fields taken in different zones do not describe
the same instant:

    s := carbon.CreateFromDateTime(2023, 12, 31, 20, 0, 0, "UTC")
    e := carbon.CreateFromDateTime(2024, 1, 1, 3, 0, 0, "Asia/Shanghai") // 2023-12-31 19:00 UTC, an hour earlier
    s.DiffInYears(e), s.DiffInMonths(e)   // 1, 1 for two instants an hour apart

    a := carbon.CreateFromDateTime(2023, 1, 1, 0, 30, 0, "Asia/Shanghai")
    b := carbon.CreateFromDateTime(2023, 12, 31, 23, 0, 0, "UTC")   // 2024-01-01 07:00 in Shanghai
    a.DiffInYears(b)                              // 0
    a.DiffInYears(b.SetTimezone("Asia/Shanghai")) // 1, the same two instants

The end should be viewed in the start's location (as `DiffInDays` and the
`Diff*String` functions effectively do), so that `a.DiffInYears(b)` is a
function of the two instants and the start's zone.
'''

[[bug]]
id = "carbon/5"
title = "November 22 is both Scorpio and Sagittarius: IsScorpio and IsSagittarius are both true and Constellation says Sagittarius while the table says Scorpio"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinNovember22IsScorpioOnly"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The `constellations` table (used by `Constellation()`) ends Scorpio on 11-22
and starts Sagittarius on 11-22 too; `IsScorpio` and `IsSagittarius` have the
same overlap. Every other sign boundary is exclusive on one side:

    c := carbon.CreateFromDate(2024, 11, 22, "UTC")
    c.IsScorpio(), c.IsSagittarius()  // true, true
    c.Constellation()                 // "Sagittarius"

Scorpio should end on the 21st (Sagittarius 11-22 to 12-21, as the
`Constellation` table already has for the end).
'''

[[bug]]
id = "carbon/6"
title = "AddHours, AddMinutes, AddSeconds, AddMilliseconds, AddMicroseconds and AddNanoseconds overflow time.Duration beyond about 292 years and silently return a wrong date"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinAddHoursBeyondDurationRange"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The clock travellers convert the count to a `time.Duration` (`time.Duration(n)
* time.Hour`) and add it. `time.Duration` is int64 nanoseconds and saturates
at about 292 years, so large counts wrap:

    c := carbon.CreateFromDateTime(2000, 1, 1, 0, 0, 0, "UTC")
    c.AddHours(3_000_000).Year()          // 1757; 3 million hours is 342 years, want 2342
    c.AddSeconds(10_000_000_000).Year()   // 1732; 1e10 s is 317 years, want 2316
    c.AddSeconds(10_000_000_000_000)      // 2059-02-02 07:34:09.423024128, HasError() false

`time.Time.Add` cannot express it either, but `time.Unix(sec+n, nsec)` can for
seconds and coarser, and hours/minutes can be split. Even setting `Error` would
be better than a plausible wrong date.
'''

[[bug]]
id = "carbon/7"
title = "AddDuration and SubDuration with an unparsable string set Error on the receiver, not only on the returned copy"
kind = "contract"
severity = "low"
test = "TestHegelPinAddDurationErrorStaysOnResult"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
Every traveller documents returning a new Carbon and leaving the receiver
alone; `AddDuration("bad")` first writes `c.Error = ...` on the receiver and
then returns it, so a previously valid value becomes invalid:

    c := carbon.CreateFromDate(2024, 1, 1, "UTC")
    _ = c.AddDuration("1x")
    c.IsInvalid()                // true, want false
    c.ToDateString()             // ""

The other travellers copy first (`c.Copy()`); these two should too.
'''

[[bug]]
id = "carbon/8"
title = "ToHttpString, ToIso8601ZuluString and ToIso8601ZuluMilli/Micro/NanoString print the local wall clock with a GMT or Z suffix, and ToRfc7231String prints the local abbreviation instead of GMT"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinZuluAndHttpStringsAreUtc"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The layouts `Mon, 02 Jan 2006 15:04:05 GMT` and `2006-01-02T15:04:05Z` carry
their zone as a literal, so applying them to a time in another zone labels a
local wall clock as UTC:

    c := carbon.CreateFromDateTime(2024, 6, 1, 12, 0, 0, "Asia/Tokyo")
    c.ToHttpString()          // "Sat, 01 Jun 2024 12:00:00 GMT"  (the instant is 03:00 GMT)
    c.ToIso8601ZuluString()   // "2024-06-01T12:00:00Z"          (want ...T03:00:00Z)
    carbon.Parse(c.ToIso8601ZuluString()).Eq(c)  // false: nine hours off

`ToRfc7231String` (documented as RFC 7231, which requires GMT) uses a
`... MST` layout and prints "JST". These outputs should be produced in UTC
(`c.StdTime().UTC()`) regardless of the receiver's zone.
'''

[[bug]]
id = "carbon/9"
title = "SetDefault resets the default week start to Sunday whenever the caller does not set WeekStartsAt, because the empty check compares a Weekday's String to \"\""
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSetDefaultKeepsWeekStart"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`SetDefault` applies each field of the `Default` struct only when it is set;
for the week start the test is `if d.WeekStartsAt.String() != ""`, and
`Weekday.String()` is never empty (the zero value is "Sunday"), so
`SetDefault(Default{Layout: DateLayout})` replaces the Monday default with
Sunday:

    carbon.SetDefault(carbon.Default{Layout: carbon.DateLayout})
    carbon.Parse("2024-03-10").DayOfWeek()  // 1 (Sunday-based); was 7 before the call
    carbon.Parse("2024-03-10").StartOfWeek().ToDateString() // "2024-03-10", was "2024-03-04"

`SetDefault` should check whether the field was set (a pointer, or the
sentinel used by the other fields).
'''

[[bug]]
id = "carbon/10"
title = "The unix, unixMilli, unixMicro and unixNano pseudo-layouts are produced by Layout, MarshalJSON and Format S/U/V/X but cannot be read back by ParseByLayout or ParseByFormat"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinUnixLayoutReadsBack"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`Layout(carbon.TimestampLayout)` (the string "unix") prints the Unix seconds,
and `Format("U")` prints them too, but the parsers do not recognise the
pseudo-layout and hand it to `time.ParseInLocation`, which fails:

    c := carbon.CreateFromDateTime(2024, 1, 2, 3, 4, 5, "UTC")
    s := c.Layout(carbon.TimestampLayout)                // "1704164645"
    carbon.ParseByLayout(s, carbon.TimestampLayout).Error // parsing time "1704164645" as "unix": cannot parse ...
    c.Format("U")                                        // "1704164645000" (the unixMilli layout)
    carbon.ParseByFormat(c.Format("U"), "U").Error      // parsing time "1704164645000" as "unixMilli": cannot parse ...

The same asymmetry affects `TimestampMilliLayout` etc. The parsers should
accept what `Layout` produces for these layouts (there are
`CreateFromTimestamp*` functions to delegate to).
'''

[[bug]]
id = "carbon/11"
title = "The zero Carbon{} is IsValid but panics with a nil Location in StartOfDay, SetYear, AddMonthsNoOverflow and IsLongYear, and reports its week start as Sunday"
kind = "panic"
severity = "medium"
test = "TestHegelPinZeroCarbonDoesNotPanic"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
A `carbon.Carbon{}` (a struct field left at its zero value, or `new(Carbon)`)
has `loc == nil`. `IsValid()` returns true for it and most getters work, but
anything that calls `time.Date(..., c.loc)` panics:

    var c carbon.Carbon
    c.IsValid()                    // true
    c.StartOfDay()                 // panic: time: missing Location in call to Date
    c.SetYear(2000)                // same panic
    c.AddMonthsNoOverflow(1)       // same
    c.IsLongYear()                 // same
    c.WeekStartsAt()               // "Sunday", the package default is Monday

Either the zero value should be invalid (`IsValid` false, methods return the
zero result), or the methods should treat a nil location as the default one,
as `StdTime()` does.
'''

[[bug]]
id = "carbon/12"
title = "Language.translate panics with index -1 when a locale's \"now\" resource contains a | separator"
kind = "panic"
severity = "low"
test = "TestHegelPinTranslateOfNowResourceWithBar"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`translate` splits a resource on `|` to pick the singular or plural form and
indexes the pieces with `value - 1`; for the `now` resource the value is 0,
so a resource such as `"now": "just now|right now"` (the `|` syntax is what
the other resources use) indexes `slice[-1]` and panics inside
`DiffForHumans`:

    lang := carbon.NewLanguage().SetLocale("en")
    lang.SetResources(map[string]string{"now": "just now|right now"})
    carbon.Now().SetLanguage(lang).DiffForHumans() // panic: index out of range [-1]

Resources come from user files; a zero value should pick the first (or only)
form instead of panicking.
'''

[[bug]]
id = "carbon/13"
title = "ParseByFormat copies format literals into the Go layout unprotected, so \"1\" or letters spelled with backslashes are read as layout tokens"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFormatLiteralsAreLiteralWhenParsing"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`format2layout` translates PHP-style letters into a Go layout, and copies
every other character (and every backslash-escaped one) verbatim. Go layouts
have no escape, so a literal `1`, `2`, `01`, `MST`, `Jan`, `PM`, `-07` etc.
becomes a field:

    carbon.ParseByFormat("2024-03-09 1", "Y-m-d 1", "UTC").ToDateString()
        // "2024-01-09" with no Error: the literal "1" is the Go month token, want 2024-03-09
    c := carbon.CreateFromDateTime(2020, 8, 5, 13, 14, 15, "Asia/Shanghai")
    s := c.Format(`\M\S\T Y-m-d H:i:s`)                 // "MST 2020-08-05 13:14:15", Format is fine
    carbon.ParseByFormat(s, `\M\S\T Y-m-d H:i:s`, "Asia/Shanghai")
        // 2020-08-05 21:14:15 +08:00: the escaped literal became the MST zone token,
        // "MST" was read as an abbreviation with offset 0 and the clock shifted by 8 hours

`Format` renders literals itself and is fine; `ParseByFormat` should parse
field by field (or reject formats whose literals collide with layout tokens)
rather than trust the layout conversion.
'''

[[bug]]
id = "carbon/14"
title = "Every To*String, Format and Layout call with a timezone argument reassigns the receiver's location and Error, so an output call with a bad zone poisons the value, and several setters panic on a nil receiver"
kind = "contract"
severity = "low"
test = "TestHegelPinOutputWithTimezoneLeavesReceiver"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The output functions accept an optional timezone and implement it as
`c.loc, c.Error = parseTimezone(tz)` on the receiver, then format. A wrong
zone name leaves the receiver invalid, and a right one changes the zone every
later output uses:

    c := carbon.CreateFromDateTime(2024, 1, 1, 12, 0, 0, "UTC")
    c.ToDateTimeString("Nowhere/City")   // ""
    c.IsInvalid()                        // true; it was a query
    c2 := carbon.CreateFromDateTime(2024, 1, 1, 12, 0, 0, "UTC")
    c2.ToDateTimeString("Asia/Tokyo")    // "2024-01-01 21:00:00"
    c2.ToDateTimeString()                // "2024-01-01 21:00:00" too; the receiver moved

Separately `(*Carbon)(nil).SetLayout("")`, `SetTimezone("")`,
`SetLocale("")`, `SetLocation(nil)` and `ToDateString("bad")` panic with a
nil dereference although the package otherwise treats a nil Carbon as
invalid. Queries should work on a copy.
'''

[[bug]]
id = "carbon/15"
title = "CreateFromLunar and Lunar.ToGregorian build Beijing midnight but read it in the default zone, so the lunar date does not round-trip outside UTC+8"
kind = "roundtrip"
severity = "high"
test = "TestHegelPinLunarNewYearRoundTripsInUtc"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The lunar conversion counts days from 1900-01-31 00:00 in Asia/Shanghai and
returns `time.Date(...)` in that zone; `CreateFromLunar` then wraps it in a
Carbon in the default location. In a process whose default is UTC, midnight
Beijing is 16:00 the previous day, so the date shifts and the reverse
conversion (`Lunar()`, which uses the local calendar date) lands on the
previous lunar day:

    // default timezone UTC
    c := carbon.CreateFromLunar(2020, 1, 1, false)   // Chinese New Year 2020
    c.ToDateTimeString()                             // "2020-01-24 16:00:00" in UTC, want 2020-01-25
    c.Lunar().String()                               // "2019-12-30"

`ToGregorian` should return the calendar date in the requested zone (a date,
not a Beijing instant), or `CreateFromLunar` should keep Asia/Shanghai.
'''

[[bug]]
id = "carbon/16"
title = "Lunar() panics with an index out of range for Gregorian dates outside 1900-2100 instead of returning an invalid Lunar"
kind = "panic"
severity = "medium"
test = "TestHegelPinLunarOutsideTableIsAnError"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`lunar.FromStdTime` walks the `years` table from 1900 for as many days as
separate the date from 1900-01-31; a date after the table's end (or one in
January 1900) runs off the table:

    carbon.CreateFromDate(2101, 3, 1, "UTC").Lunar()   // panic: index out of range [201] with length 201
    carbon.CreateFromDate(1900, 1, 1, "UTC").Lunar()   // panic: index out of range [-1]

`NewLunar` validates the year range and sets `Error` for it (`ErrInvalidLunar`);
`FromStdTime` should do the same instead of panicking.
'''

[[bug]]
id = "carbon/17"
title = "NewLunar validates only the year, so month 13, a 30th day of a 29-day month or a leap flag in a year without a leap month are IsValid and ToGregorian/ToDateString misbehave"
kind = "contract"
severity = "medium"
test = "TestHegelPinLunarRejectsInvalidDates"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
