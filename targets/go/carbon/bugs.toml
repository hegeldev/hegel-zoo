[[bug]]
id = "carbon/28"
title = "BetweenIncludedStart, BetweenIncludedEnd and BetweenIncludedBoth return true for the zero time regardless of the other bound or of the operands' validity"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroTimeIsNotBetweenAnEmptyRange"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The three `BetweenIncluded*` comparisons begin with `if c.IsZero() { return
true }` (a shortcut for the zero-value default bounds), before the invalid
check and before comparing with the bounds. So the zero time is "between"
any two values, including a range that excludes it and an invalid bound:

    zero := carbon.CreateFromStdTime(time.Time{})
    zero.BetweenIncludedStart(zero, zero)   // true, but the end (zero) is excluded: want false
    zero.BetweenIncludedEnd(zero, zero)     // true, want false
    zero.BetweenIncludedBoth(zero, carbon.Parse("nonsense"))  // true although one bound is invalid
    zero.Between(zero, zero)                // false, consistent with the definition

`Between` has no such shortcut; the three should agree with it.
'''

[[bug]]
id = "carbon/29"
title = "julian.FromStdTime ignores the time zone: the Julian day of an instant depends on the zone it is viewed in, and Shanghai -> Julian -> UTC keeps the wall clock instead of the instant"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinJulianDayIsZoneIndependent"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`FromStdTime` reads `t.Date()` and `t.Clock()` (local wall clock) and never
consults the offset, so the JD it computes is the JD of the same wall clock
in UT. The Julian day is a count of days from an epoch in UT; it is a
property of the instant:

    a := carbon.CreateFromDateTime(2020, 8, 5, 12, 0, 0, "Asia/Shanghai")
    b := carbon.CreateFromDateTime(2020, 8, 5, 4, 0, 0, "UTC")   // same instant, a.Eq(b)
    a.Julian().JD()   // 2459067.000000
    b.Julian().JD()   // 2459066.666667  (= unix/86400 + 2440587.5, the right value)
    a.Julian().ToGregorian("UTC").Time  // 2020-08-05 12:00 UTC, want 04:00 UTC

`FromStdTime` should convert `t.UTC()`.
'''

[[bug]]
id = "carbon/30"
title = "DiffInMonths corrects its calendar estimate by at most one month, so from the 29th-31st it can return k although AddMonths(k) is after the end"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDiffInMonthsNeverPassesTheEnd"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`DiffInMonths` computes `months = 12*dy + dm` from the fields and subtracts one
if `start.AddDate(0, months, 0)` is after the end. `AddDate` overflows the
day (Jan 31 + 1 month = Mar 3), so the estimate can overshoot by two and one
correction is not enough:

    s := carbon.CreateFromDateTime(2023, 1, 31, 12, 0, 0, "UTC")
    e := carbon.CreateFromDateTime(2023, 3, 2, 6, 0, 0, "UTC")
    s.DiffInMonths(e)                // 1
    s.AddMonths(1).ToDateTimeString() // "2023-03-03 12:00:00", after e
    s.AddMonthsNoOverflow(1)          // 2023-02-28, before e

    s = 1989-01-31 23:59:59, e = 2006-12-01 01:59:14 : DiffInMonths = 214,
    s.AddMonths(214) = 2006-12-01 23:59:59 > e, want 213

The function is inconsistent with its own convention (it uses `AddDate` to
check): either loop until `AddMonths(k) <= end` or state and use the
day-clamping convention consistently.
'''
