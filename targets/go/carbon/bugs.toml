status = "open"
notes = '''
The day count is `int(t.Sub(epoch).Hours() / 24)` with `epoch` at Asia/Shanghai
midnight 1900-01-31 (then +08:05:43 LMT) and `t` the given instant. A wall
clock in New York, or in Shanghai during its 1986-1991 summer time, is not a
whole number of days from that epoch, so the lunar date flips at some hour
after midnight instead of at midnight:

    ny := carbon.CreateFromDateTime(2020, 4, 24, 0, 30, 0, "America/New_York")
    ny.Lunar().String()                         // "2020-04-01"
    ny.SetHour(12).Lunar().String()             // "2020-04-02", the same calendar day
    carbon.CreateFromDateTime(1988, 6, 20, 0, 30, 0, "Asia/Shanghai").Lunar()  // previous day too

The conversion should count calendar days (`time.Date(y, m, d)` in a fixed
zone, or the Julian day number), not elapsed 24-hour periods.
'''

[[bug]]
