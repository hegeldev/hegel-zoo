[[bug]]
id = "carbon/18"
title = "The Persian calendar uses the 2820-year arithmetic cycle, so 1403 is not a leap year and 1404 is: 1 Farvardin 1404 is 2025-03-20 instead of the official 2025-03-21"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPersian1404StartsOnMarch21"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
The `persian` package decides leap years with the 2820-year cycle formula.
The Iranian calendar is astronomical, and the cycle disagrees with it in
1403/1404 (and again around 1436): the official calendar makes 1403 a leap
year (Nowruz 1404 on 2025-03-21) while the cycle puts the leap day in 1404.

    carbon.CreateFromPersian(1404, 1, 1).ToDateString()   // "2025-03-20", want "2025-03-21"
    persian.NewPersian(1403, 12, 30).IsValid()             // false; 30 Esfand 1403 (2025-03-20) exists
    carbon.CreateFromDate(2025, 3, 20, "UTC").Persian().String() // "1404-01-01", want "1403-12-30"

The 33-year Birashk cycle, or the astronomical rule, matches the official
calendar for the years the library is likely to see (1398-1436 checked
against the published Nowruz dates).
'''

[[bug]]
id = "carbon/19"
title = "Persian years 1-473 are shifted: CreateFromPersian(1, 1, 1) is 0621-03-22 rather than 0622-03-22, year 473 has 730 days and a year of Gregorian dates has no Persian date"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPersianEpochIs622"
found = { commit = "e83625c5fe4a07af7d5e5261cae25b71abef15c0", version = "v2.6.17+", hegel = "v0.6.33", date = "2026-09-18" }
status = "open"
notes = '''
`persian.ToGregorian` computes the epoch offset with an integer division
that is off for years before the first full 2820-year cycle boundary; the
first 473 years land one year early and the whole error is absorbed in year
473:

    carbon.CreateFromPersian(1, 1, 1).ToDateString()     // "0621-03-22", want "0622-03-22"
    carbon.CreateFromPersian(473, 1, 1).ToDateString()   // "1093-03-21"
    carbon.CreateFromPersian(473, 12, 29).ToDateString() // "1094-03-20"
    carbon.CreateFromPersian(474, 1, 1).ToDateString()   // "1095-03-21": year 473 spans 730 days
    carbon.Parse("1094-06-01", "UTC").Persian().IsValid() // false: no Persian date maps to it

The Persian epoch is 622-03-22 (Julian 622-03-19); with the epoch fixed the
conversion round-trips for all years.
'''

