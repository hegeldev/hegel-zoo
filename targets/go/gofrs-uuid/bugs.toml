# Bugs found in gofrs/uuid by the Hegel properties. Each is pinned by the test named in
# `test`, listed as an expected failure in target.toml.

[[bug]]
id = "gofrs-uuid/1"
title = "NullUUID.Scan of a rejected source leaves Valid = true"
kind = "contract"
severity = "low"
test = "TestHegelPinNullUUIDScanOfBadInputIsInvalid"
found = { commit = "9b67c3bcafbf4484a2943d9f38cc3abd1698130c", version = "v5.5.1+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
sql.go `NullUUID.Scan`: `u.Valid = true; return u.UUID.Scan(src)` — the flag is set before the
delegate runs and is not cleared when it fails, so after `Scan("6ba7b810-…-00c04fd430cX")`
the struct is `{UUID: <15 decoded bytes + one old byte> Valid: true}` next to the returned
error. `NullUUID.UnmarshalJSON` gets it right (`u.Valid = (err == nil)`). Fix: set Valid from
the delegate's result.
'''

[[bug]]
id = "gofrs-uuid/2"
title = "Parse, UnmarshalText and Scan decode into the receiver byte by byte, so a rejected string leaves a mix of old and new bytes"
kind = "contract"
severity = "low"
test = "TestHegelPinRejectedTextLeavesTheReceiverUnchanged"
found = { commit = "9b67c3bcafbf4484a2943d9f38cc3abd1698130c", version = "v5.5.1+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
codec.go `parseBytes(b, u)` writes `u[i]` as it goes and returns `ErrInvalidFormat` at the
first bad digit, so `u.Parse("6ba7b810-9dad-11d1-80b4-00c04fd430cX")` on a receiver holding
`ffffffff-…-ffffffffffff` leaves `6ba7b810-9dad-11d1-80b4-00c04fd430ff`. `FromString` returns
the same partial value beside the error; `FromStringOrNil` and `NullUUID.UnmarshalJSON` mask
it, `Scan([]byte)`/`UnmarshalText` do not. Fix: decode into a local and copy on success (as
google/uuid's Parse does).
'''

[[bug]]
id = "gofrs-uuid/3"
title = "NullUUID.UnmarshalJSON hands the raw JSON token to the text parser: a 32-digit number is accepted and string escapes are not decoded"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNullUUIDUnmarshalJSONReadsJSON"
found = { commit = "9b67c3bcafbf4484a2943d9f38cc3abd1698130c", version = "v5.5.1+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
sql.go `NullUUID.UnmarshalJSON`: after the `null` check it strips a leading `"` and the last
byte and calls `UnmarshalText` on what is left. `json.Unmarshal([]byte("12345678901234567890123456789012"), &nu)`
(a JSON number) gives `{12345678-9012-3456-7890-123456789012 true}`; a JSON string with escapes
(`"6ba7b810-…"`, a legal spelling of the same string) fails, while `json.Unmarshal` into a
plain `UUID` (which goes through `UnmarshalText` after JSON decoding) handles both correctly.
Fix: `json.Unmarshal(b, &s)` into a string first, or into `&u.UUID`.
'''

[[bug]]
id = "gofrs-uuid/4"
title = "NewV1AtTime and NewV6AtTime encode a garbage timestamp for instants they cannot represent instead of returning an error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTimeBasedAtTimeRejectUnrepresentableInstants"
found = { commit = "9b67c3bcafbf4484a2943d9f38cc3abd1698130c", version = "v5.5.1+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
generator.go `getEpoch`: `epochStart + uint64(atTime.UnixNano()/100)`. Before 1582-10-15 the
tick count is negative and wraps (1500-01-01 reads back through `TimestampFromV1(...).Time()`
as 2084-07-20); between 1582 and 1678-09-21 and after 2262-04-11 `UnixNano()` itself overflows
(documented as undefined) and the UUID carries nonsense (1600 → 2184, 2300 → 1715) although the
60-bit field reaches 5236. Both functions return `(UUID, error)`; `NewV7AtTime` documents that
"times outside the range the 48-bit millisecond field can represent are pinned to the nearest
end of it" and does so — v1/v6 neither pin nor error. Fix: range-check (or compute the ticks
from `Unix()`/`Nanosecond()` in 128-bit arithmetic) and return an error or pin. Same defect as
google/uuid's `NewV6WithTime` (uuid/5 in this zoo).
'''
