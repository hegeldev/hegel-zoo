[[bug]]
id = "decimal/1"
title = "ExpHullAbrham of a small argument returns 10^exponent(d) instead of 1"
kind = "wrong-result"
severity = "high"
test = "TestHegelExpHullAbrhamOfASmallArgumentIsOne"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`NewFromString("0.001").ExpHullAbrham(2)` is `0.001`, `NewFromString("0.00500").ExpHullAbrham(2)`
is `0.00001`, `NewFromString("0.05").ExpHullAbrham(1)` is `0.01`, `New(1, -12).ExpHullAbrham(10)`
is `1E-12` — all should be `1` (e^x rounds to 1 at that many digits).  The shortcut for
|d| <= 9·10^-(p+1) ("Return 1 if abs(d) small enough") returns `Decimal{oneInt, d.exp}`, i.e.
1·10^d.exp, instead of `Decimal{oneInt, 0}`.  Any argument with a negative exponent below the
threshold is affected; `ExpTaylor` gets the same inputs right.
"""

[[bug]]
id = "decimal/2"
title = "ExpHullAbrham rounds a result below one to p decimal places instead of p significant digits"
kind = "wrong-result"
severity = "medium"
test = "TestHegelExpHullAbrhamKeepsSignificantDigitsBelowOne"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The precision argument is documented as "the overall precision of the result (integer part +
decimal part)", and positive arguments get p significant digits (`26.1` at precision 2 is
`220000000000`).  For results below one the final rounding uses p decimal places instead:
`NewFromInt(-50).ExpHullAbrham(10)` is `0` (e^-50 = 1.928749848E-22), `NewFromInt(-3)
.ExpHullAbrham(5)` is `0.04979` (4 significant digits, 3 ulps off 0.049787068),
`NewFromInt(-10).ExpHullAbrham(1)` is `0` (want 0.00005).  In the source, `roundDigits` is
`currentPrecision - resNumDigits - res.exp` only when the result has an integer part.
"""

[[bug]]
id = "decimal/3"
title = "Pow with a fractional exponent carries only about NumDigits(base)+6 significant digits"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPowOfAPerfectSquareIsExact"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`NewFromInt(16).Pow(NewFromFloat(0.5))` is `3.99999999`, `NewFromInt(25).Pow(0.5)` is
`4.99999999`, `NewFromInt(144).Pow(0.5)` is `12.000000003`, `NewFromInt(1000000).Pow(0.5)` is
`1000.0000000000129`, `NewFromInt(2).Pow(0.5)` is `1.4142136`.  `Pow` computes
x^frac(y) as exp(ln(x)·frac(y)) with `NumDigits(x) + 6` decimal places (plus `-x.exp`) and
does not round the result, so the printed digits look exact but the relative error is about
10^-(NumDigits(x)+6).  The doc comment's own example, `5 ** 5.73 = "10118.08037125"`, is wrong
from the ninth significant digit (the true value is 10118.0803715950193…, which
`PowWithPrecision`'s example gives).  Perfect squares under `Pow(x, 0.5)` are an exact
expectation a user can check; the general property compares `Pow` with Python only to a
relative 10^-6.
"""

[[bug]]
id = "decimal/4"
title = "PowWithPrecision misses its precision when the integer-part power is large (the fractional factor's rounding error is multiplied by x^int(y))"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPowWithPrecisionHonoursThePrecision"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"Precision parameter specifies minimum precision of the result (digits after decimal point)."
`NewFromInt(2).PowWithPrecision(NewFromFloat(60.5), 0)` is `1630477228166603484.88…`, the true
value 1630477228166597776.54… (off by 5.7·10^3 at precision 0);
`NewFromInt(1000).PowWithPrecision(NewFromFloat(100.5), 2)` is off by about 10^286;
`NewFromInt(10).PowWithPrecision(NewFromFloat(20.5), 5)` by about 10^5.  x^frac(y) is
computed to precision+10 decimal places and then multiplied by x^int(y), so the absolute error
is about x^int(y) · 10^-(precision+10): the claim fails as soon as the integer-part power
exceeds 10^10 or so.  Results below 10^6 (the general property's domain) are within the
precision.
"""

[[bug]]
id = "decimal/5"
title = "Sin, Cos and Tan of large arguments are unbounded (|Sin(1E17)| > 2000, Sin(1E20) has 250 integer digits)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelTrigOfLargeArgumentsStaysBounded"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`New(1, 17).Sin()` is `-2102.65…` and `.Cos()` `-2875.55…`; `New(37, 15).Sin()` is `-121.7`;
`New(1, 20).Sin()` is a 250-digit integer.  The argument reduction takes the octant index
`j := d.Mul(M4PI).IntPart()` and converts it back with `NewFromFloat(float64(j))`, which loses
digits once j exceeds 2^53 (x above about 7·10^15), so `x - j·π/4` is no longer a reduced
argument; from x ≈ 7·10^18 `IntPart` overflows int64 as well.  Accuracy already degrades
before that (error 4·10^-7 at 10^10, 2·10^-2 at 10^15).  Below 100 the functions agree with
the math package to 10^-12 (the general property's domain).
"""

[[bug]]
id = "decimal/6"
title = "PowInt32(math.MinInt32) is 1 for every base"
kind = "wrong-result"
severity = "low"
test = "TestHegelPowInt32OfTheSmallestExponentIsNotOne"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`NewFromInt(2).PowInt32(math.MinInt32)` is `1` (want 0 at 16 places: 2^-2147483648).  `exp =
abs(exp)` overflows for the smallest int32, the square-and-multiply loop `for exp > 0` never
runs and `1/1` is returned.  `PowBigInt(big.NewInt(math.MinInt32))` gets it right.
"""

[[bug]]
id = "decimal/7"
title = "IntPart wraps silently for values beyond int64"
kind = "contract"
severity = "low"
test = "TestHegelIntPartKeepsTheSign"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"IntPart returns the integer component of the decimal": `RequireFromString("1E19").IntPart()`
is `-8446744073709551616`, `New(1, 26).IntPart()` is `-2537764290115403776`.  The
`big.Int.Int64()` wrap is documented for `CoefficientInt64` ("the result will be undefined")
but not for `IntPart`; `BigInt()` is the safe form.
"""

[[bug]]
id = "decimal/8"
title = "Shift wraps the exponent silently where Mul panics on the same overflow"
kind = "contract"
severity = "low"
test = "TestHegelShiftRefusesExponentOverflow"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`New(1, math.MaxInt32).Shift(1)` has exponent `-2147483648`, i.e. 10^-2147483648 instead of
10^2147483648.  `Mul` checks the same sum in int64 and panics ("better to panic than give
incorrect results, as Decimals are usually used for money"); `Shift` adds the int32s
directly.
"""

[[bug]]
id = "decimal/9"
title = "PowInt32 and PowBigInt of zero with a negative exponent panic with \"decimal division by 0\""
kind = "crash"
severity = "medium"
test = "TestHegelPowInt32OfZeroWithANegativeExponentReturnsAnError"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`decimal.Zero.PowInt32(-1)` and `decimal.Zero.PowBigInt(big.NewInt(-1))` panic ("decimal
division by 0"); the doc says "Only returns error when d and exp is 0".  The loop computes
0^|exp| = 0 and then `New(1, 0).DivRound(result, precision)` divides by it.  `Pow` returns 0
for the same input (documented) and `PowWithPrecision` returns the "cannot represent
infinity" error.
"""

[[bug]]
id = "decimal/10"
title = "PowWithPrecision with a negative non-integer exponent rounds the integer-part reciprocal to the requested places before applying the fractional factor"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPowWithPrecisionHonoursThePrecisionForNegativeExponents"
found = { commit = "ca4740823783f3bc026235a5ed3515aca626da92", version = "v1.4.0+", hegel = "v0.6.33", date = "2026-08-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`NewFromFloat(0.03).PowWithPrecision(NewFromFloat(-1.4), 0)` is `134.1730950413634`; the true
value is 135.5284.  The exponent is split as -1 + (-0.4); `powBigIntWithPrecision(-1,
precision)` rounds 1/0.03 to `precision` = 0 places (33 instead of 33.333…) and the result is
33 · 0.03^-0.4.  With precision 2 the error is still 10^-2·x^-frac(y) — about 0.1 here.
Positive exponents, and `Pow` (which uses 16 places for the reciprocal), are not affected.
"""
