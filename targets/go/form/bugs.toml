# Bugs found in github.com/go-playground/form/v4 by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure
# in target.toml.

[[bug]]
id = "form/1"
title = "Decode panics on a key with a ] before any [ or an unclosed [ when the destination has a slice, array, map or nested struct"
kind = "crash"
severity = "medium"
test = "TestHegelPinBracketKeyPanic"
found = { commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5", version = "v4.5.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
form.NewDecoder().Decode(&dst, url.Values{"x]": {"1"}}) with dst a struct that has a slice
field (or an array, a map, or a nested struct field) panics: "Invalid formatting for key 'x]'
missing '[' bracket"; so does an unclosed bracket ("x[", "a[b"). parseMapData (decoder.go)
scans every key of the url.Values once the first slice, array, map or struct field is reached
and calls log.Panicf for a ] outside a bracket pair and for a [ still open at the end of the
key. The keys come from the request (r.Form): any client can crash the handler's goroutine
(net/http recovers a panic per request, but the response is lost and the log fills). Decode
returns DecodeErrors for every other malformed input; a malformed key should be an error too,
or ignored like any key that matches no field. A flat struct (no container field) never calls
parseMapData and takes the same key without complaint. Found while writing TestHegelIndexed.
"""

[[bug]]
id = "form/2"
title = "Decode panics on an interface{} field that already holds a value"
kind = "crash"
severity = "medium"
test = "TestHegelPinPrefilledInterface"
found = { commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5", version = "v4.5.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dst := struct{ Any interface{} }{Any: "old"}; form.NewDecoder().Decode(&dst,
url.Values{"Any": {"new"}}) panics: "reflect: reflect.Value.SetString using unaddressable
value" (with Any holding an int, SetInt; a struct, the same for its first field). ExtractType
(util.go) follows a non-nil interface to its dynamic value, which reflect does not let one set
in place, and setFieldByType then sets it as if it were the field. Decoding into a struct with
defaults is the documented use ("Only creates objects as necessary ... left as their default
values"); an interface{} field with a default cannot be decoded into at all. The empty
interface field works (a nil interface is set to the string), so the value should be replaced
the same way when the field already holds one. Found while writing TestHegelScalars.
"""

[[bug]]
id = "form/3"
title = "The encoder drops nil elements of a slice of interfaces without indexing the others, so their positions are lost"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNilInterfaceElements"
found = { commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5", version = "v4.5.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Encode(&struct{ A []interface{} }{A: []interface{}{nil, "a"}}) gives url.Values{"A": {"a"}},
which decodes to []interface{}{"a"}: the nil element is gone and "a" has moved to index 0.
doc.go: the encoder "attempts to avoid using array indexes in url.Values if at all possible
... however there are times where it is unavoidable, like with pointers", and indeed
[]*string{nil, &a} is written as "A[1]": {"a"} and reads back with the nil in place. In
setFieldByType (encoder.go) the switch to indexed keys is made for reflect.Pointer elements
only; a nil interface element returns from the Interface case without writing anything and
the following elements are appended to the plain key. Found by TestHegelRoundTrip and
TestHegelEncodeModel.
"""

[[bug]]
id = "form/4"
title = "An unparsable time value zeroes the field, and points a nil *time.Time at a zero time, besides the error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInvalidTimeKeepsValue"
found = { commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5", version = "v4.5.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dst := struct{ T time.Time; PT *time.Time }{T: x}; Decode(&dst, url.Values{"T": {"garbage"},
"PT": {"garbage"}}) records the two parse errors in DecodeErrors, as it should, but also sets
T to the zero time and PT to a pointer to the zero time. Every other kind leaves the field as
it was on a parse error (the int, uint, float and bool cases return before setting); the
time.Time case in setFieldByType (decoder.go) calls d.setError and falls through to
v.Set(reflect.ValueOf(t)) with the zero t and set = true, so the Pointer case allocates too.
Found by TestHegelScalars.
"""

[[bug]]
id = "form/5"
title = "Map keys containing [ or ] are encoded unescaped and cannot be decoded: ] makes the decoder panic, [ loses the entry"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBracketMapKey"
found = { commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5", version = "v4.5.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Encode(&struct{ M map[string]string }{M: {"a]": "v"}}) gives url.Values{"M[a]]": {"v"}}, and
Decode of that panics (bug 1: "missing '[' bracket"); with the key "a[b" the value
url.Values{"M[a[b]": {"v"}} decodes to a nil map, the entry silently lost, because the
decoder takes the last [ before the ] as the opening bracket (alias "M[a", key "b"). The
encoder's getMapKey (encoder.go) writes the key's text into the namespace as is; keys with a
dot, a space or nothing at all round trip fine. Either the brackets need an escape (or the
key an error from Encode, which already reports unsupported key kinds), or the decoder must
read a key up to the matching bracket. Found by TestHegelRoundTrip.
"""

[[bug]]
id = "form/6"
title = "An encoder custom type function returning no values for a map key panics with index out of range"
kind = "crash"
severity = "low"
test = "TestHegelPinEmptyCustomMapKey"
found = { commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5", version = "v4.5.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
e.RegisterCustomTypeFunc(func(x interface{}) ([]string, error) { return nil, nil }, Color(""))
then e.Encode(&struct{ M map[Color]string }{M: {"k": "v"}}) panics: "runtime error: index out
of range [0] with length 0". getMapKey (encoder.go) returns arr[0] of what the function gave
without checking that it gave anything. For a field the same function is fine (the key is
written with no values); a function that returns nothing for a zero value (the usual way to
omit it) cannot be used on a type that is also a map key. An error (EncodeErrors already
carries "unsupported map key") or skipping the entry would do. Found while writing
TestHegelCustomTypes.
"""

[[bug]]
id = "form/7"
title = "A decoder custom type function returning nil for a map key panics with reflect.Value.Set on zero Value"
kind = "crash"
severity = "low"
test = "TestHegelPinNilCustomMapKey"
found = { commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5", version = "v4.5.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
d.RegisterCustomTypeFunc(func(v []string) (interface{}, error) { return nil, nil }, Color(""))
then d.Decode(&dst, url.Values{"M[k]": {"v"}}) with dst having M map[Color]string panics:
"reflect: call of reflect.Value.Set on zero Value". v4.3.1 (#77, "Fix panic when a custom type
function returns nil for a pointer field") made setFieldByType leave a field alone when the
function returns nil, but getMapKey (decoder.go) still does v.Set(reflect.ValueOf(val)) with
the nil. The same function on the field C Color of the same struct leaves it untouched, as
documented by that fix. Found while writing TestHegelCustomTypes.
"""
