name = "form"
language = "go"
upstream = "https://github.com/go-playground/form"
subdir = ""
license = "MIT"  # .github/CONTRIBUTING.md (commit c6386e4, 2026-09-20): AI-assisted contributions are welcome with attribution (Co-Authored-By trailer, AI-generated stated in PRs and issues); CLAUDE.md is Claude Code guidance. Nothing forbids AI-written tests or use (checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "5b6e41f35d5b3c4f3605f0ddcdfba6191c8d76e5"
date = "2026-09-20"
version = "v4.5.0"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
# Wide properties: the shapes of the recorded bugs are drawn by default (STYLE.md rule 11) and
# each lands in the basin it reaches most often.
TestHegelIndexed = { bug = "form/1", intermittent = true }
TestHegelScalars = "form/4"
TestHegelEncodeModel = "form/3"
TestHegelDecodeModel = "form/5"
TestHegelRoundTrip = "form/5"
TestHegelCustomTypes = "form/5"
# Narrow properties, one per bug, over the bug's shape region with random contents.
TestHegelStrayBracketKeysAreIgnored = "form/1"
TestHegelHeldInterfaceIsReplaced = "form/2"
TestHegelNilInterfaceElementsKeepTheirPositions = "form/3"
TestHegelUnparsableTimeLeavesTheField = "form/4"
TestHegelBracketMapKeysRoundTrip = "form/5"
TestHegelCustomMapKeyWithoutValuesIsSkipped = "form/6"
TestHegelNilCustomMapKeyIsAnError = "form/7"
# Pins: the regression examples.
TestHegelPinBracketKeyPanic = "form/1"
TestHegelPinPrefilledInterface = "form/2"
TestHegelPinNilInterfaceElements = "form/3"
TestHegelPinInvalidTimeKeepsValue = "form/4"
TestHegelPinBracketMapKey = "form/5"
TestHegelPinEmptyCustomMapKey = "form/6"
TestHegelPinNilCustomMapKey = "form/7"
