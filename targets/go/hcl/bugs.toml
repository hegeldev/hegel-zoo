[[bug]]
id = "hcl/1"
title = "`<<-` heredocs leave whitespace-only lines unstripped"
kind = "contract"
severity = "low"
test = "TestHegelPinIndentedHeredocStripsBlankLines"
found = { commit = "4932c1452af6bd71e2241ba244f253643d1828da", version = "v2.25.0+ (2026-09-17)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The native syntax spec (hclsyntax/spec.md) says of `<<-`: "any literal string at the start of
each line is analyzed to find the minimum number of leading spaces, and then that number of
prefix spaces is removed from all line-leading literal strings". `a = <<-END\n  x\n \nEND`
evaluates to `"x\n \n"`: the blank line keeps its space while `x` lost two (the spec gives
`"x\n\n"`, or `" x\n\n"` if the blank line counts towards the minimum); `<<-END\n \nEND` stays
`" \n"`; with tabs, `\tx\n\t\n\ty` keeps the tab of the blank line. `flushHeredocTemplateParts`
in hclsyntax/parser_template.go skips whitespace-only lines both when computing the minimum and
when trimming, so those lines alone keep their indentation. Found by the native/JSON property
(the JSON side has no heredoc, so the model's dedent disagreed); the generator's heredocs have no
whitespace-only lines while the bug is open.
'''

[[bug]]
id = "hcl/2"
title = "hclwrite Labels() omits a quoted block label spelled with a template escape"
kind = "contract"
severity = "medium"
test = "TestHegelPinWriterKeepsEscapedLabels"
found = { commit = "4932c1452af6bd71e2241ba244f253643d1828da", version = "v2.25.0+ (2026-09-17)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`hclwrite.ParseConfig` of `resource "a$" "b" {}` gives a block whose `Labels()` is `["b"]`: the
label `"a$"` is missing and the following labels shift down. The same for `"a%"`, `"$${x}"`
(the escape of `${x}`) and `"%%{x}"`; a label that is exactly `"$"` is kept, and `Bytes()` still
prints the label, so the file is not damaged, but `Labels()`, and so `FirstMatchingBlock` and any
code deciding by label, see the wrong labels. The parser (hclwrite/parser.go) turns a quoted label
into a `quoted` node only when its tokens are a single `TokenQuotedLit` between the quotes; an
escape or a `$`/`%` beside other characters lexes as several literal tokens, which are left as
unstructured tokens. hclsyntax reads the labels correctly. Found by the writer property comparing
`Labels()` with the parsed labels; the property leaves such labels out while the bug is open.
'''

[[bug]]
id = "hcl/3"
title = "hclwrite drops a comment between a block's type and its first label"
kind = "contract"
severity = "low"
test = "TestHegelPinWriterKeepsCommentAfterBlockType"
found = { commit = "4932c1452af6bd71e2241ba244f253643d1828da", version = "v2.25.0+ (2026-09-17)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`hclwrite.ParseConfig([]byte("resource /* c */ \"a\" {}\n")).Bytes()` is `resource "a" {}\n`: the
comment is gone, with a quoted or an identifier label alike. Comments between two labels, before
the `{`, or around `=` in an attribute survive, and `hclwrite.Format` keeps this one, so parsing
a file with hclwrite (as `terraform fmt`-like tools do) and writing it back loses it. The block
parser (`parseBlock` in hclwrite/parser.go) reads the type identifier and then the labels, and the
comment tokens between them are attached to no node. Found by the writer property (`Bytes()`
compared with `Format`); the generator puts no comment there while the bug is open.
'''

[[bug]]
id = "hcl/4"
title = "hclsyntax JustAttributes on the body PartialContent leaves reports the extracted blocks"
kind = "contract"
severity = "low"
test = "TestHegelPinJustAttributesIgnoresExtractedBlocks"
found = { commit = "4932c1452af6bd71e2241ba244f253643d1828da", version = "v2.25.0+ (2026-09-17)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`PartialContent` documents the returned body as holding "the remaining items from the body that
were not selected by the schema", and `Content` on that body indeed ignores the extracted blocks
(they are recorded in `hiddenBlocks`). `JustAttributes` on the same body still errors with
`Unexpected "resource" block; Blocks are not allowed here` for `resource {}\na = 1` after a
PartialContent that took the `resource` blocks (hclsyntax/structure.go checks `len(b.Blocks) > 0`
without consulting `hiddenBlocks`; attributes do consult `hiddenAttrs`). The JSON body has no such
error, and `hcl.MergeFiles` bodies inherit the native behaviour. Found by the PartialContent
property; it calls JustAttributes on native remainders only when no block was extracted while
the bug is open.
'''

[[bug]]
id = "hcl/5"
title = "hclwrite edits inside a one-line block write invalid HCL"
kind = "contract"
severity = "medium"
test = "TestHegelPinWriterEditsInOneLineBlockParse"
found = { commit = "4932c1452af6bd71e2241ba244f253643d1828da", version = "v2.25.0+ (2026-09-17)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = "https://github.com/hashicorp/hcl/issues/687"
fixed_in = ""
notes = '''
After `hclwrite.ParseConfig` of `resource {}`, `Body().SetAttributeValue("b", cty.True)` on the
block's body writes `resource { b = true\n}`, which hclsyntax rejects ("Invalid single-argument
block definition"); `AppendNewBlock("inner", nil)` writes `resource { inner {\n  }\n}`; from
`resource { a = 1 }` the results are `resource { a = 1 b = true\n}` and
`resource { a = 1 inner {\n  }\n}`. A block created by hclwrite itself is multi-line and fine. The
new item is appended before the closing brace with a trailing newline but no newline after the
opening brace or after the existing attribute. Upstream issue #687 (2024-07-25, open) reports the
`AppendNewBlock` case (`atlas {}`); pull request #828 (2026-08-30, open) proposes a fix in
`Format`. Found by the edits-on-parsed-files property; it spells every block multi-line while the
bug is open.
'''
