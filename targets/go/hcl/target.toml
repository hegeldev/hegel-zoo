name = "hcl"
language = "go"
upstream = "https://github.com/hashicorp/hcl"
subdir = ""
license = "MPL-2.0"  # no CONTRIBUTING file and no AI policy in the repository (README, .github/); the zoo only records bugs, nothing is sent upstream
ai_policy_checked = "2026-09-17"

[base]
commit = "4932c1452af6bd71e2241ba244f253643d1828da"
date = "2026-09-17"
version = "v2.25.0+ (main 2026-09-17; v2.25.0 is the last tag)"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ."  # the tests live in the module root, package hcl_test

[expected_failures]
# The wide properties draw the shapes of the recorded bugs by default (STYLE.md rule 11) and
# fail naming the bug of the majority basin; the narrow properties in hegel_shapes_test.go are
# the deterministic expected failure of each bug; HEGEL_NO_KNOWN=1 switches the shapes off.
TestHegelNativeAndJSONBodiesAgree = "hcl/1"
TestHegelFormatChangesOnlyWhitespace = "hcl/3"
TestHegelRangesPointAtTheSource = "hcl/1"
TestHegelWriterAgreesWithFormat = "hcl/2"
TestHegelPartialContentLeavesTheRest = "hcl/4"
TestHegelEditsOnParsedFilesKeepTheRest = "hcl/1"
TestHegelBrokenInputsNeverPanic = { bug = "hcl/3", intermittent = true }
TestHegelIndentedHeredocsStripBlankLines = "hcl/1"
TestHegelWriterKeepsEscapedLabels = "hcl/2"
TestHegelWriterKeepsCommentAfterBlockType = "hcl/3"
TestHegelJustAttributesIgnoresExtractedBlocks = "hcl/4"
TestHegelWriterEditsInOneLineBlocksParse = "hcl/5"
TestHegelTemplateEscapesAfterCarriageReturn = "hcl/6"
TestHegelFormatKeepsUnaryMinusAfterComment = "hcl/7"
TestHegelPinIndentedHeredocStripsBlankLines = "hcl/1"
TestHegelPinWriterKeepsEscapedLabels = "hcl/2"
TestHegelPinWriterKeepsCommentAfterBlockType = "hcl/3"
TestHegelPinJustAttributesIgnoresExtractedBlocks = "hcl/4"
TestHegelPinWriterEditsInOneLineBlockParse = "hcl/5"
TestHegelPinTemplateEscapesAfterCarriageReturn = "hcl/6"
TestHegelPinFormatKeepsUnaryMinusAfterComment = "hcl/7"
