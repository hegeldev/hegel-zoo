[[bug]]
id = "go-colorful/1"
title = "Hcl() and LuvLCh() report hue 0 whenever a* ≈ b* or |a*| ≤ 1e-4, whatever the chroma"
kind = "correctness"
severity = "medium"
test = "TestHegelPinHclHueIsAtan2"
found = { commit = "315b48282c63bac7b48ba128d0c87b7f827b2285", version = "v1.4.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`LabToHcl` (colors.go) guards its `Atan2` with "a floating point workaround necessary if a ~= b
and both are very small": `if math.Abs(b-a) > 1e-4 && math.Abs(a) > 1e-4 { h = atan2 } else { h =
0 }`. The condition does not look at the magnitude, so the hue is zeroed for every colour whose
a* equals b* (hue 45° or 225°) or whose a* is within 1e-4 of zero (hue 90° or 270°) while the
chroma is kept: `LabToHcl(0.5, 0.3, 0.3)` is `(0, 0.424, 0.5)` instead of `(45, 0.424, 0.5)`,
`LabToHcl(0.5, 0.00005, 0.5)` gives hue 0 instead of 90, and `Hcl(90, 0.3, 0.6).Hcl()` reads back
hue 0 because `cos 90°` is 6e-17. `Hcl(c.Hcl())` is then a different colour (`Lab(0.5, 0.3, 0.3)` =
{0.70 0.38 0.27} comes back as {0.72 0.34 0.47}), and `BlendHcl` from such a colour swings through
red. `LuvToLuvLCh` has the same guard. The guard should test the chroma (or nothing: `Atan2(0, 0)`
is 0 already). Found by the round-trip properties at the hue-45° diagonal; while the bug is open
the properties skip colours whose (a*, b*) or (u*, v*) pair has the guard's shape.
'''

[[bug]]
id = "go-colorful/2"
title = "Hsv() and Hsl() can return hue 360, and Hsv(360, s, v) is a grey"
kind = "contract"
severity = "low"
test = "TestHegelPinHsvHueBelow360"
found = { commit = "315b48282c63bac7b48ba128d0c87b7f827b2285", version = "v1.4.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Hsv()` computes a negative hue for a colour whose green is a rounding error below its blue with
red at the maximum, and adds 360: for `Color{1, 0.4999999999999999, 0.5}` the sum rounds to exactly
360, outside the documented `[0..359]` / `[0, 360)`. `Hsv(360, s, v)` then matches none of the six
sectors (`Hp = 6`) and returns `Color{V-C, V-C, V-C}`, a grey — `Hsv(360, 1, 1)` is black — so
`Hsv(c.Hsv())` of that colour is {0.5 0.5 0.5} instead of {1 0.5 0.5}. `Hsl()` returns 360 for
the same colour (`Hsl(360, ...)` happens to wrap). The v1.3.0 changelog says hue 360 "is not
allowed" as input, which makes returning it the bug: a `Mod(h, 360)` (or treating 360 as 0 in the
constructor, as Python's colorsys does) fixes it. Found by the colorsys and round-trip properties
on a colour with two channels an ulp apart; while the bug is open they skip a hue of exactly 360.
'''

[[bug]]
id = "go-colorful/3"
title = "BlendLuvLCh has no grey rule: blending from a grey swings the hue through red"
kind = "contract"
severity = "low"
test = "TestHegelPinBlendLuvLChFromGreyKeepsTheHue"
found = { commit = "315b48282c63bac7b48ba128d0c87b7f827b2285", version = "v1.4.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Pull request #60 (v1.3.0, "Fix bug when doing HSV/HCL blending between a gray color and non-gray
color") made `BlendHsv`, `BlendHcl` and later `BlendOkLch` take the other end's hue when one end
has no chroma, so a grey-to-blue gradient stays blue-grey. `BlendLuvLCh` (colors.go) interpolates
the hue from the grey's meaningless hue 0: `Color{0.5, 0.5, 0.5}.BlendLuvLCh(Color{0.2, 0.3, 0.9},
0.25)` is {0.60 0.41 0.51}, a pink, where `BlendHcl` gives {0.48 0.45 0.60}, `BlendHsv` {0.48 0.50
0.60} and `BlendOkLch` {0.42 0.47 0.61}; at t = 0.5 the LuvLCh blend is {0.63 0.32 0.61}, redder
than blue. Found by the blend property's symmetry check (`blend(c1, c2, t)` against `blend(c2, c1,
1-t)`, which differ when only one end is grey); while the bug is open the property does not ask
BlendLuvLCh for the grey rule.
'''

[[bug]]
id = "go-colorful/4"
title = "OkLab's inverse matrices do not invert its forward ones: OkLab(c.OkLab()) is off by up to 4e-3"
kind = "correctness"
severity = "medium"
test = "TestHegelPinOkLabRoundTrips"
found = { commit = "315b48282c63bac7b48ba128d0c87b7f827b2285", version = "v1.4.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`XyzToOkLab` uses the ten-digit matrices of Ottosson's 2020 post and `OkLabToXyz` the sixteen-
digit inverses of CSS Color 4, which were recomputed from higher-precision primaries and differ from
the inverses of the ten-digit matrices in the fourth significant digit. The two do not compose to
the identity: `OkLabToXyz(XyzToOkLab(0.3, 0.4, 0.5))` is off by about 1e-4, and through the steep
low end of the sRGB curve `OkLab(c.OkLab())` moves a channel by up to 3.7e-3 — `Color{0, 1, 1}`
comes back as {-0.0030 0.99999 1.0003} (invalid), `Color{1, 1, 0.0196}` as {0.9998 1.0001 0.0233},
and on the 8-bit grid (step 5) 2.5% of the colours change their `Hex()`. `BlendOkLab(c1, c2, 0)`
and `BlendOkLch(c1, c2, 0)` therefore do not return `c1` (`BlendOkLab(cyan, red, 0)` is the invalid
colour above; the OkLch blend clamps it), while every CIE space of the library round-trips to
1e-12. Oklab also promises D65 white at exactly (1, 0, 0); `Color{1, 1, 1}.OkLab()` is (0.999999
-2.2e-5 -1.2e-4). Using one consistent pair — CSS Color 4's forward and inverse matrices — fixes
both. Found by the round-trip property on its first saturated colour; while the bug is open the
properties allow 5e-3 in RGB and 5e-4 in OkLab coordinates through the inverse.
'''
