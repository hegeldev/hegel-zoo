# Bugs found in github.com/pion/sdp/v3 by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure in
# target.toml.

[[bug]]
id = "sdp/1"
title = "A numeric field beyond uint64 wraps around silently"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNumericOverflow"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
t=99999999999999999999 0 parses with StartTime 7766279631452241919 and no error; the same for
the o= session id and version and the z= adjustment times. baseLexer.readUint64Field
(base_lexer.go) accumulates i = i*10 + digit without an overflow check, unlike the
strconv.ParseUint the b= line uses. RFC 4566 5.9 gives these fields as decimal NTP timestamps;
a value that does not fit is malformed, not a different time. Found by TestHegelUnmarshal
(switch uintWraps).
"""

[[bug]]
id = "sdp/2"
title = "A missing numeric field reads as zero: t= and t=5 are accepted, and v= without a value"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMissingTimingFields"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
t= (nothing after the '=') is accepted as t=0 0, t=5 as t=5 0, v= as v=0, o=- 1 as a session
version 0. readUint64Field returns 0 with no error when it meets the line break before any digit,
so a field that RFC 4566 makes mandatory (t=<start-time> <stop-time>, v=0) is invented rather
than reported. The package's own state table comment documents these lines as required. Found by
TestHegelUnmarshal (switch missingNumericIsZero).
"""

[[bug]]
id = "sdp/3"
title = "A final numeric field 0 without a line break is an EOF error while 1 is accepted"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinZeroAtEndOfInput"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A description ending in "t=1 1" without a trailing CRLF parses; the same ending in "t=1 0" fails
with "EOF". readUint64Field treats io.EOF as the end of the field only when the value read so far
is positive ("errors.Is(err, io.EOF) && i > 0"), so a final zero (t=0 0 is the usual unbounded
session) is the one value that cannot end the input. Either a missing final line break is
tolerated or it is not; the value of the number must not decide. Found by TestHegelUnmarshal
(switch zeroAtEOFFails).
"""

[[bug]]
id = "sdp/4"
title = "A description cut off before its mandatory lines is accepted, the empty string included"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmptyDocumentRejected"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
UnmarshalString("") returns nil and leaves a zero description that marshals as "v=0\\r\\no= 0 0
\\r\\ns=\\r\\n"; so do "v=0\\r\\n" alone and a description without any t= line. lexer.handleType
returns the end state on io.EOF from every state, but the state table in unmarshal.go marks only
states 9 and 11-16 (after the first t=) as places where the input may end, and RFC 4566 requires
v=, o=, s= and at least one t=. A truncated message is taken for a complete one. Found by
TestHegelUnmarshal (switch truncatedDocumentAccepted).
"""

[[bug]]
id = "sdp/5"
title = "A lone final byte without = is silently ignored"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDanglingByte"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"...t=0 0\\r\\nm" (a last line of one byte) parses as if the "m" were not there, while "mx"
is a syntax error and "m=" an EOF error. readType returns (0, io.EOF) when the second byte is
missing, and handleType takes key 0 with io.EOF for a clean end of input. Found by
TestHegelUnmarshal (switch danglingByteIgnored).
"""

[[bug]]
id = "sdp/6"
title = "A CR inside a text line cuts as many bytes from the end of the line as there are CRs"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCRInsideLine"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
s=a<CR>b<CR><LF> gives the session name "a\\r": readLine (base_lexer.go) counts every '\\r' seen
on the line and removes that many bytes before the '\\n', so an embedded CR keeps itself and
drops the character before the line end. The same happens to i=, e=, p=, k= and a= lines. A CR
that is not part of the CRLF is not valid SDP text (RFC 4566 section 9: byte-string excludes CR
and LF); it should be rejected or kept, not silently move the cut. Found by TestHegelUnmarshal
(switch crCountTrimsLine).
"""

[[bug]]
id = "sdp/7"
title = "Extra fields on a field-based line are parsed as the next line"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinExtraFieldOnTiming"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"t=0 0 a=b\\r\\n" is accepted as a t= line followed by the attribute "b"; "o=- 1 2 IN IP4 1.2.3.4
s=x" as an origin followed by the session name "x"; "v=0 o=- 1 2 IN IP4 1.2.3.4" likewise.
After the last field of v=, o=, c=, t=, r=, z= and m=, nextLine (base_lexer.go) only skips line
breaks and leaves anything else in place, so the next readType starts in the middle of the line.
RFC 4566 fixes the number of fields of these lines; a surplus is a syntax error (as it is when
the surplus does not happen to look like "<type>=", e.g. "t=0 0 x" fails). Found by
TestHegelUnmarshal (switch extraFieldStartsLine).
"""

[[bug]]
id = "sdp/8"
title = "An unpaired trailing z= adjustment time is dropped, and z= with nothing after it accepted"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnpairedTimeZone"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
z=1 -1h 2 parses as the single zone {1, -3600} and z= (empty) as no zones, both without error.
unmarshalTimeZones reads pairs and breaks out when the offset field is empty; the comment above
the loop says the code "is making sure that there are actually multiple of 2 total", but nothing
checks it. RFC 4566 5.11: z=<adjustment time> <offset> <adjustment time> <offset> .... Found by
TestHegelUnmarshal (switch timeZoneOddDropped).
"""

[[bug]]
id = "sdp/9"
title = "A connection address TTL and range are never parsed: Address keeps the /ttl/range text"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinConnectionTTL"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
c=IN IP4 224.2.1.1/127/3 parses to Address{Address: "224.2.1.1/127/3"} with TTL and Range nil,
although the Address struct has TTL and Range fields and Marshal writes them as "/<ttl>/<range>".
So Marshal then UnmarshalString does not return the description it was given: an Address with
TTL 127 comes back as the address string "224.2.1.1/127" with no TTL. unmarshalConnectionInformation
(unmarshal.go) stores the whole field. RFC 4566 5.7 defines the field as
<base multicast address>[/<ttl>]/<number of addresses>. Found by TestHegelRoundTrip and
TestHegelUnmarshal (switch connectionTTLNotParsed).
"""

[[bug]]
id = "sdp/10"
title = "m= port 9/2/3 is accepted with /3 dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPortRangeTail"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
m=audio 9/2/3 RTP/AVP 0 parses as port 9 with range 2; the third part is ignored, while 9/x and
9/ are errors. unmarshalMediaDescription splits the port field at '/' and reads parts[0] and
parts[1] only. RFC 4566 5.14: <port>/<number of ports>. Found by TestHegelUnmarshal (switch
portRangeTailIgnored).
"""

[[bug]]
id = "sdp/11"
title = "An unknown transport protocol in m= is reported as an invalid numeric value"
kind = "contract"
severity = "low"
test = "TestHegelPinProtoErrorKind"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
m=audio 9 RTP/XX 0 fails with "sdp: invalid numeric value `RTP/XX`" (errSDPInvalidNumericValue),
the sentinel every other unknown token (media type, network type, address type, bandwidth
type) reports as errSDPInvalidValue; m=audio 9 (no proto) says "invalid numeric value ``". The
proto loop in unmarshalMediaDescription wraps the wrong sentinel. Found by TestHegelUnmarshal
(switch protoErrorIsNumeric).
"""

[[bug]]
id = "sdp/12"
title = "MarshalSize is one byte short for a media description without formats"
kind = "contract"
severity = "low"
test = "TestHegelPinMarshalSizeNoFormats"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A MediaDescription with Formats nil marshals as "m=audio 9 RTP/AVP \\r\\n" (a trailing space
after the protocol) and MarshalSize, documented as "the size of the SessionDescription once
marshaled", is one less than len(Marshal()). MediaName.marshalInto always appends the space
before the format list; marshalSize counts one byte per format. Marshal allocates with
MarshalSize as the capacity, so the buffer is grown once for nothing. Found by TestHegelRoundTrip
(switch emptyFormatsSizeOffByOne).
"""

[[bug]]
id = "sdp/13"
title = "WithExtMap adds an attribute whose Key is the whole extmap text, so Attribute(extmap) misses it"
kind = "contract"
severity = "low"
test = "TestHegelPinWithExtMapAttribute"
found = { commit = "8921edc83d51945017b2e1a987733a23bb9a9004", version = "v3.0.20", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
md.WithExtMap(ExtMap{Value: 1, URI: u}) appends Attribute{Key: "extmap:1 <uri>", Value: ""}
(jsep.go: WithPropertyAttribute(e.Marshal())), while every other With* helper and the
unmarshaller produce Key "extmap" with the rest as Value. md.Attribute("extmap") returns false
until the description has been marshalled and parsed again, where the same line comes back split
at the ':'. Found by reading jsep.go while writing TestHegelRoundTrip.
"""
