[[bug]]
id = "cel-go/1"
title = "The Pratt parser rejects a numeric literal directly followed by the keyword in (1in[1]), which the ANTLR parser splits into two tokens"
kind = "differential"
severity = "low"
test = "TestHegelPinPrattLiteralIn"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parser.EnablePrattParser(true) selects the hand-written parser (parser/pratt_parser.go,
parser/lexer.go) as a drop-in for the ANTLR one. The generated grammar's lexer takes the
longest numeric token and then the keyword: `1in[1]`, `0x1in[1]`, `1uin[1u]`, `1.0in[1.0]`,
`1e3in[1e3]` and `1in li` all parse as `_ in _`. The Pratt lexer reports "int literal has
unexpected trailing characters" (uint/float alike) for each of them. With a space before
`in`, or an identifier, string or list on the left (`'a'in['a']`, `[1]in[[1]]`), both agree.
'''

[[bug]]
id = "cel-go/2"
title = "The Pratt parser records different offset ranges from the ANTLR parser for negative numeric literals, leading-dot identifiers and message literals"
kind = "differential"
severity = "low"
test = "TestHegelPinPrattNegativeLiteralOffset"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SourceInfo.GetOffsetRange(id) of the same node differs between the two parsers: for `-1`
ANTLR records 0-2 (the whole literal) and Pratt 0-1; for `-1.5` 0-4 against 0-1; for
`uint(-3037000499)` the literal is 5-16 against 5-6; for the leading-dot identifier `.b`
ANTLR records 1-2 (the name) and Pratt 0-1 (the dot); for the message literal `M{a: 1}`
ANTLR records 1-2 (the brace) and Pratt 0-1 (the name). Every other node kind agreed over
some 3000 generated, damaged and random inputs: the trees and macro-call records were the
same, and the offsets of calls, selects, lists, maps, comprehensions and other literals too.
Error messages and error positions for rejected inputs differ freely and are not judged.
'''

[[bug]]
id = "cel-go/3"
title = "An operand whose type is unresolved (an element of an empty list or map literal) is typed by the first matching overload: -({}['a']) is double and -({}['a']) + 1 fails to check"
kind = "contract"
severity = "medium"
test = "TestHegelPinCheckerTypeVarFirstOverload"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{}` is typed map(dyn, dyn) and `{}['a']` dyn, as printed; but internally the element type is
a fresh type variable, and checker.resolveOverload tries the overloads in declaration order
with isAssignableList, which binds the variable to the first overload's parameter type. The
result types: `-({}['a'])` double, `-([][0])` double, `{}['a'] + {}['b']` bytes,
`{}[1] - {}[2]` double, `{}['a'] * {}['b']` double. A genuine dyn value behaves as
documented: `-dyn(1)` is dyn, and `-(dyn(1)) + 1` checks. The consequence is a rejected
valid expression: `-({}['a']) + 1` fails with "found no matching overload for '_+_' applied
to '(double, int)'", `({}['a'] + {}['b']) + 1` with "(bytes, int)", while `-({}['a']) + 1.0`
passes. Evaluation is unaffected (the operator dispatches on the runtime value).
'''

[[bug]]
id = "cel-go/4"
title = "OptOptimize and constant folding rewrite `e in []` to false and folding rewrites `x in [x, e]` to true, dropping the error of e"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInFoldDropsError"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`in` is a strict function: `(1 / 0) in []` and `(1 / i1) in []` (i1 = 0) evaluate to the
division-by-zero error with Program(ast) and with the checked AST. With
cel.EvalOptions(cel.OptOptimize) the same programs return false:
interpreter.maybeOptimizeSetMembership turns `in` on a constant empty list into the constant
false without evaluating the needle. cel.NewConstantFoldingOptimizer does the same in
maybePruneBranches (folding.go: an empty list haystack becomes the literal false), and its
second rule folds `1 in [1, 1 / i1]` to true because the needle literal equals a list element
literal, although the list's other element errors; unoptimized evaluation gives the error.
The spec (Logical Operators) reserves error absorption to &&, || and ?:.
'''

[[bug]]
id = "cel-go/5"
title = "A map literal with a repeated key evaluates to a map holding the last entry instead of the error the specification requires"
kind = "spec"
severity = "low"
test = "TestHegelPinMapRepeatedKey"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
langdef.md, Aggregate Values: "it is an error to have duplicate keys or field names".
`{true: 1, false: 2, true: 3}[true]` evaluates to 3, `{s1: 1, s1: 2}[s1]` to 2,
`{i1: 'a', i1: 'b'}` to {1: b}, `size({s1: 1, s1: 2})` to 1 and `{0: 1, 0u: 2}[0.0]` to 1:
interpreter.evalMap.Exec stores the entries in a Go map keyed by ref.Val, so a repeated key
overwrites (and 0 and 0u, equal keys by the spec, coexist). Neither the checker nor the
parser rejects a repeated constant key. cel-spec's conformance suite has the tests
map_value_repeat_key and map_value_repeat_key_heterogeneous expecting "Failed with repeated
key", with a note recording the current behaviour, so the deviation is known upstream.
'''

[[bug]]
id = "cel-go/6"
title = "OptOptimize fails Program() with the error of a constant unary call (string(b'\\xff'), int('x')) even in a branch the expression never takes"
kind = "contract"
severity = "medium"
test = "TestHegelPinOptimizeConstUnaryError"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`false ? string(b'\xff') : 'a'` evaluates to "a", `int('x') == 1 || true` to true and
`true ? 1 : int('x')` to 1. With cel.EvalOptions(cel.OptOptimize), env.Program returns the
error ("invalid UTF-8 in bytes, cannot convert to string", "type conversion error from
'string' to 'int'") and no program is built: interpreter.maybeOptimizeConstUnary evaluates a
unary call with a constant argument at planning time and returns an error value as a
planning failure instead of keeping it as the constant the branch would produce. Constant
list and map literals and binary operators keep their error values (`true ? 1 : 1 / 0` is
fine under OptOptimize). The option's documentation promises program-creation errors only
for regex pattern compilation.
'''

[[bug]]
id = "cel-go/7"
title = "Constant folding of (true ? {a: 1, b: 2, c: 3} : {})['t'] or (false ? {1: s1} : {i2: s1}).filter(k, k < 1) fails: the pruned branch's ids collide with later nodes"
kind = "crash"
severity = "medium"
test = "TestHegelPinFoldIDCollision"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
cel.NewStaticOptimizer(cel.NewConstantFoldingOptimizer()).Optimize on the checked AST of
`(true ? {'a': 1, 'b': 2, 'c': 3} : {})['t']` returns the issues "found no matching overload
for '_[_]' applied to '(map(string, int), int)'" and "incompatible type already exists for
expression: ... old:int, new:string". The conditional with a literal condition is pruned to
its map branch; with three or more entries the ids of the surviving literal's nodes collide
with the id of the index key, so when the optimizer re-checks the expression the key `'t'`
carries a stale int type. Two entries fold correctly to `{"a": 1, s2: i1}["t"]`, and the
same shape over a list (`(true ? [1, 2, 3] : [])[0]`) folds to 1. The failure is
independent of the surrounding expression (`{s1: ...}`, `[...]`, `0 + ...`). The same collision
hits a pruned conditional used as a macro range: `(false ? {-1: s1} : {i2: s1}).filter(k, k < 1)`
fails with "incompatible type already exists ... old:string, new:list(int)" and "reference
already exists for expression ... old:s1, new:add_list", and
`(false ? {-1: 'a'} : {i2: 'b'}).filter(k, k < 1).map(k, k)` with "reference already exists
... old:i2, new:k" (the comprehension variable's id meets the pruned map's key). Unfolded,
all of them evaluate normally.
'''

[[bug]]
id = "cel-go/8"
title = "The unparser writes a non-finite double literal as NaN.0, +Inf.0 or -Inf.0, which do not parse"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinUnparseNonFiniteDouble"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Constant folding turns `0.0 / 0.0` into a NaN literal and `1.0 / 0.0` into +Inf;
cel.AstToString of the folded AST returns "NaN.0", "+Inf.0" and "-Inf.0" (parser/unparser.go
formats doubles with strconv and appends ".0" when the text has no point or exponent), and
env.Compile of these texts fails with "extraneous input '.0'". CEL has no literal for these
values, so an error from AstToString, or a form such as double('NaN'), would be the ways
out; a silent unparsable text is not. `string(0.0 / 0.0)` folds to "NaN" and is fine.
'''

[[bug]]
id = "cel-go/9"
title = "Constant folding of {1: 'a'}.filter(e, false), .map(e, false, t), .exists(e, false) or .all(e, true) over a constant range gives the last map value, or null for a list, instead of the macro's result"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinFoldFalsePredicate"
found = { commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd", version = "v0.32.0+77 (6b741db)", hegel = "v0.6.33", date = "2026-09-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{1: 'a'}.filter(e, false)` and `{1: 'a'}.map(e, false, string(e))` evaluate to [] (and so
does `(false ? mi : {1: 'a'}).map(e, false, string(e))`). Folded with
cel.NewConstantFoldingOptimizer they become the literal "a" (the map's value),
`{'k': 1, 'l': 2}.map(e, false, e)` becomes 1, and over a list `[1].map(e, false, string(e))`
and `[1, 2].filter(e, false)` become null (evaluating to 0). The folded program then returns
that value. The other macros suffer the same way when their literal predicate leaves the
accumulator unchanged: `[1000, -191].exists(x, false)` (false) folds to null,
`{1: 'a'}.exists(x, false)` to "a", `[1].all(x, true)` (true) to null, so
`![1000, -191].exists(x, false)` fails to fold with "found no matching overload for '!_'
applied to '(null)'". A predicate that merely evaluates to false (`e == 2`) folds correctly;
the literal is what goes wrong: the pruner reduces the loop step (`false ? accu + [x] :
accu`, `accu || false`, `accu && true`) to the accumulator variable, and what is then folded
as the comprehension's value is not the accumulator's initial value but a stray one. The
folded value has the wrong type as well as the wrong content, silently.
'''
