name = "cel-go"
language = "go"
upstream = "https://github.com/cel-expr/cel-go"
subdir = ""
license = "Apache-2.0"  # LICENSE; CONTRIBUTING.md has no AI statement (commit 6b741db, checked 2026-09-22)
ai_policy_checked = "2026-09-22"

[base]
commit = "6b741db6e35c4a03a6488f1d4db010cc87dca3cd"
date = "2026-09-21"
version = "v0.32.0+77 (6b741db)"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
# Wide properties: the shapes of the recorded bugs are drawn by default (STYLE.md rule 11) and
# each lands in the basin it reaches most often; their shapes are a few percent of cases.
TestHegelEval = { bug = "cel-go/5", intermittent = true }
TestHegelMacros = { bug = "cel-go/5", intermittent = true }
TestHegelParsers = { bug = "cel-go/2", intermittent = true }
# Narrow properties, one per bug, over the bug's shape region with random contents.
TestHegelPrattLexesLiteralBeforeIn = "cel-go/1"
TestHegelParsersAgreeOnNegativeLiteralOffsets = "cel-go/2"
TestHegelCheckerLeavesEmptyLiteralElementsDyn = "cel-go/3"
TestHegelInRewritesKeepOperandErrors = "cel-go/4"
TestHegelMapLiteralRepeatedKeyIsAnError = "cel-go/5"
TestHegelOptimizeBuildsProgramsWithErroringConstantUnaries = "cel-go/6"
TestHegelFoldingSurvivesPrunedConditionalBranches = "cel-go/7"
TestHegelFoldedNonFiniteDoublesUnparseToValidText = "cel-go/8"
TestHegelFoldingKeepsLiteralPredicateMacros = "cel-go/9"
TestHegelParsersAgreeOnNonASCIITextLiteralOffsets = "cel-go/10"
TestHegelParsersAgreeOnLoneCommas = "cel-go/11"
# Pins: the regression examples.
TestHegelPinPrattLiteralIn = "cel-go/1"
TestHegelPinPrattNegativeLiteralOffset = "cel-go/2"
TestHegelPinCheckerTypeVarFirstOverload = "cel-go/3"
TestHegelPinInFoldDropsError = "cel-go/4"
TestHegelPinMapRepeatedKey = "cel-go/5"
TestHegelPinOptimizeConstUnaryError = "cel-go/6"
TestHegelPinFoldIDCollision = "cel-go/7"
TestHegelPinUnparseNonFiniteDouble = "cel-go/8"
TestHegelPinFoldFalsePredicate = "cel-go/9"
TestHegelPinANTLRTextLiteralOffsets = "cel-go/10"
TestHegelPinPrattLoneComma = "cel-go/11"
