[[bug]]
id = "x-input/1"
title = "Kitty alternate keys: the base-layout key overwrites the shifted key, so shift+a types the base key"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinKittyBaseKeyOverwritesShiftedKey"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With the Kitty "report alternate keys" enhancement a key arrives as
`CSI code:shifted:base ; mod u`. `parseKittyKeyboard` (kitty.go) handles the third
sub-parameter in `case 2`, sets `key.BaseCode`, and then `fallthrough`s into `case 1`, which
sets `key.ShiftedCode` from the *same* parameter — the base key. So for shift+a on an AZERTY
keyboard, `CSI 97:65:113;2u`, the event has `ShiftedCode = 'q'`, and because the text of a
shifted key is taken from `ShiftedCode`, `Text = "q"`: the program receives "q" where the user
typed "A". Any layout whose base key differs from the shifted key is affected, i.e. every
non-US layout, whenever the terminal reports alternate keys (kitty, foot, WezTerm, Ghostty…
when the enhancement is enabled). The two-sub-parameter form `CSI 97:65;2u` is right.
'''

[[bug]]
id = "x-input/2"
title = "Key release and repeat event types are ignored for CSI n ; mod : event ~ keys (Insert, Delete, PgUp, PgDn, F5–F20)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTildeKeysIgnoreEventTypes"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The Kitty protocol encodes the legacy keys with an event type as `CSI number ; modifiers :
event-type ~` (e.g. `CSI 5;1:3~` = PgUp released). `parseCsi` calls `parseKittyKeyboardExt`
for the `~` keys, but that helper checks `params[0].Param(1) == 1` — written for the
`CSI 1 ; mod:event A` shape, where the first parameter is always 1. For the `~` keys the first
parameter is the key number, so the event type is only honoured for number 1 (Home) and
ignored for Insert (2), Delete (3), End (4), PgUp (5), PgDn (6), Home/End (7/8) and F5–F20
(15–34): their releases and repeats are reported as fresh presses. A program that has asked
for "report event types" sees every PgDn twice (press and release) and every held Delete as
one press per repeat with `IsRepeat` false.
'''

[[bug]]
id = "x-input/3"
title = "Kitty: a num-lock modifier removes the key's text, while caps lock keeps it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNumLockRemovesKeyText"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
When no text is attached, `parseKittyKeyboard` derives it for printable keys only if
`key.Mod <= ModShift || key.Mod == ModCapsLock || key.Mod == ModShift|ModCapsLock`. Num lock
(`ModNumLock`, protocol bit 128) is not in the list, so `CSI 97;129u` (a, num lock on) and
`CSI 97;130u` (shift+a, num lock on) have an empty `Text`, while `CSI 97;65u` (caps lock) has
"A". The protocol treats the two lock modifiers alike and does not report them for text keys
unless "report all keys as escape codes" is on — with that enhancement (and without
"report associated text"), a user with num lock on cannot type letters through this parser.
'''

[[bug]]
id = "x-input/4"
title = "URxvt CSI n $ keys are parsed by rewriting '$' to '~' in the caller's buffer"
kind = "contract"
severity = "low"
test = "TestHegelPinURxvtDollarMutatesTheInput"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseCsi` handles URxvt's shift-modified keys (`CSI 2 $` = shift+Insert) with
`p.parseCsi(append(b[:i-1], '~'))`: the append writes into the input slice, so after
`parseSequence([]byte("\x1b[2$"))` the buffer reads `"\x1b[2~"`. The Reader parses its own
buffer, so the damage is invisible there, but the parser is a public low-level API
(`NewParser`) whose input must not change under it — a logger, a replay or a second parser
looking at the same bytes sees a different sequence.
'''

[[bug]]
id = "x-input/5"
title = "An invalid UTF-8 byte is reported as the UTF-8 encoding of the rune with that value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnknownEventEncodesTheByteAsARune"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseUtf8` returns `UnknownEvent(b[0])` for a byte that is not valid UTF-8; `UnknownEvent`
is a string type, so the conversion is `string(rune(b[0]))`: the byte 0xfe becomes the
two-byte string "þ" (U+00FE). The event's contents therefore do not contain the byte that was
read, and a program logging or re-emitting unknown input sees Latin-1 characters instead of
the raw bytes. The package's own test enshrines the value (`UnknownEvent(rune(0xfe))`).
'''

[[bug]]
id = "x-input/6"
title = "Grapheme clusters that start with an ASCII byte are split into separate key presses"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinASCIILedGraphemeClustersSplit"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseUtf8` returns a one-byte key press for any printable ASCII byte before it reaches the
`uniseg.FirstGraphemeCluster` call that turns a multi-rune cluster into one `KeyExtended`
event with the whole text. So clusters whose first rune is ASCII — decomposed "é" (e + U+0301),
"ñ" (n + U+0303), keycap emoji "1️⃣" (1 + VS16 + U+20E3) — arrive as a plain letter or digit
followed by key presses for the combining marks (`Code: U+0301, Text: "́"`), while "ก้" or
"👍🏽" arrive as one key. Pasted or IME-composed text with combining marks is thus split, and
the combining marks become separate "keys". Same root as x-ansi/5 in the sibling package, in
different code.
'''

[[bug]]
id = "x-input/7"
title = "Alt + an introducer byte ([, O, P, X) decodes with a shape unlike every other alt+key"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAltIntroducerKeysAreInconsistent"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`ESC x` for a printable x is alt+x: `parseSequence` parses x and adds `ModAlt`, clearing
`Text` (uppercase letters become `Code` lower + `ModShift` + `ShiftedCode`). The bytes that
introduce sequences take shortcuts with their own results: `ESC [` returns
`KeyPressEvent{Text: "[", Mod: ModAlt}` with `Code` 0 and the text kept, so `String()` is "["
— indistinguishable from typing "[" for a program matching on `String()`; `ESC O` returns
`Code: 'O'` without `ModShift`; `ESC P` and `ESC X` return `Code: 'p'/'x'` with shift but no
`ShiftedCode`. `ESC ]`, `ESC _`, `ESC ^` happen to match the general shape.
'''

[[bug]]
id = "x-input/8"
title = "A CSI sequence with more than 32 parameters is cut short and its tail comes back as key presses"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCSIWithManyParametersLeaksItsTail"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseCsi` stops scanning parameter bytes once `paramsLen` reaches `parser.MaxParamsSize`
(32). The next parameter byte is then not a valid final byte, so the function returns
`UnknownEvent` for the bytes so far and a length that stops in the middle of the sequence;
the remaining digits, semicolons and the real final byte are parsed as text: for a `CSI` with
33 parameters ending in `A`, key presses "1", ";", "1", "A". x/ansi's own parser drops the
extra parameters and still finds the final byte. Unusual input, but the parser's stated
purpose is to swallow sequences the terminal sends rather than echo them.
'''

[[bug]]
id = "x-input/9"
title = "FlagCtrlOpenBracket is ignored for a lone ESC (and ESC ESC), unlike the key table"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCtrlOpenBracketFlagIgnoredForLoneEscape"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseControl` maps ESC to ctrl+[ when `FlagCtrlOpenBracket` is set, and `buildKeysTable`
does the same (`ESC` → ctrl+[, `ESC ESC` → ctrl+alt+[). But `parseSequence` returns
`KeyPressEvent{Code: KeyEscape}` for a one-byte ESC before `parseControl` is reached, and the
`ESC ESC` path goes through the same shortcut, so the parser gives esc / alt+esc. The Reader
uses the table for a whole read and the parser otherwise, so with this flag a lone Escape
press is ctrl+[ when it arrives alone and esc when it arrives with other bytes.
'''

[[bug]]
id = "x-input/10"
title = "Terminfo keys the parser also recognises are honoured only when the key arrives alone"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTerminfoKeysOnlyHonouredAlone"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.3.7+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With `FlagTerminfo`, `Reader.readEvents` looks the whole read buffer up in the key table
(built-in keys plus the terminal's terminfo keys) and only otherwise runs the parser, which
knows nothing of terminfo and consults the table just for `UnknownEvent`s. Any terminfo
sequence the parser also recognises therefore means one thing alone and another with company:
screen's `kbs` is DEL, so with `FlagBackspace` a lone DEL is backspace (table) while DEL
followed by anything is delete (parser); vt220's `kbs` is BS — backspace alone, ctrl+h in a
stream; tmux's `kf48` is `CSI 24;6~` — with `FlagFKeys` f48 alone, ctrl+shift+f12 in a stream.
Fast typists and pasted text hit the parser path. The flag's documentation ("the driver will
use Terminfo databases to overwrite the default key sequences") describes the table only.
'''
