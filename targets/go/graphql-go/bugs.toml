# Bugs found in graphql-go/graphql (v0.8.1+67) by the Hegel zoo. One [[bug]] per finding; `test`
# names the plain Go test in hegel/hegel_zoo_pins_test.go that fails while the bug exists (listed
# under [expected_failures] in target.toml). Oracle: python graphql-core 3.2.12 (the port of
# graphql-js) executing the same operations against the same schema (as SDL) and root data. The
# behaviour asserted is the GraphQL specification's (October 2021), as graphql-js and graphql-core
# implement it. Not judged: the shape of a resolver's Args map (null-valued arguments and input
# fields are left out of it), error messages and locations.

[[bug]]
id = "graphql-go/1"
title = "The null literal is a syntax error"
kind = "spec"
severity = "medium"
test = "TestHegelPinNullLiteral"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{ echo(z: null) }` fails to parse with `Syntax Error GraphQL (1:11) Unexpected Name "null"`.
language/parser/parser.go parseValueLiteral turns a NAME token into a BooleanValue or an EnumValue
and excludes `null` from the enum values, but produces no NullValue node, so any operation with a
null literal (an argument, a list item, an input object field, a variable default) is rejected.
The spec has had NullValue since 2016 (graphql-js 0.7). Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/2"
title = "A non-null argument or input field with a default value must still be provided"
kind = "spec"
severity = "medium"
test = "TestHegelPinNonNullArgDefault"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `echo(id: [Int!]! = [1]): String`, `{ echo }` is rejected: `Field "echo" argument "id" of
type "[Int!]!" is required but not provided.` The spec (Required Arguments) makes an argument
required only when it is non-null and has no default value; graphql-core executes the query with
id = [1]. rules.go ProvidedNonNullArgumentsRule tests the type alone. The same holds for input
object fields: `{a: Int! = 1}` given `{}` fails validation (and variable coercion) with "Expected
Int!, found null". Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/3"
title = "A non-null variable with a default value is rejected"
kind = "spec"
severity = "medium"
test = "TestHegelPinNonNullVariableDefault"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`query($v: Boolean! = true) { echo(id: 3) @skip(if: $v) }` fails validation: `Variable "$v" of
type "Boolean!" is required and will not use the default value. Perhaps you meant to use type
"Boolean".` That rule (DefaultValuesOfCorrectType) was removed from the spec in June 2018, when
non-null variables were allowed default values (used when the variable is not provided);
graphql-js 14 and graphql-core accept the document. rules.go DefaultValuesOfCorrectTypeRule.
Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/4"
title = "A variable given the value null takes its default value, or the argument's"
kind = "spec"
severity = "medium"
test = "TestHegelPinNullVariableValue"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`query($v: Int = 7) { echo(n: $v) }` with variables {"v": null} resolves echo with n = 7, and
`query($v: Int) { echo(n: $v) }` with echo(n: Int = 5) and {"v": null} with n = 5. The spec
(CoerceVariableValues, CoerceArgumentValues) applies a default value only when no value is
provided: an explicit null is null. values.go getVariableValue treats a nullish input like an
absent one (`isNullish(input)` then the default), and getArgumentValues replaces a nullish
argument value by the argument's default; the same happens to null input object fields with
defaults (coerceValue). Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/5"
title = "Variable values of the wrong kind are coerced instead of rejected"
kind = "spec"
severity = "medium"
test = "TestHegelPinLaxVariableCoercion"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For `$v: Int`, the values "4" (a string), 1.5 and true are accepted and become 4, 1 and 1; for
`$v: Boolean`, "x" becomes true and [] becomes false; for `$v: String`, 1 becomes "1". The spec's
input coercion for the built-in scalars accepts only the matching kind (an Int must be an
integer; a Boolean a boolean; a String a string), and graphql-core rejects each with `Variable
"$v" got invalid value ...`. scalars.go coerceInt/coerceFloat/coerceBool/coerceString serve as
ParseValue and accept strings, booleans and numbers of any kind (coerceInt truncates floats,
coerceBool returns false for any unknown type). Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/6"
title = "An Int literal outside 32 bits is accepted"
kind = "spec"
severity = "low"
test = "TestHegelPinIntLiteralRange"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{ echo(z: 3000000000) }` with `z: Int` passes validation and the resolver receives 3000000000.
The spec limits Int to 32-bit signed integers and requires an error for a literal outside that
range; graphql-core reports `Int cannot represent non 32-bit signed integer value`. scalars.go
Int.ParseLiteral uses strconv.Atoi without the range check that coerceInt (ParseValue) applies.
Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/7"
title = "A field selected twice is dropped when the first selection is excluded by a variable-driven skip"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMergedSkipVariable"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`query($v: Boolean!) { a @skip(if: $v) a }` with {"v": true} gives {} instead of {"a": 1}: the
second, unconditional selection of a is lost. The spec (CollectFields) evaluates @skip/@include
per selection and includes the field when any selection includes it, as `{ a @skip(if: true)
a }` (a literal condition) does here. plan.go collectInto merges a later selection with the same
response key into the first fieldPlan and keeps the first one's skipPredicate only; a literal
condition is evaluated before the merge, a variable one at execution time. The same happens to
`...F @include(if: $v) ...F` and to an inline fragment repeated with a variable condition, and
the fields under the excluded fragment are lost. Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/8"
title = "An inline fragment without a type condition under a list or non-null field is rejected"
kind = "spec"
severity = "medium"
test = "TestHegelPinInlineFragmentNoCondition"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `name: [O3]!`, `{ name { ... { v } } }` fails validation: `Fragment cannot be spread here as
objects of type "O3" can never be of type "[O3]!".` The spec allows an inline fragment without a
type condition anywhere (it applies to the enclosing type), and graphql-core executes it. rules.go
PossibleFragmentSpreadsRule compares the fragment's type (the enclosing type, unwrapped) with the
parent field's declared type, wrappers included, so any wrapped field type fails; `... on O3`
under the same field passes. Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/9"
title = "Enum.Serialize of a slice or map value panics"
kind = "panic"
severity = "low"
test = "TestHegelPinEnumSerializeSlice"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
An enum field whose resolver returns []any{"RED"} or a map gets the error `runtime error: hash of
unhashable type []interface {}` (a panic recovered by the executor) instead of a serialization
error, and Enum.Serialize called directly panics. definition.go Enum.Serialize looks the value up
in a map keyed by interface{} (getValueLookup) without checking that it is comparable. Found by
TestHegelExecute.
'''

[[bug]]
id = "graphql-go/10"
title = "A leaf value that cannot be serialized becomes null without a field error"
kind = "spec"
severity = "medium"
test = "TestHegelPinLeafSerializeError"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{ i }` with the Int field i resolving to "abc" gives {"data": {"i": null}} and no error; the
same for an Int out of the 32-bit range or a slice, a Float from a non-numeric string, an enum
field with an unknown value or a non-string. The spec (CompleteValue) requires a field error when
result coercion fails, as graphql-core reports (`Int cannot represent non-integer value: 'abc'`);
here only a non-null field gets an error, and then the propagation one. plan.go
completeLeafValue turns a nil Serialize result into null silently. Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/11"
title = "Int serialization truncates a fractional float"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinIntTruncation"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
An Int field resolving to 1.5 is serialized as 1 (-2.25 as -2). The spec allows coercing a
non-integer internal value only "without losing information" and requires a field error
otherwise; graphql-core reports `Int cannot represent non-integer value: 1.5`. scalars.go
coerceInt converts float32/float64 with int() after the range check alone. Found by
TestHegelExecute.
'''

[[bug]]
id = "graphql-go/12"
title = "Boolean serialization turns any string but the empty one and false into true"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBooleanString"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A Boolean field resolving to "x" (or "0", or "true") is serialized as true, "" and "false" as
false, and a slice or map as false. The spec's Boolean result coercion accepts booleans and, when
reasonable, numbers; graphql-core reports `Boolean cannot represent a non boolean value: 'x'`.
scalars.go coerceBool has a string case returning true for everything but "" and "false", and a
final `return false` for unknown types. Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/13"
title = "String and ID serialization print slices, maps, booleans and floats with fmt"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringOfSlice"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A String field resolving to []any{"a"} is serialized as "[a]", a map as "map[a:1]"; an ID field
resolving to 1.5 as "1.5" and to true as "true". The spec's String and ID result coercion fails
for values that are not strings (or, for ID, integers); graphql-core reports `String cannot
represent value: ['a']` and `ID cannot represent value: 1.5`. scalars.go coerceString is
fmt.Sprintf("%v", value) for anything but *string. Found by TestHegelExecute.
'''

[[bug]]
id = "graphql-go/14"
title = "When a non-null root field is null, the errors of the other root fields are dropped"
kind = "spec"
severity = "medium"
test = "TestHegelPinRootPropagationErrors"
found = { commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa", version = "v0.8.1+67 (6acef35)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `l: [Int]` and `n: Int!`, `{ l n }` on root data {"l": 5} gives {"data": null} with the
single error `Cannot return null for non-nullable field Query.n.`; the error of l (`expected
iterable, but did not find one`) is lost. The spec keeps every field error raised (graphql-core
reports both). plan.go ExecutePlan: the non-null failure at the root panics out of
executePlannedSelection and the goroutine's recover appends only that error, never the
executionContext's Errors collected so far. Under a nested object both errors are reported.
Found by TestHegelExecute.
'''
