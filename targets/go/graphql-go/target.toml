name = "graphql-go"
language = "go"
upstream = "https://github.com/graphql-go/graphql"
subdir = ""
license = "MIT"  # LICENSE; CONTRIBUTING.md and README have no AI policy (commit 6acef35, checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "6acef3563ff762c0f5cd14b759ed2cca405ac8fa"
date = "2026-06-22"
version = "v0.8.1+67 (6acef35)"

[hegel]
version = "v0.6.33"

[run]
# The tests need python3 with graphql-core (3.2+) on PATH: it executes the same operations
# against the same schema and data.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
TestHegelPinNullLiteral = "graphql-go/1"
TestHegelPinNonNullArgDefault = "graphql-go/2"
TestHegelPinNonNullVariableDefault = "graphql-go/3"
TestHegelPinNullVariableValue = "graphql-go/4"
TestHegelPinLaxVariableCoercion = "graphql-go/5"
TestHegelPinIntLiteralRange = "graphql-go/6"
TestHegelPinMergedSkipVariable = "graphql-go/7"
TestHegelPinInlineFragmentNoCondition = "graphql-go/8"
TestHegelPinEnumSerializeSlice = "graphql-go/9"
TestHegelPinLeafSerializeError = "graphql-go/10"
TestHegelPinIntTruncation = "graphql-go/11"
TestHegelPinBooleanString = "graphql-go/12"
TestHegelPinStringOfSlice = "graphql-go/13"
TestHegelPinRootPropagationErrors = "graphql-go/14"
TestHegelPinIntrospectionDefaultValue = "graphql-go/15"
TestHegelPinIntrospectionEmptyDescription = "graphql-go/16"
TestHegelPinDuplicateDirectives = "graphql-go/17"
TestHegelPinSDLInExecutable = "graphql-go/18"
TestHegelPinTransitiveFragmentFieldConflict = "graphql-go/19"
# The properties draw the recorded bugs' shapes by default (DESIGN.md decision 3, STYLE.md
# rule 11): TestHegelIntrospection shrinks to a schema with a missing description
# (graphql-go/16, nearly every case); TestHegelValidate reaches a duplicate directive (17), a
# type definition in the document (18) or a field conflict through a transitive fragment
# spread (19) at a few percent of its cases; TestHegelExecute draws the operation shapes of 1
# to 8, the data shapes of 9 to 14 and the conflict of 19, and shrinks to the twin selection
# of 7 (a field repeated with a variable-driven @skip on the first copy: the fewest draws; a
# null literal, 1, needs a field with an argument); the nineteen narrow properties fail every
# run. Under HEGEL_NO_KNOWN=1 all of them pass.
TestHegelIntrospection = "graphql-go/16"
TestHegelValidate = { bug = "graphql-go/17", intermittent = true }
TestHegelExecute = "graphql-go/7"
TestHegelIntrospectionDefaultsAreLiterals = "graphql-go/15"
TestHegelIntrospectionMissingDescriptionsAreNull = "graphql-go/16"
TestHegelValidateDirectivesAreUniquePerLocation = "graphql-go/17"
TestHegelValidateDefinitionsAreExecutable = "graphql-go/18"
TestHegelValidateTransitiveFragmentConflictsAreCaught = "graphql-go/19"
TestHegelExecuteNullLiteralsParse = "graphql-go/1"
TestHegelExecuteDefaultedNonNullArgumentsAreOptional = "graphql-go/2"
TestHegelExecuteNonNullVariablesTakeDefaults = "graphql-go/3"
TestHegelExecuteNullVariablesStayNull = "graphql-go/4"
TestHegelExecuteVariablesOfTheWrongKindAreRejected = "graphql-go/5"
TestHegelExecuteIntLiteralsAre32Bit = "graphql-go/6"
TestHegelExecuteSkippedSelectionsMergeWithTheirTwins = "graphql-go/7"
TestHegelExecuteInlineFragmentsNeedNoCondition = "graphql-go/8"
TestHegelExecuteEnumsSerializeOnlyNames = "graphql-go/9"
TestHegelExecuteLeafSerializationErrorsAreReported = "graphql-go/10"
TestHegelExecuteIntsDoNotTruncate = "graphql-go/11"
TestHegelExecuteBooleansAreStrict = "graphql-go/12"
TestHegelExecuteStringsAreStrict = "graphql-go/13"
TestHegelExecuteRootErrorsAreAllReported = "graphql-go/14"
