# Bugs found in klauspost/compress by the Hegel zoo. Oracles: the standard library's
# compress/flate, compress/gzip and compress/zlib (in process) and the reference zstd tool.

[[bug]]
id = "compress/1"
title = "gzip: a zero ModTime is written as MTIME 2288912640 (2042-07-14T01:04:00Z) instead of 0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroModTimeIsWrittenAsZero"
found = { commit = "a1c49c64983e0d7f036ea25c8913255f921df630", version = "v1.20.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
gzip/gzip.go writes `uint32(z.ModTime.Unix())` unconditionally; for the zero time.Time (the
default header) Unix() is -62135596800, which wraps to 2288912640 = 2042-07-14. RFC 1952 §2.3.1
says MTIME 0 means no time stamp is available, and compress/gzip writes 0 unless
`ModTime.After(time.Unix(0, 0))`. compress/gzip (and any gzip tool) then reads the member as
modified in 2042. Found by the gzip header property on every case with a zero ModTime.
'''

[[bug]]
id = "compress/2"
title = "gzip: MTIME 0 is read as ModTime 1970-01-01T00:00:00Z instead of the zero time.Time"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroMTimeReadsAsZeroTime"
found = { commit = "a1c49c64983e0d7f036ea25c8913255f921df630", version = "v1.20.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
gzip/gunzip.go sets `hdr.ModTime = time.Unix(int64(le.Uint32(z.buf[4:8])), 0)` for every
member; compress/gzip leaves ModTime zero when MTIME is 0 (RFC 1952: "not set"), so
`ModTime.IsZero()` is the documented way to tell. A member written by compress/gzip (or by gzip
-n) reads back as dated 1970. The reading half of compress/1.
'''

[[bug]]
id = "compress/3"
title = "flate: a raw deflate stream cut off inside a match ends with io.EOF instead of io.ErrUnexpectedEOF"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTruncatedStreamIsAnUnexpectedEOF"
found = { commit = "a1c49c64983e0d7f036ea25c8913255f921df630", version = "v1.20.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The 21-byte stream compress/flate writes for "hello world " × 50 at level 6, truncated to 16, 17
or 18 bytes, is decoded by flate.NewReader to 270 / 528 / 528 bytes and then Read returns
io.EOF: the truncation is silent. compress/flate returns io.ErrUnexpectedEOF at those cuts,
as klauspost itself does at every other cut (15, 19, 20). The cuts fall inside a match, after
the length code and before the distance code (or its extra bits) is complete; the reader
appears to treat running out of input there as the end of the final block. The same happens
for klauspost's own output truncated at the same points and for 5- and 9-byte synthetic
streams found by the corruption property (`ba ff 3e 60 00`, `00 0200 fdff 997d 03 47`). Raw
deflate has no trailer, so consumers (HTTP `Content-Encoding: deflate`, zip readers that trust
the stream) get a short result with no error.
'''

[[bug]]
id = "compress/4"
title = "zstd: EncodeAll's empty frame (WithZeroFrames) carries no checksum although WithEncoderCRC is on"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroFrameCarriesTheChecksum"
found = { commit = "a1c49c64983e0d7f036ea25c8913255f921df630", version = "v1.20.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`NewWriter(nil, WithZeroFrames(true), WithEncoderCRC(true)).EncodeAll(nil, nil)` returns the
canned frame 28b52ffd 20 00 010000 (descriptor 0x20: single segment, no Content_Checksum_flag).
WithEncoderCRC is documented to add the checksum and is on by default; the streaming Encoder's
empty frame (28b52ffd 04 68 010000 99e9d851) and the reference tool's (28b52ffd 24 00 010000
99e9d851) both carry it. Header.HasCheckSum is therefore false for these frames and a consumer
requiring checksummed frames rejects them.
'''
