# Bugs found in lestrrat-go/jwx by the zoo's Hegel tests (hegel/ in the patch). Each pin (test)
# fails while the bug is open. The reference is joserfc 1.7.5 (Python, RFC 7515-7519 and 7638)
# reading what jwx writes and writing what jwx reads, plus the RFC text where the two disagree.

[[bug]]
id = "jwx/1"
title = "jwe.Encrypt with WithJSON omits the ciphertext member when the ciphertext is empty (an empty plaintext under an AES-GCM content encryption); RFC 7516 section 7.2 requires it, and jwe.Parse refuses the result"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinJSONEmptyCiphertextOmitted"
found = { commit = "e0b0559ed4c0e25340a87d2d9a176ec906d2cd61", version = "v4.5.0+2", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jwe.Encrypt([]byte{}, jwe.WithJSON(), jwe.WithContentEncryption(jwa.A128GCM()),
jwe.WithKey(jwa.A128KW(), key))` returns
`{"encrypted_key":"...","iv":"...","protected":"...","tag":"..."}`: no `ciphertext`. With
AES-GCM an empty plaintext encrypts to an empty ciphertext (the CBC-HMAC encryptions pad, so
theirs never is), and `Message.MarshalJSON` (jwe/message.go) writes each member only when its
value is non-empty. RFC 7516 section 7.2.1: 'ciphertext: The "ciphertext" member MUST be
present and contain the value BASE64URL(JWE Ciphertext)' (7.2.2 flattens the same members);
the empty string is the encoding of an empty ciphertext. Nobody can read the result: joserfc
fails with `KeyError: 'ciphertext'`, and jwx's own `jwe.Decrypt` / `jwe.Parse` say `missing or
empty "ciphertext" field`. The compact serialization of the same message
(`header.key.iv..tag`, an empty fourth segment) is right and decrypts. Found by
TestHegelEncryptJSONDecryptedByJoserfc.
'''

[[bug]]
id = "jwx/2"
title = "jwe.Parse refuses a JSON serialization whose ciphertext member is the empty string, the encoding of an empty plaintext under AES-GCM, which jwx itself accepts in the compact form"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinJSONEmptyCiphertextRejected"
found = { commit = "e0b0559ed4c0e25340a87d2d9a176ec906d2cd61", version = "v4.5.0+2", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
joserfc's `jwe.encrypt_json` of an empty plaintext with A128KW/A128GCM writes
`{"protected":..., "iv":..., "ciphertext": "", "tag":..., "header":..., "encrypted_key":...}`;
`jwe.Parse` (and so `jwe.Decrypt`) fails with `missing or empty "ciphertext" field`.
`Message.UnmarshalJSON` (jwe/message.go) rejects an empty `ciphertext` together with an
empty `iv` and `tag`, with the comment 'RFC 7516 section 7.2: "ciphertext", "iv", and "tag"
MUST be present and non-empty for any AEAD-protected JWE ... so that a zero-length
authentication tag cannot reach the AEAD verification code path'. The RFC requires the
members to be present; only iv and tag are necessarily non-empty. An empty ciphertext is a
valid AES-GCM encryption of an empty plaintext, and the compact form of the very same message
(an empty fourth segment) is accepted and decrypts to the empty plaintext. The companion of
jwx/1, on the reading side. Found by TestHegelJoserfcEncryptDecryptedByJwx (an empty payload
in JSON form).
'''

[[bug]]
id = "jwx/3"
title = "jwe.Parse reports the protected header members as the per-recipient header of a flattened JSON serialization without an encrypted_key member (dir, ECDH-ES), but an empty header when encrypted_key is present"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinFlattenedRecipientHeaders"
found = { commit = "e0b0559ed4c0e25340a87d2d9a176ec906d2cd61", version = "v4.5.0+2", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Two flattened JSON serializations written by jwx itself with the same protected header
`{"alg":..., "enc":"A128GCM", "typ":"JOSE"}` and no per-recipient `header` member:
`jwe.Parse(...).Recipients()[0].Headers()` marshals as `{}` for the A128KW message (which has
an `encrypted_key`) and as `{"alg":"dir","typ":"JOSE"}` (the protected header minus `enc`)
for the `dir` message; the ECDH-ES message, whose encrypted key is also empty, gets the
protected members and the `epk` too. Removing the `encrypted_key` member from the A128KW
message, or setting it to `""`, switches its recipient header to the copied form, so the
trigger is the absence of an encrypted key, not the algorithm. joserfc reports no
per-recipient header for either (`recipients[0].header` is None). The compact serialization
gives the copied form as well, so callers cannot tell a per-recipient header from the
protected one through `Recipient.Headers()`. Found by TestHegelEncryptJSONDecryptedByJoserfc
(single-recipient `dir` and ECDH-ES messages).
'''
