# Bugs found in github.com/RoaringBitmap/roaring/v2 by the Hegel properties. Each has a pin
# test (TestHegelPin...) that asserts the correct behaviour and is listed as an expected
# failure in target.toml. None of them concerns the documented misuse the repository's
# AGENTS.md describes (using a deserialized bitmap without Validate): where deserialization is
# involved, Validate was called and returned nil.

[[bug]]
id = "roaring/1"
title = "NextAbsentValue and PreviousAbsentValue return only the low 16 bits when the target's container key is not 0"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinAbsentValuesKeepTheHighBits"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
BitmapOf(100000).NextAbsentValue(100000) is 34465 (= 100001 - 65536) instead of 100001, and
PreviousAbsentValue(100000) is 34463 instead of 99999; BitmapOf(5, 10, 100000).NextAbsentValue(6)
is right only because the answer lies in container 0. Both functions compute keyspace =
uint32(containerKey) << 16 and then return combineLoHi32(uint32(low), keyspace), but
combineLoHi32(lob, hob) is lob | hob<<16: the already shifted keyspace is shifted again and the
high half is lost for every key >= 1. NextValue and PreviousValue next to them are correct. The
functions are documented as returning "the next largest missing value in the bitmap"; found by
hand probes before the neighbour property ran, then by the property on every case with values
above 65535.
"""

[[bug]]
id = "roaring/2"
title = "NextAbsentValue and PreviousAbsentValue answer wrongly when the answer lies outside the target's container"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAbsentValuesCrossContainers"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Three defects in the walk to the neighbouring containers (independent of roaring/1). With
b = [0, 65537): b.NextAbsentValue(0) is 65536, a value that is present (65537 is the answer):
after the first container is exhausted the loop tests `containerKey < nextContainerKey`, which
is always true for a later container, and returns (containerKey+1) << 16 as if there were a
gap, without looking into the adjacent container. With b = [0, 65536): b.NextAbsentValue(0) is
-1 instead of 65536, and with b = [65536, 131072): b.PreviousAbsentValue(70000) is -1 instead
of 65535 and b.NextAbsentValue(70000) is -1 instead of 131072: when the target's container is
the last (first) one and full, the code returns -1 whenever the container has a maximum
(minimum), i.e. always; only a full bitmap has no next absent value. The full bitmap itself,
[0, 2^32), gives NextAbsentValue(0) = 65536 instead of -1 (the adjacent-container defect).
Found by hand probes while writing the neighbour property.
"""

[[bug]]
id = "roaring/3"
title = "NextAbsentValue, PreviousAbsentValue and UnsetIterator return present values inside a bitmap container"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinAbsentValuesInBitmapContainers"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A bitmap container holding [100, 65534) except 6011 and 23000 (built with AddMany so that it is
a bitmap, not a run, container): NextAbsentValue(23814) is 23872 and NextAbsentValue(23001) is
23040, both present values (the answer is 65534 in both cases); PreviousAbsentValue(23814) is
23750 (present; the answer is 23000). With [0, 65536) minus {200, 20000}: NextAbsentValue(0) is
64 instead of 200, and an UnsetIterator over [2, 4099) of {0} + [2, 4098) yields 64, a present
value, instead of 4098 (roaring.Unset likewise). bitmapContainer.nextAbsentValue shifts the
word right by target%64 and then, when the shifted word is not all ones, takes the trailing
ones of it as the run of present values: the bits vacated by the shift look like absent values,
so the answer is target + (64 - target%64), the first bit of the next word, whatever that word
holds; previousAbsentValue mirrors the mistake. Array and run containers are correct. Found by
the neighbour property (first at a word-aligned answer) and the iterator property.
"""

[[bug]]
id = "roaring/4"
title = "ParHeapOr's result shares containers with its inputs without copy-on-write"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinParHeapOrResultIsIndependent"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
a = BitmapOf(65539, 73894, 5), b = BitmapOf(1, 2, 5), r = ParHeapOr(0, a, b) (any parallelism,
any copy-on-write setting): r.Add(65536) makes a = {5, 65536, 65539, 73894}, and a.Add(65540)
makes r = {1, 2, 5, 65539, 65540, 73894}. When a container key is present in only one input,
parallel.go's appender puts that input's container into the result as is (the `len(ck.containers)
== 1` branch), neither cloned nor marked needCopyOnWrite, so the two bitmaps share the container
and every mutation of either is seen by the other. Or, FastOr, HeapOr (with two or more inputs),
ParOr and the other aggregates give independent results. Found by the algebra property, which
flips a bit in each aggregate's result and re-checks the operands.
"""

[[bug]]
id = "roaring/5"
title = "HeapOr and HeapXor of a single bitmap return that bitmap itself"
kind = "contract"
severity = "medium"
test = "TestHegelPinHeapAggregatesOfOneBitmapAreCopies"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
HeapOr(a) == a and HeapXor(a) == a (the same pointer), so mutating the "union" mutates the
input; FastOr(a), FastAnd(a), ParHeapOr(1, a), ParOr(1, a) and ParAnd(1, a) all return a copy.
fastaggregation.go's HeapOr/HeapXor build a heap of the inputs and pop-merge while more than
one item remains; with one input nothing is merged and the input is popped and returned.
Found by the algebra property's single-input round.
"""

[[bug]]
id = "roaring/6"
title = "Validate rejects run containers that are not the smallest representation, including ones the library builds itself"
kind = "contract"
severity = "medium"
test = "TestHegelPinValidateAcceptsLibraryBuiltBitmaps"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
a = [196608, 327680) (two run containers); AddOffset64(a, -1).Validate() returns "too many
intervals relative to data" (ErrRunIntervalSize): the shift leaves a run container with a
single value, whose run form (6 bytes) is larger than the array form (2 bytes). The same error
comes from Flip and RemoveRange results (roaring.Flip(b, 4294901762, 1<<32) and a FastOr result
after RemoveRange in the collect runs), and from any spec-conformant stream written by another
implementation whose run containers are not optimal (the RoaringFormatSpec puts no such
condition on run containers; CRoaring and Java keep run containers as they are on add/remove
and only reconsider on runOptimize). runContainer16.validate compares the serialized sizes and
fails unless the run form is strictly smaller than both alternatives. Validate is documented as
"checks if the bitmap is internally consistent" and as the gate for deserialized data; a
bitmap produced by the library's own operations, and legitimate data from other
implementations, fail it. Found by the construction and algebra properties (Validate is called
on every result) and by the spec-conformance property.
"""

[[bug]]
id = "roaring/7"
title = "MustReadFrom and Validate crash with a nil dereference after a failed ReadFrom or FromBuffer"
kind = "crash"
severity = "medium"
test = "TestHegelPinTruncatedStreamsAreErrorsNotCrashes"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
data = 3b30 0000 01 0000 0000 (a valid header announcing one array container of one value,
then nothing): ReadFrom returns the error "failed to read runtime container size: EOF" and
leaves the receiver with a nil container, so Validate, GetCardinality and everything else on
it panic with a nil pointer dereference (SIGSEGV in roaringArray.validate). MustReadFrom,
documented as "calls ReadFrom internally. After deserialization Validate will be called. If the
Bitmap fails to validate, a panic with the validation error will be thrown", ignores the error
ReadFrom returns and calls Validate anyway, so a truncated stream makes it crash with a runtime
error instead of returning the read error (its signature returns one) or panicking with a
validation error. FromBuffer and FromUnsafeBytes leave the same state. The AGENTS.md contract
covers the use of an unvalidated bitmap, not a crash inside Validate or MustReadFrom, which are
the documented gate. Found by the corrupt-bytes property (truncations).
"""

[[bug]]
id = "roaring/8"
title = "Roaring32AsRoaring64 of an empty bitmap is an invalid 64-bit bitmap"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyRoaring32AsRoaring64IsEmpty"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
e := roaring64.Roaring32AsRoaring64(roaring.New()): e.Validate() is "empty container",
e.Equals(roaring64.New()) is false although both are empty, and e.ToBytes() writes a portable
stream with one empty bucket (01000000 00000000 | 00000000 | 3a300000 00000000), which
ReadPortableFrom silently drops ("the format never stores an empty bucket"). The function
appends the 32-bit bitmap as bucket 0 unconditionally. Found by the 64-bit property.
"""

[[bug]]
id = "roaring/9"
title = "AddOffset and AddOffset64 can build bitmap containers of 4096 values or fewer, which cannot be serialized"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinAddOffsetResultsSerialize"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
a := New(); a.AddRange(196608, 196611); a.RunOptimize(); a.AddRange(212083, 212696);
a.AddRange(196608, 327680) (one bitmap and one run container). r := AddOffset64(a, -1) has the
right 131072 values but r.Validate() is "bitmap container size was less than: 4096": the shift
splits the bitmap container across two keys and the piece with one value stays a bitmap
container. r.GetSerializedSizeInBytes() says 8221, but r.ToBytes() fails with "refusing to write
bitmap container with cardinality of array container" and returns 17 bytes of a partial stream;
r.WriteTo the same. Reading those 17 bytes back panics. Further operations do not repair it
(r.Clone().Add/Remove, Or(r, ...) keep the small bitmap container); only RunOptimize does.
AddOffset64(a, -4096) behaves the same; AddOffset(a, 128) happens to be fine. The result of a
public operation on a valid bitmap is a bitmap the library refuses to serialize. Found by the
neighbour property (Validate on the AddOffset64 result), the consequence confirmed by probes.
"""

[[bug]]
id = "roaring/10"
title = "Checksum depends on the container types, not only on the set"
kind = "contract"
severity = "medium"
test = "TestHegelPinChecksumIsAFunctionOfTheSet"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
x := New(); x.AddRange(0, 5) (a run container) and y := BitmapOf(0, 1, 2, 3, 4) (an array
container): x.Equals(y) is true but x.Checksum() is 8610181088074784259 and y.Checksum()
9534389007637396395. The same for 10000 values (run versus bitmap container); only when both
sides happen to pick the same container type do the checksums agree. Checksum is documented as
"a hash (FNV-1a) for a bitmap that is suitable for using bitmaps as elements in hash sets or as
keys in hash maps, as well as generally quick comparisons": equal bitmaps must hash equal, and
the container type is an internal representation choice (RunOptimize changes it without
changing the set). Found by the serialization property, which rebuilds each set from its
intervals and compares checksums.
"""

[[bug]]
id = "roaring/11"
title = "Validate accepts a run container whose run extends past the container, and the bitmap then misbehaves"
kind = "contract"
severity = "medium"
test = "TestHegelPinValidateRejectsOverflowingRuns"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
data = 3b300000 01 0008 fe01 0100 d254 00fe: one run container (key 2048, cardinality 511 in
the header) with one run starting at 21714 of length 65025, which runs past 65535. ReadFrom
accepts it and Validate returns nil (MustReadFrom too), yet the bitmap is inconsistent:
GetCardinality is 65025 (not the header's 511, not the 43822 values that fit), ToArray lists
65025 values from 134239442 up, Contains is false for the first and the last of them,
Maximum() (134238930) is below Minimum() (134239442), and the iterator wraps around inside the
container. runContainer16.validate checks the intervals' order and overlap but not that
start + length stays within 16 bits, and the reader does not check the header cardinality
against the runs. The documented contract makes Validate the gate that turns untrusted bytes
into a bitmap "considered safe for use"; here it passes ill-formed data through. Found by the
corrupt-bytes property (a single mutated byte in a run length), with the spec model rejecting
the stream.
"""

[[bug]]
id = "roaring/12"
title = "In-place Xor mutates its argument when the argument holds a bitmap container and the receiver does not"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinInPlaceXorLeavesTheArgumentAlone"
found = { commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d", version = "v2.28.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
a := New(); a.AddRange(196608, 196991) (a run container); b := New(); b.AddMany(6000 even values
from 196608) (a bitmap container). a.Xor(b) leaves a with the right 5999 values, but b now also
has 5999 values and no longer contains 196610: the receiver's runContainer16.ixorBitmap(value2)
is `return value2.ixor(rc)`, which xors in place into the argument's container and then stores
that container in the receiver, so the two bitmaps share it as well. arrayContainer.ixorBitmap
does the same (BitmapOf(196610, 196700, 196750).Xor(b) takes 196610 and 196700 out of b).
The functional Xor(a, b), and the in-place Or, And and AndNot, leave their arguments alone.
Found by the algebra property, which compares each operand with its model after every in-place
operation.
"""
