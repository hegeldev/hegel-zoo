name = "roaring"
language = "go"
upstream = "https://github.com/RoaringBitmap/roaring"
subdir = ""
license = "Apache-2.0"
# AGENTS.md: deserializing untrusted bytes and using the result without Validate() is documented
# misuse, not a bug (the zoo respects that: every deserialized bitmap is validated first, and only
# validated bitmaps are compared); README/CONTRIBUTORS otherwise say nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "7d3e4c82628f34c4c4aad369a7b196956b1a297d"
date = "2026-09-15"
version = "v2.28.0+"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ."

[expected_failures]
# The four wide properties fail by the shape they draw most often over forty rounds at a
# hundred cases: Construction 19 of 40 (all by roaring/6), SetAlgebra 40 of 40 (roaring/5),
# RankSelectAndNeighbours 40 of 40 (roaring/1), Iterators 32 of 40 (31 by roaring/3, 1 by
# roaring/6). The eight narrow properties fail every run; under HEGEL_NO_KNOWN=1 the pins
# only (13).
TestHegelConstructionMatchesTheModel = { bug = "roaring/6", intermittent = true }
TestHegelSetAlgebraMatchesTheModel = "roaring/5"
TestHegelRankSelectAndNeighboursFollowTheModel = "roaring/1"
TestHegelIteratorsWalkTheSet = { bug = "roaring/3", intermittent = true }
TestHegelAbsentValuesKeepTheHighBits = "roaring/1"
TestHegelAbsentValuesCrossContainers = "roaring/2"
TestHegelAbsentValuesInBitmapContainers = "roaring/3"
TestHegelParHeapOrResultsAreIndependent = "roaring/4"
TestHegelHeapAggregatesOfOneBitmapAreCopies = "roaring/5"
TestHegelLibraryBuiltRunContainersValidate = "roaring/6"
TestHegelAddOffsetResultsAreValid = "roaring/9"
TestHegelInPlaceXorLeavesTheArgumentAlone = "roaring/12"
TestHegelPinAbsentValuesKeepTheHighBits = "roaring/1"
TestHegelPinAbsentValuesCrossContainers = "roaring/2"
TestHegelPinAbsentValuesInBitmapContainers = "roaring/3"
TestHegelPinParHeapOrResultIsIndependent = "roaring/4"
TestHegelPinHeapAggregatesOfOneBitmapAreCopies = "roaring/5"
TestHegelPinValidateAcceptsLibraryBuiltBitmaps = "roaring/6"
TestHegelPinTruncatedStreamsAreErrorsNotCrashes = "roaring/7"
TestHegelPinEmptyRoaring32AsRoaring64IsEmpty = "roaring/8"
TestHegelPinAddOffsetResultsSerialize = "roaring/9"
TestHegelPinChecksumIsAFunctionOfTheSet = "roaring/10"
TestHegelPinValidateRejectsOverflowingRuns = "roaring/11"
TestHegelPinInPlaceXorLeavesTheArgumentAlone = "roaring/12"
TestHegelPinClearKeepsCopyOnWrite = "roaring/13"
