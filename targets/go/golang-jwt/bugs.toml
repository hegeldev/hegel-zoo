# Bugs found in golang-jwt/jwt by the Hegel properties (see README.md). Each has a pin test in
# hegel_pins_test.go listed under [expected_failures] in target.toml.

[[bug]]
id = "golang-jwt/1"
title = "A numeric date with a fraction reads one unit early at sub-second TimePrecision (1700000000.123 is .122)"
kind = "correctness"
severity = "low"
test = "TestHegelPinSubsecondDatesReadExactly"
found = { commit = "73c870b18e68b6e654b2b03f485aa3c9fab32cea", version = "v5.3.1+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
newNumericDateFromSeconds(f) does math.Modf and int64(frac*1e9): the float64 nearest to
1700000000.123 lies below it, so the nanoseconds come out 122999906 and NewNumericDate's
Truncate(TimePrecision) makes that .122 at millisecond precision. Found by
TestHegelNumericDatesRoundTrip: NewNumericDate(t) -> MarshalJSON -> UnmarshalJSON should give t
back at the precision, and does not for about half of the millisecond values (1700000000.1
reads .099, 1600000000.001 reads .000). Rounding to the precision (or parsing the decimal
text) would fix it. At the default second precision integers are exact and only fractions
are floored, which the README documents.
'''

[[bug]]
id = "golang-jwt/2"
title = "A NumericDate before the epoch with a fraction marshals as a different instant (-0.5 s is written -1.500)"
kind = "correctness"
severity = "low"
test = "TestHegelPinPreEpochDatesMarshalTheirInstant"
found = { commit = "73c870b18e68b6e654b2b03f485aa3c9fab32cea", version = "v5.3.1+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NumericDate.MarshalJSON writes strconv.FormatInt(t.Unix()) and appends the fraction of
t.Nanosecond()/1e9; for a negative instant Unix() is floored (-1 for -0.5 s) and the
nanosecond offset is positive (500 ms), so the two concatenate to -1.500, one second off.
UnmarshalJSON reads -1.500 as -1.5 s, so the round trip moves the date. Only visible with a
sub-second TimePrecision (at second precision the fraction is truncated away first). Found
by TestHegelNumericDatesRoundTrip with negative seconds.
'''

[[bug]]
id = "golang-jwt/3"
title = "A numeric date at or beyond 2^63 seconds wraps to the minimum int64: nbf 1e19 is accepted, exp 1e19 is expired"
kind = "correctness"
severity = "medium"
test = "TestHegelPinHugeDatesDoNotWrap"
found = { commit = "73c870b18e68b6e654b2b03f485aa3c9fab32cea", version = "v5.3.1+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
newNumericDateFromSeconds does int64(round) on the float64; for values at or beyond 2^63 the
conversion is out of range and gives math.MinInt64 on amd64, so the date lands in the year
-292277022657. A token with "nbf": 1e19 (not valid before the far future) therefore validates
as already valid, and "exp": 1e19 as long expired. MapClaims.parseNumericDate also drops the
error from json.Number.Float64() under WithJSONNumber, so 1e400 (+Inf) takes the same path,
where RegisteredClaims at least refuses it with "could not convert json number value to
float". Found while reading types.go for the model; the validation property gates the shape
(Known.hugeDateWraps). An error for a date that does not fit, or saturation, would fix it.
'''

[[bug]]
id = "golang-jwt/4"
title = "RegisteredClaims accepts a JSON string as a NumericDate (exp: 1800000000 in quotes), MapClaims refuses it"
kind = "correctness"
severity = "low"
test = "TestHegelPinStringDatesAreRefused"
found = { commit = "73c870b18e68b6e654b2b03f485aa3c9fab32cea", version = "v5.3.1+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NumericDate.UnmarshalJSON decodes the raw value into a json.Number, and encoding/json lets a
JSON string that holds a valid number literal unmarshal into json.Number. So
{"exp":"1800000000"} parses into RegisteredClaims as a date and validates, while the same
document read as MapClaims reports ErrInvalidType ("exp is invalid"): the two claims types
disagree on whether the token is well-formed. RFC 7519 section 2 defines NumericDate as a
JSON numeric value. Found by TestHegelValidationFollowsTheModel (the RegisteredClaims
unmarshal that the model expected to fail succeeded).
'''

[[bug]]
id = "golang-jwt/5"
title = "MapClaims reports an explicit null exp, nbf, iat, iss or sub as an invalid type; null aud and RegisteredClaims read it as absent"
kind = "correctness"
severity = "low"
test = "TestHegelPinNullClaimsAreAbsent"
found = { commit = "73c870b18e68b6e654b2b03f485aa3c9fab32cea", version = "v5.3.1+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MapClaims.parseNumericDate and parseString look the key up with m[key] and then type-switch
on the value; a JSON null is present as a nil interface, matches no case, and becomes
ErrInvalidType, so Validate fails with "exp is invalid" (through the parser:
ErrTokenInvalidClaims). parseClaimsString has an explicit nil case with the comment "the
claim is either absent or explicitly null ... this is not an error and means no value", and
RegisteredClaims unmarshals a null date to a nil pointer and a null string to "", so
{"exp":null} is valid as RegisteredClaims and invalid as MapClaims. Found by
TestHegelMapAndRegisteredClaimsAgree ({"sub":null}) and the validation property.
'''

[[bug]]
id = "golang-jwt/6"
title = "A TimePrecision that is not a power of ten writes too few fraction digits (10.5 at 500 ms is written 10)"
kind = "correctness"
severity = "low"
test = "TestHegelPinOddPrecisionsRoundTrip"
found = { commit = "73c870b18e68b6e654b2b03f485aa3c9fab32cea", version = "v5.3.1+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NumericDate.MarshalJSON takes the number of fraction digits as int(math.Log10(second /
TimePrecision)): 0 for 500 ms or 250 ms, 1 for 100 ms. NewNumericDate truncates to the
precision (10.5 stays 10.5 at 500 ms) but MarshalJSON then writes "10", and UnmarshalJSON
reads a different instant. TimePrecision is documented as any duration ("the precision of
times and dates within this library"); either the digits should follow the fraction, or the
variable should be documented as a power of ten. Found by TestHegelNumericDatesRoundTrip
once 500 ms and 250 ms were added to the precisions.
'''

[[bug]]
id = "golang-jwt/7"
title = "Line breaks inside a token segment are ignored, with WithStrictDecoding too: a token with newlines in its signature parses and verifies"
kind = "correctness"
severity = "low"
test = "TestHegelPinNewlinesInATokenAreMalformed"
found = { commit = "73c870b18e68b6e654b2b03f485aa3c9fab32cea", version = "v5.3.1+8", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parser.DecodeSegment hands each segment to encoding/base64's RawURLEncoding (or URLEncoding
under WithPaddingAllowed), and Go's base64 decoders skip \r and \n anywhere in the input;
Encoding.Strict() only requires the trailing padding bits to be zero. So a segment with line
breaks decodes to the same bytes as the clean one, and WithStrictDecoding, documented as RFC
4648 strictness, does not change that. Through Parse a line break in the signature segment is
harmless (the token verifies); one in the header or payload spoils the signature only because
the signing text is taken from the raw segments; ParseUnverified accepts them anywhere. RFC
7515 section 7.1 defines the compact serialization with no whitespace, and RFC 4648 section
3.3 says non-alphabet characters must be rejected unless the referring specification allows
them. A low-severity leniency (a signature still has to verify), found by
TestHegelParsingFollowsBase64AndJSON (the base64url model rejects a newline as a non-alphabet
character).
'''
