# Bugs found in Masterminds/semver (v3) by the Hegel zoo. Oracle: Semantic Versioning 2.0.0
# for parsing and precedence, the package's README for coercion, constraint ranges and the
# prerelease rule.

[[bug]]
id = "masterminds-semver/1"
title = "Numeric pre-release identifiers beyond uint64 are compared as text: 100000000000000000000 sorts before 99999999999999999999 and after \"-\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHugeNumericIdentifiersCompareNumerically"
found = { commit = "dd2b995c61c39ddd668b23ac919b04d607be35ab", version = "v3.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
comparePrePart calls strconv.ParseUint on both identifiers and treats a parse failure as
"this is an alphanumeric identifier". A numeric identifier that does not fit uint64 (the spec
puts no bound on them) therefore compares as a string: MustParse("1.0.0-100000000000000000000")
.Compare(MustParse("1.0.0-99999999999999999999")) is -1 (want 1, 1e20 > 99999999999999999999),
and against the alphanumeric identifiers "-" and "0a" the huge number sorts *after* them
(byte order of "1" vs "-"/"0"), where the spec says every numeric identifier has lower
precedence than every alphanumeric one. hashicorp/go-version fixed the same defect in
September 2026 (#212). Comparing numerics by length then digits (no leading zeros are
allowed) needs no parsing at all.
'''

[[bug]]
id = "masterminds-semver/2"
title = "`^*` (also `^x`, `^X`) accepts only 0.0.0 although the code documents it as \"(any)\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCaretWildcardIsAnyVersion"
found = { commit = "dd2b995c61c39ddd668b23ac919b04d607be35ab", version = "v3.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parseConstraint turns a bare wildcard into the version 0.0.0 with dirty set but neither
minorDirty nor patchDirty, and constraintCaret has no branch for that shape: it falls
through "major > 0 || minorDirty" (false), "major == 0 && v.Major() > 0" (rejects 1.0.0),
"minor > 0 || patchDirty" (false), "minor == 0 && v.Minor() > 0" (rejects 0.1.0) to the
0.0.z case, which requires the patch to be equal. NewConstraint("^*").Check(v) is true for
0.0.0 alone; the comment above the function says `^*  -->  (any)`. constraintTilde handles
the same shape with an explicit special case (see /4 for its side effect).
'''

[[bug]]
id = "masterminds-semver/3"
title = "A bare wildcard is the version 0.0.0 under `<=`, `>` and `!=`: `<= *` accepts 0.0.z only, `> *` and `!= *` accept everything but 0.0.0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBareWildcardIsNotZero"
found = { commit = "dd2b995c61c39ddd668b23ac919b04d607be35ab", version = "v3.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The README says `*` "is equivalent to >= 0.0.0" and that wildcards work "for all comparison
operators", and the partial wildcards do follow the range reading (`<= 2.x` is `< 3`,
`> 1.x` is `>= 2.0.0`, `!= 1.x` is "major is not 1"). The bare wildcard is turned into
0.0.0 with only the generic dirty flag, which the `<=`, `>` and `!=` functions treat as a
concrete version: NewConstraint("<= *").Check(0.1.0) and .Check(1.0.0) are false (only
0.0.z passes the "major == 0 && minor <= 0" test), NewConstraint("> *").Check(0.0.1) and
NewConstraint("!= *").Check(1.0.0) are true. By the range reading `<= *` matches every
version and `> *` / `!= *` match none. `>= *`, `< *`, `= *` and `~*` come out right.
'''

[[bug]]
id = "masterminds-semver/4"
title = "`~0.0.0` (and `~0.0.0-alpha`) accepts every version instead of `>= 0.0.0, < 0.1.0`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTildeZeroIsAPatchRange"
found = { commit = "dd2b995c61c39ddd668b23ac919b04d607be35ab", version = "v3.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
constraintTilde has a special case "~0.0.0 is a special case where all constraints are
accepted", written for `~*` (which parses to 0.0.0 with no minor/patch wildcard flag). The
test cannot tell `~*` from a literal `~0.0.0`, so NewConstraint("~0.0.0").Check(5.0.0) and
Check(0.1.0) are true while NewConstraint("~0.0.1").Check(0.1.0) is false and the README
defines `~1.2.3` as `>= 1.2.3, < 1.3.0`. The pre-release variant `~0.0.0-alpha` (with
IncludePrerelease) accepts 0.1.0 as well. Recording the bare wildcard in the constraint
instead of testing the filled version would fix /2, /3 and this one together.
'''

[[bug]]
id = "masterminds-semver/5"
title = "A hyphen range after a blank-separated comparator in the same AND group is an \"improper constraint\" (`1.2.3 1.2 - 1.4`, `>=1.0 1.2 - 1.4`)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHyphenRangeAfterBlankSeparatedComparator"
found = { commit = "dd2b995c61c39ddd668b23ac919b04d607be35ab", version = "v3.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
rewriteRange matches `\s*(A)\s+-\s+(B)\s*` — leading blanks included — and replaces the
match by ">= A, <= B " with no leading blank, so ">=1.0 1.2 - 1.4" becomes
">=1.0>= 1.2, <= 1.4 " and validConstraintRegex, which wants a blank or comma between
comparators, rejects it: NewConstraint(">=1.0 1.2 - 1.4") = improper constraint
">=1.0>= 1.2, <= 1.4 ". The same text with a comma (">=1.0, 1.2 - 1.4") or with the range
first ("1.2 - 1.4 >=1.0") parses. Keeping the leading whitespace out of the match (or
emitting it again) fixes it.
'''

[[bug]]
id = "masterminds-semver/6"
title = "`||` glued to a hyphen range is read as version characters and the constraint is \"improper\" (`1.2 - 1.4||2.0.1`, `<2.3||0.1.2 - 3.1.1`)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOrGluedToHyphenRange"
found = { commit = "dd2b995c61c39ddd668b23ac919b04d607be35ab", version = "v3.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
cvRegex spells the version characters as `[0-9|x|X|\*]`, a character class in which the
`|` meant as alternation is a member. Comparators are cut at `||` before the regexes see
them, so this is harmless there, but rewriteRange runs on the whole string first: in
"1.2 - 1.4||2.0.1" the range's second version matches "1.4||2.0" and the rewrite leaves
">= 1.2, <= 1.4||2.0 .1", whose second group "2.0 .1" is improper; in
"<2.3||0.1.2 - 3.1.1" the first version matches "3||0.1.2" and "<2." is left dangling
("improper constraint: \"<2.>= 3\""). The same constraints with blanks around `||` parse,
and `||` without blanks is fine when no hyphen range is involved. A side effect of the same
class: NewConstraint("1|2.3") fails with "constraint parser error" (the comment says "we
should never get here") rather than "improper constraint". Writing the class as
`[0-9xX*]` fixes all of it.
'''

[[bug]]
id = "masterminds-semver/7"
title = "With IncludePrerelease, `!= 1.2.x` accepts 1.2.3-alpha while `!= 1.x` rejects it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNotEqualWildcardsAgreeOnPrereleases"
found = { commit = "dd2b995c61c39ddd668b23ac919b04d607be35ab", version = "v3.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
constraintNotEqual's patch-wildcard branch, once major and minor match, compares the
pre-releases of the version and of the constraint's filled version (1.2.0, no pre-release)
and calls them unequal when they differ, so NewConstraint("!= 1.2.x") with
IncludePrerelease = true accepts 1.2.3-alpha — a version inside `1.2.x` — while the
minor-wildcard branch has no such step and "!= 1.x" rejects 1.2.3-alpha. `1.2.x` itself
accepts 1.2.3-alpha under IncludePrerelease, so `!=` is not its complement here. Without
IncludePrerelease both reject the pre-release (the group has no pre-release), as documented.
'''
