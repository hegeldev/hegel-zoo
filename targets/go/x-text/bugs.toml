[[bug]]
id = "x-text/1"
title = "The normalization forms insert U+034F into any run of more than 30 non-starters, so `NFD(s)` is not the NFD of `s` (undocumented stream-safe processing)"
kind = "contract"
severity = "low"
test = "TestHegelPinNormDoesNotInsertCGJ"
found = { commit = "6dcc5b674302d746762d908ed0e2ad65d84f36f1", version = "v0.42.0+ (2026-09-18)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`norm.NFD.String("a" + 31 x U+0301)` returns the string with a COMBINING GRAPHEME JOINER inserted after the
30th mark; `unicodedata.normalize("NFD", ...)` (and UAX #15) leave it alone, since it is already in every
normalization form (`IsNormalString` even says so... and `QuickSpan` too). The package applies the Stream-Safe
Text Format of UAX #15 section 13 (`composition.go`: `maxNonStarters = 30`, `insertCGJ`) without documenting
it: the package doc defines `f(x)` as "the bytes or string x converted to the given form". A CGJ also stops
canonical reordering at that point, so marks after it are not sorted with the ones before. Found by
`TestHegelNormFormsAgreeWithPython`.
'''

[[bug]]
id = "x-text/2"
title = "`norm.Iter` and `Form.String` disagree on where (and whether) the stream-safe CGJ is inserted when Hangul V/T jamo or a CGJ in the input are involved"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIterAgreesWithStringAcrossJamo"
found = { commit = "6dcc5b674302d746762d908ed0e2ad65d84f36f1", version = "v0.42.0+ (2026-09-18)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
For a 25-rune string mixing Hangul V/T jamo (U+1161, U+11A8, which are starters that "combine backwards")
with combining marks, `NFD.String` inserts U+034F before the last mark while iterating the same string with
`norm.Iter` (documented as "iterates over a string or byte slice, while normalizing it to a given Form")
yields it without the CGJ; in the other direction an input CGJ makes `Iter` insert one where `String` does
not. `composition.go` deliberately counts jamo as non-starters for the 30 limit ("we will therefore consider
any rune with a non-zero nLead to be a non-starter"), `iter.go` does not follow the same rule. Found by
`TestHegelNormStreamingMatchesWholeString`; reduced with a greedy rune-deletion probe.
'''

[[bug]]
id = "x-text/3"
title = "The HZ-GB2312 encoder writes `~}` on an unsupported rune but stays in GB mode: under `HTMLEscapeUnsupported`/`ReplaceUnsupported` the escape is repeated on every retry and the following GB characters are written without `~{`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHZEncoderLeavesGBModeOnAnUnsupportedRune"
found = { commit = "6dcc5b674302d746762d908ed0e2ad65d84f36f1", version = "v0.42.0+ (2026-09-18)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
`encoding.HTMLEscapeUnsupported(simplifiedchinese.HZGB2312.NewEncoder()).Bytes("中😀中")` gives
`~{VP~}~}~}~}&#128512;VP`, which decodes to `中&#128512;VP`: the encoder emits `~}` when it meets the
unsupported rune (`hzgb2312.go`, before returning `ErrASCIIReplacement`) but does not record that it is back
in ASCII mode, so each retry of the wrapper (`transform.Bytes` grows its buffer) writes `~}` again and the
second `中` is written as bare GB bytes `VP`. `ReplaceUnsupported` likewise (`~{VP~}\x1a~}0~{VP`-like
output). ISO-2022-JP, the other stateful encoder, handles the same input correctly
(`\x1b$BCf\x1b(B&#128512;\x1b$BCf\x1b(B`). Found by `TestHegelCjkEncodingsRoundTrip`.
'''

[[bug]]
id = "x-text/4"
title = "GB18030 encodes the private-use runes U+E000..U+E765 (2,068 in all) to four-byte sequences its own decoder reads as other runes: U+E000 -> 83 38 98 37 -> U+F014"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGB18030RoundTripsPrivateUse"
found = { commit = "6dcc5b674302d746762d908ed0e2ad65d84f36f1", version = "v0.42.0+ (2026-09-18)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = '''
An exhaustive sweep of every rune: the GB18030 encoder accepts all of them, and 2,068 of the encodable runes
do not decode back - every one in the private-use area U+E000..U+E765 (plus U+E7C7 and a few others):
U+E000 -> 83 38 98 37 -> U+F014, U+E5E5 -> 83 39 B1 36 -> U+F5F9, U+E7C7 -> 83 36 D1 30 -> U+E86F. The
encoder falls through to the four-byte range formula for runes that have no two-byte mapping in the WHATWG
index (which excludes the user-defined areas), while the decoder maps those four-byte sequences by the same
formula to the runes the index assigns them. Every other CJK encoding round-trips all of its encodable runes.
Found by `TestHegelCjkEncodingsRoundTrip` (`` in the rune pool).
'''

