# Bugs found in go-ldap/ldap (v3) by the Hegel zoo. Schema: see the zoo's README.

[[bug]]
id = "go-ldap/1"
title = "CompileFilter does not check the byte closing a filter list or a nested filter: (&(a=b)x compiles"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFilterClosingParenChecked"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
compileFilterSet loops over the "(...)" children of an AND/OR and then `return pos + 1, nil`:
the byte at pos is skipped as the closing parenthesis without being looked at. The '(' case of
compileFilter (a filter directly inside parentheses, as the child of NOT) does the same with
`newPos++`. So "(&(a=b)x", "(!(a=b)x", "((a=b)x" and "(|(a=b)]" compile without error, to the
packets of "(&(a=b))", "(!(a=b))", "(a=b)" and "(|(a=b))"; "(&(a=b)(c=d)x" compiles too. A
filter with a typo in place of its closing parenthesis - or truncated after a child and padded -
is sent as a different filter instead of being rejected as "unexpected end of filter" like
"(&(a=b)". The check that filter[pos] == ')' is missing in both places (the default case of
compileFilter does check, by breaking on ')').
'''

[[bug]]
id = "go-ldap/2"
title = "(sn=**) compiles to a Substrings filter with an empty SEQUENCE and decompiles as (sn=)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmptySubstringsRejected"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A condition of two or more '*' and nothing else is not the present filter ("*" alone is) but
contains '*', so compileFilter builds a Substrings packet, splits on '*' and skips every empty
part: the "Substrings" SEQUENCE ends with no child. RFC 4511 4.5.1.7.2 has substrings ::=
SEQUENCE SIZE (1..MAX), so the packet is not a valid filter on the wire; a server may reject
the search or read it as it likes. DecompileFilter then writes the attribute, "=", no parts and
")": "(sn=**)" round-trips to "(sn=)", an equality match with the empty value - a different
filter. ldap3 reads "(sn=**)" as the present filter; an error, or the present filter, would
both be defensible; an empty SEQUENCE and "(sn=)" are not.
'''

[[bug]]
id = "go-ldap/3"
title = "The dnattrs marker in an extensible match is matched case-sensitively: (o:DN:=x) is a matching rule named DN"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDnattrsCaseInsensitive"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 4515: dnattrs = COLON "dn"; ABNF string literals (RFC 5234 2.3) are case-insensitive, so
":DN:" and ":Dn:" mark dnAttributes as ":dn:" does. compileFilter tests strings.HasPrefix(rest,
":dn:") and ":dn:=" literally, so "(o:DN:=x)" is compiled as MatchingRuleAssertion{matchingRule
"DN", type o, value x} with dnAttributes false, and sent to the server as a request for an
unknown matching rule. OpenLDAP's str2filter compares with strcasecmp; ldap3 also reads ":DN:"
as dnAttributes. A case-insensitive comparison (strings.EqualFold on the three bytes) is the fix.
'''

[[bug]]
id = "go-ldap/4"
title = "A literal U+FFFD in a filter value is rejected as an encoding error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinReplacementCharCompiles"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
compileFilter and decodeEscapedSymbols detect invalid UTF-8 by comparing the decoded rune with
utf8.RuneError / unicode.ReplacementChar, without looking at the width: a genuine U+FFFD
(bytes EF BF BD, a valid UTF-8 character allowed by RFC 4515's UTFMB) is reported as "ldap:
error reading rune at position N". The same value escaped, "(cn=a\ef\bf\bdb)", compiles, and
DecompileFilter produces that escaped form, so the round trip works only one way. The idiom is
`r == utf8.RuneError && width == 1`.
'''

[[bug]]
id = "go-ldap/5"
title = "CompileFilter does not validate the attribute description: (=v) and (a\\2ab=v) compile, and DecompileFilter escapes what CompileFilter took literally"
kind = "contract"
severity = "low"
test = "TestHegelPinAttributeDescriptionValidated"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 4515: attr = attributedescription (RFC 4512: a descr or numericoid with options; letters,
digits, '-', '.', ';'). compileFilter accumulates every rune up to the operator as the
attribute, so "(=v)" (empty attribute), "(a b=v)" and "(a\2ab=v)" compile and go on the wire.
Since #596 DecompileFilter passes the attribute through EscapeFilter, while CompileFilter does
not unescape it: "(a\2ab=v)" compiles with the attribute `a\2ab` (backslash kept) and
decompiles as "(a\5c2ab=v)", which compiles to yet another attribute. Either the attribute is
validated on compile (then there is nothing to escape on decompile) or it is unescaped there;
today the two functions disagree. Found by the mutation property: 18% of mutated filters were
accepted only because of this.
'''

[[bug]]
id = "go-ldap/6"
title = "An extensible match with neither attribute nor matching rule compiles: (:=a), (:dn:=a)"
kind = "contract"
severity = "low"
test = "TestHegelPinExtensibleNeedsAttrOrRule"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 4515: extensible = ( attr [dnattrs] [matchingrule] COLON EQUALS assertionvalue ) /
( [dnattrs] matchingrule COLON EQUALS assertionvalue ): without an attribute the matching rule
is required. compileFilter's ":=" and ":dn:=" cases do not check that anything precedes them,
so "(:=a)" compiles to a MatchingRuleAssertion with only a matchValue, and "(:dn:=a)" to one
with matchValue and dnAttributes - RFC 4511 says "if the type field is absent and the
matchingRule is present, the matchValue is compared against all attributes ... according to
matchingRule"; with both absent the assertion is meaningless. ldap3 rejects "(:=a)" as an
invalid extensible filter.
'''

[[bug]]
id = "go-ldap/7"
title = "ParseDN accepts an empty attribute type and swallows the '=': =a=b parses as a=b"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyTypeRejected"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseDN switches on `char == '=' && len(attr.Type) == 0` to end the type. When the text before
the '=' is empty or only spaces, setType stores "" and the condition stays true, so the next
'=' is taken as the type separator again: "=a=b" and " =a=b" parse as the DN a=b, and
"cn=x,=a=b" as cn=x,a=b, without error, while "=test,DC=example,DC=com" (the upstream test)
fails only because a ',' comes before any '='. RFC 4514 needs a non-empty attributeType
(descr / numericoid) in every attributeTypeAndValue; an empty type should be "incomplete type,
value pair" like the other shapes.
'''

[[bug]]
id = "go-ldap/8"
title = "ParseDN accepts bytes that are not UTF-8 and turns each into U+FFFD"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDNRejectsInvalidUTF8"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
decodeString converts the type or value to []rune before walking it; an invalid byte becomes
utf8.RuneError and is written back as the three bytes EF BF BD. ParseDN("cn=a\xffb") thus
succeeds with the value "a�b" (String() "cn=a\ef\bf\bdb"), neither the input bytes nor an
error, and two DNs differing in such a byte parse to the same value. RFC 4514 requires UTF-8;
the same bytes given to CompileFilter are rejected ("error reading rune"), and given escaped
("cn=a\ffb") they are kept as the byte FF. Either reject the input, as the filter parser does,
or keep the byte, as the escaped form does.

EscapeDN does the same (2026-09-25, met by the freed EscapeDNRoundTrip property): it ranges over
the string rune by rune, so EscapeDN("\xff") is "\ufffd" (EF BF BD) and EscapeDN("a\xffb") is
"a\ufffdb"; the byte is neither escaped as "\ff" nor refused.
'''

[[bug]]
id = "go-ldap/9"
title = "Spaces around a hex-encoded DN value are not insignificant: a leading space makes it literal, a trailing one an error"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinHexstringSpacesInsignificant"
found = { commit = "2f8603fc1df3c9064be5b6db1a210fb599099cd2", version = "v3.4.14", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseDN strips unescaped leading and trailing spaces from types and string values "for
compatibility" (stripLeadingAndTrailingSpaces; "cn= Hi " is "Hi"). setValue decides on the
hexstring form by looking at the first byte of the raw text: with a space in front, "cn=
#04024869" goes down the string path and is the literal "#04024869" (String() "cn=\#04024869"),
while "cn=#04024869" is "Hi"; and with a space behind, "cn=#04024869 " fails with "failed to
decode BER encoding: encoding/hex: invalid byte: U+0020 ' '" because the hex is decoded
untrimmed. Insignificant spaces should be insignificant for both value forms, or for neither.
'''
