# Bugs found in quagmt/udecimal by the Hegel properties. The zoo records only the target's
# bugs; each has a pin (a plain test asserting the documented behaviour) listed in
# target.toml's [expected_failures].

[[bug]]
id = "udecimal/1"
title = "NewFromUint64/NewFromInt64 keep trailing zeros in the coefficient though documented to remove them"
kind = "contract"
severity = "low"
test = "TestHegelPinConstructorTrimsTrailingZeros"
found = { commit = "c9f302d60acf8142f608b419c5c95134f05969ae", version = "v1.10.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Both constructors document "Trailing zeros wll be removed and the prec will also be adjusted".
NewFromUint64(1000, 3) prints 1 but has Prec() 3; NewFromInt64(-1500, 2) has Prec() 2 (the
doc promises 1). Parse behaves the same way (Parse("1.50").Prec() is 2) but does not promise
otherwise. The value is right; the precision reported to callers (Prec, PrecUint, the binary
encoding, StringFixed's padding) is not what the comment says.
'''

[[bug]]
id = "udecimal/2"
title = "Int64 rejects math.MinInt64 as too large to fit"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInt64MinFits"
found = { commit = "c9f302d60acf8142f608b419c5c95134f05969ae", version = "v1.10.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Int64 compares the magnitude of the integer part with math.MaxInt64 before applying the
sign, so -9223372036854775808 (which NewFromInt64(math.MinInt64, 0) builds correctly and
which fits an int64) returns ErrIntPartOverflow. Every other value in range converts.
'''

[[bug]]
id = "udecimal/3"
title = "PowToIntPart of zero with an exponent in (-1, 0) returns ErrZeroPowNegative instead of 1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroPowFractionIsOne"
found = { commit = "c9f302d60acf8142f608b419c5c95134f05969ae", version = "v1.10.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PowToIntPart raises d to the integer part of e, truncated toward zero (2.PowToIntPart(-0.5)
is 1 = 2^0, as documented: "PowInt32(2.5, -2.123) = 2.5^(-2)"). For d = 0 the check for a
negative exponent looks at the sign of e rather than of its integer part, so
Zero.PowToIntPart(-0.5) fails with ErrZeroPowNegative although int(-0.5) = 0 and the doc
lists 0^0 = 1.
'''

[[bug]]
id = "udecimal/4"
title = "MarshalBinary doc example gives the flag byte of -1.2345 as overflow set, sign clear"
kind = "spec"
severity = "low"
test = "TestHegelPinBinaryDocExample"
found = { commit = "c9f302d60acf8142f608b419c5c95134f05969ae", version = "v1.10.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The MarshalBinary comment documents the format "[overflow + neg] [prec] [total bytes] [coef]"
and gives -1.2345 as example 1 with "1st byte: 0b0001_0000 (overflow = true, neg = false)".
The encoder writes 0b0000_0001 for it: the low bit is the sign, bit 4 the overflow flag, and
-1.2345 is negative and fits 64 bits. Example 2 is right. Anyone implementing a reader of
the format from the comment gets the flags wrong.
'''

[[bug]]
id = "udecimal/5"
title = "PowInt32(math.MinInt32) and PowInt(math.MinInt) negate the exponent in its own width: wrong results and a panic"
kind = "panic"
severity = "medium"
test = "TestHegelPinPowMinExponent"
found = { commit = "c9f302d60acf8142f608b419c5c95134f05969ae", version = "v1.10.1", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a negative exponent the power functions compute d^(-e) and invert. -e overflows for the
most negative value of the exponent's type and stays negative, and the inverse-power loop
then indexes the power-of-ten table with a negative index:
MustParse("0.5").PowInt32(math.MinInt32) panics with "index out of range [-2147483629]" in
tryInversePowIntU128, and MustParse("0.5").PowInt(math.MinInt) with "[-9223372036854775789]".
For |d| >= 2 the result is 1 instead of 0 (2^(-2^31) truncates to 0 at 19 fraction digits).
The README's "Panic-Free: All errors are returned as values, ensuring no unexpected panics"
does not hold here. PowToIntPart is guarded (exponents beyond MaxInt32 in magnitude return
ErrExponentTooLarge). The pin asserts 2^MinInt32 = 0 and 2^MinInt = 0.
'''
