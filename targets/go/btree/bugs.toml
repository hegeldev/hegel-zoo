# Bugs found in github.com/tidwall/btree by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure
# in target.toml. The target's command runs the tests under the race detector.

[[bug]]
id = "btree/1"
title = "BTreeG.Len (and BTree.Len) reads the item count without taking the tree's lock: a data race under concurrent writers, on a type documented as thread-safe"
kind = "contract"
severity = "low"
test = "TestHegelPinLenIsThreadSafe"
found = { commit = "34be4b89c690ffced81eeea692450b7d79cf4c15", version = "v1.8.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Len is `return tr.count` (btreeg.go) with no lock, while Set, Delete and the rest take the
RWMutex (unless Options.NoLocks) and write tr.count under it. The README lists BTreeG and
BTree as "Thread-safe"; `go test -race` reports the race as soon as one goroutine inserts
while another calls Len (the pin: 2000 inserts against 2000 Len calls). Every other exported
method, including Height, Min, Max, GetAt, Items, Walk and the iterator, takes the lock.
Under the Go memory model a racy read of an int is undefined behaviour, in practice a
stale count. Found by the concurrent-writers property run under the race detector; the
target's command runs all the tests with -race so that the pin fails while the bug is open.
"""

[[bug]]
id = "btree/2"
title = "Seek and Last do not clear the iterator's at-the-start/at-the-end state left by an earlier failed Prev or Next, so after a later failed step the iterator returns an item from the wrong end"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSeekRepositions"
found = { commit = "34be4b89c690ffced81eeea692450b7d79cf4c15", version = "v1.8.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With keys 1, 2, 3: First(), Prev() (false: the iterator is at the beginning), Seek(10)
(false: no item >= 10), then Next() returns true with key 2; on a fresh iterator the same
Seek(10) followed by Next() returns false, as Next's documentation ("returns false if ...
the iterator is at the end of the tree") requires. Mirror image: Last(), Next() (false),
Seek(1) (true, at key 1), Prev() (false, at the beginning), then a second Prev() returns
true with key 2. Seek and Last (map.go, btreeg.go) set `seeked` and rebuild the stack but
leave the `atstart`/`atend` flags that an earlier failed Prev/Next set; when a later step
fails and empties the stack, Next sees `atstart` and does First() && Next(), Prev sees
`atend` and does Last() && Prev(), each yielding the second item from the wrong end. The
same for MapIter, SetIter and IterG, with SeekHint too. First() clears both flags; Seek and
Last should do the same. Related and undocumented (README):
after a Seek past the end, Prev() returns the second-to-last item, since a step that fails
is taken not to have moved the cursor (upstream's tests assert this for Next and Prev, and
the failed Seek is treated as a Next that failed from the last item). Found by the iterator
property (a cursor model written from the documentation), reduced by a probe.
"""
