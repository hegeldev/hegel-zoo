# Bugs found in go-viper/mapstructure by the Hegel properties. Each is pinned
# by the test named in `test`, listed as an expected failure in target.toml.

[[bug]]
id = "mapstructure/1"
title = "Out-of-range numbers are wrapped or saturated silently"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIntegerOverflowWraps"
found = { commit = "52aa5c6dc1d27226460807054ca2107b2d54fb2d", version = "v2.5.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Decode(map{"a": 300}, &struct{A int8})` sets 44 and returns nil; 256 into uint8 gives 0,
uint64(MaxUint64) into int64 gives -1, 1e300 into float32 gives +Inf — all without
WeaklyTypedInput and without error. decodeInt/decodeUint/decodeFloat call reflect's
SetInt/SetUint/SetFloat, which truncate to the target's width, after checking only the sign
for uint targets; the weak string path (`strconv.ParseInt(str, 0, val.Type().Bits())`) does
check the range, so "300" into int8 is an error while 300 is not. encoding/json refuses with
"cannot unmarshal number 300 into Go struct field ... of type int8".
'''

[[bug]]
id = "mapstructure/2"
title = "A float is truncated into an integer field without WeaklyTypedInput"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFloatTruncatedIntoInt"
found = { commit = "52aa5c6dc1d27226460807054ca2107b2d54fb2d", version = "v2.5.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Decode(map{"a": 1.7}, &struct{A int64})` sets 1, `1e30` sets math.MinInt64 (the
implementation-defined result of an out-of-range float-to-int conversion), both without
error and in the strict mode: decodeInt's `case dataKind == reflect.Float32:
val.SetInt(int64(dataVal.Float()))` has no integrality or range check. The weak conversion
table does not list floats to ints at all, and encoding/json refuses "1.7" for an int. A
JSON-derived map[string]any carries every number as float64, so this is the common path.
'''

[[bug]]
id = "mapstructure/3"
title = "ErrorUnset reports unexported fields, which the decoder never sets"
kind = "contract"
severity = "medium"
test = "TestHegelPinErrorUnsetCountsUnexportedField"
found = { commit = "52aa5c6dc1d27226460807054ca2107b2d54fb2d", version = "v2.5.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With `ErrorUnset: true`, decoding `{"pub": 1}` into `struct{Pub int; priv int}` fails with
"'' has unset fields: priv". The package doc says unexported fields are simply skipped, but
decodeStructFromMap records a field in targetValKeysUnused before the `CanSet()` check that
skips it, so any struct with a private field makes ErrorUnset (and Metadata.Unset) report it.
'''

[[bug]]
id = "mapstructure/4"
title = "WeaklyTypedInput formats a float32 as a float64 when converting to string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWeakFloat32ToString"
found = { commit = "52aa5c6dc1d27226460807054ca2107b2d54fb2d", version = "v2.5.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`WeakDecode(map{"s": float32(0.1)}, &struct{S string})` gives "0.10000000149011612":
decodeString uses `strconv.FormatFloat(dataVal.Float(), 'f', -1, 64)` for every float kind
(getKind folds Float32 and Float64 together), so the float32 is widened first and its
shortest representation is lost; 'f', -1, 32 would give "0.1".
'''

[[bug]]
id = "mapstructure/5"
title = "ZeroFields does not zero an interface field: the input must fit the old dynamic type"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinZeroFieldsKeepsInterfaceDynamicType"
found = { commit = "52aa5c6dc1d27226460807054ca2107b2d54fb2d", version = "v2.5.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With `ZeroFields: true` and Result `&struct{Any any}{Any: 1.5}`, decoding `{"any": true}`
fails with "'any' expected type 'float64', got unconvertible type 'bool'" (a string gives
"source data must be an array or slice" when the old value was a slice, and so on): decodeBasic
decodes into the interface's current concrete value, and ZeroFields ("zero fields before
writing them") is not applied to interface fields. Found by decoding a JSON-derived map into a
pre-filled struct: any `any` field whose old value has a different type breaks the decode.
'''

[[bug]]
id = "mapstructure/6"
title = "A nil input leaves a pre-filled pointer-to-struct field set"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNilInputKeepsPrefilledPointer"
found = { commit = "52aa5c6dc1d27226460807054ca2107b2d54fb2d", version = "v2.5.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
Decoding `{"p": nil}` into `struct{P *Inner}{P: &Inner{N: 1}}` leaves P non-nil, with and
without ZeroFields (with it, the pointee is zeroed instead). decodeStructFromMap dereferences
every non-nil pointer-to-struct field before decoding ("handle embedded struct pointers as
embedded structs"), not only the embedded ones, so the nil reaches the struct, not the
pointer; a fresh struct gets nil because the nil pointer has no Elem to take. encoding/json
sets the pointer to nil for null. Found by decoding a JSON-derived map into a pre-filled
struct with ZeroFields.
'''
