# Bugs found in hashicorp/go-version by the Hegel zoo. Oracle: Semantic Versioning 2.0.0
# (the README: "Versions used with go-version must follow SemVer") for parsing and precedence,
# the package's own documented rules for multi-segment versions and constraints, RubyGems for
# the pessimistic operator.

[[bug]]
id = "go-version/1"
title = "A pre-release with fewer identifiers sorts *after* one that extends it with an alphanumeric identifier: 1.0.0-alpha > 1.0.0-alpha.beta (the spec's own example has it lower)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinShorterPrereleaseIsLower"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
comparePart pads the shorter identifier list with "" and then decides "" against the other
identifier by its kind: lower than a numeric one, *higher* than an alphanumeric one. So
Compare("1.0.0-alpha", "1.0.0-alpha.1") is -1 but Compare("1.0.0-alpha", "1.0.0-alpha.beta")
is 1, and 1.0.0-rc.1 > 1.0.0-rc.1.x. Spec item 11: "A larger set of pre-release fields has a
higher precedence than a smaller set, if all of the preceding identifiers are equal", with the
example 1.0.0-alpha < 1.0.0-alpha.1 < 1.0.0-alpha.beta < 1.0.0-beta. Collection sorting and
every constraint on such versions inherit the order. The upstream table in version_test.go
asserts the inverted result ({"5.4-alpha", "5.4-alpha.beta", 1}) next to the correct
{"3.0-alpha.1", "3.0-alpha.beta", -1}, so a fix must touch that expectation.
'''

[[bug]]
id = "go-version/2"
title = "The pre-release is ignored when the two versions have different segment counts: 1.0.0-alpha equals 1.0.0.0, `= 1.0.0.0` matches 1.0.0-alpha, and the order is not transitive"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPrereleaseCountsWhateverTheSegmentCount"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Compare consults the pre-releases only inside `if v.equalSegments(other)`, and equalSegments
requires the same *number* of segments. With 1.0.0-alpha (three) against 1.0.0.0 (four) it
falls through to the jagged segment loop, which finds the extra segment zero and returns 0.
So Compare("1.0.0-alpha", "1.0.0.0") = 0, Compare("1.0.0.0-rc", "1.0.0") = 0 and
Compare("1.0-beta", "1.0.0.0") = 0, while 1.0.0-alpha < 1.0.0 = 1.0.0.0: Equal is not
transitive, sort.Sort(Collection) of {1.0.0.0, 1.0.0-alpha, 1.0.0, 1.0.0-beta, 1.0.0.0-rc}
leaves 1.0.0.0 first and 1.0.0.0-rc last, NewConstraint("= 1.0.0.0").Check(1.0.0-alpha) is
true and "!= 1.0.0.0" false. Comparing the zero-extended segments for equality (the loop
already does) before the pre-release step fixes it.
'''

[[bug]]
id = "go-version/3"
title = "Numeric pre-release identifiers with leading zeros are accepted and compared by length: 1.0.0-01 > 1.0.0-2, 1.0.0-01 > 1.0.0-1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLeadingZeroIdentifiersCompareByValue"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
compareNumericIdentifiers (added in #212 for values beyond int64) orders all-digit
identifiers by length first, with the comment "Per the semver spec, numeric identifiers must
not have leading zeroes" — but both version regexes accept them (`[0-9]+[0-9A-Za-z\-~]*`),
NewSemver included. Compare("1.0.0-01", "1.0.0-2") = 1 and Compare("1.0.0-01", "1.0.0-1") = 1,
where the values are 1 < 2 and 1 = 1. Either reject leading zeros (the spec) or strip them
before comparing.
'''

[[bug]]
id = "go-version/4"
title = "NewSemver, documented to adhere \"strictly to SemVer specs\", accepts a v prefix, one, two or four segments, leading zeros and `~` in identifiers"
kind = "contract"
severity = "low"
test = "TestHegelPinNewSemverIsStrict"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
SemverRegexpRaw differs from VersionRegexpRaw in one place only: the hyphen before an
alphabetic pre-release is mandatory. Everything else the loose parser tolerates is accepted
too: NewSemver("v1.2.3"), ("1.2"), ("1"), ("1.2.3.4"), ("01.2.3"), ("1.02.3"), ("1.2.3-01"),
("1.2.3-a~b") and ("1.2.3+~") all succeed, none of which is a valid semver 2.0.0 version
(exactly three segments, no leading zeros, identifiers from [0-9A-Za-z-]). Callers that use
NewSemver as a validator get none of this checked.
'''

[[bug]]
id = "go-version/5"
title = "`~> 1` (a single segment) is unbounded: it matches 2.0.0 and 5.3.1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPessimisticSingleSegmentIsBounded"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
constraintPessimistic fixes the first si-1 written segments (none for `~> 1`) and then checks
`c.segments[cs-1] > v.segments[cs-1]` with cs the *padded* length (3), i.e. the patch of the
zero-padded 1.0.0, which no version fails. So NewConstraint("~> 1").Check(2.0.0) and
Check(5.3.1) are true and "~> 0" accepts 1.0.0, while "~> 1.0" is bounded by 2.0 as the
upstream table shows and RubyGems (the operator's origin) defines `~> 1` as `>= 1, < 2`. The
last-segment check should use the written segment (index si-1); with a single segment the
major must then be equal.
'''

[[bug]]
id = "go-version/6"
title = "A trailing hyphen is accepted and becomes a pre-release identifier \"-\": NewVersion(\"1.2.3-\") prints \"1.2.3--\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTrailingHyphenIsMalformed"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The alphabetic pre-release alternative of VersionRegexpRaw is `-?([A-Za-z\-~]+...)`: the
separator is optional and the identifier class contains the hyphen, so in "1.2.3-" the
regex takes no separator and the hyphen as the identifier. NewVersion("1.2.3-") succeeds with
Prerelease() "-" and String() "1.2.3--"; NewVersion("1.2.3-.a") has the pre-release "-.a"
and NewVersion("1.2-") prints "1.2.0--". NewSemver rejects them (its separator is
mandatory), and every other dangling separator ("1.2.3+", "1.2.3.", "1.2.3-a.") is refused
by both. An empty pre-release should be malformed.
'''

[[bug]]
id = "go-version/7"
title = "Scan rejects []byte (\"cannot scan []uint8 as Version\"), the type most database/sql drivers deliver for text columns"
kind = "contract"
severity = "low"
test = "TestHegelPinScanAcceptsBytes"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Version implements sql.Scanner for string and nil only. database/sql hands TEXT/VARCHAR
values to Scan as []byte with several common drivers (go-sql-driver/mysql without
parseTime-style conversions, mattn/go-sqlite3 for some column affinities, lib/pq for
bytea-cast text), so a Version column fails to scan with "cannot scan []uint8 as Version".
Value() returns a string, so the round trip through such a driver breaks on the way back.
Masterminds/semver's Scan accepts both.
'''

[[bug]]
id = "go-version/8"
title = "A pessimistic constraint with more segments than the version never matches: `~> 0.3.0.0` rejects 0.3.0 although `~> 0.3.0` accepts 0.3.0.0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPessimisticAcceptsShorterEqualVersion"
found = { commit = "4f9dad4645ee2935418c5eb169ab05976abeaf6b", version = "v1.9.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
constraintPessimistic returns false when `cs > len(v.segments)` ("the version being checked
has less specificity than the constraint"). Versions are zero-extended everywhere else
(Compare says 0.3.0 == 0.3.0.0, `= 0.3.0.0` matches 0.3.0, `~> 0.3.0` matches 0.3.0.0), so
NewConstraint("~> 0.3.0.0").Check(0.3.0) = false and "~> 1.2.3.0" rejects 1.2.3 while
accepting 1.2.3.1. Found by the constraint property at 20 000 cases. Indexing the padded
segments (or extending the version's) removes the special case.
'''
