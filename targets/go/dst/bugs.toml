# Bugs found in dave/dst by the Hegel properties in hegel.patch (see README.md).
#
# Oracle: gofmt (go/format). dst's contract, checked by its own tests over the standard library,
# is that a gofmt-formatted file survives decorator.Parse + decorator.Fprint byte for byte. Not
# judged: sources gofmt itself is not stable on (a second gofmt pass changes them).

[[bug]]
id = "dst/1"
title = "A comment after the = of a generic type alias moves before the type parameters"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAliasTypeParamsComment"
found = { commit = "a42bf06d06c085b246ba8151ef961987c89bba10", version = "v0.28.0 (a42bf06)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Round trip of

    type T2[T any] = /* c */ string

prints `type T2 /* c */ [T any] = string`. The restorer (decorator/restorer-generated.go, case
*dst.TypeSpec) places the Assign token right after the Name and applies the Name decorations
there, before restoring TypeParams; for an alias without type parameters and for a generic type
without = the comment stays put. The comment lands between the name and the type parameters,
which a second round trip then keeps.
'''

[[bug]]
id = "dst/2"
title = "A multi-result return spanning lines, closed by a comment, has its results indented one level too deep"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinReturnListCommentIndent"
found = { commit = "a42bf06d06c085b246ba8151ef961987c89bba10", version = "v0.28.0 (a42bf06)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Round trip of

    func f() {
        return f(
            1,
        ), s
        // c
    }

indents `1,` and `), s` one tab more than gofmt does. It takes a return with several results
of which one spans lines (a call with arguments on their own lines, a func literal, a binary
expression broken over lines, a type assertion or instantiation with a multi-line type; not a
composite literal), followed by a comment - line or block, even after a blank line - at the end
of the block, case clause or comm clause (the comment is the return's End decoration; a
statement between them restores the layout). The restored positions make go/printer take the
comment for a continuation of the result list and indent the list. The output is valid Go.
'''

[[bug]]
id = "dst/3"
title = "Two spaces before the trailing comment of a multi-line raw string spec in a var or const block"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRawStringSpecComment"
found = { commit = "a42bf06d06c085b246ba8151ef961987c89bba10", version = "v0.28.0 (a42bf06)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Round trip of

    var (
        i = `raw
    multi` // c
        j = 1
    )

prints `multi`  // c` with two spaces. It takes a grouped var or const declaration of at least
two specs, one of which has a raw string spanning lines as its value and a trailing comment
(line or block); the other spec may come before or after, a blank line or a comment line between
them changes nothing. The same spec alone in its group, or in a function body, or a struct field
with a multi-line tag, prints right. gofmt ends the alignment section at the multi-line string,
dst's restored positions leave the comment in a tabwriter cell aligned with nothing.
'''
