# Bugs found in docker/go-units by the Hegel zoo. Oracle: exact arithmetic (math/big) and models.

[[bug]]
id = "go-units/1"
title = "FromHumanSize/RAMInBytes return -9223372036854775808 with a nil error for sizes at or beyond 2^63"
kind = "wrong-result"
severity = "medium"
test = "TestHegelSizeParsersRejectOverflow"
found = { commit = "2bd057e7d15e38a5d66bd084ffe3619027c7b8b6", version = "v0.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parseSize multiplies the float64 value by the unit and converts with `int64(size)`; for a value
of 2^63 or more the conversion is out of range and Go (on amd64) yields math.MinInt64. So
`FromHumanSize("9223372036854775808")`, `FromHumanSize("9999999999PB")`, `FromHumanSize("1e30")`
and `RAMInBytes("8192PiB")` all return -9223372036854775808, nil — a negative size, from a
function whose callers (docker's `--memory`, `--shm-size`, storage quotas) check only the error.
"1e400" is rejected because strconv reports the range error, so only values between 2^63 and
about 1.8e308 slip through. The result should be an error (or math.MaxInt64 with an error).
'''

[[bug]]
id = "go-units/2"
title = "Decimal sizes are multiplied in float64 and truncated, so \"1.007kB\" is 1006 bytes and \"16.1PB\" is 16100000000000002"
kind = "wrong-result"
severity = "medium"
test = "TestHegelSizeParsersAreExact"
found = { commit = "2bd057e7d15e38a5d66bd084ffe3619027c7b8b6", version = "v0.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`1.007kB` is exactly 1007 bytes, but 1.007 is not representable in binary, the float64 product
1.007 × 1000 is 1006.9999999999999 and `int64()` truncates it to 1006. The same happens for
`4.031kB` (4030), `16.112 kB` (16111), `1.007k`, and for RAMInBytes(`1.007kB`) (1030 instead of
1031); a scan of three-digit fractions finds a wrong result every few inputs. The error grows
with the size: `16.1PB` is 16100000000000002 (two bytes over — the float64 product rounds up),
and at petabytes the rounding error of a double reaches hundreds of bytes. Parsing the
decimal exactly (integer and fraction digits scaled by the unit, or math/big.Rat) or rounding
instead of truncating would fix it. Upstream's TestRAMInBytes computes its expectation as
`int64(32.3 * MiB)` — the same float product — so it cannot see this. The general property
tolerates one byte and documents why.
'''

[[bug]]
id = "go-units/3"
title = "The printers emit EB/ZB/YB and EiB/ZiB/YiB but the parsers know no unit above P"
kind = "wrong-result"
severity = "low"
test = "TestHegelSizeParsersReadExaZettaYotta"
found = { commit = "2bd057e7d15e38a5d66bd084ffe3619027c7b8b6", version = "v0.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`HumanSize(1e18)` is "1EB" and `BytesSize(1<<60)` is "1EiB" (the unit tables go up to Y), but
`FromHumanSize("1EB")` and `RAMInBytes("1EiB")` fail with `invalid suffix: 'eb'` — the parser
maps only k, m, g, t, p. Sizes up to 9.22 EB fit in int64, so `FromHumanSize(HumanSize(x))`
fails for every x from 10^18 to math.MaxInt64 although the value is representable. Adding
'e' (EB = 1000 PB, EiB = 1024 PiB) to the parser maps closes the gap; Z and Y overflow int64
anyway (and would need go-units/1 fixed to be rejected cleanly).
'''

[[bug]]
id = "go-units/4"
title = "Rounding the mantissa to the precision can reach the base: 999950 bytes print as \"1000kB\", 1048575 as \"1024KiB\""
kind = "wrong-result"
severity = "low"
test = "TestHegelSizePrintersCarryIntoTheNextUnit"
found = { commit = "2bd057e7d15e38a5d66bd084ffe3619027c7b8b6", version = "v0.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
getSizeAndUnit picks the unit by comparing the unrounded size with the base, then the caller
formats with `%.4g` (or `%.*g`): a mantissa in [999.95, 1000) rounds to 1000, so `HumanSize(999950)`
is "1000kB" (expected "1MB"), `HumanSize(999.95)` is "1000B" and `BytesSize(1048575)` is
"1024KiB" (expected "1MiB"). With a small precision the window is wide and the output switches
to exponent notation: `HumanSizeWithPrecision(950000, 1)` is "1e+03kB" (expected "1MB") — every
size whose mantissa is 950 or more at precision 1. Choosing the unit after rounding (or
re-checking the rounded mantissa against the base) is the usual fix.
'''

[[bug]]
id = "go-units/5"
title = "ParseUlimit's \"invalid ulimit argument\" error prints an empty argument"
kind = "wrong-result"
severity = "low"
test = "TestHegelUlimitErrorNamesTheArgument"
found = { commit = "2bd057e7d15e38a5d66bd084ffe3619027c7b8b6", version = "v0.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`name, val, ok := strings.Cut(val, "=")` assigns to the parameter `val` (no new variable of that
name is declared), and when there is no '=' Cut returns an empty `after`, so the error built
next, `fmt.Errorf("invalid ulimit argument: %s", val)`, reads "invalid ulimit argument: " for
`ParseUlimit("nofile")` and every other argument without '='. Introduced when the split moved
from strings.SplitN to strings.Cut; the message used to name the argument.
'''

[[bug]]
id = "go-units/6"
title = "ParseUlimit accepts negative limits other than -1 and GetRlimit turns them into limits near 2^64"
kind = "wrong-result"
severity = "low"
test = "TestHegelUlimitRejectsNegativeLimits"
found = { commit = "2bd057e7d15e38a5d66bd084ffe3619027c7b8b6", version = "v0.5.0+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
-1 means unlimited (the error text says so: "soft: -1 (unlimited)") and is handled; any other
negative value passes the checks whenever soft ≤ hard: `nofile=-5` and `nofile=-5:-5` give
Ulimit{Soft: -5, Hard: -5}, `nofile=-7:-5` Soft -7 / Hard -5, `core=-9223372036854775808` the
minimum int64, and GetRlimit converts them with uint64() to 18446744073709551611 and friends —
effectively unlimited, silently, for a typo. `nofile=0:-5` is rejected only because 0 > -5
trips the soft-above-hard check. Values below -1 should be an error.
'''
