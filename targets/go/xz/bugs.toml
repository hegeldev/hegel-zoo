# Bugs found in github.com/ulikunitz/xz by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure
# in target.toml.

[[bug]]
id = "xz/1"
title = "A truncated .xz stream decodes with a clean io.EOF when the cut falls in a block header, between blocks, or (without a check) inside block data"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinTruncatedStreamsAreErrors"
found = { commit = "024f9092972afea64fa5c25157566881bac36938", version = "v0.5.16", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
For a 300-byte stream of three blocks (BlockSize 40, NoCheckSum) 66 of the 299 proper
prefixes decode without any error: every cut inside a block header (bytes 12–23, 64–75, …),
the cut exactly between two blocks, and cuts at 4-byte boundaries inside a block's LZMA2 data
(32, 84, 136, …). The Reader returns the blocks decoded so far and io.EOF — a stream cut in
half looks like a complete shorter file; the missing index and footer are never noticed.
readBlockHeader passes the io.EOF from the first byte of a header up as the end of the stream
(streamReader.Read: `if err == errIndexIndicator {readTail} … return n, err`), and an io.EOF
from the LZMA2 layer at a chunk boundary ends the block, whose 0-byte padding and absent check
then verify trivially. `xz -dc` reports "Unexpected end of input" for every prefix. With a
check the data cuts are caught by the missing checksum, the header cuts are not.
2026-09-17: the corruption property reached the same end without a cut — in the 32-byte
stream `xz --check=none` writes for empty input, the index indicator (byte 12, 0x00) flipped
to 0x12 announces a 76-byte block header of which 19 bytes exist; xz says "Unexpected end of
input", the Reader returns a clean EOF. The pin now has that mutant too, and the property
treats any mutant that xz calls an unexpected end of input (data intact) as this bug.
"""

[[bug]]
id = "xz/2"
title = "Writer and lzma.Writer2 fail with \"insufficient space\" on incompressible data when DictCap is below 64 KiB"
kind = "crash"
severity = "medium"
test = "TestHegelPinSmallDictionaryCompressesIncompressibleData"
found = { commit = "024f9092972afea64fa5c25157566881bac36938", version = "v0.5.16", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
xz.WriterConfig{DictCap: 4096} (also 8192, 32768) writing 70000 random bytes: Write returns
lzma.ErrNoSpace ("insufficient space"); 65552 bytes succeed, 65553 fail; 300 KB written in
1000-byte pieces fails too. Compressible data of any size is fine, and so is any DictCap of
64 KiB or more. Writer2.flushChunk chooses an uncompressed chunk when the compressed form is
not smaller, and writeUncompressedChunk copies the chunk's input back out of the encoder
dictionary (`w.encoder.dict.CopyN(w.w, u)`); a chunk is closed when its compressed size reaches
64 KiB, so an incompressible chunk holds about 64 KiB of input, of which a smaller dictionary
retains only the tail — CopyN returns ErrNoSpace. `xz --lzma2=dict=4KiB` compresses the same
data without complaint. Callers who lower DictCap to save memory (the documented purpose of
the field) cannot write already-compressed or encrypted data.
"""

[[bug]]
id = "xz/3"
title = "Matcher BinaryTree writes streams that neither lzma.Reader nor xz can decode (classic .lzma and LZMA2/.xz)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBinaryTreeMatcherWritesDecodableStreams"
found = { commit = "024f9092972afea64fa5c25157566881bac36938", version = "v0.5.16", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Data with long-distance repeats compressed by the classic Writer with lzma.BinaryTree (DictCap
4096–65536, BufSize 4096) decodes to "lzma: writeMatch: distance out of range" in lzma.Reader
and to "Compressed data is corrupt" in `xz --format=lzma -dc`: about one stream in a few
hundred, so the encoder emits a match whose distance exceeds the dictionary. HashTable4 (the
default) never fails. The LZMA2 path is affected as well: xz.WriterConfig{DictCap: 65536,
Matcher: BinaryTree} on 79535 bytes of an a/b alphabet gave a .xz that `xz -dc` rejects as
"Compressed data is corrupt". BinaryTree is a documented MatchAlgorithm value accepted by Verify.
Upstream's TODO.md lists "Fix binary tree matcher" under release v0.6, so the problem is known
there; the pin records it against the pinned release.
"""

[[bug]]
id = "xz/4"
title = "lzma.WriterConfig{SizeInHeader: true, Size: 0} writes an unknown-size header without an EOS marker, so the empty stream cannot be decoded"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinExplicitSizeZeroRoundTrips"
found = { commit = "024f9092972afea64fa5c25157566881bac36938", version = "v0.5.16", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
An empty input with an explicit size produces 5d 00 00 80 00 ff ff ff ff ff ff ff ff 00 00 00
00 00: the header says "size unknown" (Header.marshalBinary writes noHeaderSize unless
`h.Size > 0`, and -1 is the unknown marker, so 0 should be written as 0) and, because
SizeInHeader was set, no end-of-stream marker is written. lzma.Reader returns "unexpected EOF"
and `xz --format=lzma -dc` "Unexpected end of input"; Reader.Header reports Size -1. Any
program that compresses files with their size in the header writes an unreadable .lzma for an
empty file. Sizes 1 and up are fine.
"""

[[bug]]
id = "xz/5"
title = "lzma.Writer2.Close returns nil when flushing the last chunk fails"
kind = "contract"
severity = "medium"
test = "TestHegelPinWriter2CloseReportsTheFlushError"
found = { commit = "024f9092972afea64fa5c25157566881bac36938", version = "v0.5.16", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Writer2.Close is `if err := w.Flush(); err != nil { return nil }`: the error from writing the
buffered chunks to the underlying writer is discarded and Close reports success. A Writer2
over a writer that fails on the first byte accepts Write("hello") (buffered) and then Close
returns nil; the output holds nothing and the caller never learns it (Write after that Close
is also accepted, since the writer is never marked closed). Compare xz.Writer.Close and
lzma.Writer.Close, which return the error.
"""

[[bug]]
id = "xz/6"
title = "lzma.Writer accepts Write and Close after Close and appends more bytes to the finished stream"
kind = "contract"
severity = "low"
test = "TestHegelPinLzmaWriterRefusesUseAfterClose"
found = { commit = "024f9092972afea64fa5c25157566881bac36938", version = "v0.5.16", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
After Close (which writes the EOS marker and flushes the range encoder) a further Write
returns nil and a second Close returns nil, and the stream grows (28 → 38 bytes for
"hello" + "more"): a second EOS marker and range-coder flush are appended, so the output is
no longer a valid .lzma file (xz: trailing garbage). xz.Writer and lzma.Writer2 return
errClosed in both cases; lzma.Writer has no closed state.
"""

[[bug]]
id = "xz/7"
title = "lzma.Reader.Read with an empty buffer returns io.EOF while decoded bytes are still buffered"
kind = "contract"
severity = "low"
test = "TestHegelPinEmptyReadIsNotEOFWhileDataRemains"
found = { commit = "024f9092972afea64fa5c25157566881bac36938", version = "v0.5.16", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
decoder.Read: `k, err = d.Dict.Read(p[n:]); if k == 0 && d.eos { return n, io.EOF }` — with
len(p) == 0 the dictionary read is empty, and once the decoder has consumed the whole
compressed stream (eos set, up to a dictionary's worth of output still buffered) the empty
read answers io.EOF. A caller that passes an empty buffer (io.Reader permits it) and treats
EOF as the end stops short: the property lost 39 of 40, 905 of 41850 and 77299 of 97081 bytes
this way, with the Go Writer's and xz's streams alike. xz.Reader and lzma.Reader2 return
0, nil for an empty buffer.
"""
