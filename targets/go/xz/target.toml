name = "xz"
language = "go"
upstream = "https://github.com/ulikunitz/xz"
subdir = ""
license = "BSD-3-Clause"
# README.md, SECURITY.md, TODO.md and LICENSE only: nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "6ead826b4d3c7c9856f2daa905cf06403b9daddc"
date = "2026-09-19"
version = "v0.5.17"

[hegel]
version = "v0.6.33"

[run]
# The xz command-line tool (XZ Utils, 5.4 here and on the ubuntu runners) is the oracle.
setup = ["xz --version"]
# -timeout: the suite takes ~5 min and a shrinking corruption failure forks xz thousands of
# times more; go test's default 10 min then killed a run mid-shrink.
command = "go test -count=1 -timeout 40m -run TestHegel -v ."

[expected_failures]
TestHegelPinTruncatedStreamsAreErrors = "xz/1"
TestHegelPinSmallDictionaryCompressesIncompressibleData = "xz/2"
TestHegelPinBinaryTreeMatcherWritesDecodableStreams = "xz/3"
TestHegelPinExplicitSizeZeroRoundTrips = "xz/4"
TestHegelPinWriter2CloseReportsTheFlushError = "xz/5"
TestHegelPinLzmaWriterRefusesUseAfterClose = "xz/6"
TestHegelPinEmptyReadIsNotEOFWhileDataRemains = "xz/7"
TestHegelPinLzma2PackedSizeIsVerified = "xz/8"
# The wide properties reach the known shapes at a few percent of cases and shrink to whichever
# is smallest in the run (the classic round trip lands on xz/4 most runs, xz/7 in some).
TestHegelWritersReportTheirSinksErrors = "xz/6"
TestHegelWriterOutputRoundTripsThroughTheReader = { bug = "xz/2", intermittent = true }
TestHegelXzToolDecodesTheWriterOutput = { bug = "xz/2", intermittent = true }
TestHegelLzma2ChunkSequencesRoundTrip = { bug = "xz/2", intermittent = true }
TestHegelReadersAreIOReaders = { bug = "xz/2", intermittent = true }
TestHegelClassicLzmaRoundTrips = { bug = "xz/4", intermittent = true }
TestHegelCorruptStreamsAreRejected = { bug = "xz/1", intermittent = true }
TestHegelStreamsCutAtBlockBoundariesAreErrors = "xz/1"
TestHegelSmallDictionariesCompressIncompressibleData = "xz/2"
TestHegelBinaryTreeMatcherStreamsDecode = "xz/3"
TestHegelExplicitSizeHeadersRoundTrip = "xz/4"
TestHegelWriter2ReportsTheFlushError = "xz/5"
TestHegelLzmaWriterRefusesWritesAfterClose = "xz/6"
TestHegelEmptyReadsAreNotEOFWhileDataRemains = "xz/7"
TestHegelLzma2PackedSizesAreVerified = "xz/8"
