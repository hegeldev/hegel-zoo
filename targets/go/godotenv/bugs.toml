# Bugs found in joho/godotenv by the zoo's Hegel tests (hegel/ in the patch). Each pin (test)
# fails while the bug is open. The reference is Ruby dotenv (gem dotenv 3.2.0, with
# DOTENV_LINEBREAK_MODE=legacy), the library godotenv is a port of and names as the compatibility
# target with Node dotenv (18.0.1, checked by hand where it applies).

[[bug]]
id = "godotenv/1"
title = "Variable references to names with lower-case letters are not expanded ($low stays literal) and ${Mixed_Case} substitutes M and leaves ixed_Case}, where Ruby dotenv and dotenv-expand substitute the whole name"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLowerCaseReference"
found = { commit = "97a2850142438b3c357c1d3439e325181afdcc1d", version = "v1.6.0-pre.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`low=2` / `C=$low ${low}`: Ruby dotenv gives C="2 2", godotenv "$low ${low}". `Mixed_Case=5` /
`D=${Mixed_Case}`: Ruby "5", godotenv "ixed_Case}" (the pattern takes `M`, substitutes the unset
variable M by "" and leaves the rest). `expandVarRegex` (parser.go) is `(\\)?(\$)(\()?\{?([A-Z0-9_]+)?\}?`,
case-sensitive; Ruby's `Substitutions::Variable::VARIABLE` is the same pattern with the `i` flag,
and dotenv-expand's takes `\w+`. Keys with lower-case letters are accepted by all three parsers, so
a file that defines `host=...` and uses `${host}` reads differently. Found by the Ruby dotenv
differential (references to the generated lower-case keys).
'''

[[bug]]
id = "godotenv/2"
title = "A value that is only a comment (KEY= # comment, KEY=#comment) makes the parser panic with index out of range [-1] instead of giving the empty string"
kind = "crash"
severity = "high"
test = "TestHegelPinCommentAsValuePanics"
found = { commit = "97a2850142438b3c357c1d3439e325181afdcc1d", version = "v1.6.0-pre.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`godotenv.Unmarshal("A= # to be filled in\n")` panics: `runtime error: index out of range [-1]` in
`extractVarValue` (parser.go): the unquoted value starts with `#` (the spaces after `=` are
trimmed first), the loop looking for a space-then-# finds `#` at index 0 and reads `line[i-1]`.
Ruby and Node dotenv give A="" (the # starts a comment). `Load`, `Read`, `Parse` and the
`godotenv` command all reach it. Found by the Ruby dotenv differential (a comment after an empty
value).
'''

[[bug]]
id = "godotenv/3"
title = "A quoted value ending with an escaped quote loses the quote (single-quoted it, backslash, quote reads as it and a backslash), the value between the quotes being trimmed of every quote character at both ends; Unmarshal(Marshal(m)) differs for a value ending with a double quote"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedQuoteBeforeClosingQuote"
found = { commit = "97a2850142438b3c357c1d3439e325181afdcc1d", version = "v1.6.0-pre.4", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`B='it\''`: Ruby and Node dotenv give `it\'` (single quotes keep everything literally), godotenv
`it\`. `B="a\""`: Ruby gives `a"`, godotenv `a\`. `extractVarValue` (parser.go) finds the closing
quote correctly (an odd number of backslashes escapes) and then removes the quotes with
`bytes.TrimLeftFunc(bytes.TrimRightFunc(src[0:i], isQuote), isQuote)`, which strips the escaped
quote's own character as well, leaving its backslash. `Marshal` writes a value ending with `"` as
`"...\""`, so `Unmarshal(Marshal(map[string]string{"Q": "say \"hi\""}))["Q"]` is `say "hi\`: the
package does not read its own output. Found by the Ruby dotenv differential and the Marshal round
trip.
'''
