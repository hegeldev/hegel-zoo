name = "godotenv"
language = "go"
upstream = "https://github.com/joho/godotenv"
subdir = ""
license = "MIT"  # LICENCE; README says nothing about AI-written code (checked 2026-09-20); feature complete, accepts compatibility fixes with Ruby and Node dotenv
ai_policy_checked = "2026-09-20"

[base]
commit = "97a2850142438b3c357c1d3439e325181afdcc1d"
date = "2026-05-25"
version = "v1.6.0-pre.4"

[hegel]
version = "v0.6.33"

[run]
# The tests live in hegel/ and compare Parse on generated .env texts with Ruby dotenv (gem dotenv 3.2.0,
# the library this package is a port of), run as a child process with DOTENV_LINEBREAK_MODE=legacy.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinLowerCaseReference = "godotenv/1"
TestHegelPinCommentAsValuePanics = "godotenv/2"
TestHegelPinEscapedQuoteBeforeClosingQuote = "godotenv/3"
