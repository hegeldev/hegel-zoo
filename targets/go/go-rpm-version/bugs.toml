# Bugs found in knqyf263/go-rpm-version by the Hegel tests of this target.

[[bug]]
id = "go-rpm-version/1"
title = "The release starts at the first hyphen, where rpm splits at the last (1.0-1-2 is version 1.0, release 1-2)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReleaseAtLastHyphen"
found = { commit = "1815e1f1b79093aa3c8bb50c11778d15a3670916", version = "master (untagged, 1815e1f)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
NewVersion (version.go) uses strings.Index(ver, "-") to separate version and release; rpm's
parseEVR (rpmio/rpmver.cc) uses strrchr, the last "-", since a version may contain hyphens
and a release may not. NewVersion("1.0-1-2") is {version "1.0", release "1-2"} where rpm reads
{version "1.0-1", release "2"}, and Compare("1.0-1-2", "1.0-2") is -1 where rpm gives 1 (the
versions "1.0-1" and "1.0" differ before the releases are looked at). Found by
TestHegelCompare and TestHegelString with the releaseSplitsAtFirstHyphen switch off.
"""

[[bug]]
id = "go-rpm-version/2"
title = "Any text before the first colon is taken as the epoch and read as 0 when it is not a number"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEpochDigitsOnly"
found = { commit = "1815e1f1b79093aa3c8bb50c11778d15a3670916", version = "master (untagged, 1815e1f)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
NewVersion splits at the first ":" and runs strconv.Atoi on the left part after trimming
leading spaces, taking 0 on error; rpm's parseEVR takes an epoch only when the string starts
with digits followed by ":", and otherwise the ":" belongs to the version. So "abc:1" is
{epoch 0, version "1"} and compares equal to "1" (rpm: version "abc:1", less than "1");
" 1:2" and "+1:2" have epoch 1 (rpm: no epoch, version " 1:2"); "-1:2" has epoch -1 (rpm:
version "", release "1:2"). Found by TestHegelCompare and TestHegelString with the
epochTextAccepted switch off.
"""

[[bug]]
id = "go-rpm-version/3"
title = "An epoch beyond int64 reads as 0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEpochOverflow"
found = { commit = "1815e1f1b79093aa3c8bb50c11778d15a3670916", version = "master (untagged, 1815e1f)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The epoch is strconv.Atoi's result with errors mapped to 0, so "99999999999999999999:1" has
epoch 0 and is less than "1:1"; rpm's rpmverCmp compares epochs with rpmvercmp as digit
strings (the longer number wins), and rpmvercmp itself was changed long ago to avoid exactly
this overflow for version segments. Found by TestHegelCompare and TestHegelString with the
epochOverflowIsZero switch off.
"""

[[bug]]
id = "go-rpm-version/4"
title = "String omits an epoch of zero or less, so NewVersion(v.String()) is not v when the version holds a colon or the epoch is negative"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinStringRoundTrip"
found = { commit = "1815e1f1b79093aa3c8bb50c11778d15a3670916", version = "master (untagged, 1815e1f)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
String writes the epoch only when it is positive. NewVersion("-1:2") has epoch -1 (see
go-rpm-version/2) and prints as "2", which parses back with epoch 0 and compares greater.
NewVersion("0:a:1") is {epoch 0, version "a:1"} and prints as "a:1", which parses back as
{epoch 0 ("a" is not a number), version "1"}, and so does ":a:1". rpm's rpmverEVR keeps a
present epoch ("0:..."). Found by TestHegelString with the stringNotReparsable switch off.
"""
