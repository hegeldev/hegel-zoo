# Bugs found in jhillyerd/enmime by the zoo's Hegel tests (hegel/ in the patch). Each pin (test)
# fails while the bug is open. The reference is Python's email package (3.12, policy.default) and
# the MIME RFCs (2045, 2046, 2047, 2231, 5322).

[[bug]]
id = "enmime/1"
title = "A part without a Content-Type header loses its Content-Disposition and file name: setupHeaders returns before setupContentHeaders, so such an attachment is unnamed and missing from Envelope.Attachments"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDispositionWithoutContentType"
found = { commit = "6c69c1c37bf7d273337b7d568f971013aa4b38d6", version = "v2.5.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A multipart/mixed message whose second part has only `Content-Disposition: attachment;
filename="notes.txt"` (no Content-Type: text/plain by default, RFC 2046 5.2): Python gives
disposition attachment and file name notes.txt; enmime's Part has Disposition "" and FileName "",
and Envelope.Attachments is empty. In `setupHeaders` (part.go) a missing Content-Type on a child
part adds the warning ErrorMissingContentType and returns before `setupContentHeaders`, which is
what reads Content-Disposition. Found by the Python differential (child parts without headers but
a disposition).
'''

[[bug]]
id = "enmime/2"
title = "RFC 2231 file names in a charset other than UTF-8 are dropped (filename*=iso-8859-1''r%E9sum%E9.pdf gives no file name) and with continuations partly kept undecoded"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRFC2231FileNameCharset"
found = { commit = "6c69c1c37bf7d273337b7d568f971013aa4b38d6", version = "v2.5.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Content-Disposition: attachment; filename*=iso-8859-1''r%E9sum%E9.pdf`: Python gives résumé.pdf,
enmime FileName "". `filename*0*=iso-8859-1''r%E9; filename*1*=sum%E9.pdf`: enmime gives
"sum\xe9.pdf" (the first segment lost, the second's bytes undecoded). `filename*=windows-1252''%80.pdf`:
"". RFC 2231 4 allows any registered charset in an extended value; `mediatype.Parse` relies on Go's
mime.ParseMediaType, whose decode2231Enc only knows us-ascii and utf-8 and drops other values, and
enmime (which has its own charset conversion for bodies and encoded words) does not fill the gap.
utf-8 and us-ascii values, with or without a language tag, are fine. Found by a probe of the
differential; the property gates the shape.
'''

[[bug]]
id = "enmime/3"
title = "Boundary detection ignores what follows on the line: a body line --b1 extra is taken as a delimiter (and the parse then fails on the next line as a malformed header) and --b1--x anywhere in a line as the terminator"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBoundaryFollowedByText"
found = { commit = "6c69c1c37bf7d273337b7d568f971013aa4b38d6", version = "v2.5.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 2046 5.1.1: a boundary delimiter line is `--boundary` at the start of a line "followed by
optional linear whitespace and then a CRLF"; anything else is body text. A text part containing the
line `--b1 extra` (boundary b1): Python keeps it in the part's content; enmime's `isDelimiter`
(boundary.go) accepts the prefix followed by any white space character, takes the line as a
delimiter, reads `still one` as the next part's header and `ReadEnvelope` fails with "malformed MIME
header initial line". A line `text --b1--x`: `isTerminator` uses bytes.Index of `--b1--` anywhere in
the line, so the part ends there and the rest of the message is dropped (Python: one part with the
whole text). `isDelimiter` likewise finds the prefix anywhere in the line (`text --b1 extra`). Found
by a probe of the differential; the property gates the shape.
'''

[[bug]]
id = "enmime/4"
title = "An encoded word with an RFC 2231 language tag (=?utf-8*en?q?caf=C3=A9?=) is left undecoded in Subject and makes an address list with such a display name unparseable (unsupported charset utf-8*en)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEncodedWordLanguageTag"
found = { commit = "6c69c1c37bf7d273337b7d568f971013aa4b38d6", version = "v2.5.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 2231 5 extends encoded words to `=?charset*language?encoding?text?=`. `Subject:
=?utf-8*en?q?caf=C3=A9?=`: Python gives café, `Envelope.GetHeader("Subject")` the raw encoded
word. `From: =?utf-8*en?q?Zo=C3=AB?= <a@example.com>`: `AddressList("From")` fails with `missing
word in phrase: unsupported charset "utf-8*en"`. enmime decodes with Go's mime.WordDecoder and its
own CharsetReader, which receives the charset with the tag attached; stripping `*language` before
the lookup would do. Found by a probe of the differential; the property gates the shape.
'''

[[bug]]
id = "enmime/5"
title = "A comment before an address in an address list (To: (pre) d@example.org, or a@x.com, (c) b@x.com) makes ParseAddressList fail with missing word in phrase, so AddressList returns nothing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommentBeforeAddress"
found = { commit = "6c69c1c37bf7d273337b7d568f971013aa4b38d6", version = "v2.5.0", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`To: (pre) d@example.org` and `To: a@x.com, (c) b@x.com`: Python's address parser gives the one and
two addresses; enmime's `ParseAddressList` (header.go, "more tolerant of malformed headers than
net/mail") returns `mail: missing word in phrase: mail: invalid string` and `Envelope.AddressList`
nothing. RFC 5322 3.4 allows CFWS (comments and folding white space) around every mailbox; a
comment after an addr-spec (`c@example.org (Carol)`) is accepted and becomes the display name (Go's
net/mail behaviour; Python drops it - a divergence, not a bug). Found by a probe of the
differential; the property gates the shape.
'''
