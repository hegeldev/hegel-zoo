name = "enmime"
language = "go"
upstream = "https://github.com/jhillyerd/enmime"
subdir = ""
license = "MIT"  # LICENSE; README and CONTRIBUTING say nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "6c69c1c37bf7d273337b7d568f971013aa4b38d6"
date = "2026-09-05"
version = "v2.5.0"

[hegel]
version = "v0.6.33"

[run]
# The tests live in hegel/ and compare enmime's reading of generated MIME messages with Python's
# email package (python3, stdlib), run as a child process.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinDispositionWithoutContentType = "enmime/1"
TestHegelPinRFC2231FileNameCharset = "enmime/2"
TestHegelPinBoundaryFollowedByText = "enmime/3"
TestHegelPinEncodedWordLanguageTag = "enmime/4"
TestHegelPinCommentBeforeAddress = "enmime/5"
