# Bugs found in github.com/andybalholm/brotli by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure in
# target.toml. The reference implementation is the brotli command-line tool, 1.1.0.

[[bug]]
id = "brotli/1"
title = "The flate encoder panics on a match longer than 258 bytes, so flate.NewWriter and NewGZIPWriter panic on any input with a long repeat"
kind = "crash"
severity = "high"
test = "TestHegelPinFlateWriterHandlesLongMatches"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
flate.NewWriter(&buf, level).Write(make([]byte, 1000)) panics with "match too long" at every
level from 1 to 9 (and the out-of-range levels the documentation says are clamped); so does
flate.NewGZIPWriter. The matchfinders the writers use (ZFast, ZDFast, ZM, Trio, M4,
Pathfinder) return matches as long as the repeat they find, and DEFLATE's maximum match
length is 258; flate/token.go's lengthCode panics on a longer one instead of the encoder
splitting the match into 258-byte pieces (as the standard library's compress/flate does for
its own matches). Any input with 259 or more equal bytes in a row, or any repeated
259-byte stretch within the window, crashes the writer. The same panic reaches a user of
the matchfinder.Encoder returned by flate.NewEncoder or NewGZIPEncoder directly with a
valid Match of Length > 258. Found by the round-trip property on 260 zero bytes.
"""

[[bug]]
id = "brotli/2"
title = "HTTPCompressor matches Accept-Encoding content codings case-sensitively"
kind = "contract"
severity = "low"
test = "TestHegelPinAcceptEncodingIsCaseInsensitive"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A request with "Accept-Encoding: BR" (or "Br", "GZIP") gets an uncompressed response with
no Content-Encoding: negotiateContentEncoding compares spec.Value == offer exactly. RFC 9110
section 8.4.1 says content-coding values are case-insensitive. Found by the negotiation
property, whose model folds case.
"""

[[bug]]
id = "brotli/3"
title = "HTTPCompressor lets an Accept-Encoding \"*\" override the weight of an explicitly listed coding"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStarDoesNotOverrideAListedCoding"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"Accept-Encoding: br;q=0.5, *" gets a brotli response: negotiateContentEncoding scans every
spec for every offer and takes the highest weight that matches, so the "*" (weight 1) counts
for br as well as for gzip and br wins the tie as the first offer. RFC 9110 section 12.5.3:
the asterisk matches any coding not otherwise listed; br's weight is 0.5 and gzip's 1, so
gzip should be chosen. "br;q=0, *" (br refused, anything else welcome) also gets brotli.
Found by the negotiation property's model.
"""

[[bug]]
id = "brotli/4"
title = "HTTPCompressorWithLevel at level 10 or 11 sends a gzip-only client an uncompressed response"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGzipClientsGetGzipAtEveryLevel"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
HTTPCompressorWithLevel takes brotli's 0-11 scale; for a client accepting only gzip it calls
gzip.NewWriterLevel(w, level), which rejects levels above 9, and the error branch falls
through to an identity response with no Content-Encoding. A server configured for the best
brotli quality silently stops compressing for every gzip client. Found by the negotiation
property (levels drawn from 0-11).
"""

[[bug]]
id = "brotli/5"
title = "M4 takes the last entry of dst for its previous match: distance-0 matches when matches are accumulated across blocks, a panic when the entry's distance is too far"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFindMatchesAppendsWithoutReadingDst"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The MatchFinder interface says FindMatches "looks for matches in src, appends them to dst,
and returns dst". M4 (m4.go:130) looks for a repeat match at the distance of
e.Dst[len(e.Dst)-1] whenever dst is not empty, taking the caller's slice for its own
history, without checking the distance. Every block's match list ends with a literal-only Match
(Length 0, Distance 0), so accumulating the matches of consecutive blocks in one slice
(dst = mf.FindMatches(dst, block)) makes the next block start with a "repeat" at distance
0: M4 on "abcdefghij" after a block without repeats returns {Unmatched:1 Length:9
Distance:0}, a match that copies from itself; a brotli or flate encoder given it writes a
corrupt stream. An entry whose Distance exceeds the position (a match from another stream,
or after Reset) makes M4 index src negatively and panic (slice bounds out of range [-99:]).
matchfinder.Writer always passes w.matches[:0], so the library's own writers are unaffected.
Trio and ZM read the same entry but skip a distance of 0 or one reaching before the buffer,
and verify the bytes, so a stale entry only costs them a spurious repeat candidate. Found by
the LZ77 validity property with a prefilled dst.
"""

[[bug]]
id = "brotli/6"
title = "FastEncoder writes a corrupt stream for a match of length 3, and panics for a match of length 2 or 3 after six or more literals"
kind = "crash"
severity = "medium"
test = "TestHegelPinFastEncoderEncodesShortMatches"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
FastEncoder builds its command Huffman code from fixed histograms seeded once (encoder_fast.go)
rather than from the matches it is given; insert-and-copy codes the seeding leaves at zero
get no code word. Encode(nil, "xccc", [{Unmatched:1 Length:3 Distance:1}], true) returns a
stream the Reader and the reference tool reject (unexpected EOF); with six or more literals
before a length-2 or length-3 match it panics (index out of range [-1]). Brotli copy lengths
start at 2 and the matchfinder.Match contract has no minimum, and brotli.Encoder handles the
same matches. NewWriterV2 level 0 pairs FastEncoder with ZFast, whose matches are longer, so
the library's own writer is unaffected; a matchfinder.Writer pairing FastEncoder with any of
the Bargain finders (which return three-byte matches) writes streams the reference tool
rejects, or panics, on ordinary text, and so does M4 with MinLength 2 or 3 or hand-built
matches. Found by the generated-matches property and, through Bargain1, by the writers
property.
"""

[[bug]]
id = "brotli/7"
title = "Reader.Reset after a stream with trailing bytes leaves the Reader unable to decode the next stream"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinResetAfterTrailingDataRecovers"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Decode a valid stream followed by extra bytes (Read reports "brotli: excessive input"), then
Reset the Reader onto a valid stream: Read fails at once (brotli: PADDING_1 for a 240-byte
text; the error names vary with the streams) and returns nothing. Reset clears the decoder
state only when error_code < 0, an unrecoverable decoder error; excessive input is reported
by Read itself with the decoder in its done state, so the leftover input bytes stay in r.in
and are parsed as the start of the next stream. Reset after a truncated stream, a corrupt
stream or garbage does recover. Reset is documented to make the Reader "equivalent to the
result of its original state from NewReader". Found by the damaged-streams property's
Reset check (every "append" case failed).
"""

[[bug]]
id = "brotli/8"
title = "Trio and ZM leave a block shorter than 20 (16) bytes out of their history, so later matches into earlier data copy from the wrong place: silent corruption through a matchfinder.Writer with one block per Write"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinShortBlocksStayInTheHistory"
found = { commit = "eede31285845c44ddf1e333dfd896bc7d44696ac", version = "v1.2.4", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Trio.FindMatches returns a literal-only match for a block under 20 bytes (trio.go:61), ZM
for one under 16 (zm.go:57), before appending the block to the history buffer the finder
searches and measures distances in. Both may return matches into earlier blocks, so after a
short block every distance reaching past it is short by the block's length. Blocks "Dthe
light rays and ", "the ", "Dthe light rays and the D": the third block's first match is
{Length:20 Distance:20}, which copies "light rays and the " instead of "Dthe light rays and
"; through a matchfinder.Writer with BlockSize 0 (documented: each Write is one block) and
brotli.Encoder the stream decodes without error to "Dthe light rays and the  light rays and
the the D". NewWriterV2 (levels 3 and 4 use ZM and Trio) and flate.NewWriter (levels 3 and
4) set BlockSize 65536 so only their final block can be short, and nothing follows it;
ZFast, ZDFast and M0 have the same early return but append the block first (or find no
cross-block matches), and M4, Pathfinder and the Bargain finders are unaffected. Found by
the LZ77 validity property (a block echoing earlier data after a two-byte block), reduced
by probes to the three-block shape.
"""
