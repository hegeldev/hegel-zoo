name = "brotli"
language = "go"
upstream = "https://github.com/andybalholm/brotli"
subdir = ""
license = "MIT"
# README and LICENSE are the only project documents; nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "eede31285845c44ddf1e333dfd896bc7d44696ac"
date = "2026-09-10"
version = "v1.2.4"

[hegel]
version = "v0.6.33"

[run]
# The brotli command-line tool (1.1.0 here and on the ubuntu runners) is the reference oracle.
setup = ["brotli --version"]
command = "go test -count=1 -run TestHegel -v ."

[expected_failures]
TestHegelPinFlateWriterHandlesLongMatches = "brotli/1"
TestHegelPinAcceptEncodingIsCaseInsensitive = "brotli/2"
TestHegelPinStarDoesNotOverrideAListedCoding = "brotli/3"
TestHegelPinGzipClientsGetGzipAtEveryLevel = "brotli/4"
TestHegelPinFindMatchesAppendsWithoutReadingDst = "brotli/5"
TestHegelPinFastEncoderEncodesShortMatches = "brotli/6"
TestHegelPinResetAfterTrailingDataRecovers = "brotli/7"
TestHegelPinShortBlocksStayInTheHistory = "brotli/8"
