[[bug]]
id = "go-humanize/8"
title = "FormatInteger adds a float64 rounder of 0.5, so from 2^52 odd integers print as the next even one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFormatIntegerNearTwoToTheFiftyTwo"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
FormatInteger(format, n) is FormatFloat(format, float64(n)), and FormatFloat computes
math.Modf(n + 0.5) for precision 0. Every int below 2^53 converts to float64 exactly, but from
2^52 the spacing of float64 is 1, so n + 0.5 is a tie that rounds to even:
`FormatInteger("#,###.", 4503599627370497)` = "4,503,599,627,370,498",
`FormatInteger("#,###.", 9007199254740991)` = "9,007,199,254,740,992" (Comma gives the right
digits). With a non-zero precision the smaller rounder survives up to 2^53. Integers should not
be rounded at all: format them with strconv (Comma does).
'''

