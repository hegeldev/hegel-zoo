[[bug]]
id = "go-humanize/2"
title = "Bytes/IBytes round twice (to two significant digits, then %.0f), so 82.549 MB prints as \"82 MB\" while BytesN(_, 1) and BigBytes say \"83 MB\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBytesRoundsTwice"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "fixed"
fixed_in = "v1.0.1+ (2ccb40ff4026)"
upstream_issue = "https://github.com/dustin/go-humanize/issues/103"
notes = '''
Fixed upstream by 2ccb40ff4026 "Fix #103" (2026-09-17): humanateBytes now picks the number of
decimals from the unrounded mantissa and rounds once. Original notes:
humanateBytes first rounds the mantissa to `minDigits` significant digits with
floor(val*rounding+0.5)/rounding, then prints it with %.Nf where N = minDigits minus the
integer digits — for a mantissa between 10 and 100 that is %.0f, a second rounding. 82.549 is
first rounded to 82.5 (a half, exactly representable), which %.0f rounds to even: "82 MB". The
single-step roundings disagree: `BytesN(82549000, 1)` = "83 MB", `BigBytes(82549000)` = "83
MB"; `IBytes(82.549 MiB)` = "82 MiB" likewise. Any mantissa in (x.45, x.5) with x in 10..99
rounds down this way (about 5% of two-digit outputs between 10 and 100 are off by one in the
last digit when the tail is close to a half).
'''

