# Bugs found in dustin/go-humanize by the Hegel zoo. Oracle: exact arithmetic (math/big) and models.

[[bug]]
id = "go-humanize/1"
title = "A mantissa that rounds up to the base is printed as \"1000 kB\", \"1024 KiB\" or \"1000 kF\" instead of moving to the next unit"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPrintersCarryIntoTheNextUnit"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
humanateBytes picks the unit from floor(log(s)/log(base)) and only then rounds the mantissa
to the requested significant digits, so a mantissa of 999.5 or more (999.999 for three digits)
rounds to 1000 and is printed with the unit below: `Bytes(999999)` = "1000 kB", `BytesN(999500,
3)` = "1000 kB", `IBytes(1048575)` = "1024 KiB", and `BigBytes`/`BigIBytes` do the same through
oomm. SI has the same shape: `SI(999999.9999995, "F")` = "1000 kF" because Ftoa rounds the
mantissa to six decimals after ComputeSI chose the prefix. The value is right, the form is what
the printers exist to avoid ("1.0 MB", "1.0 MiB", "1 MF"); the fix is to re-normalise (or move
to the next unit) after rounding.
'''

