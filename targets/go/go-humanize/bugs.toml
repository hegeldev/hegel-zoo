[[bug]]
id = "go-humanize/9"
title = "BigBytes/BigIBytes round a mantissa truncated to 1/1000 (1/1024), so 1950000001 prints \"1.9 GB\" and 82500001 prints \"82 MB\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBigBytesKeepOnlyTheLastRemainder"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
big.go's oomm divides by the base until the quotient is below it and returns
float64(quotient) + float64(last remainder)/base — the remainders of the earlier divisions
are thrown away, so the mantissa is the exact one truncated to one base-digit. humanateBigBytes
then rounds that with %.1f or %.0f: 1950000001 bytes has mantissa 1.950000001, oomm says 1.950,
%.1f of the float 1.95 (1.9499999...) is "1.9" — `BigBytes(1950000001)` = "1.9 GB" where
"2.0 GB" is right; `BigBytes(82500001)` = "82 MB" (83); `BigIBytes(6080047000000000000000)` =
"5.1 ZiB" for a mantissa of 5.15000013 (5.2). The uint64 printers (Bytes) do not have this
defect (they have go-humanize/2 instead). Using big.Rat for the mantissa, or dividing the
remainder chain properly, fixes it.
'''

