[[bug]]
id = "go-humanize/4"
title = "Commaf(+Inf) is \"+,Inf\" and Commaf(-Inf) is \"-+,Inf\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCommafOfInfinity"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "fixed"
fixed_in = "v1.0.1+ (ca34c6147821)"
notes = '''
Commaf formats with strconv.FormatFloat(v, 'f', -1, 64), which gives "+Inf", and then inserts a
comma every three characters from the right of the integer part: "+,Inf". For -Inf the code
first writes "-" and negates, so the result is "-+,Inf". NaN survives only because "NaN" is
three characters long. The fix is an IsInf check (or return FormatFloat's text unchanged when
it has no digits), as FormatFloat in number.go does.
'''

[[bug.observed]]
version = "v1.0.1+"
commit = "ca34c6147821"
hegel = "v0.6.33"
date = "2026-09-17"
result = "fixed"
[[bug]]
id = "go-humanize/5"
title = "BigCommaf calls v.Abs(v) and so turns a negative argument positive"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBigCommafLeavesItsArgumentAlone"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
commaf.go: `if v.Sign() < 0 { buf.Write([]byte{'-'}); v.Abs(v) }` — big.Float.Abs stores into
its receiver, which is the caller's *big.Float. After `humanize.BigCommaf(x)` a negative x is
positive; a caller formatting a value it goes on to use (a balance, a delta) gets the wrong
sign afterwards. The formatted string is right. `new(big.Float).Abs(v)` fixes it; BigComma
(big.Int) copies first and does not have the problem.
'''

