[[bug]]
id = "go-humanize/3"
title = "ParseBytes multiplies in float64 and truncates, so \"1.007 kB\" is 1006 bytes (ParseBigBytes: 1007), \"16.1 PB\" ends in ...002 and 18446744073709551615 is \"too large\""
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinParseBytesIsExact"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
ParseBytes reads the number with strconv.ParseFloat, multiplies by the unit in float64 and
converts with uint64(f), which truncates: 1.007 is 1.00699999999999989... in binary, times 1000
is 1006.9999999999999 → 1006. `16.1 PB` gives 16100000000000002 (the product rounds up past the
exact value). At the top of the range `18446744073709551615` (math.MaxUint64 itself) and
`18446744073709551000 B` are rejected as "too large" because the float64 rounds to 2^64, which
fails the `f >= math.MaxUint64` check, while `16 EiB` (exactly 2^64, really too large) is
rejected for the right reason only by accident of the same rounding. The sibling ParseBigBytes
does the arithmetic in big.Rat and gets all of these right, so the two parsers disagree on the
same inputs. Same defect as docker/go-units (go-units/2) and the same fix: a decimal
multiplication (big.Rat, or scale the integer and fraction digits separately).
'''

