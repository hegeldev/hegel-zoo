[[bug]]
id = "go-humanize/6"
title = "Outside the quecto..quetta table SI drops the prefix and prints the bare mantissa: SI(1e-31, \"F\") is \"100 F\", SI(1e-33, \"F\") is \"1 F\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSIBeyondThePrefixTable"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "fixed"
fixed_in = "v1.0.1+ (ca34c6147821)"
notes = '''
ComputeSI computes exponent = floor(log10 |x| / 3) * 3, divides x by 10^exponent, and looks the
exponent up in siPrefixTable. For an exponent below -30 or above 30 the lookup yields "" — the
prefix for 10^0 — and SI prints the scaled mantissa with no prefix, wrong by a factor of
10^exponent: 1e-31 F → "100 F", 1e-33 F → "1 F", 1e34 F → "10 F", 1e40 F → "10 F". ParseSI
reads these back as 100, 1, 10 and 10. Either clamp the exponent to the table's ends (so 1e-31
F is "0.1 qF" and 1e34 F is "10000 QF") or fall back to exponent notation; silently dropping
32 orders of magnitude is the one thing the function must not do.
'''

[[bug.observed]]
version = "v1.0.1+"
commit = "ca34c6147821"
hegel = "v0.6.33"
date = "2026-09-17"
result = "fixed"
[[bug]]
id = "go-humanize/7"
title = "FormatFloat converts the integer part with int64(), so from 2^63 it prints -9,223,372,036,854,775,808 (and \"--9,223,...\" for negatives)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFormatFloatBeyondInt64"
found = { commit = "4d1d9082551ec085912e7d2253a33ae547fca000", version = "v1.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "fixed"
fixed_in = "v1.0.1+ (ca34c6147821)"
notes = '''
number.go: `intStr := strconv.FormatInt(int64(intf), 10)`; for intf ≥ 2^63 the conversion is
out of range and Go yields math.MinInt64 on amd64, so `FormatFloat("#,###.", 1e19)` =
"-9,223,372,036,854,775,808", `FormatFloat("#,###.", math.MaxUint64)` the same, and for -1e19
the sign is emitted twice: "--9,223,372,036,854,775,808". The function handles ±Inf and NaN
specially but not the 300 orders of magnitude between 2^63 and MaxFloat64. strconv.FormatFloat
with 'f' and precision 0 (or math/big) gives the digits.
'''

