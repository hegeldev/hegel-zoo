name = "go-udiff"
language = "go"
upstream = "https://github.com/aymanbagabas/go-udiff"
subdir = ""
license = "BSD-3-Clause AND MIT"  # LICENSE-BSD (the Go authors) and LICENSE-MIT; README sends contributions upstream and says nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "a8de762fc44b09108c21d20ac1bbb0619a17b6e6"
date = "2026-07-16"
version = "v0.4.1-6-ga8de762 (after v0.4.1, 2026-07-16)"

[hegel]
version = "v0.9.6"

[run]
# The tests live in hegel/ and apply the package's unified diffs with GNU patch and git apply.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
# The wide properties reach go-udiff/1 (zero-context diffs) in 3-6% of their cases and are
# intermittent at 100 cases; TestHegelApplyUnified fails every run and shrinks to the no-newline
# marker (/3) in most runs, sometimes to a context line (/2); one narrow property per bug draws its
# shape region with random contents and fails every run. HEGEL_NO_KNOWN=1 switches the shapes off.
TestHegelUnifiedApplies = { bug = "go-udiff/1", intermittent = true }
TestHegelArbitraryEdits = { bug = "go-udiff/1", intermittent = true }
TestHegelApplyUnified = "go-udiff/3"
TestHegelZeroContextDiffsApply = "go-udiff/1"
TestHegelApplyUnifiedCopiesContextLines = "go-udiff/2"
TestHegelApplyUnifiedReadsTheNoNewlineMarker = "go-udiff/3"
TestHegelBytesEditsApplyToAnyBytes = "go-udiff/4"
TestHegelPinZeroContextEmptyRange = "go-udiff/1"
TestHegelPinApplyUnifiedContextLines = "go-udiff/2"
TestHegelPinApplyUnifiedNoNewlineMarker = "go-udiff/3"
TestHegelPinBytesNotUTF8 = "go-udiff/4"
