# Bugs found in aymanbagabas/go-udiff by the zoo's Hegel tests (hegel/ in the patch). Each pin
# (test) fails while the bug is open. The package is a copy of golang.org/x/tools/internal/diff
# (its README sends contributions upstream); the references are GNU diff's unified format, GNU
# patch and git apply, and the package's own documentation.

[[bug]]
id = "go-udiff/1"
title = "ToUnified with zero context lines writes a one-line range for a hunk side that has no lines (@@ -2 +2 @@ for a pure deletion), and patch and git apply reject the diff as malformed"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinZeroContextEmptyRange"
found = { commit = "a8de762fc44b09108c21d20ac1bbb0619a17b6e6", version = "v0.4.1-6-ga8de762 (2026-07-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ToUnified("a/f", "b/f", "a\nb\nc\n", Lines(old, "a\nc\n"), 0)` writes `@@ -2 +2 @@` / `-b`; GNU
`diff -U0` writes `@@ -2 +1,0 @@`. In the unified format a range without a count is one line long,
and an empty range is written `N,0` with N the line before it. `unified.String` (unified.go)
special-cases only `FromLine == 1 && fromCount == 0` (the empty file, `-0,0`) and otherwise writes
`-%d`/`+%d` for counts of 0 and 1 alike, so with `contextLines == 0` every hunk that only deletes or
only inserts lines in the middle of a file claims a line it has not got; `patch --fuzz=0` says
"malformed patch" and `git apply --unidiff-zero` "corrupt patch". Symmetric for insertions
(`@@ -2 +2 @@` / `+b` where diff writes `@@ -1,0 +2 @@`). With one or more context lines every
hunk side has at least one line, so `Unified` (three lines) is not affected. Found by the
patch/git apply differential (TestHegelUnifiedApplies with context 0).
'''

[[bug]]
id = "go-udiff/2"
title = "ApplyUnified rejects every context line (unexpected line), so it cannot apply the diffs Unified writes for any file with an unchanged line next to a change"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinApplyUnifiedContextLines"
found = { commit = "a8de762fc44b09108c21d20ac1bbb0619a17b6e6", version = "v0.4.1-6-ga8de762 (2026-07-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ApplyUnified(Unified("a/f", "b/f", "a\nb\nc\n", "a\nB\nc\n"), "a\nb\nc\n")` returns the error
`unexpected line " a"`. In `ApplyUnified` (unified.go) the `case ' '` of the switch on the line's
first byte returns an error instead of copying the line from `before` and advancing `left`, so any
hunk with a context line (which is every hunk `Unified` writes unless the file has no unchanged
line within three of a change) fails. Only diffs of tiny or wholly changed files apply. Found by
the round-trip property TestHegelApplyUnified (2235 of 3000 cases hit it).
'''

[[bug]]
id = "go-udiff/3"
title = "ApplyUnified rejects the No newline at end of file marker that Unified writes for texts without a final newline (invalid unified diff)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinApplyUnifiedNoNewlineMarker"
found = { commit = "a8de762fc44b09108c21d20ac1bbb0619a17b6e6", version = "v0.4.1-6-ga8de762 (2026-07-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ApplyUnified(Unified("a/f", "b/f", "a", "b"), "a")` returns `invalid unified diff: <<...>>`: the
diff has `-a` / `\ No newline at end of file` / `+b` / `\ No newline at end of file`, and the
backslash line falls to the switch's default case. `unified.String` writes the marker whenever a
line has no trailing newline; `ApplyUnified` has no case for it (nor could it represent the missing
newline: it splits and joins on "\n"). Distinct from go-udiff/2: a one-line file has no context
lines and still fails. Found by TestHegelApplyUnified.
'''

[[bug]]
id = "go-udiff/4"
title = "Bytes decodes its inputs as UTF-8, so bytes that are not UTF-8 all read as U+FFFD: different slices give no edits, edits carry the replacement character instead of the bytes of after, and offsets computed from rune lengths run past the end of the slice"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBytesNotUTF8"
found = { commit = "a8de762fc44b09108c21d20ac1bbb0619a17b6e6", version = "v0.4.1-6-ga8de762 (2026-07-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Bytes([]byte("\xff"), []byte("\x80"))` is empty (no edits: the slices differ);
`ApplyBytes([]byte("a\n"), Bytes(before, []byte("\xff\n")))` gives "�\n" (the edit's New is
`string(after[...])` of the decoded runes); `Bytes([]byte("a\xffb\n"), []byte("a\xffc\n"))` is
`[{Start:4,End:5,New:"c"}]` on a 4-byte slice, and `ApplyBytes` fails with "diff has out-of-bounds
edits". `Bytes` (ndiff.go) takes the non-ASCII path through `runes` (utf8.DecodeRune, U+FFFD for
each invalid byte) and `diffRunes` computes byte offsets with `runesLen` (3 bytes for U+FFFD, where
the input had 1). The function documents only that "the resulting edits respect rune boundaries";
`Bytes` is the entry point for arbitrary byte slices, and the natural contract
`ApplyBytes(before, Bytes(before, after)) == after` holds for UTF-8 only. Found by a Bytes round
trip on damaged texts (a probe; the property tests generate UTF-8).
'''
