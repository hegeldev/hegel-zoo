# Bugs found in magiconair/properties by the zoo's Hegel tests (hegel/ in the patch). Each pin
# (test) fails while the bug is open. The reference is java.util.Properties (its javadoc defines
# the format the package says it reads: "Java properties files"), checked with OpenJDK 25.

[[bug]]
id = "properties/1"
title = "A backslash before a line end inside a key does not continue the line: the newline becomes part of the key, where the format joins the lines (a\\ newline b=c is the key ab)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinKeyContinuation"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a\` newline `b=c`: Java loads {ab=c} (the javadoc: "a line terminator ... preceded by an odd number
of backslashes ... the line is continued, and the leading white space of the next line is
discarded", with no restriction to values). properties: {"a\nb": "c"}, and `a\` newline `  b c`
gives {"a\n": "b c"}. `lexKey` (lex.go) sends every backslash to `scanEscapeSequence`, which
appends an unknown escaped character as is; only `lexValue` tests for a line end after the
backslash. Found by the java.util.Properties differential.
'''

[[bug]]
id = "properties/2"
title = "A backslash as the last byte of the input is an error (premature EOF) where the format drops it: a=b followed by a backslash loads as {a=b}"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTrailingBackslashAtEOF"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a=b\` (no final newline): Java's LineReader drops a trailing backslash at end of input and
loads {a=b}; `a\` loads {a=}. properties: "properties: Line 1: premature EOF" from
`scanEscapeSequence` (a file whose last line ends in a continuation, e.g. edited without a
final newline, does not load). Found by the java.util.Properties differential.
'''

[[bug]]
id = "properties/3"
title = "A line beginning with the separator (=v or :v) is a parse error where the format gives it the empty key"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyKey"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`=v`: Java loads {=v} (key "", value "v"; the javadoc's grammar has the key end at the first
unescaped separator, so it may be empty). properties: `properties: Line 1: "v"`: `lexKey` emits no
key item when it has scanned no runes, `lexValue` then emits a value, and the parser, expecting a
key, fails. Found by the java.util.Properties differential.
'''

[[bug]]
id = "properties/4"
title = "A continuation before CR LF joins only the CR: the LF is then a line end of its own, so the next line is not appended to the value but read as a new key"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCRLFContinuation"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a=b\` CR LF `c`: Java treats CR LF as one line terminator and loads {a=bc}. properties: `lexValue`
sees the backslash, consumes one rune (the CR), skips whitespace (LF is not whitespace) and emits
the value "b" at the LF; then "c" is a key: {a=b, c=}. Every value continuation in a file with
Windows line ends breaks in this way. Found by the java.util.Properties differential.
'''

[[bug]]
id = "properties/5"
title = "Two \\u literals forming a UTF-16 surrogate pair decode to two U+FFFD instead of the supplementary character (k=\\uD83D\\uDE00 is the grinning face in Java)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSurrogatePair"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`k=\uD83D\uDE00`: Java loads the value U+1F600 (the grinning face) (the \u literal is a UTF-16 code unit, and Java's
store writes supplementary characters this way in its default encoding). properties: `scanUnicodeLiteral`
appends `rune(0xD83D)` and `rune(0xDE00)` separately; each is an invalid rune, spelled U+FFFD when
the runes become a string, so the value is two replacement characters. Found by the
java.util.Properties differential.
'''

[[bug]]
id = "properties/6"
title = "Write does not escape a leading # or ! of a key, so the line is a comment when the output is read back, by Java or by the package itself"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinWriteEscapesCommentMarkers"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Write` of {"!a": "v"} produces `!a = v`, which loads as an empty map (a comment line) in Java and
in properties; `{"#b": "v"}` likewise. Java's store writes `\!a=v`. `WriteComment` (properties.go)
encodes the key with the special set " :=" only. Found by the Write-then-Java-load property.
'''

[[bug]]
id = "properties/7"
title = "Write with ISO_8859_1 emits characters U+0080-U+00FF as their UTF-8 bytes instead of the Latin-1 byte, so an ISO-8859-1 reader (Java, or Load with ISO_8859_1) gets two characters per accented letter"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinWriteISOLatin1"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Write(w, ISO_8859_1)` of {"é": "ü"} produces the bytes C3 A9 20 3D 20 C3 BC 0A (UTF-8) rather than
E9 20 3D 20 FC 0A; Java reading it as ISO-8859-1 gets {Ã©=Ã¼}, and so does the package's own
`Load(..., ISO_8859_1)`. `encodeIso` (properties.go) handles `r < 1<<8` with `escape(r, special)`,
which returns `string(r)`, the UTF-8 spelling; only runes 256-65535 are written as \uXXXX. Found by
the Write-then-Java-load property (ISO-8859-1 variant).
'''

[[bug]]
id = "properties/8"
title = "Write with ISO_8859_1 emits a leading Unicode whitespace character above U+00FF (U+2028, U+3000, ...) raw, as UTF-8 bytes, instead of the \\uXXXX literal used for other such characters"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinWriteISOLeadingUnicodeSpace"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Write(w, ISO_8859_1)` of {"k": U+2028 "x"} (the value begins with the line separator character)
produces `k = ` followed by the three UTF-8 bytes of U+2028 rather than `k = \u2028x`; the same
character not at the start ({"k": "x" U+2028}) is written as `\u2028`. In `encodeIso` the
`pos == 0 && unicode.IsSpace(r)` case comes before the range cases, and `escape(r, " ")` writes any
rune other than a space as `string(r)`. Reading back as ISO-8859-1 gives three characters. Distinct
from properties/7 (a different branch; U+2028 is outside Latin-1). Found by the
Write-then-Java-load property.
'''

[[bug]]
id = "properties/9"
title = "A continuation between the key and the separator puts the separator into the value: a, space, backslash, newline, = v loads as {a== v} where the format gives {a=v}"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSeparatorAfterContinuation"
found = { commit = "7bc746f67ddc32a90a2154f393e4b27750e678c3", version = "untagged (2026-09-16)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a \` newline `= v`: Java first joins the physical lines into the logical line `a = v` and loads
{a=v}; `a \` newline `  :` loads {a=}. properties: `lexBeforeValue` consumes the whitespace and looks
for the separator before the continuation is processed (continuations are handled inside `lexValue`),
so the `=` after the continuation is the first character of the value: {"a": "= v"} and
{"a": ":"}. Found by the java.util.Properties differential (with the key-continuation shape of
properties/1 excluded from the generator).
'''
