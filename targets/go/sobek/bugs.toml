[[bug]]
id = "sobek/39"
title = "a character class of surrogates inside a lookahead or lookbehind never matches"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSurrogateClassInLookaround"
found = { commit = "8a431c44cd7b20d5e667787baf7ea9a57568da57", version = "main (untagged), 2026-09-15", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Present in goja at 793a2a6 too (goja/39). `'\uDE00'.replace(/(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '?')` is "?" in node: without the u flag
a regexp works on code units, the lone low surrogate is in the class and nothing precedes it. sobek
leaves the string alone: the class of high surrogates inside the negative lookbehind is what
fails, since `(?<!x)[\uDC00-\uDFFF]` does replace it. The other way round too:
`'\u{1F600}'.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, '?')` is the emoji unchanged in node (the
high surrogate is followed by a low one, so the negative lookahead fails) and "?\ude00" in sobek,
which replaced the high half. A surrogate range in a character class matches on its own (`/[\uD800-
\uDBFF]/.test('\u{1F600}')` is true in both) and `.` and captures split the pair into two code units
as they should; it is the class inside a lookaround, the pattern shape that goes to the regexp2
engine rather than Go's, that never matches a surrogate. Found while writing a JSON replacer for the
harness that scrubs lone surrogates. Pin: TestHegelPinSurrogateClassInLookaround.
'''
