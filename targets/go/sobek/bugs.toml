[[bug]]
id = "sobek/33"
title = "a break or continue in the never-taken branch of a constant if, inside a try inside a for-in or for-of loop, makes the VM pop an empty iterator stack when the try catches"
kind = "crash"
severity = "high"
test = "TestHegelPinDeadBranchJump"
found = { commit = "8a431c44cd7b20d5e667787baf7ea9a57568da57", version = "main (untagged), 2026-09-15", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Present in goja at 793a2a6 too (goja/33). `for (const k in [1]) { try { if (true) {} else { class C {} break; } throw 1; } catch (e) {} }
return 1;` returns 1 in node. sobek dies with a Go panic, `runtime error: index out of range [-1]`,
in _enumPopClose.exec called from the VM's exception handling (vm.go: handleThrow, runTryInner):
when the try catches the exception, the VM runs the loop's enumPopClose on an empty iterator stack.
The never-taken branch of an `if` with a constant condition (`if (true) {} else {...}` or
`if (false) {...}`) must hold a `break` or `continue` together with a class declaration
(`class C {}`), a read of the loop variable (`const v = 1 + k`) or a nested `if (Boolean(true))
break` after a `const`; the branch must sit in a `try` whose body then throws and is caught, and
the loop must be a for-in or a for-of (`while (true)` is fine, as are `const v = 1; break;`,
`let v = {}; break;` and `[].push(1); break;` in the branch, the branch without the jump, and
the jump without the try). Spread over several lines under an outer `try` the same shape is a
SyntaxError at compile time instead. A relative of sobek/19 (constant-condition jumps in a for-of
that break the compiler). Found by the generated programs (an `if (true) {} else { const v11 =
{}; if (Boolean(true)) break; }` inside a try inside a for-in). Pin: TestHegelPinDeadBranchJump.
'''

