'''

[[bug]]
id = "sobek/19"
title = "continue or break under a constant-false condition in a for loop with a let/const binding panics the compiler (index out of range), or makes it loop forever"
kind = "crash"
severity = "high"
test = "TestHegelPinConstantContinue"
found = { commit = "8a431c44cd7b20d5e667787baf7ea9a57568da57", version = "main (untagged), 2026-09-15", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`for (const a of 'x') { if (false) continue; }` panics the Go process while compiling:
"runtime error: index out of range [-1]" (a for-in loop or `if (false) break;` likewise;
`for (let i = 0; i < 1; i++) { if (false) continue; }` gives "index out of range [0] with
length 0"). Any condition the compiler folds to false does it: `1 > 2`, `!true`, `null`, `''`.
With the constant continue inside a while loop inside such a for loop
(`for (const a of 'x') { while (a) { if (false) break; } }`) the compiler never returns.
Wrapped in a block (`if (false) { for (const b of a) { { let c; } if (false) continue; } }`) the
same shape is a SyntaxError "Compiler bug: Unsupported instruction for binding: sobek.jump". A
loop with a var binding, or a non-constant condition, is fine. Inside a function body the plain
form compiles; the nested one is the "Compiler bug" SyntaxError there too. Pin:
TestHegelPinConstantContinue (the SyntaxError inside a function; the hang cannot be pinned).
'''

