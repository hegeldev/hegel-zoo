[[bug]]
id = "sobek/28"
title = "String.prototype.replaceAll with an empty search string on a string holding a non-ASCII character never returns and eats memory until the process dies"
kind = "crash"
severity = "high"
test = "TestHegelPinReplaceAllEmptyUnicode"
found = { commit = "8a431c44cd7b20d5e667787baf7ea9a57568da57", version = "main (untagged), 2026-09-15", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`'\u00e9'.replaceAll('', '-')` is "-é-" in node (an empty search string matches at every
position, 0 to length). In sobek the same call, on any string holding a character outside ASCII,
never returns: stringproto_replaceAll walks the matches with `pos = s.index(searchStr,
pos+advanceBy)` until it is -1, and unicodeString.index clamps a start past the end of the string
(`s[min(1+start, len(s)):]`) and reports the empty needle found there, at `start` itself, so pos
grows for ever and the `found` slice with it, until the Go runtime dies with `fatal error: out of
memory` (a fatal error, not a panic: no recover catches it, the whole process is gone; under
`ulimit -v 2000000` the CLI dies within a second). asciiString.index returns -1 for a start past
the end, so `'abc'.replaceAll('', '-')` is "-a-b-c-" as it should be; `indexOf`/`includes`/
`startsWith` clamp their position argument before calling index and are fine, as are `replace`
(one match) and `split('')`. Found by the generated programs (`'\u212B'.replaceAll(\`\`, 'X')`),
once in 20000 cases, in the fork's rounds first; present in goja at 793a2a6 too (goja/28).
Pin: TestHegelPinReplaceAllEmptyUnicode, which runs the shape in a child process (the
test binary again, with its address space capped at 2 GB) and fails on the child's death.
'''

