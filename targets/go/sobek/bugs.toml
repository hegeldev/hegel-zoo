[[bug]]
id = "sobek/21"
title = "relational operators associate to the right: 3 > 2 > 1 is true and 1 in {} in {} throws a TypeError"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRelationalChain"
found = { commit = "8a431c44cd7b20d5e667787baf7ea9a57568da57", version = "main (untagged), 2026-09-15", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RelationalExpression is left-associative: `3 > 2 > 1` is `(3 > 2) > 1`, false; sobek gives true
(`3 > (2 > 1)`). Likewise `1 < 2 < 3` is false instead of true, `1 < 2 > 0` false instead of
true, `2 > 1 in {}` true instead of false, and `1 in {} in {}`, `'a' in {} in {'false': 1}`,
`[] instanceof Array instanceof Boolean` and `1 in {} > 0` throw a TypeError (the right-hand
`{} in {}` or `Array instanceof Boolean` is evaluated first and the outer `in`/`instanceof`
gets a boolean). Equality chains (`1 == 1 == 1`) are right. Pin: TestHegelPinRelationalChain.
'''

[[bug]]
id = "sobek/22"
title = "without the u flag, the i flag uses Unicode case folding: the Kelvin sign matches k, the long s matches s, the capital sharp s matches sharp s"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinASCIICaseFold"
found = { commit = "8a431c44cd7b20d5e667787baf7ea9a57568da57", version = "main (untagged), 2026-09-15", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Canonicalize without the u flag (22.2.2.7.3) upper-cases a character and keeps it unchanged if
the result is more than one character or if a non-ASCII character would turn into an ASCII one,
so `/\u212A/i.test('k')` (the Kelvin sign), `/k/i.test('\u212A')`, `/[a-z]/i.test('\u212A')`,
`/\u017F/i.test('s')` (the long s), `/s/i.test('\u017F')`, `/\u1E9E/i.test('\u00DF')` (the
capital sharp s) and `/\u212B/i.test('\u00E5')` (the Angstrom sign) are all false in node;
sobek gives true, as if folding with the u flag (where those are true in both engines).
`/[\s\S]()\u0130/ig.test('undefined')` is true in sobek and false in node, which turned the
destructuring of a null match into a result in a generated program. Pin:
TestHegelPinASCIICaseFold.
'''

