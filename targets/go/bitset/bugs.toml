# Bugs found in github.com/bits-and-blooms/bitset by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure in
# target.toml. The oracle is a []bool model of the documented semantics.

[[bug]]
id = "bitset/1"
title = "PreviousSet and PreviousClear answer \"not found\" for an index beyond the last allocated word, whatever bits are set"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPreviousSetLooksBackFromAnyIndex"
found = { commit = "828abff685deae97e60d299b1cdfcefabfeb44dc", version = "v1.25.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
b := New(8); b.Set(3); b.PreviousSet(100) returns (0, false) while PreviousSet(50) returns
(3, true): both start with x := i >> 6 and give up when x >= len(b.set) instead of clamping
to the last word. PreviousSet is documented as "the previous set bit from the specified
index, including possibly the current index"; an index past the end of the set has set bits
below it. PreviousClear(1000) on a 200-bit set with clear bits likewise returns false. Found
by the navigation checks of the single-set property (random indices up to Len+80).
"""

[[bug]]
id = "bitset/2"
title = "PreviousClear reports positions at or beyond Len as clear bits, and \"found\" on a full set"
kind = "contract"
severity = "low"
test = "TestHegelPinPreviousClearStaysWithinTheLength"
found = { commit = "828abff685deae97e60d299b1cdfcefabfeb44dc", version = "v1.25.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
b := New(8); b.Set(3); b.PreviousClear(50) returns (50, true): position 50 is beyond the
8-bit length (Test(50) is false because it does not exist, not because it is clear), and
NextClear bounds its answers by the length ("index < b.length"). On a full 8-bit set
PreviousClear(50) still returns (50, true) although the documentation says false means "no
clear bit found i.e. all bits are set". The padding bits of the last word are being read
as members of the set. Found by the navigation checks of the single-set property.
"""

[[bug]]
id = "bitset/3"
title = "InPlaceIntersection extends the receiver to the other set's length while Intersection keeps the shorter, so the two results are not Equal"
kind = "contract"
severity = "low"
test = "TestHegelPinInPlaceIntersectionEqualsIntersection"
found = { commit = "828abff685deae97e60d299b1cdfcefabfeb44dc", version = "v1.25.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
a := New(10); c := New(200); a.Intersection(c).Len() is 10 but a.Clone() after
InPlaceIntersection(c) has Len 200 (the method ends with extendSet(compare.length-1)), and
Equal, which compares lengths first, says the two are different. Union, Difference and
SymmetricDifference agree with their in-place forms. Found by the two-set property, which
expects InPlaceX to equal X.
"""

[[bug]]
id = "bitset/4"
title = "Copy clears the destination's bits between the source's length and the end of the source's last word"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCopyLeavesTheRestOfTheDestination"
found = { commit = "828abff685deae97e60d299b1cdfcefabfeb44dc", version = "v1.25.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
src := New(5); src.Set(1); dst := New(100); dst.SetAll(); src.Copy(dst) returns 5, the
documented "minimum of the number of bits in the current BitSet (Len()) and the
destination", but the destination ends with 37 bits set instead of 96: Copy does
copy(c.set, b.set) word by word, so bits 5-63 of the destination take the source's padding
zeros. The documentation promises "Go array copy semantics" on bits. Found by the two-set
property's Copy step.
"""

[[bug]]
id = "bitset/5"
title = "ExtractTo does not extend the destination when the source has no words"
kind = "contract"
severity = "low"
test = "TestHegelPinExtractToExtendsForAnEmptySource"
found = { commit = "828abff685deae97e60d299b1cdfcefabfeb44dc", version = "v1.25.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
ExtractTo returns early "if len(mask.set) == 0 || len(b.set) == 0" before the step that
extends dst to hold popcount(mask) bits, so a zero-value (or length 0) source with an
8-bit mask leaves a 3-bit destination at Len 3, while Extract with the same arguments
returns a set of Len 8. "The number of set bits in mask determines the number of bits that
will be extracted" whatever the source holds. Found by the Extract/Deposit property.
"""

[[bug]]
id = "bitset/6"
title = "DepositTo leaves mask positions unchanged, instead of clearing them, once the source's words are exhausted"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDepositToClearsBeyondTheSource"
found = { commit = "828abff685deae97e60d299b1cdfcefabfeb44dc", version = "v1.25.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A 3-bit source (one word), a mask with 70 positions and a full destination: DepositTo places
source bits 0-63 at the first 64 mask positions, then hits "if wordIdx >= len(b.set) { break }"
and leaves mask positions 64-69 set, although source bits 64-69 are clear (Test says so).
The result depends on the destination's previous content only for those positions, which
the documentation does not say; Deposit (fresh destination) is unaffected. Found by the
Extract/Deposit property's DepositTo step into a destination with bits of its own.
"""

[[bug]]
id = "bitset/7"
title = "ReadFrom and UnmarshalBinary allocate for whatever length the header claims: an 8-byte input panics (makeslice: len out of range) or asks for gigabytes instead of returning an error"
kind = "crash"
severity = "medium"
test = "TestHegelPinReadFromRejectsAnImpossibleLength"
found = { commit = "828abff685deae97e60d299b1cdfcefabfeb44dc", version = "v1.25.0+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
UnmarshalBinary of the eight bytes 40 00 00 00 00 00 00 00 (length 1<<62, no words) panics
with "runtime error: makeslice: len out of range": ReadFrom reads the length, computes the
words needed and calls make([]uint64, nWords) before reading a single word. A header
claiming 1<<40 bits would allocate 128 GiB (or be killed) for a 16-byte input; a length of
2^64-1 panics the same way. The documentation promises that "in case of error, the BitSet
is either left unchanged or made empty", and the package ships a SECURITY.md. Reading the
words with a bounded buffer, or checking the length against what the stream can supply
(io.LimitReader/bytes.Reader.Len when available), would turn this into an error. Found by
a probe following the serialization property's damaged-input checks; the property asserts
an error for such headers once the Known switch is off.
"""
