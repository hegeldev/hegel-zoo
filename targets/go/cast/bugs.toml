# Bugs found in spf13/cast by the Hegel zoo. Oracle: cast's own contract (README and doc
# comments) made concrete by value/range models, strconv and time.Parse, and round trips.

[[bug]]
id = "cast/1"
title = "Numeric inputs out of the target's range wrap or turn into garbage instead of failing (int 300 → int8 44, NaN → MinInt64, 1e40 → float32 +Inf)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinOutOfRangeNumbersAreErrors"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
toNumber / toUnsignedNumber convert every numeric input with a plain Go conversion `T(s)`:
ToInt8E(300) = 44, ToUint8E(uint16(256)) = 0, ToInt64E(uint64(MaxUint64)) = -1,
ToInt64E(1e20) = ToIntE(math.NaN()) = -9223372036854775808, ToFloat32E(1e40) = +Inf, all with
a nil error, and the plain variants return the same values instead of the documented zero.
Only negative values into unsigned types are checked (errNegativeNotAllowed). The README
promises the zero value and an error "if input is provided that will not convert to that
type". ToTimeE(uint64(1<<63)) is the same conversion: a negative Unix time.
'''

[[bug]]
id = "cast/2"
title = "Decimal strings are parsed as 64-bit integers and truncated to the target: \"300\" → int8 44, \"256\" → uint8 0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinOutOfRangeStringsAreErrors"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parseInt / parseUint call strconv.ParseInt(s, 0, 0) / ParseUint (bitSize 0 = 64 bits) and
then convert with `T(v)`, so ToInt8E("300") = 44, ToUint8E("256") = 0 and
ToInt32E(json.Number("4294967297")) = 1 without error, where strconv.ParseInt(s, 10, 8)
reports a range error. The string path of cast/1; the fix is passing the target's bit size.
'''

[[bug]]
id = "cast/3"
title = "Strings are parsed with base 0: a leading zero means octal, so \"010\" is 8 and \"08\" is an error"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLeadingZerosAreDecimal"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parseInt / parseUint use strconv.ParseInt(s, 0, …), Go literal syntax: ToIntE("010") = 8,
ToIntE("08") and ToUintE("09") are "invalid syntax" errors (0 from the plain variants),
"0x1f", "0b11", "0o17" and "1_000" are accepted. Zero-padded numbers ("08" for a month or
day, "007") are common in the YAML/TOML/JSON front matter the library was written for, and
the README says a string converts to an int only when it is "a string representation of an
int such as 8". The float path (strconv.ParseFloat) reads "010" as 10, so ToFloat64("010") and
ToInt("010") disagree.
'''

[[bug]]
id = "cast/4"
title = "\".\", \"-.\" and \"+.\" convert to 0 without error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBareDotIsNotANumber"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
trimDecimal matches `^([-+]?\d*)(\.\d*)?$`, takes the integer part and maps "", "-" and "+"
to "0", "-0" and "+0", so a bare dot (with or without a sign) is 0 for every integer
conversion. strconv.ParseFloat rejects it, so ToFloat64E(".") is an error while ToIntE(".")
is 0. Found by the malformed-text property.
'''

[[bug]]
id = "cast/5"
title = "A RubyDate string with an offset of ±00:00..±00:23 is parsed by the UnixDate layout and re-read in the default location: \"… +0000 2006\" with a CET default is an hour early"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRubyDateKeepsItsOffset"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
internal.TimeFormats lists time.UnixDate ("Mon Jan _2 15:04:05 MST 2006", "named timezone")
before time.RubyDate ("Mon Jan 02 15:04:05 -0700 2006", "numeric timezone"), and Go's
time.Parse accepts "+0000".."+0023" (and "-…") in a zone-name slot (parseSignedOffset allows
up to 23). A RubyDate string with such an offset — "+0000", i.e. UTC, is exactly what Ruby
and Twitter emit — is therefore claimed by UnixDate, and ParseDateWith then rebuilds the
wall clock in the default location: ToTimeInDefaultLocationE("Mon Jan 02 15:04:05 +0000
2006", CET) = 15:04:05+01:00 instead of 15:04:05Z; ToTimeE (UTC default) is right only
because the offset happens to be zero, and "+0005" is wrong everywhere. Offsets of an hour
or more make Parse fail on UnixDate and fall through to RubyDate correctly. Swapping the
two entries (numeric layouts first, as RFC1123Z/RFC1123 and RFC822Z/RFC822 already are)
fixes it. Found by the layout round-trip property.
'''

[[bug]]
id = "cast/6"
title = "ToBoolE of a json.Number goes through the integer path: \"0.5\" is false and \"1e3\" is an error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinJSONNumberBoolIsNonZero"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
ToBoolE(json.Number) calls ToInt64E, whose decimal trimming makes "0.5" → 0 → false, while
ToBoolE(0.5) is true; "1e3" (a valid JSON number, 1000) fails the integer parse and is an
error. Reading the number as a float64 first would match every other numeric kind.
'''

[[bug]]
id = "cast/7"
title = "Map conversions from map[string]any / map[any]any swallow value errors: ToStringMapIntE(map[string]any{\"a\": \"x\"}) = {a: 0}, nil"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMapValuesReportErrors"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
toMapE and toStringMapIntE convert the values of map[string]any and map[any]any inputs with
the plain functions (ToInt, ToBool, ToString), so an unconvertible value becomes the zero
value and the E variant returns nil — ToStringMapIntE(map[string]any{"a": "x"}) = {a: 0},
ToStringMapBoolE(map[string]any{"a": "maybe"}) = {a: false}, ToStringMapStringE(map[string]
any{"a": struct{}{}}) = {a: ""}. The reflect fallback of toStringMapIntE (used for other map
kinds such as map[string]string) uses ToIntE and does report the error, so the same data
succeeds or fails depending on the Go map type it arrives in. The README says the E
variants "tell you if it successfully converted".
'''

[[bug]]
id = "cast/8"
title = "ToStringMapStringSliceE splits string values on white space for map[any]string and map[any]any, but not for map[string]string and map[string]any"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringSliceMapValuesAreNotSplit"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The map[string]string and map[string]any cases wrap a string value as []string{val}; the
map[any]string and map[any]any cases call ToStringSlice(val), which is strings.Fields for a
string: {"a": "x y"} gives ["x y"] from the former and ["x", "y"] from the latter. YAML
decoders produce map[any]any (yaml.v2) or map[string]any (yaml.v3) for the same document.
'''

[[bug]]
id = "cast/9"
title = "ToTimeE rejects int8, int16, uint8, uint16, floats and named integer types as Unix seconds while accepting int, int32, int64, uint, uint32, uint64"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEveryIntegerKindIsUnixSeconds"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
ToTimeInDefaultLocationE lists six integer kinds by hand and has no resolveAlias step, so
ToTimeE(int8(5)), ToTimeE(uint16(5)), ToTimeE(myInt(5)) and ToTimeE(5.0) are "unable to
cast" while ToTimeE(5) is 1970-01-01T00:00:05Z; every other conversion in the package
accepts all integer widths and named types (ToDurationE uses ToInt64E for exactly this).
'''

[[bug]]
id = "cast/10"
title = "Unsigned conversions accept any number of leading '+' signs: ToUintE(\"++5\") = 5"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDoublePlusIsRejected"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parseUint strips the sign with strings.TrimLeft(s, "+"), which removes every leading plus,
so "++5" and "+++5" are 5; ToIntE("++5") and strconv reject them.
'''

[[bug]]
id = "cast/11"
title = "ToStringMapIntE / ToStringMapInt64E panic (reflect.Value.SetMapIndex) on maps with non-string keys that reach the reflect path, e.g. map[any]string or map[int]int"
kind = "panic"
severity = "medium"
test = "TestHegelPinIntegerMapsWithOtherKeysDoNotPanic"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
toStringMapIntE handles map[string]T, map[string]any, map[any]T and map[any]any by type
switch and every other map kind through reflection, but the reflect loop calls
`mVal.SetMapIndex(keyVal, …)` with the input's original key value instead of ToString(key):
ToStringMapInt64E(map[any]string{"a": "1"}) panics with "reflect.Value.SetMapIndex: value of
type interface {} is not assignable to type string", and ToStringMapIntE(map[int]int{7: 1})
with "value of type int is not assignable to type string". A library whose README opens
with "Don't Panic!" panics on a map[any]string (what yaml.v2 decodes) handed to
ToStringMapInt64. Found by the map property's first run.
'''

[[bug]]
id = "cast/12"
title = "ToStringMapE, ToStringMapStringE and ToStringMapBoolE refuse maps of other value types (map[string]string → ToStringMapE, map[string]int → ToStringMapStringE) although ToStringMapIntE converts any map"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringMapsAcceptAnyMap"
found = { commit = "d8e892d16caba3fc13f781dcf4b3f4dd8976999c", version = "v1.9.2+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
toMapE accepts map[K]V, map[K]any, map[any]V, map[any]any and a JSON string and calls
everything else "unable to cast": ToStringMapE(map[string]string{"a": "1"}),
ToStringMapStringE(map[string]int{"a": 1}) and ToStringMapBoolE(map[string]int{"a": 1}) all
fail, while the element conversions exist and toStringMapIntE has a reflect fallback for
exactly this. The inconsistency is historical (the four fixed cases predate the reflect
fallback); recorded because the same YAML/TOML data succeeds or fails on the map type the
decoder happened to pick.
'''
