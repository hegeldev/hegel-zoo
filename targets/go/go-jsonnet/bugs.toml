kind = "wrong-result"
severity = "low"
test = "TestHegelPinFormatIdempotent"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
formatter.Format with the default options turns `(((1e3)))` into `((1e3))`, that into `(1e3)`, and only the third run into `1e3`: the StripParens pass removes one nesting level per invocation, while a formatter is expected to reach a fixed point in one run (the formatter's own tests check idempotence on their inputs). Found by TestHegelFormatPreservesMeaning.
