# Bugs found in google/go-jsonnet (v0.22.0) by the Hegel zoo. One [[bug]] per finding; `test`
# names the plain Go test in hegel_pins_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracle: the C++ implementation, jsonnet 0.22.0 (the same
# version) through the Python `jsonnet` package as a child process, evaluating the same programs:
# the same JSON output, or failure on both sides with the same kind of error. go-jsonnet's readme
# states the goal (a feature-complete implementation passing the C++ test suites), so every
# divergence in output or in accepting a program is recorded, with the C++ implementation's
# behaviour as the reference; error messages are not compared. The C++ implementation's own
# quirks (`$` unbound inside a comprehension at top level, an object literal inside a computed
# field name of a `+:` field losing `self`, NUL bytes in strings, `!!str` YAML tags ignored, the
# Go-only sha* functions) are not judged. No AI policy (checked 2026-09-19).

[[bug]]
id = "go-jsonnet/1"
title = "std.parseInt accepts a leading plus: std.parseInt(+3) is 3, the C++ implementation rejects it"
kind = "contract"
severity = "low"
test = "TestHegelPinParseIntPlus"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.parseInt("+3")` evaluates to 3 in go-jsonnet; jsonnet 0.22.0: RUNTIME ERROR: +3 is not a base 10 integer (the documentation says the function parses a signed decimal integer, and the C++ implementation takes only a minus). parseOctal and parseHex reject the plus on both sides. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/2"
title = "std.parseInt(-0) is 0, not -0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinParseIntNegativeZero"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.parseInt("-0")` (and `"-00"`) manifests as `0` in go-jsonnet and as `-0` in the C++ implementation, which keeps the sign of the parsed zero as the literal `-0` does on both sides. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/3"
title = "std.makeArray accepts a negative size, giving [], and rejects a fractional one"
kind = "contract"
severity = "low"
test = "TestHegelPinMakeArrayNegativeSize"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.makeArray(-1, function(i) i)` is `[ ]` in go-jsonnet; jsonnet 0.22.0: RUNTIME ERROR: makeArray requires size >= 0, got -1. `std.repeat("a", -1)` likewise is `""` in go-jsonnet and the same error in C++ (repeat is built on makeArray). Conversely `std.makeArray(2.5, function(i) i)` is rejected by go-jsonnet (Expected an integer, but got 2.5) and is `[0, 1]` in the C++ implementation. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/4"
title = "std.makeArray accepts a function with optional extra parameters, the C++ implementation requires exactly one"
kind = "contract"
severity = "low"
test = "TestHegelPinMakeArrayFunctionArity"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.makeArray(2, function(a, b=1) a + b)` is `[1, 2]` in go-jsonnet; jsonnet 0.22.0: RUNTIME ERROR: makeArray function must take 1 param, got: 2 (it checks the parameter count before calling). A function of two required parameters fails on both sides (go-jsonnet: Missing argument: b). Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/5"
title = "std.xor and std.xnor reject non-boolean arguments that the C++ implementation compares"
kind = "contract"
severity = "low"
test = "TestHegelPinXorNonBoolean"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.xor(1, 2)` is `true` and `std.xnor(null, null)` is `true` in jsonnet 0.22.0 (the std.jsonnet definitions compare the arguments with !=); go-jsonnet's native builtins fail with RUNTIME ERROR: Unexpected type number, expected boolean. The documentation describes the arguments as booleans, so this is a divergence on inputs outside the contract, recorded because go-jsonnet aims at passing the C++ implementation's behaviour bit for bit. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/6"
title = "std.manifestYamlDoc and std.manifestYamlStream manifest a function value as nothing instead of failing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinManifestYamlFunction"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.manifestYamlDoc({a: function() 1})` evaluates to the string `"a": ` (an empty value after the key), `std.manifestYamlDoc(function(x) x)` to the empty string and `std.manifestYamlStream([function() 1])` to `---\n\n...\n`; jsonnet 0.22.0: RUNTIME ERROR: Tried to manifest function at ["a"]. The JSON, Python, TOML and INI manifesters fail on both sides. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/7"
title = "A field separator other than a single colon glued to a following operator character does not parse: {a:::-1}, {a::$.x}, {a+::!true}"
kind = "contract"
severity = "medium"
test = "TestHegelPinSeparatorGluedToOperator"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The lexer takes the longest run of operator characters, so `:::-`, `::$`, `+::!`, `::~`, `::+` become one token and the parser reports Not a unary operator: : (or Expected one of :, ::, :::, +:, +::, +:::, got: +). The C++ lexer stops an operator run before a `$` and does not glue a run beginning with `:` to a unary operator, so `{a:::-1}` is `{"a": -1}`, `{a::$.x, x: 1}` loads and `{a+::!true}` too; `{a:-1}`, `{a:$.x}` and `{a:!true}` parse in go-jsonnet as well, only the two- and three-colon and `+:` forms fail. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/8"
title = "std.manifestJson, manifestJsonEx, manifestJsonMinified, manifestYamlDoc and manifestYamlStream format numbers in the shortest form, not %.17g"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinManifestJsonNumberFormat"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.manifestJson(0.1 + 0.7)` is the string `0.7999999999999999` in go-jsonnet and `0.79999999999999993` in jsonnet 0.22.0; `std.manifestYamlDoc(1e-7)` is `0.0000001` against `9.9999999999999995e-08`, and integers beyond 2^53 are rounded to their shortest digits (`std.manifestJson(1e23)`: `100000000000000000000000` against the exact `99999999999999991611392`). The top-level output, std.toString, string concatenation, %-formatting and the Python, TOML and INI manifesters use %.17g on both sides; the native Go implementations of the JSON and YAML manifesters use the shortest round-trip form, so the same value prints differently depending on how it reaches the output. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/9"
title = "std.length of a function counts only the required parameters: std.length(function(a, b=null) a) is 1, not 2"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFunctionLength"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The C++ implementation counts every parameter of a function (`std.length(function(a, b=null) a)` is 2, `std.length(std.get)` is 4, matching the documentation: the number of parameters); go-jsonnet counts the required ones (1 and 2). Functions without default parameters agree. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/10"
title = "std.reverse, sort, set, removeAt, minArray, maxArray and sum reject a string that the C++ implementation treats as an array of characters"
kind = "contract"
severity = "low"
test = "TestHegelPinStringAsArray"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.reverse("abc")` is `["c", "b", "a"]` in jsonnet 0.22.0 (its std.jsonnet definitions index the argument like an array, and `std.length`/indexing work on strings), likewise `std.sort("cba")`, `std.set("bab")`, `std.removeAt("abc", 1)` (`["a", "c"]`), `std.minArray("ba")` (`"a"`) and `std.sum("12")` (`"012"`); go-jsonnet's native builtins fail with RUNTIME ERROR: Unexpected type string, expected array. std.uniq, std.map, std.mapWithIndex and std.foldl accept strings on both sides; std.filter, std.count, std.remove, std.find, std.contains, std.all and std.avg reject them on both. Likewise `std.base64DecodeBytes([])` is `[ ]` and `std.base64Decode([])` is `""` in C++, errors in go-jsonnet. The documentation describes these arguments as arrays, so this is a divergence outside the contract, recorded because go-jsonnet aims at the C++ implementation's behaviour. Found by TestHegelEvalAgreesWithJsonnet.
'''

