`std.sort([1], keyF=function(x) x.a)` is `[1]` in jsonnet 0.22.0 (std.jsonnet returns arrays of length 0 or 1 before touching the key function), and fails in go-jsonnet with RUNTIME ERROR: Value non indexable: *jsonnet.valueNumber; std.set behaves the same, std.uniq, std.setUnion/Inter/Diff and std.minArray/maxArray agree with C++ (the last two evaluate the key on both sides). Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/12"
title = "std.member, contains, remove and removeAt force the needle for an empty array; the C++ implementation never looks at it"
kind = "contract"
severity = "low"
test = "TestHegelPinMemberForcesNeedle"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`std.member([], error "x")` is `false` in jsonnet 0.22.0 (nothing to compare, the argument is never evaluated: Jsonnet is lazy) and RUNTIME ERROR: x in go-jsonnet, whose native builtins evaluate the argument up front; std.contains, std.remove and std.removeAt behave the same, std.setMember, std.count and std.find agree with C++. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/13"
title = "A shift whose result leaves the safe integer range wraps instead of failing: 1 << 63 is -9223372036854775808"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinShiftOutOfRange"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The C++ implementation checks the result of a bitwise operation and fails with RUNTIME ERROR: numeric value outside safe integer range for bitwise operation for `1 << 63` and `1e15 << 1e3`; go-jsonnet checks only the operands (Bitwise operator argument ... outside of range [-9007199254740991, 9007199254740991] for `9007199254740992 | 0`, as in C++) and lets the shifted int64 wrap: `1 << 63` is -9223372036854775808, `1e15 << 1e3` is -4143311657180856320. `1 << 62`, `1 << 64` (shift count taken modulo 64) and negative shift counts agree. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
id = "go-jsonnet/14"
title = "A tailstrict call of a function whose default parameter refers to an outer variable crashes: INTERNAL ERROR (CRASH) RUNTIME: Unknown variable"
kind = "crash"
severity = "high"
test = "TestHegelPinTailstrictDefaultCrash"
found = { commit = "567b61ac4a6c23546a62d79324bb4aaed6bdc941", version = "v0.22.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`local f(a, b=a) = a + b; f(1) tailstrict` is 2 in jsonnet 0.22.0 and INTERNAL ERROR: (CRASH) RUNTIME: Unknown variable: a (we should have caught this statically) in go-jsonnet; the same with a default referring to std (`b=std.length("x")`) or to an enclosing local (`local g = 2; local f(a, b=g) = ...`): the default value's thunk is evaluated in the wrong environment when the call is tailstrict. Without tailstrict, or when the argument is passed explicitly, both agree. Found by TestHegelEvalAgreesWithJsonnet.
'''

[[bug]]
