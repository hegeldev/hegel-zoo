# Bugs found in github.com/spf13/afero at the pinned commit. Each has a pin in
# hegel/hegel_pins_test.go (listed as an expected failure in target.toml) and a
# switch in hegel/known.go the properties gate on.

[[bug]]
id = "afero/1"
title = "MemMapFs.Mkdir creates missing parent directories like MkdirAll"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMkdirNeedsItsParent"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Mkdir(/a/b) with no /a returns nil and creates /a (registerWithParent calls lockfreeMkdir for a missing parent). OsFs returns ENOENT; the Fs interface distinguishes Mkdir from MkdirAll, which is the call documented to create parents."

[[bug]]
id = "afero/2"
title = "MemMapFs Create, OpenFile(O_CREATE) and Rename into a missing directory succeed and create it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCreateNeedsItsParent"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Create(/c/d), OpenFile(/e/f, O_CREATE) and Rename(/f, /nodir/f) all return nil and create the missing directory (registerWithParent). OsFs returns ENOENT for each."

[[bug]]
id = "afero/3"
title = "MemMapFs.Remove deletes a non-empty directory and leaves its children reachable; removing an orphan then panics"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRemoveRefusesANonEmptyDirectory"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "After Mkdir(/d), Create(/d/f), Remove(/d) returns nil (OsFs: ENOTEMPTY). Stat(/d/f) still succeeds while /d is gone and Readdir of the root no longer lists it; Remove(/d/f) afterwards hits log.Panic in unRegisterWithParent (parent of /d/f is nil)."

[[bug]]
id = "afero/4"
title = "MemMapFs.MkdirAll on an existing regular file returns nil"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMkdirAllOverAFileFails"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "MkdirAll treats Mkdir's ErrFileExists as success without checking that the existing entry is a directory. os.MkdirAll returns ENOTDIR."

[[bug]]
id = "afero/5"
title = "MemMapFs MkdirAll, Mkdir, Create or Rename below a regular file turn the file into a directory"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAFileDoesNotBecomeADirectory"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "With /f a file holding data, MkdirAll(/f/g) returns nil: registerWithParent finds /f as the parent and mem.InitializeDir sets its dir flag, so Stat(/f) reports a directory that still has a size and content. OsFs returns ENOTDIR."

[[bug]]
id = "afero/6"
title = "MemMapFs.Create over an existing directory replaces it with a file, leaving the children reachable"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCreateOverADirectoryFails"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Create(/d) with /d a directory containing /d/x returns a file handle; /d is now a regular file and Stat(/d/x) still succeeds. OsFs returns EISDIR."

[[bug]]
id = "afero/7"
title = "MemMapFs.Rename of a directory over a file, or over a non-empty directory, succeeds and overwrites it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRenameOfADirectoryOverAFileFails"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Rename never looks at the destination: a directory renamed over a regular file replaces it (OsFs: ENOTDIR) and a directory renamed over a non-empty directory replaces the entry while the old destination's children stay reachable by path (OsFs: ENOTEMPTY / EEXIST)."

[[bug]]
id = "afero/8"
title = "MemMapFs.Rename of a directory into its own subtree succeeds and detaches the tree from the root"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRenameIntoItselfFails"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "With /s/t and /s/f, Rename(/s, /s/t/x) returns nil (OsFs: EINVAL). Afterwards Walk from / finds nothing but the root while the map holds /s/t/x/f, /s/t/x/t and /s/t/x/t/x."

[[bug]]
id = "afero/9"
title = "mem.File.Seek to a negative position succeeds and the next Read or Write panics"
kind = "crash"
severity = "medium"
test = "TestHegelPinSeekRejectsANegativePosition"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Seek(-2, io.SeekStart) returns -2, nil (os.File: EINVAL); the following Read panics with runtime error: slice bounds out of range [-2:] in ReadAt, and Write panics likewise in WriteAt."

[[bug]]
id = "afero/10"
title = "mem.File Read and ReadAt past the end return io.ErrUnexpectedEOF instead of io.EOF"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinReadPastTheEndIsEOF"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "ReadAt(b, off) with off beyond the size returns io.ErrUnexpectedEOF (and even for an empty b, where os.File returns nil); Read after a Seek beyond the end returns it too. os.File returns 0, io.EOF; io.ReaderAt documents EOF for a short read."

[[bug]]
id = "afero/11"
title = "MemMapFs O_APPEND only seeks to the end when the file is opened"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAppendAlwaysWritesAtTheEnd"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "OpenFile implements O_APPEND as a single Seek(0, SeekEnd): a Seek, Truncate or WriteAt afterwards makes Write overwrite the middle (abc + Seek(0) + Write(X) gives Xbc, os gives abcX); with O_TRUNC the seek happens before the truncation so the first write lands at the old size (a file of 3 bytes gives \\x00\\x00\\x00a); with O_RDWR the read position starts at the end instead of 0."

[[bug]]
id = "afero/12"
title = "MemMapFs.OpenFile does not enforce the access mode: O_WRONLY handles read and O_RDONLY|O_CREATE handles write"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAccessModeIsEnforced"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "A read-only handle is returned only when flag == os.O_RDONLY exactly, so O_RDONLY|O_CREATE (or |O_APPEND) gives a writable handle; there is no write-only handle at all, so Read on an O_WRONLY handle returns the data. os.File returns EBADF in both cases."

[[bug]]
id = "afero/13"
title = "MemMapFs.OpenFile(O_RDONLY) of a file without write permission fails with permission denied"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReadOnlyOpenOfAReadOnlyFile"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "OpenFile always goes through openWrite, which requires a write bit in the mode, before looking at the flags: a 0444 file cannot be opened read-only through OpenFile (Open works), and O_CREATE|O_EXCL on such a file reports permission denied instead of exists."

[[bug]]
id = "afero/14"
title = "MemMapFs treats a directory handle as a file: ReadFile of a directory returns empty content and OpenFile with write flags on it succeeds and writes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinADirectoryIsNotAFile"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "OpenFile(/d, O_WRONLY) of a directory returns a handle whose Write succeeds (the directory keeps IsDir and Size 42); ReadFile(/d) returns nil, nil; OpenFile(/d, O_RDONLY|O_CREATE) succeeds. os returns EISDIR for all three."

[[bug]]
id = "afero/15"
title = "MemMapFs.Create of an existing file replaces it: the mode is reset to 0666 and handles already open write into a detached copy"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCreateTruncatesInPlace"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Create always builds a new mem.FileData with mode 0666 and stores it under the name. A 0644 file becomes 0666 (os.Create truncates and keeps the mode), and a handle opened before the second Create keeps writing into the old data, so its writes never appear in the file."

[[bug]]
id = "afero/16"
title = "MemMapFs.RemoveAll of the empty path deletes every file including the root"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRemoveAllOfTheEmptyPathIsANoOp"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "normalizePath keeps the empty string, and every path has the prefix empty + separator, so RemoveAll(\"\") deletes the whole map; Stat(\"/\") fails afterwards. os.RemoveAll(\"\") returns nil and does nothing."

[[bug]]
id = "afero/17"
title = "MemMapFs Mkdir and Create of the empty path add an entry with an empty name to the root"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNoEntryWithAnEmptyName"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Mkdir(\"\") returns nil and ReadDir(\"/\") then lists a directory named \"\" (Create(\"\") likewise adds a file). os returns ENOENT."

[[bug]]
id = "afero/18"
title = "mem.File.Seek with an invalid whence returns the current position and no error"
kind = "contract"
severity = "low"
test = "TestHegelPinSeekRejectsABadWhence"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Seek(1, 7) returns 0, nil; os.File returns EINVAL. The switch on whence has no default."

[[bug]]
id = "afero/19"
title = "FileContainsBytes and FileContainsAnyBytes report matches in the zero padding of their buffer"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFileContainsBytesIgnoresItsPadding"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "readerContainsAny searches the whole buffer (four times the longest subslice) although only the first read fills at most half of it: for a file abc, FileContainsBytes(\\x00\\x00) and FileContainsBytes(c\\x00) return true. The same stale bytes survive after the shift-and-refill in later iterations."

[[bug]]
id = "afero/20"
title = "UnionFile.Close returns BADFD after closing both files, so WriteFile through a CacheOnReadFs or a merged directory Close fails"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnionFileCloseSucceeds"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Close closes Base and Layer and then falls through to return BADFD (EBADFD on Linux) unconditionally. Every directory opened on a CopyOnWriteFs present in both layers, and every file written through a CacheOnReadFs, reports the error on Close; afero.WriteFile on a CacheOnReadFs therefore returns an error after writing the data."

[[bug]]
id = "afero/21"
title = "CopyOnWriteFs Remove and RemoveAll of a base-only file return not-exist or nil instead of EPERM"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCowRemoveOfABaseFileIsNotPermitted"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "The doc says removing files present only in the base is not permitted. Both methods compare the layer's error with the bare syscall.ENOENT, but MemMapFs and OsFs return *PathError (and RemoveAll returns nil for a missing path), so the EPERM branch is dead: Remove reports file does not exist for a file Stat and Open see, RemoveAll silently returns nil and the file stays."

[[bug]]
id = "afero/22"
title = "CopyOnWriteFs Mkdir and MkdirAll only check the base for a directory: Mkdir succeeds over a layer directory, without parents, and both shadow a base file with a directory"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCowMkdirChecksTheLayer"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Both methods call IsDir on the base and otherwise delegate to layer.MkdirAll: Mkdir of a directory that exists in the layer returns nil, Mkdir(/no/parent) creates the parents, and Mkdir or MkdirAll over a regular base file create a layer directory that hides it (Stat then says directory)."

[[bug]]
id = "afero/23"
title = "CacheOnReadFs.Remove of a file not yet in the cache removes it from the base but returns not-exist"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCacheRemoveOfAnUncachedFile"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "On a cache miss Remove deletes the base file and then returns the layer's Remove error for the copy that never existed: the caller sees file does not exist for a removal that happened."

[[bug]]
id = "afero/24"
title = "RegexpFs.Rename of a directory is a silent no-op"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRegexpFsRenamesDirectories"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Rename returns nil without calling the source when the old name is a directory (the doc says only files are filtered): Rename(/rd, /re) leaves /rd in place and /re missing."

[[bug]]
id = "afero/25"
title = "RegexpFs.OpenFile with O_CREATE cannot create a new file"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRegexpFsOpenFileCreatesFiles"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "OpenFile first calls dirOrMatches, which Stats the name in the source and returns that error: OpenFile(/rd/d.txt, O_CREATE|O_RDWR) of a new, matching name fails with file does not exist. Create works."

[[bug]]
id = "afero/26"
title = "RegexpFile.Readdir(n) returns an empty page with a nil error when the next entries are filtered out"
kind = "contract"
severity = "low"
test = "TestHegelPinRegexpFileReaddirPagesAreNotEmpty"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Readdir filters after taking n entries from the source, so a page can be empty while more entries follow; os.File documents that with n > 0 an empty result comes with a non-nil error, and a caller stopping on an empty page misses the rest."

[[bug]]
id = "afero/27"
title = "Walk returns filepath.SkipDir and filepath.SkipAll to its caller instead of nil"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWalkSwallowsTheSkipSentinels"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "When the callback returns SkipDir on a file directly under the root the remaining siblings are skipped (as in filepath.Walk) but Walk returns SkipDir as its error; SkipAll (Go 1.20) is not handled at all and comes back as the error. filepath.Walk returns nil in both cases; WalkDir gets it right."

[[bug]]
id = "afero/28"
title = "Glob does not count a backslash escape as a meta character and takes such a pattern element literally"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGlobHonoursBackslashEscapes"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "hasMeta checks only *?[ while filepath's version also counts a backslash on non-Windows systems: Glob(/gd/a\\b) looks for a file literally named a\\b and finds nothing where filepath.Glob matches /gd/ab, and Glob(/\\a/*) fails the same way in the directory part. The doc says the pattern syntax is Match's."

[[bug]]
id = "afero/29"
title = "MemMapFs.Rename of a missing file onto itself returns nil"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRenameOfAMissingFileOntoItselfFails"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Rename returns nil for equal names before checking that the file exists; os.Rename returns ENOENT."

[[bug]]
id = "afero/30"
title = "MemMapFs.Create of an existing file without write permission succeeds"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCreateRespectsAReadOnlyFile"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "OpenFile with write flags checks the mode's write bits and refuses a 0444 file, but Create replaces the file without looking at it (see also afero/15)."

[[bug]]
id = "afero/31"
title = "mem.File.WriteAt of an empty slice beyond the end grows the file with zeros"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyWriteAtDoesNotGrowTheFile"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "WriteAt pads the data up to the offset even when nothing is written: WriteAt([]byte{}, 5) on an empty file makes it 5 zero bytes long, and Write([]byte{}) after a Seek past the end does the same. os.File leaves the file alone."

[[bug]]
id = "afero/32"
title = "copyToLayer cannot copy a directory: CopyOnWriteFs Chmod/Chtimes/Chown and CacheOnReadFs Chmod/Chtimes/Chown/Rename of a base-only directory fail"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinChmodOfABaseDirectoryThroughAUnion"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "copyFile opens the base entry, creates a file of the same name in the layer and io.Copies into it; for a directory the copy fails (EIO with a MemMapFs base, EISDIR with an OsFs base) and the call returns that error. CopyOnWriteFs.Chmod(/cd) of a base directory and CacheOnReadFs.Rename(/d, /d2) of an uncached directory both fail this way."

[[bug]]
id = "afero/33"
title = "The copy of a base file made in the layer gets mode 0666 instead of the base file's mode"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTheLayerCopyKeepsTheMode"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "copyFile uses layer.Create and only copies the modification time: after writing to a 0644 base file through a CopyOnWriteFs, or merely reading it through a CacheOnReadFs, Stat reports 0666 (minus the umask on an OsFs layer)."

[[bug]]
id = "afero/34"
title = "CopyOnWriteFs and CacheOnReadFs recreate a base directory in the layer with the new entry's mode and then report that mode"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAParentKeepsItsModeWhenAChildIsCreated"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "Creating anything below a base-only directory calls layer.MkdirAll with the new entry's perm (Mkdir, MkdirAll) or 0777 (OpenFile, copyFile), and Stat prefers the layer entry: Mkdir(/d/e, 0700) under a 0755 base directory /d makes Stat(/d) report 0700; the failed write over a base directory (afero/32) recreates the parents too."

[[bug]]
id = "afero/35"
title = "RegexpFs.RemoveAll of a missing path returns an error instead of nil"
kind = "contract"
severity = "low"
test = "TestHegelPinRegexpFsRemoveAllOfAMissingPath"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
notes = "RemoveAll first calls IsDir on the source and returns its Stat error; the Fs interface documents that RemoveAll does not fail if the path does not exist."

[[bug]]
id = "afero/36"
title = "CacheOnReadFs.OpenFile with O_WRONLY on a file not in the layer copies through the write-only handle and fails after O_TRUNC emptied the base file"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinCacheWriteFileOfAnUncachedFile"
