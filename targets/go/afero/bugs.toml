[[bug]]
id = "afero/39"
title = "MemMapFs.Rename of an entry to a path below itself whose parent does not exist panics and then aborts the process with a fatal RUnlock"
kind = "crash"
severity = "high"
test = "TestHegelPinRenameBelowAMissingParentIsAnError"
found = { commit = "768f1fb0e5535b77d90e44c531aacd652aabd96a", version = "v1.15.0+ (2026-06-09)", hegel = "v0.6.33", date = "2026-09-26" }
status = "open"
notes = '''
With /b a directory, `Rename("/b", "/b/c/c")` (OsFs: ENOENT) stores the entry under the new key
before walking its descendants, so the entry is now its own descendant; `renameDescendants`
(memmap.go:381) calls `unRegisterWithParent` (memmap.go:74) on /b/c/c, whose parent /b/c is not
in the map, and that `log.Panic`s "parent of /b/c/c is nil". The panic unwinds through the
deferred `RUnlock` of a lock the same goroutine had already released, and `sync: RUnlock of
unlocked RWMutex` is a fatal runtime error that no `recover` reaches: the whole process dies.
A file source does the same (`WriteFile("/f"); Rename("/f", "/f/x/y")`), and `Rename("/f",
"/f/x")` dies of a nil dereference at the same site. `Rename("/b", "/b/c")` with the parent
present merely detaches the tree (afero/8). Found by the rewritten MemMapFs property, which
now keeps the shape out even by default since it kills the test binary; the pin runs the call
in a child process (the test binary itself) and reads its fate.
'''
