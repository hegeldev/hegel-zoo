# Bugs found in mattn/go-runewidth by the Hegel properties. Each is pinned by the test named in
# `test`, listed as an expected failure in target.toml.

[[bug]]
id = "go-runewidth/1"
title = "Wrap at a non-positive width breaks before a CRLF in ASCII text but not in text with other bytes"
kind = "contract"
severity = "low"
test = "TestHegelPinWrapASCIIAgreesWithTheSegmenterOnCRLF"
found = { commit = "14205cc90ececd174edb6b189720d30b9a47b812", version = "v0.0.30", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
runewidth.go `Wrap`: the ASCII fast path handles bytes one at a time, so `\r` is a zero-width
character and `\n` a line ending, while the segmenter path (and `wrapRunes`, which hands any
`\r` to it) treats `\r\n` as one cluster that ends the line and is never broken before. With
`w <= 0` — "a non-positive width breaks before every cluster, as it always has"
(TestWrapNonPositiveWidth) — the column is already past `w` when `\r` comes, so the ASCII path
inserts a break: `Wrap("a\r\nb", 0)` = `"\na\n\r\n\nb"` but `Wrap("あ\r\nb", 0)` =
`"\nあ\r\n\nb"`, and the cluster loop upstream's own tests (`clusterWrap`) use as the
reference gives `"\na\r\n\nb"`. Positive widths are unaffected (an ASCII line never exceeds
`w` there). Fix: treat `\r` followed by `\n` as part of the line ending in the ASCII path.
'''

[[bug]]
id = "go-runewidth/2"
title = "IsEastAsian reports false for CJK locales without a charset or with a CJK charset outside its list (ja_JP, zh_CN.GB18030, ko_KR.EUC-KR, zh_HK.big5hkscs, zh_TW.euctw)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIsEastAsianKnowsTheCommonCJKLocales"
found = { commit = "14205cc90ececd174edb6b189720d30b9a47b812", version = "v0.0.30", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
runewidth_posix.go `isEastAsian`: the locale is East Asian only if `mblen(charset) > 1`, and
`mblen` knows "utf-8"/"utf8" (then the language must be ja/ko/zh), "jis", "eucjp", "euckr",
"euccn", "sjis", "cp932", "cp51932", "cp936", "cp949", "cp950", "big5", "gbk", "gb2312" — the
language alone never decides. So `LANG=ja_JP`, `zh_CN` or `ko_KR` (glibc's charset-less
aliases of ja_JP.eucJP etc.) give false, as do the glibc locales `zh_CN.gb18030` (the default
Chinese charset, and China's mandatory standard), `zh_HK.big5hkscs`, `zh_TW.euctw`, and the
IANA spellings `EUC-JP`, `EUC-KR`, `Shift_JIS`, `BIG5-HKSCS`, `EUC-TW` with a hyphen or
underscore. A Japanese or Chinese user in one of these locales gets ambiguous-width characters
(box drawing, ①, ■, ☆…) at one cell and misaligned tables — the very case `EastAsianWidth` is
for. `en_US.SJIS` is true, so the charset list, not the language, is what the function keys
on. Fix: a ja/ko/zh language prefix should be enough (unless @cjk_narrow); add gb18030,
big5hkscs, euctw and the hyphenated spellings to `mblen`.
'''

[[bug]]
id = "go-runewidth/3"
title = "StringWidth of a single byte that is not UTF-8 ignores the East Asian flag: 1 cell alone, 2 cells inside longer text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSingleInvalidByteMeasuresLikeAnyOther"
found = { commit = "14205cc90ececd174edb6b189720d30b9a47b812", version = "v0.0.30", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
runewidth.go `StringWidth`: `if len(s) == 1 { if b < 0x20 || b == 0x7F { return 0 }; return 1 }`
runs before anything looks at the flags, and a byte 0x80–0xFF is not ASCII: every other path
decodes it to U+FFFD, whose East_Asian_Width is Ambiguous, two cells with `EastAsianWidth`.
With `Condition{EastAsianWidth: true}`: `StringWidth("\xff")` = 1, `StringWidth("\xff\xff")` = 4,
`RuneWidth(utf8.RuneError)` = 2. Upstream's TestInvalidUTF8MatchesClusterLoop skips one-byte
strings for this reason ("a shortcut of its own, which has never agreed with the segmenter").
Fix: `if b >= 0x80 { return c.RuneWidth(utf8.RuneError) }` in the shortcut, or restrict it to
`b < 0x80`.
'''

[[bug]]
id = "go-runewidth/4"
title = "A space or letter before a two-cell Extend rune (skin tone modifier), or after Prepend runes, is swallowed by the two-cell cluster cap, so FillLeft/FillRight come out a cell short"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTwoCellExtendRuneKeepsItsBaseVisible"
found = { commit = "14205cc90ececd174edb6b189720d30b9a47b812", version = "v0.0.30", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
runewidth.go `graphemeWidth` caps every cluster at two cells to keep ZWJ emoji, flags and
Hangul jamo sequences from being over-counted. The cap also fires when the cluster is a base
that has its own cell plus an Extend rune that has two: the skin tone modifiers U+1F3FB–1F3FF
are East_Asian_Width W and Grapheme_Cluster_Break Extend, so `" 🏼"` and `"a🏼"` are one
cluster of 1+2 = 3 → 2 cells, though a terminal shows the space (or letter) and then a
two-cell colour swatch. Likewise Prepend runes (U+0600–0605, U+0890, U+110BD…) pull the
following character into their cluster: `"࢐؁ "` = 1+1+1 → 2. Consequences:
`StringWidth(FillLeft("🏼", 4))` = 3 and `StringWidth(FillRight("࢐؁", 4))` = 3 — the
padding functions cannot reach the requested width by the package's own measure, and a column
of such cells is misaligned. Fix: cap only clusters that are emoji sequences (ExtPict base) or
Hangul syllable sequences, or count a two-cell Extend rune after a non-emoji base as its own.
'''

[[bug]]
id = "go-runewidth/5"
title = "An incomplete UTF-8 sequence at the end of the text is attached to the preceding cluster and measured as zero cells"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIncompleteSequenceAtTheEndIsMeasured"
found = { commit = "14205cc90ececd174edb6b189720d30b9a47b812", version = "v0.0.30", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The segmenter (github.com/clipperhouse/uax29/v2 v2.2.0 `graphemes.FromString`) does not place
a boundary before a lead byte whose continuation bytes are missing at the end of the input:
`"あ\xe3\x81"` is one cluster `["あ\xe3\x81"]`, while `"あ\xe3\x81 "` is `["あ" "\xe3\x81" " "]`
and `"\xe3\x81"` alone is `["\xe3\x81"]`. Under the two-cell cap the trailing bytes then vanish:
`StringWidth("あ\xe3\x81")` = 2, `StringWidth("あ\xe3\x81 ")` = 5, `StringWidth("\xe3\x81")` = 2;
`StringWidth("a\xf0\x98\xb7")` = 2 vs 4 with a space after. `Truncate("あ\xe3\x81", 2, "")`
returns the input unchanged (it "fits" in 2 cells) although a terminal shows あ and two
replacement glyphs. The rune loop (`runeWidthSum`) would count them, but U+FFFD is marked as a
joiner precisely to send invalid bytes to the segmenter. Truncated text from a byte-limited
read is the common way to get such input. Fix: split the trailing incomplete sequence off
before segmenting (or measure invalid bytes with the rune loop), or fix upstream in uax29.
'''
