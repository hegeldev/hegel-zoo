# Bugs found in go-ini/ini (gopkg.in/ini.v1) by the Hegel zoo. Oracles: Python's configparser
# on the shared grammar, the writer against the reader, models of the helpers.

[[bug]]
id = "go-ini/1"
title = "Two values that reference each other (%(a)s / %(b)s) make Key.String() recurse without bound: fatal stack overflow"
kind = "crash"
severity = "high"
test = "TestHegelInterpolationCycleDoesNotCrash"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
transformValue bounds its own substitution loop with depthValues = 99, but every substitution
calls nk.String() on the referenced key, which runs transformValue again: for

    [s]
    a = %(b)s
    b = %(a)s

Key("a").String() alternates between the two keys until the goroutine stack (1 GB by default)
is exhausted. That is a runtime fatal error, not a panic — recover() cannot catch it and the
whole process dies. Every typed getter (Int, Bool, Strings, MapTo…) goes through String(), so
a configuration file with a reference cycle (or a self-reference through a longer chain)
kills the program that reads it. The self-reference `a = %(a)s` is handled (it falls through
to the default section), so the guard exists for the length-1 cycle only. A depth counter
threaded through the recursion, or an in-progress set, would bound it.
'''

[[bug]]
id = "go-ini/2"
title = "Values the writer leaves raw or wraps in plain double quotes do not read back: 'abc', \"abc\", abc\\, \"\"\", \" x\\\"\""
kind = "contract"
severity = "medium"
test = "TestHegelWrittenValuesReadBack"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
writeToBuffer quotes a value with `"""` when it contains a line feed or a backtick, with
backticks when it contains # or ;, with `"` when it has leading or trailing blanks, and writes
it raw otherwise — but the reader treats several raw and `"`-quoted forms specially:

- `'abc'` and `"abc"` (a value that starts and ends with the same quote) are written raw and
  read back as `abc` (hasSurroundedQuote strips them); `''` reads back as ``.
- `abc\` and `\` (a trailing backslash) are written raw and read as a continuation line, so
  the value loses the backslash and swallows the next line (`\` alone reads back as ``).
- `"""` is written raw and is an unterminated triple quote: Load fails with
  `missing closing key quote`.
- ` x"` (padding plus an inner quote) is written `" x""`, which hasSurroundedQuote rejects
  because of the inner quote, so the value reads back as `" x""`.

Writing these forms in backticks (or `"""` when they contain a backtick) would make WriteTo's
output a fixed point of Load, which is what SaveTo/Load round trips assume.
'''

[[bug]]
id = "go-ini/3"
title = "Keys starting with # ; or [, the key \"-\", padded keys, keys with a line feed or with both a backtick and a quote/delimiter, and section names with a line feed are written unreadably"
kind = "contract"
severity = "low"
test = "TestHegelWrittenNamesReadBack"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The writer quotes a key with backticks when it contains a quote or a delimiter and with `"""`
when it contains a backtick, and otherwise writes it raw; NewKey accepts any non-empty name.
So `#k`/`;k` are written as comment lines (the key vanishes), `[k` as `[k = v` (Load fails:
`unclosed section`), `-` becomes the auto-increment key `#1`, ` k ` reads back as `k`, `k\nx`
splits into two lines (`key-value delimiter not found: k`), `a`b"c` is written in backticks
that end at its own backtick (`a`b"c` = v` → key `a`), and a section named `a\nb` is written
`[a\nb]` (`unclosed section`). Either NewSection/NewKey should reject names the format cannot
carry, or the writer should quote them (keys) and error out (section names).
'''

[[bug]]
id = "go-ini/4"
title = "AllowPythonMultilineValues: a quoted first line ('a') makes the indented continuation a \"key-value delimiter not found\" error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPythonMultilineAfterQuotedFirstLine"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
readValue checks for Python-style continuation in an else-if chain after the surrounded-quote
stripping (and after UnescapeValueCommentSymbols), so a value like `k = 'a'` followed by
`  b` never reaches readPythonMultilines; the indented line is then parsed as a key and fails
(`key-value delimiter not found: b`). Python's configparser reads `'a'\nb`. The same happens
with UnescapeValueCommentSymbols set.
'''

[[bug]]
id = "go-ini/5"
title = "SpaceBeforeInlineComment recognises only a space inside the trimmed value: a tab before # or a comment right after the delimiter stays in the value"
kind = "wrong-result"
severity = "low"
test = "TestHegelSpaceBeforeInlineCommentAcceptsTab"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The option is documented with Python's rule ("they need to be preceded by a whitespace
character to be recognized as a comment") but readValue searches the left-trimmed value for
the two-byte strings " #" and " ;". So `k = a<TAB># c` keeps `a\t# c`, and `k = # c` — a
comment directly after the delimiter, where the space is part of the padding the parser has
already trimmed — keeps `# c`. Python (with inline_comment_prefixes) gives `a` and `` in
those cases.
'''

[[bug]]
id = "go-ini/6"
title = "Key.Strings drops an empty last element (\"a,\" → [a]) but keeps an empty first one (\",a\" → [\"\", a]), and drops a trailing backslash"
kind = "wrong-result"
severity = "low"
test = "TestHegelStringsKeepsEmptyLastElement"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Strings appends the pending buffer only `if buf.Len() > 0`, so a delimiter at the end leaves
no element: `a,` → [a], `a,b,` → [a b], `,` → [""] (one element, not two), `a::` → [a] for
delimiter `::`. A delimiter at the start does produce an empty element (`,a` → ["" a]), and
`a,,b` produces the middle one. A trailing backslash is dropped silently (`a\` → [a], `\` →
[]) while a backslash anywhere else is kept (`a\x` → [a\x]). Either trailing empties are
meaningful (then keep them) or not (then drop leading ones too).
'''

[[bug]]
id = "go-ini/7"
title = "SpaceBeforeInlineComment looks for \" ;\" only when there is no \" #\": \"a ;b #c\" is \"a ;b\""
kind = "wrong-result"
severity = "low"
test = "TestHegelSpaceBeforeInlineCommentTakesTheFirstSymbol"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
readValue does `i = strings.Index(line, " #"); if i == -1 { i = strings.Index(line, " ;") }`,
so when both symbols occur the `#` wins even if the `;` comes first: `k = a ;b #c` gives
`a ;b` where the comment (by the documented Python rule, and in Python) starts at ` ;` and the
value is `a`. Without SpaceBeforeInlineComment the parser correctly takes the earliest of the
two (IndexAny).
'''

[[bug]]
id = "go-ini/8"
title = "UnescapeValueCommentSymbols never sees the escaped symbol: the inline comment is cut first, so \"a\\;b\" is \"a\\\""
kind = "wrong-result"
severity = "low"
test = "TestHegelUnescapeValueCommentSymbols"
found = { commit = "e2db55b0e088fa4ee0c128aa4ade263cdc1d7f08", version = "v1.67.3+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The option is documented as "unescape comment symbols (\# and \;) inside value to regular
format when value is NOT surrounded by any quotes", but readValue strips the inline comment
(from the first # or ;) before the unescaping step, so `k = a\;b` yields `a\` and `k = \#x`
yields `\`. It only does what it says when IgnoreInlineComment is also set — which is how the
upstream test uses it. The option should skip escaped symbols when looking for the comment.
(The doc marks the option UNSTABLE.)
'''
