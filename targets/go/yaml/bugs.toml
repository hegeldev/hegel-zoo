(`indent`, `line-width`, `compact-seq-indent`, `unicode`, `canonical`, `line-break`,
`explicit-start`, `explicit-end`, `flow-simple-coll`, `known-fields`, `single-document`,
`unique-keys`, `plugin`) are accepted.
'''

[[bug]]
id = "yaml/7"
title = "`-0` resolves to the float -0 (yaml.v3, goccy, libyaml and the YAML 1.2 core schema: the int 0) and `!!int -0` is an error"
kind = "wrong-result"
severity = "low"
test = "TestHegelNegativeZeroIsAnInteger"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Load([]byte("-0"), &v)` gives `float64(-0)`; yaml.v3 gives `int(0)`, as do goccy and PyYAML,
and `-0` matches the core schema's integer form `[-+]?[0-9]+`.  `Load([]byte("!!int -0"), &i)`
fails with `cannot construct !!float `-0` as a !!int` (yaml.v3: 0).  `resolveMap` in
internal/libyaml/resolver.go lists `-0` (and `-0.0`) as spellings of the negative-zero float
before the integer parse runs; `-00` and `-0_` are still the int 0 and `+0` too, so the special
case is inconsistent with the neighbouring spellings.  Into a typed `int` field `-0` loads as 0.
'''

[[bug]]
id = "yaml/8"
title = "A time.Time outside years 0001-9999 is dumped as a !!timestamp v4 itself cannot read, without an error"
kind = "roundtrip"
severity = "low"
test = "TestHegelTimestampsTheEncoderWritesAreReadable"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Dump(map[string]any{"t": time.Date(10000, 1, 1, 0, 0, 0, 0, time.UTC)})` writes
`t: !!timestamp 10000-01-01T00:00:00Z` and returns no error; `Load` of that output fails with
`cannot construct !!str `10000-01-01T00:00:00Z` as a !!timestamp`.  The same for year 12345 and
for year -1 (`-0001-01-01T00:00:00Z`).  Go's `time.Time` covers those years, YAML timestamps
have four-digit years; the representer should either quote the value (making it a string, as it
does for other unresolvable text) or return a DumpError, and the constructor could accept what
`time.Time.Format` produced.  yaml.v3 behaves the same.
'''

[[bug]]
id = "yaml/9"
title = "Into a time.Duration field `d: 1e9` loads as 1s while `d: 1000000000` is an error"
kind = "contract"
severity = "low"
test = "TestHegelNumericLiteralsIntoDurationFieldsAreConsistent"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `type D struct { D time.Duration `yaml:"d"` }`: `Load([]byte("d: 1e9"), &x)` gives `1s`,
`d: 1.5e9` gives `1.5s`, `d: -1e9` gives `-1s`, `d: 0` and `d: 0.0` give 0, but
`d: 1000000000`, `d: 1500000000` and `d: -1000000000` fail with `cannot construct !!int
`1000000000` into time.Duration`.  yaml.v3 rejects both spellings (a Duration must be a string
like `1s`); `constructInt` (internal/libyaml/constructor.go) has the Duration guard on the
integer path but the float path converts any float into the int64 nanoseconds without it.
Either both spellings should load (as nanoseconds, like encoding/json) or neither.
'''

[[bug]]
id = "yaml/10"
title = "A *Node target (struct field, map value, slice element, **Node) cannot receive a scalar or sequence node, and a mapping leaves it empty"
kind = "contract"
severity = "medium"
test = "TestHegelPointerToNodeTargetsReceiveTheNode"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `type P struct { NP *Node `yaml:"np"` }`: `Load([]byte("np: 0\n"), &p)` fails with `cannot
construct !!int `0` into libyaml.Node`; `np: x`, `np: ''`, `np: true`, `np: 1.5` and `np: [1]`
fail the same way, and `np: {a: 1}` succeeds but leaves `p.NP` pointing at a zero `Node` (Kind 0,
no content) — the mapping is lost.  `Load` into `**Node`, `map[string]*Node` and `[]*Node` fail
alike, and `Unmarshal` too.  A `Node` value field (`ND Node`) receives every kind of node, and the
encoder writes a `*Node` field (`Dump(&P{NP: &Node{Kind: ScalarNode, Tag: "!!int", Value: "7"}})`
gives `np: 7`), so a struct with a `*Node` field cannot round-trip through v4's own output.  The
constructor allocates the pointer and then treats the pointee as an ordinary struct instead of
checking for the Node type after dereferencing.  yaml.v3 has the same limitation for scalars.
'''

[[bug]]
id = "yaml/11"
title = "Closing a Dumper or Encoder that wrote no document, and Dump([]any{}, WithAllDocuments()), fail with \"expected STREAM-START\""
kind = "contract"
severity = "low"
test = "TestHegelAnEmptyDocumentStreamCanBeDumped"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`d, _ := NewDumper(&buf); d.Close()` returns `go-yaml dump error in emitter: expected
STREAM-START`, as does `NewEncoder(&buf).Close()` and `Dump([]any{}, WithAllDocuments())` (which
returns no bytes).  An empty stream is valid YAML and the loading side accepts it:
`Load([]byte(""), &all, WithAllDocuments())` gives an empty slice and `Loader.Load` returns
`io.EOF`, so dumping zero documents and loading them back does not compose.  The stream-start
event is only emitted lazily by the first `Dump`, and `Close` emits stream-end regardless.
yaml.v3's `Encoder.Close` has the same defect.
'''

[[bug]]
id = "yaml/12"
title = "WithIndent(3) with compact sequence indent (the v4 default) writes a sequence nested in a mapping inside a sequence item one column left of its parent: an invalid document"
kind = "roundtrip"
severity = "medium"
test = "TestHegelIndentThreeWithCompactSequencesWritesReadableNestedSequences"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Dump([]any{map[string]any{"a": []any{nil}}}, WithIndent(3))` writes

    - a:
     - null

The nested sequence sits at column 1 while its parent mapping (`a:`) is at column 2, so the
document is invalid: v4's own `Load` fails with "did not find expected '-' indicator", yaml.v3
and goccy reject it too.  The same with `WithCompactSeqIndent(true)` spelled out, with
`WithV3Defaults()` plus `WithIndent(3)` plus `WithCompactSeqIndent(true)`, and with
`Encoder.SetIndent(3)` + `CompactSeqIndent()`.  With compact sequence indentation the nested
sequence is placed at `indent - 2` columns relative to the enclosing sequence item, which is
less than the `- ` width for indent 3; every other indent (2, 4..9) and indent 3 without the
compact option are fine.
'''

[[bug]]
id = "yaml/13"
title = "A multi-line string whose first content line starts with a tab is written as a literal block without an indentation indicator, which v4, yaml.v3 and libyaml all reject"
kind = "roundtrip"
severity = "medium"
test = "TestHegelStringsWhoseFirstContentLineStartsWithATabRoundTrip"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Dump(map[string]any{"k": "\ta\nb"})` writes `k: |-\n  \ta\n  b\n` and `Load` of that output
fails with "found a tab character where an indentation space is expected"; yaml.v3 and libyaml
(PyYAML) fail the same way (goccy reads some of these).  Also `"\n\tb"` (`k: |-\n\n  \tb`),
`"\t\na"`, `"\té\n"` (`k: |\n  \té`), with v4 and v3 defaults alike; a struct with such a string
field cannot round-trip.  A block scalar whose first non-empty content line begins with a tab
needs an explicit indentation indicator (the content indentation cannot be auto-detected past a
tab; with `|2-` the same text is fine, as `" \ta\nb"` → `k: |2-\n   \ta\n  b` shows).  v4 allows
tabs inside block scalars (yaml.v3 double-quotes any string containing a tab) but
`writeBlockScalarHints` only writes the indicator for a leading space; see also yaml/2 for the
leading-space variant.  Tabs after the first character or on later lines are fine.
'''

[[bug]]
id = "yaml/14"
title = "A null node with an empty value (from `a:`, `- ` or `{a: }`) is written as '' in flow style and reads back as the empty string"
kind = "roundtrip"
severity = "medium"
test = "TestHegelNullNodesWithAnEmptyValueStayNullInFlowStyle"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Load([]byte("a:\n"), &nd)` gives a mapping whose value node is `!!null` with the empty value;
`Dump(&nd, WithFlowSimpleCollections())` writes `{a: ''}`, which loads as
`map[string]any{"a": ""}` — a null became a string.  `- ` (an empty sequence item) becomes
`['']`, and a Node loaded from `{a: }` is dumped as `{a: ''}` even without the option (the node
keeps its flow style), as is a hand-built `Node{Kind: ScalarNode, Tag: "!!null", Value: ""}` in a
flow mapping.  The Desolver elides the `!!null` tag as resolvable, the emitter then cannot write
an empty plain scalar in flow context and falls back to single quotes, and the result resolves
to a string.  Block style writes `a:` (a null) for the same node, so the two styles disagree.
`Dump(map[string]any{"a": nil}, WithFlowSimpleCollections())` writes `{a: null}` and is fine; the
defect needs a Node.  yaml.v3 shares the `{a: }` → `{a: ''}` case.
'''

[[bug]]
id = "yaml/15"
title = "Dump modifies the Node it is given: resolvable tags are cleared and styles changed, so a !!float 1 node decodes as an int afterwards"
kind = "contract"
severity = "low"
test = "TestHegelDumpLeavesTheInputNodeUnchanged"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
After `Dump(m)` where `m` holds `leaf := &Node{Kind: ScalarNode, Tag: "!!float", Value: "1"}`,
`leaf.Tag` is `""`; `leaf.Decode(&v)` gave `float64(1)` before the call and gives `int(1)` after
it.  `{Tag: "!!str", Value: "1"}` ends up as `{Tag: "", Style: SingleQuotedStyle}`, `!!str ""`
likewise, `!!int`, `!!bool` and `!!null` lose their tags.  The Desolver (which elides tags the
resolver would reproduce and quotes strings instead) works on the caller's tree in place instead
of on a copy.  Dumping the same tree twice happens to produce the same text because the style is
also rewritten, but the caller's Node no longer means what it did; yaml.v3's `Marshal` leaves the
Node untouched (and writes `!!float 1`).
'''
