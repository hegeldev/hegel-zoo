[[bug]]
id = "yaml/1"
title = "WithCanonical() output carries no tags and quotes every scalar, so ints, bools, nulls and floats read back as strings"
kind = "roundtrip"
severity = "medium"
test = "TestHegelCanonicalOutputKeepsScalarTypes"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Dump(map[string]any{"i": 1, "b": true, "n": nil, "f": 1.5, "s": "1"}, WithCanonical())` writes

    ---
    {
      ? "b"
      : "true",
      ? "f"
      : "1.5",
      ? "i"
      : "1",
      ? "n"
      : "null",
      ? "s"
      : "1",
    }

and `Load` reads every value back as a string (`"1"`, `"true"`, `"null"`, `"1.5"`).  Canonical
YAML (and the option's documentation, `docs/options.md`: "explicit tags for all values", e.g.
`!!int "30"`) tags every node so that double-quoting is lossless; the Desolver elides the
resolvable tags before the canonical emitter quotes the scalars, and the emitter writes no tag
for an untagged node.  A `Node` loaded from a tagged document keeps only the tags that were
explicit in the source (`!!str "1"`, `!local "x"`); an untagged `1` is still written as `"1"`.
'''

[[bug]]
id = "yaml/2"
title = "A multi-line string whose first content line starts with a space after leading newlines is written as a literal block without an indentation indicator and reads back changed or not at all"
kind = "roundtrip"
severity = "medium"
test = "TestHegelStringsWhoseFirstContentLineStartsWithASpaceRoundTrip"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Dump(map[string]any{"k": "\n a"})` writes `k: |-\n\n   a\n`: the block has no indentation
indicator, so the first non-empty line fixes the content indentation at 3 and the string is read
back as `"\na"` by v4, yaml.v3, goccy and libyaml.  `"\n\n a"` becomes `"\n\na"`; `"\n a\nb"` is
written `k: |-\n\n   a\n  b\n`, which no parser accepts (v4: "did not find expected key"), and the
same with `WithV3Defaults()`, `WithIndent(4)`, `Marshal`, `Node.Encode` and `Node.SetString`.
`writeBlockScalarHints` (internal/libyaml/emitter.go) writes the indicator only when the value's
first byte is a space; YAML needs one whenever the first *non-empty* line starts with a space
(leading empty lines do not set the indentation).  yaml.v3 has the same defect; goccy's encoder
has a related one (go-yaml/28).
'''

[[bug]]
id = "yaml/3"
title = "A string starting with a space and containing a newline, inside a sequence, is written as an invalid literal block at every indent but 2: the indentation indicator says n but the content is indented by 2"
kind = "roundtrip"
severity = "medium"
test = "TestHegelLeadingSpaceMultilineStringsInSequencesAreReadableAtEveryIndent"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Marshal([]any{" a\nb", "x"})` (v3 defaults: indent 4) writes

    - |4-
       a
      b
    - x

The indicator `4` promises content indented by 4 columns, but the content is indented by 2 (the
width of `- `), so the block is invalid: v4 itself fails with "did not find expected '-'
indicator", yaml.v3 and libyaml reject it too.  The same for `Dump(..., WithIndent(n))` with n in
3..9 (with or without `WithCompactSeqIndent`), `Encoder.SetIndent(n)` for n in 3..9 and
`WithV3Defaults()`; only indent 2 (the v4 default) and `SetIndent(1)` produce a readable block.
The indicator is taken from `emitter.BestIndent` (`writeBlockScalarHints`) while the content
indentation of a sequence item is the `- ` width; as a mapping value or a top-level scalar the
string is fine.  yaml.v3 shares the bug (`yaml.Marshal([]any{" a\nb"})`).
'''

[[bug]]
id = "yaml/4"
title = "Unique-key detection compares the keys' raw text: `1`/`'1'`, `true`/`'true'` and any two collection keys are rejected as duplicates while `1`/`0x1`/`01`/`+1` and `true`/`True` are accepted"
kind = "correctness"
severity = "medium"
test = "TestHegelUniqueKeysCompareResolvedValues"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`WithUniqueKeys` is on by default.  `Dump(map[any]any{1: "a", "1": "b"})` writes `1: a\n'1': b\n`
and `Load` of that output fails with `mapping key "1" already defined at line 1`; the same for
`{true: "a", "true": "b"}`, `{nil: "a", "null": "b"}` and `{1.5: "a", "1.5": "b"}`, so such maps
cannot round-trip through the encoder's own output.  `? [a]\n: 1\n? [b]\n: 2\n` and
`? {x: 1}\n: 1\n? {x: 2}\n: 2\n` fail with `mapping key "" already defined` (every collection key
has the empty text) although loading them into a `Node` works.  Conversely `1: a\n0x1: b\n`,
`1: a\n01: b\n`, `1: a\n+1: b\n` and `true: a\nTrue: b\n` load without error into
`map[any]any{1: "b"}` / `{true: "b"}`, silently keeping the last value.  `mapping()` in
internal/libyaml/constructor.go compares `ni.Kind == nj.Kind && ni.Value == nj.Value` on the
scalar text instead of the resolved values (or the constructed Go keys).  yaml.v3 has the same
check.
'''

[[bug]]
id = "yaml/5"
title = "A plain `<<` used as a value is resolved to !!merge and silently dropped: `a: <<` loads as {}, `- <<` as [], `<<` alone as null"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelAPlainMergeIndicatorAsAValueIsAString"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Load([]byte("a: <<\n"), &v)` gives `map[string]any{}` (the key `a` disappears), `- <<` gives
`[]any{}`, `a: [<<, x]` gives `{"a": ["x"]}`, the document `<<` alone gives `nil`, and
`a: !!merge x` gives `{}` too; there is no error.  yaml.v3 (and goccy, libyaml) read `<<` in value
position as the string `"<<"`: the merge key only has a meaning as a mapping key.  The resolver
maps the plain `<<` to the merge tag unconditionally and the constructor treats a merge-tagged
node in value position as nothing.  The encoder quotes `<<`, so only hand-written documents lose
data.  Quoted (`'<<'`) and `!!str <<` are fine.
'''

[[bug]]
id = "yaml/6"
title = "OptsYAML rejects the documented `quote-preference` field"
kind = "contract"
severity = "low"
test = "TestHegelOptsYAMLAcceptsTheDocumentedQuotePreferenceField"
found = { commit = "3981672af99c06167dbc940bbeb35b65902ea20c", version = "v4.0.0-rc.6+", hegel = "v0.6.33", date = "2026-09-10" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`OptsYAML("quote-preference: single\n")` fails with `field quote-preference not found in type
struct {...}`; `docs/options.md` lists `quote-preference - String (single, double, legacy)`
among the OptsYAML fields and the `go-yaml` CLI accepts it.  The struct OptsYAML decodes into
