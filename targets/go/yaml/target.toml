name = "yaml"
language = "go"
upstream = "https://github.com/yaml/go-yaml"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "3981672af99c06167dbc940bbeb35b65902ea20c"
date = "2026-09-10"
version = "v4.0.0-rc.6+"

[hegel]
version = "v0.9.6"

[run]
# -vet=off: `go get hegel.dev/go/hegel` raises the module's go directive to 1.26, which turns on
# vet checks upstream's own node_test.go fails (a %q format with Kind and Style arguments); the
# vet failure would otherwise stop the package from building.
command = "go test -count=1 -vet=off -v ."
setup = ["python3 -c 'import yaml'"]

[expected_failures]
TestHegelCanonicalOutputKeepsScalarTypes = "yaml/1"
TestHegelStringsWhoseFirstContentLineStartsWithASpaceRoundTrip = "yaml/2"
TestHegelLeadingSpaceMultilineStringsInSequencesAreReadableAtEveryIndent = "yaml/3"
TestHegelUniqueKeysCompareResolvedValues = "yaml/4"
TestHegelAPlainMergeIndicatorAsAValueIsAString = "yaml/5"
TestHegelOptsYAMLAcceptsTheDocumentedQuotePreferenceField = "yaml/6"
TestHegelNegativeZeroIsAnInteger = "yaml/7"
TestHegelTimestampsTheEncoderWritesAreReadable = "yaml/8"
TestHegelNumericLiteralsIntoDurationFieldsAreConsistent = "yaml/9"
TestHegelPointerToNodeTargetsReceiveTheNode = "yaml/10"
TestHegelAnEmptyDocumentStreamCanBeDumped = "yaml/11"
TestHegelIndentThreeWithCompactSequencesWritesReadableNestedSequences = "yaml/12"
TestHegelStringsWhoseFirstContentLineStartsWithATabRoundTrip = "yaml/13"
TestHegelNullNodesWithAnEmptyValueStayNullInFlowStyle = "yaml/14"
TestHegelDumpLeavesTheInputNodeUnchanged = "yaml/15"
