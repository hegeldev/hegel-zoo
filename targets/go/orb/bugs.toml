[[bug]]
id = "orb/1"
title = "wkt.Unmarshal fails on a GEOMETRYCOLLECTION with a space after a comma or before its parenthesis, on a nested collection and on an EMPTY member, and drops a trailing EMPTY member"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWKTCollectionMembers"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
splitGeometryCollection cuts the text after "GEOMETRYCOLLECTION" into members by scanning for
the first letter after a "(" and taking what came before it, minus one character, as the
previous member. So "GEOMETRYCOLLECTION(POINT(1 2), LINESTRING(3 4,5 6))" fails with ErrNotWKT
(the member becomes "POINT(1 2)," minus one character... with the space the cut lands wrong),
"GEOMETRYCOLLECTION (POINT (1 2))" fails with ErrUnsupportedGeometry (the leading " " becomes a
member of its own), a nested "GEOMETRYCOLLECTION(POINT(1 2),GEOMETRYCOLLECTION(POINT(3 4)))"
fails, "GEOMETRYCOLLECTION(MULTIPOINT EMPTY,POINT(1 2))" fails, and
"GEOMETRYCOLLECTION(POINT(1 2),MULTIPOINT EMPTY)" and "GEOMETRYCOLLECTION(LINESTRING EMPTY)"
parse to collections without the empty member. The text GEOS, PostGIS (with spaces) and orb's
own Marshal (for a Collection with an empty member) write is therefore not read back. A
truncated "GEOMETRYCOLLECTION(GEOMETRYCOLLECTION EMPTY," parses too. Found by the WKT property
(orb's text against shapely's text and whitespace variants). Fix: split members by tracking
parenthesis depth, and parse "EMPTY" members.
'''

[[bug]]
id = "orb/2"
title = "wkt.Unmarshal rejects a run of two spaces between coordinates or before EMPTY, though WKT allows any whitespace between tokens"
kind = "spec"
severity = "low"
test = "TestHegelPinWKTWhitespace"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parsePoint splits a point on the first single space (cut(s, " ")) and ParseFloat fails on the
" 2" that "1  2" leaves (a tab between the coordinates, "3\t4", fails the same way); the EMPTY
forms are matched with EqualFold against the exact text "MULTIPOINT EMPTY". So "POINT(1  2)",
"LINESTRING(1 2,3  4)", "POLYGON((0 0,1 0,1  1,0 0))", "MULTIPOINT((1 2),(3\t4))" and
"MULTIPOINT  EMPTY" are ErrNotWKT, while "POINT (1 2)", " POINT(1 2) " and tabs after commas
are accepted (the comma splitter skips runs of spaces, tabs and newlines). The WKT grammar
(OGC 06-103r4, 7.2) separates tokens by any whitespace. Found by the WKT property's
double-space variant. Fix: trim and split on strings.Fields, or skip whitespace runs in
parsePoint as splitOnComma does.
'''

[[bug]]
id = "orb/3"
title = "Bound.Union and Bound.Extend on an empty bound mix its placeholder coordinates into the result, so Bound() of a Collection, MultiLineString or MultiPolygon whose first part is empty is wrong"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnionOfEmptyBound"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
An empty geometry's Bound() is emptyBound = {Min: (1, 1), Max: (-1, -1)}. Union checks only
whether the argument is empty and Extend takes min/max with the receiver's coordinates, so on
an empty receiver the 1 and -1 leak: emptyBound.Union({5 5}-{6 6}) is {1 1}-{6 6},
emptyBound.Extend((5, 5)) is {1 1}-{5 5}, emptyBound.Extend((-3, -3)) is {-3 -3}-{-1 -1}. The
Bound() methods of Collection, MultiLineString and MultiPolygon start from the first part's
bound and Union the rest, so Collection{MultiPoint{}, Point{5, 5}}.Bound() is {1 1}-{5 5},
Collection{LineString{}, Point{-3, -3}}.Bound() is {-3 -3}-{-1 -1} (a box that does not contain
the point), MultiLineString{{}, {{-10 -1} {1 -2}}}.Bound() is {-10 -2}-{1 -1}. Found by the
bounds property (the box of the coordinates, shapely agreeing). Fix: Union and Extend return
the argument's bound when the receiver is empty (Extend: {p, p}).
'''

[[bug]]
id = "orb/4"
title = "Bound.IsEmpty is documented to be true for a bound of zero area but is true only when Min exceeds Max"
kind = "spec"
severity = "low"
test = "TestHegelPinIsEmptyZeroArea"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The doc comment: "IsEmpty returns true if it contains zero area or if it's in some malformed
negative state where the left point is larger than the right." The code is
b.Min[0] > b.Max[0] || b.Min[1] > b.Max[1], so a point's bound ({1 1}-{1 1}) and a segment's
({1 1}-{1 5}) are not empty. The code's reading is the one the rest of orb relies on
(clip.Geometry of a Point checks Intersects on the point's bound; Collection.Bound treats
Min > Max as the empty case), so the comment is the defect. Found while modelling the bounds
property from the doc comments.
'''

[[bug]]
id = "orb/5"
title = "maptile.At gives an invalid tile (X = 2^zoom) at longitude 180, though it is documented to create a valid tile for the zoom"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTileAtLongitude180"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
At's comment: "Will create a valid tile for the zoom. Points outside the range lat [-85.0511,
85.0511] will be snapped to the max or min tile as appropriate." Fraction clamps the latitude
but not the longitude: (lon/360 + 0.5) * 2^z is 2^z at lon = 180, so At(Point{180, 0}, z) is
Tile{2^z, 2^z/2, z} with Valid() false (At(Point{-180, 0}, z) is X = 0, valid). Longitude 180
is a valid coordinate (the antimeridian, GeoJSON's range is [-180, 180]). tilecover.Bound of
a bound whose Max longitude is 180 lists those invalid tiles as well (a column of X = 2^z).
Found by the maptile property. Fix: clamp x to 2^z - 1 (mercantile's tile() does).
'''

[[bug]]
id = "orb/6"
title = "planar.PolygonContains and MultiPolygonContains return false for a point on the boundary of a hole, though points on the boundary are documented as in"
kind = "contract"
severity = "low"
test = "TestHegelPinHoleBoundaryContained"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
"PolygonContains checks if the point is within the polygon. Points on the boundary are
considered in." The code returns false when RingContains(hole, point) is true, and
RingContains counts the hole's boundary as inside the hole; so for the square {0 0}-{10 10}
with the hole {2 2}-{4 4}, PolygonContains(poly, (2, 3)) is false while PolygonContains(poly,
(0, 3)) (outer boundary) is true. The hole's boundary is part of the polygon's boundary
(shapely's covers is true there). Found by the planar property (points on hole edges against
shapely's covers). Fix: RingContains returning a third state for "on the boundary", or a
separate on-boundary test before the hole exclusion.
'''

[[bug]]
id = "orb/7"
title = "resample.ToInterval panics on an empty line string (makeslice: len out of range), where Resample returns it"
kind = "panic"
severity = "low"
test = "TestHegelPinToIntervalEmpty"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Resample checks the edge cases (fewer than two points, all points equal) before computing
segment distances; ToInterval computes them first, and precomputeDistances allocates
make([]float64, len(ls)-1), which panics for len 0. ToInterval(orb.LineString{}, planar.Distance,
1) crashes; a one-point line string is fine (an empty distance slice). Found by the resample
property. Fix: check the edge cases first, as Resample does.
'''

[[bug]]
id = "orb/8"
title = "wkt.Marshal writes () for an empty ring or an empty member line string, which is not WKT and which Unmarshal rejects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyPartWKT"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Marshal writes EMPTY for an empty top-level geometry (MULTIPOINT EMPTY, POLYGON EMPTY), but
writeLineString writes "()" for an empty ring or line string inside a polygon or multi
linestring: Marshal(orb.Ring{}) is "POLYGON(())", Marshal(orb.MultiLineString{{}, {{0 0} {1 1}}})
is "MULTILINESTRING((),(0 0,1 1))". The WKT grammar has EMPTY for such parts ("MULTILINESTRING
(EMPTY, (0 0, 1 1))" is what GEOS writes); orb's own Unmarshal rejects the "()" text with
ErrNotWKT and shapely with a ParseException. Found by the WKT round-trip property. (The WKB
encoder writes a ring or line of zero points for the same inputs, which shapely reads as
POLYGON EMPTY / an EMPTY member; the WKB property skips only the Polygon{Ring{}} case.)
'''

[[bug]]
id = "orb/9"
title = "geojson.NewGeometry of an empty Collection marshals to null, and UnmarshalGeometry of a collection with a null member panics"
kind = "panic"
severity = "medium"
test = "TestHegelPinEmptyCollectionGeoJSON"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NewGeometry sets Coordinates for the simple types and Geometries for a Collection; for an
empty Collection both stay nil and MarshalJSON writes null, so json.Marshal(
geojson.NewGeometry(orb.Collection{})) is "null" (not the GeoJSON {"type":"GeometryCollection",
"geometries":[]}), UnmarshalGeometry of it fails with "geojson: invalid geometry", and a
Collection{Point{1 2}, Collection{}} marshals to {"type":"GeometryCollection","geometries":
[{"type":"Point","coordinates":[1,2]},null]}. Reading that back, or any document whose
"geometries" holds a null, panics: UnmarshalJSON assigns the decoded []*Geometry (with a nil
entry) and calls g.Geometry(), which dereferences each member. A feature whose geometry is an
empty collection writes "geometry":null and reads back as a feature without geometry. Found by
the GeoJSON round-trip and feature-collection properties. Fix: NewGeometry sets Type for an
empty collection and MarshalJSON writes "geometries":[]; UnmarshalJSON rejects null members.
'''

[[bug]]
id = "orb/10"
title = "A GeoJSON position with fewer than two numbers is accepted as a point with zero coordinates"
kind = "contract"
severity = "low"
test = "TestHegelPinShortPosition"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
orb.Point's UnmarshalJSON decodes the array into a [2]float64 without checking its length:
{"type":"Point","coordinates":[]} is Point{0, 0}, {"type":"Point","coordinates":[1]} is
Point{1, 0}, {"type":"LineString","coordinates":[[1,2],[3]]} is LineString{{1 2} {3 0}}. RFC
7946 3.1.1: "A position is an array of numbers. There MUST be two or more elements." A
document with a broken position is read as a geometry at the origin or on an axis instead of
being rejected (extra elements, an altitude, are dropped, which is orb's documented 2D
choice). Found while writing the GeoJSON property. Fix: an error for len < 2.
'''

[[bug]]
id = "orb/11"
title = "planar.CentroidArea of a zero-area Ring returns its first point, while the same ring in a Polygon gets the centroid of its boundary"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinDegenerateRingCentroid"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ringCentroidArea returns (r[0], 0) when the shoelace area is zero; polygonCentroidArea falls
back to lineStringCentroidDist for a zero-area outer ring (the centroid of the boundary, which
is what GEOS computes for a degenerate polygon). So CentroidArea(orb.Ring{{0 0} {0 10} {0 0}})
is (0 0) while CentroidArea(orb.Polygon{that ring}) is (0 5), and a degenerate Bound
({0 0}-{0 10}, whose CentroidArea goes through ToRing) gives its Min. Found by the planar
property (centroids against shapely). Fix: the Ring case falls back like the Polygon case.
'''

[[bug]]
id = "orb/12"
title = "planar.CentroidArea of a Collection of points or lines (or with only empty polygons) returns the origin"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCollectionCentroid"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
collectionCentroidArea keeps the members of the highest dimension and weights their centroids
by their areas; points and lines have area 0, so the weighted sum is (0, 0) and the total area
0 returns orb.Point{}: CentroidArea(orb.Collection{orb.Point{3, 4}}) is (0 0),
CentroidArea(orb.Collection{orb.LineString{{0 0} {10 0}}}) is (0 0), and so is a collection
whose only polygons are empty beside points. The MultiPoint and MultiLineString cases weight by
count and by length; GEOS does the same for collections. Found by the planar property
(centroids against shapely). Fix: weight by count for dimension 0 and by length for dimension
1, as the multi types do.
'''

[[bug]]
id = "orb/13"
title = "simplify.VisvalingamKeep(1) panics (nil pointer) on any line string or ring of three or more points"
kind = "panic"
severity = "medium"
test = "TestHegelPinVisvalingamKeepOne"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
VisvalingamKeep sets the threshold to math.MaxFloat64, which the simplifier doubles to +Inf.
The removal loop stops when the popped triangle's area is above the threshold or when
len - removed <= toKeep; the end points carry area +Inf, which is not above +Inf, so with
toKeep = 1 the loop pops an end point once only the two ends remain, and "previous.next =
current.next" dereferences the nil neighbour. VisvalingamKeep(1).LineString(orb.LineString{{0 0}
{1 1} {2 0}}) and .Ring(...) crash; 2 and above work, 0 means the documented minimum. The doc
comment says the algorithm removes points "until we're down to minPointsToKeep", which for 1
can only mean the two ends. Found by the simplify property. Fix: never pop an end (area +Inf
breaks the loop), or clamp toKeep to 2.
'''

[[bug]]
id = "orb/14"
title = "quadtree.KNearest with k = 0 panics (index out of range) on a tree holding a point"
kind = "panic"
severity = "low"
test = "TestHegelPinKNearestZero"
found = { commit = "a12a48ea0c2bcfdea706cc1ab274c735cbc68939", version = "v0.13.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
nearestVisitor.Visit pushes the visited point and, when the heap has more than k elements,
pops one and reads v.maxHeap[0] to tighten the search radius; with k = 0 the heap is empty
after the pop and the read panics. KNearest(nil, p, 0) and KNearestMatching(nil, p, 0, f) on a
tree with at least one point crash; on an empty tree they return nil. "KNearest returns k
closest Value/Pointer": zero of them is an empty result. Found by the quadtree property. Fix:
return early for k <= 0, or guard the read.
'''
