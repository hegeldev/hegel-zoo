[[bug]]
id = "casbin/1"
title = "ClearPolicy removes the rules but keeps the role links, so cleared roles still grant access"
kind = "correctness"
severity = "medium"
test = "TestHegelPinClearPolicyClearsRoleLinks"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Enforcer.ClearPolicy calls model.ClearPolicy, which empties the p and g rule lists, and nothing
else: the role managers built from the g rules keep every link. After AddGroupingPolicy(alice,
admin); ClearPolicy(); AddPolicy(admin, data1, read), GetImplicitRolesForUser(alice) is still
[admin] and Enforce(alice, data1, read) is true, though the grouping policy is empty. The
documentation says "ClearPolicy clears all policy"; LoadPolicy, by contrast, rebuilds the role
links. Found by the mutation property: after a ClearPolicy every later decision through a role
disagreed with the model. Fix: clear (or rebuild) e.rmMap and e.condRmMap in ClearPolicy.
'''

[[bug]]
id = "casbin/2"
title = "UpdatePolicy, UpdatePolicies and UpdateGroupingPolicy to a rule that already exists leave the policy holding it twice"
kind = "correctness"
severity = "medium"
test = "TestHegelPinUpdatePolicyToExistingRuleKeepsOneCopy"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Model.UpdatePolicy looks the old rule up in PolicyMap, writes the new rule over it in Policy and
points PolicyMap at that index, without checking whether the new rule is already present. With
the rules (alice, data1, read) and (bob, data1, read), UpdatePolicy([alice data1 read], [bob
data1 read]) returns true and GetPolicy is [bob,data1,read | bob,data1,read]; the same happens
through UpdatePolicies and UpdateGroupingPolicy (the grouping policy then holds a link twice).
AddPolicy refuses a duplicate ("if the rule already exists, the function returns false and the
rule will not be added"), so the policy is meant to be a set. From then on PolicyMap and Policy
disagree: RemovePolicy removes one copy and forgets the key, so HasPolicy says false while the
other copy is still enforced. Fix: return false (or remove the old rule) when the new rule
exists.
'''

[[bug]]
id = "casbin/3"
title = "UpdateFilteredPolicies without an updatable adapter adds the new rules, removes none and returns false"
kind = "contract"
severity = "medium"
test = "TestHegelPinUpdateFilteredPoliciesRemovesOldRules"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
updateFilteredPoliciesWithoutNotify gets the list of old rules from the adapter's
UpdateFilteredPolicies only; with no adapter, or with the file adapter (whose method returns
"not implemented", an error the code deliberately ignores), oldRules stays nil. It then removes
nothing, adds the new rules to the model all the same, and returns an empty list, which the
caller turns into false. With the policy [alice,data1,read], UpdateFilteredPolicies([[bob data2
write]], 0, "alice") returns false and leaves [alice,data1,read | bob,data2,write]. The
documentation: "UpdateFilteredPolicies deletes old rules and adds new rules". Fix: compute the
old rules from the model (model.GetFilteredPolicy) when the adapter does not supply them, and
remove them.
'''

[[bug]]
id = "casbin/4"
title = "GetAllDomains keeps listing a domain after its last role link was removed"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRemovedLinksLeaveGetAllDomains"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DomainManager creates a per-domain role manager on AddLink and DeleteLink and never removes it
(only DeleteDomain does); GetAllDomains lists the keys of that map. AddGroupingPolicy(alice,
admin, dom1); RemoveGroupingPolicy(alice, admin, dom1); GetAllDomains() is [dom1] with an
empty grouping policy, and stays so through DeleteRolesForUser, DeleteRole and
DeleteAllUsersByDomain. Found by the mutation property. Fix: drop a domain's role manager when
it holds no links, or derive GetAllDomains from the g rules.
'''

[[bug]]
id = "casbin/5"
title = "DeleteUser fails with missing required section g on a model without a role definition"
kind = "contract"
severity = "low"
test = "TestHegelPinDeleteUserWithoutRoleDefinition"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DeleteUser first calls RemoveFilteredGroupingPolicy(0, user), which returns the error "missing
required section g" when the model has no [role_definition], and DeleteUser returns that error
before removing the user's p rules. With the basic ACL model and the rule (alice, data1, read),
DeleteUser("alice") returns (false, error) and the rule stays. The documentation: "DeleteUser
deletes a user. Returns false if the user does not exist (aka not affected)". Fix: skip the
grouping step when the model has no g section (as GetImplicitUsersForPermission and others do).
'''

[[bug]]
id = "casbin/6"
title = "Trailing whitespace of a rule's last field is lost by a save and load through the file adapter"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinTrailingSpaceSurvivesFileRoundTrip"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
persist.PolicyLineToCsv lets encoding/csv decide on quoting, which quotes a field for a leading
space but not for a trailing one, and the file adapter's loader (and the string adapter's) does
strings.TrimSpace on every line before parsing it. A rule (alice, data1, "read ") is written as
`p, alice, data1, read ` and read back as (alice, data1, "read"); a trailing space in any other
field survives (the reader only trims leading space). Fix: quote fields with trailing
whitespace, or trim only the line terminator.
'''

[[bug]]
id = "casbin/7"
title = "AddGroupingPolicy accepts a role cycle that LoadPolicy rejects, so the saved policy cannot be loaded"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinAcceptedRoleCycleLoadsBack"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Since the default detector was added, LoadPolicy runs RunDetections and fails with "cycle
detected" on a role hierarchy with a cycle (a self link `g, admin, admin` included), but the
management API does not run it: AddGroupingPolicy(admin, admin) returns true, Enforce works, and
SavePolicy writes the link. A new enforcer on that file (or the same enforcer's LoadPolicy)
fails with "cycle detected: admin -> admin", so a policy the API built cannot be reloaded. Fix:
run the detectors after incremental link changes too (and roll the change back), or make the
load-time check a warning.
'''

[[bug]]
id = "casbin/8"
title = "The string adapter cannot load the empty policy it saved"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinStringAdapterLoadsEmptyPolicy"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
stringadapter.SavePolicy on a model without rules sets Line to ""; LoadPolicy then returns
"invalid line, line cannot be empty", so NewEnforcer(model, adapter) fails on a policy that was
saved a moment before. The file adapter loads an empty file without complaint. Fix: treat an
empty Line as an empty policy.
'''

[[bug]]
id = "casbin/9"
title = "Model.ToText writes the definitions of a section in map order, so the text of one model differs between calls"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinModelToTextIsStable"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ToText ranges over model[sec], a map keyed by g, g2, ... (and p, p2, ...), so a model with two
role definitions is written as `g = _, _, _` then `g2 = _, _` on one call and the other way
round on the next. The text loads back either way, but it cannot be compared or stored
reproducibly. Fix: sort the keys (g before g2 before g3).
'''

[[bug]]
id = "casbin/10"
title = "GetDomainsForUser lists the empty domain for every name when the model has a domain-less second role definition"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDomainsForUserWithoutLinksIsEmpty"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GetDomainsForUser concatenates GetDomains(user) over every role manager. RoleManagerImpl (the
manager of a two-token definition such as `g2 = _, _`) returns []string{defaultDomain}, that is
[""], for any name, whether it has links or not. In an RBAC-with-domains model that also has a
resource-role definition g2, GetDomainsForUser("nobody") is [""] and GetDomainsForUser(alice)
lists "" beside her real domains. Fix: return no domains from a role manager that has no
domain concept, or skip such managers in GetDomainsForUser.
'''

[[bug]]
id = "casbin/11"
title = "GetImplicitUsersForResourceByDomain returns the rules of user subjects from every domain"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUsersForResourceByDomainRespectsDomain"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The function filters the p rules by object, and compares the rule's domain with the requested
one only in the branch where the subject is a role; a rule whose subject is not a role (in that
domain) is returned whatever its domain. With the single rule (alice, dom1, data1, read),
GetImplicitUsersForResourceByDomain("data1", "dom2") returns [[alice dom1 data1 read]]. The
documentation: "Compared to GetImplicitUsersForResource, domain is supported". Fix: skip rules
whose domain field differs before looking at the subject.
'''

[[bug]]
id = "casbin/12"
title = "GetImplicitUsersForResource expands a role to its direct users only, returning roles and missing users lower in the hierarchy"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUsersForResourceFollowsHierarchy"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GetNamedImplicitUsersForResource replaces a role subject by rm.GetUsers(sub), the direct users
of the role, not GetImplicitUsers. With (p, admin, data1, read), (g, alice, manager), (g,
manager, admin), GetImplicitUsersForResource("data1") is [[manager data1 read]]: the
intermediate role is returned as a user and alice, who has the access, is missing. The
documentation says "only users will be returned, roles (2nd arg in "g") will be excluded".
GetImplicitUsersForResourceByDomain has the same shape. Fix: use the implicit users and drop
those that are roles.
'''

[[bug]]
id = "casbin/13"
title = "keyMatch3, keyMatch4 and keyMatch5 read two placeholders in one path segment as a single one"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinKeyMatch3TwoPlaceholders"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The regexp that turns {name} into [^/]+ is `\{[^/]+\}` for keyMatch3 and keyMatch5 and
`{([^/]+)}` for keyMatch4: greedy, so in the pattern segment `{p}_{q}` it matches from the first
`{` to the last `}` and the whole segment becomes one [^/]+. KeyMatch3("/a/xy", "/a/{p}_{q}") is
true though the segment has no underscore, and keyMatch4 cannot compare the two names. KeyGet3
uses the non-greedy `\{[^/]+?\}` precisely "to support multiple {} in /.../", so the matchers and
the getter read the same pattern differently, and a policy object such as
`/projects/{org}_{repo}/issues` matches paths it should not. Fix: use the non-greedy form in
the matchers as well.
'''

[[bug]]
id = "casbin/14"
title = "Rules are keyed by their fields joined with a comma, so two rules that differ only in where a comma-bearing field is split are one rule"
kind = "correctness"
severity = "medium"
test = "TestHegelPinCommaFieldsKeepRulesApart"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PolicyMap, which HasPolicy, AddPolicy, RemovePolicy and UpdatePolicy consult, is keyed by
strings.Join(rule, ","). The rules ("x,y", "z", "read") and ("x", "y,z", "read") share the key
"x,y,z,read": after the first is added, AddPolicy of the second returns false and HasPolicy of
the second is true, RemovePolicy of the second removes the first. Commas in fields are legal:
the CSV writer quotes them and the loader reads them back. Fix: join with a separator that
cannot occur in a field (a NUL byte, or length-prefixed fields).
'''

[[bug]]
id = "casbin/15"
title = "GetImplicitPermissionsForUser returns nothing on a policy with an explicit priority field"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinImplicitPermissionsWithPriorityField"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GetNamedImplicitPermissionsForUser tests policyRoles[rule[0]], taking the subject from field 0
of every p rule, while the documented explicit-priority model (examples/priority_model_explicit
.conf) has `p = priority, sub, obj, act, eft`. With (p, 1, admin, data1, read, allow) and (g,
alice, admin), GetImplicitPermissionsForUser("alice") is [], and so is
GetImplicitPermissionsForUser("admin"). GetPermissionsForUser, which uses GetFieldIndex(ptype,
"sub"), gets it right. Fix: use the subject index from GetFieldIndex.
'''

[[bug]]
id = "casbin/16"
title = "GetAllUsersByDomain returns the priorities as users on a policy with an explicit priority field"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAllUsersByDomainWithPriorityField"
found = { commit = "524f3f2dc9baef696d748db491d49b3055d359d1", version = "v3.11.0+ (master, 2026-09-11)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GetAllUsersByDomain collects policy[0] of every p rule whose domain field (found by name) is the
requested domain. With `p = priority, sub, dom, obj, act, eft` and the rule (1, alice, dom1,
data1, read, allow), GetAllUsersByDomain("dom1") is ["1"]. DeleteAllUsersByDomain, built the
same way, deletes the right rules because it filters on the domain only. Fix: read the subject
at GetFieldIndex(ptype, "sub").
'''
