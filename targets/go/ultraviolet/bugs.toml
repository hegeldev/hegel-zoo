keycap emoji "1️⃣" — arrive as a letter or digit followed by key presses for the combining
marks, while "ก้" or "👍🏽" arrive as one key. Inherited from x/input (x-input/6).
'''

[[bug]]
id = "ultraviolet/10"
title = "A CSI sequence with more than 32 parameters is cut short and its tail comes back as key presses"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCSIWithManyParametersLeaksItsTail"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseCsi` stops scanning parameter bytes once `paramsLen` reaches `parser.MaxParamsSize`
(32); the next parameter byte is not a valid final byte, so the function returns
`UnknownEvent` for the bytes so far, and the remaining digits, semicolons and the real final
byte are decoded as text ("1", ";", "1", "A" for a 33-parameter `CSI … A`). x/ansi's own
parser drops the extra parameters and still finds the final byte. Inherited from x/input
(x-input/8).
'''

[[bug]]
id = "ultraviolet/11"
title = "LegacyKeyEncoding.CtrlOpenBracket(true) never produces ctrl+[: Decode short-circuits a lone ESC and the table is consulted only for longer reads"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCtrlOpenBracketNeverFires"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseControl` maps ESC to ctrl+[ under `flagCtrlOpenBracket`, and `buildKeysTable` puts
ctrl+[ in the table for "\x1b" — but `Decode` returns `KeyPressEvent{Code: KeyEscape}` for a
one-byte buffer before `parseControl` is reached (and the ESC-prefix path handles two-byte
buffers), and `scanEvents` looks a read up in the table only when it is longer than two bytes.
So the flag documented as "maps 0x1B [ansi.ESC] to the escape key instead of ctrl+[" cannot
be turned the other way: no input ever yields ctrl+[. The same unreachable-table shape makes
every one- or two-byte table entry dead. Sharper form of x-input/9.
'''

[[bug]]
id = "ultraviolet/12"
title = "Terminfo keys the decoder also recognises are honoured only when the key arrives alone"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTerminfoKeysOnlyHonouredAlone"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With terminfo keys enabled, `scanEvents` looks the whole read buffer up in the key table
(built-in keys plus the terminal's terminfo keys) and only otherwise runs the decoder, which
knows nothing of terminfo and consults the table just for `UnknownEvent`s. A terminfo
sequence the decoder also recognises therefore means one thing alone and another with
company: tmux's and xterm's `kf48` is `CSI 24;6~` — with `FKeys(true)`, f48 when the read
holds just that sequence, ctrl+shift+f12 when anything follows it in the same read (fast
typing, pasted text, a mouse report). The `UseTerminfoKeys` documentation ("more accurate
key mappings for legacy non-xterm like terminals") describes the table only. Inherited from
x/input (x-input/10).
'''

[[bug]]
id = "ultraviolet/13"
title = "alt+O, alt+P and alt+X (ESC followed by an introducer byte) lack ShiftedCode, unlike every other alt+uppercase letter"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAltIntroducerKeysLackShiftedCode"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`ESC x` for an uppercase letter is decoded through `parseUtf8` and gives
`Code lower, ShiftedCode upper, Mod shift|alt`. The bytes that introduce SS3, DCS and SOS
