[[bug]]
id = "ultraviolet/35"
title = "TerminalReader panics on a CSI with 33 or more parameters: the scanner runs every read through x/ansi's DecodeSequence, which indexes past its 32 parameters"
kind = "panic"
severity = "medium"
test = "TestHegelPinScannerPanicsOnCSIWithManyParameters"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-26" }
status = "open"
notes = '''
`uv.NewTerminalReader(bytes.NewReader(seq), "xterm").StreamEvents(ctx, ch)` with
`seq = "\x1b[" + strings.Repeat("1;", 32) + "1z"` (33 parameters, an unknown final byte) panics
with `runtime error: index out of range [32] with length 32`; 32 parameters give one
UnknownCsiEvent. `eventScanner.scanEvents` (terminal_reader.go) hands every read to
`deserializeWin32Input`, which walks the buffer with `ansi.DecodeSequence(buf, state, p)`
(charmbracelet/x/ansi v0.11.8) to pick out Win32 input records; that parser's parameter store
holds 32 entries and the decoder indexes the 33rd, so the panic is x/ansi's, reached on every
platform and for every read, whether or not Win32 input mode is on. `EventDecoder.Decode` on the
same bytes does not panic: its own parser stops at 32 parameters and leaks the tail as key
presses (ultraviolet/10), so the decoder properties reach ultraviolet/10 where the scanner
properties reach this one. A terminal or a program writing to the terminal's input can send such
a sequence; a program built on `Terminal` or `TerminalReader` then dies in its read loop. Found by
the stream property once its CSIs drew up to 40 parameters (the rewrite of 2026-09-26 had gated
the scanner's CSIs at 32 as a candidate); reproduced standalone through the public API.
'''
