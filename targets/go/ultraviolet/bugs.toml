[[bug]]
id = "ultraviolet/23"
title = "InsertLineArea and DeleteLineArea tear a wide cell straddling the area's edge (head without placeholder, or the reverse)"
kind = "silent-corruption"
severity = "low"
test = "TestHegelPinLineShiftsCutWideCellsAtTheAreaEdge"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The line shifts copy the cells inside [area.Min.X, area.Max.X) row by row as they are. A wide
cell with its head inside and its placeholder outside (or the reverse) is copied in half: the
destination row gets a width-2 head followed by whatever it already held there, or a
placeholder with no head. A terminal erases a multi-column character it can only move in
part. Found by TestHegelBufferFollowsTheGridModel (gate line-shift-cuts-wide).
'''

