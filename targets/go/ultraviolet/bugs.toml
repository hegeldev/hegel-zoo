[[bug]]
id = "ultraviolet/25"
title = "The scroll optimisation moves a row the new frame did not touch and never paints it back: the terminal shows a blank where the frame has the row"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinScrollOptimisationSkipsAnUntouchedRow"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
scrollOptimize's hash map (growHunks) extends a matched shift to the rows between hunks, so
the scroll region can contain a row whose content is the same in both frames. Two frames on a
2×6 screen: `#` at row 2 and `0` at row 3, then `x`,`y`,`9` at rows 0–2, `0` at row 3 again
(RenderBuffer.SetCell leaves an unchanged cell untouched) and a linked `#` at row 4. The
renderer emits `CSI 1;5 r CSI H CSI 2 T CSI 1;6 r` (scroll rows 0–4 down by two, moving `0`
from row 3 to row 5, out of the region and lost), then transforms rows 0, 1, 2 and 4 only —
Render's loop looks at newbuf.Touched, and row 3 is untouched — so the terminal shows a blank
at row 3 (the x/vt emulator: "x\ny\n9\n\n#\n"). scrollBuffer applies the same shift to
curbuf and touches *curbuf*'s lines, which Render never consults, so the renderer's record
says row 3 is blank too and no later frame repairs it unless the application rewrites that
row. Same output for TERM=linux (RI RI instead of SD) and screen. ncurses touches the
scrolled lines of the *new* screen for exactly this reason. Found once in 20 000 random frame
sequences by TestHegelRendererDrawsWhatTheEmulatorShows (gate scroll-moved-untouched-row).
The whole-screen case (2026-09-18, CI): on a 2×5 screen, `世` at row 1 and `界` at row 2,
then `界` at row 0 and row 2 blanked (row 1 untouched) — scrollUp moves the cursor to the
bottom row and writes `CSI 2 S` (xterm, screen) or, without the SU capability (linux, vt100),
two extra LFs (`\r\n\n\n\n`), so `世` scrolls off the top and the terminal shows a blank row 1;
the gate now also recognises the LF spelling.
'''

[[bug]]
id = "ultraviolet/26"
title = "layout: the solver picks among equally good splits at random, so an over-constrained layout changes from call to call"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLayoutSolverPicksAmongTiesAtRandom"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`internal/casso` (the Cassowary port behind `layout`) keeps its tableau in Go maps and walks
them with `range` when it picks entering and leaving variables (`solver.go`: `for symbol :=
range s.tabs`), so whenever several solutions minimise the weighted error equally — every
layout whose constraints ask for more than the area holds, e.g. two `Len`s that do not both
fit — the split it returns depends on Go's randomised map iteration order. `Horizontal(Len(18),
Percent(110), Len(31)).WithFlex(FlexSpaceAround).WithSpacing(1)` on 50 cells returns
`[1..14 | 16 | 18..49]` or `[1..19 | 21 | 23..49]`, roughly half the time each (the pin defeats
the layout cache with distinct paddings over the same inner area; the internal `split` shows
the same on repeated calls). ratatui's kasuari solver is deterministic and gives the first.
The global 500-entry cache masks it within a process until an entry is evicted, after which a
frame can lay out differently from the previous one. The invariants property is unaffected;
the cache and ratatui differential properties count the over-constrained shape instead of
comparing.
'''

[[bug]]
id = "ultraviolet/27"
title = "TerminalScreen.Flush does not commit the cursor position it asks the renderer for: the move reaches the terminal with the next Render, one frame late"
kind = "contract"
severity = "medium"
test = "TestHegelPinFlushDoesNotCommitTheCursorPosition"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`SetCursorPosition` says "the changes can be committed to the underlying writer by calling
Flush". `Flush` calls `s.rend.MoveTo(x, y)`, which writes the movement into the renderer's own
buffer (`TerminalRenderer.move` → `s.buf`), and then writes the *screen's* queue (`s.buf` of
the screen) to the writer; the renderer's buffer is only written by `TerminalRenderer.Flush`,
which the screen calls from `Render`. So `SetCursorPosition(5, 1); Flush()` writes nothing, and
`Display` (Render then Flush) draws the frame first and queues the move after it: the cursor
lands where the drawing left it and jumps to the requested cell with the next frame. The same
path loses `Reset`'s final "move to the bottom of the screen" at `Terminal.Stop` (its bytes
appear only if something renders afterwards), so the shell prompt comes back wherever the
cursor was. The screen property counts the shape instead of checking the emulator's cursor.
'''

[[bug]]
id = "ultraviolet/28"
title = "Reset leaves the cursor hidden when the screen holds a hidden Cursor, so Terminal.Stop hands back a terminal without a cursor"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinResetLeavesAHiddenCursorHidden"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Reset` writes `ShowCursor` under `s.cursor == nil || !s.cursor.Hidden` — that is, when the
screen never recorded a cursor or when it is already visible — and skips it exactly when the
cursor it hid needs showing. `Restore` (called by `Terminal.Start`) hides the cursor whenever
the screen has no visible cursor, `SetCursorPosition` on a fresh screen records a hidden
Cursor, and `HideCursor` after `ShowCursor` sets `Hidden`; in all three cases `Stop`'s `Reset`
writes no `CSI ? 25 h` and the program exits with the terminal's cursor invisible. The property
runs Restore → setters → Reset and checks the terminal is at its defaults; the cursor check is
skipped for this shape.
'''

[[bug]]
id = "ultraviolet/29"
title = "SetCursorStyle and SetCursorColor create a visible Cursor, so after HideCursor they report a visible cursor and the next Flush shows it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCursorStyleShowsAHiddenCursor"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`HideCursor` writes the sequence but records nothing when `s.cursor == nil`; `SetCursorStyle`
and `SetCursorColor` then create the Cursor with `NewCursor(-1, -1)`, whose `Hidden` is false.
`CursorVisible()` flips to true without a `ShowCursor` call, and because `Flush` wraps its
output in hide/show when the cursor is "visible", the next flush ends with `CSI ? 25 h` and the
terminal's cursor appears. `SetCursorPosition` in the same situation records a hidden cursor,
as `HideCursor` implied. The property generates style and colour changes only once a Cursor
exists.
'''

