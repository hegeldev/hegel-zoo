[[bug]]
id = "ultraviolet/1"
title = "Kitty alternate keys: the base-layout key overwrites the shifted key, so shift+a types the base key"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinKittyBaseKeyOverwritesShiftedKey"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With the Kitty "report alternate keys" enhancement a key arrives as
`CSI code:shifted:base ; mod u`. `parseKittyKeyboard` (decoder.go) handles the third
sub-parameter in `case 2`, sets `key.BaseCode`, and then `fallthrough`s into `case 1`, which
sets `key.ShiftedCode` from the *same* parameter — the base key. For shift+a on an AZERTY
keyboard, `CSI 97:65:113;2u`, the event has `ShiftedCode = 'q'`, and because the text of a
shifted key is taken from `ShiftedCode`, `Text = "q"`: the program receives "q" where the user
typed "A". Every non-US layout is affected whenever the terminal reports alternate keys.
Inherited from charmbracelet/x/input (x-input/1), same code.
'''

[[bug]]
id = "ultraviolet/2"
title = "TerminalReader.Legacy and TerminalReader.UseTerminfo have no effect: the scanner copies the decoder and builds the key table in NewTerminalReader"
kind = "contract"
severity = "high"
test = "TestHegelPinTerminalReaderOptionsAreIgnored"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NewTerminalReader(r, term)` documents "Use [TerminalReader.UseTerminfo] to use Terminfo
defined key sequences. Use [TerminalReader.Legacy] to control legacy key encoding behavior."
Both are fields of the embedded `EventDecoder`, so they can only be set after the constructor
returns — but the constructor has already built the key table
(`buildKeysTable(d.Legacy, d.term, d.UseTerminfo)` with the zero values) and copied the zero
decoder into the scanner (`evs.EventDecoder = d.EventDecoder`), which is what `StreamEvents`
runs. A reader with `Legacy = LegacyKeyEncoding(0).CtrlI(true).CtrlM(true).Backspace(true)`
still reports tab, enter and backspace for `\t`, `\r`, DEL, and `UseTerminfo = true` never
loads a terminfo entry. `Terminal.Start` has the same shape from the other side: it builds the
key table from `TerminalOptions.LegacyKeyEncoding` but never sets the scanner's decoder, so
the options that only the decoder honours (CtrlAt, CtrlI, CtrlM, CtrlOpenBracket, Backspace —
single bytes the table is not consulted for) are dead there too.
'''

[[bug]]
id = "ultraviolet/3"
title = "An X10 mouse report cut before its payload by a read boundary is returned as UnknownCsiEvent and its payload as key presses"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinX10MouseSplitAcrossReadsIsLost"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`scanEvents` waits for the next read when `Decode` returns an `UnknownEvent` before the escape
timeout (an incomplete CSI, OSC, DCS or UTF-8 sequence). `parseCsi`'s X10 branch, however,
returns `UnknownCsiEvent` when fewer than three bytes follow `CSI M`, and the scanner treats
that as a complete unknown sequence: the three bytes are consumed as `UnknownCsiEvent("\x1b[M")`
and the payload that arrives in the next read is decoded as text — a click at (10, 20) becomes
`UnknownCsiEvent` plus the key presses " ", "+", "5". Every other incomplete sequence survives
a read boundary; X10 reports (still the default mouse encoding of several terminals) do not.
'''

[[bug]]
id = "ultraviolet/4"
title = "Keystroke() prints the base-layout key but MatchString compares Code, so keys on non-US layouts never match their own keystroke"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMatchStringIgnoresTheBaseKey"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Key.Keystroke` documents: "If a [Key.BaseCode] is present, use it to represent a key using the
standard PC-101 key layout", so ctrl + the 'a' key of an AZERTY keyboard (Kitty
`CSI 97:65:113;5u`, base 'q') prints "ctrl+q". `keyMatchString` parses "ctrl+q" into
`Code 'q'` and compares it with `k.Code` ('a') only; `BaseCode` is never consulted, and the
text fallback does not apply to a ctrl chord. So `k.MatchString(k.Keystroke())` is false, a
binding written as "ctrl+q" (the documented layout-independent form) fires only on US
layouts, and `switch ev.Keystroke()` and `ev.MatchString(...)` disagree on the same event.
'''

[[bug]]
id = "ultraviolet/5"
title = "MatchString splits on '+', so the '+' key (and ctrl++, alt++, kp+) cannot be matched by string"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlusKeyCannotBeMatched"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`keyMatchString` does `strings.Split(s, "+")` and treats every part as a modifier or key name.
For the '+' key `Keystroke()` and `String()` return "+", which splits into two empty parts: no
code, no text, no match. "ctrl++" (`CSI 43;5u`) splits into "ctrl", "", "" and matches
nothing either. The only key whose own name cannot be matched, and a common binding (zoom,
increment). `MatchString("plus")` is not an alternative: "plus" is the keypad plus.
'''

[[bug]]
id = "ultraviolet/6"
title = "Lock modifiers are part of MatchString's exact modifier comparison, so caps lock or num lock breaks every binding under the Kitty protocol"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLockModifiersBreakBindings"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The Kitty keyboard protocol reports caps lock (64) and num lock (128) as modifier bits on
every non-text key event (arrows, function keys, ctrl chords). `keyMatchString` requires
`k.Mod == mod`, where `mod` is built from the string, so with caps lock on `CSI 97;69u`
(ctrl+a, caps lock) does not match "ctrl+a", and `CSI 57352;129u` (up arrow, num lock) does
not match "up" — although `Keystroke()` prints exactly "ctrl+a" and "up", since it never
prints lock modifiers. A user who leaves num lock on (the default on most PC keyboards) loses
every key binding of a Bubble Tea v2 program in kitty, foot, WezTerm or Ghostty. The text
fallback rescues plain letters only.
'''

[[bug]]
id = "ultraviolet/7"
title = "Keystroke() omits a modifier key's own modifier, so modifier key events do not match their keystroke"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinModifierKeysDoNotMatchTheirKeystroke"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Keystroke` skips "shift+" when `Code` is `KeyLeftShift`/`KeyRightShift` (and likewise for
ctrl, alt, meta, hyper, super), so the release of the left shift key — which kitty reports with
the shift bit set, `CSI 57441;2u` — prints "leftshift". `MatchString("leftshift")` builds
`mod = 0` and fails on `k.Mod == mod`. The two methods disagree on which modifiers count.
'''

[[bug]]
id = "ultraviolet/8"
title = "An invalid UTF-8 byte is reported as the UTF-8 encoding of the rune with that value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnknownEventEncodesTheByteAsARune"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseUtf8` returns `UnknownEvent(b[0])` for a byte that is not valid UTF-8; `UnknownEvent` is
a string type, so the conversion is `string(rune(b[0]))`: the byte 0xfe becomes the two-byte
string "þ" (U+00FE). The event does not contain the byte that was read. The package's own
test enshrines the value (`UnknownEvent(rune(0xfe))`). Inherited from x/input (x-input/5).
'''

[[bug]]
id = "ultraviolet/9"
title = "Grapheme clusters that start with an ASCII byte are split into separate key presses"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinASCIILedGraphemeClustersSplit"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseUtf8` returns a one-byte key press for any printable ASCII byte before it reaches the
`uniseg.FirstGraphemeCluster` call that turns a multi-rune cluster into one `KeyExtended`
event. Clusters whose first rune is ASCII — decomposed "é" (e + U+0301), "ñ" (n + U+0303),
keycap emoji "1️⃣" — arrive as a letter or digit followed by key presses for the combining
marks, while "ก้" or "👍🏽" arrive as one key. Inherited from x/input (x-input/6).
'''

[[bug]]
id = "ultraviolet/10"
title = "A CSI sequence with more than 32 parameters is cut short and its tail comes back as key presses"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCSIWithManyParametersLeaksItsTail"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseCsi` stops scanning parameter bytes once `paramsLen` reaches `parser.MaxParamsSize`
(32); the next parameter byte is not a valid final byte, so the function returns
`UnknownEvent` for the bytes so far, and the remaining digits, semicolons and the real final
byte are decoded as text ("1", ";", "1", "A" for a 33-parameter `CSI … A`). x/ansi's own
parser drops the extra parameters and still finds the final byte. Inherited from x/input
(x-input/8).
'''

[[bug]]
id = "ultraviolet/11"
title = "LegacyKeyEncoding.CtrlOpenBracket(true) never produces ctrl+[: Decode short-circuits a lone ESC and the table is consulted only for longer reads"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCtrlOpenBracketNeverFires"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseControl` maps ESC to ctrl+[ under `flagCtrlOpenBracket`, and `buildKeysTable` puts
ctrl+[ in the table for "\x1b" — but `Decode` returns `KeyPressEvent{Code: KeyEscape}` for a
one-byte buffer before `parseControl` is reached (and the ESC-prefix path handles two-byte
buffers), and `scanEvents` looks a read up in the table only when it is longer than two bytes.
So the flag documented as "maps 0x1B [ansi.ESC] to the escape key instead of ctrl+[" cannot
be turned the other way: no input ever yields ctrl+[. The same unreachable-table shape makes
every one- or two-byte table entry dead. Sharper form of x-input/9.
'''

[[bug]]
id = "ultraviolet/12"
title = "Terminfo keys the decoder also recognises are honoured only when the key arrives alone"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTerminfoKeysOnlyHonouredAlone"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With terminfo keys enabled, `scanEvents` looks the whole read buffer up in the key table
(built-in keys plus the terminal's terminfo keys) and only otherwise runs the decoder, which
knows nothing of terminfo and consults the table just for `UnknownEvent`s. A terminfo
sequence the decoder also recognises therefore means one thing alone and another with
company: tmux's and xterm's `kf48` is `CSI 24;6~` — with `FKeys(true)`, f48 when the read
holds just that sequence, ctrl+shift+f12 when anything follows it in the same read (fast
typing, pasted text, a mouse report). The `UseTerminfoKeys` documentation ("more accurate
key mappings for legacy non-xterm like terminals") describes the table only. Inherited from
x/input (x-input/10).
'''

[[bug]]
id = "ultraviolet/13"
title = "alt+O, alt+P and alt+X (ESC followed by an introducer byte) lack ShiftedCode, unlike every other alt+uppercase letter"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAltIntroducerKeysLackShiftedCode"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`ESC x` for an uppercase letter is decoded through `parseUtf8` and gives
`Code lower, ShiftedCode upper, Mod shift|alt`. The bytes that introduce SS3, DCS and SOS
take shortcuts of their own in `parseSs3`, `parseDcs` and `parseStTerminated`
(`KeyPressEvent{Code: unicode.ToLower(rune(b[1])), Mod: ModShift | ModAlt}`) and drop
`ShiftedCode`, so alt+shift+o/p/x differ in shape from alt+shift+q. x/input's alt+[ (Code 0,
Text "[") is fixed here (x-input/7); this remainder is not.
'''

[[bug]]
id = "ultraviolet/14"
title = "Keypad keys print under the main keys' names (\"enter\", \"1\", \"period\") but MatchString only knows them as \"kpenter\", \"kp1\"…, so they never match their own keystroke"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinKeypadKeysDoNotMatchTheirKeystroke"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`keyTypeString` (used by `Keystroke`) names `KeyKpEnter` "enter", `KeyKp1` "1",
`KeyKpDecimal` "period", `KeyKpBegin` "begin", `KeyKpUp` "up" and so on — the same names as
the main keys — while `stringKeyType` (used by `MatchString`) knows the keypad keys as
"kpenter", "kp1", "kpperiod", "kpbegin". So `SS3 M` (keypad enter) prints "enter" and matches
neither "enter" (that is `KeyEnter`) nor its own keystroke; `SS3 q` (keypad 1, no text)
prints "1" and does not match "1"; with the Kitty protocol `CSI 57414;5u` prints "ctrl+enter"
and matches nothing. A program that binds "enter" does not react to the keypad Enter key,
though its log says "enter" was pressed. Keypad digits with associated text (`Text: "1"`)
match through the text fallback only.
'''

[[bug]]
id = "ultraviolet/15"
title = "The caps lock, num lock and scroll lock keys print as \"capslock\"/\"numlock\"/\"scrolllock\", which MatchString reads as modifiers"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLockKeysParsedAsModifiers"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`keyMatchString` handles the parts "capslock", "numlock" and "scrolllock" as modifier bits
before looking the part up as a key name, and `Keystroke` prints the keys `KeyCapsLock`,
`KeyNumLock` and `KeyScrollLock` (Kitty 57358, 57360, and the Windows console) with exactly
those words. `CSI 57358u` (caps lock pressed) prints "capslock" and `MatchString("capslock")`
is false — the string means "no key, caps lock modifier". Same family as ultraviolet/14.
'''

[[bug]]
id = "ultraviolet/16"
title = "A string terminator (ESC \\) split across two reads ends the string at the ESC: OSC replies are dropped and the backslash is typed"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStringTerminatorSplitAcrossReads"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
OSC, DCS, APC, PM and SOS strings end with ST, which 7-bit terminals send as the two bytes
`ESC \`. When a read ends between them, `parseOsc` sees the ESC as the string's end, finds no
`\` after it, and returns `ignoredEvent` for the whole reply — a cancelled sequence — without
signalling "incomplete"; `parseDcs` and `parseStTerminated` return the event at the ESC. The
scanner therefore does not wait (it waits only for `UnknownEvent`s and one- or two-byte
ESC-prefixed keys); the `\` in the next read is decoded as the key press "\". So a background
colour reply (`OSC 11 ; rgb:… ST`), a clipboard read or an XTVERSION reply whose last byte
lands in the next read is lost or truncated, and the program receives a typed backslash. Every
other incomplete sequence survives a read boundary; the terminator of every string does not.
'''

[[bug]]
id = "ultraviolet/17"
title = "ESC ESC [ at the end of a read is alt+[ instead of waiting, so an alt-modified CSI key or the paste-end marker after a pasted ESC is lost"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEscEscBracketAtAReadBoundary"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`scanEvents` waits for the next read when a decoded ESC-prefixed key is one or two bytes
long (`esc && n <= 2 && !expired`): `ESC` alone and `ESC [` may be the start of a longer
sequence. `ESC ESC [` is three bytes — `Decode` recurses on `ESC [`, gets alt+[, adds alt
again — so it is emitted at once, though `ESC ESC [ A` in one read is alt+up. With the bytes
`ESC ESC [ A` split after the third, the program gets alt+[ and a typed "A". Inside a
bracketed paste the same shape swallows the end marker: a pasted text ending in ESC
followed by `CSI 201~`, cut after `ESC ESC [`, appends "\x1b\x1b[" to the paste, then "201~"
and everything after it — the paste never ends and every later event is eaten.
'''

[[bug]]
id = "ultraviolet/18"
title = "Inside a bracketed paste, escape sequences the decoder knows as keys are kept while all others are dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPasteDropsUnrecognisedSequences"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
While `d.paste != nil`, `scanEvents` appends a `KeyPressEvent`'s text, or the raw bytes of a
key without text (`CSI A` stays "\x1b[A" in the paste), but "everything else is ignored":
an `UnknownCsiEvent` (`CSI 31 m`, an SGR colour from copied terminal output), a mouse report
or a focus event inside the paste vanishes, and an `UnknownEvent` for `ESC [` followed by a
non-ASCII byte drops those two bytes while keeping the rest. So pasting "a\x1b[31mb" yields
"ab", "a\x1b[éb" yields "aéb", but "a\x1b[Ab" yields "a\x1b[Ab": the paste is neither the
verbatim bytes nor a consistent filtering. The terminal already guarantees that a paste
contains no `CSI 201~`; the content between the markers should be delivered as is.
'''

[[bug]]
id = "ultraviolet/19"
title = "The whole-read key-table lookup runs before the bracketed-paste check: a read that is exactly a key sequence during a paste is a key press, not pasted text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTableLookupIgnoresAnOpenPaste"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`scanEvents` starts with `if d.lookup && len(buf) > 2 && buf[0] == ESC { if k, ok :=
d.table[string(buf)] … return }` and only then enters the loop that knows about `d.paste`.
When the bytes of an open paste arrive so that one read holds exactly a table sequence —
"\x1b[A" pasted from copied terminal output, delivered as its own read — the scanner emits
`KeyPressEvent(up)` in the middle of the paste and the sequence is missing from the
`PasteEvent`; the same bytes inside a larger read are kept verbatim in the paste (see
ultraviolet/18 for what the loop keeps). The lookup also skips the paste state for the
`ESC`-timeout flush of a remainder that happens to be a key.
'''
