[[bug]]
id = "ultraviolet/23"
title = "InsertLineArea and DeleteLineArea tear a wide cell straddling the area's edge (head without placeholder, or the reverse)"
kind = "silent-corruption"
severity = "low"
test = "TestHegelPinLineShiftsCutWideCellsAtTheAreaEdge"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The line shifts copy the cells inside [area.Min.X, area.Max.X) row by row as they are. A wide
cell with its head inside and its placeholder outside (or the reverse) is copied in half: the
destination row gets a width-2 head followed by whatever it already held there, or a
placeholder with no head. A terminal erases a multi-column character it can only move in
part. Found by TestHegelBufferFollowsTheGridModel (gate line-shift-cuts-wide).
'''

[[bug]]
id = "ultraviolet/24"
title = "TerminalRenderer resets the terminal's hyperlink on a row change but keeps it in its pen: the next linked cell is drawn without its link"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHyperlinkLostAfterPenReset"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
updatePen(nil) writes ansi.ResetHyperlink() when s.cur.Link is set but, unlike the style
branch next to it, does not clear s.cur.Link. move() calls updatePen(nil) whenever the
cursor changes row while the pen holds a style or a link. The next cell with the same link
then compares equal to the pen in updatePen(cell) and no OSC 8 is emitted: `a` linked at (0,0)
and `b` with the same link at (0,1) render as
"\x1b[H\x1b]8;;URL\aa\x1b]8;;\a\r\nb\x1b]8;;\a" — b has no link on the terminal (the
x/vt emulator agrees), and the renderer's own record says it does, so no later frame repairs
it. 7% of random frames in TestHegelRendererDrawsWhatTheEmulatorShows (gate
link-lost-after-pen-reset).
'''

[[bug]]
id = "ultraviolet/25"
title = "The scroll optimisation moves a row the new frame did not touch and never paints it back: the terminal shows a blank where the frame has the row"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinScrollOptimisationSkipsAnUntouchedRow"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
scrollOptimize's hash map (growHunks) extends a matched shift to the rows between hunks, so
the scroll region can contain a row whose content is the same in both frames. Two frames on a
2×6 screen: `#` at row 2 and `0` at row 3, then `x`,`y`,`9` at rows 0–2, `0` at row 3 again
(RenderBuffer.SetCell leaves an unchanged cell untouched) and a linked `#` at row 4. The
renderer emits `CSI 1;5 r CSI H CSI 2 T CSI 1;6 r` (scroll rows 0–4 down by two, moving `0`
from row 3 to row 5, out of the region and lost), then transforms rows 0, 1, 2 and 4 only —
Render's loop looks at newbuf.Touched, and row 3 is untouched — so the terminal shows a blank
at row 3 (the x/vt emulator: "x\ny\n9\n\n#\n"). scrollBuffer applies the same shift to
curbuf and touches *curbuf*'s lines, which Render never consults, so the renderer's record
says row 3 is blank too and no later frame repairs it unless the application rewrites that
row. Same output for TERM=linux (RI RI instead of SD) and screen. ncurses touches the
scrolled lines of the *new* screen for exactly this reason. Found once in 20 000 random frame
sequences by TestHegelRendererDrawsWhatTheEmulatorShows (gate scroll-moved-untouched-row).
'''
