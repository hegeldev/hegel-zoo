[[bug]]
id = "ultraviolet/32"
title = "TabStops hard-codes an interval of 8: NewTabStops with a larger interval indexes past its bit set and panics, a smaller one aliases columns"
kind = "panic"
severity = "low"
test = "TestHegelPinTabStopsAssumeAnIntervalOfEight"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NewTabStops(width, interval)` allocates `ceil(width/interval)` ints, but `IsStop`, `Set` and
`Reset` index them by `col >> 3` and mask by `1 << (col & (interval-1))`, i.e. eight columns per
int whatever the interval. `NewTabStops(80, 16)` panics in `init` (`index out of range [5] with
length 5`); with interval 4, columns 0 and 4 share a bit (`Reset(4)` clears `IsStop(0)`), with
interval 2 `Set(1)` also sets 3, 5 and 7. Only `DefaultTabStops` (interval 8) is consistent; the
model property runs at that interval and counts the others.
'''

