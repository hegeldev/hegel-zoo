[[bug]]
id = "ultraviolet/1"
title = "Kitty alternate keys: the base-layout key overwrites the shifted key, so shift+a types the base key"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinKittyBaseKeyOverwritesShiftedKey"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With the Kitty "report alternate keys" enhancement a key arrives as
`CSI code:shifted:base ; mod u`. `parseKittyKeyboard` (decoder.go) handles the third
sub-parameter in `case 2`, sets `key.BaseCode`, and then `fallthrough`s into `case 1`, which
sets `key.ShiftedCode` from the *same* parameter — the base key. For shift+a on an AZERTY
keyboard, `CSI 97:65:113;2u`, the event has `ShiftedCode = 'q'`, and because the text of a
shifted key is taken from `ShiftedCode`, `Text = "q"`: the program receives "q" where the user
typed "A". Every non-US layout is affected whenever the terminal reports alternate keys.
Inherited from charmbracelet/x/input (x-input/1), same code.
'''

[[bug]]
id = "ultraviolet/2"
title = "TerminalReader.Legacy and TerminalReader.UseTerminfo have no effect: the scanner copies the decoder and builds the key table in NewTerminalReader"
kind = "contract"
severity = "high"
test = "TestHegelPinTerminalReaderOptionsAreIgnored"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NewTerminalReader(r, term)` documents "Use [TerminalReader.UseTerminfo] to use Terminfo
defined key sequences. Use [TerminalReader.Legacy] to control legacy key encoding behavior."
Both are fields of the embedded `EventDecoder`, so they can only be set after the constructor
returns — but the constructor has already built the key table
(`buildKeysTable(d.Legacy, d.term, d.UseTerminfo)` with the zero values) and copied the zero
decoder into the scanner (`evs.EventDecoder = d.EventDecoder`), which is what `StreamEvents`
runs. A reader with `Legacy = LegacyKeyEncoding(0).CtrlI(true).CtrlM(true).Backspace(true)`
still reports tab, enter and backspace for `\t`, `\r`, DEL, and `UseTerminfo = true` never
loads a terminfo entry. `Terminal.Start` has the same shape from the other side: it builds the
key table from `TerminalOptions.LegacyKeyEncoding` but never sets the scanner's decoder, so
the options that only the decoder honours (CtrlAt, CtrlI, CtrlM, CtrlOpenBracket, Backspace —
single bytes the table is not consulted for) are dead there too.
'''

[[bug]]
id = "ultraviolet/3"
title = "An X10 mouse report cut before its payload by a read boundary is returned as UnknownCsiEvent and its payload as key presses"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinX10MouseSplitAcrossReadsIsLost"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`scanEvents` waits for the next read when `Decode` returns an `UnknownEvent` before the escape
timeout (an incomplete CSI, OSC, DCS or UTF-8 sequence). `parseCsi`'s X10 branch, however,
returns `UnknownCsiEvent` when fewer than three bytes follow `CSI M`, and the scanner treats
that as a complete unknown sequence: the three bytes are consumed as `UnknownCsiEvent("\x1b[M")`
and the payload that arrives in the next read is decoded as text — a click at (10, 20) becomes
`UnknownCsiEvent` plus the key presses " ", "+", "5". Every other incomplete sequence survives
a read boundary; X10 reports (still the default mouse encoding of several terminals) do not.
'''

[[bug]]
id = "ultraviolet/4"
title = "Keystroke() prints the base-layout key but MatchString compares Code, so keys on non-US layouts never match their own keystroke"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMatchStringIgnoresTheBaseKey"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Key.Keystroke` documents: "If a [Key.BaseCode] is present, use it to represent a key using the
standard PC-101 key layout", so ctrl + the 'a' key of an AZERTY keyboard (Kitty
`CSI 97:65:113;5u`, base 'q') prints "ctrl+q". `keyMatchString` parses "ctrl+q" into
`Code 'q'` and compares it with `k.Code` ('a') only; `BaseCode` is never consulted, and the
text fallback does not apply to a ctrl chord. So `k.MatchString(k.Keystroke())` is false, a
binding written as "ctrl+q" (the documented layout-independent form) fires only on US
layouts, and `switch ev.Keystroke()` and `ev.MatchString(...)` disagree on the same event.
'''

[[bug]]
id = "ultraviolet/5"
title = "MatchString splits on '+', so the '+' key (and ctrl++, alt++, kp+) cannot be matched by string"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlusKeyCannotBeMatched"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`keyMatchString` does `strings.Split(s, "+")` and treats every part as a modifier or key name.
For the '+' key `Keystroke()` and `String()` return "+", which splits into two empty parts: no
code, no text, no match. "ctrl++" (`CSI 43;5u`) splits into "ctrl", "", "" and matches
nothing either. The only key whose own name cannot be matched, and a common binding (zoom,
increment). `MatchString("plus")` is not an alternative: "plus" is the keypad plus.
'''

[[bug]]
id = "ultraviolet/6"
title = "Lock modifiers are part of MatchString's exact modifier comparison, so caps lock or num lock breaks every binding under the Kitty protocol"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLockModifiersBreakBindings"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The Kitty keyboard protocol reports caps lock (64) and num lock (128) as modifier bits on
every non-text key event (arrows, function keys, ctrl chords). `keyMatchString` requires
`k.Mod == mod`, where `mod` is built from the string, so with caps lock on `CSI 97;69u`
(ctrl+a, caps lock) does not match "ctrl+a", and `CSI 57352;129u` (up arrow, num lock) does
not match "up" — although `Keystroke()` prints exactly "ctrl+a" and "up", since it never
prints lock modifiers. A user who leaves num lock on (the default on most PC keyboards) loses
every key binding of a Bubble Tea v2 program in kitty, foot, WezTerm or Ghostty. The text
fallback rescues plain letters only.
'''

[[bug]]
id = "ultraviolet/7"
title = "Keystroke() omits a modifier key's own modifier, so modifier key events do not match their keystroke"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinModifierKeysDoNotMatchTheirKeystroke"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Keystroke` skips "shift+" when `Code` is `KeyLeftShift`/`KeyRightShift` (and likewise for
ctrl, alt, meta, hyper, super), so the release of the left shift key — which kitty reports with
the shift bit set, `CSI 57441;2u` — prints "leftshift". `MatchString("leftshift")` builds
`mod = 0` and fails on `k.Mod == mod`. The two methods disagree on which modifiers count.
'''

[[bug]]
id = "ultraviolet/8"
title = "An invalid UTF-8 byte is reported as the UTF-8 encoding of the rune with that value"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnknownEventEncodesTheByteAsARune"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseUtf8` returns `UnknownEvent(b[0])` for a byte that is not valid UTF-8; `UnknownEvent` is
a string type, so the conversion is `string(rune(b[0]))`: the byte 0xfe becomes the two-byte
string "þ" (U+00FE). The event does not contain the byte that was read. The package's own
test enshrines the value (`UnknownEvent(rune(0xfe))`). Inherited from x/input (x-input/5).
'''

[[bug]]
