Text "[") is fixed here (x-input/7); this remainder is not.
'''

[[bug]]
id = "ultraviolet/14"
title = "Keypad keys print under the main keys' names (\"enter\", \"1\", \"period\") but MatchString only knows them as \"kpenter\", \"kp1\"…, so they never match their own keystroke"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinKeypadKeysDoNotMatchTheirKeystroke"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`keyTypeString` (used by `Keystroke`) names `KeyKpEnter` "enter", `KeyKp1` "1",
`KeyKpDecimal` "period", `KeyKpBegin` "begin", `KeyKpUp` "up" and so on — the same names as
the main keys — while `stringKeyType` (used by `MatchString`) knows the keypad keys as
"kpenter", "kp1", "kpperiod", "kpbegin". So `SS3 M` (keypad enter) prints "enter" and matches
