title = "Grapheme clusters that start with an ASCII byte are split into separate key presses"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinASCIILedGraphemeClustersSplit"
found = { commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b", version = "untagged, main 2026-09-10", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`parseUtf8` returns a one-byte key press for any printable ASCII byte before it reaches the
`uniseg.FirstGraphemeCluster` call that turns a multi-rune cluster into one `KeyExtended`
