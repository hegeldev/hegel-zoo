prints "1" and does not match "1"; with the Kitty protocol `CSI 57414;5u` prints "ctrl+enter"
and matches nothing. A program that binds "enter" does not react to the keypad Enter key,
though its log says "enter" was pressed. Keypad digits with associated text (`Text: "1"`)
match through the text fallback only.
'''

