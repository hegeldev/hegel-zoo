name = "ultraviolet"
language = "go"
upstream = "https://github.com/charmbracelet/ultraviolet"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-15"

[base]
commit = "6c9e17dc7a16f09f4a733262fed1219ac5ca596b"
date = "2026-09-10"
version = "untagged, main 2026-09-10"

[hegel]
version = "v0.6.33"

[run]
# The layout differential runs against ratatui (the Rust original); without cargo it is skipped.
setup = ["if command -v cargo >/dev/null 2>&1; then cargo build --release --manifest-path zoo/rtoracle/Cargo.toml; else echo 'no cargo: the ratatui differential will be skipped'; fi"]
command = "go test -count=1 -timeout 20m -run TestHegel -v . ./layout"

[expected_failures]
# The wide properties draw the shapes of the recorded bugs by default (STYLE.md rule 11) and fail
# naming the bug of their majority basin, every run or intermittently (shapes of a few percent of
# cases); the narrow properties (hegel_shapes_test.go, hegel_render_shapes_test.go,
# layout/hegel_shapes_test.go) are the deterministic expected failure of each bug;
# HEGEL_NO_KNOWN=1 switches the shapes off.
TestHegelStreamsSplitIntoTheirEvents = "ultraviolet/1"
TestHegelStreamsSurviveArbitraryReads = "ultraviolet/9"
