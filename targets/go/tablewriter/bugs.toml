found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`convertCellsToStrings` treats a `[]uint8` row (the type of a `[]byte`) as a slice of cells,
converting each byte with `convertToString`, which formats it as a number: `Append([]byte("ab"))`
gives the cells `97` and `98`. The case's own comment says "If it's truly []byte,
convertToString will handle it as a string", and a `[]byte` inside a `[]any` is indeed the
cell `ab`. Either the comment or the behaviour is wrong; a `[]byte` row should be one cell.
'''

[[bug]]
id = "tablewriter/29"
title = "An io.Reader cell of exactly 512 bytes is marked with the ellipsis though nothing was cut"
kind = "logic"
severity = "low"
test = "TestHegelPinReaderEllipsis"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`convertToString` copies at most 512 bytes of an `io.Reader` and appends the ellipsis when
the buffer holds 512 bytes, so a reader of exactly 512 bytes renders as its content plus the
ellipsis although it was read whole. The ellipsis should depend on more input being left
(read 513 bytes, or check for EOF).
'''

[[bug]]
id = "tablewriter/30"
title = "A nil embedded struct pointer drops its columns, so AutoHeader from such a row misaligns the table"
kind = "logic"
severity = "medium"
test = "TestHegelPinEmbeddedNilPointer"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`extractFieldsAndValuesFromStructWithOffset` returns nothing for a nil pointer, so an
embedded `*Inner` that is nil contributes neither headers nor cells: with AutoHeader on,
`Bulk([]Outer{{C: "c1"}, {Inner: &Inner{X: "x", Y: 1}, C: "c2"}})` extracts the header from
the first row as the single column `C`, the first row is `c1`, and the second row's three
cells `x`, `1`, `c2` fall under `C` and two nameless columns. The columns should come from the
type (empty cells for the nil pointer), as they do for a non-embedded pointer field.
'''

[[bug]]
id = "tablewriter/31"
title = "A value without exported fields appended alone (an error, a reader) becomes an empty row"
kind = "logic"
severity = "low"
test = "TestHegelPinSingleErrorRow"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`convertCellsToStrings` hands a single value that is not a slice, Formatter or Stringer to
`convertItemToCells`, which reflects it as a struct first: `errors.New("boom")` is a pointer
to a struct with one unexported field, so the reflection returns zero headers and a non-nil
empty value slice, taken as the row, and `Append(errors.New("boom"))` renders nothing (an
empty record) where `Append([]any{errors.New("boom")})` renders `boom`. The same happens for a
`*strings.Reader` and any struct type with no exported fields. The struct path should apply
only when the type has exported fields (or not to types `convertToString` handles).
'''

[[bug]]
id = "tablewriter/32"
title = "AutoHeader's header extraction converts the first row's values too, consuming its io.Reader fields"
kind = "logic"
severity = "low"
test = "TestHegelPinAutoHeaderReader"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`extractHeadersFromStruct` calls `extractFieldsAndValuesFromStruct` and discards the values,
but computing them runs `convertToString` on every field: an `io.Reader` field is read (up to
512 bytes) during the AutoHeader extraction, and `Append` reads it again for the row, so the
cell holds only what was left - nothing for a reader under 512 bytes. The header extraction
should not touch the values (or the values extracted once should be reused for the row).
'''
