'''

[[bug]]
id = "tablewriter/18"
title = "A table whose only record is empty renders as two ++ lines"
kind = "logic"
severity = "low"
test = "TestHegelPinEmptyRecord"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Append` of a record without cells keeps the record (a table of such records has zero
columns) and it still counts as a row line, so `Render` of a table holding only an empty record
writes `++\n++\n` (a top and a bottom border of zero columns) where a table without records
writes nothing. Empty records among real rows render as blank lines, which is defensible; an
empty table should not be framed.
'''

[[bug]]
id = "tablewriter/19"
title = "Header AutoFormat rewrites ANSI escape sequences, printing them as text"
kind = "logic"
severity = "medium"
test = "TestHegelPinAutoFormatEscapes"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Header auto-formatting (on by default) passes every header cell through `tw.SplitCamelCase`
and `tw.Title`: the sequence `ESC[31m` is split at its digit and letter transitions and
upper-cased, so `Header([]string{"\x1b[31mred\x1b[0m"})` renders `ESC[ 31 MRED ESC[ 0 M`,
which a terminal shows as `[ 31 MRED [ 0 M` in place of a red `RED`. Coloured cells are a
documented feature of the renderer, whose width code understands escape sequences;
auto-formatting should leave them intact (format the visible text between them).
'''

[[bug]]
id = "tablewriter/20"
title = "Truncate and Width disagree on a CSI sequence with a leading intermediate byte, so a truncated string can be wider than the limit"
kind = "logic"
severity = "low"
test = "TestHegelPinTruncateIntermediate"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Truncate`'s scan ends a CSI sequence at the first byte in 0x40-0x7E after `ESC [`, while
`Width` strips the sequences `Filter` matches, which requires the parameter bytes before the
intermediate bytes. On `ESC[ 31 mRED` (an intermediate space first, as bug 19 produces)
`Truncate` counts the sequence as invisible and keeps `RE` for a limit of 2, but `Width` of the
result is 8. `Truncate(s, n)` should return a string whose `Width` is at most `n`; the
Blueprint renderer relies on that when it pads a cell (formatCell's final fit), and renders a
ragged line otherwise.
'''

[[bug]]
id = "tablewriter/21"
title = "StyleGraphical border lines overshoot a lone column narrower than two cells"
kind = "logic"
severity = "low"
test = "TestHegelPinGraphicalNarrowColumn"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Line` takes the excess width of the left corner glyph over the column glyph off the first
column's segment and that of the right corner off the last column's; with a single column both
come off the same segment, and when the column is narrower than the sum (StyleGraphical's
corners `TopLeft`/`TopRight` are two cells wide) the segment is clamped at 0 and the border
lines are wider than the cell lines:

    (top)    4 cells
    A        3 cells

Reachable with `PaddingNone` (or a one-cell padding) and a one-cell column.
'''

[[bug]]
id = "tablewriter/22"
title = "A caption aligned left on a centre or right spot is realigned to the spot default, AlignDefault being AlignLeft"
kind = "logic"
severity = "low"
test = "TestHegelPinCaptionAlignLeft"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Caption()` (and `printTopBottomCaption` again) treat an alignment equal to `""`,
`tw.AlignNone` or `tw.AlignDefault` as unset and substitute the spot's default (left for the
left spots, right for the right ones, centre otherwise). `tw.AlignDefault` is `AlignLeft`, so
`Caption{Text: "Table 1", Spot: SpotBottomCenter, Align: AlignLeft}` prints the caption
centred: a left-aligned caption can only be had on a left spot, while `AlignRight` and
`AlignCenter` are honoured on any spot. The unset test should not include `AlignLeft`.
'''

[[bug]]
id = "tablewriter/23"
title = "With a caption, an empty table is replaced by hard-coded ASCII +--+ lines whatever the border style"
kind = "logic"
severity = "low"
test = "TestHegelPinCaptionEmptyTable"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`render()` buffers the table when a top or bottom caption is set; when the buffer is empty
and the renderer's top or bottom border is enabled it writes `+--+` for each enabled border
before or after the caption, regardless of the renderer's symbols: a `StyleLight` (or Markdown,
or HTML) table with a caption and no content prints

    Table 1
    +--+
    +--+

Without the caption the same table prints nothing. The placeholder should use the renderer's
glyphs, or be dropped.
'''

[[bug]]
id = "tablewriter/24"
title = "WithMaxWidth does not bound the table width: padding, separators and borders are uncounted and long words widen the columns"
kind = "logic"
severity = "medium"
test = "TestHegelPinMaxWidthTable"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`WithMaxWidth` is documented as "a global maximum table width for the table", but it is only
turned into a per-section wrapping width of `MaxWidth / cells` (`prepareContent` derives
`ColMaxWidths.Global` from the record's own cell count), which is applied to each cell as a
total cell width: with `WithMaxWidth(20)` and two columns each column may be 10 wide, so the
table is 10 + 10 + 3 = 23 wide with the separator and borders. Under the default `WrapNormal`
the wrapper also raises the limit to the longest word, so two columns of
`supercalifragilistic expialidocious` render 47 wide. Nothing later shrinks the columns to
the maximum (`Widths.Global` has such a pass, bug 12). Either the columns should be sized so
that the rendered lines fit `MaxWidth`, or the option's comment should describe a wrapping
hint.
'''

[[bug]]
id = "tablewriter/25"
title = "A pointer to a basic type (a nullable struct field, a *int cell) renders as its address"
kind = "logic"
severity = "medium"
test = "TestHegelPinPointerCells"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`convertToString` has cases for the basic types, `[]byte`, `error`, `fmt.Stringer`,
`tw.Formatter`, `io.Reader` and the `sql.Null*` types, but none for pointers, so a `*int`,
`*string`, `*float64` or `*bool` value - the usual Go representation of a nullable column, and
a struct field type the struct reflection hands over as is - falls to `fmt.Sprintf("%v")` and
renders as `0xc000012345`. A nil pointer renders as `<nil>`. Pointers should be dereferenced
(nil to the empty cell), as the struct reflection already does for a nil embedded pointer.
'''

[[bug]]
id = "tablewriter/26"
title = "A typed nil pointer whose String() or Error() dereferences panics in convertToString"
kind = "crash"
severity = "high"
test = "TestHegelPinNilStringerPanics"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
