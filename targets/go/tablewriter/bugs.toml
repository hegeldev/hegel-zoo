[[bug]]
id = "tablewriter/27"
title = "sql.NullInt32, NullInt16 and NullByte are not handled and render as {5 true}"
kind = "logic"
severity = "low"
test = "TestHegelPinNullInt32"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`convertToString` handles `sql.NullString`, `NullInt64`, `NullFloat64`, `NullBool` and
`NullTime` (the value when valid, else an empty cell) but not `sql.NullInt32` (Go 1.13),
`NullInt16` and `NullByte` (Go 1.17), which fall to `fmt.Sprintf("%v")`: `{5 true}` and
`{0 false}`. The README's "Structs with Database" example is the use case.
'''

[[bug]]
id = "tablewriter/28"
title = "A []byte appended as the row is one numeric cell per byte, though the code says it is a string"
