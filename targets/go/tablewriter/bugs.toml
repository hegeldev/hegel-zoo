# Bugs found in olekukonko/tablewriter by the Hegel property tests of hegel.patch.

[[bug]]
id = "tablewriter/1"
title = "Tabinal.SetWidth (SetTabWidth) before the first Size() is overwritten by the detection"
kind = "logic"
severity = "medium"
test = "TestHegelPinTabWidthSetBeforeUse"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Tabinal.Size()` runs `init` once, and `init` stores the detected width unconditionally, so a
width set by `SetWidth` before any `Size()` call is lost: `var tb twwidth.Tabinal;
tb.SetWidth(3); tb.Size()` is 4 in a directory holding Go files (the project heuristic), or 8.
The same happens to `twwidth.SetTabWidth(3)` called before the first width is asked of the
package, the natural place for a program to configure it. `SetWidth` should mark the width as
set (or run the detection first) so that an explicit width wins.
'''

[[bug]]
id = "tablewriter/2"
title = "Width caches widths of strings holding tabs, and SetTabWidth does not purge the cache"
kind = "logic"
severity = "medium"
test = "TestHegelPinTabWidthCache"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Width` caches by (East Asian setting, string); a tab's width is `TabWidth()` at the time of the
calculation. After `SetTabWidth(8)`, `Width("a\tb")` still returns the cached 6 while
`WidthNoCache("a\tb")` returns 10, and a lone `"\t"` (the fast path) returns 8. `SetTabWidth`
should purge the cache as `SetOptions` does, or the tab width should be part of the key.
'''

[[bug]]
id = "tablewriter/3"
title = "Width sums rune widths, so emoji sequences are measured wrongly"
kind = "logic"
severity = "low"
test = "TestHegelPinWidthEmojiSequence"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Width` adds `displaywidth.Options.Rune` over the runes of the stripped string, so a heart with
VS16 (U+2764 U+FE0F) is 1 column, a keycap 1, a flag (two regional indicators) 4, a skin-toned
hand 4 and a ZWJ family 6, where `displaywidth.String` (the same library, grapheme-aware) gives 2
for each and terminals render 2. Cells holding such sequences get columns too wide or too
narrow. The package's own `stringToDisplayWidth` already iterates graphemes; `Width` could use
`displaywidth.String` on the stripped text (keeping the tab and box-drawing rules).
'''

[[bug]]
id = "tablewriter/4"
title = "Truncate restarts its scan at every ESC, so an ST-terminated OSC sequence swallows the rest of the string"
kind = "logic"
severity = "medium"
test = "TestHegelPinTruncateHyperlink"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Truncate`'s loop resets its sequence buffer whenever it meets ESC, so the ESC of an ST
terminator (`ESC \`, the terminator of OSC 8 hyperlinks that `Width` and `Filter` recognise)
starts a fresh "sequence" that no final byte ever ends: every later character is appended to it
and dropped. `Truncate("\x1b]8;;http://x\x1b\\link\x1b]8;;\x1b\\ more text", 6)` returns ""
(`Truncate(s, 6, "..")` returns ".."), although the string is 14 columns wide and its visible
prefix "link m" fits. A two-character escape (`ESC 7`) has the same effect. The scan should
treat `ESC \` inside an OSC as its terminator, as the `Filter` regexp does.
'''

[[bug]]
id = "tablewriter/5"
title = "Truncate at maxWidth 0 returns an empty string, not the documented suffix"
kind = "logic"
severity = "low"
test = "TestHegelPinTruncateZeroSuffix"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The doc comment says "If maxWidth is zero and a suffix is provided, the suffix is returned";
`Truncate("hello", 0, "...")` returns "" (the package's own test asserts the ""), and so does
`Truncate("", 0, "...")`. Either the code or the comment is wrong; recorded as the comment's
promise.
'''

[[bug]]
id = "tablewriter/6"
title = "WrapStringWithSpaces splits a multi-byte last rune, mis-measuring the last word"
kind = "logic"
severity = "medium"
test = "TestHegelPinWrapSpacesTrailingRune"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The core content is `s[firstNonSpace : lastNonSpace+1]`, where `lastNonSpace` is the byte index
of the last non-space rune's first byte: a multi-byte last rune is cut after its first byte,
the remaining bytes become the "trailing spaces", and the last word is measured on the broken
bytes (one column for the replacement character). `WrapStringWithSpaces("a あ", 1)` returns
`["a", "あ"]` with limit 1 (the last line is 2 columns wide; the limit should be 2, as
`WrapString` returns), and a longer text is broken with the wrong width for its last word. The
output lines re-assemble the rune only because the trailing bytes are appended to the last
line. The slice should end at `lastNonSpace + utf8.RuneLen`.
'''

[[bug]]
id = "tablewriter/7"
title = "BreakPoint counts the characters of escape sequences, so WrapBreak splits coloured text inside a sequence"
kind = "logic"
severity = "medium"
test = "TestHegelPinBreakPointEscapes"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`BreakPoint` measures each rune alone with `twwidth.Width(string(r))`: ESC is 0 but `[`, the
digits and the final `m` are one column each, so `BreakPoint("\x1b[31mabc", 2)` is 3 (the break
falls after `ESC[3`), where the escape sequence takes no width and the answer is 7. `WrapBreak`
(`prepareContent`) uses it to cut lines, so a coloured cell wider than its column is broken in
the middle of its colour sequence, corrupting the sequence and the following lines. The width
should be accumulated over the visible text (sequences skipped), as `Width` measures it.
'''

[[bug]]
id = "tablewriter/8"
title = "SplitCamelCase keeps groups of two or more underscores"
kind = "logic"
severity = "low"
test = "TestHegelPinCamelUnderscoreGroups"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The comment says groups that are empty, underscore or whitespace-only are excluded, but the
test is `str != "_"`: `SplitCamelCase("a__b")` is `["a", "__", "b"]`. Header auto-formatting
(`tw.Title(strings.Join(tw.SplitCamelCase(s), " "))`) then renders `a__b` as `A    B` (three
spaces inside), while `a_b` is `A B`.
'''

[[bug]]
id = "tablewriter/9"
title = "The Markdown renderer does not escape a pipe inside a cell"
kind = "logic"
severity = "medium"
test = "TestHegelPinMarkdownPipe"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A cell `x|y` is written as `| x|y |`, which every Markdown table parser (GFM: a pipe in a cell
must be written `\|`) reads as two cells, shifting the row's later cells and breaking the
table's column count. A header `h|1` does the same after auto-formatting (`H | 1`). The
renderer should escape `|` as `\|` (an already escaped `\|` is passed through unchanged).
'''

[[bug]]
id = "tablewriter/10"
title = "A cell with newlines becomes extra rows in Markdown and HTML; the renderers' <br> paths are dead"
kind = "logic"
severity = "medium"
test = "TestHegelPinMultilineRows"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`prepareContent` splits every cell at its newlines into visual lines (right for the boxed
renderers) and the table hands each visual line to the renderer as a row of its own. In
Markdown a record `{"x\ny", "z"}` is two table rows (`| x | z |` and `| y |   |`), which a
parser reads as two records; in HTML it is two `<tr>` elements, and a multi-line header or
footer opens one `<thead>`/`<tfoot>` element per line (a table may have one of each). The HTML
renderer's own code for cells holding a newline (`<br>`, the `AddLinesTag` option's `<lines>`)
is therefore never reached in batch mode. The Markdown and HTML renderers should receive the
record's lines joined (`<br>`), as their code expects.
'''

[[bug]]
id = "tablewriter/11"
title = "The Markdown and HTML renderers render the columns AutoHide hides"
kind = "logic"
severity = "medium"
test = "TestHegelPinAutoHideRenderers"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Behavior.AutoHide` ("whether empty columns are hidden") sets the widths of the columns that
are empty in every row to 0; the Blueprint renderer drops them, but `renderer.Markdown` and
`renderer.HTML` render every column of `ctx.Row.Widths` regardless of its width. The Markdown
output also misaligns: the hidden column's cells are sized by their content (`formatCell`
takes at least the content plus padding) while its separator is the minimum three dashes.
'''

[[bug]]
id = "tablewriter/12"
title = "WithColumnMax is shared by all columns, though documented as a maximum column width; small values empty the cells"
kind = "logic"
severity = "low"
test = "TestHegelPinColumnMaxTruncate"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`WithColumnMax` is documented as "a global maximum column width", but `calculateContentMaxWidth`
divides `Widths.Global` (less the separators) among the columns as a table width. With two
columns and `WithColumnMax(8)` each column gets 3, so its content width is 1: under
`WrapTruncate` the cell is `Truncate(line, 0, "…")`, which is "" (bug 5), and the boxed table
shows an empty cell in place of "hello world foo bar"; under `WrapNormal` the words are cut
to two characters without an ellipsis. Either the comment should say table width, or the
value should apply per column (then a truncated cell keeps its ellipsis).
'''

[[bug]]
id = "tablewriter/13"
title = "Blueprint renders AlignNone cells left-aligned in every section, discarding the section defaults"
kind = "logic"
severity = "low"
test = "TestHegelPinAlignNoneDefaults"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`renderLine` computes the default position for a cell whose alignment is `AlignNone` or empty
(header centre, footer right, row left) and then overwrites it with the cell's own alignment,
so `formatCell` receives `AlignNone` and falls to its default branch, left alignment. A table
built with `WithHeaderAlignmentConfig(tw.CellAlignment{Global: tw.AlignNone})` (or an empty
`Align`) therefore renders `| A | BBBBB |` in place of the centred `|  A  | BBBBB |`, and a
footer `| f | ggggg |` in place of the right-aligned one. The Markdown renderer resolves the
same alignments to the documented defaults.
'''

[[bug]]
id = "tablewriter/14"
title = "Blueprint draws no top border when the table has a footer but no header"
kind = "logic"
severity = "medium"
test = "TestHegelPinTopBorderFooterOnly"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The rows draw their top border only when the table has neither header nor footer, and the
footer draws one only when nothing is rendered above it, so a table of rows and a footer
without a header starts with a cell line:

    | 1 | 2 |
    +---+---+
    | f | g |
    +---+---+

With no footer the same rows are boxed. The top border belongs to whichever section is
rendered first.
'''

[[bug]]
id = "tablewriter/15"
title = "Blueprint drops the separator after a column hidden by AutoHide"
kind = "logic"
severity = "medium"
test = "TestHegelPinAutoHideSeparator"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`renderLine` draws the separator before a column only when the previous column's width is
positive; a column hidden by `AutoHide` has width 0, so the column after it loses its separator
while the border lines keep their junctions:

    +---+---+
    | A  C |
    +---+---+
    | 1  3 |
    +---+---+

The cell lines are one character narrower than the borders. The separator should depend on
the previous visible column.
'''

[[bug]]
id = "tablewriter/16"
title = "Blueprint renders lines of different widths when AutoHide hides every column"
kind = "logic"
severity = "low"
test = "TestHegelPinAutoHideAllColumns"
found = { commit = "5f0c87a871a3084b2632f3a7775e45a75ea0422d", version = "v1.1.5", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
