notes = '''
oj.ParseString("0e5") fails with "invalid number at 1:2"; so do "0e+100", "-0E1", "0E5",
"-0e0", "0e-1", "0E+0", "[0e5]" and `{"a":0e5}`, through Parser.Parse, oj.Unmarshal,
oj.ValidateString and sen.Parse alike, while encoding/json accepts them all: RFC 8259 section 6
has int = "0" / (digit1-9 *DIGIT) with frac and exp each optional, so an exponent may follow a
bare 0. "0.0e5", "10e5" and "0.5e1" parse, as do "0" and "-0". In oj/maps.go the zeroMap table
(lines 143-151), the mode after a leading 0, has no entry for 'e' or 'E' (0x45 and 0x65 are
charErr), while digitMap and fracMap (lines 153-161, 173-181) map both to fracE; sen/maps.go's
zeroMap (lines 91-99) has the same hole, and the validator and tokenizer use the oj tables.
Observation, not a separate bug: "1e+400" and "-1e400" parse to +Inf and -Inf without an error
and "1e-400" to 0. Medium: a valid number spelling that other writers produce (0e0 for a float
zero in exponent form) is rejected everywhere. Found by the rewrite of 2026-10-07: the byte
edits of TestHegelInvalid turn "1e-07" into "0e-07"; counted as a candidate
(candidate/go/ojg-5) and skipped before any parser saw it, recorded now.
'''
