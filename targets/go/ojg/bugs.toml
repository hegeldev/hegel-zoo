[[bug]]
id = "ojg/16"
title = "oj.Match with a descent does not search inside an element that itself matched"
kind = "logic"
severity = "low"
test = "TestHegelPinMatchDescentWildcard"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
oj.MatchString(`["a",["d","e"],{"a":"f"}]`, cb, "$..*") calls back for the three top-level
elements only, while Get returns all six descendants and jp.PathMatch("$..*", "$[1][0]") is
true. `$..[1]` on [0,[0,1]] reports [0,1] but not the inner 1; on [[0,1],[0,2]] it reports
$[0][1] and $[1] but not $[1][1]; `$..*` on {"a":{"b":1}} reports {"b":1} only. Once an
element matches the fragment after the descent, its own contents are no longer searched;
"$..a" on {"a":{"b":1}} and "$..[0]" on [0,[0,1]] (where the outer match has no matching
child) are complete.
'''

[[bug]]
id = "ojg/17"
title = "oj.Match with a filter matching several elements calls back once, with the first value and the last path"
kind = "logic"
severity = "medium"
test = "TestHegelPinMatchFilterAll"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
oj.MatchString(`["a","b","c",1,{"a":1},{"a":2},{"b":["g"]}]`, cb, "$[?(@ != 1)]") calls cb
once with the value "a" and the path $[6]; Get returns six elements. "$[?(@.a)]" on the same
data calls back once with {"a":1} at $[5] (where {"a":2} lives), "$[?(@.a != 5)]" once with
"a" at $[6]. A filter that matches a single element is reported correctly, so the handler
seems to keep one pending match per filter and overwrite its path.
'''

[[bug]]
id = "ojg/18"
title = "A truncated null, true or false followed by a comma is accepted and the value silently dropped"
kind = "logic"
severity = "medium"
test = "TestHegelPinTruncatedLiteral"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
oj.ParseString("[nul,1]") returns [1] with no error, "[n,1]" returns [1], "nul,1" returns 1,
and "nul," alone returns nil; oj.ValidateString accepts them all. The comma ends the literal
scan as if the word were complete and the partial value is never added. Any other terminator
is caught ("nul]", "nul ", "nul}", "[tru]" give "expected null/true"). Found by mutating valid
JSON: deleting a letter of a literal before a comma turns "[null,1]" into a document that
parses to a shorter array. sen.Parse reads the partial words as the strings "nul", "n" (its
token grammar), which is consistent for SEN.
'''
