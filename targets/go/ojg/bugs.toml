[[bug]]
id = "ojg/7"
title = "jp Expr.String() of a descent followed by a bracket fragment is unparsable"
kind = "logic"
severity = "low"
test = "TestHegelPinDescentString"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Descent.Append writes a single '.' and relies on the next fragment to write another, which
only Child and Wildcard do in dot form. jp.MustParseString("$..[0]").String() is "$.[0]",
"$..[1:2]" gives "$.[1:2]", "$..['a b']" gives "$.['a b']", "$..[?(@.a)]" gives
"$.[?(@.a)]" and "$..[*]" (parsed from the bracket form) gives "$.[*]"; jp.ParseString
rejects each with "an expression fragment can not start with a '['".
'''

[[bug]]
id = "ojg/8"
title = "jp Expr.BracketString() renders a descent as [..], which the parser rejects"
kind = "logic"
severity = "low"
test = "TestHegelPinDescentBracket"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
jp.MustParseString("$..a").BracketString() is "$[..]['a']" and jp.ParseString of it fails
with "parse error at 3"; the same for "$..*" ("$[..][*]") and "$[0]..b" ("$[0][..]['b']").
