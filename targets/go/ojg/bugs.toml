# Bugs found in ohler55/ojg by the Hegel properties (see README.md).

[[bug]]
id = "ojg/1"
title = "Integer literals 9223372036854775800 to 9223372036854775807 and -9223372036854775808 parse as json.Number, not int64"
kind = "contract"
severity = "low"
test = "TestHegelPinIntLimits"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
oj.Parse and sen.Parse return int64 for integers, and json.Number only for integers that do
not fit. The digit loop in oj/parser.go switches to the big-number path with
`if gen.BigLimit <= p.num.I` before appending the next digit, so every 19-digit integer whose
first 18 digits are >= 922337203685477580 goes that way although it still fits:
oj.ParseString("9223372036854775807") is json.Number, "9223372036854775799" is int64. The
negative branch gets -9223372036854775800..807 right but not -9223372036854775808. As a
consequence oj.JSON(int64(math.MaxInt64)) does not parse back to the value written.
'''

