[[bug]]
id = "ojg/5"
title = "SEN writer leaves strings starting with a dash unquoted, so they do not read back"
kind = "logic"
severity = "low"
test = "TestHegelPinSENDash"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
sen.String("-") is `-`, which sen.Parse rejects ("incomplete JSON"); sen.String("-a") is `-a`
("invalid number"); sen.String("-1") is `-1`, which reads back as the integer -1. The SEN
grammar (sen.md) allows '-' only as a token continuation, not as a token start, so such
strings must be quoted, as the writer already does for "1" or "a b".
'''

