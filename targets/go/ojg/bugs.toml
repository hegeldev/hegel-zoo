[[bug]]
id = "ojg/19"
title = "Parse and Validate accept an object member with no value before the closing brace and drop it"
kind = "logic"
severity = "medium"
test = "TestHegelPinMemberWithoutValue"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
oj.ParseString(`{"a":}`) returns {} with no error, `{"a": }` the same, `{"b":1,"a":}` returns
{"b":1}, `[{"a":}]` returns [{}, "a"] (the pending key leaks into the array as a gen.Key, so
oj.Unmarshal of that text fails with "can not recompose a gen.Key") and `{"a":{"b":}}` returns
{} with the inner object lost. oj.ValidateString accepts every one; Parser.Parse, Unmarshal and
sen.Parse behave like Parse (sen rejects only the nested form, "expected a key"). The
controls are rejected as they should be: `{"a":,"b":1}` ("unexpected character ','"), `[1,]`
and `{"a":1,}`. In oj/parser.go the mode after a colon is valueMap (colonColon, line 242), and
valueMap maps '}' to closeObject (oj/maps.go line 47), so a closing brace is accepted where a
value is required; closeObject (parser.go lines 345-357) then pops the top of the stack, which
is the pending key rather than the map, and re-adds it through add(), which appends it as a
value because the new top is the map: the member vanishes. The validator shares the table
(validator.go lines 191-197). Family of ojg/18 (a value missing before a terminator passes).
Found by the rewrite of 2026-10-07: the byte edits of TestHegelInvalid delete a member's value;
counted as a candidate (candidate/go/ojg-1) and recorded now.
'''

[[bug]]
id = "ojg/20"
title = "Parse panics with \"assignment to entry in nil map\" on a truncated literal member followed by a comma and another member"
kind = "crash"
severity = "high"
test = "TestHegelPinTruncatedLiteralMember"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
oj.ParseString(`{"k":nul,"a":1}`) panics with "assignment to entry in nil map"; so do
`{"k":tru,"a":1}`, `{"k":fals,"a":1}`, `{"k":n,"a":1}`, `{"k":nul, "a":1}` (a space after the
comma) and the nested `{"a":{"k":nul,"b":1}}`, through Parser.Parse and oj.Unmarshal alike,
while oj.ValidateString accepts every one. `{"k":nul}` and `{"k":nul,}` give clean errors
("expected null at 1:9", "expected a string start, not '}'"), and `[nul,1]` is ojg/18 (accepted,
the value dropped). sen.Parse reads the partial word as the string "nul", consistent for SEN.
The panic is in (*Parser).add, oj/parser.go lines 602-613: with a gen.Key on top of the stack
it takes the element below as the object (`obj, _ := p.stack[len(p.stack)-2].(map[string]any)`,
the failed assertion ignored) and writes `obj[string(k)] = n` into a nil map. The map is nil
because the literal tables nullMap, trueMap and falseMap (oj/maps.go lines 53-81) send ',' to
afterComma, which ends the partial literal without adding a value (ojg/18's mechanism): the
key "k" stays on the stack, the key "a" is pushed above it, and when the value 1 is added the
element below the top key is the key "k", not the map. The validator shares the literal
tables, so Validate accepts the text. A JSON parser must reject this input; any document with
a damaged literal member crashes the caller. Found by the rewrite of 2026-10-07: the
cutLiteral mutation of TestHegelInvalid applied to an object member; counted as a candidate
(candidate/go/ojg-2) and skipped before any parser saw it, recorded now.
'''

[[bug]]
id = "ojg/21"
title = "jp filter != is false for a float64 member compared with a string, boolean, null or a different float"
kind = "logic"
severity = "medium"
test = "TestHegelPinFilterFloatNotEqual"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
On [{"a":0.5}], `$[?(@.a != 'zzz')]` selects nothing, and so do `$[?(@.a != true)]`,
`$[?(@.a != null)]` and `$[?(@.a != 1.5)]`, although `$[?(@.a == 'zzz')]` (and == 1.5) is false
too. The controls agree with the model: `$[?(@.a != 1)]` (an integer operand) selects the
element; on [{"a":5}] (an int64 member) != against 'zzz', true, null and 1.5 selects it; a
string, boolean or null member compared with != to 0.5 is selected; <, >, <= and >= between a
float and a string are false. So exactly the pairs float64 member with a string, boolean, null
or unequal float64 operand are wrong. In jp/script.go, evalStack's neq case (lines 527-541)
sets the result true once `left == right` fails and then refines it by type; the int64 branch
is guarded (`if tr, ok := right.(float64); ok { ... }`) but the float64 branch is not:

    case float64:
        tr, ok := right.(int64)
        sstack[i] = ok && tl != float64(tr)

so any right operand that is not an int64 makes the result false. The eq case (lines 512-526)
has the same asymmetry, harmless there because its default is already false. Found by the
rewrite of 2026-10-07: TestHegelPath's filters over random data; counted and assumed away as a
candidate (candidate/go/ojg-3), recorded now.
'''

[[bug]]
id = "ojg/22"
title = "SEN writer leaves a string starting with a byte order mark bare, so at the root it reads back without the mark or as the value after it"
kind = "logic"
severity = "low"
test = "TestHegelPinSENBOM"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
sen.String("\ufeff123") is the bare bytes EF BB BF 31 32 33 and sen.Parse of it is the integer
123; "\ufeffabc" reads back as "abc", "\ufefftrue" as true, "\ufeffnull" as nil, "\ufeff-1" as
-1, "\ufeff1.5" as 1.5 and "\ufeff\ufeff123" as "\ufeff123"; sen.Bytes and sen.Write write the
same. Only the root is affected: the same string as an array element, an object member or a
key (`[\ufeff123]`, `{k:\ufeff123}`) survives, as does a string with the mark later
("abc\ufeff123"), the mark alone (sen.Parse skips a leading BOM only when the buffer is longer
than three bytes, sen/parser.go lines 141-147, `3 < len(buf)`), and any such string the writer
quotes for another reason ("\ufeffa b"); sen.Parse of oj.JSON(v) is fine, JSON quotes the
string. ojg.AppendSENString (string.go lines 117-206) decides quoting from senMap: a first byte
of 0x80 or above is class '8' (no quote) and in the loop a multibyte rune only forces quotes
for U+2028, U+2029 or an invalid sequence, so U+FEFF goes out bare, while sen.md allows a BOM at
the start of a sequence and the parser drops it. Family of ojg/5 and ojg/6: the writer leaves
a string bare that does not read back as itself. Low: a root string starting with a byte order
mark, and the loss is the mark itself unless what follows spells a number or a literal. Found
by the rewrite of 2026-10-07: the "\ufeff" atom of the model's strings under TestHegelSEN;
counted and assumed away as a candidate (candidate/go/ojg-4), recorded now.
'''

[[bug]]
