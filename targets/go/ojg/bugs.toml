[[bug]]
id = "ojg/11"
title = "jp Get panics with a negative-step slice on an empty array"
kind = "crash"
severity = "medium"
test = "TestHegelPinSliceEmpty"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
jp.MustParseString("$[:0:-1]").Get([]any{}) panics with "index out of range [-1]"; so do
"$[1:0:-1]", "$[:5:-1]", "$[3:1:-1]" and "$[0:0:-1]", and "$[-1::-1]" / "$[-5::-1]" panic
with "index out of range [0] with length 0". Slice.startEndStep sets start = size-1 = -1 (or
clamps a negative start to 0) and leaves step non-zero, so the loop in get.go reads tv[-1] or
tv[0]. "$[::-1]" and "$[0::-1]" on an empty array are fine. Get with any data holding an
empty array below such a slice is affected (also Locate and the other walkers).
'''

[[bug]]
id = "ojg/12"
title = "jp negative-step slices clamp out-of-range bounds onto the array and select an extra element"
kind = "logic"
severity = "low"
test = "TestHegelPinSliceNegClamp"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
On [a,b,c]: `$[:5:-1]` returns [c] and `$[-5::-1]` returns [a]; on [a]: `$[3:1:-1]` returns
[a]. RFC 9535 (2.3.4.2.2) and Python slicing select nothing in each case: with a negative
step an end at or past the array, or a start before it, lies outside the range. In
Slice.startEndStep `size <= end` becomes `end = size-1` (inclusive) for both step signs, and a
negative start is clamped to 0 instead of "before the first element". Positive-step slices
follow the RFC.
'''

[[bug]]
id = "ojg/13"
title = "Parse does not combine UTF-16 surrogate pair escapes"
kind = "logic"
severity = "medium"
test = "TestHegelPinSurrogatePair"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
oj.ParseString of the JSON text "\ud83d\ude00" (the surrogate pair escape of U+1F600, in any hex
case) returns two U+FFFD replacement characters instead of the one character; sen.Parse the
same. RFC 8259 section 7 specifies that characters outside the Basic Multilingual Plane are
escaped as the UTF-16 surrogate pair, and encoding/json decodes them. Every escaped emoji or
supplementary-plane character is lost; the raw UTF-8 form is fine (and is what oj.JSON
writes). A lone surrogate escape gives one U+FFFD, as encoding/json does.
'''

[[bug]]
id = "ojg/14"
title = "jp Expr.String() and BracketString() do not escape a quote or backslash in a union key"
kind = "logic"
severity = "low"
test = "TestHegelPinUnionQuote"
found = { commit = "cb591c25ac6b7cba96169a23138aa85ec49faf33", version = "v1.28.6-6-gcb591c2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
jp.MustParseString(`$[0,'k\'q']`).String() is `$[0,'k'q']`, which jp.ParseString rejects
with "invalid union syntax"; for a key holding a backslash (`$[0,'back\\slash']`) the output
is `$[0,'back\slash']`, which is rejected ("0x73 (s) is not a valid escaped character") or,
when the following character happens to form an escape, reparsed as a different key. A Child
(`$['k\'q']`) and a filter constant escape both characters properly.
'''

