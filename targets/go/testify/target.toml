TestHegelContainsOnAStringWantsAString = "testify/6"
TestHegelNilArgumentsFailWithoutPanicking = "testify/7"
TestHegelElementsMatchRejectsNonLists = "testify/8"
TestHegelPanicsWithValueHandlesUncomparableValues = "testify/9"
TestHegelInDeltaRejectsANaNDelta = "testify/10"
TestHegelInDeltaSliceComparesTheLengths = "testify/11"
TestHegelOrderingFailsOnMixedStructAndSliceTypes = "testify/12"
TestHegelEqualExportedValuesKeepsNilInterfaces = "testify/13"
TestHegelJSONEqComparesIntegersExactly = "testify/14"
TestHegelNotSameReturnsFalseWhenItFails = "testify/15"
TestHegelNotElementsMatchReportsTheMessage = "testify/16"
TestHegelPositiveWantsANumber = "testify/17"
TestHegelElementsMatchCountsZeroElements = "testify/18"
TestHegelEqualValuesFailsOnALongerSlice = "testify/19"
