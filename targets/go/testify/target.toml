name = "testify"
language = "go"
upstream = "https://github.com/stretchr/testify"
subdir = ""
license = "MIT"  # LICENSE (MIT); CONTRIBUTING.md, README and .github templates say nothing about AI-written code, no agent instructions (checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46"
date = "2026-09-02"
version = "v1.12.1-12-g435c07b (master, 2026-09-02)"

[hegel]
version = "v0.6.33"

[run]
command = "go test -count=1 -vet=off -run TestHegel -v ./assert/"
setup = []

[expected_failures]
# Wide properties: the shapes of the recorded bugs are drawn by default (STYLE.md rule 11) and
# each lands in the basin it reaches most often.
TestHegelEqualityFollowsTheModel = "testify/15"
TestHegelEqualValuesFollowsTheModel = { bug = "testify/4", intermittent = true }
TestHegelEqualExportedValuesFollowsTheModel = "testify/13"
TestHegelOrderingFollowsTheModel = "testify/17"
TestHegelDeltasFollowTheModel = "testify/11"
TestHegelMapAndStringCollectionsFollowTheModel = { bug = "testify/6", intermittent = true }
TestHegelJSONEqFollowsTheModel = { bug = "testify/14", intermittent = true }
TestHegelCollectionsFollowTheModel = { bug = "testify/18", intermittent = true }
TestHegelAssertionsKeepTheContract = { bug = "testify/15", intermittent = true }
# Narrow properties, one per bug, over the bug's shape region with random contents.
TestHegelEqualValuesKeepsSignedAndUnsignedApart = "testify/1"
TestHegelEqualValuesRejectsFractionsAgainstIntegers = "testify/2"
TestHegelEqualValuesIsSymmetricOnRoundedIntegers = "testify/3"
TestHegelEqualValuesKeepsIntegersApartFromStrings = "testify/4"
