# Bugs found in stretchr/testify (package assert) by the Hegel zoo. Each has a pin test
# (assert/hegel_pins_test.go) listed as an expected failure in target.toml.

[[bug]]
id = "testify/1"
title = "EqualValues equates a negative integer with the unsigned integer it wraps to: int8(-1) equals uint8(255) and uint16(65535)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEqualValuesSignedUnsigned"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ObjectsAreEqualValues (assertions.go) converts the value of the narrower numeric type to the
wider one "to make sure to always convert the smaller type to a larger type before comparing"
and compares with ==. The conversion of a negative signed integer to an unsigned type of the
same or greater size wraps, and so does the conversion of a large unsigned integer to a signed
type of the same size: EqualValues(t, int8(-1), uint8(255)), EqualValues(t, int8(-1),
uint16(65535)), EqualValues(t, int64(-1), uint64(math.MaxUint64)) and EqualValues(t,
uint64(1<<63), int64(math.MinInt64)) all pass, and NotEqualValues fails on them. The
documentation says the objects must be "equal or convertible to the larger type and equal";
-1 and 255 are not equal in any type that holds both. Only a signed/unsigned pair where the
signed type is wider (int16 against uint8) is compared exactly.
'''

[[bug]]
id = "testify/2"
title = "EqualValues truncates a float to the integer type: 1 equals 1.5 and int64(MinInt64) equals 1e300"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEqualValuesFloatTruncation"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
When the integer type is at least as wide as the float type (int or int64 against float64 or
float32, int32 against float32), ObjectsAreEqualValues converts the float to the integer type,
which truncates the fraction and saturates or wraps out-of-range values: EqualValues(t, 1, 1.5),
EqualValues(t, int64(1), float32(1.9)) and EqualValues(t, int64(math.MinInt64), 1e300) pass.
A float with a fraction is not equal to any integer; the comparison should be exact (convert
both to a type or a representation that loses nothing, or fail when the float is not
integral).
'''

[[bug]]
id = "testify/3"
title = "EqualValues is not symmetric: float32(16777216) equals int32(16777217) but not the other way round"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinEqualValuesSymmetric"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With a float type at least as wide as the integer type, ObjectsAreEqualValues converts the
integer to the float type; 16777217 is not representable in float32 and rounds to 16777216, so
EqualValues(t, float32(16777216), int32(16777217)) passes. With the arguments swapped the
sizes are equal too, but the branch `expectedType.Size() >= actualType.Size()` converts the
actual float32 to int32 instead, which gives 16777216 != 16777217 and fails. The same holds for
float64 against int64 above 2^53. The comparison should be exact and the result independent
of the argument order.
'''

[[bug]]
id = "testify/4"
title = "EqualValues(65, 'A') passes: an int is converted to a string as a rune"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEqualValuesIntString"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
reflect's ConvertibleTo allows an integer to string conversion (the Go rune conversion, which
go vet flags as almost always a mistake), so ObjectsAreEqualValues(65, "A") converts 65 to "A"
and reports equality; ObjectsAreEqualValues("A", 65) is false since a string does not convert
to an int. EqualValues(t, 65, "A") passes and EqualValues(t, "A", 65) fails. A number is not
"equal in value" to a one-character string; the integer-to-string conversion should be
excluded as the numeric conversions are special-cased.
'''

[[bug]]
id = "testify/5"
title = "EqualValues panics when a slice is compared with a longer array"
kind = "panic"
severity = "low"
test = "TestHegelPinEqualValuesSliceArray"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Since Go 1.20 a slice converts to an array type, and reflect's ConvertibleTo reports it as
convertible even though Convert panics when the slice is shorter than the array.
ObjectsAreEqualValues checks ConvertibleTo and then calls Convert: EqualValues(t, []int{1},
[2]int{1, 0}) and NotEqualValues(t, []int{1}, [2]int{1, 0}) panic with "reflect: cannot
convert slice with length 1 to array with length 2" instead of failing (or, for
NotEqualValues, passing). Value.CanConvert covers this case.
'''

[[bug]]
id = "testify/6"
title = "Contains on a string with a non-string element searches for the text '<int Value>'"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinContainsStringNonString"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
containsElement (assertions.go) handles a string list with
`strings.Contains(listValue.String(), elementValue.String())`. reflect.Value.String on a
non-string Value returns "<T Value>" rather than panicking, so Contains(t, "x <int Value> y",
42) passes, Contains(t, "<invalid Value>", nil) passes, NotContains(t, "x <int Value> y", 42)
fails, and Contains(t, "abc", []byte("a")) fails with "does not contain" although the bytes are
there. A non-string element against a string should fail as an unsupported argument (as a
non-collection list does), or be converted with fmt.Sprint.
'''

[[bug]]
id = "testify/7"
title = "Subset, ElementsMatch, IsIncreasing, Positive and their relatives panic on a nil argument instead of failing"
kind = "panic"
severity = "medium"
test = "TestHegelPinNilArgumentsFail"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Subset and NotSubset call reflect.TypeOf(list).Kind(), isList (used by ElementsMatch and
NotElementsMatch) and isOrdered (IsIncreasing, IsNonIncreasing, IsDecreasing, IsNonDecreasing)
call reflect.TypeOf(object).Kind(), and Positive/Negative call reflect.Zero(reflect.TypeOf(e)):
with an untyped nil argument reflect.TypeOf returns nil and the call panics ("invalid memory
address or nil pointer dereference", "reflect: Zero(nil)"). Subset(t, nil, []int{1}),
NotSubset(t, nil, []int{1}), ElementsMatch(t, nil, []int{1}) (ElementsMatch(t, nil, nil)
passes), NotElementsMatch(t, nil, []int{1}), IsIncreasing(t, nil), Positive(t, nil) and
Negative(t, nil) take the test binary down where every other assertion (Equal, Empty, Len,
Contains, Greater) fails with a message. A nil value returned by the code under test is the
common case an assertion exists to catch.
'''

[[bug]]
id = "testify/8"
title = "ElementsMatch passes for two empty values of any type (an empty map and an empty slice, or '' and 0) while the same non-empty values are rejected"
kind = "contract"
severity = "low"
test = "TestHegelPinElementsMatchEmptyNonList"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ElementsMatch returns true when `isEmpty(listA) && isEmpty(listB)` before checking that both
arguments are arrays or slices. ElementsMatch(t, map[string]int{}, []int{}) and
ElementsMatch(t, "", 0) pass, while ElementsMatch(t, map[string]int{"a": 1}, []int{1}) fails
with "has an unsupported type map, expecting array or slice". The type check should apply
whatever the contents (the documentation admits arrays and slices only).
'''

[[bug]]
id = "testify/9"
title = "PanicsWithValue panics when the recovered value is not comparable"
kind = "panic"
severity = "low"
test = "TestHegelPinPanicsWithValueUncomparable"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PanicsWithValue compares `panicValue != expected` on two interface{} values; when the dynamic
types are the same and not comparable (a slice, a map, a struct with a slice field) the
comparison itself panics with "runtime error: comparing uncomparable type []int".
PanicsWithValue(t, []int{1}, func() { panic([]int{1}) }) panics out of the assertion instead
of reporting; PanicsWithValue(t, "x", func() { panic([]int{1}) }) fails correctly because the
types differ. ObjectsAreEqual (as Equal uses) would compare the values.
'''

[[bug]]
id = "testify/10"
title = "InDelta with a NaN delta passes while InEpsilon rejects a NaN epsilon"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinInDeltaNaNDelta"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
InDelta fails when `dt < -delta || dt > delta`; both comparisons are false for a NaN delta, so
InDelta(t, 1, 100, math.NaN()) passes for any two numbers. InEpsilon begins with "epsilon must
not be NaN" and fails. A NaN tolerance (typically the result of a computed 0/0) should be
rejected by both, as a NaN argument already is.
'''

[[bug]]
id = "testify/11"
title = "InDeltaSlice ignores the lengths: it passes when actual is shorter than expected and panics when it is longer"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInDeltaSliceLength"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
InDeltaSlice loops over actualSlice.Len() and indexes expectedSlice at each position without
comparing the lengths. InDeltaSlice(t, []float64{1, 2, 3}, []float64{1}, 0) passes (the two
missing elements are never checked) and InDeltaSlice(t, []float64{1}, []float64{1, 2, 3}, 0)
panics with "reflect: slice index out of range". InEpsilonSlice checks `Len(t, actual,
expectedLen)` first and fails cleanly; InDeltaMapValues checks the number of keys.
'''

[[bug]]
id = "testify/12"
title = "Greater, Less and relatives panic on two structs or two slices of different types"
kind = "panic"
severity = "low"
test = "TestHegelPinCompareDifferentTypesFail"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
compareTwoValues (assertion_compare.go) checks only that the two Kinds agree ("Elements
should be the same type" otherwise). compare then handles Kind Struct by testing whether the
first value converts to time.Time and converting the second unconditionally, and Kind Slice
likewise with []byte: Greater(t, time.Now(), struct{}{}) panics with "reflect.Value.Convert:
value of type struct {} cannot be converted to type time.Time" and Less(t, []byte("a"),
[]int{1}) with "value of type []int cannot be converted to type []uint8". Greater(t, 1,
int64(0)) fails cleanly since the kinds differ. The second value's convertibility should be
checked as the first one's is.
'''

[[bug]]
id = "testify/13"
title = "EqualExportedValues drops map entries whose value is a nil interface and panics on a nil interface element of a slice or array"
kind = "panic"
severity = "medium"
test = "TestHegelPinEqualExportedValuesNilInterface"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
copyExportedFields returns its argument for a nil interface; reflect.ValueOf(nil) is the zero
Value. In the Map case `result.SetMapIndex(k, reflect.ValueOf(nil))` deletes the key, so
EqualExportedValues(t, map[string]any{"a": nil}, map[string]any{}) and EqualExportedValues(t,
map[string]any{"a": nil}, map[string]any{"b": nil}) pass: both copies are empty. In the Slice
and Array cases `isNil(index)` is called on the reflect.Value itself (a struct, never nil) and
`result.Index(i).Set(reflect.ValueOf(nil))` panics with "reflect: call of reflect.Value.Set
on zero Value": EqualExportedValues(t, []any{nil}, []any{nil}) panics rather than passing.
Typed nil pointers are handled; the nil interface is the JSON-decoded null and the common
`any` zero value.
'''

[[bug]]
id = "testify/14"
title = "JSONEq and YAMLEq compare integers as float64: 9007199254740993 equals 9007199254740992"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinJSONEqLargeIntegers"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
JSONEq unmarshals both documents into interface{} with encoding/json's defaults, which decode
every number as float64: integers above 2^53 that differ in the low bits become the same
float, and JSONEq(t, `{"id": 9007199254740993}`, `{"id": 9007199254740992}`) passes (a
typical snowflake id or int64 key). YAMLEq keeps integers that fit int64/uint64 but decodes
larger ones as float64 too: YAMLEq(t, "id: 99999999999999999999", "id: 99999999999999999998")
passes. json.Decoder.UseNumber (comparing json.Number as text or *big.Int) keeps the
documents' integers exact.
'''

[[bug]]
id = "testify/15"
title = "NotSame returns true after reporting a failure when the arguments are not pointers"
kind = "contract"
severity = "low"
test = "TestHegelPinNotSameReturnValue"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NotSame's non-pointer branch is `return !(Fail(t, "Both arguments must be pointers",
msgAndArgs...))`: Fail returns false after calling t.Errorf, so NotSame(t, 1, 2) marks the
test failed and returns true. Every other assertion returns false exactly when it reported a
failure (the documented "returns true on success" contract that `if assert.X(...) { ... }`
and require rely on); Same's identical branch returns false.
'''

[[bug]]
id = "testify/16"
title = "NotElementsMatch reports the caller's message as a Go slice ('[my msg %d 7]', '[]' without one) and a type failure twice"
kind = "contract"
severity = "low"
test = "TestHegelPinNotElementsMatchMessage"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Two of NotElementsMatch's Fail calls pass `msgAndArgs` as a single argument instead of
`msgAndArgs...`, so messageFromMsgAndArgs sees one non-string value and prints it with %+v:
NotElementsMatch(t, []int{1}, []int{1}, "hegel marker %d", 7) reports "Messages: [hegel marker
%d 7]" (the format is not applied) and NotElementsMatch(t, []int{1}, []int{1}) reports
"Messages: []" although no message was given. Its type checks also call isList, which already
reports "has an unsupported type", and then Fail again with "listA is not a list type":
NotElementsMatch(t, 1, []int{1}) produces two t.Errorf calls for one assertion.
'''

[[bug]]
id = "testify/17"
title = "Positive and Negative accept strings, byte slices and times: Positive('a') passes"
kind = "contract"
severity = "low"
test = "TestHegelPinPositiveNumbersOnly"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Positive and Negative compare the argument with the zero value of its type through the same
compare function as Greater, which orders strings, []byte and time.Time: Positive(t, "a"),
Positive(t, []byte("a")) and Positive(t, time.Now()) pass ("a" > "", the time is after the zero
time) and Negative on a string or a time can never pass. The documentation gives numbers only
