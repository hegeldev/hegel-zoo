unsupported type rather than mean "non-empty".
'''

[[bug]]
id = "testify/18"
title = "ElementsMatch treats an array of zero values as empty: [1]int{0} matches []int{}"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinElementsMatchZeroArray"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ElementsMatch starts with `if isEmpty(listA) && isEmpty(listB) { return true }`, and isEmpty
follows Empty's rule that an array is empty when every element is its zero value. An array
with elements therefore counts as having none: ElementsMatch(t, [1]int{0}, []int{}) passes,
ElementsMatch(t, [2]int{}, [1]int{}) passes, and NotElementsMatch(t, [1]int{0}, []int{})
fails with "listA and listB contain the same elements", although the documentation says "the
number of appearances of each of them in both lists should match" (one 0 against none). Found
by the multiset model at 3000 cases: 28 mismatches, all of this shape. The shortcut should
compare lengths (Len), not emptiness; Empty's array rule is documented as "stricter than
empty" for Empty itself.
'''

[[bug]]
id = "testify/19"
title = "EqualValues passes for a slice and a shorter array holding the slice's first elements"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEqualValuesSlicePrefixOfArray"
found = { commit = "435c07b5cb95c88b82cf35f49da0dde33d24ad46", version = "v1.12.1-12-g435c07b", hegel = "v0.6.33", date = "2026-09-26" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ObjectsAreEqualValues converts the expected value to the actual value's type when
reflect reports it convertible, and since Go 1.20 a slice converts to an array type of any
length no longer than the slice: the conversion takes the slice's first elements. So
EqualValues(t, []int{1, 2, 3}, [2]int{1, 2}) passes, EqualValues(t, []int{1, 2, 3}, [0]int{})
passes, and NotEqualValues(t, []int{1, 2, 3}, [2]int{1, 2}) fails, while EqualValues(t,
[2]int{1, 2}, []int{1, 2, 3}) fails (an array does not convert to a slice) and
EqualValues(t, []int{1, 2, 3}, [2]int{1, 9}) fails. The same conversion with a slice shorter
than the array panics (testify/5). Found by the EqualValues property once slice/array pairs
of every length were drawn: reproduced standalone with ObjectsAreEqualValues on the five pairs
above (true, false, true, true, false). Values of different lengths should never be equal;
the conversion is only meaningful when the lengths agree.
'''
