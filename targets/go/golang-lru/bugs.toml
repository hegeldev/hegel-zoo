# Bugs found in hashicorp/golang-lru by the Hegel properties. The zoo records only the target's
# bugs; each has a pin (a plain test asserting the documented behaviour) listed in
# target.toml's [expected_failures].

[[bug]]
id = "golang-lru/1"
title = "Resize accepts a size of zero or below: the cache then evicts every key as it is added"
kind = "contract"
severity = "low"
test = "TestHegelPinResizeNonPositive"
found = { commit = "9c13c57de0bedd6b3e21183b34072e417ffa69d1", version = "v2.0.7", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
simplelru.NewLRU and lru.New refuse a size at or below zero ("must provide a positive size"),
but simplelru.LRU.Resize, lru.Cache.Resize and TwoQueueCache.Resize store whatever they are
given. After Resize(0) every Add pushes the new entry and immediately evicts it (Length() > 0):
Add returns true, the eviction callback fires for the key just added, Contains is false and
Len stays 0; Cap() reports 0. Resize(-3) of an empty cache returns 3 "evictions" (diff =
Len - size is not clamped from above) and Cap() -3. The expirable cache documents Resize(0) as
"unlimited" and maps negative sizes to it, so the same call has opposite meanings across the
package. Refusing sizes below 1 (or adopting the expirable meaning) would make Resize
consistent with the constructors.
'''

[[bug]]
id = "golang-lru/2"
title = "New2Q(1) and New2QParams with a ghost ratio that rounds to zero fail with the inner LRU's error"
kind = "contract"
severity = "low"
test = "TestHegelPinTwoQueueSmallGhost"
found = { commit = "9c13c57de0bedd6b3e21183b34072e417ffa69d1", version = "v2.0.7", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
New2QParams validates size > 0 and both ratios within [0, 1], then builds the ghost list as
simplelru.NewLRU(int(size * ghostRatio)), which refuses a size of 0 with "must provide a
positive size". So every documented-valid combination whose ghost size rounds to zero is
refused: New2Q(1) (default ghost ratio 0.5), New2QParams(n, r, 0) for any n, and
New2QParams(3, r, 0.25). A ghost ratio of 0 is a natural way to turn ghost tracking off. The
recent list's size rounding to zero is fine (it is only a threshold). Resize to a size whose
ghost share rounds to zero is accepted, because Resize(0) on the inner LRU is (golang-lru/1),
so the same configuration is reachable through Resize but not through the constructor.
'''

[[bug]]
id = "golang-lru/3"
title = "After Close, the expirable cache returns expired entries as live"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinExpiredAfterClose"
found = { commit = "9c13c57de0bedd6b3e21183b34072e417ffa69d1", version = "v2.0.7", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
expirable.LRU.Get, Peek, Keys and Values hide an entry whose ExpiresAt has passed, but only
while "!c.cleanupStopped"; Close sets cleanupStopped and is documented as "destroys cleanup
goroutine. To clean up the cache, run Purge() before Close()". After Close, every expired
entry is returned as live: a cache with a 50ms TTL, closed, holding a key added 80ms ago,
returns it from Get, and Keys lists it. Entries that had already been hidden before Close
reappear. Nothing in the documentation says that Close turns the TTL off; a caller who Closes
to stop the background goroutine (relying on lazy expiry at read time) gets stale reads.
While the goroutine runs, Len, GetOldest and RemoveOldest also see expired entries that Get,
Peek and Keys hide, in the short window before the bucket is cleaned; not counted separately.
'''

[[bug]]
id = "golang-lru/4"
title = "simplelru Purge invokes the eviction callback before removing the entry, so the callback sees the key and can evict it twice"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinPurgeCallbackAfterRemoval"
found = { commit = "9c13c57de0bedd6b3e21183b34072e417ffa69d1", version = "v2.0.7", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
simplelru.LRU.removeElement (used by Add's eviction, Remove, RemoveOldest and Resize) removes
the entry from the list and the map and then calls onEvict, so the callback observes a cache
without the key. Purge does the reverse: for each item it calls onEvict and then deletes the
key, with evictList.Init() after the loop, so inside the callback Contains(k) is true, Len
still counts the entry and Keys lists it. A callback that removes the key it is told about
(a common clean-up pattern) then calls Remove, which finds the entry, removes it and calls
onEvict again: two callbacks per key for a Purge. The thread-safe lru.Cache and expirable.LRU
buffer the callbacks and run them after their Purge has finished, so the inconsistency is
simplelru's alone.
'''

[[bug]]
id = "golang-lru/5"
title = "TwoQueueCache with a recent ratio of 1 holds one entry more than its size"
kind = "logic"
severity = "low"
test = "TestHegelPinTwoQueueFixedSize"
found = { commit = "9c13c57de0bedd6b3e21183b34072e417ffa69d1", version = "v2.0.7", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
TwoQueueCache is documented as "a thread-safe fixed size 2Q cache" and New2QParams accepts
recentRatio within [0, 1]. With recentRatio 1 the recent list's target size equals the cache
size, and ensureSpace(recentEvict = true), called when a key from the ghost list is re-added,
evicts from the recent list only while it is *above* its target; at exactly the target it
falls through to frequent.RemoveOldest(), which does nothing when the frequent list is empty,
and the key is then added to frequent: New2QParams(2, 1, 0.5) after Add(2), Add(0), Add(1)
(2 goes to the ghost list) and Add(2) again holds 3 entries (Keys [2 0 1], Len 3, Cap 2).
The overflow is one entry (later evictions come from the frequent list, now non-empty). Any
ratio below 1 is unaffected, since the recent list can then be at its target only when
frequent has entries or the total is below the size. The pin asserts Len <= Cap.
'''
