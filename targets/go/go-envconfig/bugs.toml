# Bugs found in sethvargo/go-envconfig by the Hegel zoo. Schema: see the zoo's README.

[[bug]]
id = "go-envconfig/1"
title = "An unset url.URL field is not left zero: its User pointer is initialized and it prints as //@"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnsetURLStaysZero"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A struct-typed field whose variable is unset (no default, no decodeunset) is walked as a nested
struct (processWith, "Special case handle structs"). url.URL has an exported pointer field,
User *Userinfo, and the walk materializes nil struct pointers ("deeply initialize all fields"), so
after Process an unset `U url.URL \`env:"U"\`` is url.URL{User: &url.Userinfo{}}: U != url.URL{},
and U.String() is "//@" instead of "". A *url.URL field ends as a pointer to that value. Only
noinit (or DefaultNoInit) avoids it. The README's initialization rule is meant for the user's
nested configuration structs; a type with a decoder (BinaryUnmarshaler here) has no fields of its
own to initialize, and its zero value should stay zero.
'''

[[bug]]
id = "go-envconfig/2"
title = "Decoders of non-struct types run on unset variables without decodeunset"
kind = "contract"
severity = "medium"
test = "TestHegelPinDecodersSkipUnset"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README, decodeunset: "The default behavior is to skip running decoders on unset environment
variable values". That holds for struct-typed fields only (processWith checks found ||
usedDefault || decodeUnset before processAsDecoder). For every other type with a decoder (a
Decoder/DecoderCtx on a string type, Base64Bytes, HexBytes, a TextUnmarshaler...) the field goes
through processField, which calls processAsDecoder with the empty string whatever the lookup
found; decodeUnset is not consulted on that path at all. So with nothing set, `D myDecoder
\`env:"D"\`` receives EnvDecode(""), a Base64Bytes field becomes a non-nil empty slice, and a
decoder that rejects "" makes Process fail for a variable the user never mentioned. Conversely
decodeunset has no effect on such fields under noinit (processField returns first). The pin
processes a Decoder-typed string field and a Base64Bytes field with an empty lookup.
'''

[[bug]]
id = "go-envconfig/3"
title = "overwrite does not apply an empty value: the existing value stays"
kind = "contract"
severity = "low"
test = "TestHegelPinOverwriteAppliesEmpty"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README: "overwrite - force overwriting existing non-zero struct values if the environment
variable was provided", and, under default: "If the environment variable is the empty string,
envconfig considers that a 'value'". With `S string \`env:"S,overwrite"\`` holding "existing" and
S="" in the lookuper, S stays "existing": processField returns before setting anything when the
value is empty. The variable was provided, so per the README the field should be overwritten
with the (empty) value. The same holds for every kind.
'''

[[bug]]
id = "go-envconfig/4"
title = "DefaultRequired turns every field with a default into an ErrRequiredAndDefault error"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDefaultRequiredAllowsDefaults"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Config.DefaultRequired "is the default value for marking a field as required". processWith
computes required = structRequired || opts.Required and hands it to lookup, which rejects
required together with a default (ErrRequiredAndDefault, documented for the tag combination
`env:"D,required,default=foo"`). So a Config with DefaultRequired fails on the first field that
carries a default - `Port int \`env:"PORT,default=8080"\`` gives "Port: field cannot be required
and have a default value" - and a struct with any default cannot use the option, although a
field with a default always has a value and is never missing. The check belongs to the explicit
tag combination only (or the Config-level default should not apply to fields with a default).
'''

[[bug]]
id = "go-envconfig/5"
title = "Mutators are not applied to struct-typed fields decoded by a decoder (time.Time, url.URL)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMutatorsApplyToStructFields"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Mutator doc: "Mutators act like middleware and alter values for subsequent processing ...
Mutators are only called on defined values". The mutator loop sits in processWith's non-struct
path only; the struct path ("Special case handle structs") hands the looked-up value straight to
processAsDecoder. So for `U url.URL \`env:"U"\`` (or *url.URL, time.Time, any struct with a
TextUnmarshaler/BinaryUnmarshaler/Decoder) no mutator runs: a secret-resolving or
whitespace-trimming mutator sees every string field but not the URL fields, silently. The pin
installs a mutator that records the keys it sees and rewrites a host: it is called for the
string field only and the URL keeps the unmutated host.
'''

[[bug]]
id = "go-envconfig/6"
title = "Struct-typed decoder fields are decoded over an existing non-zero value without overwrite"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStructDecoderRespectsOverwrite"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README, overwrite rules: without overwrite an existing non-zero struct value is kept even when
the variable is provided (the tests "no_overwrite/*" check this for strings, pointers and nested
structs). The struct path in processWith does not apply the rule: when the variable is found,
processAsDecoder runs and replaces the value. A `T time.Time \`env:"T"\`` pre-set to 2000-01-01
becomes the variable's 2020 date while a Decoder-typed string field next to it keeps its
existing value, as documented. Any pre-populated time.Time or url.URL configuration is thus
overwritten from the environment regardless of overwrite.
'''

[[bug]]
id = "go-envconfig/7"
title = "LegacyMutatorFunc stops the mutator chain after itself"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLegacyMutatorContinuesTheChain"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
LegacyMutatorFunc "wraps the previous-style mutator function and returns a new one" so that old
mutators keep working; it returns `v, true, err` - stop = true - so every mutator after it in
Config.Mutators is skipped. With Mutators{LegacyMutatorFunc(append "1"), MutatorFunc(append "2")}
and S="s", S ends as "s1", not "s12". The old signature had no say on the chain (all mutators
ran in order), so the wrapper should return stop = false; the doc's "inherently lossy" refers to
the missing key/value arguments, not to the chain. The pin is the two-mutator case.
'''

[[bug]]
id = "go-envconfig/8"
title = "README: the escaped-backslash default example does not give the value it shows"
kind = "documentation"
severity = "low"
test = "TestHegelPinReadmeBackslashExample"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README, default: "To have a literal backslash followed by a `$`, escape the backslash:
`Filepath string \`env:"FILEPATH, default=C:\\Personal\\\\$name"\`` // Default: C:\Personal\$name".
The value is C:\Personal\ followed by the expansion of $name (the empty string when unset;
"C:\Personal\NAME" with name=NAME), since the doubled backslash is a literal backslash and the $
that follows starts a reference, as the code's own comment on \\\\ says. Either the comment
should read `// Default: C:\Personal\<value of $name>` or the sentence should not promise a
literal $. The pin processes the README's field with nothing set and expects the README's value.
'''

[[bug]]
id = "go-envconfig/9"
title = "A decoder error on a struct-typed field is not prefixed with the field name"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinStructDecoderErrorNamesTheField"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Every error from processWith is wrapped as "<Field>: <cause>" (private field, lookup errors,
mutator errors, processField errors, nested struct errors) - except the error of processAsDecoder
in the struct path, which is returned bare ("return err"). `When time.Time \`env:"WHEN"\`` with
WHEN=nope fails with "Time.UnmarshalBinary: unsupported version" (also the least helpful of the
three decoders tried, but that is documented: "we'll return the most recent error"), while a
Decoder-typed string field fails with "D: bad dec". A nested struct's wrapper then produces
"Sub: Time.UnmarshalBinary: ..." with the field missing in the middle.
'''

[[bug]]
id = "go-envconfig/10"
title = "Unsupported element and field kinds decode silently to zero values"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnsupportedKindsAreErrors"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Godoc: "All built-in types are supported except Func and Chan"; interfaces are rejected with
"cannot decode into interfaces". processField's kind switch has no default case, so a kind it
does not handle is accepted silently: `L []sub \`env:"L"\`` (sub a struct without a decoder) with
L=a,b becomes two zero structs and no error, a struct map value likewise, and `F func() \`env:"F"\``
or a chan field with a variable set is ignored without error. A configuration typo of that kind
is undetectable; an error like the interface one is expected.
'''

[[bug]]
id = "go-envconfig/11"
title = "DefaultDecodeUnset is not inherited by nested structs, unlike the other Config defaults"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinDecodeUnsetIsInherited"
found = { commit = "c883e6f492ed6ca42f582a4cf52b610b07943b17", version = "v1.4.3", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
processWith recurses into a nested struct with a Config carrying DefaultDelimiter,
DefaultSeparator, DefaultNoInit, DefaultOverwrite and DefaultRequired resolved for the field -
but not DefaultDecodeUnset (nor the field's decodeunset). So under Config{DefaultDecodeUnset:
true} an unset `T time.Time \`env:"T"\`` at the top level is decoded (and fails, "no data"), while
the same field one level down, in `Sub struct{...} \`env:",prefix=S_"\``, is not decoded and
there is no error. The godoc describes all six as defaults of the same standing. Found by the
model, which had to keep decodeunset out of nested scopes to agree.
'''
