[[bug]]
id = "tcell/1"
title = "TParm ends a skipped conditional branch at the first %e or %; it meets, so a nested conditional in that branch derails the evaluation"
kind = "logic"
severity = "high"
test = "TestHegelPinNestedConditional"
found = { commit = "fa7af6a9ff9c62a2f521b27ef975764b6e6bdf40", version = "untagged (v2 branch, 5 commits after v2.13.10, 2026-08-20)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
terminfo(5) says "%? expr %t thenpart %e elsepart %;" and that conditionals nest; ncurses' tparm
counts the nesting level while it skips a branch. TParm (terminfo/terminfo.go) keeps a flat
`skip` state: after a false %t it resumes at the first %e or %; it sees, after a taken branch's
%e at the first %;, whatever the nesting. So `%?%p1%t%?%p2%tA%eB%;%eC%;` with p1 = 0 prints B
(the inner else) instead of C, and `%?%p1%tX%e%?%p2%tA%;Y%;Z` with p1 = 1 prints XYZ instead of
XZ: the inner %; ends the outer skip and the rest of the outer else is emitted. 99 entries of
the installed ncurses 6.4 database nest conditionals (avatar0's sgr, the d430 family, ...).
Found by TestHegelTParm against tput; the property's model reproduces it with the flatSkip
switch while Known.flatConditionals is on.
'''

[[bug]]
id = "tcell/2"
title = "TParm prints %# and %. formats and the space flag as text unless they follow a colon"
kind = "logic"
severity = "low"
test = "TestHegelPinFlagsWithoutColon"
found = { commit = "fa7af6a9ff9c62a2f521b27ef975764b6e6bdf40", version = "untagged (v2 branch, 5 commits after v2.13.10, 2026-08-20)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
terminfo(5): "%[[:]flags][width[.precision]][doxXs]", the colon being needed only so that the
- and + flags are not read as the operators. ncurses accepts `%#x`, `% d` and `%.5d` without
it; TParm's format case is entered only on a digit, x, X, o or the colon, so `%p1%#x` prints
"%#x" (the two characters and then the x as literal text) instead of 0xff, `%p1%.5d` prints
"%.5d" instead of 00255 and `%p2% d` prints "% d" instead of " 7". With the colon
(`%:#x`) the same formats work. No entry of the installed database uses these forms.
Found by TestHegelTParm against tput; modelled with the literalFlags switch while
Known.flagsNeedColon is on.
'''

[[bug]]
id = "tcell/3"
title = "dynamic.LoadTerminfo never sees the Tc and RGB flags it tests for, because it runs infocmp without -x"
kind = "logic"
severity = "medium"
test = "TestHegelPinTrueColorFlag"
found = { commit = "fa7af6a9ff9c62a2f521b27ef975764b6e6bdf40", version = "untagged (v2 branch, 5 commits after v2.13.10, 2026-08-20)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Tc (tmux's true-colour flag) and RGB (ncurses' xterm-direct flag) are user-defined
capabilities, which infocmp prints only with -x. setupterm (terminfo/dynamic/dynamic.go) runs
`infocmp -1 name`, so getflag("Tc") and getflag("RGB") are always false: TrueColor stays false
for every entry, and the xterm-direct rewrite of SetFg/SetBg for RGB never happens, although
the code and its comments are written to handle both. An entry compiled from `Tc, cup=...`
loads with TrueColor = false. (LookupTerminfo's COLORTERM fallback is unaffected.)
Found by TestHegelLoad; the model treats the flags as invisible while
Known.extendedCapsUnread is on.
'''

[[bug]]
id = "tcell/4"
title = "dynamic's unescape reads the caret of the %^ operator as a control-character prefix, corrupting the string and the character after it"
kind = "logic"
severity = "medium"
test = "TestHegelPinXorOperator"
found = { commit = "fa7af6a9ff9c62a2f521b27ef975764b6e6bdf40", version = "untagged (v2 branch, 5 commits after v2.13.10, 2026-08-20)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
%^ is the xor operator of the parameter language; tic keeps it literal in a source and infocmp
prints it raw (a caret that is a character is printed \^). unescape (terminfo/dynamic/dynamic.go)
treats every unescaped ^ as the start of a control character, so `cup=\E[%p1%p2%^%dX` loads as
"\x1b[%p1%p2%edX": the caret is gone and the % after it became 'e' (0x25 xor 0x40). Three
entries of the installed database have %^ in their cup (datamedia2500, dm2500, dmchat:
`cup=\014%p2%'`'%^%c%p1%'`'%^%c`), so their cursor addressing is broken after loading; ten more
(icl6402, kds7372, ncr160vppp, ...) have it in function-key strings. Found by TestHegelLoad
(and by TestHegelDatabase on the real entries); the property counts entries whose loaded
strings contain %^ while Known.caretAfterPercent is on.
'''

[[bug]]
id = "tcell/5"
title = "TParm does not implement the logical operators %A and %O and prints them as text"
kind = "logic"
severity = "medium"
test = "TestHegelPinLogicalOperators"
found = { commit = "fa7af6a9ff9c62a2f521b27ef975764b6e6bdf40", version = "untagged (v2 branch, 5 commits after v2.13.10, 2026-08-20)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
terminfo(5) lists %A and %O (logical and, or) beside %& %| %^ and %! %~; TParm's switch has the
bitwise and unary operators but neither logical one, so they fall to the default case, which
emits "%A" or "%O" as text and leaves both operands on the stack: `%?%p1%p2%A%tX%eY%;` with
1, 1 prints "%AX" and `%p1%p2%O%d` with 0, 0 prints "%O0". 13 entries of the installed
database use them (att5310's and att5320's cpi, wy99-ansi's and the wy99f family's sgr,
hds200, minitel1-nb). Found by TestHegelTParm against tput; modelled with the literalLogic
switch while Known.noLogicalOps is on.
'''

[[bug]]
id = "tcell/6"
title = "TParm reads printf flags only before the width, so a flag after the 0 flag ends the format and the rest prints as text"
kind = "logic"
severity = "low"
test = "TestHegelPinFlagOrder"
found = { commit = "fa7af6a9ff9c62a2f521b27ef975764b6e6bdf40", version = "untagged (v2 branch, 5 commits after v2.13.10, 2026-08-20)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
printf flags come in any order; ncurses hands the whole `%[:]flags width .precision conv` to
sprintf, so `%:0-5d` of 7 prints "7    " (- overrides 0, as in C). TParm's format parser takes
flags (+ - # space) only up to the first digit, and 0 is a digit to it: in `%:0-5d` the 0 is
read as a width, the - is then not a digit, not a conversion, so nothing is printed and the
value stays on the stack, and "5d" follows as literal text: the result is "5d". `%:-05d`
works. No entry of the installed database is affected. Found by TestHegelTParm against tput;
modelled with the strictFlagOrder switch while Known.strictFlagOrder is on.
'''
