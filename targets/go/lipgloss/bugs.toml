# Bugs found in charm.land/lipgloss/v2 by the Hegel properties. Each is pinned by a
# TestHegelPin* test in hegel.patch and listed under [expected_failures] in target.toml.

[[bug]]
id = "lipgloss/1"
title = "Underline or Strikethrough styles the text rune by rune, tearing grapheme clusters apart"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSpaceStylerTearsGraphemeClusters"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
When `useSpaceStyler` is set (any style with Underline, Strikethrough, UnderlineSpaces or
StrikethroughSpaces) `Style.Render` iterates the line with `for _, r := range line` and wraps
every rune in its own SGR pair. A ZWJ emoji sequence or a base letter with combining marks is
thus split by escape sequences: `NewStyle().Underline(true).Render("👨‍👩‍👧")` renders as five
separately styled pieces (`\x1b[4;4m👨\x1b[m\x1b[4;4m‍\x1b[m…`), terminals show three
emoji, and `ansi.StringWidth` of the result is 6 instead of 2, so every layout step after it
(padding, alignment, borders, joins) works with the wrong width. The property
`TestHegelRenderFollowsTheBlockModel` counts these cases as `cluster-torn`.
'''

[[bug]]
id = "lipgloss/2"
title = "Reverse is dropped from spaces when the space styler is active"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReverseDroppedFromSpacesUnderUnderline"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
On the rune-by-rune path the spaces get `teSpace`, which carries only the colours, the
underline colour, and Underline/Strikethrough according to UnderlineSpaces /
StrikethroughSpaces. Reverse (and bold, faint, italic, blink, which are invisible on a blank)
is not copied, so `NewStyle().Reverse(true).Underline(true).Render("a b")` yields
`\x1b[4;7;4ma\x1b[m\x1b[4m \x1b[m\x1b[4;7;4mb\x1b[m`: a reversed string with an unreversed hole
at every space. Underline is on by default with UnderlineSpaces, so any Reverse+Underline
style shows it. The property tolerates the difference (`tolerated-reverse-dropped-on-space`).
'''

[[bug]]
id = "lipgloss/3"
title = "Spaces get a single underline whatever UnderlineStyle the text has"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSpacesUnderlinedSingleUnderCurlyText"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`teSpace` is built with `Underline(true)` (SGR 4) and never with the style's `UnderlineStyle`,
so `NewStyle().UnderlineStyle(ansi.UnderlineCurly).Render("a b")` renders the letters with
`4:3` and the space with a plain `4`: a curly underline under the words and a straight one
under the spaces. The same happens for double, dotted and dashed underlines. Tolerated by the
property as `tolerated-single-underline-on-space`.
'''

[[bug]]
id = "lipgloss/4"
title = "A Hyperlink covers the padding, alignment, border and margin cells between the first and last line"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHyperlinkCoversPaddingOfContinuationLines"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Style.Render` wraps the whole styled text — newlines included — in one OSC 8 pair and then
pads, aligns, borders and margins each line. The opening sequence sits before the first
line's text and the closing one after the last line's, so everything added in between is
part of the link: the right padding of the first line, both paddings, the left border and
the margins of every continuation line, while the first line's left padding and the last
line's right padding are not. `NewStyle().Hyperlink("https://example.com").PaddingLeft(2).Render("a\nb")`
= `"  \x1b]8;;https://example.com\aa\n  b\x1b]8;;\a"`: clicking the second line's padding
opens the link, clicking the first line's does not. Tolerated by the property as
`tolerated-link-on-whitespace`.
'''

[[bug]]
id = "lipgloss/5"
title = "PlaceHorizontal and PlaceVertical mirror fractional positions (0.9 lands near the start)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlaceMirrorsFractionalPositions"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
For a position other than Left/Right (Top/Bottom) both functions compute
`split := round(gap*pos); left := gap - split; right := gap - left`, i.e. the text is placed
after `gap - round(gap*pos)` cells. `PlaceHorizontal(10, 0.9, "ab")` = `" ab       "` and
`PlaceVertical(4, 0.9, "ab")` = `"ab\n  \n  \n  "`, the opposite of the documented meaning
("0 represents the start, 1 the end") and of `JoinVertical(0.9, …)` / `JoinHorizontal(0.9, …)`,
which put the text on the right / at the bottom. Center is unaffected (symmetric, up to the
odd cell). `TestHegelPlaceFollowsItsModel` counts fractional positions as
`fractional-position-mirrored` and checks the constants only. Reported upstream as
charmbracelet/lipgloss#236 ("Text alignment logic is backwards for non-special-cases", open
since October 2023, no maintainer reply), which names the same lines of position.go.
'''

[[bug]]
id = "lipgloss/6"
title = "Height is ignored when AlignVertical is a fractional position"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHeightIgnoredForFractionalVerticalAlign"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`alignTextVertical` handles Top, Center and Bottom and returns the text unchanged for any
other Position, so `NewStyle().Height(4).AlignVertical(0.3).Render("ab")` is `"ab"` (one line)
while `Height(4).Render("ab")` is four lines. A style's height silently depends on the
alignment value being one of three constants. The generators use the constants only.
'''

[[bug]]
id = "lipgloss/7"
title = "A fractional horizontal alignment is treated as Left"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFractionalHorizontalAlignIsLeft"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`alignTextHorizontal` switches on Right and Center and pads on the right otherwise, so
`NewStyle().Width(6).Align(0.9).Render("ab")` = `"ab    "`, the same as `Align(Left)`,
although `Position` is documented as a value between 0 (left) and 1 (right) and
`PlaceHorizontal`/`JoinVertical` do interpolate. The generators use the constants only.
'''

[[bug]]
id = "lipgloss/8"
title = "table: Width ignores the borders when deciding whether to shrink, and the right border is clipped"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWidthIgnoresBordersWhenDecidingToShrink"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`optimizedWidths` compares `maxTotal()` — the sum of the columns' content widths, without the
border columns — to the table width and expands when it fits, so a table whose content plus
borders exceeds `Width` by up to the number of border columns is never shrunk; the final
`MaxWidth(t.width)` then clips the rendering and the right border disappears:
`New().Row("abcd", "k").Width(7).String()` is `"┌────┬─\n│abcd│k\n└────┴─"`. The property
gates this shape (`lipgloss/8-shape`: content total ≤ width < content total + borders).
'''

[[bug]]
id = "lipgloss/9"
title = "table: shrinkToMedian never shrinks the first column"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinShrinkToMedianSkipsTheFirstColumn"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`shrinkToMedian` finds the column with the biggest excess over its median width and stops
with `if biggestDiffToMedianIndex <= 0 { break }`, so the pass ends as soon as that column is
column 0 (index 0 is conflated with "none found") and the later passes cut the biggest other
column instead. Rows `("aaaaaa","bbbbbbb","ccccccc")`, `("a","bbbbb","ccccccc")`,
`("aaa","bbbbbbb","ccccccc")` at `Width(19)` get column widths 3/5/7 while the same rows with
the columns reversed get 7/6/2 — the layout depends on column order. The property only
checks the total width when the table has to shrink.
'''

[[bug]]
id = "lipgloss/10"
title = "table: the bottom border is clipped when a table with Height has no headers"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBottomBorderClippedWithoutHeaders"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`computeHeight` is `sum(row heights) - 1 + btoi(hasHeaders) + top + bottom + borderHeader +
rows*borderRow`; without headers and with `BorderHeader(false)` it is one short, and
`String()` clips the rendering with `MaxHeight(min(t.height, computeHeight()))`, so
`New().Row("a").BorderHeader(false).Height(10).String()` is `"┌─┐\n│a│"` — the bottom border
is lost although the height allows it (the same table without `Height` is complete). Gated
as `lipgloss/10-shape` when Height is set and computeHeight is below both the height and the
expected line count.
'''

[[bug]]
id = "lipgloss/11"
title = "table: the header row's height follows the last column's padding only"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHeaderHeightFollowsTheLastColumn"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`expandRowHeights` sets the header height to `1 + yPaddingForCell(0, j)` inside the column
loop, so the last column wins instead of the maximum over the header cells. A header cell
with `PaddingTop(1)` in an earlier column is rendered two lines tall while the row height is
one, and `JoinHorizontal` pads the other cells: an extra line without any border characters
(`" A   "`) appears above the header. Gated as `lipgloss/11-shape` when header cells have
different vertical frames.
'''

[[bug]]
id = "lipgloss/12"
title = "table: Wrap(false) drops every line after the first of a multi-line cell"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNoWrapDropsTheLinesAfterTheFirst"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
With wrapping off (and always for headers) a cell is cut with `ansi.Truncate(cell,
width*height - padding, "…")`, which does not count newlines, and then to one line by
`MaxHeight`: the lines after the first vanish without a marker, and a cell that starts with
a newline renders blank — `New().Row("\nfoo", "x").Wrap(false)` shows an empty first cell.
Gated as `lipgloss/12-shape`.
'''

[[bug]]
id = "lipgloss/13"
title = "table: the overflow row takes the previous row's padding when the table has headers"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOverflowRowPaddingOffByOneWithHeaders"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`visibleRowIndexes` sizes the overflow row ("…") with `1 + yPaddingForCell(lastVisible+1,
0)`, indexing `yPaddings` without the header row and looking at column 0 only, so with
headers the overflow row gets the padding of the row before it (and a padded second column
is never seen). A table of rows a–d with `PaddingTop(1)` on row 2 and `Height(7)` fits four
lines of data and its overflow row becomes a padding line: no "…" at all. Gated as
`lipgloss/13-shape` when the overflow row is styled.
'''

[[bug]]
id = "lipgloss/14"
title = "tree: two hidden children at the end of a branch leave the last visible child with ├──"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTrailingHiddenChildrenKeepTheBranch"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`renderer.render` removes a hidden child only when it directly follows the child being
examined, once per iteration, so with two hidden children in a row at the end the second stays
counted and the last visible child is drawn with the non-final `├──` (and a `│` indent for
its own children). Gated as `lipgloss/14-shape` when two hidden children are adjacent.
'''

[[bug]]
id = "lipgloss/15"
title = "tree: Width pads only the last line of a multi-line item"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWidthPadsOnlyTheLastLineOfAMultilineItem"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The width padding is appended to the whole multi-line string (`line + itemStyle.Render(pad)`
where `line` already holds every line of the item), so only the last line reaches the width:
`Root("r").Child("a\nb").Width(10)` renders `"└── a"` five cells wide above a padded second
line. Gated as `lipgloss/15-shape` (multi-line item and Width set).
'''

[[bug]]
id = "lipgloss/16"
title = "tree: Offset's end is documented as an index but used as a count from the end"
kind = "contract"
severity = "medium"
test = "TestHegelPinOffsetEndIsACountFromTheEnd"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Tree.Offset(start, end)` swaps and clamps `end` like an index (`end > Length → Length`, a
negative end means the length), but `Children()` iterates `i < Length - offset[1]`, treating
it as a count from the end. The list package's documented example `list.New("A","B","C","D")
.Offset(1, -1)` therefore renders nothing (start 1, "end" = 4 items dropped); `Offset(1, 3)`
shows B only instead of B and C. The property passes a count from the end and models it as
such.
'''

[[bug]]
id = "lipgloss/17"
title = "list: the Alphabet enumerator labels every 26th block of 26 items with '@'"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAlphabetEnumeratorYieldsAnAtSign"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`list.Alphabet`'s three-letter branch computes the middle letter as `'A' + (i/26)%26 - 1`,
which is `'@'` whenever `(i/26)%26 == 0`: `Alphabet(nil, 1364)` is `"B@M."` where the
bijective base-26 sequence (…, ZZ, AAA, …) gives `"AZM."`. Items 702–727, 1378–1403, … get a
non-letter label. Gated as `lipgloss/17-shape`; `Roman` is correct.
'''

[[bug]]
id = "lipgloss/18"
title = "table: Wrap(false) ignores vertical padding, so a padded cell loses its text"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNoWrapIgnoresVerticalPadding"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
Row heights are the styles' `Height` only; the vertical frame is added in `expandRowHeights`,
which returns early when wrapping is off. A cell with `PaddingTop(1)` is rendered two lines
tall and then cut to one line by `MaxHeight(1)`, keeping the padding line:
`New().Row("x").Wrap(false)` with `PaddingTop(1)` shows no "x". Gated as
`lipgloss/18-shape`.
'''

[[bug]]
id = "lipgloss/19"
title = "Compositor.Render draws layers at absolute coordinates on a canvas sized to the bounds"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinCompositorRenderDropsContentAwayFromTheOrigin"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Compositor.Render` allocates a canvas of `Bounds().Dx() × Dy()` and draws every layer at its
absolute `Bounds()` instead of relative to `Bounds().Min`, so a layer tree that does not start
at the origin renders shifted off the canvas: `NewCompositor(NewLayer("ab").X(3).Y(2))
.Render()` is `""` although `Bounds()` is `(3,2)-(5,3)`. Anything placed below and to the
right of the origin is lost, and mixed cases lose their far edge. The property gates this
shape (`lipgloss/19-shape`) and checks `Hit`, `Bounds` and the layer sizes regardless.
'''

[[bug]]
id = "lipgloss/20"
title = "tree: auto-nesting a rootless tree onto a hidden leaf makes it visible"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAutoNestingUnhidesTheLeaf"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`ensureParent` turns a rootless child tree into the previous sibling leaf by copying the
leaf's value only; the leaf's hidden flag is dropped, so `Root("r").Child("a",
NewLeaf("h", true), tree.New().Child("x"))` shows `h` with `x` under it. The property's
model of auto-nesting keeps the hidden flag and this case is fixed in the pin.
'''

[[bug]]
id = "lipgloss/21"
title = "tree: a hidden first child keeps its index and shifts the enumeration"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHiddenFirstItemShiftsTheNumbering"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
The renderer removes hidden children only when they follow the child under examination, so a
hidden child at index 0 is never removed from the enumeration: `list.New(NewLeaf("h", true),
"a", "b").Enumerator(list.Arabic)` is `"2. a\n3. b"`. Gated as `lipgloss/21-shape` (a
counting enumerator with a hidden first child).
'''

[[bug]]
id = "lipgloss/22"
title = "Compositor draws equal-z layers out of insertion order once there are more than twelve"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCompositorDrawOrderIsUnstablePastTwelveLayers"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Compositor.flatten` orders the flattened layers with `slices.SortFunc` by z, which is not a
stable sort: up to twelve elements Go's pdqsort is an insertion sort and layers with the same
z keep their insertion order (later on top, as `Canvas` documents and `Draw`/`Hit` rely on),
but from thirteen elements — the compositor's own root layer counts — the partitioning
reorders equal keys. Thirteen single-cell layers at the origin with z
`[2 0 1 0 2 2 2 1 1 0 1 0 1]` render `"a"` (the first z-2 layer) and `Hit(0,0)` returns it,
where twelve layers show the last z-2 layer; the same siblings drawn in a different order,
or a child under its parent, once a UI has a dozen layers. The property gates the shape
(`lipgloss/22-shape`, twelve generated layers) and checks Bounds and sizes regardless.
'''
