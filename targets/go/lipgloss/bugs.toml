# Bugs found in charm.land/lipgloss/v2 by the Hegel properties. Each is pinned by a
# TestHegelPin* test in hegel.patch and listed under [expected_failures] in target.toml.

[[bug]]
id = "lipgloss/1"
title = "Underline or Strikethrough styles the text rune by rune, tearing grapheme clusters apart"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSpaceStylerTearsGraphemeClusters"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
When `useSpaceStyler` is set (any style with Underline, Strikethrough, UnderlineSpaces or
StrikethroughSpaces) `Style.Render` iterates the line with `for _, r := range line` and wraps
every rune in its own SGR pair. A ZWJ emoji sequence or a base letter with combining marks is
thus split by escape sequences: `NewStyle().Underline(true).Render("👨‍👩‍👧")` renders as five
separately styled pieces (`\x1b[4;4m👨\x1b[m\x1b[4;4m‍\x1b[m…`), terminals show three
emoji, and `ansi.StringWidth` of the result is 6 instead of 2, so every layout step after it
(padding, alignment, borders, joins) works with the wrong width. The property
`TestHegelRenderFollowsTheBlockModel` counts these cases as `cluster-torn`.
'''

[[bug]]
id = "lipgloss/2"
title = "Reverse is dropped from spaces when the space styler is active"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReverseDroppedFromSpacesUnderUnderline"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
On the rune-by-rune path the spaces get `teSpace`, which carries only the colours, the
underline colour, and Underline/Strikethrough according to UnderlineSpaces /
StrikethroughSpaces. Reverse (and bold, faint, italic, blink, which are invisible on a blank)
is not copied, so `NewStyle().Reverse(true).Underline(true).Render("a b")` yields
`\x1b[4;7;4ma\x1b[m\x1b[4m \x1b[m\x1b[4;7;4mb\x1b[m`: a reversed string with an unreversed hole
at every space. Underline is on by default with UnderlineSpaces, so any Reverse+Underline
style shows it. The property tolerates the difference (`tolerated-reverse-dropped-on-space`).
'''

[[bug]]
id = "lipgloss/3"
title = "Spaces get a single underline whatever UnderlineStyle the text has"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSpacesUnderlinedSingleUnderCurlyText"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`teSpace` is built with `Underline(true)` (SGR 4) and never with the style's `UnderlineStyle`,
so `NewStyle().UnderlineStyle(ansi.UnderlineCurly).Render("a b")` renders the letters with
`4:3` and the space with a plain `4`: a curly underline under the words and a straight one
under the spaces. The same happens for double, dotted and dashed underlines. Tolerated by the
property as `tolerated-single-underline-on-space`.
'''

[[bug]]
id = "lipgloss/4"
title = "A Hyperlink covers the padding, alignment, border and margin cells between the first and last line"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHyperlinkCoversPaddingOfContinuationLines"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Style.Render` wraps the whole styled text — newlines included — in one OSC 8 pair and then
pads, aligns, borders and margins each line. The opening sequence sits before the first
line's text and the closing one after the last line's, so everything added in between is
part of the link: the right padding of the first line, both paddings, the left border and
the margins of every continuation line, while the first line's left padding and the last
line's right padding are not. `NewStyle().Hyperlink("https://example.com").PaddingLeft(2).Render("a\nb")`
= `"  \x1b]8;;https://example.com\aa\n  b\x1b]8;;\a"`: clicking the second line's padding
opens the link, clicking the first line's does not. Tolerated by the property as
`tolerated-link-on-whitespace`.
'''

[[bug]]
id = "lipgloss/5"
title = "PlaceHorizontal and PlaceVertical mirror fractional positions (0.9 lands near the start)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlaceMirrorsFractionalPositions"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
For a position other than Left/Right (Top/Bottom) both functions compute
`split := round(gap*pos); left := gap - split; right := gap - left`, i.e. the text is placed
after `gap - round(gap*pos)` cells. `PlaceHorizontal(10, 0.9, "ab")` = `" ab       "` and
`PlaceVertical(4, 0.9, "ab")` = `"ab\n  \n  \n  "`, the opposite of the documented meaning
("0 represents the start, 1 the end") and of `JoinVertical(0.9, …)` / `JoinHorizontal(0.9, …)`,
which put the text on the right / at the bottom. Center is unaffected (symmetric, up to the
odd cell). `TestHegelPlaceFollowsItsModel` counts fractional positions as
`fractional-position-mirrored` and checks the constants only. Reported upstream as
charmbracelet/lipgloss#236 ("Text alignment logic is backwards for non-special-cases", open
since October 2023, no maintainer reply), which names the same lines of position.go.
'''

[[bug]]
id = "lipgloss/6"
title = "Height is ignored when AlignVertical is a fractional position"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHeightIgnoredForFractionalVerticalAlign"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`alignTextVertical` handles Top, Center and Bottom and returns the text unchanged for any
other Position, so `NewStyle().Height(4).AlignVertical(0.3).Render("ab")` is `"ab"` (one line)
while `Height(4).Render("ab")` is four lines. A style's height silently depends on the
alignment value being one of three constants. The generators use the constants only.
'''

[[bug]]
id = "lipgloss/7"
title = "A fractional horizontal alignment is treated as Left"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFractionalHorizontalAlignIsLeft"
found = { commit = "6a419c6543d3475a369ef08f6252a2a6f33be733", version = "v2 (charm.land/lipgloss/v2), untagged main 2026-09-11", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`alignTextHorizontal` switches on Right and Center and pads on the right otherwise, so
`NewStyle().Width(6).Align(0.9).Render("ab")` = `"ab    "`, the same as `Align(Left)`,
although `Position` is documented as a value between 0 (left) and 1 (right) and
`PlaceHorizontal`/`JoinVertical` do interpolate. The generators use the constants only.
'''
