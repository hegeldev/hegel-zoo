# Bugs found in sourcegraph/go-diff by the Hegel properties (see README.md).

[[bug]]
id = "go-diff/1"
title = "ReverseFileDiff leaves the two sections of a GIT binary patch in forward order, so the reversed patch re-applies the forward change"
kind = "logic"
severity = "medium"
test = "TestHegelPinReverseBinaryPatch"
found = { commit = "cf64c6246685b0596f91cd0b170af38196b8dbfd", version = "v0.9.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
git diff --binary writes, after "GIT binary patch", a forward section ("literal N" or
"delta N", base85 lines, blank line) and then the reverse section; git apply uses the first
and git apply -R the second. ReverseFileDiff swaps the index hashes and the diff --git
arguments but copies the sections unchanged, so the reversed FileDiff describes the forward
change on the reversed index line. git apply rejects the printed result: "binary patch to
'a.txt' creates incorrect result (expecting <old>, got <new>)". Found by
TestHegelMultiFile, which reverses git's diff of a random change and applies it to the new
tree; the property swaps the sections itself while the bug is open.
'''

[[bug]]
id = "go-diff/2"
title = "A removed line starting with -- and an added line starting with ++ before the next hunk header are taken for a file header"
kind = "logic"
severity = "medium"
test = "TestHegelPinDashLinesInHunk"
found = { commit = "cf64c6246685b0596f91cd0b170af38196b8dbfd", version = "v0.9.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HunksReader.ReadHunk ends the current file when a body line starts with "---", the next
with "+++" and the one after with "@@ ", without consulting the hunk header's line counts.
GNU diff -U0 of a text whose line "--x" is replaced by "++y" writes exactly that:

    @@ -2 +2 @@
    ---x
    +++y
    @@ -4 +4 @@

ParseFileDiff fails with "bad hunk line (does not start with ' ', '-', '+', or '\\'): ---x";
ParseMultiFileDiff fails the same way, and when the lines are "--- x" / "+++ y" (a removed
line "-- x") it silently returns two files, the second named "x" -> "y" with the remaining
hunks. patch and git apply read the same diff correctly because the header says the hunk has
one more line. Found by TestHegelParseUnified on GNU diff output.
'''

[[bug]]
id = "go-diff/3"
title = "A file name ending in a space loses the space: the header line is TrimSpaced before the tab separator is looked for"
kind = "logic"
severity = "low"
test = "TestHegelPinTrailingSpaceName"
found = { commit = "cf64c6246685b0596f91cd0b170af38196b8dbfd", version = "v0.9.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
git ends a file name that contains a space with a tab in the ---/+++ lines ("--- a/t \t")
so that the name is unambiguous. readOneFileHeader applies strings.TrimSpace to the whole
line before splitting at the tab, so "a/t " becomes "a/t" (and a name "a/ lead" keeps its
leading space only because of the "a/" prefix). The parsed FileDiff and the reprinted diff
name a different file from the one git diffed.
'''
