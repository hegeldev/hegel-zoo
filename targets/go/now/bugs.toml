# Bugs found in jinzhu/now by the Hegel zoo. Oracle: the calendar in the time's own location
# (the beginning of a unit is the first instant whose wall clock lies in it, the end the last),
# the README's Monday/Sunday/Parse examples and the upstream tests' intent.

[[bug]]
id = "now/1"
title = "BeginningOfMinute/EndOfMinute truncate the absolute time, so a location whose offset is not a whole number of minutes gets :32 seconds"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSubMinuteOffsetMinute"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
BeginningOfMinute is now.Truncate(time.Minute), which rounds the instant since the zero time,
not the wall clock. In a FixedZone("LMT", 19*60+32) — the shape of every pre-1900 local mean
time in the IANA database, and of a few later ones (Amsterdam +00:19:32 until 1937, Monrovia
-00:44:30 until 1972) — 12:34:50 has BeginningOfMinute 12:34:32 and EndOfMinute 12:35:31.999999999,
straddling the minute boundary. Every other BeginningOf* rebuilds the wall clock with time.Date
and gets this right. Fix: time.Date(y, m, d, h, min, 0, 0, loc) like BeginningOfHour.
'''

[[bug]]
id = "now/2"
title = "BeginningOfHour/EndOfHour in a repeated hour pick the other occurrence, so the end of the hour lies before the time itself; EndOfHour assumes hours are sixty minutes long"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRepeatedOrShortHour"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
BeginningOfHour rebuilds (y, m, d, h, 0, 0, 0) with time.Date, and when that wall clock exists
twice — the hour after daylight saving ends, everywhere that observes it — Go returns "a time
that is correct in one of the two zones", here the earlier one. For the second 01:30 in New
York on 2025-11-02 (01:30 EST), BeginningOfHour is 01:00 EDT and EndOfHour is 01:59:59.999999999
EDT: both an hour before the time they were asked about, so t is outside [BeginningOfHour(t),
EndOfHour(t)] and Between-style checks built on them fail once a year. EndOfHour is
BeginningOfHour + 1h - 1ns, which also assumes the hour is sixty minutes long: on Lord Howe
Island the clocks jump 02:00 → 02:30 on 2025-10-05, the hour 02 begins at 02:30, and EndOfHour
of 02:45 is 03:29:59.999999999 — inside the next hour. Fix: derive the hour from the instant
(t.Truncate(time.Hour) is right for whole-hour offsets; otherwise subtract minutes, seconds and
nanoseconds of the wall clock) and take EndOfHour as the beginning of the next hour minus 1ns,
where "next hour" is the first instant whose wall hour differs.
'''

[[bug]]
id = "now/3"
title = "When midnight does not exist (daylight saving starting at 00:00) BeginningOfDay is 23:00 of the previous day, and BeginningOfWeek, EndOfWeek, Monday, Sunday and EndOfSunday move with it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSkippedMidnightDay"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
BeginningOfDay is time.Date(y, m, d, 0, 0, 0, 0, loc). Cuba, Chile, Paraguay, Lebanon, Egypt
(since 2023), Iran (until 2022) and Brazil (until 2019) start daylight saving at midnight, so
one day a year has no 00:00; Go's time.Date then returns the instant that 00:00 would have been
in the old offset, which prints as 23:00 of the previous day. For noon on Sunday 2025-03-09 in
America/Havana: BeginningOfDay = 2025-03-08 23:00 CST (Saturday); BeginningOfWeek (Sunday
start) = 2025-03-02 23:00, a week early, because the weekday is taken from the wrong day;
Monday() = 2025-03-03 23:00 instead of 00:00; Sunday() of the Wednesday before = 2025-03-08
23:00 CST — a Saturday; EndOfSunday likewise; EndOfWeek of Saturday 2025-03-08 = 22:59:59.999999999,
an hour before the day ends, since BeginningOfWeek + 7 days lands on the missing midnight. The
first instant of the day is 01:00 CDT. Fix: after time.Date, if the result's Day() is not d,
step forward: the day begins at the first instant whose date is (y, m, d) — e.g. time.Date(y, m,
d, 12, 0, 0, 0, loc) then walk back through the transition, or use loc's transition table.
'''

[[bug]]
id = "now/4"
title = "A missing midnight on the first of the month shifts BeginningOfMonth into the previous month, and BeginningOfQuarter/EndOfQuarter/BeginningOfHalf/EndOfHalf inherit it — EndOfQuarter of a September time is 31 October"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSkippedMidnightQuarter"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Same root as now/3 at a coarser grain. BeginningOfMonth is time.Date(y, m, 1, 0, 0, 0, 0, loc);
Paraguay started daylight saving at 00:00 on 2002-09-01, so for 2002-09-30 12:00 in
America/Asuncion BeginningOfMonth is 2002-08-31 23:00 -04. BeginningOfQuarter then reads the
month as August, subtracts (8-1)%3 = 1 month and returns 2002-07-31 23:00; EndOfQuarter adds
three months and returns 2002-10-31 22:59:59.999999999 — the third quarter now ends a month
late and includes all of October. Lebanon 1990 (daylight saving from 00:00 on 1 May): for
1990-05-19 in Asia/Beirut BeginningOfHalf is 1990-01-01 01:00 EET, an hour late, because
BeginningOfMonth is 01:00 EEST and AddDate keeps the wall clock. Fix as in now/3, and compute
the quarter/half start from the month number rather than from BeginningOfMonth's result.
'''

[[bug]]
id = "now/5"
title = "EndOfDay in a repeated final hour (daylight saving ending at midnight) returns the earlier 23:59:59.999999999, which lies before the time itself"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEndOfDayInRepeatedHour"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
EndOfDay is time.Date(y, m, d, 23, 59, 59, 999999999, loc), unlike the other EndOf* which are
"next beginning minus a nanosecond". When daylight saving ends at midnight (Brazil until 2019,
Egypt since 2023, Paraguay until 2024) the hour 23:00–23:59 happens twice and time.Date picks
the first: for the second 23:30 of 2018-02-17 in America/Sao_Paulo (23:30 -03) EndOfDay is
23:59:59.999999999 -02, an hour before t. EndOfWeek and EndOfMonth of the same time are right.
Fix: EndOfDay = BeginningOfDay of the next date - 1ns (with BeginningOfDay fixed as in now/3).
'''

[[bug]]
id = "now/6"
title = "BeginningOfWeek across a skipped calendar day (Samoa, 30 December 2011) lands on the day before the week's first day"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSkippedDayWeek"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
BeginningOfWeek subtracts the weekday distance with AddDate(0, 0, -n), which counts calendar
days; Pacific/Apia skipped Friday 30 December 2011 when it crossed the date line. For Saturday
2011-12-31 with WeekStartDay = Friday the distance is one day, AddDate yields the nonexistent
Dec 30 00:00 and Go resolves it to 2011-12-29 00:00 -10 — a Thursday, before the week began.
The correct answer is the first instant of the week that exists, 2011-12-31 00:00 +14. Monday()
and Sunday() have the same arithmetic. Fix: after AddDate, if the weekday is not the week's
start, take the beginning of the next day.
'''

[[bug]]
id = "now/7"
title = "Fractional seconds with other than 3, 6 or 9 digits defeat the has-time detection: a time-only string lands on January 1st and a zero clock field is replaced by the current one (12:00:21.5 → 12:51:21.5)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFractionDigits"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The default layouts include "2006.01.02 15:04:05.999999999", time.RFC3339Nano and the Stamp
family, and Go accepts a fraction after any seconds field, so "12:20:13.5" and
"2017-10-13 12:00:21.5" parse. But hasTimeRegexp and onlyTimeRegexp only admit fractions of
exactly 3, 6 or 9 digits — `\.(\d{3}|\d{6}|\d{9})` — so for those strings hasTimeInStr is
false: Parse("12:20:13.5") with now = 2013-11-18 is 2013-01-01 12:20:13.5 (today's date is not
filled in; the zero month and day become January 1st), and Parse("2017-10-13 12:00:21.5") with
now = 17:51 is 2017-10-13 12:51:21.5 because the zero minute is "replaced with current time".
The same strings with ".500" behave. Fix: `\.\d{1,9}` in both patterns, or better decide
"has a time" from the layout that matched rather than from a regular expression.
'''

[[bug]]
id = "now/8"
title = "Kitchen-format strings (\"12:20PM\") parse but land on January 1st instead of today"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinKitchenIsToday"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
time.Kitchen ("3:04PM") is in TimeFormats, so Parse("12:20PM") succeeds; the has-time patterns
require the clock to end at `\s*$` or `[Z+-]`, "PM" matches neither, and the string is treated
as carrying no time: month and day stay zero and become January 1st (Parse("12:20PM") with
now = 2013-11-18 is 2013-01-01 12:20). README: "12:20" → today at 12:20. Fix as in now/7 —
derive the carried fields from the matching layout.
'''

[[bug]]
id = "now/9"
title = "A month-day string matches the has-time pattern through its hyphen, so a clock parsed from an earlier string is dropped: Parse(\"12:20\", \"10-13\") is 00:00"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMonthDayLooksLikeTime"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
hasTimeRegexp is `(\s+|^\s*|T)\d{1,2}((:\d{1,2})*|...)(\s*$|[Z+-])`: the `(:\d{1,2})*` may be
empty and `-` is an accepted terminator, so "10-13" matches ("10" followed by "-"). With
hasTimeInStr true the zero hour/minute/second of the parsed date are kept instead of being
filled from the previous string: Parse("12:20", "10-13") is 2013-10-13 00:00 while
Parse("12:20", "2017-10-13") is 2017-10-13 12:20 and the upstream test asserts
Parse("18:20:39", "2011-01-01") = 2011-01-01 18:20:39. Fix as in now/7.
'''

[[bug]]
id = "now/10"
title = "A date followed by a time-only string loses the date: Parse(\"2017-10-13\", \"12:20\") is 2017-01-01 12:20 (the upstream test only passes because its date is 2011-1-1)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDateThenTime"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Parse keeps one onlyTimeInStr flag across all strings, ANDed: `onlyTimeInStr = hasTimeInStr &&
onlyTimeInStr && onlyTimeRegexp.MatchString(str)`. Once the first string ("2017-10-13") has no
time the flag is false for good, so when the second string ("12:20") is parsed its zero day and
month are not taken from the current time (the result of the first string) — they are zero and
time.Date turns them into January 1st; only the year survives via the zero-replacement rule.
Parse("2017-10-13", "12:20") = 2017-01-01 12:20 and Parse("2017-10-13", "18") = 2017-01-01 18:00,
whereas the reverse order Parse("12:20", "2017-10-13") is right. now_test.go asserts
MustParse("2011-1-1", "18:20:39") = "2011-01-01 18:20:39" and MustParse("2011-01-01", "18") =
"2011-01-01 18:00:00" — the intended behaviour, passing only because January 1st is the wrong
answer too. Fix: compute onlyTimeInStr per string.
'''

[[bug]]
id = "now/11"
title = "A date-only string for a day whose midnight does not exist parses to 23:00 of the previous day, and a time-only string combined with such a date has its clock overwritten: Parse(\"12:20\", \"2025-03-09\") in Havana is 2025-03-08 23:20"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDateWithoutMidnight"
found = { commit = "23677734dfbfe82cf181e286182744f28e2b75cf", version = "v1.1.5+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parseWithFormat calls time.ParseInLocation(layout, str, loc); for a date-only layout that asks
for 00:00 of the date, and on the day daylight saving starts at midnight (Cuba, Chile, Paraguay,
Lebanon, Egypt) that wall time does not exist. Go resolves it one way or the other — Havana and
Santiago give 23:00 of the previous day, Beirut 01:00 of the same day — and Parse then treats
the hour it got back as carried by the string: Parse("2025-03-09") with a Havana "now" is
2025-03-08 23:00 CST, a Saturday, when the README's rule (a date-only string is that date at
midnight) can only mean the day's first instant, 01:00 CDT. Worse, the two-string form the
upstream test asserts (Parse("18:20:39", "2011-01-01") = 2011-01-01 18:20:39) loses its clock:
Parse("12:20", "2025-03-09") is 2025-03-08 23:20 and, in Beirut, Parse("02:00", "1973-5-1") is
1973-05-01 01:00, because the nonzero hour 23 (or 1) from the date string wins over the
previously parsed one. Parse("2025-03-09 02:00") is right. Fix: parse date-only strings in UTC
(or read the layout's fields) and rebuild the result with time.Date in the location after the
fields have been merged, stepping forward past a missing midnight as in now/3.
'''
