# Bugs found in kballard/go-shellquote by the Hegel properties. Each is pinned by the
# test named in `test`, listed as an expected failure in target.toml.

[[bug]]
id = "go-shellquote/1"
title = "Join leaves a leading `#` unquoted, so the word and everything after it become a comment"
kind = "contract"
severity = "medium"
test = "TestHegelPinJoinQuotesLeadingHash"
found = { commit = "95032a82bc518f77982ea72343cc1ade730072f0", version = "v0.0.0-20180428030007-95032a82bc51", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Join("#")` is `#`, `Join("#!/bin/sh")` is `#\!/bin/sh` and `Join("echo", "#x")` is `echo #x`;
bash, dash and busybox ash split them into no words, no words and `["echo"]`. Join's contract is
"If passed to /bin/sh, the resulting string will be split back into the original arguments".
`quote` escapes `specialChars` (`\'"`${[|&;<>()*?!`) anywhere and `prefixChars` (`~`) at the
start of a word; `#` is in neither list, although like `~` it is special exactly at the start
of a word (sh token recognition: an unquoted `#` beginning a word starts a comment). Adding
`#` to `prefixChars` fixes it. Every other shape tried — quotes, backslashes, `$`, backticks,
operators, blanks, newlines, CR, invalid UTF-8, empty words — round-trips through all three
shells.
'''
