[[bug]]
id = "go-immutable-radix/1"
title = "A second seek on an iterator panics or seeks from the wrong node"
kind = "crash"
severity = "medium"
test = "TestHegelPinIteratorsCanSeekAgain"
found = { commit = "581942a789ebaceddea984f7b9c025f1f99127b6", version = "v2.1.0+ (2026-07-27)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Iterator and ReverseIterator are created at a node and seeked with SeekPrefix, SeekLowerBound and
SeekReverseLowerBound; nothing says an iterator may be seeked only once. SeekLowerBound and
SeekReverseLowerBound set the iterator's node to nil and never restore it, and SeekPrefixWatch sets it
to nil when the prefix is not in the tree, so any seek after a lower-bound seek, or after a prefix seek
that found nothing, dereferences a nil node and panics (`it.SeekPrefix("zz"); it.SeekPrefix("a")`;
`it.SeekLowerBound("a"); it.SeekLowerBound("b")`; `ri.SeekReverseLowerBound("a"); ri.SeekPrefix(nil)`).
When a prefix seek did find a node, a following SeekLowerBound runs from that node, comparing the key
against the node's partial prefix: on {a, ab, abc, b}, `SeekPrefix("ab"); SeekLowerBound("abc")` yields
ab, abc (ab is below the bound) and `SeekPrefix("a"); SeekLowerBound("b")` yields nothing.
The reverse iterator's expandedParents map also survives a re-seek, so nodes marked expanded by an
earlier SeekReverseLowerBound would have their children skipped by Previous once the nil panic is fixed.
"""

[[bug]]
id = "go-immutable-radix/2"
title = "Insert keeps the caller's key slice: overwriting it afterwards rewrites the tree"
kind = "contract"
severity = "low"
test = "TestHegelPinInsertCopiesTheKey"
found = { commit = "581942a789ebaceddea984f7b9c025f1f99127b6", version = "v2.1.0+ (2026-07-27)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The tree is documented as immutable and nothing says a key passed to Insert must not be reused, yet
Txn.insert stores the slice as the leaf's key and sub-slices of it as node prefixes. After
`k := []byte("hello"); r, _, _ = r.Insert(k, 1); k[0] = 'j'`, Get("hello") fails, Get("jello") fails
too (the edge label still says 'h') and Minimum reports the key "jello". The same holds inside a
transaction. Either Insert should copy the key or the documentation should say the slice is retained.
"""

[[bug]]
id = "go-immutable-radix/3"
title = "WalkBackwards visits a key before the longer keys it is a prefix of"
kind = "contract"
severity = "medium"
test = "TestHegelPinWalkBackwardsIsDescending"
found = { commit = "581942a789ebaceddea984f7b9c025f1f99127b6", version = "v2.1.0+ (2026-07-27)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Node.WalkBackwards "is used to walk the tree in reverse order", the mirror of Walk and of what
ReverseIterator.Previous produces. reverseRecursiveWalk visits a node's own leaf before recursing
into its children (in reverse), so a key that is a proper prefix of other keys comes out before them
although it sorts before them: on {a, ab, abc, b} WalkBackwards visits b, a, ab, abc, while
ReverseIterator gives b, abc, ab, a. The leaf must be visited after the children.
"""

[[bug]]
id = "go-immutable-radix/4"
title = "DeletePrefix on a node the transaction already wrote clears it before counting: Len keeps the deleted keys and their watchers are never notified"
kind = "contract"
severity = "medium"
test = "TestHegelPinDeletePrefixCountsWhatItDeletes"
found = { commit = "581942a789ebaceddea984f7b9c025f1f99127b6", version = "v2.1.0+ (2026-07-27)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Txn.deletePrefix, when the prefix is exhausted at node n, does `nc := t.writeNode(n, true); nc.leaf =
nil; nc.edges = nil; return nc, t.trackChannelsAndCount(n)`. When n was already copied earlier in the
same transaction (writeNode returns the node itself from the writable cache), nc is n, so the leaf
and edges are gone before trackChannelsAndCount walks them: it counts zero leaves and tracks no
mutation channels. The committed tree's Len still includes the deleted keys (`txn.Insert("a", 1);
txn.Insert("b", 2); txn.DeletePrefix(nil)` commits an empty tree with Len 2; a tree {a/1, a/2} after
`txn.Insert("a/3", 3); txn.DeletePrefix("a/")` has Len 3), and with TrackMutate on, a GetWatch channel
on a/1 taken before the transaction is never closed. Tree.DeletePrefix and a DeletePrefix that is the
first write on its path are unaffected. Count and track before clearing the node.
"""
