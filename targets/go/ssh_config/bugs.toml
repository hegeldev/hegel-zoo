# Bugs found in kevinburke/ssh_config by the zoo's Hegel tests (hegel/ in the patch). Each pin
# (test) fails while the bug is open. The reference is OpenSSH's own reading of the same file
# (ssh -G, 9.6 here) and ssh_config(5).

[[bug]]
id = "ssh_config/1"
title = "Host patterns separated by tabs are read as one pattern: Host foo<TAB>bar matches neither foo nor bar, where ssh splits Host arguments on any whitespace"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTabSeparatedHostPatterns"
found = { commit = "bd15f5d44042e84fa6a04fcb0f1d176fc804397f", version = "untagged (2026-05-04)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Host foo<TAB>bar` / `Port 2222`: `ssh -G bar` prints `port 2222`; `cfg.Get("bar", "Port")` is "".
`parseKV` (parser.go) splits the Host line's value with `strings.Split(val.val, " ")`, so a tab
between patterns stays inside one pattern ("foo\tbar"), which matches nothing; `Host<TAB>foo` also
leaves a leading tab in the pattern. ssh's argv_split treats spaces and tabs alike. Found by the
ssh -G differential (Host lines with tab separators).
'''

[[bug]]
id = "ssh_config/2"
title = "The ? wildcard matches zero characters as well as one: Host fo? matches fo and Host ?? matches x, where ssh_config(5) says ? matches exactly one character"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinQuestionMarkIsOneCharacter"
found = { commit = "bd15f5d44042e84fa6a04fcb0f1d176fc804397f", version = "untagged (2026-05-04)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Host fo?` / `Port 2222`: `ssh -G fo` prints `port 22` (no match); `cfg.Get("fo", "Port")` is "2222".
`NewPattern` (config.go) compiles `?` to `.?` (zero or one) instead of `.`; the manpage: "`?` (a
wildcard that matches exactly one character)", which the function's own comment quotes. Also
affects Match host patterns. Found by the ssh -G differential.
'''

[[bug]]
id = "ssh_config/3"
title = "Match host reads its argument as one pattern instead of a comma-separated pattern list: Match host foo,bar matches neither foo nor bar"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMatchHostCommaList"
found = { commit = "bd15f5d44042e84fa6a04fcb0f1d176fc804397f", version = "untagged (2026-05-04)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Match host foo,bar` / `Port 2222`: `ssh -G bar` prints `port 2222`; `cfg.Get("bar", "Port")` is "".
ssh_config(5), PATTERNS: "A pattern-list is a comma-separated list of patterns", and Match's host
criterion takes one pattern-list (a second whitespace-separated word is the next criterion; `Match
host foo bar` is an error in ssh). `parseMatch` (parser.go) splits on whitespace and hands each word
to `NewPattern`, where the comma is literal. `Match host !foo,*` (the manpage's idiom for
"everything but foo") therefore matches nothing. Found by the ssh -G differential.
'''

[[bug]]
id = "ssh_config/4"
title = "Match host is matched against the alias instead of the target hostname after HostName substitution, so a Match host block selected by an earlier HostName is skipped and one naming the alias is wrongly applied"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMatchHostUsesHostName"
found = { commit = "bd15f5d44042e84fa6a04fcb0f1d176fc804397f", version = "untagged (2026-05-04)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Host foo` / `HostName bar` / `Match host bar` / `Port 2222` / `Match host foo` / `Port 3333`: `ssh -G
foo` prints `port 2222`; `cfg.Get("foo", "Port")` is "3333". ssh_config(5), Match: "The host keyword
matches against the target hostname, after any substitution by the Hostname or CanonicalizeHostname
options" (originalhost is the criterion for the alias). `Config.Get` calls `host.Matches(alias)` for
Match blocks as for Host blocks. Found by the ssh -G differential (configs with both a HostName
directive and a Match host block).
'''

[[bug]]
id = "ssh_config/5"
title = "Match host compares case-sensitively: Match host FOO does not apply to foo and Match host foo does not apply to FOO, where ssh matches the lowercased hostname case-insensitively"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMatchHostCaseInsensitive"
found = { commit = "bd15f5d44042e84fa6a04fcb0f1d176fc804397f", version = "untagged (2026-05-04)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Match host FOO` / `Port 2222`: `ssh -G foo` prints `port 2222`, and `Match host foo` applies to
`ssh -G FOO` too (ssh lowercases the hostname and match_hostname folds case); `cfg.Get` returns ""
in both cases. `Host` patterns, by contrast, are case-sensitive in ssh and in the package (checked:
`Host FOO` does not apply to `ssh -G foo`), so only the Match criterion is affected. Found by the
ssh -G differential.
'''
