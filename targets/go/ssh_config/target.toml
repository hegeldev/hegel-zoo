name = "ssh_config"
language = "go"
upstream = "https://github.com/kevinburke/ssh_config"
subdir = ""
license = "MIT"  # LICENSE; README and repository say nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "bd15f5d44042e84fa6a04fcb0f1d176fc804397f"
date = "2026-05-04"
version = "untagged (after v1.6.0, 2026-05-04)"

[hegel]
version = "v0.6.33"

[run]
# The tests live in hegel/ and compare the package's Get/GetAll on generated ssh_config files
# with ssh -G (the OpenSSH client on the machine; 9.6 here).
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinTabSeparatedHostPatterns = "ssh_config/1"
TestHegelPinQuestionMarkIsOneCharacter = "ssh_config/2"
TestHegelPinMatchHostCommaList = "ssh_config/3"
TestHegelPinMatchHostUsesHostName = "ssh_config/4"
TestHegelPinMatchHostCaseInsensitive = "ssh_config/5"
