# Bugs found in google/uuid by the Hegel properties. Each is pinned by the test named in
# `test`, listed as an expected failure in target.toml.

[[bug]]
id = "uuid/1"
title = "NewV6WithTime updates the shared clock state without the mutex, so concurrent callers get duplicate UUIDs"
kind = "contract"
severity = "high"
test = "TestHegelPinNewV6WithTimeIsRaceFree"
found = { commit = "2d3c2a9cc518326daf99a383f07c4d3c44317e4d", version = "v1.6.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NewV6WithTime` calls the unexported `getTime(customTime)` directly (version6.go:40) while
`GetTime`, `NewUUID` and `NewV6` take `timeMu` first; `getTime` reads and writes `clockSeq` and
`lasttime` (time.go:67–70). `go test -race` reports the race between two `NewV6WithTime`
callers. Effect: four goroutines each generating 3000 UUIDs for one instant (12 000 of the
16 384 clock sequences the contract allows per timestamp) produced ~130–500 duplicates per
run on a 2-core machine. The pin fails whenever a round of 12 000 concurrent calls has a
duplicate (eight rounds; marked intermittent in target.toml since a race is not a certainty).
Fix: take `timeMu` in `NewV6WithTime` (as `GetTime` does), or add a locked wrapper.
Introduced with `NewV6WithTime` (#172, the pinned commit).
'''

[[bug]]
id = "uuid/2"
title = "UUID.Scan of a NULL, an empty string or an empty []byte leaves the previous value in place"
kind = "contract"
severity = "medium"
test = "TestHegelPinScanOfNullResetsTheValue"
found = { commit = "2d3c2a9cc518326daf99a383f07c4d3c44317e4d", version = "v1.6.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
sql.go: the `nil`, `""` and `len(src) == 0` branches `return nil` without assigning `*uuid`;
the comments on the string/[]byte branches say "if an empty UUID comes from a table, we return
a null UUID". A destination reused across rows (`for rows.Next() { rows.Scan(&u) }`) keeps the
previous row's UUID when a NULL comes by — silent data mixing. `database/sql`'s own scanners
(`sql.NullString`, `sql.NullInt64`, …) assign on every Scan. Fix: `*uuid = Nil` in the three
branches.
'''

[[bug]]
id = "uuid/3"
title = "NullUUID.Scan of an empty string or empty []byte reports Valid = true"
kind = "contract"
severity = "low"
test = "TestHegelPinNullUUIDScanOfEmptyStringIsNull"
found = { commit = "2d3c2a9cc518326daf99a383f07c4d3c44317e4d", version = "v1.6.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NullUUID.Scan` delegates to `UUID.Scan` and sets `Valid = err == nil`; `UUID.Scan("")` and
`UUID.Scan([]byte{})` return nil (they are documented in the source as "a null UUID", uuid/2),
so an empty string scans as a *valid* Nil UUID (or a valid stale one), while `Scan(nil)` gives
`Valid = false`. Fix: treat the empty string like nil in `NullUUID.Scan`.
'''

[[bug]]
id = "uuid/4"
title = "NullUUID's null value marshals to text \"null\" and to an empty binary, neither of which unmarshals"
kind = "contract"
severity = "low"
test = "TestHegelPinNullUUIDNullTextAndBinaryRoundTrip"
found = { commit = "2d3c2a9cc518326daf99a383f07c4d3c44317e4d", version = "v1.6.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
null.go: `MarshalText` of `{Valid: false}` returns `null`, `MarshalBinary` returns an empty
slice; `UnmarshalText([]byte("null"))` fails with "invalid UUID length: 4" and
`UnmarshalBinary(nil)` with "invalid UUID (got 0 bytes)". `encoding.TextMarshaler`/
`TextUnmarshaler` and `BinaryMarshaler`/`BinaryUnmarshaler` pairs are expected to invert each
other (encoding/json uses the text form for map keys: `json.Marshal(map[NullUUID]int{{}: 1})`
gives `{"null":1}`, which `json.Unmarshal` rejects). Fix: accept `null` / an empty input as
the null value in the two Unmarshal methods.
'''

[[bug]]
id = "uuid/5"
title = "NewV6WithTime encodes a garbage timestamp for instants it cannot represent instead of returning an error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNewV6WithTimeRejectsUnrepresentableInstants"
found = { commit = "2d3c2a9cc518326daf99a383f07c4d3c44317e4d", version = "v1.6.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
time.go `getTime`: `uint64(t.UnixNano()/100) + g1582ns100`. Before 1582-10-15 the tick count
is negative and wraps (1500-01-01 reads back from `Time().UnixTime()` as 2084-07-20); between
1582 and 1678-09-21 and after 2262-04-11 `t.UnixNano()` itself overflows (its result is
documented as undefined there) and the UUID carries a nonsense timestamp (1600-01-01 → 2184-07-20,
2263-01-01 → 1678-06-12, 2300-01-01 → 1715-06-13, 5000-01-01 → 2077-03-25) although the 60-bit
RFC field reaches 5236. The function returns
`(UUID, error)` and documents "returns Nil and an error" for a time it cannot use; it never
errors. Fix: check the range (or compute the ticks from `Unix()` and `Nanosecond()` in 128-bit
arithmetic) and return an error.
'''

[[bug]]
id = "uuid/6"
title = "SetNodeID of six zero bytes returns true but the node is replaced by the hardware address on the next use"
kind = "contract"
severity = "low"
test = "TestHegelPinSetNodeIDAcceptsTheZeroNode"
found = { commit = "2d3c2a9cc518326daf99a383f07c4d3c44317e4d", version = "v1.6.0+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
node.go: an all-zero `nodeID` is the "not yet set" sentinel (`if nodeID == zeroID {
setNodeInterface("") }` in `NodeID`, `NewUUID` and `generateV6`), so `SetNodeID(make([]byte,
6))` succeeds and sets `ifname = "user"` but the next `NodeID()`/`NewUUID()` overwrites the
node with the interface's MAC (or random bits). A zero node is a legitimate RFC value (and a
common "no hardware address" choice). Fix: track "set" with a flag, not the zero value.
'''
