name = "sonic"
language = "go"
upstream = "https://github.com/bytedance/sonic"
subdir = ""
license = "Apache-2.0"
# AGENTS.md (repository guidelines: layout, build/test commands, Conventional Commits) and
# CONTRIBUTING.md (PR flow, branch prefixes) say nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "f1003e13e7899a6e536181fa66e986c4f29db5d5"
date = "2026-09-10"
version = "v1.15.4"

[hegel]
version = "v0.6.33"

[run]
# -vet=off: Go 1.27's vet rejects an unexported tagged field in upstream's decode_test.go;
# -run TestHegel: upstream's own suite (JIT, fuzz corpora) is not the zoo's business.
command = "go test -count=1 -vet=off -run TestHegel -v ."
setup = []

[expected_failures]
TestHegelPinNegativeZeroKeepsItsSignInContainers = "sonic/1"
TestHegelPinNegativeZeroIsEmpty = "sonic/2"
TestHegelPinStringOptionEscapesTheInnerString = "sonic/3"
TestHegelPinValidRejectsMalformedEscapes = "sonic/4"
TestHegelPinDecoderRejectsAStrayCloser = "sonic/5"
TestHegelPinDecoderDoesNotReportEOFBeforeTheEnd = "sonic/6"
TestHegelPinStreamOfNumbersDecodesEveryValue = "sonic/7"
TestHegelPinNumbersAreNotSplitAtReadBoundaries = "sonic/8"
TestHegelPinValidRejectsRawControlCharacters = "sonic/9"
