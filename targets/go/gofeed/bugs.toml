# Bugs found in mmcdole/gofeed by the Hegel zoo. Each has a pin test (hegel_pins_test.go) listed
# as an expected failure in target.toml.

[[bug]]
id = "gofeed/1"
title = "Author strings outside four shapes are dropped or misread (Name <email> becomes the email)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAuthorForms"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
shared.ParseNameAddress tries four regular expressions: "email (name)", "name (email)", a name
without @ ( ), an email without ( ). Anything else yields an empty Person. The common RSS form
"John Doe <john@example.com>" matches the email-only expression as a whole (its character class
admits spaces and angle brackets), so the Person is {Email: "John Doe <john@example.com>"} with
no name. "@jack" (a handle, the usual JSON Feed author) and "Smith & Sons (Ltd)" (parentheses
without an address) match nothing and are lost entirely, though the translator still sets a
non-nil Author with empty fields. feedparser reads all three as name or name plus email.
'''

[[bug]]
id = "gofeed/2"
title = "itunes:keywords are split on commas without trimming or dropping empty values"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinKeywordsAreTrimmed"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
translateFeedCategories and translateItemCategories append strings.Split(keywords, ",") to the
categories. Podcast feeds write keywords as "a, b, c", so the categories come out as "a", " b",
" c", and "a,,c" contributes an empty category. feedparser strips each keyword and drops empty
ones.
'''

[[bug]]
id = "gofeed/3"
title = "HTML named entities are decoded in core elements but left as written in extension elements"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEntitiesInExtensions"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The XML decoder runs with Strict = false, which passes unknown entities such as &eacute;
through as text. Core elements go through shared.ParseText, whose DecodeEntities applies
html.UnescapeString and turns them into characters: <description>Caf&eacute;</description> is
"Café". Extension elements (dc:creator, dc:subject, itunes:*, every namespaced child) are read by
parseExtensionElement from the raw character data, so <dc:creator>Caf&eacute;</dc:creator>
gives the author name "Caf&eacute;" and the category "d&eacute;j&agrave;". The same feed thus
has its entities decoded in one field and not in the next; feedparser decodes both.
'''

[[bug]]
id = "gofeed/4"
title = "An item's atom:link is not promoted to Item.Link while the channel's is"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinItemAtomLink"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The RSS translator promotes Atom elements embedded in RSS to the universal fields: at the
channel level an <atom:link rel="alternate"> (or without rel) becomes Feed.Link and joins
Feed.Links when <link> is absent, and at the item level atom:summary, atom:published,
atom:updated, atom:author and atom:category are used. The item's <atom:link> is the one left
out: an item with only <atom:link rel="alternate" href="..."/> has Link "" and no Links.
'''

[[bug]]
id = "gofeed/5"
title = "JSON Feed items without authors do not inherit the feed's author"
kind = "spec"
severity = "low"
test = "TestHegelPinJSONItemAuthorInherited"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
JSON Feed 1.1 (and 1.0 for author): "authors (optional, array of objects) ... If not specified
in an item, then the top-level authors, if present, are the authors of the item." The JSON
translator sets Item.Author and Item.Authors only from the item's own author or authors, so an
item of a feed with top-level authors has none. The RSS and Atom translators have no such rule
to follow, and the universal Item has the fields to hold it.
'''

[[bug]]
id = "gofeed/6"
title = "RFC 3339 dates with a lower-case t or z are not parsed"
kind = "spec"
severity = "low"
test = "TestHegelPinLowerCaseRFC3339"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 3339 5.6 (the Atom and JSON Feed date format): "NOTE: ISO 8601 defines date and time
separated by "T". Applications using this syntax may choose, for the sake of readability, to
specify a full-date and full-time separated by (say) a space character", and "the "T" and "Z"
characters in this syntax may alternatively be lower case "t" or "z" respectively". The date
list has the space variant but no lower-case one, and Go's time.Parse is case-sensitive, so
<updated>2006-01-02t15:04:05z</updated> leaves UpdatedParsed nil (Updated keeps the text).
feedparser parses it.
'''

[[bug]]
id = "gofeed/7"
title = "Two-digit years 50-68 are read as 2050-2068 (RFC 5322: 1950-1968)"
kind = "spec"
severity = "low"
test = "TestHegelPinTwoDigitYears"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 822 dates with two-digit years are read through Go layouts with "06", and Go's rule maps
69-99 to 19xx and 00-68 to 20xx. RFC 5322 4.3 (obsolete date syntax, which RSS's RFC 822 dates
are) says: "If a two digit year is encountered whose value is between 00 and 49, the year is
interpreted by adding 2000 ... between 50 and 99 ... by adding 1900." So "Mon, 02 Jan 50
15:04:05 GMT" is 1950 by the RFC and 2050 by gofeed; the two rules agree elsewhere. feedparser
uses a third rule (all two-digit years are 20xx), so the pin rests on the RFC alone.
'''

[[bug]]
id = "gofeed/8"
title = "An RSS enclosure url is not resolved against xml:base while the other URLs are"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEnclosureURLResolved"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Under an xml:base, RSS <link>, <comments>, <docs>, <image><url> (ParseTextURL) and the href
attributes of extension elements such as itunes:image (resolveAttrs, for href, scheme, src and
uri) are resolved to absolute URLs. <enclosure url="e.mp3"> keeps "e.mp3": the url attribute is
not in resolveAttrs' list and parseEnclosure reads it raw. A feed relying on xml:base thus
gets absolute links and relative enclosures. media:content url has the same gap.
'''

[[bug]]
id = "gofeed/9"
title = "An RSS 1.0 item's rdf:about is not used as its GUID"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRDFAboutIsTheGUID"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RSS 1.0 has no <guid>; the identifier of an item is its rdf:about attribute ("the URI of the
item", RSS 1.0 spec 5.5, required). gofeed parses RDF feeds (FeedVersion "1.0") but ignores
rdf:about, so every RSS 1.0 item has GUID "", and readers that deduplicate by GUID see none.
feedparser sets the entry id from rdf:about.
'''

[[bug]]
id = "gofeed/10"
title = "A JSON Feed with a UTF-8 byte order mark is detected as JSON and then rejected"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinJSONWithBOM"
found = { commit = "253ddbe673480b9bd9abdd114755cde33f12afc4", version = "v1.4.2-10-g253ddbe (master, 2026-09-07)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DetectFeedType skips leading whitespace and byte order marks before looking at the first
character, so a document starting with EF BB BF followed by "{" is FeedTypeJSON. The JSON
parser then hands the whole reader, mark included, to encoding/json, which fails with "invalid
character '﻿' looking for beginning of value". The XML path does not have the problem
(encoding/xml skips the mark), so the same feed with a BOM parses as RSS or Atom but not as
JSON Feed. Feeds written by Windows tools commonly carry the mark.
'''
