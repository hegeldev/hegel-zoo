name = "go-git"
language = "go"
upstream = "https://github.com/go-git/go-git"
subdir = ""
license = "Apache-2.0"  # AI_POLICY.md: AI tools welcome, the human contributor accountable, disclosure with an Assisted-by trailer (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "0f3a0a2c25513f2666ac9b88a6745f7b2382f572"
date = "2026-09-17"
version = "untagged (v6 development, 2026-09-17)"

[hegel]
version = "v0.9.6"

[run]
# The tests live in hegel/ and compare plumbing/format/gitignore's Scope walk of generated
# worktrees with git check-ignore (the git binary of the machine).
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinTrailingDoubleStarKeepsDirectory = "go-git/1"
TestHegelPinEscapedSpaceThenSpaces = "go-git/2"
TestHegelPinDoubledSlashMatchesNothing = "go-git/3"
TestHegelPinDirPatternsLeavesPathAlone = "go-git/4"
TestHegelPinNegatedDirectoryDoesNotReincludeContents = "go-git/5"
TestHegelPinSlashInsideBrackets = "go-git/6"
TestHegelIgnoreMatchesGit = { bug = "go-git/1", intermittent = true }
TestHegelTrailingDoubleStarLeavesTheDirectoryAlone = "go-git/1"
TestHegelEscapedSpaceKeepsItsBackslash = "go-git/2"
TestHegelDoubledSlashMatchesNothing = "go-git/3"
TestHegelDirPatternsLeavesThePathAlone = "go-git/4"
TestHegelNegatedDirectoryReincludesOnlyItself = "go-git/5"
TestHegelSlashInsideBracketsIsOneSegment = "go-git/6"
TestHegelPinDoubleStarBacktracks = "go-git/7"
TestHegelDoubleStarBacktracks = "go-git/7"
