# Bugs found in go-git by the zoo's Hegel tests (hegel/ in the patch). Each pin (test) fails
# while the bug is open. All are in plumbing/format/gitignore, compared with git 2.43's
# check-ignore and status --ignored on the same worktree.

[[bug]]
id = "go-git/1"
title = "A pattern ending in /** matches the directory it names as well as its contents, so Scope excludes the directory, never reads its .gitignore, and Worktree.Status hides the files re-included there"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTrailingDoubleStarKeepsDirectory"
found = { commit = "0f3a0a2c25513f2666ac9b88a6745f7b2382f572", version = "untagged (2026-09-17)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`.gitignore` = `ba/**`, `ba/.gitignore` = `!x`, files ba/x and ba/y. git: `check-ignore ba` matches
nothing (gitignore(5): "a trailing /** matches everything inside"), ba/.gitignore is read, and
`git status --ignored` shows `?? ba/x` and `!! ba/y`. go-git: `ParsePattern("ba/**").Match(["ba"],
true)` is Exclude, so `Scope.Descend` marks ba excluded and does not call readOwn; ba/x is ignored
and `Worktree.Status` omits it.

Cause: `globMatch` (pattern.go), for a trailing `**` segment: `matched = len(path) > 0 || isDir`,
so a directory candidate with nothing left after the earlier segments matches. Git's wildmatch of
`ba/**` against `ba` fails at the `/`. The conformance suite encodes the go-git reading
(`{"**/bar/**", "deep/foo/bar/", true}`), checked against check-ignore with a trailing slash, where
git indeed says yes; a walk asks about `deep/foo/bar` without one, and there git says no. Also
affects negations: `!/a/**` re-includes the directory a itself in go-git.
'''

[[bug]]
id = "go-git/2"
title = "Trailing spaces after an escaped space are all stripped, backslash included: the line a\\ followed by two spaces becomes the pattern a\\, which matches nothing, where git keeps a\\ and a space"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEscapedSpaceThenSpaces"
found = { commit = "0f3a0a2c25513f2666ac9b88a6745f7b2382f572", version = "untagged (2026-09-17)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`.gitignore` line `a\  ` (a, backslash, space, space): git's `trim_trailing_spaces` (dir.c) skips the
escaped space and drops only the unescaped one, leaving `a\ `, which ignores the file "a "
(`check-ignore -v` shows `.gitignore:1:a\ `). go-git's `ParsePattern` trims every trailing space
unless the line ends in `\ ` exactly, so the pattern becomes `a\`, and wildmatch never matches a
pattern ending in a lone backslash: "a " is not ignored.
'''

[[bug]]
id = "go-git/3"
title = "A doubled slash in a pattern is skipped instead of matching nothing: a//b ignores a/b and c// ignores the contents of c, where git matches neither"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDoubledSlashMatchesNothing"
found = { commit = "0f3a0a2c25513f2666ac9b88a6745f7b2382f572", version = "untagged (2026-09-17)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`.gitignore` = `a//b` and `c//`, files a/b and c/x: `git check-ignore -v --non-matching a/b c c/x`
matches nothing (a path has no empty component, and wildmatch needs a `/` for each `/` in the
pattern). go-git: `ParsePattern` splits on "/" into segments `a`, ``, `b`; `globMatch` treats an
empty segment as a no-op (`canTraverse = false; continue`), so `a//b` is `a/b` and `c//` is `c/`
(the second slash is taken as the directory marker, the first left as an empty final segment,
which matches anything below c). Also `/**//**` ignores every file.
'''

[[bug]]
id = "go-git/4"
title = "DirPatterns appends .gitignore to the caller's path slice: with a sub-slice that has spare capacity, the component after the prefix is overwritten"
kind = "contract"
severity = "low"
test = "TestHegelPinDirPatternsLeavesPathAlone"
found = { commit = "0f3a0a2c25513f2666ac9b88a6745f7b2382f572", version = "untagged (2026-09-17)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`comps := []string{"a", "b"}; gitignore.DirPatterns(fs, comps[:1])` leaves `comps` as
`["a", ".gitignore"]`. `readIgnoreFile` (dir.go) opens `fs.Join(append(path, ignoreFile)...)`, and
`append` writes into the argument's backing array when it has room. `DirPatterns` is documented as
the way to build `Scope.Descend`'s readOwn while walking a tree, where a prefix of the path being
walked is the natural argument; `ParsePattern` copies its domain for exactly this reason. Found
while writing the zoo's pins (a walk using `comps[:i]` matched the wrong paths).
'''

[[bug]]
id = "go-git/5"
title = "A negated pattern that matches a directory re-includes everything below it: with * then !ba, go-git reports ba/x as not ignored, where git re-includes ba only and ignores ba/x by *"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNegatedDirectoryDoesNotReincludeContents"
found = { commit = "0f3a0a2c25513f2666ac9b88a6745f7b2382f572", version = "untagged (2026-09-17)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`.gitignore` = `*` then `!ba` (or `!/*`, `!/*/`, `!b?/`), file ba/x: `git check-ignore -v` gives
`.gitignore:2:!ba` for ba and `.gitignore:1:*` for ba/x; `git status --ignored` shows `!! ba/x`. go-git's
Scope walk reports ba/x not ignored, so Worktree.Status lists it as untracked.

Cause: `Pattern.Match` reports a match of any ancestor directory as a match of the path
(`simpleNameMatch` tries every component; `globMatch` accepts a path with components left over),
which is right for an exclusion, since an excluded directory's contents are excluded, and wrong
for an inclusion, whose effect gitignore(5) limits to the entries it matches. `Matcher.Match`
takes the last pattern that matched, so the negation of the parent wins over the earlier `*` that
matches the child. Found by the differential (every tree with a negation matching a directory and
an exclusion matching something inside it).
'''

[[bug]]
id = "go-git/6"
title = "A slash inside a bracket expression is split as a path separator: [a/b] ignores nothing, where git reads it as one segment matching the names a and b"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSlashInsideBrackets"
found = { commit = "0f3a0a2c25513f2666ac9b88a6745f7b2382f572", version = "untagged (2026-09-17)", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`.gitignore` = `[a/b]`, files a, b, c: `git check-ignore -v` gives `.gitignore:1:[a/b]` for a and b
(the bracket cannot match a slash under WM_PATHNAME, but the slash is part of the set, not a
separator). go-git's `ParsePattern` splits the line on every "/" before wildmatch sees it, so the
segments are `[a` and `b]`, and an unterminated bracket matches nothing. Found by the differential
(`/[.* /B/*[1b]` ignored a file named 1 in git only).
'''
