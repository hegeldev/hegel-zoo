name = "parquet-go"
language = "go"
upstream = "https://github.com/parquet-go/parquet-go"
subdir = ""
license = "Apache-2.0"  # CONTRIBUTING.md: issues, pull requests, tests and gofmt; nothing about AI-written code (checked 2026-09-20)
ai_policy_checked = "2026-09-20"

[base]
commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808"
date = "2026-09-02"
version = "v0.32.0+"

[hegel]
version = "v0.9.6"

[run]
# The tests live in hegel/ and write files for generated schemas, rows and options that pyarrow
# (a child process, hegel/oracle.py; the CI venv has pyarrow) and parquet-go itself read back.
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinDeconstructOptionalListElements = "parquet-go/1"
TestHegelPinDecimalPrecisionFitsFixedLength = "parquet-go/2"
TestHegelPinDecimalTagOnIntSlice = "parquet-go/3"
TestHegelPinFloatStatisticsFollowTheSpec = "parquet-go/4"
TestHegelPinMissingFixedColumnReads = "parquet-go/5"
TestHegelPinCorruptedPageErrorsNotPanics = "parquet-go/6"
TestHegelPinDictionaryFloatStatistics = "parquet-go/7"
TestHegelPinDamagedPageIndexLengthErrors = "parquet-go/8"
TestHegelPinListElementNameIsFree = "parquet-go/9"
TestHegelPinDecimalConversionIsBigEndian = "parquet-go/10"
TestHegelPinEmptyDictionaryFileReads = "parquet-go/11"
TestHegelPinRLEBooleansDecode = "parquet-go/12"
TestHegelPinEmptyDataPageV2Reads = "parquet-go/13"
TestHegelPinLZ4RawPagesDecompress = "parquet-go/14"
