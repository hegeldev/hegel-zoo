pyarrow, asked for data pages v2 of 64 bytes, writes the value column of a map<string, bool>
holding one row with an empty map as two pages: a first data page v2 with num_values 0,
num_nulls 0, num_rows 0, no levels (definition and repetition level byte lengths 0) and a
