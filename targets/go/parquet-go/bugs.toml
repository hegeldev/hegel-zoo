[[bug]]
id = "parquet-go/1"
title = "Schema.Deconstruct, and so the deprecated Writer whose documentation says GenericWriter[any] behaves the same, mishandles optional LIST elements: []*T elements make it panic (cannot create parquet value of type DOUBLE from go value of type *float64) and []string elements tagged optional are written as nulls"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDeconstructOptionalListElements"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a struct field `A []*float64 parquet:"a,list"`, SchemaOf gives the LIST with an optional
double element, GenericWriter[any] writes []*float64{&f, nil} and the reader gives it back, but
Schema.Deconstruct(nil, row) panics with "cannot create parquet value of type DOUBLE from go value
of type *float64" (and the same for *string, *uint8, *[16]byte, ...). For `A []string
parquet:"a,list" parquet-element:",optional"`, Deconstruct returns the two values "x" and "yy"
with a definition level that reads back as null: Writer.Write of {A: ["x", "yy"]} gives a file
in which parquet-go's own reader and pyarrow see [null, null] (pyarrow: null_count 2 on the
element column). Lists of pointers to groups holding maps lose their content the same way
([]*G{&{M: {"k": 1}}} reads back as [&{M: {}}] and []*G{&{M: {}}} as [nil]). The deprecated
Writer's documentation says: "Use NewGenericWriter instead. To maintain dynamic behavior (schema
unknown at compile time), use any as the type parameter: this gives you the same behavior as the
old Writer", and Deconstruct is a public method of Schema. Found by the writer-paths property,
which writes the same rows through both writers and compares what pyarrow reads.
'''

[[bug]]
id = "parquet-go/2"
title = "SchemaOf accepts a [N]byte field whose decimal precision needs more than N bytes ([8]byte with decimal(0:19) gives a fixed_len_byte_array(8) DECIMAL(19,0) column) and writing a row then panics in the column buffer instead of the tag being rejected"
kind = "contract"
severity = "low"
test = "TestHegelPinDecimalPrecisionFitsFixedLength"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A DECIMAL of precision 19 in a FIXED_LEN_BYTE_ARRAY needs 9 bytes (10^19-1 does not fit in 63
bits). SchemaOf validates struct tags and panics at schema time on invalid combinations (a
decimal tag on a float, a date tag on a slice, ...), but for `A [8]byte parquet:"a,decimal(0:19)"`
it returns a schema whose column is fixed_len_byte_array(8) DECIMAL(19,0), and Write then
panics with "cannot convert Go values of type [8]uint8 (array) to FIXED_LEN_BYTE_ARRAY(9)" (the
column buffer is sized from the precision, the schema from the Go type). Every length N with a
precision one digit too large fails the same way, [15]byte with decimal(0:36) with "cannot write
15 bytes to [16]byte column" and, with the dict tag, "byte array length 15 does not match required
length 16 for be128". Either the schema should carry the length the precision needs, or SchemaOf
should reject the tag as it rejects the others, with a message that names the field. Found while
generating decimal columns for the pyarrow property.
'''

[[bug]]
id = "parquet-go/3"
title = "A decimal tag on a slice of integers ([]int32, []int64), which the documentation lists for int32, int64, []byte and [N]byte only, is accepted and yields a required fixed_len_byte_array(4) DECIMAL column; Write succeeds and Read panics with reflect.Value.SetBytes of non-byte slice"
kind = "contract"
severity = "low"
test = "TestHegelPinDecimalTagOnIntSlice"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SchemaOf's documentation: "decimal | for int32, int64, []byte, and [N]byte types, use the parquet
DECIMAL logical type". For `A []int32 parquet:"a,decimal(2:9)"` (a repeated decimal, one would
think, as `A []int32 parquet:"a"` is a repeated int32) SchemaOf gives `required
fixed_len_byte_array(4) a (DECIMAL(9,2))`, treating the slice as a byte array of the length the
precision needs; the same for []int64. Write of {A: []int32{1, 2, 3}} succeeds and Read[T] of
the file panics with "reflect.Value.SetBytes of non-byte slice". Other logical-type tags on
slices (date, timestamp, enum, uuid) are rejected at schema time with "X is an invalid parquet
tag"; decimal should be too, or apply to the elements. Found while generating repeated columns
for the pyarrow property.
'''

[[bug]]
id = "parquet-go/4"
title = "Floating-point column statistics keep whichever zero was seen first ({+0, -0} gives min +0 and max +0, {-0, +0} min -0 and max -0) and write NaN as min and max when every value is NaN, where parquet.thrift says a zero min should be written as -0.0, a zero max as +0.0, and no min/max at all when all values are NaN"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFloatStatisticsFollowTheSpec"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parquet.thrift (ColumnOrder, TypeDefinedOrder) on FLOAT and DOUBLE statistics: min and max
"must not contain NaN values and must be computed from non-NaN values only", "if all non-null
values are NaN, min and max statistics must not be written", "if the computed max value is zero
(whether negative or positive), +0.0 should be written into the max statistics field" and "if
the computed min value is zero (whether negative or positive), -0.0 should be written into the
min statistics field". parquet-go skips NaN correctly when other values are present ({NaN, 1,
2} gives 1..2), but a column of only NaN gets min = max = NaN (bits 7ff8000000000001), and
zeros compare equal so the first one seen is kept for both bounds: values {+0.0, -0.0} give
min +0.0 and max +0.0, values {-0.0, +0.0} give min -0.0 and max -0.0 (float32 and float64
alike). The rules exist so that a reader filtering on "x < 0" or "x >= 0" cannot skip a page
that contains the other zero. Found by the statistics check of the pyarrow property (pyarrow
reports the file's min as +0.0 where the values hold -0.0).
'''

[[bug]]
id = "parquet-go/5"
title = "Reading a file into a Go struct with a [N]byte field the file has no column for panics with reflect.Set: value of type []uint8 is not assignable to type [7]uint8 (fixedLenByteArrayType.AssignValue), through Read, GenericReader and Reader alike, where other missing columns are filled with zero values"
kind = "panic"
severity = "medium"
test = "TestHegelPinMissingFixedColumnReads"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Write a file from `struct{ A int32; B [7]byte }` and read it into `struct{ A int32; C [7]byte }`
(the file has no column c): parquet-go's schema conversion supplies the missing column as nulls,
and assigning that null to the [7]byte field panics in fixedLenByteArrayType.AssignValue with
"reflect.Set: value of type []uint8 is not assignable to type [7]uint8". A missing int32, string
or []byte column reads as its zero value without complaint; a missing [N]byte one crashes the
program, whichever reader is used (parquet.Read[T], GenericReader[T].Read, Reader.Read). The
zoo met it first on a damaged file whose column name had a flipped byte, then reproduced it on
a clean one. Found by the damaged-files property.
'''

[[bug]]
id = "parquet-go/6"
title = "A damaged v2 data page whose header's level lengths do not fit the page makes reading its rows panic in decodeLevelsV2 (slice bounds out of range) instead of returning an error; OpenFile accepts the file"
kind = "panic"
severity = "medium"
test = "TestHegelPinCorruptedPageErrorsNotPanics"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The pin holds a 1509-byte file parquet-go wrote (data page v2, zstd and gzip columns, a MAP) in
which the zoo's fuzzing flipped a few bytes. OpenFile accepts it (the footer is intact), and
RowGroups()[0].Rows().ReadRows panics with "runtime error: slice bounds out of range
[1092:140]" in decodeLevelsV2: the v2 page header's repetition/definition level byte lengths
exceed the page's data and are used to slice it without a bounds check. Five of 4000 randomly
damaged files reached this panic (others were rejected cleanly by OpenFile or ReadRows). A
reader of untrusted files should get an error, as it does for most other damage. Found by the
damaged-files property.
'''

[[bug]]
id = "parquet-go/7"
title = "Statistics of a dictionary-encoded FLOAT or DOUBLE column are wrong when a NaN is present: values on one side of the NaN are ignored ({-1, NaN, 1} gives min 1, max 1) and NaN itself is written as a bound ({NaN, 1, -1} gives max NaN), where the plain-encoded column gets them right"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDictionaryFloatStatistics"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With the dict tag (`A float64 parquet:"a,dict"`), the row group statistics of a column holding
{-1, NaN, 1} are min 1, max 1; of {NaN, 1, -1} min -1, max NaN; of {1, NaN, -1} min -1, max 1
(right); of {tiny, small, NaN} min NaN; of {NaN, tiny, small} max NaN; the same for float32 and
for optional columns. Without the dict tag the same values give min -1, max 1 and NaN is
skipped, as parquet.thrift requires ("min and max must not contain NaN values and must be
computed from non-NaN values only"). The dictionary's bounds are evidently scanned with a
comparison that stops making progress at a NaN, so the answer depends on where the NaN sits in
the dictionary. Readers that prune row groups by statistics get wrong results: a filter x < 0 skips a group
recorded as 1..1 that holds -1, and a NaN bound defeats every comparison. Found by the statistics check of the pyarrow
property (pyarrow reports the minimum parquet-go wrote, which is larger than the values' minimum).
'''

[[bug]]
id = "parquet-go/8"
title = "A footer whose column index or offset index lengths are negative makes OpenFile panic in ReadPageIndex (makeslice: len out of range when they sum to a negative number, slice bounds out of range when one is negative) instead of returning an error, although the page index is optional and the rest of the file is intact"
kind = "panic"
severity = "medium"
test = "TestHegelPinDamagedPageIndexLengthErrors"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
OpenFile reads the page index eagerly (unless SkipPageIndex is set): File.ReadPageIndex sums
the ColumnIndexLength and OffsetIndexLength of every column chunk in the footer, allocates
buffers of the sums and slices them chunk by chunk, with no check that the lengths are
non-negative or fit. The pin takes a file parquet-go wrote, decodes its footer, sets one or
every ColumnIndexLength (or an OffsetIndexLength) to -1, re-encodes it and calls OpenFile:
every column -1 panics with "runtime error: makeslice: len out of range", one column -1 with
"slice bounds out of range [:-1]", one offset index -1 with "slice bounds out of range [:10]
with capacity 9". Other damage to the footer (a bad offset, a truncated file) is reported as
an error. The zoo's damaged-files property met the makeslice panic on GitHub's runner; a
footer field flipped by a few bits reaches it. Found by the damaged-files property.
'''
