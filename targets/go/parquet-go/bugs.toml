[[bug]]
id = "parquet-go/4"
title = "Floating-point column statistics keep whichever zero was seen first ({+0, -0} gives min +0 and max +0, {-0, +0} min -0 and max -0) and write NaN as min and max when every value is NaN, where parquet.thrift says a zero min should be written as -0.0, a zero max as +0.0, and no min/max at all when all values are NaN"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFloatStatisticsFollowTheSpec"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parquet.thrift (ColumnOrder, TypeDefinedOrder) on FLOAT and DOUBLE statistics: min and max
"must not contain NaN values and must be computed from non-NaN values only", "if all non-null
values are NaN, min and max statistics must not be written", "if the computed max value is zero
(whether negative or positive), +0.0 should be written into the max statistics field" and "if
the computed min value is zero (whether negative or positive), -0.0 should be written into the
min statistics field". parquet-go skips NaN correctly when other values are present ({NaN, 1,
2} gives 1..2), but a column of only NaN gets min = max = NaN (bits 7ff8000000000001), and
zeros compare equal so the first one seen is kept for both bounds: values {+0.0, -0.0} give
min +0.0 and max +0.0, values {-0.0, +0.0} give min -0.0 and max -0.0 (float32 and float64
alike). The rules exist so that a reader filtering on "x < 0" or "x >= 0" cannot skip a page
that contains the other zero. Found by the statistics check of the pyarrow property (pyarrow
reports the file's min as +0.0 where the values hold -0.0).
'''

