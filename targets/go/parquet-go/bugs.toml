[[bug]]
id = "parquet-go/7"
title = "Statistics of a dictionary-encoded FLOAT or DOUBLE column are wrong when a NaN is present: values on one side of the NaN are ignored ({-1, NaN, 1} gives min 1, max 1) and NaN itself is written as a bound ({NaN, 1, -1} gives max NaN), where the plain-encoded column gets them right"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDictionaryFloatStatistics"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With the dict tag (`A float64 parquet:"a,dict"`), the row group statistics of a column holding
{-1, NaN, 1} are min 1, max 1; of {NaN, 1, -1} min -1, max NaN; of {1, NaN, -1} min -1, max 1
(right); of {tiny, small, NaN} min NaN; of {NaN, tiny, small} max NaN; the same for float32 and
for optional columns. Without the dict tag the same values give min -1, max 1 and NaN is
skipped, as parquet.thrift requires ("min and max must not contain NaN values and must be
computed from non-NaN values only"). The dictionary's bounds are evidently scanned with a
comparison that stops making progress at a NaN, so the answer depends on where the NaN sits in
the dictionary. Readers that prune row groups by statistics get wrong results: a filter x < 0 skips a group
recorded as 1..1 that holds -1, and a NaN bound defeats every comparison. Found by the statistics check of the pyarrow
property (pyarrow reports the minimum parquet-go wrote, which is larger than the values' minimum).
'''

[[bug]]
id = "parquet-go/8"
title = "A footer whose column index or offset index lengths are negative makes OpenFile panic in ReadPageIndex (makeslice: len out of range when they sum to a negative number, slice bounds out of range when one is negative) instead of returning an error, although the page index is optional and the rest of the file is intact"
kind = "panic"
severity = "medium"
test = "TestHegelPinDamagedPageIndexLengthErrors"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
OpenFile reads the page index eagerly (unless SkipPageIndex is set): File.ReadPageIndex sums
the ColumnIndexLength and OffsetIndexLength of every column chunk in the footer, allocates
buffers of the sums and slices them chunk by chunk, with no check that the lengths are
non-negative or fit. The pin takes a file parquet-go wrote, decodes its footer, sets one or
every ColumnIndexLength (or an OffsetIndexLength) to -1, re-encodes it and calls OpenFile:
every column -1 panics with "runtime error: makeslice: len out of range", one column -1 with
"slice bounds out of range [:-1]", one offset index -1 with "slice bounds out of range [:10]
with capacity 9". Other damage to the footer (a bad offset, a truncated file) is reported as
an error. The zoo's damaged-files property met the makeslice panic on GitHub's runner; a
footer field flipped by a few bits reaches it. Found by the damaged-files property.
'''

[[bug]]
id = "parquet-go/9"
title = "The reflection reader (Read, GenericReader, Reader) reads the elements of a LIST whose element field is not named element as zero values, or drops them when they are groups, where the row API reads them right; the format leaves the element name free and files of other writers use item or array"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinListElementNameIsFree"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The LogicalTypes document of the format (nested types, lists) fixes the three-level structure
`<list-repetition> group <name> (LIST) { repeated group list { <element-repetition> <type>
element; } }` but says of the names: "the outer-most level must be a group annotated with
LIST... the middle level, named list, must be a repeated group... the element field...";
in its backward-compatibility rules and in practice the element is named item (pyarrow before
13 and with use_compliant_nested_type=False), array (Hive) or anything else, and readers match
by structure. parquet-go's own writer uses element and its reflection reader evidently looks
the element up by that name: for a file pyarrow wrote with elements named item and array,
`li: [[1, 2], [3], []]` reads as [[0, 0], [0], []] (the lengths right, every value zero) and
`lg: [[{c: q}], [], [{c: r}, {c: s}]]` (a list of groups) reads as [[], [], []]; a list of
optional strings ["x", null] reads as ["", null]. OpenFile plus RowGroups()[0].Rows() yields the
right values, so the data is read and then dropped in the conversion to the Go struct (the file
schema and the Go type's schema differ in the element name, and the missing column is filled
with zero values). Found by the pyarrow-writes property (the reflection reader's rows compared
with the rows pyarrow wrote); the pin embeds a 465-byte pyarrow file.
'''

[[bug]]
id = "parquet-go/10"
title = "Converting a DECIMAL column between INT32/INT64 and FIXED_LEN_BYTE_ARRAY when the file's physical type differs from the Go field's copies the integer's little-endian bytes, where the format stores fixed-length decimals big-endian: pyarrow's default decimal files read into int32/int64 fields give byte-reversed values (12345 becomes 3747840, -1 becomes 16777215)"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDecimalConversionIsBigEndian"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parquet-go reads a file whose column has another physical type than the Go field's through a
schema conversion. For DECIMAL columns the format says (LogicalTypes, DECIMAL): "FIXED_LEN_BYTE_ARRAY:
... the unscaled number is stored as a two's-complement big-endian integer", and INT32/INT64
hold the unscaled number as an integer. parquet-go's conversion copies bytes little-endian:
an INT32 DECIMAL(5,2) holding 12345 (0x3039) read into `[3]byte parquet:"d,decimal(2:5)"`
gives 39 30 00 (want 00 30 39) and -1 gives ff ff ff (right by luck); a FIXED_LEN_BYTE_ARRAY(3)
DECIMAL(5,2) holding 00 30 39 read into `int32 parquet:"d,decimal(2:5)"` gives 3747840
(0x393000) and ff ff ff gives 16777215 (0x00ffffff, the sign lost too); an INT64
DECIMAL(18,3) 123456789012345678 into [8]byte gives 4e f3 30 a6 4b 9b b6 01. No error is
returned. This is what a parquet-go reader of pyarrow's files meets: pyarrow writes every
decimal as FIXED_LEN_BYTE_ARRAY unless store_decimal_as_integer is set (a decimal32(5,2) column
becomes fixed_len_byte_array(3)), so a Go struct with `int32 ... decimal(2:5)` (parquet-go's
own representation of that column) reads garbage from pyarrow's default output, and pyarrow's
integer decimals read into [N]byte fields are byte-reversed. The conversion should decode the
value and re-encode it, or refuse. Found while building the pyarrow-writes property (its
generator now gives the Go type the file's physical type); the pin uses parquet-go's own files.
'''

[[bug]]
id = "parquet-go/11"
title = "A file with no rows whose column chunks have a dictionary page but no data page (data_page_offset 0; what pyarrow writes for every empty table with dictionary encoding on) makes Read, GenericReader and ReadRows fail with Seek: invalid offset instead of yielding no rows"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmptyDictionaryFileReads"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
pyarrow writes an empty table (0 rows) as one row group of 0 rows whose column chunks, when
dictionary encoding is on (the default), hold a dictionary page at offset 4 and no data page,
with data_page_offset 0 in the metadata (there is no first data page to point at). parquet-go's
FilePages takes the dictionary page offset as the chunk's base and seeks to data_page_offset -
