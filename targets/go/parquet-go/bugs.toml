'''

[[bug]]
id = "parquet-go/14"
title = "LZ4_RAW pages that compress by less than 3x (byte arrays of noise, unicode text, random numbers) are decoded from a stale buffer, since Column.decompress keeps its pooled buffer when the LZ4 codec had to allocate a larger one: values read as zero or as another page's bytes, or decoding fails (DELTA_LENGTH_BYTE_ARRAY: invalid block size, input too short for a PLAIN byte array), with parquet-go's own files as with pyarrow's"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinLZ4RawPagesDecompress"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Column.decompress (column.go) takes a buffer of the page's uncompressed size from the pool and
calls the codec's Decode(dst, src) with it; compress/lz4's Decode reserves 3 * len(src) bytes
("3x seems like a common compression ratio") and, when dst is smaller, allocates a fresh slice,
decompresses into that and returns it. decompress then compares the decoded length with the
header's uncompressed size and, when they are equal (the normal case), returns the pooled
buffer, which the codec never wrote. The pooled buffer holds zeros in a fresh process (the
pool hands out buffers resized to the request) or the bytes of whatever page used it last, so
the column reads as zero values or garbage, or the decoder rejects it. The condition is
compressed size > uncompressed size / 3 - data LZ4 cannot shrink threefold: random bytes,
hashes, UUIDs, compressed blobs, non-ASCII text, floating-point numbers - unless the pool
happens to hold a buffer three times the compressed size from earlier work, which is why
round trips inside one process (the zoo's own read-back property among them) pass and a
reader process fails on its first pages. Reproducers: parquet.Write of a 2 MiB random []byte
with Compression(&parquet.Lz4Raw) then parquet.Read gives "decoding page 0 of column b:
DELTA_LENGTH_BYTE_ARRAY: invalid number of mini block (0)" in a fresh process (5 KB suffices
there); a pyarrow file of 121 rows of random strings with compression="lz4" (LZ4_RAW) reads 91
of them as "" with no error. Snappy, gzip, zstd and brotli pages are unaffected (their
codecs decode into the buffer given). Found by the pyarrow-writes property (strings and map
keys of LZ4-compressed columns reading back empty or failing to decode).
'''
