[[bug]]
id = "parquet-go/1"
title = "Schema.Deconstruct, and so the deprecated Writer whose documentation says GenericWriter[any] behaves the same, mishandles optional LIST elements: []*T elements make it panic (cannot create parquet value of type DOUBLE from go value of type *float64) and []string elements tagged optional are written as nulls"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDeconstructOptionalListElements"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a struct field `A []*float64 parquet:"a,list"`, SchemaOf gives the LIST with an optional
double element, GenericWriter[any] writes []*float64{&f, nil} and the reader gives it back, but
Schema.Deconstruct(nil, row) panics with "cannot create parquet value of type DOUBLE from go value
of type *float64" (and the same for *string, *uint8, *[16]byte, ...). For `A []string
parquet:"a,list" parquet-element:",optional"`, Deconstruct returns the two values "x" and "yy"
with a definition level that reads back as null: Writer.Write of {A: ["x", "yy"]} gives a file
in which parquet-go's own reader and pyarrow see [null, null] (pyarrow: null_count 2 on the
element column). Lists of pointers to groups holding maps lose their content the same way
([]*G{&{M: {"k": 1}}} reads back as [&{M: {}}] and []*G{&{M: {}}} as [nil]). The deprecated
Writer's documentation says: "Use NewGenericWriter instead. To maintain dynamic behavior (schema
unknown at compile time), use any as the type parameter: this gives you the same behavior as the
old Writer", and Deconstruct is a public method of Schema. Found by the writer-paths property,
which writes the same rows through both writers and compares what pyarrow reads.
'''

[[bug]]
id = "parquet-go/2"
title = "SchemaOf accepts a [N]byte field whose decimal precision needs more than N bytes ([8]byte with decimal(0:19) gives a fixed_len_byte_array(8) DECIMAL(19,0) column) and writing a row then panics in the column buffer instead of the tag being rejected"
kind = "contract"
severity = "low"
test = "TestHegelPinDecimalPrecisionFitsFixedLength"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A DECIMAL of precision 19 in a FIXED_LEN_BYTE_ARRAY needs 9 bytes (10^19-1 does not fit in 63
bits). SchemaOf validates struct tags and panics at schema time on invalid combinations (a
decimal tag on a float, a date tag on a slice, ...), but for `A [8]byte parquet:"a,decimal(0:19)"`
it returns a schema whose column is fixed_len_byte_array(8) DECIMAL(19,0), and Write then
panics with "cannot convert Go values of type [8]uint8 (array) to FIXED_LEN_BYTE_ARRAY(9)" (the
column buffer is sized from the precision, the schema from the Go type). Every length N with a
precision one digit too large fails the same way, [15]byte with decimal(0:36) with "cannot write
15 bytes to [16]byte column" and, with the dict tag, "byte array length 15 does not match required
length 16 for be128". Either the schema should carry the length the precision needs, or SchemaOf
should reject the tag as it rejects the others, with a message that names the field. Found while
generating decimal columns for the pyarrow property.
'''

