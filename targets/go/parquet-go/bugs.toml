data_page_offset 0, base 0). Empty files are common (a partition with no matching rows, a
DataFrame filtered to nothing) and pyarrow, Spark and DuckDB read this one. Found by the
pyarrow-writes property; the pin embeds the 142-byte file.
'''

[[bug]]
id = "parquet-go/12"
title = "RLE-encoded BOOLEAN columns (the encoding parquet-cpp uses for booleans in data pages v2) decode wrongly when the RLE data holds a run: a run of n equal values yields one byte per 8 values holding the value byte, so ten trues read as true, false x7, true, false, and a run of two trues as true, false"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinRLEBooleansDecode"
found = { commit = "144b6469bf93ade1ffc4610a56baadb7a08b9808", version = "v0.32.0+", hegel = "v0.6.33", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The format (Encodings, RLE / Bit-Packing Hybrid) allows RLE for BOOLEAN data pages (in data
page v2, with the 4-byte length prefix) and defines a run as `<rle-header> <repeated-value>`
where the repeated value has bit-width 1 rounded up to a byte, so `04 01` is two trues and `14
01` ten trues. parquet-cpp writes booleans this way in data page v2 (RLE is its encoding for
BOOLEAN in v2 pages, and its encoder emits a run for repeated values, always for the values a
page ends with). parquet-go's rle.Encoding.DecodeBoolean treats the run's value byte as a
bit-packed byte of 8 booleans to repeat once per 8 values: `02 00 00 00 04 01` decodes to the
single byte 01 (true, false) instead of 03 (true, true); `14 01` (ten trues) decodes to 01 01,
so a column of ten trues, three falses, true, false, true, written by pyarrow with
data_page_version="2.0", reads as true, false x7, true, false x7. Bit-packed groups decode
right, which is why columns of varying booleans read fine and constant stretches (the common
case for flags) do not. parquet-go's own encoder writes runs the same way it decodes them (`10
ff` for eight trues), which pyarrow happens to read as trues too, but its reading of
conformant files is wrong. Found by the pyarrow-writes property (a map<string, bool> whose
values read back false); the pin embeds a 191-byte pyarrow file and decodes the raw bytes.
'''

