name = "x-image"
language = "go"
upstream = "https://github.com/golang/image"
subdir = ""
license = "BSD-3-Clause"  # Go project: CLA and Gerrit review via go.dev/doc/contribute; nothing about AI-written code (checked 2026-09-19)
ai_policy_checked = "2026-09-19"

[base]
commit = "b06f1de3f4900ff828b8f114c37eb9ea10dfed90"
date = "2026-09-08"
version = "v0.46.0"

[hegel]
version = "v0.6.33"

[run]
# The tests live in hegel/ and exercise the bmp, tiff and webp packages against Pillow
# (with its libtiff and libwebp), run as a child process from hegel/oracle.py; the CI venv
# has Pillow. Lossy WebP is compared plane by plane with libwebp's own decode, which the
# oracle reaches through ctypes (Pillow's bundled copy of the library).
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel/"

[expected_failures]
TestHegelPinBMPEncodeCarriesAlpha = "x-image/1"
TestHegelPinTIFFCCITTHonoursBlackIsZero = "x-image/2"
TestHegelPinTIFFEncodeHonoursItsOptions = "x-image/3"
