[[bug]]
id = "x-image/1"
title = "bmp: Encode writes a non-opaque image as a 32-bit file with the 40-byte header, whose fourth byte Decode (and Pillow) treat as unused, so the alpha never comes back; 16-bit and generic images are written 24-bit"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinBMPEncodeCarriesAlpha"
found = { commit = "b06f1de3f4900ff828b8f114c37eb9ea10dfed90", version = "v0.46.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
bmp.Encode special-cases *image.RGBA and *image.NRGBA: when the image is not opaque it writes
32 bits per pixel, un-premultiplying RGBA into straight alpha in the fourth byte (writer.go,
encodeRGBA/encodeNRGBA), under a 40-byte BITMAPINFOHEADER with BI_RGB. In that header the fourth
byte of a 32-bit pixel is reserved, and bmp.Decode reads it as alpha only when the header is a
V4 or V5 one ("allowAlpha = infoLen > infoHeaderLen", reader.go) - Pillow does the same and
reads the file as RGB. So Encode then Decode of any image with alpha gives an opaque image
(alpha 0x80 comes back as 0xff), and the effort of un-premultiplying is wasted. Writing a
BITMAPV4HEADER with an alpha mask, which the decoder already honours, would carry the alpha.
Non-opaque *image.RGBA64, *image.NRGBA64 and other image types take the generic path and are
written as 24-bit files, losing the alpha outright. Found by the round-trip property; the
zoo's differential property with Pillow confirms Pillow reads the 32-bit files as opaque.
'''

[[bug]]
id = "x-image/2"
title = "tiff: a CCITT Group 3 or Group 4 image with PhotometricInterpretation=1 (BlackIsZero) decodes inverted, so every bilevel TIFF Pillow writes with those compressions comes out as a negative"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTIFFCCITTHonoursBlackIsZero"
found = { commit = "b06f1de3f4900ff828b8f114c37eb9ea10dfed90", version = "v0.46.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In CCITT data the "white" and "black" codes stand for 0 and 1 bits; PhotometricInterpretation
then says what a 0 bit means. TIFF 6.0, PhotometricInterpretation: "0 = WhiteIsZero ... This is
the normal value for Compression=2. 1 = BlackIsZero ... If this value is specified for
Compression=2, the image should display and print reversed." libtiff's fax codec never looks at
the photometric tag (tif_fax3.c encodes 0-bit spans with the white codes and fills black runs
with 1 bits), so with BlackIsZero a "white" run is displayed black, and libtiff-based writers
write accordingly: Pillow saves mode "1" images as Group 3/4 with PhotometricInterpretation 1
by default and reads them back correctly, and when asked for PhotometricInterpretation 0 it
inverts the bits before encoding (the two files in the pin, of the same image, have different
compressed data).

tiff.Decode instead passes ccitt.Options{Invert: photometric == WhiteIsZero} and then treats
the result as gray (reader.go, cG3/cG4 cases and the mGray/mGrayInvert decode), which paints
CCITT "white" codes white for either photometric value: right for WhiteIsZero, inverted for
BlackIsZero. Every pixel of such a file is wrong. The property found it on Pillow's Group 3 and
Group 4 output at every size and strip layout; uncompressed, LZW, Deflate and PackBits bilevel
files with PhotometricInterpretation 1 decode correctly.
'''

[[bug]]
id = "x-image/3"
title = "tiff: Options promises LZW and CCITT compression and a predictor, but Encode refuses LZW/CCITTGroup3/CCITTGroup4 as unsupported and applies Predictor only with LZW, so it is silently ignored"
kind = "contract"
severity = "low"
test = "TestHegelPinTIFFEncodeHonoursItsOptions"
found = { commit = "b06f1de3f4900ff828b8f114c37eb9ea10dfed90", version = "v0.46.0", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
consts.go lists the CompressionType constants Uncompressed, Deflate, LZW, CCITTGroup3 and
CCITTGroup4 under "Constants for supported compression types", and Options.Compression is
"the type of compression used"; but Encode (writer.go) handles only cNone and cDeflate and
returns errors.New("tiff: unsupported compression") for the other three - the package has a
CCITT encoder (ccitt.NewWriter) and an LZW reader but no LZW writer. Options.Predictor is
documented as saving colour differences ("works well for photos with Deflate compression"),
but Encode sets predictor = opt.Predictor && compression == cLZW, so with Deflate, the very
example given, no differencing happens and no Predictor tag is written; with LZW the call
fails. Either the constants and the Predictor documentation should say what Encode does, or
Encode should do it (LZW encoding, and the predictor with Deflate, which the spec allows and
the decoder handles).
'''
