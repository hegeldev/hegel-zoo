# Bugs found in github.com/pierrec/lz4/v4 by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the correct behaviour and is listed as an expected failure in
# target.toml. The reference implementation is the lz4 command-line tool, 1.9.4.

[[bug]]
id = "lz4/1"
title = "Writer.Apply and Writer.Reset zero the content size but keep the size flag"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSizeOptionSurvivesApplyAndReset"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
w.Apply(SizeOption(260)) followed by w.Apply(BlockSizeOption(Block64Kb)), or a Writer that
had SizeOption applied, was closed and then Reset for a second frame: the frame header has the
content-size flag set and a content size of 0 (04224d18 6c40 0000000000000000 09) for 260
bytes of content. Writer.Apply starts with w.Reset(w.src), and Frame.Reset sets
Descriptor.ContentSize = 0 while leaving the flag in Descriptor.Flags; the option's value is
lost but its flag survives. Reset is documented as keeping the previous options. The
reference decoder treats a stored size of 0 as unknown, so the frame still decodes, but
`lz4 --list` reports the wrong size and any decoder that checks the field would reject it.
Found by the Writer property's first version, which applied the options in two calls.
"""

[[bug]]
id = "lz4/2"
title = "Writer.ReadFrom calls the OnBlockDone handler twice per block, once with the compressed and once with the uncompressed size"
kind = "contract"
severity = "low"
test = "TestHegelPinReadFromCallsTheHandlerOncePerBlock"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With OnBlockDoneOption(h) and 260 bytes of content in one block: w.Write(data) calls h once,
with 35 (the compressed block size, as Writer.write does); w.ReadFrom(bytes.NewReader(data))
calls h twice, with 35 and then 260: ReadFrom calls w.write, which calls the handler, and
then calls w.handler(rn) itself with the number of bytes read. The option is documented as
"triggered when a block has been processed. For a Writer, it is when it has been compressed".
Found by the Writer property comparing the handler calls with the blocks written.
"""

[[bug]]
id = "lz4/3"
title = "Reader.Read calls the OnBlockDone handler once per Read call with the bytes copied, not once per block"
kind = "contract"
severity = "low"
test = "TestHegelPinReadCallsTheHandlerPerBlock"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A one-block frame of 260 bytes read with a 100-byte buffer calls the handler with 100, 100
and 60; Reader.WriteTo calls it once with 260. Reader.Read calls r.handler(bn) after every
copy into the caller's buffer, so the calls depend on the buffer size and say nothing about
blocks, although the option is documented as "for a Reader, it is when it has been
uncompressed" (a block). Found by the Reader property.
"""

[[bug]]
id = "lz4/4"
title = "The Reader accepts frames with a version other than 1 and with reserved bits set"
kind = "contract"
severity = "low"
test = "TestHegelPinReaderRejectsUnknownVersions"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A frame whose FLG byte has version 0 (or 2, 3) or the reserved bit 1 set, with a matching
header checksum, is read without complaint; the reference rejects both
(ERROR_headerVersion_wrong, ERROR_reservedFlag_set). The frame format says the version
"must be set to 01. Any other value cannot be decoded by this version of the library" and
that a decoder finding reserved bits set should reject the frame. FrameDescriptor.initR
validates the header checksum and the block size index only. Found by the corrupt-frames
property (a flipped version bit with a repaired checksum).
"""

[[bug]]
id = "lz4/5"
title = "The Reader does not check the frame's content size against the content"
kind = "contract"
severity = "low"
test = "TestHegelPinReaderChecksTheContentSize"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A frame declaring a content size of 5 (with a valid header checksum) whose blocks hold 260
bytes is read as 260 bytes without error; the reference fails with ERROR_frameSize_wrong.
The content size is the frame's own statement of what it holds and the reference uses it as an
integrity check; the Reader only reports it through Size(). Found by the corrupt-frames
property (a mutated content-size field with a repaired checksum).
"""

[[bug]]
id = "lz4/6"
title = "A stream cut off after a block (without its end mark) or right after the magic number is accepted as complete"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinTruncatedFrameIsAnError"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A two-block frame without content checksum truncated right after its first block (the end
mark and the second block are missing): Reader.Read returns the first block and io.EOF,
Reader.WriteTo returns the first block and a nil error; the reference reports an unfinished
stream. Reader.Read treats io.EOF from the block-size read as the end of the stream (the
`case io.EOF` branch), whereas the format ends a frame with an explicit end mark, so a
truncated download passes for a complete one. With a content checksum the truncation is
noticed, but WriteTo then returns a bare io.EOF rather than io.ErrUnexpectedEOF. The same
happens at the very start: an input holding only the four magic bytes 04224d18 reads as an
empty stream with a clean io.EOF (FrameDescriptor.initR's io.ReadFull of the descriptor
returns io.EOF when nothing follows), where one or two bytes more give io.ErrUnexpectedEOF.
Found by the corrupt-frames property (truncation mutations) and the options property.
"""

[[bug]]
id = "lz4/7"
title = "A legacy block whose compressed size equals the content read so far is mistaken for the kernel size trailer, truncating the stream"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinLegacyBlocksAreNotMistakenForTheSizeTrailer"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A legacy frame (magic 02214c18) with a first block decoding to 21 bytes and a second block
whose compressed size is 21 bytes: the Reader returns the 21 bytes of the first block and,
when the second block is the last, no error; when more follows, "lz4: bad magic number". The
reference decodes the whole stream. FrameDataBlock.Read treats a legacy block size equal to
the cumulative uncompressed size (`case cum`) as the trailer Linux kernel images append, so
valid legacy frames whose block sizes happen to coincide with the content size are cut short
without any indication. The library's own Writer produces such frames: with LegacyOption and
Flush after 2 bytes then after 1 byte, the second block (a token and one literal) is 2 bytes
long after 2 bytes of content, and the Reader stops there with "bad magic number". Found by
reading the reader and confirmed by a constructed frame, then by the Writer property's
Flush pattern; the properties avoid the coincidence.
"""

[[bug]]
id = "lz4/8"
title = "Writer.ReadFrom fails with ErrInternalUnhandledState unless it is the Writer's first operation, and leaves the Writer unusable"
kind = "contract"
severity = "high"
test = "TestHegelPinReadFromWorksAfterWrite"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
w.Write(header); w.ReadFrom(body) returns (0, "lz4: unhandled state[writeState]"); so do a
second ReadFrom, a ReadFrom after Flush, and afterwards Write and Close fail with the same
error, so the frame is never finished. ReadFrom's state switch only accepts newState (a fresh
or Reset Writer); every other state goes to w.state.fail(), which also moves the Writer into
its error state. Since Writer implements io.ReaderFrom, io.Copy(w, r) after any Write takes
this path. Found by the Writer property's "write then ReadFrom" pattern.
"""

[[bug]]
id = "lz4/9"
title = "A legacy frame followed by a standard or skippable frame fails with ErrOptionInvalidBlockSize"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLegacyFrameMayBeFollowedByAStandardFrame"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The concatenation of a legacy frame and a standard frame (or a skippable frame) reads as
the legacy frame's content followed by "lz4: invalid block size"; the reference decodes both
frames (the legacy format ends at the next magic number or at the end of the input). In legacy
mode FrameDataBlock.Read recognises only the legacy magic as a frame boundary; the standard
magic 04224d18 is taken as a block size (0x184D2204 bytes) above the 8 MiB buffer. Found by
the Reader property on concatenated frames.
"""

[[bug]]
id = "lz4/10"
title = "With concurrency, the OnBlockDone handler is called from other goroutines, after Close has returned"
kind = "contract"
severity = "low"
test = "TestHegelPinHandlerCallsFinishBeforeClose"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A Writer with ConcurrencyOption(2) and OnBlockDoneOption(h), two blocks: when Close
returns, h has not been called; both calls arrive shortly afterwards, from the compression
goroutines. Writer.write's goroutine calls w.handler after the block was written and the
result channel was acknowledged, and Close waits for the writes, not for the handlers, so a
caller collecting statistics in the handler reads them incomplete after Close, and the
handler must be goroutine-safe though nothing says so. Found by the Writer property comparing
handler calls with the blocks written.
"""

[[bug]]
id = "lz4/11"
title = "Reader.WriteTo silently drops every block of a following frame whose block size is larger than the first frame's"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinWriteToReadsFramesOfGrowingBlockSize"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A 300-byte frame written with Block64Kb followed by a 102000-byte frame written with
Block4Mb: r.WriteTo(&buf) (and io.Copy(&buf, r)) writes 300 bytes and returns a nil error;
Reader.Read, io.ReadAll and WriteTo with ConcurrencyOption(2) return all 102300 bytes, as
does the reference. WriteTo allocates its scratch buffer once, from the first frame's block
size, and for each block calls r.read(data), which decompresses into the caller's buffer only
when it is at least the frame's block size; otherwise the block goes to r.data and read
returns 0, which WriteTo takes as "0 bytes" and writes data[:0]. Every block of the second
frame is lost this way (also when a standard frame is followed by a legacy frame, whose block
size is 8 MiB). The same happens with ConcurrencyOption(n > 1) when a later frame has
dependent blocks: init silently drops to non-concurrent mode for it, WriteTo's non-concurrent
branch then runs with the nil buffer it never allocated, and the frame's content vanishes.
Found by the Reader property (a reference frame followed by a dependent-blocks frame with
concurrency 4) and by a probe after it lost a legacy frame following a standard one.
"""

[[bug]]
id = "lz4/12"
title = "Reader.WriteTo returns io.EOF as an error on an empty or skippable-only stream"
kind = "contract"
severity = "medium"
test = "TestHegelPinWriteToOnAnEmptyStreamIsNotAnError"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
io.Copy(io.Discard, lz4.NewReader(bytes.NewReader(nil))) returns (0, io.EOF), and so does a
stream holding only a skippable frame; io.ReadAll on the same Reader returns (nil, nil) and
the reference tool produces empty output without error. WriteTo's first r.init() gets io.EOF
from the magic-number read and returns it as the error, while the same situation after a
completed frame is turned into nil. io.WriterTo callers (io.Copy) take any error as a failure.
Found by the Reader property on skippable-only streams.
"""

[[bug]]
id = "lz4/13"
title = "A failed Apply (an invalid option, or one applied after the first Write or Read) leaves the Writer or Reader in its error state for good"
kind = "contract"
severity = "medium"
test = "TestHegelPinFailedApplyDoesNotPoisonTheWriter"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
w.Write(data); w.Apply(ChecksumOption(false)) returns ErrOptionClosedOrError, as documented,
but from then on Write and Close return the same error and the frame stays unfinished (7
bytes: the header alone). w.Apply(BlockSizeOption(12345)) on a fresh Writer returns
ErrOptionInvalidBlockSize and afterwards Write and Close fail with "invalid block size:
12345[newState]". On a Reader, Apply after the first Read (or Apply of an inapplicable
option before it) makes every later Read fail. Apply's deferred w.state.check(&err) moves the
object into its error state for any error, including the option error it is itself reporting,
and only Reset clears it. Relatedly, once a Reader has returned io.EOF, Apply returns io.EOF
instead of the documented ErrOptionClosedOrError, because the end of the stream is stored as
the error state. Found by the options property (Close failing after a late Apply).
"""

[[bug]]
id = "lz4/14"
title = "Reader.Size is 0 once a Read has reached the end of the frame, so a frame read in one call never reports its size"
kind = "contract"
severity = "low"
test = "TestHegelPinSizeSurvivesTheEndOfTheFrame"
found = { commit = "e692a9f4ef963d14ccf688009c288120dcc541b0", version = "v4.1.9+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A frame written with SizeOption(260): after r.Read of one byte, r.Size() is 260; after the
Read that reaches the end of the frame (a 1000-byte buffer, or io.ReadAll, or WriteTo) it is
0. Reader.Read and Reader.WriteTo reset the frame (r.frame.Reset, which zeroes
Descriptor.ContentSize) when they see the end of the stream, so the size is only observable
while the frame is being read; `data, _ := io.ReadAll(r); size := r.Size()`, the natural
use, gives 0. Size is documented as "the size of the current frame's uncompressed data, if
set in the stream". Found by the Reader property (frames read in one call).
"""
