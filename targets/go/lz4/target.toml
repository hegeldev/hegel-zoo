name = "lz4"
language = "go"
upstream = "https://github.com/pierrec/lz4"
subdir = ""
license = "BSD-3-Clause"
# README and LICENSE are the only project documents; nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "e692a9f4ef963d14ccf688009c288120dcc541b0"
date = "2026-09-15"
version = "v4.1.9+"

[hegel]
version = "v0.6.33"

[run]
# The lz4 command-line tool (1.9.4 here and on the ubuntu runners) is the reference oracle.
setup = ["lz4 --version"]
command = "go test -count=1 -run TestHegel -v ."

[expected_failures]
TestHegelPinSizeOptionSurvivesApplyAndReset = "lz4/1"
TestHegelPinReadFromCallsTheHandlerOncePerBlock = "lz4/2"
TestHegelPinReadCallsTheHandlerPerBlock = "lz4/3"
TestHegelPinReaderRejectsUnknownVersions = "lz4/4"
TestHegelPinReaderChecksTheContentSize = "lz4/5"
TestHegelPinTruncatedFrameIsAnError = "lz4/6"
TestHegelPinLegacyBlocksAreNotMistakenForTheSizeTrailer = "lz4/7"
TestHegelPinReadFromWorksAfterWrite = "lz4/8"
TestHegelPinLegacyFrameMayBeFollowedByAStandardFrame = "lz4/9"
TestHegelPinHandlerCallsFinishBeforeClose = "lz4/10"
TestHegelPinWriteToReadsFramesOfGrowingBlockSize = "lz4/11"
TestHegelPinWriteToOnAnEmptyStreamIsNotAnError = "lz4/12"
TestHegelPinFailedApplyDoesNotPoisonTheWriter = "lz4/13"
TestHegelPinSizeSurvivesTheEndOfTheFrame = "lz4/14"
