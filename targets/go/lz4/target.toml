name = "lz4"
language = "go"
upstream = "https://github.com/pierrec/lz4"
subdir = ""
license = "BSD-3-Clause"
# README and LICENSE are the only project documents; nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "e692a9f4ef963d14ccf688009c288120dcc541b0"
date = "2026-09-15"
version = "v4.1.9+"

[hegel]
version = "v0.6.33"

[run]
# The lz4 command-line tool (1.9.4 here and on the ubuntu runners) is the reference oracle.
setup = ["lz4 --version"]
command = "go test -count=1 -run TestHegel -v ."

[expected_failures]
TestHegelPinSizeOptionSurvivesApplyAndReset = "lz4/1"
TestHegelPinReadFromCallsTheHandlerOncePerBlock = "lz4/2"
TestHegelPinReadCallsTheHandlerPerBlock = "lz4/3"
TestHegelPinReaderRejectsUnknownVersions = "lz4/4"
TestHegelPinReaderChecksTheContentSize = "lz4/5"
TestHegelPinTruncatedFrameIsAnError = "lz4/6"
TestHegelPinLegacyBlocksAreNotMistakenForTheSizeTrailer = "lz4/7"
TestHegelPinReadFromWorksAfterWrite = "lz4/8"
TestHegelPinLegacyFrameMayBeFollowedByAStandardFrame = "lz4/9"
TestHegelPinHandlerCallsFinishBeforeClose = "lz4/10"
TestHegelPinWriteToReadsFramesOfGrowingBlockSize = "lz4/11"
TestHegelPinWriteToOnAnEmptyStreamIsNotAnError = "lz4/12"
TestHegelPinFailedApplyDoesNotPoisonTheWriter = "lz4/13"
TestHegelPinSizeSurvivesTheEndOfTheFrame = "lz4/14"
# The wide properties draw the shapes of the recorded bugs and fail on them (STYLE.md rule 11).
# The Writer property shrinks into lz4/2 (ReadFrom's second handler call) or lz4/8 (Write then
# ReadFrom): hegel-go's case sequence is reproducible per test binary, so the basin is fixed for a
# given patch (lz4/2 for this one) and moves when the binary changes.
TestHegelWriterFramesFollowTheSpec = { bug = "lz4/2", intermittent = true }
TestHegelReaderAcceptsSpecAndReferenceFrames = "lz4/12"
TestHegelCorruptFramesAreRejected = "lz4/6"
TestHegelOptionsAndStatesFollowTheContract = "lz4/13"
# One narrow property per bug (hegel_shapes_test.go), over the bug's shape region.
TestHegelSizeOptionSurvivesASecondApplyAndReset = "lz4/1"
TestHegelReadFromCallsTheHandlerOncePerBlock = "lz4/2"
TestHegelReadCallsTheHandlerOncePerBlock = "lz4/3"
TestHegelReaderRejectsUnknownVersionsAndReservedBits = "lz4/4"
TestHegelReaderChecksTheContentSize = "lz4/5"
TestHegelFramesCutBeforeTheEndMarkAreRejected = "lz4/6"
TestHegelLegacyBlocksAreNotMistakenForTheSizeTrailer = "lz4/7"
TestHegelReadFromFollowsEarlierWrites = "lz4/8"
TestHegelLegacyFramesMayBeFollowedByOtherFrames = "lz4/9"
TestHegelHandlerCallsCompleteBeforeClose = "lz4/10"
TestHegelWriteToReadsEveryFollowingFrame = "lz4/11"
TestHegelWriteToOnAStreamWithoutFramesIsNotAnError = "lz4/12"
TestHegelRefusedApplyLeavesTheObjectUsable = "lz4/13"
TestHegelSizeSurvivesTheEndOfTheFrame = "lz4/14"
