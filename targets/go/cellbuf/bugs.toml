[[bug]]
id = "cellbuf/1"
title = "InsertLine, DeleteLine and DeleteCell destroy every wide cell they move"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinShiftsDestroyWideCells"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`InsertLineRect`, `DeleteLineRect` and `DeleteCellRect` shift content by copying cells one at a
time through `Line.set`, left to right. When the head of a wide cell is copied, `set` writes the
head and a fresh placeholder after it; the next iteration copies the *source* placeholder onto
that position, and `set`'s "writing to a wide cell placeholder" rule then blanks the head that
was just written. The destination ends up as a blank followed by an orphaned placeholder:

    b := NewBuffer(4, 3); b.SetCell(0, 0, NewCell('世')); b.InsertLine(0, 1, nil)
    b.Line(1).String() == ""        // want "世"

Every CJK character or emoji in a scrolled or shifted region disappears. `InsertCellRect` is
spared only because it copies right to left, so the head is written after its placeholder.
Correct terminal semantics move a wide cell as a unit and blank it only when it straddles the
edge of the affected rectangle.
'''

[[bug]]
id = "cellbuf/2"
title = "A wide cell written over the head of another wide cell leaves that cell's placeholder orphaned"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinWideOverTwoWidesLeavesAnOrphan"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Line.set` splits the wide cell that covers the *target* column, but the placeholders it then
writes at x+1..x+w-1 simply overwrite whatever is there. If one of those columns held the head
of another wide cell, that cell's own placeholder survives with no head in front of it:

    b := NewBuffer(4, 1)
    b.SetCell(0, 0, NewCell('世')); b.SetCell(2, 0, NewCell('界')); b.SetCell(1, 0, NewCell('中'))
    // cells: {" "} {"中"} {""} {""}   — column 3 is an orphan placeholder

`Line.String` and `Render` skip placeholders, so the line looks one column short, and when
`Screen` draws such a line the orphan is skipped without advancing the cursor: everything to
its right lands one column to the left of where the screen believes it is (the zoo's Screen
property has to skip buffers with orphans for this reason). The same shape reaches the buffer
through `printString`/`SetContent` whenever a wide grapheme overlaps a previous wide cell.
'''

[[bug]]
id = "cellbuf/3"
title = "Buffer.Resize cuts lines through wide cells, leaving a two-column head in the last column"
kind = "contract"
severity = "low"
test = "TestHegelPinResizeCutsWideCells"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
Shrinking the width truncates each `Line` slice; a wide cell whose head is at the new last column
keeps `Width == 2` with no room for its placeholder. `Line.set` and `FillRect` never produce that
shape (a cell that does not fit becomes blanks). Downstream code that assumes `x+Width <= len(l)`
(the screen's `putRange`, `Line.String`, the zoo's structural invariant) is then off by one for
that line. Blanking the cut cell, as `Line.set` does, would keep the invariant.
'''

[[bug]]
id = "cellbuf/4"
title = "TabStops only work for an interval of 8: other intervals alias columns or index out of range"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTabStopsAssumeInterval8"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NewTabStops(width, interval)` allocates `ceil(width/interval)` words and masks with
`1 << (col & (interval-1))`, but `IsStop`, `Set` and `Reset` index the word with `col >> 3`
regardless of the interval. With interval 4, columns 0 and 4 share bit 0 of word 0, so
`Reset(4)` also clears the stop at column 0 and `Set(5)` also sets column 1 (the upstream test
passes only because it checks multiples of the interval, which are all set). With interval 16,
`NewTabStops(32, 16)` panics with `index out of range [2] with length 2` while initialising.
Non-power-of-two intervals produce garbage masks. Either the interval parameter should go, or
the word index must be `col / 8` with the mask `1 << (col % 8)` independently of the interval.
'''

[[bug]]
id = "cellbuf/5"
title = "TabStops.Set and Reset panic for a column beyond the width, where IsStop answers from stale bits"
kind = "panic"
severity = "low"
test = "TestHegelPinTabStopsSetBeyondWidthPanics"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`IsStop` bounds-checks the word index and returns false past the last word, but `Set` and
`Reset` index unchecked: `DefaultTabStops(24).Set(24)` panics. Within the last word, columns at
or beyond the width still answer from bits that `Resize` left behind (`Resize(4)` from 8 keeps
the bits for columns 4–7), so `IsStop(5)` can be true on a 4-column line. `Find` never reaches
those columns, so the effect is confined to callers of `IsStop`/`Set`/`Reset`.
'''

[[bug]]
id = "cellbuf/6"
title = "Style.DiffSequence drops bold, faint or a blink when it turns off the sibling attribute"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDiffSequenceDropsSiblingAttributes"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
SGR 22 turns off *both* bold and faint, and SGR 25 turns off both blinks, but `DiffSequence`
treats them as single-attribute switches. Going from bold+faint to faint alone emits `22` and
nothing else (faint is unchanged, so it is not re-sent): the terminal shows plain text. Going
from faint to bold emits `1;22`: bold is switched on and immediately off. The blink pair
behaves the same way with `5;25` / `25`:

    from {bold,faint} to {faint}:      "\x1b[22m"     -> {}
    from {faint}      to {bold}:       "\x1b[1;22m"   -> {}
    from {slow,rapid} to {rapid}:      "\x1b[25m"     -> {}
    from {rapid}      to {slow}:       "\x1b[5;25m"   -> {}

`DiffSequence` is what `RenderLine` and `Screen.updatePen` use between neighbouring cells, so
these attribute combinations render wrongly on screen. After emitting 22 or 25 the still-wanted
attribute of the pair must be re-sent.
'''

[[bug]]
id = "cellbuf/7"
title = "NewCell appends every rune and sums their widths, contrary to its documentation"
kind = "contract"
severity = "low"
test = "TestHegelPinNewCellAppendsEveryRune"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`NewCell(r, comb...)` is documented to "only account for the first combined rune", and its loop
stops at the first non-zero-width rune — but the result is thrown away by `c.Comb = comb` and
`c.Width = runewidth.StringWidth(all runes)` right after. `NewCell('a', 'b', 'c')` is a cell
with content "abc" and width 3, which `Line.set` then treats as a three-column wide cell.
`NewCellString` implements the documented rule; `NewCell` should match it or drop the comment.
'''

[[bug]]
id = "cellbuf/8"
title = "Wrap lets a trailing space push a line one column past the limit"
kind = "wrong-result"
severity = "low"
test = "TestHegelWrapKeepsContentAndStyles"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
When a breakpoint character (`-` or one of `breakpoints`) follows pending spaces, `Wrap` calls
`addSpace()` before it checks whether the breakpoint fits, so the spaces are committed to the
current line even when the line is already full: `Wrap("xxxx -ba.", 4, "")` yields a line
`"xxxx "` of width 5. On a terminal with auto-wrap the extra space moves the cursor to the next
row, and the newline that follows produces a blank line. The zoo's property measures lines
with trailing whitespace trimmed and counts these cases; this entry has no separate pin.
'''

[[bug]]
id = "cellbuf/9"
title = "A combining mark decoded on its own is attached to the following cell, not the preceding one"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCombiningMarkAttachesToTheNextCell"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`printString` handles every zero-width item that is not a recognised escape sequence with
`cell.Append(...)`, i.e. it becomes the *start* of the next cell. x/ansi's decoder splits
grapheme clusters that begin with an ASCII byte (x-ansi/5 in this zoo), so `SetContent(b,
"éx")` produces a cell "e" followed by a cell whose rune is U+0301 with "x" as its
combining rune — the accent moves onto the x on screen — under both width methods, in
`SetContent` and in `ScreenWriter`. The monorepo's own vt emulator composes the mark with the
preceding character, so the Screen and the terminal disagree. A zero-width mark after a printed
cell belongs to that cell (`prev.Comb = append(prev.Comb, ...)`), whatever the decoder does.
'''

[[bug]]
id = "cellbuf/10"
title = "The line and cell shift operations panic for a rectangle that extends beyond the buffer"
kind = "panic"
severity = "medium"
test = "TestHegelPinShiftRectsBeyondTheBufferPanic"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`InsertLineRect`, `DeleteLineRect`, `InsertCellRect` and `DeleteCellRect` are documented to
affect "only cells within the rectangle's bounds", but they read `b.Lines[i-n][x]` /
`b.Lines[y][i+n]` for every coordinate of the rectangle without clipping it to the buffer:
`NewBuffer(4, 2).InsertLineRect(0, 1, nil, Rect(0, 0, 6, 3))` panics with `index out of range
[4] with length 4`, a rectangle with a negative origin panics with `index out of range [-1]`,
and a taller one with `index out of range [3] with length 2`. `FillRect` clips correctly (its
`setCell` bounds-checks). The rectangle should be intersected with `b.Bounds()` first.
'''

[[bug]]
id = "cellbuf/11"
title = "Blank cells drawn after a styled cell are painted with that cell's style and hyperlink"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBlankCellsInheritThePen"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`emitRange` reads `cell0 := line[0]` directly (a nil for a blank) and hands it to `putCell`;
`putAttrCell` turns a nil into `s.clearBlank()`, "a blank cell based on the current cursor
background color" — i.e. a space carrying the pen's current style *and link*. `Line.At` would
have produced an unstyled `BlankCell`. On a terminal without the xterm capabilities (`vt100`,
or an empty `TERM`), where ECH/REP are unavailable and every cell goes through `putCell`:

    screen 3x1, 'b' at column 1, then Clear() and a red-background linked '_' at column 0
    -> "\r\x1b[41m\x1b]8;;https://example.com\a_ \x1b[m\x1b]8;;\a"

The blank at column 1 is drawn with the red background and the hyperlink although the screen's
buffer holds a plain blank. The same path is reached on xterm-like terminals for single blanks
between styled cells (the zoo's emulator differential counts them). `insertCells` has the same
raw `line[i]` access.
'''

[[bug]]
id = "cellbuf/12"
title = "clearBottom erases from the row above the blank region, wiping a row that is never redrawn"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinClearBottomErasesTheRowAbove"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`clearBottom` scans from the bottom for rows that are blank in the new buffer and finds `top`,
the highest such row whose old content was not blank — a 0-based index. It then does
`s.move(0, top-1)` (the comment says "top is 1-based", but it is not) followed by
`EraseScreenBelow`, which erases from the cursor's row: the row *above* the blank region is
wiped on the terminal. The current buffer is updated to match (`clearToBottom` clears the
cursor's row from column 0), so `transformLine` only repaints that row if it is in the touch
map for this frame. When it is not, the content is gone until something else touches the row:

    screen 4x3, SetContent("a\nb\nc"), Render; then ClearRect(row 2), Render
    -> "\r\x1bM\x1b[J": the terminal now shows only "a"; the screen believes "a", "b"

Every partial update that blanks the bottom rows (a list shrinking, a status line vanishing)
removes the line above it. The move should be to `top`, as in ncurses' `ClrBottom`.
'''

[[bug]]
id = "cellbuf/13"
title = "Render loops forever when a wide cell is drawn in column 0 over a row whose content was only in column 0"
kind = "crash"
severity = "high"
test = "TestHegelPinRenderHangsOnAWideCellInColumnZero"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
In `transformLine`'s insert branch (`oLastCell < nLastCell`), the `n == 0` case runs

    next := newLine.At(n + 1)
    for next != nil && next.Empty() { n++; oLastCell++ }

without ever re-reading `next`, so if the cell after a wide head in column 0 is its placeholder
the loop never ends. Reached, for instance, by a one-row 6-column screen showing "x" and then
`SetContent("世x")`: `Render()` never returns and the goroutine spins at 100% CPU (the zoo's
pin reproduces it in a child process with a 5 s timeout). The conditions — the old line's last
non-blank cell in column 0, equal to the new line's last non-blank cell, and a wide character
now in column 0 — are ordinary for a list whose first entry gains a CJK or emoji prefix.
'''

[[bug]]
id = "cellbuf/14"
title = "The overwrite cursor-move optimisation prints a space over a wide cell's placeholder, blanking the cell"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinOverwriteMoveBlanksWideCells"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`relativeCursorMove` with `overwrite` moves the cursor right by re-printing the cells it passes
over when that is shorter than a CUF sequence. For a cell with `Width == 0` (the placeholder of
a wide character) it appends a plain space. Printing a space into the second column of a wide
character blanks the whole character on every terminal:

    screen 8x2 showing "xx🫧yy" / "abc" (cursor after c); SetCell(4, 0, 'z'); Render
    -> "\x1b[A zy": the terminal shows "xx  zy", the screen believes "xx🫧zy"

The style check that guards the optimisation skips zero-width cells too, so a styled wide cell
is not protected either. Placeholders must disable the overwrite path (or be skipped by moving
over the whole wide cell with its own content).
'''

[[bug]]
id = "cellbuf/15"
title = "REP is used for Latin-1 characters although the code restricts it to ASCII, and the monorepo's emulator does not repeat them"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRepeatUsedForLatin1"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`emitRange` guards the `REP` optimisation with "We only support ASCII characters. Most
terminals will handle non-ASCII characters correctly, but some might not" — but the test is
`cell0.Rune < 256`, which admits the Latin-1 range (é, ñ, ü, …), all multi-byte in UTF-8.
`SetContent("ñññññ")` on a 6-column screen emits `ñ\x1b[4b`; charmbracelet/x's own `vt`
emulator shows a single ñ, and the terminals the comment worries about repeat the last byte.
The check should be `< 128`.
'''

[[bug]]
id = "cellbuf/16"
title = "DiffSequence of two equal, non-empty styles is the reset sequence"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDiffSequenceOfEqualStylesResets"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`DiffSequence` builds an `ansi.Style` from the differences and returns `b.String()`; when the
two styles are equal nothing is added, and an empty `ansi.Style` renders as `ansi.ResetStyle`.
So `Style{Attrs: BoldAttr}.DiffSequence(Style{Attrs: BoldAttr})` is `"\x1b[m"`: applying the
"diff" to a terminal already in that style turns the style off. `RenderLine` and
`Screen.updatePen` happen to test `Equal` before calling it, so only direct callers see it;
the function should return "" when there is nothing to change.
'''

[[bug]]
id = "cellbuf/17"
title = "scroll optimisation without SU writes its newlines at the top row, so the terminal never scrolls"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinScrollUpWithoutSUWritesNewlinesAtTheTop"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`Screen.scrollUp` (hardscroll.go) scrolls a full region up by n >= 2 lines with `CSI n S` when
the terminal has the SU capability, and otherwise with n newlines; but it moves to `top` before
writing them (`s.move(0, top)`), and a newline only scrolls when the cursor is on the bottom
row. The n == 1 branch correctly moves to `bot` first, and ncurses does the same for n > 1. So
on any terminal without SU in `xtermCaps` -- the Linux console, "vt100", and every TERM outside
its list, which get no capabilities at all -- `Screen` believes the picture scrolled and updates
its own buffer, but the terminal still shows the old rows and the frame writes only what
changed. On a 2x5 linux screen `SetContent("a\n\nb\n\n\n")` followed by `SetContent("b")`
emits `\r\x1b[H\n\n`: charmbracelet/x's `vt` emulator still shows `a` on row 0 and `b` on
row 2, where `Screen` expects `b` on row 0 and a blank screen below. The same happens inside a
DECSTBM region (the second attempt in `scrolln`). Found by the emulator differential once the
random pictures happened to repeat two rows shifted by two lines; the pin uses the smallest
such pair. Fix: move to `bot` before the newlines, as the n == 1 branch does.
'''

[[bug]]
id = "cellbuf/18"
title = "on terminals without ICH, inserting before a wide cell writes the wide cell twice and loses the cell after it"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinInsertModeDuplicatesTheWideCell"
found = { commit = "c615ff2f780526ed45ede2c894200e4a584c361c", version = "v0.0.15+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`transformLine`, when the new line is longer than the old one (`oLastCell < nLastCell`), writes
the differing prefix with `putRange` and then inserts the missing cells. For a wide cell at
the end of the prefix its adjustment loop (`for n > 0 { wide := newLine.At(n + 1); ... n--;
oLastCell-- }`) steps `n` back onto the wide cell's head *after* `putRange` has already
written it, and steps `oLastCell` back too, so the insert count grows by the placeholder. On a
terminal without ICH (`insertCells` falls back to IRM: "vt100", the Linux console has ICH, and
every TERM outside `xtermCaps`' list) the frame for `SetContent("世世世")` →
`SetContent(" 世界世")` on an 8x1 screen is `\r 世界\x1b[2D\x1b[4h界\x1b[4l`: it moves back
two columns onto the `界` it just wrote and inserts another `界` in insert mode, pushing the
first one right, so a terminal honouring IRM shows ` 世界界` and `Screen`'s buffers say
` 世界世`. With ICH the same shape happens to take the `putRange` branch (`nLastCell <
nLastNonBlank`), which rewrites the tail and hides the miscount. charmbracelet/x's `vt`
emulator ignores IRM, so the pin replays the frame into a small line model that implements
it; the differential excludes frames that switch IRM on.
'''
