# Bugs found in itchyny/timefmt-go by the Hegel zoo. Oracle: glibc 2.39 strftime/strptime.

[[bug]]
id = "timefmt-go/1"
title = "The - flag followed by a width below the default pads with spaces to the default (%-1m → \" 7\")"
kind = "wrong-result"
severity = "low"
test = "TestHegelMinusFlagWithSmallWidthDoesNotPad"
found = { commit = "53188ffdc7cde471e4a60a97fa1f98fdbca12458", version = "v0.1.8+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`%-m` prints `7` (the README's "omitting padding modifier") and `%-5m` prints `    7`, but
`%-1m` prints ` 7`: when a width follows `-` the parser turns the flag into space padding
(`padding = ' ' | ^paddingMask`) and the directive then applies `max(width, 2)`, so the
explicit width 1 is raised to the default 2 and filled with a space. glibc prints `7` — the
flag suppresses the default padding and the width only ever adds. The same happens for every
directive with a default width above one: `%-1H` → ` 9`, `%-1S` → ` 5`, `%-1d` → ` 4`,
`%-1M` → ` 7`, `%-1I` → ` 9` (and `%-2j` → ` 86` for day 86). Widths at or above the default
are fine, as is `%-1Y` (whose default is applied with `or`, not `max`).
'''

[[bug]]
id = "timefmt-go/2"
title = "Parse ignores %j whenever a month or day directive is present, leaving the month at January"
kind = "wrong-result"
severity = "low"
test = "TestHegelOrdinalDayWinsOverPartialDates"
found = { commit = "53188ffdc7cde471e4a60a97fa1f98fdbca12458", version = "v0.1.8+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parseTime resolves the date with `switch { case day > 0: use (year, month, day); case yday > 0:
use the ordinal; … }`, and `%m` alone also ends in the first branch (day defaults to 1). So with
consistent input the ordinal is dropped and the missing part of the date stays at its default:
`Parse("29 2020 060", "%d %Y %j")` gives 2020-01-29 (wanted 2020-02-29), `Parse("02 2021 040",
"%m %Y %j")` gives 2021-02-01 (wanted 2021-02-09), `Parse("2021-100 10", "%Y-%j %d")` gives
2021-01-10 (wanted 2021-04-10). glibc's strptime derives whichever of month and day is missing
from tm_yday, and Python's _strptime computes month and day from the ordinal whenever %j is
given. Only formats with both %m and %d (or %F/%D/%x/%c) legitimately override %j.
'''
