# Bugs found in robfig/cron by the Hegel zoo. Oracle: a bit-set model of the grammar and a calendar model of Next.

[[bug]]
id = "cron/1"
title = "Parse panics (slice bounds out of range) on a spec that is only a zone prefix, such as \"TZ=UTC\" or \"CRON_TZ=Asia/Tokyo\""
kind = "crash"
severity = "medium"
test = "TestHegelPinBareTimeZonePrefixIsAnError"
found = { commit = "bc59245fe10efaed9d51b56900192527ed733435", version = "v3.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
parser.go: `i := strings.Index(spec, " ")` and then `spec[eq+1 : i]` — when the spec has a
`TZ=`/`CRON_TZ=` prefix and no space after it, i is -1 and the slice expression panics with
"runtime error: slice bounds out of range [:-1]". `cron.ParseStandard("TZ=UTC")`,
`c.AddFunc("CRON_TZ=Asia/Tokyo", f)`, and any prefix followed by a tab or newline instead of a
space ("CRON_TZ=Asia/Tokyo\t@hourly", see cron/5) all crash the caller instead of returning
the descriptive error Parse promises. Programs that accept schedules from configuration files
or users (the library's main use) get a panic out of AddFunc for a one-word typo.
'''

[[bug]]
id = "cron/2"
title = "Next skips a whole day whose midnight does not exist (DST gap at 00:00, e.g. Asia/Beirut, America/Havana, America/Santiago): a 03:00 run on 31 March 2024 in Beirut is scheduled for 31 May"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNextDoesNotSkipDaysWhoseMidnightDoesNotExist"
found = { commit = "bc59245fe10efaed9d51b56900192527ed733435", version = "v3.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
spec.go's day loop steps with `t.AddDate(0, 0, 1)` from midnight and then "corrects" a
non-midnight hour: `if t.Hour() > 12 { add 24-hour hours } else { subtract t.Hour() hours }`.
In a zone whose spring-forward happens at 00:00 (Lebanon: last Sunday of March, 00:00 → 01:00;
Cuba: second Sunday of March; Chile: first Sunday of September; Paraguay; Brazil until 2019),
time.Date(…, 0, 0, 0, 0, loc) for the gap day normalises to 01:00, the branch subtracts an hour
and lands at 23:00 of the previous day, whose day-of-month does not match; the next AddDate
lands at 23:00 of the gap day, which is "corrected" forward to 00:00 of the day after. The gap
day is never examined. With a schedule on the 31st (`0 0 3 31 * *`, seconds parser) from
2024-03-30 22:00 Asia/Beirut, Next returns 2024-05-31 03:00 instead of 2024-03-31 03:00 (April
has no 31st); with `0 0 * 31 3 *` it returns 2025-03-31 — a year late; with `0 30 12 * * 0`
(Sundays at 12:30, 31 March 2024 being a Sunday) the run is a week late. The same for
America/Havana 2024-03-10 and America/Santiago 2024-09-08. The doc comment only warns that
jobs *during* the transition will not run; here jobs at 03:00, 12:00 or 12:30 on an ordinary
wall clock are lost. The model that exposed it enumerates wall-clock instants with time.Date
and skips the ones that do not exist, which is what the day loop should do instead of
adjusting by the hour.
'''

[[bug]]
id = "cron/3"
title = "Anything after '*' or '?' in a range is ignored: \"*-5\" parses as \"*\" and \"?-5/2\" as \"*/2\""
kind = "contract"
severity = "low"
test = "TestHegelPinStarWithARangeIsRejected"
found = { commit = "bc59245fe10efaed9d51b56900192527ed733435", version = "v3.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
getRange splits on "-" and checks only lowAndHigh[0]: if it is "*" or "?" the whole field
range is used and lowAndHigh[1] is never looked at, so "*-5", "*-x", "?-" and "?-5/2" are
accepted silently as the full range (with the step, if any). A typo such as `*-5` where `0-5`
was meant becomes "every minute" without a word. The library rejects `1-2-3` ("too many
hyphens") and `59-0`; the star form should be rejected in the same way.
'''

[[bug]]
id = "cron/4"
title = "A field made only of commas (\",\", \",,\") parses to an empty set with a nil error, and the schedule never fires"
kind = "contract"
severity = "low"
test = "TestHegelPinEmptyFieldIsRejected"
found = { commit = "bc59245fe10efaed9d51b56900192527ed733435", version = "v3.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
getField splits the field with strings.FieldsFunc on ',', which drops empty items, so a field
"," yields no ranges and bits 0 with no error. `ParseStandard(", * * * *")` returns a
SpecSchedule with Minute = 0; Next scans five years for a minute that matches nothing and
returns the zero time, and the Cron runner treats a zero Next as "unsatisfiable" and never runs
the job — silently. Parse should reject a field with no values (the same code path already
rejects an empty spec). "1,,2" (an empty item between values) is accepted as {1,2}; that is
lenient but harmless and not part of this bug.
'''

[[bug]]
id = "cron/5"
title = "The zone prefix must be followed by a space: \"TZ=UTC<tab>0 0 * * *\" fails with \"provided bad location UTC\\t0\" although every other separator may be any blank"
kind = "contract"
severity = "low"
test = "TestHegelPinTimeZonePrefixEndsAtAnyBlank"
found = { commit = "bc59245fe10efaed9d51b56900192527ed733435", version = "v3.0.1+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Parse cuts the `TZ=`/`CRON_TZ=` prefix at `strings.Index(spec, " ")`, while the fields
themselves are split with strings.Fields (any Unicode white space). A spec whose prefix is
followed by a tab — the natural separator in a crontab-like file — is rejected with "provided
bad location UTC\t0: unknown time zone UTC\t0" (the zone name swallows the next field), and a
prefix followed by nothing or only a tab panics (cron/1). Use strings.Fields for the prefix
too, or strings.IndexFunc(spec, unicode.IsSpace).
'''

[[bug]]
id = "cron/6"
title = "Next loses or misplaces runs across a DST shift that is not a whole hour (Australia/Lord_Howe, Pacific/Chatham): a daily noon job in Lord Howe on the fall-back day is skipped to the next day, and \"0 50 3 * * *\" in Chatham runs at 02:50"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNextHandlesHalfHourAndQuarterHourShifts"
found = { commit = "bc59245fe10efaed9d51b56900192527ed733435", version = "v3.0.1+", hegel = "v0.6.33", date = "2026-09-24" }
status = "open"
notes = '''
spec.go's hour loop steps `t = t.Add(1 * time.Hour)` from a whole hour and re-checks the day
only when `t.Hour() == 0`; the minute loop steps a minute and re-checks the hour only when
`t.Minute() == 0`. Both assume that every wall-clock hour begins on one of the steps, which a
DST shift of 30 minutes (Australia/Lord_Howe, UTC+10:30/+11:00) or 45 minutes (Pacific/Chatham,
UTC+12:45/+13:45, clocks jumping 02:45 -> 03:45) breaks: after the shift the hour loop sits at
:30 or :45 past every hour. With the seconds parser and the schedule's Location set:
"0 0 12 * * *" from 2005-03-26 12:00 Lord Howe gives 2005-03-28 12:00 +1030, not 03-27 12:00
(the daily noon job is lost on the fall-back day); "0 0 3 * * *" from 2018-10-06 12:00 gives
10-08 03:00, not 10-07; "0 * 3 * * *" gives 2018-10-07 03:30 +1100, not 03:00 (a job at every
minute of hour 3 starts 30 minutes late); "0 * 3 * * 0" from 2006-09-24 03:59 Chatham gives
2006-10-08 03:00, not 2006-10-01 03:45 +1345 (the step from 02:00 lands on 04:00 and the
quarter of hour 3 that exists is never seen). When the minute loop steps across Chatham's
03:45 -> 02:45 fall-back its Minute() is 45, so nothing re-checks the hour: "0 50 3 * * *" from
2007-03-17 12:00 gives 2007-03-18 02:50 +1245, an hour early and not in hour 3 at all; likewise
"0 30 1 * * *" from 2018-10-07 01:40 Lord Howe gives 02:30 +1100 instead of 10-08 01:30. The
doc comment on Next only warns about jobs during a transition; here jobs at 12:00, 03:00 or
03:50 on an ordinary wall clock are lost or moved. Distinct from cron/2 (the day loop's hour
correction at a midnight gap); the fix is the same in spirit: enumerate wall-clock instants
with time.Date in the schedule's zone and skip the ones that do not exist, instead of stepping
by durations and correcting by field. Found by the Next property of the rewritten test, whose
zones include Lord Howe and Chatham.
'''
