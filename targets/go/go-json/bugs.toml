status = "open"
notes = '''
RFC 8259 requires control characters in strings to be escaped; encoding/json reports "invalid
character '\x01' in string". go-json decodes `"\x01"` to the one-byte string, `"a\nb"` (a raw
newline) to "a\nb", accepts `{"k\x02":1}` as a key, and Compact/Indent copy the bytes through.
A RawMessage or MarshalJSON output containing a raw newline inside a string is likewise passed
into Marshal's output unvalidated (encoding/json rejects it there too).
'''

