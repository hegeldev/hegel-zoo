id = "go-json/13"
title = "Floats printed in exponent form get a two-digit exponent: 1e-7 is written as `1e-07` where encoding/json writes `1e-7`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFloatExponentsAreNotZeroPadded"
