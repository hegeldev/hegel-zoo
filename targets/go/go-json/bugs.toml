# Bugs found in goccy/go-json by the Hegel zoo. Oracle: the standard library's encoding/json, which go-json promises to be compatible with.

[[bug]]
id = "go-json/1"
title = "Unmarshal of `null` into a TextUnmarshaler value zeroes the first machine word of the value (a string field is left dangling; reading it crashes)"
kind = "crash"
severity = "high"
test = "TestHegelPinNullIntoTextUnmarshalerKeepsTheValue"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json treats `null` into a non-pointer value implementing encoding.TextUnmarshaler as a
no-op. go-json's TextUnmarshaler decoder writes a nil word through the value's address instead:
with `type T struct{ A, B int }` (pointer-receiver UnmarshalText), `json.Unmarshal([]byte("null"),
&T{7, 8})` leaves {0 8} and a nil error; with `type S struct{ V string }` the string's data pointer
is nulled while its length stays 4, so `s.V` is a dangling header and the next read of it is a
SIGSEGV. The same happens through a struct field (`{"T":null}`) and a slice element (`[null]`).
Any TextUnmarshaler type — time-like types, enums, IDs — whose JSON may carry `null` is affected.
'''

