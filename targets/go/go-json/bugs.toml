[[bug]]
id = "go-json/16"
title = "Elements of a non-addressable array get their pointer-receiver MarshalJSON called; encoding/json encodes their fields"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinArrayElementsAreNotAddressable"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
With `func (m *M) MarshalJSON()`, encoding/json calls the method only when it can take the
address of the value: `json.Marshal([2]M{{1}, {2}})` and a struct value with an `[1]M` field
encode as `[{"V":1},{"V":2}]` / `{"A":[{"V":0}]}`, and slices (always addressable) call the
method. go-json calls the method for array elements too (`["ptr","ptr"]`), so the same value
encodes differently in the two libraries and differently from the struct-field case in go-json
itself (a struct value's `M` field does not call it).
'''

