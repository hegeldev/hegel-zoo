[[bug]]
id = "go-json/5"
title = "Object keys are matched case-insensitively only for structs with at most sixteen fields; with seventeen or more, `LOWER` no longer matches `json:\"lower\"`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFieldMatchingIsCaseInsensitiveForLargeStructs"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json matches keys to fields exactly first and then case-insensitively. go-json does
the same for structs with up to sixteen fields (a bitmap-based key matcher); for larger structs
it switches to a map lookup that only tries the exact key and the all-lowercase key, so
`{"LOWER":1}` (or `{"Lower":1}`) into a 17-field struct with a field tagged `lower` leaves the
field zero with no error — the key is silently dropped like an unknown one — while the same
document into a 16-field struct sets it. `{"notag":2}` still matches an untagged `NoTag` field
(lowercase input), which is what hides the problem in most tests.
'''

