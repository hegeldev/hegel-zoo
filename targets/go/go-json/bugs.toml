[[bug]]
id = "go-json/10"
title = "The stream Decoder accepts truncated literals at end of input (`tru` decodes as true, `nul` as null), skips a comma or colon before a value (`,1` decodes as 1) and accepts `\\u` escapes with non-hex digits; Valid inherits all of it"
kind = "contract"
severity = "medium"
test = "TestHegelPinDecoderRejectsTruncatedLiteralsAndLeadingPunctuation"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Unmarshal and NewDecoder(r).Decode disagree on the same bytes. `json.NewDecoder(strings.
NewReader("tru")).Decode(&v)` sets v = true with a nil error ("fals" → false, "nul" → null):
the stream literal decoder compares as many bytes as are left. `",1"` and `":1"` decode as 1 —
the stream decoder's skip-whitespace step treats a leading comma or colon as blank. `"\uZZZZ"`
and `"\u[0008"` decode without error (Unmarshal reports "invalid character Z in \u hexadecimal
character escape"). `Valid` is implemented by running the stream decoder, so `Valid([]byte(
"tru"))`, `Valid([]byte(",1"))` and `Valid([]byte(`"\uZZZZ"`))` are all true while Unmarshal
rejects every one of these texts and encoding/json rejects them everywhere.
'''

