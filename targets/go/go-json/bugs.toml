setting that Go value to nil." `json.Unmarshal([]byte("null"), &b)` with b = []byte{1, 2} keeps
{1, 2} in go-json (other slice types are reset correctly; the base64 []byte path takes a
different branch), so re-using a struct across decodes carries a stale value through an
explicit null.
'''

