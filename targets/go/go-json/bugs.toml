[[bug]]
id = "go-json/8"
title = "An unquoted `null` is accepted as an object key and becomes the empty string: `{null:1}` decodes to map[\"\":1]"
kind = "contract"
severity = "medium"
test = "TestHegelPinBareNullIsNotAnObjectKey"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The interface{} and map decoders read a key with the string decoder, whose `null` branch (meant
for string *values*) returns the empty string, so `{null:1}` and `{"a":1,null:2}` decode into
interface{} and into map[string]any with a "" key and no error where encoding/json says
"invalid character 'n' looking for beginning of object key string". Into a struct the same text
is rejected (with a misleading "looking for beginning of value"), so the two target kinds
disagree about the same document.
'''

