[[bug]]
id = "go-json/25"
title = "The stream Decoder fails on valid input when a `\\uXXXX` escape in a struct field key straddles its buffer refill (512/1024 bytes): \"invalid character u as escaped char\""
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDecoderHandlesEscapedKeysAcrossBufferRefills"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`{"s":"<501 × a>","\u0069\u0038":2}` decoded with `json.NewDecoder(r).Decode(&v)` into
`struct{ S string \`json:"s"\`; I8 int8 \`json:"i8"\` }` fails with "invalid character u as
escaped char"; the same bytes with 500 or 502 a's decode, and `Unmarshal` accepts all of them.
The failing lengths (495, 497, 501, 503, 1006–1010, 1014, 1016 in the probe) are those where the
escape sits on the boundary of the stream's 512-byte, then 1024-byte, read buffer: the struct
key matcher's escape handling reads past the buffered bytes without asking for a refill, and
depending on the alignment reports the wrong error ("expected colon after object key") or the
one above. A network reader delivering a document with escaped keys — as many JavaScript
serialisers do for non-ASCII field names — fails intermittently depending on where in the
stream the document starts.
'''

