status = "open"
notes = '''
`json.Marshal((*T)(nil))` for a T with a value-receiver MarshalText returns `""` (an empty
JSON string) with a nil error; encoding/json returns `null`, as go-json itself does for the
same nil pointer inside a slice, a map or a struct field. The top-level TextMarshaler opcode
calls MarshalText through the nil pointer's zero value instead of taking the nil branch.
'''

