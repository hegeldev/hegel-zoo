[[bug]]
id = "go-json/26"
title = "Unmarshal and Decoder.Decode of a well-formed number outside float64 range into a json.Number fail with `strconv.ParseFloat: value out of range` instead of storing the literal"
kind = "wrong-result"
severity = "medium"
test = "TestHegelNumbersOutOfRangeFitInNumber"
found = { commit = "15fe6a58bfc7ef1db6598f2db4898b967fd2fa78", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-26" }
status = "open"
notes = '''
`json.Number` exists to carry a number's text without loss, and encoding/json stores any
well-formed literal in it: `Unmarshal([]byte("1e310"), &n)` gives `Number("1e310")` with a
nil error, likewise `-1e400`, `{"n":1e310}` into `struct{ N json.Number }` and `[1e310]` into
`[]json.Number`. go-json's Number decoder validates the literal with `strconv.ParseFloat(_, 64)`
(internal/decoder/number.go, in both `Decode` and `DecodeStream`; the same site as go-json/20)
and returns its range error, so a document holding a number beyond float64 cannot be decoded
into a Number at all, the one type meant for it. `Marshal(Number("1e310"))` writes the literal
verbatim in both libraries, and a `RawMessage` target is fine. Found by the rewritten struct
and round-trip properties once three-digit exponents were drawn (for go-json/22); reproduced
standalone against the pinned commit.
'''
