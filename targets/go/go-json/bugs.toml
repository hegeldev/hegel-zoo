[[bug]]
id = "go-json/7"
title = "The number grammar is lenient: leading zeros (01, 00, -01), a trailing dot (1., 0., 1.e5), a missing integer digit (-.0) and a lone `-` (into an integer, giving 0) are accepted"
kind = "contract"
severity = "medium"
test = "TestHegelPinNumberGrammarIsStrict"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
RFC 8259 forbids leading zeros and requires a digit after the decimal point; encoding/json
rejects `01` ("invalid character '1' after top-level value"), `1.` and `[0.]`. go-json's
Unmarshal, Valid, Compact and Indent accept `01` (as 1), `00`, `-01`, `1.`, `0.`, `1.e5`
(as 100000), `[01]` and `{"a":1.}`; `json.Unmarshal([]byte("-"), &i)` sets an int to 0 with a
nil error. Documents rejected by every conforming parser are accepted here, and `01` versus
`1` can read differently in other systems (octal in some).
'''

