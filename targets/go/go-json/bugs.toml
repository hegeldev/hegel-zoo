[[bug]]
id = "go-json/2"
title = "Integers outside int64/uint64 wrap around silently: 9223372036854775808 decodes into int64 as -9223372036854775808 with a nil error; 3.5e38 into float32 becomes +Inf"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInt64OverflowIsAnError"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json reports an UnmarshalTypeError ("cannot unmarshal number 9223372036854775808 into
Go value of type int64") for a number that does not fit the target. go-json's int and uint
decoders accumulate the digits in a 64-bit register without an overflow check, so any value in
[2^63, 2^64) wraps to a negative int64, 18446744073709551616 decodes into uint64 as 0 and
99999999999999999999 as 7766279631452241919; int8..int32 and uint8..uint32 are range-checked
correctly and only the 64-bit types (and int/uint) are affected. The same through the `,string`
option. float32 has the same problem in a different form: 3.5e38 (and 1e39) decode as +Inf with
no error where encoding/json rejects them.
'''

