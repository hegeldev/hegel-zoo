[[bug]]
id = "go-json/24"
title = "A stray `]` or `}` after a complete top-level value is not an error for Valid (`null]`, `[1]]`, `1]garbage` are valid) nor for Decoder.Token, which returns it as a Delim"
kind = "contract"
severity = "low"
test = "TestHegelPinStrayClosingBracketIsAnError"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`Valid` decodes one value with the stream decoder and then returns true if `More()` is false;
More is false whenever the next byte is `]` or `}`, so anything after a closing bracket is
never looked at: `Valid([]byte("null]garbage"))` is true. `Decoder.Token` on "null}" returns
Delim('}') with a nil error where encoding/json reports "invalid character '}' looking for
beginning of value". Unmarshal rejects the same texts ("invalid character ']' after top-level
value").
'''

