[[bug]]
id = "go-json/6"
title = "Integers in string form (`,string` fields and integer map keys) are parsed by prefix and misread leading zeros: \"1e2\" gives 1, \"5x\" gives 5, \"05\" gives 0, \" 5\" is accepted, \"+5\" is rejected"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinQuotedIntegersAreParsedStrictly"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
For a field `N int \`json:"n,string"\``, encoding/json parses the quoted text with the JSON
number grammar and strconv: `{"n":"05"}` and `{"n":"+5"}` give 5, `"1e2"`, `"5x"`, `" 5"`,
`"5.0"`, `"0x5"` and `"-"` are errors (and `"5 "`, a trailing space, which go-json also
accepts: found by the narrow property on 2026-09-26). go-json reads digits until the first non-digit and stops
without complaint: "1e2" → 1, "5x" → 5, "5.0" → 5, "0x5" → 0, "-" → 0, " 5" → 5, and "05" → 0
(the leading zero is taken as the whole number), while "+5" is rejected. The same parser is
used for integer map keys: `{"01":1}` into map[int]int gives map[0:1] (encoding/json: map[1:1]),
`{" 1":1}` and `{"1.0":1}` are accepted, `{"+1":1}` is not. A `,string` bool accepts " true".
'''

