status = "open"
notes = '''
encoding/json formats with strconv 'e' and then strips the zero of a one-digit exponent
("clean up e-09 to e-9"); go-json keeps strconv's padding, so every float in [1e-9, 1e-6) —
and float32 alike — encodes differently: 1e-07, -1.5e-08, 5e-07. Valid JSON, but byte-different
output from a library whose selling point is being a drop-in replacement (golden files, content
hashes, signatures over canonical JSON).
'''

