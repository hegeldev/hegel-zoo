[[bug]]
id = "go-json/3"
title = "float32 NaN and ±Inf are written as the bare tokens NaN, +Inf, -Inf (invalid JSON) with a nil error; float64 ones are rejected as in encoding/json"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFloat32NaNAndInfAreRejected"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`json.Marshal(struct{ F float32 }{float32(math.NaN())})` returns `{"F":NaN}` and no error;
`[]float32{1, NaN}` gives `[1,NaN]`, `map[string]float32{"a": +Inf}` gives `{"a":+Inf}`. The
float64 encoder has the `math.IsNaN`/`IsInf` check that produces encoding/json's
UnsupportedValueError; the float32 opcode does not, so a float32 that overflowed (see go-json/2)
or a computed NaN produces output no JSON parser accepts.
'''

