id = "go-json/11"
title = "Raw control characters (U+0000..U+001F) inside strings are accepted by Unmarshal, Valid, Compact and Indent"
kind = "contract"
severity = "low"
test = "TestHegelPinRawControlCharactersInStringsAreRejected"
