[[bug]]
id = "go-json/4"
title = "A NUL byte ends the input: `1\\x00garbage` is accepted by Unmarshal, Valid, Compact and Indent, and everything after the NUL is ignored"
kind = "contract"
severity = "medium"
test = "TestHegelPinNulByteDoesNotTerminateTheInput"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
decode.go copies the input into a buffer with a trailing NUL as the end marker, and
validateEndBuf stops at the first NUL it sees — including one that was in the data. So
`json.Unmarshal([]byte("1\x00garbage"), &v)` succeeds with v = 1 and `[1,2]\x00{` is Valid, where
encoding/json reports "invalid character '\x00' after top-level value". Anything checking a
document with go-json and reading it with another parser (or the other way round) can be made
to disagree about its content.
'''

