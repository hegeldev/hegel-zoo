[[bug]]
id = "go-json/14"
title = "Map keys are sorted by their quoted, escaped encoding, not by the key: `>` sorts after `?`, `\\n` after ` `, `b ` before `b`, and ` ` before the empty key"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMapKeysSortByKeyNotByEscapedKey"
found = { commit = "f1e7554014296f3d97b2367c524a14b3b8877ab6", version = "v0.10.6+", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
encoding/json sorts map keys by the key string. go-json encodes each key first and sorts the
encoded forms (including the quotes), so a key that gets escaped (`<`, `>`, `&`, `"`, `\`,
control characters, invalid UTF-8) sorts as `\u003e...` (a backslash, 0x5c) rather than as its
own first byte — `map[string]int{">": 1, "?": 2}` becomes `{"?":2,"\u003e":1}` — and a key that
is a prefix of another compares its closing quote (0x22) against the longer key's next byte, so
`{"b":1,"b ":2}` comes out as `{"b ":2,"b":1}` and `{"":1," ":2}` as `{" ":2,"":1}`. Key order
is what canonical-JSON consumers rely on.
'''

