# Bugs found in nyaruka/phonenumbers (v2.0.9, libphonenumber metadata 9.0.38) by the Hegel zoo.
# One [[bug]] per finding; `test` names the plain Go test in hegel_test.go that fails while the bug
# exists (listed under [expected_failures] in target.toml). Oracle: Python's phonenumbers 9.0.38
# (the other libphonenumber port, same metadata) as a child process; the Java reference
# (libphonenumber 9.0.38, geocoder 3.39, carrier 2.39 from Maven Central) arbitrated every
# disagreement between the two ports. No AI policy in README.md or CONTRIBUTING.md (the README
# ships a Claude Code skill for syncing with upstream; checked 2026-09-19).

[[bug]]
id = "phonenumbers/1"
title = "geocoding and carrier lookups do not fall back to English for languages without data"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPrefixLookupsFallBackToEnglish"
found = { commit = "0a7e43b1fc856718149763df7934e1a3c7cb7312", version = "v2.0.9", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
libphonenumber's PrefixFileReader.getDescriptionForNumber looks the number up in the requested
language and, when that yields nothing and the language is not zh, ja or ko, in English
("When a location is not available in the requested language, fall back to English"); the
geocoder then returns the country name only when English has no area either, and the carrier
mapper returns the English carrier name. The port's geocoding.GetDescriptionForValidNumber and
carrier.GetNameForValidNumber call prefixmapper.ValueForNumber(lang, ...) once and take its
answer as final: geocoding.GetDescriptionForNumber(+1 201 555 0123, "de") is "Vereinigte
Staaten" and with "" or "xx" "United States", where the Java reference (and the Python port)
give "New Jersey"; carrier.GetNameForNumber(+63 905 123 4567, "ru") is "" where Java gives
"Globe". Languages with their own data ("de" for +49 30 ... gives Berlin) are unaffected; the
zh/ja/ko exception is respected by accident (no fallback at all). Found by
TestHegelNumberQueriesAgreeWithLibphonenumber, whose carrier and area comparisons are now made in
English only.
'''

[[bug]]
id = "phonenumbers/2"
title = "FormatOutOfCountryKeepingAlphaChars keeps a + or * of the raw input"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAlphaFormattingDropsPlusAndStar"
found = { commit = "0a7e43b1fc856718149763df7934e1a3c7cb7312", version = "v2.0.9", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
formatOutOfCountryKeepingAlphaChars normalises the raw input with ALL_PLUS_NUMBER_GROUPING_SYMBOLS
(digits, letters and grouping punctuation: 78 entries in Java, checked by reflection on
libphonenumber 9.0.38 - neither '+' nor '*' is among them), so a leading plus or star is dropped
before the country code and IDD are prepended. The port's allPlusNumberGroupingSymbols
(phonenumberutil.go) adds plusSign and '*' to the map, so they survive:
ParseAndKeepRawInput("+1 20-1-55500-2-3", "US") formatted from HU gives "00 1 +1 20-1-55500-2-3"
(Java "00 1 1 20-1-55500-2-3"); "*02 1234 5678-" parsed in IT and formatted from IT gives
"*02 1234 5678-" (Java "02 1234 5678-"); "telFLOWERS:+86-10-1234-5678" from CN gives
"TELFLOWERS+086-10-1234-5678" (Java "TELFLOWERS086-10-1234-5678"). Only inputs whose raw form
carries a '+' or '*' are affected; the parsed number is right. Found by
TestHegelNumberQueriesAgreeWithLibphonenumber (gated on a raw input containing + or *).
'''
