name = "phonenumbers"
language = "go"
upstream = "https://github.com/nyaruka/phonenumbers"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-19"

[base]
commit = "7e3ecf02576b20ffac858b45f9fba617ab22f04f"
date = "2026-09-14"
version = "v2.0.12+"

[hegel]
version = "v0.6.33"

[run]
# The tests need a python3 with the phonenumbers package at the same libphonenumber metadata
# version as metadata/version.go (9.0.39 at this commit) on PATH as the oracle.
command = "go test -count=1 -v ."

[expected_failures]
TestHegelPinPrefixLookupsFallBackToEnglish = "phonenumbers/1"
TestHegelPinAlphaFormattingDropsPlusAndStar = "phonenumbers/2"
# The wide query property draws a non-English language for its area and carrier lookups in
# about 30% of its cases (and a raw input with + or * in 3%): it fails every run on bug 1.
TestHegelNumberQueriesAgreeWithLibphonenumber = "phonenumbers/1"
TestHegelAreaLookupsFallBackToEnglish = "phonenumbers/1"
TestHegelCarrierLookupsFallBackToEnglish = "phonenumbers/1"
TestHegelOutOfCountryAlphaFormattingDropsPlusAndStar = "phonenumbers/2"
