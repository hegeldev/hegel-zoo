# Bugs found in DataDog/sketches-go by the Hegel properties. The zoo records only the target's
# bugs; each has a pin (a plain test asserting the documented behaviour) listed in
# target.toml's [expected_failures].

[[bug]]
id = "sketches-go/1"
title = "AddWithCount accepts a NaN count and poisons the sketch"
kind = "contract"
severity = "low"
test = "TestHegelPinNaNCountRejected"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DDSketch.AddWithCount guards the count with "count < 0" (ErrNegativeCount), which a NaN
passes. The NaN is added to the store's count: GetCount() becomes NaN, IsEmpty() stays
false, every KeyAtRank comparison is false, and the quantiles are the maximum bin from then
on. The same package rejects a NaN count in stat.NewSummaryStatisticsFromData ("!(count >=
0)"). An error (ErrNegativeCount or a new one) is the consistent answer.
'''

[[bug]]
id = "sketches-go/2"
title = "GetValueAtQuantile(NaN) returns a value and no error"
kind = "contract"
severity = "low"
test = "TestHegelPinNaNQuantileRejected"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GetValueAtQuantile documents "a non-nil error if the quantile is invalid" and checks
"quantile < 0 || quantile > 1", which NaN passes; the rank is NaN, every branch test fails,
and the value of the last positive bin is returned with a nil error (GetValuesAtQuantiles
likewise). GetValueAtQuantile(-0.1) and (1.1) do return the error.
'''

[[bug]]
id = "sketches-go/3"
title = "Quantiles of a sketch whose total count is below 1 come from the empty negative store"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFractionalCountQuantile"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GetValueAtQuantile computes rank = quantile * (count - 1). Counts are float64 and
AddWithCount takes fractional ones, so a sketch can hold a total count below 1; the rank is
then negative for every quantile above 0, "rank < negativeValueCount" holds with an empty
negative store (0 > negative), and the answer is -Value(negativeValueStore.KeyAtRank(...))
of an empty store: -0 with a DenseStore (whose empty KeyAtRank returns the MinInt32 sentinel,
Value of which is 0) and -(1 + alpha) with a SparseStore or BufferedPaginatedStore (whose
empty KeyAtRank returns 0). A sketch built by AddWithCount(5, 0.5) reports the 0.5-quantile
and the maximum as -0 or -1.01 while GetMinValue is 5.01. Clamping the rank at 0 (as the
stores do for KeyAtRank) fixes it.
'''

[[bug]]
id = "sketches-go/4"
title = "ChangeMapping loses or NaN-poisons the count of a bin whose upper bound overflows"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinChangeMappingTopBin"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
changeStoreMapping spreads each old bin [LowerBound(i), LowerBound(i+1)) over the new bins
in proportion to the overlap. For a value within a factor gamma of MaxIndexableValue,
LowerBound(i+1) of the logarithmic mapping is math.Exp of a number above the overflow
threshold, +Inf: the bin's size is +Inf, the proportions are 0 (finite/Inf) or NaN (Inf/Inf
for the new bin whose own upper bound overflows), and the count is lost or the new sketch's
count becomes NaN. A sketch over NewLogarithmicMapping(0.5) holding its MaxIndexableValue
(8.47e307) has count NaN after ChangeMapping to NewLogarithmicMapping(0.3). The interpolated
mappings do not overflow there: their LowerBound wraps to a tiny value (the exponent
overflows in buildFloat64: LowerBound(top+1) of the cubic mapping for alpha 0.99 is 1.2e-307
below LowerBound(top) = 2.0e307), so the loop over the new bins does not run and the count is
lost as well.
'''

[[bug]]
id = "sketches-go/5"
title = "Mapping constructors accept a NaN relative accuracy or gamma"
kind = "contract"
severity = "low"
test = "TestHegelPinNaNAccuracyRejected"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NewLogarithmicMapping, NewLinearlyInterpolatedMapping and NewCubicallyInterpolatedMapping
check "relativeAccuracy <= 0 || relativeAccuracy >= 1", and the WithGamma constructors
"gamma <= 1"; NaN passes both. NewDefaultDDSketch(math.NaN()) therefore returns a sketch (no
error) whose mapping has gamma NaN, RelativeAccuracy() NaN, Value(i) NaN and Index(v) =
MaxInt64 for every value, so the first Add goes to index MaxInt64 of the store.
'''

[[bug]]
id = "sketches-go/6"
title = "DecodeDDSketch cannot read an encoded DDSketchWithExactSummaryStatistics: it skips 8 bytes for the varfloat64 count"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDecodePlainFromExactSummary"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DecodeDDSketch documents "It is possible to decode with this function an encoded
DDSketchWithExactSummaryStatistics, but the exact summary statistics will be lost", and
DecodeAndMergeWith skips the unknown-to-it blocks FlagCount, FlagSum, FlagMin and FlagMax by
dropping 8 bytes. Sum, min and max are float64LE (8 bytes), but the count is encoded as a
varfloat64 (1 to 9 bytes; encoding/flag.go documents "[varfloat64] total count"), so the
stream desynchronises after the count block and decoding fails with "unknown encoding flag"
or "unknown bin encoding" for every non-empty sketch whose count does not happen to take 8
bytes. DecodeDDSketch of the encoding of an exact-summary sketch holding 1 and 2.5 fails with
"unknown encoding flag"; only empty sketches (no count block) decode. The exact-summary
decoder itself reads the count with DecodeVarfloat64.
'''

[[bug]]
id = "sketches-go/7"
title = "FromProto and MergeWithProto ignore MaxDecodeIndexRange"
kind = "contract"
severity = "low"
test = "TestHegelPinFromProtoIndexRange"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
store.MaxDecodeIndexRange (default 1 << 26) bounds the index span a decoded store may cover,
so that a crafted payload cannot make a dense store allocate its whole range (issue #85):
"decoding a payload whose bins span a wider range returns an error instead". The guard is
applied by the byte decoder only. store.FromProto (always a DenseStore), store.MergeWithProto,
and ddsketch.FromProto / FromProtoWithStoreProvider built on them add every protobuf bin
without checking the span: a sketchpb.Store with bins at MinInt32 and MaxInt32 makes the
dense store allocate 2^32 float64 (34 GB), the very allocation the limit exists to prevent.
The pin sets the limit to 1024 and decodes a store spanning 5001 indexes, which should be
refused.
'''

[[bug]]
id = "sketches-go/8"
title = "ChangeMapping with values scaled below the new mapping's range panics (dense store) or files them at index MinInt64"
kind = "panic"
severity = "low"
test = "TestHegelPinChangeMappingBelowRange"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
changeStoreMapping computes newMapping.Index(oldLowerBound * scaleFactor) without checking
the new mapping's indexable range. When the scaled bound is below MinIndexableValue (or
underflows to 0: log(0) = -Inf, int(-Inf) = MinInt64), the index is far outside int32 and
the target store gets AddWithCount(MinInt64-ish, count): a DenseStore panics in shiftCounts
("slice bounds out of range [-4611686018427387527:]"), a SparseStore keeps the count at that
index (the count is preserved but the value is nonsense), and when the new bin's lower bound
is not below the scaled old bin's upper bound the count is simply dropped: a sketch over
NewLogarithmicMapping(0.01) holding 1e-300, changed to NewLogarithmicMapping(0.02) with scale
1e-10, has count 0 with dense target stores. Values below the range should go to the zero
bucket, as AddWithCount sends them.
'''

[[bug]]
id = "sketches-go/9"
title = "Merging into an empty collapsing store a same-type store spanning more than its bin limit panics"
kind = "panic"
severity = "medium"
test = "TestHegelPinCollapsingMergeOfWideStore"
found = { commit = "228b76a8e69df016726ce47579da54cffb0d0779", version = "v1.4.8", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CollapsingLowestDenseStore.MergeWith takes a fast path when the other store is a
CollapsingLowestDenseStore: extendRange(o.minIndex, o.maxIndex), then a bin-by-bin addition.
For an empty receiver extendRange allocates min(range, maxNumBins) bins, sets minIndex and
maxIndex to the other store's range, and calls adjust; when the range exceeds maxNumBins,
adjust computes newMinIndex = maxIndex - len + 1, finds newMinIndex < maxIndex (already set),
and takes the shift path, whose loop reads and shifts bins beyond the array:
NewCollapsingLowestDenseStore(2).MergeWith(a store holding indexes 0 and 2) panics with
"slice bounds out of range [:3] with capacity 2"; (64) merging indexes 0 and 100 with "[:101]
with capacity 64"; the same for CollapsingHighestDenseStore. A non-empty receiver, or another
store type as the argument (which goes through ForEach and AddWithCount), works. Through the
sketch: a fresh LogCollapsingLowestDenseDDSketch (an aggregator with a smaller bin limit)
merging a populated one of the same kind panics.
'''
