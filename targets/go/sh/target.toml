name = "sh"
language = "go"
upstream = "https://github.com/mvdan/sh"
subdir = ""
license = "BSD-3-Clause"  # README and AGENTS.md: "drive-by AI patches are not helpful unless they come from an active user or contributor; detailed issues are preferred" — the zoo only records bugs, nothing is sent upstream
ai_policy_checked = "2026-09-17"

[base]
commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e"
date = "2026-09-09"
version = "v3.14.0+ (master 2026-09-09; v3.14.1 is the last tag)"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./syntax"  # bash and dash are the shell oracles (`-n`); a missing shell skips its checks

