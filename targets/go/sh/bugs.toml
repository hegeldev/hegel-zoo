kind = "contract"
severity = "high"
test = "TestHegelPinCommentsEndAtTheNewline"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`echo a # b\` followed by `echo c` on the next line parses as one statement whose arguments are
`echo c`, with `echo a` gone, and prints as `echo a \` / `echo c # b\`. A comment ends at the newline
in every shell (bash and dash run both statements); the lexer treats the backslash before the newline
as a line continuation. Closed issue #457 ("Backslash at the end of comment 'hides' closing braces",
3.0.1) fixed the same lexing for `}` but not for the statement that follows. Found by the formatting
property with KeepComments; the generator's comments never end in a backslash.
'''

