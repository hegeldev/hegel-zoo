notes = '''
`NewParser(RecoverErrors(1)).Parse` of `x=$((a b` panics with "slice bounds out of range [2:1]" in
Parser.getAssign (parser.go:1941 at this commit); so do `x=$((a b))`, `x=a$((a b` and `x=$[a b`, in
every dialect, and `x+=$((a b` panics with "index out of range [1] with length 1". `$((a b` on its
own recovers, `echo x=$((a b` too, and with RecoverErrors off every shape is the error "not a valid
arithmetic operator". Recovery leaves p.val shorter than p.eqlOffs remembers. Found by the
broken-inputs property (mutated programs under RecoverErrors 1–5) at 1000 cases and reduced from a
1 300-byte program to eight bytes; the property parses assignments holding `$((` without recovery.
'''

[[bug]]
id = "sh/25"
title = "Minify prints `a | &>f b` as `a|&>f b`, which is `a |& >f b`"
kind = "contract"
severity = "high"
test = "TestHegelPinMinifyKeepsPipesApartFromRedirects"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With Minify the space after `|` goes, and a following command that starts with the `&>` (or `&>>`)
redirect glues into the `|&` operator: `a | &>f b` becomes `a|&>f b`, which bash and the parser read
as `a |& >f b` — the pipe now carries stderr as well. Silent, and shfmt exposes Minify as `-mn`.
`a & &>f b` is safe because Minify puts a newline after `&`; `a && &>f b` gives `a&&&>f b`, which
lexes back correctly. Found by the formatting property at 100 cases with several heredocs on the
line; Minify is left off when a `|` is followed by `&>`.
'''

[[bug]]
id = "sh/26"
title = "A substitution holding a multi-statement subshell prints `) )`, then `))`"
kind = "contract"
severity = "low"
test = "TestHegelPinSubstitutionsCloseTheSameWayTwice"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`echo $( (a; b) )` prints as `echo $( (\n\ta\n\tb\n) )` — the subshell is broken across lines and a
space separates its `)` from the substitution's — and that prints as `echo $( (\n\ta\n\tb\n))`.
The same with `$(! (a; b))`, with a `b` suffix after the substitution, and with Minify (`$( (a\nb) )`
then `$( (a\nb))`); a single-statement subshell, `{ }` and a subshell followed by `| c` are stable.
The space is kept when the source has the two parentheses on one line and dropped once the
subshell's closing parenthesis is on a line of its own. Found by the formatting property
(idempotence) with Minify; the generator retries lines whose substitution starts with a subshell.
'''
