[[bug]]
id = "sh/16"
title = "Simplify single-quotes a literal inside a double-quoted `${x:-\"...\"}`"
kind = "contract"
severity = "medium"
test = "TestHegelPinSimplifyKeepsQuotesInsideQuotedExpansions"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
