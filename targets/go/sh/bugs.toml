[[bug]]
id = "sh/1"
title = "After a `let` clause a comment, `|&`, `|[` or `|{` is a parse error"
kind = "contract"
severity = "medium"
test = "TestHegelPinLetAcceptsATrailingComment"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`let x=1 # c` fails with "statements must be separated by &, ; or a newline", `let x=1 |& cat` with
"`|` must be followed by a statement", `let x=1 |[ a = a ]` and `let x=1&&[[ a ]]` with "`[` must
follow a name like a[i]" and `let x=1|{ a;}` with "`}` can only be used to close a block"; bash runs
them all, and `((x=1)) # c`, `[[ a ]] # c`, `declare x # c`, `let x=1 | cat` and `let x=1 | [ a = a ]`
parse. The lexer state after the last `let` argument does not see the `#` as a comment start, `|&`
as one operator, nor the `[`/`{` after an operator as a new command. The glued forms are what
Minify prints for `let x=1 | [ a = a ]`, so minified programs with `let` stop parsing. Found by the
formatting property (a generated `let` line with a trailing comment, then Minify), and for `|&` by
the streaming property; the generator puts no comment after `let`, no `|&` after it, and Minify is
left off for programs with `let`.
'''

