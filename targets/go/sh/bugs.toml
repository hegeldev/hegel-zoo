[[bug]]
id = "sh/3"
title = "KeepPadding is not idempotent: leading redirects grow spaces, subshells gain trailing spaces"
kind = "contract"
severity = "low"
test = "TestHegelPinKeepPaddingIsIdempotent"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
KeepPadding is deprecated and documented as best-effort, but a formatter option should still reach a
fixed point. `! >aa foo` prints as `!     >aa foo`, which prints as `!         >aa foo` (four more
spaces per pass; also after `|&` and `while`), and with space indentation a line starting with a
redirect drifts right on every pass: `&>aa echo` under `Indent(1)` prints as `     &> aa echo`, then
`           &> aa echo`. With space indentation (`Indent(3)`), a multi-line
subshell `(\ntrue\n)` prints as `(\n   true\n)` and then as `(  \n   true\n)`, with trailing spaces
after the parenthesis (also `(\ntrue\n) >>b | c`, `! (\ntrue\n)`, and nested subshells); `{ }` and
`if` bodies are fine, as is tab indentation. The formatting property leaves KeepPadding off when the
program negates a command, starts a statement with a redirect or, with space indentation, has a
parenthesis ending a line.
'''

[[bug]]
id = "sh/4"
title = "In a negated pipeline the first statement starts at the `!`"
kind = "contract"
severity = "low"
test = "TestHegelPinNegatedPipelineStatementsStartAtTheirCommand"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In `! a | b` the `!` negates the whole pipeline, and the outer statement carries `Negated`; yet the
statement of the first command (`a`) has its Pos at the `!`, so its span is `! a` and it does not
parse on its own as the command it holds. `! a && b` gets it right (the inner statement starts at `a`).
Found by the position property, which reparses every statement's span.
'''

[[bug]]
id = "sh/5"
title = "A heredoc body is printed inside a substitution or subshell that follows it on the line"
kind = "contract"
severity = "high"
test = "TestHegelPinHeredocBodiesStayOutsideSubstitutions"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`cat <<EOF && echo $(a; b)\nbody\nEOF\n` prints as `cat <<EOF && echo $(\nbody\nEOF\n\ta\n\tb\n)\n`:
the printer breaks the command substitution across lines (two statements) and flushes the pending
heredoc body at the first newline, which is now inside `$( )`. The result is an unclosed heredoc for
the parser and for bash. The same happens with a subshell `( )`, a process substitution `<( )` and
backquotes; `{ a; b; }`, `if`, `while` and `case` after a heredoc are fine, and so is a substitution
with a single statement. With SingleLine the shape also arises when later lines are joined onto the
heredoc line. Found by the formatting property; the generator retries lines that have `(` or a
backquote after a heredoc redirect.
'''

[[bug]]
