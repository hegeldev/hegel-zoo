[[bug]]
id = "sh/10"
title = "`coproc` mishandles its first word: wrong statement position, assignments become arguments"
kind = "contract"
severity = "medium"
test = "TestHegelPinCoprocStatementsStartAtTheirCommand"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The parser tries the first word after `coproc` as the coprocess name and, when no compound command
follows, keeps it as a plain argument of the simple command: in `coproc echo a a` the statement's Pos
is at the second word, and `coproc x=a echo a` has no assignment (Args are `x=a echo a`). So
`coproc x=a x=b echo a` (Args `x=a`, Assigns `x=b`) prints as `coproc x=b x=a echo a`, and
`coproc &>aa x=a echo a` (correctly parsed: a redirect, an assignment, a command) prints as
`coproc x=a &>aa echo a`, which reads back as a different program. `coproc echo a | cat` takes `echo`
as the name. bash treats `coproc x=a cmd` as a simple command with an assignment. Found by the
position property and the Simplify round trip; the generator replaces coproc commands that carry
assignment words by `echo a`.
'''

