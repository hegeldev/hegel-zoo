[[bug]]
id = "sh/22"
title = "The separator after a case statement is dropped before a closing word or `then`/`do`"
kind = "contract"
severity = "high"
test = "TestHegelPinCaseRedirectsKeepTheirSeparator"
found = { commit = "c6351e95dbeeb2645b68c463ea916eed815bef5e", version = "v3.14.0+ (2026-09-09)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With default options, `{ case a in a) b ;; esac >x; }` prints as `{ case a in a) b ;; esac >x }`,
`f() { case a in a) b ;; esac 2>&1; }` as `... esac 2>&1 }`, `while a; do case a in a) b ;; esac >x;
done` as `... esac >x done` and the `if` form as `... esac >x fi`. bash and dash reject them all; the
parser reads them back. Without the redirect the `;` is also dropped (`esac }`), which happens to be
valid; `{ if a; then b; fi >x; }` and `{ { b; } >x; }` keep theirs. The same loss reaches an
enclosing statement through a substitution: `if $(case a in a) esac); then ]; fi` prints as
`if $(case a in a) ;; esac) then ]; fi` and `while x=$(case $a in b) c ;; esac) y; do d; done` loses
the `;` before `do` (a case in the condition without a substitution is fine, as is `$(if ..; fi)`).
shfmt with its defaults thus turns valid scripts into syntax errors. Found by the Simplify
property's shell oracle (`esac {fd}>&-; }` inside a negated block with heredocs, then a condition
`! x=$(...case...esac)a [ aa = aa ]; then`, reduced to 32 bytes); the generator gives case statements
no trailing redirects and retries conditions containing `esac` while the bug is open.
'''

