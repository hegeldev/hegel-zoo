# Bugs found in alessio/shellescape by the Hegel properties. Each is pinned by the test named in
# `test`, listed as an expected failure in target.toml.

[[bug]]
id = "shellescape/1"
title = "StripUnsafe and StripSpaces turn every invalid UTF-8 byte into U+FFFD instead of removing or keeping it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStripFunctionsRemoveInvalidBytes"
found = { commit = "693bd3506cecc3d8e643dc686dcf00adb56b4a76", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
Both functions are `strings.Map` over a keep-or-drop predicate. strings.Map decodes each
invalid byte as utf8.RuneError (U+FFFD) and, when the mapping returns it unchanged, writes the
three-byte encoding of U+FFFD: `StripUnsafe("\xff")` is "�", `StripUnsafe("a\xffb")` is
"a�b", `StripSpaces("\xc3")` is "�". An invalid byte is not a printable rune, so
StripUnsafe ("remove non-printable runes … meant for consumption by terminals") should drop
it, and StripSpaces should leave it alone; instead output bytes appear that were in neither
the input nor the documented behaviour, and the output length grows. Fix: iterate with
`utf8.DecodeRuneInString` and treat `(utf8.RuneError, 1)` explicitly (drop in StripUnsafe,
copy the byte in StripSpaces), or document the replacement.
'''

[[bug]]
id = "shellescape/2"
title = "escargs drops the rest of its input silently, with exit status 0, once a line exceeds bufio.Scanner's 64 KiB limit"
kind = "contract"
severity = "medium"
test = "TestHegelPinEscargsReportsAnInputItTruncates"
found = { commit = "693bd3506cecc3d8e643dc686dcf00adb56b4a76", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
cmd/escargs/escargs.go loops `for scanner.Scan() { … }` and never looks at `scanner.Err()`.
bufio.Scanner stops with ErrTooLong at the first line longer than MaxScanTokenSize (65 536
bytes) — with ScanLines and with ScanTokens (-0) alike — so `printf 'ok\n%70000s\nshort\n' x |
escargs` prints just "ok", exits 0 and writes nothing to stderr; with the long line first the
output is empty. A tool whose purpose is "escape arbitrary strings for safe use as command line
arguments" silently loses arguments, and a caller doing `cmd $(escargs < list)` runs a shorter
command than intended. Fix: after the loop `if err := scanner.Err(); err != nil { log.Fatal(err)
}` and raise the buffer with `scanner.Buffer(nil, 1<<24)` or similar for long arguments.
'''
