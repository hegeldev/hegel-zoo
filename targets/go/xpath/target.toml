[hegel]
version = "v0.6.33"

[run]
# Needs python3 with lxml on PATH (the oracle child process). -vet=off: the pinned
# upstream fails go vet (non-constant format strings) with the current toolchain.
setup = []
command = "go test -count=1 -vet=off -v ."

