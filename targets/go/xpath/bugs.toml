[[bug]]
id = "xpath/21"
title = "substring() rounds its arguments half away from zero instead of toward positive infinity, so substring(s, -0.5, 2) loses a character"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSubstringRounding"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`substring('abc', -0.5, 2)` is '' and `substring('abcde', -1.5, 4)` is 'a'; XPath 1.0 section 4.2
defines the result as the characters at positions p with round(start) <= p < round(start) +
round(length), where round() rounds halves toward positive infinity (round(-0.5) is -0,
round(-1.5) is -1), giving 'a' and 'ab'; lxml agrees. The library's own round() function gets
these right (`round(-0.5)` is -0), but substringFunc (func.go) uses math.Round, which rounds
-0.5 to -1 and -1.5 to -2. Positive halves agree (`substring('abcde', 1.5, 2.5)` is 'bcd' on both
sides). Found by TestHegelEvaluateAgreesWithLxml (`substring("x", 0 - 0.5, 2)`); substring
arguments are integer-valued while the bug is open.
'''

[[bug]]
id = "xpath/22"
title = "A filter expression over a reverse axis keeps the axis order, so (ancestor::*)[1] is the nearest ancestor and name(ancestor-or-self::node()) the context node"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReverseAxisFilter"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
From the inner <b> of <r><e/><e/><A><d><b/></d><b/></A></r>, `(ancestor::*)[1]` is d instead of
r, `(ancestor::*)[last()]` A instead of d, `(ancestor::*)[3]` r instead of d,
`(ancestor-or-self::node())[2]` d instead of r, `(preceding::*)[1]` the second e instead of the
first, `(ancestor::* | .)[1]` d instead of r; and `local-name(ancestor-or-self::node())` from the
document element is its name rather than the document node's "". A step on a reverse axis
yields nodes nearest first (correct for its own predicates, XPath 1.0 section 2.4), but a filter
expression or a function taking the first node works on the node-set in document order
(section 3.3), as lxml does. Found by TestHegelPositionalPredicates
(`(ancestor-or-self::node())[2]`) and TestHegelEvaluateAgreesWithLxml
(`local-name(ancestor-or-self::node()/.)`); filters and first-node functions get only forward
axes while the bug is open.
'''

[[bug]]
id = "xpath/23"
title = "position() and last() evaluated after a path in the same predicate lose their context, so e[count(A) + last() = 3] selects nothing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPositionAfterPath"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Over <r><e>abc</e><e>1</e><A>...</A></r>, `e[count(A) + last() = 3]`, `e[count(d) + last() = 2]`
and `e[count(//d) = 1 and position() = 2]` select nothing (lxml: both e, both e, the second e),
and `e[position() != count(//d) + last()]` selects the second e instead of the first: once a
path has been evaluated inside the predicate, the position and size of the context are gone for
the functions evaluated after it (`e[last() + count(//d) = 3]`, with last() first, is right).
Related to xpath/15, where the context node itself moves after a step predicate; here a plain path
suffices and it is the proximity position that is lost. XPath 1.0 section 1: the context
(node, position, size) is fixed for the whole predicate. Found by TestHegelEvaluateAgreesWithLxml;
position() and last() appear only alone or against a literal in predicates while the bug is open.
'''
