[[bug]]
id = "xpath/6"
title = "Node-sets from parent, ancestor, sibling and self steps after // hold the same node several times"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNoDuplicateNodes"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A step reached from several context nodes is not deduplicated: `//e/..` over <r><e/><e/></r>
selects r twice, `count(//e/..)` is 2, `count(//preceding-sibling::*)` over the pin document is 7
for 3 distinct nodes, and `//.//.`, `//./.`, `e//following-sibling::*` and `//following::text()/.`
repeat nodes likewise (count(//following::text()/.) was 20 for 4 nodes). A node-set is a set
(XPath 1.0 section 1); lxml returns each node once. Found by TestHegelEvaluateAgreesWithLxml;
node-sets are compared as sets and the generator puts only child, self and attribute steps after
a leading // while the bug is open.
'''

[[bug]]
id = "xpath/7"
title = "position() and last() in a predicate on a parenthesised expression count each node among its siblings instead of in the filtered node-set"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFilterPositions"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In `(expr)[pred]` a bare number works, but position() and last() inside pred see the positions of
the inner step: over <r><e>abc</e><x><e/><A/></x><A/></r>, `(//e)[position() = 1]` selects both
e (each is the first e among its siblings), `(//A)[position() = 1]` is empty, `(//*)[position() = 3]`
is the third child of r rather than the third element, and last() in a filter on a relative path
is empty: `(*)[last()]`, `(e)[last()]` and `(e)[position() = last()]` select nothing. XPath 1.0
section 3.3: the predicate of a filter expression is evaluated with the filtered node-set as the
context, so position() runs over it in document order and last() is its size; lxml does this.
Found by TestHegelPositionalPredicates; the property checks only the bare (expr)[n] form while
the bug is open.
'''

[[bug]]
id = "xpath/8"
title = "Positional predicates on the attribute axis see every attribute at position 1"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAttributePositions"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Over <r k="1" n="2">, `@*[1]` selects both attributes, `@*[2]` is empty, `@*[last()]` selects
both and `count(@*[2])` is 0 (lxml: @k, @n, @n and 1). The attribute axis iterator does not
advance the position, so each attribute is at position 1 with last() 1. Found by
TestHegelEvaluateAgreesWithLxml; attribute steps carry no predicates while the bug is open.
'''

[[bug]]
id = "xpath/9"
title = "An attribute step from an attribute node selects the other attributes of the element"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAttributeStepFromAttribute"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Over <r k="1" n="2">, `@k/@n`, `@k/@*` and `@k//@*` select @n. Attributes have no attributes
(XPath 1.0 section 5.3: the attribute axis of a non-element node is empty), so the results must be
empty, as in lxml; the attribute iterator continues from the current attribute of the element
instead of returning nothing. Found by TestHegelEvaluateAgreesWithLxml; an attribute step ends
the generated paths while the bug is open.
'''

[[bug]]
id = "xpath/10"
title = "substring-after with an empty second argument returns the empty string instead of the first argument"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSubstringAfterEmpty"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`substring-after('abc', '')` is '' (func.go substringAfterFunc treats an index of 0 as not found
or slices from the wrong end). XPath 1.0 section 4.2: the result is the substring following the
first occurrence of the second argument, and the empty string occurs at position 0, so the
result is 'abc'; lxml agrees. substring-before('abc', '') is '' correctly. Found by
TestHegelEvaluateAgreesWithLxml.
'''

[[bug]]
id = "xpath/11"
title = "A filter expression with two predicates followed by an operator or a closing parenthesis is an invalid token or ends the parse"
kind = "contract"
severity = "medium"
test = "TestHegelPinFilterTwoPredicates"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`count((//e)[1][1])` fails to compile with "has an invalid token" and `(//e)[1][1] = 'abc'` and
`(//e)[1][1] | //b` return the node-set (//e)[1][1], the rest being dropped (see xpath/2). Two
predicates on a filter expression are allowed by the grammar (FilterExpr Predicate, XPath 1.0
section 3.3); lxml compiles all three. `(//e)[1][1]` alone works, so the parser leaves the
position after the second predicate wrong. Found by TestHegelEvaluateAgreesWithLxml; filters get a
single predicate while the bug is open.
'''

[[bug]]
id = "xpath/12"
title = "last() is empty and position() counts document order in predicates on axes other than child"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReverseAxisPositions"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
From the inner <b> of <r><e/><e/><A><d><b/></d><b/></A></r>, `ancestor::*[last()]` is empty
(XPath: r), `ancestor::*[position() = 2]` is empty (A) and `ancestor-or-self::node()[last()]` is
[b, d] (the root); from <A>, `preceding-sibling::*[position() = 1]` and `[position() < 2]` select
the farther e (the reverse axis counts from the context node, so the nearer one) and
`preceding-sibling::*[last()]` is empty; `//e/following-sibling::*[last()]` is empty too. Bare
`[n]` works on every axis and `descendant::*[last()]` is fine, so only position() and last() as
function calls on non-child axes are affected: last() has no value there and position() is the
document-order index. lxml returns the specification's nodes. Found by
TestHegelEvaluateAgreesWithLxml; position() and last() appear only in child-axis predicates while
the bug is open.
'''

[[bug]]
id = "xpath/13"
title = "A union keeps operand order instead of document order, so (b | a)[1] is not the first node"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnionDocumentOrder"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Over <r k="1"><e/><e/><A/></r>, `(//A | //e)[1]` is A, `(@* | .)[1]` is the attribute and
`(//b | //e)[last()]` is the last e: the union iterates its left operand then its right. The
functions that take the first node of a node-set see the same order: `name(//A | //e)` is "A"
and `name(/r | /.)` is "r" (the document node comes first, so lxml gives "" - the shape CI run
35441828643 found). XPath 1.0 section 3.3: predicates on a filter expression use proximity
positions in document order, and section 4.1: name() and string() take the first node in document
order; lxml returns e, r, the last b, "e" and "". The library's own tests only check unions as
sets. Found by TestHegelPositionalPredicates and TestHegelEvaluateAgreesWithLxml; the properties
use paths instead of unions where order matters while the bug is open.
'''

[[bug]]
id = "xpath/14"
title = "number() accepts Go float syntax: Infinity, inf, a leading plus sign, underscores and hexadecimal floats"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNumberSyntax"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
asNumber (func.go) converts strings with strconv.ParseFloat, so `number('Infinity')` and
`number('inf')` are +Inf, `number('-Infinity')` is -Inf, `number('+5')` is 5, `number('1_000')` is
1000, `number('0x1p-2')` is 0.25 and `'inf' = 1 div 0` is true. XPath 1.0 section 4.4 converts
only strings matching Number (digits, an optional point and fraction, an optional leading minus
after whitespace) and everything else to NaN; lxml returns nan for all of them. The same
conversion applies to text and attribute values compared with numbers. Found by
TestHegelEvaluateAgreesWithLxml; such strings are kept out of the generated documents while the
bug is open.
'''

[[bug]]
id = "xpath/15"
title = "A step predicate evaluated inside a function argument or comparison operand moves the context node for the operands evaluated after it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinContextNodeKept"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Over <r k="1" n="2"><e>abc</e><e>1</e><A>...</A>xyz</r> with r as the context node,
`concat(count(e[1]), string())` is "11" instead of "1abc1xyz", `concat(count(e[1]), name())` is
"1e" instead of "1r", `concat(count(e[2]), count(e))` is "10" instead of "12",
`count(e[1]) = count(e)` is true and `concat(count(*[@k]), string())` is "0" instead of
"0abc1xyz": after a step with any predicate has been evaluated in one argument, the shared
navigator is left on the last node the predicate looked at (or past the end), and the following
arguments and operands - string(), name(), normalize-space(), relative paths - are evaluated from
there. Steps without predicates leave the context alone (`concat(count(e), string())` is right),
as do arithmetic operands. XPath 1.0 section 1: every operand is evaluated with respect to the
same context node; lxml agrees. Found by TestHegelEvaluateAgreesWithLxml; the generator puts step
predicates only on a top-level path while the bug is open.
'''

[[bug]]
id = "xpath/16"
title = "A descendant path with a predicate or a further step yields nodes out of document order, grouped by parent, so (//x[p])[n] and (//x/y)[n] pick the wrong node"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDescendantOrder"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Over <r><e>abc</e><e>1</e><A><d><b/></d><b/></A>xyz</r>, `//b[1]` iterates the second b (A's
child) before the first (d's child), `(//b[1])[1]` is A's b and `(//b[1])[2]` is d's;
`//*[1 = 1]/text()` comes out as [xyz abc 1]; `//*/node()` as [e e A xyz abc 1 d b b] and
`descendant::*/node()` as [abc 1 d b b] with A's second b before d's: a descendant step
followed by a predicate or by another step yields each context node's results in turn without
the document-order merge, so anything positional over the result - `(expr)[n]`, `[last()]`, or a
second predicate `//node()[p][2]`, which is [e] instead of the second matching child of each
parent - is wrong. `//b`, `//node()` and `//*` alone and `/descendant::b[1 = 1]` are in document
order. XPath 1.0 section 3.3: a location path's node-set is in document order, and lxml returns it
so. Found by TestHegelPositionalPredicates (`(//b[1]/.)[2]`, `(//*/node()/.)[3]`,
`(descendant::*/text())[1]`) and TestHegelEvaluateAgreesWithLxml (`//node()[p][2]`); the filtered
expressions of the positional property are single steps after // and after the multi-level
axes, and the step after // takes one predicate, while the bug is open.
'''

