# Bugs found in antchfx/xpath (v1.3.8+) by the Hegel zoo. One [[bug]] per finding; `test` names
# the plain Go test in hegel_pins_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracle: lxml 6.1 (libxml2 2.14) as a child process, over
# generated XML documents, for the XPath 1.0 subset both implement; the library's own API
# (Select, MustCompile, the deprecated Select, count()) against itself for the rest. No AI policy
# in README.md (no CONTRIBUTING file; checked 2026-09-19).

[[bug]]
id = "xpath/1"
title = "Comparing a boolean with a number, string or node-set panics with a nil pointer dereference, and boolean = boolean is always false"
kind = "panic"
severity = "medium"
test = "TestHegelPinBooleanComparisons"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
cmpBooleanBooleanF (operator.go) is nil in the logicalFuncs table and there is no entry for a
boolean against another type, so `true() = 1`, `1 = true()`, `true() = 'a'` and `//e = true()`
all panic with "invalid memory address or nil pointer dereference" from eqFunc; `true() = true()`
and `false() <= true()` evaluate to false (XPath 1.0 section 3.4: with a boolean operand the other
is converted with boolean() and the booleans are compared; libxml2 returns true for both). Found by
TestHegelEvaluateAgreesWithLxml; the generator replaces boolean comparison operands by not(...)
while the bug is open.
'''

[[bug]]
id = "xpath/2"
title = "Compile accepts an expression followed by unparsed tokens and evaluates the prefix"
kind = "contract"
severity = "medium"
test = "TestHegelPinTrailingTokensRejected"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The parser (parse.go) stops after the first complete expression without checking that the input
is exhausted, so `3 foo` is 3, `3 3` is 3, `1 = 1 1` is true, `(1)(2)` is 1 and `//e zz` is the
node-set //e. It also affects mistyped operators: the lexer reads `div-1` and `mod2` as names, so
`3 div-1` and `3mod2` are 3 (libxml2: -3 and 1). lxml raises "Invalid expression" for all of them.
Found by TestHegelEvaluateAgreesWithLxml (`3div-1` style spellings); the generator now writes
word operators with spaces on both sides.
'''

[[bug]]
id = "xpath/3"
title = "sum() counts a node whose string-value is not a number as 0 instead of returning NaN"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSumOfNonNumbersIsNaN"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
sumFunc (func.go) skips values strconv.ParseFloat rejects, so `sum(//e)` over <e>abc</e><e>1</e>
is 1 and `sum(/*)` over a document whose text is "abc1xyz" is 0. XPath 1.0 section 4.4: sum
converts each node's string-value with number(), so any non-numeric value makes the sum NaN; lxml
returns nan. Found by TestHegelEvaluateAgreesWithLxml; sum() is replaced by count() while the bug
is open.
'''

[[bug]]
id = "xpath/4"
title = "substring with a NaN start position panics with a slice bounds error"
kind = "panic"
severity = "medium"
test = "TestHegelPinSubstringNaNStart"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
substringFunc (func.go) rounds the start with int(round(x)); for NaN that is math.MaxInt64 and
the slice `s[start:]` panics: `substring('abc', 0 div 0)` fails with "slice bounds out of range
[9223372036854775807:3]". XPath 1.0 section 4.2 defines the result for NaN as the empty string
(no position satisfies the comparison); lxml returns ''. Found by TestHegelEvaluateAgreesWithLxml;
the generator keeps NaN out of substring arguments while the bug is open.
'''

[[bug]]
id = "xpath/5"
title = "string-length() without an argument is rejected although the argument is optional"
kind = "contract"
severity = "low"
test = "TestHegelPinStringLengthWithoutArgument"
found = { commit = "551dd37711fedf90c20e95a886aa0f227f07d7ba", version = "v1.3.8+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Compile("string-length()") fails with "string-length function must have at least one parameter"
(build.go). XPath 1.0 section 4.2: string-length(string?) defaults to the string-value of the
context node, like string(), normalize-space() and name(), which the library does accept without
an argument. `//e[string-length() = 1]` is the idiomatic use. Found by
