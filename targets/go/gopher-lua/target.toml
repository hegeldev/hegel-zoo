[hegel]
version = "v0.6.33"

[run]
# Needs lua5.1 (the reference Lua 5.1 interpreter, the oracle child process) on PATH. -vet=off
# because Go 1.27's vet rejects upstream's non-constant format strings in RaiseError calls.
setup = []
command = "go test -vet=off -count=1 -v ."

