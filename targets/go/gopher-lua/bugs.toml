kind = "hang"
severity = "high"
test = "TestHegelPinDeadIfInRepeat"
found = { commit = "75f497656b1c6864139dd2a7d88cf96d09550814", version = "v1.1.2+1", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`local r = 0 repeat if false then local x else local a, b = 1 end r = r + 1 local done = r >= 3 until done return r` returns 1 in GopherLua and 3 in the reference: the loop stops after its first iteration, and `until r >= 3` in place of the local flag stops it too. The program TestHegelRunAgreesWithLua found it in (a three-way if with two constant-false branches, an else with `local v9, v10 = v3`, then `r7 = r7 + 1` and `local done11 = r7 >= 3 until done11`) never finishes at all. Without the `local x` in the dead branch, or with a live condition (`if r > 100 then`), or in a while or numeric for loop, the count is right. The same family as gopher-lua/36 and 37 (a dead if inside a generic for): the code generator's handling of a constant-false if with locals in its branches leaves the registers of what follows wrong. Found by TestHegelRunAgreesWithLua.
'''

