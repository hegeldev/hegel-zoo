[[bug]]
id = "gopher-lua/8"
title = "string.format is Go's Sprintf: %!s(MISSING) for a missing argument, %!u(int64=4) for %u, %x of -1 is -1, a non-numeric string for %d is 0"
kind = "contract"
severity = "medium"
test = "TestHegelPinFormatIsSprintf"
found = { commit = "75f497656b1c6864139dd2a7d88cf96d09550814", version = "v1.1.2+1", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GopherLua hands the format to fmt.Sprintf after converting the arguments, so its failure modes are Go's: `string.format("%s")` is "%!s(MISSING)" (the reference: bad argument #2, no value), `string.format("%u", 4)` is "%!u(int64=4)" (reference "4"), `string.format("%x", -1)` is "-1" (reference "ffffffffffffffff"), `string.format("%d", "x")` is "0" (reference: number expected), `%d` of a boolean is "%!d(lua.LBool=false)", `%s` of nil is "&{}", `%d` of a table prints the Go struct, an over-long width (`%100d`) is accepted, and so is a format ending in a lone `%` (`("12ab%"):format()` is "12ab%!(NOVERB)"; the reference: bad argument #1, no value). Found by TestHegelRunAgreesWithLua.
'''

