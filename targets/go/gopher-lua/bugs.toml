[[bug]]
id = "gopher-lua/68"
title = "an error caught by pcall closes the open upvalues of the frames below it: closures made before the pcall stop sharing their variables with the enclosing function"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinCaughtErrorDetachesUpvalues"
found = { commit = "75f497656b1c6864139dd2a7d88cf96d09550814", version = "v1.1.2+1", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`local sh = 0 local f = function() sh = sh + 1 return sh end pcall(error, "x") return f(), sh` returns 1, 0 in GopherLua and 1, 1 in the reference: after the caught error, f's increments no longer reach the enclosing function's `sh`, and the enclosing function's later `sh = 10` is not seen by f (`f()` then gives 2 in GopherLua, 11 in the reference). The same with `pcall(function() error("x") end)` and with a runtime error (`pcall(function() local t = nil return t.x end)`); a pcall that succeeds leaves the sharing intact, and so does an error raised without a closure alive. When an error unwinds to the pcall, GopherLua closes every open upvalue on the stack instead of only those at or above the pcall's stack level, so the closures created earlier get a private copy of each variable while the enclosing function keeps using its register. In a loop this made `for i = 1, 3 do pcall(error, "x") fs[i] = function() sh = sh + 1 return sh end end` produce three closures each with its own `sh` (1, 1, 1 against 1, 2, 3). Found by TestHegelRunAgreesWithLua.
'''

