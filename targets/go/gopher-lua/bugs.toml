[[bug]]
id = "gopher-lua/22"
title = "an error after many tail calls builds a stack trace with one line per tail call: out of memory"
kind = "crash"
severity = "high"
test = "TestHegelPinTailCallTraceMemory"
found = { commit = "75f497656b1c6864139dd2a7d88cf96d09550814", version = "v1.1.2+1", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
LState.stackTrace appends a "(tailcall): ?" line for every tail call counted in the frame (cf.TailCall) before trimming the trace to twenty lines, so an error raised after N tail calls allocates about 90 bytes per call: `local function f(n) if n == 0 then error("x") end return f(n - 1) end pcall(f, 1e6)` allocates 92 MB, and an infinite `return f()` interrupted by a context deadline after ten seconds kills the process with Go's fatal "out of memory" (not recoverable by the embedding program). The reference runs tail calls in constant space. The pin measures the allocation of the error path after a million tail calls. Found by TestHegelRunAgreesWithLua (the process died).
'''

[[bug]]
id = "gopher-lua/23"
title = "a, b = b, a assigns b to both: a plain local on the right of a multiple assignment is moved into its target before the other values are read"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinMultipleAssignmentSwap"
found = { commit = "75f497656b1c6864139dd2a7d88cf96d09550814", version = "v1.1.2+1", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`local a, b = 1, 2 a, b = b, a return a, b` gives 2, 2 in GopherLua (the reference: 2, 1); `b, a = a, b` gives 1, 1; `local a, b, c = 1, 2, 3 a, b, c = c, a, b` gives 3, 3, 3; `t[1], n = n, t[1]` is wrong the same way. compileAssignStmt compiles a right-hand side that is a local variable straight into the target's register (no temporary, needmove false), so the later right-hand sides read the overwritten value. Right-hand sides that are expressions (`a + 0`) or calls go through temporaries and are fine. Reproduced with the upstream `glua` command. Found by TestHegelRunAgreesWithLua.
'''

