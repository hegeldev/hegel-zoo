`table.concat({"a"}, "-", 2, 1)`, `table.concat({"a", "b"}, "-", 3, 2)` and `table.concat({"a", "b"}, "-", 5, 3)` return "a", "b" and "b" in GopherLua; the reference returns the empty string for all three, since i > j selects nothing. tableConcat in tablelib.go does `i = intMax(intMin(i, tbl.Len()), 1)` and `j = intMin(j, tbl.Len())` before comparing them, so a start index beyond the border becomes the border itself and an empty range that happens to lie past the end turns into the last element. (The clamping of j is what lets gopher-lua/14 succeed where the reference fails on a nil element.) Found by TestHegelRunAgreesWithLua, as `table.concat({12345}, "", 2, 1)`.
'''

[[bug]]
id = "gopher-lua/58"
