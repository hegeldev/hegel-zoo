# Bugs found in yuin/gopher-lua (v1.1.2, one commit past) by the Hegel zoo. One [[bug]] per
# finding; `test` names the plain Go test in hegel_pins_test.go that fails while the bug exists
# (listed under [expected_failures] in target.toml). Oracle: the reference Lua 5.1 interpreter
# (lua5.1 5.1.5) as a child process running the same programs: the same values returned, or
# failure on both sides at the same stage (compile or run). GopherLua's readme calls it a Lua 5.1
# VM and compiler (plus goto), so every divergence from the reference in the language and in the
# standard libraries it implements is recorded; error messages are not compared. The reference's
# own C quirks are not judged: strtod accepting hex floats and inf/nan in strings and stopping at
# an embedded NUL, tonumber with base 16 taking a 0x prefix, an unfinished capture going
# unnoticed when no capture is pushed, `%5%` in a format, `%s` of a string with an embedded NUL
# and `%c` of 0, `%` of an infinite, non-integral or huge operand (the 5.1 formula is not fmod),
# a -0 constant shared with later 0 constants, the platform spelling of nan, the order of `next`,
# and the last ulp of `^` (Go's math.Pow against glibc's pow). No AI policy (checked 2026-09-19).

[[bug]]
id = "gopher-lua/1"
title = "tonumber(10, 16) converts the number directly instead of through its string form: 10, not 16"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTonumberNumberWithBase"
found = { commit = "75f497656b1c6864139dd2a7d88cf96d09550814", version = "v1.1.2+1", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`tonumber(10, 16)` is 10 and `tonumber(11, 2)` is 11 in GopherLua; the reference converts the argument to its string form first ("10" in base 16 is 16, "11" in base 2 is 3). Found by TestHegelRunAgreesWithLua.
'''

