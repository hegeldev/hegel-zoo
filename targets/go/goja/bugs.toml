regexp test has the \p{L} case commented out. Pin: TestHegelPinUnicodeProperty.
'''

[[bug]]
id = "goja/16"
title = "match and replace with a global regexp drop an empty match that follows a non-empty match"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGlobalEmptyMatch"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`'ab'.match(/a|/g)` is ["a", "", ""] (a at 0, the empty match at 1, the empty match at 2); goja
gives ["a", ""]. Likewise `'xa'.match(/a|/g)` ["", "a"] instead of ["", "a", ""], `'aXa'.match(/a?/g)`
["a", "a"] instead of ["a", "", "a", ""], `'ab'.replace(/a|/g, '-')` "-b-" instead of "--b-",
`'ab'.replaceAll(/a*/g, '-')` likewise. An empty match at the position where the previous
non-empty match ended is skipped (the Go regexp FindAll convention). exec in a loop, matchAll
and split are right. Pin: TestHegelPinGlobalEmptyMatch.
'''

[[bug]]
id = "goja/17"
title = "the own keys of a match result come as input, index, groups instead of index, input, groups"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinExecKeyOrder"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
