[[bug]]
id = "goja/9"
title = "with the u flag, invalid regexp patterns are accepted: identity escapes, incomplete escapes, a backreference to a missing group, a lone ] or a{, a class range with a class escape, a quantified lookahead, an unknown property name"
kind = "contract"
severity = "medium"
test = "TestHegelPinUnicodeRegExpSyntax"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With the u flag the grammar has no Annex B leniency, and node rejects every one of these with a
SyntaxError while goja constructs the RegExp: `\-`, `\a`, `\_` (IdentityEscape is only a
SyntaxCharacter or /), `\x4`, `\u004`, `\00` (incomplete or octal escapes), `\1` and `(a)\2`
(a backreference to a group that does not exist), `]` and `a{` (lone syntax characters), `[\d-z]`
(a class escape as a range bound), `(?=a)+` (a quantified lookahead) and `\p{Bogus}` (an unknown
property name). `/\p{Lu}\-/u` compiles as a literal too. Pin: TestHegelPinUnicodeRegExpSyntax.
'''

