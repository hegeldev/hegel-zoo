[[bug]]
id = "goja/18"
title = "a regexp literal whose character class is not closed (/[/) is accepted and swallows the rest of the source"
kind = "contract"
severity = "medium"
test = "TestHegelPinUnterminatedClass"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`var r = /[/; return typeof r;` is a SyntaxError (inside a class a / does not end the literal,
so the literal is unterminated; 12.9.5). goja compiles it, returns undefined (the declaration and
the return statement are gone) and `return /[/; return 1;` returns an empty regexp: the lexer
