[[bug]]
id = "goja/24"
title = "ToNumber of a string with non-ASCII white space (U+00A0, U+FEFF, U+2003, U+2028, U+3000) is NaN in ==, the Math functions, isNaN and isFinite, while Number() and unary + trim it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNonASCIIWhiteSpaceToNumber"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
StringToNumber strips StrWhiteSpaceChar, which is any WhiteSpace (U+0009-U+000D, U+0020,
U+00A0, U+FEFF and the Zs category) or LineTerminator. `Number('\u00A0')` and `+'\u00A0'`
are 0 in goja as in node, but the conversion used elsewhere is a different one that knows only
ASCII space: `'\u00A0' == 0` is false (node: true), likewise `'\uFEFF' == 0`, `'\u2003' == 0`,
`'\u3000' == 0` and `'\u00A01' == 1`; `Math.trunc('\u00A0')`, `Math.floor`, `Math.round`,
`Math.max`, `Math.pow('\u00A0', 1)` and `Math.trunc(['\u00A0'])` (ToPrimitive of the array)
are NaN instead of 0, `isNaN('\u00A0')` is true and `isFinite('\u00A0')` false; `\u2028` and
`\u1680` likewise. `1 - '\u00A0'` is right. Pin: TestHegelPinNonASCIIWhiteSpaceToNumber.
'''

[[bug]]
id = "goja/25"
title = "a use strict directive in a function with a rest parameter is accepted"
