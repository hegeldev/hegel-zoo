# Bugs found in dop251/goja at 793a2a6 by running generated programs in goja and in node
# and comparing results. Not counted: features goja does not implement (the regexp d and v
# flags, Symbol.asyncIterator and async iteration, WeakRef, Iterator helpers, Map/Object.groupBy,
# Array.fromAsync, String.prototype.isWellFormed/toWellFormed, Promise.withResolvers, symbols as
# WeakMap keys, the JSON.parse reviver context, Intl, Annex B leftovers such as getYear, the
# String HTML methods, __defineGetter__, legacy octal-looking numerals, the for-in initializer
# and block-level function hoisting), the reference's own behaviour outside the specification
# (Date strings not in the specification's format, implementation-approximated Math functions
# and ** with fractional operands, toString with a radix of a non-integer or a number beyond
# 2^53, the way / is escaped in RegExp.prototype.source, error messages), and the documented
# UTF-8 caveat of JSON.parse.

[[bug]]
id = "goja/1"
title = "arguments inside an arrow function inside a function is undefined, or a Go panic (index out of range)"
kind = "crash"
severity = "high"
test = "TestHegelPinArrowArguments"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
An arrow function has no arguments object of its own: `arguments` inside it is the enclosing
function's. In goja `(function () { return (() => arguments)(1, 2).length; })(3, 4, 5)` returns
undefined (node: 3), and `(function () { return (() => arguments.length)(); })(3, 4, 5)` panics
the Go process with "runtime error: index out of range [7] with length 7" in the VM. Pins:
TestHegelPinArrowArguments and TestHegelPinArrowArgumentsPanics.
'''

