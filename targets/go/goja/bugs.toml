`new RegExp('(?<a>x)(?<a>y)')` is a SyntaxError (duplicate capture group name; ES2025 allows a
repeated name only across alternatives), with or without the u flag; goja constructs it. Pin:
TestHegelPinDuplicateGroupNames.
'''

[[bug]]
id = "goja/11"
title = "a quantified lookbehind ((?<=a)+) is accepted"
kind = "contract"
severity = "low"
test = "TestHegelPinQuantifiedLookbehind"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
