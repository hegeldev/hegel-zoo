[[bug]]
id = "goja/26"
title = "delete of an expression that is not a reference does not evaluate the expression: delete (v++) leaves v unchanged"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDeleteNoEval"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`delete UnaryExpression` evaluates the operand and returns true when it is not a reference
(13.5.1.2 step 2). In goja `var v = 1; delete (v++); return v;` gives 1 (node: 2): the operand is
never evaluated. Likewise `delete v++`, `delete ++v`, `delete (v = 2)`, `delete (v += 1)`,
`delete (0, v++)`, `delete (v++, v++)`, `delete [v++]`, `delete (1 + v++)`, `delete -v++`,
`delete typeof v++`, `delete void v++`, `delete (v++ ? 1 : 2)`, `delete (v++ || 1)`,
`delete (o.a++)`, `delete (o.a = 2)`, and a template literal with a side effect. A call
(`delete f()`) is evaluated. The generated programs carried `const v2 = delete (v1++);` and
returned v1 later. Pin: TestHegelPinDeleteNoEval.
'''

[[bug]]
id = "goja/27"
title = "the own keys of a function come as prototype, length, name instead of length, name, prototype"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFunctionKeyOrder"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
OrdinaryFunctionCreate defines length, then SetFunctionName defines name, then MakeConstructor
adds prototype, so `Object.getOwnPropertyNames(function (a) {})` is ["length", "name",
"prototype"] (in strict code, where V8 adds no arguments/caller); goja gives ["prototype",
"length", "name"], likewise Reflect.ownKeys of a generator function and of a class. Pin:
TestHegelPinFunctionKeyOrder.
'''
