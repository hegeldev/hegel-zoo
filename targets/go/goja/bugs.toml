[[bug]]
id = "goja/14"
title = "a product of integer-valued numbers that should be -0 is +0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMulNegZero"
found = { commit = "793a2a65c13bd52293450a1aad422fe154819524", version = "master (untagged), 2026-09-17", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`1 / (-5 * 0)` is -Infinity; goja gives Infinity: `-5 * z` with z = 0, `z * -5`, `m * z` with
m = -5, `-2 * 0`, `0 * -1e10`, `v *= -5`, and so `Object.is(-5 * z, -0)` is false and
`Math.atan2(-5 * z, -1)` is +pi instead of -pi. The integer fast path of multiplication returns
the integer 0 and loses the sign. `-1 * 0` (which takes the overflow-checked path) and
`-5.5 * 0` are right. Pin: TestHegelPinMulNegZero.
'''

[[bug]]
id = "goja/15"
title = "a Unicode property escape (\\p{L}, \\p{Lu}, \\P{L}, \\p{Script=Greek}) with the u flag never matches"
kind = "wrong-result"
