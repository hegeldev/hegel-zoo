name = "gotext"
language = "go"
upstream = "https://github.com/leonelquinteros/gotext"
subdir = ""
license = "MIT"  # plurals/ is BSD-3 (from golang.org/x/text); AGENTS.md: "All contributors — human or AI agent — must adhere to these guidelines"; the zoo only records bugs, nothing is sent upstream
ai_policy_checked = "2026-09-17"

[base]
commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4"
date = "2026-09-02"
version = "v1.7.2+ (master 2026-09-02; v1.7.2 is the last tag, 48 commits behind)"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ."  # module root, package gotext_test; msgfmt, msgunfmt (GNU gettext) and python3 are the oracles, skipped when absent

[expected_failures]
TestHegelPinFuzzyTranslationsAreNotUsed = "gotext/1"
TestHegelPinUntranslatedPluralFallsBackByOne = "gotext/2"
TestHegelPinSingularEntriesAnswerPluralLookups = "gotext/3"
TestHegelPinIsTranslatedIgnoresThePluralRule = "gotext/4"
TestHegelPinBareTestsAreNonZeroTests = "gotext/5"
TestHegelPinMarshalTextKeepsNonASCII = "gotext/6"
TestHegelPinMarshalTextEscapesBackslashBeforeQuote = "gotext/7"
TestHegelPinReferencesStayWithTheirEntry = "gotext/8"
# The three wide properties fail by the shape they shrink to over forty rounds at a hundred
# cases: the expressions by gotext/5 (forty of forty), the catalogs by gotext/2 (thirty-five;
# gotext/3 four, gotext/1 one), the MarshalText round trip by gotext/6 (thirty-eight; gotext/7
# and gotext/8 once each). The eight narrow properties fail every run by their bug (40/40);
# under HEGEL_NO_KNOWN=1 the pins only (8).
TestHegelExpressionsEvaluateAsC = "gotext/5"
TestHegelCatalogsAgreeWithGettext = "gotext/2"
TestHegelMarshalTextRoundTrips = "gotext/6"
TestHegelFuzzyEntriesAreLeftOut = "gotext/1"
TestHegelUntranslatedPluralsFallBackByOne = "gotext/2"
TestHegelSingularEntriesAnswerPluralLookups = "gotext/3"
TestHegelIsTranslatedIgnoresThePluralRule = "gotext/4"
TestHegelBareTestsAreNonZeroTests = "gotext/5"
TestHegelMarshalTextKeepsNonASCII = "gotext/6"
TestHegelMarshalTextRoundTripsBackslashBeforeQuote = "gotext/7"
TestHegelReferencesStayWithTheirEntry = "gotext/8"
