[[bug]]
id = "gotext/1"
title = "the PO parser uses fuzzy translations"
kind = "contract"
severity = "medium"
test = "TestHegelPinFuzzyTranslationsAreNotUsed"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A PO entry marked `#, fuzzy` is a translator's guess: msgfmt leaves it out of the MO (unless
`--use-fuzzy`), so GNU gettext and Python's gettext return the msgid. gotext's PO parser
(po.go) reads `#,` lines as comments and keeps the translation: for `#, fuzzy\nmsgid "fz"\nmsgstr
"FZ"`, `Po.Get("fz")` is `"FZ"` and `IsTranslated("fz")` is true; `GetN` of a fuzzy plural entry
returns its forms. `Mo.Parse` of the same catalog compiled by msgfmt gives `"fz"`, so a program
switching from .po to .mo files changes its translations. Found by the msgfmt/Python property
(Po disagreeing with both the oracle and Mo); the generator marks no entry fuzzy while the bug
is open.
'''

[[bug]]
id = "gotext/2"
title = "GetN falls back to the untranslated form by the catalog's plural rule, not by n == 1"
kind = "contract"
severity = "low"
test = "TestHegelPinUntranslatedPluralFallsBackByOne"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GNU `ngettext` answers a missing entry with `n == 1 ? msgid : msgid_plural` (the Germanic rule,
since the untranslated strings are English), and so do gotext's own `GetNC`, `Locale.GetND` and
the package-level `GetND`. `Domain.GetN` (domain.go) instead evaluates the catalog's
Plural-Forms on n and returns the msgid when the form index is 0 and the plural msgid otherwise.
Under French `plural=n>1`, `GetN("missing", "missings", 0)` is `"missing"` where `GetNC(...,
"c")` and GNU give `"missings"`; under the Arabic rule (plural(1) = 1) `GetN("missing",
"missings", 1)` is `"missings"`. The same for an entry whose forms are all empty (untranslated to
msgfmt) and for `AppendN`. Found by the msgfmt/Python property; while the bug is open the
property accepts either msgid when both the oracle and gotext answered an untranslated form.
Checked again at the rewrite (2026-10-13): `Locale.GetN`, `Locale.GetND` and `AppendN` delegate
to `Domain.GetN` and follow the catalog's rule too (French `Locale.GetN("missing", "missings",
0)` and `Locale.GetND("default", ...)` are `"missing"`, as is `AppendN`), so the claim above
that `Locale.GetND` answers by n == 1 was wrong; of the lookups tried only `GetNC` answers a
missing id by n == 1 (`"missings"` at French n = 0), and `GetNC` of a PRESENT untranslated
context entry (`msgctxt "ctx"` / `msgid "citem"` with empty forms) follows the rule as well
(`"citem"` at n = 0). A catalog without a Plural-Forms header is Germanic, so nothing shows there.
'''

[[bug]]
id = "gotext/3"
title = "GetN/GetNC of a singular entry return \"\" when the plural index is not 0"
kind = "contract"
severity = "medium"
test = "TestHegelPinSingularEntriesAnswerPluralLookups"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Translation.GetN(idx)` (translation.go) returns `Trs[idx]` when it is non-empty, else the ID
for idx 0 and the PluralID otherwise. A singular entry (`msgid "plain"` / `msgstr "PLAIN"`) has
no `Trs[1]` and an empty PluralID, so `Po.GetN("plain", "plains", 2)` is `""`, as are `GetNC`
on a context entry and `AppendN`; a singular entry with an empty msgstr (`blank`) gives `""` for
`GetN("blank", "blanks", 5)` too. Programs then print nothing where the source had text. C
libintl returns the entry's only translation (`"PLAIN"`) for every n; Python's gettext falls
back to the untranslated plural (`"plains"`); the pin accepts either but not the empty string.
Found by the msgfmt/Python property; while the bug is open it skips plural lookups of singular
entries that answered "".
'''

[[bug]]
id = "gotext/4"
title = "IsTranslated of a singular entry consults the plural form of 1 (false under the Arabic rule)"
kind = "contract"
severity = "low"
test = "TestHegelPinIsTranslatedIgnoresThePluralRule"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Domain.IsTranslated(str)` is `IsTranslatedN(str, 1)`, which asks for `Trs[pluralForm(1)]`.
Under a Plural-Forms whose index for 1 is not 0 — Arabic `n==0 ? 0 : n==1 ? 1 : ...` — a
translated singular entry has no `Trs[1]`, so `IsTranslated("plain")`, `IsTranslatedC("ctx",
"c")` and `Locale.IsTranslated` are false although `Get("plain")` returns `"PLAIN"`. The answer
to "is this string translated" should not depend on the language's plural rule. Found by the
msgfmt/Python property (IsTranslated against the entry's msgstr[0]); while the bug is open the
property skips singular entries of catalogs where plural(1) != 0.
'''

[[bug]]
id = "gotext/5"
title = "plurals: a bare `n` or `n % k` means n == 1 / n % k == 0 instead of a non-zero test"
kind = "contract"
severity = "low"
test = "TestHegelPinBareTestsAreNonZeroTests"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Plural-Forms expressions are C: a bare `n` in a test position is true when n != 0, `n % 10` when
the remainder is not 0, and the value of the expression `n` is n. The compiler (plurals/
compiler.go) gives them an "implicit equality": `Compile("n ? 1 : 0").Eval(2)` is 0 (C: 1),
`Compile("(n % 10) ? 1 : 0").Eval(3)` is 0 and `.Eval(10)` is 1 (C: 1 and 0), `Compile("n").Eval(2)`
is 0 (C: 2) and `Compile("n && n != 1 ? 1 : 0").Eval(5)` is 0 (C: 1). Upstream's own
`TestCompileEvalGNUExpressions` codifies the behaviour ("implicit equality", "modulo default"), so
it may be a design choice; the GNU catalogue of Plural-Forms never uses a bare test (they are
written `n != 1`), so real catalogs are not affected. Found by the Python `gettext.c2py`
property; while the bug is open the generator writes no bare tests.
'''

[[bug]]
id = "gotext/6"
title = "MarshalText keeps only the first byte of every multi-byte character"
kind = "correctness"
severity = "high"
test = "TestHegelPinMarshalTextKeepsNonASCII"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`EscapeSpecialCharacters` (domain.go) iterates `for i := range s` — the byte offsets of the rune
starts — and writes `s[i]`, the first byte of each rune, so every continuation byte is dropped.
`Po.MarshalText()` of `msgid "naïve"` / `msgstr "ñ 日本 🎉"` writes `msgid "na\xc3ve"` and
`msgstr "\xc3 \xe6\xe6 \xf0"`: invalid UTF-8, unreadable by msgfmt and by gotext itself (the
reparsed catalog no longer has the entry). Every non-ASCII msgid, msgctxt, translation and
header value is corrupted, which is to say most real catalogs. Found by the MarshalText
round-trip property on its first non-ASCII catalog; while the bug is open the property maps
non-ASCII runes to ASCII before marshalling.
Checked at the rewrite (2026-10-13): the reparsed catalog does keep the entries - every byte of
the corrupted text reads back as U+FFFD (`msgid "naïve"` as `na�ve`, `msgstr "ñ 日本"` as
`� ��`), entries whose msgids corrupt to the same bytes collide (`é` and `ß` both
become `\xc3`, so one entry survives with the other's translation), msgfmt rejects the output
("invalid multibyte sequence", "duplicate message definition") and a second `MarshalText` differs
from the first. The sentence above about the entry being gone was wrong.
'''

[[bug]]
id = "gotext/7"
title = "MarshalText writes a backslash before a quote unescaped, so `\\\"` reads back as `\"`"
kind = "correctness"
severity = "medium"
test = "TestHegelPinMarshalTextEscapesBackslashBeforeQuote"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`EscapeSpecialCharacters` (domain.go) tries to "preserve already-escaped quote sequences": a
backslash followed by a quote is written as `\"` and the quote after a backslash is not escaped.
But its input is the decoded text of the translation, where a backslash-quote pair is two
characters, so the text `a\"b` (backslash, quote) is written as `msgstr "a\"b"` and parsed back
as `a"b`. The catalog `msgid "k"` / `msgstr "a\\\"b"` round-trips through `MarshalText` and
`Parse` to `Get("k") == "a\"b"` instead of `a\"b`; every other escape (`\\`, `\n`, `\t`) is
written correctly. Found by the MarshalText round-trip property (2 of 100 catalogs); while the
bug is open the property removes backslashes before quotes from the generated strings.
Checked at the rewrite (2026-10-13): the loss is one backslash per round trip, not a fixpoint:
`a\\"b` (two backslashes, a quote) is written as `msgstr "a\\\"b"` and reads back as `a\"b`, and
the next round trip takes the remaining backslash; a single backslash before a quote becomes a
bare quote and is stable from then on; a quote followed by backslashes (`"\\`) round-trips intact.
'''

[[bug]]
id = "gotext/8"
title = "the PO parser never clears its reference buffer, so an entry without `#:` lines inherits the previous entry's references"
kind = "correctness"
severity = "medium"
test = "TestHegelPinReferencesStayWithTheirEntry"
found = { commit = "fd7620c315c1fb2f6de114210f40cf4a6698ecd4", version = "v1.7.2+ (2026-09-02)", hegel = "v0.6.33", date = "2026-10-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Po.parseComment` (po.go) stores a `#:` line in `po.domain.refBuffer`, and the flush after each
entry builds the next translation with `NewTranslationWithRefs(strings.Split(refBuffer, " "))`
without ever clearing the buffer (it is reset only at the start of `Parse`). So every entry
after one with references carries them until another `#:` line replaces them: for `#:
main.go:1` / `msgid "a"` / `msgstr "A"` followed by `msgid "b"` / `msgstr "B"` and `msgctxt "c"`
/ `msgid "d"` / `msgstr "D"`, `GetRefs("b")` and the context entry's `Refs` are both
`["main.go:1"]`, and `MarshalText` writes the `#: main.go:1` line before all three entries, so
the leak is persisted by a round trip and the references of a catalog drift towards the
file's first `#:` lines. Found by the MarshalText round-trip property once its model stated
each entry's references (the old property compared the library with itself and could not see
it); the narrow `TestHegelReferencesStayWithTheirEntry` draws an entry with references followed
by one without.
'''
