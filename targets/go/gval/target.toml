subdir = ""
license = "BSD-3-Clause"  # no AI policy in README or .github; no CONTRIBUTING (checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1"
date = "2026-09-13"
version = "v1.2.4-7-gc622ea2"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ./hegel"

[expected_failures]
TestHegelPinDecimalNegate = "gval/1"
TestHegelPinCoalesceZero = "gval/2"
TestHegelPinTernaryBool = "gval/3"
TestHegelPinArrayIndex = "gval/4"
TestHegelPinConstantFolding = "gval/5"
TestHegelPinBasePrefix = "gval/6"
TestHegelPinGoPrecedence = "gval/7"
TestHegelPinDecimalDivideByZero = "gval/8"
# The wide properties fail by the shape they shrink to over forty rounds at a hundred cases,
# every round: TestHegelEvaluate gval/5 (29 of 40; 6 five, 4 four, 3 two), TestHegelReuse
# gval/5 (32; 4 seven, 6 one), TestHegelConversions gval/5 (27; 4 seven, 6 five, 2 one),
# TestHegelDecimal gval/1 (39; 5 one). A first forty on the patch before its last fix gave
# the same pluralities (24, 30, 32, 40).
TestHegelEvaluate = "gval/5"
TestHegelReuse = "gval/5"
TestHegelConversions = "gval/5"
TestHegelDecimal = "gval/1"
# The eight narrow properties fail every run by their bug (40/40 at a hundred cases).
TestHegelNegatedDecimalsEvaluate = "gval/1"
TestHegelCoalescingKeepsZeroValues = "gval/2"
TestHegelTernaryConditionsConvertToBool = "gval/3"
TestHegelBadArrayIndicesAreErrors = "gval/4"
TestHegelDeadBranchesDoNotFailParsing = "gval/5"
TestHegelBasePrefixedIntegersParse = "gval/6"
TestHegelGoPrecedenceIsRespected = "gval/7"
TestHegelZeroDivisorsAreErrors = "gval/8"
