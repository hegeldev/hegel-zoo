# Bugs found in PaesslerAG/gval by the Hegel properties (see README.md).

[[bug]]
id = "gval/1"
title = "DecimalArithmetic cannot negate a decimal: -1, 1 - -1 and -(1 + 1) fail with expected number"
kind = "logic"
severity = "medium"
test = "TestHegelPinDecimalNegate"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
gval.DecimalArithmetic() documents "negative(-)", but its prefix operator converts the
operand with convertToFloat, which does not know decimal.Decimal: Evaluate("-1", nil) fails
with "unexpected 1(decimal.Decimal) expected number", as do "1 - -1", "-(1 + 1)", "2 ** -1"
and "-7 % 2". Only a bare float parameter can be negated ("-x" with x = 3.0 gives -3). Every
negative literal in the decimal language is therefore unwritable.
'''

[[bug]]
id = "gval/2"
title = "a ?? b returns b for 0, the empty string and empty values, not only for nil and false"
kind = "contract"
severity = "low"
test = "TestHegelPinCoalesceZero"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
gval.Full documents "Operator ??: a ?? b returns a if a is not false or nil, otherwise b".
The implementation tests reflect.Value.IsZero, so "0 ?? 5" is 5, `"" ?? "x"` is "x" and a
parameter holding 0.0 is replaced; a non-nil empty array ("[] ?? 1") is kept. Either the
documentation or the operator is wrong; a null-coalescing operator that drops zero is the
surprising half.
'''

[[bug]]
id = "gval/3"
title = "The ternary condition is tested for the zero value, not converted to bool, so the string false selects the then branch"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinTernaryBool"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
TernaryOperator documents "a ? b : c returns b if bool a is true"; PropositionalLogic
documents that the strings "false"/"FALSE" and the number 0 convert to false, and `!"false"`
is indeed true. But the ternary uses reflect.Value.IsZero on the condition, so
`"false" ? 1 : 2`, `"0" ? 1 : 2` and `"FALSE" ? 1 : 2` all give 1 (and `"" ? 1 : 2` gives 2),
although `!"false" ? 1 : 2` gives 1 too: the condition and its negation select the same
branch. A condition that is a string from the data is true whenever it is non-empty,
whatever it says.
'''

[[bug]]
id = "gval/4"
title = "An out-of-range or non-integer index on an array returns the array itself"
kind = "logic"
severity = "medium"
test = "TestHegelPinArrayIndex"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With arr = []interface{}{1, "a"}: Evaluate("arr[2]"), "arr[-1]", "arr[1.5]", `arr["x"]` and
"arr.x" all return the whole array []interface{}{1, "a"} with no error, and "arr[5].k" too
(the path continues from the array). In variable() the []interface{} case only assigns when
the index is a valid integer in range and otherwise falls out of the switch with the current
value unchanged; every other type gives "unknown parameter 'k' on T" (a missing map key gives
nil). An expression like `arr[i] == arr` is true for any bad i.
'''

[[bug]]
id = "gval/5"
title = "Constant folding evaluates constant subexpressions at parse time, so a short-circuited or unreached branch fails the whole expression"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinConstantFolding"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`true || "a" - 1` fails with `parsing error: invalid operation (string) - (float64)`, while
`t || s - 1` with t = true, s = "a" evaluates to true: the parser folds every infix or prefix
whose operands are constants when it is pushed on the operator stack, and an error there is
a parse error. The same for `false && "a" - 1`, `true ? 1 : "a" - 1`, `1 ?? "a" - 1` and
`"a" in "abc"` (an eval error with variables). Whether an expression is accepted thus depends
on whether its dead branch is written with literals or with parameters.
'''

[[bug]]
id = "gval/6"
title = "Integer literals with a base prefix (0x10, 0b101, 0o17) are rejected although hex floats parse"
kind = "contract"
severity = "low"
test = "TestHegelPinBasePrefix"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README says numbers "can be used like in Go", and the scanner (text/scanner in Go mode)
tokenizes 0x10, 0b101 and 0o17 as Int, but parseNumber hands the token to
strconv.ParseFloat, which accepts hexadecimal only with a p exponent: "0x10" fails with
`strconv.ParseFloat: parsing "0x10": invalid syntax`, while "0x1p4" is 16 and "1_000" is 1000.
Legacy octal "017" is read as decimal 17 (Go: 15).
'''

[[bug]]
id = "gval/7"
title = "Operator precedence is not the Go-standard order: shifts bind looser than + and -, and & no tighter than | and ^"
kind = "contract"
severity = "low"
test = "TestHegelPinGoPrecedence"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README: "The normal Go-standard order of operators is respected." In Go, << >> bind like
* / (level 5), & too, and | ^ like + - (level 4). gval gives + - 120, << >> 90 and ^ & | all
60: "1 << 1 + 1" is 4 (Go 3), "8 >> 1 * 2" is 2 (Go 8), "6 & 3 + 1" is 4 (Go 3),
"1 | 2 ^ 3 & 4" is 0 (Go 3). Expressions mixing shifts or bit operations with arithmetic
evaluate differently from the same Go expression.
'''

[[bug]]
id = "gval/8"
title = "DecimalArithmetic division by zero panics"
kind = "crash"
severity = "medium"
test = "TestHegelPinDecimalDivideByZero"
found = { commit = "c622ea2f0e823f41ceff4fd90127e47e038049f1", version = "v1.2.4-7-gc622ea2", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
gval.DecimalArithmetic().Evaluate("1 / 0", nil) panics with "decimal division by 0"
(shopspring/decimal's Div and Mod panic on a zero divisor), and so does "1 % 0" and any
expression whose divisor evaluates to zero at run time ("x / (1 - 1)"); at parse time when
the operands are constants. Evaluate is documented to return an error; the float language
returns +Inf/NaN. The panic escapes to the caller of Evaluate.
'''
