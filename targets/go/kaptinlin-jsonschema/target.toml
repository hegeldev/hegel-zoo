name = "kaptinlin-jsonschema"
language = "go"
upstream = "https://github.com/kaptinlin/jsonschema"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-19"

[base]
commit = "cde5e2426d985930c4fbb07bb57bace50808c85c"
date = "2026-09-13"
version = "v0.9.10"

[hegel]
version = "v0.9.6"

[run]
# The tests need python3 with the jsonschema package (4.26+, with jsonschema_specifications) on
# PATH: it is the validation oracle and its meta-schema files are served to ValidateSchema
# offline. The library's own tests run too.
setup = []
command = "go test -count=1 -v ."

[expected_failures]
TestHegelPinPlainNameIDKeepsTheBase = "kaptinlin-jsonschema/1"
TestHegelPinOutputNamesTheSchemaKeywords = "kaptinlin-jsonschema/2"
TestHegelPinSchemaLocationHasOneHash = "kaptinlin-jsonschema/3"
TestHegelPinFormatFieldsRejectSigns = "kaptinlin-jsonschema/4"
TestHegelPinDurationUnitsMayBeSkipped = "kaptinlin-jsonschema/5"
TestHegelPinCountKeywordsBeyondInt64 = "kaptinlin-jsonschema/6"
TestHegelPinOutputLocationsAreJSONPointers = "kaptinlin-jsonschema/7"
TestHegelPinMissingRequiredPropertyHasNoUnit = "kaptinlin-jsonschema/8"
TestHegelPinNullDefaultIsApplied = "kaptinlin-jsonschema/9"
TestHegelPinSerializedSchemaKeepsEmptySubschemas = "kaptinlin-jsonschema/10"
