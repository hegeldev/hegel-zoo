# Bugs found in kaptinlin/jsonschema (v0.9.10) by the Hegel zoo. One [[bug]] per finding; `test`
# names the plain Go test in hegel_pins_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracle: Python's jsonschema 4.26 as a child process for
# validation verdicts and meta-schema checks; models of the RFC grammars for the formats; exact
# rational arithmetic for the numeric keywords; the library's own output convention for the
# result lists. No AI policy in README.md, CONTRIBUTING.md or AGENTS.md (the repository ships
# CLAUDE.md and AGENTS.md for agents; checked 2026-09-19).

[[bug]]
id = "kaptinlin-jsonschema/1"
title = "a plain-name fragment $id breaks the references inside its subschema"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlainNameIDKeepsTheBase"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In drafts 4, 6 and 7 a subschema may declare a location-independent identifier as an id with
only a plain-name fragment ("$id": "#A", "id": "#A" in draft 4); the specification says such
an identifier does not change the base URI (draft-07 section 8.2.3). The compiler treats the
subschema as a new resource: every $ref inside it is resolved against that resource, so
{"$schema": draft-07, "$ref": "#A", "definitions": {"a": {"$id": "#A", "properties": {"x":
{"$ref": "#/definitions/b"}}}, "b": {"type": "string"}}} fails to compile with "reference
resolution failed in http://example.com/root.json#A at #/properties/x/$ref
("#/definitions/b"): json pointer segment not found"; a reference to another anchor ("#B")
fails the same way. Python's jsonschema and santhosh-tekuri/jsonschema accept the document.
The same schemas written with $anchor in 2019-09 and 2020-12 work. Found by every property
that compiles generated schemas; the generator no longer gives a legacy anchor to a definition
that contains a $ref.
'''

[[bug]]
id = "kaptinlin-jsonschema/2"
title = "output paths and error keys name the normalised keywords for legacy items, additionalItems and dependencies"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOutputNamesTheSchemaKeywords"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Compilation rewrites a draft-7 tuple "items": [...] to prefixItems, "additionalItems" to items
and "dependencies" to dependentRequired/dependentSchemas (docs/dialects.md), and the
evaluation results are written in terms of the rewritten schema: for {"$schema": draft-07,
"items": [{"type": "string"}], "additionalItems": {"type": "number"}} on [1, "a"] the root
errors are keyed "prefixItems" and "items" and the details have evaluationPath "/prefixItems/0"
and "/items/1" with schemaLocation "http://example.com/root.json#/prefixItems/0", locations
that do not exist in the schema the user wrote; "dependencies": {"a": ["b"], "c": {...}} on
{"a": 1, "c": 1} reports "dependentRequired" and "/dependentSchemas/c". The serializer takes
care to write the legacy keywords back (the same docs), so the output should name them too.
Found by TestHegelOutputsAreWellFormed, which now accepts both names in drafts before 2020-12.
'''

[[bug]]
id = "kaptinlin-jsonschema/3"
title = "schemaLocation has a double hash when the resource id ends in a hash"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSchemaLocationHasOneHash"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Schema.SchemaLocation returns s.SchemaURI() + "#" + path without stripping an empty fragment
from the URI. Ids of the form "http://example.com/s.json#" are the convention of drafts 4 to 7
(all the official meta-schemas have them), so {"$id": "http://example.com/s.json#",
"properties": {"p": {"type": "string"}}} on {"p": 1} reports schemaLocation
"http://example.com/s.json##/properties/p", and Compiler.ValidateSchema of any draft-7
document reports locations under "http://json-schema.org/draft-07/schema##/...": not URIs.
Found by TestHegelOutputsAreWellFormed on generated schemas with a root $id (the generator's
root ids have no hash, so the property is gated on the double hash only).
'''

[[bug]]
id = "kaptinlin-jsonschema/4"
title = "ipv4, time and date-time formats accept a signed field"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFormatFieldsRejectSigns"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
IsIPV4 and IsTime parse their fields with strconv.Atoi, which accepts a leading '+' or '-',
and then range-check the value: "1.1.1.+1", "1.1.1.-0" and "+1.1.1.1" pass the ipv4 format
(RFC 2673 dotted-quad: decimal digits only), "+1:00:00Z" and "12:00:+0Z" pass the time format
and "2020-01-01T+1:00:00Z" the date-time format (RFC 3339: 2DIGIT fields). Python's
jsonschema and santhosh-tekuri/jsonschema (after its own fix of the same bug) reject them.
Found by TestHegelFormatsFollowTheirRFCs, now gated on a sign in a field.
'''

[[bug]]
id = "kaptinlin-jsonschema/5"
title = "duration format rejects a date part with years and days but no months"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDurationUnitsMayBeSkipped"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
IsDuration collects the unit letters of the date part and of the time part and checks each
with containsOrderedUnits(units, "YMD" / "HMS"), implemented as strings.Contains(allowed,
units): a substring test, so only contiguous runs of units are accepted. RFC 3339 appendix A
(dur-date = dur-day / dur-month [dur-day] / dur-year [dur-month [dur-day]]; dur-time =
"T" (dur-hour / dur-minute / dur-second) with dur-hour = 1*DIGIT "H" [dur-minute]) lets the
middle unit be omitted: "P1Y1D", "PT1H1S", "P1Y1DT1H" and "P32Y7DT82H42M31S" are durations
(Python's isoduration and santhosh-tekuri/jsonschema accept them) but the library rejects
them. Found by TestHegelFormatsFollowTheirRFCs, now gated on such a gap.
'''

[[bug]]
id = "kaptinlin-jsonschema/6"
title = "maxLength, minLength, maxContains and minContains at or beyond 2^63 are misread"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCountKeywordsBeyondInt64"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Schema.MaxLength, MinLength, MaxContains and MinContains are *float64 and the evaluators
compare int(*schema.MaxLength) with the length: a float64 at or above 2^63 (every integer
from 9223372036854775296 up rounds to it, including 9223372036854775807, 1e19 and 1e30)
converts to math.MinInt64 on amd64, so {"maxLength": 9223372036854775807} rejects every
string ("Value should be at most 9223372036854775807 characters" for "ab"), {"minLength":
9223372036854775807} accepts every string, {"contains": true, "maxContains":
9223372036854775807} rejects [1, 2] and the same minContains accepts it. maxItems,
minItems, maxProperties and minProperties handle the same values correctly. Python's
jsonschema compares the numbers as given. Found by TestHegelValidationMatchesPython (draft 6,
"maxLength": 9223372036854775808 on "b"); the generator keeps its count keywords small.
'''

[[bug]]
id = "kaptinlin-jsonschema/7"
title = "output locations do not escape tilde and slash in property names"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOutputLocationsAreJSONPointers"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The evaluators build instanceLocation and evaluationPath with fmt.Sprintf("/%s", propName)
("/properties/%s", "/patternProperties/%s", "/additionalProperties/%s", ...), without the
RFC 6901 escaping ("~" as "~0", "/" as "~1") the JSON pointer form requires: {"properties":
{"/": {"type": "string"}}} on {"/": 1} reports instanceLocation "//" and evaluationPath
"/properties//" (and DetailedErrors keys like "/0///type"); the property "~" gives "/~", and
"a/b~c" gives "/a/b~c", which reads as three pointer tokens. The locations are documented as
JSON pointers by the output format they follow and cannot be resolved as written. Found by
TestHegelOutputsAreWellFormed, whose location checks now skip objects with such keys.
'''

[[bug]]
id = "kaptinlin-jsonschema/8"
title = "a missing required property produces an output unit located at the absent member"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMissingRequiredPropertyHasNoUnit"
found = { commit = "cde5e2426d985930c4fbb07bb57bace50808c85c", version = "v0.9.10", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
When a property named in "required" is absent, the result list carries, besides the required
error, a unit with evaluationPath "/properties/<name>" and instanceLocation "/<name>" (valid:
true in the plain case, with errors when the property schema is a $ref: the CI run of the
zoo saw "Property '0' does not match the schema" for an object without a property "0"), as if
the property schema had been evaluated against the missing member; {"properties": {"p":
{"type": "null"}}, "required": ["p"]} on {} reports it, and inside allOf the phantom unit is
attached to the root rather than to the allOf/0 unit. Without "required" no such unit appears.
The instance location does not exist in the instance, so consumers that resolve locations
fail on it. Validity is not affected (the required error stands). Found by
TestHegelOutputsAreWellFormed on CI; the checker now skips properties units for absent members.
'''
