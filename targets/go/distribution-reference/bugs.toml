[[bug]]
id = "distribution-reference/1"
title = "A digest-only reference does not survive Field's text round trip: it unmarshals as the repository sha256 tagged with the hex"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinFieldKeepsDigestOnlyReferences"
found = { commit = "0965666a6ade2e06035fe352e38344be1e68951a", version = "v0.6.0-22-g0965666", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    r, _ := ParseAnyReference("sha256:0123...cdef")      // digestReference, not Named
    text, _ := AsField(r).MarshalText()                   // "sha256:0123...cdef"
    var f Field; f.UnmarshalText(text)
    f.Reference()                                         // taggedReference: name "sha256", tag "0123...cdef"

Field is "a wrapper type for resolving correct reference types when working with encoding";
UnmarshalText "parses text bytes by invoking the reference parser to ensure the appropriately
typed reference object is wrapped by field". The parser it invokes is Parse, whose grammar has
no digest-only form (the name is mandatory; getBestReferenceType's "Allow digest only
references" branch is unreachable), so the text of a digest-only reference - which
ParseAnyReference produces for a bare digest or a 64-hex identifier, and Sort ranks fifth -
comes back as a named, tagged reference to a repository called "sha256". The same holds for
the identifier form: ParseAnyReference(<64 hex>) marshals to "sha256:<hex>" and unmarshals to
that repository.

Found by the ParseAnyReference property (Field round trip of the result).
'''

[[bug]]
id = "distribution-reference/2"
title = "The familiar string of a docker.io reference whose first path component contains a dot or is localhost, or whose official name is 64 hex digits, does not parse back to the same reference"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinFamiliarStringParsesBack"
found = { commit = "0965666a6ade2e06035fe352e38344be1e68951a", version = "v0.6.0-22-g0965666", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    ParseNormalizedNamed("docker.io/foo.bar/baz")        -> FamiliarString "foo.bar/baz"         -> ParseNormalizedNamed: "foo.bar/baz"   (registry foo.bar)
    ParseNormalizedNamed("docker.io/localhost/baz")      -> FamiliarString "localhost/baz"       -> "localhost/baz"                        (registry localhost)
    ParseNormalizedNamed("docker.io/index.docker.io/baz") -> FamiliarString "index.docker.io/baz" -> "docker.io/library/baz"               (another repository)
    ParseNormalizedNamed("docker.io/library/<64 hex>")   -> FamiliarString "<64 hex>"            -> error "cannot specify 64-byte hexadecimal strings"

familiarizeName drops the docker.io domain (and the library/ prefix) without checking that the
remaining first component will not be read as a domain by splitDockerDomain, which takes a first
component containing '.' or ':' or equal to "localhost" for one, and ParseNormalizedNamed
rejects a bare 64-hex string as an identifier. The grammar admits all of these repositories
(path components may contain '.', "localhost" is an ordinary component, 64 hex digits are
alphanumeric), and ParseNormalizedNamed accepts their fully qualified forms; the "familiar" form
is what the Docker UI shows and what a user types back. Docker Hub itself does not issue
namespaces with dots, so the reachable cases are the reserved-looking ones above.

Found by the normalization property (ParseNormalizedNamed of FamiliarString is the identity).
'''

[[bug]]
id = "distribution-reference/3"
title = "A bracketed host is accepted when it is any run of hex digits and colons; the grammar says an IPv6 address"
kind = "spec"
severity = "low"
test = "TestHegelPinBracketedHostIsAnIPv6Address"
found = { commit = "0965666a6ade2e06035fe352e38344be1e68951a", version = "v0.6.0-22-g0965666", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    Parse("[abc]/foo")                 = domain "[abc]"
    Parse("[:::::]/foo")               = domain "[:::::]"
    Parse("[1::2::3]/foo")             = domain "[1::2::3]"
    Parse("[12345::1]/foo")            = domain "[12345::1]"
    Parse("[1:2:3:4:5:6:7:8:9]/foo")   = domain "[1:2:3:4:5:6:7:8:9]"

The package grammar: `host := domain-name | IPv4address | \[ IPv6address \] ; rfc3986
appendix-A`; regexp.go's comment on ipv6address: "Only IPv6 in compressed or uncompressed format
are allowed". The pattern is `\[(?:[a-fA-F0-9:]+)\]`, which accepts any bracketed run of hex
digits and colons: no colon at all, more than one "::", groups longer than four digits, more
than eight groups. None of these is an IPv6 address (net/netip rejects them all); the same
strings are accepted by ParseNormalizedNamed and by DomainRegexp, so a reference to such a
"registry" is well-formed as far as this package is concerned and fails only when dialled.

Found by the parse property (net/netip as the reading of "IPv6address").
'''

[[bug]]
id = "distribution-reference/4"
title = "ParseNormalizedNamed reports an empty name as ErrReferenceInvalidFormat and an uppercase name with an error that is not ErrNameContainsUppercase, unlike Parse"
kind = "contract"
severity = "low"
test = "TestHegelPinNormalizedErrorsAreTheSentinels"
found = { commit = "0965666a6ade2e06035fe352e38344be1e68951a", version = "v0.6.0-22-g0965666", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    Parse("")                       = ErrNameEmpty              ("repository name must have at least one component")
    ParseNormalizedNamed("")        = ErrReferenceInvalidFormat ("invalid reference format")
    Parse("Ubuntu")                 = ErrNameContainsUppercase
    ParseNormalizedNamed("Ubuntu")  = "invalid reference format: repository name (library/Ubuntu) must be lowercase",
                                      a fmt.Errorf value: errors.Is(err, ErrNameContainsUppercase) and
                                      errors.Is(err, ErrReferenceInvalidFormat) are both false

ErrNameEmpty "is returned for empty, invalid repository names" and ErrNameContainsUppercase "is
returned for invalid repository names that contain uppercase characters" - the sentinels exist
so callers can tell these cases apart with errors.Is. ParseNormalizedNamed does its own
lowercase check before calling Parse and builds a fresh error (with a message that reads like
ErrReferenceInvalidFormat but does not wrap it), and it turns "" into "docker.io/library/"
before Parse sees it, so the empty case reaches Parse as a malformed string. ParseDockerRef,
ParseAnyReference and ParseNamed inherit both.

Found by the normalization property (error identity against Parse's).
'''

[[bug]]
id = "distribution-reference/5"
title = "The package grammar writes the name separator as [-]* and the digest-algorithm separator as the character range [+.-_]"
kind = "documentation"
severity = "low"
test = "TestHegelPinGrammarMatchesTheCode"
found = { commit = "0965666a6ade2e06035fe352e38344be1e68951a", version = "v0.6.0-22-g0965666", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
reference.go, package comment, "Grammar":

    separator                       := /[_.]|__|[-]*/
    digest-algorithm-separator      := /[+.-_]/

regexp.go: separator = `(?:[._]|__|[-]+)` and digestPat's separator `[-_+.]`. As written, the
grammar's separator may be empty ([-]* matches zero dashes), which would make "ab" parse as two
alpha-numerics and any component ambiguous, and its digest-algorithm separator is a character
class holding the range '.'-'_' (0x2E-0x5F): the digits, ':', ';', '<', '=', '>', '?', '@',
the uppercase letters, '[', '\', ']' and '^' - so "sha256:abc" would read as algorithm "sha"
separator '2'... The intended sets are one-or-more dashes and the four characters '+', '.',
'-', '_' (as the grammar's other productions and the code have them).

The pin reads reference.go and fails while the two lines stand.
'''
