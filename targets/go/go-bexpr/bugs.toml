[[bug]]
id = "go-bexpr/1"
title = "A double-quoted string value that spells a JSON pointer is parsed as a selector, so the value loses its leading slash"
kind = "logic"
severity = "high"
test = "TestHegelPinSlashString"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The Value rule of grammar.peg tries Selector before StringLiteral, and Selector's second
alternative is the JSON pointer form `'"' JsonPointerSegment* '"'`. A double-quoted value whose
content is a well-formed pointer (`/` followed by letters, digits or -_.~:|, repeated) is
therefore read as a selector and its Raw value is Selector.String(), the path parts joined
with "/" and no leading slash: `path == "/usr/bin"` compares path with "usr/bin" and is false
for path = "/usr/bin"; `"/usr/bin" in paths` is false for paths = ["/usr/bin"]; `~1` and `~0`
in the string are unescaped as well. A value with a space or other character outside the
segment class (`"/usr bin"`) falls through to StringLiteral and keeps its slash, as does the
backtick form. Found by TestHegelParse (the parsed Raw differed from the string); the
generator writes such values in the backtick form while Known.slashStringIsPointer is on.
'''

[[bug]]
id = "go-bexpr/2"
title = "A collection expression (any/all) cannot be an operand of and, of not, or the left operand of or without parentheses"
kind = "logic"
severity = "medium"
test = "TestHegelPinCollectionOperand"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In grammar.peg CollectionExpression is only the third alternative of OrExpression, not of
NotExpression or ParenthesizedExpression, so it reaches an operator position only as the right
operand of `or` (through OrExpression's right recursion): `n == 1 or any list as v { v == 2 }`
parses, but `any list as v { v == 2 } or n == 5`, `any list as v { v == 2 } and n == 1`,
`n == 1 and any list as v { v == 2 }` and `not any list as v { v == 3 }` are all rejected
("no match found, expected: whitespace or EOF" after the closing brace, or an error at
`any`). Parentheses around the collection expression make each of them parse. Found by
TestHegelParse; the renderer parenthesizes a collection expression in those positions while
Known.collectionNeedsParens is on.
'''

[[bug]]
id = "go-bexpr/3"
title = "in over an interface slice that holds a nil element panics"
kind = "crash"
severity = "high"
test = "TestHegelPinNilElement"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
doMatchIn (evaluate.go), for a []interface{}, takes `item := value.Index(i).Elem()` and then
`item.Type()`; for a nil element Elem() is the zero reflect.Value and Type() panics with
"reflect: call of reflect.Value.Type on zero Value". `1 in list` with list =
[]interface{}{nil, 1} panics (from Evaluate, and from Filter.Execute); with the nil after the
matching element the match returns first. Data decoded from JSON (`[null, 1]`) is exactly this
shape. The other operators handle a nil value (`list.0 is nil` is true). Found by
TestHegelEvaluate; the model yields a panic outcome while Known.nilElementPanics is on.
'''

[[bug]]
id = "go-bexpr/4"
title = "A double-quoted string literal cannot contain an escaped quote: the grammar ends the literal at the first quote and strconv.Unquote then fails"
kind = "logic"
severity = "low"
test = "TestHegelPinEscapedQuote"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
StringLiteral in grammar.peg is `'"' DoubleStringChar* '"'` with `DoubleStringChar <- !'"' .`,
so the literal ends at the first quote whether or not a backslash precedes it, and the action
`strconv.Unquote(string(c.text))` on the text `"a\"` fails with "invalid syntax", which
becomes the parse error `rule "string": invalid syntax`. The other Go escapes work (`"a\nb"`
is a with a newline and b), so `\"` is the only escape the literal cannot hold; a string with
a quote can only be written in the backtick form, which cannot hold a backtick. Found by
TestHegelParse; the generator avoids strings holding both quote characters while
Known.escapedQuoteUnparsable is on.
'''

[[bug]]
id = "go-bexpr/5"
title = "A number literal directly before the brace closing a collection body is an invalid number literal"
kind = "logic"
severity = "low"
test = "TestHegelPinNumberBeforeBrace"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
NumberLiteral requires `&AfterNumbers` = whitespace, EOF or ")" after the digits (so that
`1abc` is rejected rather than split), but the collection body added later closes with "}",
which the lookahead does not know: `any list as v {v == 2}` fails with `rule "number": Invalid
number literal` while `any list as v {v == 2 }` parses. A string value (`{v == "2"}`) and a
bare identifier are fine. Found by TestHegelParse; the renderer puts whitespace between a
number and "}" while Known.numberBeforeBrace is on.
'''

[[bug]]
id = "go-bexpr/6"
title = "is nil and is not nil on a Go array panic"
kind = "crash"
severity = "low"
test = "TestHegelPinArrayIsNil"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
doMatchIsNil lists reflect.Array with Map, Slice and Chan and calls value.IsNil() on it, which
panics ("reflect: call of reflect.Value.IsNil on array Value"): `arr is nil` with arr =
[2]int{1, 2} panics from Evaluate. An array is never nil, so false is the answer (as the
function gives for a struct). Arrays are otherwise supported (`arr.0 == 1`, `1 in arr`, `any
arr as v {...}`, `arr is empty` work). Found by TestHegelEvaluate; the model yields a panic
outcome while Known.arrayIsNilPanics is on.
'''

[[bug]]
id = "go-bexpr/7"
title = "in over an interface slice fails with an error at a nested slice or map element unless an earlier element matched"
kind = "logic"
severity = "low"
test = "TestHegelPinNestedElement"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a []interface{} doMatchIn examines each element on its own and, as its comment says, skips
an element whose type the value does not parse as (a strconv.ErrSyntax) because "in an
interface slice there can be a mix/match of types". A nested slice or map element has no
primitive equality function, and that case returns the error "unable to find suitable
primitive comparison function for in comparison in interface slice" instead of skipping, so
`2 in list` is true for list = [2, [2]] but an error for list = [[2], 2], and `"x" in list`
errors for [{"a": 1}, "x"]. Found by TestHegelEvaluate; the model stops with an error at the
first nested element while Known.inStopsAtNested is on.
'''

[[bug]]
id = "go-bexpr/8"
title = "Binding the same name to the index and the value of a collection is rejected only when the collection has elements"
kind = "logic"
severity = "low"
test = "TestHegelPinSameNameBinding"
found = { commit = "50afaaad27c9ddea533569860ddb82ae7a2c072f", version = "untagged (18 commits after v0.1.16, 2026-08-25)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
evaluateCollectionExpression checks `NameBinding.Index == NameBinding.Value` inside the loop
over the elements, so `any list as v, v { v == 1 }` errors with `"v" cannot be used as a
placeholder for both the index and the value` (evaluate_test.go asserts it) when list has an
element, but returns false (any) or true (all) without an error when list is empty or the
selector is a missing map key. The expression is malformed whatever the data; the check
belongs in the grammar action or before the loop. Found by TestHegelEvaluate; the model
errors only for a non-empty collection while Known.sameNameUncheckedWhenEmpty is on.
'''
