subdir = ""
license = "MIT"  # README and LICENSE are the project documents; nothing about AI-written code.
ai_policy_checked = "2026-09-17"

[base]
commit = "cc662875ff5888a22ab73d512826040d81b67811"
date = "2026-04-01"
version = "v0.7.1"

[hegel]
version = "v0.6.33"

[run]
setup = []
command = "go test -count=1 -run TestHegel -v ."

[expected_failures]
TestHegelPinFactorizeCopiesEqualValues = "jsondiff/1"
TestHegelPinEquivalentArraysHaveEqualElements = "jsondiff/2"
TestHegelPinEquivalentLeavesTheInputAlone = "jsondiff/3"
TestHegelPinMergePatchToNull = "jsondiff/4"
TestHegelPinRationalizeHandlesEscapedKeys = "jsondiff/5"
TestHegelPinRationalizeCountsTheTestOperation = "jsondiff/6"
TestHegelPinInvertibleAcrossRootTypes = "jsondiff/7"
TestHegelPinInvertOfAnAppend = "jsondiff/8"
TestHegelPinFactorizeTestsBeforeMoving = "jsondiff/9"
TestHegelPinFactorizeMovesTheRightElement = "jsondiff/10"
TestHegelPinRationalizeWithEquivalentDoesNotPanic = "jsondiff/11"
TestHegelPinRationalizeKeepsTheSmallerFactorizedPatch = "jsondiff/12"
TestHegelPinEquivalentCountsRepeatedElements = "jsondiff/13"

# Unsteered 2026-10-06 (STYLE.md rule 11): the wide properties draw every
# recorded shape and fail on them, mapped to the bug they shrink to; the
# shapes drawn in a few percent of cases are intermittent. One narrow
# property per bug carries its deterministic failure beside the pin.
TestHegelRoundTrip = { bug = "jsondiff/2", intermittent = true }
TestHegelInvert = "jsondiff/7"
TestHegelIgnores = { bug = "jsondiff/2", intermittent = true }
TestHegelEntryPoints = { bug = "jsondiff/2", intermittent = true }
TestHegelMergePatch = { bug = "jsondiff/4", intermittent = true }
TestHegelFactorizeCopiesOnlyEqualValues = "jsondiff/1"
TestHegelEquivalentTellsCollidingElementsApart = "jsondiff/2"
TestHegelEquivalentKeepsTheCallerArraysInOrder = "jsondiff/3"
TestHegelMergePatchToNullIsValidJSON = "jsondiff/4"
TestHegelRationalizeHandlesEscapedKeys = "jsondiff/5"
TestHegelRationalizeCountsTheTestOperation = "jsondiff/6"
TestHegelInvertibleAcrossRootKinds = "jsondiff/7"
TestHegelInvertOfAnAppend = "jsondiff/8"
TestHegelFactorizeTestsBeforeMoving = "jsondiff/9"
TestHegelFactorizeMovesTheRightElement = "jsondiff/10"
TestHegelRationalizeWithEquivalentDoesNotPanic = "jsondiff/11"
