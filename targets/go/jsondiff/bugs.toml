# Bugs found in github.com/wI2L/jsondiff by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the behaviour RFC 6902/7386 and the documentation promise and
# is listed as an expected failure in target.toml.

[[bug]]
id = "jsondiff/1"
title = "Factorize emits a copy from an unchanged value whose hash collides with the added one, so the patch produces the wrong document"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinFactorizeCopiesEqualValues"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON({"x":[],"y":1}, {"x":[],"y":1,"z":[[]]}, Factorize()) returns
[{"op":"copy","from":"/x","path":"/z"}], which sets z to [] instead of [[]]. Likewise
{"x":null} to {"x":null,"y":false} copies null into y, {"x":["ab"]} + y:["a","b"] copies ["ab"],
{"x":"1"} + y:true copies "1", {"x":{"a":"b"}} + y:{"ab":""} copies the wrong object. The
differ's hasher (hash.go) writes values into a maphash without any delimiter or type tag:
arrays contribute nothing of their own, so [] and [[]] hash alike; null and false both write
'0'; a string and its split, or the digit string "1" and true, write the same bytes; object
keys and values are concatenated. findUnchanged (differ.go) trusts the digest and never
checks deepEqual against the candidate, so any collision becomes a copy from the wrong
place. The patch is applied blindly by RFC 6902 appliers, so the receiving document is
silently wrong. Found by the round-trip property (both appliers gave a document different
from the target), reduced by probes.
"""

[[bug]]
id = "jsondiff/2"
title = "Equivalent treats arrays as equivalent when their elements' hashes collide ([null] and [false], [] and [[]]), so different documents give an empty patch"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEquivalentArraysHaveEqualElements"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON([null], [false], Equivalent()) and CompareJSON([[]], [[[]]], Equivalent()) return
empty patches, as does {"a":[3,15,[],[]]} against {"a":[[[]],[],15,3]} and ["1"] against
[true]. unorderedDeepEqualSlice (differ.go) decides equivalence by comparing the elements'
digests only, and the hasher (see jsondiff/1) gives the same digest to null and false, to a
nested empty array and an empty array, to a string and a bool with the same text. The
documentation defines equivalent arrays as having the same elements the same number of times
(deep equality); these do not. Found by the round-trip property with Equivalent (the patch
did not turn a into a permutation of b).
"""

[[bug]]
id = "jsondiff/3"
title = "Equivalent sorts the arrays of the input values in place while hashing: the caller's target is reordered, and the patch's test and replace values come out permuted so an invertible patch fails to apply"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEquivalentLeavesTheInputAlone"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
hasher.sortArray (hash.go) sorts the slice it is given with slices.SortStableFunc when a digest
is computed with sort = true, i.e. under Equivalent. The slices are the decoded documents
themselves, so CompareWithoutMarshal(["bar"], [[{"a":1},5,1]], Equivalent()) leaves the
caller's target as [[5,1,{"a":1}]] (order by hash value, which changes with the process's
maphash seed), and the replace operation carries the reordered array. With Invertible or
Rationalize the test operations carry reordered values too: CompareJSON([[3,1,2],1],
[[3,1,2],2], Equivalent(), Invertible(), Rationalize()) gives a test at "" with value
[[3,2,1],1], which fails against the real document, so no RFC 6902 applier accepts the
patch. Since the arrays are reordered before the walk, the patch's paths can also point at
the wrong element of the caller's document (a test at /3/3/0 where the source has an object
at /3/3). Compare and CompareJSON also give different patches for the same input from one
call to the next. Found by the entry-point property (Compare, CompareJSON and CompareWithoutMarshal
disagreeing) and by the model applier rejecting test operations.
"""

[[bug]]
id = "jsondiff/4"
title = "MergePatch and MergePatchJSON return no bytes, not valid JSON, when the target document is null"
kind = "contract"
severity = "low"
test = "TestHegelPinMergePatchToNull"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
MergePatchJSON([]byte(`{"a":1}`), []byte(`null`)) returns (nil, nil). mergePatch (merge.go)
returns tgt when either side is nil, and the callers treat a nil patch as "nothing to
marshal" and return nil bytes. RFC 7386 says a patch that is not an object replaces the
whole target, so the merge patch turning any document into null is the four bytes "null";
an empty byte slice is not a JSON document and json.Unmarshal rejects it. Found by the merge
patch property (json.Valid on the result).
"""

[[bug]]
id = "jsondiff/5"
title = "Rationalize panics (index out of range) on an object key that is a backslash, and takes a replacement as free under any key that needs JSON escaping, producing a larger patch"
kind = "crash"
severity = "high"
test = "TestHegelPinRationalizeHandlesEscapedKeys"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON({"\\\\":{"a":1,"b":2}}, {"\\\\":{"a":1,"b":3}}, Rationalize()) panics with "index out
of range [22] with length 20" in squashValue, called from findKey (json.go) while
compareObjects looks up the key's value in the target text. findKey searches the raw JSON
for the key as it appears in the decoded document, not as it is escaped in the text: for the
key `\\` the text has "\\\\", the scan lands in the wrong place and runs off the end; for
{"a\\"b":{...}} (or "x\\y") the key is simply not found, the value's text length is taken as
zero, and the weight function then prefers replacing the whole object (55 bytes) over the
single-field replace (42 bytes), against the documented purpose of keeping the smaller
patch. Keys with '<', '>' or '&' are escaped by encoding/json as \\u003c etc. and found
correctly because the differ compacts the input text rather than re-marshaling it. Found by
probes after the round-trip property reported enlarged patches.
"""

[[bug]]
id = "jsondiff/6"
title = "Rationalize does not count the test operation it adds under Invertible, and so replaces small patches by larger ones"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRationalizeCountsTheTestOperation"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON({"0":[[{},[]],""]}, {"0":[[{},[]]]}, Rationalize(), Invertible()) gives a 103-byte
patch (a test of the whole document and a replace of the whole document) where the plain
invertible patch is 70 bytes (test and remove at /0/1). rationalize (differ.go) compares the
length of the operations generated so far with replaceOp.jsonLength() alone, then appends a
test operation carrying the whole source value in front of the replace without having
counted it. Found by the round-trip property's check that Rationalize never enlarges the
patch.
"""

[[bug]]
id = "jsondiff/7"
title = "With Invertible, documents whose root types differ give a bare add at the root, and Invert turns it into a test and a remove of the root, which cannot restore the source"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInvertibleAcrossRootTypes"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON(1, {"a":1}, Invertible()) returns [{"op":"add","path":"","value":{"a":1}}]; its
Invert() is [{"op":"test","path":"","value":{"a":1}}, {"op":"remove","path":""}], which no
applier accepts (the root cannot be removed) and which carries no trace of the source
document. diff (differ.go) uses an add at the root for incomparable root values as RFC 6902
section 4.1 allows, but under Invertible it should be a test of the source followed by a
replace, as it is for incomparable values below the root. Found by the Invert property
(every case with differing root types).
"""

[[bug]]
id = "jsondiff/8"
title = "Invert keeps the \"-\" index of an append, producing test and remove operations at \"/-\" that RFC 6902 forbids and no applier accepts"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInvertOfAnAppend"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON([1], [1,2], Invertible()) is [{"op":"add","path":"/-","value":2}] (the differ
appends with the "-" index unless LCS is on); Invert() gives [{"op":"test","path":"/-",
"value":2}, {"op":"remove","path":"/-"}]. RFC 6901 section 4 and RFC 6902 section 4.1 define
"-" only as the target of an add (the position after the last element); a test or remove
with that index must fail, and the model applier and evanphx both reject it. The inverse
should address the element by its index (here "/1"), as it does when the patch was generated
with LCS. invertOp (patch.go) turns an add into test + remove of the same path without
resolving "-". The same happens to a move whose path is an append (Factorize:
{"op":"move","from":"/0/0/1","path":"/1/-"} inverts to a move from "/1/-"). Found by the
Invert property on every appended element.
"""

[[bug]]
id = "jsondiff/9"
title = "With Factorize, LCS and Invertible, the test guarding a moved array element is emitted after the move and checks the wrong value, so the patch does not apply"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFactorizeTestsBeforeMoving"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON([null,[1]], [[1],null], Factorize(), LCS(), Invertible()) returns
[{"op":"move","from":"/0","path":"/1"}, {"op":"test","path":"/0","value":null}]. After the
move the element at /0 is [1], so the test fails and RFC 6902 appliers (evanphx, the model)
reject the whole patch; the source and target are a plain swap. The LCS array differ emits
the test for a removed element, then Factorize folds the remove and a later add into a move
that is placed before the test, leaving the test to run against the moved document. Without
LCS the same pair gives two test/replace pairs that apply; without Invertible the move alone.
Found by the entry-point property (the reverse pair's patch failing to apply), reduced by a
probe.
"""

[[bug]]
id = "jsondiff/10"
title = "Factorize with LCS emits move operations with wrong indices, so the patch applies cleanly and produces the wrong document"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinFactorizeMovesTheRightElement"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON(["x",{},1], [1,{}], Factorize(), LCS()) returns [{"op":"move","from":"/0",
"path":"/1"}, {"op":"remove","path":"/0"}], which every RFC 6902 applier turns into ["x",1]:
the "x" that should be removed is moved to the end and the 1 that should be moved to the
front is removed. Likewise [1,2,3] to [3,4,2] gives [3,4,1] and ["foo!",{},-1.25] to
[-1.25,"foo",{}] gives [-1.25,"foo","foo!"]; the same inside an object member. The LCS
array differ emits remove and add operations whose indices assume they are applied in
order; Factorize then pairs a later remove with an earlier add of the same value into a
move placed at the add's position, keeping indices that were valid only for the original
sequence (differ.go, add/findRemoved with the LCS path). Without LCS the pairs give plain
replace operations that are right; without Factorize the LCS patch is right. No error is
reported, and the patch tests nothing, so the receiving side gets a silently wrong
document. Found by the entry-point property (the reverse pair's patch giving the wrong
result), reduced by probes.
"""

[[bug]]
id = "jsondiff/11"
title = "Rationalize with Equivalent panics (slice bounds out of range in findIndex) on about a third of calls, because the arrays were reordered in place while hashing before the source text is searched by index"
kind = "crash"
severity = "high"
test = "TestHegelPinRationalizeWithEquivalentDoesNotPanic"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON([[[[null,null]],""]], [[[[null]],""]], Rationalize(), Equivalent()) panics with
"slice bounds out of range [:3] with length 2" in findIndex (json.go:30), called from
compareArrays (or compareArraysLCS with LCS) to take the text of an element for
rationalize's weighing; 96 to 117 of 300 calls in a probe, the rest return a patch.
Equivalent sorts the decoded arrays in place while hashing (jsondiff/3), by a maphash order
that changes with the seed; findIndex then walks the compact source text, whose elements
are still in the original order, to the position of the sorted element, and squashValue
reads past the end when the text there is shorter (here the "" after the nested array). A
library call that panics nondeterministically on valid input, for a documented option
pair. Found by the round-trip property under Factorize+Rationalize+Equivalent+LCS+Invertible
(reported by Hegel as a panic in the code under test); the options reduced by a probe.
"""

[[bug]]
id = "jsondiff/12"
title = "Rationalize with Factorize and LCS replaces a whole array where the two operations it had were smaller, producing a larger patch"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRationalizeKeepsTheSmallerFactorizedPatch"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON([0.5,{"d":-2,"name":"baz","k":"long string value"}],
[false,0.5,{"name":"baz","k":"long string value"}], Rationalize(), Factorize(), LCS()) is
an 87-byte replace of the root, while Factorize+LCS alone give a 70-byte patch (add /0
false, remove /2/d); the same pair with Rationalize+LCS keeps the 70 bytes and with
Rationalize+Factorize correctly replaces (163 bytes of positional replaces otherwise). So
rationalize (differ.go) is comparing against operations other than the ones the LCS differ
finally emits when Factorize is on, or weighing them wrongly, and chooses the larger
patch against its documented purpose. A 131-byte replace against 76 bytes in the original
case. Found by the round-trip property's "Rationalize never enlarges" check.

2026-10-06: the mechanism, read in differ.go while the test was unsteered, is wider than
LCS. Under Factorize, `add` appends an add operation that is neither a copy nor a move with
`valueLen = len(doc)`, the text of the whole enclosing container in the target, and
`rationalize` sums those lengths when it weighs the operations against one replace of the
container; so any add under Rationalize+Factorize can tip the choice towards a larger
replace. Two more shapes, without LCS: CompareJSON([]byte(`["aaaa...(40 a's)",1]`),
[]byte(`["aaaa...",2,3]`), Rationalize(), Factorize()) is an 83-byte replace of the root
where Factorize alone, Rationalize alone and no option give the 73-byte `replace /1 2,
add /- 3`; and CompareJSON([]byte(`{}`), []byte(`{"name":{}}`), Rationalize(), Factorize())
is a 46-byte replace of the root where every other option set gives the 38-byte
`add /name {}`. Both reproduced standalone against cc662875. The pin and the narrow property
carry all three shapes; the size check of the round-trip property names jsondiff/12 for any
add under Rationalize+Factorize.
"""
[[bug.observed]]
version = "v0.7.1"
commit = "cc662875ff58"
hegel = "v0.6.33"
date = "2026-10-06"
result = "reproduces"

[[bug]]
id = "jsondiff/13"
title = "Equivalent treats arrays that hold the same elements with different multiplicities as equivalent ([1,1,2] and [1,2,2]), so different documents give an empty patch"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEquivalentCountsRepeatedElements"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-10-06" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON([1,1,2], [1,2,2], Equivalent()), CompareJSON([0,0,1], [0,1,1], Equivalent()) and
the same arrays under an object key all return an empty patch, although no permutation of
one array is the other. unorderedDeepEqualSlice (differ.go) checks that the lengths agree,
collects the source elements' digests in a set, and then only asks whether each target
element's digest is in the set: the number of times an element occurs is never compared,
so a target that repeats one source element in place of another passes. No hash collision
is involved, which is what sets this apart from jsondiff/2; the documentation defines
equivalent arrays as having the same elements the same number of times. Reproduced
standalone against cc662875. Found by the round-trip property under Equivalent once its
generators drew every recorded shape (2026-10-06): a mismatch explained by neither a
collision nor the in-place sort, confirmed by the probe above.
"""

[[bug]]
id = "jsondiff/14"
title = "Rationalize replaces a whole value with the target's text, ignored members included, so the patch changes values that Ignores excludes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRationalizeLeavesIgnoredValuesAlone"
found = { commit = "cc662875ff5888a22ab73d512826040d81b67811", version = "v0.7.1", hegel = "v0.6.33", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CompareJSON({"i":1,"j":1,"l":1}, {"i":2,"j":2,"l":2}, Rationalize(), Ignores("/i")) is the
single operation `replace "" {"i":2,"j":2,"l":2}`: applied, it sets /i to 2, the value
Ignores said to leave out of the diff (the README: the option excludes the named values
"from the generated diff"). Without Rationalize the patch is the two replaces of /j and /l
and /i stays 1. The same under a key (Ignores("/k/i") with the objects under "k" gives
`replace /k`), for a member only the target has (`{"j":1,"l":1}` to `{"i":2,"j":2,"l":2}`,
Ignores("/i"): the replace adds it, where the plain patch adds nothing) and for removals
(`{"i":1,"j":1,"l":1}` to `{}`, Ignores("/i"): `replace "" {}` drops /i, where the plain
patch is two removes). rationalize (differ.go) builds the replace from the target value and
its text whenever the operations emitted under a pointer are longer than a replace of it,
and never asks isIgnored about the descendants, so any ignored member whose value differs
leaks into the patch once two or more other members change. Reproduced standalone against
cc662875 (v0.7.1 is the newest release). Found by the Ignores property on 2026-10-07 once it
drew Rationalize, which it had kept off as "not described by the model" (the shape then shrank
to two removes beside an ignored member, `{"\\\\":{},"a":{},"b":{}}` to `{}` with Ignores("/a")).
"""
[[bug.observed]]
version = "v0.7.1"
commit = "cc662875ff58"
hegel = "v0.6.33"
date = "2026-10-07"
result = "reproduces"
