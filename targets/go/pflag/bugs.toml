# Bugs found in spf13/pflag by the Hegel properties. Each is pinned by the
# test named in `test`, listed as an expected failure in target.toml.

[[bug]]
id = "pflag/1"
title = "GetStringArray re-parses the CSV rendering of the array and loses an empty element or a CR"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGetStringArrayKeepsEveryElement"
found = { commit = "161f35afe1f44bfbdeee0d5509401f2065491189", version = "v1.0.10+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
After `--array ""` the bound variable holds `[""]` but `GetStringArray` returns `[]`; after
`--array $'a\r\nb'` it holds `["a\r\nb"]` but `GetStringArray` returns `["a\nb"]`.
`getFlagType` renders the value with `Value.String()` (`"[" + writeAsCSV(elems) + "]"`) and
re-reads it with `stringArrayConv`, which strips the brackets, maps an empty rendering to
no elements (so a single empty string vanishes) and reads the rest through `encoding/csv`,
which turns a quoted `\r\n` into `\n`. A string *array* is documented as not being CSV at all
("The value of each argument will not try to be separated by comma"), so the accessor should
return the stored slice, as `GetStringToString` does (`convFunc == nil`). `GetStringSlice`
has the same CR rewrite, but there the argument itself is CSV.
'''

[[bug]]
id = "pflag/2"
title = "GetFloat64Slice rounds every element to six decimals"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGetFloat64SliceKeepsPrecision"
found = { commit = "161f35afe1f44bfbdeee0d5509401f2065491189", version = "v1.0.10+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`--f 1e-7,0.1,123456789.123456789,5e-324` binds `[1e-07 0.1 1.2345678912345679e+08 5e-324]`
but `GetFloat64Slice` returns `[0 0.1 1.23456789123457e+08 0]`. `float64SliceValue.String()`
formats with `%f`, which is what the accessor re-parses; every other numeric kind uses
`strconv.Format*` with precision -1 (and `Float32Slice` has the same `%f`). The bound
variable and the accessor are documented as the same value; cobra's `GetFloat64Slice` goes
through this path.
'''

[[bug]]
id = "pflag/3"
title = "GetIPv4Mask and GetIPNet fail on a flag left at its nil default"
kind = "contract"
severity = "low"
test = "TestHegelPinGetIPNetAndMaskAcceptTheNilDefault"
found = { commit = "161f35afe1f44bfbdeee0d5509401f2065491189", version = "v1.0.10+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`fs.IPMask("mask", nil, …)` then `fs.GetIPv4Mask("mask")` (without the flag on the command
line) fails with `unable to parse <nil> as net.IPMask`; `fs.IPNet("net", net.IPNet{}, …)`
then `GetIPNet` fails with `invalid string being converted to IPNet: <nil>`. Both render the
zero value as `<nil>` and re-parse it; `ipConv` special-cases `""` and `"<nil>"` for `GetIP`,
the mask and net converters do not. A nil default is the natural "not given" default for these
kinds, and the accessors are the documented way to read a flag by name.
'''

[[bug]]
id = "pflag/4"
title = "Usage shows `(default [])` for empty boolSlice, durationSlice, float64Slice, ipSlice and map flags"
kind = "contract"
severity = "low"
test = "TestHegelPinEmptySliceDefaultsAreNotShown"
found = { commit = "161f35afe1f44bfbdeee0d5509401f2065491189", version = "v1.0.10+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`fs.BoolSlice("bools", nil, "u")` prints `--bools bools   u (default [])`, and so do
`DurationSlice`, `Float64Slice`, `Float32Slice`, `Int32Slice`, `Int64Slice`, `UintSlice`,
`IPSlice`, `IPNetSlice`, `StringToString`, `StringToInt` and `StringToInt64`, while
`StringSlice`, `IntSlice` and `StringArray` print nothing. `Flag.defaultIsZeroValue`, whose
job is to suppress the default for zero values, lists only the three original slice kinds for
the `[]` rendering; the later kinds fall to the generic branch, which knows `false`, `<nil>`,
`""` and `0` but not `[]`.
'''

[[bug]]
id = "pflag/5"
title = "FlagUsagesWrapped counts bytes, not columns: non-ASCII usage text wraps early and misaligns"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUsageWrapsByColumns"
found = { commit = "161f35afe1f44bfbdeee0d5509401f2065491189", version = "v1.0.10+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
Twenty two-letter words wrap into 7/7/6 per line at 60 columns when the letters are `é`, but
12/8 when they are `e`: `wrapN` slices and measures the text with `len` and byte indexes, and
`FlagUsagesWrapped` computes the column alignment (`maxlen`) with `len(line)` too, so a flag
whose type name or `` `name` `` contains non-ASCII letters shifts every other flag's text. The
documentation says "wrapped to `cols` columns". Lines never exceed the width, so the effect is
under-filled lines and drifting columns for localised usage strings.
'''

[[bug]]
id = "pflag/6"
title = "A single key=value pair with a quoted value keeps its opening quote"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringToStringQuotedSinglePair"
found = { commit = "161f35afe1f44bfbdeee0d5509401f2065491189", version = "v1.0.10+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`--m 'k="v"'` sets `k` to `"v` (opening quote kept, closing quote dropped), while `--m
'"k=v"'` sets `k` to `v` and `--m '"k=v",j=1'` (two pairs) goes through `encoding/csv` and sets
`k` to `v`. `stringToStringValue.Set` handles the one-`=` case with `strings.Trim(val, "\"")`,
which only strips quotes at the ends of the whole `key=value` string, so a quoted value is
half-stripped. Either strip the quotes around the value or leave them alone.
'''

[[bug]]
id = "pflag/7"
title = "stringToInt (and stringToInt64) render in map order, so DefValue and usage text change between runs"
kind = "contract"
severity = "low"
test = "TestHegelPinStringToIntDefaultTextIsStable"
found = { commit = "161f35afe1f44bfbdeee0d5509401f2065491189", version = "v1.0.10+", hegel = "v0.6.33", date = "2026-09-15" }
status = "open"
notes = '''
`fs.StringToInt("m", map[string]int{"a": 1, …, "f": 6}, "u")` records `DefValue` as
`[e=5,f=6,a=1,b=2,c=3,d=4]` in one process and another order in the next, and `Value.String()`
changes between two calls in the same process; the `(default …)` text in `--help` is therefore
unstable. `stringToStringValue.String()` sorts the keys; `stringToIntValue.String()` and
`stringToInt64Value.String()` iterate the map directly.
'''
