# Bugs found in miekg/dns (v1.1.73) by the Hegel zoo. One [[bug]] per finding; `test` names the
# plain Go test in hegel_pins_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracle: dnspython 2.8 as a child process for wire and text
# forms of records, names, messages, zone files, NSEC3 hashes, key tags, DS digests and TSIG; the
# RFCs (1035, 1183, 1876, 3123, 4034, 5155, 6605, 8777, 8945, 9460) for the arbitration. No AI
# policy in README.md or CODEOWNERS (no CONTRIBUTING file; checked 2026-09-19).

[[bug]]
id = "miekg-dns/1"
title = "Len overestimates the wire length of escaped names and strings, base64 fields, empty type bitmaps and APL prefixes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLenIsTheWireLength"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Len is documented to return "the length (in octets) of the uncompressed RR in wire format" but
the generated len methods (ztypes.go) count several fields from their presentation form: TXT-like
and octet strings as len(x)+1 (so "\\" counts 2 for 1 byte, "\065" 4 for 1), base64 fields with
base64.StdEncoding.DecodedLen (which includes the padding: DNSKEY ... ZAKoSg== is 2 bytes over,
CERT ... SwA= 1), HIP rendezvous servers, IPSECKEY and AMTRELAY gateway hosts as len(name)+1
(the root "." counts 2 for 1, "a\064." 7 for 4), typeBitMapLen returns 2 for an empty bitmap
that packs to nothing (NSEC, NSEC3, CSYNC without types), and APL prefixes are counted at their
full address length although PackRR strips the trailing zero octets (2:::/3 is 1 over). Owner
names and other domain names are counted correctly. Msg.Len inherits the overestimates, so
Truncate may drop a record that would have fit. Found by TestHegelRecordsAgreeWithDnspython on
records whose Len differed from the PackRR size; the property now requires equality only outside
these shapes (and Len >= size everywhere).
'''

[[bug]]
id = "miekg-dns/2"
title = "NSEC, NSEC3 and CSYNC text with unsorted type mnemonics parses but cannot be packed"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTypeBitmapOrderIsFree"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The zone parser stores the type bitmap of NSEC, NSEC3 and CSYNC in the order the mnemonics are
written, and packDataNsec refuses a bitmap whose bytes are out of order: NewRR("a. 1 IN NSEC b.
MX A") succeeds but PackRR fails with "dns: nsec bits out of order" (the same for NSEC3 and
CSYNC), so the record prints, compares and Len()s but cannot be put in a message or written by
a server that loaded the zone. RFC 4034 section 4.1.2 orders the wire bitmap; the presentation
format (section 4.2) is "a sequence of RR type mnemonics" with no order, and dnspython, BIND and
ldns sort while building the bitmap. The check is also partial: types that fall in the same
bitmap byte are not detected (CSYNC ... NS A packs, and unpacks as A NS), so IsDuplicate of the
parsed record and its wire copy is false. Found by TestHegelRecordsAgreeWithDnspython; the
generator now sorts its type lists.
'''

[[bug]]
id = "miekg-dns/3"
title = "IsDuplicate, CompareDomainName and IsSubDomain compare presentation text, so equal names and records differ by their escapes or hex case"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDuplicatesAreJudgedOnTheWire"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Names and string fields are kept as the text they were parsed from and compared as strings
(labels.go equal: case-insensitive byte comparison; zduplicate.go: string equality), while
the wire form is the same for every escape spelling. So IsDuplicate(NewRR("a\032. 1 IN A
1.2.3.4"), NewRR("a\ . 1 IN A 1.2.3.4")) is false although both records print as "a\ ." and
pack identically; a record parsed from text and the same record unpacked from the wire are not
duplicates whenever a name contains an escape (\032 vs "\ ", \a vs a), whenever a TXT string
uses a \DDD escape ("\065" vs "A"), whenever a hex field differs in case (SSHFP abcd parsed,
ABCD unpacked: hex fields are compared case-sensitively), and for CAA/URI, whose value is
stored escaped by the parser and raw by the unpacker. Dedup inherits this. CompareDomainName(
"a\032.", "a\ .") is 0 and IsSubDomain("a\032.", "b.a\ .") is false for the same reason.
RFC 4343 and RFC 1035 section 5.1 make these the same names. Found by
TestHegelRecordsAgreeWithDnspython (records equal on the wire, IsDuplicate false) and
TestHegelNamesAgreeWithDnspython (CompareDomainName against dnspython's fullcompare); both
now skip names and records written with escapes for these checks.
'''

[[bug]]
id = "miekg-dns/4"
title = "LOC text with minutes but no seconds is rejected"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLOCMinutesWithoutSeconds"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 1876 section 3 gives the master file format as d1 [m1 [s1]] {"N"|"S"} d2 [m2 [s2]]
{"E"|"W"} alt ...: minutes and seconds are each optional. The LOC parser (scan_rr.go) accepts
degrees alone ("42 N") and degrees, minutes and seconds ("42 30 0 N") but after reading minutes
it requires seconds: NewRR("a. 1 IN LOC 42 30 N 56 40 W 10m") fails with "dns: bad LOC Latitude
seconds: "N"", and "42 N 56 40 W" with "bad LOC Longitude seconds: "W"". dnspython reads them.
Found by TestHegelRecordsAgreeWithDnspython; the generator no longer writes minutes without
seconds.
'''

[[bug]]
id = "miekg-dns/5"
title = "X25 rejects a quoted address although it is a character-string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinX25AcceptsQuotedAddress"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 1183 section 3.1 defines the X25 rdata as one <character-string>, which RFC 1035 section
5.1 lets be quoted. The X25 parser takes a single bare token: NewRR(`a. 1 IN X25
"311061700956"`) fails with "dns: garbage after rdata", while the unquoted form parses and
ISDN (the same RFC, two character-strings) accepts both forms. dnspython accepts the quoted
form. Found by TestHegelRecordsAgreeWithDnspython; the generator writes X25 addresses bare.
'''

[[bug]]
id = "miekg-dns/6"
title = "an unpacked CAA or URI record prints a backslash in its value as an escape, so String() does not read back"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnpackedOctetStringsPrintEscaped"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CAA.Value and URI.Target are `dns:"octet"` fields: the parser keeps the escaped text, the
unpacker (unpackStringOctet) stores the raw octets, and String() prints both through
sprintTxtOctet, which interprets backslash sequences in the stored string. For an unpacked
record the raw octets are re-interpreted: the wire value a\b (3 octets) prints as "ab", and
"\\" (2 octets: two backslashes) prints as "\\" (one octet), so NewRR(rr.String()) of a record
received in a message packs different data, and the same record parsed from text and read
from the wire are not IsDuplicate. TXT and the other txt fields escape on unpacking and do not
have this problem. Found by TestHegelRecordsAgreeWithDnspython (String() of an unpacked record
reads back differently); the property skips CAA/URI values with a backslash.
The wire side (turn 427, reproduced standalone with PackRR/UnpackRR): the same re-interpretation
makes an unpacked record pack differently from its own wire, since packStringOctet reads the raw
octets as escapes: `a. 1 IN CAA 0 issue "\\"` packs to rdata `...69737375655c` (value `\`, one
octet 0x5c), UnpackRR then PackRR gives `...6973737565` (the backslash gone); `URI 1 1 "a\\b"`
loses its backslash the same way; TXT round-trips exactly. So Pack(Unpack(wire)) != wire for
octet fields; the message property gates its Unpack(Pack) checks on such records.
'''

[[bug]]
id = "miekg-dns/7"
title = "IPSECKEY, AMTRELAY and SVCB ipv6hint reject an IPv4-mapped IPv6 address with an empty error, and an unpacked one does not read back"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMappedIPv6Gateways"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
An IPv6 gateway or hint is parsed with net.ParseIP and rejected when To4() is not nil, which is
also true of IPv4-mapped IPv6 addresses (::ffff:1.2.3.4 is a 128-bit address in IPv6 notation;
AAAA accepts it). NewRR("a. 1 IN IPSECKEY 1 2 1 ::ffff:1.2.3.4 pUo="), the AMTRELAY type-2
gateway and "SVCB 1 . ipv6hint=::ffff:1.2.3.4" fail with the message `dns: : "::ffff:1.2.3.4"`
(the ParseError has an empty err). The record is legal on the wire: unpacking an IPSECKEY with
that gateway succeeds and String() prints the gateway as "1.2.3.4" (net.IP.String of a mapped
address), which the parser then rejects as an IPv6 gateway, so the record cannot be round
tripped through text. dnspython accepts all three. Found by TestHegelRecordsAgreeWithDnspython;
the generator avoids mapped addresses in these fields.
'''

[[bug]]
id = "miekg-dns/8"
title = "CanonicalName leaves a letter written as a decimal escape in upper case"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCanonicalNameLowercasesEscapes"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CanonicalName lowercases the presentation string, so a letter written as \DDD keeps its case
on the wire: CanonicalName("x\070.") is "x\070.", which packs to 02 78 46 00 ("xF."), while
RFC 4034 section 6.2 requires every US-ASCII upper-case letter of the owner name to be
lowercased (dnspython's canonicalize gives 02 78 66 00). The canonical form feeds NSEC3 hashing,
RRSIG signing and verification and DS digests, so a zone whose names carry such escapes
computes different hashes and signatures from other implementations. Found by
TestHegelNamesAgreeWithDnspython; its canonical-form check skips names with escapes.
'''

[[bug]]
id = "miekg-dns/9"
title = "LOC seconds lose a millisecond to float truncation"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLOCSecondsAreExact"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The LOC parser converts the seconds field with strconv.ParseFloat and uint32(1000 * i): for
4.031 the product is 4030.9999999999995 and the truncation gives 4030 ms, so NewRR("a. 1 IN LOC
0 0 4.031 N 0 E 0m") has Latitude 2^31 + 4030 and prints "00 00 4.030 N" (dnspython packs
4031). Any millisecond value whose float product falls just below the integer is affected. The
altitude is rounded (uint32(i*100.0 + 10000000.0 + 0.5)) and does not have the problem. Found
by TestHegelRecordsAgreeWithDnspython; the generator writes milliseconds that are exact binary
fractions.
'''

[[bug]]
id = "miekg-dns/10"
title = "LOC altitude outside the representable range wraps around instead of being rejected"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLOCAltitudeRange"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 1876 represents the altitude as an unsigned 32-bit count of centimeters from 100000 m
below the WGS 84 reference spheroid, so the text range is -100000.00m to 42849672.95m; the
parser checks the latitude and longitude ranges (91 N and 181 E are rejected) but converts
the altitude with uint32(i*100.0 + 10000000.0 + 0.5) without a range check: "-100001m" gives
Altitude 4294967197 and prints as 42849671.97m, "42849673m" gives 4 and prints as -99999.96m,
"-100000.01m" gives 0. dnspython rejects them. Found by TestHegelRecordsAgreeWithDnspython on
"-100000.30m"; the generator stays inside the range.
'''

[[bug]]
id = "miekg-dns/11"
title = "NSEC3 packs a hash length of 20 whatever the length of the next hashed owner"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNSEC3HashLength"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The NSEC3 parser sets rr.HashLength = 20 ("Fix for NSEC3 (sha1 160 bits)", scan_rr.go) instead
of the decoded length of the base32hex field, and the packer writes that byte before the hash:
NewRR("a. 1 IN NSEC3 1 0 0 - VE08UH3B") (a 5-byte hash) packs to ... 14 fb808f446b, a length of
20 followed by 5 bytes, which UnpackRR rejects with "dns: overflow unpacking base32", and a
30-byte hash packs with length 20 so that its last 10 bytes are read as the type bitmap ("NSEC(3)
block too long"). RFC 5155 section 3.1.7 defines the hash length as the length of the next hashed
owner name field; only SHA-1 (20 bytes) is assigned today, but the wire format and dnspython
carry any length (dnspython packs 05 fb808f446b), and the library's own unpacker reads the
length from the wire. Found by TestHegelRecordsAgreeWithDnspython; the generator uses 20-byte
hashes while the bug is open.
'''

[[bug]]
id = "miekg-dns/12"
title = "AMTRELAY with the D bit set packs without its gateway"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAMTRELAYKeepsGatewayWithDBit"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The AMTRELAY parser stores the D (discovery optional) bit of RFC 8777 section 4.2.2 in the top
bit of GatewayType (rr.GatewayType = 0x80 | type), and AMTRELAY.pack passes that byte to
packIPSECGateway, whose switch matches the plain type values 0-3 only: with the D bit set no
case matches and the gateway is silently omitted. NewRR("a. 1 IN AMTRELAY 1 1 1 1.2.3.4") packs
to rdata 01 81 (2 bytes) instead of 01 81 01 02 03 04; the same for IPv6 and domain-name
gateways, so every relay with D=1 is published without an address. The parser prints the
record correctly and Len counts the gateway, so the record looks complete until it is packed
or unpacked. dnspython packs the gateway. Found by TestHegelRecordsAgreeWithDnspython; the
generator keeps D clear.
'''

[[bug]]
id = "miekg-dns/13"
title = "a comment inside the parentheses of an NSEC, NSEC3, CSYNC or RRSIG record is a parse error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCommentsInsideParentheses"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 1035 section 5.1 lets parentheses group data that crosses a line boundary and ";" start a
comment anywhere. The zone parser accepts a comment before a newline inside parentheses for most
types ("@ MX ( 1 ; c\n a. )", TXT, HIP, APL, SVCB, LOC, SOA, TLSA all parse), but the readers of
the type bitmap and of the RRSIG signature stop at it: "@ NSEC ( a. ; c\n SRV APL )" fails with
`dns: bad NSEC TypeBitMap: "SRV"`, the same for NSEC3 and CSYNC, and "@ RRSIG ( A 8 2 3600
20260101000000 ; c\n 20250101000000 1 a. AAAA )" with `bad RRSIG Signature: "AAAA"`. Without
the comment the same multi-line records parse, and dnspython reads them all. NSEC and RRSIG are
exactly the long records that signed zones write across lines with comments. Found by
TestHegelZoneParserAgreesWithDnspython; the zone generator writes no comment inside the
parentheses of these types.
'''

[[bug]]
id = "miekg-dns/14"
title = "a blank owner before any record yields a record with an empty owner name"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBlankFirstOwner"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 1035 section 5.1: a line starting with blank has the owner of the previous RR. When there is
no previous RR the zone parser uses its empty "previous name": ZoneParser on "$TTL 1\n  A
1.2.3.4\n" with origin example.com. returns an A record whose Header().Name is "", which prints
as "\t1\tIN\tA\t1.2.3.4" and packs (as the root) without error, so a malformed zone loads
silently with a nameless record. dnspython uses the origin; BIND reports an error. Either is
better than an empty name. Found by TestHegelZoneParserAgreesWithDnspython (records "outside
the origin"); the generator only writes blank owners after a record.
'''

[[bug]]
id = "miekg-dns/15"
title = "TsigVerify decrements the ARCOUNT in the caller's message buffer"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTsigVerifyKeepsTheBuffer"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
stripTsig (tsig.go), used by TsigVerify and TsigVerifyWithProvider, finds the TSIG record and
writes arcount-1 into msg[10:12] of the slice it was given: after TsigVerify(msg, ...) returns
nil the caller's msg has one fewer additional record in its header, and Unpack of that msg
(which ignores trailing bytes) yields a message without its TSIG, as if it had never been
signed; IsTsig() is nil and a second TsigVerify fails with "dns: no signature found". The
documentation ("TsigVerify verifies the TSIG on a message") does not mention the mutation, and
verifying a received message before unpacking it is the natural order. Found by
TestHegelTsigInteroperates (Unpack after TsigVerify had no TSIG); the property verifies a copy.
'''

[[bug]]
id = "miekg-dns/16"
title = "KeyTag ignores the RSA/MD5 rule of RFC 4034 appendix B.1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinKeyTagRSAMD5"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 4034 appendix B.1: for algorithm 1 (RSA/MD5) the key tag is the most significant 16 bits of
the least significant 24 bits of the public key modulus, i.e. the third- and second-to-last
octets of the public key field, not the ones-complement sum used for every other algorithm.
DNSKEY.KeyTag applies the sum to algorithm 1 too: for "257 3 1 MWwoyw8q95pCE4xPuwfJBoYj7lnjNMY8XDIilQ=="
it returns 21542 where the appendix gives 12834 (0x3222; dnspython's key_id agrees). RSA/MD5 is
deprecated (RFC 6725) but the key tag of such a key is still defined and appears in DS and RRSIG
records. Found by TestHegelDnssecPrimitivesAgreeWithDnspython; the generator no longer uses
algorithm 1.
'''

[[bug]]
id = "miekg-dns/17"
title = "an IPSECKEY record cannot be followed by another record in a zone file"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIPSECKEYThenAnotherRecord"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
IPSECKEY.parse reads the public key with endingToString, which consumes the tokens up to and
including the end of the line, and then calls slurpRemainder, which expects that newline and
finds the first token of the next record: ZoneParser on "$TTL 1\n@ IPSECKEY 1 1 1 1.2.3.4
pUo=\n@ A 1.2.3.4\n" returns no record and the error `dns: garbage after rdata: "@" at line:
3:2`, for every gateway type. An IPSECKEY as the last record of the file, or NewRR of a single
record, works, which is why the library's own tests pass. The other records that end in base64
(DNSKEY, OPENPGPKEY, HIP) do not call slurpRemainder after endingToString and are fine. Found
by TestHegelZoneParserAgreesWithDnspython; the zone generator leaves IPSECKEY out.
'''

[[bug]]
id = "miekg-dns/18"
title = "TsigVerify refuses every NOTAUTH message without checking its signature"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTsigVerifiesNotAuthMessages"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
stripTsig returns ErrAuth ("dns: bad authentication") as soon as the header rcode is NOTAUTH
(9), before looking at the TSIG record, so TsigVerify cannot verify a correctly signed NOTAUTH
message: a dynamic update response with rcode NOTAUTH (RFC 2136 section 2.2, the server is not
authoritative for the zone), or an extended rcode whose low four bits are 9, signed with the
shared key, fails with ErrAuth although dnspython verifies it (the property found the case with
a random rcode). RFC 8945 section 5.2.3 also requires the client to verify the signature of a
BADTIME response, which carries rcode NOTAUTH and a MAC; the library rejects it unverified. Only
BADKEY and BADSIG responses are unsigned. Found by TestHegelTsigInteroperates; the property
avoids rcode 9.
'''

[[bug]]
id = "miekg-dns/19"
title = "CERT type 4 is spelt IPIX instead of IPKIX"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCERTTypeIPKIX"
found = { commit = "2e4905fb030255032d4343cb83bc2f8c3cfcb82a", version = "v1.1.73", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 4398 section 2.1 names certificate type 4 (the URL of an X.509 data object) IPKIX;
CertTypeToString (types.go) has "IPIX" for it (the constant is CertIPIX), so a CERT record of
type 4 prints as "CERT IPIX 1 8 ..." which dnspython, BIND and ldns reject, and the RFC's
mnemonic is rejected on input: NewRR("a. 1 IN CERT IPKIX 1 8 ElQ=") fails with `dns: bad CERT
Type: "IPKIX"`, while the numeric form "CERT 4 1 8 ElQ=" parses (and prints as IPIX). Found by
TestHegelZoneParserAgreesWithDnspython; the generator writes type 4 numerically.
'''
