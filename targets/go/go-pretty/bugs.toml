[[bug]]
id = "go-pretty/12"
title = "NewNumberTransformer formats a negative as - plus the format of the negated value, so widths misplace the sign and MinInt64 gets two"
kind = "logic"
severity = "low"
test = "TestHegelPinNumberFormat"
found = { commit = "dc9744e2ff163194cb8a390fe79d3744fa9fb70b", version = "untagged (3 commits after v6.8.3, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
transformInt64 and transformFloat64 (transformer.go) print a negative with `Sprintf("-"+format,
-val)`. With a width the padding comes between the sign and the digits: NewNumberTransformer(
"%5d")(-42) is "-   42" where Sprintf gives "  -42", so a right-aligned column of numbers
