[[bug]]
id = "go-pretty/1"
title = "A CSI sequence is terminated only by m, so cursor and erase sequences (the package's own Cursor type) swallow the text after them"
kind = "logic"
severity = "medium"
test = "TestHegelPinCursorSequences"
found = { commit = "dc9744e2ff163194cb8a390fe79d3744fa9fb70b", version = "untagged (3 commits after v6.8.3, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
EscSeqParser.isEscapeStopRune (escape_seq_parser.go) ends a CSI sequence at 'm' only, and
the wrap functions' appendWord uses the same rule. A CSI sequence ends at any final byte
0x40-0x7E (ECMA-48); the package's own Cursor type emits ESC[nA, ESC[nB, ESC[nC, ESC[nD and
ESC[K, none ending in 'm'. StripEscape(ESC[2K + "hello") is "", StringWidthWithoutEscSequences
(CursorUp.Sprintn(3) + "abc") is 0, LongestLineLen(EraseLine.Sprint() + "abc\ndef") is 0 (the
newline is swallowed too), and Trim, Pad, Snip, InsertEveryN, Align and the wrap functions
inherit the miscount. Found by TestHegelWidth and TestHegelInsert; the generator emits only SGR
sequences while Known.csiOnlyM is on.
'''

[[bug]]
id = "go-pretty/2"
title = "An OSC sequence terminated by BEL is recognised only for OSC 8, so a BEL-terminated title sequence swallows the text after it"
kind = "logic"
severity = "low"
test = "TestHegelPinOSCBell"
