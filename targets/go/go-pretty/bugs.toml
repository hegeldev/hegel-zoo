title = "The parser restores colours in numeric order, not the last one set, so a wrapped line continues in the wrong colour"
kind = "logic"
severity = "medium"
test = "TestHegelPinColorOrder"
found = { commit = "dc9744e2ff163194cb8a390fe79d3744fa9fb70b", version = "untagged (3 commits after v6.8.3, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
