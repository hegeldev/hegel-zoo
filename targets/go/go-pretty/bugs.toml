[[bug]]
id = "go-pretty/23"
title = "The parser applies the 256-colour codes of a sequence before its other codes, so ESC[0;38;5;31m loses its colour and ESC[49;48;5;130m its background"
kind = "logic"
severity = "medium"
test = "TestHegelPinCodeOrder"
found = { commit = "dc9744e2ff163194cb8a390fe79d3744fa9fb70b", version = "untagged (3 commits after v6.8.3, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseSeq runs process256ColorSequences over the whole code list first and processRegularCodes
afterwards, so the codes of one sequence do not apply in order: in ESC[0;38;5;31m the colour is
set and then the 0 empties the map, in ESC[49;48;5;130m the background is set and then the 49
