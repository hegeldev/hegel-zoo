status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Consume ends an OSC sequence at BEL only when the buffer starts with ESC]8; (the hyperlink fix
for #422); every other OSC command ends only at a backslash. OSC 0 (window title) and the rest
are commonly BEL-terminated: StripEscape(ESC]0;title BEL "text") is "" and the width 0. The
terminator of an OSC string is BEL or ESC \ whatever the command. Found by TestHegelWidth; the
generator uses ESC \ on non-8 OSC sequences while Known.oscBelOnly8 is on.
'''

[[bug]]
