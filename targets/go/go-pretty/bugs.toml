notes = '''
Escape (ansi.go) ends with `strings.ReplaceAll(result, escapeSeq+EscapeReset, "")`, meant to
drop the empty colouring it may have produced, but applied to the whole result: an input
holding the same sequence directly before a reset ("a" ESC[31m ESC[0m "b" with ESC[31m), or
ending with the sequence ("ab" ESC[31m, where Escape appends the reset), loses the pair, and
the output ends with the colour open (ESC[31m "a" ESC[31m "b" ... no reset). Found by
TestHegelEscape (the output must end in the empty state); the generator avoids the pair while
Known.escapeStripsPair is on.
'''
