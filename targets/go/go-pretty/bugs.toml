letters left as they were because the closing ESC]8;; has no m), and FormatLower lower-cases
the URL. The Format type is documented as transforming the text "while keeping escape
sequences in the string intact and untouched". Found by TestHegelFormat; the generator emits
no OSC sequences while Known.formatCSIOnly is on.
'''

