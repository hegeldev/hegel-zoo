[[bug]]
id = "go-pretty/5"
title = "Wrapping re-opens the sequence that was in force before a reset on the lines that follow"
kind = "logic"
severity = "medium"
test = "TestHegelPinWrapReset"
found = { commit = "dc9744e2ff163194cb8a390fe79d3744fa9fb70b", version = "untagged (3 commits after v6.8.3, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
wrapHard and wrapSoft (wrap.go) keep lastSeenEscSeq, the sequence to restart each new line
with, and update it from esp.ParseString(word) only when the result is non-empty: `if
openEscSeq := esp.ParseString(word); openEscSeq != "" { lastSeenEscSeq = openEscSeq }`. A
word that resets the state (ESC[0m at its start or end, or ESC[0;0m) yields "", so the
