upstream_issue = ""
fixed_in = ""
notes = '''
The parser keeps the codes as a set (map[int]bool) and Sequence() emits them sorted. Setting a
foreground colour does not clear the previous one (only 39, 0 and a 256 colour clear standard
colours, and a standard colour does not clear a 256 one), so after ESC[91m then ESC[31m the set
