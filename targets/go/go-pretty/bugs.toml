kind = "logic"
severity = "medium"
test = "TestHegelPinFormatHyperlink"
found = { commit = "dc9744e2ff163194cb8a390fe79d3744fa9fb70b", version = "untagged (3 commits after v6.8.3, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
toUpper and toTitle (format.go) track the escape state with a flag set at ESC and cleared at
'm'; FormatLower calls strings.ToLower on the whole string. For an OSC 8 hyperlink (the
package's own Hyperlink) the first 'm' of the URL ends the "sequence": FormatUpper.Apply(
