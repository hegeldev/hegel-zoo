# Bugs found in buger/jsonparser by the zoo's Hegel tests (hegel_test.go in hegel.patch).
# Oracle: the model tree the documents are generated from, cross-checked with encoding/json,
# strconv for the scalar parsers, and the package's own documentation (README, godoc and the
# "documented divergences" list at the top of its reference_oracle_test.go).

[[bug]]
id = "jsonparser/1"
title = "Set with an index beyond the end of an array (or a malformed one) appends instead of failing; Get on the same path then finds nothing"
kind = "contract"
severity = "medium"
test = "TestHegelSetOutOfRangeIndexFails"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Set([1,2], 9, "[5]")` returns `[1,2,9]` with no error, and `Get(out, "[5]")` fails; the same
for `{"a":[1,2]}` at `a.[5]` (`{"a":[1,2,9]}`), for an empty array at `[1]`, and for the
malformed components `[-1]`, `[]`, `[1`, `[*]`, `[x]`, which all append.  Upstream knows the
top-level case: its own `TestOracleSetPr286Regression` (reference_oracle_test.go, cases
`pr286-top-level-oob` and `pr286-top-level-far`) asserts an error and fails at this commit; PR
#286 removed only the earlier data loss (`{"a":[9]}`, the file's D7 note).  An index equal to
the length appends by design (the `pr286-top-level-len` case passes) and the zoo's model says
so too; the pinned property draws indices strictly beyond the end.
"""

[[bug]]
id = "jsonparser/2"
title = "Set with a path whose shape disagrees with the document replaces the container it reaches, losing its contents"
kind = "wrong-result"
severity = "medium"
test = "TestHegelSetRefusesAMismatchedPathShape"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A key step on an array: `Set({"a":[1,2]}, 9, "a", "b")` returns `{"a":{"b":9}}`.  An index
step on an object: `Set({"a":{"x":1}}, 9, "a", "[0]")` returns `{"a":[9]}`, and at the root
`Set({"a":1}, 9, "[0]")` returns `[9]` — the whole document is gone.  Upstream's D6/D7 notes
call these shapes "undefined"; nothing in the API documentation does, and an error is the only
answer that loses no data.  A scalar reached the same way is replaced too (`{"a":"x"}` at
`a.b` gives `{"a":{"b":9}}`); the zoo does not count that, since creating structure over a
scalar is arguably the documented auto-vivification.
"""

[[bug]]
id = "jsonparser/3"
title = "Set writes a new key unescaped: a quote, backslash or control character in it yields invalid JSON or a different key"
kind = "wrong-result"
severity = "medium"
test = "TestHegelSetEscapesTheNewKey"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Set({}, 1, "\\"")` returns the six bytes `{`, three quotes, `:1}` — the key is unquoted inside its quotes; a key with a newline is written with a raw
newline; `Set({}, 9, "a\\\\b")` returns `{"a\\b":9}`, which is valid JSON for the *different* key
"a" + U+0008.  Keys that need escaping are read correctly by Get (they are compared
unescaped), so only the writer is at fault.  Upstream's D10 note describes the bug;
`SetString` escapes values, nothing escapes keys.
"""

[[bug]]
id = "jsonparser/4"
title = "EachKeyWildcard stops at the first array element without the key: later matches are not reported and the call fails"
kind = "contract"
severity = "low"
test = "TestHegelEachKeyWildcardReportsEveryMatch"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Documented as producing "one callback for every matching combination, in document order".
`EachKeyWildcard({"a":[{"b":1},{"c":3},{"b":2}]}, cb, "a", "[*]", "b")` calls back once
(`1`) and returns KeyPathNotFoundError; the third element's `b` is never reported.
`SetWildcard` on the same path visits every element (it sets `b` in all three).
"""

[[bug]]
id = "jsonparser/5"
title = "Escape copies invalid UTF-8 through, so its output is not a UTF-8 JSON text"
kind = "contract"
severity = "low"
test = "TestHegelEscapeProducesUTF8"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Escape("\\x80")` returns the bytes `"\\x80"`; encoding/json writes `"\\ufffd"` (U+FFFD for each
invalid byte).  RFC 8259 §8.1 requires JSON text to be UTF-8.  Escape is documented as "a JSON
string literal ... RFC 8259-escaped".
"""

[[bug]]
id = "jsonparser/6"
title = "GetFloat, GetInt and ParseFloat accept number spellings that are not JSON: `1_0`, `0x1p-2`, `-Inf`, `-Infinity`, `1.`, `-.5`, leading zeros"
kind = "contract"
severity = "low"
test = "TestHegelGetFloatRejectsNonJSONNumbers"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Get classifies any token that starts with `-` or a digit as a Number and GetFloat hands the
raw bytes to strconv.ParseFloat, which accepts Go's syntax: `{"a": 1_0}` reads as 10,
`{"a": 0x1p-2}` as 0.25, `{"a": -Inf}` and `{"a": -Infinity}` as -Inf, `{"a": 1.}` as 1,
`{"a": -.5}` as -0.5; GetInt accepts leading zeros (`{"a": 01}` is 1).  ParseInt is strict
(no `+`, no underscores) and upstream's own D1 note says "jsonparser follows strict JSON — no
leading +, no underscores, no hex/octal"; ParseFloat follows none of it.  The pinned property
only draws spellings that encoding/json rejects.
"""

[[bug]]
id = "jsonparser/7"
title = "ReaderParser.Get does not find the empty key"
kind = "wrong-result"
severity = "low"
test = "TestHegelReaderParserFindsTheEmptyKey"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`NewReaderParser(strings.NewReader(`{"": 1}`)).Get("")` returns KeyPathNotFoundError, as does
`Get("a", "")` on `{"a":{"":4}}`; the byte-slice Get finds both.  Every other key agrees between
the two entry points (the ReaderParser differential property runs with one-byte, half-size and
chunked readers and sliding windows down to one byte).
"""

[[bug]]
id = "jsonparser/8"
title = "an array-index step after a scalar member resolves in a later array member of the same object"
kind = "wrong-result"
severity = "high"
test = "TestHegelIndexStepOnAScalarFindsNothing"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Get({"a":1,"b":[7]}, "a", "[0]")` returns `7`; `Get({"a":null,"b":[7,8]}, "a", "[1]")` returns
`8`; `{"a":true,"b":[7]}` and `{"a":"x","b":[7]}` behave the same, so do GetInt/GetString on
top of Get.  The value of `a` is not an array, so the path does not exist — and a key step after
a scalar (`a.c`) is correctly not found, as is `[0]` after `{}`.  When the index step meets a
scalar, the key search evidently keeps scanning the enclosing object for the next `[` and
indexes whatever array comes later, returning a value that belongs to a different key.
ReaderParser.Get and EachKey report not-found, which is how the differential against
ReaderParser found it.  A path built from keys with static roles (`"count", "[0]"`) silently
reads a neighbour's data when the document changes shape.
"""

[[bug]]
id = "jsonparser/9"
title = "Delete of a key that starts with `[` removes the value but leaves the key behind: `{\"[0]\":}`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelDeleteOfAKeyThatLooksLikeAnIndex"
found = { commit = "36a686d11807c62cd5a30d41b294d66969ea25d8", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-08-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Get and Set treat a component that starts with `[` literally when the container is an object
(`Get({"[0]":1}, "[0]")` is 1, `Set` replaces the value); Delete does not: `Delete({"[0]":1}, "[0]")`
returns `{"[0]":}` and `Delete({"[":1,"b":2}, "[")` returns `{"[":"b":2}`, both invalid JSON.
The general Delete property keeps such keys out of its paths (documented in the README) and
this pin covers them.
"""
