# Bugs found in gjson by the Hegel properties. Each has a pin test (TestHegelPin...) that
# asserts the correct behaviour and is listed as an expected failure in target.toml.

[[bug]]
id = "gjson/1"
title = "Int()/Uint() return a wrapped value instead of saturating for some 20-digit numbers"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIntSaturatesOnEveryOverflow"
found = { commit = "8d89927eff414537088a6092d53fecf6711c1e75", version = "v1.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Parse("20500000000000000000").Int() is 2053255926290448384 (and -2053255926290448384 for the
negative number); Parse("36893488147419103230").Uint() is 18446744073709551614. Both accessors
are meant to saturate (Int() of 99999999999999999999 is MaxInt64, of 18446744073709551616
MaxUint64). parseUint (gjson.go ~2810) detects overflow with `next := n*10 + d; if next < n`,
which misses the wraparounds that land above n; parseInt builds on it. The same happens for
string-typed results ("20500000000000000000").
"""

[[bug]]
id = "gjson/2"
title = "A surrogate escape followed by a non-matching \\uXXXX escape drops the second escape"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnpairedSurrogateKeepsTheNextEscape"
found = { commit = "8d89927eff414537088a6092d53fecf6711c1e75", version = "v1.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Parse(`"\\ud83d\\u0041"`).Str is "�" where encoding/json (and every other JSON reader)
gives "�A"; `"\\ud800\\ud800"` gives one U+FFFD instead of two, `"\\udc00\\u0000"` loses
the NUL. unescape (gjson.go ~2325) consumes the following \\uXXXX whenever the first escape is a
surrogate, even when utf16.DecodeRune rejects the pair, so the second code unit is lost. A lone
surrogate followed by ordinary text is fine (U+FFFD, then the text).
"""

[[bug]]
id = "gjson/3"
title = "Multipath auto-name keeps the path escaping: {a\\.b} yields the key \"a\\\\.b\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMultipathAutoNameIsTheUnescapedKey"
found = { commit = "8d89927eff414537088a6092d53fecf6711c1e75", version = "v1.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Get(`{"a.b":1}`, `{a\\.b}`) returns {"a\\\\.b":1}: the object key is the two-character path
component `a\\.b` rather than the field name `a.b`; `{a\\*}` on {"a*":1} gives {"a\\\\*":1}.
nameOfLast returns the raw path text and the multipath code AppendJSONStrings it; SYNTAX.md says
"the name of the actual field will be used".
"""

[[bug]]
id = "gjson/4"
title = "An escaped * or ? in a key pattern acts as a wildcard when the pattern has another wildcard"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedWildcardIsLiteralInPatterns"
found = { commit = "8d89927eff414537088a6092d53fecf6711c1e75", version = "v1.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
On {"axb":2,"a*b":1,"a\\\\b":5}: `a\\*b` correctly selects 1, but `a\\*?` and `?\\*b` select 2
("axb"), and `a\\\\?` finds nothing although it should select 5. When a component contains an
unescaped wildcard the whole component is unescaped and handed to tidwall/match, where the
backslash no longer protects anything (and `\\?` means something else). SYNTAX.md: "Special
purpose characters, such as ., *, and ? can be escaped with \\".
"""

[[bug]]
id = "gjson/5"
title = "Result.Path panics with index out of range on a document missing a colon"
kind = "panic"
severity = "medium"
test = "TestHegelPinPathDoesNotPanicOnInvalidJSON"
found = { commit = "8d89927eff414537088a6092d53fecf6711c1e75", version = "v1.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
doc := `{"b:"2}`; Get(doc, "b:") returns 2 (gjson does not validate, and reads 2 as the value of
"b:"); Get(doc, "b:").Path(doc) panics: `runtime error: index out of range [-1]` in revSquash.
Path walks backwards from the value and takes the colon inside the key string for the
key/value separator; revSquash of the "key" then runs off the start of the document, the index
becomes -1 and revSquash is called on an empty string. The README promises "Invalid json will
not panic, but it may return back unexpected results". Also reachable through Paths and
ForEach on Parse(doc).
"""

[[bug]]
id = "gjson/6"
title = "A multipath literal containing . or | is auto-named from the text after it: {!7.5} gives {\"5\":7.5}"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLiteralsAreAutoNamedUnderscore"
found = { commit = "8d89927eff414537088a6092d53fecf6711c1e75", version = "v1.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Get(`{}`, `{!7.5}`) is {"5":7.5}; `{!"a.b"}` is {"b\\"":"a.b"}; `{!-0.0}` is {"0":-0.0}.
Literals without a dot or pipe get "_" as documented ({!true} -> {"_":true}, {!1e2} ->
{"_":1e2}), because the `!` makes the whole component a non-simple name; with a dot inside,
nameOfLast returns the text after it, which is a simple name. A literal never has a field
name, so "_" is the documented answer.
"""

[[bug]]
id = "gjson/7"
title = "Escape() does not escape ':', so an escaped key inside a multipath is read as a member name"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEscapedKeysWorkInsideMultipaths"
found = { commit = "8d89927eff414537088a6092d53fecf6711c1e75", version = "v1.9.4+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Escape("a:") is "a:" (':' counts as a safe path character), and Get(`{"a:":1}`, "a:") is 1;
but Get(`{"a:":1}`, "["+Escape("a:")+"]") is [] and `[a:,a]` on {"a:":1,"a":2} is [2]:
parseSubSelectors takes any unescaped ':' at depth 1 as the name/path separator (names need not
be quoted), so the member becomes name "a" with an empty path. `[a\\:]` works ([1]), so either
Escape should escape ':' or unquoted names should not be accepted. `{"n":a:}` happens to work
because the quoted name consumes the first colon.
"""
