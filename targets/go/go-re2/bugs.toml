[[bug]]
id = "go-re2/1"
title = "The FindAll methods return every match when n is 0 instead of nil"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFindAllWithZeroLimitIsNil"
found = { commit = "7f13331dbe36009ba67e47b1341b8fc788e5c36d", version = "v1.12.0-17-g7f13331", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
regexp.MustCompile(`a`).FindAllString("aXa", 0) is nil ("If n >= 0, the function returns at
most n matches/submatches"; Split documents the same n with "n == 0: the result is nil"), and
so is every other FindAll method with n == 0. go-re2's return all the matches:

    re2.MustCompile(`a`).FindAllString("aXa", 0)              = ["a" "a"]
    re2.MustCompile(`a`).FindAllStringSubmatchIndex("aXa", 0) = [[0 1] [2 3]]

In internal/re2.go, findAll and findAllSubmatch turn n < 0 into "all" and then stop when
`count == n` after delivering a match, so n == 0 is never reached and the loop runs to the
end of the text. (Split is unaffected: it returns nil for n == 0 before calling
FindAllStringIndex.)

Found by the methods property, which compares every FindAll method with n in {-1, 0, 1, 2, 3}
against regexp.
'''

[[bug]]
id = "go-re2/2"
title = "A non-word-boundary assertion matches between the bytes of a multi-byte character, so Split cuts characters"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNonBoundaryStaysBetweenCharacters"
found = { commit = "7f13331dbe36009ba67e47b1341b8fc788e5c36d", version = "v1.12.0-17-g7f13331", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
On a valid UTF-8 text, regexp only ever reports match boundaries between characters. go-re2
reports \B (not at an ASCII word boundary) between the bytes of a multi-byte character:

    regexp.MustCompile(`\B`).FindAllStringIndex("b日", -1)  = [[4 4]]
    re2.MustCompile(`\B`).FindAllStringIndex("b日", -1)     = [[2 2] [3 3] [4 4]]
    re2.MustCompile(`\B`).Split("b日", -1)                  = ["b\xe6" "\x97" "\xa5"]
    regexp.MustCompile(`\B`).FindAllStringIndex("bKb", -1) = []          (U+212A Kelvin sign)
    re2.MustCompile(`\B`).FindAllStringIndex("bKb", -1)    = [[2 2] [3 3]]

so Split (and ReplaceAll, whose extra empty matches insert the replacement inside the
character) turn a valid string into pieces that are not valid UTF-8, and MatchString answers
true where regexp answers false:

    regexp.MustCompile(`\B`).MatchString("1ſA") = false     (boundaries at 0, 1, 3 and 4)
    re2.MustCompile(`\B`).MatchString("1ſA")    = true      (found at byte 2, inside the ſ)

experimental.CompileSet shows the same: Set([`\B\PL*`, ...]).FindAllString("1ſA") lists the
\B pattern as matching.

The wrapper's own FindAll loop steps over whole characters (nextPos), but RE2 itself, asked
for a match from the position after "b", moves on byte by byte and finds \B true between two
continuation bytes, which are neither word characters; the wrapper accepts the position as a
match boundary. The README lists invalid UTF-8 in the input as the only matching difference;
this happens on valid input.

Found by the methods property (Split and the ReplaceAll methods on `\B+?` over "ſbbbſ").
'''

[[bug]]
id = "go-re2/3"
title = "CompilePOSIX lets a negated character class match a newline, unlike regexp's"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPOSIXNegatedClassExcludesNewline"
found = { commit = "7f13331dbe36009ba67e47b1341b8fc788e5c36d", version = "v1.12.0-17-g7f13331", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    regexp.MustCompilePOSIX(`[^a]+`).FindAllStringIndex("b\nc", -1) = [[0 1] [2 3]]
    re2.MustCompilePOSIX(`[^a]+`).FindAllStringIndex("b\nc", -1)    = [[0 3]]
    regexp.MustCompilePOSIX(`[^a]`).MatchString("\n")               = false
    re2.MustCompilePOSIX(`[^a]`).MatchString("\n")                  = true

regexp.CompilePOSIX parses with syntax.POSIX, which has no ClassNL flag, so a negated bracket
class ([^a], [^[:alpha:]]) does not match a newline (while [[:^alpha:]] does, in both). RE2's
posix_syntax mode always sets ClassNL, and go-re2 passes the option through without
compensating, so its CompilePOSIX matches newlines where the package it replaces does not.
Compile (Perl mode) agrees in both. Not among the README's behaviour differences.

Found by the POSIX property, which compares CompilePOSIX results on generated ERE patterns.
'''

[[bug]]
id = "go-re2/4"
title = "The FindAll...Submatch... methods count a skipped empty match against a positive n and return too few matches"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSubmatchLimitCountsDeliveredMatches"
found = { commit = "7f13331dbe36009ba67e47b1341b8fc788e5c36d", version = "v1.12.0-17-g7f13331", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
    regexp.MustCompile(`a*`).FindAllStringSubmatch("baaab", 3)      = [["" ] ["aaa"] [""]]
    re2.MustCompile(`a*`).FindAllStringSubmatch("baaab", 3)         = [[""] ["aaa"]]
    re2.MustCompile(`a*`).FindAllStringSubmatchIndex("baaab", 3)    = [[0 0] [1 4]]
    re2.MustCompile(`a*`).FindAllStringIndex("baaab", 3)            = [[0 0] [1 4] [5 5]]  (right)

After "aaa" (ending at 4) the scan finds an empty match at 4, which abuts the previous match
and is skipped, as the package documents ("Empty matches abutting a preceding match are
ignored"). In internal/re2.go, findAllSubmatch increments `count` whether or not the match
was accepted and stops at `count == n`, so the skipped match uses up one of the n slots and
the third match at 5 is never delivered; findAll (the non-Submatch methods) increments only
on delivery. Any pattern that can match the empty string is affected whenever n is positive
and smaller than the number of matches plus the number of skipped positions.

Found by the methods property (FindAllStringSubmatch and the other three Submatch methods
with n in {1, 2, 3}).
'''
