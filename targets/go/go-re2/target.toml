name = "go-re2"
language = "go"
upstream = "https://github.com/wasilibs/go-re2"
subdir = ""
license = "MIT"  # LICENSE (MIT); README, RATIONALE.md and CODE_OF_CONDUCT.md say nothing about AI-written code, no CONTRIBUTING.md, no agent instructions (checked 2026-09-21)
ai_policy_checked = "2026-09-21"

[base]
commit = "7f13331dbe36009ba67e47b1341b8fc788e5c36d"
date = "2026-09-15"
version = "v1.12.0-17-g7f13331 (main, 2026-09-15)"

[hegel]
version = "v0.6.33"

[run]
command = "go test -count=1 -run TestHegel -v ."
setup = []
env = { GOWORK = "off" }  # upstream has a go.work (root + ./build); workspace mode refuses the zoo's GOFLAGS=-mod=mod

[expected_failures]
# Methods draws the limit 0 in about half its cases and fails every run on go-re2/1; Longest
# reaches /4 (a Submatch method with a positive limit on a nullable pattern) in 0.5% of cases and
# the wide POSIX property /3 in 0.1%, so both are intermittent; one narrow property per bug (in
# hegel_shapes_test.go) draws its shape region and fails every run. HEGEL_NO_KNOWN=1 switches the
# shapes off.
TestHegelMethodsAgreeWithRegexp = "go-re2/1"
TestHegelLongestAgreesWithRegexp = { bug = "go-re2/4", intermittent = true }
TestHegelPOSIXAgreesWithRegexp = { bug = "go-re2/3", intermittent = true }
TestHegelFindAllWithZeroLimitAgreesWithRegexp = "go-re2/1"
TestHegelNonBoundaryOnMultiByteTextAgreesWithRegexp = "go-re2/2"
TestHegelPOSIXNegatedClassOnNewlineAgreesWithRegexp = "go-re2/3"
TestHegelSubmatchLimitPastEmptyMatchAgreesWithRegexp = "go-re2/4"
TestHegelPinFindAllWithZeroLimitIsNil = "go-re2/1"
TestHegelPinNonBoundaryStaysBetweenCharacters = "go-re2/2"
TestHegelPinPOSIXNegatedClassExcludesNewline = "go-re2/3"
TestHegelPinSubmatchLimitCountsDeliveredMatches = "go-re2/4"
