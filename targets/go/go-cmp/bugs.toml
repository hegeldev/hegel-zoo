[[bug]]
id = "go-cmp/1"
title = "cmpopts.IgnoreMapEntries has no effect on a map that cmpopts.SortMaps flattens"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSortMapsIgnoreMapEntries"
found = { commit = "b133f1f1932e48f466f597a3346ce6f5a49a0dc1", version = "v0.7.0-3-gb133f1f", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
IgnoreMapEntries(func(k string, v int) bool { return v < 0 }) makes
cmp.Equal(map[string]int{"a": 1, "b": -1}, map[string]int{"a": 1, "b": -2}) true and
cmp.Equal(map[string]int{}, map[string]int{"b": -2}) true. Add
SortMaps(func(a, b string) bool { return a < b }) and both are false: the Diff shows
`Inverse(cmpopts.SortMaps, []struct{ K string; V int }{ ... - V: -1, + V: -2 })`.

IgnoreMapEntries is a path filter that looks for a cmp.MapIndex as the last step
(cmpopts/ignore.go), while SortMaps is a Transformer that turns the map into a sorted
[]struct{K, V} before any entry is visited (cmpopts/sort.go), so the flattened entries are
reached through SliceIndex and StructField steps and the discard function is never called.
Neither option's documentation says they exclude each other: SortMaps is documented to keep
the other options usable ("Flattening the map into a slice has the property that cmp.Equal is
able to use cmp.Comparer options on K"), and IgnoreMapEntries to ignore entries "of map[K]V".
The same happens with IgnoreSliceElements: it keeps working under SortSlices because the
sorted slice still has SliceIndex steps, which is what a user of SortMaps would expect of
IgnoreMapEntries.

Found by the options property, which combines the cmpopts options at random over one document
type and checks Equal against the documented meaning of each.
'''

[[bug]]
id = "go-cmp/2"
title = "SortSlices makes a nil slice equal to a non-nil slice whose elements are ignored, depending on that slice's order"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinSortSlicesNilSlice"
found = { commit = "b133f1f1932e48f466f597a3346ce6f5a49a0dc1", version = "v0.7.0-3-gb133f1f", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With IgnoreSliceElements(func(s string) bool { return strings.HasPrefix(s, "x") }) and
SortSlices(func(a, b string) bool { return a < b }):

    cmp.Equal([]string(nil), []string{"x1", "x2"})  = false
    cmp.Equal([]string(nil), []string{"x2", "x1"})  = true

The documented rule is "Slices are equal if they are both nil or both non-nil", and the two
results differ only in the order of the non-nil slice, which SortSlices exists to make
irrelevant. The cause is in cmpopts/sort.go: sliceSorter.filter applies the transform only
when one of the slices is unsorted, and sliceSorter.sort builds its output with
reflect.MakeSlice, so a nil input comes out as an empty non-nil slice. In the sorted case no
transform runs and the nil rule decides; in the unsorted case both slices are non-nil after
the transform, the ignored elements are dropped and the remainders are both empty. The same
happens with IgnoreTypes("") in place of IgnoreSliceElements. (SortMaps has the same
MakeSlice, but a nil map flattened to an empty slice against a non-empty one is unequal for
the length, so it does not show there.)

Found by the options property once SortSlices and an element ignore were combined.
'''
