# Bugs found in github.com/gin-gonic/gin by the Hegel properties. Each has a pin test
# (TestHegelPin...) that asserts the documented behaviour and is listed as an expected failure in
# target.toml.

[[bug]]
id = "gin/1"
title = "A static route one slash away from the request shadows a matching :param route"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTrailingSlashShadowsParam"
found = { commit = "73726dc606796a025971fe451f0aa6f1b9b847f6", version = "v1.12.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Routes /b/ and /:name: GET /b is a 404 (or, with RedirectTrailingSlash, a 301 to /b/) instead of
being served by /:name with name = "b". Routes /a/b and /:p/b/: GET /a/b/ is a 404 instead of
p = "a". getValue (tree.go) walks the static child first and remembers the node's :param child
in skippedNodes to roll back to when the static branch fails; but when the branch ends where a
trailing-slash redirect could be recommended (the path left is exactly "/", or is one "/" short
of a route with a handler), it sets value.tsr and returns without rolling back. The README says
static routes are matched "before" params, not instead of them, and the static route does not
match the request at all here. With RedirectFixedPath, the case-insensitive lookup (which does
backtrack) can find the very path requested and the engine redirects the request to itself.
Found by TestHegelMatch.
"""

[[bug]]
id = "gin/2"
title = "A :param branch that dead-ends is not abandoned for the wildcard sibling of an earlier node"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinParamDeadEnd"
found = { commit = "73726dc606796a025971fe451f0aa6f1b9b847f6", version = "v1.12.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Routes /a/:x and /:p/b/c: GET /a/b/c is a 404 instead of being served by /:p/b/c with p = "a".
Routes /a/:x/ and /:p/b: GET /a/b is a 404. The param case of getValue (tree.go) returns when
the param node has no children and path remains ("... but we can't"), and when the path ends at
a param that has no handler, without consulting skippedNodes: only a static mismatch rolls back
to the :param child of an earlier node. With RedirectFixedPath on, GET /a/b/c with the first
pair of routes is a 301 to /a/b/c itself (the case-insensitive lookup backtracks and finds the
route): a redirect loop. Found by TestHegelMatch.
"""

[[bug]]
id = "gin/3"
title = "RedirectTrailingSlash redirects a path ending in a slash to a path that has no route"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTrailingSlashRedirectToNothing"
found = { commit = "73726dc606796a025971fe451f0aa6f1b9b847f6", version = "v1.12.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Route /:a/:b: GET /id/ is a 301 to /id, which is a 404. Routes /x/:p and /xy: GET /x/ is a 301
to /x, a 404. Route /c/0/abc:p: GET /c/0/abc/ is a 301 to /c/0/abc, a 404. The option is
documented to redirect when "a handler for the path with (without) the trailing slash exists".
getValue (tree.go) sets value.tsr = true whenever the path left is exactly "/" at a node other
than the root ("path == "/" && n.wildChild && n.nType != root", "path == "/" && n.nType ==
static", and the fall-through "value.tsr = path == "/" || ..."), and when an empty :param value
is followed by "/" ("value.tsr = len(path) == end+1"), without checking that the node before
has a handler. A 301 is cached by browsers, so the bad redirect sticks. Found by
TestHegelEngine.
"""

[[bug]]
id = "gin/4"
title = "RedirectFixedPath never finds a route whose *catch-all follows a :param"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFixedPathAfterParam"
found = { commit = "73726dc606796a025971fe451f0aa6f1b9b847f6", version = "v1.12.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Route /a/:q/*rest with RedirectFixedPath: GET /A/x/y is a 404 instead of a 301 to /a/x/y; route
/A/user_/:q/*rest: GET /A/USER_/B0/ is a 404 while /A/user_/B0/ is served. Routes with a
catch-all after static text (/a/b/*rest) and mixed segments (/a/b:q) are found. insertChild
(tree.go) hangs the catch-all of a :param off an intermediate node with an empty path and the
index "/"; findCaseInsensitivePathRec reads the next rune of the path from oldPath[npLen-off]
for off < min(npLen, 3) only, which for npLen == 0 reads nothing (rune 0), so the "/" child is
never taken; and when the path ends at the param, it only accepts a child whose path is "/",
where getValue also accepts the empty node with the index "/". Found by TestHegelEngine.
"""

[[bug]]
id = "gin/5"
title = "UseRawPath with UnescapePathValues turns a plus in a path value into a space"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPlusInRawPath"
found = { commit = "73726dc606796a025971fe451f0aa6f1b9b847f6", version = "v1.12.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Route /:p, UseRawPath and UnescapePathValues on: GET /a+b%2Fc gives p = "a b/c" instead of
"a+b/c". getValue (tree.go) unescapes :param and *catch-all values with url.QueryUnescape,
which decodes "+" as a space (a form-encoding rule), where a path segment wants
url.PathUnescape. The option is documented as "the path value will be unescaped". Noticed while
modelling the option for TestHegelEngine (the model reproduces the QueryUnescape behaviour).
"""

[[bug]]
id = "gin/6"
title = "RedirectFixedPath redirects a path ending in a slash to a path that has no route"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFixedPathRedirectToNothing"
found = { commit = "73726dc606796a025971fe451f0aa6f1b9b847f6", version = "v1.12.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Route /a/:p/b with RedirectFixedPath: GET /A/x/ (and /a/x/) is a 301 to /a/x, which is a 404.
The option is documented to redirect "if a handle can be found" for the fixed path.
findCaseInsensitivePathRec (tree.go) with fixTrailingSlash returns the path built so far
whenever the path left is exactly "/" at a node it cannot enter ("if path == "/" { return
ciPath }"), and for an empty :param value followed by "/", without checking for a handler: the
same rule as gin/3 in the case-insensitive walk. Found by TestHegelEngine.
"""

[[bug]]
id = "gin/7"
title = "The skipped-nodes stack is not reset between the method trees of one request: wrong 405 and a panic"
kind = "crash"
severity = "high"
test = "TestHegelPinSkippedNodesLeak"
found = { commit = "73726dc606796a025971fe451f0aa6f1b9b847f6", version = "v1.12.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = "https://github.com/gin-gonic/gin/issues/4818"
fixed_in = ""
notes = """
Routes GET /:name/*rest, GET /c/:p and POST /x with HandleMethodNotAllowed: GET /c/a/b is a
405 with "Allow: POST" although POST /c/a/b itself is a 404. Routes /a/b/ and /a/:x on four or
more methods: GET /a/b panics with "slice bounds out of range [:4] with capacity 3" (an engine
from gin.Default() turns it into a 500 through Recovery). getValue (tree.go) pushes the nodes
it may roll back to onto c.skippedNodes, a stack with room for engine.maxSections entries, and
pops them only when it rolls back; a lookup that stops (a match, or the stops of gin/1 and
gin/2) leaves its entries. The HandleMethodNotAllowed loop then calls getValue on every other
tree with the same stack: a failure there pops a leaked entry and continues the walk in the
first tree's node, so a route of the request's own method counts as the other method's; and
each tree's leftovers accumulate until a push exceeds the capacity. Fixed upstream two days
before this pin by 3b08cd7 (2026-09-19, PR #4819, issue #4818), which resets the stack on entry
to getValue. Found by TestHegelEngine.
"""
