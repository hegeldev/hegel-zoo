# 15 and fail naming the bug they hit; HEGEL_NO_KNOWN=1 filters the shaped requests out. The
# wide ones are mapped to their plurality basin over forty rounds at a hundred cases; the
# narrow ones fail every run. TestHegelRouteOrder and TestHegelCleanPath pass (no bug lives
# there). The binding properties (part 2) still gate their bugs in the model.
# Forty rounds at a hundred cases (2026-10-11): Match 14/40 fail (gin/1 11, gin/2 3); Engine
# 38/40 (gin/3 21, gin/1 9, gin/6 5, gin/4 2, gin/2 1); the ten narrow 40/40 on their bugs.
