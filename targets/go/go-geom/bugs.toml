[[bug]]
id = "go-geom/1"
title = "Bounds.Extend panics on a GeometryCollection, so GeometryCollection.Bounds and the GeoJSON bbox option panic on a nested collection"
kind = "panic"
severity = "medium"
test = "TestHegelPinNestedCollectionBounds"
found = { commit = "158e26b4004b594f069a6e9fca2216331d1dfb6b", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
notes = '''
`Bounds.Extend(g)` calls `g.FlatCoords()`, which `GeometryCollection` implements
by panicking ("FlatCoords() called on a GeometryCollection"). `GeometryCollection.Bounds`
extends a fresh Bounds with each member, so a collection that contains a collection —
which WKT, WKB, EWKB and GeoJSON all write and read back — panics in `Bounds()`:

    inner := geom.NewGeometryCollection().MustPush(geom.NewPointFlat(geom.XY, []float64{1, 2}))
    geom.NewGeometryCollection().MustPush(inner).Bounds()   // panic

`geojson.Marshal(g, geojson.EncodeGeometryWithBBox())` panics the same way for such a
geometry, and so does `geom.NewBounds(geom.XY).Extend(inner)` directly. The fix is a
recursion in Extend (or a Bounds-based path) for collections.
'''

[[bug]]
id = "go-geom/2"
title = "geojson.Marshal writes an empty MultiPoint member as a null position, and geojson.Unmarshal rejects the text when the null comes first"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinGeoJSONEmptyFirstMultiPoint"
found = { commit = "158e26b4004b594f069a6e9fca2216331d1dfb6b", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
notes = '''
A MultiPoint may hold empty members (`MULTIPOINT (EMPTY, 1 2)`; `Coords()` returns a
nil entry for them). `geojson.Marshal` encodes the nil entry as `null`:

    {"type":"MultiPoint","coordinates":[null,[1,2]]}

which is not a GeoJSON position (RFC 7946 has no empty position), and `geojson.Unmarshal`
of that text fails with "geojson: dimensionality too low (0)" because the layout is
guessed from the first position. With the empty member second
(`[[1,2],null]`) the text decodes, to a MultiPoint with an empty second member. Either
the empty members should be dropped on output (the only faithful GeoJSON) or the
decoder should skip nulls in every position.
'''

[[bug]]
id = "go-geom/3"
title = "geojson.Unmarshal takes the layout from the first part, so a MultiLineString, MultiPolygon or Polygon whose first part is empty and whose others have Z or M fails with a stride mismatch"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinGeoJSONEmptyFirstLineString"
found = { commit = "158e26b4004b594f069a6e9fca2216331d1dfb6b", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
notes = '''
`geojson.Marshal` of an XYZ MultiLineString whose first line is empty writes

    {"type":"MultiLineString","coordinates":[[],[[1,2,3],[4,5,6]]]}

and `geojson.Unmarshal` of it fails with "geom: stride mismatch, got 3, want 2":
`guessLayout` looks at `coordinates[0]`, finds no position, falls back to the default
XY layout, and the three-dimensional second line then mismatches. With the empty line
second the same geometry decodes. The same happens for a MultiPolygon whose first
polygon is empty (`[[],[[[1,2,3],...]]]`) and for a Polygon whose first ring is empty.
The layout should come from the first non-empty part.
'''

[[bug]]
id = "go-geom/4"
title = "wkt.Marshal writes a collection of mixed layouts as text wkt.Unmarshal rejects"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinWKTMixedLayoutCollection"
found = { commit = "158e26b4004b594f069a6e9fca2216331d1dfb6b", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
notes = '''
`GeometryCollection.Layout()` is the union of its members' layouts, so
`NewGeometryCollection().MustPush(POINT (1 2), POINT Z (1 2 3))` is XYZ and marshals as

    GEOMETRYCOLLECTION Z (POINT (1 2), POINT Z (1 2 3))

which `wkt.Unmarshal` rejects: "mixed dimensionality, parsed layout is XYZ so expecting
3 coords but got 2 coords". Empty members with a suffix are rejected the same way
(`GEOMETRYCOLLECTION ZM (POLYGON M EMPTY)` is written and not read). EWKB and GeoJSON
round-trip the same collection, since each member carries its own type. Marshal should
either refuse the collection (as it does for NoLayout: "unsupported layout") or write
members the parser accepts.
'''

[[bug]]
id = "go-geom/5"
title = "xy.ConvexHull of three or more points with fewer than three distinct ones returns coordinates that are not in the input"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinConvexHullFewDistinctPoints"
found = { commit = "158e26b4004b594f069a6e9fca2216331d1dfb6b", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
notes = '''
`getConvexHull` returns a Point or LineString for one or two input points, and for three
or more removes duplicates with `transform.UniqueCoords` and hands the result straight to
`grahamScan`, which pushes the first three coordinates of the array. With one or two
distinct points the array is shorter than that and the scan reads past it:

    xy.ConvexHullFlat(geom.XY, []float64{-5, -5, -5, -5, -5, -5})   // LINESTRING (-5 -5, 0 0)
    xy.ConvexHullFlat(geom.XY, []float64{-5, -5, 3, -8, 3, -8})     // POLYGON ((3 -8, -5 -5, 0 0, 3 -8))

The origin is not in the input. The hull of the first is the point, of the second the
segment. JTS pads the unique array to three entries (`padArray3`, which go-geom has but
uses only after the octant-ring reduction) before the scan.
'''

[[bug]]
id = "go-geom/6"
title = "xy.ConvexHull of more than 50 points misses extreme points: the octant ring used to discard interior points is not closed"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinConvexHullDropsExtremePoints"
found = { commit = "158e26b4004b594f069a6e9fca2216331d1dfb6b", version = "v1.6.1+", hegel = "v0.6.33", date = "2026-09-17" }
status = "open"
notes = '''
For more than 50 input points `reduce` keeps only the eight octant-extreme points and the
points not `IsPointInRing` of the ring they form. `computeOctRing` returns those eight
points de-duplicated but does not repeat the first at the end (JTS's version calls
`closeRing()`), so the ring passed to `IsPointInRing` lacks the edge from the last octant
point (minimum x+y) back to the first (minimum x). Ray crossing then counts points beyond
that missing edge as inside, they are discarded, and the hull misses them. In the pin's
55-point set the point (-12, -2) lies outside the returned hull

    POLYGON ((4 -12, -11 -10, -12 4, -8 9, 10 12, 12 12, 12 -5, 11 -10, 10 -11, 4 -12))

between (-11, -10) and (-12, 4), exactly the unclosed edge. Random sets of 51 to 60 small
integer points miss an extreme point in roughly one case in thirty.
'''
