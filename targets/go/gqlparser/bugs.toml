# Bugs found in vektah/gqlparser (v2.5.37+) by the Hegel zoo. One [[bug]] per finding; `test`
# names the plain Go test in hegel_pins_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracle: Python graphql-core 3.2.12 (the port of graphql-js)
# as a child process, parsing the same executable documents, building the same SDL and validating
# the same queries. The readme states the target: the September 2025 spec, based on graphql-js
# v16.13.2 - every entry below is rejected or handled differently by graphql-js 16. graphql-core's
# own leniencies (control characters inside strings and comments, `1e400` as a Float literal,
# custom directive argument values and null for non-null directive arguments in SDL, a directive
# definition using itself, `scalar String` redeclared) and gqlparser's prelude `@defer` directive
# are not judged. No AI policy in the readme (checked 2026-09-19).

[[bug]]
id = "gqlparser/1"
title = "A lone surrogate escape in a string literal is accepted and becomes U+FFFD"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLoneSurrogateEscape"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{ a(x: "\uD83D") }` parses with the string value U+FFFD; the spec (EscapedUnicode, since October 2021) requires a syntax error for a surrogate code point that is not part of a pair, and graphql-js reports "Invalid Unicode escape sequence". lexer/lexer.go readString decodes the four hex digits and writes the rune without checking the surrogate range. Found by TestHegelParseAgreesWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/2"
title = "The variable-width unicode escape u{1F600} in a string literal is rejected"
kind = "contract"
severity = "low"
test = "TestHegelPinBraceUnicodeEscape"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{ a(x: "\u{41}") }` fails with "Unexpected <Invalid>"; the October 2021 spec's EscapedUnicode accepts `\u{` HexDigit+ `}` (one to six hex digits, any code point up to U+10FFFF) and graphql-js parses it as "A". readString only knows the fixed four-digit form. Found by TestHegelParseAgreesWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/3"
title = "A block string closed by four quotes keeps the extra quote in its value instead of failing"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBlockStringFourQuotes"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readBlockString counts a run of quotes and uses the last three as the closing delimiter, so `"""a""""` parses as the block string `a"` and `"""a"""""` as `a""`. The spec closes a block string at the first `"""`, and graphql-js then fails on the unterminated string that follows ("Unterminated string"). Found by TestHegelParseAgreesWithGraphQLCore (and by the validation property, through a block string ending in quotes).
'''

[[bug]]
id = "gqlparser/4"
title = "A surrogate pair escape uD83D uDE00 in a string literal becomes two U+FFFD instead of one code point"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSurrogatePairEscape"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The spec's EscapedUnicode combines a leading and a trailing surrogate escape into one code point (the JSON-style way of writing characters beyond the BMP), so the pair of escapes for U+D83D and U+DE00 (as in the pin) is the string U+1F600; readString writes each half as its own rune, and Go's string conversion turns each into U+FFFD. Any client writing non-BMP characters as escapes gets replacement characters. Found by TestHegelParseAgreesWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/5"
title = "A number immediately followed by a name start is two tokens: [1a] is the list [1, a]"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNumberFollowedByName"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
IntValue and FloatValue carry a lookahead restriction (not followed by a digit, `.` or a NameStart), so `1a`, `0x10` and `1.5_0` are syntax errors ("Invalid number, expected digit but got: 'a'" in graphql-js). readNumber has no lookahead check; in argument position the parser happens to reject the stray name, but inside a list `[1a]` parses as the two values 1 and the enum `a`, and `[0x10]` as 0 and `x10`. Found by TestHegelParseAgreesWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/6"
title = "Directive argument values in SDL are not checked against the argument type: @deprecated(reason: 1)"
kind = "contract"
severity = "low"
test = "TestHegelPinDirectiveArgumentValueInSDL"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
LoadSchema accepts `type Query { a: Int @deprecated(reason: 1) }` and `scalar S @specifiedBy(url: X)`; validator/schema.go validateArgs checks the argument names and nullability but never the value. graphql-js and graphql-core reject the built-in directives' bad values while building the schema (they coerce the deprecation reason and the specifiedBy URL); neither checks custom directives' values, so the pin uses @deprecated. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/7"
title = "Duplicate argument names on a directive in SDL are accepted: @deprecated(reason: x, reason: y)"
kind = "contract"
severity = "low"
test = "TestHegelPinDuplicateDirectiveArgumentInSDL"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Argument names must be unique (the spec's Argument Uniqueness rule applies to directives in type system documents too); graphql-core: "There can be only one argument named 'reason'". The executable-document validator has UniqueArgumentNames; the schema loader has no such check. Found by probing after TestHegelSchemasAgreeWithGraphQLCore's directive shapes.
'''

[[bug]]
id = "gqlparser/8"
title = "Duplicate keys in an object value in SDL are accepted: @d(a: {x: 1, x: 2}), = {x: 1, x: 2}"
kind = "contract"
severity = "low"
test = "TestHegelPinDuplicateInputFieldInSDL"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Input Object Field Uniqueness: graphql-core rejects `directive @d(a: I) on FIELD_DEFINITION type Query { a: Int @d(a: {x: 1, x: 2}) }` with "There can be only one input field named 'x'". LoadSchema keeps both fields, in directive arguments and in default values (`a(i: I = {x: 1, x: 2})`) alike. Found by probing after TestHegelSchemasAgreeWithGraphQLCore's directive shapes, then by the property through default values.
'''

[[bug]]
id = "gqlparser/9"
title = "An object or interface may implement the same interface twice: type T implements I & I"
kind = "contract"
severity = "low"
test = "TestHegelPinDuplicateInterface"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The spec requires the implemented interfaces to be unique; graphql-js: "Type T can only implement I once". validateImplements checks each entry independently. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/10"
title = "An interface may implement itself: interface I implements I"
kind = "contract"
severity = "low"
test = "TestHegelPinInterfaceImplementsItself"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The spec forbids an interface from implementing itself, directly or transitively; graphql-js: "Type I cannot implement itself because it would create a circular reference". LoadSchema accepts `interface I implements I { x: Int }` (and the cycle `interface I implements J`, `interface J implements I`). Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/11"
title = "Extending an undefined type is accepted and defines it: extend type U { x: Int }"
kind = "contract"
severity = "low"
test = "TestHegelPinExtendUndefinedType"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
"The named type must already be defined in order to be extended" (spec, every type extension section); graphql-core: "Cannot extend type 'U' because it is not defined". ValidateSchemaDocument creates a fresh Definition for an extension of an unknown name, so a typo in an `extend` silently defines a new type. Undocumented in the readme; if it is a deliberate leniency for schema stitching it should say so. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/12"
title = "A schema definition may name the same root operation twice: schema { query: Query query: Query }"
kind = "contract"
severity = "low"
test = "TestHegelPinDuplicateRootOperationType"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
graphql-core: "There can be only one query type in schema". ValidateSchemaDocument assigns each entry in turn, the last one winning. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/13"
title = "A schema without a query root operation type is accepted"
kind = "contract"
severity = "low"
test = "TestHegelPinSchemaWithoutQueryRoot"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
"The query root operation type must be provided" (spec 3.3); graphql-core: "Query root type must be provided". `schema { mutation: Mutation } type Mutation { a: Int }` and a document with only `type Mutation` load fine, Schema.Query nil. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/14"
title = "@oneOf input objects may have non-null fields and fields with default values"
kind = "contract"
severity = "low"
test = "TestHegelPinOneOfConstraints"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The prelude declares `directive @oneOf on INPUT_OBJECT` (the readme claims select portions of the Draft) but nothing enforces the OneOf constraints: "OneOf input field I.a must be nullable" and "cannot have a default value" in graphql-core. `input I @oneOf { a: Int! b: Int }` and `input I @oneOf { a: Int = 1 }` load. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/15"
title = "A root operation type that is not an object type is accepted: schema { query: S } scalar S"
kind = "contract"
severity = "low"
test = "TestHegelPinRootTypeNotObject"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Root operation types must be Object types (spec 3.3.1); graphql-core: "Query root type must be Object type, it cannot be S". ValidateSchemaDocument only checks that the named type exists, so a scalar, enum, union or input object may be the query root. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/16"
title = "@deprecated on a required argument or input field is accepted"
kind = "contract"
severity = "low"
test = "TestHegelPinDeprecatedRequiredArgument"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
"The @deprecated directive must not appear on required (non-null without a default) arguments or input object field definitions" (spec 3.13.3); graphql-js: "Required argument Query.a(x:) cannot be deprecated". `type Query { a(x: Int! @deprecated): Int }` and `input I { x: Int! @deprecated }` load. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/17"
title = "Block string dedent counts the first line, so the other lines keep indentation the spec removes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBlockStringFirstLineIndent"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The spec's BlockStringValue() computes the common indent over every line but the first ("If line is the first item in lines, continue"), because the first line starts right after the opening quotes and its indentation is meaningless. lexer/blockstring.go blockStringValue includes it: `"""\ta\n    b"""` has common indent 1 instead of 4 and yields "\ta\n   b" (graphql-js: "\ta\nb"); a description written as `"""Summary\n    detail"""` keeps its indentation, and one whose first line is indented less than the rest dedents too little. Found by TestHegelParseAgreesWithGraphQLCore and TestHegelSchemasAgreeWithGraphQLCore (descriptions).
'''

[[bug]]
id = "gqlparser/18"
title = "An enum value named __x is accepted: enum E { __X }"
kind = "contract"
severity = "low"
test = "TestHegelPinReservedEnumValueName"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Names beginning with two underscores are reserved for introspection everywhere in a type system document; graphql-core: "Name '__X' must not begin with '__'". validateName is applied to types and fields (`type Query { __a: Int }` is rejected) but not to enum values, so `enum E { __X }` and `enum E { __typename }` load. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/19"
title = "A field may define the same argument twice: a(x: Int, x: Int)"
kind = "contract"
severity = "low"
test = "TestHegelPinDuplicateArgumentDefinition"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Argument definitions must have unique names (spec 3.6.1); graphql-core: "Argument 'Query.a(x:)' can only be defined once". Duplicate fields (`type T { x: Int x: Int }`) and duplicate enum values are rejected by LoadSchema, duplicate arguments (on fields, interface fields and directive definitions) are not. Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/20"
title = "A variable in a directive argument on a variable definition is accepted: query ($a: Int @d(x: $b))"
kind = "contract"
severity = "low"
test = "TestHegelPinVariableInConstDirective"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Directives on a variable definition are Directives[Const] (spec 2.10): no variables anywhere in their arguments. graphql-js: Syntax Error: Unexpected variable "$b" in constant value. parseVariableDefinition parses the default value as a constant (`$a: Int = $b` is rejected with Unexpected $) but its directives with parseDirectives(false), so `query ($a: Int @d(x: $b)) { a }` and `query ($a: Int @d(x: {y: $b}))` parse, and the variable survives in the AST. Found by TestHegelParseAgreesWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/21"
title = "An empty object literal passes validation as the value of any type: @skip(if: {})"
kind = "contract"
severity = "medium"
test = "TestHegelPinEmptyObjectForScalar"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ValuesOfCorrectType checks an ObjectValue against the input fields of the expected type (required fields present, `@skip(if: {a: 1})` gives Field "a" is not defined by type "Boolean") but never that the expected type is an input object, so `{}` passes for Boolean, String, Int, ID, enums and custom scalars alike, as a field argument (`user(name: {})`), a directive argument (`@skip(if: {})`) and a variable default (`query ($a: Boolean = {})`); `[{}]` is rejected on the list coercion path. graphql-js: Boolean cannot represent a non boolean value: {}. Found by TestHegelValidationAgreesWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/22"
title = "A non-repeatable directive applied twice to a type definition, or once in the definition and once in an extension, is accepted"
kind = "contract"
severity = "low"
test = "TestHegelPinDuplicateTypeDirective"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Directives Are Unique Per Location (spec 5.7.3) applies to type system documents too; graphql-core: The directive '@d' can only be used once at this location. LoadSchema rejects the duplicate on field, argument, input field and enum value definitions and on the schema definition (The directive d can only be used once at this location), but not on scalar, object, interface, union, enum and input object definitions (`type Query @d @d { a: Int }`, `scalar S @specifiedBy(url: "a") @specifiedBy(url: "b")`), nor when the second application is in an extension (`type T @d { x: Int } extend type T @d`, `schema @d { query: Query } extend schema @d`). Found by TestHegelSchemasAgreeWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/23"
title = "SingleFieldSubscriptions counts distinct field names, not response keys: a: petAdded b: petAdded passes"
kind = "contract"
severity = "low"
test = "TestHegelPinSubscriptionAliases"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Single root field (spec 5.2.3.1) is defined over CollectFields, whose groups are response keys; graphql-js and graphql-core: Anonymous Subscription must select only one top level field. retrieveTopFieldNames dedupes the collected top-level fields by field name, so two aliases of one field, two response keys and two event streams, count as one: `subscription { a: petAdded { __typename } b: petAdded { __typename } }` and `subscription { petAdded { __typename } a: petAdded { __typename } }` validate. Found by TestHegelValidationAgreesWithGraphQLCore.
'''

[[bug]]
id = "gqlparser/24"
title = "OverlappingFieldsCanBeMerged treats any two list, or any two object, argument values as equal"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinListArgumentConflict"
found = { commit = "5d4af164a8588b065c5377f6ae8711edb2b6d110", version = "v2.5.37+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Field Selection Merging (spec 5.3.2) requires the two fields' arguments to be the same values; graphql-js compares the printed (sorted) value nodes: Fields "users" conflict because they have differing arguments. gqlparser's sameValue compares the values' Kind and Raw only; list and object values have an empty Raw and their children are never compared, so `{ users(ids: ["a"]) { id } users(ids: ["b"]) { id } }` and `mutation { setPoint(p: {x: 1, y: 2}) setPoint(p: {x: 1, y: 3}) }` validate (and would have to be merged under one response key at execution), while `users(ids: ["a"]) users(ids: "a")`, of different kinds, is reported. Found by TestHegelValidationAgreesWithGraphQLCore.
'''
