# Bugs found in mattn/go-shellwords by the Hegel zoo. Oracle: bash (`a=( <line> )`).

[[bug]]
id = "go-shellwords/1"
title = "ParseEnv expands and un-escapes after quote removal: '$FOO' is expanded, $FOO\"x\" reads $FOOx"
kind = "wrong-result"
severity = "medium"
test = "TestHegelParseEnvRespectsQuoting"
found = { commit = "f40666af905f541bb142870f2a5d27699ddf5446", version = "v1.0.15", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
With ParseEnv the parser first removes quotes and resolves escapes into a plain token, then
runs replaceEnv over the token, so the quoting context is gone by the time `$` and `\` are
looked at. Consequences, with FOO=bar: `'$FOO'` gives `bar` (a shell gives `$FOO`; single
quotes are supposed to be literal); `$FOO"x"` and `"$FOO"x` give `` (the variable looked up is
FOOx) where a shell gives `barx`; `'a\b'` gives `ab` (the backslash is literal inside single
quotes) and `a\\b` and `"a\\b"` give `ab` because the backslash the parser already un-escaped
is consumed again by replaceEnv (`'a\b'` and `a\\b` are `a\b` without ParseEnv). Only `\$`
is protected (the parser keeps the backslash for replaceEnv on purpose). With ParseBacktick as
well, `$` in a command's output is expanded too. Upstream's TestEnvInQuoted asserts
`"echo \\$FOO"` -> `echo $FOO`, which relies on this double un-escaping, so a fix has to keep
that case working.
'''

[[bug]]
id = "go-shellwords/2"
title = "ParseEnv re-parses expanded words as command lines: metacharacters in a value truncate the line, quoted blanks split, `(` errors"
kind = "wrong-result"
severity = "medium"
test = "TestHegelParseEnvValuesAreNotReparsed"
found = { commit = "f40666af905f541bb142870f2a5d27699ddf5446", version = "v1.0.15", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
Under ParseEnv a token whose last piece is unquoted is, after expansion, handed to a fresh
Parser (ParseEnv/ParseBacktick off) and its words appended. That re-parse treats the expanded
text as syntax: with FOO=`a;b`, `$FOO` gives just `a` and `x$FOO z` gives `xa` (everything after
the `;` is silently dropped, including later words of the original line); FOO=`x|y`, `x&y`,
`a>b` likewise; FOO=`a(b` fails with "invalid command line string". The word itself suffers
too: `a\;b` gives `a` and `2\>x` gives nothing (the escaped metacharacter comes back to life;
without ParseEnv both are right), `` \` `` is an error (the re-parse tracks backtick pairs even
with ParseBacktick off), `'a b'x` gives `a`, `bx` because the quoted blank is split — while
`${FOO}"x"` with FOO=`a b` is *not* split (the last piece is quoted, so the whole token skips
the re-parse) where a shell gives `a`, `bx` — and `""$UNSET` gives no word at all where a shell
keeps the empty word the quotes made. Upstream's TestEnvArgumentsFail
asserts that FOO=`bar '` makes `$FOO` an error, so quotes in values being interpreted is
intended; the metacharacter truncation and the split/no-split decisions are consequences of the
same design that no test covers. A shell field-splits an unquoted expansion on IFS blanks only.
'''

[[bug]]
id = "go-shellwords/3"
title = "ParseBacktick leaves command substitutions inside double quotes as literal text"
kind = "wrong-result"
severity = "low"
test = "TestHegelParseBacktickExpandsInsideDoubleQuotes"
found = { commit = "f40666af905f541bb142870f2a5d27699ddf5446", version = "v1.0.15", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
`"$(printf x)"` and "`printf x`" (in double quotes) parse to the text `$(printf x)` and
`` `printf x` `` with ParseBacktick on; a shell runs the command and gives `x`, keeping the
output as one word. Both the backtick and the `(` cases are guarded by `!doubleQuoted`, so the
substitution is only recognised unquoted — unlike `$NAME`, which ParseEnv does expand inside
double quotes (TestEnvInQuoted). Quoting a substitution is the standard way to keep its output
as one word, so users get the literal text where they expect the output.
'''

[[bug]]
id = "go-shellwords/4"
title = "ParseBacktick keeps a substitution's output as one word, whatever whitespace it contains"
kind = "wrong-result"
severity = "low"
test = "TestHegelParseBacktickSplitsCommandOutput"
found = { commit = "f40666af905f541bb142870f2a5d27699ddf5446", version = "v1.0.15", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
The output of an unquoted `` `cmd` `` or `$(cmd)` is TrimSpace'd and spliced into the current
word: `` a`printf '%s ' b c`d `` gives one word `ab cd`, `$(printf 'x  y')` gives `x  y`,
`` `printf 'p\nq'` `` gives `p\nq`. A shell field-splits an unquoted substitution and gives
`ab`, `c`, `d` / `x`, `y` / `p`, `q`. Empty output correctly produces no word (upstream's
TestEmptySubstitution). Combined with /3 there is no way to get either shell behaviour: unquoted
output is never split and quoted output is never substituted. Trailing newlines are stripped as
a shell does; leading whitespace is stripped too, which a shell would not do for a quoted
substitution but which is invisible for an unquoted one.
'''

[[bug]]
id = "go-shellwords/5"
title = "ParseEnv variable names accept any Unicode letter or digit, so `$é` disappears"
kind = "wrong-result"
severity = "low"
test = "TestHegelVariableNamesFollowTheShell"
found = { commit = "f40666af905f541bb142870f2a5d27699ddf5446", version = "v1.0.15", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
replaceEnv reads a name as a run of unicode.IsLetter/unicode.IsDigit/`_` characters, so `$é`,
`a$日本` and `"$é"` look up variables named `é`/`日本` and, finding nothing, give an empty word
(or no word). A shell's names are `[A-Za-z_][A-Za-z0-9_]*`; `$é` is the literal text `$é`
and `$1x` is the first positional parameter followed by `x` (go-shellwords looks up `1x`).
Since environment variable names are ASCII identifiers in practice, a `$` in front of
non-ASCII text (prices, currency symbols followed by words) is far more likely to be literal
text than a variable. Upstream's TestEnvBareDollar only checks `$@x` stays literal.
'''

[[bug]]
id = "go-shellwords/6"
title = "ParseBacktick rejects `\\\\$(cmd)`: the escaped-dollar check reads the buffer after un-escaping"
kind = "wrong-result"
severity = "low"
test = "TestHegelEscapedBackslashBeforeSubstitution"
found = { commit = "f40666af905f541bb142870f2a5d27699ddf5446", version = "v1.0.15", hegel = "v0.6.33", date = "2026-09-14" }
status = "open"
notes = '''
On `(` the parser decides whether it opens a `$(…)` by looking at the buffer: the previous byte
must be `$` and the one before it must not be `\`. The buffer holds un-escaped text, so after
`\\` (an escaped backslash, one `\` in the buffer) followed by `$(`, the `$` is taken as escaped
and the `(` as a stray parenthesis: `\\$(printf x)`, `a\\$(printf %s y)b` and `"\\"$(printf x)`
all fail with "invalid command line string" where a shell gives `\x`, `a\yb`, `\x`. (The same
inputs parse fine with ParseBacktick off, and `\\` followed by a backtick substitution works.)
The right test is whether the `$` itself was escaped, which the escape branch knows and which
ParseEnv already records by keeping `\$` in the buffer.
'''
