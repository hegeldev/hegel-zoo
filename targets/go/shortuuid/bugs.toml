# Bugs found in lithammer/shortuuid by the Hegel zoo. Schema: see the zoo's README.

[[bug]]
id = "shortuuid/1"
title = "NewEncoder accepts an alphabet that is not valid UTF-8: each invalid byte becomes U+FFFD, which then appears in encodings"
kind = "contract"
severity = "low"
test = "TestHegelPinAlphabetRejectsInvalidUTF8"
found = { commit = "5cb5511e44174959c8bb18d13b67ef8cca52adb1", version = "v5.0.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
newAlphabet converts the alphabet with []rune(s): every byte that is not valid UTF-8 becomes
U+FFFD (one character after deduplication). NewEncoder("\xff\xfeab") thus builds a three-
character alphabet {a, b, U+FFFD} without complaint, and its encodings contain the replacement
character, which the caller never put in the alphabet; NewEncoder("\xff\xfe") panics with
"encoding alphabet must be at least two characters" although two bytes were given. The godoc
says the alphabet is sorted and deduplicated and that fewer than two distinct characters
panic; an alphabet that is not a string of characters should be refused the same way (panic,
as for the short alphabet), not repaired into one with a character of its own. The Python
library, which the package is compatible with, cannot be handed such an alphabet at all.
'''
