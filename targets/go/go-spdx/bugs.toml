[[bug]]
id = "go-spdx/5"
title = "ValidateLicensesOptions are decided from the shape of the string: references, deprecated licenses and complex expressions pass inside an expression or parentheses"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinValidateOptionsApplyInsideExpressions"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
FailAllLicenseRefs "rejects all SPDX license references", FailAllDocumentRefs "rejects all SPDX
document references", FailDeprecatedLicenses "rejects deprecated SPDX license identifiers",
FailComplexExpressions "rejects SPDX license expressions (e.g. MIT AND Apache-2.0)". In
ValidateAndNormalizeLicensesWithOptions the first three are checked only on an input without
spaces (isAtomicLicense) by prefix or list lookup, and the fourth only when the input has a
space; whatever is then parsed is accepted whole. So, with the respective option set,
"MIT OR LicenseRef-x", "(LicenseRef-x)", "MIT OR DocumentRef-d:LicenseRef-x", "GPL-2.0 AND MIT",
"(GPL-2.0)" and "(MIT)AND(ISC)" are all valid. A policy that forbids references or deprecated
identifiers is bypassed by writing them inside an expression; the options should be applied to
the parsed tree (every node for refs and deprecated ids, the root's role for complexity).
'''

[[bug]]
id = "go-spdx/6"
title = "ValidateLicenses rejects valid expressions of the shape X WITH Y without parsing them: MIT+ WITH exception, (MIT WITH exception)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinValidateWithFastPath"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
When the trimmed input has exactly three fields with WITH in the middle
(isLicenseWithException), ValidateAndNormalizeLicensesWithOptions looks the two other fields up
in the license and exception lists and, when either lookup fails, appends the input to the
invalid list and continues - it never falls back to the parser. So "MIT+ WITH
Classpath-exception-2.0" and "Apache-1.0+ WITH LLVM-exception" (a "+" license: neither active
nor deprecated as written), "(MIT WITH Classpath-exception-2.0)" and "(GPL-2.0 WITH
Bison-exception-2.2)" (parentheses stuck to the fields) are reported invalid, while Satisfies
parses every one of them ("GPL-2.0+ WITH Bison-exception-2.2" passes only because "GPL-2.0+"
is itself on the deprecated list). The fast path should fall through to parse() when its
lookups fail, as the atomic fast path does.
'''

[[bug]]
id = "go-spdx/7"
title = "The MIT fast path of Satisfies compares strings only: MIT is not satisfied by MIT+ or by an allowed entry with surrounding spaces"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinSatisfiesMITLikeOthers"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Satisfies returns early for the test expression "MIT" (isMIT): true if some allowed entry
EqualFolds "MIT", otherwise false, without parsing anything. Every other license falls through
to the parser when the fast comparison fails. So Satisfies("MIT", ["MIT+"]) is false while
Satisfies("ISC", ["ISC+"]) is true (a "+" allowed license covers the license itself, node.go
compareEQ), and Satisfies("MIT", ["MIT "]) is false while Satisfies("ISC", ["ISC "]) is true
(the scanner skips spaces). The fast path should only return true early, and fall through
otherwise.
'''

[[bug]]
id = "go-spdx/8"
title = "Satisfies returns true without reporting an invalid entry of the allowed list, against the README"
kind = "contract"
severity = "low"
test = "TestHegelPinSatisfiesValidatesAllowedList"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README, Satisfies: "N.B. If at least one of expressions from allowedList is not a valid SPDX
expression, the call to Satisfies will produce an error." The three fast paths (MIT, atomic
active/deprecated license, license WITH exception) return true as soon as the test expression
is found in the allowed list by case-insensitive comparison, before stringsToNodes parses the
list: Satisfies("MIT", ["MIT", "BOGUS"]), Satisfies("ISC", ["ISC", "BOGUS"]) and
Satisfies("MIT WITH Classpath-exception-2.0", [it, "BOGUS"]) are (true, nil), while
Satisfies("ISC AND MIT", ["ISC", "MIT", "BOGUS"]) is the documented error. Whether the check is
wanted in the fast paths or the README should say "may", the two disagree.
'''

[[bug]]
id = "go-spdx/9"
title = "Identifiers with an -only or -or-later suffix that are not on the list are accepted as the base identifier, and the -or-later rewrite swallows the next character"
kind = "contract"
severity = "low"
test = "TestHegelPinSuffixIdentifiersRejected"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
scan.go normalizeLicense strips "-only" from any identifier and retries the lookup, and
rewrites "-or-later" into "+" for any identifier whose base is a license: "MIT-only" is valid
and normalizes to "MIT", "Apache-2.0-or-later" and "MIT-or-later" to "Apache-2.0+" / "MIT+",
"GPL-2.0-only+" to "GPL-2.0-only+". None is an SPDX identifier: -only and -or-later exist only
as part of specific list entries (GPL, LGPL, AGPL, GFDL), and "Validity of a license is
determined by the SPDX license list" (README). The rewrite also has an off-by-one: it rebuilds
the expression as prefix + "+" + expression[index+1:], dropping the character after
"-or-later", so "(Apache-2.0-or-later) AND MIT" loses its ")" and is invalid ("open parenthesis
does not have a matching close parenthesis") while "Apache-2.0-or-later AND MIT" is valid (the
dropped character is a space there).
'''

[[bug]]
id = "go-spdx/10"
title = "LicenseRef-x WITH exception is a syntax error; the SPDX grammar allows an exception on any simple expression"
kind = "contract"
severity = "low"
test = "TestHegelPinLicenseRefWithException"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SPDX 2.3 Annex D: simple-expression = license-id / license-id"+" / license-ref;
compound-expression = simple-expression / simple-expression "WITH" license-exception-id / ...
so "LicenseRef-x WITH Classpath-exception-2.0" is a valid expression. parse.go handles WITH in
parseLicense only; parseLicenseRef returns the reference node and the WITH token is left over,
which parseTokens reports as "syntax error". ValidateLicenses says invalid, Satisfies errors.
'''

[[bug]]
id = "go-spdx/11"
title = "AND, OR and WITH are matched as prefixes: MIT ANDMIT is MIT AND MIT"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinKeywordsNeedSeparation"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
scan.go readOperator tries strings.HasPrefix for "WITH", "AND", "OR" and takes the match
without checking what follows, so "MIT ANDMIT", "MIT ORISC" and "MIT WITHClasspath-exception-
2.0" tokenize as MIT AND MIT, MIT OR ISC, MIT WITH Classpath-exception-2.0 and are valid;
"ANDMIT" is not an identifier and the input is a typo that should be reported. No SPDX
license or exception identifier starts with AND, OR or WITH, so requiring a space, a
parenthesis or the end after the keyword changes nothing else.
'''

[[bug]]
id = "go-spdx/12"
title = "A lower-case with is accepted by the WITH fast paths only: ValidateLicenses says valid, Satisfies and ExtractLicenses reject it"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinLowercaseWithConsistent"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isLicenseWithException uses strings.EqualFold(parts[1], "WITH"), the scanner matches "WITH"
exactly. So ValidateLicenses(["MIT with Classpath-exception-2.0"]) is valid (normalized "MIT
WITH Classpath-exception-2.0"), ExtractLicenses of the same string fails with "unknown license
'with'", Satisfies("MIT with Classpath-exception-2.0", ["MIT WITH Classpath-exception-2.0"])
is true through the fast path and Satisfies("MIT with Classpath-exception-2.0", ["MIT"]) is
the same "unknown license" error; and an allowed list that ValidateLicenses accepted, ["cddl-
1.0 with 389-exception"], makes Satisfies fail. Operators are case-sensitive in SPDX; the fast
path should compare exactly (or the scanner fold, but the two must agree).
'''

[[bug]]
id = "go-spdx/13"
title = "A deprecated + identifier is normalized to itself when alone and to -or-later inside an expression"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinPlusNormalizationConsistent"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
"GPL-2.0+" is on the deprecated list, so the atomic fast path of
ValidateAndNormalizeLicensesWithOptions returns it unchanged: ["GPL-2.0+"] -> ["GPL-2.0+"]. The
scanner turns the same text into the active "GPL-2.0-or-later" (normalizeLicense, `+` branch),
so ["(GPL-2.0+)"] and ["GPL-2.0+ AND MIT"] normalize to "GPL-2.0-or-later" and
"GPL-2.0-or-later AND MIT", and ExtractLicenses("GPL-2.0+") returns ["GPL-2.0-or-later"]. The
normalized form of one identifier depends on whether it stands alone. The same holds for
GPL-3.0+, LGPL-2.1+, AGPL-3.0+ and the other deprecated "+" entries.
'''

[[bug]]
id = "go-spdx/14"
title = "ExtractLicenses returns the licenses in random order; the README shows a fixed one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinExtractLicensesDeterministic"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ExtractLicenses collects the licenses in a map and returns slices.Collect(maps.Keys(seen)):
Go's map iteration order is random, so two calls with the same expression return different
orders (three orders in thirty calls for a four-license expression). The README's example
asserts `assert.Equal(licenses, []string{"MIT", "Apache-2.0"})`, an order of appearance, which
holds only by chance. Either keep the order of appearance (a slice with a seen-set) or
document that the order is unspecified and sort.
'''

[[bug]]
id = "go-spdx/15"
title = "The second MPL range group (MPL-2.0-no-copyleft-exception) is unreachable: MPL-1.0+ does not cover it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMPLNoCopyleftExceptionInRange"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
spdxlicenses.LicenseRanges has two MPL groups: {MPL-1.0} < {MPL-1.1} < {MPL-2.0} and {MPL-1.0}
< {MPL-1.1} < {MPL-2.0-no-copyleft-exception}, the second existing only to place
MPL-2.0-no-copyleft-exception after MPL-1.1. getLicenseRange returns the first group in which a
license appears, so MPL-1.0 and MPL-1.1 always resolve to the first group and
MPL-2.0-no-copyleft-exception to the second; sameLicenseGroup is false and
Satisfies("MPL-2.0-no-copyleft-exception", ["MPL-1.0+"]) and ["MPL-1.1+"] are false, while
Satisfies("MPL-2.0", ["MPL-1.0+"]) is true. The intent of the table (from spdx-ranges.js) is
not realizable with a first-match lookup; either the comparison must consider every group a
license belongs to, or the entry belongs in the first group's last version set.
'''

[[bug]]
id = "go-spdx/16"
title = "The parser dereferences a nil token when the input ends after ( or a DocumentRef: ValidateLicenses and Satisfies panic"
kind = "crash"
severity = "medium"
test = "TestHegelPinParserDoesNotPanic"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parse.go parseOperator does `token := t.peek(); if token.role == ...` without a nil check, and
parseLicenseRef reads `token.role` after advancing past a DocumentRef and after the ":". When
the token stream ends there, the result is "invalid memory address or nil pointer dereference":
ValidateLicenses(["("]), (["MIT AND ("]), (["MIT OR (ISC AND ("]), (["DocumentRef-x"]),
(["DocumentRef-x:"]), (["MIT OR DocumentRef-x"]) all panic, and so does Satisfies with such a
string in the test expression or in the allowed list. A validator meant to say which inputs
are invalid crashes on truncated input instead. Found by the mutation property.
'''
