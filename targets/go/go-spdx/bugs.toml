status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Bugs 1 and 3 combined: for "MIT OR ((LicenseRef-a OR LicenseRef-b) AND ISC)" the inner OR
expands to nothing (bug 1), mergeTerms with an empty left side returns no terms, and
expandOrTerm indexes `expandAnd()[0]` (bug 3) on the empty slice: "runtime error: index out of
