# Bugs found in github/go-spdx (spdxexp) by the Hegel zoo. Schema: see the zoo's README.

[[bug]]
id = "go-spdx/1"
title = "Satisfies drops a LicenseRef alternative of an OR: false negatives, and a false positive when the OR is under an AND"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSatisfiesLicenseRefInOr"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
expandOrTerm (satisfies.go) appends a term of an OR when `term.isLicense()` or when it is an
expression; a LicenseRef node is neither, so it is silently skipped (expandAndTerm, next to it,
handles `isLicense() || isLicenseRef()`). Consequences: Satisfies("LicenseRef-x OR MIT",
["LicenseRef-x"]) and Satisfies("MIT OR LicenseRef-x", ["LicenseRef-x"]) are false, the
allowed alternative having vanished; and Satisfies("MIT AND (LicenseRef-a OR LicenseRef-b)",
["MIT"]) is TRUE: the OR of references expands to no term at all, mergeTerms then has nothing
to merge on the right and the AND is satisfied by MIT alone, so an expression that requires a
license not on the allowed list passes the check. (With the OR on the left, "(LicenseRef-a OR
LicenseRef-b) AND MIT" with ["MIT", "LicenseRef-a"], the result is false.) The README's own
example set uses LicenseRefs in OR alternatives. In the zoo's generated expressions (at most
four licenses, 15% references) about 5% of Satisfies verdicts differ from the meaning, this
and bugs 2-3 together.
'''

[[bug]]
id = "go-spdx/2"
title = "Satisfies: AND-terms built by appending to a slice with spare capacity all end with the last OR alternative"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSatisfiesAndOfOrKeepsAllTerms"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
appendTerms does `tmp := l; tmp = append(tmp, r...)` for every right-hand term r: when the
left-hand term l has capacity beyond its length, every append writes into the same backing
array and the earlier results are overwritten by the later ones. mergeTerms produces such
terms: append([A, B], C) on a slice of capacity 2 gives length 3, capacity 4. So for
"((MIT AND ISC) AND BSD-3-Clause) AND (Apache-2.0 OR GPL-3.0-only)" the expansion is
[[MIT ISC BSD GPL-3.0-only], [MIT ISC BSD GPL-3.0-only]] and Satisfies with ["MIT", "ISC",
"BSD-3-Clause", "Apache-2.0"] is false (it is true with GPL-3.0-only). The flat form
"(MIT AND ISC AND BSD-3-Clause) AND (...)" happens to work because the right-recursive parse
appends one element at a time to fresh slices. The fix is to copy l before appending
(`tmp := append([]*node(nil), l...)` or slices.Clone). The zoo's generator stays at four
licenses per expression, where no slice has spare capacity.
'''

[[bug]]
id = "go-spdx/3"
title = "Satisfies keeps only the first AND-term of an OR alternative that contains an OR"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSatisfiesOrKeepsAllAndTerms"
found = { commit = "48a80b3018624756145c0898acfa540d060d8acc", version = "v2.7.0", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
expandOrTerm, for an AND term: `left := term.expandAnd()[0]; result = append(result, left)` -
only the first of the AND's expanded terms is kept. When the AND contains an OR, expandAnd
returns several terms (the distribution), and all but the first are lost: Satisfies("MIT OR
((ISC OR BSD-3-Clause) AND Apache-2.0)", ["BSD-3-Clause", "Apache-2.0"]) is false while with
["ISC", "Apache-2.0"] it is true. `result = append(result, term.expandAnd()...)` is what is
meant (expandAndTerm does that for the AND side).
'''

