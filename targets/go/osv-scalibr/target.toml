name = "osv-scalibr"
language = "go"
upstream = "https://github.com/google/osv-scalibr"
subdir = ""
license = "Apache-2.0"  # CONTRIBUTING.md: Google CLA and code review; nothing about AI-written code (checked 2026-09-19)
ai_policy_checked = "2026-09-19"

[base]
commit = "6aec485bbf15d5f04a015617a8653090e332a2b9"
date = "2026-09-17"
version = "v0.5.2+"

[hegel]
version = "v0.9.6"

[run]
# The tests live in semantic/hegel and exercise the semantic package (OSV's version comparators).
# The oracles are the ecosystems' own implementations: python packaging (PyPI; the CI venv has it),
# dpkg --compare-versions (Debian), rpm's rpmvercmp() built from rpm's source into a shared library
# the python oracle loads (Red Hat), ruby's Gem::Version (RubyGems), node-semver (npm; installed
# under semantic/hegel, which its .gitignore keeps out of the patch), Maven's ComparableVersion
# (maven-artifact from Maven Central, with a small Java driver compiled here), and
# golang.org/x/mod/semver in process (Go).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix semantic/hegel semver@7.8.5",
  "curl -sSL -o semantic/hegel/maven-artifact.jar https://repo1.maven.org/maven2/org/apache/maven/maven-artifact/3.9.11/maven-artifact-3.9.11.jar",
  "javac -cp semantic/hegel/maven-artifact.jar -d semantic/hegel semantic/hegel/MavenOracle.java",
  "curl -sSL -o semantic/hegel/rpmshim/rpmvercmp.c https://raw.githubusercontent.com/rpm-software-management/rpm/rpm-4.20.1-release/rpmio/rpmvercmp.c",
  "gcc -shared -fPIC -I semantic/hegel/rpmshim -o semantic/hegel/librpmvercmp.so semantic/hegel/rpmshim/rpmvercmp.c",
]
command = "go test -count=1 -run TestHegel -v ./semantic/hegel/"

[expected_failures]
TestHegelPinRubyGemsWhitespaceIsStripped = "osv-scalibr/1"
TestHegelPinRubyGemsHyphenIsPre = "osv-scalibr/2"
TestHegelPinMavenDotQualifierIsHyphen = "osv-scalibr/3"
TestHegelPinMavenNullBeforeSublistNests = "osv-scalibr/4"
TestHegelPinRedHatReleaseStartsAtLastHyphen = "osv-scalibr/5"
TestHegelPinAlpineCompareIsTransitive = "osv-scalibr/6"
TestHegelPinRubyGemsLeadingZerosAreZero = "osv-scalibr/7"
TestHegelPinMavenZeroIsARelease = "osv-scalibr/8"
TestHegelPinRedHatEmptyComponentFollowsRpmvercmp = "osv-scalibr/9"
TestHegelPinAlpineMissingComponentOrder = "osv-scalibr/10"
