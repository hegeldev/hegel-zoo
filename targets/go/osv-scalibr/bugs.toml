[[bug]]
id = "osv-scalibr/1"
title = "semantic: RubyGems versions with surrounding whitespace are not stripped, so 1.0 followed by a tab sorts above 1.0 and a version with a leading space below everything"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRubyGemsWhitespaceIsStripped"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Gem::Version#initialize strips the string (`version.to_s.strip`) and Gem::Version.correct? allows
surrounding whitespace, so "1.10\t" == "1.10" and " 30" > "5.9" in RubyGems. ParseRubyGemsVersion
runs canonicalizeRubyGemVersion on the string as given: the tab becomes a non-digit segment ("1.10"
then "\t"), which as a build segment makes "1.10\t" > "1.10"; a leading space makes the whole
version a build-only version (" 30" canonicalizes to " .30", whose first segment is not a number, so
every following segment is a build segment), which sorts below any numeric version. Found with
ruby 3.2.3 / rubygems 3.4.20 as the oracle.
'''

[[bug]]
id = "osv-scalibr/2"
title = "semantic: a hyphen in a RubyGems version is kept as a segment instead of reading as .pre., so 1.0-1 is not 1.0.pre.1 and sorts below 1.0.a"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRubyGemsHyphenIsPre"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Gem::Version#initialize replaces "-" with ".pre." (the semver-style prerelease hyphen), so
Gem::Version.new("1.0-1") is "1.0.pre.1", equal to it and above "1.0.a" ("pre" > "a" as strings).
canonicalizeRubyGemVersion has no such rule: "1.0-1" becomes the segments 1, 0, "-", 1 and the
"-" segment compares as a string against "pre" or "a" ("-" < "a"), so semantic gives
"1.0-1" < "1.0.pre.1" and "1.0-1" < "1.0.a". Pairs of versions that both use hyphens compare alike
on both sides, which is why the property found it only against generated ".pre" forms.
'''

[[bug]]
id = "osv-scalibr/3"
title = "semantic: a Maven qualifier introduced by a dot and followed by a digit or the end is not read as introduced by a hyphen (Maven 3.8.7/3.9.0, MNG-7644), so 2.0.alpha is not 2-alpha and 1.0.0.rc1 is not below 1.0.0-rc2"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMavenDotQualifierIsHyphen"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Since MNG-7644 (Maven 3.8.7 and 3.9.0, December 2022) ComparableVersion.parseVersion treats a
string qualifier that follows a dot as if it followed a hyphen whenever the qualifier is followed
by a digit or ends the version ("1.0.0.X1 < 1.0.0-X2 for any string X", and "2.0.X == 2-X ==
2.0.0.X"; its test testMng7644 has these). semantic's Maven tokens carry their prefix and order
"." qualifiers below "-" qualifiers (qualifierOrder), so it gives "2.0.alpha" > "2-alpha" where
Maven 3.9.11 gives equality, and "1.0.x." == "1.0.x" (the trailing dot's empty token is trimmed)
where Maven gives "1.0.x." < "1.0.x" (the trailing dot keeps the qualifier a plain string item, the
end-of-version form becomes a sub-list). The generated-versions test data of the package was
written for the pre-3.8.7 rule. Oracle: maven-artifact 3.9.11 (3.8.8 agrees).
'''

[[bug]]
id = "osv-scalibr/4"
title = "semantic: Maven drops a null item (0, empty, ga/final/release) that precedes a sub-list too, nesting the sub-list one level deeper, so 1-0-1 and 1-ga-1 sort below 1-1; semantic equates them"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMavenNullBeforeSublistNests"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ComparableVersion.ListItem.normalize walks a list from the end, removing null items (0, "", and
the qualifiers ga/final/release which alias to "") and continuing past sub-lists ("else if
(!(lastItem instanceof ListItem)) break"). So in "1-0-1" the sub-list [0, [1]] loses its 0 and
becomes [[1]], and [1, [[1]]] compared with "1-1" = [1, [1]] puts a list against the integer 1
(ListItem.compareTo(INT_ITEM) is -1): Maven 3.9.11 and 3.8.8 both give "1-0-1" < "1-1" and
"1-ga-1" < "1-1" (getCanonical of both is "1-1", but the comparison is on the item trees). The
same happens without a hyphen when a letter/digit transition opens the sub-list: "final4" is [[4]]
and sorts above "fina4l"; "1.0.al1" loses its 0 and equals "1.al1"; "0.al10pha" loses its leading 0.
semantic's newMavenVersion trims null tokens only at the end of each hyphen-delimited run
(shouldTrim in the loop over tokens), so it equates "1-0-1", "1-ga-1" and "1-1" - its own test
data asserts "1-1 = 1-ga-1", which Maven does not hold - and gives "1.0.al1" > "1.al1".
'''

[[bug]]
id = "osv-scalibr/5"
title = "semantic: a Red Hat version with two hyphens is split into version and release at the first, rpm splits at the last, so 1.0-1-2 equals 1.0-1.2 instead of sorting above it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRedHatReleaseStartsAtLastHyphen"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
rpm's parseEVR (rpmio/rpmver.c) finds the release with strrchr(evr, '-'): everything after the
last hyphen. ParseRedHatVersion uses strings.Cut(vr, "-"), the first hyphen. For "1.0-1-2" rpm has
version "1.0-1" and release "2", semantic version "1.0" and release "-1-2"; against "1.0-1.2" (rpm:
"1.0" / "1.2"; semantic: "1.0" / "-1.2") rpm compares the versions "1.0-1" vs "1.0" and gives 1,
while semantic compares the releases "-1-2" vs "-1.2", both the segments 1, 2, and gives 0. Oracle:
rpmvercmp() of rpm 4.20.1 compiled from source, with parseEVR's split.
'''

[[bug]]
id = "osv-scalibr/6"
title = "semantic: Alpine Compare is not transitive once a version apk would reject is involved: two invalid versions compare as strings, an invalid and a valid one by components"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAlpineCompareIsTransitive"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ParseAlpineVersion marks a version invalid when something other than "-r<digits>" remains after the
numbers, letter, suffixes and hash, and AlpineVersion.compare then has two orders: both invalid ->
strings.Compare of the originals; otherwise the component comparison, with the remainder as the
last key. The two orders are not consistent with each other: "=3" (invalid, no components) <
"10_beta1" (valid) by components, "10_beta1" < "10beta1" (invalid: letter b, remainder "eta1") by
the letter, but "=3" vs "10beta1" is decided by strings.Compare, where '=' (0x3D) > '1' (0x31), so
"=3" > "10beta1". A sort of such versions depends on the order of comparisons. Either invalid
versions should be an error (as apk_version_validate would say) or one order should apply.
'''

[[bug]]
id = "osv-scalibr/7"
title = "semantic: a RubyGems numeric segment with leading zeros is not stripped as a trailing zero, so 1.00.a sorts above 1.a and 00.0b above 0.0b"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRubyGemsLeadingZerosAreZero"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Gem::Version#canonical_segments converts numeric segments to integers and drops trailing zeros of
each numeric run, so "1.00.a" is [1, "a"] == "1.a" and "00.0b" is ["b"] == "0.0b". semantic's
removeZeros compares the segment strings with "0", so "00" survives as a numeric segment; against
the string segment "a" (or "b") of the other version a number wins (compareRubyGemsComponents:
"aErr == nil -> +1"), so "1.00.a" > "1.a" and "00.0b" > "0.0b". The empty string has the same
shape: Gem::Version.new("") is "0", semantic's canonicalize gives one empty build segment.
'''

[[bug]]
id = "osv-scalibr/8"
title = "semantic: a Maven version made of zeros (0, 0.0) keeps its first zero token, so an unknown qualifier alone (latest, sp) sorts below it where Maven sorts it above"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMavenZeroIsARelease"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Maven normalizes "0" and "0.0" to an empty item list, and a qualifier compared with nothing is
compared with the release: known pre-release qualifiers (alpha, beta, rc, snapshot) sort below it,
"sp" and unknown qualifiers ("latest") above it, so Maven 3.9.11 gives "0" < "latest" and
"0.0" < "sp" (and "1.0" < "1.0-latest", which semantic also gives). semantic's trimming loop in
newMavenVersion runs while i > 0 and never trims the first token, so "0" keeps a numeric token
that outranks every qualifier: "0" > "latest", "0.0" > "sp".
'''

[[bug]]
id = "osv-scalibr/9"
title = "semantic: an empty Red Hat component is decided by emptiness before rpmvercmp's rules, so 1: differs from 1::: and a version starting with a tilde sorts above an empty one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRedHatEmptyComponentFollowsRpmvercmp"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
rpmvercmp strips non-alphanumeric characters (other than ~ and ^) at the start of each segment
and applies the tilde rule ("~ sorts before everything else, even the end of the string") before it
looks at whether a side is exhausted, so rpmvercmp("", "::") is 0 (both sides are empty after
stripping) and rpmvercmp("~1", "") is -1 (the tilde side is older). compareRedHatComponents starts
with `a == "" && b != "" -> -1` and `a != "" && b == "" -> +1`, so semantic gives "1:" < "1:::"
(versions "" vs "::") where rpm gives equality, and "~1" > "-1" (version "~1" vs "", rpm: "~1"
is older). Oracle: rpm 4.20.1's rpmvercmp() compiled from source.
'''

[[bug]]
id = "osv-scalibr/10"
title = "semantic: a missing Alpine numeric component compares as the number 0 against a present one with a leading zero, so 100 == 100.0 == 100.00 while 100.0 < 100.00"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAlpineMissingComponentOrder"
found = { commit = "6aec485bbf15d5f04a015617a8653090e332a2b9", version = "v0.5.2+", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
alpineNumberComponent.Cmp compares two components after the first as strings when either has a
leading zero (apk's rule: such components are fractions), and numerically otherwise. The
placeholder for a missing component (alpineNumberComponents.Fetch) has index 0, so the string
rule is skipped and the numeric one applies: "100" vs "100.00" is 0 == 0, equal, as is "100" vs
"100.0"; but "100.0" vs "100.00" is the string comparison "0" < "00". Equality is then not
transitive: "100" == "100.0", "100" == "100.00", "100.0" < "100.00".
'''
