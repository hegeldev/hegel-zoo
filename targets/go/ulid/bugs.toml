# Bugs found in oklog/ulid by the Hegel zoo. One [[bug]] per finding; `test` names the
# TestHegelPin... function in hegel_test.go that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracles: a big.Int Crockford base32 model of the text
# encoding, the documented error contract of the parsers, the (time, entropy) order, and the
# documentation of Monotonic ("incremented by a random number between 1 and inc inclusive").
# CONTRIBUTING.md has no policy on AI (checked 2026-09-19).

[[bug]]
id = "ulid/1"
title = "MonotonicEntropy fed by an io.Reader increments by 2..inc, never by 1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinReaderIncrementsCanBeOne"
found = { commit = "75921a7395850ea47ed4dfd832184a5a294c8fde", version = "v2.1.2", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Monotonic documents that calls within the same millisecond return "entropy incremented by a
random number between 1 and inc inclusive". random() has two paths: with a *rand.Rand (the default
entropy) it returns 1 + Int63n(inc), i.e. 1..inc; with any other io.Reader (crypto/rand.Reader,
which the README recommends for security-sensitive use) it draws a candidate, loops
"for inc == 0 || inc >= m.inc" and returns 1 + candidate, i.e. 2..inc. With inc = 2 every increment
from a reader is exactly 2; the pin reads 300 ULIDs in one millisecond from a fixed byte stream
and never sees an increment of 1. The two paths also disagree with each other. Found by checking
the increment distribution of both paths against the documentation.
'''

[[bug]]
id = "ulid/2"
title = "After ErrMonotonicOverflow the next read in the same millisecond returns a lower ULID"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinReadsAfterOverflowStayMonotonic"
found = { commit = "75921a7395850ea47ed4dfd832184a5a294c8fde", version = "v2.1.2", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MonotonicRead calls increment(), whose uint80.Add performs the addition and then reports the
overflow; the wrapped-around entropy is kept in m.entropy (and even copied into the caller's
buffer alongside ErrMonotonicOverflow). The next MonotonicRead in the same millisecond finds
m.entropy non-zero and m.ms unchanged, increments the small wrapped value and succeeds, so the
caller who retried after the error gets a ULID that sorts below the last one that succeeded
(00000000Z80000000000000013 after 00000000Z8ZZZZZZZZZZZZZZZG in the pin), silently breaking the
interface's contract ("monotonically increasing entropy ... for all calls with the same ms").
Keeping the old entropy on overflow, or returning ErrMonotonicOverflow again until the
millisecond changes, would both honour it. Found by driving a Monotonic source through sequences
of same and new milliseconds after starting its entropy near 2^80.
'''

[[bug]]
id = "ulid/3"
title = "random() masks the little-endian low byte, so io.Reader increments are biased (16 distinct values for inc 1000) and reject most candidates"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinReaderIncrementsAreNotBiased"
found = { commit = "75921a7395850ea47ed4dfd832184a5a294c8fde", version = "v2.1.2", hegel = "v0.6.33", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
random() is "adapted from crypto/rand.Int": it clears the high bits of m.rand[0] to the bit length
of inc's most significant byte, then decodes m.rand with binary.LittleEndian, where m.rand[0] is
the least significant byte. The mask therefore lands on the low byte of the candidate: candidates
are uniform over the numbers whose low byte is below 2^msbitLen, and the top byte is left
unbounded so most candidates exceed inc and are rejected. For inc = 1000 (bitLen 10, two bytes,
mask 2 bits) the accepted increments are 1 + v with v in {0..3, 256..259, 512..515, 768..771}:
16 values instead of 1000, so ULIDs from crypto/rand in one millisecond are far more guessable than
"a random number between 1 and inc" promises. For inc = 2^40 + 7 the acceptance rate is 1/256 and
each increment consumes about 1.5 KB of entropy. The *rand.Rand fast path is unaffected. Found by
counting the distinct low bytes of 199 increments from a plain reader against the rng path.
'''
