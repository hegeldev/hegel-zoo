TestHegelPinCreatedLineHasTheTimestamp = "prometheus-common/4"
TestHegelPinExemplarWithoutLabelsWritten = "prometheus-common/5"
TestHegelPinGaugeHistogramUsesGcountGsum = "prometheus-common/6"
TestHegelPinTrailingWhitespaceIgnored = "prometheus-common/7"
TestHegelPinSummaryLineWithoutQuantileRejected = "prometheus-common/8"
TestHegelPinBracedNameSameSummary = "prometheus-common/9"
TestHegelPinUnknownCounterHasNoExemplar = "prometheus-common/10"
# Wide properties (rule 11: the known shapes stay reachable by default).
# Parse also meets /1, /2, /8 and /9 and OpenMetrics also meets /6 and /10;
# the failure message names the shape met, the mapping holds the basin the shrinker lands in.
TestHegelParseFollowsTheFormat = "prometheus-common/7"
TestHegelTextRoundTrips = "prometheus-common/3"
TestHegelOpenMetricsIsWellFormed = "prometheus-common/5"
TestHegelPrometheusClientAgrees = "prometheus-common/5"
# Narrow properties, one per recorded bug (hegel_shapes_test.go).
TestHegelSummaryCountsAreChecked = "prometheus-common/1"
TestHegelQuoteInsideNameIsRejected = "prometheus-common/2"
TestHegelExtractSamplesWorksWithoutOptions = "prometheus-common/3"
TestHegelCreatedLinesCarryTheTimestamp = "prometheus-common/4"
TestHegelExemplarsWithoutLabelsAreWritten = "prometheus-common/5"
TestHegelGaugeHistogramsUseGcountGsum = "prometheus-common/6"
TestHegelTrailingWhitespaceIsIgnored = "prometheus-common/7"
TestHegelSummaryLinesWithoutQuantileAreRejected = "prometheus-common/8"
TestHegelBracedNamesParseLikePlainOnes = "prometheus-common/9"
TestHegelUnknownCountersHaveNoExemplar = "prometheus-common/10"
