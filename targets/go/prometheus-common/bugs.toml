[[bug]]
id = "prometheus-common/1"
title = "TextParser converts a summary _count with uint64(value) unchecked: -1 becomes 18446744073709551615 and 1.5 becomes 1"
kind = "logic"
severity = "medium"
test = "TestHegelPinSummaryCountIsChecked"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readingValue handles a summary's _count line with `SampleCount = proto.Uint64(uint64(value))`
and no check, while the histogram branch next to it verifies `value == float64(uint64(value))`,
rejects a negative count ("negative count for histogram") and keeps a fractional one as
SampleCountFloat. So `# TYPE s summary\ns_count -1\n` parses without error to a summary with
sample_count 18446744073709551615 (the conversion of a negative float to uint64 is
implementation-defined; on amd64 it is 1<<63, which the writer then prints as
9.223372036854776e+18), and `s_count 1.5` to sample_count 1. A negative or fractional summary
count is invalid input and should be a ParseError like the histogram's.

Wider (2026-09-25, reproduced standalone): `s_count NaN`, `s_count +Inf` and `s_count 1e30`
all parse without error too, each to sample_count 9223372036854775808 (1<<63, the amd64
result of the out-of-range conversion).
'''

[[bug]]
id = "prometheus-common/2"
title = "A double quote inside an unquoted metric or label name toggles quoting instead of ending the token: foo\"bar\" parses as foobar"
kind = "logic"
severity = "low"
test = "TestHegelPinQuoteInsideNameRejected"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readTokenAsMetricName and readTokenAsLabelName accept '"' as a name character
(isValidLabelNameStart includes it so that a quoted name can start) and flip their `quoted`
flag on every quote they meet, so `foo"bar" 1` is the metric "foobar" and `a{x"y"="1"} 1` has
the label "xy" - no error, the quote characters silently removed. The format defines an
unquoted metric name as `[a-zA-Z_:][a-zA-Z0-9_:]*` and a label name as `[a-zA-Z_][a-zA-Z0-9_]*`;
a quote may only open a quoted name at its start. Fix: accept '"' only as the first byte of
the token, and end the token (or fail) on a quote inside an unquoted name.
'''

[[bug]]
id = "prometheus-common/3"
title = "ExtractSamples panics with a nil *DecodeOptions on a sample without a timestamp"
kind = "crash"
severity = "low"
test = "TestHegelPinExtractSamplesNilOptions"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
extractCounter and the other extractors do `smpl.Timestamp = o.Timestamp` when a metric has
no TimestampMs, dereferencing the options pointer; `ExtractSamples(nil, fam)` therefore works
for families whose samples all carry timestamps and panics with a nil pointer dereference on
the first that does not. The signature takes a pointer with no note that it is required; a nil
should mean the zero DecodeOptions (as it does when every sample has a timestamp).

Wider (2026-09-25, reproduced standalone): extractSummary and extractHistogram
(decode.go, `timestamp := o.Timestamp` at the top of each) read the options before looking
at the metric, so `ExtractSamples(nil, fam)` panics on every summary and histogram family,
timestamps or not; only counter, gauge and untyped families with timestamps on every sample
survive a nil.
'''

[[bug]]
id = "prometheus-common/4"
title = "MetricFamilyToOpenMetrics writes the _created line without the metric's timestamp, which the OpenMetrics parser rejects as a mixed group"
kind = "logic"
severity = "medium"
test = "TestHegelPinCreatedLineHasTheTimestamp"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
writeOpenMetricsCreated writes name_created{labels} value and a newline; unlike
writeOpenMetricsSample it never writes metric.TimestampMs. For a counter with a timestamp and
WithCreatedLines the output is

    a_total{x="1"} 2.0 1.234567890123e+09
    a_created{x="1"} 1.5

In OpenMetrics the _created line belongs to the same MetricPoint and must carry the same
timestamp; the reference parser (prometheus_client 0.26) rejects the text with "Mix of
timestamp presence within a group: a_created{x="1"} 1.5". Summaries and histograms with
timestamps are affected the same way. Fix: write the timestamp after the created value when
metric.TimestampMs is set.
'''

[[bug]]
id = "prometheus-common/5"
title = "MetricFamilyToOpenMetrics drops an exemplar that has no labels"
kind = "logic"
severity = "low"
test = "TestHegelPinExemplarWithoutLabelsWritten"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
writeOpenMetricsSample writes the exemplar only `if exemplar != nil && len(exemplar.Label) > 0`.
OpenMetrics allows an exemplar with an empty label set ("# {} 0.5" - the specification's own
histogram example has `foo_bucket{le="0.1"} 8 # {} 0.045`), and the reference parser reads
it. A counter or bucket whose exemplar carries only a value (and possibly a timestamp) is
written as if it had none, losing the exemplar silently; the function's documentation lists
what it leaves out and this is not among it.
'''

[[bug]]
id = "prometheus-common/6"
title = "MetricFamilyToOpenMetrics writes a gauge histogram with _count and _sum lines instead of _gcount and _gsum"
kind = "logic"
severity = "medium"
test = "TestHegelPinGaugeHistogramUsesGcountGsum"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For dto.MetricType_GAUGE_HISTOGRAM the writer emits `# TYPE h gaugehistogram` and then the
histogram branch's `h_bucket`, `h_sum` and `h_count` lines. OpenMetrics defines the
GaugeHistogram MetricPoint with `_gcount` and `_gsum` samples (`_count`/`_sum` belong to
Histogram); the reference parser reads the output as three families: h (gaugehistogram, the
buckets only), h_count (unknown) and h_sum (unknown). The function's documentation says
"No support for ... gaugehistogram type", but the code emits the type line, so the output
claims a type whose grammar it does not follow. Either write _gcount/_gsum for gauge
histograms or return an error for the type.
'''

[[bug]]
id = "prometheus-common/7"
title = "TextParser rejects blanks or tabs after a sample's value or timestamp, though the format says trailing whitespace is ignored"
kind = "logic"
severity = "low"
test = "TestHegelPinTrailingWhitespaceIgnored"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The text format specification (exposition_formats, "Text format details") says "Within a
line, tokens can be separated by any number of blanks and/or tabs ... Leading and trailing
whitespace is ignored." The parser ignores leading whitespace but not trailing: after the
value, readingValue sees a blank and goes to startTimestamp, which skips the blanks, reads an
empty token and fails with `expected integer as timestamp, got ""`, so `foo 1 \n` is a
ParseError; after a timestamp, readTokenUntilNewline collects the blanks and fails with
`spurious string after timestamp: " "`, so `foo 1 2 \n` is one too. Exporters that pad lines
(or end them with "\r\n" - a different matter) are rejected. Fix: skip blanks/tabs before
testing for the end of line in both places.
'''

[[bug]]
id = "prometheus-common/8"
title = "TextParser accepts a summary or histogram sample that has no quantile/le label and is not _sum or _count, and drops its value silently"
kind = "logic"
severity = "low"
test = "TestHegelPinSummaryLineWithoutQuantileRejected"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In readingValue the summary branch is a switch over "is _count", "is _sum", "quantile is not
NaN" with no default: a line such as `s 1` or `s{a="b"} 1` for a family declared
`# TYPE s summary` (or `h 1` for a histogram, or a quantile/le label whose value is NaN) is
accepted, a Metric with an empty Summary/Histogram is created for its label set, and the
value is thrown away. The writer then renders that metric as `s_sum 0` and `s_count 0`,
inventing data. Such a line is not a valid sample of a summary or histogram and should be a
ParseError.
'''

[[bug]]
id = "prometheus-common/9"
title = "TextParser books a summary/histogram sample whose metric name is inside the braces with the previous line's family state: metrics split, and a label after the name panics on a nil map"
kind = "crash"
severity = "high"
test = "TestHegelPinBracedNameSameSummary"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
readingLabels resets the summary/histogram bookkeeping (currentLabels with __name__,
currentQuantile, currentBucket) only when p.currentMF is a summary or histogram - but for a
line that starts with '{' (the UTF-8 syntax `{"name",label="v"} 1`) it runs before the name
has been read, so p.currentMF is still the family of the *previous* line (or nil on the first
line). Consequences, with `# TYPE a summary` declared:

- `# TYPE b gauge` on the line before, then `{"a",x="y",quantile="0.5"} 1`: currentLabels is
  nil (never allocated on this parser), the name sets currentMF to the summary, the label x
  runs `p.currentLabels[name] = value` and the parser panics with "assignment to entry in
  nil map" (TextToMetricFamilies does not recover it).
- `{"a_sum"} 1` then `{"a_count"} 2`: the first line's signature is computed over a stale or
  empty label map, the second over {__name__: a}, so the two lines become two metrics of the
  summary instead of one; the same lines without braces give one metric.

The quoted-name syntax is documented for the parser ("When metric_name is quoted with double
quotes, it appears inside the braces") and MetricFamilyToText emits it for every UTF-8
metric name, so a summary with such a name is written by this package and misread (or
crashes) on the way back. Fix: perform the reset when the family becomes known (after
setOrCreateCurrentMF in the braces case) rather than at readingLabels.
'''

[[bug]]
id = "prometheus-common/10"
title = "MetricFamilyToOpenMetrics writes an exemplar on a counter it declares unknown (no _total suffix), which OpenMetrics forbids"
kind = "logic"
severity = "low"
test = "TestHegelPinUnknownCounterHasNoExemplar"
found = { commit = "db5c9e8713e10e97e756354eb34f8b83456050ac", version = "v0.71.0+ (main, 2026-09-18)", hegel = "v0.6.33", date = "2026-09-21" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The function's documentation says a counter without the _total suffix "is not an error.
However, its type will be set to `unknown` in that case to avoid invalid OpenMetrics output."
The exemplar of such a counter is nevertheless written (`a{...} 2.0 # {t="1"} 0.5` under
`# TYPE a unknown`), and OpenMetrics allows exemplars on counter and histogram bucket samples
only; the reference parser (prometheus_client 0.26) rejects the whole exposition: "Invalid
line only histogram/gaugehistogram buckets and counters can have exemplars". So the output
the unknown type was meant to keep valid is invalid whenever the counter carries an exemplar.
Fix: pass nil for the exemplar when the type is written as unknown.
'''
