hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "apt-sources/7"
title = "Display writes `PDiffs: true`, which the parser rejects"
kind = "wrong-result"
severity = "low"
test = "the_pdiffs_field_round_trips_through_display"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`pdiffs` has `deserialize_with = deserialize_yesno` but no `serialize_with`,
so `ToDeb822` writes `bool::to_string` (`true`/`false`) and the parser's
`deserialize_yesno` rejects the crate's own output: `Repositories::from_str`
of the `Display` of a stanza with `PDiffs: yes` fails with "The field
requiring only `Yes`/`No` values is incorrect".
"""

