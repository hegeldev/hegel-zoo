[[bug]]
id = "apt-sources/2"
title = "Flat repositories (`deb http://x/ ./`, no component) are silently dropped by the one-line parser and written with a trailing space"
kind = "silent-corruption"
severity = "medium"
test = "flat_repositories_are_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The regex requires at least one component, so a flat repository line (suite
ending in `/`, no components — sources.list(5)) never matches and vanishes
from the result. `LegacyRepository: Display` writes such a repository as
`deb http://x/ ./ ` (trailing space), which the parser drops again. APT
fetches `http://x/./Packages` for it.
"""

