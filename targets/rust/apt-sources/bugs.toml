[[bug]]
id = "apt-sources/6"
title = "The deb822 fields Allow-Insecure, Allow-Weak, Allow-Downgrade-To-Insecure and Trusted reject the yes/no values sources.list(5) specifies"
kind = "wrong-result"
severity = "medium"
test = "yes_no_fields_are_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Repository`'s `Option<bool>` fields `allow_insecure`, `allow_weak`,
`allow_downgrade_to_insecure` and `trusted` have no `deserialize_with`, so
the `FromDeb822` derive parses them with `bool::from_str`, which accepts only
`true`/`false`: a stanza with `Trusted: yes` (the documented syntax, and the
one APT reads) fails with "provided string was not `true` or `false`", and
`Repositories::from_str` fails for the whole file. `Enabled` and `PDiffs`
have `deserialize_yesno`; the four others were forgotten. The same fields
are written by `ToDeb822` as `true`/`false`.
"""

