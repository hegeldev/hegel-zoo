[[bug]]
id = "apt-sources/8"
title = "An embedded Signed-By key block gains an empty line on every Display/parse round trip"
kind = "wrong-result"
severity = "low"
test = "an_embedded_key_block_round_trips_through_display"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Signed-By:\\n -----BEGIN PGP PUBLIC KEY BLOCK-----\\n …` parses to
`Signature::KeyBlock("\\n-----BEGIN …")` (the leading newline of the field
value is kept) and `Signature: Display` prefixes another `\\n`, so the
display is `Signed-By: \\n \\n -----BEGIN …` and the re-parsed block starts
with two newlines; each pass adds one. The blank lines inside the block,
written as ` .` per deb822, are also read back as a literal `.` line.
"""

