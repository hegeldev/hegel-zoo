[[bug]]
id = "apt-sources/11"
title = "Two or more spaces between two components make a one-line entry disappear"
kind = "silent-corruption"
severity = "medium"
test = "components_separated_by_several_spaces_are_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The component group `(?:(?P<component>\\w+)\\s?)+` allows a single
whitespace character between components, where the other fields are
separated by `\\s+`: `deb http://a/ s main  contrib` (two spaces, or a space
and a tab) does not match and is dropped without an error. APT and python-apt
split on any whitespace.
"""

