# Bugs found in apt-sources by the Hegel tests, against APT itself
# (`apt-get update --print-uris` run offline on the generated files) and
# python-apt's `SourceEntry`. All zoo-original; jelmer/debian-parsers has no
# related issue.

[[bug]]
id = "apt-sources/1"
title = "One-line entries with a component containing a dash (non-free, non-free-firmware) are silently dropped"
kind = "silent-corruption"
severity = "high"
test = "components_with_a_dash_are_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LegacyRepositories::from_str` is a `captures_iter` over one regex whose
component group is `(?:(?P<component>\\w+)\\s?)+$`; `\\w` does not match `-`,
so `deb http://deb.debian.org/debian bookworm main non-free-firmware` (the
default Debian 12 line) does not match and, since lines that do not match are
simply skipped, the repository is not there — with `Ok`, no error. APT and
python-apt read it. `Repositories::load_from_directory` inherits it for
`sources.list` and `*.list` files.
"""

