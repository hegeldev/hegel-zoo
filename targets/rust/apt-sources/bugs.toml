commit = "b1568f26a9e5"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "apt-sources/9"
title = "The one-line parser joins lines: `deb http://a/ s` followed by a line `main` is read as one entry"
kind = "wrong-result"
severity = "low"
test = "entries_do_not_span_lines"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The regex uses `\\s+` between the fields under the `m` flag, and `\\s`
matches a newline, so the two malformed lines `deb http://a/ s` and `main`
(APT: "Malformed entry", a non-flat suite without components) are accepted as
the entry `deb http://a/ s main`.
"""

