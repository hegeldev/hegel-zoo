[[bug]]
id = "apt-sources/4"
title = "Commented-out entries (`# deb …`) are documented as disabled repositories but are not read"
kind = "wrong-result"
severity = "low"
test = "disabled_entries_are_read_as_disabled"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LegacyRepository` has a private `enabled` field ("this doesn't represent
real field, but rather commented or uncommented line"; "The disabled field is
just commented out with `#` followed by whitespaces at the beginning of the
valid line") and `From<&LegacyRepository> for Repository` maps it to
`Enabled`. The regex only matches lines starting with `deb`, so a
commented-out entry is skipped and `enabled` is never false; python-apt reads
it with `disabled = True`. Every default Debian/Ubuntu `sources.list` has a
`# deb-src` line.
"""

