[[bug]]
id = "apt-sources/3"
title = "A trailing `# comment` makes a one-line entry disappear"
kind = "silent-corruption"
severity = "medium"
test = "a_trailing_comment_does_not_drop_the_line"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`deb http://a/ s main # comment` is a valid entry for APT and python-apt (the
comment is ignored); the regex is anchored with `$` right after the
components, so the line does not match and is dropped without an error.
"""

