result = "reproduces"
[[bug]]
id = "apt-sources/5"
title = "Display writes the `pdiffs` option as `pdiff`, which neither the parser nor APT understands"
kind = "wrong-result"
severity = "medium"
test = "the_pdiffs_option_round_trips_through_display"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LegacyRepository: Display` formats `pdiffs: Some(b)` as `pdiff=yes|no`;
`from_str` (and sources.list(5)) know the option as `pdiffs`, so the display
of a parsed `deb [pdiffs=yes] …` line fails to parse with "Unrecognized
field name: pdiff" and APT reports an unknown option.
"""

