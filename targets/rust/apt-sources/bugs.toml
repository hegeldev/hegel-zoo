[[bug]]
id = "apt-sources/10"
title = "The documented `arch+=` / `arch-=` options are rejected as unrecognised"
kind = "wrong-result"
severity = "low"
test = "arch_add_and_remove_options_are_accepted"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
sources.list(5) allows `arch+=` and `arch-=` (and the same for the other list
options) to add to or remove from the default; the option splitter cuts at
the first `=` and looks up the key `arch+`, so `deb [arch+=i386] …` fails the
whole file with "Unrecognized field name: arch+". APT reads it.
"""

