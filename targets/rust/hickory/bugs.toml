[[bug]]
id = "hickory/1"
title = "Name/Label presentation-format escaping is not reversible by the crate's own parsers: a Name with the single label [0x00] prints as \"\\000\" (to_ascii, Display, to_utf8) and Name::from_ascii(\"\\000\") fails with Malformed label — every escape Label::write_ascii can emit except \\. is rejected on re-parse (control bytes, bytes ≥ 0x80, single-escaped printables)"
kind = "roundtrip"
severity = "medium"
test = "rr::domain::name::tests::hegel_name_to_ascii_from_ascii_roundtrip"
found = { commit = "1b78772fcad0", version = "", hegel = "0.28.2", date = "2026-07-22" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Not a predecessor trophy: the predecessor's HEGEL_REPORT.md for hickory-proto lists
`hegel_name_to_ascii_from_ascii_roundtrip` as "FAILING, suspected library bug, kept failing" and
analyses it under "Suspected bugs", but no TROPHIES.md row was made. Recorded here from that
analysis when the target was imported. Code path: `name.rs::from_encoded_str` resolves `\\DDD`/`\\X`
escapes into the label string, then `Label::from_ascii`'s `is_safe_ascii(c, is_first, for_encoding =
false)` re-validates the *unescaped* characters and rejects the ones `Label::write_ascii` escapes
(it fails earlier still on `s.is_ascii()` for bytes ≥ 0x80). Labels are 8-bit clean on the wire
(`Label::from_raw_bytes` accepts any 1–63 bytes), so such names decode from real messages and then
cannot be re-read from their own presentation form. `hegel_name_to_ascii_from_ascii_roundtrip_safe_labels`
pins the working subset ([A-Za-z0-9_], non-leading `-`, leading `*`, `.`) and passes.
"""

