# Eight bugs in nucleo-matcher, none a predecessor TROPHIES.md row: the predecessor's
# HEGEL_REPORT.md for nucleo pins each with a deliberately failing `known_failure_*` test in
# `matcher/src/tests.rs::hegel_props` and analyses them under "Suspected bugs". Recorded here from
# that analysis when the target was imported (2026-09-12). Numbering follows the report.

[[bug]]
id = "nucleo/1"
title = "Substring matches at the very end of a Unicode haystack are missed: substring_match_non_ascii (exact.rs) computes end = haystack.len() - needle.len() and scans haystack[start..end], excluding the last valid window start — substring_match(\"你ab\", \"ab\") returns None"
kind = "contract"
severity = "medium"
test = "tests::hegel_props::known_failure_substring_misses_match_at_end_of_unicode_haystack"
found = { commit = "8c16d47cdfa9", version = "", hegel = "0.28.2", date = "2026-06-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Predecessor report, suspected bug 1 (not a trophy row). Pin: known_failure_substring_misses_match_at_end_of_unicode_haystack."

