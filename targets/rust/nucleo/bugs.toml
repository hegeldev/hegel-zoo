[[bug]]
id = "nucleo/2"
title = "ASCII ignore_case substring prefilter is broken for needles whose first [a-z] char is at index >= 2: substring_match_ascii runs memmem::find_iter(&haystack[..len_h - len_n + len], needle) — the whole needle in a truncated haystack — so it misses matches near the end (substring_match(\"xx12b\", \"12b\") = None) and all case-variant matches (substring_match(\"12Bxx\", \"12b\") = None despite ignore_case)"
kind = "contract"
severity = "medium"
test = "tests::hegel_props::known_failure_substring_ascii_ignore_case_prefilter_truncation"
found = { commit = "8c16d47cdfa9", version = "", hegel = "0.28.2", date = "2026-06-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Predecessor report, suspected bug 2 (not a trophy row). It should search only the caseless needle prefix needle[..len]. Pin: known_failure_substring_ascii_ignore_case_prefilter_truncation."

