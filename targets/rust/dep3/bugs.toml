# Bugs found in dep3 by the Hegel tests, against the DEP-3 specification
# (https://dep-team.pages.debian.net/deps/dep3/), dpkg's deb822 reader and the
# crate's own two layers. All zoo-original; jelmer/debian-parsers has no
# related issue. Bugs inherited from deb822-lossless (/4 indented `#` lines,
# /9 edits after an unterminated last line) are not recorded again.

[[bug]]
id = "dep3/1"
title = "Everything after the first blank line is dropped (lossless) or a parse error (lossy): git-style bodies and DEP-3 pseudo-headers are not read"
kind = "wrong-result"
severity = "high"
test = "a_pseudo_header_after_the_body_is_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
DEP-3: "A header always ends on the first empty line", "when `Subject` is
used, it is expected that the long description is outside of the structured
fields", and "a second header (the 'pseudo-header') can start on any new
paragraph". `lossless::PatchHeader::parse_relaxed` hands the whole text up
to the `---` line to `deb822_lossless::Paragraph::from_str`, which keeps the
first paragraph only, so on

    From: A <a@example.com>
    Subject: fix

    Some explanation.

    Origin: vendor, https://bugs.debian.org/1
    Forwarded: not-needed
    ---

`forwarded()` and `origin()` are `None` and the free-form body is lost
without any error (`a_second_paragraph_is_not_silently_dropped`: even
`Description: fix\\n\\nForwarded: no\\n` loses the `Forwarded`). The lossy
`PatchHeader::from_str` fails with "Unexpected token: Some explanation."
(or "Expected end-of-file" for a second field paragraph).
"""

[[bug]]
id = "dep3/2"
title = "The mbox `From <sha> <date>` first line of a `git format-patch` file is a parse error"
kind = "contract"
severity = "medium"
test = "a_git_format_patch_header_is_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
DEP-3's first sample header is a `git format-patch` file and starts with
`From d33286c75b623cfb249c627b0c348be62e6377c9 Mon Sep 17 00:00:00 2001`.
Both layers report "missing colon ':' after field name" on that line, so
the crate cannot read the spec's own example (the pin also needs bug 1 for
the body and pseudo-header).
"""

[[bug]]
id = "dep3/3"
title = "The setters append a second field instead of replacing an existing one, and the getters keep returning the old value"
kind = "silent-corruption"
severity = "high"
test = "setters_replace_an_existing_field"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`set_author`, `set_forwarded`, `set_origin`, `set_last_update`,
`set_applied_upstream`, `set_upstream_bug` and `set_vendor_bug` all call
`Paragraph::insert`, which adds a new field at the end. On
`From: A <a@x>\\nSubject: s\\nForwarded: no\\n`, `set_author("B <b@x>")`
gives `From: A <a@x>\\n…\\nFrom: B <b@x>\\n` and `author()` still returns
`A <a@x>`; `set_forwarded(NotNeeded)` leaves two `Forwarded` fields and
`forwarded()` still says `No`. dpkg refuses the result (duplicate field).
`Paragraph::set` is the replacing operation.
"""

[[bug]]
id = "dep3/4"
title = "`set_description` (and `set_long_description`) panic on a header whose Description/Subject has no long description"
kind = "panic"
severity = "high"
test = "set_description_works_without_a_long_description"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With an existing one-line `Subject: old` or `Description: old`,
`set_description("new")` builds `format!("{}\\n{}", "new", "")` = `new\\n`
and passes it to `Paragraph::set`, which panics: "Invalid value: empty
continuation line". `set_long_description("")` on a one-line field and
`set_description("a\\n\\nb")` on an existing field panic the same way. The
one-line synopsis is the most common shape in the archive.
"""

[[bug]]
id = "dep3/5"
title = "After `set_description` with a blank line, the live header reads the marker as ` .` while a re-parse reads `.`"
kind = "roundtrip"
severity = "low"
test = "a_set_description_reads_the_same_live_and_after_a_reparse"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`encode_multiline_value` writes the blank-line marker as ` .` (with its
own indent) and `Paragraph::insert` indents the line again, giving
`Description: Fix\\n  .\\n Details follow.\\n`. On the live tree
`long_description()` is ` .\\nDetails follow.` (one indent stripped); on
the re-parsed text it is `.\\nDetails follow.` and the lossy layer decodes
the blank line. The marker should be `.` without an indent of its own.
"""

[[bug]]
id = "dep3/6"
title = "`lossless::PatchHeader::long_description` returns `Some(\"\")` for a one-line description and keeps the `.` markers, where the lossy layer returns `None` and decodes them"
kind = "wrong-result"
severity = "low"
test = "the_layers_agree_on_the_long_description"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Description: fix\\n` → lossless `Some("")`, lossy `None`; `Description:
fix\\n long\\n .\\n more\\n` → lossless `long\\n.\\nmore`, lossy
`long\\n\\nmore`. The lossy documentation ("a lone `.` line is decoded back
to an empty line") describes the intended reading.
"""

[[bug]]
id = "dep3/7"
title = "`Acked-by` (DEP-3's alias of `Reviewed-by`) is not recognised by either layer"
kind = "contract"
severity = "low"
test = "acked_by_counts_as_a_review"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
DEP-3 lists the field as "Reviewed-by / Acked-by". `reviewed_by()` reads
`Reviewed-By` only (case-insensitively), so `Acked-by: T <t@x>` yields an
empty list; the lossy struct has no field for it either. `From`/`Subject`
are handled as aliases, `Acked-by` is not.
"""

[[bug]]
id = "dep3/8"
title = "The lossy header keeps only the first of repeated `Bug-Debian`/`Reviewed-by`/`Author` fields and drops `Bug-<Vendor>` for other vendors, so its Display loses them"
kind = "silent-corruption"
severity = "medium"
test = "the_lossy_header_keeps_repeated_and_vendor_bug_fields"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.4", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
DEP-3 says `Bug`/`Bug-<Vendor>`, `Author` and `Reviewed-by` "can be used
multiple times". `lossy::PatchHeader` models `bug_debian`, `reviewed_by`
and `author` as `Option<String>` and has no field for `Bug-Ubuntu` etc., so
parsing and re-rendering `Bug-Debian: …/1\\nBug-Debian: …/2\\nBug-Ubuntu:
…/3\\nReviewed-by: R\\nReviewed-by: S\\n` yields one Debian bug and one
reviewer; `vendor_bugs("Ubuntu")` is hard-coded to `None`. Lossy or not,
a struct that is written back (`Display`) should carry the repeated fields
(as `Vec`s) rather than silently drop them.
"""
