[[bug]]
id = "diamond-types/3"
title = "decode_and_add_opts / load_from abort the process (memory allocation failed) on a corrupted encoding whose CompressedFieldsLZ4 chunk declares a huge uncompressed length, instead of returning ParseError"
kind = "crash"
severity = "medium"
test = "list::encoding::tests::hegel_pinned_huge_compressed_length_aborts"
found = { commit = "89ae3a0ab8d941a2885e6ec89d094bc9ce9d2922", version = "2.0.0", hegel = "0.44.1", date = "2026-09-24" }
status = "open"
notes = '''
decode_internal (src/list/encoding/decode_oplog.rs, the `feature = "lz4"` block) reads the
uncompressed length of the CompressedFieldsLZ4 chunk as a varint and hands it straight to
lz4_flex::decompress, which allocates a zeroed buffer of that size; a corrupted length (a byte
flip on the varint's first byte, here 0x1b -> 0xe4 in a 45-byte encoding, read as about 2.4e14)
makes the allocation fail and the Rust runtime aborts the process, so no ParseError and no
catch_unwind. Every other malformation the decoder meets returns an error or, at worst, panics
(diamond-types/1); this one kills the caller. The length is bounded by the chunk's compressed
size and the format (an lz4 block cannot expand beyond about 255x), so it could be checked before
decompressing. Found by the turn-437 generator rewrite's 3000-case rounds of
hegel_corrupt_decode_errors_or_unrolls (about one case in ten thousand): the lib test binary
died with "memory allocation of 1170968169863 bytes failed". The properties now recognise the
shape by walking the header and first chunk and reject it; the pin re-runs itself in a child
process and asserts the child exits normally.
'''
