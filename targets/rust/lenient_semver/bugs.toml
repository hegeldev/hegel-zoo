[[bug]]
id = "lenient_semver/1"
title = "A numeric segment that overflows u64 is silently dropped when whitespace or `+` follows it: `1.18446744073709551616 ` parses as `1.0.0`, `1.18446744073709551616+b` as `1.0.0+b` — while without the follower it is the documented `1.0.0-18446744073709551616`"
kind = "correctness"
severity = "medium"
test = "overflowing_numbers_are_strings_whatever_follows"
found = { commit = "3585c592a885", version = "0.4.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "The README and the docs of `parse`/`parse_into` promise: \"Numbers that overflow an u64 are treated as strings\". parser/src/lib.rs, the `Accept::Minor`/`Patch`/`Add` arms of the state-transition macro: when the segment's `parse::<u64>()` fails, the state is switched to `ParsePre` with the segment's start kept, so that on `.`, `-` or end of input the text becomes one pre-release identifier (`1.99999999999999999999` → `1.0.0-99999999999999999999`, `1.99999999999999999999.1` → `1.0.0-99999999999999999999.1`, `-a` likewise). The arms for a following `+` (→ `ParseBuild`) and whitespace (→ `EndOfInput`) do not re-check the overflow: the segment is neither set as a number nor added as a string, and parsing continues — `1.99999999999999999999 ` → `1.0.0`, `1.2.99999999999999999999 ` → `1.2.0`, `1.2.3.99999999999999999999+x` → `1.2.3+x`, `1.18446744073709551616 ` (u64::MAX + 1, while `1.18446744073709551615 ` is `1.18446744073709551615.0`) → `1.0.0`. So a trailing space or a build suffix changes the version, and a pre-release/additional identifier vanishes without an error — the opposite of a lenient parser's promise. `parse_partial` behaves the same. Found by the model comparison (`partial_parsing_agrees_with_the_model`) at 100 cases: ` V0.99999999999999999999 `."

[[bug.observed]]
version = "0.4.3"
commit = "3585c592a885"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "lenient_semver/2"
title = "A release identifier in pre-release position followed by build metadata is refused: `1.2.3-Final+sha` — a valid semver text — fails with \"Unexpected `+`\", while `1.2.3-Final` is the documented `1.2.3+Final`"
kind = "correctness"
severity = "low"
test = "release_identifiers_may_be_followed_by_build_metadata"
found = { commit = "3585c592a885", version = "0.4.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "parser/src/lib.rs, `Accept::Pre` arm: `if is_release_identifier(segment) { if $new_state < State::EndOfInput { return Err(UnexpectedInput at the `+`) } $v.add_build(segment) }` — the branch is deliberate, but its effect is that `1.2.3-Final+sha`, `1.2.3-r+1`, `1.2.3.RELEASE+2022-11-30` (any of `r`, `final`, `release` case-insensitively, after `-` or `.`, then `+build`) are errors in a parser whose README says it is \"more lenient in what it allows\" than semver: `semver::Version::parse(\"1.2.3-Final+sha\")` succeeds (pre `Final`, build `sha`). Since `1.2.3-Final` is documented to become `1.2.3+Final`, the natural reading is `1.2.3+Final.sha`, which is what the version builder produces when `add_build` is called twice (as it is for `1.2.3.4+sha` → `1.2.3+4.sha`). `parse_partial` gives `(1.2.3, \"+sha\")`, i.e. also drops the `Final`. Possibly intended upstream (no issue found); recorded because a documented-lenient parser rejects a strict text that the strict parser accepts. Found by the model comparison at 100 cases: ` V0.Final+`."

[[bug.observed]]
