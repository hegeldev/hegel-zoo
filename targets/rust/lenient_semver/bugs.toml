hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "lenient_semver/3"
title = "A second `+` inside the build metadata makes the parse succeed with the whole build dropped: `1.2.3+build+rest` parses as `1.2.3`, `0+0+` as `0.0.0`"
kind = "correctness"
severity = "medium"
test = "a_second_plus_in_the_build_metadata_is_an_error"
found = { commit = "3585c592a885", version = "0.4.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "parser/src/lib.rs, `dfa()`: the lenient transition table has rows for `Whitespace | EndOfInput @ ParseBuild` and `Dot | Hyphen | Number | Alpha | V @ ParseBuild` but none for `Plus @ ParseBuild`, and the accept table has no action for it either (the strict-mode table a few hundred lines below does have `Hyphen | Plus | Unexpected @ ParseBuild -> ErrorUnexpected`). So on the second `+` the build segment is never handed to `add_build`, no error is raised, and the DFA lands in the table's default `State::Error` entry, which consumes the rest of the input without reporting anything: `lenient_semver::parse(\"1.2.3+build+rest\")` → `Ok(1.2.3)`, `\"0+0+\"` → `Ok(0.0.0)`, `\"0.1+2+3\"` → `Ok(0.1.0)`, `\"1.2.3-p+q+r\"` → `Ok(1.2.3-p)`; `parse_partial` returns the same version with an empty remainder. Build metadata is dot-separated identifiers of letters, digits and `-` in every reading of the grammar (semver, the crate's README list, its railroad diagram), so the expected result is the `UnexpectedInput` error the crate gives for `1.2.3+build,rest` — or at least the build kept. Found by the model comparison (`partial_parsing_agrees_with_the_model`) at 1 000 cases: `0+0+`."

