# One bug, not a predecessor TROPHIES.md row: the predecessor's HEGEL_REPORT.md for
# unicode-segmentation documents it as a KNOWN FAILURE of the property
# hegel_cursor_next_boundary_chunked_agrees_with_iterator (tests/test.rs). With hegeltest 0.44.1 the
# property passed at the default case count, so the zoo added a deterministic pin from the report's
# minimal counterexample (known_failure_gb12_chunk_split_double_counts_regional_indicators).
# Recorded when imported (2026-09-12).

[[bug]]
id = "unicode-segmentation/1"
title = "GraphemeCursor::next_boundary double-counts regional indicators (GB12/GB13) when a chunk split falls between two RIs: for s = \"0\\u{1f1e6}\\u{1f1e6}\" supplied as chunks [(0, \"0\\u{1f1e6}\"), (5, \"\\u{1f1e6}\")] it reports a boundary at 5, inside the flag grapheme — the forward pass sets ris_count = Some(1), is_boundary at offset == chunk_start requests pre-context anyway, and handle_regional (grapheme.rs:517) seeds its backward scan with the existing count and re-counts the same RI, so even parity wrongly allows a break; a fresh cursor's is_boundary(5) correctly returns false"
kind = "contract"
severity = "medium"
test = "known_failure_gb12_chunk_split_double_counts_regional_indicators"
found = { commit = "66a032fd8d66", version = "", hegel = "0.28.2", date = "2026-06-01" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Predecessor report, suspected bug (not a trophy row). GB12/GB13 analogue of the GB11 chunk-boundary bug fixed upstream in 9a42b9d. The property that found it needs the chunk split between the two RIs and did not hit the case in the zoo's first 0.44.1 run, hence the deterministic pin."

