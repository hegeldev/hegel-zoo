[[bug]]
id = "distro-info/1"
title = "`debian-distro-info --testing` (and `--alias`) cannot find a testing release that has no release date yet — i.e. the current testing most of the time: it reports \"Distribution data outdated\""
kind = "wrong-result"
severity = "high"
test = "testing_without_a_release_date_is_found"
found = { commit = "cbd44a32c805b8c7d874e9e569e6a66945b2d41a", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`select_distro_releases` (`binaries/src/lib.rs`) implements `--testing` with
`DistroInfo::ubuntu_devel`, which keeps a release only when `release` is `Some` and after the
date; Debian's testing has no release date in `debian.csv` until it is released (forky:
`14,Forky,forky,2025-08-09`), so with the shipped data `debian-distro-info --testing` exits 1
with the "outdated" message on every day since 2025-08-09, and `--alias=forky` prints `forky`
where the C tool prints `testing`. The library's own `DebianDistroInfo::testing` handles the
missing date (`release().is_none() || …`); the binary does not use it. The C tool
(`filter_testing`: created, not released, not sid/experimental) prints `forky`.
"""

[[bug]]
id = "distro-info/2"
title = "`ubuntu-distro-info --lts` names the LTS still in development for the six months between its creation and its release (trusty on 2013-10-18; the C tool says precise)"
kind = "differential"
severity = "medium"
test = "lts_is_the_latest_released_lts"
found = { commit = "cbd44a32c805b8c7d874e9e569e6a66945b2d41a", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The `--lts` branch of `select_distro_releases` takes `all_at(date)` (created by the date)
filtered by `ubuntu_is_lts` and prints the last one; the C tool's `filter_lts` +
`select_latest_release` takes the latest *released* LTS. A new LTS is created on the previous
release day, about six months before its own release (trusty 2013-10-17 → 2014-04-17, xenial,
bionic, …, resolute 2025-10-09 → 2026-04-23), and for all of that time the Rust binary
answers with the unreleased one (`--date=2026-04-22 --lts`: resolute; C: noble).
"""

[[bug]]
id = "distro-info/3"
title = "`--days` of a milestone a release does not have aborts the output with an error (`release`, `created`) or prints nothing (`eol-lts`, `eol-elts`, `eol-esm`); the C tools print `(unknown)`"
kind = "differential"
severity = "medium"
test = "days_until_missing_milestones_print_unknown"
found = { commit = "cbd44a32c805b8c7d874e9e569e6a66945b2d41a", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`DaysMode::date_for` (`binaries/src/lib.rs`) returns an error for a missing `release`/`created`
date, so `debian-distro-info --all -y` prints eighteen numbers and then exits 1 at forky
("No release date found for forky") where the C tool prints four `(unknown)` lines and exits
0; `output()` prints `(unknown)` only for `Eol`/`EolServer`, so `--supported --days=eol-lts`
omits the value (or the whole line without `-c`) for releases without an LTS date.
upstream's own test suite (which the crate vendors) has `--devel --days=eol` →
`Debian  "Sid" (unknown)` and the same for `--days=release`; `--days=eol-esm` is also missing
from `DaysMode` (the C ubuntu tool accepts it).
"""

[[bug]]
id = "distro-info/4"
title = "A release is still `supported` on its EOL day (`date <= eol`); the C tools treat every milestone date as exclusive (`eol = date >= eol`), so `--supported`/`--unsupported`/`--lts`/`--elts` differ on each EOL day"
kind = "differential"
severity = "low"
test = "eol_days_are_exclusive_like_the_c_tools"
found = { commit = "cbd44a32c805b8c7d874e9e569e6a66945b2d41a", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`supported_at`/`ubuntu_supported_at` (`src/distro_release.rs`) use `date <= eol` (and
`date <= max(eol, eol_server)`); distro-info's C `distro-info-util.c` has
`eol(date, distro) = date_ge(date, eol)` and `filter_supported = created && !eol`, so on
2006-04-30 (warty's EOL) `ubuntu-distro-info --supported` lists `hoary breezy dapper` and the
Rust binary `warty hoary breezy dapper`; the same for Debian (`buzz` on 1997-06-05), for
`--lts`/`--elts` on eol-lts days, and for the library's `supported(date, milestone)`. The
crate's own tests assert the inclusive reading (`ubuntu_distro_info_supported_on_eol_day`),
but the C tool — whose test suite the crate vendors as its acceptance tests — is the
reference, and the two disagree on every milestone day.
"""

[[bug]]
id = "distro-info/5"
title = "A list selector with no matches exits 1 with \"Distribution data outdated\" (`debian-distro-info --date=2010-06-01 --lts`); the C tools print nothing and exit 0"
kind = "differential"
severity = "low"
test = "empty_lists_exit_zero_like_the_c_tools"
found = { commit = "cbd44a32c805b8c7d874e9e569e6a66945b2d41a", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`output()` (`binaries/src/lib.rs`) bails with `OUTDATED_MSG` whenever the selected list is
empty, for every selector. The C tool does that only for the single-release selectors
(`--stable`, `--devel`, `--lts` on Ubuntu, …); for the lists (`--supported`, `--unsupported`,
Debian's `--lts`/`--elts`) an empty result is a normal, empty, exit-0 answer — Debian has no
LTS release between two LTS periods (e.g. 2010–2014, 2020-06-30 to 2020-07-18).
"""

[[bug]]
id = "distro-info/6"
title = "`DebianDistroInfo::testing` uses `date > created` (strictly after) and finds no testing on the day the new testing is created (2025-08-09 → `None`; the C tool: forky)"
kind = "wrong-result"
severity = "low"
test = "testing_on_its_creation_day"
found = { commit = "cbd44a32c805b8c7d874e9e569e6a66945b2d41a", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`src/lib.rs`: `date > *created` in `testing`, where `created_at`, `all_at` and the C tool
(`created = date_ge(date, created)`) use `>=`. Trixie was released and forky created on
2025-08-09: on that day `--stable` says trixie, `testing` says nothing.
"""

[[bug]]
id = "distro-info/7"
title = "An empty date field in a CSV row (`14,Forky,forky,2025-08-09,,,`) fails the whole parse with \"premature end of input\"; the C tool reads it as no date"
kind = "contract"
severity = "medium"
test = "empty_date_fields_parse_as_none"
found = { commit = "cbd44a32c805b8c7d874e9e569e6a66945b2d41a", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`from_csv_reader` (`src/lib.rs`) maps every present date column through
`NaiveDate::parse_from_str`, so an empty field is a parse error and `DebianDistroInfo::new()`
fails. The data files only avoid it because a row stops after its last known date (the
reader is `flexible`); a row with a known `eol-lts` but no `eol`, or a trailing `,` after an
unknown date, would break every consumer of the library. The C tool (and python
distro-info) treat an empty field as an unknown milestone.
"""
