[[bug]]
id = "pyproject-toml/1"
title = "`include-group` names are looked up by their exact text, not normalised: `{include-group = \"test-group\"}` does not find the group `Test_Group` (PEP 735: names \"must be normalized before comparisons\"; the reference resolves it)"
kind = "wrong-result"
severity = "medium"
test = "include_group_names_are_compared_normalized"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`resolve_dependency_group` (`src/resolution.rs`) does `dependency_groups.get(dep_group)` with the
include's raw string, so any spelling difference between the declaration and the include
(`Test_Group` / `test-group` / `TEST.GROUP`, all one name under PEP 685 normalisation) is
"Failed to find dependency group `test-group` included by group:other". PEP 735: keys "must be
valid non-normalized names" and "must be normalized before comparisons"; the reference
implementation (`dependency_groups`) normalises both sides with `re.sub(r"[-_.]+", "-",
name).lower()`. The optional-dependency side of the same file already compares normalised
(`normalize_name(key) == normalized_extra`), so the two halves disagree.
"""

[[bug]]
id = "pyproject-toml/2"
title = "Two groups whose names normalise alike (`a_b`, `a-b`) are accepted as distinct groups; PEP 735 says tools SHOULD emit an error and the reference raises `Duplicate dependency group names`"
kind = "contract"
severity = "low"
test = "duplicate_normalized_group_names_are_an_error"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`DependencyGroups` is an `IndexMap<String, …>` keyed by the raw spelling, and `resolve` never
compares the keys with each other, so `[dependency-groups]` with `a_b = ["x"]` and `"a-b" =
["y"]` resolves to two groups (and an `{include-group = "a-b"}` picks whichever spelling
matches exactly — bug 1). PEP 735: "If duplicate names, after normalization, are encountered,
tools SHOULD emit an error"; `dependency_groups.DependencyGroupResolver` raises `ValueError:
Duplicate dependency group names: a-b (a_b, a-b)`.
"""

[[bug]]
id = "pyproject-toml/3"
title = "A Dependency Group Include with extra keys (`{include-group = \"a\", foo = \"bar\"}`) is accepted and the extra keys silently ignored; PEP 735 defines the include as \"a table with exactly one key\""
kind = "contract"
severity = "low"
test = "include_tables_have_exactly_one_key"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`DependencyGroupSpecifier::Table { include_group }` is an `untagged` serde variant without
`deny_unknown_fields`, so any table carrying an `include-group` key deserialises, whatever else
it carries. PEP 735: a Dependency Group Include is "a table with exactly one key,
`include-group`", and `dependency_groups` raises `ValueError: Invalid dependency group item`.
A misspelled second key (`{include-group = "a", markers = "…"}`) is thus dropped without
notice. `Contact` in the same crate uses `deny_unknown_fields` for exactly this reason.
"""

[[bug]]
id = "pyproject-toml/4"
title = "`check_pep639_glob`/`parse_pep639_glob` accept a leading slash (`/LICENSE`); PEP 639: \"the leading slash character MUST NOT be used\""
kind = "contract"
severity = "medium"
test = "license_globs_reject_a_leading_slash"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`check_pep639_glob` (`src/pep639_glob.rs`) treats `/` as a separator wherever it appears, so
`/LICENSE`, `/licenses/*.txt` pass and `glob::Pattern::new` accepts them too. PEP 639
(`license-files`): "Path delimiters MUST be the forward slash character (`/`). Patterns are
relative to the directory containing `pyproject.toml`, therefore the leading slash character
MUST NOT be used." `pyproject_metadata` rejects such a pattern as one that "must match files
within the project directory". The module documents itself as the PEP 639 validity check and
quotes this rule in its own doc comment.
"""

[[bug]]
id = "pyproject-toml/5"
title = "Self references are matched against the project's raw name: with `name = \"Spam_Egg\"` the requirement `spam-egg[x]` (or `Spam_Egg[x]`) is not recognised as the project itself and its extra is left unexpanded"
kind = "wrong-result"
severity = "medium"
test = "self_references_match_the_normalized_project_name"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`resolve_optional_dependency`/`resolve_dependency_group` (`src/resolution.rs`) test
`project_name == unresolved_requirement.name.to_string()`: the requirement's name is a
`PackageName`, which renders normalised (`spam-egg`), while `project_name` is the raw
`[project] name` string. Whenever the project name is not already in normalised form
(`Spam_Egg`, `spam.egg`, `SPAM-EGG`) no self reference ever matches, so `dev = ["Spam_Egg[x]"]`
resolves to the literal requirement instead of the requirements of extra `x`. The code carries
a TODO to make the name a `PackageName`; until then the comparison must normalise the project
name (PEP 503: names compare normalised).
"""

[[bug]]
id = "pyproject-toml/6"
title = "`ResolvedDependencies::optional_dependencies` gains a second entry for an extra referred to in another spelling: `Test_X = [\"a\"]` with `dev = [\"spam[test-x]\"]` resolves to the three keys `Test_X`, `test-x`, `dev`"
kind = "wrong-result"
severity = "low"
test = "resolved_extras_are_keyed_once"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`resolve_optional_dependency` finds the declared extra by normalised comparison (good) but then
caches the result under the *requested* spelling (`resolved.optional_dependencies.insert(extra
…)` with the requirement's normalised extra), while the top-level loop inserts it under the
declared spelling too. The resolved map therefore lists an extra the project never declared,
and `optional_dependencies.len()` no longer matches the `[project.optional-dependencies]`
table. Consumers iterating the resolved extras (to emit `Provides-Extra`, say) emit it twice.
"""

[[bug]]
id = "pyproject-toml/7"
title = "`check_pep639_glob` accepts patterns that `parse_pep639_glob` rejects (`LICENSE**`, `LICEN[CE`, `[`): the documented validity check and the parser disagree"
kind = "contract"
severity = "low"
test = "check_and_parse_agree_on_validity"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`check_pep639_glob` is documented as "Check if a glob pattern is valid according to PEP 639
rules" and `parse_pep639_glob` as `check_pep639_glob` followed by `glob::Pattern::new`. The
check bans `**literal` ("Too many at stars") but not `literal**`, and never checks that a `[`
is closed, so `LICENSE**`, `LICEN[CE`, `[` and `[]` pass the check and then fail in
`Pattern::new` ("recursive wildcards must form a single path component", "invalid range
pattern"). A caller using `check_pep639_glob` to validate `license-files` (the documented
purpose) accepts patterns the same crate cannot compile.
"""

[[bug]]
id = "pyproject-toml/8"
title = "`license = {text = \"…\", file = \"…\"}` parses as `License::Text` and silently drops the file; the specification says the keys are mutually exclusive and \"tools MUST raise an error if the metadata specifies both keys\""
kind = "contract"
severity = "low"
test = "license_tables_with_both_text_and_file_are_an_error"
found = { commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f", version = "0.13.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`License` is an `untagged` enum whose `Text { text }` and `File { file }` variants have no
`deny_unknown_fields`, so a table with both keys matches the first variant (`Text`) and the
`file` key vanishes — `toml::to_string` of the parsed document renders `[project.license]
text = "…"` only. The pyproject.toml specification (`license`, table form): "These keys are
mutually exclusive, thus tools MUST raise an error if the metadata specifies both keys."
`Contact` and the readme table in the same crate show the two possible fixes (deny unknown
fields, or a struct with two `Option`s validated after parsing).
"""
