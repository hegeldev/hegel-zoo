name = "pyproject-toml"
language = "rust"
upstream = "https://github.com/PyO3/pyproject-toml-rs"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-14"

[base]
commit = "072336b73669c2bd2299af895811c3c4c9cd9c4f"
date = "2026-02-25"
version = "0.13.7"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import tomllib, dependency_groups, pyproject_metadata, packaging' 2>/dev/null && exit 0; done; python3 -m pip install --user --break-system-packages dependency-groups pyproject-metadata packaging || /usr/bin/python3 -m pip install --user --break-system-packages dependency-groups pyproject-metadata packaging"]
command = "cargo test --no-fail-fast --features pep639-glob"

[expected_failures]
"include_group_names_are_compared_normalized" = "pyproject-toml/1"
"duplicate_normalized_group_names_are_an_error" = "pyproject-toml/2"
"include_tables_have_exactly_one_key" = "pyproject-toml/3"
"license_globs_reject_a_leading_slash" = "pyproject-toml/4"
"self_references_match_the_normalized_project_name" = "pyproject-toml/5"
"resolved_extras_are_keyed_once" = "pyproject-toml/6"
"check_and_parse_agree_on_validity" = "pyproject-toml/7"
"license_tables_with_both_text_and_file_are_an_error" = "pyproject-toml/8"
