# Bugs found in yrs (y-crdt) by the Hegel properties. Each has a pin test that asserts the
# correct behaviour and is listed as an expected failure in target.toml.

[[bug]]
id = "ycrdt/1"
title = "write_var_i64 overflows on i64::MIN: `-value` panics in debug builds and wraps in release builds, so the smallest i64 cannot be encoded as a VarInt"
kind = "crash"
severity = "medium"
test = "encoding::test::hegel_pin_var_int_min_roundtrips"
found = { commit = "1610ff2b17142f87870e05dde9e668cedcb3584d", version = "0.28.0", hegel = "0.44.1", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
yrs/src/encoding/varint.rs `write_var_i64`: `value = if is_negative { -value } else { value }` — for
i64::MIN the negation overflows ("attempt to negate with overflow" under debug assertions, which is
how `cargo test` runs; in release builds it wraps to i64::MIN, which is still negative, so the
continuation/sign header byte and the following 7-bit groups encode the wrong magnitude and the
value does not read back). Found by hegel_encoding_primitives_roundtrip when it drew
VarInt(-9223372036854775808) at the 2026-09-17 bump; the generator had not produced the extreme
before. The fix is to work on the magnitude as u64 (`value.unsigned_abs()`). Yjs (JavaScript) never
sees this value, so the lib0 format itself is not at fault.
"""

[[bug.observed]]
version = "0.28.0"
commit = "1610ff2b1714"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
