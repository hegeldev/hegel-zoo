[[bug]]
id = "compact_str/1"
title = "`try_with_capacity`, `try_reserve` (and the panicking `with_capacity`, `reserve`, `repeat`) with a capacity above 2^56 − 2 on 64-bit hit `Capacity::new`'s `debug_assert!` in debug builds instead of returning `ReserveError`, and `unreachable_unchecked` (undefined behaviour) in release builds"
kind = "soundness"
severity = "high"
test = "capacities_beyond_56_bits_are_reserve_errors"
found = { commit = "9696af7f7a94", version = "0.10.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/ParkMyCar/compact_str/issues/495"
fixed_in = ""
notes = "Reported upstream by rhysd on 2026-07-14 (issue #495, the day after the pinned commit; found with Miri) with a partial fix in PR #496, still open — the zoo found it independently from the documented contract (`try_with_capacity` \"won't panic if the system is out-of-memory, but return a ReserveError\"). `Capacity` stores a heap buffer's capacity in 7 bytes (the 8th is the variant tag), so `MAX_VALUE` is 2^56 − 2 on 64-bit; `Capacity::new(capacity)` (src/repr/capacity.rs:72) does `debug_assert!(capacity <= MAX_VALUE)` and then `assume(capacity.to_le() & !VALID_MASK == 0)` (`core::hint::unreachable_unchecked` when false, src/repr/mod.rs:964), and every allocation goes through it before the allocator is asked: `allocate_ptr` (`with_capacity`, `HeapBuffer::with_additional`) and `HeapBuffer::realloc` (`reserve` on a heap string, where the amortised growth or `len + additional` can exceed the limit). Debug build, observed here: `CompactString::try_with_capacity(1 << 56)` panics `assertion failed: capacity <= MAX_VALUE`; so do `CompactString::new(\"\").try_reserve(usize::MAX)` (no `checked_add` overflow for an empty string), a heap string's `try_reserve(2^56 - 2)`, `with_capacity(usize::MAX / 2)` and `CompactString::new(\"abcd\").repeat(1 << 55)`. Release build: all of them return / panic with `ReserveError` because the allocator refuses the size anyway, but only after the `unreachable_unchecked` — undefined behaviour the compiler is free to exploit (Miri flags it, per #495). Capacities up to 2^56 − 2 behave as documented in both builds (`huge_capacities_are_reserve_errors`)."

