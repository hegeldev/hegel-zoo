[[bug]]
id = "kurbo/5"
title = "QuadBez::arclen returns NaN for non-degenerate quads by catastrophic cancellation: the analytical formula's a + b + c (= |p2 − p1|²) is computed from terms ~|p1 − p0|⁴ and rounds negative when p2 is close to p1 and far from p0, so sqrt() is NaN"
kind = "contract"
severity = "low"
test = "bezpath::tests::pathseg_arclen_between_chord_and_control_polygon"
found = { commit = "ca273499e3e4", version = "0.11.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found in the zoo by the 10x-budget rotation (HEGEL_TEST_CASES=1000; three default-budget runs had passed). Hegel's case: QuadBez p0=(0, 790774117.5688856) p1=(−0.03320531852708375, 0) p2=(−0.44484054203102175, −0.01900073250846268): a=6.253e17, b=−1.2506e18, c=6.253e17, a+b+c evaluates to −128 (exact |p2−p1|² = 0.1698), so `sabc = (a+b+c).sqrt()` is NaN and so is the result; `q.raise().arclen()` (the cubic) gives 790774117.588, the chord length, as expected. Simple repro: `QuadBez::new(Point::new(0.0, 1e9), Point::new(0.0, 0.0), Point::new(0.3, -0.005)).arclen(1.0)` is NaN; 490 of the 1999 quads p2 = (0.3, −k/1000), k = 1..2000, in that family are NaN. Not the kurbo/4 case (#607 candidate 040, p0==p1==p2, a==c==0 → 0·∞): here a and c are ~1e17 and the `a < 5e-4 c` straight-line fallback does not fire because the curve is not straight (it reverses direction). Fix idea: compute a+b+c as (p2 − p1).hypot2() directly (they are equal algebraically) or clamp at 0. No upstream issue found (search: arclen NaN; #607 is the degenerate case)."

