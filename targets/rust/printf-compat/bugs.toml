# Bugs found in printf-compat by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracle is glibc's snprintf, called with the same variadic arguments the crate receives;
# the crate's own tests/tests.rs compares a hand-written list the same way.  Deviations the
# crate documents (precision on integers, %g/%a as %f, `0x` before uppercase hex and `0o`
# before octal, UTF-8 only) are not counted.

[[bug]]
id = "printf-compat/1"
title = "%e/%E print the exponent as Rust does (`1.234000e3`), not as C does (`1.234000e+03`)"
kind = "wrong-result"
severity = "high"
test = "e_exponent_has_a_sign_and_two_digits"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Specifier::Double` with `DoubleFormat::Scientific` is written with Rust's `{:e}`
(`define_numeric!(..., "e")` in output.rs), whose exponent has no sign and no minimum width:
`%e` of 1234.0 is `1.234000e3`, of 1.5e-7 `1.500000e-7`, of 0.0 `0.000000e0`; C prints
`1.234000e+03`, `1.500000e-07`, `0.000000e+00`.  Every `%e`/`%E` output differs from C
(the zero-padded ones also pad differently, `%010.2e` of 1234.5 is `00001.23e3` vs
`001.23e+03`); the `f` conversions are exact and correct.  Not among the documented
differences; the upstream test suite has no `%e` case.
"""

[[bug]]
id = "printf-compat/2"
title = "`-` with the space flag and no width panics (`%- d`, `%- f`)"
kind = "crash"
severity = "high"
test = "left_adjust_with_space_and_no_width_formats"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The `LEFT_ALIGN && PREPEND_SPACE` branch of `define_numeric!` writes `" {:<width$}"` with
`width = (width as usize).wrapping_sub(1)`; with no width (0) that is `usize::MAX`, and Rust's
formatter panics with "Formatting argument out of range" (widths above u16::MAX are rejected
since Rust 1.87).  `%- d` of 5, `%- 0d`, `%- f` of 1.5 and `%- 0*d` with a `*` width of 0
all panic where C prints ` 5` / ` 1.500000`; any width of 1 or more is fine (the upstream
tests only use `- ` together with a width).  The crate documents that "the main machinery
… can't panic".
"""

[[bug]]
id = "printf-compat/3"
title = "a negative `*` width panics instead of left-adjusting"
kind = "crash"
severity = "medium"
test = "negative_star_width_means_left_adjustment"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
C: "A negative field width is taken as a `-` flag followed by a positive field width".
`parse_width` returns the `int` as is and every writer does `width as usize`, so `%*d` with
-5 asks Rust for a width of 18446744073709551611 and panics ("Formatting argument out of
range") in `fmt_write`; `io_write` panics for numbers and returns -1 for strings (its byte
padding loop is bounded only by the writer failing).  C prints `42   `.
"""

[[bug]]
id = "printf-compat/4"
title = "widths and precisions above 65535 panic"
kind = "crash"
severity = "low"
test = "widths_above_u16_format"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Rust's `{:width$}`/`{:.prec$}` reject values above u16::MAX at run time ("Formatting argument
out of range"), so `%70000d`, `%*d` with 70000, `%.70000f` and `%70000s` panic; `%65535d`
is the last width that works.  C pads (glibc handles widths up to INT_MAX).  Strings through
`io_write` are padded by hand and are fine; everything else goes through `core::fmt`.
"""

[[bug]]
id = "printf-compat/5"
title = "a width whose digits overflow `int` panics (debug) or wraps (release) instead of failing"
kind = "crash"
severity = "low"
test = "width_digits_overflow_is_an_error"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_width` accumulates `width * 10 + digit` in a `c_int` with no overflow check:
`%99999999999d` and `%2147483648d` panic with "attempt to multiply/add with overflow" in a
debug build and silently wrap to some other width in release.  glibc returns -1 (EOVERFLOW)
for a width that does not fit an `int`.  The same accumulator parses the precision.
"""

[[bug]]
id = "printf-compat/6"
title = "infinities and NaNs print as Rust prints them: `NaN`, no `INF`/`NAN`, no NaN sign, zero-padded"
kind = "wrong-result"
severity = "medium"
test = "non_finite_floats_match_libc"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The float path is `core::fmt`, so `%f` of NaN is `NaN` (C `nan`), `%F` of infinity is `inf`
(C `INF`) and of NaN `NaN` (C `NAN`), `%+f` of NaN is `NaN` (C `+nan`), `%f` of a NaN with
the sign bit set is `NaN` (C `-nan`), and the `0` flag pads with zeros — `%08f` of infinity is
`00000inf`, of -infinity `-0000inf` (C pads non-finite values with spaces: `     inf`,
`    -inf`).  `%e`/`%E` of the same values have the same problems.  `+inf` and `-inf` are right.
"""

[[bug]]
id = "printf-compat/7"
title = "`#` is ignored for floats: `%#.0f` of 3 is `3`, not `3.`"
kind = "wrong-result"
severity = "low"
test = "alternate_form_applies_to_floats"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The `Flags::ALTERNATE_FORM` documentation says that for `f`, `F`, `e`, `E`, `g`, `G` "the
output always contains a decimal point", but `define_numeric!` never looks at the flag, so
`%#.0f` of 3.0 is `3` (C `3.`), and `%#-+.0f` of 0.0 `+0` (C `+0.`).  The flag is parsed and
applied for `x`/`X`/`o`.
"""

[[bug]]
id = "printf-compat/8"
title = "`#` prefixes a zero: `%#x` of 0 is `0x0`, `%#o` of 0 is `0o0`"
kind = "wrong-result"
severity = "low"
test = "alternate_form_of_zero_has_no_prefix"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
C (and the crate's own `Flags` documentation: "prepended to non-zero numbers") print a zero
with `#` as `0`; Rust's `{:#x}` and `{:#o}` always write the prefix, so `%#x`, `%#lx`,
`%#5x` of 0 are `0x0` / `  0x0`, and `%#o` of 0 is `0o0`.  The `0o`/`0X` spelling for
non-zero values is a documented difference; the zero is not.
"""

[[bug]]
id = "printf-compat/9"
title = "`%s` width and precision count characters in fmt_write, bytes in io_write and C"
kind = "wrong-result"
severity = "medium"
test = "string_width_counts_bytes"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`fmt_write`'s `write_str` pads and truncates with Rust's `{:>width$.prec$}` on a `&str`,
which counts characters, while `io_write`'s `write_bytes` (and C) count bytes: `%5s` of `é`
is `    é` (four spaces) through `fmt_write` and `   é` (three) through `io_write` and glibc;
`%.2s` of `éé` is `éé` through `fmt_write`, `é` through `io_write` and glibc.  The two
writers are documented to share the same output ("shares the same caveats", and the upstream
tests assert they agree) and disagree for every non-ASCII string with a width or precision.
The pinned property uses precisions on character boundaries; a C precision that splits a
character produces bytes `fmt_write` cannot emit at all.
"""

[[bug]]
id = "printf-compat/10"
title = "`%p` of a null pointer is `0x0`, not `(nil)`"
kind = "wrong-result"
severity = "low"
test = "null_pointer_prints_nil"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Specifier::Pointer` is written with Rust's `{:p}`, so a null pointer prints as `0x0`; glibc
prints `(nil)` (the crate does special-case the null `%s` as `(null)`, citing the same
glibc/musl extension).  Non-null pointers agree (`0x` and lowercase hex, padded alike).
"""

[[bug]]
id = "printf-compat/11"
title = "a negative `*` precision panics instead of being ignored"
kind = "crash"
severity = "medium"
test = "negative_star_precision_means_omitted"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
C: "A negative precision is taken as if the precision were omitted".  `parse_precision`
keeps the `int`, and `precision as usize` turns -1 into 18446744073709551615, which Rust's
formatter rejects ("Formatting argument out of range"): `%.*f` with -1 panics in both
writers (C `1.000000`), `%.*d` panics in both (C `7`), `%.*s` panics in `fmt_write` and is
right in `io_write` (`b.len().min(precision as usize)`).
"""

[[bug]]
id = "printf-compat/12"
title = "`%c` of a byte above 127 writes two bytes of UTF-8 through io_write"
kind = "wrong-result"
severity = "low"
test = "char_conversion_writes_one_byte"
found = { commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10", version = "0.4.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Specifier::Char` is written as `data as u8 as char` — a Latin-1 decoding — so `%c` of 0xE9
writes `é` (bytes C3 A9) and reports 2 bytes written, where C writes the single byte E9 and
reports 1.  `fmt_write` is documented as UTF-8 only, but `io_write` is documented as
supporting non-UTF-8 data and delegates `%c` to `fmt_write`.  `%c` of 0..=127 is right.
"""
