name = "printf-compat"
language = "rust"
upstream = "https://github.com/lights0123/printf-compat"
subdir = ""
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "4504f8fc2ca93aa2a9cc18f88c872bbb153bab10"
date = "2026-08-22"
version = "0.4.0"

[hegel]
version = "0.44.1"

[run]
# The crate uses C variadics (`args: ...`, `VaList`), which need rustc >= 1.99; stable is 1.98
# at the time of writing, so run on the nightly the machine has (CI installs it; a no-op locally).
setup = ["rustup toolchain install nightly-2026-09-01 --profile minimal"]
command = "cargo test --no-fail-fast"
env = { RUSTUP_TOOLCHAIN = "nightly-2026-09-01" }

[expected_failures]
e_exponent_has_a_sign_and_two_digits = "printf-compat/1"
left_adjust_with_space_and_no_width_formats = "printf-compat/2"
negative_star_width_means_left_adjustment = "printf-compat/3"
widths_above_u16_format = "printf-compat/4"
width_digits_overflow_is_an_error = "printf-compat/5"
non_finite_floats_match_libc = "printf-compat/6"
alternate_form_applies_to_floats = "printf-compat/7"
alternate_form_of_zero_has_no_prefix = "printf-compat/8"
string_width_counts_bytes = "printf-compat/9"
null_pointer_prints_nil = "printf-compat/10"
negative_star_precision_means_omitted = "printf-compat/11"
char_conversion_writes_one_byte = "printf-compat/12"
