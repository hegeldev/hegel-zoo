hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "chrono/5"
title = "`TimeDelta::checked_div` (and `Div<i32>`) computes the quotient part by part and is off by one nanosecond from the exact truncated quotient — `TimeDelta::new(1, 1) / 7` is 142 857 142 ns although 7 × 142 857 143 ns is exactly 1.000 000 001 s"
kind = "correctness"
severity = "low"
test = "division_is_exact_to_the_nanosecond"
found = { commit = "6adaa5240c26", version = "0.4.45", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/time_delta.rs:423–439: `secs = self.secs / rhs; carry = self.secs % rhs; extra_nanos = carry * NANOS_PER_SEC / rhs; nanos = self.nanos / rhs + extra_nanos` — the two divisions `carry * 1e9 / rhs` and `nanos / rhs` each truncate, so their sum can be one short of `(secs * 1e9 + nanos) / rhs`. Observed: `TimeDelta::new(1, 1).unwrap().checked_div(7)` = 0.142857142 s (exact: 0.142857143 s, an exact multiple); `(TimeDelta::nanoseconds(6_620_604) * 152) / 152` = 6 620 603 ns ≠ 6 620 604 ns; the `Div<i32>` operator uses the same code. A model of the truncated quotient of the total nanoseconds (which is what `num_seconds`, `num_milliseconds` etc. do for the other direction) agrees with chrono within 1 ns everywhere else. Added in PR #1565 (2024-04); no upstream report found."

[[bug.observed]]
version = "0.4.45"
commit = "6adaa5240c26"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "chrono/6"
title = "`TimeDelta::checked_mul` (and `Mul<i32>`) return values beyond `TimeDelta::MAX`/`MIN` — `TimeDelta::MAX.checked_mul(2)` is `Some(2 × MAX)` — and `num_milliseconds` then panics with an arithmetic overflow"
kind = "panic"
severity = "medium"
test = "multiplication_beyond_the_range_is_none"
found = { commit = "6adaa5240c26", version = "0.4.45", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "`TimeDelta` is documented as spanning ±i64::MAX milliseconds (`MIN`..=`MAX`; `new`, `try_seconds`, `checked_add`, `checked_sub` all refuse anything beyond, e.g. `MAX.checked_add(&nanoseconds(1))` is `None`), and `checked_mul` says it returns `None` if overflow occurred — but it only checks that the seconds fit an `i64` (src/time_delta.rs:415, `secs <= i64::MIN || secs >= i64::MAX`). Observed: `TimeDelta::MAX.checked_mul(2)` = `Some(TimeDelta { secs: 18446744073709551, nanos: 614000000 })`, `MIN.checked_mul(2)` and `MIN.checked_mul(-1)` likewise, `TimeDelta::MAX * 2` (the operator) the same value. On such a value `num_milliseconds()` panics `attempt to multiply with overflow` (src/time_delta.rs:331, debug build; wraps in release), `TimeDelta::new(secs, nanos)` of its fields is `None`, `checked_add(&MAX)` is `None` while `checked_sub(&MAX)` = `MAX`, `Display` prints `PT18446744073709551.614S`. Issue #1802 (2026-06-23, open, \"fallible-looking conversion paths can still panic on extreme inputs\") lists `checked_sub`, `duration_trunc` and others but not this path. Multiplication that stays within the range is exact."

[[bug.observed]]
