[[bug]]
id = "chrono/4"
title = "`iter_days` stops before `NaiveDate::MAX` and `iter_weeks` before the last representable week (`MAX.iter_days()` is empty; from 27 days before `MAX`, `iter_weeks` yields 3 weeks, not 4): the iterators are half-open ranges whose exclusive end is a representable date"
kind = "correctness"
severity = "low"
test = "iterators_start_from_the_date_itself"
found = { commit = "6adaa5240c26", version = "0.4.45", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Documented as iterators \"across all representable dates\" starting from `self` (the `iter_days` example: from 2016-02-27 → 27, 28, 29, Mar 1). Observed: `NaiveDate::MAX.iter_days().next()` is `None`; from `MAX - k` days `iter_days` yields `k` dates instead of `k + 1`; `iter_weeks` from `+262142-12-04` (`MAX` is `+262142-12-31`) yields 12-04, 12-11, 12-18 but not 12-25 — from `MAX - k` it yields `k / 7` weeks instead of `k / 7 + 1`, and `iter_weeks().last()` is a week before the last representable one. Cause: `iter_days` builds `NaiveDateDaysIterator { value: *self, end: NaiveDate::MAX }` with `end` exclusive (src/naive/date/mod.rs:1365, 2238–2256; `next` returns `None` when `value >= end`), and `iter_weeks` sets `end = self + 7 * weeks` with `weeks = (MAX - self).num_weeks()` (mod.rs:1397–1403), also exclusive — so the date `end` itself, although representable, is never produced. This shape comes from PR #1809 (\"Fix reversed NaiveDate day and week iterators\", merged 2026-07-29, for #1757, in 0.4.45); the previous `next` (`self.value = current.succ_opt()?; Some(current)`) already dropped `MAX` for `iter_days`, but the week iterator losing its last week is new. `size_hint`/`ExactSizeIterator` agree with the (short) contents."

[[bug.observed]]
