[[bug]]
id = "chrono/2"
title = "`%s` \"is not padded and can be negative\", and formats so, but parsing a negative Unix timestamp fails with `ParseError(Invalid)` for every instant before 1970"
kind = "correctness"
severity = "medium"
test = "negative_unix_timestamps_parse"
found = { commit = "6adaa5240c26", version = "0.4.45", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "`NaiveDateTime::parse_from_str(\"-1\", \"%s\")` and `DateTime::parse_from_str(\"-62135596800 +0000\", \"%s %z\")` are `Err(ParseError(Invalid))` while `0`, `1` and `253402300799` parse; `format(\"%s\")` of the same values prints `-1` and `-62135596800` as the table promises (\"[^6]: `%s`: This is not padded and can be negative\"). Cause: in `parse_internal` the `Numeric::Timestamp` specifier is registered as `(usize::MAX, false, Parsed::set_timestamp)` (src/format/parse.rs:401) — `signed = false`, unlike `Year`/`IsoYear` — so the leading `-` is never consumed and `scan::number` returns `INVALID` on the first non-digit. Not found in the upstream tracker (#577 is about `ts_milliseconds` serde, #758 about `%Y`). Found by the round trip of every complete format in the zoo."

[[bug.observed]]
version = "0.4.45"
commit = "6adaa5240c26"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "chrono/3"
title = "`%f` is documented as the unpadded nanosecond count (\"7μs is formatted as `7000`\", table example `26490000`) but prints nine zero-padded digits (`000007000`, `026490000`)"
kind = "documentation"
severity = "low"
test = "nanosecond_count_is_printed_as_documented"
found = { commit = "6adaa5240c26", version = "0.4.45", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/format/strftime.rs: `| %f | 26490000 | Number of nanoseconds since last whole second. [^7] |` and `[^7]: … Example: 7μs is formatted as 7000 with %f, and formatted as .000007 with %.f`. Observed: `NaiveTime::from_hms_nano_opt(0, 0, 0, 7_000).unwrap().format(\"%f\")` prints `000007000`, a zero nanosecond prints `000000000`, a leap second (`nanosecond() == 1_000_000_000`) prints `000000000` too — `%f` is `%9f` (the fixed-width forms `%3f`/`%6f`/`%9f` are documented separately as \"like `%.3f` but without the leading dot\"). The behaviour is old (issue #40 from 2015 asked to \"clarify … that `%f` specifier is not left-aligned\") and users depend on it, so the documentation is what is wrong; either way the two disagree. The parser accepts both spellings."

