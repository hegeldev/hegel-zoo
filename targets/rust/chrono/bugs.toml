[[bug]]
id = "chrono/1"
title = "`%::z` and `%:::z` are listed as parsing specifiers but the parser reads `+hh:mm` for both: the `+hh:mm:ss` that `%::z` writes is `TooLong`, the `+hh` that `%:::z` writes is `TooShort`"
kind = "correctness"
severity = "low"
test = "offset_specifiers_with_seconds_or_hours_only_parse_back"
found = { commit = "6adaa5240c26", version = "0.4.45", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/chronotope/chrono/issues/1228"
fixed_in = ""
notes = "Known upstream: #1228 (`%:::z` expects minutes when parsing, 2023-08-27, open) and #1629 (`%::z` with seconds, 2024-11-16, open; PR #1639 by djc, 2024-12-11, open, with pitdicker pointing at the broader offset-parsing PR #1083). The `strftime` module documents every specifier in its table as \"available both to formatting and parsing\" and marks only `%#z` as parsing-only; `%::z` formats `+09:30:15` and `%:::z` formats `+09`, but `parse_internal` handles `TimezoneOffsetDoubleColon` and `TimezoneOffsetTripleColon` on the same path as `TimezoneOffsetColon` (src/format/parse.rs:518, with a test comment saying so), so `DateTime::parse_from_str(\"2001-01-01 00:00:00 +00:00:00\", \"%F %T %::z\")` is `Err(TooLong)` and `parse_from_str(\"2001-01-01 00:00:00 +09\", \"%F %T %:::z\")` is `Err(TooShort)`. Verified in the zoo on every offset; the round trip of `%z`, `%:z`, `%+` and `%#z` works."

