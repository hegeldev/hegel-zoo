[[bug]]
id = "uv-normalize/1"
title = "DistInfoName normalises non-ASCII names byte by byte: UTF-8 is mangled into Latin-1 and non-ASCII uppercase is kept"
kind = "wrong-result"
severity = "low"
test = "dist_info_names_handle_non_ascii_like_packaging"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`DistInfoName` is documented as `PackageName` "without restrictions on the set of allowed
characters", with a link to packaging's `canonicalize_name` (which is `name.lower()` plus
collapsing `[-_.]+` to `-`). Its `normalize` iterates `name.bytes()` and pushes every byte that
is not ASCII upper-case or a separator as `char as char`, i.e. as the Latin-1 character with
that byte value, so a name that contains a non-ASCII character *and* needs any normalisation
comes out garbled: `DistInfoName::new("Ä_x")` is `"Ã\\u{84}-x"`, `DistInfoName::new("é_x")` is
`"Ã©-x"` (packaging: `ä-x`, `é-x`). When no normalisation is needed (`is_normalized` only looks
for ASCII upper-case, `_`, `.` and `--`) the text is kept as is, so `DistInfoName::new("Ä")` is
`"Ä"` where `canonicalize_name("Ä")` is `"ä"`. Either way the crate's `.dist-info` name of a
non-ASCII distribution differs from the one pip/packaging compute. Low: conformant names are
ASCII, and `PackageName` rejects such input; the lenient type exists precisely for the
non-conformant directory names found on disk.
"""

