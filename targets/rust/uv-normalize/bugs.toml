[[bug]]
id = "uv-normalize/2"
title = "PipGroupName accepts any path ending in the characters `pyproject.toml` where pip requires the file name to be `pyproject.toml`"
kind = "contract"
severity = "low"
test = "pip_group_paths_are_checked_by_file_name"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`PipGroupName::from_str` documents itself as pip-compatible (`--group [path:]name`; the error
says "The `--group` path is required to end in 'pyproject.toml' for compatibility with pip")
and checks `path.ends_with("pyproject.toml")`. pip's callback (`_handle_dependency_group`,
pip >= 25.1) checks `pathlib.PurePath(path).name != "pyproject.toml"`, so
`notpyproject.toml:dev`, `x-pyproject.toml:dev` or `dir/mypyproject.toml:dev` are accepted by
uv and refused by pip ("group paths use 'pyproject.toml' filenames"). Low: a leniency in an
option that exists for pip compatibility.
"""

