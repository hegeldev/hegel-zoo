name = "uv-normalize"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-normalize"
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "6f7795bb4f6e0bf348ba5e73194e1094d45b7c0a"
date = "2026-09-14"
version = "0.0.80"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.utils, packaging; assert int(packaging.__version__.split(\".\")[0]) >= 26' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages --upgrade packaging"]
command = "cargo test --no-fail-fast"

[expected_failures]
"dist_info_names_handle_non_ascii_like_packaging" = "uv-normalize/1"
"pip_group_paths_are_checked_by_file_name" = "uv-normalize/2"
