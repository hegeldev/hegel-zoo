[[bug]]
id = "deb822-fast/7"
title = "ParagraphReader skips an indented comment line before a paragraph that from_str and the borrowed parser reject"
kind = "differential"
severity = "low"
test = "the_paragraph_reader_rejects_what_from_str_rejects"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Deb822::iter_paragraphs_from_reader` skips, before the first field of a
paragraph, every line whose `trim_start()` begins with `#`, so `" # c\\nK:
a\\n"` streams one paragraph, while `Deb822: FromStr` and `BorrowedParser`
return `UnexpectedToken(" # c")` (an indented line where a paragraph starts;
dpkg also rejects it). The three parsers should accept the same documents.
"""

