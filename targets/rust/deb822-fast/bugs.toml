# Bugs found in deb822-fast by the Hegel tests, against dpkg's
# `Dpkg::Control::HashCore`, python-debian's `Deb822` and the crate's own three
# parsers (owned `Deb822: FromStr`, `BorrowedParser`, `ParagraphReader`), which
# must agree with each other. All zoo-original; jelmer/debian-parsers has no
# related issue.

[[bug]]
id = "deb822-fast/1"
title = "A whitespace-only line inside a paragraph is read as a continuation line, not as the paragraph separator"
kind = "wrong-result"
severity = "medium"
test = "a_whitespace_only_line_ends_a_paragraph"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
For `K: a\\n \\nJ: b\\n` dpkg, python-debian and the crate's own
`ParagraphReader` read two paragraphs (a line consisting of whitespace is a
blank line in deb822 — Policy 5.1 and dpkg's `Dpkg::Control::HashCore` both
treat `^\\s*$` as the paragraph end). The owned parser (`Deb822: FromStr`,
`Paragraph: FromStr`, `Deb822::from_reader`) and the borrowed parser see a
continuation line that starts with a space, strip it and append an empty line
to the last field: one paragraph with `K = "a\\n"` and `J = "b"`. Two
consecutive package stanzas separated by a line with a stray space are silently
merged into one.
"""

[[bug.observed]]
version = "0.2.3"
commit = "b1568f26a9e5"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "deb822-fast/2"
title = "The owned parser rejects a whitespace-only line between paragraphs that the borrowed parser and ParagraphReader skip"
kind = "differential"
severity = "low"
test = "a_whitespace_only_line_between_paragraphs_is_skipped"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`" \\nK: a\\n"` and `"K: a\\n\\n \\nJ: b\\n"` are `Err(UnexpectedToken(" "))`
for `Deb822: FromStr` (any line starting with a space or tab where a paragraph
is expected is an error), while `BorrowedParser` skips a whitespace-only line
there, `ParagraphReader` treats it as blank, and dpkg and python-debian read
the paragraphs. The three parsers of the crate also disagree on the error
token when such a line goes on after a carriage return (`" \\r:"`: the
borrowed parser takes the `\\r` as the end of the whitespace-only line and
reports `":"`, the owned parser reports the whole line).
"""

[[bug.observed]]
version = "0.2.3"
commit = "b1568f26a9e5"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "deb822-fast/3"
title = "CRLF documents: a blank `\\r\\n` line is a parse error and the values keep their `\\r`"
kind = "wrong-result"
severity = "medium"
test = "crlf_documents_are_read_like_python_debian"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parsers only look for `\\n`. Inside a paragraph the `\\r` of a `\\r\\n`
blank line is taken as the start of a field name, no colon follows and the
parse fails with `UnexpectedToken("\\r")`, so any CRLF document with two
paragraphs does not parse (the owned and the borrowed parser; the
`ParagraphReader` splits on the blank line first and reads it). A one-paragraph
CRLF document parses with a trailing `\\r` on every value line (`"a\\r"`, and
`"\\r"` for an empty value), where dpkg and python-debian strip the line
ending. `Display` then drops the `\\r` again through `str::lines` on all but
the last line, so parse → Display → parse is not the identity for such
documents.
"""

[[bug.observed]]
version = "0.2.3"
commit = "b1568f26a9e5"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "deb822-fast/4"
title = "Whitespace between the field name and the colon is part of the name, and names containing whitespace are accepted"
kind = "wrong-result"
severity = "low"
test = "whitespace_before_the_colon_is_not_part_of_the_field_name"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The field name is everything up to the colon: `K : v` yields a field named
`"K "` for which `get("K")` returns None, where dpkg (`^(\\S+?)\\s*:`) and
python-debian read the name `K`. A name with inner whitespace (`Foo Bar: x`)
is accepted too, where dpkg reports "line with unknown format (not
field-colon-value)" and python-debian ignores the line; Policy 5.1 says field
names must not contain whitespace. Same in the borrowed parser.
"""

