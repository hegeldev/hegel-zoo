result = "reproduces"
[[bug]]
id = "deb822-fast/5"
title = "Display writes an empty continuation line as a single space, which dpkg and python-debian read as the end of the paragraph"
kind = "silent-corruption"
severity = "medium"
test = "display_of_an_empty_continuation_line_is_read_by_the_references"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Field: Display` prefixes every value line after the first with one space, so
a value `"a\\n\\nb"` (an empty line in a description, as produced by
`Paragraph::insert`/`set` or by the parser on a whitespace-only line, bug /1)
is written as `K: a\\n \\n b\\n`. dpkg and python-debian take the line ` ` as
a blank line: the paragraph ends after `a` and the following fields are read
as a new paragraph (dpkg then fails on the indented ` b`). The crate's own
`convert::format_multi_line` writes such lines as ` .`, which every reader
understands; `Display` should do the same. The crate reads its own output
back only because of bug /1.
"""

[[bug.observed]]
version = "0.2.3"
commit = "b1568f26a9e5"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "deb822-fast/6"
title = "Display of a value ending in a newline writes a blank line after the field, splitting the paragraph"
kind = "silent-corruption"
severity = "low"
test = "display_of_a_value_ending_in_a_newline_round_trips"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Field: Display` collects `value.lines()`, which drops a final empty line, and
takes the single-line path for `"a\\n"`: `writeln!("{}: {}", name, value)`
then writes `K: a\\n\\n`, a blank line, so `J: x` after it is read as a
second paragraph by every parser. The parser produces such a value for a
trailing whitespace-only continuation line (`K: a\\n \\n`, bug /1), and
`insert`/`set` accept any string.
"""

