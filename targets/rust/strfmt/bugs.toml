[[bug]]
id = "strfmt/4"
title = "`+` with a radix type drops the sign of a negative integer: `{x:+x}` of -1i32 is `ffffffff`"
kind = "wrong-result"
severity = "low"
test = "plus_sign_applies_to_radix_forms_of_negatives"
found = { commit = "1948f91e5dc5becb19aa00f65aba2922790a4017", version = "0.2.5", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`fmtint!` writes `+` only when `x >= 0`, and `b`/`o`/`x`/`X` print the two's-complement bits;
so `{x:+x}` of -1i32 is `ffffffff` while `format!("{:+x}", -1i32)` is `+ffffffff` (the radix
form is non-negative, and std::fmt signs it).  `{x:+b}` of -5i8 is `11111011` vs `+11111011`.
"""

