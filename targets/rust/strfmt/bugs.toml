[[bug]]
id = "strfmt/7"
title = "a space sign (`{x: }`) is parsed and silently ignored"
kind = "contract"
severity = "low"
test = "space_sign_is_rejected"
found = { commit = "1948f91e5dc5becb19aa00f65aba2922790a4017", version = "0.2.5", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parser (copied from Python's) accepts `' '` as a sign and stores `Sign::Space`, but no
formatter looks at it: `{x: }` of 42 is `42` and `{x: 5}` is `   42`.  std::fmt has no space
sign (`format!("{: }", 42)` does not compile) and Python would print ` 42`; the crate's rule
for every other option it does not implement (`,`, the `0` flag, `=`) is an
`Invalid("not yet supported")` error, so the space sign should be one too rather than
accepted and dropped.
"""

