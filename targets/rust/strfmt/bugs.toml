[[bug]]
id = "strfmt/6"
title = "the std::fmt integer specs `{:#}`, `{:e}`, `{:E}` and `{:?}` are rejected"
kind = "contract"
severity = "low"
test = "std_fmt_integer_specs_are_accepted"
found = { commit = "1948f91e5dc5becb19aa00f65aba2922790a4017", version = "0.2.5", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
strfmt "aims to support all of the formatting options defined in std::fmt".  For integers
`format!` accepts `{:#}` (no effect, `42`), `{:e}`/`{:E}` (`4.2e1`, LowerExp is implemented
for the integer types) and `{:?}` (`42`); strfmt answers `Invalid("alternate ('#') cannot be
used with type ' '")` and `TypeError("Unknown format code 'e' for type")`.  `?` is in the
parser's list of type characters but no formatter accepts it.
"""

