[[bug]]
id = "strfmt/2"
title = "an explicit zero fill with right alignment (`{x:0>5}`) is refused for numbers"
kind = "contract"
severity = "medium"
test = "explicit_zero_fill_right_aligns_numbers"
found = { commit = "1948f91e5dc5becb19aa00f65aba2922790a4017", version = "0.2.5", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The numeric formatters return `Invalid("sign aware 0 padding not yet supported")` whenever
`fill == '0' && align == Right`, but `0>` is an ordinary fill and alignment, not the `0` flag
(which the parser turns into `Alignment::Equal` and is refused separately, as documented):
`{x:0>5}` of 42 is `00042` in `format!` and for strfmt's own string formatter (`{x:0>5}` of
`X` is `0000X`, pinned upstream), yet errors for `i64`/`f64`.  `0<` and `0^` are accepted.
"""

