# Bugs found in strfmt by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracle is Rust's own `format!`: strfmt promises std::fmt's formatting options for
# run-time format strings, and every spec the tests draw is rebuilt as a literal format string
# (core text, then padding).  What strfmt documents as unsupported (the `0` flag, `,`) or pins
# in its own tests (a sign, `#` or `,` on a string is an error) is not counted.

[[bug]]
id = "strfmt/1"
title = "a `+` sign or `#` prefix is written before the padding: `{x:>+7}` of 42 is `+     42`"
kind = "wrong-result"
severity = "medium"
test = "sign_and_prefix_are_inside_the_width"
found = { commit = "1948f91e5dc5becb19aa00f65aba2922790a4017", version = "0.2.5", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Formatter::i64` & co. (fmtnum.rs) write the `+` and the `0b`/`0o`/`0x` prefix straight to the
output buffer and then hand only the digits to `str_unchecked`, which pads them to the width:
`{x:>+7}` of 42 is `+     42` (8 characters, sign outside the field), `{x:<+7}` is `+42     `,
`{x:^+7}` `+  42   `, `{x:#8x}` `0x      2a`, and for floats `{x:+8.2}` of 42.5 is `+   42.50`.
`format!` gives `    +42`, `+42    `, `  +42  `, `    0x2a`, `  +42.50`.  Every signed or
alternate numeric field with a width is one or two characters wider than asked and the sign is
detached from the digits; the upstream tests only combine `+`/`#` with no width.
"""

