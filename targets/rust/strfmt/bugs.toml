[[bug]]
id = "strfmt/5"
title = "`Sign::is_unspecified()` is inverted"
kind = "contract"
severity = "low"
test = "sign_is_unspecified_is_not_inverted"
found = { commit = "1948f91e5dc5becb19aa00f65aba2922790a4017", version = "0.2.5", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
types.rs: `Sign::Unspecified => false, _ => true`.  `Sign::Unspecified.is_unspecified()` is
false and `Sign::Plus.is_unspecified()` true.  The crate's only caller (`Formatter::str`,
"Sign not allowed in string format specifier") relies on the inversion, so the public method
is wrong for everyone else who reads a `Formatter`'s sign in a `strfmt_map` closure.
"""

