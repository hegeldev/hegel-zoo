# Bugs found in dyn-fmt by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracle is the rustdoc contract: "replacing the {}s within self using provided parameters in
# the order given", `{{`/`}}` literal, "a runtime analog of format!/format_args!/write!".

[[bug]]
id = "dyn-fmt/1"
title = "displaying `Arguments` with a width or precision applies it to every text piece and argument separately"
kind = "wrong-result"
severity = "medium"
test = "outer_format_spec_is_not_applied_piecewise"
found = { commit = "c8599e0927db512dc02b0d7938493ad73dc42dcc", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`impl Display for Arguments` writes each text piece with `fmt[..].fmt(f)` and each argument
with `arg.fmt(f)`, handing the caller's `Formatter` — width, fill, alignment, precision, sign,
`#` — to every one of them.  `format!("{:>10}", Arguments::new("ab{}cd", &[1]))` is
`        ab         1        cd` (30 chars); `format!("{:.1}", Arguments::new("hello {}
world", &[1.25]))` is `h1.2 `: the text is truncated to one character per piece and the float
to one decimal; `{:+}` turns `x{}` into `x+1`.  `Arguments` is documented as "a runtime analog
of `format_args!`", whose `Display` ignores the outer spec (`format!("{:10}",
format_args!("ab{}cd", 1))` is `ab1cd`); a `String` would be padded or truncated as a whole.
Either is reasonable — applying the spec piecewise is neither, and it bites anyone who pads a
message with `write!(w, "{:<40}", args)`.  The fix is `f.write_str`/`write!(f, "{}", arg)`
instead of `fmt(f)`, or `f.pad`-style handling of the whole.
"""

[[bug]]
id = "dyn-fmt/2"
title = "a `{}` right after an unpaired `}` is not replaced: `\"a}{}b\".format(&[1])` is `a{b`"
kind = "contract"
severity = "low"
test = "hole_after_unpaired_close_brace_is_replaced"
found = { commit = "c8599e0927db512dc02b0d7938493ad73dc42dcc", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
After a `}` the state machine sets `piece_end = 1`, making the next character text whatever it
is — right for `}}`, but for an unpaired `}` followed by `{` it turns the `{` of a `{}` into a
literal and the hole's `}` into another unpaired brace: `"a}{}b".format(&[1])` is `a{b`, the
argument is never written and the placeholder that the docs promise is replaced is not.  The
same happens to `{x}{}` (`x{`).  `format!` rejects unpaired braces at compile time; the crate's
own rule (undocumented, visible in its tests) is that an unpaired brace is dropped, which would
give `a1b`.  Upstream's `complex_case_1` pins `{{}}x{{}{}}y{` → `{}x{{}y`, so the behaviour of
`}{}}` is deliberate there; with only one `}` after the hole the tokenisation is not ambiguous.
"""
