[[bug]]
id = "gitoxide/3"
title = "gix-url: to_bstring() is not lossless for hosts containing both ':' and '%': write_to() brackets any host with a ':' (IPv6 heuristic) once the URL has a port or the host has a '%', and escapes '%' as '%25' inside the brackets, but the file-URL parser keeps the authority verbatim as the host — file://a%:0/ parses with host a%:0, serializes to file://[a%25:0]/ and reparses with host [a%25:0]. Regression between 2315ede714da and 19beb949b897 (zone-id support added the '%' condition and escaping)"
kind = "roundtrip"
severity = "low"
test = "parse::properties::file_hosts_with_colon_and_percent_roundtrip_through_to_bstring"
found = { commit = "19beb949b897", version = "0.38.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Zoo-original, found by the 2026-09-13 bump run of parsed_urls_roundtrip_through_to_bstring (input file://%00@127.0.0.1:0/); did not exist at the previous base, where brackets were added only when a port is present. The property excludes hosts with both ':' and '%' while this is open."

