[[bug]]
id = "iso8601/1"
title = "`Date::Week → chrono::NaiveDate` is one day late and fails for Sundays: the ISO week-day `d` (1 = Monday … 7 = Sunday) is fed to chrono's 0-based `Weekday::from_u32`"
kind = "correctness"
severity = "medium"
test = "week_dates_convert_to_the_day_jiff_names"
found = { commit = "65e10440fed6", version = "0.6.6", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/chrono.rs:15–16 (`impl TryFrom<crate::Date> for chrono::NaiveDate`, feature `chrono`): `crate::Date::Week { year, ww, d } => chrono::Weekday::from_u32(d).and_then(|d| chrono::NaiveDate::from_isoywd_opt(year, ww, d))`. chrono's `FromPrimitive for Weekday` (and its `TryFrom<u8>`) numbers the days 0 = Monday … 6 = Sunday, while the parser's `d` is the ISO 8601 week-day 1 = Monday … 7 = Sunday (`date_week_day`, parsers.rs, range 1..=7). So every week date converts to the following day (`2023-W06-2`, Tuesday 7 February 2023, gives 2023-02-08) and every Sunday (`d = 7`) is unconvertible (`from_u32(7)` is `None`, so `into_naive()`/`try_from` fail). `Date::into_naive`, `DateTime::into_fixed_offset` and `DateTime::into_naive` inherit it for the week form. The crate's own tests enshrine the shift: `test_date::naivedate_from_ywd` and `test_datetime::datetime_from_iso_ywd` expect `2023-W06-2` to be 8 February. Fix: `chrono::Weekday::from_u32(d - 1)` (or `Weekday::try_from((d - 1) as u8)`). Found by the first run of the pinned test (jiff's `ISOWeekDate` as oracle). Not in the upstream tracker (12 issues, none on week dates or the chrono feature)."

[[bug.observed]]
version = "0.6.6"
commit = "65e10440fed6"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "iso8601/2"
title = "A duration whose `T` is followed by no time unit (`PT`, `P1YT`) is accepted as a zero time part, and a trailing `T` is swallowed by the low-level parser"
kind = "correctness"
severity = "low"
test = "a_bare_time_designator_is_rejected"
found = { commit = "65e10440fed6", version = "0.6.6", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/parsers.rs `duration_time` is `(opt(duration_hour), opt(duration_minute), opt(duration_second_and_millisecond))`, which succeeds on empty input, and `duration_ymdhms` wraps it in `opt(preceded(tag(\"T\"), duration_time))`; the `at least one element must be present` check then sees `time.is_some()` and accepts. So `duration(\"PT\")` is `Ok(YMDHMS { 0, 0, 0, 0, 0, 0, 0 })` (while `duration(\"P\")` is correctly `Err`), `duration(\"P1YT\")` is one year, and `parsers::parse_duration(b\"P1DT12:00\")` consumes the `T` and returns `12:00` as the remainder — a `T` that belongs to what follows is eaten. The grammar the `Duration` docs quote (RFC 3339 appendix A: `dur-time = \"T\" (dur-hour / dur-minute / dur-second)`) requires a unit after `T`; jiff rejects `PT` (\"found a time designator … but did not find any time units\"). Fix: require at least one of the three in `duration_time` (e.g. fail when all are `None`). Found by the first 1 000-case run. Not in the upstream tracker."

