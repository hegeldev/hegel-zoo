[[bug]]
id = "uv-requirements-txt/3"
title = "An option's value cannot follow a backslash line continuation (`--index-url \\` newline URL) although the grammar allows wrappable whitespace there"
kind = "contract"
severity = "low"
test = "option_values_may_follow_a_line_continuation"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The module's grammar says `requirements_include = '-r' ('=' | wrappable_whitespaces) filepath`
(and the same for `-c`, `-e`), where `wrappable_whitespaces = whitespace ('\\\\\\n' | whitespace)*`,
and pip joins backslash-continued lines before parsing, so `--index-url \\` + newline + URL is one
option in pip. `parse_value` eats plain whitespace only (`s.eat_whitespace()`, not
`eat_wrappable_whitespace`), so the value becomes the backslash: `--index-url \\`+URL fails with
`RelativeUrlWithoutBase` for the URL "", `-r \\`+`sub.txt` tries to read the requirements
directory itself ("Is a directory"), `--find-links` and `--extra-index-url` fail alike. Hash
tails (`requests \\` + `--hash=…`) do accept the continuation. Low.
"""

[[bug.observed]]
version = "0.0.80"
commit = "83d556d712c7"
hegel = "0.44.1"
date = "2026-09-14"
result = "reproduces"

[[bug.observed]]
version = "0.0.80"
commit = "c40e652bc385"
hegel = "0.44.1"
date = "2026-09-14"
result = "reproduces"
[[bug]]
id = "uv-requirements-txt/4"
title = "`--hash` values are not checked against the documented `name:digest` shape (`--hash=0000` accepted)"
kind = "contract"
severity = "low"
test = "hash_values_have_the_documented_shape"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The grammar in the module documentation gives `hashes = ('--hash' ('=' | wrappable_whitespaces)
[a-zA-Z0-9-_]+ ':' [a-zA-Z0-9-_] …)*`, and pip refuses a value without the colon ("Arguments to
--hash must be a hash name followed by a value, like --hash=sha256:abcde..."). `parse_hashes`
keeps any non-whitespace text (`requests --hash=0000` parses with `hashes: ["0000"]`); the shape
is only checked later, when uv converts the strings into `HashDigest`s. Low: caught downstream
with a different error position.
"""

