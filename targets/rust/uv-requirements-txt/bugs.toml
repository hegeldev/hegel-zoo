[[bug]]
id = "uv-requirements-txt/1"
title = "A `#` inside an option's value ends the value: `--index-url https://h/simple#frag` loses the fragment, `-r sub#1.txt` reads `sub`"
kind = "wrong-result"
severity = "low"
test = "hash_in_option_values_is_not_a_comment"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
pip's requirements-file format starts a comment only at a `#` that begins the line or follows
whitespace (`COMMENT_RE = (^|\\s+)#.*$`), and the crate follows that rule for requirement lines
(`requests#x` is not a comment). For option values, however, `parse_value` reads
`while !is_terminal(c)` with `is_terminal = '\\n' | '\\r' | '#'`, so any `#` ends the value and
the rest of the line is skipped as a comment: `--index-url https://example.com/simple#frag`
gives `https://example.com/simple`, `--find-links https://h/links#x` drops `#x`, and
`-r sub#1.txt` tries to read `sub` (a file `sub.txt#frag` that does not exist is "found" as
`sub.txt`). pip keeps the whole token. Low: `#` in index URLs and file names is rare.
"""

