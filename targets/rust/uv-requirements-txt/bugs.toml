[[bug]]
id = "uv-requirements-txt/2"
title = "`--no-binary`/`--only-binary` reject pip's comma-separated lists (`--no-binary a,b`)"
kind = "contract"
severity = "low"
test = "binary_options_take_comma_lists"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
pip documents `--no-binary <format_control>` as ":all:", ":none:", "or one or more package
names with commas between them" (`FormatControl.handle_mutual_excludes` splits on `,`). The
crate hands the whole value to `PackageNameSpecifier::from_str`, so `--no-binary a,b` (and
`--only-binary :none:,a`) fails with "Not a valid package or extra name: \\"a,b\\"" where pip
records both names. Low: the repeated-flag spelling works.
"""

