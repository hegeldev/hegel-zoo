name = "uv-requirements-txt"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-requirements-txt"
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "c40e652bc385f4407f166f56d99e426abbcc0826"
date = "2026-09-14"
version = "0.0.80"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import pip._internal.req.req_file, packaging.requirements' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages packaging"]
command = "cargo test --no-fail-fast"

[expected_failures]
"hash_in_option_values_is_not_a_comment" = "uv-requirements-txt/1"
"binary_options_take_comma_lists" = "uv-requirements-txt/2"
"option_values_may_follow_a_line_continuation" = "uv-requirements-txt/3"
"hash_values_have_the_documented_shape" = "uv-requirements-txt/4"
