[[bug]]
id = "textwrap/2"
title = "wrap() with WordSeparator::UnicodeBreakProperties and break_words emits lines with trailing whitespace or whitespace-only lines when a space follows opening punctuation (\"( ab\" at width 2 → [\"( \", \"ab\"]), contrary to the documented \"trailing whitespace is discarded\"; re-wrapping the output gives a different result"
kind = "contract"
severity = "low"
test = "wrap::tests::hegel_wrap_is_idempotent"
found = { commit = "7debe996ca88", version = "0.16.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found in the zoo by the 10x-budget rotation (HEGEL_TEST_CASES=1000; three default-budget runs had passed); Hegel's case was text \"( 你好世界\", width 0, break_words, UnicodeBreakProperties → [\"(\", \" \", \"你\", …] vs [\"(\", \"\", \"你\", …] on re-wrap. Repro (scratch test, default features): `wrap(\"( ab\", Options::new(2).break_words(true).word_separator(WordSeparator::UnicodeBreakProperties))` → [\"( \", \"ab\"]; wrapping that output again → [\"(\", \"ab\"]. Same at widths 0–3, with \"a( 你好\" (line \"a( \"), with two spaces (\"(  你好\" at width 3 → line \"(  \", width 0 → two \" \" lines). Never with WordSeparator::AsciiSpace; never without break_words. Cause: the Unicode line-breaking rules forbid a break after opening punctuation even across spaces (UAX #14 LB14, OP SP* ×), so find_words_unicode_break_properties yields \"( ab\" as one word whose whitespace is inside it; break_words then splits the over-long word per character (wrap_algorithms::break_words) and the space fragments become line content, which the trailing-whitespace trimming in wrap_single_line never sees. wrap.rs docs: \"The lines do not have trailing whitespace\" / \"As a rule, leading whitespace (indentation) is preserved and trailing whitespace is discarded.\" No upstream issue found (searches: whitespace line, idempotent); #575 (open, Unicode whitespace in UnicodeBreakProperties.find_words) is adjacent but about which characters count as whitespace."

[[bug.observed]]
version = "0.16.3"
commit = "7debe996ca88"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"
note = "First observation; 1000-case budget. Marked intermittent in [expected_failures]: the trigger needs an opening bracket followed by a space in a word too long for the width, which the default 100 cases had not produced in three runs."

