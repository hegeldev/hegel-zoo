[[bug]]
id = "lintian-overrides/6"
title = "`?` is not a wildcard in `info_matches` (lintian: any single character)"
kind = "differential"
severity = "medium"
test = "a_question_mark_matches_one_character"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
lintian matches override contexts with `Lintian::Util::match_glob`, i.e.
`Regexp::Wildcards->new(type => 'jokers')`: `*` → `.*`, `?` → `.`, the
rest quoted. `info_matches("a?c", "abc")` is false in the crate, true in
lintian, so an override written with `?` is reported as matching nothing.
"""

