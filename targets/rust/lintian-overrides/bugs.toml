[[bug]]
id = "lintian-overrides/4"
title = "`OverrideLine::info()` includes the line's trailing whitespace (and `\\r` on CRLF files)"
kind = "wrong-result"
severity = "low"
test = "info_is_the_context_without_trailing_whitespace"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The INFO token runs to the end of the line, so `foo: some-tag ctx  \\n` has
`info() == Some("ctx  ")`; lintian's pattern is `ctx` (trimmed, inner
whitespace collapsed). `matches()` trims before comparing, but every other
consumer of `info()` (equality with a hint's context, `map_overrides`
transforms, display) sees the padding.
"""

