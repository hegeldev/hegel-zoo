[[bug]]
id = "lintian-overrides/5"
title = "`info_matches` accepts values where the pattern's literal parts would have to overlap (`ab*b` matches `ab`, `*foo*foo` matches `xfoo`)"
kind = "wrong-result"
severity = "medium"
test = "overlapping_literal_parts_do_not_match_twice"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The matcher checks the prefix with `starts_with`, the suffix with
`ends_with` and the middle parts with successive `find`s, independently of
each other, so a literal part may be matched by the same characters as its
neighbour: `info_matches("ab*b", "ab")`, `("a*a", "a")`, `("*b*bc", "xbc")`
and `("a*bc*cd", "abcd")` are all true where lintian's `match_glob`
(`^ab.*b\\z` etc.) says false. An override such as `some-tag *foo*foo` then
suppresses hints it should not.
"""

