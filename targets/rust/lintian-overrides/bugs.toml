[[bug]]
id = "lintian-overrides/9"
title = "`map_overrides` drops the package type when the transform returns no package name"
kind = "silent-corruption"
severity = "medium"
test = "map_overrides_keeps_a_package_type_without_a_package_name"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The rebuilt line only emits a PACKAGE_SPEC inside `if let Some(pkg) =
package`, and the type inside that. A transform returning `(None,
Some("source"), tag, info)` — the natural identity for a `source:
some-tag` line, since `line.package()` is `None` — produces `some-tag`
with no spec, silently widening the override to every package type.
"""

