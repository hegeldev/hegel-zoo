[[bug]]
id = "lintian-overrides/8"
title = "`matches()` with no issue info returns true for an override that has a context pattern"
kind = "wrong-result"
severity = "medium"
test = "an_override_with_a_pattern_does_not_match_a_hint_without_context"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`OverrideLine::matches` only consults the override's info when
`issue_info` is `Some`, so `foo: some-tag [debian/rules:3]` "matches" a
`some-tag` hint with no context. In lintian a hint with an empty context
is overridden only by an override with an empty pattern (or a glob that
matches the empty string, `*`); an override written for one file must not
suppress the general tag.
"""

