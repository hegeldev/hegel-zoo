[[bug]]
id = "lintian-overrides/3"
title = "Whitespace between a bare type keyword and its colon is dropped from the tree: `source : tag` renders as `source: tag`"
kind = "roundtrip"
severity = "medium"
test = "whitespace_before_a_bare_type_colon_is_kept"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In `lex_package_spec` the bare-type path computes `after =
rest[end..].trim_start()` and hands `after` to `finish_spec` without
emitting the skipped whitespace as a token, so `LintianOverrides::parse
("source : some-tag\\n").tree().text()` is `source: some-tag\\n`. The
"format-preserving" tree is then shorter than its source and every range
after the spec (`tag_range`, `info_range`, `line_at_offset`, the error
offsets) is off by the dropped width. The name path (`foo : tag`) keeps
the whitespace.
"""

