[[bug]]
id = "lintian-overrides/11"
title = "`LintianOverridesBuilder::add_comment` emits the text as a COMMENT token without a `#`, so the built tree disagrees with its own text"
kind = "roundtrip"
severity = "low"
test = "a_built_comment_is_a_comment_in_the_text"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`add_comment("a comment")` gives a line whose `is_comment()` is true and
whose text is `a comment\\n`; parsing that text yields an override with tag
`a` and info `comment`. The builder should prepend `# ` (or document that
the caller must). `add_comment("# a comment")` is fine, which is what the
crate's own test passes.
"""

