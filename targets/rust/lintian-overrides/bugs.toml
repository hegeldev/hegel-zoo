[[bug]]
id = "lintian-overrides/10"
title = "`map_overrides` drops the architecture list of every transformed line"
kind = "silent-corruption"
severity = "medium"
test = "map_overrides_keeps_the_architecture_list"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The transform's result carries package, type, tag and info only, and the
rebuilt PACKAGE_SPEC never copies the `[…]` tokens, so renaming the tag of
`foo [amd64] binary: some-tag` through `map_overrides` yields `foo binary:
other-tag`: an architecture-specific override becomes unconditional, with
no error. `rename_tags` keeps the list; `map_overrides` should copy the
arch tokens it cannot express, or refuse.
"""

