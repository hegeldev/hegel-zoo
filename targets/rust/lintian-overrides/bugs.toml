[[bug]]
id = "lintian-overrides/7"
title = "A backslash does not escape a wildcard in `info_matches` (`a\\*` should match the literal `a*`)"
kind = "differential"
severity = "low"
test = "a_backslash_escapes_a_wildcard"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Regexp::Wildcards ("jokers") turns `\\*` into a literal `*` and `\\?` into
a literal `?`. The crate splits on every `*`, so `info_matches("a\\\\*",
"a*")` is false (it wants the value to start with `a\\`) and
`info_matches("a\\\\*", "a\\\\b")` is true.
"""

