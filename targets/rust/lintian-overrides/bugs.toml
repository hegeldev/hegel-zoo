[[bug]]
id = "lintian-overrides/2"
title = "A line with an architecture list but no colon (`[amd64] some-tag`) is an override with the tag `[amd64]` instead of an error"
kind = "differential"
severity = "low"
test = "a_package_spec_without_a_colon_is_an_error"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
lintian requires the colon once any package detail is present ("Expected a
colon", the line is skipped). `lex_package_spec` returns `SpecScan::None`
when no colon follows, and the fallback lexes the whole line as tag + info,
so `[amd64] some-tag` yields a tag `[amd64]` with info `some-tag` and no
parse error; a tag cannot start with `[`.
"""

