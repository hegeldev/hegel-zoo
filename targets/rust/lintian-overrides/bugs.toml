# Bugs found in lintian-overrides by the Hegel tests, against lintian itself
# (`Lintian::Processable::Overrides::parse_overrides` and
# `Lintian::Util::match_glob`, driven as a Perl child) and the crate's own
# contract (a format-preserving tree). All zoo-original; jelmer/debian-parsers
# has no related issue.

[[bug]]
id = "lintian-overrides/1"
title = "A package spec whose colon follows the last word directly (`foo:some-tag`) is read as the tag `foo:some-tag`"
kind = "differential"
severity = "low"
test = "a_colon_without_a_space_still_ends_the_package_spec"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.7", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
lintian strips the package name with `^\\Q$package\\E(?=\\s|:)` and then the
colon with `s/^\\s*:\\s*//`, so `foo:some-tag` is package `foo`, tag
`some-tag`. `finish_spec` only accepts a colon followed by whitespace or the
end of the line (to keep `line 51:` as info), so the crate reads one tag
`foo:some-tag` with no package spec. (The same rule makes `foo: some-tag` fine.)
"""

