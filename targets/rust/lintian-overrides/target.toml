name = "lintian-overrides"
language = "rust"
upstream = "https://github.com/jelmer/debian-parsers"
subdir = "lintian-overrides"
license = "Apache-2.0"
ai_policy_checked = "2026-09-13"

[base]
commit = "4dc04da822298d3586902520119d04fd89f9218c"
date = "2026-09-05"
version = "0.1.7"

[hegel]
version = "0.44.1"

[run]
setup = ["perl -I/usr/share/lintian/lib -MLintian::Processable::Overrides -MText::Glob -MJSON::PP -e 1"]
command = "cargo test --no-fail-fast"

[expected_failures]
"a_colon_without_a_space_still_ends_the_package_spec" = "lintian-overrides/1"
