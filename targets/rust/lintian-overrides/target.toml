"whitespace_before_a_bare_type_colon_is_kept" = "lintian-overrides/3"
"info_is_the_context_without_trailing_whitespace" = "lintian-overrides/4"
"overlapping_literal_parts_do_not_match_twice" = "lintian-overrides/5"
"a_question_mark_matches_one_character" = "lintian-overrides/6"
"a_backslash_escapes_a_wildcard" = "lintian-overrides/7"
"an_override_with_a_pattern_does_not_match_a_hint_without_context" = "lintian-overrides/8"
"map_overrides_keeps_a_package_type_without_a_package_name" = "lintian-overrides/9"
"map_overrides_keeps_the_architecture_list" = "lintian-overrides/10"
