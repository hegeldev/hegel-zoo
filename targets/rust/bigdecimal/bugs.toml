[[bug]]
id = "bigdecimal/4"
title = "to_engineering_notation() emits an exponent below i64::MIN for values with scale near i64::MAX, and FromStr rejects the string (\"Exponent overflow\"): the crate's own engineering notation does not round-trip"
kind = "contract"
severity = "low"
test = "impl_fmt::test::hegel_props::engineering_notation_then_parse_roundtrips"
found = { commit = "7f0243e73702", version = "0.4.11+dev", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found in the zoo by the 10x-budget rotation (HEGEL_TEST_CASES=1000; two default-budget runs had passed). Repro: `BigDecimal::new(BigInt::from(1), i64::MAX).to_engineering_notation()` is \"100e-9223372036854775809\", and `\"100e-9223372036854775809\".parse::<BigDecimal>()` is Err(Other(\"Exponent overflow …\")). Cause: `impl_fmt::write_engineering_notation` computes the exponent in i128 (`top_digit_exponent - shift_amount`, shift up to 3), so for the topmost scales it prints an exponent outside i64; `FromStr` (impl_num.rs) computes scale = fraction_digits − exponent and requires it to fit i64 before normalising the mantissa's trailing zeros, so the mantissa \"100\" with exponent −(2^63+1) is refused although the value (1, i64::MAX) is representable. Scientific notation of the same value (\"1e-9223372036854775807\") round-trips, as does engineering notation at scale i64::MAX−1, i64::MAX−2 and at i64::MIN..MIN+2. Only affects scales within a few units of i64::MAX. Fix options: parse the exponent/scale in i128 and normalise before the range check, or return an error from the writer. No upstream issue found (search: engineering notation)."

