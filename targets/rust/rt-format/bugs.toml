# Bugs found in rt-format by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracle is Rust's own `format!`: the crate promises "all the formatting features of the
# format! macro, except for the fill character", for format strings supplied at run time.

[[bug]]
id = "rt-format/1"
title = "a `$` width or precision name may not contain `_` or non-ASCII letters: `{:my_width$}` is an error"
kind = "contract"
severity = "medium"
test = "dollar_names_are_identifiers"
found = { commit = "1538a9ff4cc64fecd714ae598457c30f6df1adfa", version = "0.3.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The spec regex (parser.rs, `SPEC_REGEX_FRAG`) matches a named width or precision with
`[[:alpha:]][[:alnum:]]*\\$` — ASCII letters and digits only — while the argument name in the
same regex is a Rust identifier (`[\\p{XID_Start}_][\\p{XID_Continue}]*`).  So `{:my_width$}`,
`{:_w$}`, `{:.my_prec$}`, `{:größe$}` are `Err`, where `format!("{:my_width$}", 42, my_width =
6)` compiles and prints `    42`; `{:w1$}` works.  snake_case is the usual spelling of such a
name.  Reported position is 0 (the whole substitution).
"""

[[bug]]
id = "rt-format/2"
title = "a width or precision above 65535 parses and then panics when the ParsedFormat is displayed"
kind = "crash"
severity = "medium"
test = "huge_widths_do_not_panic"
found = { commit = "1538a9ff4cc64fecd714ae598457c30f6df1adfa", version = "0.3.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`ParsedFormat::parse("{:70000}", …)` succeeds (`Width::AtLeast { width: 70000 }`), and
`format!("{}", parsed)` then panics inside `format_value` with "Formatting argument out of
range": since Rust 1.87 `core::fmt` stores run-time widths and precisions as u16 and panics
above 65535 (`{:width$}` with width = 70000 panics; a literal `{:70000}` is a compile error).
`{:.70000}` and `{:1$}` with an argument of 70000 panic the same way; `{:65535}` is fine.  The
crate's purpose is format strings that come from outside at run time, and `parse` is the place
that validates them — it should refuse (or clamp) what `Display` will panic on.
"""

[[bug]]
id = "rt-format/3"
title = "the debug-hex formats `{:x?}` and `{:X?}` are not accepted"
kind = "contract"
severity = "low"
test = "debug_hex_formats"
found = { commit = "1538a9ff4cc64fecd714ae598457c30f6df1adfa", version = "0.3.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`format!` has ten types: `? o x X b e E` and also `x?`/`X?` (Debug with lower/upper-case hex
integers, `format!("{:x?}", 42)` = `2a`, `{:#X?}` = `0x2A`).  The regex takes one character,
`(?P<format>[?oxXbeE])?`, and `Format` has no variant for them, so `{:x?}` is `Err(0)`.  Not
among the documented exceptions (only the fill character is).
"""

[[bug]]
id = "rt-format/4"
title = "the `-` flag is not accepted"
kind = "contract"
severity = "low"
test = "minus_flag_is_accepted"
found = { commit = "1538a9ff4cc64fecd714ae598457c30f6df1adfa", version = "0.3.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
std::fmt's grammar has `sign := '+' | '-'`; `-` is "currently not used" but accepted, so
`format!("{:-5}", 42)` prints `   42`.  rt-format's `(?P<sign>\\+)?` knows only `+`: `{:-}`
and `{:-5}` are `Err(0)`.
"""

[[bug]]
id = "rt-format/5"
title = "`parse_specifier` accepts a spec followed by anything: `5xjunk` parses as `5x`"
kind = "contract"
severity = "low"
test = "parse_specifier_rejects_trailing_text"
found = { commit = "1538a9ff4cc64fecd714ae598457c30f6df1adfa", version = "0.3.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The public `parser::parse_specifier` anchors its regex at `^` only (`concat!(r"(?x) ^",
SPEC_REGEX_FRAG!())`), so any text after the longest spec prefix is ignored:
`parse_specifier("5xjunk")` is `Ok(Specifier { width: 5, format: LowerHex, .. })`, and so are
`"5x}"`, `"5x "`, `"5x."`.  Inside a format string the closing `\\}` anchors the same fragment,
so `{:5xjunk}` is correctly an error; the standalone function, meant for callers who split
the spec out themselves, silently drops what it does not understand.
"""
