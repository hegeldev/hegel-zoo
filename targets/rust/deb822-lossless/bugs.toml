[[bug]]
id = "deb822-lossless/3"
title = "CRLF files fall apart: `\\r` is a newline of its own, so every line ends a paragraph and continuation lines are orphaned"
kind = "differential"
severity = "medium"
test = "crlf_documents_keep_their_paragraphs"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "fixed"
upstream_issue = ""
fixed_in = "0.5.18 (b1568f26a9e5)"
notes = """
`lex::is_newline` treats `\\r` and `\\n` alike and emits one NEWLINE token per character, so `\\r\\n`
is two newlines: `A: 1\\r\\nB: 2\\r\\n` parses (without error) into two paragraphs, and `A: a\\r\\n b\\r\\n`
is rejected with "unexpected indentation without field" / "orphaned text without field name". dpkg
and python-debian read both as one paragraph (`{A: 1, B: 2}` and `A: a\\nb`). Found by
`paragraphs_are_read_like_python_debian`.
"""

