# Bugs found in deb822-lossless by the Hegel tests, against dpkg's `Dpkg::Control::HashCore`
# (dpkg 1.22) and python-debian's `Deb822` (2.0) as the oracles. All zoo-original;
# jelmer/debian-parsers has no related issue.

[[bug]]
id = "deb822-lossless/1"
title = "Trailing whitespace on a value line is part of `value()`: `Section: net   ` reads as `net   `"
kind = "differential"
severity = "medium"
test = "trailing_whitespace_is_not_part_of_the_value"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The lexer's VALUE token runs to the end of the line, trailing spaces and tabs included (its own
test expects `(VALUE, "net   ")`), and `Entry::value()` joins the VALUE tokens as they are, so
`Paragraph::get("Section")` is `"net   "` where dpkg and python-debian both give `"net"` (Policy 5.1:
horizontal whitespace before or after the value is ignored). The same happens on continuation lines.
Found by `paragraphs_are_read_like_dpkg` / `paragraphs_are_read_like_python_debian`; the CST keeps the
whitespace either way, so `value()` could strip it without losing anything.
"""

