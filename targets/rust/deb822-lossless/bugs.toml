[[bug]]
id = "deb822-lossless/4"
title = "A continuation line whose text starts with `#` is lexed as a comment; the strict parser rejects the field"
kind = "differential"
severity = "medium"
test = "an_indented_hash_is_value_text"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The lexer starts a COMMENT at any `#` that follows only indentation on its line, so ` #c` inside a
multi-line value becomes INDENT + COMMENT and the parser reports "empty continuation line" (then
"unexpected indentation without field" for the lines after it). dpkg and python-debian only treat `#`
in column 0 as a comment: `A: a\\n #c\\n b\\n` is `a\\n#c\\nb` for both. `wrap_and_sort` with
`immediate_empty_line` runs into the same lexer rule from the other side: it moves a first line
starting with `#` (`A:#\\n .`) onto a continuation line, and its output no longer parses. Found by
`lookups_are_case_insensitive_first_matches` and `wrap_and_sort_is_canonical`.
"""

