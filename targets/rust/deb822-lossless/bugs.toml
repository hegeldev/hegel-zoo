[[bug]]
id = "deb822-lossless/8"
title = "Rewriting a field with an empty first line breaks the lines: `set` puts the new value on an unindented line, `change_field_indent` splits the paragraph"
kind = "silent-corruption"
severity = "medium"
test = "set_writes_the_value_after_a_bare_colon"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Paragraph::set` (via `try_set`) keeps the existing entry's post-colon whitespace and indentation; for
`A:\\n` or `A: \\n` there is no VALUE token to replace, so the new value is appended after the entry's
NEWLINE: `A:\\nB: 1\\n` + `set("A", "a")` = `A:\\na\\nB: 1\\n`, which no longer parses ("field name
without value"). `change_field_indent("A", Fixed(1))` on the same entry writes `A:\\n\\nB: 1\\n`, i.e. a
blank line that splits the paragraph in two. Found by `edits_are_read_back`.
"""

