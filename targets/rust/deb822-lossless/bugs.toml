[[bug]]
id = "deb822-lossless/5"
title = "`Parse::reparse` is not a full parse: edits that join paragraphs keep them apart, and errors outside the reparsed region are dropped"
kind = "correctness"
severity = "medium"
test = "reparse_matches_a_full_parse"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`reparse` re-lexes only the root children overlapping the edit and splices the result in. Turning the
blank line of `\\n#\\nA:\\n` into a field (`A: \\n#\\nA:\\n`) gives two paragraphs where a full parse gives
one (the comment is absorbed into the first entry and the two fields share a paragraph); on erroneous
text (`:\\r\\n`) even a no-op edit loses the "orphaned colon" error, as the `TODO: preserve prefix/suffix
errors` in the code admits. Edits confined to a value line or replacing a field/continuation line by
another are fine (`incremental_reparse_of_a_value_edit_equals_a_full_parse`,
`incremental_reparse_of_valid_documents_equals_a_full_parse` pass). Also expected to fail:
`incremental_reparse_equals_a_full_parse`, `incremental_reparse_reports_the_same_errors`.
"""

