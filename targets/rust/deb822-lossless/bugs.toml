[[bug]]
id = "deb822-lossless/11"
title = "`move_paragraph` merges paragraphs: moving one forward in a three-paragraph file removes the blank line the next paragraph needs"
kind = "silent-corruption"
severity = "medium"
test = "moving_a_paragraph_forward_keeps_the_other_paragraphs_apart"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`move_paragraph` removes the paragraph together with the EMPTY_LINE before it and then calls
`delete_trailing_space`, which also removes the EMPTY_LINE after it — the separator between the two
paragraphs that now become neighbours, and the re-insertion (through `convert_index`, see /7) lands
before the paragraph it should follow. `A: 1\\n\\nB: 2\\n\\nC: 3\\n` + `move_paragraph(1, 2)` yields
`A: 1\\n\\n\\nB: 2\\nC: 3\\n`: B has not moved and now shares a paragraph with C. Two-paragraph files,
where nothing follows the removed separator, move correctly. Found by `edits_are_read_back`.
"""

