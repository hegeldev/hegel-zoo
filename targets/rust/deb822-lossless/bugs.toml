[[bug]]
id = "deb822-lossless/10"
title = "`Deb822::wrap_and_sort` is not idempotent on its own tree: a second pass glues the comment lines onto the first field (`# c\\nA: 1\\n` -> `# cA: 1\\n`)"
kind = "silent-corruption"
severity = "medium"
test = "wrap_and_sort_twice_keeps_the_comment_lines"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The first pass copies the tokens of the EMPTY_LINE nodes before a paragraph (COMMENT, NEWLINE) as bare
children of the new ROOT instead of wrapping them again. The second pass keeps root children of kind
ERROR or COMMENT and discards the rest, so the bare NEWLINE tokens vanish: `# c\\n# d\\nA: 1\\n` wrapped
twice is `# c# dA: 1\\n`, one comment line and no field. The paragraph operations count node children
(`self.0.children().count()`), so on the flattened tree `add_paragraph` inserts before the existing
paragraphs (`# c\\nA: 1\\n` wrapped + `add_paragraph` = `# c\\nB: 2\\n\\nA: 1\\n`) and the other index
operations are off by the number of bare tokens. The text of the first pass is right, so a
`wrap_and_sort` on a freshly parsed document is fine; the bug bites any tool that wraps, edits and
wraps again in memory. Found by `edits_are_read_back` (`add_paragraph`, `insert_comment_before`, two
document-level `wrap_and_sort`s).
"""

