[[bug]]
id = "deb822-lossless/9"
title = "Edits after a last line without a trailing newline glue lines together: `A: 1` + `insert(\"B\", \"2\")` = `A: 1B: 2`; swapping the last paragraph merges it with its neighbour"
kind = "silent-corruption"
severity = "medium"
test = "inserting_after_an_unterminated_last_line_starts_a_new_line"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Paragraph::insert` (and `set` for a new key) splices `Entry::new(key, value)` after the last child
without checking that the previous entry ends in a NEWLINE. A file without a final newline (`A: 1`,
which dpkg and python-debian read fine) becomes `A: 1B: 2\\n`: one field `A` with the value `1B: 2`.
`swap_paragraphs` and `move_paragraph` reorder the root children without terminating the moved
paragraph either: `A: 1\\n\\nB: 2` swapped is `B: 2\\nA: 1\\n`, a single paragraph. Found by
`edits_are_read_back`.
"""

