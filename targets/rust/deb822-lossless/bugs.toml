[[bug]]
id = "deb822-lossless/2"
title = "An empty first line is dropped from the value: `Description:\\n long` reads as `long`, not `\\nlong`"
kind = "wrong-result"
severity = "medium"
test = "an_empty_first_line_is_kept_in_the_value"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Entry::value()` collects VALUE tokens only; when nothing follows the colon on the first line there is
no VALUE token for it, so the continuation lines move up by one: `Description:\\n long text` yields
`"long text"` where dpkg gives `"\\nlong text"` and python-debian `"\\n long text"`. For `Description`
this turns an empty synopsis into `long text`. The setters write the inverse shape (`set("D", "\\nx")`
produces `D: \\n   x`, read back as `x`), so a document does not round-trip through `get`/`set`.
Found by `paragraphs_are_read_like_dpkg` and `entries_with_formatting_are_read_back`.
"""

