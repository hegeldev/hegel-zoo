[[bug]]
id = "deb822-lossless/7"
title = "`convert_index(0)` is root child 0 whatever it is: `remove_paragraph(0)` deletes a leading blank line instead of the paragraph, `move_paragraph` goes wrong around comments and double blank lines"
kind = "wrong-result"
severity = "medium"
test = "remove_paragraph_removes_the_paragraph_after_a_blank_line"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Deb822::convert_index` maps paragraph index 0 to physical child 0 without looking at its kind, so
with a leading blank line or comment `remove_paragraph(0)` on `\\nA: 1\\n` removes the `\\n` and keeps
the paragraph, and `move_paragraph(0, _)` removes the blank line and inserts a clone of the paragraph.
`move_paragraph` also relies on `convert_index` after `delete_trailing_space` (whose loop splices while
iterating and stops after one EMPTY_LINE), so on `A: 1\\n\\n# about B\\nB: 2\\n` or `A: 1\\n\\n\\nB: 2\\n`
`move_paragraph(0, 1)` leaves A first. Found by `edits_are_read_back`.
"""

