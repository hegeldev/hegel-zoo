[[bug]]
id = "deb822-lossless/6"
title = "`wrap_and_sort` turns a comment line inside a paragraph into value text (`A: x\\n#c` -> `A: x\\n #c`, `A:\\n#c` -> `A: #c`)"
kind = "silent-corruption"
severity = "medium"
test = "wrap_and_sort_keeps_comments_out_of_the_values"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parser attaches a `#` line that follows a field to that field's ENTRY node. `Entry::wrap_and_sort`
(`rebuild_value`) then treats the COMMENT token like any value token: after a non-empty value it is
re-indented (`A: x\\n #c\\n`, which the parser rejects, see /4), after an empty value it is glued onto
the field line (`A: #c\\n`, read back as the value `#c`). dpkg and python-debian read the original as
`A: x` / `A:` with the comment ignored. Found by `wrap_and_sort_is_canonical`.
"""

