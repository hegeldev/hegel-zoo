[[bug]]
id = "deb822-lossless/12"
title = "wrap_and_sort with a format_value callback rebuilds continuation lines as KEY tokens; the live tree reads only the first line"
kind = "wrong-result"
severity = "medium"
test = "wrap_and_sort_with_a_value_formatter_keeps_the_value_readable"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.18", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Entry::wrap_and_sort(indentation, immediate, max_len, Some(&format_value))`
re-lexes the formatted value without the parser's line context, so every
continuation line becomes INDENT + KEY + NEWLINE instead of INDENT + VALUE +
NEWLINE (the same call with `None` builds VALUE tokens). The text of the
result is correct, but `Entry::value()`, `Paragraph::get()` and
`get_multiline()` on the returned tree give only the first line ("first" for
`Key: first\\n second`). Every `format_value` user is affected, the identity
included; debian-copyright's `FilesParagraph::wrap_and_sort` passes one, so
`Copyright::wrap_and_sort` followed by `license()` on the live tree returns
`License::Name` for a license with text. Found while testing debian-copyright.
"""

