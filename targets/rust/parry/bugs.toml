[[bug]]
id = "parry/2"
title = "2D Triangle::project_local_point(pt, solid=false) for a point inside (or on the boundary of) a sliver triangle picks the wrong closest edge: the per-edge distances are computed as |ap|² − |proj|² (catastrophic cancellation in f32), so a point lying on one edge is 'projected' onto another edge up to the sliver's width away, and projection is not idempotent"
kind = "contract"
severity = "low"
test = "query::point_triangle::prop_triangle_projection_is_idempotent"
found = { commit = "3609fcc6bffe", version = "0.30.2", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found in the zoo by the 10x-budget rotation (HEGEL_TEST_CASES=1000; three default-budget runs had passed). Hegel's case (parry2d, f32): Triangle a=(0,0) b=(0,1) c=(0.062683314,−20), pt=(0,−5). First projection lands on edge ca: (0.015670674, −4.999951), location OnEdge(2). Projecting that point again returns (0.017909354, −4.9999447), OnEdge(1) = edge bc, 2.24e−3 away, although the point is 4.8e−7 from edge ca (Segment::project_local_point per edge: ab 5.0, bc 2.24e−3, ca 4.8e−7). Cause: src/query/point/point_triangle.rs, the 2D `!solid` interior branch (\"We have to project on the closest edge\", with the code's own `// TODO: be careful with numerical errors`): d_ab = |ap|² − |ab|²·v² etc. — the squared distance to each edge line via Pythagoras, which for |ap|² ≈ 25 has an f32 granularity of ~2e−6, i.e. it cannot separate edge distances below ~1.4e−3 (and ~0.03 at |ap| = 100). Along edge ca of that triangle 119 of 999 evenly spaced points are re-projected more than 1e−4·(1+|p|) away from themselves (worst 2.3e−3); for a fatter triangle (b=(3,1)) 2 of 999. Fix idea: compute each edge's projection point and use |pt − proj|² directly (as the Segment query does). No upstream issue found (search: project_local_point triangle)."

