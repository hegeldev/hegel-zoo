[[bug]]
id = "parry/3"
title = "2D Triangle::cast_ray(solid = true) reports t = 0 for a ray whose origin is not on a zero-area triangle: the origin-inside test compares the signs of the three edge perp_dots, which are all 0 on the supporting line (all of them for a point triangle), so 'inside' is concluded; the non-solid cast of the same ray is None"
kind = "contract"
severity = "low"
test = "geometry::ray_cast::known_failure_zero_area_triangle_solid_raycast_claims_origin_inside"
found = { commit = "3383f51cbbe9", version = "0.31.1", hegel = "0.44.1", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by the 3000-case run of the combinator-style rewrite (turn of 2026-09-23); the shape was reachable by the old generator too. Reproduction (parry2d, f32): Triangle a = b = (0,0), c = (1,0), Ray from (5,0) with direction (1,0), cast_ray(identity, ray, MAX, solid = true) = Some(0.0) while distance_to_point(origin) = 4 and the solid = false cast is None; a = b = c = (0,0) with a ray from (0,1) direction (0,1): Some(0.0), origin 1 away. Three distinct collinear vertices (0,0), (1,0), (2,0) with a ray from (5,0) along the line: Some(0.0) too. Cause: src/query/ray/ray_triangle.rs, cast_local_ray_and_get_normal, the `solid` branch computes perp_sign1..3 = edge.scaled_direction().perp_dot(origin - edge.a) > 0.0 and takes equal signs as 'origin inside'; a zero-area triangle gives 0.0 for every edge on its line, so the three `false`s agree. Fix idea: require the perp_dots to be nonzero (or the triangle's area to be nonzero) before concluding 'inside', and fall through to the edge casts otherwise. The property prop_raycast_hit_point_lies_on_shape skips exactly this branch's condition on zero-area triangles (4.8% of its cases, measured). Upstream issues #76 and #111 fixed other degenerate-triangle queries (point projection, area) but not this one; no issue found for the ray cast (search: parry triangle cast_ray solid degenerate)."

