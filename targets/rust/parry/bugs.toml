[[bug]]
id = "parry/4"
title = "2D intersection_test between a Cuboid and a clockwise Triangle reports an intersection for separated shapes: the SAT tries each triangle edge's counterclockwise normal in one direction only, so for a clockwise winding the outward separating axis is never tested (distance and closest_points find the gap; the same triangle wound counterclockwise, and a ConvexPolygon of the vertices, are right)"
kind = "contract"
severity = "medium"
test = "query::shape_query_consistency::known_failure_cuboid_clockwise_triangle_reported_intersecting_while_apart"
found = { commit = "3383f51cbbe9", version = "0.31.1", hegel = "0.44.1", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by the 3000-case run of the combinator-style rewrite (turn of 2026-09-23). Reproduction (parry2d, f32): Cuboid half-extents (1,1) at the identity pose against Triangle (0,2), (0,3), (2,1) (clockwise: perp_dot(b - a, c - a) = -2) at the identity pose: query::intersection_test(...).intersecting = true in both argument orders, query::distance = 0.4472137, closest_points = WithinMargin((1,1), (1.2,1.4)). The same vertices wound counterclockwise, (0,2), (2,1), (0,3): intersecting = false; the same vertices as a ConvexPolygon (GJK path): false; a farther triangle (0,3), (0,4), (3,1): false. Cause: src/query/sat/sat_cuboid_triangle.rs, triangle_support_map_find_local_separating_normal_oneway tests `edge.normal()` (Segment::normal, documented as the counterclockwise normal) once per edge; for a clockwise triangle the normals point into the triangle, so the separation along them is negative and the pair looks overlapping on every tested axis. Triangle's documentation calls counterclockwise order 'the standard convention' and says vertices 'should be' counterclockwise 'for proper normal calculation and consistent collision detection', but Triangle::new accepts either winding, TriangleOrientation exists for both, and every other query (distance, closest_points, contact, GJK) handles a clockwise triangle, so intersection_test disagreeing with distance is a bug of this SAT rather than a documented restriction. Fix idea: test each edge normal in both directions (or orient the normals by the triangle's signed area). The property prop_intersection_implies_zero_distance skips cuboid/clockwise-triangle pairs that are reported intersecting (3.6% of its cases, measured); prop_distance_is_symmetric still exercises the pairs. No upstream issue found (search: parry intersection_test cuboid triangle clockwise SAT)."

