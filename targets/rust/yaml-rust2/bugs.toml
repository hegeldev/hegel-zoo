[[bug]]
id = "yaml-rust2/1"
title = "YamlDecoder::decode infinite-loops on short expanding inputs: 8-byte UTF-16LE FF FE 34 12 34 12 34 12 hangs forever — decode_loop grows the output buffer by input.len()/10 (=0 for <10-byte input) on O"
kind = "abort"
severity = "medium"
test = "known_bug_decoder_hangs_on_short_expanding_input"
found = { commit = "9f39918876eb", version = "", hegel = "0.28.2", date = "2025-12-16" }
status = "fixed"
upstream_issue = "https://github.com/Ethiraric/yaml-rust2/issues/78"
fixed_in = "0.11.1"
notes = "Predecessor trophy #44 (yaml-rust2 (9f39918)); found by fable. Triage there: confirmed (my 5s-timeout repro hangs), novel — ready to file (DoS on untrusted input). Upstream issue #78 reported the same hang independently; fixed in v0.11.1. The reproducer is #[ignore] (a regression would hang the suite) and is run by hand at each bump."

[[bug.observed]]
version = "0.13.0"
commit = "e12069447073"
hegel = "0.44.1"
date = "2026-09-13"
result = "fixed"
note = "Run by hand (cargo test known_bug_decoder -- --ignored, 60 s timeout): returns immediately with the expected single document. decode_loop (src/yaml.rs) now reserves (input.len() / 10).max(4) bytes per iteration, guaranteeing progress — CHANGELOG v0.11.1, issue #78."

