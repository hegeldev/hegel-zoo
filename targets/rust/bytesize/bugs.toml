[[bug]]
id = "bytesize/1"
title = "Decimal texts with an SI unit parse one byte short: `1.001 kB` is 1 000, `8192.3 kB` is 8 192 299, `2.01 GB` is 2 009 999 999 (the f64 product is truncated, not rounded)"
kind = "correctness"
severity = "medium"
test = "decimal_texts_denoting_whole_bytes_parse_exactly"
found = { commit = "da17fdc04a3c", version = "2.7.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/parse.rs `impl FromStr for ByteSize`: a number with a `.` takes the path `Ok(u) => Ok(Self((v * u) as u64))`, i.e. the decimal parsed as `f64`, multiplied by the unit factor and truncated by `as u64`. A decimal such as 8192.3 is not representable, and the product `8192.3 × 1000` rounds to 8192299.9999999995, which truncates to 8192299 — one byte short of the 8 192 300 the text denotes. Density: 782 of the 90 000 one-decimal `x.y kB` texts for x < 10 000 (`32.3 kB` → 32299, `64.1 kB` → 64099, `128.7 kB` → 128699 …) and 1 810 of the 99 000 two-decimal `x.yz GB` texts for x < 1000 (`2.01 GB` → 2009999999, `2.03 GB`, `2.05 GB`, `2.07 GB`, `2.09 GB`, `2.11 GB` …). IEC units are unaffected (a whole-byte binary fraction is exactly representable) and integer texts are exact by the dedicated integer path added for #2^53 rounding — the crate already treats byte counts as exact there; the decimal path needs decimal arithmetic (scale the digits by 10^k as integers and divide) or a rounding to the nearest integer before truncation. Found by the first 1 000-case run of the parse property. Not in the upstream tracker (12 issues; #157 is about `xB`-vs-`XiB` spellings)."

