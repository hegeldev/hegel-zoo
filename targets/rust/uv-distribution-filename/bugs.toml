[[bug]]
id = "uv-distribution-filename/2"
title = "A trailing `.` in a tag component is ignored (`py3.`, `none.`) while a leading or doubled `.` is rejected"
kind = "contract"
severity = "low"
test = "trailing_dot_in_a_tag_component_is_an_empty_atom"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`MemchrSplitter` (src/splitter.rs) yields no final piece when the haystack ends with the
delimiter, so `parse_large_tag_component("py3.")` sees the atoms `["py3"]` and accepts, while
`".py3"` and `"py3..py2"` produce an empty atom and are rejected. `packaging` rejects all three
("has an empty component"). `foo-1.0-py3.-none-any.whl` and `foo-1.0-py3-none.-any.whl` parse
and are displayed with the stray dot.
"""

