[[bug]]
id = "uv-distribution-filename/1"
title = "Single-tag fast path accepts a `+` in the numbers of a tag (`py3+9`, `cp3+9`, `manylinux_+2_17_x86_64`) and rewrites it"
kind = "wrong-result"
severity = "low"
test = "fast_path_tags_take_no_plus_sign"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`WheelFilename::parse` takes a fast path when no tag component contains a `.`: it calls
`LanguageTag::from_str`, `AbiTag::from_str` and `PlatformTag::from_str` directly and never runs
the `is_tag_atom_byte` check of the compressed-tag path. Those parsers read their numbers with
`str::parse::<u8>`/`<u16>`, which accepts a leading `+`, so `foo-1.0-py3+9-none-any.whl` parses
(displayed as `foo-1.0-py39-none-any.whl`), as do `cp3+9`, `manylinux_+2_17_x86_64`,
`macosx_10_+9_x86_64`. With a second atom (`py3+9.py2`) the same filename is rejected: "Tag
components must contain only ASCII letters, digits, underscores, and periods". `packaging`
rejects `py3+9` (the interpreter is not an identifier).
"""

