[[bug]]
id = "uv-distribution-filename/5"
title = "With a package-name hint, an sdist whose name has a run of separators (`foo__bar-1.0.tar.gz` for `foo-bar`) is rejected"
kind = "wrong-result"
severity = "medium"
test = "hinted_sdist_names_match_by_normalisation"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`SourceDistFilename::parse(filename, extension, package_name)` (used by
`DistFilename::try_from_filename`, the registry path) takes the first `package_name.len()` bytes
of the stem as the name and compares them normalised byte by byte
(`normalized_package_name_matches`), so a filename name that normalises to the package name but
has a different length — `foo__bar`, `foo..bar`, `foo-_bar` for `foo-bar` — fails with "Name
doesn't start with package name foo-bar". `SourceDistFilename::parsed_normalized_filename` (no
hint), `WheelFilename` with the same hint (it falls back to `PackageName::from_str`) and
`packaging.utils.parse_sdist_filename` all read `foo-bar`. Such an sdist listed on an index is
silently dropped.
"""

