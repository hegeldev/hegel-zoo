[[bug]]
id = "uv-distribution-filename/4"
title = "A build tag whose digits exceed `u64` is rejected"
kind = "contract"
severity = "low"
test = "build_tag_digits_are_unbounded"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`BuildTag::from_str` parses the leading digits with `str::parse::<u64>`, so
`foo-1.0-99999999999999999999-py3-none-any.whl` fails with "number too large to fit in target
type". The binary distribution format specification only says the tag "must start with a digit"
and sorts "the initial digits as an int"; `packaging` reads them as an unbounded `int`.
"""

