[[bug]]
id = "uv-distribution-filename/6"
title = "Extension matching is case-insensitive for the `tar` of `.tar.gz` only: `a-1.0.TAR.gz` is an sdist, `a-1.0.tar.GZ` is not"
kind = "contract"
severity = "low"
test = "extension_case_is_treated_alike"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`SourceDistExtension::from_path` matches the outer extension exactly (`"gz"`, `"zip"`, …) but
tests the inner one with `eq_ignore_ascii_case("tar")`, so `a-1.0.TAR.gz`, `a-1.0.Tar.bz2`,
`a-1.0.tAr.zst` are accepted (and `SourceDistFilename` displays them lower-cased,
`a-1.0.tar.gz`) while `a-1.0.tar.GZ`, `a-1.0.Zip` and `a-1.0-py3-none-any.WHL` are rejected.
The sdist and wheel conventions and `packaging` are case-sensitive throughout.
"""

