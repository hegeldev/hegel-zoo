[[bug]]
id = "uv-distribution-filename/3"
title = "Display drops leading zeros from the numbers of a single tag: `py307` is shown as `py37`, `manylinux_02_17_x86_64` as `manylinux_2_17_x86_64`"
kind = "roundtrip"
severity = "low"
test = "tag_numbers_keep_their_spelling"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
On the single-tag path the tags are stored typed (`WheelTagSmall`) and `Display` re-renders
them from the parsed numbers, so a filename whose tag numbers carry leading zeros
(`foo-1.0-py307-none-any.whl`, `foo-1.0-cp309-cp309-linux_x86_64.whl`,
`foo-1.0-py3-none-manylinux_02_17_x86_64.whl`) is displayed as a different filename
(`py37`, `cp39`, `manylinux_2_17_x86_64`). The compressed-tag path keeps the text (`repr`), so
`py307.py2` round-trips. `packaging` keeps the tag text.
"""

