name = "uv-distribution-filename"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-distribution-filename"
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "a5a0b62c4912157bf5e8802453588ef6c0be5a88"
date = "2026-09-18"
version = "0.0.83"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.utils, packaging.tags, packaging.version; import packaging; assert int(packaging.__version__.split(\".\")[0]) >= 26' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages --upgrade packaging"]
command = "cargo test --no-fail-fast"

[expected_failures]
"fast_path_tags_take_no_plus_sign" = "uv-distribution-filename/1"
"trailing_dot_in_a_tag_component_is_an_empty_atom" = "uv-distribution-filename/2"
"tag_numbers_keep_their_spelling" = "uv-distribution-filename/3"
"build_tag_digits_are_unbounded" = "uv-distribution-filename/4"
"hinted_sdist_names_match_by_normalisation" = "uv-distribution-filename/5"
"extension_case_is_treated_alike" = "uv-distribution-filename/6"
