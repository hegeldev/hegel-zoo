name = "quorum-set"
language = "rust"
upstream = "https://github.com/drmingdrmer/quorum-set"
subdir = ""
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-13"
# Zoo-authored: the properties began life in the zoo's openraft target (imported from
# DRMacIver/hegel-rust-oss-bug-finding patches/openraft.patch) and followed the code when
# openraft extracted its quorum/progress modules into this crate (openraft 0.10.0-alpha.34).
origin = "hegel-zoo targets/rust/openraft (hegel.patch before 1aa1cab), zoo-authored tree properties"

[base]
commit = "ea702b485e90215b205f9a5560112ff11b441320"
date = "2026-09-03"
version = "0.2.0"

[hegel]
version = "0.44.1"

[run]
setup = []
command = "cargo test --no-fail-fast"
# upstream's rust-toolchain pins a nightly this machine does not have; the crate's MSRV is 1.88
# and it builds on stable, so run it there.
env = { RUSTUP_TOOLCHAIN = "stable" }

[expected_failures]
