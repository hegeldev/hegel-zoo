[[bug]]
id = "ropey/1"
title = "A `byte_slice` whose end splits a CRLF pair undercounts its lines when it spans more than one leaf: `len_lines()` misses the lone CR's break, so `lines()` yields more lines than `len_lines()`, `line(len_lines - 1)` is the whole slice, `get_line(len_lines)` is `None` while `lines()` still yields it, and `line_to_char(1)` is 0"
kind = "contract"
severity = "medium"
test = "byte_slices_count_lines_like_char_slices"
found = { commit = "199266599096", version = "1.6.1", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by the zoo (not among upstream's issues; #60/#53/#119 are about which characters count as breaks). The docs say slicing may split a CRLF pair, and the crate then counts the lone CR as a break (`cr_lines`, on by default): `slice(a..b)` by char range does — `RopeSlice::new_with_range` adds one to `end_info.line_breaks` when `node.is_crlf_split(n_end)` (the 1.5.1 fix) — but `new_with_byte_range` (`byte_slice`, `get_byte_slice`, added in 1.4.0) has no such adjustment, so the `Full` slice variant undercounts by one whenever the slice ends between a CR and an LF. A slice within a single leaf (`Light` variant) counts the breaks of its own text and is right, which is why short texts (default leaves are ~1 KiB) hide it. Reproducer with default features: `let t = format!(\"{}\\r\\n{}\\r\\nend\", \"a\".repeat(1500), \"b\".repeat(1500)); let r = Rope::from_str(&t); let s = r.byte_slice(0..1501);` — `s.len_lines()` is 1 (2 expected; `r.slice(0..1501).len_lines()` is 2), `s.lines().count()` is 2, `s.line(0)` is the whole text including the CR, `s.line_to_char(1)` is 0, `s.get_line(1)` is `None`; `r.byte_slice(1501..3003)` (starting at the LF and ending after the next CR) gives 2 instead of 3. Fix: apply the same `is_crlf_split` adjustment to `end_info` in `new_with_byte_range`. Hegel found it at 10 000 cases with 9-byte leaves (`small_chunks`), on a 22-char text ending in CRLF sliced by byte range up to the CR."

