[[bug]]
id = "quinn/2"
title = "PacketNumber::new stores a 3-byte truncation as `n as u32` without masking it to 24 bits (quinn-proto/src/packet.rs), so the value differs from what decode yields for the same wire bytes (PartialEq, Debug and expand disagree): expand ORs bits 24..31 of n into the reference point's 2^24 block, e.g. new(2^26, 58720257).expand(59790379) = 100663296 instead of 67108864"
kind = "contract"
severity = "low"
test = "packet::tests::pn_new_u24_keeps_bits_above_24"
found = { commit = "db60822629ee", version = "0.12.0", hegel = "0.44.1", date = "2026-10-05" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PacketNumber::new chooses the width from 2*(n - largest_acked) and builds the 3-byte variant as
Self::U24(n as u32), while decode builds it as U24(r.get_uint(3) as u32), always below 2^24, and
expand trusts the variant's width (U24(x) => u64::from(x)): candidate = (expected & !0xFFFFFF) |
truncated, so bits 24..31 of n leak into the candidate when n lies in the 2^24 block after
expected's. Found by the weekly run's 1000-case budget on pn_new_expand_recovers_original
(largest_acked = 58720257, delta = 8388607, n = 2^26, expected = 59790379: new stores U24(0x4000000),
the OR gives 0x7000000, the window correction subtracts one block -> 0x6000000 = 100663296). The
failing region: a 3-byte truncation (2^15 <= delta < 2^23) with n in the block after expected's
whose block index ends in two or more set bits (one set bit yields n + 2^24, which the window
correction takes back; an even index leaks nothing; a low byte of 0xFF carries out of bits 24..31)
- well under 1% of the wide property's cases, hence intermittent. On the wire nothing shows: encode
writes put_uint(x, 3), dropping the high byte, and the library only expands decoded numbers
(connection/packet_crypto.rs, endpoint.rs); new's value feeds encode and len() only. Fix:
Self::U24(n as u32 & 0xff_ffff). Upstream main still has the unmasked cast (2026-10-06).
"""
