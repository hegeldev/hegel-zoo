[[bug]]
id = "quinn/1"
title = "RangeSet::replace(x..x) corrupts the set: on an empty set, replace(0..0) stores a degenerate 0..0 entry — is_empty() returns false and min()/peek_min() report a phantom range although the set holds no elements. insert and remove guard `if x.is_empty() { return false; }` (an empty range is a documented no-op and the set never holds empty ranges), but replace has no guard: its Replace iterator's Drop does self.set.0.insert(self.range.start, self.range.end) unconditionally (quinn-proto/src/range_set/btree_range_set.rs)"
kind = "contract"
severity = "medium"
test = "range_set::btree_range_set::tests::replace_empty_range_corrupts_set"
found = { commit = "fec2f8960df4", version = "", hegel = "0.28.2", date = "2026-07-20" }
status = "fixed"
upstream_issue = ""
fixed_in = "0.12.0 (5358e3463ab5)"
notes = "Not a predecessor trophy: the predecessor's HEGEL_REPORT.md for quinn-proto lists replace_empty_range_corrupts_set as 'FAIL (real bug, kept failing on purpose)' and analyses it under Suspected bugs. Recorded from that report on import. The stateful model test range_sets_match_element_model passes because it never issues an empty replace."

