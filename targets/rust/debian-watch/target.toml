name = "debian-watch"
language = "rust"
upstream = "https://github.com/jelmer/debian-parsers"
subdir = "debian-watch"
license = "Apache-2.0"
ai_policy_checked = "2026-09-13"

[base]
commit = "4dc04da822298d3586902520119d04fd89f9218c"
date = "2026-09-05"
version = "0.4.12"

[hegel]
version = "0.44.1"

[run]
setup = ["/usr/bin/python3 -c 'import debian.watch'", "perl -MDevscripts::Uscan::Utils -MDevscripts::Uscan::WatchFile -MJSON::PP -e 1"]
command = "cargo test --no-fail-fast"

[expected_failures]
"bracket_delimiters_are_supported" = "debian-watch/1"
"the_case_insensitive_flag_is_honoured" = "debian-watch/2"
"unknown_flags_are_refused" = "debian-watch/3"
"replacement_escapes_work_like_perl" = "debian-watch/4"
"translation_pads_and_flags_like_perl" = "debian-watch/5"
"substitutions_match_what_uscan_matches" = "debian-watch/6"
"a_flag_option_can_end_the_option_list" = "debian-watch/7"
"a_built_entry_with_a_flag_option_is_read_back" = "debian-watch/7"
"a_version_line_at_end_of_file_is_read" = "debian-watch/8"
"the_default_pretty_pattern_is_uscans" = "debian-watch/9"
"fields_after_an_inline_pattern_url_are_the_policy_and_script" = "debian-watch/10"
"comments_without_a_space_are_comments" = "debian-watch/11"
"option_values_containing_an_equals_sign_are_whole" = "debian-watch/12"
"set_opt_on_a_quoted_option_list_stays_inside_the_quotes" = "debian-watch/13"
