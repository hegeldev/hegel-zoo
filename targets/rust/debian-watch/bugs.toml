[[bug]]
id = "debian-watch/6"
title = "`@ANY_VERSION@` lacks uscan's `[Vv]?` and `@ARCHIVE_EXT@` lacks `tar\\.zstd?`"
kind = "differential"
severity = "low"
test = "substitutions_match_what_uscan_matches"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.4.12", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
uscan (devscripts 2.23) expands `@ANY_VERSION@` to
`(?:[-_]?[Vv]?(\\d[\\-+\\.:\\~\\da-zA-Z]*))` and `@ARCHIVE_EXT@` to
`(?i)(?:\\.(?:tar\\.xz|tar\\.bz2|tar\\.gz|tar\\.zstd?|zip|tgz|tbz|txz))`;
`subst::subst` uses the older `[-_]?(\\d[\\-+\\.:\\~\\da-zA-Z]*)` and the
list without zstd (the same as python-debian), so
`@PACKAGE@-@ANY_VERSION@@ARCHIVE_EXT@` does not match `foo-v1.2.3.tar.gz`
or `foo-1.2.3.tar.zst`, which uscan matches (capturing `1.2.3`).
"""

