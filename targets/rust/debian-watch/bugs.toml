[[bug]]
id = "debian-watch/10"
title = "When the URL carries the pattern in its last component, the version policy is reported as the matching pattern and the script as the policy"
kind = "wrong-result"
severity = "medium"
test = "fields_after_an_inline_pattern_url_are_the_policy_and_script"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.4.12", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
uscan(1): if the last component of the URL contains parentheses it is the
filename pattern and there is no separate pattern field, so
`https://pypi.debian.net/foo/foo-(.+)\\.tar\\.gz debian uupdate` has policy
`debian` and script `uupdate` (python-debian agrees). The parser assigns
fields positionally: `matching_pattern()` is `Some("debian")`, `version()`
is `Ok(None)` with a policy alone and `Err` ("uupdate" is no policy) when
a script follows, and `script()` is `None` in both cases.
"""

