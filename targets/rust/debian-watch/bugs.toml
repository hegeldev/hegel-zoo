[[bug]]
id = "debian-watch/11"
title = "A comment line without a space after `#` (`#`, `#foo`) is read as an entry"
kind = "wrong-result"
severity = "medium"
test = "comments_without_a_space_are_comments"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.4.12", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The lexer's VALUE rule `[^\\s=,"]*[^\\s=\\\\,"]` matches `#foo` with the
same length as COMMENT `#[^\\n]*`, and VALUE wins the tie, so a comment
with no whitespace in it lexes as a value and `version=4\\n#foo\\n` yields
one entry with URL `#foo` (python-debian and uscan: zero entries). `# foo`
is a comment because COMMENT is then the longer match.
"""

