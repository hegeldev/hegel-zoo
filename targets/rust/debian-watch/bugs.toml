[[bug]]
id = "debian-watch/12"
title = "An option value containing `=` is truncated at the `=` by `get_option`/`opts`"
kind = "wrong-result"
severity = "medium"
test = "option_values_containing_an_equals_sign_are_whole"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.4.12", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parser keeps all tokens of `filenamemangle=s/.*ref=(.*)/$1/` inside
the OPTION node (VALUE EQUALS VALUE), but `_Option::value()` returns only
the first VALUE token, so `get_option("filenamemangle")` is
`Some("s/.*ref")` and `opts()` the same; python-debian keeps the whole
string. Quoted and unquoted lists alike. Any mangle rule whose pattern or
replacement contains `=` (`downloadurlmangle=s/tag=v/tag=/`) is affected.
"""

