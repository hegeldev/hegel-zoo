# Bugs found in debian-watch by the Hegel tests, against uscan itself
# (devscripts' `Devscripts::Uscan::Utils::safe_replace` and the constants of
# `Devscripts::Uscan::WatchFile`, driven as a Perl child) and python-debian's
# `debian.watch`. All zoo-original; jelmer/debian-parsers has no related issue.

[[bug]]
id = "debian-watch/1"
title = "Mangling rules with bracketing delimiters (`s{a}{b}`, `s(a)(b)`, `s[a][b]`, `s<a><b>`) are mis-split"
kind = "differential"
severity = "medium"
test = "bracket_delimiters_are_supported"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.4.12", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
uscan's `safe_replace` accepts the Perl bracketing pairs `{}`, `()`, `[]`
and `<>` as delimiters (`quoted_regex_parse`), and uscan(1) documents
mangling rules as Perl substitutions. `mangle::parse_mangle_expr` takes the
character after `s` as a plain delimiter and splits on it, so `s{1}{X}` is
read as pattern `1}` and replacement `X}` and `apply_mangle("s{1}{X}",
"1.2.3")` returns `1.2.3` unchanged where uscan returns `X.2.3`.
"""

