[[bug]]
id = "debian-watch/7"
title = "A flag option ending the option list (`opts=bare https://…`, `opts=\"repack\"`) is a parse error"
kind = "contract"
severity = "high"
test = "a_flag_option_can_end_the_option_list"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.4.12", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_option` accepts a bare key only when it is followed by a comma; a
key followed by whitespace or the closing quote yields "expected `=`", so
`version=4\\nopts=bare https://h.example.org/releases/ .*` fails
`WatchFile::from_str`. uscan and python-debian read it (option `bare`).
`EntryBuilder::flag` renders exactly this shape, so an entry built with a
flag option produces text the crate itself cannot parse
(`a_built_entry_with_a_flag_option_is_read_back`).
"""

