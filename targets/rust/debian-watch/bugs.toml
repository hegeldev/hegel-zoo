[[bug]]
id = "debian-watch/4"
title = "Replacement strings are not processed like Perl's: `\\.` stays `\\.`, `\\1` and `$&` are literal, an escaped delimiter keeps its backslash"
kind = "differential"
severity = "high"
test = "replacement_escapes_work_like_perl"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.4.12", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
uscan unescapes the replacement (`\\.` → `.`, `\\/` → `/` for the chosen
delimiter), expands `\\1`..`\\9` like `$1`, and `$&` to the whole match.
`apply_mangle` hands the raw replacement to `regex::Regex::replace`, so
`s/(\\d+)-(\\d+)/$1\\.$2/` on `1-2` gives `1\\.2` instead of `1.2`, `\\1`
stays literal and `$&` becomes empty. `uversionmangle=s/_/\\./g` — the
standard rule for `1_2_3` upstream versions — therefore produces
`1\\.2\\.3`.
"""

