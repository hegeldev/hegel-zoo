[[bug]]
id = "fixed/2"
title = "to_num::<f64>() is wrong for types with 31 or 32 fractional bits: the fast path (float_helper.rs fast_to_float, 'fast-float-conversion' merge) computes the scale as `(1 << frac_bits) as f64` with an i32 literal, so I1F31/U1F31 convert with the wrong sign and I0F32/U0F32 panic ('attempt to shift left with overflow') in debug builds and come out 2^32 too large in release builds"
kind = "crash"
severity = "high"
test = "convert::tests::hegel_known_failure_to_f64_wrong_for_31_and_32_frac_bits"
found = { commit = "95fe9d1db509", version = "1.31.0", hegel = "0.44.1", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''Found by the bump to 95fe9d1db509: hegel_f64_roundtrip_exact_for_32bit_and_narrower panicked on I0F32::from_bits(0).to_num::<f64>(). Probe (debug): U0F32::from_bits(1).to_num::<f64>() panics; I1F31::from_bits(1).to_num::<f64>() = -4.656612873077393e-10 (should be +2^-31); I1F31::from_bits(-1) = +2^-31. Release: U0F32::from_bits(1) -> 1.0 (should be 2^-32). The fast path is taken when int_bits + frac_bits <= 53 and frac_bits <= 1022, so among the crate's aliases exactly I1F31, U1F31, I0F32, U0F32 are affected (and any FixedI32<U31>/<U32>-style type); f32 conversions stop at 24 bits and are correct. The property now leaves 31/32 fractional bits out (I2F30/U2F30 instead of I0F32/U0F32) while the bug is open; the pin asserts the four exact values.'''
