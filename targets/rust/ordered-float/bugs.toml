[[bug]]
id = "ordered-float/1"
title = "`Real::fract` and `Real::mul_add` for `NotNan` wrap the float result without a NaN check, so `NotNan(±inf).fract()` and a `mul_add` with a `0 · inf` product return a `NotNan` holding NaN"
kind = "contract"
severity = "medium"
test = "f64_::not_nan_fract_and_mul_add_never_hold_nan"
found = { commit = "650b3dddbb8a", version = "5.5.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by the zoo (not among upstream's issues; the `Real` impl came with PR #176, 2025-08). `NotNan` documents that \"a NaN value cannot be stored in this type\" and that arithmetic producing NaN panics; the `impl Real for NotNan` checks `sqrt`, `ln`, `sin`, `powf`, … with `NotNan::new(..).expect(..)` but writes `NotNan(self.0.fract())` and `NotNan(self.0.mul_add(a.0, b.0))` directly. `f64::fract(inf)` = inf − trunc(inf) = NaN, and `0 · ±inf + c` = NaN. Hegel's smallest cases: `NotNan::new(f64::INFINITY).unwrap().fract()` and `Real::mul_add(NotNan(0.0), NotNan(inf), NotNan(0.0))` are `NotNan` values with `is_nan()`; on such a value `x == x` is false and `x.cmp(&x)` panics (\"partial_cmp failed for non-NaN value\"). Every other `Real`/`Signed` method was swept over the special values (0, ±inf, ±MAX, …): only these two leak. Same for f32 (`f32_::not_nan_fract_and_mul_add_never_hold_nan`). Fix: `NotNan::new(..).expect(..)` in both, like the neighbours."

