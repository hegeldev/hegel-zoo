[[bug]]
id = "uv-platform-tags/3"
title = "GraalPy ABI tags with a two-digit implementation major (`graalpy241_311_native`, GraalPy 24.1) re-parse as implementation 2.41, so a wheel carrying the interpreter's own tag is incompatible"
kind = "wrong-result"
severity = "high"
test = "graalpy_abi_tags_carry_the_implementation_version"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`AbiTag::GraalPy { python_version, implementation_version }` displays as
`graalpy{impl_major}{impl_minor}_{py_major}{py_minor}_native` — the two implementation numbers run
together, as GraalPy itself spells its SOABI (`graalpy241-311-native-…`, `packaging` normalises it
to `graalpy241_311_native`). `AbiTag::from_str` (`parse_impl_version`, `src/abi_tag.rs`) takes the
first character as the major and the rest as the minor, so `graalpy241_311_native` is
`(2, 41)`, `graalpy100_38_native` is `(1, 0)`; only single-digit majors round-trip, and GraalPy's
releases are 23.x, 24.x, 25.x. `Tags::from_env(_, (3, 11), "graalpy", (24, 1), _)` therefore keys
its map on `(24, 1)` while the same text read from a wheel filename gives `(2, 41)`:
`is_compatible` is false for `graalpy311-graalpy241_311_native-manylinux_2_17_x86_64.whl` — every
