[[bug]]
id = "uv-platform-tags/4"
title = "PyPy, GraalPy and Pyston get no `<interpreter>-none-<platform>` and `<interpreter>-none-any` tags: `pp310-none-any` wheels are incompatible with PyPy 3.10"
kind = "wrong-result"
severity = "medium"
test = "non_cpython_interpreters_get_none_abi_tags"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`packaging.tags.generic_tags` adds the `none` ABI for every interpreter (`<interpreter>-none-
<platform>`) and `compatible_tags` yields `<interpreter>-none-any` when the interpreter is known,
so pip on PyPy 3.10 accepts `pp310-none-manylinux_2_17_x86_64` and `pp310-none-any` wheels (an
interpreter-specific wheel without extension modules). `Tags::from_env` (`src/tags.rs`) pushes
both groups inside `if let Implementation::CPython` / `if matches!(implementation,
Implementation::CPython)`, so for PyPy, GraalPy and Pyston the list goes from the
implementation ABI straight to the `py*` tags: `Tags::is_compatible(&[pp310], &[none], &[any])`
is false, and the full lists differ from `packaging`'s exactly by those two groups (checked with
`generic_tags` + `compatible_tags` over the crate's own platform list).
"""

