[[bug]]
id = "uv-platform-tags/1"
title = "The tag parsers read their numbers with `str::parse`, so `+`-signed and zero-padded spellings (`pp3+9`, `cp3013`, `manylinux_02_17_x86_64`, `macosx_+11_0_arm64`) are accepted and `Display` rewrites them"
kind = "contract"
severity = "low"
test = "tag_numbers_are_taken_literally"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PEP 425 tags are strings and `packaging` compares them as strings (`Tag.__eq__`); the crate
parses them into typed values whose numbers come from `str::parse::<u8>`/`<u16>`, which accepts a
leading `+` and leading zeros. `LanguageTag::from_str("pp3+9")` is `PyPy (3, 9)` (`pp39`),
`AbiTag::from_str("cp3013")` is `CPython (3, 13)`, `pypy3013_pp73` → `pypy313_pp73`,
`pypy_7+3` → `pypy_73`; `PlatformTag::from_str` takes `manylinux_+2_17_x86_64`,
`manylinux_02_17_x86_64`, `manylinux_2_017_x86_64`, `musllinux_1_+2_x86_64`, `macosx_011_0_arm64`,
`android_+21_arm64_v8a`, `ios_12_+0_arm64_iphoneos`, `pyodide_+2024_0_wasm32`. Two consequences:
a wheel whose filename carries such a non-tag is judged compatible (its typed value equals the
interpreter's tag) where pip rejects it, and the filename is displayed with the canonical
spelling — the root of uv-distribution-filename/1 and /3 (the fast path of `WheelFilename`
stores these typed tags). `LanguageTag` is stricter only by accident of its length checks
(`py3+9`, `cp3+9` are rejected as unknown formats).
"""

