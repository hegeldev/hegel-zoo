[[bug]]
id = "uv-platform-tags/2"
title = "The Solaris platform tag has `_64bit` twice: `Os::Illumos { release: \"5_11\", arch: \"i86pc\" }` gives `solaris_2_11_i86pc_64bit_64bit`"
kind = "wrong-result"
severity = "medium"
test = "solaris_platform_tags_follow_sysconfig"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`compatible_tags` (`src/tags.rs`) maps SunOS 5.x to Solaris 2.x as `sysconfig.get_platform()`
does (`solaris-2.11-i86pc.64bit`, whence the wheel tag `solaris_2_11_i86pc_64bit`): it builds
`release_arch = "{major - 3}_{rest}_{arch}_64bit"` — and `PlatformTag::Solaris`'s `Display` is
`solaris_{release_arch}_64bit`, so the suffix appears twice. The parser strips one `_64bit`, so
the doubled text round-trips through the typed tag while a real wheel's `solaris_2_11_i86pc_64bit`
parses to a different value: no Solaris wheel can be compatible with a Solaris interpreter. (How
the `Os::Illumos` release reaches this crate — `5_11`, `5.11`, or sysconfig's `2.11` — is not
settled by the crate; the doubled suffix is wrong for every spelling.)
"""

