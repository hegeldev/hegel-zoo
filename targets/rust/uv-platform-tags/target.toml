name = "uv-platform-tags"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-platform-tags"
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "7bc36767ae3ea0d45e3cc6f219765fdec2992a33"
date = "2026-09-17"
version = "0.0.82"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.tags; import packaging; assert int(packaging.__version__.split(\".\")[0]) >= 26' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages --upgrade packaging"]
command = "cargo test --no-fail-fast"

[expected_failures]
"tag_numbers_are_taken_literally" = "uv-platform-tags/1"
"solaris_platform_tags_follow_sysconfig" = "uv-platform-tags/2"
"graalpy_abi_tags_carry_the_implementation_version" = "uv-platform-tags/3"
"non_cpython_interpreters_get_none_abi_tags" = "uv-platform-tags/4"
