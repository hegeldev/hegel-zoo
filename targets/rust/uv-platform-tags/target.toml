[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.tags' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages packaging"]
command = "cargo test --no-fail-fast"

[expected_failures]
