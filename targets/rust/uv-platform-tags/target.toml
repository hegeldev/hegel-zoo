name = "uv-platform-tags"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-platform-tags"
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "6f7795bb4f6e0bf348ba5e73194e1094d45b7c0a"
