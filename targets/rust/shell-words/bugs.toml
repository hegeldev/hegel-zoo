# Bugs found in shell-words by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracles are the shells themselves — bash held open as a child (`x=( <text> )` is its word
# splitter), dash and busybox ash per case — and Python's `shlex`.

[[bug]]
id = "shell-words/1"
title = "`quote` leaves `{` and `}` bare, so bash brace-expands the quoted word: `join([\"rm\", \"{a,b}\"])` is `rm {a,b}`, two arguments"
kind = "wrong-result"
severity = "high"
test = "brace_expansion_is_quoted"
found = { commit = "8d2868b0edadbd5572acd7ed25b6be890c2781b7", version = "1.1.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`escape_style` decides a word needs no quoting unless it contains one of `| & ; < > ( ) $ ` \\\\
" space tab newline ' * ? [ # ~ = %`; `{`, `}` and `,` are not in the list, so `quote("{a,b}")`
is `{a,b}` and `quote("{1..3}")` is `{1..3}`.  bash and zsh expand those before anything else:
`x=( rm {a,b} )` has three elements, `x=( echo {1..3} )` four, `pre{a,b}.txt` becomes two file
names — `join` is documented as producing "a single command line suitable for execution in Unix
shell", "essentially an inverse of split", and its example is a command line to be "copied and
pasted into an actual shell".  Brace expansion is not POSIX (the crate's stated baseline) — dash
and busybox ash keep the word — but it is on by default in bash, including `bash --posix`, and
in zsh.  This is the same shape as RUSTSEC-2024-0006 in the sibling crate `shlex`, which quoted
`{` and `}` in its 1.2.1 (2024-01); `shlex` also quotes `,` for the rare case of a quoted word
placed inside a caller's own braces.  Quoting `{` and `}` (add them to the special list) is the
fix; the crate's own `split` treats them literally already.
"""
