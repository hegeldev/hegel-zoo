[[bug]]
id = "debian-control/33"
title = "`Buildinfo::environment` keeps the shell quoting dpkg-genbuildinfo writes (`LANG=\"C.UTF-8\"` → `\"C.UTF-8\"`) and panics on a line without `=`"
kind = "wrong-result"
severity = "medium"
test = "environment_reads_the_values_dpkg_genbuildinfo_writes"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg-genbuildinfo (`cleansed_environment`) writes each variable as `NAME="value"` with `"`
escaped as `\\"` (so `Environment:\\n LANG="C.UTF-8"\\n DEB_BUILD_OPTIONS="parallel=4 nocheck"`).
`environment()` does `line.split_once('=')` and keeps the raw right-hand side, so every value
comes back wrapped in quotes with the escapes intact (`"say \\"hi\\""`), and a line without `=`
panics (`split_once('=').unwrap()`; `environment_without_an_equals_sign_does_not_panic`). A
buildinfo consumer comparing environments (reproducible-builds) gets `"C.UTF-8"` ≠ `C.UTF-8`.
"""

[[bug]]
id = "debian-control/34"
title = "`Buildinfo::set_environment` writes unquoted values in `HashMap` order, not dpkg's sorted `NAME=\"value\"` lines"
kind = "wrong-result"
severity = "low"
test = "set_environment_writes_dpkgs_layout"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
For `{LANG: C.UTF-8, DEB_BUILD_OPTIONS: parallel=4 nocheck, …}` `set_environment` produces
`Environment: SOURCE_DATE_EPOCH=1\\n DEB_BUILD_OPTIONS=parallel=4 nocheck\\n C=3\\n LANG=C.UTF-8…`:
the order changes from run to run (a `HashMap` is iterated), the first entry sits on the key line
instead of a continuation line, and values are unquoted, so a value with a space or an embedded
`=` is not what dpkg-genbuildinfo's readers expect (they strip one layer of `"…"`). The output
also does not round-trip through the crate's own `environment()` once quoting is fixed there.
"""

[[bug]]
id = "debian-control/35"
title = "`Release::date()`/`valid_until()` panic on every real Debian and Ubuntu Release file (`UTC` zone, apt's space-padded hour, garbage)"
kind = "panic"
severity = "high"
test = "release_dates_parse_like_apt"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`lossless::apt::Release::date()` and `valid_until()` are
`chrono::DateTime::parse_from_rfc2822(s).unwrap()` (`src/lossless/apt.rs:1109`, `:1124`).
apt-ftparchive, dak and Launchpad write `Date: Thu, 25 Apr 2024 15:10:33 UTC` — RFC 2822 does
not know the zone name `UTC` (only `GMT`/`UT` and numeric offsets), so chrono returns
`ParseError(Invalid)` and the getter panics on every InRelease under `/var/lib/apt/lists`
(five of five on the zoo machine, all `UTC`; one, written by apt itself, also pads the hour:
`Wed, 09 Sep 2026  1:49:04 UTC`). apt's own `StrToTime` (`apt_pkg.str_to_time`) reads all of
them. An unparsable value (`Date: yesterday`) panics as well instead of returning `None`.
Only `+0000` dates work.
"""

[[bug]]
id = "debian-control/36"
title = "`Release::no_support_for_architecture_all()` looks for `No-Support-For-Architecture-All: yes`; the field is `No-Support-for-Architecture-all: Packages`"
kind = "wrong-result"
severity = "medium"
test = "no_support_for_architecture_all_reads_the_real_field"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The Debian Repository Format defines `No-Support-for-Architecture-all: Packages` (that casing,
and the value names the index kind, not `yes`); dpkg's `CTRL_REPO_RELEASE` field list spells it
the same way. `no_support_for_architecture_all()` (`src/lossless/apt.rs:1150`) does
`get("No-Support-For-Architecture-All") == Some("yes")`: deb822-lossless field lookup is
case-sensitive, so the real field is never found and the getter is `false` on every archive that
sets it (Debian unstable/testing), and the setter writes a field no apt ever reads.
"""

[[bug]]
id = "debian-control/37"
title = "lossy `apt::Package` `Display` writes `Source: name (= version)`; the re-parse drops the `Source` field"
kind = "roundtrip"
severity = "medium"
test = "lossy_package_display_keeps_the_source_version_syntax"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
A Packages stanza names its source as `Source: dotnet8 (8.0.130-8.0.30-0ubuntu1~24.04.1)` when
the source version differs (dpkg-deb, Policy §5.6.1). `lossy::apt::Package` parses that into
`SourceRelation { name, version }` correctly, but its `Display` uses the relation syntax
`dotnet8 (= 8.0.130-…)`, which the crate's own parser does not accept: `from_str` of the
