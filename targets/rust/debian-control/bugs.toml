status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Each getter is `get(..).map(|s| s.parse().unwrap())` (or `.lines().map(|l| l.parse().unwrap())`).
`Version: 1_2` panics with `Invalid version string`, `Urgency: low (HIGH for users of foo)` with
`invalid urgency`, `Checksums-Sha1:\\n abc foo` with `invalid digit found in string`, a `.dsc`-style
