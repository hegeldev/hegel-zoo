"""

[[bug]]
id = "debian-control/26"
title = "`format_description`'s output fed to `Binary::set_description` is indented twice: ` .` markers become ` .` lines and every long line gains a space"
kind = "contract"
severity = "low"
test = "format_description_feeds_set_description"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`fields::format_description(short, long)` returns the field *text* (`short\\n long\\n .\\n more`,
continuation lines already indented, blank lines as ` .`), while `Binary::set_description` takes
the *value* and indents each line itself (`set_with_indent_pattern(Fixed(1), …)`). Combining the
two — the obvious use, and the only way the crate offers to encode a blank line — writes

    Description: short
      long
      .
      more

so `description()` reads `short\\n long\\n .\\n more` (every line verbatim in Policy's terms, the
blank-line marker mis-encoded). Either `format_description` should produce the value (`.` without
indent) or `set_description` should accept the formatted text.
"""

[[bug]]
id = "debian-control/27"
title = "`PackageListEntry` `Display` writes the extras in `HashMap` order (nondeterministic) and `FromStr` truncates a `key=value` whose value contains `=`"
kind = "wrong-result"
severity = "low"
test = "package_list_entries_display_deterministically"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`PackageListEntry { extra: HashMap<String, String> }`: `Display` iterates the map, so
`foo deb misc optional arch=amd64 profile=!nocheck essential=yes protected=yes a=1 b=2` renders
as `foo deb misc optional a=1 b=2 profile=!nocheck essential=yes arch=amd64 protected=yes` (order
varies between processes) where dpkg-source writes and expects a stable order. `FromStr` splits
each extra with `split('=')` and takes the first two parts, so `x=a=b` reads as `x` → `a` and the
`=b` is lost silently (`split_once('=')` keeps it).
"""

# --- .changes / .buildinfo / PGP (tests/hegel_files.rs, turn 62): against dpkg's `Dpkg::Control`
# with the file types, python-debian's `Changes` and `split_gpg_and_payload`, gpg clearsigns and the
# layout dpkg-genchanges / dpkg-genbuildinfo write.

[[bug]]
id = "debian-control/28"
title = "`Changes::read`/`from_file` cannot read a clearsigned .changes file — the crate's own `strip_pgp_signature` is never applied"
kind = "contract"
severity = "medium"
test = "signed_changes_files_can_be_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Every `.changes` that reaches an archive is OpenPGP-clearsigned; dpkg's `Dpkg::Control`
(`allow_pgp`, set for `CTRL_FILE_CHANGES`) and python-debian's `Changes` read the fields through
the armor. `Changes::read` hands the whole text to `Deb822::read`, which fails on the armor lines
("unexpected token at paragraph level", "field name without value") — a `gpg --clearsign`ed
`Format: 1.8\\nSource: foo\\n…` is unreadable, although `debian_control::pgp::strip_pgp_signature`
exists in the same crate and handles exactly this input. `from_file`, `read_relaxed` and
`Buildinfo::from_str` (`.buildinfo` files are signed the same way) have the same problem.
"""

[[bug]]
id = "debian-control/29"
title = "`strip_pgp_signature` reports `JunkAfterPgpSignature` for a blank line after the signature block"
kind = "contract"
severity = "low"
test = "a_blank_line_after_the_signature_is_not_junk"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`gpg --clearsign` output followed by one more `\\n` (a file saved by an editor, a `cat` of two
files) makes `strip_pgp_signature` return `Err(JunkAfterPgpSignature)` because it treats any line
after `-----END PGP SIGNATURE-----` as junk. dpkg parses such a file (the blank line is just a
paragraph separator) and python-debian's `split_gpg_and_payload` returns the payload; the crate
should ignore trailing whitespace-only lines.
"""

[[bug]]
id = "debian-control/30"
title = "`Changes::get_pool_path` puts `lib*` sources under `pool/<section>/lib/` instead of the four-letter `libX` directory"
kind = "wrong-result"
severity = "medium"
test = "pool_path_of_a_lib_package_uses_four_letters"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The Debian pool layout (and python-debian's `Changes.get_pool_path`, which this method ports:
`subdir = source[:4] if source.startswith('lib') else source[0]`) places `libfoo` at
`pool/main/libf/libfoo`. The crate uses the literal `"lib"` for the subdirectory, giving
`pool/main/lib/libfoo` for every library package — a path that does not exist in any Debian
mirror. Non-`lib` sources and the section handling (`contrib/net` → `contrib`, none → `main`)
agree with python-debian.
"""

[[bug]]
id = "debian-control/31"
title = "The typed `Changes` getters panic on malformed fields: `version()`, `urgency()`, `checksums_sha1/sha256()`, `files()`, `get_pool_path()`"
kind = "panic"
severity = "medium"
test = "changes_getters_do_not_panic_on_malformed_fields"
