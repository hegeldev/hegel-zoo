[[bug]]
id = "debian-control/40"
title = "`ftpmaster::Removal` `sources`/`binaries` start with an empty entry for every real dak removal"
kind = "wrong-result"
severity = "medium"
test = "dak_layout_lists_have_no_empty_first_entry"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dak's `removals.822` writes the list fields with the first entry on a continuation line:
`Sources:\\n cfingerd_1.4.3-9\\n fmtools_…`. `deserialize_list` (`src/lossy/ftpmaster.rs`) is
`list.lines().map(String::from).collect()` on deb822-fast's value, whose first line is empty, so
