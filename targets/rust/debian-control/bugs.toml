# Bugs found in debian-control's relationship-field parsers by the Hegel tests, against dpkg's
# `Dpkg::Deps` (dpkg 1.22) and python-debian's `PkgRelation` (2.0) as the oracles. All
# zoo-original; jelmer/debian-parsers has no related issue.

[[bug]]
id = "debian-control/1"
title = "Negated architectures lose their `!`: `[!amd64]` reads and re-prints as `[amd64]`; the lossy parser rejects them"
kind = "wrong-result"
severity = "medium"
test = "negated_architectures_keep_their_negation"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`lossless::Relation::architectures()` collects only the IDENT tokens of the ARCHITECTURES node, so
`pkg [!amd64 !i386]` yields `["amd64", "i386"]` and `wrap_and_sort()` writes `pkg [amd64 i386]` — the
opposite restriction — while dpkg (`debarch_list_parse`) and python-debian keep `!amd64`. The lossy
`Relation::from_str` fails on the NOT token ("Expected architecture name") instead. Also pinned by
`lossy_parser_reads_negated_architectures`; found by `relations_parse_like_dpkg`.
"""

[[bug]]
id = "debian-control/2"
title = "The lossy parser's `<...>` loop mishandles whitespace: `<a b>` splits or fails, `< a>` opens an empty group, `<a >` is rejected"
kind = "differential"
severity = "medium"
test = "lossy_parser_keeps_profile_groups_together"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`lossy::Relation::from_str` ends a restriction list at the first profile unless a `,` follows (which is
not Debian syntax), so `pkg <!nocheck !cross>` (one AND-list for dpkg's `parse_build_profiles`) becomes
two OR-groups `<!nocheck> <!cross>` or an "Expected profile name" error, `pkg < !nocheck>` yields an
empty first group and `pkg <!nocheck >` is rejected. `Display` then writes profiles inside a group
separated by `, `, which dpkg reads as a profile named `nocheck,`. Found by
`lossy_relations_parse_like_dpkg`.
"""

[[bug]]
id = "debian-control/3"
title = "The lossy parser rejects a newline inside a relation (dpkg folds `\\s*[\\r\\n]\\s*` to a space)"
kind = "differential"
severity = "low"
test = "lossy_parser_treats_newlines_as_whitespace"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The lossy parser's `eat_whitespace` skips WHITESPACE tokens only; a NEWLINE between the name and `(`,
inside `[...]` or `<...>` is "Unexpected token" / "Expected architecture name". `deps_parse` merges the
field into one line first, and the lossless parser skips NEWLINE everywhere. Continuation lines in
`debian/control` put newlines before `(`, `[` and `<` in practice only rarely, hence low.
"""

[[bug]]
id = "debian-control/4"
title = "`Relation::is_implied_by` ignores architecture qualifiers, architecture lists and build profiles"
kind = "correctness"
severity = "medium"
test = "qualified_implication_agrees_with_dpkg"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Only the names and version constraints are compared, so `pkg:any` is "implied by" `pkg`, `pkg` by
`pkg [amd64]` and `pkg` by `pkg <!nocheck>`. `Dpkg::Deps::Simple::implies` first requires the outer
architecture set to be a superset (`_arch_is_superset`), equal qualifiers (`_arch_qualifier_implies`) and
the restriction lists to be implied (`_restrictions_imply`), and answers undef otherwise. Through
`ensure_relation` a needed unqualified dependency is therefore considered already present.
"""

[[bug]]
id = "debian-control/5"
title = "`Entry::is_implied_by` says `a` is implied by `a | b`"
kind = "correctness"
severity = "medium"
test = "a_single_relation_is_not_implied_by_an_alternative_group"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
An entry counts as implied when any of its relations is implied by any relation of the outer entry.
Installing `b` satisfies `a | b` without `a`, so the OR-group does not imply `a`; dpkg's `OR::implies`
requires every member of the outer group to imply a member of the inner one (undef otherwise), and
`Simple::implies(OR)` is the direction that does hold (`a` implies `a | b`). The method's own doc
example (`pkg (>= 1.0)` implied by `pkg (>= 1.5) | libc6`) encodes the mistake; `ensure_relation("a")`
on `a | b` reports "already satisfied" and adds nothing. Found by `entry_implication_agrees_with_dpkg`
(`a | b` "implied by" `a | b | c` likewise).
"""

[[bug]]
id = "debian-control/6"
title = "`set_version` on a relation with an architecture qualifier writes `pkg (>= 1):any`"
kind = "silent-corruption"
severity = "medium"
test = "set_version_keeps_the_qualifier_in_front"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
When the relation has no VERSION node yet, `set_version` inserts the new node right after the name
IDENT (`name_node.index() + 1`), i.e. before the ARCHQUAL node: `pkg:any` becomes `pkg (>= 1):any`, which
neither dpkg nor python-debian parse. The builder avoids it only because it sets the qualifier after
the version. Found by `edits_are_read_back`.
"""

[[bug]]
id = "debian-control/7"
title = "`Entry::from(Vec<Relation>)` writes the `|` as a COMMA token; removing an alternative then leaves `| b`"
kind = "wrong-result"
severity = "medium"
test = "built_entries_have_real_pipes"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`impl From<Vec<Relation>> for Entry` emits `builder.token(COMMA.into(), "|")`. The text is right, but
every tree walk that looks for PIPE misses it: `Relation::remove` on the first alternative of
`Entry::from(vec![a, b])` yields `| b`, and `Entry::push` on such an entry considers it empty
(`is_empty` looks for PIPE or RELATION). `wrap_and_sort()` builds all its entries this way.
"""

[[bug]]
id = "debian-control/8"
title = "`Relation::add_profile` replaces the existing restriction list instead of adding one"
kind = "contract"
severity = "medium"
test = "add_profile_adds"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Documented as "Add a build profile to this relation", `add_profile` splices the new PROFILES node over the
first existing one: `pkg <!nocheck>` + `add_profile(&[Enabled("cross")])` gives `pkg <cross>`. Restriction
formulas are lists of OR-ed groups (`<!nocheck> <cross>`), so the method cannot express them; the
builder's `.profiles(vec![g1, g2])` loops over `add_profile` and (see debian-control/17) panics.
"""

[[bug]]
id = "debian-control/9"
title = "`ensure_minimum_version` / `ensure_exact_version` drop the relation's qualifier, architectures and profiles"
kind = "silent-corruption"
severity = "medium"
test = "ensure_version_keeps_qualifiers"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Both helpers build a fresh `Relation::new(package, Some(constraint))` and `Entry::replace` it over the
old relation, so `pkg:any (>= 1) [amd64] <!nocheck>` + `ensure_minimum_version("pkg", 2)` writes
`pkg (>= 2)`: the `:any`, the architecture list and the build profile are gone from `debian/control`.
debmutate's Python implementation, which these mirror, sets only the version. Found by
`edits_are_read_back`.
"""

[[bug]]
id = "debian-control/10"
title = "`Relation`/`Entry` `Ord` compares name and version only, `Eq` also the qualifiers: `cmp` says Equal for `a [amd64]` and `a [i386]`"
kind = "contract"
severity = "low"
test = "ordering_sees_the_qualifiers_equality_sees"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`impl Ord for Relation` orders by `try_name()` then `version()`; `impl PartialEq` also compares
`archqual()`, the architecture set and the profiles. `a.cmp(&b) == Equal` while `a != b` breaks the
`Ord`/`Eq` consistency std requires (`BTreeSet`/`sort_unstable` users see duplicates collapse or
arbitrary order). `Entry::cmp` inherits it. Found by `relation_ordering_is_consistent_with_equality`.
"""

[[bug]]
id = "debian-control/11"
title = "Removing the last alternative of an entry leaves an empty entry behind: `len()` still counts it"
kind = "wrong-result"
severity = "medium"
test = "removing_the_last_alternative_removes_the_entry"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Relation::remove` means to remove the whole entry when it was the last relation, but checks
`parent.is_empty()` before detaching itself, so the entry is never empty at that point; the relation is
detached and an ENTRY node with no relations stays in the tree. `Relations::len()` then counts one entry
more than the text has (`""` parses to 0 entries, the edited tree says 1), `is_empty()` is false and
`entries()` yields an empty entry. Found by `edits_are_read_back`.
"""

[[bug]]
id = "debian-control/12"
title = "`Relation::version()` panics on any operator text outside the five spellings, including the deprecated `<` / `>` dpkg accepts"
kind = "panic"
severity = "medium"
test = "deprecated_operators_are_read_like_dpkg"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The strict parser's CONSTRAINT node takes any run of `<`, `>`, `=` (or none), so `pkg (< 1)`, `pkg (=> 1)`
and `pkg(1)` parse without error; `version()` then does `constraint.to_string().parse().unwrap()` and
panics with "Invalid version constraint". dpkg reads `<` as `<=` and `>` as `>=` (`version_normalize_relation`,
with a deprecation warning; Policy 7.1 documents the deprecated forms), python-debian and apt accept
them too. Also pinned by `bad_operators_do_not_panic`; found by `the_tree_is_lossless_for_any_text` (`a(a)`).
"""

[[bug]]
id = "debian-control/13"
title = "The lossy parser rejects the deprecated `<` / `>` operators dpkg reads as `<=` / `>=`"
kind = "differential"
severity = "low"
test = "lossy_parser_reads_deprecated_operators_like_dpkg"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`VersionConstraint::from_str` knows only `<<`, `<=`, `=`, `>=`, `>>`; `lossy::Relation::from_str` returns
"Invalid version constraint: <" for `pkg (< 1)`. dpkg, python-debian and apt all accept the deprecated
forms (dpkg warns). Same root as debian-control/12, which is the lossless side of it.
"""

[[bug]]
id = "debian-control/14"
title = "Whitespace before the closing parenthesis, `pkg (>= 1 )`, is rejected by both parsers"
kind = "differential"
severity = "low"
test = "whitespace_before_the_closing_parenthesis_is_accepted"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg's regex is `\\(\\s*(op)\\s*([^\\)\\s]+)\\s*\\)` and python-debian's `\\(\\s*op\\s*version\\s*\\)`: whitespace
is allowed on both sides of the operator and before `)`. The lossless parser skips whitespace after `(` and
after the operator but expects `)` right after the version ("Expected ')'"); the lossy one hits
"Unexpected token: WHITESPACE". Found by `relations_parse_like_dpkg`.
"""

[[bug]]
id = "debian-control/15"
title = "`pkg (>> V)` is not seen to imply `pkg (>= V)`"
kind = "correctness"
severity = "medium"
test = "strictly_greater_implies_at_least"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In `Relation::is_implied_by`, the (inner `>=`, outer `>>`) cell is `outer_ver > inner_ver`; it must be
`>=`: anything strictly greater than V is at least V. dpkg's `deps_eval_implication` (`REL_GE` wanted,
`REL_GT` given: `$v_p >= $v_q`) agrees, and the crate's own mirror cell (inner `<=`, outer `<<`) uses `<=`.
`ensure_relation("pkg (>= 1)")` on `pkg (>> 1)` therefore replaces a stronger constraint with a weaker
one. Found by `version_implication_agrees_with_dpkg`.
"""

[[bug]]
id = "debian-control/16"
title = "`Relation::wrap_and_sort` writes the architecture qualifier as bare tokens: `archqual()` is None afterwards and a second pass drops it"
kind = "silent-corruption"
severity = "medium"
test = "wrap_and_sort_keeps_the_qualifier"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`wrap_and_sort` emits COLON and IDENT tokens directly instead of an ARCHQUAL node, so on the result
`archqual()` finds nothing, `==` treats `pkg:any` as `pkg`, and `Relations::wrap_and_sort()` applied twice
(or `wrap_and_sort` after `wrap_and_sort`) turns `pkg:any` into `pkg`. Found by
`wrap_and_sort_keeps_the_relations` (the canonical rendering check).
"""

[[bug]]
id = "debian-control/17"
title = "`set_architectures` / `add_profile` on a relation without such a list splice in an immutable node: the next edit panics in rowan"
kind = "panic"
severity = "medium"
test = "set_architectures_and_add_profile_work_inside_an_entry"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Both methods build the new relation with `SyntaxNode::new_root` (immutable) where `set_version` uses
`new_root_mut`. Any later mutation of that relation — `set_archqual`, `add_profile` after
`set_architectures`, a second `add_profile` — panics with rowan's "immutable tree: ...". This includes
`Relation::build(..).profiles(vec![g1, g2]).build()` (the builder calls `add_profile` per group) and
`Relation::simple("x")` followed by `set_architectures` and `set_archqual`. Found by
`edits_are_read_back`.
"""

[[bug]]
id = "debian-control/18"
title = "`Entry::push` on an entry inside a field nests the whole field into the entry and duplicates its text"
kind = "silent-corruption"
severity = "medium"
test = "entry_push_inside_a_field_keeps_the_field"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Entry::push` computes `self.0.replace_with(spliced green)` — which is the green of the *root* with the
entry replaced — wraps it in `new_root_mut` and splices that ROOT node into the parent in place of the
entry. On `Relations::from_str("a, b")`, `get_entry(0).push(Relation::simple("c"))` gives the text
`a | c, b, b`, `rels.len()` drops from 2 to 1 (the nested ROOT is not an ENTRY) and `entry.len()` reads 0.
The doc example passes only because a lone entry's text happens to coincide. Found by
`edits_are_read_back`.
"""

# --- debian/control layer (tests/hegel_control.rs, turn 61): against dpkg's `Dpkg::Control::Info`,
# lintian's `Vcs-*` regexes and Debian Policy §5.6. Behaviour inherited from the deb822 layers
# (deb822-lossless/9 and /12, `items()` dropping the continuation indent) is not recorded again.

[[bug]]
id = "debian-control/19"
title = "`Source::vcs()` is always `None`: it hands the full field name (`Vcs-Git`) to `Vcs::from_field`, which matches `Git`"
kind = "wrong-result"
severity = "medium"
test = "source_vcs_reads_the_vcs_field"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Source::vcs()` loops over `items()` and calls `Vcs::from_field(&name, &value)` with `name` =
`"Vcs-Git"`, `"Vcs-Browser"`, …; `from_field` matches the bare names `"Git"`, `"Bzr"`, `"Hg"`,
`"Svn"`, `"Cvs"` (as `to_field` returns them), so nothing ever matches and the method returns
`None` for every control file — including `Vcs-Git: https://salsa.debian.org/foo/foo.git -b
debian/latest [pkg]`, which `vcs_git()` and `ParsedVcs` read correctly. Fix: strip the `Vcs-`
prefix (and skip `Vcs-Browser`) before calling `from_field`.
"""

[[bug]]
id = "debian-control/20"
title = "`Source::rules_requires_root()` panics on Policy's `binary-targets` and `<namespace>/<case>` values; the lossy `Source` refuses the file"
kind = "panic"
severity = "medium"
test = "rules_requires_root_accepts_policy_values"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Policy §5.6.31 defines `Rules-Requires-Root` as `no`, `binary-targets`, or a space-separated list
of `<namespace>/<case>` keywords (e.g. `dpkg/target-subcommand`); `yes` is not a Policy value
(dpkg accepts it as an alias of `binary-targets`). The lossless getter maps `yes`/`no` and
`panic!("invalid Rules-Requires-Root value")` on anything else, so `source().rules_requires_root()`
aborts on `Rules-Requires-Root: binary-targets` (a shape dh_make and many archive packages use).
The lossy `Control::from_str` fails with "parsing field Rules-Requires-Root: invalid value for
yesno: binary-targets", so such control files cannot be read by the lossy layer at all.
`set_rules_requires_root(bool)` writes `yes`/`no`, so the crate can only produce the non-Policy
spelling.
"""

[[bug]]
id = "debian-control/21"
title = "`Binary::multi_arch()` panics on an unknown value where `priority()` returns `None`"
kind = "panic"
severity = "low"
test = "multi_arch_does_not_panic_on_an_unknown_value"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`multi_arch()` is `self.0.get("Multi-Arch").map(|v| v.parse().unwrap())`, so `Multi-Arch: bogus`
panics with `called Result::unwrap() on an Err value: "Invalid multiarch: bogus"`. The sibling
getters (`priority()`, `section()`, the relations) return `None`/`Err` on unparsable values; a
getter on a user-supplied file should not abort the process.
"""

[[bug]]
id = "debian-control/22"
title = "`Vcs::to_branch_url()` panics for a Git repository without a branch"
kind = "panic"
severity = "low"
test = "to_branch_url_without_a_branch_does_not_panic"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Vcs::Git { branch: None, .. }.to_branch_url()` does `branch.as_ref().unwrap()` (vcs.rs:217) and
panics with `called Option::unwrap() on a None value`; a `Vcs-Git: <url>` field without `-b` is
the most common shape in the archive. The method returns `Option<String>` and should return the
plain URL (or `None`) when there is no branch.
"""

[[bug]]
id = "debian-control/23"
title = "`ParsedVcs` recognises `-b <branch>` and `[<path>]` only with single spaces: doubled spaces leak into the URL and branch, a tab hides them"
kind = "wrong-result"
severity = "low"
test = "vcs_values_with_wider_whitespace_parse_like_lintian"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
lintian (`Lintian::Check::Fields::Vcs`) extracts Git fields with
`^(.+?)(?:(?:\\s+\\[(\\S*)\\])?(?:\\s+-b\\s+(\\S*))?){0,2}$`, i.e. any whitespace around `-b` and
`[path]`. `ParsedVcs::from_str` uses `find(" -b ")` and the regex `" \\[([^] ]+)\\]"` with single
spaces, so `https://x/y.git  -b  main` gives `repo_url = "https://x/y.git "` (trailing space) and
`branch = " main"` (leading space) where lintian gives `https://x/y.git` / `main`, and
`https://x/y.git\\t-b main` keeps the whole text as the URL. `Source::vcs_git()` and the lossy
`Source.vcs_git` inherit this. Splitting on `\\s+` like lintian fixes it.
"""

[[bug]]
id = "debian-control/24"
title = "`Control::wrap_and_sort` turns Policy's verbatim description lines (two or more leading spaces) into ordinary paragraph lines"
kind = "silent-corruption"
severity = "medium"
test = "wrap_and_sort_keeps_verbatim_description_lines"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Policy §5.6.13: a description line starting with two or more spaces "will be displayed verbatim"
(one space = word-wrapped paragraph text). On

    Description: short
     long
      verbatim  x
     .
     more

`Control::wrap_and_sort(Indentation::Spaces(1), false, Some(79))` writes ` verbatim  x` with a
single space, so the re-parsed `description()` reads `short\\nlong\\nverbatim  x\\n.\\nmore` and the
verbatim block is lost; the tool `wrap-and-sort` (devscripts) leaves the line alone. The field is
rebuilt from deb822-lossless's `value()`, which drops the whole continuation indent, with the new
indentation — a description needs the extra spaces kept (`get_multiline` has them). The live tree
after the call additionally reads only the first and last lines (deb822-lossless/12, not
recorded again here).
"""

[[bug]]
id = "debian-control/25"
title = "The lossy `Binary.description` drops the verbatim indentation of description lines, unlike the lossless `description()`"
kind = "wrong-result"
severity = "low"
test = "lossy_descriptions_keep_verbatim_indentation"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.3.14", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
For `Description: short\\n long\\n  verbatim  x\\n .\\n more`, `lossless::Binary::description()`
(via `get_multiline`) gives `short\\nlong\\n verbatim  x\\n.\\nmore` and the lossy
`Control::from_str(...).binaries[0].description` gives `short\\nlong\\nverbatim  x\\n.\\nmore`:
deb822-fast strips all leading whitespace of a continuation line (by design there), so the
