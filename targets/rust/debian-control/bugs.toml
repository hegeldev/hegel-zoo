every consumer strips it; a list type must not expose it. The struct's own `to_paragraph()`
writes the first entry on the key line (`Sources: foo`), which reads back correctly, so a
struct built in Rust round-trips while a real file does not. `Also-Bugs`/`Also-WNPP` are not
