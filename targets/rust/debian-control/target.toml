name = "debian-control"
language = "rust"
upstream = "https://github.com/jelmer/debian-parsers"
subdir = "debian-control"
license = "Apache-2.0"
ai_policy_checked = "2026-09-13"

[base]
commit = "4dc04da822298d3586902520119d04fd89f9218c"
date = "2026-09-05"
version = "0.3.14"

[hegel]
version = "0.44.1"

[run]
setup = ["perl -MDpkg::Deps -e 1", "/usr/bin/python3 -c 'import debian.deb822, apt_pkg' || echo 'python-debian/python-apt missing: only Dpkg::Deps is consulted'"]
command = "cargo test --no-fail-fast"

[expected_failures]
"negated_architectures_keep_their_negation" = "debian-control/1"
"lossy_parser_reads_negated_architectures" = "debian-control/1"
"lossy_parser_keeps_profile_groups_together" = "debian-control/2"
"lossy_parser_treats_newlines_as_whitespace" = "debian-control/3"
"qualified_implication_agrees_with_dpkg" = "debian-control/4"
"a_single_relation_is_not_implied_by_an_alternative_group" = "debian-control/5"
"set_version_keeps_the_qualifier_in_front" = "debian-control/6"
"built_entries_have_real_pipes" = "debian-control/7"
"add_profile_adds" = "debian-control/8"
"ensure_version_keeps_qualifiers" = "debian-control/9"
"ordering_sees_the_qualifiers_equality_sees" = "debian-control/10"
"removing_the_last_alternative_removes_the_entry" = "debian-control/11"
"deprecated_operators_are_read_like_dpkg" = "debian-control/12"
"bad_operators_do_not_panic" = "debian-control/12"
"lossy_parser_reads_deprecated_operators_like_dpkg" = "debian-control/13"
"whitespace_before_the_closing_parenthesis_is_accepted" = "debian-control/14"
"strictly_greater_implies_at_least" = "debian-control/15"
"wrap_and_sort_keeps_the_qualifier" = "debian-control/16"
"set_architectures_and_add_profile_work_inside_an_entry" = "debian-control/17"
"entry_push_inside_a_field_keeps_the_field" = "debian-control/18"
