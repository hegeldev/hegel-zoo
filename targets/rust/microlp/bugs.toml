# Bugs in microlp (Specy/microlp) at the pinned commit, as recorded by the tests on David R.
# MacIver's fork (github.com/DRMacIver/microlp, branch hegel-tests, 5996cb0), which the zoo
# runs against upstream master without the fixes that branch carries. ids are microlp/N; see
# README.md. All but /2 are faces of Specy/microlp issue #44.

[[bug]]
id = "microlp/1"
title = "a feasible, bounded MILP returns InternalError after a dual pivot on a tiny element drifts a basic value (issue #44)"
kind = "wrong-result"
severity = "high"
test = "tests::regressions::regression_tests::issue_44_reported_model_solves_to_the_only_feasible_point"
found = { commit = "f9a3ecdd1f1c046a514f442ab1511dd503facc59", version = "0.6.0 (2026-08-02)", hegel = "0.44.1", date = "2026-09-15" }
status = "open"
upstream_issue = "https://github.com/Specy/microlp/issues/44"
notes = '''
The reported model (x1 = x2 = 0 its only feasible point, a first-row coefficient of -1.19e-8) returns `InternalError("exactly integral solution failed feasibility validation after slack-basis retry")`. The dual simplex pivots x2 into the basis on the -1.19e-8 element (above the 1e-10 pivot floor), which multiplies round-off by ~1e8 and leaves x2 = 2^-26 where the final, perfectly conditioned basis says exactly 0; the phase ends because every basic value sits inside its bounds, nothing compares the values against the rows, and the MIP layer's independent guard rejects the drifted point. The retry from the slack basis replays the same pivots. Roughly one in ten full-mantissa first-row coefficients of magnitude >= 4 with any tiny in (1e-10, 1e-8) reproduces it — a band, not a point — which `issue_44_coefficient_band_solves_to_the_only_feasible_point` (a deterministic sweep) also fails on. Short-mantissa coefficients such as 8 or 8.5 never fail: their arithmetic is exact. The fix on the hegel-tests branch (83fd5e2) rebuilds a phase's terminal values from the original data before ending it.
'''

[[bug]]
id = "microlp/2"
title = "a free variable with a zero objective coefficient sends the primal phase after an infinite step: spurious Unbounded, or a NaN objective loop that never returns"
kind = "hang"
severity = "high"
test = "tests::general::tests_general::free_zero_cost_variable_is_dual_feasible"
found = { commit = "f9a3ecdd1f1c046a514f442ab1511dd503facc59", version = "0.6.0 (2026-08-02)", hegel = "0.44.1", date = "2026-09-15" }
status = "open"
notes = '''
Minimise x subject to x >= 1 with a second variable y free (bounds -inf..inf) and objective 0. The dual-feasibility measurement counts every non-basic column at neither bound as infeasible, so the free column with reduced cost 0 is chased by a primal phase that picks it as entering with an infinite step: without a row containing y the solve returns `Err(Unbounded)` on a bounded problem; with a row `x + y <= 10` to block on it loops on a NaN objective and `solve()` never returns (the zoo's copy of the test runs each solve on a thread under a 20 s limit, so the hang is reported instead of stalling the run). The branch's fix (83fd5e2, `nb_dual_feasible`) treats a free non-basic column as dual feasible when its reduced cost is zero within EPS.
'''

[[bug]]
id = "microlp/3"
title = "the feasibility tolerance the engine enforces grows with a row's largest coefficient: a row scaled by 1e4 gives InternalError on the MIP path and a vertex violating the row on the LP path (issue #44, second model)"
kind = "wrong-result"
severity = "high"
test = "tests::regressions::regression_tests::issue_44_scaled_row_solves_for_every_scale"
found = { commit = "f9a3ecdd1f1c046a514f442ab1511dd503facc59", version = "0.6.0 (2026-08-02)", hegel = "0.44.1", date = "2026-09-15" }
status = "open"
upstream_issue = "https://github.com/Specy/microlp/issues/44"
notes = '''
Rows are equilibrated by a power of two so their largest coefficient is O(1), and every comparison of a basic value against its bounds uses a flat EPS = 1e-10 in those scaled units, so the tolerance enforced in the user's units is EPS / row_scale: 8e-7 at 1e4, 5e-5 at 1e6, 5e-2 at 1e9, while `Tolerances::feasibility` promises an absolute 1e-7. The second model from the issue pins x to zero through `-2e-4*k*x - 1e3*k*y = 0` with y fixed at zero: the vertex x = -1e-4 violates that row by 2e-8*k, which the engine cannot see; the MIP guard rejects it for k >= 10 (`InternalError("exactly integral solution failed feasibility validation after slack-basis retry")`, k = 10 integer = true in the test) and the pure-LP path returns it silently. The property in `feasibility.rs` reaches the same failure in well under a second on a two-row model (`-0.001*x0 - 10000*x1 = 0`, `-2000*x0 >= -1`). The branch's fix (2324d1d) gives each slack its own tolerance derived from `Tolerances::feasibility` and the row's scale.
'''

[[bug]]
id = "microlp/4"
title = "Tolerances::feasibility does not reach the simplex engine: asking for 1e-9 still returns the vertex that is off by 2e-8"
kind = "contract"
severity = "medium"
test = "tests::regressions::regression_tests::feasibility_tolerance_drives_the_engine"
found = { commit = "f9a3ecdd1f1c046a514f442ab1511dd503facc59", version = "0.6.0 (2026-08-02)", hegel = "0.44.1", date = "2026-09-15" }
status = "open"
notes = '''
The k = 1 scaled-row model (microlp/3) may legitimately stop at x = -1e-4 at the default tolerance of 1e-7 (its row is off by 2e-8), but with `Tolerances { feasibility: 1e-9, .. }` the exact vertex x = 0 is the only acceptable answer and the solve still returns x = -9.999999999998899e-5, objective 9.999999999998899e-5. The tolerance is used by the MIP layer's validation guard only; the engine works to its own flat EPS whatever the caller asks for. Fixed on the branch by 2324d1d (`Problem::build_solver` passes the tolerance to the engine on both paths).
'''

[[bug]]
id = "microlp/5"
title = "a row with coefficients around 1e8 cannot be validated by any double-precision point: the feasibility guard demands an absolute 1e-7 below one ulp of the row's activity, so the solve ends in InternalError"
kind = "wrong-result"
severity = "medium"
test = "tests::regressions::regression_tests::huge_coefficient_row_validates_within_round_off"
found = { commit = "f9a3ecdd1f1c046a514f442ab1511dd503facc59", version = "0.6.0 (2026-08-02)", hegel = "0.44.1", date = "2026-09-15" }
status = "open"
upstream_issue = "https://github.com/Specy/microlp/issues/44"
notes = '''
A row with coefficients near 1e8 and an activity near 6e9, two integer variables and a real one pinned by the row: the exact vertex is not representable, one ulp of the activity is about 1e-6, and the MIP guard (`check_constraints`) demands `Tolerances::feasibility` = 1e-7 absolutely, so every candidate is rejected and `solve()` returns `InternalError("exactly integral solution failed feasibility validation after slack-basis retry")` although (60, 47, 48) satisfies the model — a brute-force enumeration of the integer pairs is the test's oracle. The branch found 6 of 300 random models of this class failing on master and 5 on its own earlier fixes; 68277d3 floors the guard at the row's round-off, the tolerance the engine holds the row to anyway.
'''

[[bug]]
id = "microlp/6"
title = "solve() returns an error on small feasible, bounded models whose origin is feasible (coefficients spanning 1e-8..2e4)"
kind = "wrong-result"
severity = "high"
test = "tests::feasibility::tests_feasibility::an_origin_feasible_bounded_model_solves"
found = { commit = "f9a3ecdd1f1c046a514f442ab1511dd503facc59", version = "0.6.0 (2026-08-02)", hegel = "0.44.1", date = "2026-09-15" }
status = "open"
notes = '''
The property draws one to three real variables bounded by small integers either side of zero, an optional integer variable fixed at zero (to take the MIP path), and up to two rows with coefficients from 1e-8 to 2e4 whose right-hand sides the origin satisfies; every bound is finite, so `Ok` is the only correct answer. At the pinned commit the property is intermittent: in six runs of the full million cases it failed four times (after 0.4 s, 0.9 s, 8 s and 23 s of a ~23 s run) and passed twice, and the derandomized CI profile fails in 12 s, always with `InternalError("exactly integral solution failed feasibility validation after slack-basis retry")` on e.g. maximise x0 - x1, x0 in [0, 1], x1 fixed at 0, rows `-0.001*x0 - 10000*x1 = 0` and `-2000*x0 >= -1` (the microlp/3 shape). Recorded as its own bug because the branch's commit message says the property still fails with all of its fixes in place — it then finds models returning the issue-#44 `InternalError` and pure LPs returning `Infeasible` — so the class is wider than /1, /3 and /5 together. The test asks for 1,000,000 cases (`hegel::Settings::new().test_cases(1_000_000)`, sized for the search: "the numerical states this property reaches are thin, and shallower runs mostly miss them"); the models are tiny, so the million takes about 23 s in the optimized test profile. Listed as an intermittent expected failure.
'''
