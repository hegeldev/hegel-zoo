# Bugs found in dynfmt by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracle for `PythonFormat` is Python itself (`fmt % args` in a python3 child): the crate
# documents it as "the printf-like format that python 2 used", listing key, flags, width,
# precision, length modifier and conversion type, "for the full specification, please refer to
# the Python string formatting docs".

[[bug]]
id = "dynfmt/1"
title = "the field width and the `-`, `0` and `+` flags are parsed and never applied: `%5d` of 3 is `3`"
kind = "wrong-result"
severity = "high"
test = "width_and_flags_are_applied"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`python::parse_next` fills `ArgumentSpec::with_width`, `with_alignment`, `with_zeros` and
`with_sign` from the format string, but `ArgumentSpec::format_into` (lib.rs) builds the
`Formatter` from `format` and `alternate` only — width, alignment, fill, zero padding and sign
never reach the output.  `%5d` of 3 is `3` (Python `    3`), `%-5s` of `ab` is `ab`, `%05d` is
`3`, `%+d` is `3` (Python `+3`), `%08.3f` is the bare `Display`.  The rustdoc of `PythonFormat`
lists "minimum field width" and "conversion flags" as components of a spec, and
`ArgumentSpec::with_width` documents the padding.  Every printf-style column layout comes out
unaligned.
"""

[[bug]]
id = "dynfmt/2"
title = "the precision is parsed and never applied, and floats have no default precision: `%.3d` of 5 is `5`, `%f` of 1.0 is `1`"
kind = "wrong-result"
severity = "high"
test = "precision_is_applied"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Same root as dynfmt/1: `with_precision` is set and `format_into` ignores it.  `%.3d` of 5 is
`5` (Python `005`), `%.2s` of `hello` is `hello` (`he`), `%.2f` of 3.14159 is `3.14159`
(`3.14`).  And the float conversions are all mapped to `Display` (`f F g G`) or to
`LowerExp`/`UpperExp` (`e E`) with no precision at all, where Python's default is six digits:
`%f` of 1.0 is `1` (Python `1.000000`), `%g` of 1e20 is `100000000000000000000` (`1e+20`),
`%e` of 4.2 is `4.2e0` (`4.200000e+00`; upstream's `float_lower_exp` test pins `4.2e0`, so the
exponent form is a choice — the missing digits are not).
"""

[[bug]]
id = "dynfmt/3"
title = "`*` as width or precision does not consume its argument: `%*d` of (5, 42) is `5`, later arguments shift"
kind = "wrong-result"
severity = "high"
test = "star_consumes_an_argument"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`*` parses to `Count::Ref(Position::Auto)`, which nothing ever resolves, so the size argument
stays in the list and is formatted as the value: `%*d` with (5, 42) prints `5`, `%*d|%d` with
(5, 42, 7) prints `5|42` (Python `   42|7`), `%.*s` with (2, "hello", "end") prints `2|hello`.
Unlike dynfmt/1 this is not a missing decoration but the wrong value in every later field.
"""

[[bug]]
id = "dynfmt/4"
title = "the precision regex has an unescaped `.`: `%d5d` is one spec, `%%0%%` prints `%%`, `%%5d` consumes an argument"
kind = "wrong-result"
severity = "medium"
test = "precision_needs_a_dot"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`python_re` has `(?:.(?P<precision>\\*|\\d+))?` — the dot is unescaped and matches any
character, and the optional group is tried greedily — so a conversion followed by any character,
digits (or `*`) and another conversion is swallowed into a single spec with a bogus precision.
`%d5d` of 3 prints `3` where Python prints `35d`; `%5x3d` of 255 prints `255` (`   ff3d`);
`%s*%%` of "a" prints `a` (`a*%`).  The escape `%%` is caught too: `%%0%%` prints `%%` where
Python prints `%0%` (the second `%` is the "dot", `0` the precision, the third `%` the type),
and `%%5d` becomes a `%` spec with precision 5 — a real argument is consumed and dropped, so
`100%%5d` with one argument prints `100%` and leaves a `MissingArg` for the next field.  `\\.`
is the fix.
"""

[[bug]]
id = "dynfmt/5"
title = "the space flag is never recognised: `% d` is printed literally"
kind = "wrong-result"
severity = "medium"
test = "space_flag_is_recognised"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The regex is compiled with `(?x)`, and in the `regex` crate verbose mode ignores whitespace
inside character classes too, so the class `[\\#0\\- +]` is really `[\\#0\\-+]`: the space flag is
not a flag, the spec fails to match, and `% d` of 3 is copied to the output as the text `% d`
(Python ` 3`); `%- 5d`, `% +d` likewise.  `parse_next` has a match arm for `' '` that is dead
code.  `\\ ` (an escaped space) in the class is the fix; the flag is then ignored like the others
(dynfmt/1).
"""

[[bug]]
id = "dynfmt/6"
title = "`%x`, `%X` and `%o` of a negative integer print two's complement: -255 is `ffffffffffffff01`"
kind = "wrong-result"
severity = "medium"
test = "negative_radix_forms_have_a_sign"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The radix conversions go straight to Rust's `LowerHex`/`UpperHex`/`Octal`, which print the bit
pattern of the concrete type: `%x` of -255i64 is `ffffffffffffff01`, of -255i16 `ff01`, of
-255i32 `ffffff01` — the text depends on the Rust integer type the caller happened to use, and
none of them is Python's `-ff` (`%o` of -8: `-10`; `%#x` of -255: `-0xff`).  Values arrive
through serde as `serialize_i64` etc., so the sign is known; print `-` and the magnitude.
"""

[[bug]]
id = "dynfmt/7"
title = "`%c` of an integer prints the number, not the character"
kind = "contract"
severity = "low"
test = "char_conversion_of_an_integer"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`"c" | "s" => FormatType::Display`: `%c` of 65 prints `65` where Python prints `A`.  A one-
character string is fine; a longer string is printed whole where Python raises `TypeError`.
"""

[[bug]]
id = "dynfmt/8"
title = "`%d`, `%i` and `%u` print any argument's Display: a float keeps its fraction, a string passes through"
kind = "contract"
severity = "medium"
test = "integer_conversions_take_integers"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`"d" | "i" | "u" => FormatType::Display` — the same type as `%s`, so nothing checks that the
argument is a number: `%d` of 3.7 prints `3.7` (Python truncates to `3`), `%d` of "abc" prints
`abc` (Python `TypeError: %d format: a real number is required, not str`).  `%x` of a float and
`%x` of a string are refused with `BadArg` as they should be, because those go through
`LowerHex`; `%d` needs the same gate (an `Integer` format type).
"""

[[bug]]
id = "dynfmt/9"
title = "an unknown conversion or a trailing `%` is copied as text; `Error::BadFormat` is never produced"
kind = "contract"
severity = "low"
test = "unknown_conversions_are_errors"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The iterator is `captures_iter` over the spec regex, so anything the regex does not match is
not a spec and is copied through: `%z` of 1 prints `%z`, `100%` prints `100%`, `%5.%s` prints
`%5.` and then the value.  Python raises `ValueError: unsupported format character` /
`incomplete format`.  The crate defines `Error::BadFormat(char)` ("an unknown format character
has been specified in the format") and `parse_next` has an arm returning it, but the regex's
type class makes that arm unreachable; a template with a typo formats "successfully".
"""

[[bug]]
id = "dynfmt/10"
title = "`%#X` prints the prefix in lower case: `0xFF`"
kind = "contract"
severity = "low"
test = "alternate_upper_hex_prefix_is_upper"
found = { commit = "d970fe6f9d4d81098a6f07da8e01b98508f63f29", version = "0.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Rust's `{:#X}` writes `0x` + upper-case digits; Python's `%#X` (and C's) write `0XFF`.
Upstream's `number_upper_hex_alt` test pins `0x2A`, so this is knowingly Rust's convention
under a Python name; recorded as the lowest severity because the doc points at the Python
specification for the conversions.
"""
