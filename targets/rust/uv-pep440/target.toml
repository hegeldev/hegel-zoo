name = "uv-pep440"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-pep440"
license = "Apache-2.0 OR BSD-2-Clause"
ai_policy_checked = "2026-09-14"

[base]
commit = "6dbe16aa4c1c34fc8650a359e31b23eb690aee5b"
date = "2026-09-17"
version = "0.0.82"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.specifiers, packaging.version; import packaging; assert int(packaging.__version__.split(\".\")[0]) >= 26' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages --upgrade packaging"]
command = "cargo test --no-fail-fast --features version-ranges"

[expected_failures]
"blank_items_in_specifier_sets_are_skipped_like_packaging" = "uv-pep440/1"
"oversize_local_numbers_order_as_numbers" = "uv-pep440/2"
"greater_than_admits_the_post_releases_of_other_versions" = "uv-pep440/3"
"min_version_is_below_every_version" = "uv-pep440/4"
"arbitrary_equality_takes_any_string" = "uv-pep440/5"
