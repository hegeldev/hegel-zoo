[[bug]]
id = "uv-pep440/5"
title = "`===` (arbitrary equality) only takes a PEP 440 version: `===foobar`, `===1.0-custom`, `===1.0.*` are rejected"
kind = "contract"
severity = "medium"
test = "arbitrary_equality_takes_any_string"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep440_rs` (pep440_rs/11). PEP 440: "arbitrary equality comparisons are simple
string equality operations which do not take into account any of the semantic information such
as zero padding or local versions … `===foobar`"; `packaging` parses the operand with
`===\\s*[^\\s;)]*`. The crate parses it as a PEP 440 version and fails with "expected version
to start with a number, but no leading ASCII digits were found", so a requirement such as
`foo ===foobar` cannot be read at all.
"""

