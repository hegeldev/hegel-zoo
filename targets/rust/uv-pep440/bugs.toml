[[bug]]
id = "uv-pep440/4"
title = "`MIN_VERSION` (`0a0.dev0`) is not the minimum: `0.dev0` sorts below it"
kind = "contract"
severity = "low"
test = "min_version_is_below_every_version"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep440_rs` (pep440_rs/7): `MIN_VERSION` is documented as the smallest version,
but a dev release of a final version precedes its pre-releases (`0.dev0 < 0a0.dev0`, also per
`packaging`), so the constant is not a lower bound.
