[[bug]]
id = "uv-pep440/3"
title = "`>V` rejects the post-releases of other versions of the same release (`>1.0a1` does not contain `1.0.post1`)"
kind = "wrong-result"
severity = "medium"
test = "greater_than_admits_the_post_releases_of_other_versions"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep440_rs` (pep440_rs/6). PEP 440: "the exclusive ordered comparison >V MUST
NOT allow a post-release of the given version unless V is itself a post release". `1.0.post1`
is a post-release of `1.0`, not of `1.0a1`, so `>1.0a1` admits it (`packaging` agrees, and so
does the crate's own `Ranges<Version>` conversion, which the twin property
`less_than_admits_the_prereleases_of_other_versions` shows the fork fixed for `<V`); the crate's
`contains` excludes every post-release with the same release numbers. `>0a1` does not contain
`0.post0`; `>1.0.dev1` does not contain `1.0.post1.dev0`.
"""

