[[bug]]
id = "uv-pep440/1"
title = "`VersionSpecifiers::from_str` rejects blank items that `packaging` skips (`\">=1.0,\"`, `\" \"`)"
kind = "contract"
severity = "low"
test = "blank_items_in_specifier_sets_are_skipped_like_packaging"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep440_rs` (pep440_rs/4) and still present in uv's fork: `packaging.specifiers.
SpecifierSet` splits on `,` and skips items that are empty after stripping, so `>=1.0,` and a
whitespace-only string are valid (the latter the empty set); the crate only special-cases the
empty string and fails a blank item with "Unexpected end of version specifier, expected
operator".
"""

