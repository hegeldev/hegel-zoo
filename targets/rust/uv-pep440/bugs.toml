[[bug]]
id = "uv-pep440/2"
title = "an all-digit local segment beyond u64 becomes a string segment and sorts below every number"
kind = "wrong-result"
severity = "low"
test = "oversize_local_numbers_order_as_numbers"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep440_rs` (pep440_rs/5): `1.0+18446744073709551616` parses, but the local
segment is kept as `LocalSegment::String` because it does not fit a `u64`, and PEP 440 orders
string segments below numeric ones, so `1.0+18446744073709551616 < 1.0+0`. `packaging` uses
Python integers and orders it above every smaller number.
"""

