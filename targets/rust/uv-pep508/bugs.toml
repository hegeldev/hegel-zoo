[[bug]]
id = "uv-pep508/5"
title = "`python_version != '3.5.1.*'` is the tree `false` (unsatisfiable) — the complement of an unsatisfiable `==` must be `true`, as `python_version != '3.5.1'` is and as `packaging` says"
kind = "wrong-result"
severity = "medium"
test = "not_equal_wildcards_with_a_third_component_are_satisfiable"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Zoo-original (found once the fork's fix of pep508_rs/4 let the generator produce three-component
wildcards on `python_version`). The `python_version` → `python_full_version` lowering
(`src/marker/algebra.rs`) handles `X.Y.0.*` (`== '3.5.0.*'` is `python_full_version == '3.5.*'`,
`!=` its complement) but for a wildcard whose third component is not zero it returns the empty
range for `==` *and* for `!=`: `MarkerTree::from_str("python_version != '3.5.1.*'").is_false()` is
true, the tree displays as `python_version < '0'`, and `evaluate` is false on every interpreter
(3.5.0, 3.5.1, 3.6.0 …). The `==` side is right — `python_version` is `X.Y`, `3.5` zero-pads to
`3.5.0` under PEP 440 and never has the prefix `3.5.1`, so `packaging` says false too — which is
exactly why the `!=` must be true everywhere (`packaging`: true; the crate's own
`python_version != '3.5.1'` without the wildcard is `MarkerTree::TRUE`). `negate()` of the `==`
tree is `TRUE`, so the parsed `!=` is not the negation of the parsed `==`. A requirement
`foo; python_version != '3.5.1.*'` is therefore never installed.
"""

