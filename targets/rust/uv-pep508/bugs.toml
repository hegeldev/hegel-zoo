[[bug]]
id = "uv-pep508/2"
title = "An unsatisfiable `MarkerTree` displays as `python_version < '0'` — its own canonical spelling of `false` — but that text parses back to a satisfiable-looking tree (`python_full_version < '0'`, `is_false()` = false, not equal to `MarkerTree::FALSE`)"
kind = "roundtrip"
severity = "low"
test = "false_markers_round_trip_through_display"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep508_rs` (pep508_rs/2). `MarkerTreeContents::fmt` (`src/marker/tree.rs`) writes
`python_version < '0'` for `is_false()` trees, e.g. for `python_version < '3' and python_version
>= '3'`, and the doc of `contents`/`try_to_string` calls that "the normalized expression" for
`false`. Parsing that text gives the tree `python_full_version < '0'`, which the algebra does not
recognise as unsatisfiable (the crate's own unit test `assert!(!m("python_version <
'0'").is_false())` pins the asymmetry): PEP 440 has versions below `0` (`0.dev0`, `0a0`), so the
rendering is not a spelling of `false` at all. `Requirement::to_string()` → `from_str` thus does
not round-trip a requirement whose marker is false (`a ; python_version < '0'` ≠ the original),
and serialising such a requirement (serde uses `Display`) changes its meaning.
"""

