[[bug]]
id = "uv-pep508/1"
title = "String-keyed markers are compared lexicographically even when both sides are valid versions: `platform_release < '6'` is true for release `22.6.0`; PEP 508 says PEP 440 rules apply whenever both sides are valid versions (and `packaging` says false)"
kind = "wrong-result"
severity = "medium"
test = "string_markers_compare_versions_like_pep_440"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep508_rs` (pep508_rs/1) and still present in uv's fork. PEP 508, "Environment
Markers": "The <version_cmp> operators use the PEP 440 version comparison rules when those are
defined (that is when both sides have a valid version specifier). If there is no defined PEP 440
behaviour and the operator exists in Python, then the operator falls back to the Python
behaviour." String-keyed nodes (`Edges::from_string`, `src/marker/algebra.rs`) always order the
two strings, so `platform_release < '6'` with `platform_release = 22.6.0` is `"22.6.0" < "6"` =
true, and `platform_release >= '6.5'` with `6.12.93` is false. `packaging` 26 answers by version
comparison in this case. Ordering operators on string keys whose sides are *not* both versions
are left out of the zoo's differential: there `packaging` 26 answers `false` where the spec (and
the crate) use Python string comparison.
"""

