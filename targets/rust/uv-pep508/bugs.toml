[[bug]]
id = "uv-pep508/3"
title = "Arbitrary equality with a non-numeric string is rejected: `a===a` (valid for PEP 440/508 and `packaging`) fails with \"expected version to start with a number\""
kind = "contract"
severity = "medium"
test = "arbitrary_equality_takes_any_string"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Inherited from `pep508_rs` (pep508_rs/3); the root is uv-pep440/5. PEP 440: "arbitrary equality
comparisons are simple string equality operations which do not take into account any of the
semantic information such as zero padding or local versions … `===foobar`". The version
specifier parser used by `Requirement` (`uv_pep440::VersionSpecifier::from_str`, via
`parse_specifier`) parses the operand of `===` as a PEP 440 version, so `pkg===foobar`,
`pkg===1.0-custom` and the like are rejected ("expected version to start with a number, but no
leading ASCII digits were found"; "after parsing `1.0-c`, found `ustom`") while `pkg===1.0` is
accepted. A `pyproject.toml` dependency such as `foo===foobar` cannot be read.
"""

