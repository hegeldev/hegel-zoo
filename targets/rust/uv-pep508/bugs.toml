[[bug]]
id = "uv-pep508/6"
title = "`MarkerTree` is not canonical: `X and ((X and A) or B)` over one string key leaves adjacent edges with the same child unmerged, so the tree differs from the one its own `Display` parses to although the two are equivalent"
kind = "contract"
severity = "medium"
test = "marker_trees_are_canonical"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`MarkerTree`'s doc: "Marker trees are canonical, meaning any two functionally equivalent markers
will compare equally" (`src/marker/tree.rs`); `PartialEq`/`Hash`/`Ord` are on the interned node
id. For `python_full_version < '3.5' and ((python_full_version < '3.5' and os_name != 'lin') or
os_name == 'linux')` the root `os_name` node has five edges — `(-∞, lin)`, `[lin]`, `(lin,
linux)`, `[linux]`, `(linux, ∞)` — the last three pointing at the same child (the
`python_full_version < '3.5'` node), where the tree parsed from its own `Display`
(`python_full_version < '3.5' and os_name != 'lin'`) has three edges: the conjunction restricts
the disjunction's `os_name` node edge by edge and the interner never merges adjacent equal-child
ranges, so a different node is created for the same function. The two trees are equivalent
(`a.and(b.negate()).is_false()` both ways, same `evaluate`, same `Display`) yet `!=`, hash
differently and `Ord` may order them apart. Same for `platform_machine == 'x'` or `extra == 'a'`
in place of the version comparison, and for `os_name == 'nt'` in place of `os_name == 'linux'`;
`os_name != 'lin' and ((os_name != 'lin' and platform_machine != 'x') or platform_machine ==
'y')` — the repeated variable ordered first — is canonical. Also present in `pep508_rs` 0.9.2
(pep508_rs/9) for the string and `extra` variants.
"""

