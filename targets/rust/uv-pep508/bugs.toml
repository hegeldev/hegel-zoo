fixed_in = ""
notes = """
Inherited from `pep508_rs` (pep508_rs/8). PEP 508 defines `python_version` as
`'.'.join(platform.python_version_tuple()[:2])` — `3.13` on Python 3.13.0rc1 — and
`python_version == '3.13'` compares `3.13` with `3.13` under PEP 440: true. `normalize_specifier`
(`src/marker/algebra.rs`) strips pre-release segments from marker literals ("we ignore
pre-release versions entirely when evaluating markers … `python_version` cannot take on
pre-release values"), and `python_version` expressions are lowered to `python_full_version`
ranges: `== '3.13'` becomes `python_full_version == '3.13.*'`, i.e. the range `[3.13, 3.14)`.
`MarkerTree::evaluate` then tests the environment's `python_full_version` *with* its pre-release
segment: `3.13.0rc1 < 3.13`, so the marker is false, `python_version < '3.13'`, `<= '3.12'` and
`!= '3.13'` are true, `>= '3.13'` false. Every pre-release interpreter is treated as the previous
minor: `foo; python_version >= '3.13'` is skipped and `bar; python_version < '3.13'` installed on
3.13.0rc1 (uv's resolver and `uv pip install` go through this evaluation). The same mismatch
makes `python_full_version < '3.13'` true and `python_full_version == '3.13.*'` false on
3.13.0rc1 (`packaging` says the opposite for both). Dropping the pre-release segment from
*literals* (`python_full_version == '3.13.0rc1'` → `== '3.13'`) is the documented deviation and
is not counted here; the environment's value would have to be normalised the same way for the
model to be consistent.
"""

