name = "uv-pep508"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-pep508"
license = "Apache-2.0 OR BSD-2-Clause"
ai_policy_checked = "2026-09-14"

[base]
commit = "b44bd4561d9781f9b2e4e9be1fbf85912d0f5b0a"
date = "2026-09-15"
version = "0.0.82"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.requirements, packaging.markers' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages packaging"]
command = "cargo test --no-fail-fast"

[expected_failures]
"string_markers_compare_versions_like_pep_440" = "uv-pep508/1"
"false_markers_round_trip_through_display" = "uv-pep508/2"
"arbitrary_equality_takes_any_string" = "uv-pep508/3"
"python_version_markers_hold_on_pre_release_interpreters" = "uv-pep508/4"
"not_equal_wildcards_with_a_third_component_are_satisfiable" = "uv-pep508/5"
"marker_trees_are_canonical" = "uv-pep508/6"
