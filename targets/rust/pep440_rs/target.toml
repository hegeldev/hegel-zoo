name = "pep440_rs"
language = "rust"
upstream = "https://github.com/konstin/pep440-rs"
subdir = ""
license = "Apache-2.0 OR BSD-2-Clause"
ai_policy_checked = "2026-09-13"

[base]
commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23"
date = "2025-03-03"
version = "0.7.3"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.version, packaging.specifiers; import packaging; assert int(packaging.__version__.split(\".\")[0]) >= 26' 2>/dev/null && exit 0; done; python3 -m pip install --user --break-system-packages --upgrade packaging || /usr/bin/python3 -m pip install --user --break-system-packages --upgrade packaging"]
command = "cargo test --no-fail-fast --features version-ranges"

[expected_failures]
"less_than_admits_the_prereleases_of_other_versions" = "pep440_rs/1"
"less_than_a_post_release_range_keeps_the_release" = "pep440_rs/2"
"ranges_do_not_overflow_on_maximal_numbers" = "pep440_rs/3"
"blank_items_in_specifier_sets_are_skipped_like_packaging" = "pep440_rs/4"
"oversize_local_numbers_order_as_numbers" = "pep440_rs/5"
"greater_than_admits_the_post_releases_of_other_versions" = "pep440_rs/6"
"min_version_is_below_every_version" = "pep440_rs/7"
"star_prefix_matching_pads_the_candidate" = "pep440_rs/8"
"a_maximal_dev_number_is_a_dev_release" = "pep440_rs/9"
"greater_than_a_post_release_range_keeps_the_next_dev_releases" = "pep440_rs/10"
"arbitrary_equality_takes_any_string" = "pep440_rs/11"
