# Bugs found in pep440_rs by the Hegel tests, against `packaging` 26.3 (the PEP 440 reference
# implementation) as the oracle. None known upstream at the time of import; several are fixed
# in astral-sh/uv's fork of the crate (`uv-pep440`), which the published `pep440_rs` has not
# followed since 0.7.3.

[[bug]]
id = "pep440_rs/1"
title = "`<V` rejects the pre-releases of other versions of the same release (`<1.0a2` does not contain `1.0a1`)"
kind = "wrong-result"
severity = "medium"
test = "less_than_admits_the_prereleases_of_other_versions"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PEP 440: "the exclusive ordered comparison <V MUST NOT allow a pre-release of the specified
version unless the specified version is itself a pre-release." `VersionSpecifier::contains`
appends `&& !(compare_release == Equal && other.any_prerelease())` to `less_than`, which
excludes *every* pre-release of the same release numbers, whatever `V` is: `<1.0a2` does not
contain `1.0a1`, `<1.0.dev2` does not contain `1.0.dev1`, `<1.0a1` does not contain `1.0.dev0`,
`<1.0.post1` does not contain `1.0a1` or `1.0.dev0`, `<1!1.0` does not contain `1.0a1`.
`packaging` 26.3 admits all of these (only the pre-releases of `V` itself — those at or above
`V.dev0` when `V` is not a pre-release — are excluded). The crate's own `Ranges` conversion of
`<V` for a pre-release `V` (`strictly_lower_than(V)`) admits them, so the two APIs disagree.
Fixed in uv's `uv-pep440` (the `LessThan` arm was rewritten to `other >= this.with_dev(Some(0))`
for non-pre-release `V`, with tests such as `("0.1a1", "<0.1a2")`); the published crate still
has the old code.
"""

[[bug.observed]]
input = "VersionSpecifier::from_str(\"<1.0a2\").contains(&Version::from_str(\"1.0a1\"))"
expected = "true (packaging: True; the range conversion: true)"
actual = "false"

[[bug]]
id = "pep440_rs/2"
title = "the `Ranges` conversion of `<X.postN` excludes the whole release `X` (`<1.0.post1` as a range does not contain `1.0`)"
kind = "wrong-result"
severity = "medium"
test = "less_than_a_post_release_range_keeps_the_release"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`From<VersionSpecifier> for Ranges<Version>` (feature `version-ranges`) maps `<V` for a
non-pre-release `V` to `strictly_lower_than(V.with_min(Some(0)))`. The `min` marker sorts as
the smallest kind of the *release* (`sortable_tuple` gives it kind 0, below dev, pre and final),
so for a post-release `V = 1.0.post1` the bound `1.0.post1.min0` lies below `1.0.dev0`, `1.0a1`,
`1.0`, `1.0.post0` and `1.0+local`, and the range `<1.0.post1` contains none of them.
`VersionSpecifier::contains` and `packaging` contain all of them. Fixed in uv's `uv-pep440`
(`else if version.is_post() { strictly_lower_than(version.with_dev(Some(0))) }`).
"""

[[bug.observed]]
input = "Ranges::<Version>::from(VersionSpecifier::from_str(\"<1.0.post1\")).contains(&Version::from_str(\"1.0\"))"
expected = "true (contains: true; packaging: True)"
actual = "false (also false for 1.0.post0, 1.0a1, 1.0.dev0, 1.0+local)"

[[bug]]
id = "pep440_rs/3"
title = "the `Ranges` conversions overflow on `u64::MAX` numbers (`>1.0.post18446744073709551615` panics)"
kind = "panic"
severity = "low"
test = "ranges_do_not_overflow_on_maximal_numbers"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parser accepts every number up to `u64::MAX` (larger ones are `NumberTooBig`), but the
range conversions add one without checking: `>X.postN` (`post + 1`), `>X.devN` (`dev + 1`),
`==X.N.*` / `!=X.N.*` (`release.last += 1`) and `~=X.N.Y` (`last + 1`, in both
`From<VersionSpecifier>` and `release_specifier_to_range`). With overflow checks on, this
panics; in release builds it wraps, e.g. `>1.0.post18446744073709551615` becomes
`>=1.0.post0`, which contains `1.0.post1`. Present in uv's `uv-pep440` too.
"""

[[bug.observed]]
input = "Ranges::<Version>::from(VersionSpecifier::from_str(\">1.0.post18446744073709551615\").unwrap())"
expected = "a range containing 1!0 and not 1.0.post1"
actual = "panicked at src/version_ranges.rs:56:64: attempt to add with overflow"

[[bug]]
id = "pep440_rs/4"
title = "`VersionSpecifiers::from_str` rejects blank items that `packaging` skips (`\">=1.0,\"`, `\" \"`)"
kind = "wrong-result"
severity = "low"
test = "blank_items_in_specifier_sets_are_skipped_like_packaging"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`packaging.specifiers.SpecifierSet` splits on commas and drops items that are empty after
stripping, so `">=1.0,"`, `">=1.0, "`, `" "` and `" , "` all parse. The crate special-cases
only the empty string (`""` is the empty set) and otherwise hands every comma-separated piece
to `VersionSpecifier::from_str`, which fails a blank one with `MissingOperator` ("Unexpected
end of version specifier, expected operator"). Present in uv's `uv-pep440` too.
"""

[[bug.observed]]
input = "VersionSpecifiers::from_str(\">=1.0,\")"
expected = "Ok(\">=1.0\") (packaging: SpecifierSet('>=1.0,') == SpecifierSet('>=1.0'))"
actual = "Err: Failed to parse version: Unexpected end of version specifier, expected operator"

[[bug]]
id = "pep440_rs/5"
title = "an all-digit local segment beyond u64 becomes a string segment and sorts below every number"
kind = "wrong-result"
severity = "low"
test = "oversize_local_numbers_order_as_numbers"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_local` turns a segment into `LocalSegment::Number` when `parse_u64` succeeds and
otherwise into `LocalSegment::String`, so the all-digit segment `18446744073709551616` is a
*string*. PEP 440 orders numeric local segments above alphanumeric ones and numerically among
themselves, so `1.0+18446744073709551616 > 1.0+1` (packaging, with Python integers); the crate
says `<` — and orders it lexicographically against other strings (`1.0+18446744073709551616 <
1.0+local`). Everywhere else a number beyond u64 is a parse error (`NumberTooBig`); here it
silently changes type. Display is unaffected. Present in uv's `uv-pep440` too.
"""

[[bug.observed]]
input = "Version::from_str(\"1.0+18446744073709551616\").cmp(&Version::from_str(\"1.0+1\"))"
expected = "Greater (packaging: True for >); or a NumberTooBig error"
actual = "Less — local() is [String(\"18446744073709551616\")]"

[[bug]]
id = "pep440_rs/6"
title = "`>V` rejects the post-releases of other versions of the same release (`>1.0a1` does not contain `1.0.post1`)"
kind = "wrong-result"
severity = "medium"
test = "greater_than_admits_the_post_releases_of_other_versions"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PEP 440: ">V MUST NOT allow a post-release of the given version unless V is itself a post
release." `greater_than` returns false for any post-release candidate with the same release
numbers when `V` is not a post-release, so `>1.0a1` does not contain `1.0.post1` or
`1.0a2.post1`, and `>1.0.dev1` does not contain `1.0.post1.dev0` — none of which is a
post-release of `V`. `packaging` 26.3 contains all of them (and still excludes `1.0a1.post1`
for `>1.0a1`, `1.0.post1` and `1.0.post1.dev0` for `>1.0`). The crate's own `Ranges` conversion
(`strictly_higher_than(V.with_max(Some(0)))`) admits them, so the two APIs disagree. Present
in uv's `uv-pep440` too (`if !this.is_post() && other.is_post() { return false; }`).
"""

[[bug.observed]]
input = "VersionSpecifier::from_str(\">1.0a1\").contains(&Version::from_str(\"1.0.post1\"))"
expected = "true (packaging: True; the range conversion: true)"
actual = "false"

[[bug]]
id = "pep440_rs/7"
title = "`MIN_VERSION` (`0a0.dev0`) is not the minimum: `0.dev0` sorts below it"
kind = "wrong-result"
severity = "low"
test = "min_version_is_below_every_version"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`MIN_VERSION` is documented as "the minimum version that can be represented by a `Version`:
`0a0.dev0`", but a dev release of a final version sorts before the pre-releases of that version
(kind 1 against kind 2 in `sortable_tuple`, and in PEP 440: `0.dev0 < 0a0.dev0`, as `packaging`
agrees), so `Version::from_str("0.dev0") < *MIN_VERSION`. The minimum is `0.dev0`. uv's fork
carries the same definition.
"""

[[bug.observed]]
input = "*MIN_VERSION <= Version::from_str(\"0.dev0\").unwrap()"
expected = "true"
actual = "false (0.dev0 < 0a0.dev0)"

[[bug]]
id = "pep440_rs/8"
title = "`==X.Y.*` does not zero-pad a shorter candidate (`==1.2.*` contains `1`)"
kind = "wrong-result"
severity = "medium"
test = "star_prefix_matching_pads_the_candidate"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PEP 440 prefix matching pads the candidate's release with zeros to the length of the prefix
before comparing. `contains` for `EqualStar` / `NotEqualStar` (and the prefix part of `~=`)
compares with `zip`, which stops at the shorter of the two, so a candidate with fewer release
segments matches whenever it is a prefix of the *pattern*: `==1.2.*` contains `1`, `==0.1.*`
contains `0`, `!=1.2.*` excludes `1`. `packaging` says the opposite, and so does the crate's own
`Ranges` conversion (`[1.2.dev0, 1.3.dev0)` does not contain `1`). Fixed in uv's `uv-pep440`
(`other.release().iter().chain(std::iter::repeat(&0))`, test
`test_equal_star_short_version_bug`); the published crate still has the `zip`.
"""

[[bug.observed]]
input = "VersionSpecifier::from_str(\"==1.2.*\").contains(&Version::from_str(\"1\"))"
expected = "false (packaging: False; the range conversion: false)"
actual = "true"

[[bug]]
id = "pep440_rs/9"
title = "a dev number of `u64::MAX` on a pre- or post-release compares equal to no dev (`1.0.post2.dev18446744073709551615 == 1.0.post2`)"
kind = "wrong-result"
severity = "low"
test = "a_maximal_dev_number_is_a_dev_release"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`sortable_tuple` encodes "no dev" as `dev.unwrap_or(u64::MAX)` in the arms for pre-releases
and post-releases, so a parsed dev number of `18446744073709551615` (accepted by the parser)
is indistinguishable from its absence: `1.0.post2.dev18446744073709551615` compares `Equal` to
`1.0.post2` (`packaging`: `<`), and `1.0a1.dev18446744073709551615 == 1.0a1`, while `Hash`
hashes the `Option<u64>` and differs — `Eq` and `Hash` disagree. `==1.0.post2` then contains
the dev release. Present in uv's `uv-pep440` too.
"""

[[bug.observed]]
input = "Version::from_str(\"1.0.post2.dev18446744073709551615\").cmp(&Version::from_str(\"1.0.post2\"))"
expected = "Less (packaging: True for <)"
actual = "Equal"

[[bug]]
id = "pep440_rs/10"
title = "the `Ranges` conversion of `>X.postN` skips `X.postN+1.devM` (`>1.0.post0` as a range does not contain `1.0.post1.dev0`)"
kind = "wrong-result"
severity = "low"
test = "greater_than_a_post_release_range_keeps_the_next_dev_releases"
found = { commit = "87a728cbc289e367e8db9b1ec77781c0b5a3fe23", version = "0.7.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`From<VersionSpecifier> for Ranges<Version>` maps `>X.postN` to `higher_than(X.postN+1)`, but
the dev releases `X.postN+1.devM` sort between `X.postN` and `X.postN+1` and are above `V`
(`V` is a post-release, so nothing is excluded): `VersionSpecifier::contains` and `packaging`
admit `1.0.post1.dev0` for `>1.0.post0`, the range does not. Fixed in uv's `uv-pep440`
(`strictly_higher_than(version.with_local(LocalVersion::Max))`).
"""

[[bug.observed]]
input = "Ranges::<Version>::from(VersionSpecifier::from_str(\">1.0.post0\")).contains(&Version::from_str(\"1.0.post1.dev0\"))"
expected = "true (contains: true; packaging: True)"
actual = "false (the range is >=1.0.post1)"
