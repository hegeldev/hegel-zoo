kind = "panic"
severity = "medium"
test = "check_range_underflow_on_truncated_font"
found = { commit = "7773843df0d6", version = "", hegel = "0.28.2", date = "2026-07-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Predecessor report, bug 2 (not a trophy row; the trophy covers bug 1, the xmtx long-metric underflow). Fix is && or end.checked_sub(offset). Pin: check_range_underflow_on_truncated_font."

