[[bug]]
id = "ttf-parser/7"
title = "Stream::read_bytes asserted offset + len <= u32::MAX before its bounds check, so a cmap format 12/13/14 (or any read_array32) count whose byte size exceeds u32::MAX panicked in debug builds instead of parsing to None"
kind = "panic"
severity = "low"
test = "hegel_props::cmap_subtable_count_above_u32_max_bytes_is_rejected"
found = { commit = "", version = "0.25.1 (crates.io release, vendored by rustybuzz 0.20.1)", hegel = "0.44.1", date = "2026-10-05" }
status = "fixed"
upstream_issue = "https://github.com/harfbuzz/ttf-parser/issues/240"
fixed_in = "dcb583b911f7 (2026-08-06, with 9234a21924e1; in this target's base 0c7291223fe9)"
notes = """
Found in the zoo's rust/rustybuzz target (rustybuzz/3, weekly run of 2026-10-05) against the
crates.io 0.25.1 release that rustybuzz embeds: `Subtable12::parse(&[0,12, 0,0, 0,0,0,16,
0,0,0,0, 0x16,0,0,0])` (format 12, numGroups 0x16000000, 12 * numGroups > u32::MAX) panics with
`assertion failed: self.offset as u64 + len as u64 <= u32::MAX as u64` at src/parser.rs:770,
because `read_array32` computed `count * T::SIZE` and `read_bytes` debug_asserted the sum before
the bounds check that would have returned None; `Face::from_slice` on a real font with one such
cmap count (Zycon.ttf, byte 580 set to 22) panics the same way in debug builds. The crate's
README says it must not panic. This target's base already carries upstream's fix (issue #240:
`read_array32` uses `checked_mul`, `read_bytes` bounds `len` against the buffer before adding it),
so at the base the reproducer returns None and `Face::parse` on such a font succeeds and yields no
parsed subtable; the record is here because the root cause is ttf-parser's, like rustybuzz/2 =
ttf-parser/2. No sibling target: rustybuzz is the suite that still fails on it. The narrow
property draws format 10/12/13/14 headers with counts whose byte size exceeds u32::MAX and
random tails; the pin is the 16-byte reproducer; both pass here and fail on any pre-fix tree. The
wide property `face_parse_never_panics_on_font_shaped_bytes` no longer caps the TTC numFonts
field at 0x1FFF_FFFF (a cap added for this very assertion and a maintainers' #[should_panic]
test that no longer exists): it now draws the full u32 range.
"""

[[bug.observed]]
version = "0.25.1"
commit = "0c7291223fe9"
hegel = "0.44.1"
date = "2026-10-06"
result = "fixed"
