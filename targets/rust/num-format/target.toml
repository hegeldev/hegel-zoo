name = "num-format"
language = "rust"
upstream = "https://github.com/bcmyers/num-format"
subdir = "num-format"
license = "MIT/Apache-2.0"
ai_policy_checked = "2026-09-13"

[base]
commit = "c2173715e17a48de2e0b453972715f78a8a7594b"
date = "2022-12-03"
version = "0.4.4"

[hegel]
version = "0.44.1"

[run]
setup = []
command = "cargo test --no-fail-fast --features with-serde,with-num-bigint"

[expected_failures]
overlong_texts_are_rejected_without_panicking = "num-format/1"
non_ascii_numerics_are_not_misread = "num-format/2"
an_empty_minus_sign_does_not_negate = "num-format/3"
out_of_range_texts_report_a_number_error = "num-format/4"
buffers_round_trip_through_binary_formats = "num-format/5"
texts_with_a_decimal_or_letters_are_rejected = "num-format/6"
