[[bug]]
id = "num-format/1"
title = "`parse_formatted` panics (index out of bounds) on a text with more digits than the target type can have: `\"1,000\".parse_formatted::<_, u8>(&Locale::en)`"
kind = "panic"
severity = "medium"
test = "overlong_texts_are_rejected_without_panicking"
found = { commit = "c2173715e17a", version = "0.4.4", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/parsing.rs `impl_from_formatted_str`: digits are copied into `[u8; MAX_LEN]` with the guard `if index > BUF_LEN { return Err(...) }` before `buf[index] = c as u8` — off by one, `index == BUF_LEN` passes the guard and indexes past the end: `index out of bounds: the len is 3 but the index is 3`. So any text with more digits (plus the minus-sign slot) than the type's maximum — `\"1,000\"` or `\"1000\"` as `u8` (3), `\"1234\"` as `i8` (4), a 21-digit text as `u64`, a 40-digit one as `u128` — panics instead of returning `Err`. The natural use, parsing user input into a small type, is exactly the panicking case (`\"300\"` → `Err`, `\"3000\"` → panic). Found by the first 100-case run (values formatted as `i128` parsed back as every narrower type)."

[[bug.observed]]
version = "0.4.4"
commit = "c2173715e17a"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "num-format/2"
title = "`parse_formatted` misreads non-ASCII numerals (`c.is_numeric()` then `c as u8`): CHAKMA DIGIT ZERO `𑄶` parses as 6, `〸` (Hangzhou ten) as 8; other numerals become invalid UTF-8 under `from_utf8_unchecked`"
kind = "correctness"
severity = "medium"
test = "non_ascii_numerics_are_not_misread"
found = { commit = "c2173715e17a", version = "0.4.4", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/bcmyers/num-format/issues/52"
fixed_in = ""
notes = "src/parsing.rs: every `char` for which `is_numeric()` holds is kept and truncated with `c as u8`, and the bytes are turned into a `&str` with `str::from_utf8_unchecked` for `parse`. Numerals whose code point ends in 0x30..=0x39 therefore read as the ASCII digit of their low byte: `\"\\u{11136}\"` (CHAKMA DIGIT ZERO) → `Ok(6)`, `\"\\u{11137}\"` (ONE) → `Ok(7)`, `\"1\\u{11136}\"` → `Ok(16)`, `\"\\u{3038}\"` (HANGZHOU NUMERAL TEN) → `Ok(8)`, `\"\\u{3039}\"` (TWENTY) → `Ok(9)`; AHOM DIGITs (U+11730..) happen to read correctly. Numerals with a low byte ≥ 0x80 (`½`, `²`, `𝟘`, Arabic-Indic and Devanagari digits) yield a `&str` that is not UTF-8 — undefined behaviour, in practice an `Err` from `parse` (kind `ParseLocale`, see num-format/4). Upstream #52 (open, 2026-01) reports the UB; the wrong values are the zoo's addition. Fix: keep only `c.is_ascii_digit()` (a formatted text never holds other digits) and validate the buffer."

[[bug.observed]]
version = "0.4.4"
commit = "c2173715e17a"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "num-format/3"
title = "With a `CustomFormat` whose minus sign is empty, every text parses as negative: `\"5\"` → `-5` as i32, `Err` as u32 — while formatting `5` gives `\"5\"`"
kind = "correctness"
severity = "low"
test = "an_empty_minus_sign_does_not_negate"
found = { commit = "c2173715e17a", version = "0.4.4", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/parsing.rs: `let is_negative = s.starts_with(minus_sign)` — `starts_with(\"\")` is always true, so with `CustomFormat::builder().minus_sign(\"\")` (accepted by the builder; `MinusSignStr` allows 0..=8 bytes) a `'-'` is prepended to every digit string: `\"5\".parse_formatted::<_, i32>(&f)` → `-5`, `\"0\"` → `-0` = 0, `\"5\"` as `u32` → `Err(ParseLocale(\"5\"))`. Formatting with the same format writes `5` for 5 and `5` for -5, so `parse(format(n)) == n` fails for every positive n and holds for every negative one. Found by reading `starts_with`; confirmed by the first run. Fix: `!minus_sign.is_empty() && s.starts_with(minus_sign)`."

[[bug.observed]]
version = "0.4.4"
commit = "c2173715e17a"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "num-format/4"
title = "A number that does not fit the type (`\"256\"` as u8) is reported as `ErrorKind::ParseLocale` — \"Failed to parse 256 into a valid locale.\""
kind = "correctness"
severity = "low"
test = "out_of_range_texts_report_a_number_error"
found = { commit = "c2173715e17a", version = "0.4.4", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/parsing.rs: `s2.parse::<$type>().map_err(|_| Error::parse_locale(&s))?` — the failure of the number parse (out of range, or only non-digits after filtering) is wrapped in the locale-name error, so `\"256\".parse_formatted::<_, u8>(&Locale::en).unwrap_err()` has `kind() == ParseLocale(\"256\")` and displays `Failed to parse 256 into a valid locale.`; the empty-text path a few lines above correctly uses `Error::parse_number`. Same slip in the `num-bigint` implementation. Copy-paste error seen while reading; confirmed by the first run."

