[[bug]]
id = "num-format/5"
title = "`Buffer` serializes as bytes but its `Deserialize` visitor only implements `visit_seq`, so binary formats (postcard, bincode) fail to deserialize it"
kind = "correctness"
severity = "low"
test = "buffers_round_trip_through_binary_formats"
found = { commit = "c2173715e17a", version = "0.4.4", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/bcmyers/num-format/issues/40"
fixed_in = ""
notes = "src/buffer.rs (`with-serde`): `Serialize` calls `serialize_bytes`, `Deserialize` calls `deserialize_bytes` with a visitor that implements only `visit_seq` (JSON gives an array, so the crate's own test passes). A binary serializer hands the bytes to `visit_bytes`/`visit_borrowed_bytes`, whose default implementation errors: `postcard::from_bytes::<Buffer>(&postcard::to_allocvec(&buf).unwrap())` → `Err(SerdeDeCustom)` for every value. Upstream #40 (open, 2023-04) reports it for bincode; verified here with postcard, not zoo-original. Fix: implement `visit_bytes` (and `visit_borrowed_bytes`), copying up to `MAX_BUF_LEN` bytes."

[[bug.observed]]
version = "0.4.4"
commit = "c2173715e17a"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "num-format/6"
title = "`parse_formatted` ignores the format's decimal separator and any other non-numeric character: `\"1.5\"` (en) parses as 15, `\"0x10\"` as 10, `\"1e3\"` as 13"
kind = "correctness"
severity = "low"
test = "texts_with_a_decimal_or_letters_are_rejected"
found = { commit = "c2173715e17a", version = "0.4.4", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/parsing.rs keeps the numeric characters and drops everything else, whatever it is: `\"1.5\".parse_formatted::<_, u32>(&Locale::en)` → `Ok(15)` although `Locale::en.decimal()` is `.` — the `Format` trait carries the decimal string precisely so that a parser can tell `1.500` (de, fifteen hundred) from `1.5` (en, not an integer) — and `\"0x10\"` → `Ok(10)`, `\"1e3\"` → `Ok(13)`, `\"12 kg\"` → `Ok(12)`, `\"1-000\"` → `Ok(1000)`. Only the empty digit set is an error. The documentation shows the parser on formatted texts; silently reading a decimal fraction or a hexadecimal literal as an integer is a footgun rather than leniency. Found by the first run (the `0x10` probe); the `num-bigint` implementation behaves the same."

[[bug.observed]]
version = "0.4.4"
commit = "c2173715e17a"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"
