[[bug]]
id = "time/1"
title = "Parsing a Sunday-based week number (`[week_number repr:sunday]` with a weekday) yields the wrong date in every year: a day late, six days early when January 1st is a Monday, or an out-of-range ordinal"
kind = "correctness"
severity = "medium"
test = "sunday_based_week_numbers_parse_back"
found = { commit = "4784b0a65b36", version = "0.3.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "`TryFrom<Parsed> for Date` (src/parsing/parsed.rs:1211–1224) computes the ordinal from `(year, sunday_week_number, weekday)` and `(year, monday_week_number, weekday)` with the same `adjustment(year)` (parsed.rs:1158–1172: the weekday of January 1st mapped Monday → 7, Tuesday → 1, …, Sunday → 6) — which is the Monday-based adjustment. For Sunday-based weeks the adjustment has to be the days-from-Sunday of January 1st with Sunday → 7 (Monday → 1, …, Saturday → 6). Formatting is correct: `[week_number repr:sunday]` equals `Date::sunday_based_week`, the model and jiff's `%U`. Observed with the description `[year]-[week_number repr:sunday]-[weekday repr:sunday]`: 1970-01-01 (Thursday) formats as `1970-00-5` and parses to 1970-01-02; 2023-01-01 (Sunday) → `2023-01-1` → 2023-01-02; 2026-09-13 → `2026-37-1` → 2026-09-14; 2024-01-07 (Sunday, January 1st a Monday) → `2024-01-1` → 2024-01-01, and 2024-01-01 → `2024-00-2` → `Err(ComponentRange(\"ordinal\"))`; 2025-12-31 → `2025-52-4` → `Err(ComponentRange(\"ordinal\"))`. The Monday-based description `[year]-[week_number repr:monday]-[weekday repr:monday]` round-trips every date in −999 999..=999 999. Not found in the upstream tracker (searched `sunday week parse`, `week_number`)."

[[bug.observed]]
version = "0.3.55"
commit = "4784b0a65b36"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "time/2"
title = "`SignedDuration::saturating_sub` saturates in the wrong direction when the minuend's seconds field is zero: `SignedDuration::ZERO.saturating_sub(SignedDuration::MIN)` is `MIN`, not `MAX`"
kind = "correctness"
severity = "low"
test = "saturating_subtraction_saturates_toward_the_result"
found = { commit = "4784b0a65b36", version = "0.3.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/signed_duration.rs:1246–1253: `let (mut seconds, overflow) = self.seconds.overflowing_sub(rhs.seconds); if overflow { if self.seconds > 0 { return Self::MAX; } return Self::MIN; }`. A subtraction of `i64` values overflows towards +∞ exactly when `rhs.seconds < 0`, which for `self.seconds == 0` (e.g. `ZERO`, or `SignedDuration::new(0, 5)`) is the only way to overflow at all — and then the code picks `MIN`. Observed: `SignedDuration::ZERO.saturating_sub(SignedDuration::MIN)` = `MIN` (`-9223372036854775808 s -999999999 ns`), `SignedDuration::new(0, 999_999_999).saturating_sub(SignedDuration::new(i64::MIN, 0))` = `MIN`; the documented behaviour is saturation at the nearest bound, and `checked_sub` correctly returns `None`. For a non-zero seconds field the sign of `self.seconds` equals the sign of the true result, so the bug is confined to `0 ≤ self < 1 s`. `saturating_add` (signed_duration.rs:1198) has the same shape but cannot overflow when `self.seconds == 0`. Not found in the upstream tracker."

[[bug.observed]]
version = "0.3.55"
commit = "4784b0a65b36"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "time/3"
title = "The RFC 2822 parser drops the sign of a negative offset with zero hours: `-0030` is read as `+00:30`, so every `-00mm` zone gives an instant off by up to almost two hours"
kind = "correctness"
severity = "medium"
test = "rfc2822_negative_offsets_below_an_hour_parse_back"
found = { commit = "4784b0a65b36", version = "0.3.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/time-rs/time/issues/522"
fixed_in = ""
notes = "Both RFC 2822 parsing paths apply the sign to the hours only: the `OffsetDateTime::parse` fast path (src/parsing/parsable.rs:552–566, `offset_hour` negated for `Sign::Negative`, then `(input, offset_hour, offset_minute.cast_signed())` and `UtcOffset::from_hms(offset_hour, offset_minute, 0)`) and the `Parsed` path (parsable.rs:421–440, `set_offset_minute_signed(value.cast_signed())`). For `-0130` the mismatched components `(-1, 30)` are repaired by `UtcOffset::from_hms`, which flips the smaller components to the sign of the hours, so only `-00mm` offsets are affected — and there the hours are `-0`, i.e. `0`, so the offset becomes `+00:mm`. Observed: `OffsetDateTime::parse(\"Wed, 31 Dec 1969 23:30:00 -0030\", &Rfc2822)` = `1969-12-31 23:30:00 +00:30` (Unix time −3600 instead of −1800 — the value `OffsetDateTime::format(&Rfc2822)` itself produced for `-00:30`); `-0059` → `+00:59`; the same text in jiff's `fmt::rfc2822::parse` gives `-00:30`. `Rfc3339`, `Iso8601` and the format-description components (`[offset_hour sign:mandatory][offset_minute]`) handle `-00:30` correctly since 0.3.18 (\"Correctly parse offset sign when hour is zero\", the fix for #522, 2023-02-16); the RFC 2822 code did not get that fix. Real zones with a negative sub-hour offset are rare (`-00:30` was Liberia's until 1972), but such text is well-formed and round-trips in the crate's own formatter."

[[bug.observed]]
version = "0.3.55"
