[[bug]]
id = "size/1"
title = "`Size::from_bytes`, `+`, `-`, `*`, `/` and `Sum` go through `f64`: byte counts above 2^53 are altered (`from_bytes(9007199254740993).bytes()` is `9007199254740992`)"
kind = "wrong-result"
severity = "medium"
test = "sizes_are_exact_in_the_i64_range"
found = { commit = "0bf9db2ae3153f86c87796afda65d85dc17b6e8d", version = "0.5.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With the default `std` feature the crate's `Intermediate` type is `f64`, and every generic
entry point converts through it: `from_bytes<T>` is `value.as_() as i64` (`i64` → `f64` →
`i64`), `Add`/`Sub` call `Size::from_bytes(self.bytes() + other.bytes())`, `Mul`/`Div` multiply
`self.bytes() as f64`. An `f64` holds every integer only up to 2^53 (8 PiB), so above that the
low bits are lost: `Size::from_bytes(9_007_199_254_740_993_i64).bytes()` is
`9_007_199_254_740_992`, `Size::from_const(x) + Size::ZERO` and `Size::from_const(x) * 1` change
`x`, `Size::from_bytes(x) == Size::from_bytes(x - 1)` is true, and `Size::from_bytes(i64::MAX -
1).bytes()` is `i64::MAX`. The type documents itself as "a simple wrapper around a signed
numeric value" with an `i64` `bytes()`, `from_bytes` says "there is no math required" and that
`from_const(v as i64)` "would necessarily always yield the same result" as `from_bytes(v)`,
and the `ops` documentation reserves undefined results only for sizes that exceed `i64`. The
`no_std` build (Intermediate = `i64`) and the serde integer path are exact. Hegel shrank the
failing case to exactly 2^53 + 1. Medium: silent, and it breaks `==`/`Ord` between sizes that
differ — but only from 8 PiB upwards.
"""

[[bug]]
id = "size/2"
title = "The unit and precision are chosen before rounding: `1_048_575` bytes print as `1024 KiB`, `999_999` as `1000 KB`, `10_239` as `10.00 KiB`"
kind = "wrong-result"
severity = "medium"
test = "unit_is_chosen_after_rounding"
found = { commit = "0bf9db2ae3153f86c87796afda65d85dc17b6e8d", version = "0.5.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`inner_fmt` picks the `FormatRule` by a binary search of the raw byte count against the
`less_than` thresholds, then prints `bytes / unit` with the rule's precision. A count just under
a threshold rounds up to the threshold itself: `Size::from_bytes(1_048_575).to_string()` is
`"1024 KiB"` (the next rule would print `"1.00 MiB"`), `1_073_741_823` is `"1024 MiB"`, and in
base 10 `999_999` is `"1000 KB"` and `9_999` is `"10.00 KB"`; every count within half a unit
below a power of the base is affected, e.g. `2^k·1024 − 1..=512`. The same happens inside the
precision ladder: `10_239` prints `"10.00 KiB"` with two decimals while `10_240` prints
`"10.0 KiB"` with one. The README promises "automatically choosing the best size unit and numeric
precision to give the nicest results". Medium: file sizes just under a unit boundary are common
(a 1 MiB file minus a header), and "1024 KiB" is the one result a human-readable formatter
exists to avoid.
"""

[[bug]]
id = "size/3"
title = "Exabytes never get decimals: `1.5e18` bytes print as `2 EB`, `1.30 EiB` as `1 EiB`"
kind = "wrong-result"
severity = "low"
test = "exabytes_keep_the_decimal_ladder"
found = { commit = "0bf9db2ae3153f86c87796afda65d85dc17b6e8d", version = "0.5.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Every unit from kilo to peta has three `FormatRule`s — two decimals below ten units, one below a
hundred, none above — but the last rule of both tables (`less_than: u64::MAX`, unit exa) uses
`scale.unwrap_or(0)`, so the whole exabyte range prints as a whole number even though an `i64`
only reaches 9.22 EB / 8 EiB, where the ladder calls for two decimals:
`Size::from_bytes(1_500_000_000_000_000_000).format().with_base(Base::Base10)` is `"2 EB"` (a
33 % misprint; `"1.50 EB"` expected) and the same size in base 2 is `"1 EiB"` (`"1.30 EiB"`).
The crate's own tests pin `"8 EiB"` for `i64::MAX`, which the ladder would print as `"8.00
EiB"`. Low: sizes above an exabyte.
"""

[[bug]]
id = "size/4"
title = "`Size::from_str` computes `number × unit` in `f64` and truncates: `32.3KB` parses as 32 299 bytes, `1.005 KB` as 1004, `9007199254740993` as …992"
kind = "wrong-result"
severity = "medium"
test = "parsing_decimals_is_exact"
found = { commit = "0bf9db2ae3153f86c87796afda65d85dc17b6e8d", version = "0.5.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`FromStr` parses the number as `f64` and returns `Size::from_bytes(number * multiplier as f64)`,
which truncates toward zero. A decimal with a whole number of bytes is not always a whole `f64`
product: `Size::from_str("32.3KB")` is `Ok(32_299)` (32.3 × 1000 = 32299.999999999996 in
`f64`), `"1.005 KB"` is `Ok(1004)`, and the crate's own test `parse()` asserts the intent
(`"12.34 kIloByte"` is `12 * KB + 340` — exact decimal bytes). Above 2^53 the number itself is
altered: `"9007199254740993"` parses as `9_007_199_254_740_992`, `"0.1 EiB"` is 6 bytes off the
exact `2^60 / 10`. Found by `parsing_decimals_is_exact` (whole products, shrunk to `32.3KB`) and
`parsing_decimals_is_within_the_byte` (any decimal must land on the floor or ceiling of the exact
value). The float constructors (`Size::from_kb(1.005)` = 1004) truncate the same way, but there
the caller passed an `f64` that is already below 1.005; the parser is given exact decimal text.
Medium: off by one byte on the crate's own documented syntax, silently.
"""

[[bug]]
id = "size/5"
title = "`Size::from_str` accepts `inf`, `infinity`, `nan`, `1e400` and `10 EB`: out-of-range and non-numeric text parse to `i64::MAX` or `0` instead of an error"
kind = "contract"
severity = "low"
test = "parsing_rejects_out_of_range_numbers"
found = { commit = "0bf9db2ae3153f86c87796afda65d85dc17b6e8d", version = "0.5.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The number is parsed with `str::parse::<f64>`, which accepts `inf`, `infinity` and `nan` in
any case, and the result goes through `as i64`, which saturates: `Size::from_str("inf")` is
`Ok(9223372036854775807)`, `"infinity"` and `"1e400"` the same, `"nan"` and `"NaN"` are `Ok(0)`,
`"10 EB"` (10^19 bytes, above `i64::MAX`) and `"9999999999 EiB"` are `Ok(i64::MAX)`. (`"-inf"`
happens to fail because the `-` is taken as the end of the number.) The serde path checks the
same magnitudes and reports "out of range"; the string path never does, and `ParseSizeError` is
the documented outcome for text that is not a size. Low: garbage in, a definite size out, but
only for text nobody writes by accident except `nan`/`inf` from a formatter.
"""

[[bug]]
id = "size/6"
title = "`Size::from_str` strips any number of trailing `s` from the unit: `12 kbs`, `12 bytess`, `12 kibibytesss`, `12 s` and `12 bs` are accepted"
kind = "contract"
severity = "low"
test = "unit_suffixes_take_at_most_one_plural_s"
found = { commit = "0bf9db2ae3153f86c87796afda65d85dc17b6e8d", version = "0.5.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The unit is lower-cased and then `trim_end_matches('s')` is applied, which removes every trailing
`s`, so `"12 kbs"` is 12 000 bytes (an abbreviation with a plural), `"12 bytess"` and
`"12 kibibytesss"` are accepted, and a unit consisting only of `s` is an empty unit: `"12 s"`,
`"0 Bss"` (Hegel's shrunk case) and `"12 bs"` are all bytes. The documented forms are the
abbreviations and the full names with an optional single plural `s`. Low: lenient rather than
wrong, but `12 s` reading as twelve bytes will surprise a config-file user who meant seconds.
"""
