[[bug]]
id = "numfmt/1"
title = "Formatting 0, NaN or ∞ overwrites the prefix in the reused buffer: `currency(\"$\")` prints `01.0` after a zero, `currency(\"€\")` panics"
kind = "crash"
severity = "high"
test = "special_values_leave_the_prefix_intact"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Formatter` keeps its prefix in the first `start` bytes of the reusable output buffer
(`strbuf`), and `fmt_into_buf` writes every ordinary number after them. The special cases at
the top of that function — `NaN`, `∞`, `-∞` and `0` — write at offset 0 instead
(`strbuf[..3].copy_from_slice(b"NaN")`, `strbuf[..1] = b"0"`), so with `fmt`/`fmt2` they
overwrite the stored prefix for good. `let mut f = Formatter::currency("$").unwrap();
f.fmt2(0.0); f.fmt2(1.0)` gives `"01.0"`; after `f.fmt2(f64::NAN)` every later number is
`"N1.0"`, `"N2.5"`, … — `fmt_string`/`fmt_into` too, since they copy the corrupted prefix.
With a multi-byte prefix the overwrite leaves invalid UTF-8 behind: `Formatter::currency("€")
.unwrap().fmt_string(0.0)` panics at once (`String::truncate` on a non-boundary in release,
the `debug_assert!` on UTF-8 in debug), and after `fmt2(0.0)` the next `fmt2(1.0)` panics with
"will be valid string". (The special values themselves print bare, without prefix, unit or
suffix; that is the crate's tested behaviour and not counted here.) Found by
`integers_format_as_their_float_value` at 1000 cases (prefix `€`, value 0). High: a currency
formatter that ever prints a zero prints wrong prefixes for the rest of its life, or panics.
"""

[[bug]]
id = "numfmt/2"
title = "`Precision::Significance` counts leading zeros as significant figures: `0.5` at 1 s.f. is `0`, `0.001234` at 3 s.f. is `0.00`"
kind = "wrong-result"
severity = "medium"
test = "significance_ignores_leading_zeros"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`write_num` counts every ASCII digit it copies (`digits += 1`) and stops in the fraction once
the count reaches the significance. The leading `0` of `0.xxx` and the zeros after the point
are counted like any other digit, although significant figures start at the first non-zero
digit. `Formatter::new().precision(Significance(1)).fmt2(0.5)` = `"0"` (the value is lost
entirely), `Significance(3)` gives `0.001234` → `"0.00"`, `0.01234` → `"0.01"`, `0.9` → `"0.9"`
only because the fraction is short. Medium: any significance-precision formatter is wrong for
every value below 1 that is not shown in scientific notation (the cut-off is 10^-d for d ≤ 3,
10^-3 otherwise, so 0.001 ≤ |x| < 1 is exactly the range users see).
"""

[[bug]]
id = "numfmt/3"
title = "Scientific notation is not normalised: `1e-5` prints as `10.0e-6`, `1e21` as `0.999999e21`, `1e300` as `0.999999e300`"
kind = "wrong-result"
severity = "medium"
test = "scientific_notation_is_normalised"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`reduce_to_sn` takes the exponent as `abs.log10().trunc()` (minus one below 1) and the
mantissa as `n * 10_f64.powi(-e)`. Both steps are inexact: `log10(1e-5)` is `-5.000…01`, so
`e` becomes -6 and the mantissa 10 (`Formatter::new().fmt2(1e-5)` = `"10.0e-6"`, `1e-4` →
`"10.0e-5"`); `powi(10, -21)` is not `1e-21`, so `1e21 * powi` is `0.99999…` and the output
`"0.999999e21"` (also `1e300` → `"0.999999e300"`, `9.999999999999998e12` → `"0.999999e13"`
where `log10` rounds up to 13). The mantissa is then truncated, not rounded, at 7 significant
figures, so `1.05e21` prints as `"1.049999e21"`. The documentation says the number "always has
a leading integer digit". The pin `scientific_mantissa_is_normalised_for_powers_of_ten` fails
on this; the general property `scientific_notation_is_normalised` fails in most runs but not
all — it needs its 1–17-digit decimal to be a one-digit power of ten with an unlucky exponent
(marked intermittent). Medium: exact
powers of ten and round decimals are the most common inputs of the very-small/very-large
ranges, and the exponent shown is wrong by one for them.
"""

[[bug]]
id = "numfmt/4"
title = "Thousands grouping is misplaced for numbers just below a power of ten: `999999.9999999999` prints as `9,999,99.9999999999`"
kind = "wrong-result"
severity = "low"
test = "grouping_is_by_three_digits_below_a_power_of_ten"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`write_num` decides where the separators go before it sees the digits: `thou = 2 -
(num.abs().log10().trunc() as u8) % 3` assumes `floor(log10)` + 1 integer digits. For a number
within a few ulps below a power of ten `log10` rounds up to the integer (`log10(999999.9999999999)`
= `6.0`), the count is one too many, and every separator lands one digit early:
`Formatter::new().separator(',').unwrap().fmt2(999999.9999999999)` = `"9,999,99.9999999999"`,
`99999.99999999999` → `"999,99.99999999999"`, `999.9999999999999` → `"9,99.9999999999999"`.
Counting the integer digits of the `dtoa` text (already in hand) would be exact. Low: only
numbers within ~1e-16 relative of a power of ten, but those are exactly what floating-point
arithmetic produces (`0.1 * 3`-style residues), and the output is garbage rather than
slightly off. Round inputs reach it too through the scales (2026-09-23, the generator rewrite):
`Formatter::new().scales(Scales::short()).separator(',').unwrap().fmt2(1e28)` = `"99,99.999999999998 Y"`,
because `Scales::short().scale(1e28)` is `(9999.999999999998, " Y")` after eight divisions and its
`log10()` is exactly `4.0`; the plain-number property skips that shape with a filter
(`grouped_from_a_rounded_log10`, about 1% of cases).
"""

[[bug]]
id = "numfmt/5"
title = "The thousands separator and the decimal marker can coincide: `separator('.')` then `separator(',')` prints `12,345,67`; `comma(false)` does not restore the period"
kind = "wrong-result"
severity = "low"
test = "separator_never_doubles_as_decimal_marker"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`separator('.')` sets the `comma` (decimal marker) flag and never clears it, and `comma(true)`
swaps a `,` separator for `.` but neither `separator(',')` afterwards nor `comma(false)`
re-establishes the invariant the docs describe ("If a comma is the separator, a period will be
used instead"). `Formatter::new().separator('.').unwrap().separator(',').unwrap().fmt2(12345.67)`
= `"12,345,67"`; `Formatter::new().comma(true).separator(',').unwrap()` → `"12,345,67"`;
`Formatter::new().separator(',').unwrap().comma(true).comma(false)` → `"12.345.67"`; the format
string `"[,2n/,]"` (comma decimals, explicit `,` separator) → `"12,345,67"`. The general
property `separator_never_doubles_as_decimal_marker` (random `separator`/`comma` sequences)
and the pin `builder_keeps_separator_and_marker_apart` fail. Low: needs a re-configured
formatter or an odd format string; the output is ambiguous rather than merely ugly.
"""

[[bug]]
id = "numfmt/6"
title = "`Formatter::percentage()` prints `NaNe2147483647%` for numbers whose percentage overflows (`f64::MAX`, `1e307`)"
kind = "wrong-result"
severity = "low"
test = "percentage_of_huge_numbers_is_not_nan"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The NaN/infinity checks run on the input before `convert` is applied. `percentage()` converts
with `x * 100.0`, so `1e307` becomes `+∞` after the checks; `reduce_to_sn(∞)` takes
`log10(∞).trunc() as i32` = `i32::MAX`, `powi(10, -i32::MAX)` = 0, `∞ * 0` = NaN, and the
buffer receives `dtoa`'s `NaN` followed by `e2147483647` and the suffix:
`Formatter::percentage().fmt2(f64::MAX)` = `"NaNe2147483647%"`, the same for `1e307`. The
same happens for any `convert` that returns NaN or ±∞. Low: only inputs above 1.8e306, but the
text is nonsense where `∞%` was expected.
"""

[[bug]]
id = "numfmt/7"
title = "Subnormal numbers format as `infe-324`"
kind = "wrong-result"
severity = "low"
test = "subnormals_format_as_numbers"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`reduce_to_sn` scales the mantissa with `10_f64.powi(-e)`; for `e ≤ -309` that power is `+∞`,
so the mantissa is infinite and `Formatter::new().fmt2(5e-324)` = `"infe-324"`, `2.5e-310` →
`"infe-310"`. Dividing by `10^e` (finite for e ≥ -308… and computable in two steps for the
rest) or reading the digits from the `dtoa` text would avoid the overflow. Low: subnormals
are rare in formatted output; the text is wrong rather than a panic.
"""

[[bug]]
id = "numfmt/8"
title = "Two escaped brackets of the same kind in a row in the suffix parse as one: `[]x]]]]` gives the suffix `x]`"
kind = "wrong-result"
severity = "low"
test = "escaped_brackets_in_the_suffix_parse_pairwise"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The documentation: "To use `[]` characters, a double bracket must be used." The prefix phase
consumes `[[`/`]]` pairwise (it skips the second token), but the suffix phase is a
`filter_map` over `(token, next)` pairs that drops every bracket followed by the same bracket
— so a run of four `]` loses three: `"[]x]]]]".parse::<Formatter>()` formats `1.0` as
`"1.0x]"` (expected `"1.0x]]"`), `"[]x[[[["` → `"1.0x["`. Pairs separated by other characters
(`a]]b]]`) are fine, as is the prefix (`"[[[[p[]"` → `"[[p1.0"`). Low: an escaping corner of
the format grammar.
"""

[[bug]]
id = "numfmt/9"
title = "`PartialEq`/`Hash` for `Formatter` ignore the decimal-marker (`comma`) setting"
kind = "contract"
severity = "low"
test = "equality_reflects_formatting_behaviour"
found = { commit = "8e034f30ed106f711bec44e598ae58fae2a6267f", version = "1.2.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The hand-written `PartialEq` compares the convert function, precision, separator, suffix,
prefix and scales — not the `comma` flag added later — and `Hash` matches it. So
`Formatter::new().comma(true) == Formatter::new()` although one prints `1,5` and the other
`1.5`; the parser's own tests (`[,*]` vs `[.*]`) cannot tell the two apart either. Low: a
consistency defect of the derived-by-hand trait impls.
"""
