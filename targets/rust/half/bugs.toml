[[bug]]
id = "half/1"
title = "`f16::from_f64` with hardware intrinsics (x86 F16C, the common case) converts through `f32` and so double-rounds: an f64 just above an f16 midpoint lands on the midpoint in f32 and is then rounded to even, the wrong way"
kind = "contract"
severity = "medium"
test = "f16_from_f64_is_correctly_rounded"
found = { commit = "688f1e2c2a54", version = "2.7.1", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/VoidStarKat/half-rs/issues/116"
fixed_in = ""
notes = "Known upstream: #116 (2024-09, open, labelled bug / awaiting stabilization) reports it for the intrinsics path. `arch::f64_to_f16` on x86 with `f16c` is `f32_to_f16_x86_f16c(f as f32)`. Hegel's smallest case: `f16::from_f64(2^-25 + 2^-77)` (= 2.980232238769532e-8, one f64 ulp above half the smallest subnormal) returns 0 instead of 0x0001; the docs say values are \"rounded to the nearest representable value\". Any f64 within half an f32 ulp above/below an f16 midpoint misrounds. The property fails on almost every run (the generator aims at midpoints), so it is pinned as a plain expected failure."

[[bug.observed]]
version = "2.7.1"
commit = "688f1e2c2a54"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "half/2"
title = "The software f64 conversions (`f16::from_f64_const`, `bf16::from_f64` / `from_f64_const`) truncate the low 32 mantissa bits before rounding, so inputs just above a rounding tie round down (to even)"
kind = "contract"
severity = "medium"
test = "f16_from_f64_const_is_correctly_rounded"
found = { commit = "688f1e2c2a54", version = "2.7.1", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/VoidStarKat/half-rs/issues/151"
fixed_in = ""
notes = "Known upstream: #151 (2026-07, open) — \"Software f64 conversions misround inputs just above rounding ties\". `f64_to_f16_fallback` and `f64_to_bf16` take `(bits >> 32) as u32` and decide the rounding from those bits alone, so the sticky information in the low 32 bits is lost: a value one f64 ulp above a midpoint is treated as the tie and rounded to even. Hegel: `f16::from_f64_const(2^-25 + 2^-77)` = 0 (nearest is 0x0001); `bf16::from_f64(4.591774807899562e-41)` (just above half the smallest bf16 subnormal) = 0 (nearest is 0x0001). Also pinned: `bf16_from_f64_is_correctly_rounded`."

[[bug.observed]]
version = "2.7.1"
commit = "688f1e2c2a54"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "half/3"
title = "`Float::mul_add` for `f16` and `bf16` is not fused: it rounds `f32::mul_add` to f32 and then to the half type, so the result is off by one ulp from the correctly rounded `a·b + c`"
kind = "contract"
severity = "low"
test = "f16_mul_add_is_fused"
found = { commit = "688f1e2c2a54", version = "2.7.1", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/VoidStarKat/half-rs/issues/141"
fixed_in = ""
notes = "Known upstream: #141 (2026-03, open), fix PR #146 (compute the FMA in f64) open since 2026-04. num-traits documents `mul_add` as \"Computes (self * a) + b with only one rounding error\"; `Self::from_f32(self.to_f32().mul_add(a.to_f32(), b.to_f32()))` rounds twice. Hegel's bf16 case: `2.791799e-38.mul_add(9961472, 9.1835e-41)` = 0x0cb4, correctly rounded 0x0cb5. Needs a product whose f32 rounding lands on a half-type midpoint — roughly one case in a few thousand — so both tests (`bf16_mul_add_is_fused` too) are pinned intermittent."

[[bug.observed]]
version = "2.7.1"
commit = "688f1e2c2a54"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "half/4"
title = "`FromStr` for `f16` and `bf16` parses the decimal as `f32` and rounds again, so a decimal just above (or below) a midpoint between two adjacent values parses to the wrong neighbour"
kind = "contract"
severity = "low"
test = "from_str_rounds_to_nearest"
found = { commit = "688f1e2c2a54", version = "2.7.1", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by the zoo (not among the upstream issues on rounding: #116 and #151 are about `from_f64`, #24 about `from_f32`). `impl FromStr for f16` is `f32::from_str(src).map(f16::from_f32)` (bf16 likewise). Any decimal within half an f32 ulp of an f16/bf16 midpoint is first rounded onto the midpoint by the f32 parse and then to even. Hegel: `\"33685504.0000000000000000000000000001\".parse::<bf16>()` gives 33554432 (0x4c00) although the nearest bf16 is 33816576 (0x4c01) — 33685504 is exactly the midpoint and the decimal is above it; a short decimal like `\"2049.0001\"` (above the f16 midpoint 2049 between 2048 and 2050, below it by less than half an f32 ulp) parses to 2048 the same way. Same double-rounding class as half/1; the fix is to parse as f64 (or exactly) and round once."

[[bug.observed]]
version = "2.7.1"
commit = "688f1e2c2a54"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"
