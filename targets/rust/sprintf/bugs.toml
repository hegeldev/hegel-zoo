[[bug]]
id = "sprintf/1"
title = "`%g` of zero panics (`attempt to subtract with overflow`)"
kind = "crash"
severity = "high"
test = "g_of_zero_matches_libc"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`f64::format` computes the decimal exponent as `abs.log10().floor() as i32`; for zero that is
`-inf as i32` = `i32::MIN`. The `%g` branch then evaluates `precision - 1 - exponent` and
overflows: `sprintf!("%g", 0.0)`, `sprintf!("%G", -0.0)`, `sprintf!("%.3g", 0.0)`, `sprintf!("%#g",
0.0)` all panic in a debug build (in release the wrapped exponent produces garbage digits
instead). glibc prints `0` and `-0`. High: zero is the most common value a program prints, `%g`
is the default float conversion of every printf-style language (awk, Lua, Tcl), and the crate's
purpose is a drop-in `printf` for targets without a libc.
"""

[[bug]]
id = "sprintf/2"
title = "`%e` of zero prints `NaN.000000e-2147483648`"
kind = "wrong-result"
severity = "high"
test = "e_of_zero_matches_libc"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The same `log10(0)` exponent as sprintf/1, taken down the `%e` path: `normal = abs /
10^i32::MIN` is `0 / 0` = NaN, so `sprintf!("%e", 0.0)` is `"NaN.000000e-2147483648"`,
`sprintf!("%.0e", 0.0)` `"NaNe-2147483648"`, `sprintf!("%+.0E", -0.0)` `"-NaNE-2147483648"`
(glibc: `0.000000e+00`, `0e+00`, `-0E+00`). `%f` of zero is right. High: a zero in scientific
notation is ordinary output (a table of measurements, a log of residuals) and the result is
neither a number nor an error.
"""

[[bug]]
id = "sprintf/3"
title = "`%g` leaves a trailing decimal point when every fractional digit is stripped: `%g` of 100.0 is `100.`, of 1e-5 `1.e-05`"
kind = "wrong-result"
severity = "medium"
test = "g_strips_the_decimal_point_with_the_zeros"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`%g` strips trailing zeros with `trim_end_matches('0')` on the `int.frac` text and never removes
the point that is left behind: `sprintf!("%g", 1.0)` is `"1."`, `sprintf!("%g", 100.0)` `"100."`,
`sprintf!("%g", 1e-5)` `"1.e-05"`, `sprintf!("%G", 1e20)` `"1.E+20"`, `sprintf!("%.3g", 1000.0)`
`"1.e+03"`, `sprintf!("%g", 999999.5)` `"1.e+06"`. C removes the point too unless `#` is given
(`1`, `100`, `1e-05`). Values with a surviving fraction (`2.5`, `1.23457e+06`) are right, which
is what the upstream tests cover. Medium: every integer-valued float through the default `%g`
comes out with a dangling point.
"""

[[bug]]
id = "sprintf/4"
title = "Exact decimal ties round half away from zero, not to even like glibc: `%.0f` of 0.5 is `1`, `%.2f` of 0.125 is `0.13`"
kind = "wrong-result"
severity = "medium"
test = "ties_round_like_libc"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The fraction is scaled in `f64` and rounded with `f64::round` (half away from zero); glibc
rounds the exact binary value with the current rounding mode, i.e. half to even on an exact
tie: `%.0f` of 0.5 → `1` (C `0`), 2.5 → `3` (C `2`), `%.1f` of 0.25 → `0.3` (C `0.2`), `%.2f`
of 0.125 → `0.13` (C `0.12`), `%.0e` of 2.5 → `3e+00` (C `2e+00`), `%.1e` of 1.25 → `1.3e+00`,
`%.1g` of 0.25 → `0.3`. Ties are exactly the values with a short binary expansion (k/2^j), so
they are common inputs (prices in halves and quarters, `%.0f` of `.5` totals). Medium: a
last-digit difference against the reference the crate claims to follow, on inputs that are
anything but exotic; the crate's own test for `%.0f` uses 9.99, which is not a tie.
"""

[[bug]]
id = "sprintf/5"
title = "`%.0e` of a mantissa that rounds up to 10 prints `10e+00` instead of `1e+01`"
kind = "wrong-result"
severity = "low"
test = "zero_precision_e_carries_into_the_exponent"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With a precision above 0 the scientific branch carries a rounded-up mantissa into the exponent;
the `precision == 0` branch prints `normal.round()` directly, so `sprintf!("%.0e", 9.5)` is
`"10e+00"`, `sprintf!("%.0E", 9.500001e-7)` `"10E-07"`, `sprintf!("% .0e", 9.999)` `" 10e+00"`
(glibc `1e+01`, `1E-06`, ` 1e+01`). Low: only at precision 0 and only for a mantissa above
9.5, but the output has two digits before the exponent, which is not scientific notation.
"""

[[bug]]
id = "sprintf/6"
title = "Float digits are computed in `f64`, not from the exact value: `%.20f` of 0.5 is `1.000…`, `%.17f` of 0.1 ends in `0`, `%.0f` of 1e23 prints `100000000000000000000000`"
kind = "wrong-result"
severity = "medium"
test = "float_digits_are_exact"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Three consequences of scaling the fraction by `10^precision` in `f64` and converting to `u64`:
(a) digits past the 17th are invented — `%.17f` of 0.1 is `0.10000000000000000` (glibc
`0.10000000000000001`), `%.18f` of 0.3 `0.300000000000000000` (`0.299999999999999989`), `%.17e`
of 0.1 `1.00000000000000000e-01` (`…006e-01`), `%.19e` of 1/3 ends `…30432e-01` (`…31483e-01`),
`%.20g` of 0.1 is `0.1` (`0.10000000000000000555`); (b) from a precision of 20 the scale factor
exceeds `u64::MAX`, the saturated conversion trips the carry and the value is off by one:
`%.20f` of 0.5 is `1.00000000000000000000`; (c) the integer part is printed with Rust's `{}`,
the shortest round-tripping representation, not the exact integer: `%.0f` of 1e23 is
`100000000000000000000000` where glibc prints the double's value `99999999999999991611392`.
Medium: `%.17g`/`%.20f` are how C programs print a double exactly, and the crate prints
something else without an error.
"""

[[bug]]
id = "sprintf/7"
title = "`%e` of a subnormal below 1e-323 prints `inf.000000e-324`"
kind = "wrong-result"
severity = "low"
test = "subnormals_format"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The scientific branch divides by `10^exponent` computed with `powf`; for an exponent of -324
that is `0.0`, so the mantissa is infinite: `sprintf!("%e", 5e-324)` is `"inf.000000e-324"`,
`sprintf!("%e", f64::from_bits(1000))` likewise (glibc `4.940656e-324`, `4.940656e-321`). `%g`
of the same values goes through the same division. Low: the last two decades of the subnormal
range.
"""

[[bug]]
id = "sprintf/8"
title = "A precision on an integer conversion is ignored: `%.3d` of 5 is `5`, `%.0d` of 0 is `0`, `%.5x` of 255 is `ff`"
kind = "wrong-result"
severity = "medium"
test = "integer_precision_is_a_minimum_digit_count"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In C the precision of `d`, `i`, `u`, `o`, `x`, `X` is the minimum number of digits, zero-filled,
and `%.0d` of 0 prints nothing; the `0` flag is ignored when a precision is given. The integer
formatters never look at `spec.precision`: `sprintf!("%.3d", 5)` is `"5"` (glibc `005`),
`sprintf!("%.0d", 0)` `"0"` (``), `sprintf!("%8.3d", -5)` `"      -5"` (`    -005`),
`sprintf!("%08.3d", 5)` `"00000005"` (`     005`), `sprintf!("%.5x", 255)` `"ff"` (`000ff`).
The parser accepts the precision (and `ConversionSpecifier::precision` documents itself as the
"floating point field precision"). Medium: `%.2d`-style zero filling is a common idiom, and
the output is silently narrower.
"""

[[bug]]
id = "sprintf/9"
title = "`%d` of `i64::MIN` panics in debug builds (`abs()` overflow)"
kind = "crash"
severity = "low"
test = "i64_min_formats"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`i64::format` takes `self.abs()` before converting to `u64`; for `i64::MIN` that is `attempt to
negate with overflow`: `sprintf!("%d", i64::MIN)` panics in a debug build. In release the
wrapping result reinterprets as the right `u64`, so the output is correct by accident. Low:
one value, and only with overflow checks on.
"""

[[bug]]
id = "sprintf/10"
title = "`%#x` and `%#o` of zero print `0x0` and `00`"
kind = "wrong-result"
severity = "low"
test = "alternate_form_of_zero_has_no_prefix"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
C's `#` adds `0x`/`0X` to a non-zero hexadecimal and makes an octal start with `0` (so zero
stays `0`); the crate adds the prefix unconditionally: `sprintf!("%#x", 0)` is `"0x0"`,
`sprintf!("%#X", 0)` `"0X0"`, `sprintf!("%#o", 0)` `"00"` (glibc `0` for all three), with the
widths padded accordingly. Low: one value, cosmetic.
"""

[[bug]]
id = "sprintf/11"
title = "The `#` flag is ignored for floats: `%#.0f` of 3.0 is `3`, `%#g` of 2.5 is `2.5`"
kind = "wrong-result"
severity = "low"
test = "alternate_form_applies_to_floats"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In C, `#` on `f`/`e` keeps the decimal point at precision 0 and on `g` keeps the trailing
zeros: `%#.0f` of 3.0 is `3.`, `%#.0e` `3.e+00`, `%#g` of 2.5 `2.50000`. The float formatter
never reads `alt_form`: the crate prints `3`, `3e+00`, `2.5`. The parser documents the flag as
"use `0x`, etc?" only. Low: a rarely used flag; the output is the plain form.
"""

[[bug]]
id = "sprintf/12"
title = "`%u` is an alias of `%d`: `%u` of -42 is `-42`, `%+u` of 1 is `+1`"
kind = "contract"
severity = "low"
test = "u_is_unsigned"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parser maps `d`, `i` and `u` to the same `DecInt`, and a signed argument then takes the
signed path: `sprintf!("%u", -42_i32)` is `"-42"` (glibc `%u`: `4294967254`),
`sprintf!("%llu", -1_i64)` `"-1"` (`18446744073709551615`), `sprintf!("%+u", 1_i32)` `"+1"`
(`1` — the sign flags do nothing for unsigned conversions), `sprintf!("% u", 5)` `" 5"`. With an
unsigned Rust argument the output is right. The crate's doc says it "follows the standard C
semantics" and lists three exceptions, none of them this; whether `%u` should reinterpret the
bits or convert the value is arguable, but `+`/space applying is not. Low.
"""

[[bug]]
id = "sprintf/13"
title = "A negative `*` width is ignored instead of meaning left adjustment: `%*d` with -5 and 42 is `42`"
kind = "wrong-result"
severity = "low"
test = "negative_star_width_means_left_adjustment"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
C: "A negative field width is taken as a `-` flag followed by a positive field width." The
crate stores the argument as `Literal(-5)` and every formatter converts the width with
`try_into().unwrap_or_default()`, so it becomes 0: `sprintf!("%*d", -5, 42)` is `"42"` (glibc
`42   `), `sprintf!("%*s", -6, "ab")` `"ab"` (`ab    `), `sprintf!("%*.2f", -8, 1.5)` `"1.50"`.
Low: a computed width that goes negative is how C code left-adjusts dynamically, but it is a
niche idiom.
"""

[[bug]]
id = "sprintf/14"
title = "A width or precision above `i32::MAX` in the format string panics (`attempt to multiply with overflow`) instead of `ParseError`"
kind = "crash"
severity = "low"
test = "huge_widths_are_parse_errors"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`take_numeric_param` accumulates the digits into an `i32` with `w = 10 * w + digit`;
`parse_format_string("%99999999999d")` and `sprintf!("%.10000000000f", 1.0)` panic in a debug
build (and wrap to a meaningless width in release) where `Err(PrintfError::ParseError)` is the
crate's channel for a bad format string. Low: a hostile or corrupted format string; a runtime
`printf` clone is exactly where format strings come from data.
"""

[[bug]]
id = "sprintf/15"
title = "For floats the space flag overrides `+`: `%+ f` of 1.0 is ` 1.000000`"
kind = "wrong-result"
severity = "low"
test = "plus_overrides_space_for_floats"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
C: "if the space and `+` flags both appear, the space flag is ignored." The integer formatter
tests `force_sign` before `space_sign` and gets `+1`; the float formatter tests them the other
way round: `sprintf!("%+ f", 1.0)` is `" 1.000000"`, `sprintf!("% +e", 2.5)` `" 2.500000e+00"`,
`sprintf!("%+ g", f64::INFINITY)` `" inf"` (glibc `+1.000000`, `+2.500000e+00`, `+inf`). Found
by the differential, not by reading. Low: two flags that rarely meet, and the two paths
disagree.
"""

[[bug]]
id = "sprintf/16"
title = "`.*` (precision from an argument) never works: the default precision is used and the argument is taken as the value"
kind = "wrong-result"
severity = "medium"
test = "precision_from_argument_is_consumed"
found = { commit = "953a1f6aaa7275121862a8888148c551611f7ba3", version = "0.4.3", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`take_conversion_specifier` initialises `precision` to `NumericParam::FromArgument` as a
"placeholder" for "not specified" and, after parsing, replaces `FromArgument` by the default
(6, or `i32::MAX` for strings). A real `.*` sets the same value, so it is replaced too and its
argument is never consumed: `sprintf!("%.*f", 2, 3.14159)` is `Err(WrongType)` (the 2 is
formatted as the float), `sprintf!("%.*s", 3, "abcdef")` `Err(WrongType)`, `sprintf!("%.*d", 3,
5)` `Err(TooManyArgs)`, and `sprintf!("%.*f%d", 2, 3.14159, 7)`, where the types happen to line
up, is `Ok("2.000000…")`-shaped garbage. `%*d` (width from an argument) works and is the
documented example. Medium: a documented-by-C feature that has never worked in the crate; it
fails loudly in most call shapes, silently in some.
"""
