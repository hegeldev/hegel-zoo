[[bug]]
id = "patchkit/1"
title = "`format_patch_date` prints the UTC wall clock with a non-UTC zone: the offset is shown but not applied"
kind = "wrong-result"
severity = "medium"
test = "format_patch_date_applies_the_offset"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`format_patch_date(1546300800, 3600)` gives `2019-01-01 00:00:00 +0100`; the instant is
2019-01-01 01:00:00 at +0100 (bzr's `format_patch_date`, which this ports, formats
`gmtime(secs + offset)`; coreutils `date -d @$((secs+offset))` agrees). `src/timestamp.rs:43`
builds the `DateTime` from `secs` alone and only prints the offset. The crate's own
`parse_patch_date` subtracts the offset, so `parse(format(secs, off)) == (secs - off, off)`:
the round trip is off by the zone for every non-UTC offset. Only `+0000` output is right.
"""

[[bug]]
id = "patchkit/2"
title = "`EdPatch::parse_patch` rejects GNU diff's normal-format ranges (`2a3,4`, `3,4d2`, `1,2c1,3`)"
kind = "contract"
severity = "medium"
test = "normal_diff_ranges_parse_and_apply"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The `ed` module's format (`5a10` / `> line`, `5d10` / `< line`, `5c10` / `< old` / `---` /
`> new`) is GNU diff's *normal* output (an ed script would be `5a` … `.`). `diff` writes a
range `N,M` on either side whenever more than one line is involved (`2a3,4` for two added
lines), and `parse_hunk_header`'s regex `(\\d+)([adc])(\\d+)\\n` does not admit a comma, so
`parse_patch` returns `Err(header)` for any normal diff with a multi-line hunk — `diff a b`
of two files differing by two adjacent lines is unreadable, while `patch` reads it fine.
"""

[[bug]]
id = "patchkit/3"
title = "`EdPatch::apply` panics (`assert_eq!(start, end)`) on every normal-diff hunk whose line numbers differ, and inserts before the line instead of after"
kind = "panic"
severity = "high"
test = "normal_diff_single_line_hunks_apply_like_patch"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In normal-diff hunks `NaM` / `NdM` / `NcM`, N is a line of the old file and M of the new; they
are equal only while no earlier hunk changed the line count and, for `a`, never (`0a1` adds at
the top, `1a2` after line 1). `EdPatch::apply` (`src/ed.rs:25`, `:44`) does
`assert_eq!(start, end)` and so panics on `0a1`, `1a2`, `2d1`, `1d0` — i.e. on the output of
`diff` for a one-line insertion or deletion at any position; the property that applies
`diff a b` to `a` panics on its first case. Where the numbers happen to agree, `a` uses
`data.insert(start - 1, …)`, which puts the line *before* line N rather than after it (and would
underflow for `0a…`). `patch` applies all these and yields the modified file. `EdPatch::apply`
also applies hunks in order without an offset, so a second hunk after a deletion lands one line
off. The general property `normal_diff_output_parses_and_applies` is mapped here (the panic is
its first failure); the range bug is patchkit/2.
"""

[[bug]]
id = "patchkit/4"
title = "`parse_patch_date` rejects the timestamps GNU diff writes (`2026-09-14 01:54:15.100545957 +0000`, nanoseconds)"
kind = "contract"
severity = "medium"
test = "diff_timestamps_with_fractions_parse"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
GNU diff's default `---`/`+++` headers carry `%Y-%m-%d %H:%M:%S.%N %z` (nanoseconds), and so
do the patches `diff -u`, `diff -ruN`, `quilt refresh` and `dpkg-source` produce.
`RE_PATCHDATE` (`src/timestamp.rs:62`) is `(\\d+-\\d+-\\d+\\s+\\d+:\\d+:\\d+)\\s*([+-]\\d\\d)(\\d\\d)$`
with no fraction group, so every such timestamp is `InvalidDate`. bzr's regex allowed an optional
`(\\.\\d+)?` fraction, which is what a port should keep. `UnifiedPatch` itself stores the raw
`orig_ts`/`mod_ts` bytes and round-trips them (fine).
"""

[[bug]]
id = "patchkit/5"
title = "`Series::write` prefixes comments with a second `#`: `# a comment` comes back as `# # a comment`"
kind = "roundtrip"
severity = "low"
test = "series_comments_round_trip"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Series::read` stores a comment line whole (`SeriesEntry::Comment("# a comment")`, `#`
included) and `Series::write` emits `# {comment}`, so each read/write cycle adds `# ` and
`read(write(s)) != s` for any series with a comment. Patch lines and options round-trip.
"""

[[bug]]
id = "patchkit/6"
title = "`parse_patch_date` adds the minutes of a negative offset instead of subtracting them (`-0330` reads as -02:30, `-0030` as +00:30)"
kind = "wrong-result"
severity = "medium"
test = "negative_offsets_with_minutes_parse"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The offset is read as `hours.parse::<i64>() * 3600 + minutes * 60` (`src/timestamp.rs:98`)
with `hours` carrying the sign and `minutes` always positive, so `-0330` becomes
`-3*3600 + 30*60 = -02:30` and `-0030` (hours `-00` = 0) becomes `+00:30`. Every negative
offset with a minutes part is wrong by twice its minutes: Newfoundland (`-0330`/`-0230`) and
the Marquesas (`-0930`) are real zones, and `format_patch_date` produces such strings for any
offset in the range, so they do not round-trip. Positive offsets and whole-hour negative
offsets are fine.
"""

[[bug]]
id = "patchkit/7"
title = "`edit::parse` takes a deleted line that begins with `--` (`--- sql comment` in the patch) for a new file header: the hunk is cut short and a bogus `PatchFile` appears"
kind = "correctness"
severity = "high"
test = "deleted_dash_dash_lines_stay_in_the_hunk"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The unified hunk body parser (`is_hunk_end`, `src/edit/parse.rs`) ends the hunk at any line
whose first three characters are `---` or `+++`, without consulting the counts in the hunk
header. A removed line whose content starts with `--` (an SQL, Lua, Haskell or Ada comment,
a `--` separator, a `--flag` in a shell script) is written by diff as `--- …`, and an added
line starting with `++` as `+++ …`. For `x\\n-- sql comment\\ny\\n` → `x\\ny\\n` the CST has
two `PatchFile`s (the second with old path `sql`), the first hunk has one line, and
`check_counts` reports mismatches on a well-formed patch. GNU patch and the crate's own
`unified` parser count lines from the header and read it correctly.
"""

[[bug]]
id = "patchkit/8"
title = "`Hunk::fix_counts` rewrites a correct `@@ -1 +1 @@` header to `@@ -1,1 +1,1 @@` and returns true, while `check_counts` treats the implicit count as 1"
kind = "contract"
severity = "low"
test = "fix_counts_leaves_diff_output_alone"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`fix_counts` compares `range.count() != Some(actual)` (`src/edit/lossless.rs`), so a range
with no `,count` part (which GNU diff writes for every single-line range) always counts as
wrong when the actual count is 1; the header is rewritten and `true` ("counts were changed")
is returned although nothing was wrong. `check_counts` on the same hunk uses
`count().unwrap_or(1)` and finds no mismatch. A "fix" pass over any diff output thus edits
one-line hunks it should leave alone.
"""

[[bug]]
id = "patchkit/9"
title = "`edit` cuts a quoted file name with spaces (`--- \"sp ace\"\\t…`, as GNU diff writes it) at the first space; the `unified` parser keeps `\"sp ace\"`"
kind = "differential"
severity = "medium"
test = "quoted_paths_with_spaces_are_kept"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_file_path` (`src/edit/parse.rs`) stops the PATH token at the first WHITESPACE token,
but GNU diff separates the name from the timestamp with a tab and quotes names containing
spaces (`--- "sp ace"\\t2026-09-14 …`). `PatchFile::old_path()` returns `"sp` for such a
header; `UnifiedPatch::parse_patch` on the same text gives `orig_name = "sp ace"` (with the
quotes, split at the tab). The two parsers of the crate disagree on any file name with a
space.
"""

[[bug]]
id = "patchkit/10"
title = "`edit::parse` of a normal diff: a `\\ No newline at end of file` marker on the old side of a `c` hunk ends the hunk, and the `---` separator that follows becomes a unified file header"
kind = "correctness"
severity = "medium"
test = "normal_diff_no_newline_markers_stay_in_the_hunk"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_normal_old_lines` (`src/edit/parse.rs`) consumes `<` lines only; when the original file
has no final newline GNU diff writes `< last\\n\\ No newline at end of file\\n---\\n> new\\n`, the
marker stops the old-lines loop, the `---` is no longer where `parse_normal_hunk` looks for the
separator, the hunk ends, and the top-level loop reads `---` as the start of a unified
`PatchFile` (so `detect_format()` says `Unified` and the `>` lines are lost). `diff a b` of
`a\\n`-without-newline against `b\\n` is the smallest case.
"""

[[bug]]
id = "patchkit/11"
title = "`Parse::reparse` gives a different tree from a full parse when its slice ends inside a line (root-level junk tokens of a patch, whitespace-only lines of a series file)"
kind = "correctness"
severity = "medium"
test = "patch_reparse_matches_a_full_parse"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Also pinned by `series_reparse_matches_a_full_parse`. `reparse` (`src/edit/mod.rs`) cuts the
region to re-parse at the boundaries of the root's direct children, but lines the parser
skips (`diff --git`, `index …`, `Only in …`, free text) are emitted as individual tokens under
the root, and a whitespace-only series line is an entry without its newline (the newline is
a root token). The slice then ends in the middle of a line and is parsed without the rest of
it: inserting `1a\\n` before `diff -ruN a/one b/one\\n` gives an ed command whose content line
is `diff` and the rest of the line as loose tokens (a full parse swallows the whole line);
editing the hash in `index 1234abc..5678def 100644` re-lexes `bd..` without the digit before
it (LETTER vs TEXT tokens); in a series file, joining `a.patch\\n` with a following `  \\n`
leaves the newline outside the entry. The crate's own reparse_tests assert
`incremental.green() == full.green()`; a random edit finds a counterexample within a few
hundred cases.
"""

[[bug]]
id = "patchkit/12"
title = "`SeriesFile::reorder` panics (rowan `range end index … out of range`) on any series of two or more patches, even for the current order"
kind = "panic"
severity = "high"
test = "reorder_reorders"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`reorder` (`src/edit/series/editor.rs`) detaches every child of the root
(`splice_children(0..total, vec![])`) and then re-inserts the collected patch elements one by
one at `children_with_tokens().count()..`; the second insertion panics inside
`GreenNodeData::insert_child` ("range end index 2 out of range for slice of length 1").
`"a.patch\\nb.patch\\n".reorder(["a.patch", "b.patch"])` panics; a single patch is the only
working case. By construction the method would also drop comments and blank lines (the
source says "For now, skip this complex case") and silently lose patches missing from
`new_order`.
"""

[[bug]]
id = "patchkit/13"
title = "`SeriesFile::push`/`insert` at the end/`add_comment` on a series whose last line has no newline glue the new entry onto it (`a.patch` + `b.patch` → `a.patchb.patch`)"
kind = "silent-corruption"
severity = "medium"
test = "pushing_onto_a_series_without_a_final_newline"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The editor builds each new entry as `name [options]\\n` and splices it after the last child
(`src/edit/series/editor.rs`), never checking whether the preceding entry ends with a
newline. Parsing `a.patch` (no final newline; quilt and `Series::read` accept it) and
`push("b.patch", [])` gives the text `a.patchb.patch\\n`, one patch named `a.patchb.patch`;
`add_comment("note")` gives `a.patch# note\\n`, a patch with a comment glued on and no
comment entry. The live tree still shows two entries, so the corruption is only visible
after writing and re-reading the file.
"""

[[bug]]
id = "patchkit/14"
title = "`edit::series::parse` warns \"Invalid strip level\" for `-p1` on any patch name without a `/`: the level is compared with the depth of the series entry, not of the paths inside the patch"
kind = "wrong-result"
severity = "low"
test = "strip_level_options_do_not_warn"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_options` (`src/edit/series/parse.rs`) computes `patch_name.split('/').count() - 1` and
warns when the `-pN` level exceeds it. `-pN` tells patch/quilt/dpkg-source how many leading
path components to strip from the file names *in the patch*; the location of the patch file
in `debian/patches/` has nothing to do with it. `a.patch -p1` — the default level and by far
the most common explicit option — warns on every plain series; the crate's own
`test_invalid_strip_level` encodes the wrong reading.
"""

[[bug]]
id = "patchkit/15"
title = "`edit::series::parse` reports \"Expected patch name or comment\" for a whitespace-only last line without a final newline (`\"  \"`, `\"a.patch\\n\\t\"`)"
kind = "contract"
severity = "low"
test = "whitespace_only_last_line_is_not_an_error"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_entry` skips leading SPACE/TAB tokens and then accepts only NEWLINE, HASH or
PATCH_NAME; at end of input it errors. The same line with a newline is a blank line
(no error). quilt and the lossy `Series::read` ignore it either way.
"""

[[bug]]
id = "patchkit/16"
title = "`quilt::Series::read` keeps the words of a trailing `# comment` as patch options (`a.patch -p1 # applied upstream` → options `-p1`, `#`, `applied`, `upstream`)"
kind = "wrong-result"
severity = "low"
test = "lossy_series_drops_trailing_comments"
found = { commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4", version = "0.3.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Series::read` (`src/quilt.rs`) treats a trimmed line starting with `#` as a comment and
otherwise `split_whitespace()`s it into name and options. quilt's `patch_args` strips
`(^|[ \\t]+)#.*` from the line first, so a trailing comment is never an option there; the
lossless `edit::series` parser stops the options at the `#` too. `series.write()` then
produces `a.patch -p1 # applied upstream` again, so the round trip hides it, but
`patch_args`-style consumers of the options get `#` and the comment words.
"""
