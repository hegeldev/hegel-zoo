name = "patchkit"
language = "rust"
upstream = "https://github.com/breezy-team/patchkit"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4"
date = "2026-09-01"
version = "0.3.8"

[hegel]
version = "0.44.1"

[run]
setup = ["diff --version > /dev/null", "patch --version > /dev/null", "lsdiff --version > /dev/null 2>&1 || echo 'patchutils missing: the lsdiff comparison is skipped'", "quilt --version > /dev/null 2>&1 || echo 'quilt missing: the series comparison is skipped'"]
command = "cargo test --no-fail-fast"

[expected_failures]
"patch_dates_format_like_date" = "patchkit/1"
"format_patch_date_applies_the_offset" = "patchkit/1"
"normal_diff_ranges_parse_and_apply" = "patchkit/2"
"normal_diff_output_parses_and_applies" = "patchkit/3"
"normal_diff_single_line_hunks_apply_like_patch" = "patchkit/3"
"diff_timestamps_with_fractions_parse" = "patchkit/4"
"series_comments_round_trip" = "patchkit/5"
"negative_offsets_with_minutes_parse" = "patchkit/6"
"deleted_dash_dash_lines_stay_in_the_hunk" = "patchkit/7"
"fix_counts_leaves_diff_output_alone" = "patchkit/8"
"quoted_paths_with_spaces_are_kept" = "patchkit/9"
"normal_diff_no_newline_markers_stay_in_the_hunk" = "patchkit/10"
"patch_reparse_matches_a_full_parse" = "patchkit/11"
"series_reparse_matches_a_full_parse" = "patchkit/11"
"reorder_reorders" = "patchkit/12"
"pushing_onto_a_series_without_a_final_newline" = "patchkit/13"
"strip_level_options_do_not_warn" = "patchkit/14"
"whitespace_only_last_line_is_not_an_error" = "patchkit/15"
"lossy_series_drops_trailing_comments" = "patchkit/16"
