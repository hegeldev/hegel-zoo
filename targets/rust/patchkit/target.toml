name = "patchkit"
language = "rust"
upstream = "https://github.com/breezy-team/patchkit"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "341ce8c46c987b53f4692b4cffc8e592e3e3c8f4"
