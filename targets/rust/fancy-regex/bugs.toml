[[bug]]
id = "fancy-regex/2"
title = "A capturing group whose body is one lazy unbounded repeat, repeated with *, is rewritten (X*?)* -> (X*?)? before delegation, so the group's span differs from the regex crate's: group 1 of ((?:[b]|)*?)*a on bba is (0, 2) instead of (1, 2)"
kind = "wrong-result"
severity = "low"
test = "starred_group_of_a_lazy_repeat_captures_like_regex"
found = { commit = "857c92c2f9f7b78ac70983b2b976ebc2e755cdca", version = "0.19.2 (857c92c2f9f7, 2026-09-18)", hegel = "0.44.1", date = "2026-09-24" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`optimize_nested_repeats` (src/optimize.rs) turns `Repeat{lo: 0, hi: MAX}` over a `Group` whose child is a `Repeat{hi: MAX}` into `Repeat{lo: 0, hi: 1}` when the pattern has no backreferences, with the comment that `(X+)* = (X+)?` for a self-absorbing X and that the differing participation count is unobservable. `is_self_absorbing` ignores greediness, and for a lazy inner repeat the two patterns are different for the regex crate's leftmost-first captures: `regex::Regex::new("((?:[b]|)*?)*a").captures("bba")` has group 1 = (1, 2) and `"((?:[b]|)*?)?a"` has (0, 2). fancy-regex delegates the rewritten tree (through its Hir translation), so `fancy_regex::Regex::new("((?:[b]|)*?)*a").captures("bba")` reports (0, 2), the match (0, 3) agreeing. The same for `((?:[b]|)+?)*a`, `((?:[b]|)*?){0,}a` and `((?:[b]|)*?)*?a`; `((?:[b]|)*?)+a` (outer lo 1, no downgrade) and the greedy `((?:[b]|)*)*a` agree with regex. Perl and Python give (2, 2) for the original pattern, so the crate's answer matches neither its delegate nor the backtracking engines. The downgrade should require a greedy inner repeat, as `can_simplify` does on its own path. Found by `prop_plain_subset_captures_agree_with_regex_crate` in a 2000-case run once the generators drew patterns as trees (the old string grammar could produce the shape too, at a lower rate).
"""
