# Bugs found in debian-changelog by the Hegel tests, against dpkg-parsechangelog 1.22 and
# python-debian 2.0 (the same regexes) as the oracles. All zoo-original; upstream has no related
# issue (jelmer/debian-parsers #466 is the urgency-annotation design choice, closed).

[[bug]]
id = "debian-changelog/1"
title = "The strict parser accepts headers dpkg does not recognise: no distribution, or no `;`"
kind = "differential"
severity = "low"
test = "strict_parser_rejects_headers_dpkg_rejects"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg's header regex requires at least one distribution and the `;` (`^(\\w[-+0-9a-z.]*) \\(([^\\(\\) \\t]+)\\)((?:\\s+[-+0-9a-z.]+)+)\\;`).
`ChangeLog::from_str` accepts `foo (1.0-1);` and `foo (1.0-1) unstable` (no `;`) without an error;
for dpkg such a line is a "badly formatted heading line" and, when it follows another entry, its
trailer is folded into the previous entry (`dpkg-parsechangelog` counts one entry where the crate
counts two). Found by `changelogs_parse_like_dpkg`.
"""

[[bug]]
id = "debian-changelog/2"
title = "Package and distribution names containing `+` (g++, libsigc++-2.0) do not parse"
kind = "differential"
severity = "medium"
test = "package_names_with_plus_are_parsed"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg's name characters are `[-+0-9a-z.]`, and `+` occurs in real source packages (`g++`,
`libsigc++-2.0`, `libxml++2.6`, `gtkmm3.0`'s siblings) and in distribution names. The lexer's
identifier characters are `[A-Za-z0-9.-]`, so `g++ (1.0-1) unstable; urgency=low` lexes as
`g`, ERROR, ERROR, ... and the strict parser fails with "expected VERSION, got Some(ERROR)"
(`parse_relaxed` gives `package() == Some("g")`). `dpkg-parsechangelog` reads it cleanly with
`Source: g++`. The same happens for a distribution such as `a+b`.
"""

[[bug]]
id = "debian-changelog/3"
title = "`Entry::datetime()` rejects trailer dates dpkg accepts: no weekday, one-digit day, trailing space"
kind = "differential"
severity = "low"
test = "dates_dpkg_reads_are_read"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg's trailer regex makes the weekday optional (`((\\w+)\\,\\s*)?`) and allows a one- or two-digit
day (`\\d{1,2}`), and `dpkg-parsechangelog` reports a `Timestamp:` for `01 Jan 1998 00:00:00 -0000`
and for `Thu, 1 Jan 1998 00:00:00 -0000`. `parse_time_string` tries chrono's
`%a, %d %b %Y %H:%M:%S %z` and, failing that, the part after `", "` with the same format, so a
date without weekday, or with a one-digit day (chrono's `%d` wants two digits), gives
`datetime() == None` although `timestamp()` has the text. Trailing whitespace on the trailer
line (allowed by dpkg's `\\s*$`) ends up in `timestamp()` and makes `datetime()` fail as well.
Old changelogs use the first two forms; the third is common.
"""

[[bug]]
id = "debian-changelog/4"
title = "`find_closed_debian_bugs` / `find_closed_launchpad_bugs` read bug lists more greedily than dpkg"
kind = "differential"
severity = "low"
test = "closes_lists_agree_with_dpkg"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg (and dak, python-debian, Launchpad) use `closes:\\s*(?:bug)?\\#?\\s?\\d+(?:,\\s*(?:bug)?\\#?\\s?\\d+)*`
and `lp:\\s+\\#\\d+(?:,\\s*\\#\\d+)*`: numbers must be comma-separated, `#` may be followed by at most
one space, and `LP:` needs whitespace and a `#`. The crate matches `[Cc]loses:\\s*[#\\d\\s,]+` and
`[Ll][Pp]:\\s*[#\\d\\s,]+` and then takes every digit run, so `Closes: #1 #2` closes both (dpkg: only
#1), `Closes: #1,, #2` and `Closes: #1 , #2` close both, `Closes: #  5` closes 5, `lp:#12` and
`LP: 12` count as Launchpad bugs (dpkg: none). An upload's `.changes` file would thus disagree
with what the crate reports as closed.
"""

[[bug]]
id = "debian-changelog/5"
title = "`Closes:` is matched case-sensitively and `bug#NNN` / `bug NNN` items are not read"
kind = "differential"
severity = "low"
test = "closes_marker_is_case_insensitive_and_reads_bug_prefixes"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg's `find_closes` regex is case-insensitive and allows an optional `bug` before each number, so
`CLOSES: #1`, `cLoses: #1`, `Closes: bug#1` and `Closes: bug 1` all close #1 (the .changes
`Closes:` field lists them). `find_closed_debian_bugs` uses `[Cc]loses:` and `[#\\d\\s,]+`, and the
`bugs` module (`iter_bug_refs`, `bug_at_offset`) stops at a `bug` prefix, so none of these is
reported.
"""

[[bug]]
id = "debian-changelog/6"
title = "An entry built without an urgency has no `;` in its header and is not a changelog for dpkg"
kind = "correctness"
severity = "medium"
test = "built_entries_without_urgency_are_headers_for_dpkg"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`EntryBuilder::finish` writes the `;` only when there is metadata (the urgency); `verify()` does
not require an urgency. `ChangeLog::new().new_empty_entry().package(..).version(..)
.distribution(..).maintainer(..).datetime(..).change_line(..).finish()` writes
`foo (1.0-1) unstable` and `dpkg-parsechangelog` fails on the result with "found end of file
where expected first heading" (exit 25). The header should read `foo (1.0-1) unstable;`
(dpkg accepts an empty option list) or the builder should default the urgency.
"""

[[bug]]
id = "debian-changelog/7"
title = "`Entry::try_add_change_for_author` on an entry without changes opens an empty section for the maintainer"
kind = "wrong-result"
severity = "low"
test = "adding_for_another_author_to_an_empty_entry_opens_one_section"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Adding `* Fix` for author B to an entry maintained by A that has no change lines yet produces
`[ A ]`, ``, `[ B ]`, `* Fix`: an empty section for A. The sibling function
`changes::try_add_change_for_author` (and `Entry::try_add_changes_for_author`, which uses it)
only opens A's section when there are existing changes to attribute, giving `[ B ]`, `* Fix`.
"""

[[bug]]
id = "debian-changelog/8"
title = "The `bugs` module does not read `Closes: # 123` (a space after the `#`)"
kind = "differential"
severity = "low"
test = "a_space_after_the_hash_is_still_a_bug_reference"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg's regex allows one space between `#` and the number (`\\#?\\s?\\d+`) and the crate's own
`find_closed_debian_bugs` reads `Closes: # 123` as closing #123, but `iter_bug_refs`,
`bug_at_offset` and `bug_ref_spans` strip the `#` and then require the digits to follow
immediately, so the reference is not found (nor highlighted, nor resolvable).
"""

[[bug]]
id = "debian-changelog/9"
title = "`prepend_change_line` inserts after the first blank line of the entry, not before the first change"
kind = "wrong-result"
severity = "medium"
test = "prepend_change_line_puts_the_line_first"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`prepend_change_line` looks for the first EMPTY_LINE after the header and inserts after it. When
the header is directly followed by the change lines (dpkg needs no blank line) the first blank
line is the one *after* the changes, so the "prepended" line lands after them; with two blank
lines after the header it lands between them and `change_lines()` gains a blank line. This shows
through `ensure_first_line`, `take_uploadership` and `Entry::try_add_change_for_author`, which
put the maintainer's `[ Name ]` section title *after* the maintainer's own changes.
"""

[[bug]]
id = "debian-changelog/10"
title = "`add_bullet` / `textwrap::textwrap` produce lines wider than the requested 78 columns"
kind = "contract"
severity = "low"
test = "add_bullet_stays_within_78_columns"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`add_bullet` documents "wraps the text to 78 columns if needed". It uses textwrap's default
optimal-fit algorithm, whose penalties allow a line to overflow the width when the alternative
break is very ragged: `add_bullet("Closes: #1 Closes: #8 <55-letter word>")` gives one 79-column
line although `* Closes: #1 Closes: #8` / `  <word>` fits. Lines of 79-81 columns appear in
generated changelogs; `WrapAlgorithm::FirstFit` (or a higher overflow penalty) would keep the
documented bound.
"""

[[bug]]
id = "debian-changelog/11"
title = "After `set_maintainer` / `set_timestamp` / `set_datetime`, `maintainer()` and `timestamp()` return `None`"
kind = "contract"
severity = "medium"
test = "footer_setters_are_visible_in_memory"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`EntryFooter::set_maintainer` and `set_timestamp` splice a *token* of kind MAINTAINER /
TIMESTAMP in place of the MAINTAINER / TIMESTAMP *node*, while `maintainer()` and `timestamp()`
look for a node (`children().find_map(Maintainer::cast)`). The text is right and a re-parse
reads it back, but on the edited tree `entry.maintainer()`, `entry.timestamp()` and
`entry.datetime()` are `None` (and `is_unreleased()` becomes `Some(true)` for an entry with a
maintainer). `release()` and `take_uploadership()` leave the entry in this state.
"""

[[bug]]
id = "debian-changelog/12"
title = "`set_metadata` adding a second key writes `; a=b c=d` without the comma dpkg needs"
kind = "silent-corruption"
severity = "medium"
test = "set_metadata_separates_options_with_a_comma"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Options after the `;` are separated by commas (`urgency=medium, binary-only=yes`; dpkg splits on
`\\s*,\\s*`). `set_metadata("binary-only", "yes")` on an entry with `; urgency=low` appends
` binary-only=yes` with only a space, giving `; urgency=low binary-only=yes`, which dpkg reads as
a single option `urgency` with the value `low binary-only=yes` — the new key is lost and, when
the existing key is `binary-only`, dpkg drops the urgency and the value `yes urgency=low` is not
a valid binary-only value. The crate's own parser reads the space-separated form back, so the
round trip within the crate hides the divergence.
"""

[[bug]]
id = "debian-changelog/13"
title = "`bug_at_offset` reports the first number of the fragment, not the bug under the cursor"
kind = "wrong-result"
severity = "low"
test = "bug_at_offset_reports_the_bug_under_the_cursor"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.2.24", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`bug_at_offset` splits the text after a marker on commas and, for the fragment containing the
cursor, returns its *leading* number. In `* Fix. Closes: #123 and LP: #456` the fragment after
`Closes:` is `#123 and LP: #456`, so a cursor on `456` yields `Debian(123)` (hover on the
Launchpad number shows the Debian bug); `iter_bug_refs` on the same line correctly yields
`Debian(123)` at 15..18 and `Launchpad(456)` at 28..31. Only the digits of a fragment should
be attributed to it.
"""
