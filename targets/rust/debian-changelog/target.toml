name = "debian-changelog"
language = "rust"
upstream = "https://github.com/jelmer/debian-parsers"
subdir = "debian-changelog"
license = "Apache-2.0"
ai_policy_checked = "2026-09-13"

[base]
commit = "b1568f26a9e519917d0cfc2b7f952ae0c71a6d67"
date = "2026-09-17"
version = "0.2.24"

[hegel]
version = "0.44.1"

[run]
setup = ["dpkg-parsechangelog --version >/dev/null", "/usr/bin/python3 -c 'import debian.changelog' || echo 'python-debian missing: only dpkg-parsechangelog is consulted'"]
command = "cargo test --no-fail-fast"

[expected_failures]
"strict_parser_rejects_headers_dpkg_rejects" = "debian-changelog/1"
"package_names_with_plus_are_parsed" = "debian-changelog/2"
"dates_dpkg_reads_are_read" = "debian-changelog/3"
"closes_lists_agree_with_dpkg" = "debian-changelog/4"
"closes_marker_is_case_insensitive_and_reads_bug_prefixes" = "debian-changelog/5"
"built_entries_without_urgency_are_headers_for_dpkg" = "debian-changelog/6"
"adding_for_another_author_to_an_empty_entry_opens_one_section" = "debian-changelog/7"
"a_space_after_the_hash_is_still_a_bug_reference" = "debian-changelog/8"
"prepend_change_line_puts_the_line_first" = "debian-changelog/9"
"add_bullet_stays_within_78_columns" = "debian-changelog/10"
"footer_setters_are_visible_in_memory" = "debian-changelog/11"
"set_metadata_separates_options_with_a_comma" = "debian-changelog/12"
"bug_at_offset_reports_the_bug_under_the_cursor" = "debian-changelog/13"
