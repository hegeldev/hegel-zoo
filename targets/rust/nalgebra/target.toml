name = "nalgebra"
language = "rust"
upstream = "https://github.com/dimforge/nalgebra"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-07-22"
origin = "DRMacIver/hegel-rust-oss-bug-finding patches/nalgebra.patch"

[base]
commit = "3320ecca21dc08f7a93c9595f6b257f05ba21273"
date = "2026-06-30"
version = "0.35.0"

[hegel]
version = "0.44.1"

[run]
# upstream's trybuild UI test depends on the exact rustc version; not ours to keep green
# tests/linalg/{qr,cholesky}.rs are `#![cfg(feature = "proptest-support")]`: without the feature the
# QR/Cholesky properties (and the QR known-failure pin) never compile; the proptest tests also need
# `arbitrary` (tests/core/helper.rs is gated on it)
command = "cargo test --no-fail-fast --features proptest-support,arbitrary -- --skip stack_trybuild_tests"
setup = []

[expected_failures]
"linalg::svd::hegel_props::svd_reconstruction_known_failure_2x2_cancellation" = "nalgebra/1"
"linalg::lu::hegel_props::lu_reconstruction_known_failure_subnormal_pivot" = "nalgebra/2"
"linalg::qr::hegel_props::qr_reconstruction_known_failure_tiny_negative_pivot" = "nalgebra/3"
