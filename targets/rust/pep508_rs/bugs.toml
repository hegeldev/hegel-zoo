[[bug]]
id = "pep508_rs/1"
title = "String-keyed markers are compared lexicographically even when both sides are valid versions: `platform_release < '6'` is true for release `22.6.0`; PEP 508 says PEP 440 rules apply whenever both sides are valid versions (and `packaging` says false)"
kind = "wrong-result"
severity = "medium"
test = "string_markers_compare_versions_like_pep_440"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PEP 508, "Environment Markers": "The <version_cmp> operators use the PEP 440 version comparison
rules when those are defined (that is when both sides have a valid version specifier). If there
is no defined PEP 440 behaviour and the operator exists in Python, then the operator falls back
to the Python behaviour." `MarkerExpression::String` (`src/marker/tree.rs`) always compares the
two strings, so `platform_release < '6'` with `platform_release = 22.6.0` is `"22.6.0" < "6"` =
true, and `platform_release >= '6.5'` with `6.12.93` is false. `packaging` 26 answers by
version comparison in this case (its `_operators` try the versions first). Ordering operators on
string keys whose sides are *not* both versions are left out of the zoo's differential: there
`packaging` 26 answers `false` where the spec (and the crate) use Python string comparison.
"""

[[bug]]
id = "pep508_rs/2"
title = "An unsatisfiable `MarkerTree` displays as `python_version < '0'` — its own canonical spelling of `false` — but that text parses back to a satisfiable-looking tree (`python_full_version < '0'`, `is_false()` = false, not equal to `MarkerTree::FALSE`)"
kind = "roundtrip"
severity = "low"
test = "false_markers_round_trip_through_display"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`MarkerTreeContents::fmt` writes `python_version < '0'` for `is_false()` trees (`src/marker/
tree.rs`), e.g. for `python_version < '3' and python_version >= '3'`. Parsing that text gives
the tree `python_full_version < '0'`, which the algebra does not recognise as unsatisfiable
(no version is below `0`, but `0.dev0`/`0a0` are — PEP 440 has versions below `0`, so the tree
is technically satisfiable, and the rendering is therefore not a spelling of `false` at all).
`Requirement::to_string()` → `from_str` thus does not round-trip a requirement whose marker
is false (`a ; python_version < '0'` ≠ the original), and serialising such a requirement
(serde uses `Display`) changes its meaning.
"""

[[bug]]
id = "pep508_rs/3"
title = "Arbitrary equality with a non-numeric string is rejected: `a===a` (valid for PEP 440/508 and `packaging`) fails with \"expected version to start with a number\""
kind = "contract"
severity = "medium"
test = "arbitrary_equality_takes_any_string"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PEP 440: "arbitrary equality comparisons are simple string equality operations which do not
take into account any of the semantic information such as zero padding or local versions …
`===foobar`". The version specifier parser used by `Requirement` (`pep440_rs::VersionSpecifier
::from_str`, via `parse_specifier`) parses the operand of `===` as a PEP 440 version, so
`pkg===foobar`, `pkg===1.0-custom` and the like are rejected while `pkg===1.0` is accepted.
The root is in `pep440_rs` (the zoo's `pep440_rs` target did not cover `===` with
non-version operands); it surfaces here as a rejected dependency specifier.
"""

[[bug]]
id = "pep508_rs/4"
title = "`python_version == '3.5.0.*'` is deemed unsatisfiable (the tree is `false`); under PEP 440 `3.5` zero-pads to `3.5.0` and matches, as `packaging` says"
kind = "wrong-result"
severity = "medium"
test = "python_version_matches_three_component_wildcards"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The marker algebra rewrites `python_version` expressions into `python_full_version` ranges
(`src/marker/algebra.rs`). For a wildcard with three release components the rewrite yields an
empty range: `MarkerTree::from_str("python_version == '3.5.0.*'").is_false()` is true and the
marker evaluates to false for every interpreter, where `packaging` (and `Version("3.5") in
Specifier("==3.5.0.*")`) say true for Python 3.5. `!=` is wrong the other way round. Plain
three-component comparisons (`python_version == '3.5.0'`, `>= '3.5.0'`, …) are right.
"""

[[bug]]
id = "pep508_rs/5"
title = "`MarkerTree` is documented as canonical, but the deprecated spellings (`os.name`, `sys.platform`, `platform.version`, `platform.machine`, `platform.python_implementation`, `python_implementation`) make trees unequal to their current spellings — and the crate's own `Display` of such a tree re-parses to a different tree"
kind = "contract"
severity = "low"
test = "deprecated_marker_spellings_are_canonical"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`MarkerValueString` has separate `OsNameDeprecated` etc. variants (`src/marker/tree.rs`); the
interner keys variables on them, so `os.name == 'posix'` and `os_name == 'posix'` are two
nodes although `MarkerEnvironment::get_string` reads the same value for both. `Display` prints
the current spelling (`os_name == 'posix'`) for either, so `MarkerTree::from_str(&tree.to_
string()) != tree` for the deprecated one, and `Requirement` equality/`Hash` distinguish
`a; os.name == 'posix'` from `a; os_name == 'posix'`. `packaging` normalises the spelling.
"""

[[bug]]
id = "pep508_rs/6"
title = "`python_version ~= '3.5.0'` loses its last component: the tree is `python_full_version >= '3.5' and < '4'`, true for Python 3.6; PEP 440 reads `~=3.5.0` as `>= 3.5.0, == 3.5.*` (false for 3.6, as `packaging` says)"
kind = "wrong-result"
severity = "medium"
test = "tilde_equal_on_python_version_keeps_its_last_component"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The `python_version` → `python_full_version` rewrite (`src/marker/algebra.rs`) treats the
compatible-release operator as if the operand had two components: `~=3.5.0` becomes the range
`[3.5, 4)` instead of `[3.5.0, 3.6)`. Two-component operands (`~=3.5`) are right, and
`python_full_version ~= '3.5.0'` is right too. Any `python_version ~= 'X.Y.Z'` marker
(uncommon but valid) therefore admits every `X.*` interpreter at or above `X.Y`.
"""

[[bug]]
id = "pep508_rs/7"
title = "`Requirement::from_str(\"a[b.]\")` panics: an extra ending in `-`, `_` or `.` passes the extras parser and then fails the `expect` on `ExtraName::new`"
kind = "panic"
severity = "medium"
test = "extras_ending_in_a_separator_are_an_error_not_a_panic"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_extras_cursor` (`src/lib.rs`) accepts an extra as a letter/digit followed by any run of
`[-_.A-Za-z0-9]`, then builds the name with `ExtraName::new(buffer).expect("`ExtraName`
validation should match PEP 508 parsing")`. PEP 508's `identifier_end = letterOrDigit | (('-' |
'_' | '.')* letterOrDigit)` requires the last character to be alphanumeric, which is what
`ExtraName::new` enforces — so `a[b.]`, `a[b-]`, `a[b_]`, `a[x, y-]` reach the `expect` with an
invalid name and the parser panics instead of returning `Err`. Found by the syntax-mutation
property (`aaa[  aa.,a]`); `packaging` raises `InvalidRequirement`. A dependency string from a
user's `pyproject.toml` can therefore crash the parser.
"""

[[bug]]
id = "pep508_rs/8"
title = "`python_version` markers are wrong on pre-release interpreters: `python_version == '3.13'` is false and `python_version < '3.13'` true when `python_full_version` is `3.13.0rc1` — the expression is lowered to a release-only `python_full_version` range and tested against the environment's real pre-release value"
kind = "wrong-result"
severity = "high"
test = "python_version_markers_hold_on_pre_release_interpreters"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
PEP 508 defines `python_version` as `'.'.join(platform.python_version_tuple()[:2])` — `3.13` on
Python 3.13.0rc1 — and `python_version == '3.13'` compares `3.13` with `3.13` under PEP 440:
true. `normalize_specifier` (`src/marker/algebra.rs`) strips pre-release segments from marker
literals ("we ignore pre-release versions entirely when evaluating markers … `python_version`
cannot take on pre-release values"), and `python_version` expressions are lowered to
`python_full_version` ranges: `== '3.13'` becomes `python_full_version == '3.13.*'`, i.e. the
range `[3.13, 3.14)`. `MarkerTree::evaluate` then tests the environment's `python_full_version`
*with* its pre-release segment: `3.13.0rc1 < 3.13`, so the marker is false, `python_version <
'3.13'`, `<= '3.12'` and `!= '3.13'` are true, `>= '3.13'` false. Every pre-release interpreter
is treated as the previous minor: `foo; python_version >= '3.13'` is skipped and `bar;
python_version < '3.13'` installed on 3.13.0rc1. The same mismatch makes `python_full_version <
'3.13'` true and `python_full_version == '3.13.*'` false on 3.13.0rc1 (`packaging` says the
opposite for both). Dropping the pre-release segment from *literals* (`python_full_version ==
'3.13.0rc1'` → `== '3.13'`) is the documented deviation and is not counted here; the
environment's value would have to be normalised the same way for the model to be consistent.
"""

[[bug]]
id = "pep508_rs/9"
title = "`MarkerTree` is not canonical: `X and ((X and A) or B)` over one string key leaves adjacent edges with the same child unmerged, so the tree differs from the one its own `Display` parses to although the two are equivalent"
kind = "contract"
severity = "medium"
test = "marker_trees_are_canonical"
found = { commit = "b50980ec1095246c928bfe7c884d8f3613d5ab60", version = "0.9.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`MarkerTree`'s doc: "Marker trees are canonical, meaning any two functionally equivalent markers
will compare equally" (`src/marker/tree.rs`); `PartialEq`/`Hash` are on the interned node id.
For `platform_machine == 'x' and ((platform_machine == 'x' and os_name != 'lin') or os_name ==
'linux')` the root `os_name` node has five edges — `(-∞, lin)`, `[lin]`, `(lin, linux)`,
`[linux]`, `(linux, ∞)` — the last three pointing at the same child (the `platform_machine ==
'x'` node), where the tree parsed from its own `Display` (`os_name != 'lin' and platform_machine
== 'x'`) has three: the conjunction restricts the disjunction's `os_name` node edge by edge and
the interner never merges adjacent equal-child ranges, so a different node is created for the
same function. The two trees are equivalent (`a.and(b.negate()).is_false()` both ways, same
`evaluate`, same `Display`) yet `!=` and hash differently; `Requirement` equality inherits this.
Same with `extra == 'a'` for `X`; with `python_full_version < '3.5'` the crate is canonical (its
variable order puts versions first), unlike uv's fork (uv-pep508/6). Found in the fork first,
by the marker round-trip property once three-component wildcards were generated; the shape is
reachable here too, and the zoo's round-trip properties now compare re-parsed markers by
equivalence with the equality pinned here.
"""
