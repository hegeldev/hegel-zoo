# Bugs found in rust-ini (the `ini` crate) by the zoo's Hegel tests (tests/hegel.rs in
# hegel.patch). Oracles: the crate's own writer against its own reader (what `write_to*` emits
# must read back through `load_from_str*`), Python's configparser on the common grammar, and
# the crate's rustdoc.

[[bug]]
id = "rust-ini/1"
title = "form feed and vertical tab are escaped as `\\f` and `\\v` but read back as the letters `f` and `v`"
kind = "wrong-result"
severity = "medium"
test = "form_feed_and_vertical_tab_read_back"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`escape_str_multiline` writes U+000C as `\\f` and U+000B as `\\v` under every policy but
`Nothing` (they are control characters, so `Basics` — the default — escapes them).  The reader's
escape table in `parse_str_until` knows `0 a b t r n x` and falls through to `c => push(c)` for
anything else, so `\\f` decodes to `f` and `\\v` to `v`: `set("k", "a\\x0cb")`, `write_to`,
`load_from_str` gives `"afb"`.  Either the writer should use `\\x000c`/`\\x000b` (its own
fallback for the other control characters) or the reader should learn the two escapes.
"""

[[bug]]
id = "rust-ini/2"
title = "characters above U+FFFF are written as `\\x` plus five or six hex digits under the `*Extended`/`Everything` policies; the reader takes exactly four"
kind = "wrong-result"
severity = "medium"
test = "astral_characters_read_back_under_extended_policies"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`escape_str_multiline` writes U+10000..U+FFFFF as `\\x{:05x}` and U+100000..U+10FFFF as
`\\x{:06x}` (the crate's own unit test asserts `\\x1f431\\x1f609` for two emoji); the reader's
`'x'` arm reads exactly four hex digits.  `set("k", "🐱")` written with
`EscapePolicy::BasicsUnicodeExtended` (or `ReservedUnicodeExtended`, `Everything`) is
`k=\\x1f431`, which reads back as U+1F43 followed by the digit `1` (`"ὃ1"`); `\\u{100000}` comes
back as `"က00"`.  The three policies whose one purpose is to escape these characters cannot
round-trip them.  A longer form the reader accepts (`\\U{:08x}`, or braces) is needed.
"""

[[bug]]
id = "rust-ini/3"
title = "no escape policy escapes a quote, so a value starting with `\"` or `'` is written bare and misread (or rejected) by the crate's own reader"
kind = "contract"
severity = "medium"
test = "values_starting_with_a_quote_read_back"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`EscapePolicy::should_escape` never returns true for `"` or `'` — not even for `Everything`
("Escape everything that some INI implementations assume") — while the reader's default
`enabled_quote: true` treats a quote at the start of a value as a quoted string.  So with the
defaults on both sides, `set("k", "\\"x")` + `write_to` gives `k="x`, which `load_from_str`
rejects (`expecting "[Some('"')]" but found EOF`); `"'a' b"` reads back as `a b`.  The file the
crate writes is not readable by the crate.  The same shape applies to `]` in section names and
`[` at the start of a key, which no policy escapes either (`[a]b]` becomes a section `a` and a
key `b]…`).  Either a policy must escape a leading quote (`\\"` is decoded by the reader's
fallback arm), or the writer should quote such values.
"""

[[bug]]
id = "rust-ini/4"
title = "with `enabled_indented_multiline_value`, a CRLF file gets an extra line feed for every continuation line"
kind = "wrong-result"
severity = "medium"
test = "crlf_and_lf_parse_alike_with_multiline_values"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In `parse_val`'s multiline loop the first value line ends at `\\r`, the bump after it consumes
the `\\r`, and the loop then sees the `\\n` and takes the `Some('\\n')` arm — "new-line, just
push" — pushing a line feed, before the indented continuation line pushes another one.
`[s]\\r\\nk=a\\r\\n\\tb\\r\\n` parses to `"a\\n\\nb"` where the LF file gives `"a\\nb"` (Python's
configparser: `a\\nb` for both).  Every continuation line in a Windows-line-ending file gains
a blank line; the `Some('\\r')` arm below it, which handles `\\r\\n` as one break, is never
reached for the first line because the value scanner already stopped on the `\\r`.
"""

[[bug]]
id = "rust-ini/5"
title = "a line without a delimiter (or text after a header's `]`) is glued, line feed included, onto the next line's key"
kind = "wrong-result"
severity = "low"
test = "lines_without_a_delimiter_do_not_swallow_the_next_line"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_key` is `parse_str_until(&['=', ':'])` with no line break among the terminators, so a
key runs across lines until a delimiter appears: `[s]\\nfoo\\nbar=1\\n` gives the single key
`"foo\\nbar"` with value `1` (Python's configparser: `ParsingError`), `[s] junk\\nk=1` gives
key `"junk\\nk"`, and `[a]b]\\nk=1` gives section `a` with key `"b]\\nk"`.  The next line's
own key is lost and the malformed line is neither reported nor ignored.  A line break should
end the key (and then be an error, or a valueless key, as the crate prefers).
"""

[[bug]]
id = "rust-ini/6"
title = "`enabled_escape: false` still treats a backslash before a line break as a continuation and a backslash before a delimiter as an escape"
kind = "contract"
severity = "low"
test = "escape_disabled_leaves_backslashes_alone"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`ParseOption::enabled_escape` is documented as "Interpret `\\` as an escape character", with
`load_from_str_noescape` for files that use backslashes literally (`C:\\Windows`).  In
`parse_str_until` the `'\\\\'` arm runs before the option is consulted: it always consumes the
character after the backslash, so with escapes disabled `k=a\\\\\\nj=1` (a value ending in a
backslash) yields `k = "aj=1"` and no key `j` (Python's configparser: `a\\` and `j = 1`), a
Windows path `C:\\dir\\` loses its trailing backslash, and a key `a\\=b=v` is `a\\=b` rather
than `a\\` (the `=` after the backslash does not terminate the key).  With the option off the
backslash should be an ordinary character.
"""

[[bug]]
id = "rust-ini/7"
title = "`WriteOption::indent_multiline_value` indents the line feeds of section names and keys too, and the reader does not undo it"
kind = "contract"
severity = "low"
test = "indented_multiline_writer_keeps_keys_and_sections"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`write_to_opt` calls `escape_str_multiline(…, opt.indent_multiline_value)` for the section
name and the key as well as the value, so a line feed in a name is written raw followed by a
tab: a section `a\\nb` becomes `[a\\n\\tb]` and reads back (with
`enabled_indented_multiline_value`) as the section `"a\\n\\tb"`; a key `k\\nj` becomes
`k\\n\\tj=v`, read as key `"k\\n\\tj"`.  Without the option both are escaped as `\\n` and round
trip.  The option is documented for values ("Span multiline values across lines") and should
leave names to the escape policy.
"""

[[bug]]
id = "rust-ini/8"
title = "`Properties::remove`, `SectionSetter::delete` and `Ini::delete` are documented as removing the first value / entry / section with the name; they remove all of them"
kind = "contract"
severity = "low"
test = "remove_and_delete_take_only_the_first_entry"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The crate is a multimap (`append` keeps several values per key, a repeated `[s]` header keeps
several sections per name) and documents `Properties::remove` as "Remove the property with the
first value of the key", `SectionSetter::delete` as "Delete the first entry in this section with
`key`" and `Ini::delete` as "Delete the first section with key, return the properties if it
exists".  All three call `ListOrderedMultimap::remove`, which removes every value of the key
and returns the first: after `append("k","1"); append("k","2")`, `remove("k")` returns `"1"`
and leaves no `k`; `Ini::delete(Some("s"))` on two `[s]` sections returns the first and removes
both.  `remove_all` exists beside `remove`, so the documented distinction is intended; either
the docs or the calls should change.
"""

[[bug]]
id = "rust-ini/9"
title = "an indented comment line directly after another comment line (or, with CRLF, after a whitespace-only line) is rejected: \"doesn't support inline comment\""
kind = "wrong-result"
severity = "medium"
test = "indented_comment_lines_are_comments"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse` handles an indented comment in its `' ' | '\\t'` arm (added upstream so that "an
indented comment is still a whole-line comment").  But after `parse_comment` consumes a comment
line through its `\\n`, the loop's `parse_whitespace_preserve_line_leading` starts on the next
line's first character, and its `' ' | '\\t'` arm consumes that indentation (the function only
preserves indentation it sees after a `\\n` it consumed itself).  The `;` is then at `col > 1`
and, without the `inline-comment` feature, is an error.  `[s]\\n ;a\\n ;b\\n`, `;a\\n ;b\\n` and
`k=v\\n ;c\\n ;d\\n` are all rejected with `doesn't support inline comment` at column 3; with
CRLF endings a whitespace-only line has the same effect (`[s]\\r\\n \\r\\n ;c\\r\\n`) because the
`' '` arm consumes only the `\\r` and the `\\n` arm's whitespace skip eats the next indent.
Python's configparser accepts all of these as comments.  Two consecutive indented comment
lines is an ordinary shape for a hand-written ini file.
"""

[[bug]]
id = "rust-ini/10"
title = "the reader trims a value after unescaping it, so escaped whitespace at either end (`\\t`, `\\r`, `\\n`, `\\x0020`) is written faithfully and lost on reading"
kind = "wrong-result"
severity = "medium"
test = "escaped_whitespace_at_value_ends_reads_back"
found = { commit = "a0aa25c2c4626611113c56d31e20874f6f854644", version = "0.21.3", hegel = "0.44.1", date = "2026-08-27" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_val` decodes escapes while scanning the line (`parse_str_until_eol`) and then trims the
decoded string (`standard_val.trim()` — Unicode whitespace, so `\\t`, `\\r`, `\\n`, U+00A0,
U+2003 all go).  A value `"\\ta"` is written by every policy but `Nothing` as `k=\\ta` and reads
back as `"a"`; `"a\\r"` written `a\\r` reads back `"a"`; `\\x0020a` reads `"a"`; in
`indent_multiline_value` mode each line is trimmed, so `"a\\r\\nb"` written `a\\r` + newline +
tab + `b` reads `"a\\nb"`.  Escaping is the crate's only way to represent such a value and it
does not survive its own reader.  Trimming should happen on the raw text before escapes are
decoded (as Python's configparser does, by stripping the line first).
"""
