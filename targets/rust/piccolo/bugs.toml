[[bug]]
id = "piccolo/3"
title = "Mixed int/float comparison rounds through `as f64` (wrong result): Constant::less_than/less_equal/is_equal cast the integer with as f64, which rounds for |i| >= 2^53, but Lua 5.4 §3.4.4 requires exact comparison — math.maxinteger < 2.0^63 is false (must be true), math.maxinteger == 2.0^63 is true (must be false)"
kind = "contract"
severity = "medium"
test = "hegel_props::known_bug_int_float_comparison_precision"
