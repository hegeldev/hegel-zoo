[[bug]]
id = "human-repr/1"
title = "Negative durations from one minute up print as `-1:-1`, `-2:-5.8`, `-1666:-40`: the `M:SS`/`H:MM:SS` code has no sign handling"
kind = "wrong-result"
severity = "medium"
test = "negative_durations_mirror_positive_ones"
found = { commit = "2e8f8314fce23afa61f41d7b18f94ff5051ec573", version = "1.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Below a minute the sign rides along with the number (`(-1).human_duration()` is `-1s`, pinned
upstream; `-59.5s`). From 60 s the minutes code computes `m = val / 60.` and `s = val % 60.` on
the signed value and prints them separately, so `(-61).human_duration()` is `"-1:-1"` (should be
`-1:01`), `-60` is `"-1:-0"` (Hegel's shrunk case), `-68.09` is `"-1:-8.1"`, `-125.825` is
`"-2:-5.8"`. The hours branch is never reached
for a negative because its guard is `m < 60.`, which every negative satisfies: `-3661` is
`"-61:-1"` (should be `-1:01:01`) and `-100000` is `"-1666:-40"` (`-27:46:40`). The README
promises the forms `M:SS[.s]` from a minute and `H:MM:SS` from an hour; the crate's own tests
show negatives are supported (`-1s`, `-30B/min`). The property `negative_durations_mirror_positive_ones`
(`(-x)` prints as `-` + text of `x`) holds for counts and throughputs and for durations under a
minute. Medium: a time difference that went the wrong way is a normal input, and the output is
not a duration at all.
"""

[[bug]]
id = "human-repr/2"
title = "`H:MM:SS` truncates the seconds after rounding to a tenth: `3600.9` → `1:00:00`, `3659.94` → `1:00:59`, `3659.95` → `1:01:00`"
kind = "wrong-result"
severity = "low"
test = "hours_form_rounds_to_the_second"
found = { commit = "2e8f8314fce23afa61f41d7b18f94ff5051ec573", version = "1.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Every other form rounds to its last printed digit (README: "I round values to at most two
decimal places … The search for the best prefix considers even the rounding"), and the minutes
form rounds the seconds to a tenth. The hours branch reuses the value rounded to a tenth and
prints `s.trunc()`, so the shown second is the floor of the tenth-rounded value: `3600.9 s` is
`"1:00:00"` (1:00:01 by rounding), `3659.94` is `"1:00:59"` while `3659.95` jumps to
`"1:01:00"` — the effective rounding point is .95 instead of .5, and the shown time is up to
0.95 s below the value. Low: a sub-second slip in a display of hours, but inconsistent with the
minutes form one tenth of a second earlier (`59:59.9` → `1:00:00`).
"""

[[bug]]
id = "human-repr/3"
title = "Values that round to zero keep a minus sign: `-0B`, `-0ns`, `-0B/d`"
kind = "wrong-result"
severity = "low"
test = "values_rounding_to_zero_have_no_sign"
found = { commit = "2e8f8314fce23afa61f41d7b18f94ff5051ec573", version = "1.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`utils::rounded` returns `-0.0` for a small negative (`(-0.4f64).round()` is `-0.0`), the
`r.fract() == 0.` branch prints it with `{:.0}`, and Rust prints the negative zero with its sign:
`(-0.04).human_count_bytes()` is `"-0B"`, `(-0.0).human_count_bytes()` `"-0B"`,
`(-0.00000000004).human_duration()` `"-0ns"`, `(-0.00000001).human_throughput_bytes()`
`"-0B/d"`. The positive side prints `0B`, `0ns`, `0B/d`. Low: a cosmetic `-0` on values that
are shown as zero, but it is exactly the kind of output the README's "clearness" principle
rules out.
"""

[[bug]]
id = "human-repr/4"
title = "Infinite durations print `inf:NaN:NaN` and `-inf:0NaN`; any |duration| above 1.8e299 s overflows to the same"
kind = "contract"
severity = "low"
test = "non_finite_durations_are_not_clock_times"
found = { commit = "2e8f8314fce23afa61f41d7b18f94ff5051ec573", version = "1.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The duration formatter multiplies by 1e9 and walks the prefix table with `r.abs() >= size`;
an infinite value passes every level and reaches the hours code, where `inf % 60.` is NaN:
`f64::INFINITY.human_duration()` is `"inf:NaN:NaN"`, `f64::NEG_INFINITY` is `"-inf:0NaN"`
(the `m < 60.` guard sends it to the minutes form with `{:02}` of NaN), and `1e300.human_duration()`
is `"inf:NaN:NaN"` too because `1e300 * 1e9` overflows. `f64::NAN` gives `"NaNns"`. The README
says the traits "work with any Rust primitive numbers"; the count and throughput formatters
degrade legibly (`NaNB`, `inf+B`, `NaNB/d`), the duration one prints a broken clock. Low: only
from `f64`/`f32` inputs (a `std::time::Duration` is always finite and below 1.8e19 s).
"""
