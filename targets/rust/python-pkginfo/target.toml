name = "python-pkginfo"
language = "rust"
upstream = "https://github.com/PyO3/python-pkginfo-rs"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-14"

[base]
commit = "58fb0747c24906c9a2df7d318c003dea511ac869"
date = "2026-02-24"
version = "0.6.8"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.metadata, pkginfo, packaging; assert packaging.version.parse(packaging.__version__) >= packaging.version.parse(\"24.1\")' 2>/dev/null && exit 0; done; python3 -m pip install --user --break-system-packages --upgrade packaging pkginfo || /usr/bin/python3 -m pip install --user --break-system-packages --upgrade packaging pkginfo"]
command = "cargo test --no-fail-fast --features serde"

[expected_failures]
"sdist_tars_read_the_top_level_pkg_info" = "python-pkginfo/1"
"sdist_zips_prefer_the_top_level_pkg_info_over_egg_info" = "python-pkginfo/2"
"wheel_build_tags_do_not_hide_the_python_tag" = "python-pkginfo/3"
"header_values_do_not_keep_the_tab_after_the_colon" = "python-pkginfo/4"
"description_header_continuation_lines_are_dedented" = "python-pkginfo/5"
"folded_headers_unfold_alike_in_single_and_multi_use_fields" = "python-pkginfo/6"
