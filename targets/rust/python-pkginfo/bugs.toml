[[bug]]
id = "python-pkginfo/1"
title = "A `.tar.gz` sdist yields the metadata of whichever `PKG-INFO` the archive lists first, at any depth: a vendored package's `PKG-INFO` (or the `.egg-info` copy) ahead of `<name>-<version>/PKG-INFO` is returned as the distribution's metadata; Python `pkginfo` reads the shallowest"
kind = "wrong-result"
severity = "medium"
test = "sdist_tars_read_the_top_level_pkg_info"
found = { commit = "58fb0747c24906c9a2df7d318c003dea511ac869", version = "0.6.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Distribution::parse_tar` (`src/distribution.rs`) walks the entries and takes the first whose
path `ends_with("PKG-INFO")`, regardless of depth. Real sdists carry two: `pkg-1.0/PKG-INFO`
and `pkg-1.0/pkg.egg-info/PKG-INFO` (setuptools), plus any vendored packages' own; tar order
is creation order, not depth order, and the `.egg-info` copy can be stale or differ. Python
`pkginfo`'s `SDist.read` sorts the candidates by path depth and reads the shallowest that
contains `Metadata-Version`. The sdist format puts the metadata at `<name>-<version>/PKG-INFO`
(the "source distribution format" specification), so the top-level file is the right one.
"""

[[bug]]
id = "python-pkginfo/2"
title = "A `.zip` sdist with the top-level `PKG-INFO` and an `.egg-info/PKG-INFO` copy reads whichever the archive lists first: the two-file rule in `parse_zip` picks `file1` without checking which of the two is the `.egg-info` one"
kind = "wrong-result"
severity = "low"
test = "sdist_zips_prefer_the_top_level_pkg_info_over_egg_info"
found = { commit = "58fb0747c24906c9a2df7d318c003dea511ac869", version = "0.6.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Distribution::parse_zip` (`src/distribution.rs`): `[file1, file2] if file1.ends_with(".egg-
info/PKG-INFO") || file2.ends_with(".egg-info/PKG-INFO") => read file1`. The arm exists to
prefer the real `PKG-INFO` over the `.egg-info` copy but reads `file1` whichever it is, so a
zip whose central directory lists `pkg-1.0/pkg.egg-info/PKG-INFO` before `pkg-1.0/PKG-INFO`
returns the copy. Python `pkginfo` reads the shallowest candidate. (The three-or-more case
below it does filter by depth — the two-file case should too.)
"""

[[bug]]
id = "python-pkginfo/3"
title = "`python_version()` of a wheel whose filename carries a build tag (`name-1.0-1-py3-none-any.whl`) is `any`: the tag split expects exactly five dash-separated parts"
kind = "wrong-result"
severity = "low"
test = "wheel_build_tags_do_not_hide_the_python_tag"
found = { commit = "58fb0747c24906c9a2df7d318c003dea511ac869", version = "0.6.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Distribution::new` (`src/distribution.rs`) splits the wheel file stem on `-` and matches
`[_name, _version, py_ver, _abi_tag, _plat_tag]`, falling back to `"any"` otherwise. The binary
distribution format names wheels `{distribution}-{version}(-{build tag})?-{python tag}-{abi
tag}-{platform tag}.whl`, so a wheel with a build tag has six parts and the Python tag is the
fourth; the crate reports `any` for it (and the same fall-back hides any other unexpected
shape). The tags are the last three parts whatever the count.
"""

[[bug]]
id = "python-pkginfo/4"
title = "A tab between the colon and a header value is kept in the value (`Author:\ty` → `\ty`), for every field except `Metadata-Version`, `Name` and `Version`; `email.parser` and Python `pkginfo` strip it"
kind = "wrong-result"
severity = "low"
test = "header_values_do_not_keep_the_tab_after_the_colon"
found = { commit = "58fb0747c24906c9a2df7d318c003dea511ac869", version = "0.6.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Metadata::parse` (`src/metadata.rs`) reads most fields through `header.get_value_raw()` (the
raw bytes, which mailparse trims of spaces but not of tabs) followed by `rfc2047_decoder`,
while `Metadata-Version`/`Name`/`Version` use `get_first_value()`, which trims both. RFC 5322
folding white space is `WSP = SP / HTAB`, so `Author:\tJane` names `Jane`; Python's
`email.parser` (the reference reader per the core metadata specification: "the practical
standard is what the email.parser module can parse") and `pkginfo` both give `Jane`.
"""

[[bug]]
id = "python-pkginfo/5"
title = "The legacy header form of `Description` keeps its eight-space continuation indent: `Description: line1\n        line2` is returned verbatim, where Python `pkginfo` returns `line1\nline2`"
kind = "wrong-result"
severity = "low"
test = "description_header_continuation_lines_are_dedented"
found = { commit = "58fb0747c24906c9a2df7d318c003dea511ac869", version = "0.6.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
distutils' `rfc822_escape` wrote multi-line descriptions into the `Description` header with
every continuation line indented by eight spaces, and readers strip that indent — Python
`pkginfo`'s `_collapse_leading_ws` removes eight leading spaces from each continuation line
of `Description` (and only there). The core metadata specification's own continuation form
(each line prefixed by seven spaces and `|`, which readers "MUST replace by a single CRLF")
is not handled either. `Metadata::parse` returns the header value raw, so `description` of any
pre-2.1 PKG-INFO with a multi-line header description contains the indentation (the body form
is read correctly).
"""

[[bug]]
id = "python-pkginfo/6"
title = "Folded header values are unfolded in the multi-use fields but not in the single-use ones: `Classifier: a\n  b` gives `a b`, `Summary: a\n  b` gives `a\n  b`"
kind = "contract"
severity = "low"
test = "folded_headers_unfold_alike_in_single_and_multi_use_fields"
found = { commit = "58fb0747c24906c9a2df7d318c003dea511ac869", version = "0.6.8", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Metadata::parse` (`src/metadata.rs`) has two paths: multi-use fields go through mailparse's
`get_all_values()`, which unfolds continuation lines into a single space, single-use fields
through `get_value_raw()` + `rfc2047_decoder::decode`, which keeps the newline and the
indentation. The same folded value therefore parses differently depending on the field it is
in. Python `pkginfo` unfolds every field but `Description` (`' '.join(x.strip() for x in
txt.splitlines())`); `packaging` keeps both raw. Either way one crate should choose one.
"""
