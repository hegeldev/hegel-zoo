[[bug]]
id = "rustybuzz/3"
title = "Face::from_slice panics on a font whose cmap format 12/13/14 subtable declares a 32-bit count whose byte size exceeds u32::MAX: ttf-parser's Stream::read_bytes asserts offset + len <= u32::MAX (parser.rs:770) before its bounds check, so a malformed count reached through read_array32 panics in debug builds instead of returning None"
kind = "panic"
severity = "low"
test = "properties::known_failure_cmap_count_above_u32_max_bytes_panics"
found = { commit = "9faca967408677", version = "0.20.1", hegel = "0.44.1", date = "2026-10-05" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Zycon.ttf (tests/fonts/text-rendering-tests) with byte 580 set to 22 - the high byte of numGroups
of its (3,10) cmap format-12 subtable, making numGroups = 369098770, 12 * numGroups > u32::MAX -
panics inside rustybuzz::Face::from_slice (from_face -> find_best_cmap_subtable parses every
subtable): `assertion failed: self.offset as u64 + len as u64 <= u32::MAX as u64` at
ttf-parser-0.25.1/src/parser.rs:770. The debug_assert in Stream::read_bytes is meant to catch caller
bugs on 32-bit targets but fires on 64-bit for any malformed 32-bit count (read_array32 computes
count * T::SIZE); the bounds check that follows, `self.data.get(self.offset..self.offset + len)?`,
would have returned None. Release builds reject the font cleanly; debug builds panic, and ttf-parser's
README says the library must not panic. Minimal reproducer with no font:
ttf_parser::cmap::Subtable12::parse(&[0,12, 0,0, 0,0,0,16, 0,0,0,0, 0x16,0,0,0]) (format 12,
numGroups 0x16000000) panics instead of returning None. The format-14 site too (TestCMAP14.otf,
numVarSelectorRecords at bytes 958..962 set to 0x18000000; NotoSansCJK.subset1.otf at byte 598), and
gsub4_1/gpos2_1 (format 12 at 4524/4556). Root cause in ttf-parser, like rustybuzz/2 (ttf-parser/2);
other read_array32 sites (GPOS PairPos matrices, morx, kerx, COLR) can reach the same assertion
during shaping. Found by the weekly run's 1000-case budget on
shaping_with_mutated_fonts_never_panics (one mutated byte); about one case in a few thousand.
"""
