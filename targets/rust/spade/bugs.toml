[[bug]]
id = "spade/3"
title = "bulk_load builds a self-overlapping triangulation (non-convex outer face, a vertex strictly inside a face) for point sets whose far points lie on one pseudo-angle ray from the seed triangle: the circle sweep's Hull::get(angle) returns the neighbouring hull edge for a far vertex whose own hull edge spans no angle, and single_bulk_insertion_step attaches a triangle that swallows a hull vertex; fix_convexity cannot see it (src/delaunay_core/bulk_load.rs)"
kind = "wrong-result"
severity = "medium"
test = "delaunay_core::triangulation_ext::test::known_bug_bulk_load_overlapping_triangles_for_far_points_on_a_hull_ray"
found = { commit = "c8befc96bbbc", version = "2.15.1", hegel = "0.44.1", date = "2026-10-05" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Found by the weekly run's 1000-case budget on hegel_insertion_order_invariance (bulk_load vs
incremental insertion of the same points), which hit the library's own sanity_check convexity
assertion (triangulation_ext.rs:881). The shrunk set: three copies of (0,0), (0,1), (1,0), (-1,0),
(2^-142, 2^-142), (2^-142, 0), (1, -2^142), (4, -(2^144 - 2^91)). bulk_load returns an outer face
(0,0), (4,-2^144+2^91), (-1,0), (0,1), (1,0), (1,-2^142) that is not convex by robust::orient2d
(determinants 4, 5.6e42, 2.2e43 - not rounding noise), 15 edges / 8 faces, with (1,-2^142) strictly
inside the face (0,0),(-1,0),(4,...); incremental insertion gives the right hull (0,1),(1,0),(4,...),
(-1,0), 17 edges / 10 faces, and passes sanity_check. Cause: the mean of the points rounds to
(0.5, -2^141), nine near points and (1,-2^142) tie in squared distance, the x-then-y tie-break seeds
the triangle on the two 2^-142 points and (0,1), and from its centroid (1.2e-43, 1/3) the points
(0,0), (1,-2^142) and (4,...) all get pseudo_angle exactly 0.75 (a plain f64 ratio): the hull edge
(1,-2^142)->(0,0) spans no angle, Hull::get(0.75) returns the neighbouring edge (0,0)->(-1,0) for
the last far vertex, which lies on its left, and single_bulk_insertion_step attaches a triangle
over the hull vertex (1,-2^142). The family n = 2(c+1) points (2c-5 origins, (0,k), one grid point
with x >= 1, one with x <= -1 and y >= 0, two tiny points, far points (1,-S) and (a,-cS) with a >= c)
fails for every S in 2^142..2^199 and about half the time for S down to 2^60; with a < c never.
Removing any one of the ten points, or mirroring or rotating the set, changes the tie-break and the
set passes. Reached by the wide property about once in several thousand cases.
"""
