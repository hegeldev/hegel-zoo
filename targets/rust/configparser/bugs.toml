# Bugs found in configparser by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# Python's configparser (a child process, configured to the crate's defaults) is the oracle on
# the common grammar; the crate's own rustdoc is the model for the write/read round trip
# ("always safe since the configuration is validated during parsing") and the map API.

[[bug]]
id = "configparser/1"
title = "the default section name is not casefolded: with `set_default_section(\"Top\")` the sectionless keys are stored under `Top`, unreachable to `get`, and a `[Top]` header makes a second section `top`"
kind = "wrong-result"
severity = "medium"
test = "default_section_name_is_casefolded_like_headers"
found = { commit = "7ceae18e750bd482d2b33b168405b286697d67fe", version = "3.3.0", hegel = "0.44.1", date = "2026-09-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse` starts with `section = self.default_section.clone()` and never casefolds it, while every
header goes through `casefold` (lowercase unless `new_cs`) and so does every `get`/`set` argument.
With `set_default_section("Top")` and the input `k=v\\n[Top]\\nx=y`, the map is
`{"Top": {"k": "v"}, "top": {"x": "y"}}`: `get("Top", "k")` and `get("top", "k")` are both `None`
(the lookup casefolds to `top`), `sections()` lists two sections where the documentation ("a
section named default is also treated as sectionless") promises one, and `cascade_defaults`
falls back through `self.map.get(&self.default_section)` — the raw name — so it finds the
sectionless keys but not the ones under the header.  `writes()` then emits `k=v\\n[top]\\nx=y`,
which re-reads into the same split.  Any mixed-case default section name (the rustdoc example
uses `topsecret`, which happens to be lowercase) loses its keys to `get`; the fix is to casefold
the default section name where the map is keyed (parse, `unparse`, cascade) as headers are.
"""

[[bug]]
id = "configparser/2"
title = "a line that is only an inline comment (inline symbols distinct from the line-comment symbols) becomes a key named `\"\"`"
kind = "wrong-result"
severity = "low"
test = "inline_comment_only_line_is_a_comment"
found = { commit = "7ceae18e750bd482d2b33b168405b286697d67fe", version = "3.3.0", hegel = "0.44.1", date = "2026-09-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse` skips lines that start with a *line* comment symbol, then strips the text from the first
*inline* comment symbol.  When `set_inline_comment_symbols(Some(&['!']))` makes the two sets
differ, the line `! only a comment` survives the first check, is stripped to the empty string by
the second, and falls through to the key/value split with no delimiter — an entry `"" => None`
is inserted (`{"s": {"k": "v", "": None}}`).  The parser refuses an empty key everywhere else
("line N: Key cannot be empty"), `get(section, "")` answers `None` like a missing key, and
`writes()` renders the entry as an empty line, so the written file re-reads without it.  A
`trimmed.is_empty()` check after stripping (treat it as a comment line) is the fix.
"""

[[bug]]
id = "configparser/3"
title = "`writes()` is not re-readable for values set with `set`: a value line starting with `[` or a comment symbol, padding, a trailing newline, a key containing a delimiter"
kind = "contract"
severity = "low"
test = "set_values_write_and_read_back"
found = { commit = "7ceae18e750bd482d2b33b168405b286697d67fe", version = "3.3.0", hegel = "0.44.1", date = "2026-09-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`writes`/`pretty_writes` are documented as "always safe since the configuration is validated
during parsing", but `set`/`setstr` accept any string and `unparse` writes it verbatim.  With
multiline on, `set("s", "k", Some("a\\n[b]"))` is written as `k=a\\n    [b]` and reads back as a
section `b` (the crate ends a value at a header; Python's configparser, which indents
continuation lines the same way, reads them first and so round-trips); `"a\\n;c"` loses the
second line to a comment; `" v"`, `"v "` and `"v ;c"` come back trimmed and stripped; `"v\\n"`
comes back as `v`; a key `a=b` is written `a=b=v` and read as key `a`, value `b=v`.  Python's
`set` refuses nothing either, but its writer escapes nothing it cannot read back except the
delimiter case.  Either `set` should validate (refuse delimiters in keys, comment symbols and
leading `[` in value lines, padding) or the documentation should stop promising the round trip
for anything but parsed input.
"""

[[bug]]
id = "configparser/4"
title = "`WriteOptions::multiline_line_indentation = 0` writes continuation lines flush left, which read back as keys"
kind = "contract"
severity = "low"
test = "zero_indentation_output_reads_back"
found = { commit = "7ceae18e750bd482d2b33b168405b286697d67fe", version = "3.3.0", hegel = "0.44.1", date = "2026-09-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`new_with_params(_, 0, _)` is accepted and `unparse` indents continuation lines by zero spaces,
so `[s]\\nk=a\\n  v` (map `{"k": "a\\nv"}`) is written as `[s]\\nk=a\\nv` and re-read as
`{"k": "a", "v": None}` — a valueless key `v` appears and the multiline value is cut.  The
documented rule is that a continuation must be "indented deeper than that key's line", so an
indentation of 0 can never satisfy it; the option should be at least 1 (clamp, or refuse in
`new_with_params`).
"""
