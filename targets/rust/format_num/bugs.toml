[[bug]]
id = "format_num/1"
title = "The `e` and `s` types panic on an infinite or NaN input; `b`/`o`/`x`/`X` print `i64::MAX` for infinity"
kind = "crash"
severity = "medium"
test = "non_finite_values_format_as_text"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`format("e", f64::INFINITY)`, `format(".2s", f64::NAN)` and every other `e`, `E` or `s` spec
of ±inf or ±NaN panic with `index out of bounds: the len is 1 but the index is 1`
(`get_formatted_exp_value` and `decompose_to_coefficient_and_exponent` split Rust's `inf`/`NaN`
text at the `e` that is not there). The `f`, `d` and `%` types print `inf`, `-inf`, `NaN`,
`-NaN` (`inf%`), so the crate does have a legible form for them; the integer types convert with
`as i64`, so `format("x", f64::INFINITY)` is `7fffffffffffffff`, `format("b", -f64::INFINITY)`
is `-` and 63 ones and `format("x", f64::NAN)` is `0`. Medium: a NaN or an infinity is the
ordinary result of a division by zero in the data being formatted, `format` takes any
`Into<f64>` and has no error channel, and the crate's stated purpose is human-readable output.
"""

[[bug]]
id = "format_num/2"
title = "`s` panics below one yocto whenever the precision is smaller than the number of leading zeros: `format(\"s\", 1e-31)`, `format(\".2s\", 1e-27)`"
kind = "crash"
severity = "low"
test = "si_prefix_handles_sub_yocto_values"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`format_si_prefix`'s branch for values below 10^-24 reduces the precision by the number of
leading zeros: `(p - i.abs() as i32 - 1) as usize`, then `max(0, …)`. The subtraction goes
negative first and the `as usize` wraps it to about 1.8e19 before the `max`, so
`format!("{:.1$e}", value, huge)` panics with `Formatting argument out of range`:
`format("s", 1e-31)` (the default precision 6 covers 1e-30 but nothing smaller),
`format(".2s", 1e-27)`, `format(".3s", 4.56e-28)`, `format("s", 1e-320)`. d3-format, which
this code ports, applies the `max` to the signed value. Where the branch does not panic it
prints one significant digit fewer than d3 (`format(".6s", 1.234567e-29)` is `0.00001y`, d3's
`formatPrefix` gives `0.000012y`). Low: sub-yocto magnitudes are rare in data meant for people,
but the panic is on a finite input to the default `s` spec.
"""

[[bug]]
id = "format_num/3"
title = "The `E` type always panics"
kind = "crash"
severity = "low"
test = "capital_e_is_the_upper_case_exponent_form"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`format` has an explicit arm for `Some("E")` that calls `get_formatted_exp_value("E", …)`;
that function formats with `{:e}` (a lower-case `e`) and then splits the text on `"E"`, so the
exponent token is missing and `tokens[1]` panics with `index out of bounds`:
`format("E", 1.5)`, `format(".2E", 12345)`. The doc lists only `e`, but the type is
implemented and the regex accepts it (Python's `E` is the upper-case form, `1.50E+04`). Low:
undocumented type, but a panic on its only path.
"""

[[bug]]
id = "format_num/4"
title = "Centre alignment with a multi-byte fill character panics: `format(\"é^10d\", 12345)`, `format(\"→^6d\", 12345)`"
kind = "crash"
severity = "medium"
test = "fill_can_be_any_character"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"The fill can be any character." The `^` alignment splits the padding string at
`padding.len() / 2` — a byte index — so whenever the fill is a multi-byte character and the
byte length of the padding halves inside a character it panics: `format("é^10d", 12345)`
(five `é`, 10 bytes, cut at 5: `end byte index 5 is not a char boundary`), `format("→^6d",
12345)`, `format("🦀^10d", 12345)`, `format("─^20f", x)` with the box-drawing fill a table
would use. `format("é^9d", 12345)` (four `é`) happens to work, as do `<`, `>` and `=` with any
fill. Medium: a panic, on a documented feature, for the kind of fill (`─`, `·`, `…`) that is
the point of choosing a fill.
"""

[[bug]]
id = "format_num/5"
title = "The width is counted in bytes: a field with the `µ` prefix is one column short"
kind = "wrong-result"
severity = "low"
test = "width_counts_characters"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The padding is `width - (prefix.len() + value.len() + suffix.len())` with `str::len`, bytes.
The only multi-byte text the formatter itself produces is the SI prefix `µ` (2 bytes), so every
`s`-typed field between 1 µ and 1 m is one character narrower than asked:
`format("10.2s", 0.0000123)` is `"      12µ"` (9 characters), `format("010.2s", 0.0000123)`
`"00000012µ"`, `format("^10.2s", 0.0000123)` `"   12µ   "`, `format("10.1s", -1e-6)`
`"      -1µ"`. A column of `s` values with a micro row among them does not line up. Low:
one column, one prefix.
"""

[[bug]]
id = "format_num/6"
title = "`b`, `o`, `x`, `X` truncate instead of rounding to integer: `format(\"x\", 3.7)` is `3` where `d` gives `4`"
kind = "wrong-result"
severity = "low"
test = "integer_types_round_to_integer"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The doc says each integer type is "rounded to integer", and `d` is (`format!("{:.0}")`:
`format("d", 3.7)` = `4`, `format("d", 2.5)` = `2`). The other four convert with
`input.abs() as i64`, which truncates: `format("b", 3.5)` = `11`, `format("o", 3.7)` = `3`,
`format("x", 3.7)` = `3`, `format("X", 0.999)` = `0`. d3-format's `b`/`o`/`x` round
(`Math.round`). Low: a fractional input to a base conversion is unusual, but the two paths
disagree by one.
"""

[[bug]]
id = "format_num/7"
title = "`b`, `o`, `x`, `X` saturate at `i64::MAX`: `format(\"x\", 1e19)` is `7fffffffffffffff`"
kind = "wrong-result"
severity = "medium"
test = "integer_types_are_exact_in_the_u64_range"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`value.abs() as i64` saturates, so from 2^63 up every value prints the same digits:
`format("x", 1e19)` is `7fffffffffffffff` (should be `8ac7230489e80000`), `format("X",
9.3e18)` `7FFFFFFFFFFFFFFF`, `format("b", 9.3e18)` sixty-three `1`s, `format("o", 1e300)`
twenty-one `7`s — while `format("d", 1e19)` prints `10000000000000000000` exactly. The crate's
note says the useful range extends to `u64::MAX` ("for big numbers (>u64::MAX) some precision
will be lost"); `u64::MAX` itself formats as `7fffffffffffffff`. Medium: silently wrong digits
for an in-range input, in a hexadecimal that will be read as an identifier or a hash.
"""

[[bug]]
id = "format_num/8"
title = "Hexadecimal keeps the minus sign on a value that prints as zero: `format(\"x\", -0.4)` is `-0`"
kind = "wrong-result"
severity = "low"
test = "hex_of_a_value_that_prints_as_zero_has_no_sign"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The rule "a negative value that rounds to zero after formatting hides its sign" is skipped for
the `x` and `X` types (their digits cannot be parsed back as a decimal to test for zero), so
`format("x", -0.4)`, `format("X", -0.0)` and `format("x", -f64::NAN)` are `-0` while
`format("b", -0.4)`, `format("o", -0.4)`, `format("d", -0.4)` and `format(".0f", -0.4)` are
`0`. Low: cosmetic, and only for a fractional negative in hexadecimal.
"""

[[bug]]
id = "format_num/9"
title = "The alternate form `#` is ignored for `%`: `format(\"#.0%\", 0.12)` is `12%`, not `12.%`"
kind = "wrong-result"
severity = "low"
test = "alternate_form_applies_to_percent"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"For floats, the alternate form causes the result of the conversion to always contain a
decimal-point character, even if no digits follow it" and `%` is documented as "multiply by
100, and then decimal notation". `#.0f` gives `12.` and `#.0e` gives `1.e+01`, but the `#`
arm matches only `f`, so `#.0%` gives `12%` (Python: `12.%`). Low: a decimal point.
"""

[[bug]]
id = "format_num/10"
title = "The pattern grammar accepts what the formatter does not implement: unknown type letters format as `f`, `$` is ignored, `,x` groups the leading decimal digits"
kind = "contract"
severity = "low"
test = "unimplemented_spec_combinations_are_rejected"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_pattern`'s regex takes any `[A-Za-z%]` as the type and `[$#]` as the symbol, and a
pattern it does not match panics (`format("abc", 1)`); but a matched pattern that means
nothing to the formatter silently falls through to fixed notation with six decimals:
`format("g", 12345.678)` = `12345.678000`, `format("G", 1.5)`, `format("n", 1.5)`,
`format("z", 1.5)` = `1.500000` (Python raises `Unknown format code`; `g`/`n` mean something
there). `$` (d3's currency symbol) is accepted and dropped: `format("$.2f", 1)` = `1.00`.
Grouping combined with a base conversion (which Python refuses) groups the digits up to the
first letter: `format(",x", 0x1234f)` = `1,234f`, `format(",x", 0xbeef)` = `beef`. Low: the
consistent behaviour would be the panic the malformed patterns already get, or a documented
meaning; as it is a typo in a pattern prints a plausible wrong number.
"""

[[bug]]
id = "format_num/11"
title = "A zero-padded grouped field drops leading digits when the separators outnumber the padding: `format(\"010,d\", 123456789)` is `23,456,789`"
kind = "wrong-result"
severity = "high"
test = "zero_padded_grouping_keeps_every_digit"
found = { commit = "74e4a89c93be8c010229316a79d5339568ea61ca", version = "0.1.0", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
With the `0` flag and `,`, the padding is computed from the ungrouped digits, the zeros are
prepended, the whole is grouped and then `group_value` cuts the grouped text down to the width
from the left. The cut removes as many characters as the grouping inserted, which is more
than the padding whenever the value nearly fills the field, so real digits go with the zeros:
`format("010,d", 123456789)` = `23,456,789` (the leading `1` is gone), `format("09,d",
12345678)` = `2,345,678`, `format("021,.0%", 1899100000000000)` =
`9,910,000,000,000,000%` (Hegel's case, from the Python differential: Python gives
`189,910,000,000,000,000%`), `format("06,d", 12345)` = `12,345`. Fields whose padding is at
least as long as the digits are fine (`format("013,.8d", -42000000)` = `-0,042,000,000`,
pinned upstream), as are fields with no padding at all (`format("05,d", 1234)` = `1,234`).
The width is documented as a minimum. d3-format's `formatGroup(value, width)`, which this
code ports, breaks out of its loop the same way once the grouped length passes the width, so
the port is faithful to a defect of the original. High: a silently wrong number from an
ordinary spec (`010,d` in a table) and an ordinary value (nine digits).
"""
