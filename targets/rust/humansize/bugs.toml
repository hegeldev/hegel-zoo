commit = "be4ac44adcb8"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "humansize/5"
title = "NaN and infinity with a thousands separator panic inside `Display` (`attempt to subtract with overflow` / `Buffer too small!`; hangs or panics per upstream #39)"
kind = "panic"
severity = "low"
test = "non_finite_inputs_render_their_float_spelling"
found = { commit = "be4ac44adcb8", version = "2.1.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/LeopoldArkham/humansize/issues/39"
fixed_in = ""
notes = "src/formatters.rs, `thousands_separator` branch: the integer-part loop `loop { … buffer[cursor] = b'0' + (integer_part % 10f64) as u8; integer_part /= 10f64; … if integer_part < 1f64 { break; } }` never ends for `NaN` (every comparison false) or `±inf` (`inf / 10 == inf`); the `digit_count == 3` arm decrements `cursor` without the `cursor == 0` check, so a debug build panics with `attempt to subtract with overflow` and a release build indexes past the buffer. `format_size_i(f64::NAN, DECIMAL.thousands_separator(Some(',')))` and `format_size_i(f64::INFINITY, …)` panic; without a separator they print `NaN B` and `inf YB`. Reachable because `ToF64` is implemented for `f32`/`f64` (upstream #27 asked for it). Upstream #39 (open, 2026-06) reports `format_size_i(f32::INFINITY, FormatSizeOptions::default())` blocking forever on the published crate — the scale loop; at this commit that loop stops at the last scale entry and the plain path prints `inf YB`, while the separator path's digit loop has the same shape and still does not terminate. Recorded as the zoo's confirmation of #39's class rather than zoo-original."

[[bug.observed]]
version = "2.1.3"
commit = "be4ac44adcb8"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "humansize/6"
title = "Pluralisation follows the truncated quotient, not the printed number: 1999 bytes is `2.00 Kilobyte`, 999995 bytes is `1000.00 Kilobytes`, and negatives are never singular (`-1 Bytes`)"
kind = "correctness"
severity = "low"
test = "pluralisation_follows_the_printed_value"
found = { commit = "be4ac44adcb8", version = "2.1.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/formatters.rs: the trailing `s` of a long unit (and of the bare `bits`) is removed when `f64_eq(ipart, 1.0)`, with `ipart` the truncated scaled value — before the mantissa is rounded to `decimal_places` and ignoring the sign. So the unit disagrees with the number printed next to it whenever rounding crosses 2 or 1: `format_size(1999u32, DECIMAL.long_units(true))` → `2.00 Kilobyte`, `1_999_995` → `2.00 Megabyte`, `999_995` → `1000.00 Kilobytes` is right but `1_999_999_999` → `2.00 Gigabyte`; 5 005 of the 2 000 000 byte counts in 1..=2 000 000 get the wrong number. Negative values never take the singular: `format_size_i(-1, …)` → `-1 Bytes`, `-1000` → `-1 Kilobytes`, `-1500` → `-1.50 Kilobytes` while `1500` → `1.50 Kilobyte`. The crate's own test enshrines `1.50 Kilobyte` (singular for 1.x), so the rule intended is `|printed integer part| == 1`; it should be applied to the rounded, unsigned mantissa."

[[bug.observed]]
version = "2.1.3"
commit = "be4ac44adcb8"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

