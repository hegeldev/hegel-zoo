[[bug]]
id = "humansize/4"
title = "A non-ASCII thousands separator panics (`Utf8Error`) or prints a control character: `Some('\\u{a0}')` panics inside `Display`, `Some('’')` prints `1\\u{19}000 kB`"
kind = "panic"
severity = "low"
test = "non_ascii_separators_are_inserted_as_characters"
found = { commit = "be4ac44adcb8", version = "2.1.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "`FormatSizeOptions::thousands_separator` takes an `Option<char>`, but src/formatters.rs writes it into the byte buffer as `sep as u8` and then `core::str::from_utf8(&buffer[cursor..]).unwrap()`s. A separator outside ASCII is truncated to its low byte: U+00A0 (no-break space, the SI/French grouping character) and U+202F (narrow no-break space) leave an invalid UTF-8 byte → `called Result::unwrap() on an Err value: Utf8Error { valid_up_to: 1, error_len: Some(1) }` from `format_size`/`Display`; U+2019 (’, the Swiss grouping character) becomes the control character U+0019: `format_size(1_000_000u32, DECIMAL.fixed_at(Some(FixedAt::Kilo)).thousands_separator(Some('’')))` → `\"1\\u{19}000 kB\"`. Every value with four or more integer digits is affected. Found by the first 100-case run. Fix: encode the char with `char::encode_utf8` (up to four bytes) into the buffer."

[[bug.observed]]
