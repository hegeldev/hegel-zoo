[[bug]]
id = "humansize/3"
title = "With a thousands separator, integer parts above 2^53 print garbage digits: u64::MAX fixed at bytes is `18,446,744,073,709,552,046 B` (plain path `18446744073709551616 B`)"
kind = "correctness"
severity = "low"
test = "grouped_integer_parts_beyond_2_53_are_the_f64_digits"
found = { commit = "be4ac44adcb8", version = "2.1.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/formatters.rs, `thousands_separator` branch: the integer part's digits are extracted by repeated `integer_part % 10f64` / `integer_part /= 10f64` in f64. Above 2^53 the quotient is rounded at every step and the digits drift, so the text is neither the value nor the f64 the plain path prints exactly: `format_size(u64::MAX, DECIMAL.fixed_at(Some(FixedAt::Base)).thousands_separator(Some(',')))` → `18,446,744,073,709,552,046 B` vs plain `18446744073709551616 B`; `36028797018963966` → `36,028,797,018,963,978 B` vs `36028797018963968 B`; `1 << 60` → `1,152,921,504,606,847,046 B` vs `1152921504606846976 B`; `u128::MAX` → `340,282,366,920,938,586,008,062,602,462,446,642,046 B` vs `340282366920938463463374607431768211456 B`. Only reachable with a thousands separator and a mantissa above 2^53 (`fixed_at` a small unit, or `u128` inputs, see upstream #30). Fix as humansize/1: format once, then group the digits of the text."

