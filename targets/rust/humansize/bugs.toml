[[bug]]
id = "humansize/8"
title = "With a thousands separator, a finite value whose integer part runs to about 75 digits panics (`attempt to subtract with overflow`): `format_size_i(1e100, DECIMAL.thousands_separator(Some(',')))`"
kind = "panic"
severity = "low"
test = "grouped_huge_floats_render_without_panicking"
found = { commit = "be4ac44adcb8", version = "2.1.3", hegel = "0.44.1", date = "2026-09-26" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/formatters.rs, `thousands_separator` branch: the number is written right to left into a fixed `[u8; 100]` buffer, `cursor -= 1` before the `cursor == 0` guard, so once the decimals, the point, the integer digits and a separator every three digits exceed 100 bytes the subtraction overflows (debug) or the write panics with `Buffer too small!`. The plain path prints every digit: `format_size_i(1e100, DECIMAL)` is the 77-digit `10000000000000002077539389218044971433521693749029233286481703317691084832768 YB`, `format_size_i(1e100, DECIMAL.thousands_separator(Some(',')))` panics at src/formatters.rs:106; so do `1e300` and `f64::MAX`, while `1e92` (69 digits, 22 separators) still renders. Only `f32`/`f64` inputs reach the shape (`u128::MAX` is 39 digits). Found by the float property once its separator cases stopped being filtered, reproduced standalone in a throwaway crate."

