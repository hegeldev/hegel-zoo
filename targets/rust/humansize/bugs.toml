[[bug]]
id = "humansize/1"
title = "With a thousands separator, a fraction that rounds up loses its carry: 1999 bytes is `1.00 kB` (plain path: `2.00 kB`), 1500 bytes with no decimals is `1 kB` (`2 kB`)"
kind = "correctness"
severity = "medium"
test = "grouped_renderings_are_the_plain_rendering_with_separators"
found = { commit = "be4ac44adcb8", version = "2.1.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/formatters.rs, the `thousands_separator` branch of `ISizeFormatter::fmt`: the fraction is rendered as `round(fpart × 10^places) as u64` and its low `places` digits are written, then the integer part is written from `modf`'s `ipart`. When the rounded fraction reaches 10^places (0.995 → 100 with two places, 0.5 → 1 with none) the digits written are all zeros and the carry into the integer part is dropped, so the text is a whole unit short: `1999` bytes → `1.00 kB` where the plain path prints `2.00 kB`; `999_995` → `999.00 kB` vs `1000.00 kB`; `1_999_999` → `1.00 MB` vs `2.00 MB`; `1500` with `decimal_places(0)` → `1 kB` vs `2 kB`. Density: 12 029 of the 1 999 001 byte counts in 1000..=2 000 000 render differently with `DECIMAL.thousands_separator(Some(','))` than without (first: 1115, 1125, 1335 … — every count whose scaled fraction rounds up to the next hundredth at the third decimal is at risk, and every one whose fraction is .995 or more carries). Found by the first 100-case run. The plain path (`write!(f, \"{:.*}\", places, size)`) rounds correctly, so the fix is to format the number once and group the digits of that text, or to carry the rounding into the integer part. The separator path also rounds a tie half away from zero where the plain path (Rust's `{:.p}`) rounds it half to even: 1025 bytes fixed at 9 decimals under `BINARY` is `1.000976563 KiB` grouped and `1.000976562 KiB` plain (checked 2026-09-26)."

[[bug.observed]]
version = "2.1.3"
commit = "be4ac44adcb8"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "humansize/2"
title = "With a thousands separator, negative values lose their decimals: -1500 bytes is `-1.00 kB` (plain path `-1.50 kB`), -16584975 fixed at KiB is `-16_196.00 KiB` (`-16196.26 KiB`)"
kind = "correctness"
severity = "medium"
test = "grouped_negative_renderings_keep_their_decimals"
found = { commit = "be4ac44adcb8", version = "2.1.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/formatters.rs, `thousands_separator` branch: `modf` of a negative size gives a negative fractional part, and `round(fpart × 10^places) as u64` saturates a negative f64 to 0, so every decimal printed is `0`: `format_size_i(-1500, DECIMAL.thousands_separator(Some(',')))` → `-1.00 kB` (plain `-1.50 kB`); `-16584975` with `BINARY.fixed_at(Some(FixedAt::Kilo)).thousands_separator(Some('_'))` → `-16_196.00 KiB` where the crate's own test expects `-16196.26 KiB` of the plain path; `-1` fixed at kB with three places → `-0.000 kB` (plain `-0.001 kB`). Every negative value with a non-zero fraction is affected (the integer part is right, `fabs(ipart)` is used there). Found by the first 100-case run. Fix: take the absolute value before splitting, as the integer part already does."

