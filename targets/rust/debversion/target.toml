name = "debversion"
language = "rust"
upstream = "https://github.com/jelmer/debian-parsers"
subdir = "debversion"
license = "Apache-2.0"
ai_policy_checked = "2026-09-13"

[base]
commit = "b1568f26a9e519917d0cfc2b7f952ae0c71a6d67"
date = "2026-09-17"
version = "0.5.3"

[hegel]
version = "0.44.1"

[run]
setup = ["dpkg --version >/dev/null", "/usr/bin/python3 -c 'import apt_pkg' || echo 'apt_pkg missing: comparisons fall back to dpkg --compare-versions'"]
command = "cargo test --no-fail-fast"

[expected_failures]
"empty_digit_runs_compare_equal_to_zeros" = "debversion/1"
"strict_parser_rejects_what_dpkg_rejects" = "debversion/2"
"increment_debian_handles_large_trailing_numbers" = "debversion/3"
"bin_nmu_count_reads_the_last_suffix" = "debversion/4"
"nmu_count_survives_a_bin_nmu" = "debversion/5"
"dot_runs_are_mangled_to_valid_git_tags" = "debversion/6"
"every_written_snapshot_suffix_is_read_back" = "debversion/7"
"svn_revisions_beyond_usize_do_not_panic" = "debversion/8"
"canonicalize_keeps_the_separators_the_upstream_needs" = "debversion/9"
"equal_versions_hash_equally" = "debversion/10"
