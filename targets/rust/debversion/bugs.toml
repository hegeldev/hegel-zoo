[[bug]]
id = "debversion/7"
title = "`get_revision` does not read back the date-only, sha-only and dotted-bzr suffixes that `upstream_version_add_revision` writes, so a second update stacks a second suffix"
kind = "wrong-result"
severity = "low"
test = "every_written_snapshot_suffix_is_read_back"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`VcsSnapshot::to_suffix` writes `git<date>` (no sha), `git<sha>` (no date), `git` and
`bzr<revno>` with a dotted revno; `get_revision` only recognises `git<date>.<sha>`,
`git<date>.<n>.<sha>`, `bzr<digits>` and `svn<digits>`. The crate's own doc example writes
`1.2.3+git20210101`; updating that version again with `upstream_version_add_revision` gives
`1.2.3+git20210101+git20210102` instead of replacing the snapshot, and
`get_revision("1.2.3+git20210101")` is `("1.2.3+git20210101", None)`.
"""

[[bug.observed]]
input = "get_revision(\"1.2.3+bzr1.1.1\") after upstream_version_add_revision(\"1.2.3\", Bzr { revno: \"1.1.1\" }, None)"
expected = "(\"1.2.3\", Some((After, Bzr { revno: \"1.1.1\" })))"
actual = "(\"1.2.3+bzr1.1.1\", None)"

