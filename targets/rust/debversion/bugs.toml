[[bug]]
id = "debversion/10"
title = "`Hash` is over the raw fields while `Eq` is by comparison: `0:1.0-1 == 1.0-1 == 1.0-1` but the hashes differ"
kind = "wrong-result"
severity = "medium"
test = "equal_versions_hash_equally"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`PartialEq` is `cmp == Equal`, so `1.0`, `1.0-0`, `0:1.0`, `001.0` and `1.0-00` are all equal.
`Hash` hashes `(epoch, upstream_version, debian_revision)` verbatim, breaking the `Hash`/`Eq`
contract (`k1 == k2` must imply equal hashes): a `HashSet<Version>` holds `1.0-1` and
`0:1.0-1` as two elements, and a `HashMap` lookup by an equal key misses. The crate's own
`test_hash` asserts `hash("1.0-1") != hash("0:1.0-1")`, so this is deliberate but wrong; either
hash the canonical form (dpkg's comparison key) or make `Eq` structural.
"""

[[bug.observed]]
input = "hash(\"0:1.0-1\".parse::<Version>()) == hash(\"1.0-1\".parse::<Version>()) given the two are =="
expected = "true"
actual = "false"

