[[bug]]
id = "debversion/6"
title = "`mangle_version_for_git` leaves `..` in a tag when the version has three or more dots in a row"
kind = "wrong-result"
severity = "low"
test = "dot_runs_are_mangled_to_valid_git_tags"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
DEP-14 mangling replaces `..` with `.#.`; `str::replace` does it on non-overlapping pairs, so
`1.0...0-1` becomes `1.0.#..0-1` and `....` becomes `.#..#.` — both still contain `..`, which
`git check-ref-format refs/tags/…` refuses. Every other generated version mangles to a valid
tag name. A loop (`while contains("..")`) or an `#`-per-dot rule would do.
"""

[[bug.observed]]
input = "mangle_version_for_git(&\"1.0...0-1\".parse().unwrap())"
expected = "a valid git tag name"
actual = "\"1.0.#..0-1\" — git check-ref-format: invalid"

