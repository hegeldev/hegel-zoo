commit = "b1568f26a9e5"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "debversion/5"
title = "`nmu_count` splits at the first `+nmu` and parses the rest, so a binNMU of an NMU (`1.0-1+nmu1+b1`) is not an NMU"
kind = "wrong-result"
severity = "low"
test = "nmu_count_survives_a_bin_nmu"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`nmu_count` parses everything after `+nmu` as an `i32`, so the common Debian shape
`<rev>+nmu<N>+b<M>` (a binary NMU of a sourceful NMU) yields `None`: `is_nmu()` is false on
`1.0-1+nmu1+b1` although `bin_nmu_count()` is `Some(1)` and `nmu_count()` was `Some(1)` before
`increment_bin_nmu`.
"""

[[bug.observed]]
input = "\"1.0-1+nmu1\".parse::<Version>().unwrap().increment_bin_nmu().nmu_count()"
expected = "Some(1)"
actual = "None"

