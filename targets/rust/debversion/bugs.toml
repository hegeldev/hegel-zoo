[[bug]]
id = "debversion/3"
title = "`increment_debian` panics on a trailing number at or beyond `i32::MAX`"
kind = "panic"
severity = "low"
test = "increment_debian_handles_large_trailing_numbers"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`increment_debian` replaces the trailing `\\d+` with `x.parse::<i32>().unwrap() + 1`: the parse
unwrap panics for `1.0-2147483648` (and any longer number — the comparison side handles
arbitrary digit strings through `BigInt`), and `2147483647 + 1` overflows (a panic in debug
builds, `-2147483648` in release builds, which makes the version *smaller*).
"""

[[bug.observed]]
input = "\"1.0-2147483647\".parse::<Version>().unwrap().increment_debian()"
expected = "1.0-2147483648"
actual = "panicked at src/lib.rs:453: attempt to add with overflow"

