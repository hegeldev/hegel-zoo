# Bugs found in debversion by the Hegel tests, against dpkg 1.22 / libapt (`apt_pkg`) as the
# comparison oracle and `git check-ref-format` for DEP-14 tags. Upstream had no related issue
# (jelmer/debversion-rs #27 was a different comparison bug, fixed in 2024).

[[bug]]
id = "debversion/1"
title = "a missing digit run compares below a run of zeros (`1.` < `1.0`, `1.0a` < `1.0a0`); dpkg says equal"
kind = "wrong-result"
severity = "medium"
test = "empty_digit_runs_compare_equal_to_zeros"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
dpkg's `verrevcmp` skips leading zeros of each digit run before comparing, so a run of zeros
is the same as no run at all: `1.` == `1.0`, `1.0a` == `1.0a0`, `1.0.` == `1.0.0`, and in the
revision `1.0-1.` == `1.0-1.0` (dpkg 1.22 and `apt_pkg.version_compare` agree). The crate's
`version_cmp_part` matches `(a_digit.len(), b_digit.len())` with `(0, _) => Less` and
`(_, 0) => Greater` before looking at the digits, so it orders these pairs. Every other
comparison agrees with dpkg on 30 000 generated pairs.
"""

[[bug.observed]]
input = "Version::from_str(\"1.0a\").cmp(&Version::from_str(\"1.0a0\"))"
expected = "Equal (dpkg --compare-versions 1.0a eq 1.0a0: true)"
actual = "Less"

[[bug.observed]]
version = "0.5.3"
commit = "b1568f26a9e5"
hegel = "0.44.1"
date = "2026-09-17"
result = "reproduces"
[[bug]]
id = "debversion/2"
title = "the strict parser accepts texts dpkg refuses: a colon without a numeric epoch, an empty revision, an empty upstream, a colon in the revision, an epoch beyond INT_MAX"
kind = "wrong-result"
severity = "low"
test = "strict_parser_rejects_what_dpkg_rejects"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`FromStr` is documented (on `parse_lenient`) as enforcing "strict Debian Policy compliance",
and is python-debian's regex `^(?:(\\d+):)?([A-Za-z0-9.+:~-]+?)(?:-([A-Za-z0-9+.~]+))?$`. That
regex lets a colon into the upstream part without an epoch (`1.0:2` — dpkg: "epoch in version
is not number"; policy: "if there is no epoch then colons are not allowed"), lets the upstream
part swallow a trailing hyphen (`1.0-` — dpkg: "revision number is empty") or a leading one
(`1:-1` — "version number is empty"), and keeps the hyphen in the upstream part when the text
after the last hyphen has a colon (`1.0-:1` — dpkg splits at the last hyphen and refuses the
revision), so the parsed version differs from dpkg's reading; the epoch is a `u32` where dpkg
refuses anything above `INT_MAX` ("epoch in version is too big"). Texts dpkg only warns about
(`a1`, `_`) are not counted here.
"""

[[bug.observed]]
input = "Version::from_str(\"1.0:2\")"
expected = "Err (dpkg --validate-version 1.0:2: epoch in version is not number)"
actual = "Ok(Version { epoch: None, upstream_version: \"1.0:2\", debian_revision: None })"

