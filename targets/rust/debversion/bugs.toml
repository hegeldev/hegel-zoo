[[bug]]
id = "debversion/4"
title = "`bin_nmu_count` splits at the first `+b`, so `1.0+beta1+b1` (which `increment_bin_nmu` produces) is not a binNMU"
kind = "wrong-result"
severity = "low"
test = "bin_nmu_count_reads_the_last_suffix"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`bin_nmu_count` uses `split_once("+b")` and parses the rest, so any earlier `+b…` (`+beta1`,
`+build2`, `+bzr123`) hides the real `+bN` suffix: `is_bin_nmu()` is false and
`bin_nmu_count()` is `None` for `1.0-1+beta1+b1`. `increment_bin_nmu` uses the same split and
appends `+b1` when the rest does not parse, so `v.increment_bin_nmu().bin_nmu_count()` is
`None` for such `v`, and a second increment appends another `+b1` (`1.0+beta1+b1+b1`) instead
of counting to 2.
"""

[[bug.observed]]
input = "\"1.0-1+beta1\".parse::<Version>().unwrap().increment_bin_nmu().bin_nmu_count()"
expected = "Some(1) (the version is now 1.0-1+beta1+b1)"
actual = "None"

[[bug.observed]]
