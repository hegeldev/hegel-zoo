[[bug]]
id = "debversion/9"
title = "`canonicalize` drops `0:` and `-0` even when the upstream part contains a colon or a hyphen and needs them (`0:1.0:2` -> `1.0:2`, `1.0-1-0` -> `1.0-1`)"
kind = "wrong-result"
severity = "medium"
test = "canonicalize_keeps_the_separators_the_upstream_needs"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
An explicit `0:` epoch is what allows colons in the upstream part, and a revision is what
allows hyphens in it. `canonicalize` removes a zero epoch and an all-zero revision without
looking at the upstream part, so the result's text means something else or nothing: `0:1.0:2`
-> `1.0:2` (dpkg: "epoch in version is not number"), `1.0--0` -> `1.0-` ("revision number is
empty"), `1.0-1-0` -> `1.0-1`, which dpkg (and the crate's own parser) read as upstream `1.0`,
revision `1` — a different version. `Display` of the struct is fine; the struct just no longer
denotes a Debian version.
"""

[[bug.observed]]
input = "\"1.0-1-0\".parse::<Version>().unwrap().canonicalize().to_string()"
expected = "\"1.0-1-0\" (or \"0:1.0:2\" kept for the colon case)"
actual = "\"1.0-1\" — dpkg --compare-versions 1.0-1 eq 1.0-1-0: false"

