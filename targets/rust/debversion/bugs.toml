[[bug]]
id = "debversion/8"
title = "`get_revision` panics on an svn revision number beyond `usize`"
kind = "panic"
severity = "low"
test = "svn_revisions_beyond_usize_do_not_panic"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.5.3", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The svn arm of `get_revision` does `revno: r.parse().unwrap()` on the `\\d+` capture, so
`get_revision("1.0+svn18446744073709551616")` panics with a `ParseIntError` — on a string the
version parser accepts. The git snapshot arm uses `.ok()` for the same situation.
"""

[[bug.observed]]
input = "get_revision(\"0~rc1+svn18446744073709551616\")"
expected = "no panic — the base and the snapshot, or the text unrecognised"
actual = "panicked: called `Result::unwrap()` on an `Err` value: ParseIntError { kind: PosOverflow }"

