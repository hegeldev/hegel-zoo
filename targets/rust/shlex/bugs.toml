# Bugs found in shlex by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracles are the shells the crate documents compatibility with — bash held open as a child
# (`x=( <text> )` is its word splitter), dash and busybox ash per case — and Python's `shlex`.

[[bug]]
id = "shlex/1"
title = "a line continuation at the start of a word yields an empty word: `a \\<newline> b` splits into `[\"a\", \"\", \"b\"]`"
kind = "wrong-result"
severity = "medium"
test = "line_continuation_at_word_start_yields_no_word"
found = { commit = "653936e120cdd0a8d1b4f0837e2cce0f347da4c0", version = "2.0.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`bytes::Shlex::next` skips whitespace and comments, then hands the first byte of the word to
`parse_word`, which starts a word unconditionally.  When that first byte is a backslash followed
by a newline, `parse_word` drops the pair (as it should: POSIX 2.2.1, "the <backslash> and
<newline> shall be removed") but keeps the word, so if the next byte is whitespace or the end of
the input, an empty word is returned: `split("a \\\\\\n b")` is `["a", "", "b"]` where bash,
dash and busybox ash give `["a", "b"]`; `split("\\\\\\n")` is `[""]` where the shells give `[]`;
`split("a \\\\\\n")` is `["a", ""]`; `" \\\\\\n # c\\nd"` is `["", "d"]`.  A continuation
followed directly by a word is fine (`a \\\\\\nb` is `["a", "b"]`), which is why the upstream
test `foo\\\\\\nbar` passes.  For a command line split with this crate, the extra empty argument
is a real argument (`rm -f -- ''`), and a continuation at the end of a line — the usual place
for one — is exactly where the whitespace follows.  The fix is to treat `\\\\\\n` as whitespace
in the skip loop of `next` (or to continue skipping after `parse_word` consumed nothing).
"""
