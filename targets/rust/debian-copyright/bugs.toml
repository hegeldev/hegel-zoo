# Bugs found in debian-copyright by the Hegel tests, against python-debian's
# `debian.copyright` (2.0) and two small models (a DEP-5 glob matcher, the
# flattening of license-expression trees). All zoo-original; jelmer/debian-parsers
# has no related issue.

[[bug]]
id = "debian-copyright/1"
title = "LicenseParagraph::name() is None for a License field without text, so lookups by name miss the paragraph"
kind = "wrong-result"
severity = "low"
test = "a_license_paragraph_without_text_has_a_name"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`lossless::LicenseParagraph::name()` and `text()` split the field value at the
first newline and return None when there is none, so a stand-alone paragraph
`License: MIT` (a name and no text, e.g. with a `Comment:` pointing at
/usr/share/common-licenses) has no name for `Copyright::find_license_by_name`,
`remove_license_by_name` and `find_license_for_file`, although
`LicenseParagraph::license()` returns `License::Name("MIT")` for it and
python-debian reports synopsis "MIT" with an empty text.
"""

[[bug]]
id = "debian-copyright/2"
title = "wrap_and_sort with immediate_empty_line moves the License synopsis onto a continuation line"
kind = "silent-corruption"
severity = "medium"
test = "wrap_and_sort_keeps_the_license_synopsis_on_the_first_line"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`lossless::Copyright::wrap_and_sort(_, true, _)` rewrites `License: MIT\\n text`
as `License:\\n MIT\\n text`. In DEP-5 the first line of a License field is the
license short name and the continuation lines are the text, so every other
reader (python-debian, the crate's own lossy parser) now sees an empty synopsis
and "MIT" as the first line of the license text. The option makes sense for
Files and Copyright lists but must not be applied to License fields.
"""

[[bug]]
id = "debian-copyright/3"
title = "Glob wildcards do not match newline characters in a path"
kind = "differential"
severity = "low"
test = "globs_match_newlines_like_python_debian"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`GlobPattern` compiles `*` to `.*` and `?` to `.` in a regex without the `s`
flag, so neither matches a newline; the pattern `*` does not match the file
name "\\n". DEP-5 says `*` matches any number of characters, and python-debian's
`globs_to_re` compiles with `re.DOTALL`. File names with newlines are rare but
legal.
"""

[[bug]]
id = "debian-copyright/4"
title = "The lossy parser strips the extra indentation of License text lines"
kind = "wrong-result"
severity = "medium"
test = "the_lossy_parser_keeps_the_indentation_of_license_text"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
For `License: MIT\\n text\\n  indented` the lossless parser, python-debian and
dpkg strip exactly one indentation character and read the text as
"text\\n indented"; `debian_copyright::Copyright` (the deb822-fast based lossy
parser) reads "text\\nindented". Indentation inside license texts (clause
lists, BSD-style paragraphs) is part of the text; it is lost on parse and on
Display.
"""

[[bug]]
id = "debian-copyright/5"
title = "wrap_and_sort re-indents License text: the chosen indentation is added to the text and extra indentation is lost"
kind = "silent-corruption"
severity = "medium"
test = "wrap_and_sort_keeps_the_license_text"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`lossless::Copyright::wrap_and_sort(Indentation::Spaces(n), false, _)` rewrites
the continuation lines of every field with n spaces. For a License field the
text is significant beyond the first space, so with n = 2 the license text
"text" becomes " text" (for python-debian, dpkg and the crate's own
`license()` after a re-parse), and with any n a line that was indented more
than the others loses its extra indentation
(`wrap_and_sort_keeps_the_indentation_of_license_text`). Copyright and Files
fields tolerate the re-indentation; License (and header Disclaimer/Comment)
fields do not.
"""

[[bug]]
id = "debian-copyright/6"
title = "Display of a nested same-operator expression is read back as a different expression"
kind = "wrong-result"
severity = "low"
test = "display_of_a_nested_or_is_read_back"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LicenseExpr::And([A, Or([B, Or([C, D])])])` (A and (B or C or D)) prints as
"A, and B, or C or D", which `parse` and `parse_strict` both read as
Or([And([A, B]), C, D]) = (A and B) or C or D. The inner `Or` inside an `Or`
is printed with a comma join as if it were a lower-precedence operand. Such
trees come out of `parse_strict` itself ("B, or C or D" parses to
Or([B, Or([C, D])])), so wrapping a parsed expression in an And and printing
it changes its meaning. Flattening nested same-operator nodes in Display (or
in the parsers) would fix it.
"""

[[bug]]
id = "debian-copyright/7"
title = "parse and parse_strict disagree on the precedence of `, or` and `, and`"
kind = "correctness"
severity = "medium"
test = "strict_and_lenient_parsers_agree_on_comma_precedence"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"MIT, or GPL-2, and BSD" is Or([MIT, And([GPL-2, BSD])]) for the lenient
`parse` (`, and` binds tighter than `, or`, mirroring the plain operators) but
And([Or([MIT, GPL-2]), BSD]) for `parse_strict` / `FromStr`, which folds the
comma-joined operands from left to right. `Display` follows the lenient
reading: Or([A, And([Or([B, X]), C])]) prints as "A, or B or X, and C", which
`parse_strict` reads as And([Or([A, Or([B, X])]), C]). DEP-5 does not define
a precedence between the two comma forms, but the two parsers of one crate
(and its Display) must agree.
"""

[[bug]]
id = "debian-copyright/8"
title = "wrap_and_sort orders Files paragraphs by their first pattern before sorting the patterns, so it is not idempotent"
kind = "wrong-result"
severity = "low"
test = "wrap_and_sort_is_idempotent"
found = { commit = "4dc04da822298d3586902520119d04fd89f9218c", version = "0.1.55", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`lossless::Copyright::wrap_and_sort` sorts the paragraphs by
`pattern_sort_key` of the first pattern of the *original* Files value and then
sorts the patterns inside each paragraph. For `Files: a/b` followed by
`Files: a/b a` both keys are (1, 1), the order is kept, and the second
paragraph is rewritten as `Files: a a/b` whose first pattern has key (1, 0):
the output is not ordered by the function's own criterion, and a second
`wrap_and_sort` swaps the two paragraphs.
"""
