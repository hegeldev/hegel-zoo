[[bug]]
id = "r-description/1"
title = "`Version` orders `1.2` below `1.2.0`; R's `numeric_version` — what `loadNamespace` and `R CMD INSTALL` compare requirements with — treats trailing zero components as equal, so `R (>= 3.5.0)` is reported unsatisfied by R 3.5"
kind = "wrong-result"
severity = "medium"
test = "trailing_zero_components_compare_equal_like_r"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Ord for Version` (`src/version.rs`) and `compare_components` (`src/lossless.rs`) compare
component-wise and then by length, so `1.2 < 1.2.0` and `1.2 != 1.2.0`. In R
`numeric_version("1.2") == numeric_version("1.2.0")` is `TRUE` (`compareVersion`, a different
utility, does say -1, but the dependency machinery — `loadNamespace`'s `versionCheck`,
`tools:::.check_package_depends` — uses `numeric_version` operators via `do.call(op, …)`).
Writing R Extensions even recommends dropping trailing zeroes in requirements. Consequences:
`Relation::satisfied_by` for `pkg (>= 1.2.0)` with 1.2 installed is `false`, for
`pkg (== 1.2)` with 1.2.0 installed `false`, `!=` `true`; `Eq`/`Hash` disagree with R too.
"""

[[bug]]
id = "r-description/2"
title = "`Version::from_str` accepts `+` inside a component (`1.+2` parses as 1.2) because `u32::from_str` takes a leading sign; `package_version(\"1.+2\")` is invalid"
kind = "contract"
severity = "low"
test = "plus_signs_are_not_version_components"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Both `Version` parsers (`src/version.rs`, `lossless::relations::Version`) split on `.`/`-` and
call `part.parse::<u32>()`, which accepts `+12`. R's version grammar is non-negative integers
only. Everything else in the syntax property agreed with `package_version` (leading zeros,
empty components, trailing separators, letters).
"""

[[bug]]
id = "r-description/3"
title = "`lossless::Relation::satisfied_by` returns `true` for an unconstrained relation (`cli`) when the package is not installed at all; `lossy::Relation::satisfied_by` (and R) require the package"
kind = "wrong-result"
severity = "medium"
test = "unconstrained_lossless_relations_need_the_package"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`src/lossless.rs`: `if let Some(version) = version { … } else { true }` — the lookup is never
consulted when there is no version constraint. The lossy twin does `actual.is_some()`. So
`lossless::Relations::from_str("cli, R").satisfied_by(|_| None)` is `true` for an empty
library.
"""

[[bug]]
id = "r-description/4"
title = "`lossless::Relations::insert(0, rel)` into a list holding exactly one relation writes the new relation without a separating comma: `R` into `cli (>= 1.0)` gives `Rcli (>= 1.0)`"
kind = "wrong-result"
severity = "medium"
test = "insert_at_the_start_of_a_single_relation"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`insert` decides whether the list is empty by looking for a COMMA token
(`is_empty = !children.any(COMMA)`), which is also true for a list with one relation; with
`idx == 0` it then splices the new relation in with no `, ` after it. The result is one
merged relation `Rcli (>= 1.0)` — a different package name — and re-parsing the text loses
the inserted relation. `push`, `insert` at other positions and `insert` into a truly empty
list are fine (the model property covers them).
"""

[[bug]]
id = "r-description/5"
title = "`lossless::RDescription::lazy_data` compares the field with the word `true` only; `LazyData: TRUE` / `yes` — spellings R CMD INSTALL accepts (`str_parse_logic`/`config_val_to_logical`) — read as `Some(false)`"
kind = "wrong-result"
severity = "medium"
test = "lazy_data_accepts_r_logicals"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`src/lossless.rs`: `self.0.get("LazyData").map(|s| s == "true")`. R's installer reads the
field with `parse_description_field(desc, "LazyData", …)` = `str_parse_logic`, which accepts
`TRUE`, `true`, `True`, `yes`, `Yes`, `YES`, `T`, `1` (and the `false` spellings; anything
else is an install error). `LazyData: TRUE` and `LazyData: yes` are common in CRAN packages.
An unrecognised word should not be `Some(false)` either.
"""

[[bug]]
id = "r-description/6"
title = "A continuation line holding a single `.` — an empty line to `read.dcf` — is kept as a literal `.` by both `RDescription` parsers (`description()` = `What it does.\\n.\\nMore.`)"
kind = "differential"
severity = "low"
test = "dot_continuation_lines_are_blank_like_read_dcf"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`read.dcf("A: x\\n .\\n y")` gives `x\\n\\ny` (the DCF convention shared with deb822: a lone
dot marks a blank line inside a multi-line value); the deb822 layer the crate is built on
returns the raw continuation text (`x\\n.\\ny`) and `RDescription` passes it through. Paragraph
breaks written this way in a `Description:` field come back as literal dots.
"""

[[bug]]
id = "r-description/7"
title = "The `lossless::RDescription` accessors `unwrap()` their parses: `imports()` panics on `Imports: foo (>= 1.0) bar` (which R reads as `foo (>= 1.0)`), `bug_reports()` on any `BugReports` text that is not a URL"
kind = "panic"
severity = "low"
test = "accessors_do_not_panic_on_fields_r_accepts"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`src/lossless.rs`: `imports`/`suggests`/`depends`/`linking_to`/`enhances` do
`.map(|s| s.parse().unwrap())` and `bug_reports` does `url::Url::parse(..).unwrap()`, in a
module whose documentation promises to "allow for syntax errors in the input, and … parse as
much as possible" (and which has `Relations::parse_relaxed` for exactly that). R's
`.split_op_version` ignores anything after the closing parenthesis, so `foo (>= 1.0) bar` is
a field R installs from; `bug.report()` copes with a non-URL `BugReports` by printing it.
"""

[[bug]]
id = "r-description/8"
title = "`UrlEntry::from_str` splits at the first `(`, so a URL with parentheses in its path (`https://en.wikipedia.org/wiki/R_(programming_language)`) becomes `https://en.wikipedia.org/wiki/R_` with label `programming_language`"
kind = "wrong-result"
severity = "low"
test = "urls_with_parentheses_keep_their_path"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`src/lossy.rs`: `if let Some(pos) = s.find('(') { url = s[..pos]; label = s[pos+1..len-1] }` —
no check that the text ends with `)` or that the `(` follows whitespace. The label convention
(`URL (Label)`) is the crate's own; R only knows URL lists. Also the label slice
`s[pos + 1..s.len() - 1]` assumes a closing parenthesis, so `https://x.org/a(b` gives the
label `b` minus nothing but the URL `https://x.org/a`, and `https://x.org/(` an empty label.
"""

[[bug]]
id = "r-description/9"
title = "A whitespace-separated `URL` list — allowed by Writing R Extensions (\"separated by commas or whitespace\") — is read as one URL: `https://a.org/ https://b.org/` becomes `https://a.org/%20https://b.org/`"
kind = "wrong-result"
severity = "medium"
test = "url_lists_may_be_whitespace_separated"
found = { commit = "57dcf0175082698e8ccfc4e14f9a44a4847b13ba", version = "0.4.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`deserialize_url_list` (`src/lossy.rs`) splits on `,` and `\\n` only; the `url` crate then
percent-encodes the embedded space instead of failing, so the struct silently holds a URL
that exists nowhere. R's own URL extraction (`tools:::url_db_from_package_metadata`) uses
`[^[:space:],]*` — whitespace and commas both separate. The lossless `url()` returns the raw
string and is unaffected.
"""
