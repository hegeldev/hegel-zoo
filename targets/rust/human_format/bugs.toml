[[bug]]
id = "human_format/1"
title = "`Scales::Time()` panics on zero: `format(0.0)` indexes the empty positional suffix list"
kind = "crash"
severity = "high"
test = "time_scale_formats_zero"
found = { commit = "9c545336be0687d355c62ac1e94983a6265a3748", version = "1.2.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Scales::to_scaled_value` consults the time table only `if value > 0.0`; zero falls through to
the positional code, whose last branch is `suffix: self.suffixes[0].to_owned()` — and
`Scales::Time()` is built with `suffixes: vec![]`. So `Formatter::new()
.with_scales(Scales::Time()).format(0.0)` panics with "index out of bounds: the len is 0 but
the index is 0" (every other value formats: `1.0` → `"1.00 s"`, `-90.0` → `"-1.50 m"`, `1e-12`
→ `"0.00 ns"`). The same line panics for any custom `with_suffixes(vec![])`, on every value.
High: a zero duration is the commonest duration there is, and the README presents
`Scales::Time()` as the time-aware formatter.
"""

[[bug]]
id = "human_format/2"
title = "The unit is chosen before rounding: `format(999_999.0)` is `1000.00 k`, `format(0.999_999_9)` is `1000.00 m`"
kind = "wrong-result"
severity = "medium"
test = "scaled_values_stay_below_the_base"
found = { commit = "9c545336be0687d355c62ac1e94983a6265a3748", version = "1.2.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`to_scaled_value` divides by the base while the *unrounded* value is at least the base, then
`format` prints the scaled value with `{:.2}`. A value just under a power of the base rounds
up to the base itself: `Formatter::new().format(999_999.0)` = `"1000.00 k"` (expected
`"1.00 M"`), `format(999.999)` = `"1000.00 "` (expected `"1.00 k"`), and in the fractional
direction `format(0.999_999_9)` = `"1000.00 m"` (expected `"1.00 "`). The time table has the
same defect: `Scales::Time()` formats `59.999` as `"60.00 s"` rather than `"1.00 m"`. The
printed number has four integer digits while the README promises "short strings, like turning
1_000_000 into 1.00 M". The general property `formatting_matches_the_model` keeps to values
where rounding does not cross the base and this pin holds the rest. Medium: any value within
0.5 % below a unit boundary — common in measured data — prints in the wrong unit.
"""

[[bug]]
id = "human_format/3"
title = "`Scales::Time()` picks among synonyms (`y`/`yr`/`year`, `mo`/`month`, `dec`/`decade`, `c`/`century`, `kyr`/`millennium`) in `HashMap` order: the output differs between formatters"
kind = "wrong-result"
severity = "medium"
test = "time_formatting_is_deterministic"
found = { commit = "9c545336be0687d355c62ac1e94983a6265a3748", version = "1.2.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The time table is a `HashMap<String, f64>`; `to_scaled_value` collects it into a vector,
sorts by multiplier descending (a stable sort) and takes the first entry the value reaches.
Five multipliers appear under two or three keys each, so their order after the sort is the
map's iteration order — which is randomised per `HashMap` instance (`RandomState`). Twelve
fresh `Formatter::new().with_scales(Scales::Time())` formatting one average year gave
`["1.00 y", "1.00 year", "1.00 year", "1.00 y", "1.00 year", "1.00 y", "1.00 year", "1.00 y",
"1.00 y", "1.00 year", "1.00 year", "1.00 yr"]`. Every value from one month up is affected
(`mo`/`month`, `y`/`yr`/`year`, `dec`/`decade`, `c`/`century`, `kyr`/`millennium`); `qtr`,
`Myr`, `Gyr` and the sub-month units are unique and stable. The `UnknownSuffix` message lists
the valid suffixes in the same random order. Both `time_formatting_is_deterministic` (eight
formatters, random time values) and the pin `time_synonyms_format_consistently` fail.
Medium: output of a formatting library changes from run to run and from instance to instance.
"""

[[bug]]
id = "human_format/4"
title = "`try_parse` strips the units with `trim_end_matches`: with `with_units(\"m\")`, `1.00 mm` (one millimetre) parses as `1.0`"
kind = "wrong-result"
severity = "medium"
test = "units_are_stripped_once_when_parsing"
found = { commit = "9c545336be0687d355c62ac1e94983a6265a3748", version = "1.2.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_components` removes the configured units with `value.trim().trim_end_matches(&self
.forced_units)`, which strips *every* trailing repetition of the units string. When a
magnitude suffix ends with the units, the suffix goes too: `Formatter::new().with_units("m")`
formats `0.001` as `"1.00 mm"` (the README's own metres example) and `try_parse("1.00 mm")`
returns `Ok(1.0)` — a thousandfold error on the formatter's own output; the same for units `s`
with the time table's `ms`/`us`/`ns`, `i` with the binary `Ki`…`Qi`, `k`/`M`/… with any SI
suffix. Conversely `"1.50 kBB"` with units `B` parses as `1500.0` instead of failing. A single
`strip_suffix` is what the format produces. Medium: silent, large, and on the crate's own
round trip for a documented configuration.
"""

[[bug]]
id = "human_format/5"
title = "`try_parse` rejects the formatter's own `inf`, `-inf` and `NaN`"
kind = "contract"
severity = "low"
test = "formatter_output_for_infinities_parses"
found = { commit = "9c545336be0687d355c62ac1e94983a6265a3748", version = "1.2.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`format` maps the non-finite values to `"inf"`, `"-inf"` and `"NaN"` (explicit branches added
in 1.2), but `parse_components` only accepts ASCII digits, `.` and a leading `-` as the
number, so `try_parse("inf")` is `Err(EmptyInput)`, `try_parse("-inf")` is
`Err(InvalidNumber)` and `try_parse("NaN")` `Err(EmptyInput)`. `try_parse` is documented as
the way to "parse a string back into a float value". Low: the non-finite corner of a round
trip that otherwise holds.
"""

[[bug]]
id = "human_format/6"
title = "`try_parse` trims the text before removing the separator: with separator ` | ` the formatter's own `1.00 | ` does not parse"
kind = "contract"
severity = "low"
test = "separator_survives_trimming_when_the_suffix_is_empty"
found = { commit = "9c545336be0687d355c62ac1e94983a6265a3748", version = "1.2.1", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`parse_components` starts with `value.trim()` and only afterwards strips the number and then
`trim_start_matches(&self.separator)`. With a separator that ends in whitespace after other
characters, the formatter's output for a value below the base — empty suffix, so the
separator is the tail of the string — loses that whitespace to `trim()`, and the separator no
longer matches: `Formatter::new().with_separator(" | ")` formats `1.0` as `"1.00 | "` and
`try_parse("1.00 | ")` is `Err(UnknownSuffix(" |; valid suffixes are: …"))`, while
`"1.50 | k"` parses. Found by the round-trip property at 1000 cases. Low: an unusual
separator, and the error is loud.
"""
