[[bug]]
id = "versions/5"
title = "`Mess`'s `Ord` ignores the separator kind and the digits' spelling that its derived `Eq` includes: `Mess::new(\"1-2\").cmp(\"1_2\")` and `\"1.01\".cmp(\"1.1\")` are `Equal` while `==` is false"
kind = "correctness"
severity = "low"
test = "messes_order_totally"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/mess.rs: `Ord for Mess` compares the chunk vectors (`MChunk::cmp` compares `Digits` by value, ignoring the kept text) and then the `next` messes, dropping the `Sep`; `PartialEq`/`Hash` are derived and include both. So `Mess::new(\"0\")` and `Mess::new(\"00\")`, `\"1.003.0\"` and `\"1.3.0\"`, `\"1-2\"` and `\"1_2\"` compare `Equal` but are `!=` and hash differently — the same `Ord`/`Eq` inconsistency the crate fixes by hand for `SemVer` (\"k1 == k2 -> hash(k1) == hash(k2)\", and `PartialEq` ignoring metadata). `Versioning::Complex` inherits it. Found by the first 100-case run (`0` vs `00`)."

