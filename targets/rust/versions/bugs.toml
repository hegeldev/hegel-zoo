[[bug]]
id = "versions/3"
title = "`Versioning`'s `Ord` is not transitive across variants: `0.0.0 < 4294967296 < a < 0.0.0`; `Vec<Versioning>::sort` panics with \"user-provided comparison function does not correctly implement a total order\""
kind = "correctness"
severity = "medium"
test = "versioning_comparison_is_a_total_order"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "The three cross-variant arms of `Ord for Versioning` (src/versioning.rs; `SemVer::cmp_version`, `SemVer::cmp_mess`, `Version::cmp_mess`) each follow their own rule and do not agree: `Ideal(0.0.0)` vs `Complex(4294967296)` (a number beyond `u32` is a `Plain` chunk) falls back to `to_mess().cmp` → text `\"0\" < \"4294967296\"` → Less; `Complex(4294967296)` vs `General(a)` compares `Plain(\"4294967296\")` with `Plain(\"a\")` as text → Less; `Ideal(0.0.0)` vs `General(a)` uses the `cmp_version` rule that a non-numeric chunk is a pre-release → Greater. So `0.0.0 < 4294967296 < a` and `a < 0.0.0`. The `Equal` arms are not transitive either (`1.2.3-alpha == 1.2.3rc1 == 1.2.3` while `1.2.3-alpha < 1.2.3`, see versions/4). Consequence: since Rust 1.81 `slice::sort` detects the inconsistency — sorting 40 `Versioning`s drawn from `0.0.0, 4294967296, a, 1.2.3, 1.2.3rc1, 1.2.3-alpha, b, 0.0.1` panics (verified by probe), and `BTreeMap`/`binary_search` on such keys are undefined. The crate's documentation promises comparison of mixed kinds (`assert!(good > evil)` in the crate docs), and the `equality` test only checks `x.cmp(&x)`. Found by the first 100-case run."

