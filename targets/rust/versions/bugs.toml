[[bug]]
id = "versions/2"
title = "`~` and `^` on general versions ignore the last component: `~1.2.3.4` matches `1.2.3.0` and `1.2.4.0`, `^1.2.3.4` matches `1.2.3.0`, `^1.2` matches `1.1`, and `~7`/`^7` match nothing — not even `7`"
kind = "correctness"
severity = "medium"
test = "general_tilde_and_caret_follow_the_documented_extension"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "A `Version` keeps its final component in the separate `last` field, and `Version::matches_tilde`/`matches_caret` (src/version.rs) only look at `chunks`, i.e. at every component but the last. Tilde is documented (`Requirement::matches_tilde`) as \"the last part of the version is greater than or equal\" with the rest equal; the code compares all-but-one of the *leading* chunks for equality and the final *leading* chunk with `>=`, never `last`: `~1.2.3.4` matches `1.2.3.0` (last 0 < 4) and `1.2.4.0` (third part differs) but that is by accident of the shifted index, and `~7`, `~1.2` (chunks `[]`/`[1]`) match nothing at all because `chunks.last()` is `None` → `false` — `Requirement::new(\"~7\").unwrap().matches(&Versioning::new(\"7\").unwrap())` is `false`. Caret zips `chunks` with `chunks` the same way: `^1.2.3.4` matches `1.2.3.0`, `^1.2` matches `1.1` (the last part is never compared), and the leading-zero rule is one-sided — `^0.1.2.3` matches `1.1.2.3` because a zero requirement part is skipped without looking at the candidate's part (the `SemVer` implementation checks both majors). Found by the first 100-case run (`~0` does not match `0`); the examples verified by probe."

