[[bug]]
id = "versions/8"
title = "`Version`'s derived `PartialEq`/`Hash` include the metadata that its `Ord` ignores: `Version::new(\"1.2.3+a\") != Version::new(\"1.2.3+b\")` but `cmp` is `Equal`"
kind = "correctness"
severity = "low"
test = "versions_order_totally"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/version.rs: `Version` derives `PartialEq, Eq, Hash` (all fields, `meta` included) while `Ord::cmp` compares epoch, chunks, last and release only — the field doc says \"Some extra metadata that doesn't factor into comparison\". `SemVer` avoids exactly this with a hand-written `PartialEq`/`Hash` (\"Two SemVers are equal if all fields except metadata are equal\"; \"k1 == k2 -> hash(k1) == hash(k2)\"), so `Versioning::Ideal` is consistent and `Versioning::General` is not: `Version::new(\"0+git123\") == Version::new(\"0\")` is false, `cmp` is `Equal`; `dedup`/`BTreeSet` behave differently from `==`. Found by the first 1 000-case run (`0+git123` vs `0`)."

