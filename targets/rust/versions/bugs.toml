[[bug]]
id = "versions/1"
title = "`Versioning::parse` stops after a `SemVer`/`Version` prefix, so `Requirement::new` rejects versions `Versioning::new` accepts: `^1.2.3.4`, `<10.1.22000.832`, `=1.2.3-1.el9_4` are `None`"
kind = "correctness"
severity = "medium"
test = "requirements_accept_every_versioning"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/fosskers/rs-versions/issues/31"
fixed_in = ""
notes = "src/versioning.rs `Versioning::parse` is `alt((SemVer::parse, Version::parse, Mess::parse))`: nom's `alt` takes the first parser that succeeds on a *prefix*, so `Versioning::parse(\"1.2.3.4\")` is `Ok((\".4\", Ideal(1.2.3)))` and `Versioning::parse(\"00\")` is `Ok((\"0\", General(0)))`, while `Versioning::new` (which tries each parser and demands an empty remainder) gives `General(1.2.3.4)` and `Complex(00)`. `Requirement::parse` is built on `Versioning::parse`, and `Requirement::new` demands an empty remainder, so every requirement whose version has a strict-looking prefix fails: `Requirement::new(\"^1.2.3.4\")`, `\"<10.1.22000.832\"`, `\"=1.2.3-1.el9_4\"`, `\"~1.2.3r1\"` are all `None` although `Versioning::new` parses each version, and `Requirement::parse(\"<=1.2.3.4\")` silently yields a requirement on `1.2.3`. Upstream #31 (open, 2025-03) and #33 (open, 2025-08, `10.1.22000.832`) report exactly this; not zoo-original. Fix: make `Versioning::parse` prefer the alternative that consumes the most input (or try them in `Mess`-last order with `all_consuming` in `new`)."

