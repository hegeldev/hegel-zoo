[[bug]]
id = "versions/4"
title = "A `SemVer` compares `Equal` to a general version whose last part is an RC or post-letter with the same number: `Versioning::new(\"1.2.3\") == \"1.2.3rc1\" == \"1.2.3b\" == \"1.2.3-alpha\"` by `cmp`, while `Version` orders `1.2.3rc1 < 1.2.3`"
kind = "correctness"
severity = "medium"
test = "versioning_orders_version_texts_like_version_does"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/semver.rs `SemVer::cmp_version`, the arm for a `Version` with two leading chunks: `Last::Rc(n, _, _) => self.patch.cmp(&n)`, `Last::Post(n, _) => self.patch.cmp(&n)` — only the number is compared, so `1.2.3` vs `1.2.3rc1` is `Equal`, although `Last`'s own `Ord` says \"RCs are always less than the true release\" (`Version::new(\"1.2.3rc1\") < Version::new(\"1.2.3\")`) and `SemVer::to_version` is documented lossless. The `SemVer`'s pre-release is ignored in that arm too, so `1.2.3-alpha` is also `Equal` to `1.2.3rc1` and to `1.2.3b`. As `Versioning` derives `PartialEq`, `==` says false where `cmp` says `Equal`, breaking the `Ord`/`Eq` contract; and sorting `[\"1.2.3\", \"1.2.3rc1\", \"1.2.3-alpha\"]` as `Versioning` leaves them in input order. Expected: `Less`/`Greater` per `Last`'s rule (then the `SemVer` pre-release against nothing). Found by the model comparison at 100 cases; the property compares `Versioning`'s order with `Version`'s on texts whose leading chunks are numeric."

