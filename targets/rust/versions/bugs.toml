[[bug]]
id = "versions/6"
title = "`Version::to_mess` builds a different `Mess` than `Mess::new` parses from the same text: an `rN` chunk becomes `Plain`, not `Rev` (so `1.2.r3 > 1.2.4_1` via `to_mess`, `<` via `Mess::new`), and a hyphenated release identifier `b-c` stays one `Plain` chunk"
kind = "correctness"
severity = "low"
test = "to_mess_builds_what_mess_parsing_builds"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/lib.rs `Chunk::mchunk`: `Chunk::Alphanum(s) => MChunk::Plain(s.clone())` — the author's FIXME above it asks \"having not accounted for an `r`?\" and notes it \"actually just came up in Aura\". `Mess::new(\"1.2.r3\")` gives `Rev(3, \"r3\")`, `Version::new(\"1.2.r3\").to_mess()` gives `Plain(\"r3\")`; `MChunk::cmp` ranks `Rev` below any `Digits` but compares `Plain` as text, so `to_mess(1.2.r3).cmp(Mess(1.2.4_1))` is `Greater` (`\"r3\" > \"4\"`) while `Mess(1.2.r3).cmp(Mess(1.2.4_1))` is `Less`. The cross-variant `Versioning` comparison General-vs-Complex uses `to_mess` when a position is not numeric, so `Versioning::new(\"1.2.r3\") > Versioning::new(\"1.2.4_1\")` although both parsed as `Mess` say the opposite. Likewise a release identifier with hyphens: `Version::new(\"a-b-c\")` (release chunk `b-c`) converts to `a` + Hyphen + `Plain(\"b-c\")`, while `Mess::new(\"a-b-c\")` is three groups `a`-`b`-`c`; they display alike and compare differently (`Plain(\"b-c\")` against a chain). `to_mess` is documented as \"a lossless conversion\". Found by the first 100-case run (`r0`); the hyphen case by the 1 000-case run (`a-b-c`)."

