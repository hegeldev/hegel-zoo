[[bug]]
id = "versions/7"
title = "`to_mess` drops the metadata: `Version::new(\"0+git123\").to_mess()` displays as `0`, and `SemVer::new(\"1.2.3+build\").to_mess()` as `1.2.3` (kept only when a pre-release is present) — both conversions are documented lossless"
kind = "correctness"
severity = "low"
test = "to_mess_keeps_the_metadata"
found = { commit = "3ae61d089e38", version = "8.0.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/version.rs `Version::to_mess_continued` builds the chunks, the `last` and the `-release` tail and never looks at `self.meta`: `Version::new(\"1.2.3.4+build\").unwrap().to_mess().to_string()` is `\"1.2.3.4\"`. src/semver.rs `SemVer::to_mess` builds the `+meta` tail *inside* the `pre_rel.as_ref().map(..)` closure, so it is attached only when there is a pre-release: `SemVer::new(\"1.2.3-r1+git123\")` (the doc example) round-trips, `SemVer::new(\"1.2.3+build\").unwrap().to_mess()` displays `\"1.2.3\"`, `\"0.0.0+00\"` → `\"0.0.0\"`. Both methods are documented as \"a lossless conversion\" (each doc example happens to carry a pre-release or no metadata). Metadata does not affect ordering, so the practical loss is in `Display`/round-tripping of converted values. Found by the first 100-case run (`0+git123`, `0.0.0+00`)."

