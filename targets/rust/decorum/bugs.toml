[[bug]]
id = "decorum/2"
title = "`to_canonical` collapses pairs of distinct `f64` subnormals into one canonical form, so `Total` (and `CanonicalEq`/`CanonicalHash`) call `5e-324` and `1.112536929253601e-308` equal while `Ord` orders them"
kind = "correctness"
severity = "medium"
test = "distinct_subnormals_are_not_equivalent"
found = { commit = "d25892e62610", version = "0.4.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/lib.rs:214–245 (`impl<T: Primitive> ToCanonical for T`): the canonical form is rebuilt from `integer_decode()` as `(mantissa & MANTISSA_MASK) | ((exponent << 52) & EXPONENT_MASK) | sign`, with `MANTISSA_MASK` = 52 bits. `integer_decode` for an `f64` subnormal returns the 52-bit fraction shifted left by one (lib.rs:343–345, `(bits & 0xf_ffff_ffff_ffff) << 1`, with the exponent lowered by one to compensate), so a fraction with bit 51 set becomes a 53-bit mantissa whose top bit the mask discards: subnormals `m` and `m + 2^51` (for every `m` in 1..2^51, either sign) get the same canonical bits. Observed: `f64::from_bits(1).eq_canonical(&f64::from_bits(0x0008_0000_0000_0001))` is true, `Total::from(5e-324) == Total::from(1.112536929253601e-308)` is true and both hash alike, while `Total::from(5e-324).cmp(&Total::from(1.112536929253601e-308))` is `Less` — `Eq` and `Ord` of `Total<f64>` are inconsistent (`HashSet<Total<f64>>` merges them, `sort` + `dedup` would not). The documented relation (cmp.rs module docs, hash.rs) coalesces only the zeros and the NaNs. Normal `f64` values and all `f32` values (whose 24-bit mantissa fits the mask) are canonicalised injectively; the wrong exponent shift (`exponent as u16`, a bijection modulo 2048) does not lose information. Not in the upstream tracker (#22, 2020, asked for `ToCanonicalBits` on proxies)."

[[bug.observed]]
version = "0.4.0"
commit = "d25892e62610"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "decorum/3"
title = "Real functions typed `-> Self` skip the constraint check: `E64::INFINITY.sin()`/`.cos()`/`.fract()`/`.sin_cos()` return a `NotNan` proxy holding NaN, and `R64::assert(711.0).sinh()`/`.cosh()` a `Real` proxy holding an infinity"
kind = "correctness"
severity = "medium"
test = "self_typed_functions_keep_the_constraint"
found = { commit = "d25892e62610", version = "0.4.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = "https://github.com/olson-sean-k/decorum/issues/11"
fixed_in = ""
notes = "`UnaryRealFunction` (src/real.rs:17–109) types some functions as `-> Self` and others as `-> Self::Codomain` (with comments `// Undefined.` / `// Floating-point exception.`); for proxies the `Self`-typed ones go through `map_unchecked` (src/proxy/constrained.rs:129–134, `Constrained::unchecked(f(self.into_inner()))`), which never re-checks the constraint (constrained.rs:1846–1873 `abs`/`floor`/`ceil`/`round`/`trunc`/`fract`, 1890 `cbrt`, 1935–1990 `to_radians`/`sin`/`cos`/`atan`/`sin_cos`/`sinh`/`cosh`/`tanh`). That is only sound when the function maps the constrained set into itself, and several do not: `f64::fract(±∞)`, `sin(±∞)`, `cos(±∞)`, `sin_cos(±∞)` are NaN (so an `IsExtendedReal`/`NotNan` proxy ends up containing NaN — the very value it exists to exclude), and `sinh(x)`/`cosh(x)` overflow to ±∞ for |x| ≥ 710.5 (so an `IsReal` proxy contains an infinity), for the `OrPanic` and the `OrError` divergences alike (`RealResult::assert(711.0).sinh()` is a `RealResult`, not a `Result`). Observed: `E64::<OrPanic>::assert(f64::NEG_INFINITY).sin()` = `ExtendedReal(NaN)`; `E64::INFINITY.fract()` = `ExtendedReal(NaN)`; `R64::assert(711.0).sinh()` = `Real(inf)`; the same proxies' `sqrt`, `ln`, `exp`, `tan`, `asin`, `to_degrees` and the arithmetic operators do check (they use `map`). Issue #11 (2018, closed) reported the same class of hole for `sqrt(-1)` into `NotNan`; the trigonometric and `fract` paths were not covered. Downstream, such a proxy breaks the guarantees the type stands for: `Total`-style total ordering is not implemented for `E64` (NaN compares via the primitive `partial_cmp` → `cmp_empty` returns `Err`), and `assert!(x == x)` fails for it."

[[bug.observed]]
