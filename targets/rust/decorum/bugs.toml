[[bug]]
id = "decorum/1"
title = "`UnaryRealFunction::is_one` for proxies is implemented as `is_zero`: `Total::ONE.is_one()` is false and `Total::ZERO.is_one()` is true"
kind = "correctness"
severity = "medium"
test = "is_one_means_equal_to_one"
found = { commit = "d25892e62610", version = "0.4.0", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "src/proxy/constrained.rs:1837–1839: `fn is_one(self) -> bool { self.into_inner().is_zero() }` in `impl<T, C> UnaryRealFunction for Constrained<T, C>` — a copy of `is_zero` two lines above. The primitive implementation (src/lib.rs:548) is `self == Self::ONE`, and the `num_traits::One::is_one` implementation for proxies is correct, so `One::is_one(&Total::ONE)` and `UnaryRealFunction::is_one(Total::ONE)` disagree. Affects every proxy (`Total`, `NotNan`/`E64`, `Real`/`R64`) and every primitive: `UnaryRealFunction::is_one(R64::assert(x))` is `x == 0.0` for all `x`. Found by the first run of `total_arithmetic_is_primitive_arithmetic` (a = 0.0). Not in the upstream tracker (13 issues in total, none about it)."

