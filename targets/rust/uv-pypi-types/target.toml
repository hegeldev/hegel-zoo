name = "uv-pypi-types"
language = "rust"
upstream = "https://github.com/astral-sh/uv"
subdir = "crates/uv-pypi-types"
license = "MIT OR Apache-2.0"
ai_policy_checked = "2026-09-14"

[base]
commit = "bf12c8e61b2dc73d848d2a32c28b73914902a547"
date = "2026-09-15"
version = "0.0.82"

[hegel]
version = "0.44.1"

[run]
setup = ["for py in python3 /usr/bin/python3; do $py -c 'import packaging.metadata, pyproject_metadata, packaging; assert int(packaging.__version__.split(\".\")[0]) >= 26' 2>/dev/null && exit 0; done; /usr/bin/python3 -m pip install --user --break-system-packages --upgrade packaging pyproject-metadata"]
command = "cargo test --no-fail-fast"

[expected_failures]
"dynamic_field_names_are_case_insensitive" = "uv-pypi-types/1"
"lenient_fixups_handle_multi_digit_components" = "uv-pypi-types/2"
