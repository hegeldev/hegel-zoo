[[bug]]
id = "uv-pypi-types/1"
title = "`Dynamic` field names are matched case-sensitively: a PKG-INFO with `Dynamic: requires-dist` is read as static metadata"
kind = "wrong-result"
severity = "medium"
test = "dynamic_field_names_are_case_insensitive"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`ResolutionMetadata::parse_pkg_info` refuses to trust a source distribution's `PKG-INFO` when
`Requires-Dist`, `Requires-Python` or `Provides-Extra` is listed in `Dynamic` (PEP 643: a
dynamic field's recorded value "MUST NOT" be treated as canonical), and `parse_metadata`/
`parse_pkg_info` set `dynamic` when `Version` is. Both compare the `Dynamic` values with
`field == "Requires-Dist"` etc. — exact case. Core-metadata field names are case-insensitive
(the format is email headers), `packaging.metadata` lowercases the `Dynamic` values before
checking them (`_process_dynamic`: `list(map(str.lower, value))`), and PEP 621's `dynamic`
list — which build backends copy into `Dynamic` — spells the names in lowercase (setuptools
writes e.g. `Dynamic: license-file`). So `Dynamic: requires-dist` / `Dynamic: REQUIRES-DIST`
/ `Dynamic: version` are ignored: the PKG-INFO's (possibly empty) `Requires-Dist` is used as
the package's static requirements, and the version is reported as static. Medium: wrong
resolution metadata for sdists whose backend spells `Dynamic` in lowercase.
"""

