[[bug]]
id = "uv-pypi-types/2"
title = "Lenient fix-ups for `!=3.0*` and `!=~5.0` match single-digit components only: `!=3.10*` and `!=~5.10` are not repaired"
kind = "contract"
severity = "low"
test = "lenient_fixups_handle_multi_digit_components"
found = { commit = "c0df400a4cf4aad88f7f34bb2ac3ebb5a8f3839e", version = "0.0.80", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LenientVersionSpecifiers`/`LenientRequirement` document a fix-up "Given `!=3.0*`, rewrite to
`!=3.0.*`" implemented as `(\\d\\.\\d)+\\*` → `${1}.*`, and "Given `!=~5.0,>=4.12`, rewrite to
`!=5.0.*,>=4.12`" implemented as `!=~((?:\\d\\.)*\\d)` → `!=${1}.*`. Both patterns take exactly
one digit per component, so the same mistakes with a two-digit component are not repaired:
`!=3.10*` fails with "after parsing `3.10`, found `*`", `!=~5.10,>=4` fails with "invalid
operator `!=~`" (the tilde pattern matches `5.1` and leaves `.*0` behind). The other fix-ups
(`>=1.10.*`, `>=9.0.0a10.0`, missing commas) handle multi-digit components. Low: heuristics for
malformed metadata; the single-digit cases they were written for work.
"""

