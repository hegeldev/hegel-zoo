# Three preservation gaps in toml_edit, none a predecessor TROPHIES.md row: the predecessor's
# HEGEL_REPORT.md for toml pins the first with the KNOWN FAILURE test edit::crlf_line_endings_are_preserved
# (crates/toml_edit/tests/testsuite/edit.rs) and documents the other two as generator exclusions of
# property 14 (byte-identical display). Recorded from that report when imported (2026-09-12).

[[bug]]
id = "toml/1"
title = "toml_edit silently rewrites CRLF line endings in decor to LF on display: \"a = 1\\r\\n\".parse::<DocumentMut>().unwrap().to_string() returns \"a = 1\\n\" — RawString::encode/encode_with_default (crates/toml_edit/src/raw_string.rs:88,102) write raw spans via for part in raw.split('\\r'), so editing one value rewrites every line ending of a Windows-style file; CRLF inside string values is preserved"
kind = "roundtrip"
severity = "medium"
test = "edit::crlf_line_endings_are_preserved"
found = { commit = "a0c14f4b6a46", version = "", hegel = "0.28.2", date = "2026-07-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Predecessor report, suspected bug 1 (not a trophy row). The split('\\r') loop is deliberate code (span refactor 772f2cf0, 2022) but undocumented and contradicts the crate's format-preservation promise (lib.rs example asserts doc.to_string() == toml); may be intended normalization — raise upstream as a question. Pin: edit::crlf_line_endings_are_preserved."

[[bug.observed]]
version = ""
