kind = "roundtrip"
severity = "low"
test = ""
found = { commit = "a0c14f4b6a46", version = "", hegel = "0.28.2", date = "2026-07-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Predecessor report, suspected bug 2 (not a trophy row). Not pinned: property 14's generator always terminates documents (comment references this). Very likely intended; worth documenting upstream."

