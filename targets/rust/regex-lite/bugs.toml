commit = "72d650cb0a88"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"

[[bug]]
id = "regex-lite/2"
title = "A negated POSIX class is negated before `(?i)` case folding, so `(?i)[[:^lower:]]` matches every letter while the documented equivalent `(?i)[^a-z]` (and the `regex` crate) matches none"
kind = "differential"
severity = "low"
test = "known_bug_case_insensitive_negated_posix_class"
found = { commit = "72d650cb0a88", version = "0.1.9", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by the zoo's differential tests against the `regex` crate (`(?i)[[:^lower:]]` on \"A\": regex-lite matches, regex does not). `maybe_parse_posix_class` (src/hir/parse.rs) applies the `^` of `[:^name:]` to the class immediately; the enclosing bracket then case-folds the union, which adds `a-z` back to \"anything but a-z\" — the class becomes everything. The bracket-level negation `[^...]` is deliberately folded first (comment: \"we must apply case folding before negation\"), so `(?i)[^a-z]` correctly excludes all letters — yet the docs define `[[:^lower:]]` as `[^a-z]`. Only `[:^lower:]` and `[:^upper:]` are affected (every other POSIX class is closed under case folding). `(?i)[^[:^lower:]]` is wrong the other way round (matches no letter; regex matches all)."

[[bug.observed]]
version = "0.1.9"
commit = "72d650cb0a88"
hegel = "0.44.1"
date = "2026-09-13"
result = "reproduces"
