[[bug]]
id = "regex-lite/1"
title = "Case-insensitive bracket ranges that span both letter cases fold only their lowercase part: `(?i)[A-a]` does not match `b`..`z` (and `(?i)[^A-a]` does), unlike the `regex` crate"
kind = "differential"
severity = "medium"
test = "known_bug_case_insensitive_range_spanning_cases"
found = { commit = "72d650cb0a88", version = "0.1.9", hegel = "0.44.1", date = "2026-09-13" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by the zoo's differential tests against the `regex` crate (property `find_agrees_with_regex` drew `(?i:[A-a])` on \"b\"). `ClassRange::ascii_case_fold` in src/hir/mod.rs returns a single folded range: if the range intersects `a-z` it folds that part and returns early, so the `A-Z` part of a range that covers both — `[A-a]`, `[Z-a]`, `[0-a]`, `[?-a]` — is never lower-cased. `(?i)[A-a]` matches `B` but not `b`, `(?i)[Z-a]` matches `Z`, `a`, `A` but not `z`; the negations `(?i)[^A-a]`, `(?i)[^Z-a]` match `b`..`z` / `z` although they should not. Ranges within one case (`[A-Z]`, `[a-z]`), ranges already covering both cases (`[A-z]`) and POSIX classes fold correctly. The `regex` crate (and regex-syntax's `case_fold_simple`) fold both halves. No report found in rust-lang/regex."

[[bug.observed]]
