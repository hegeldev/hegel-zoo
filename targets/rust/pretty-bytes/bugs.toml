# Bugs found in pretty-bytes by the zoo's Hegel tests (tests/hegel.rs in hegel.patch).
# The oracle is arithmetic: `<mantissa> <unit>` with mantissa × 1000^unit = num to two decimals
# and the mantissa in [1, 1000).

[[bug]]
id = "pretty-bytes/1"
title = "a size that rounds up to 1000 keeps the smaller unit: `999999` is `1000 kB`, not `1 MB`"
kind = "wrong-result"
severity = "medium"
test = "mantissa_stays_below_1000"
found = { commit = "10790215fe5bee1aa1a08ba20002ef81277c3791", version = "0.2.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`convert` picks the unit from `num.ln() / 1000.ln()` before rounding, then prints the mantissa
with `{:.2}`: for any size in [999.995, 1000) × 1000^k the mantissa rounds to `1000.00` and the
unit stays one too small — `convert(999.995)` is `1000 B`, `convert(999_999.0)` is `1000 kB`,
`convert(999_999_999.0)` is `1000 MB`, where `1 kB`, `1 MB`, `1 GB` are the readable forms
(and what `convert(1_000_000.0)` prints).  The original JavaScript (pretty-bytes 4.x,
`toPrecision(3)`) has the same seam; the fix is to round first and bump the exponent when the
rounded mantissa reaches 1000 (`1000 YB` at the top is right — there is no larger unit).
"""

[[bug]]
id = "pretty-bytes/2"
title = "`convert(-0.0)` is `-0 B`"
kind = "wrong-result"
severity = "low"
test = "negative_zero_is_zero"
found = { commit = "10790215fe5bee1aa1a08ba20002ef81277c3791", version = "0.2.2", hegel = "0.44.1", date = "2026-09-14" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The sign is taken from `num.is_sign_positive()`, which is false for `-0.0`, so a zero that
arrived with the sign bit set (`-1.0 * 0.0`, `0.0 * -x`, a rounded-away negative delta) prints
as `-0 B`.  The original pretty-bytes tests `num < 0`, which is false for -0, and prints `0 B`; a
byte count of zero has no sign.
"""
