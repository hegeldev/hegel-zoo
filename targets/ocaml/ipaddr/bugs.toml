[[bug]]
id = "ipaddr/1"
title = "V4.Prefix.subnets on 0.0.0.0/0 yields only the first subnet"
kind = "contract"
severity = "low"
test = "subnets"
found = { commit = "8332fff3deda", version = "v5.6.2", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Ipaddr.V4.Prefix.subnets 1 (Ipaddr.V4.Prefix.of_string_exn "0.0.0.0/0")
has 1 element (0.0.0.0/1), not 2; subnets 2 likewise gives 1, not 4.
The step between subnets is (hostmask + 1) >|> (n - bits); for a /0 the
hostmask is 0xffffffff, so the step wraps to 0 and the sequence stops
after its first element. V6.Prefix.subnets on ::/0 is right.
"""

[[bug.observed]]
version = "v5.6.2"
commit = "8332fff3deda"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "ipaddr/2"
title = "IPv6 parsing accepts a group of more than four hex digits when the extra ones are leading zeros"
kind = "contract"
severity = "low"
test = "of_string"
found = { commit = "8332fff3deda", version = "v5.6.2", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Ipaddr.V6.of_string "::00001" is Ok ::1, "::0000000001" too, and
"1:2:3:4:5:6:7:00008" reads as 1:2:3:4:5:6:7:8; RFC 4291 2.2 allows one to
four hex digits per group, and Python's ipaddress rejects all three. A group
of five significant digits ("::10000") is rejected. Prefix.of_string
accepts "::00000/0" the same way.
"""

[[bug.observed]]
version = "v5.6.2"
commit = "8332fff3deda"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"
