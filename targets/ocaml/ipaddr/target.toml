name = "ipaddr"
language = "ocaml"
upstream = "https://github.com/mirage/ocaml-ipaddr"
license = "ISC"
ai_policy_checked = "2026-10-09"

[base]
commit = "8332fff3deda91b231c6f90c03b8aba5c355f0c9"
date = "2026-02-19"
version = "v5.6.2"

[hegel]
version = "0.26.1"

[run]
# hegel links the installed ipaddr, so the tests are a dune project of their own that builds the
# checked-out sources under another name; Python 3.13+ is the oracle
command = "dune exec --root hegel --display quiet -- ./zoo_tests.exe"

[expected_failures]
"of_string" = "ipaddr/2"
"prefix_of_string" = "ipaddr/2"
"pin_overlong_v6_group" = "ipaddr/2"
"subnets" = "ipaddr/1"
"pin_v4_subnets_of_default_route" = "ipaddr/1"
