version = "v0.18~preview.130.106+341"
commit = "62384b1e1e54"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "core/3"
title = 'Bigbuffer.add_substitute drops a trailing backslash: the OCaml pattern "a\\" gives "a"'
kind = "silent-corruption"
severity = "low"
test = "bigbuffer_add_substitute_backslash"
found = { commit = "62384b1e1e542b33c9f7c6012ecc53e66299af03", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
let b = Bigbuffer.create 8 in Bigbuffer.add_substitute b Fun.id "a\\"  (* contents "a" *)
"$x\\" with f = fun v -> "<" ^ v ^ ">" gives "<x>". A backslash is held back until the next
character shows whether it escapes a $; at the end of the pattern it is never written.
Stdlib.Buffer.add_substitute, whose code and documentation this copies, gives "a\\".
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "62384b1e1e54"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "core/4"
title = "Bigbuffer.add_substitute takes the text after a $ as a variable name even when it does not start with an alphanumeric, and raises Invalid_argument \"index out of bounds\" on a trailing $"
kind = "contract"
severity = "low"
test = "bigbuffer_add_substitute_dollar"
found = { commit = "62384b1e1e542b33c9f7c6012ecc53e66299af03", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
With f = fun v -> "<" ^ v ^ ">":
add_substitute b f "cost: 5$-ish"  (* "cost: 5<-ish>" *)
add_substitute b f "a$ b"          (* "a< b>" *)
add_substitute b f "a$"            (* raises Invalid_argument "index out of bounds" *)
The documentation says a variable name is a non-empty sequence of alphanumerics or _, or a
parenthesized one, and that only an unclosed parenthesis raises (Not_found). find_ident takes the
character after the $ unconditionally and reads s.[i + 1] past the end. Stdlib.Buffer.add_substitute
keeps "$-ish", "$ b" and a trailing "$" as written.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "62384b1e1e54"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "core/5"
title = "Time_ns.Span.to_parts, to_unit_of_time and to_short_string are wrong for Span.min_value_representable: to_short_string gives \"--904ns\""
kind = "wrong-result"
severity = "low"
test = "span_ns_parts"
found = { commit = "62384b1e1e542b33c9f7c6012ecc53e66299af03", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
let m = Time_ns.Span.min_value_representable in
Time_ns.Span.to_parts m          (* hr = -1281023, min = -53, ..., ns = -904 *)
Time_ns.Span.to_unit_of_time m   (* Nanosecond *)
Time_ns.Span.to_short_string m   (* "--904ns" *)
Time_ns.Span.to_string_hum m     (* "-4_611_686_018_427_387_904ns" *)
Parts documents its fields as non-negative and to_unit_of_time as Day when abs t >= day; both
compute Int63.abs t, which is min_value itself. Span.next m gives "-53375d" as expected.
'''

