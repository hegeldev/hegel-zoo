[[bug]]
id = "core/1"
title = "Date.of_string reads a four-digit m/d/y year below 100 as a two-digit year: 02/01/0050, which Date.to_string_american prints for 0050-02-01, reads as 2050-02-01"
kind = "contract"
severity = "low"
test = "date_printers_roundtrip"
found = { commit = "62384b1e1e542b33c9f7c6012ecc53e66299af03", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
Date.of_string (Date.to_string_american (Date.create_exn ~y:50 ~m:Feb ~d:1))  (* 2050-02-01 *)
Date.of_string "0050/02/01"  (* 2050-02-01; "0050-02-01" reads as year 50 *)
Date.of_string "02/01/-1"    (* 1999-02-01 *)
The m/d/y and y/m/d branch reads the year with Int.of_string and maps any value below 100 to
19xx/20xx, whatever its width, so the printer's own output for years 0-99 does not read back,
and a negative year is accepted as 19xx.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "62384b1e1e54"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "core/2"
title = "Time_ns.Span.of_string accepts a lone sign: \"-\" and \"+\" read as 0s"
kind = "contract"
severity = "low"
test = "span_ns_rejects_malformed"
found = { commit = "62384b1e1e542b33c9f7c6012ecc53e66299af03", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
Time_ns.Span.of_string "-"  (* 0s *)
Time_ns.Span.of_string "+"  (* 0s *)
Time_ns.Span.of_string ""   (* raises "empty string" *)
Time_float.Span.of_string "-"  (* raises "empty input" *)
The parser rejects the empty string but, after consuming a sign, loops over zero parts and
returns zero. The documented grammar is one or more (number)(unit) parts after the sign.
'''

