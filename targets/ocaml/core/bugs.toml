[[bug]]
id = "core/6"
title = "Span.to_short_string uses more than the documented five characters (six when negative) for spans of 10000 days or more"
kind = "contract"
severity = "low"
test = "span_ns_short_string"
found = { commit = "62384b1e1e542b33c9f7c6012ecc53e66299af03", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
Time_ns.Span.to_short_string (Time_ns.Span.of_day 10000.)      (* "10000d" *)
Time_float.Span.to_short_string (Time_float.Span.of_day 12345.)  (* "12345d" *)
The interface promises "no more than five characters if the span is positive, and six if the
span is negative". Span_helpers.short_string prints the whole number of days, which needs more
from 10000 days (about 27 years) up.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "62384b1e1e54"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

