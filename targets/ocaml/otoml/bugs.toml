[[bug]]
id = "otoml/12"
title = "in a multi-line literal string, a backslash before the final newline is taken as a line continuation and both are dropped"
kind = "silent-corruption"
severity = "low"
test = "pin_multiline_literal_backslash_newline"
found = { commit = "04e6370e8e5c3b83a476c2b64abe7afdc7c15961", version = "1.0.5", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = "a = '''x'a\\<LF>''' reads as \"x'a\"; the content is x'a\\<LF>. Literal strings have no escapes. read_single_quoted_multiline_string in src/lib/toml_lexer.mll carries the basic-string rule '\\\\' [' ' '\\t' '\\n']* '\\n'; it fires when the backslash starts a lexer token, as after the ''' [^ '''] alternative consumes an apostrophe and one character, and when nothing else follows before the closing delimiter. tomllib reads x'a\\<LF>. Found by reads_like_tomllib at 1000 test cases."

