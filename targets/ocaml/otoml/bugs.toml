[[bug]]
id = "otoml/10"
title = "the printer writes a key that follows an array of tables under the [[array]] header, moving it into the array's last element"
kind = "silent-corruption"
severity = "high"
test = "pin_key_after_array_of_tables"
found = { commit = "04e6370e8e5c3b83a476c2b64abe7afdc7c15961", version = "1.0.5", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = "Otoml.Printer.to_string (TomlTable [\"a\", TomlTableArray [TomlTable []]; \"b\", TomlInteger 1]) = \"\\n[[a]]\\nb = 1\\n\", which reads as a = [{b = 1}]. Ordinary tables are moved after the key/value pairs, arrays of tables are not; force_table_arrays turns an inline array of tables into the same shape, and an empty table printed inline after an array of tables is captured the same way. A document built with Otoml.update, which appends keys, reaches this. Found by printer_output_reads_back and printer_output_is_toml."

