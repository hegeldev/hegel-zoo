[[bug]]
id = "otoml/1"
title = "the printer writes floats with two decimals (%.2f): 0.001 prints as 0.00, 1e300 as a 301-digit integer part"
kind = "roundtrip"
severity = "high"
test = "printer_output_reads_back"
found = { commit = "04e6370e8e5c3b83a476c2b64abe7afdc7c15961", version = "1.0.5", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = "Otoml.Printer.to_string (Otoml.table [\"a\", Otoml.float 0.001]) = \"a = 0.00\\n\"; reading it back gives 0.0. OCamlNumber.float_to_string in src/lib/default_impl.ml formats finite floats with Printf \"%.2f\", so every float that is not a multiple of 0.01 changes on a print/parse round trip and tomllib reads the printed value differently too. Pin: pin_float_printed_to_two_places."

[[bug.observed]]
version = "1.0.5"
commit = "04e6370e8e5c"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "otoml/2"
title = "hexadecimal, octal and binary integers beyond OCaml's int wrap silently: 0x7fffffffffffffff reads as -1"
kind = "silent-corruption"
severity = "high"
test = "big_integers_are_rejected"
found = { commit = "04e6370e8e5c3b83a476c2b64abe7afdc7c15961", version = "1.0.5", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = "Otoml.Parser.from_string \"a = 0x7fffffffffffffff\" gives TomlInteger (-1); 0x4000000000000000 gives -4611686018427387904, 0o777777777777777777777 gives -1. TOML 1.0: \"If an integer cannot be represented losslessly, an error must be thrown.\" The lexer hands the literal to int_of_string, which accepts prefixed literals up to 2*max_int+1 and wraps them; decimal literals beyond max_int fail int_of_string and come back as an error. Pin: pin_hex_integer_wraps."

