[[bug]]
id = "otoml/5"
title = "a multi-line string whose whole content is one or two quote characters is rejected"
kind = "contract"
severity = "low"
test = "reads_like_tomllib"
found = { commit = "04e6370e8e5c3b83a476c2b64abe7afdc7c15961", version = "1.0.5", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = "Rejected, all valid: a = ''''''' (the string ') and a = '''''''' (''), and the basic forms with seven and eight double quotes. The ABNF lets mll-quotes / mlb-quotes (one or two quotes) stand next to either delimiter, and the spec's own examples put them next to the closing one; tomllib reads them. otoml reads ''''a''' and '''a'''' correctly, so only content made of quotes alone fails. Pin: pin_multiline_string_of_one_quote."

