[[bug]]
id = "otoml/8"
title = "multi-line literal strings reject CRLF newlines, including the trimmed one after the opening delimiter"
kind = "contract"
severity = "medium"
test = "pin_multiline_literal_crlf"
found = { commit = "04e6370e8e5c3b83a476c2b64abe7afdc7c15961", version = "1.0.5", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = "Rejected, both valid: a = '''<CR><LF>x''' and a = '''x<CR><LF>y''' (\"character '\\r' is not allowed inside a string literal without escaping\"). TOML 1.0 defines newline as LF or CRLF, and \"A newline immediately following the opening delimiter will be trimmed.\" The single-quoted multi-line rules in src/lib/toml_lexer.mll treat \\r as a forbidden control character; the double-quoted ones accept it. tomllib reads 'x' and 'x\\ny'. Found by reads_like_tomllib on documents written with CRLF line endings."

