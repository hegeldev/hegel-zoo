[[bug]]
id = "base64/1"
title = "decode with ~pad:true accepts a run of four or more '=' after whole quanta and ignores it"
kind = "contract"
severity = "low"
test = "decode_agrees_with_python"
found = { commit = "08f3445206c6", version = "v3.5.2+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Base64.decode "QUJD====" is Ok "ABC", Base64.decode "====" is Ok "" and
Base64.decode "=====" is Ok ""; "QUJD========" is Ok "ABC" too. With ~pad:true
(the default) the input must be correctly padded, and RFC 4648 has no
quantum made only of padding; Python's binascii.a2b_base64(strict_mode=True)
rejects all of them ("Excess padding not allowed", "Leading padding not
allowed"). A padding-only quantum sets pad = 4, which decode_sub treats as
end of input (only_padding then accepts any further run of '='). Upstream's
own tests reject "YWE==" and "YWE=====" but have no case of a whole '====' quantum.
"""

[[bug.observed]]
version = "v3.5.2+"
commit = "08f3445206c6"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "base64/2"
title = "decode with ~pad:true accepts a final quantum of one character and three '=' and drops the character"
kind = "contract"
severity = "low"
test = "final_quantum_agrees_with_python"
found = { commit = "08f3445206c6", version = "v3.5.2+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Base64.decode "Z===" is Ok "" and Base64.decode "QUJDZ===" is Ok "ABC": the 'Z'
carries six bits, not a byte, so "X===" is no valid quantum (RFC 4648 4:
the final quantum is 2 or 3 characters plus padding), yet it is accepted and
the character silently discarded. Python's strict_mode decoder rejects it
("number of data characters (1) cannot be 1 more than a multiple of 4").
"""

[[bug.observed]]
version = "v3.5.2+"
commit = "08f3445206c6"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "base64/3"
title = "Base64_rfc2045 encoder with a `Manual destination of fewer than 6 bytes corrupts its output"
kind = "silent-corruption"
severity = "low"
test = "rfc2045_encode_agrees_with_python"
found = { commit = "08f3445206c6", version = "v3.5.2+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Driving Base64_rfc2045.encoder `Manual as documented (dst a buffer, collect
size - dst_rem on each `Partial, then `Await until `Ok; `End last) gives
"Zm9v\000YmFy" for "foobar" with a 1- or 2-byte buffer, "Zm9" for "foo" with
a 3-byte buffer, and a stray NUL after a line break with 4 or 5 bytes; from 6
bytes up the output is right. A quantum or line break that does not fit the
space left goes through the 4-byte temporary buffer t: t_range sets t_len to
the count (4, or 2) where t_flush takes it as the last index
(len = t_len - t_pos + 1), so one byte past the end of t is copied out, and
the bytes t_flush leaves in a fresh buffer are not flushed by `End.
'''

[[bug.observed]]
version = "v3.5.2+"
commit = "08f3445206c6"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"
