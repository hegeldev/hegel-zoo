[[bug]]
id = "decompress/9"
title = "the zlib decoder passes CINFO above 7 to allocate, which raises Invalid_argument"
kind = "panic"
severity = "medium"
test = "corrupt_zlib_agrees_with_zlib"
found = { commit = "d0e44781ed32", version = "v1.6.1+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
A zlib stream starting "\xf8\x00" (CINFO 15) makes Zl.Inf call allocate
with 23 before it checks the header; the allocate the docs recommend,
De.make_window ~bits, raises Invalid_argument "bits MUST be between 8 and 15
(23)" out of Zl.Inf.decode / Zl.Higher.uncompress. RFC 1950 2.2 forbids CINFO
above 7; zlib reports "invalid window size". Pin:
pin_cinfo_above_7_is_malformed.
'''

[[bug.observed]]
version = "v1.6.1+"
commit = "d0e44781ed32"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

