hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "decompress/3"
title = "the gzip decoder rejects a correct FHCRC header CRC"
kind = "contract"
severity = "medium"
test = "inflate_gzip_from_python"
found = { commit = "d0e44781ed32", version = "v1.6.1+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
1f 8b 08 02 00000000 00 03 a7 77 then a stored "hello" member: Python's
zlib (wbits 31, which checks the CRC) reads it, Gz.Inf reports `Malformed
"Invalid GZip header checksum"`. RFC 1952 2.3.1: CRC16 is the two least
significant bytes of the CRC-32 of the header, stored least significant
first; fhcrc takes the upper 16 bits, reads them big-endian, and leaves the
extra field out of the CRC. Pin: pin_header_crc_accepted.
'''

[[bug.observed]]
version = "v1.6.1+"
commit = "d0e44781ed32"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "decompress/4"
title = "the gzip encoder writes a wrong FHCRC header CRC"
kind = "contract"
severity = "medium"
test = "python_inflates_gz"
found = { commit = "d0e44781ed32", version = "v1.6.1+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Gz.Def.encoder ~hcrc:true ~mtime:0l Gz.Unix on "hello" writes the header
1f8b0802 00000000 0003 with CRC16 bytes that are not a7 77 (the low 16 bits
of the CRC-32 of those 10 bytes, least significant first); zlib.decompress(z,
31) fails with "header crc mismatch". Pin: pin_header_crc_written.
'''

[[bug.observed]]
version = "v1.6.1+"
commit = "d0e44781ed32"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

