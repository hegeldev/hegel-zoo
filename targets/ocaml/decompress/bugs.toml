[[bug]]
id = "decompress/1"
title = "the gzip decoder reads XLEN big-endian, so a member with an extra field fails or misparses"
kind = "contract"
severity = "high"
test = "inflate_gzip_from_python"
found = { commit = "d0e44781ed32", version = "v1.6.1+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
A gzip member with FEXTRA set and XLEN = 5 ("\x05\x00", one subfield AB of
one byte) decodes to `Malformed "Unexpected end of input"` (Gz.Inf with a
`String source), where Python's gzip and zlib read "hello". Gz.Inf.fextra
reads XLEN with unsafe_get_uint16_be; RFC 1952 2.1 stores every multi-byte
number least significant byte first. Every BGZF or dictzip file carries an
extra field. Pin: pin_xlen_little_endian.
'''

[[bug.observed]]
version = "v1.6.1+"
commit = "d0e44781ed32"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

