[[bug]]
id = "decompress/12"
title = "the gzip decoder fails unless the whole header and one more byte come in the first input chunk"
kind = "contract"
severity = "high"
test = "inflate_gzip_from_python"
found = { commit = "d0e44781ed32", version = "v1.6.1+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Gz.Inf.decoder `Manual fed gzip.compress(b"hello hello") (10-byte header) in
chunks of 1, 2, 5, 9 or 10 bytes ends in `Malformed "Unexpected end of
input"; 11 bytes and up work. With an FNAME ("name.txt", a 19-byte header)
chunks of up to 9 and of 19 fail the same way, and chunks of 10 raise
Invalid_argument "Out of bounds (off: 11, len: -1)". header needs i_rem >= 10
in one buffer and never accumulates across src calls. Python's
zlib.decompressobj(31) reads every chunking. Pin:
pin_gzip_header_in_one_byte_chunks.
'''

[[bug.observed]]
