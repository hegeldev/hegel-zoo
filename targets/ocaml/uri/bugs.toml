[[bug]]
id = "uri/3"
title = "resolve keeps leading .. segments of a path that is not rooted: s:a/b with ../../g gives s:../g, RFC 3986 gives s:g"
kind = "contract"
severity = "low"
test = "resolve_matches_rfc3986"
found = { commit = "46979cf180be86b2a8bd0f55767bef9f436780ec", version = "v4.4.0+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
Uri.to_string (Uri.resolve "" (Uri.of_string "s:a/b") (Uri.of_string "../../g"))  (* "s:../g" *)
Uri.to_string (Uri.resolve "" (Uri.of_string "a:") (Uri.of_string ".."))         (* "a:../" *)
Uri.to_string (Uri.resolve "" (Uri.of_string "http://a/b") (Uri.of_string "s:a/../../g"))
  (* "s:../g": a reference with its own scheme and a rootless path, too *)
RFC 3986 5.2.4 removes every ".." it cannot pop; Path.remove_dot_segments re-emits them as "../"
when the merged path is relative.
'''

[[bug.observed]]
version = "v4.4.0+"
commit = "46979cf180be"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "uri/4"
title = "resolve normalises the result's host with the base's scheme rules: against a file: base, http://localhost/x resolves to http:///x"
kind = "contract"
severity = "medium"
test = "resolve_keeps_reference_host"
found = { commit = "46979cf180be86b2a8bd0f55767bef9f436780ec", version = "v4.4.0+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
Uri.to_string (Uri.resolve "" (Uri.of_string "file:///a") (Uri.of_string "http://localhost/x"))
  (* "http:///x": the host is erased *)
Uri.to_string (Uri.resolve "" (Uri.of_string "http://h/") (Uri.of_string "foo://Host/x"))
  (* "foo://host/x" *)
resolve calls normalize with the base's scheme even when the reference brings its own, so File's
"localhost" -> "" rule (and Http's lowercasing) is applied to a host of another scheme.
'''

[[bug.observed]]
version = "v4.4.0+"
commit = "46979cf180be"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "uri/5"
title = "a path segment that is exactly %2F is decoded into a separator: http://h/a/%2F/b prints as http://h/a///b, and %2F/ as // (an empty authority)"
kind = "silent-corruption"
severity = "medium"
test = "path_keeps_its_segments"
found = { commit = "46979cf180be86b2a8bd0f55767bef9f436780ec", version = "v4.4.0+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
Uri.path (Uri.of_string "http://h/a/%2F/b")   (* "/a///b"; "/a/%2F/b" keeps the segments *)
Uri.to_string (Uri.of_string "%2F/")         (* "//": the relative path now reads as an authority *)
Uri.to_string (Uri.of_string "%2F")          (* "/": a relative path became absolute *)
Path.path_of_encoded splits on "/" and then percent-decodes each token, so a segment "%2F" becomes
the token "/", which the path's representation reserves for separators. A segment containing more
than the slash ("a%2Fb") is re-encoded and survives.
'''

[[bug.observed]]
version = "v4.4.0+"
commit = "46979cf180be"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"
