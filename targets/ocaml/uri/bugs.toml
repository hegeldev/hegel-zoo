[[bug]]
id = "uri/1"
title = "a host that begins with a dotted quad is cut to the IPv4 address and the rest moved into the path: http://10.0.0.1.nip.io/ has host 10.0.0.1 and path .nip.io/"
kind = "contract"
severity = "high"
test = "components_match_appendix_b"
found = { commit = "46979cf180be86b2a8bd0f55767bef9f436780ec", version = "v4.4.0+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
reproducer = '''
Uri.host (Uri.of_string "http://10.0.0.1.nip.io/")  (* Some "10.0.0.1"; RFC 3986: "10.0.0.1.nip.io" *)
Uri.host (Uri.of_string "http://1.2.3.4x/p")        (* Some "1.2.3.4", path "x/p" *)
The host parser tries ipv4_address first and commits to it once it matches a prefix; the rest of
the reg-name falls through to the path parser. A check of the host before a request (an allow-list
of addresses, say) sees a different host from the one a resolver given the whole string would use.
Also seen as string_roundtrip: of_string "//0.0.0.0A" has a rootless path under a host, which
to_string prints with a "/" that the reparse keeps.
'''

[[bug.observed]]
version = "v4.4.0+"
commit = "46979cf180be"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

