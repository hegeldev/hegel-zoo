[[bug]]
id = "sexplib/1"
title = "load_sexp rejects a file whose one S-expression is followed by a sexp comment over an atom at the end of the file"
kind = "contract"
severity = "low"
test = "load_sexp_reads_one"
found = { commit = "f7dd083f44502b5ff25eaf15dd546090cd932358", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
A file containing "a #;b" (no newline at the end): Sexp.load_sexp raises
Failure "Sexplib.Sexp.gen_load_sexp: additional incomplete data in state Parsing_sexp_comment ...";
Sexp.of_string "a #;b" and Sexp.load_sexps give a. Annotated.load_sexp and load_sexp_conv fail
alike. The strict check after the first S-expression accepts only the
Parsing_toplevel_whitespace state at end of file, without feeding the trailing space that
of_string uses to end an atom, so the atom under #; is never finished.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "f7dd083f4450"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "sexplib/2"
title = "input_sexp swallows the character that ends an atom: on a(b) the next input_sexp reads b and the ) is lost too"
kind = "silent-corruption"
severity = "medium"
test = "input_sexp_leaves_the_rest"
found = { commit = "f7dd083f44502b5ff25eaf15dd546090cd932358", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
On a channel holding "a(b)", Sexp.input_sexp gives a and the next input_sexp gives b (the "("
is gone). After "a;c\n" the comment's text c is read as an atom, after "a\"b\"" the next read
gives the atom b, and after "a)" the ")" vanishes. Annotated.input_sexp does the same. The
documentation guarantees that input_sexp "is only going to read data parseable as an
S-expression. Thus, subsequent input functions will see the data immediately following it."
The parser only learns that an atom has ended from the next character, which input_sexp has
already taken from the channel and drops with the parser state.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "f7dd083f4450"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "sexplib/3"
title = "Path.parse wraps an index past max_int round: .[9223372036854775809] selects element 1"
kind = "contract"
severity = "low"
test = "path_get_matches_model"
found = { commit = "f7dd083f44502b5ff25eaf15dd546090cd932358", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Path.get ~str:".[9223372036854775809]" (Sexp.of_string "(a b c)") gives b, and
".[9223372036854775808]" gives a, where Failure is documented for a path that clashes with
the data. Path.parse accumulates the digits as 10 * acc + d without an overflow check, so
2^63 + k becomes index k.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "f7dd083f4450"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "sexplib/4"
title = "Conv.mat_of_sexp raises Out_of_memory instead of Of_sexp_error when m * n overflows to the length of the data"
kind = "contract"
severity = "low"
test = "mat_of_sexp_checks_dimensions"
found = { commit = "f7dd083f44502b5ff25eaf15dd546090cd932358", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Conv.mat_of_sexp (Sexp.of_string "(2147483648 4294967296)") raises Out_of_memory; so does
"(3 3074457345618258603 1.)" (3 * 3074457345618258603 wraps to 1). With dimensions that do
not match the data it otherwise raises Of_sexp_error "float_mat_of_sexp: dimensions do not
match amount of data". float_mat_of_sexp compares m * n with the length of the data without
checking the product for overflow, then asks Bigarray for an m by n matrix.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "f7dd083f4450"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "sexplib/5"
title = "scan_sexps and the other scan functions prepend the strings inside a block comment to the next quoted atom: #|\"a\"|# \"b\" reads as \"ab\""
kind = "silent-corruption"
severity = "medium"
test = "scan_reads_spellings"
found = { commit = "f7dd083f44502b5ff25eaf15dd546090cd932358", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Sexp.scan_sexps (Lexing.from_string {|#|"a"|# "b"|}) is [Atom "ab"];
{|(#| "x" |# "y" z)|} gives (xy z). Sexp.of_string_many and Sexp.With_layout read "b".
Lexer.main (the Vanilla instance used by every scan_* function) scans the strings inside a
block comment into the shared string buffer, then lexes the next token before clearing it,
so the next quoted atom starts with their contents.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "f7dd083f4450"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

