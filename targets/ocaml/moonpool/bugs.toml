[[bug]]
id = "moonpool/1"
title = "Resolving a future raises Runner.Shutdown, and never wakes its other waiters, when a task awaiting it is on a shut down pool"
kind = "contract"
severity = "medium"
test = "fulfill_wakes_every_waiter"
found = { commit = "3aa6cfe8bdce", version = "v0.12+", hegel = "0.26.1", date = "2026-10-12" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
let fut, p = Fut.make () in
Fut.on_result fut (fun _ -> print_endline "woken");
let pool = Ws_pool.create ~num_threads:1 () in
ignore (Fut.spawn ~on:pool (fun () -> Fut.await fut));
Runner.shutdown pool;
Fut.fulfill p (Ok 1)
raises Moonpool.Runner.Shutdown and the callback never runs; a task awaiting fut
on a live pool, or Fut.wait_block on another thread, that started waiting before
the dead task is never woken either. The
same holds for Fifo_pool and Background_thread, and for try_cancel, cancel and
fulfill_idempotent. The worker loop's resume action (Worker_loop_.reschedule)
calls the pool's schedule, which raises Shutdown inside Picos's trigger
signalling and aborts it; futures are LIFO, so the waiters registered before
the dead task are the ones skipped. Found by fut_threads and fut_domains as
well, where workers resolve promises awaited on pools another round shut down.
"""

[[bug.observed]]
version = "v0.12+"
commit = "3aa6cfe8bdce"
hegel = "0.26.1"
date = "2026-10-12"
result = "reproduces"

[[bug]]
id = "moonpool/2"
title = "Fifo_pool and Background_thread shutdown drops a task suspended in await or yield: its future is never resolved"
kind = "hang"
severity = "medium"
test = "shutdown_finishes_work"
found = { commit = "3aa6cfe8bdce", version = "v0.12+", hegel = "0.26.1", date = "2026-10-12" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
let pool = Fifo_pool.create ~num_threads:1 () in
let parent = Fut.spawn ~on:pool (fun () ->
  let child = Fut.spawn_on_current_runner (fun () -> Unix.sleepf 0.05; 41) in
  Fut.await child + 1) in
(* once the parent has spawned its child *)
Runner.shutdown pool;
Fut.peek parent
is None after shutdown has returned, and stays None: the child's completion
reschedules the parent with Bb_queue.push on the closed queue, which raises
Shutdown (printed by on_exn) and drops the continuation. A task that calls
Moonpool.yield during shutdown fails with Shutdown instead. Runner.shutdown is
documented to stop the threads "after they finish their work"; Ws_pool does
(0.12: "shutdown ~wait:true should always wait"), Fifo_pool and
Background_thread do not.
"""

[[bug.observed]]
version = "v0.12+"
commit = "3aa6cfe8bdce"
hegel = "0.26.1"
date = "2026-10-12"
result = "reproduces"

[[bug]]
id = "moonpool/3"
title = "A Chan created with max_size 0 holds an element"
kind = "contract"
severity = "low"
test = "chan_model"
found = { commit = "3aa6cfe8bdce", version = "v0.12+", hegel = "0.26.1", date = "2026-10-12" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Chan.try_push (Chan.create ~max_size:0 ()) 1 is true, and Chan.push returns
without suspending: the push paths add to an empty queue without comparing
with max_size. create accepts 0 (it rejects only max_size < 0), so the
channel's bound is 1, not 0.
"""

