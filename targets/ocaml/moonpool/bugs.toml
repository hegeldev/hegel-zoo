[[bug]]
id = "moonpool/4"
title = "Fut.for_ with a negative count returns a future that never resolves"
kind = "hang"
severity = "low"
test = "fut_for_"
found = { commit = "3aa6cfe8bdce", version = "v0.12+", hegel = "0.26.1", date = "2026-10-12" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Fut.for_ ~on:pool (-1) ignore stays unresolved forever, where for_ 0 resolves
at once (Moonpool_forkjoin.for_ treats n <= 0 as an empty loop). The barrier
starts its latch at n and only resolves when it counts down to 0.
"""

