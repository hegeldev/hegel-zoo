commit = "3aa6cfe8bdce"
hegel = "0.26.1"
date = "2026-10-12"
result = "reproduces"

[[bug]]
id = "moonpool/5"
title = "After Main.main returns, its thread keeps the shut down main runner as current runner, so Fut.map and the infix operators raise Shutdown"
kind = "contract"
severity = "medium"
test = "combinators_after_main"
found = { commit = "3aa6cfe8bdce", version = "v0.12+", hegel = "0.26.1", date = "2026-10-12" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
ignore (Main.main (fun _ -> ()));
Fut.map ~f:succ (Fut.return 1)
raises Moonpool.Runner.Shutdown, as do Fut.bind, let+ and >|= (on futures
resolved later, the result fails with Shutdown); Runner.get_current_runner ()
is still Some _ and spawn_on_current_runner raises Shutdown rather than
Failure. The worker loop's setup sets the k_cur_runner TLS key on the calling
thread and teardown does not clear it.
"""

[[bug.observed]]
version = "v0.12+"
commit = "3aa6cfe8bdce"
hegel = "0.26.1"
date = "2026-10-12"
result = "reproduces"
