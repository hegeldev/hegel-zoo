reproducer = """
Digestif.MD5.consistent_of_hex_opt (String.make 32 '0')          (* Some _ *)
Digestif.MD5.consistent_of_hex_opt (" " ^ String.make 32 '0')    (* Some _ *)
Digestif.MD5.consistent_of_hex_opt (String.make 32 '0' ^ " ")    (* None *)
Digestif.MD5.consistent_of_hex (String.make 32 '0' ^ " ")        (* Invalid_argument "index out of bounds" *)

Both backends. The loop skipping trailing whitespace in src/digestif_conv.ml reads
str.[!offset + (D.digest_size * 2)] where the next unread character is at
!offset + D.digest_size.
