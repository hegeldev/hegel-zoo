[[bug]]
id = "csv/1"
title = "the reader never returns when the first read delivers fewer than four bytes"
kind = "hang"
severity = "high"
test = "chunked_reader_agrees_with_of_string"
found = { commit = "72ef9e4e6025", version = "2.4+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Csv.input_all (Csv.of_string "a") spins forever, as does any input of one to
three bytes, and any in_obj_channel whose first input call returns fewer than
four bytes (a pipe, a socket, an object reading one byte at a time), however
long the data. With ~skip_bom:false the same inputs read correctly.
of_in_obj's BOM check (skip_bom, default true, added after 2.4 by PR #41)
calls fill_in_buf_up_to_len_if_possible ic 4, which loops on
fill_in_buf_or_Eof until four bytes are buffered; fill_in_buf_or_Eof only
refills an empty buffer, so a buffer holding one to three bytes never grows
and never reaches End_of_file. Unreleased: 2.4 has no skip_bom.
"""

[[bug.observed]]
version = "2.4+"
commit = "72ef9e4e6025"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "csv/2"
title = "with separator ' ', empty fields are swallowed as whitespace, even with strip=false"
kind = "roundtrip"
severity = "medium"
test = "write_read_roundtrip"
found = { commit = "72ef9e4e6025", version = "2.4+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Csv.to_buffer ~separator:' ' writes [["a"; ""; "b"]] as "a  b\\n", which
Csv.of_string ~separator:' ' reads back as ["a"; "b"] (strip=true) or
["a"; " b"] (strip=false); [["";""]] is written " \\n" and read as [""] or
[" "]. RFC 4180 and Python's csv (delimiter=' ') read "a  b" as
["a"; ""; "b"]. The reader's whitespace predicate is space-or-tab, and only
for separator '\\t' is it narrowed to exclude the separator; with ' ' the
leading-space skip at the start of each field consumes the following
separators.
"""

[[bug.observed]]
version = "2.4+"
commit = "72ef9e4e6025"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "csv/3"
title = "with strip=false, a last field of only spaces at end of input reads as empty"
kind = "differential"
severity = "low"
test = "reader_agrees_with_python"
found = { commit = "72ef9e4e6025", version = "2.4+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Csv.of_string ~strip:false ~skip_bom:false "a,  " reads [["a"; ""]] and
"a\\n  " reads [["a"]; [""]], while "a,  \\n" correctly reads [["a"; "  "]];
Python's csv reads ['a', '  '] and ['  ']. strip=false promises the spaces
are kept. add_next_field skips leading spaces first; when that skip reaches
the end of input, its End_of_file handler adds "" whatever was skipped.
"""

[[bug.observed]]
version = "2.4+"
commit = "72ef9e4e6025"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "csv/4"
title = "an unterminated quoted field is accepted when it ends with an escaped quote"
kind = "contract"
severity = "low"
test = "unterminated_quoted_field_fails"
found = { commit = "72ef9e4e6025", version = "2.4+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Csv.of_string "\\"a" raises Csv.Failure (1, 1, "Quoted field closed by end of
file"), as documented for CSV that does not respect the format, but
"\\"a\\"\\"" (open quote, a, escaped quote, end of input) reads as [["a\\""]],
and "\\"ab\\"\\"   " as [["ab\\"   "]]; Python's csv (strict) rejects all
three. After an escaped quote, examine_quoted_field skips spaces before
resetting after_final_quote, so an End_of_file there is taken for the end of
a properly closed field.
"""

[[bug.observed]]
version = "2.4+"
commit = "72ef9e4e6025"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"
