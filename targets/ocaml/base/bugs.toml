[[bug]]
id = "base/1"
title = "pow's overflow check goes by the size of the base: Int.pow Int.min_value 2 wraps to 0, and Int64.pow (-2L) 63L raises although the result is Int64.min_value"
kind = "silent-corruption"
severity = "low"
test = "int_pow"
found = { commit = "858a66ad1768e4b9d76fa7d19a1afbd74fa8a3e4", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Int.pow Int.min_value 2        (* 0; Int.pow Int.min_value 3 is 0 too *)
Int.pow (-4) 31                (* raises "integer overflow in pow"; (-4)^31 = Int.min_value *)
Int64.pow (-2L) 63L            (* raises; (-2)^63 = Int64.min_value *)
Int64.pow Int64.min_value 1L   (* raises; Int64.pow Int64.min_value 0L raises too *)
Int63.Private.Emul.pow min_value one   (* raises: Int63 on 32-bit and JavaScript *)
The interface says pow "raises if ... an integer overflow would occur". Int_math.int_pow skips
the check when abs base <= 1, and abs Int.min_value is negative, so min_value ** e is computed
modulo 2^63 (Int63.pow is Int.pow on 64-bit). The checks compare abs base (int, Int63_emul) or
base (Int64, against the negated positive bounds) with the largest base whose power is at most
max_value, so a power equal to min_value, one below -max_value, is reported as an overflow.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "858a66ad1768"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "base/2"
title = "Int63's emulated backend, used on 32-bit and JavaScript, computes ceil_pow2 as floor_pow2: ceil_pow2 17 is 16"
kind = "contract"
severity = "medium"
test = "int63_emul_arith"
found = { commit = "858a66ad1768e4b9d76fa7d19a1afbd74fa8a3e4", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
let module E = Int63.Private.Emul in E.ceil_pow2 (E.of_int 17)   (* 16; Int.ceil_pow2 17 = 32 *)
int63_emul.ml: let ceil_pow2 x = globalize (wrap_exn (Int64.floor_pow2 (unwrap x))). Int63 is
this module wherever int has fewer than 63 bits, so Int63.ceil_pow2 x is the largest power of two
at most x there, for every x that is not itself a power of two.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "858a66ad1768"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "base/3"
title = "List.range and Sequence.range overflow when the step after the last element passes max_value or min_value: List.range ~stride:2 (max_value - 3) max_value raises, Sequence.range wraps round"
kind = "contract"
severity = "low"
test = "range"
found = { commit = "858a66ad1768e4b9d76fa7d19a1afbd74fa8a3e4", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
List.range ~stride:2 (Int.max_value - 3) Int.max_value
  (* raises "List.range': stride function cannot change direction";
     expected [max_value - 3; max_value - 1] *)
List.range ~stride:Int.max_value ~stop:`inclusive 1 Int.max_value   (* []; expected [1] *)
Sequence.range ~stride:2 (Int.max_value - 3) Int.max_value
  (* max_value - 3, max_value - 1, min_value, min_value + 2, ...: never ends *)
Both compute i + stride for the last element and compare it with the stop; the sum wraps round.
List.range then sees the stride change direction (or, for the first step, sees the range as
empty), and Sequence.range carries on from min_value.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "858a66ad1768"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "base/4"
title = "Nativeint.pow computes in 63-bit int: Nativeint.pow 2n 62n raises integer overflow, Nativeint.pow max_value 1n a conversion failure"
kind = "contract"
severity = "low"
test = "nativeint_pow"
found = { commit = "858a66ad1768e4b9d76fa7d19a1afbd74fa8a3e4", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Nativeint.pow 2n 62n              (* raises "integer overflow in pow"; 2^62 < Nativeint.max_value *)
Nativeint.pow Nativeint.max_value 1n
  (* raises "conversion from nativeint to int failed" *)
Nativeint.pow (-2n) 63n           (* raises; the result is Nativeint.min_value *)
nativeint.ml: let pow b e = of_int_exn (Int_math.Private.int_pow (to_int_exn b) (to_int_exn e)),
and on 64-bit platforms int has 63 bits to nativeint's 64. Int32.pow goes the same way but fits.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "858a66ad1768"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "base/5"
title = "Float.round_decimal with more than 22 decimal digits either way rounds a number within a digit of the unit to one significant digit: round_decimal 1.01e22 ~decimal_digits:(-23) is 1e22, not 0"
kind = "contract"
severity = "low"
test = "float_round_decimal"
found = { commit = "858a66ad1768e4b9d76fa7d19a1afbd74fa8a3e4", version = "v0.18~preview.130.106+341", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = '''
Float.round_decimal 1.01e22 ~decimal_digits:(-23)   (* 1e22; the nearest multiple of 1e23 is 0 *)
Float.round_decimal 7e22 ~decimal_digits:(-23)      (* 7e22; expected 1e23 *)
Float.round_decimal 3e-25 ~decimal_digits:24        (* 3e-25; expected 0 *)
round_decimal "rounds x to the nearest 10**(-n)". round_gen works out the significant digits
to keep, sd = n + ceil (log10 |x|), which is 0 here; with |n| > 22 it takes the slow path,
of_string (sprintf "%.*g" sd x), and C's %.0g means one significant digit, not none. With
|n| <= 22 the fast path gets the same inputs right.
'''

[[bug.observed]]
version = "v0.18~preview.130.106+341"
commit = "858a66ad1768"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"
