[[bug]]
id = "zarith/1"
title = "Z.hamdist raises Invalid_argument for two negative arguments unless both are small ints"
kind = "contract"
severity = "low"
test = "hamdist_agrees"
found = { commit = "7bbc77f00800", version = "1.14+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Z.hamdist (Z.of_string "-1") (Z.of_string "-4611686018427387905") raises
Invalid_argument "Z.hamdist: negative arguments"; the Hamming distance is 1.
Z.hamdist (-1) (-2) is 1: the small-int fast path handles two negatives, the
GMP path does not (caml_z.c: "XXX TODO: case where arg1 & arg2 are both
negative"). z.mli documents only Overflow, for arguments of different signs.
"""

[[bug.observed]]
version = "1.14+"
commit = "7bbc77f00800"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "zarith/2"
title = "Z.of_string accepts a + after a - (\"-+5\" reads as -5)"
kind = "contract"
severity = "low"
test = "of_string_agrees_with_int_of_string"
found = { commit = "7bbc77f00800", version = "1.14+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Z.of_string "-+5" is -5 and "-+0x10" is -16, where int_of_string, the
reference upstream's own tests (tests/ofstring.ml, z_and_int_agree) hold
Z.of_string to, rejects both. "+-5" is rejected. ml_z_of_substring_base
skips a '-' and then a '+' instead of one sign. The same parser reads Q's
exponents, so Q.of_string "1e-+2" is 1/100.
"""

[[bug.observed]]
version = "1.14+"
commit = "7bbc77f00800"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "zarith/3"
title = "Q.of_string accepts a second sign after its sign or base prefix (\"-0x-5\" reads as 5)"
kind = "contract"
severity = "low"
test = "q_of_string_signs_agree_with_float_of_string"
found = { commit = "7bbc77f00800", version = "1.14+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Q.of_string "--5" is 5, "++5" and "+-5" are 5 and -5, "0x-5" is -5 and
"-0x-5" is 5; float_of_string, the reference upstream's own tests
(q_and_float_agree) hold Q.of_string to, rejects them all. Q.of_string takes
a sign and a base prefix, then hands the rest to Z.of_substring_base, which
reads a sign of its own.
"""

[[bug.observed]]
version = "1.14+"
commit = "7bbc77f00800"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
id = "zarith/4"
title = "Q.of_string reads an empty exponent or mantissa as 0 (\"1e\" reads as 1, \"E0\" as 0)"
kind = "contract"
severity = "low"
test = "q_of_string_parts_agree_with_float_of_string"
found = { commit = "7bbc77f00800", version = "1.14+", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
Q.of_string "1e" and "1e+" are 1, "1.5e" is 3/2, "0x1p" is 1, "E0" and "e5"
are 0; float_of_string rejects them all. The exponent and the mantissa go to
Z.of_substring_base, which reads an empty digit string as 0. (Upstream's
tests pin "", "+", "-" and a bare "0x" to 0 on purpose; these strings have
digits in one part and none in the other.)
"""

[[bug.observed]]
version = "1.14+"
commit = "7bbc77f00800"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"
