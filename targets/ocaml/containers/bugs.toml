[[bug]]
id = "containers/3"
title = "CCDeque.append_back/append_front of a deque into itself corrupts it, or never returns"
kind = "hang"
severity = "low"
test = "deque_append_self"
found = { commit = "3a2bba397075", version = "3.18", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
let d = CCDeque.of_list [0; 1] in CCDeque.append_back ~into:d d gives
[0; 1; 0; 1; 1]; append_front ~into:d d on [0; 0] gives five elements; with
three or more elements append_back ~into:d d never returns, growing without
bound. Both are `iter (push_xxx into) q`, which walks q while pushing onto it.
Aliasing is not ruled out by the documentation (CCVector.append v v works).
"""

[[bug.observed]]
version = "3.18"
commit = "3a2bba397075"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
