[[bug]]
id = "containers/1"
title = "range_by goes past j, wrapping around, when j - i overflows"
kind = "contract"
severity = "low"
test = "list_range_by"
found = { commit = "3a2bba397075", version = "3.18", hegel = "0.26.1", date = "2026-10-09" }
status = "open"
upstream_issue = ""
fixed_in = ""
reproducer = """
CCList.range_by ~step:(min_int / 4) 1 min_int is
[1; 1-2^60; 1-2^61; 1-3*2^60; min_int+1; 3458764513820540929]: the last
element wrapped past min_int. CCInt.range_by yields the same sequence. Both
compute the last element as ((j - i) / step * step) + i, and j - i overflows.
When that wrongly computed end lies on the far side of i, CCList.range_by only
reaches i again after wrapping round the whole int range, so it allocates
until memory runs out.
"""

[[bug.observed]]
version = "3.18"
commit = "3a2bba397075"
hegel = "0.26.1"
date = "2026-10-09"
result = "reproduces"

[[bug]]
