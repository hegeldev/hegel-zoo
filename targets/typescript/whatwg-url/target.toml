name = "whatwg-url"
language = "typescript"
upstream = "https://github.com/jsdom/whatwg-url"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-15"  # README, .github: no AI policy; the repo ships .claude/skills and .agents/skills (maintainers use agents)

[base]
commit = "37df073c59cb06676f2663d65dc565a5b2b0eb57"
date = "2026-09-10"
version = "17.1.1"

[hegel]
version = "0.4.5"

[run]
# The public URL/URLSearchParams classes are generated from WebIDL by webidl2js (a
# devDependency) in upstream's `prepare` script, which npm does not run for a named install:
# the dev tree is installed (no --omit=dev; ~60 MB, seconds) and the transform run by hand.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5",
  "node scripts/transform.js",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
