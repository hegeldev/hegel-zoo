result = "reproduces"

[[bug]]
id = "superjson/11"
title = "stringify overflows the stack at a nesting depth of about 2000, where JSON.stringify and structuredClone handle 3000"
kind = "crash"
severity = "low"
test = "TestHegelPinNestingAsDeepAsJsonStringify"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The walker recurses once per level with a large frame (it spreads `path` and `objectsInThisPath`
into new arrays at each level, so the work is also quadratic in depth). On Node 22 with the
default stack, 2000 nested arrays throw RangeError: Maximum call stack size exceeded from
stringify while JSON.stringify and structuredClone of the same value succeed up to 3000 (both
fail at 5000). A serialiser presented as a drop-in for JSON.stringify should not fail first.
Found by the nesting property; the pin uses depth 2500.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/12"
title = "Deserialized Errors gain own enumerable properties the original did not have: `name` always, and every allowed prop even when absent"
kind = "contract"
severity = "low"
test = "TestHegelPinDeserializedErrorsGainNoOwnEnumerableProperties"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The Error rule revives with `e.name = v.name` (an own enumerable property, where a real Error
inherits `name` from its prototype) and `allowedErrorProps.forEach(prop => e[prop] = v[prop])`,
which creates an own `undefined` property for every allowed name the payload lacks.
Object.keys(parse(stringify(new Error("m")))) is ["name"], and after allowErrorProps("code")
the result also has own `code: undefined`: JSON.stringify, Object.keys and `"code" in e` all see
properties the original never had. Found by the Errors property (the canonical rendering
compares own enumerable properties).
'''

