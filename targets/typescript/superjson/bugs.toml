[[bug]]
id = "superjson/9"
title = "A Node Buffer (or any Uint8Array subclass) serialises but cannot be deserialised: 'Trying to deserialize unknown typed array'"
kind = "crash"
severity = "medium"
test = "TestHegelPinNodeBufferDeserializes"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isTypedArray accepts every ArrayBuffer view, and the annotation is `v.constructor.name`, so a
Buffer is written as ["typed-array", "Buffer"] with its bytes; the reader only knows the eleven
standard constructors and throws for "Buffer". stringify(Buffer.from("abc")) succeeds and
parse of its output throws Error: Trying to deserialize unknown typed array. Buffers are what
Node gives for file contents, hashes and request bodies, so a server serialising one produces a
payload no client can read. Either the base type of the view (Uint8Array) should be written, or
serialize should refuse the value. Found by the Node-Buffers property.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/10"
title = "A registered class without a name, or a registered symbol without a description, is silently ignored"
kind = "contract"
severity = "low"
test = "TestHegelPinAnonymousClassAndDescriptionlessSymbolAreRegistered"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The registries store the class under `c.name` and the symbol under `description ?? ""`, and the
rules test registration with `!!registry.getIdentifier(v)`, which is false for the empty
string. registerClass(C) for an anonymous class expression (name "") registers it and then
never matches: instances serialise as plain objects with no annotation and come back as plain
objects; registerSymbol(Symbol()) registers under "" and the symbol is dropped from the output
(null in an array). An explicit identifier works. Registration should fail loudly or use a
generated identifier. Found by reading the registries; the pin registers both.
'''

