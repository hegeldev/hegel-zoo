# Bugs found in superjson by the Hegel zoo. One [[bug]] per finding; `test` names the pin in
# hegel/hegel.test.mjs that fails while the bug exists (listed under [expected_failures] in
# target.toml). Oracles: JavaScript itself (JSON.parse/JSON.stringify of the output,
# structuredClone as a second implementation of the same value space), a canonical rendering
# that compares identity structure and Map/Set order, and superjson's README. No CONTRIBUTING
# file; README and .github/ say nothing about AI (checked 2026-09-18).

[[bug]]
id = "superjson/1"
title = "Restoring two shared values in one Set (or two shared Map keys) uses positions from before the first restore moved elements: elements are lost and entries get the wrong values"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinTwoSharedValuesInOneSetAreBothRestored"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A repeated reference inside a Set is written as a copy plus a referentialEqualities path that
names the element by its position (`2.1` = element 1 of the Set at index 2). setDeep restores it
with `parent.delete(oldValue); parent.add(newValue)`, which moves the element to the end, and the
next path is still resolved by position in the reordered Set. With a = {a:1}, b = {b:1}:
parse(stringify([a, b, new Set([a, b, 3])])) gives [a, b, Set{copy-of-b, a, b}]: 3 is gone and
the copy of b stays a copy. Map keys go the same way through `parent.set(newKey, ...);
parent.delete(keyToRow)`: [a, b, new Map([[a, 1], [b, 2], [3, 3]])] comes back with a -> 1, b -> 3
and the copy of b -> 2, the entry 3 -> 3 lost. Registered class instances as keys behave the same.
Found by the shared-values-in-Sets property; the pin uses the two examples above.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/2"
title = "With dedupe, repeated references inside a Set or as Map keys become null and collapse into one element before they are restored: elements and entries are lost, values land on the wrong key"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinDedupeKeepsTheOtherElementsBesideASharedOne"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
new SuperJSON({ dedupe: true }) writes every repeated reference as null. Inside a Set two nulls
are one element, and a null key in a Map is one key, so the JSON already has fewer elements than
the value; the referentialEqualities paths then address positions that no longer exist. With
o = {}: [o, new Set([o, null])] comes back as [o, Set{o}] (the null is gone); [o, new Map([[o, 1],
[null, 2]])] comes back as [o, Map{o -> 2}] (o has null's value, null's entry is gone); with
a = {}, b = {}: [a, b, new Set([a, b, 3])] comes back as [a, b, Set{3, b}]. No error anywhere.
Found by the dedupe-with-Sets property; the pin uses the first two examples.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/3"
title = "Restoring a shared value that is a Set element or a Map key moves it to the end: iteration order changes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRestoringASharedSetElementKeepsItsPosition"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Set and Map keep insertion order, and setDeep restores a shared element by deleting the copy and
adding the original (Set) or setting the original and deleting the copy (Map key), which appends
it. With o = {}: [o, new Set([1, o, 2])] comes back as [o, Set{1, 2, o}]; with d = new Date(0):
[d, new Map([[d, 1], ["k", 2]])] comes back with the keys in the order k, d. Values that are not
shared keep their order (their transformation happens while the container is still an array).
Found by the shared-values-in-Sets property.
'''

