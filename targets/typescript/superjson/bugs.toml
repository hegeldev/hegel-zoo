result = "reproduces"

[[bug]]
id = "superjson/4"
title = "Shared references and cycles inside Errors and registered class instances are not restored: cycles come back as null, dedupe leaves the fields null"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinSharedReferencesInsideClassInstancesAndErrorsAreRestored"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The walker descends into Errors and registered class instances (they are "deep"), so cycles and
repeated references inside them are written as null / a copy plus a referentialEqualities path.
setDeep, which applies those paths, only writes into arrays, plain objects, Sets and Maps; when
the parent is an Error or a class instance (already revived, since value annotations run first)
the assignment is skipped without error. With `class P {}` registered and p = new P(); p.self = p:
parse(stringify(p)).self is null. With o = {x: 1} and e = new Error("m", {cause: o}):
parse(stringify({o, e})).e.cause is a copy, not the shared o; with allowErrorProps("extra") the
same for e.extra; with dedupe every repeated reference in a class field is null for good.
Found by the shared-values-inside-Errors-and-class-instances property; the pin uses the cycle
and the Error cause.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/5"
title = "Referential equalities are applied in an order that loses the ones recorded under a shared object's first occurrence when its representative is a later, shorter path: cycles to the root come back as null"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinCyclesToTheRootThroughASharedObjectSurvive"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The walker records references inside a shared object only under its first occurrence (later
occurrences are short-circuited), while generateReferentialEqualityAnnotations picks the
*shortest* path as the representative and applyReferentialEqualityAnnotations applies the root
paths first and the others in insertion order. When the representative is a later occurrence,
the copy under the first occurrence gets its inner relinks and is then replaced by the
representative copy, which never had them. user = {name}; post = {author: user}; user.posts =
[post]; user.featured = post: parse(stringify(user)).posts[0].author is null (the cycle to the
root was recorded under posts.0, the representative is featured). Non-root shared values go the
same way: y = {}; x = {y}; root = {z: y, deep: {x}, x}: back.x.y is a copy, not back.z. Swapping
the key order (featured before posts) makes both work, and dedupe mode (which keeps the first
occurrence as the representative) is unaffected. Found by the shared-references property
(16-18 of 100 cases); the pin uses the two examples.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/6"
title = "NaN is tracked as a shared reference: every NaN in a graph is linked in meta, a NaN in a Set moves to the end, and a Map entry keyed by NaN is deleted"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinNaNIsNotASharedReference"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isPrimitive uses isNumber, which excludes NaN, so the walker treats NaN as an object: it goes
into the identities Map (where SameValueZero makes every NaN the same key) and into seenObjects.
serialize({a: NaN, b: NaN}) therefore has meta.referentialEqualities {a: ["b"]}, and the relink
runs through setDeep's Set and Map branches with `oldValue !== newValue` true for NaN:
parse(stringify([NaN, new Set([NaN, 1])])) gives Set{1, NaN}, and parse(stringify([NaN, new
Map([[NaN, 1], [2, 2]])])) gives Map{2 -> 2}: the NaN entry is deleted (`parent.set(NaN, v)`
keeps the entry, `parent.delete(keyToRow)` with the "other" NaN removes it). One NaN alone in a
Set or Map is fine. bigint goes the same way (isPrimitive has no bigint case), which only bloats
meta since 1n === 1n. Found by the registered-classes property (a NaN Map key next to another
NaN); the pin uses the three examples.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/7"
title = "An invalid Date is serialised as null"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinInvalidDateSurvives"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
isDate requires a valid time value, so new Date(NaN) matches no rule and is passed to
JSON.stringify as is, which writes null: stringify({d: new Date(NaN)}) is {"json":{"d":null}}
and parses to {d: null}. An invalid Date is a Date (it is what `new Date(userInput)` returns for
bad input) and structuredClone preserves it; a Date annotation with a null or "Invalid Date"
payload would round-trip it, or serialize could refuse it. Found by the dates property.
'''

[[bug.observed]]
version = "2.2.5"
commit = "aaa65e36e8e3"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "superjson/8"
title = "-0 in a Float32Array or Float64Array comes back as 0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNegativeZeroInFloatArraysSurvives"
found = { commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754", version = "2.2.5", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The typed-array rule maps NaN, Infinity and -Infinity elements to strings because JSON cannot
carry them, but leaves -0 as a number, and JSON.stringify writes -0 as 0:
stringify(new Float32Array([-0])) is {"json":[0],...}. A plain -0 outside a typed array is
handled (annotation "number", payload "-0"). Found by the typed-arrays property.
'''

