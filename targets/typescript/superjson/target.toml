name = "superjson"
language = "typescript"
upstream = "https://github.com/flightcontrolhq/superjson"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-18"  # README, .github/ (CODEOWNERS, one workflow), no CONTRIBUTING: nothing about AI

[base]
commit = "aaa65e36e8e31da740265a56b27c965ca1c7b754"
date = "2026-06-18"
version = "2.2.5"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript (ES modules): the setup installs everything under .hegel/ (Hegel, the one
# runtime dependency copy-anything, the compiler and @types/node) and compiles src/ into
# .hegel/dist with hegel/tsconfig.json; the tests import .hegel/dist/index.js. Nothing touches
# the upstream tree or its lock file.
setup = [
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5 copy-anything@4 typescript@5 @types/node@22",
  "node .hegel/node_modules/typescript/bin/tsc -p hegel/tsconfig.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinTwoSharedValuesInOneSetAreBothRestored = "superjson/1"
TestHegelPinDedupeKeepsTheOtherElementsBesideASharedOne = "superjson/2"
TestHegelPinRestoringASharedSetElementKeepsItsPosition = "superjson/3"
TestHegelPinSharedReferencesInsideClassInstancesAndErrorsAreRestored = "superjson/4"
TestHegelPinCyclesToTheRootThroughASharedObjectSurvive = "superjson/5"
TestHegelPinNaNIsNotASharedReference = "superjson/6"
TestHegelPinInvalidDateSurvives = "superjson/7"
TestHegelPinNegativeZeroInFloatArraysSurvives = "superjson/8"
TestHegelPinNodeBufferDeserializes = "superjson/9"
TestHegelPinAnonymousClassAndDescriptionlessSymbolAreRegistered = "superjson/10"
TestHegelPinNestingAsDeepAsJsonStringify = "superjson/11"
TestHegelPinDeserializedErrorsGainNoOwnEnumerableProperties = "superjson/12"
# Properties that find the same bugs.
TestHegelSharedReferencesAreRestored = "superjson/5"
TestHegelSharedValuesInSetsAndMapKeysAreRestored = "superjson/1"
TestHegelSharedValuesInsideErrorsAndClassInstancesAreRestored = "superjson/4"
TestHegelDedupeModeWithSetsAndMapsRoundTrips = "superjson/2"
TestHegelTypedArraysRoundTrip = { bug = "superjson/8", intermittent = true }
TestHegelNodeBuffersRoundTrip = "superjson/9"
TestHegelDatesRoundTrip = "superjson/7"
TestHegelNestingAsDeepAsJsonStringify = "superjson/11"
