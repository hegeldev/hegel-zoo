name = "minimatch"
language = "typescript"
upstream = "https://github.com/isaacs/minimatch"
subdir = ""
license = "BlueOak-1.0.0"
ai_policy_checked = "2026-09-16"  # README, .github/workflows: no CONTRIBUTING, no AI policy

[base]
commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5"
date = "2026-07-27"
version = "10.2.6"

[hegel]
version = "0.4.5"

[run]
# TypeScript sources built by tshy upstream (dist/ is not committed): install Hegel, the TypeScript
# compiler and the one runtime dependency, then compile src/ into .hegel/dist (CommonJS); the tests
# require() the build. The bash differential needs bash >= 4.4 on PATH.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev @hegeldev/hegel@0.4.5 typescript@5.9.3 brace-expansion@5.0.12",
  "node node_modules/typescript/bin/tsc -p test/tsconfig.hegel.json --noCheck",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinEscapeNeutralisesALeadingBangOrHash = "minimatch/1"
TestHegelPinHashWithAPosixClassIsAValidPattern = "minimatch/2"
TestHegelPinEscapedCharacterAfterAStarMatches = "minimatch/3"
TestHegelPinMakeReKeepsATrailingGlobstarAfterAnotherGlobstar = "minimatch/4"
TestHegelPinMakeReGlobstarSkipsDotfilesBelowTheParent = "minimatch/5"
TestHegelPinMakeReAgreesWithMatchOnTheGlobstarParent = "minimatch/6"
TestHegelPinALiteralBracePairDoesNotStopBraceExpansion = "minimatch/7"
TestHegelPinStarAfterAnEmptyGroupSkipsDotfiles = "minimatch/8"
TestHegelPinATrailingSlashDoesNotSatisfyAnOptionalExtglob = "minimatch/9"
