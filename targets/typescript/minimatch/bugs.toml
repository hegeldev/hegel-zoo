# Bugs found in minimatch by the Hegel properties (see README.md). Each is pinned by the test named in
# `test` (test/hegel.test.mjs), which asserts the documented behaviour (or bash's, where the README
# claims bash semantics) and fails while the bug exists.

[[bug]]
id = "minimatch/1"
title = "escape() leaves a leading ! or # alone, so the escaped pattern negates or is a comment instead of matching the literal string"
kind = "contract"
severity = "medium"
test = "TestHegelPinEscapeNeutralisesALeadingBangOrHash"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README: "Escape all magic characters in a glob pattern, so that it will only ever match literal
strings." `escape('#a')` is `'#a'`, which minimatch reads as a comment, so `minimatch('#a',
escape('#a'))` is false; `escape('!a')` is `'!a'`, a negation, so `minimatch('xyz', escape('!a'))` is
true and `minimatch('a', escape('!a'))` false. escape.ts:27-32 escapes only `?*()[]\` (and braces with
magicalBraces); its comment says `+@!` need no escaping "because we escape the parens that make those
magic", which is true of extglobs but not of the leading-`!` negation and the leading-`#` comment
that the README documents under "Comparisons". The README itself gives the fix for `#`: `\#`.
'''

[[bug]]
id = "minimatch/2"
title = "A pattern with a POSIX character class and a literal -, #, comma or space throws a SyntaxError from minimatch() (invalid \\- or \\# escape in the u-flag regex) and makes makeRe() return false"
kind = "crash"
severity = "medium"
test = "TestHegelPinHashWithAPosixClassIsAValidPattern"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`minimatch('-y7', '-y[[:digit:]]')` throws `SyntaxError: Invalid regular expression:
/^\-y[\p{Nd}]$/u: Invalid escape`; so do `minimatch('x#c', '[[:lower:]]#c')` (`\#`) and
`minimatch('#cx', '#c[[:lower:]]*', {nocomment: true})`, and `makeRe('yy/[[:upper:]]/dzx-')` is
false (the pattern is valid; `minimatch('yy/X/dzx-', ...)` is true because that part is a plain
string). ast.ts:172-173 `regExpEscape` backslash-escapes `-[]{}()*+?.,\^$|#` and whitespace in
literal text; `\-`, `\#`, `\,` and `\ ` are legal in a plain regex but invalid identity escapes
once the `u` flag is set, which brace-expressions.ts requires for the `\p{...}` classes a POSIX
class expands to. Hyphens are common in file names (`my-lib/[[:digit:]]*.js`), so any such pattern
crashes instead of matching, and makeRe() reports a valid pattern as invalid.
The pattern's own escape reaches the same place: `[[:alpha:]]\\!` (an escaped `!`) throws `Invalid regular expression: /^(?!\.)[\p{L}\p{Nl}]\!$/u: Invalid escape` from minimatch() and makeRe(), while `[a]\\!` and `[[:alpha:]]!` are fine (turn 440, pin TestHegelPinEscapedBangWithAPosixClassIsAValidPattern).
'''

[[bug]]
id = "minimatch/3"
title = "An escaped character after a leading * or ? never matches: *1\\} rejects 01}, ?\\} rejects 0}, *\\. rejects 0. (the fast-path test keeps the backslash)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedCharacterAfterAStarMatches"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`minimatch('01}', '*1\\}')` is false although `makeRe('*1\\}')` is `/^(?!\.)[^/]*?1\}$/`, which
matches, `minimatch('0}', '0\\}')` is true and bash matches `01}` against `*1\}`. The same for
`?\}`, `*\]`, `*\{`, `*\.`, `*\a`, `*\#`. In parse() (index.ts:1256-1287) a part matching
`starDotExtRE = /^\*+([^+@!?*[(]*)$/` (or `qmarksRE`) gets a fast `test` function that replaces the
regex's: `f.endsWith(ext)` with `ext` taken verbatim from the pattern (:139-141), backslash included,
so the part can only match a file name that literally contains `\}`. The character class of the
fast-path regexes excludes the magic characters but not `\`, `]`, `}`, `)`, `{`.
'''

[[bug]]
id = "minimatch/4"
title = "makeRe() drops a trailing /** when an earlier segment is **: the regex for a/**/b/** is /^a(?:...)b$/ and rejects a/x/b/y, which match() accepts"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMakeReKeepsATrailingGlobstarAfterAnotherGlobstar"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`minimatch('a/x/b/y', 'a/**/b/**')` is true; `makeRe('a/**/b/**')` is `/^a(?:\/|\/(?:(?!(?:\/|^)\.).)*?\/)b$/`
and `.test('a/x/b/y')` is false — the trailing `/**` is missing from the regex. `a/*/b/**` keeps it
(`b(?:\/|\/(...)*?)?$`), so the loss needs a `**` earlier in the pattern (also `a/**/**/b/**`). The README
says the `regexp` property is "A single regular expression expressing the entire pattern", and
consumers (file walkers, editors) use makeRe() to test many paths at once. makeRe() (index.ts:1291-1392)
builds the source from the set parts and handles GLOBSTAR by looking at the previous/next parts; the
second GLOBSTAR at the end is folded into the first's alternation.
'''

[[bug]]
id = "minimatch/5"
title = "makeRe()'s ** admits a dotfile directly below its parent: the regex for a/** matches a/.b and a/**/c matches a/.b/c, which match() rejects"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMakeReGlobstarSkipsDotfilesBelowTheParent"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README ("dot"): "by default, `a/**/b` will not match `a/.d/b`, unless `dot` is set", and match()
agrees (`minimatch('a/.b/c', 'a/**/c')` is false). `makeRe('a/**')` is
`/^a(?:\/|\/(?:(?!(?:\/|^)\.).)*?)?$/`: the guard `(?!(?:\/|^)\.)` is tested at every character of
the globstar body, i.e. it refuses a `/` followed by `.`, but the slash before the first segment is
the literal `\/` outside the body, so the `.` of `.b` is the body's first character and is accepted:
`.test('a/.b')` is true, `.test('a/x/.b')` false, `makeRe('a/**/c').test('a/.b/c')` true. The
first-level case is exactly the one the README uses as its example.
'''

[[bug]]
id = "minimatch/6"
title = "makeRe() of a/** matches the bare a while match() does not (the pattern's trailing slash-globstar is optional in the regex)"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinMakeReAgreesWithMatchOnTheGlobstarParent"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`minimatch('a', 'a/**')` is false and `minimatch('a/', 'a/**')` true (matchOne needs the trailing
empty segment: index.ts:1227-1232); `makeRe('a/**')` is `/^a(?:\/|\/(...)*?)?$/` with the whole
slash-globstar group optional, so `.test('a')` is true. One of the two is wrong for the "entire
pattern" promise; bash lists `a/` for `a/**` only when `a` is a directory, so match() has the
defensible answer and the regex is the odd one out.
'''

[[bug]]
id = "minimatch/7"
title = "A comma-less brace pair stops brace expansion: braceExpand('{ac}{1..3}') and braceExpand('{{1..3}}') are returned unexpanded (bash: {ac}1 {ac}2 {ac}3 and {1} {2} {3})"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinALiteralBracePairDoesNotStopBraceExpansion"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In the dependency brace-expansion 5.0.12 (juliangruber/brace-expansion), exposed through
`minimatch.braceExpand` and the `Minimatch.set`: `expand_()` (dist/esm/index.js:259-268) takes the
first balanced `{...}`; when its body is neither a sequence nor a comma list it either rewrites the
string once if a `,...}` follows (`{a},b}`) or returns "the whole remaining string" as literal. So
`{ac}{1..3}` → `['{ac}{1..3}']` while `{ac}{a,b}` → `['{ac}a', '{ac}b']` and `{1..3}{ac}` → `1{ac}
2{ac} 3{ac}`; `{{1..3}}` → `['{{1..3}}']` while `{{a,b}}` → `['{a}', '{b}']`. bash expands the
sequences in both (`{ac}1 {ac}2 {ac}3`; `{1} {2} {3}`). A glob such as `{lib}/{1..3}/*.js` therefore
matches nothing in minimatch.
'''

[[bug]]
id = "minimatch/8"
title = "A star after a leading extglob that can match the empty string matches dotfiles: *(b)*, ?(b)* and @(b|)* match .a without the dot option"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStarAfterAnEmptyGroupSkipsDotfiles"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README ("dot"): patterns do not match "filenames starting with a period, even if the pattern does not
explicitly have a period in that spot" unless `dot` is set; `minimatch('.a', '*')`, `'[b]*'` and
`'+(b)*'` are false, but `minimatch('.a', '*(b)*')`, `'?(b)*'`, `'@(b|)*'` and `minimatch('x/.a',
'x/*(b)*')` are true, and bash (without dotglob) matches none of them. The AST (ast.ts) adds the
no-dot guard to a star only when it begins the part; when a leading extglob has consumed nothing
the star that follows is not at the start and has no guard, so the dotfile slips through. `{b,}*`
is fine because brace expansion happens first and the empty alternative yields a bare `*`. The same
shape exists in picomatch (picomatch/3 in this zoo).
'''

[[bug]]
id = "minimatch/9"
title = "A trailing slash on the path satisfies a final ?(...) or *(...) part: a/b/ matches a/b/?(x) and **/?(x), although a/b/ does not match a/b/*"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinATrailingSlashDoesNotSatisfyAnOptionalExtglob"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
index.ts:1206-1215 (comment in #matchOne): "a/b/ should *not* match a/b/*, even though '' matches
against the [^/]*? pattern", and indeed `minimatch('a/b/', 'a/b/*')` is false — the star's regex
requires a character. An extglob that accepts the empty string has no such requirement:
`minimatch('a/b/', 'a/b/?(x)')`, `'a/b/*(x)'`, `'a/*/?(x)'` and `'**/?(x)'` are true (the trailing
empty segment is matched by the part), while `'a/b/@(x|)'` is false and `'a/b'` does not match
`'a/b/?(x)'` at all. So every directory path written with a trailing slash matches `**/?(anything)`.
bash lists nothing for `a/b/?(x)` when `a/b` is an empty directory.
'''

[[bug]]
id = "minimatch/10"
title = "A dotfile after a second ** is never matched: **/a/**/.b rejects a/.b and x/a/.b, **/a/**/.b/c rejects a/.b/c, although a/**/.b accepts a/.b, makeRe() of the same pattern accepts them and bash lists them"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinADotfileTailAfterASecondGlobstarMatches"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The `dot` option makes no difference (the dotfile is written explicitly in the pattern). Only
patterns with two `**` separated by other segments and an explicit dotfile segment after the second
are affected; `**/.b`, `**/a/.b` and `a/**/.b` all match. index.ts:1100-1113, the `!bs` branch of
#matchGlobStarBodySections, loops `for (i = fileIndex; i < file.length; ...)` and refuses every
dotfile it meets, so it re-checks the tail segments that the head/tail split already matched; the
empty-body branch at 1024-1036 stops at `file.length - fileTailMatch`. Found by the bash differential
after the generators were rewritten (the old one never drew two `**` around a dotfile tail).
'''

[[bug]]
id = "minimatch/11"
title = "makeRe() of a pattern with a negated bracket expression matches a slash: a[!x]b and a[^x]b compile to /^a[^x]b$/ and accept a/b, which match() rejects"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinMakeReNegatedBracketDoesNotMatchASlash"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
brace-expressions.ts:164 builds `'[' + (negate ? '^' : '') + rangesToString(ranges) + ']'` and
never excludes `/` from a negated class (compare `?`, which compiles to `[^/]`). The same for
ranges, `\-` escapes and POSIX classes inside a negated bracket. `match()` splits on `/` first and
so is right; the disagreement joins minimatch/4-6 in the list of makeRe()/match() differences
(picomatch/8 is the same shape). Shrunk from `a*[!a-d]*/aaaa/**/aaa` on `a/ax/aaaa/aaa`.
'''

[[bug]]
id = "minimatch/12"
title = "A pattern holding a brace pair loses one level of escaping: {}a\\\\b (escaped backslash) matches {}ab and not {}a\\b, {a,b}\\\\c matches ac and not a\\c, and escape('{\\}', {magicalBraces: true}) gives a pattern that does not match '{\\}'; nobrace restores them"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAnEscapedBackslashSurvivesBraceExpansion"
found = { commit = "ded1bbd01beca62a5978bc1650ed0a1ccf9039d5", version = "10.2.6", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
index.ts:328-342, braceExpand sends any pattern matching `/\{(?:(?!\{).)*\}/` through the
brace-expansion package, whose unescapeBraces (brace-expansion 5.0.12, dist/commonjs/index.js:62-68)
restores `\\` to `\`, `\{` to `{` and so on: one escape level is consumed, and the AST then reads
the surviving `\` as an escape of the next character. `a\\b` (no braces) matches `a\b` as it
should. Breaks the contract of escape(): with `magicalBraces: true`, escape('{\}') is `\{\\\}`,
which the pattern set holds as `{}` and which does not match the string it was made from.
'''
