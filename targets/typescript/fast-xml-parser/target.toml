name = "fast-xml-parser"
language = "typescript"
upstream = "https://github.com/NaturalIntelligence/fast-xml-parser"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, docs/, CONTRIBUTING.md, .github/: no AI policy

[base]
commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a"
date = "2026-09-14"
version = "5.11.1"

[hegel]
version = "0.4.5"

[run]
# src/fxp.js is a plain ES module; its six runtime dependencies are installed at the versions
# the lock file resolves to, without touching package.json or the lock file; Hegel goes under
# .hegel/. The oracle is Python's xml.parsers.expat (stdlib, python3 on PATH).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev @nodable/entities@3.0.0 fast-xml-builder@1.2.0 is-unsafe@2.0.0 path-expression-matcher@1.6.2 strnum@2.4.2 xml-naming@0.3.0",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinAttributeValuesAreNormalised = "fast-xml-parser/1"
TestHegelPinWhitespaceBeforeMiscOutsideTheRootIsNotText = "fast-xml-parser/2"
TestHegelPinParameterEntityDeclarationIsAccepted = "fast-xml-parser/3"
TestHegelPinPIDataMayHoldAQuote = "fast-xml-parser/4"
TestHegelPinFirstEntityDeclarationBinds = "fast-xml-parser/5"
TestHegelPinValidatorAcceptsLongEntityReferences = "fast-xml-parser/6"
TestHegelPinValidatorReadsQuotedGreaterThanInEntityValue = "fast-xml-parser/7"
TestHegelPinValidatorRejectsASecondRootAfterASelfClosingOne = "fast-xml-parser/8"
TestHegelPinValidatorRejectsXmlDeclarationInsideTheDocument = "fast-xml-parser/9"
TestHegelPinValidatorRejectsIllFormedTextAttributesReferencesAndComments = "fast-xml-parser/10"
TestHegelPinMetaDataOffsetsIndexTheInput = "fast-xml-parser/11"
