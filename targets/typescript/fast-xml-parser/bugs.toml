# Bugs found in fast-xml-parser by the Hegel property tests in hegel.patch (the parser and the
# validator against Python's xml.parsers.expat on generated well-formed XML and mutations of it).

[[bug]]
id = "fast-xml-parser/1"
title = "Attribute values are not normalised: a literal tab, LF or CR in the value stays instead of becoming a space"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAttributeValuesAreNormalised"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
XML 1.0 3.3.3 (attribute-value normalisation): each white-space character (#x20, #xD, #xA, #x9)
appearing literally in the value is replaced by a space, while one written as a character
reference keeps its value. expat (and libxml2, Java's parsers) read `<r a="x	y"/>` (a literal
tab) as a = "x y"; fast-xml-parser gives "x\ty". Same for `<r a="x\ny"/>` and `<r a="x\r\ny"/>`
(one space each), and for the replacement text of an internal entity referenced in a value
(`<!ENTITY e "a\tb">`, a="&e;" is "a b"). A referenced `&#9;` correctly stays a tab.
Reproduced by `TestHegelParseAgreesWithExpat` on 12% of generated documents.
'''

[[bug]]
id = "fast-xml-parser/2"
title = "Whitespace before a comment or PI outside the root element becomes a top-level #text node"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWhitespaceBeforeMiscOutsideTheRootIsNotText"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`<r/> <!--c-->` with preserveOrder gives `[{"r":[]},{"#text":" "},{"#comment":[{"#text":"c"}]}]`:
the space between the root and the comment is reported as character data of the document,
though XML has no character data outside the root (Misc ::= Comment | PI | S; expat reports
nothing). `<!--c-->\n<r/>` likewise gets a `#text: "\n"` before the root; in the default
(folded) shape ` <?pi x?> <r/>` gives `{"r":"","#text":" "}` next to the root. Whitespace
after the last piece of markup, or with no comment/PI at all, is (correctly) dropped, so the
node appears only when a comment or PI follows it.
Reproduced by `TestHegelParseAgreesWithExpat` on half of the generated documents.
'''

[[bug]]
id = "fast-xml-parser/3"
title = "A parameter-entity declaration in the internal subset throws Invalid entity name %"
kind = "crash"
severity = "medium"
test = "TestHegelPinParameterEntityDeclarationIsAccepted"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`<!DOCTYPE r [<!ENTITY % pe "x">]><r>y</r>` is well-formed (PEDecl, XML 1.0 4.2; expat reads
the document and the element y), but `new XMLParser().parse(...)` throws
`Error: Invalid entity name %`: DocTypeReader reads the `%` as the start of the entity name.
Parameter entities are common in DTDs copied into internal subsets (`<!ENTITY % local.attrs
"">`); the parser need not expand them, but it must not refuse the document.
'''

[[bug]]
id = "fast-xml-parser/4"
title = "A processing instruction whose data contains a quote throws Pi Tag is not closed or swallows the following tags"
kind = "crash"
severity = "medium"
test = "TestHegelPinPIDataMayHoldAQuote"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PI data is free text up to `?>` (XML 1.0 2.6). fast-xml-parser reads the data as if it were
attributes, so an unbalanced quote runs to the end of the input: `<?pi it's data?><r/>` and
`<r><?pi don't?></r>` throw `Error: Pi Tag is not closed.`, and when a matching quote appears
later in the document the PI instead absorbs the markup in between: in
`<r><?pi 'a?><b/><c d="1"/></r>`-shaped documents the elements after the PI turn into
attributes of the PI node or a second root. Reading PI data as attributes is documented,
but the document must still parse.
Reproduced by `TestHegelParseAgreesWithExpat` (12% of documents) and `TestHegelValidatorAgreesWithExpat`
(parse with validation on).
'''

[[bug]]
id = "fast-xml-parser/5"
title = "Of two declarations of the same entity the last one binds instead of the first"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFirstEntityDeclarationBinds"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
XML 1.0 4.2: "If the same entity is declared more than once, the first declaration encountered
is binding". `<!DOCTYPE r [<!ENTITY a "1"><!ENTITY a "2">]><r>&a;</r>` reads as 1 in expat and
every conforming parser; fast-xml-parser gives 2 (the later declaration overwrites the entry in
its entity table). The rule exists so a document's internal subset can override an external
DTD's defaults; here it reverses the override.
'''

[[bug]]
id = "fast-xml-parser/6"
title = "XMLValidator rejects an entity reference whose name is longer than 20 characters"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidatorAcceptsLongEntityReferences"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`XMLValidator.validate("<r>&eeeeeeeeeeeeeeeeeeeee;</r>")` (21 e's) gives
`{err: {code: "InvalidChar", msg: "char '&' is not expected."}}` while the same with 20 e's is
valid: validator.js `validateAmpersand` only looks 20 characters ahead for the `;`. Entity
names have no length limit (Name ::= NameStartChar (NameChar)*); the parser side accepts the
reference, so `parse(xml, true)` throws on a document `parse(xml)` reads. Entity names such as
`&nbsp_with_a_long_prefix;` in generated DTDs, or long HTML-like names, trip it.
'''

[[bug]]
id = "fast-xml-parser/7"
title = "XMLValidator reads a > inside a quoted entity value as the end of the DOCTYPE"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidatorReadsQuotedGreaterThanInEntityValue"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`XMLValidator.validate('<!DOCTYPE r [<!ENTITY e "a>b">]><r>&e;</r>')` gives
`{err: {code: "InvalidChar", msg: "char ']' is not expected."}}`: validator.js skips the DOCTYPE
(readCommentAndCDATA) by counting `<` and `>` regardless of quotes, so the `>` in the value
closes the `<!ENTITY` declaration, the next `>` closes the DOCTYPE, and the remaining `]>`
is judged as document content. `>` is legal in an entity value (EntityValue
excludes only `%`, `&` and the quote), and the parser itself reads the document as `a>b`.
Reproduced by `TestHegelValidatorAgreesWithExpat` on 5% of generated documents.
'''

[[bug]]
id = "fast-xml-parser/8"
title = "XMLValidator accepts a second root element or trailing text when a top-level tag is self-closing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinValidatorRejectsASecondRootAfterASelfClosingOne"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`XMLValidator.validate("<r/><s/>")`, `validate("<r/>tail")`, `validate("<r>a</r><s/>")`,
`validate("<r/><s>1</s>")` and `validate("<r></r><!--c--><s/>")` all return true, while
`<r></r><s></s>` is rejected with "Multiple possible root nodes found." and `<r></r>tail`
with "Extra text at the end". In validator.js the self-closing branch (`xmlData[i-1] === '/'`)
neither sets `reachedRoot` nor checks it, so a self-closing tag at the top level is invisible
to the single-root and trailing-text checks. expat: "junk after document element".
Reproduced by `TestHegelValidatorAgreesWithExpat` (mutations duplicating a tag).
'''

[[bug]]
id = "fast-xml-parser/9"
title = "XMLValidator misses an XML declaration inside or after the root element"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidatorRejectsXmlDeclarationInsideTheDocument"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`XMLValidator.validate('<r><?xml version="1.0"?></r>')` and
`validate('<?xml version="1.0"?><r/><?xml version="1.0"?>')` return true, though `xml` is a
reserved PI target and the declaration is allowed only at the very start (XML 1.0 2.6, 2.8;
expat: "XML or text declaration not at start of entity"). A second declaration in the prolog
is rejected ("XML declaration allowed only at the start of the document"), so the check
exists; on the path for PIs inside the root (`readPI(xmlData, ++i)`) the target is read one
character late as `?xml`, so the comparison with `xml` never matches.
'''

[[bug]]
id = "fast-xml-parser/10"
title = "XMLValidator accepts ]]> in text, < in attribute values, empty character references and -- inside comments"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidatorRejectsIllFormedTextAttributesReferencesAndComments"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Each of `<r>]]></r>`, `<r a="<"/>`, `<r>&#;</r>`, `<r>&#x;</r>` and `<r><!-- a -- b --></r>`
validates as true. All are well-formedness errors under XML 1.0 (2.4: `]]>` must not appear
in content; 2.3 AttValue excludes `<`; 4.1 CharRef needs at least one digit; 2.5 a comment must
not contain `--`); expat reports "not well-formed (invalid token)" for each. The README
recommends the separate fast-xml-validator for strict checking, but these are the validator's
own stated purpose (`validate` "checks whether the XML is well-formed").
Reproduced by `TestHegelValidatorAgreesWithExpat` (counted as `lax:` shapes).
'''

[[bug]]
id = "fast-xml-parser/11"
title = "captureMetaData offsets index the CRLF-normalised text, so xml.slice(startIndex, endIndex) is off after a CRLF"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMetaDataOffsetsIndexTheInput"
found = { commit = "bb2ec6ce4bfc3f62d621df6e6bf2b3152965175a", version = "5.11.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
docs/v5/2.XMLparseOptions.md (captureMetaData): the metadata's `startIndex`/`endIndex` are
such that `xmlData.slice(startIndex, endIndex)` is the tag's text. For
`"<r>\r\n<a><b/></a></r>"` the `a` node's metadata is `{startIndex: 4, endIndex: 15}` and the
slice of the input is `"\n<a><b/></a"`: the parser normalises `\r\n` to `\n` before parsing
and reports offsets into that shorter string, one short per CRLF before the tag. With `\n`
alone the slice is `"<a><b/></a>"` as documented.
'''
