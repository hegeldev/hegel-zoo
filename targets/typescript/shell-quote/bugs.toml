# Bugs found in shell-quote (ljharb/shell-quote) by the Hegel zoo. ids are shell-quote/N; see
# README.md for the properties. The oracle throughout is what a real shell (dash, bash) reads.

[[bug]]
id = "shell-quote/1"
title = "quote writes \\! inside double quotes, and the shell keeps the backslash"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBangInDoubleQuotesIsEscaped"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
A string with a single quote and a double quote or whitespace goes through the double-quote branch, which escapes `"`, `\`, `$`, `` ` `` and `!`: `quote(["it's!"])` is `"it's\!"`. Inside double quotes a backslash is only removed before `$`, `` ` ``, `"`, `\` and newline, so dash and bash both read the word as `it's\!` (and so does `parse`). The `!` escape is meant to fend off history expansion, which is off in every non-interactive shell; where it is on, bash's manual says the backslash before `!` is not removed either. The bareword branch's `\!` (outside quotes) is fine.
'''

[[bug]]
id = "shell-quote/2"
title = "parse keeps the backslash of \\` inside double quotes, so it cannot read quote's own output"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBacktickInDoubleQuotesKeepsTheBackslash"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The double-quote scanner drops a backslash only before `"`, `\` and `$`; the shell also drops it before `` ` `` (and newline). `parse('"a\\`b"')` gives `a\`b`, bash gives `a`b`. `quote` itself writes `` \` `` in its double-quote branch (`quote(["it's `x`"])` is ``"it's \`x\`"``), which the shell reads back correctly and `parse` does not, so `parse(quote(xs))` is not `xs` for such a string.
'''

[[bug]]
id = "shell-quote/3"
title = "a # inside a word starts a comment"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinHashInsideAWordIsNotAComment"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The scanner tests every unquoted character against `/^#$/`, so `parse('a#b')` is `['a', { comment: 'b' }]` and `parse('foo --tag=#1 bar')` loses `1 bar`. In the shell `#` starts a comment only at the start of a word; `a#b` is the word `a#b`. `quote` escapes `#` everywhere, so the round trip hides it.
'''

[[bug]]
id = "shell-quote/4"
title = "an escaped backslash before the closing double quote swallows the text up to the next quote"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedBackslashBeforeTheClosingQuote"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The chunker's double-quote pattern is `"((\\"|[^"])*?)"`: on `"\\" "x"` the first backslash matches `[^"]`, then the second backslash and the closing quote match the `\"` alternative, and the span runs on to the next `"`. `parse('"\\\\" "x"')` is `['\\ x']`; the shell reads `\` and `x`. The scanner itself gets the escapes right; it is the chunker that cannot count backslashes.
'''

[[bug]]
id = "shell-quote/5"
title = "a backslash-newline is not a line continuation"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBackslashNewlineIsALineContinuation"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
Unquoted, `a\<newline>b` is the word `ab` to the shell; `parse` gives `['a', 'b']` (the chunker ends the bareword at the newline, the trailing backslash is dropped as an escape of nothing). Inside double quotes `"a\<newline>b"` is `ab` to the shell and `a\<newline>b` to `parse` (the double-quote scanner keeps a backslash before anything but `"`, `\`, `$`).
'''

[[bug]]
id = "shell-quote/6"
title = "$_NAME is read as the special parameter $_ followed by text"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnderscoreStartsAVariableName"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`parseEnvVar` treats `_` as a one-character parameter (`/[*@#?$!_-]/`), so `parse('$_foo', { _foo: 'X' })` looks up `_` and gives `'oo'` (see shell-quote/7 for the missing `f`) instead of `X`. In the shell `_` starts an ordinary name: `$_foo` is the variable `_foo`, `$_JAVA_OPTIONS` is `_JAVA_OPTIONS`. `${_foo}` works.
'''

[[bug]]
id = "shell-quote/7"
title = "the character after a one-character parameter is dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCharacterAfterAOneCharacterParameterIsKept"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
For `$*`, `$@`, `$#`, `$?`, `$$`, `$!`, `$_`, `$-` the parser does `i += 1` after reading the character and the main loop's `i++` then skips the next one: `parse('$*x', { '*': 'S' })` is `['S']`, not `['Sx']`; `parse('$_foo')` loses the `f`. The `${...}` and plain-name branches position `i` on the last consumed character instead.
'''

[[bug]]
id = "shell-quote/8"
title = "a digit starts a variable name: $1x looks up 1x"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDigitDoesNotStartAVariableName"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The name is read with `/[^\w\d_]/`, so it may start with a digit: `parse('$1x', {})` is `['']` (the unknown variable `1x`), where the shell reads `$1` (a positional parameter, empty here) followed by `x` and gives `x`. Positional parameters are outside the README's "simple `$VARNAME`" scope; the point is that `1x` is not a name and the text after `$1` should survive.
'''

[[bug]]
id = "shell-quote/9"
title = "env lookups walk the prototype chain: $constructor expands to Object's source text"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEnvLookupIgnoresThePrototype"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`getVar` reads `env[key]` with no own-property check, so with the default `{}` env `parse('$constructor')` is `['function Object() { [native code] }']`, `$toString`/`$valueOf`/`$hasOwnProperty` likewise, and `$__proto__` (via shell-quote/6 and /7) is `'proto__'`. The README says undefined variables expand to `""`.
'''

[[bug]]
id = "shell-quote/10"
title = "parse splits words on CR, VT, FF, NBSP, U+2028 and the BOM, which the shell does not"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCarriageReturnDoesNotSplitAWord"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The bareword pattern excludes `\s`, JavaScript's whitespace class, so `parse('a\rb')` is `['a', 'b']` and so are `a\vb`, `a\fb`, `a b`, `a b`, `a﻿b`; the shell splits on space, tab and newline only and reads each as one word. `quote` single-quotes these strings, so its output reads back correctly.
'''

[[bug]]
id = "shell-quote/11"
title = "a backslash-escaped * or ? is reported as a glob"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedStarIsNotAGlob"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`isGlob` is set from the raw character before the escape flag is consulted: `parse('\\*')` is `[{ op: 'glob', pattern: '*' }]`, `parse('a\\?b')` a glob `a?b`; the shell reads literal `*` and `a?b`. Quoted `'*'` and `"*"` are handled (they stay strings). `quote(['a*b'])` writes `a\*b`, so `parse(quote(['a*b']))` comes back as a glob.
'''

[[bug]]
id = "shell-quote/12"
title = "with splitUnquoted, the fields split off before a glob character are lost"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFieldsBeforeAGlobAreKept"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
When a token has both an unquoted expansion that field-splits and an unquoted `*`/`?`, the `isGlob` return happens first and returns only `{ op: 'glob', pattern: out }`, discarding the `words` already flushed: `parse('a$V*', { V: 'x y' }, { splitUnquoted: true })` is `[{ op: 'glob', pattern: 'y*' }]` — the field `ax` is gone. The same word without the `*` gives `['ax', 'y']`.
'''

[[bug]]
id = "shell-quote/13"
title = "an object value in an object env comes out as the internal marker string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinObjectValueDoesNotLeakTheMarker"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`getVar` wraps any object value in a random per-process marker plus its JSON, and only the env-function path (`typeof env === 'function'`) splits the marker back out into an object token. With a plain object env, `parse('$F', { F: { k: 1 } })` is one string such as `b81f6419.c416de73...{"k":1}b81f6419.c416de73...`. The same leak happens on the function path when the token is a glob (`parse('x$F*', () => ({ k: 1 }))` returns a glob whose pattern contains the marker) — the object shortcut is taken for `{ op: 'glob' }` tokens too.
'''

[[bug]]
id = "shell-quote/14"
title = "an escaped backslash before a blank or a quote is read as escaping the blank or quote"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedBackslashDoesNotEscapeTheBlank"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The bareword pattern is `(\\['"|&;()<> \t]|[^\s'"|&;()<> \t])+`, and on `\\ x` the first backslash matches the plain class and the second one pairs with the blank, so the chunk is `\\ x` and `parse('\\\\ x')` is `['\\ x']` — one word where the shell reads `\` and `x`. Before a quote the same happens: `parse('\\\\"= &."')` is `['\\=', { op: '&' }, '.']`, the double-quoted span never being recognised. And before an operator character the scanner then meets an unescaped `|` mid-token and returns the whole chunk as an operator: `parse('\\\\|x')` is `[{ op: '\\\\|x' }]`, an `op` value that is not one of the control operators. The same pattern of not counting backslashes, in the double-quote chunker, is shell-quote/4.
'''

[[bug]]
id = "shell-quote/15"
title = "splitUnquoted: '' keeps an empty unquoted expansion as an empty word"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyIfsDropsAnEmptyExpansion"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`splitUnquoted: ''` is documented as an IFS that disables splitting, and in the code an empty `ifs` string is falsy, so the option falls back to the default mode entirely: `parse('a $E b', { E: '' }, { splitUnquoted: '' })` is `['a', '', 'b']`. With `splitUnquoted: true` the same input gives `['a', 'b']` (the fixtures pin "an empty unquoted expansion produces no token"), and bash under `IFS=''` gives `a b` too: an empty IFS stops field splitting but an unquoted expansion that is empty still produces no word.
'''

[[bug]]
id = "shell-quote/16"
title = "with splitUnquoted, an empty quoted string after a split expansion vanishes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyQuotesAfterASplitExpansionAreAWord"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`parse('a$W""', { W: ' ' }, { splitUnquoted: true })` is `['a']`; bash reads `a` and an empty word (`""` is a quoted null string, a field of its own after the blank). The token's end keeps an empty `out` only when `sawQuote && words.length === 0`, and here `words` already holds `a`, so the quoted empty word is dropped; `$W"${E}"` loses its word the same way. Without a preceding expansion `-x "" -y` keeps the empty string (a fixture).
'''

[[bug]]
id = "shell-quote/17"
title = "with splitUnquoted, an empty quoted string before a split expansion vanishes when a field follows"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyQuotesBeforeASplitExpansionAreAWord"
found = { commit = "35c9b97a744211091b772f145bef0b6a5562b68e", version = "1.10.0 (v1.10.0, main 2026-07-14)", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
notes = '''
`parse('""$W$C', { W: ' ', C: 'c' }, { splitUnquoted: true })` is `['c']`; bash reads an empty word and `c` (`""` is a quoted null string, a field of its own, and the blank in `$W` ends it). `parse('""$W', { W: ' a' }, ...)` is `['a']` the same way. The mirror of shell-quote/16: `flushRun` ends the pending field only `if (out !== '')`, so the empty quoted word before the blank is dropped when the next field arrives; `sawQuote` is consulted only at the token's end, and only when `words` is still empty, which is why `""$W` alone (`['']`) and `""$W$C` with `C` empty are right. Found by the split-unquoted property (bash oracle) once the word generator was a combinator value, in the old generator too at about one case in a thousand; the property gates the shape as `parse/split-drops-leading-empty-quoted`.
'''
