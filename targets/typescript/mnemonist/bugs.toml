# Bugs found in mnemonist 0.40.4 (1f2c752) by the properties in hegel.patch. Each has a pin in
# hegel/pins.mjs asserting the correct behaviour, listed as an expected failure in target.toml.

[[bug]]
id = "mnemonist/1"
title = "Heap.nsmallest(1, []) is [Infinity] and nlargest(1, []) is [-Infinity]"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNsmallestOfOneOnEmptyIsEmpty"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The n == 1 fast path uses Infinity / -Infinity as the sentinel and returns it unconditionally (heap.js nsmallest/nlargest); a typed array gives [0]. n >= 2 correctly gives []."

[[bug]]
id = "mnemonist/2"
title = "BitSet.select and BitVector.select do not advance their position over a skipped all-zero word"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSelectSkipsNoPositions"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "`if (byte === 0) continue;` skips the word without adding 32 to the position: new BitSet(100).set(40) then select(1) is 8, not 40. Same loop in bit-vector.js."

[[bug]]
id = "mnemonist/3"
title = "FixedStack.forEach visits every slot of the capacity, empty ones included"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFixedStackForEachStopsAtSize"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "forEach loops to this.items.length (the capacity) while values()/toArray() use this.size: capacity 5 with two pushes calls back with undefined, undefined, undefined, 2, 1 (zeros for a typed array)."

[[bug]]
id = "mnemonist/4"
title = "FixedDeque.get and CircularBuffer.get return stale or wrapped items for an index at or past the size, or negative"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDequeGetPastTheSizeIsUndefined"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "get bounds the index by the capacity, not the size: after push 1, 2, 3 and two shifts on a capacity of 3, get(1) is 1 and get(2) is 2 instead of undefined."

[[bug]]
id = "mnemonist/5"
title = "MultiSet.set on a present key adds the count to the existing multiplicity instead of replacing it"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinMultiSetSetReplacesTheCount"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "add('a', 3) then set('a', 2) leaves multiplicity 5 and size 5. The library's own test only sets a fresh key."

[[bug]]
id = "mnemonist/6"
title = "MultiSet.delete of an absent key returns true, makes size NaN and decrements dimension"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinMultiSetDeleteOfAnAbsentKeyIsFalse"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The `count === 0` check never fires for undefined, so size -= undefined and dimension-- run; frequency() then returns NaN for every key."

[[bug]]
id = "mnemonist/7"
title = "MultiSet.edit into a present key leaves dimension one too high"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMultiSetEditMergesTheDimension"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "add('a'), add('b'), edit('a', 'b') merges the counts but dimension stays 2."

[[bug]]
id = "mnemonist/8"
title = "MultiSet.edit(a, a) deletes the key and leaves size stale"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMultiSetEditToItselfKeepsTheKey"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "edit sets b to am + bm then deletes a; when a === b the key vanishes while size still counts it."

[[bug]]
id = "mnemonist/9"
title = "BitSet.reset and BitVector.reset of a clear bit decrement size when bit 31 of the word is set"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinResetOfAClearBitKeepsTheSize"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The `&=` result is a negative int32 while the Uint32Array holds it as positive, so newBytes < oldBytes even when nothing changed (set(i, 0) and flip apply >>> 0 and are fine): new BitSet(32), set(31), reset(0) gives size 0."

[[bug]]
id = "mnemonist/10"
title = "BitSet.select(r) is -1 for r >= length even when the rth one exists, and undefined past the last one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSelectOfTheLastOneInAFullSet"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The bound check compares the 1-based rank with the length instead of the size: new BitSet(1), set(0), select(1) is -1; new BitSet(4), set(0), select(2) is undefined instead of -1."

[[bug]]
id = "mnemonist/11"
title = "LRUCacheWithDelete and LRUMapWithDelete corrupt the recency list when the most or least recently used key is deleted"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDeleteOfTheMostRecentKeyKeepsTheList"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The head's backward pointer (and the tail's forward pointer) is never maintained, so delete/remove read a stale neighbour and overwrite a live node's link: capacity 4, set a b c d, get b, delete b gives keys d, c, d."

[[bug]]
id = "mnemonist/12"
title = "SparseMap.delete moves the last key into the hole but not its value"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSparseMapDeleteMovesTheValue"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "set(1, 'a'), set(2, 'b'), delete(1) leaves get(2) === 'a'."

[[bug]]
id = "mnemonist/13"
title = "SparseQueueSet of capacity 256 (or 65536) keeps a dequeued member present"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSparseQueueSetOf256Dequeues"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "dequeue writes the sentinel this.capacity into a pointer array sized for capacity - 1, so 256 wraps to 0: has(7) stays true and enqueue(7) is refused after 7 was dequeued."

[[bug]]
id = "mnemonist/14"
title = "BitVector.pop neither decrements size nor clears the bit"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBitVectorPopClearsTheBit"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "push(1), pop(), push(0) leaves size 1 and get(0) === 1. resize() below the length leaves size stale too."

[[bug]]
id = "mnemonist/15"
title = "BitVector.forEach, values, entries and select run over the capacity instead of the length"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBitVectorIterationStopsAtTheLength"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The loops iterate array.length words and apply `length % 32 || 32` to the last capacity word: push 1, 0, 1 then grow(64) iterates 35 values; any vector grown by pushes is affected."

[[bug]]
id = "mnemonist/16"
title = "BitVector.set, get and test accept an index equal to the length"
kind = "contract"
severity = "low"
test = "TestHegelPinBitVectorSetAtTheLengthThrows"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The bound check is `this.length < index`: new BitVector(5).set(5) sets an invisible bit and counts it in size instead of throwing 'index out of bounds'."

[[bug]]
id = "mnemonist/17"
title = "Vector.get(length) returns a stale value and set(length) writes past the end"
kind = "contract"
severity = "low"
test = "TestHegelPinVectorGetAtTheLengthIsUndefined"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "Same off-by-one as /16 in vector.js get/set: push 1, push 2, pop leaves get(1) === 2 and set(1, 9) succeeds without growing (silently lost when length === capacity)."

[[bug]]
id = "mnemonist/18"
title = "HashedArrayTree.pop reads the last allocated block instead of the block holding the last item"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinHashedArrayTreePopReadsTheLastItem"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "blockSize 2, initialCapacity 8: push 1, 2, 3 then pop() returns 0. Any capacity exceeding the length by a block is affected."

[[bug]]
id = "mnemonist/19"
title = "HashedArrayTree.get and set accept an index equal to the length: a stale value or a TypeError"
kind = "crash"
severity = "low"
test = "TestHegelPinHashedArrayTreeGetAtTheLengthIsUndefined"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "`this.length < index` again: with blockSize 2 and two items get(2) throws 'Cannot read properties of undefined' and set(2, 5) throws a TypeError instead of the documented out-of-bounds Error; with blockSize 4 and one item get(1) is 0."

[[bug]]
id = "mnemonist/20"
title = "merge and unionUnique of three or more sorted arrays crash when one of them is empty"
kind = "crash"
severity = "medium"
test = "TestHegelPinKWayMergeAcceptsAnEmptyArray"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "kWayMergeArrays / kWayUnionUniqueArrays filter the empty arrays out but push the unfiltered count of indices into the heap: merge([1,4],[2,5],[3,6],[]) throws a TypeError."

[[bug]]
id = "mnemonist/21"
title = "unionUnique and intersectionUnique of two typed arrays throw 'array.push is not a function'"
kind = "crash"
severity = "low"
test = "TestHegelPinUniqueMergesAcceptTypedArrays"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The two-way variants build `new a.constructor()` and push into it (mergeArrays preallocates and works); the header says the helpers accept array-like structures."

[[bug]]
id = "mnemonist/22"
title = "intersectionUnique of three or more arrays returns [x] when the largest first element equals the smallest last element, though x may be missing from the others"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIntersectionUniqueChecksEveryArray"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The `maxStart === minEnd` shortcut in kWayIntersectionUniqueArrays: intersectionUnique([3,9],[0,3],[1,2,4]) is [3]."

[[bug]]
id = "mnemonist/23"
title = "LinkedList.shift of the only item leaves last() pointing at the removed item"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLinkedListShiftOfTheOnlyItemClearsTheTail"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "shift never resets this.tail when the list becomes empty: push(1), shift() then last() is 1 with size 0."

[[bug]]
id = "mnemonist/24"
title = "BloomFilter truncates to zero bytes and zero hash functions for a small capacity or an error rate of 0.5 or more, then tests positive for everything"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBloomFilterAlwaysHashes"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "clear() computes length = (bits / 8) | 0 and hashFunctions = (length * 8 / capacity * LN2) | 0 without a floor of 1: {capacity: 1, errorRate: 0.05} and {capacity: 1000, errorRate: 0.5} both get no data and test() true for every string; errorRate > 1 throws 'Invalid typed array length: -1'."

[[bug]]
id = "mnemonist/25"
title = "getMinimalRepresentation picks a typed array that cannot hold mixed signed and unsigned values"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMinimalRepresentationHoldsMixedSigns"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The priority table ranks Int8 above Uint8 and Uint16 above Int8: [200, -1] gives Int8Array (200 does not fit) and [40000, -1] gives Uint16Array (-1 does not fit)."

[[bug]]
id = "mnemonist/26"
title = "SymSpell with verbosity 0 or 1 zeroes the count of a stored word, which is then dropped or returned with count 0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSymSpellKeepsTheCountOfStoredWords"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "addLowestDistance sets item.count = 0 when a new word's delete coincides with a stored word whose suggestion is farther (the reference clears only the suggestions): add abc, a, ab with maxDistance 2 and verbosity 1, then search('a') returns ab at distance 1 and not a itself."

[[bug]]
id = "mnemonist/27"
title = "SymSpell verbosity 0 does not return the nearest term and verbosity 1 mixes distances or drops the nearest ones"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSymSpellReturnsTheNearestTerm"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "Direct candidates are appended without the distance reset and nothing is sorted before slice(0, 1): add abcd, a with maxDistance 2, search('ab') gives abcd (distance 2) under verbosity 0 and both terms under verbosity 1. Verbosity 2 is correct."

[[bug]]
id = "mnemonist/28"
title = "LRUCache.has('constructor') is true on a fresh cache and get of such a key corrupts the list"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLRUCacheHasNoPrototypeKeys"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "items is a plain object queried with `key in this.items`, so Object.prototype names are present; get('constructor') splays Object to the top and keys() yields undefined. LRUCacheWithDelete inherits it; the LRUMap variants use a Map and are fine."

[[bug]]
id = "mnemonist/29"
title = "LRU setpop returns null when the evicted key is falsy (0 or '')"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSetpopReportsAFalsyEvictedKey"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "`if (oldKey)` in LRUCache, LRUMap and both WithDelete variants: capacity 1, set(0, 'zero'), setpop(1, 'one') is null instead of {evicted: true, key: 0, value: 'zero'}."

[[bug]]
id = "mnemonist/30"
title = "FixedStack.from, FixedDeque.from and CircularBuffer.from with more items than the capacity produce a structure whose size exceeds its capacity"
kind = "contract"
severity = "medium"
test = "TestHegelPinFromRespectsTheCapacity"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The array-like fast path copies without a capacity check: CircularBuffer.from([1,2,3], Array, 2) has size 3 and toArray [1,2,1]; FixedStack.from([1,2,3], Uint8Array, 2) has size 3 and toArray [0,2,1]. The push path would throw (fixed) or overwrite (circular)."

[[bug]]
id = "mnemonist/31"
title = "FixedStack.from, FixedDeque.from and CircularBuffer.from throw on any non-array iterable"
kind = "crash"
severity = "medium"
test = "TestHegelPinFromAcceptsASet"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "They call iterables.forEach, which utils/iterables.js does not export: FixedDeque.from(new Set([1,2,3]), Array) throws 'iterables.forEach is not a function' (Vector.from uses obliterator/foreach and works)."

[[bug]]
id = "mnemonist/32"
title = "FixedReverseHeap accepts a capacity of 0 or a non-number, then push throws"
kind = "contract"
severity = "low"
test = "TestHegelPinFixedReverseHeapRejectsCapacityZero"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The validation reads `typeof capacity !== 'number' && capacity <= 0`, which is never true; new FixedReverseHeap(Array, cmp, 0) is built and its first push fails inside the comparator."

[[bug]]
id = "mnemonist/33"
title = "merge of three or more arrays with the longest of exactly 256 (or 65536) items loops for seconds and throws a RangeError"
kind = "crash"
severity = "medium"
test = "TestHegelPinKWayMergeOf256Items"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The pointer array is sized by getPointerArray(max) for values up to max - 1, but a pointer must reach max: a Uint8Array wraps 256 to 0 and the longest array is consumed again until 'Invalid array length' (after about 5 s). 255 items work."

[[bug]]
id = "mnemonist/34"
title = "MultiArray in dynamic mode loses items once a container holds more than 255"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinMultiArrayHoldsMoreThan255Items"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "tails and lengths are PointerVectors sized by the number of containers, not by the number of items, so their word size is 8 bits: 300 set(0, i) calls leave get(0).length 44. Fixed-capacity mode sizes them correctly."

[[bug]]
id = "mnemonist/35"
title = "SuffixArray is unsorted whenever the length is 7 or more and congruent to 1 modulo 3"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSuffixArrayOfLengthSeven"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The Karkkainen-Sanders skew construction omits the dummy mod-1 suffix required when n % 3 == 1, so the recursion sorts across the boundary of the reduced string: 'aaaaaaa' gives [6,5,3,0,2,4,1]; exhaustive over {a,b}: 18/128 wrong at length 7, 228/1024 at 10, 2520/8192 at 13, none at other lengths. GeneralizedSuffixArray.longestCommonSubsequence inherits it ('baaaa', 'aaaa' gives 'aaa')."

[[bug]]
id = "mnemonist/36"
title = "GeneralizedSuffixArray.longestCommonSubsequence of three or more strings uses only the first boundary and may return the separator"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLongestCommonSubstringOfThreeStrings"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "Strings 2..n are treated as one text and the suffix starting at the separator is on neither side: ['abc','xab','ybc'] gives 'ab' (expected 'b'), ['ab','ab','cd'] gives 'ab\\u0001' (expected ''). Independent of /35."

[[bug]]
id = "mnemonist/37"
title = "InvertedIndex.forEach never calls back"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInvertedIndexForEachVisitsTheDocuments"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "forEach iterates this.documents.length, where documents is a method of arity 0, instead of this.items. The library's test passes vacuously because its assertions live inside the callback."

[[bug]]
id = "mnemonist/38"
title = "new StaticIntervalTree([]) throws a TypeError"
kind = "crash"
severity = "low"
test = "TestHegelPinEmptyIntervalTree"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "buildBST runs with low 0 and high -1 and indexes intervals[undefined]; StaticIntervalTree.from(new Set()) likewise."

[[bug]]
id = "mnemonist/39"
title = "KDTree queries on an empty tree overflow the stack (nearestNeighbor) or throw (kNearestNeighbors)"
kind = "crash"
severity = "low"
test = "TestHegelPinEmptyKDTreeQueries"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "KDTree.from([], 2) builds (size 0) but the traversal tests `left !== 0` on undefined from zero-length typed arrays and recurses on node 0 forever; linearKNearestNeighbors returns []."

[[bug]]
id = "mnemonist/40"
title = "VPTree.nearestNeighbors(0, query) throws a TypeError"
kind = "crash"
severity = "low"
test = "TestHegelPinVPTreeZeroNeighbours"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The candidate heap is popped when it exceeds k and then peeked: with k 0 peek() is undefined and .distance throws. KDTree rejects k <= 0 with a clear error."

[[bug]]
id = "mnemonist/41"
title = "Trie and TrieMap keys containing '\\u0000' collide with the internal value slot"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTrieKeysMayContainNul"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The NUL character is the sentinel under which values are stored: set('\\u0000', 1) makes has('') true and get('') the node; set('a', 1) then set('a\\u0000', 2) throws 'Cannot use in operator'."

[[bug]]
id = "mnemonist/42"
title = "Trie(Array) with a token named like an Object.prototype property reads and writes the prototype"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTrieTokensNamedLikePrototypeProperties"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "Nodes are plain objects walked with `node[token] ||`, so a token such as 'constructor', 'toString' or 'hasOwnProperty' descends into the inherited function and stores children on it globally: after new Trie(Array).add(['hasOwnProperty']) every fresh Trie(Array) has that key; add(['__proto__']) sets Object.prototype['\\u0000']. String keys are tokenised per character and unaffected."

[[bug]]
id = "mnemonist/43"
title = "The typings declare members that do not exist at runtime: Vector.clear/forEach/toJSON, BitVector.clear and the InverseMap export"
kind = "contract"
severity = "low"
test = "TestHegelPinTypingsMatchTheRuntime"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "vector.d.ts (Vector and the typed vectors) and bit-vector.d.ts declare clear(), forEach() and toJSON() that are undefined on the prototypes; bi-map.d.ts and index.d.ts export class InverseMap while bi-map.js exports only BiMap. Also noted: lru-cache.d.ts set(): this (runtime undefined), default-map.d.ts autoIncrement(): number (runtime a factory function), fuzzy-map.d.ts from(Iterable<[K, V]>) while the runtime passes whole elements to add()."

[[bug]]
id = "mnemonist/44"
title = "Vector.resize below the capacity deallocates although documented not to"
kind = "contract"
severity = "low"
test = "TestHegelPinVectorResizeKeepsTheCapacity"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "The JSDoc says 'Won't deallocate' but resize(length) calls reallocate(length), which shrinks: new Vector(Uint8Array, 10).resize(5) has capacity 5."

[[bug]]
id = "mnemonist/45"
title = "CritBitTreeMap and FixedCritBitTreeMap lose keys with a character code above 255"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCritBitKeysBeyondLatin1"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "getDirection masks char codes with 0xff and the critical bit is found with 8-bit helpers, so 'a' (0x61) and '\\u0101' collide: set('a', 1), set('\\u0101', 2) leaves get('a') undefined; keys with 'é' only are fine. Both maps are reachable as mnemonist/critbit-tree-map but not exported from index.js."

[[bug]]
id = "mnemonist/46"
title = "sort/insertion.js assigns an undeclared global variable i"
kind = "contract"
severity = "low"
test = "TestHegelPinInsertionSortLeaksNoGlobal"
found = { commit = "1f2c752049eb3439f3987310391ae5e123e97dfe", version = "0.40.4", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = "inplaceInsertionSort and inplaceInsertionSortIndices write `i = lo + 1` without var, creating globalThis.i (a ReferenceError under strict mode or when bundled as ESM). The sorting itself is correct."
