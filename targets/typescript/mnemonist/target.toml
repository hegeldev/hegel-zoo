name = "mnemonist"
language = "typescript"
upstream = "https://github.com/Yomguithereal/mnemonist"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-19"  # README (Contribution section), .github/ (FUNDING, tests workflow), no CONTRIBUTING: nothing about AI

[base]
commit = "1f2c752049eb3439f3987310391ae5e123e97dfe"
date = "2026-04-30"
version = "0.40.4"

[hegel]
version = "0.4.5"

[run]
# The package is plain CommonJS at the repository root with one runtime dependency (obliterator),
# installed from the lock file; Hegel is installed under .hegel/ so package.json stays untouched.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev --ignore-scripts",
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

