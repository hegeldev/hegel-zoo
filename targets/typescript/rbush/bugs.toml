# Bugs found in rbush by the Hegel properties in hegel.patch. Each is pinned by the test named in
# `test`, which fails while the bug is present.

[[bug]]
id = "rbush/1"
title = "all() throws RangeError (Maximum call stack size exceeded) on a node with ~150000 or more children; search() through its containment shortcut too"
kind = "crash"
severity = "low"
test = "TestHegelPinAllOnLargeLeaf"
found = { commit = "e59712716a84dda2e31f9b471b32faa178d8056f", version = "4.0.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`_all` collects a node with `result.push(...node.children)` (and `nodesToSearch.push(...node.children)`
for inner nodes): spread arguments live on the call stack, and about 150000 of them overflow Node's
default stack. `new RBush(300000).load(300000 points)` — the README says only "higher value means
faster insertion and slower search" about maxEntries — is built and `search()` of the whole plane
returns all 300000 items (the leaf loop pushes one at a time), but `all()` throws RangeError; a
search whose bbox contains such a node throws the same way. A loop or `result.push.apply` in chunks
avoids the limit.
'''

[[bug]]
id = "rbush/2"
title = "maxEntries is not validated: new RBush(NaN) makes load() throw a TypeError from inside the bulk build; a fractional value (4.5) bulk-loads a malformed tree that later insert()/search() calls trip over"
kind = "crash"
severity = "low"
test = "TestHegelPinMaxEntriesValidated"
found = { commit = "e59712716a84dda2e31f9b471b32faa178d8056f", version = "4.0.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The constructor keeps `Math.max(4, maxEntries)`. With NaN (say `parseInt` of a missing setting, or
`new RBush("nine")`) `_maxEntries` and `_minEntries` are NaN: `insert()` works but never splits, and
`load()` of any non-empty array takes the OMT path (`data.length < NaN` is false), computes a NaN
height and slice sizes, builds a node with no children and throws
"Cannot read properties of undefined (reading 'minX')" from `calcBBox`. With a fractional value
such as 4.5 `_build` recurses with `height - 1 = 0` for slices that are still larger than the node
size, re-computes the height as if at the top, and produces non-leaf nodes of height 1 whose
children are nodes of height 2: `search()` right after the load still answers correctly, but a
later `insert()` (whose level arithmetic assumes decreasing heights) puts items among nodes, and
`insert()` or the next `search()` throws "Cannot read properties of undefined (reading 'children')"
or "node.children is not iterable" (in a sweep of 300 random data sets of 10–210 items, about half
of the trees built with maxEntries 4.5 or 6.25 crashed after 20 insertions). Rounding maxEntries to
an integer, or rejecting non-integers, fixes both.
'''

[[bug]]
id = "rbush/3"
title = "One item with a NaN or missing coordinate blinds the whole tree: search()/collides() find nothing and remove() finds nothing, while all() still lists every item"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNaNItemDoesNotBlindTheTree"
found = { commit = "e59712716a84dda2e31f9b471b32faa178d8056f", version = "4.0.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`extend(a, b)` uses Math.min/Math.max, so an item whose bbox has NaN — or an undefined property from
a misspelt name, `{minx: 5, minY: 0, maxX: 6, maxY: 1}` — turns the coordinate NaN in every node on its
insertion path including the root (`load()` puts it into every ancestor the same way). Every
comparison with NaN is false, so `intersects(bbox, root)` fails at once: `search()` returns [] and
`collides()` false for every query, and `remove()` never descends (`contains` is false), so neither
the bad item nor any other can be removed; `all()` still returns everything and `clear()` is the
only way out. Checking the four coordinates on insert (a TypeError), or treating NaN as
"unbounded", would keep the other items searchable.
'''
