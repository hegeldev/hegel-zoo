name = "rbush"
language = "typescript"
upstream = "https://github.com/mourner/rbush"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # README, .github/ (one workflow), no CONTRIBUTING: no AI policy

[base]
commit = "e59712716a84dda2e31f9b471b32faa178d8056f"
date = "2026-04-03"
version = "4.0.1"

[hegel]
version = "0.4.5"

[run]
# index.js is a plain ES module; its one runtime dependency (quickselect) is installed without
# touching the lock file, Hegel goes under .hegel/.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev quickselect@3.0.0",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
# The sequence property reaches rbush/3 (a NaN coordinate on one item in a hundred) in about a
# quarter of its cases and shrinks to it in most runs (once in thirteen to rbush/2); the load and
# API properties reach rbush/2 (NaN or fractional maxEntries) in 2-3% of their cases and are
# intermittent at 100 cases; one narrow property per bug draws its shape region and fails every
# run. HEGEL_NO_KNOWN=1 leaves the shapes out and skips the narrow properties.
TestHegelSearchLikeBruteForce = "rbush/3"
TestHegelLoadLikeInserts = { bug = "rbush/2", intermittent = true }
TestHegelApiSurface = { bug = "rbush/2", intermittent = true }
TestHegelHugeLeavesSearchLikeBruteForce = "rbush/1"
TestHegelNaNMaxEntriesSearchLikeBruteForce = "rbush/2"
TestHegelFractionalMaxEntriesSearchLikeBruteForce = "rbush/2"
TestHegelNaNCoordinateItemsSearchLikeBruteForce = "rbush/3"
TestHegelPinAllOnLargeLeaf = "rbush/1"
TestHegelPinMaxEntriesValidated = "rbush/2"
TestHegelPinNaNItemDoesNotBlindTheTree = "rbush/3"
