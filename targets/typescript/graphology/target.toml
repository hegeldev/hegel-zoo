name = "graphology"
language = "typescript"
upstream = "https://github.com/graphology/graphology"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # no AI-contribution policy in README, .github or the package READMEs

[base]
commit = "65e278f0075de97bee3fce12d10e423752ed395a"
date = "2026-09-02"
version = "0.26.0"

[hegel]
version = "0.4.5"

[run]
# A lerna monorepo: the core (src/graphology, ESM source) and the standard-library packages
# (CommonJS, requiring each other by package name) are bundled by esbuild from hegel/entry.mjs
# into hegel/graphology.mjs, the intra-repo names aliased to their directories and the four
# external runtime dependencies installed under .hegel/ (resolved through NODE_PATH).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 esbuild@0.25.10 events@3.3.0 mnemonist@0.39.8 @yomguithereal/helpers@1.1.1 pandemonium@2.4.1",
  "NODE_PATH=.hegel/node_modules .hegel/node_modules/.bin/esbuild hegel/entry.mjs --bundle --format=esm --platform=node --outfile=hegel/graphology.mjs --alias:graphology-utils=./src/utils --alias:graphology-indices=./src/indices --alias:graphology-shortest-path=./src/shortest-path --alias:graphology-operators=./src/operators --alias:graphology-generators=./src/generators --alias:graphology-assertions=./src/assertions --alias:graphology-metrics=./src/metrics --alias:graphology=./src/graphology/src/endpoint.esm.js",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinEdgesFromSourceToTargetExcludeTheReverseEdge = "graphology/1"
TestHegelPinToDirectedHandlesCoincidingEdgesWithoutAMergeFunction = "graphology/2"
TestHegelPinPathCentralitiesOfAnEmptyGraphAreEmpty = "graphology/3"
TestHegelPinPowerIterationCentralitiesOfAnEmptyGraphAreEmpty = "graphology/4"
TestHegelPinEccentricityOfAnIsolatedSingleNodeIsZero = "graphology/5"
TestHegelPinCentralitiesIgnorePhantomNeighboursOfTheLastNode = "graphology/6"
TestHegelPinSimpleSizeCountsAnUndirectedSelfLoopOnce = "graphology/7"
TestHegelPinDegreeCentralityOfAOneNodeGraphIsANumber = "graphology/8"
