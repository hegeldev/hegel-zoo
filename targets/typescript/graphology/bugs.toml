# Bugs found in graphology and its standard library (graphology/graphology) by the Hegel zoo. ids
# are graphology/N; see README.md for the properties. The oracle is a brute-force model of the
# documented graph semantics and of the textbook algorithms.

[[bug]]
id = "graphology/1"
title = "edges(source, target) and directedEdges(source, target) also return the directed edges going from target to source, where the documentation says they return the edges going from source to target"
kind = "contract"
severity = "low"
test = "TestHegelPinEdgesFromSourceToTargetExcludeTheReverseEdge"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
docs/iteration.md documents the two-argument form of `#.edges` and its variants as "the relevant edges going from source to target". On `graph.mergeEdgeWithKey('a->b', 'a', 'b'); graph.mergeEdgeWithKey('b->a', 'b', 'a')` in a DirectedGraph, `graph.edges('a', 'b')` returns `['a->b', 'b->a']` and so does `graph.directedEdges('a', 'b')`; `graph.outEdges('a', 'b')` returns `['a->b']` as expected, and `graph.hasDirectedEdge('a', 'b')` / `graph.outEdges` follow the documented direction. In src/graphology/src/iteration/edges.js the path form is created with `direction` null for `edges`/`directedEdges`, and `createEdgeIteratorForPath` / `forEachEdgeForPath` then look the target up in both `sourceData.out` and `sourceData.in`, so the mutual edge comes back too (the same for `forEachEdge`, `mapEdges`, `filterEdges`, `findEdge`, `someEdge`, `everyEdge` and `edgeEntries` with two arguments). Either the code or the sentence is wrong; the core test suite only pins the two-argument form on graphs without mutual edges.
'''

[[bug]]
id = "graphology/2"
title = "operators.toDirected throws TypeError mergeEdge is not a function on a mixed simple graph where an undirected edge coincides with a directed one, unless a merge function is passed"
kind = "crash"
severity = "medium"
test = "TestHegelPinToDirectedHandlesCoincidingEdgesWithoutAMergeFunction"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `graph.mergeEdgeWithKey('d', 'a', 'b'); graph.mergeUndirectedEdgeWithKey('u', 'a', 'b')` in a mixed graph, `toDirected(graph)` throws `TypeError: mergeEdge is not a function`. The documentation (docs/standard-library/operators.md) presents the merge function as optional ("Note that you can pass a function to merge edge attributes in case of mixed edges conflicts"). In src/operators/to-directed.js `mergeEdge` is `null` when no function is given, and the branches for an undirected edge whose `source -> target` or `target -> source` counterpart already exists in the directed copy call `mergeEdge(...)` unconditionally; `toUndirected` (to-undirected.js) guards the same situation with `if (mergeEdge)` and keeps the existing attributes, and `toSimple` behaves likewise. Multi graphs are unaffected (no merging happens).
'''

[[bug]]
id = "graphology/3"
title = "closeness, betweenness and edgeBetweenness centrality throw mnemonist capacity should be a positive number on an empty graph"
kind = "crash"
severity = "low"
test = "TestHegelPinPathCentralitiesOfAnEmptyGraphAreEmpty"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`closeness(new Graph())` throws `mnemonist/fixed-deque: capacity should be a positive number.`, `betweenness(new Graph())` and `edgeBetweenness(new Graph())` throw the same for `mnemonist/fixed-stack`. The three functions allocate a FixedDeque / FixedStack of capacity `graph.order` before looking at the graph (src/metrics/centrality/closeness.js `IndexedBFS`, src/shortest-path/indexed-brandes.js), and mnemonist rejects a zero capacity. `degreeCentrality`, `hits`, `density` and `coreNumber` return an empty result / 0 for the same graph, which is what a caller computing metrics over an arbitrary (possibly filtered-to-empty) graph expects.
'''

[[bug]]
id = "graphology/4"
title = "pagerank and eigenvector centrality throw failed to converge on an empty graph"
kind = "crash"
severity = "low"
test = "TestHegelPinPowerIterationCentralitiesOfAnEmptyGraphAreEmpty"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`pagerank(new Graph())` throws `graphology-metrics/centrality/pagerank: failed to converge.` and `eigenvector(new Graph())` throws the eigenvector equivalent. With no nodes the power iteration's error term is never below the tolerance in the sense the code tests (the loop runs its `maxIterations` over an empty vector and then reports non-convergence), where the natural result is `{}`; `hits` returns `{hubs: {}, authorities: {}}` for the same input.
'''

[[bug]]
id = "graphology/5"
title = "eccentricity and diameter of a graph with one node and no edges are Infinity instead of 0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEccentricityOfAnIsolatedSingleNodeIsZero"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`graph.addNode('a'); eccentricity(graph, 'a')` returns `Infinity`, and `diameter(graph)` too. src/metrics/node/eccentricity.js starts with `if (graph.size === 0) return Infinity;`, a shortcut meant for disconnected graphs (several nodes and no edges), which also fires for the one-node graph where every node is reachable from `a` (itself, at distance 0) and the general code below it would return 0. networkx gives 0 for the eccentricity of the only node and 0 for the diameter; the function's own rule ("Infinity when some node is unreachable, else the maximum distance") gives 0 as well.
'''

[[bug]]
id = "graphology/6"
title = "graphology-indices NeighborhoodIndex gives the last node phantom neighbours whenever the graph has parallel edges, undirected self loops or a directed edge beside an undirected one, so closeness, betweenness, pagerank, eigenvector and hits are wrong or fail to converge on such graphs"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinCentralitiesIgnorePhantomNeighboursOfTheLastNode"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In an undirected graph with `a--b`, a self loop `a--a` and an isolated node `c`, `closeness(graph)` gives `c` a closeness of 1 (it should be 0: nothing reaches `c`) and `pagerank(graph)` throws "failed to converge"; in a multi graph `a--b`, `a--b`, `b--c`, `closeness(graph).c` is 1 instead of 2/3 (`c` reaches `a` directly through the phantom edge), and in the random graphs of the properties betweenness values are off as well (a 7-node mixed graph with a directed edge beside an undirected one gave 0.1333 where 0.15 is right). In src/indices/neighborhood.js `NeighborhoodIndex` (and `WeightedNeighborhoodIndex`) allocate the flat neighbourhood array with `upperBoundPerMethod` (`directedSize + 2 * undirectedSize` for the outbound/inbound methods) and fill it from `graph.<method>Neighbors(node)`, which lists each neighbour once; the constructor then sets the final boundary to `starts[order] = upperBound` instead of to the number of entries written. Whenever neighbours are fewer than edge ends (parallel edges in a multi graph, an undirected self loop, a directed edge next to an undirected one between the same pair, a mixed graph's mutual pairs), the unwritten tail of the typed array is read as neighbours of the last node in `graph.nodes()` order, and its value 0 is node 0: the last node acquires phantom edges to the first node (as many as the shortfall). Every consumer of the index is affected: closeness (src/metrics/centrality/closeness.js), betweenness and edge betweenness (src/shortest-path/indexed-brandes.js), pagerank, eigenvector and hits (which iterate the index), and in graphs where the last node is otherwise a sink the phantom edge feeds rank into node 0 or, as above, breaks convergence. Multigraphs and self loops are first-class options of graphology (`multi: true`, `allowSelfLoops: true` is the default), so the results are silently wrong on ordinary inputs. Setting `starts[order]` to the count written (`n`) fixes it.
'''

[[bug]]
id = "graphology/7"
title = "metrics.graph.simpleSize of a multi graph with an undirected self loop is fractional (5.5): the loop is counted once but halved with the other undirected neighbours"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSimpleSizeCountsAnUndirectedSelfLoopOnce"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In a MultiGraph with `a--a` (undirected self loop) and two parallel `a->b` edges, `simpleSize(graph)` returns 1.5; the simple version of the graph has 2 edges (`toSimple(graph).size` is 2). src/metrics/graph/simple-size.js counts, for a multi graph, the undirected neighbours of every node and halves the total (each undirected edge is seen from both ends), then adds the out-neighbours; an undirected self loop is seen once (a node is its own neighbour once), so it contributes 0.5. Density variants that call `simpleSize` for multi graphs (`undirectedDensity`, `mixedDensity`, `directedDensity` on a multi graph) inherit the fraction. Simple graphs return `graph.size` and are unaffected.
'''

[[bug]]
id = "graphology/8"
title = "degree centrality of the single node of a one-node graph is NaN (0 / 0) instead of a number"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDegreeCentralityOfAOneNodeGraphIsANumber"
found = { commit = "65e278f0075de97bee3fce12d10e423752ed395a", version = "0.26.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`graph.addNode('a'); degreeCentrality(graph)` returns `{a: NaN}` (also `inDegreeCentrality` / `outDegreeCentrality`, and the `.assign` variants write NaN into the node attribute). src/metrics/centrality/degree.js divides each degree by `graph.order - 1`, which is 0 here; networkx returns 1 for the only node of a one-node graph (degree_centrality special-cases `len(G) <= 1`), and 0 would be defensible too, but NaN propagates into any downstream sum or comparison. An empty graph returns `{}`.
'''
