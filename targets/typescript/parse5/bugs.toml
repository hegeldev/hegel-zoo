# Bugs found in parse5 by the zoo's Hegel tests. Each has a pin in hegel/pins.mjs (a plain test
# that fails while the bug is present) and a gate in hegel/known.mjs so the properties stay green.

[[bug]]
id = "parse5/1"
title = "serialize leaves < and > unescaped in attribute values (spec change of 2025)"
kind = "wrong-result"
severity = "low"
test = "TestHegelParseMatchesTheOracles"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`serialize(parse('<p title="<>">'))` gives `<p title="<>">`. The HTML Standard's "escaping a string"
in attribute mode escapes `<` and `>` as well since January 2025 (whatwg/html #10931, to close mXSS
vectors), so html5ever - the same algorithm - writes `title="&lt;&gt;"`. The serializer still uses
the old table (`&`, U+00A0 and `"` only). The property compares the two serializations of every tree
the parsers agree on.
"""

[[bug]]
id = "parse5/2"
title = "A newline right after an ampersand is counted as two lines in source locations"
kind = "wrong-result"
severity = "low"
test = "TestHegelLocationsPointIntoTheSource"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
With `sourceCodeLocationInfo`, `parse("a&\\nx")` puts the end of the text node at line 3 (offset 4 is
line 2, column 2): the tokenizer retreats over the newline when the `&` turns out not to start a
character reference and the preprocessor counts the line again on the second read. A `&\\r\\n` does
the same; `&a\\n` and `&#\\n` do not. Every line and column after that point is off by one, for nodes,
tags, attributes and parse errors (TestHegelParseErrorsAreReported sees it too). Whether the tokenizer
retreats also depends on where a chunk ends: through `ParserStream`, `&not\\n` split at the newline
recounts the line where the one-shot parse does not, so the streamed locations differ from the
one-shot ones (TestHegelStreamedParseMatchesTheOneShot).
"""

[[bug]]
id = "parse5/3"
title = "A comment unterminated at the end of the input is located one character past it"
kind = "wrong-result"
severity = "low"
test = "TestHegelLocationsPointIntoTheSource"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`parse("<!--x", { sourceCodeLocationInfo: true })` gives the comment `endOffset: 6` and `endCol: 7`
for a 5-character input; `<!--`, `<!-`, `<?x` and `<!--x-<->` (a comment swallowing the rest of the
document) all end at `length + 1`. The EOF pseudo-character is counted into the token's end.
"""

[[bug]]
id = "parse5/4"
title = "A parse error at an astral character has the offset of its low surrogate"
kind = "wrong-result"
severity = "low"
test = "TestHegelParseErrorsAreReported"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
For `</\\u{1F600}x` the `invalid-first-character-of-tag-name` error is reported at
`startOffset: 3, startCol: 3`: the column names the high surrogate at index 2, the offset the low
surrogate at 3. For `</\\u00e9x` both agree (offset 2, column 3). The error position is taken after
the surrogate pair has been consumed as one code point.
"""

[[bug]]
id = "parse5/5"
title = "Text from a character reference after an ignored NUL is located at its last character"
kind = "wrong-result"
severity = "low"
test = "TestHegelLocationsPointIntoTheSource"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`parse("\\u0000&gt;", { sourceCodeLocationInfo: true })`: the text node `>` has
`startOffset: 4, endOffset: 5`, the `;` alone, where `&gt;` spans 1..5 (`\\u0000>` and `a\\u0000&gt;`
are located correctly). The NUL is a character token the in-body rules drop; the character reference
that follows it starts a new text node whose location begins where the reference ended.
"""

[[bug]]
id = "parse5/6"
title = "PlainTextConversionStream puts a newline before the text"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPlainTextBecomesAPreElement"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
Feeding `x` to a `PlainTextConversionStream` gives `<pre>` with the text `\\nx`; an empty input gives
the text `\\n`. The spec's "load a text document" has the parser act as if the tokenizer had emitted
a `<pre>` start tag followed by a U+000A character token - which the in-body rule for `<pre>`
discards - and then switches to PLAINTEXT, so the text of the `<pre>` is exactly the document
(browsers show `document.body.firstChild.textContent === "x"`). The stream inserts a real `\\n` text
node instead (lib/index.ts: `insertText(openElements.current, '\\n')`), so every plain text document
gains a leading blank line, and the input's own first newline is kept as well.
"""

[[bug]]
id = "parse5/7"
title = "RewritingStream drops an empty end tag between tokens"
kind = "wrong-result"
severity = "low"
test = "TestHegelRewritingStreamPassesTheSourceThrough"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
A `RewritingStream` with no handlers documents that it writes the source through unchanged ("uses
the raw source representation of tokens"; its tests assert output === input on every SAX fixture).
`<div></><p>` comes out as `<div><p>`: the empty end tag `</>` is a parse error the tokenizer emits
no token for, and the rewriter only writes tokens' raw text. Between text (`a</>b`) it survives,
because the text token's raw span covers it.
"""

[[bug]]
id = "parse5/8"
title = "RewritingStream drops an unfinished tag at the end of the input"
kind = "wrong-result"
severity = "low"
test = "TestHegelRewritingStreamPassesTheSourceThrough"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`<p><b` through a `RewritingStream` without handlers gives `<p>`; `</b` alone gives the empty
string, `<body ></OPTGROUP ` gives `<body >`. A tag the input ends in the middle of produces no
token (EOF in a tag is a parse error that emits nothing), and unlike an unfinished comment
(`<p><!--x` is passed through) or a tag after text (`a</b`), its raw text is never flushed.
"""

[[bug]]
id = "parse5/9"
title = "RewritingStream.emitStartTag drops the prefixes of foreign attributes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelReemittedTokensParseAlike"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
In foreign content the SAX parser hands out attributes as the tree builder adjusts them: `xlink:href`
is `{ prefix: "xlink", name: "href", namespace: ... }`, `xmlns:xlink` is `{ prefix: "xmlns", name:
"xlink" }`, `xml:lang` is `{ prefix: "xml", name: "lang" }`. `emitStartTag` serializes `attr.name`
only, so a handler that re-emits the tag it was given (`rewriter.on("startTag", (t) =>
rewriter.emitStartTag(t))`) turns `<svg xmlns:xlink="x" xlink:href="y"><foreignObject xml:lang=z>`
into `<svg xlink="x" href="y"><foreignObject lang="z">`, and the document's tree changes (the
`xmlns:xlink` declaration becomes an unknown attribute).
"""

[[bug]]
id = "parse5/10"
title = "RewritingStream.emitDoctype writes null for a doctype without a name"
kind = "wrong-result"
severity = "low"
test = "TestHegelReemittedTokensParseAlike"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`<!DOCTYPE>` (name `null` in the token) re-emitted with `emitDoctype` comes out as `<!DOCTYPE null>`:
the template `<!DOCTYPE ${token.name}` stringifies the null. Parsed again, the document type's name
is `null` instead of empty, and the document is still in quirks mode but for another reason.
"""

[[bug]]
id = "parse5/11"
title = "SAXParser stays in foreign content after a self-closing svg or math tag"
kind = "wrong-result"
severity = "medium"
test = "TestHegelSaxTokensMatchTheParser"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`<svg/><style>x<b>`: the tree builder inserts and immediately pops the self-closing `<svg/>`, so
`<style>` is an HTML style element and the tokenizer reads `x<b>` as raw text (one text token). The
SAX parser's feedback simulator enters the SVG namespace on `<svg/>` without leaving it, treats
`<style>` as an SVG element and emits a `b` start tag; `<math/>` likewise, also inside an integration
point (`<math><mi><svg/><style>`). `parse5-html-rewriting-stream` inherits the wrong tokenization.
"""

[[bug]]
id = "parse5/12"
title = "SAXParser switches to raw text for a start tag the tree builder ignores in select or frameset"
kind = "wrong-result"
severity = "low"
test = "TestHegelSaxTokensMatchTheParser"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`<select><style>x<b></select>`: in the "in select" insertion mode a `<style>` start tag is a parse
error and is ignored (only `script` and `template` go through the in-head rules), so the tokenizer
stays in the data state and the parser sees `x`, `<b>`, `</select>`. The SAX parser switches to
RAWTEXT on the `<style>` and emits one text token `x<b></select>`, swallowing the tags; `<title>`
behaves the same, and so does any of them after `<frameset>`, where every other start tag is
ignored. parse5's own parser-feedback tests are generated by comparing these two token streams.
"""

[[bug]]
id = "parse5/13"
title = "The htmlparser2 tree adapter moves integer-named attributes to the front"
kind = "wrong-result"
severity = "low"
test = "TestHegelTreeAdaptersAgree"
found = { commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b", version = "8.0.1 (2026-09-16)", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
notes = """
`serialize(parse('<i a="1" 2="x">', { treeAdapter }))` with the parse5-htmlparser2-tree-adapter gives
`<i 2="x" a="1"></i>` where the default adapter keeps the source order `<i a="1" 2="x"></i>`. The
adapter stores attributes in domhandler's `attribs` object and `getAttrList` reads them back with
`Object.entries`, which puts integer-like keys first in ascending order whatever the source order.
Such attribute names come from ordinary broken markup (`<i onclick='x'http://host/2000/a'>` yields
attributes named `http:`, `host`, `2000`, `a'`).
"""
