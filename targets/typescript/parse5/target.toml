TestHegelPinACharacterReferenceAfterANulIsLocatedWhole = "parse5/5"
TestHegelPinPlainTextIsTheTextOfThePre = "parse5/6"
TestHegelPinRewritingStreamKeepsAnEmptyEndTag = "parse5/7"
TestHegelPinRewritingStreamKeepsAnUnfinishedTag = "parse5/8"
TestHegelPinEmitStartTagKeepsAttributePrefixes = "parse5/9"
TestHegelPinEmitDoctypeOfANamelessDoctype = "parse5/10"
TestHegelPinSaxLeavesForeignContentAfterASelfClosingSvg = "parse5/11"
TestHegelPinSaxKeepsTheDataStateForAStyleInASelect = "parse5/12"
TestHegelPinTheHtmlparser2AdapterKeepsAttributeOrder = "parse5/13"
