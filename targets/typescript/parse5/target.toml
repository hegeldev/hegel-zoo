TestHegelSaxTokensMatchTheParser = { bug = "parse5/11", intermittent = true } # also /16, /12, /19
TestHegelTreeAdaptersAgree = { bug = "parse5/18", intermittent = true } # also /13
TestHegelSerializeRoundTrips = { bug = "parse5/14", intermittent = true }
TestHegelStreamedParseMatchesTheOneShot = { bug = "parse5/2", intermittent = true }
TestHegelParseFragmentMatchesTheOracles = { bug = "parse5/15", intermittent = true }
