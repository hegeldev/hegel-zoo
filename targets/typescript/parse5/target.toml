# Unsteered 2026-10-07 (STYLE.md rule 11): every recorded shape is drawn by default and a finding
# that a recorded bug explains fails naming it ("shape of parse5/N"); HEGEL_NO_KNOWN=1 counts such
# findings instead and skips the narrow properties. A wide property that reaches several shapes
# shrinks to the smallest one hit in the run; each is mapped to its usual shrink. Rates per 1000
# cases: /1 177 (ParseMatches), /6 all (PlainText), /3 44 + /5 8 + /4 5 + /2 4 (Locations), so those
# three fail every run; RewritingStream (/8 41 + /7 6 per 1000) still passed 2 of 6 default runs, and
# the others reach their shapes at a few per thousand: intermittent.
TestHegelParseMatchesTheOracles = "parse5/1"
TestHegelPlainTextBecomesAPreElement = "parse5/6"
TestHegelLocationsPointIntoTheSource = "parse5/3" # also /2, /4, /5
TestHegelRewritingStreamPassesTheSourceThrough = { bug = "parse5/8", intermittent = true } # also /7, /4; passed 2 of 6 default runs
TestHegelParseErrorsAreReported = { bug = "parse5/2", intermittent = true } # also /4
