name = "parse5"
language = "typescript"
upstream = "https://github.com/inikulin/parse5"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-19"  # README, SECURITY.md, .github/ (dependabot, funding, workflows), no CONTRIBUTING: nothing about AI

[base]
commit = "7c1e77d21e5aa32eff9433a5ed13b146363e9a4b"
date = "2026-09-16"
version = "8.0.1"

[hegel]
version = "0.4.5"

[run]
# A TypeScript monorepo: the dev dependencies (typescript, the htmlparser2 adapter's domhandler) come
# from the lock file, the six packages are compiled to their dist/ directories and Hegel is installed
# under .hegel/ so package.json stays untouched. The two oracles are other implementations of the HTML
# parsing algorithm: html5ever (Rust, Servo's) built from hegel/oracle with cargo (the CI runner has a
# Rust toolchain), and html5lib (Python) in a venv under hegel/.
setup = [
  "npm ci --ignore-scripts --no-audit --no-fund",
  "npx tsc --build packages/parse5 packages/parse5-sax-parser packages/parse5-html-rewriting-stream packages/parse5-parser-stream packages/parse5-plain-text-conversion-stream packages/parse5-htmlparser2-tree-adapter",
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5",
  "cargo build --release --quiet --manifest-path hegel/oracle/Cargo.toml",
  "python3 -m venv hegel/.venv && hegel/.venv/bin/python -m pip install -q html5lib==1.1",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
