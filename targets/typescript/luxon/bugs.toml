# Bugs found in luxon by the Hegel zoo. One [[bug]] per finding; `test` names the pin that fails
# while the bug exists (listed under [expected_failures] in target.toml). The oracle for zone and
# calendar behaviour is Temporal (@js-temporal/polyfill 0.5.1), which reads the same Intl/ICU zone
# data as Luxon; every entry below was confirmed by hand against Luxon's documentation and source.
# Upstream has no AI-contribution policy (CONTRIBUTING.md, README, .github/ checked 2026-09-17).

[[bug]]
id = "luxon/1"
title = "toISOWeekDate() does not expand years outside 0000-9999, and fromISO() cannot read its output"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinWeekDateExpandsYear"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTime.utc(-7, 6, 5).toISODate() is "-000007-06-05" (ISO 8601 expanded year, six digits with a
sign) but toISOWeekDate() is "-0007-W22-6"; DateTime.utc(10000, 6, 5).toISOWeekDate() is
"10000-W23-1". toISOWeekDate formats with the `kkkk` token (pad to four), while toISODate
switches to the signed six-digit form. fromISO() only accepts four-digit or signed six-digit
week years, so the week date of such a DateTime does not round-trip.
'''

[[bug]]
id = "luxon/2"
title = "set({quarter: n}) is silently ignored"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSetQuarter"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dt.set({ quarter: 2 }) (and { quarters: 3 }) returns a DateTime equal to dt. DateTime's
normalizeUnit accepts "quarter", so no InvalidUnitError is thrown (set({ weeks: 3 }) throws), but
set() only copies the normalized object over toObject() and objToTS() has no quarter field.
quarter is a getter, get("quarter") works, and startOf/endOf/plus/minus/diff all support
quarters, so a caller has every reason to expect set to as well.
'''

[[bug]]
id = "luxon/3"
title = "fromISO() discards the offset of a string that also carries a bracketed IANA zone"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIsoOffsetWithZoneAnnotation"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTime.fromISO("2020-06-01T12:00:00Z[America/New_York]", { setZone: true }) is 12:00 New York
time (16:00Z), and "2020-11-01T01:30:00-05:00[America/New_York]" (the second 01:30 of the
fall-back night) is 01:30-04:00, an hour early; the zone annotation wins and the offset is
ignored. In the ISO regex parser the offset and IANA extractors each return a zone, and the
combined extractor keeps the last one; unlike the token parser (fromFormat with "ZZ z" honours the
offset through specificOffset) nothing carries the offset to fromObject. Consequently
fromISO(dt.toISO({ extendedZone: true }), { setZone: true }) is an hour off for any dt in a
repeated hour, and UTC-normalised strings tagged with a zone are misread by hours.
'''

[[bug]]
id = "luxon/4"
title = "A wall time within a day after a transition is taken for a gap when the zone's current offset is far from its offset then (Pacific/Apia before 2011)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinApiaWallTimeAfterTransition"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTime.fromObject({ year: 2010, month: 9, day: 26, hour: 5 }, { zone: "Pacific/Apia" }) is
2010-09-26T06:00:00.000-10:00 with wasHole true, although 05:00 exists (Apia's DST started at
00:00 that day; Temporal gives 05:00-10:00); fromISO("2011-04-02T23:30", { zone: "Pacific/Apia" })
is 2011-04-03T00:30-10:00 instead of 23:30-11:00. Every factory that starts from a wall time
(fromObject, fromISO, fromFormat, fromSQL, local) goes through fixOffset with the zone's offset
*now* as the first guess. Apia moved across the date line at the end of 2011 (-11 then, +13 now),
so the guess is 24 hours off: the first corrected instant lies before the transition and the
second one, corrected by the pre-transition offset, lies after it, so the two probes disagree and
fixOffset declares a hole and pushes the time forward by the "gap". Any zone whose offset moved
by more than the spacing of its transitions is affected (Pacific/Fakaofo, Pacific/Kwajalein,
Pacific/Apia), for every wall time within |offset now - offset then| after a transition. With
Settings.now set to a 2010 instant the same call is correct.
'''

[[bug]]
id = "luxon/5"
title = "Interval.splitAt() returns empty intervals for a cut at the start or a repeated cut"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSplitAtStart"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
i.splitAt(i.start) is [i.start/i.start, i.start/i.end]: contains(start) is true, so the start is
kept as a cut and the loop emits the empty piece before it; two equal cuts likewise emit an
empty interval between them. splitBy never emits an empty piece, and "split this Interval at
each of the specified DateTimes" has no place for one.
'''

[[bug]]
id = "luxon/6"
title = "The narrow offset format leaves single-digit minutes unpadded (+5:5), and a fixed zone's own name is rejected by the zone parser"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNarrowOffsetPadsMinutes"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
toFormat("Z") of a DateTime at offset +05:05 is "+5:5" (ZZ is "+05:05"); Europe/Paris in 1890
(local mean time, +00:09:21) formats as "+0:9". FixedOffsetZone.instance(305).name is "UTC+5:5",
and DateTime.fromMillis(0, { zone: "UTC+5:5" }) is invalid because the specifier parser wants two
minute digits ("UTC+5:05" is accepted), so a zoneName does not round-trip through normalizeZone.
formatOffset's "narrow" branch appends the minutes without padding.
'''

[[bug]]
id = "luxon/7"
title = "shiftTo/normalize leave a lower unit with the opposite sign when its magnitude is below one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinShiftToBorrowsForFractions"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Duration.fromObject({ minutes: 1, seconds: -0.5 }).normalize() is unchanged, and
{ hours: -75, seconds: 26 }.shiftTo("hours", "minutes") is { hours: -75, minutes: 0.4333 }
("PT-75H0.43M"), while { hours: 12, minutes: -45 }.normalize() gives { hours: 11, minutes: 15 }
as documented and { hours: -75, seconds: 26 }.shiftTo("hours", "seconds") gives
{ hours: -74, seconds: -3574 }. The sign pass of the rewritten shiftTo (this commit) borrows
Math.trunc((v + (conv - 1) * sign) / conv) units from the next larger one, which is zero whenever
|v| < 1, so a fractional odd component smaller than one of its own unit is left as is.
'''

[[bug]]
id = "luxon/8"
title = "set() does not validate its values and rolls them over (day 31 in November is December 1st, hour 25 is 01:00 the next day)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSetValidates"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For dt = 2020-11-15T10:20:30Z: dt.set({ day: 31 }) is 2020-12-01, set({ hour: 25 }) is
2020-11-16T01:20:30, set({ month: 13 }) is 2021-01-15, set({ day: 0 }) is 2020-10-31,
set({ minute: 70 }) is 11:10, set({ weekNumber: 53 }) in a 52-week year is week 1 of the next
week-year, set({ ordinal: 400 }) is in the next year — all valid DateTimes, while
DateTime.fromObject with the same values is invalid ("unit out of range", as the validity guide
documents for "February 40th" and "28:00"). set() copies the values over toObject() and lets
objToLocalTS/Date.UTC carry the overflow; only a missing day is clamped to the month's length.
'''

[[bug]]
id = "luxon/9"
title = "fromFormat() with both a quarter (q) token and a month token replaces the month by the quarter's first month"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinQuarterTokenKeepsMonth"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTime.fromFormat("2020-03-08 q1", "yyyy-MM-dd 'q'q") is 2020-01-08: dateTimeFromMatches sets
matches.M = (q - 1) * 3 + 1 whenever q was parsed, overwriting the parsed month even when the two
agree (March is in Q1). The quarter should at most fill in a missing month or be checked against
the given one (a contradicting quarter could be "mismatched" like a contradicting weekday is).
toFormat("yyyy-MM-dd 'q'q") therefore does not round-trip through fromFormat for any date outside
the first month of its quarter.
'''

[[bug]]
id = "luxon/10"
title = "shiftTo() with longterm conversion accuracy leaves fractional intermediate units when a lower unit overflows upwards"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinShiftToIntegerIntermediates"
found = { commit = "f427515a38f6a671f8de663e6bcc040ed81f114e", version = "3.7.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Duration.fromObject({ months: 32, quarters: 2.5 }, { conversionAccuracy: "longterm" })
  .shiftTo("quarters", "weeks", "hours", "minutes", "seconds")
is { quarters: 13, weeks: 1.9556, hours: 36, minutes: 41, seconds: 51 }, and
{ years: 22.1, quarters: 3, weeks: 20, seconds: -4095 }.shiftTo("years", "hours", "seconds",
"milliseconds") has hours 2043.18 next to whole seconds; with the casual matrix the same calls
give whole intermediate units. The rewritten shiftTo (this commit) pushes fractions down to the
lowest unit in its third pass and only then, in the fourth, moves overflow up into larger units
with `built[ak] -= toConvert * conv`; the long-term conversion factors (13.044 weeks per quarter,
8765.82 hours per year) are not integers, so the subtraction leaves a fraction behind in the
smaller unit that nothing redistributes. The documented shape of shiftTo is whole units with only
the last one fractional.
'''
