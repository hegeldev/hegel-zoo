name = "luxon"
language = "typescript"
upstream = "https://github.com/moment/luxon"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # CONTRIBUTING.md, README, .github/: no AI policy (a CLA for upstream PRs only)

[base]
commit = "f427515a38f6a671f8de663e6bcc040ed81f114e"
date = "2026-08-09"
version = "3.7.2"

[hegel]
version = "0.4.5"

[run]
# src/ is plain ES modules that Node 22 imports directly (no build). Hegel and the oracle, the
# @js-temporal/polyfill, go under .hegel/ (luxon has no runtime dependencies).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 @js-temporal/polyfill@0.5.1",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinWeekDateExpandsYear = "luxon/1"
TestHegelPinSetQuarter = "luxon/2"
TestHegelPinIsoOffsetWithZoneAnnotation = "luxon/3"
TestHegelPinApiaWallTimeAfterTransition = "luxon/4"
TestHegelPinSplitAtStart = "luxon/5"
TestHegelPinNarrowOffsetPadsMinutes = "luxon/6"
TestHegelPinShiftToBorrowsForFractions = "luxon/7"
TestHegelPinSetValidates = "luxon/8"
TestHegelPinQuarterTokenKeepsMonth = "luxon/9"
TestHegelPinShiftToIntegerIntermediates = "luxon/10"
