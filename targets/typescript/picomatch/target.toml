name = "picomatch"
language = "typescript"
upstream = "https://github.com/micromatch/picomatch"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-16"  # README, .github/contributing.md: no AI policy

[base]
commit = "9fab7bf61913ea334c4203ed321c426cfde44a42"
date = "2026-08-27"
version = "4.0.7"

[hegel]
version = "0.4.5"

[run]
# no setup: the backend's default runs (npm install of the runtime deps + Hegel); the bash
# differential needs bash >= 4.4 (globstar, extglob, nullglob, dotglob, nocaseglob)

[expected_failures]
# The wide properties reach the bugs at their natural rates (the bash property /5 in 1.6% of
# cases and /2 in 0.8%, the literal-features property /1 in 14%, the API property's capture check
# /5 below 0.1%) and are intermittent at 100 cases; one narrow property per bug draws its shape
# region and fails every run. HEGEL_NO_KNOWN=1 skips the shapes and the narrow properties.
TestHegelMatchesLikeBashGlobbing = { bug = "picomatch/2", intermittent = true }
TestHegelDisabledFeaturesAreLiteral = { bug = "picomatch/1", intermittent = true }
TestHegelApiIsConsistent = { bug = "picomatch/5", intermittent = true }
TestHegelScanSeesGlobsAfterALiteralBraceGroup = "picomatch/1"
TestHegelTrailingGlobstarMatchesTheSegmentAfterAStar = "picomatch/2"
TestHegelStarAfterAnEmptyGroupSkipsDotfiles = "picomatch/3"
TestHegelScanTreatsAnEscapedBraceAsLiteral = "picomatch/4"
TestHegelQuestionMarkAfterAGroupMatchesOneCharacter = "picomatch/5"
TestHegelGlobstarNextToAGroupStaysInTheSegment = "picomatch/6"
TestHegelGlobstarSegmentNeedsTheSlashBeforeAnOptionalGroup = "picomatch/7"
TestHegelNegatedPosixClassExcludesTheSlash = "picomatch/8"
TestHegelPosixClassAfterGlobstarKeepsTheExplicitDot = "picomatch/9"
TestHegelNegatedBracketExcludesTheWindowsSeparator = "picomatch/10"
TestHegelPinScanSeesGlobsAfterALiteralBraceGroup = "picomatch/1"
TestHegelPinTrailingGlobstarMatchesTheSegmentAfterAStar = "picomatch/2"
TestHegelPinStarAfterAnEmptyGroupSkipsDotfiles = "picomatch/3"
TestHegelPinScanTreatsAnEscapedBraceAsLiteral = "picomatch/4"
TestHegelPinQuestionMarkAfterAGroupMatchesOneCharacter = "picomatch/5"
TestHegelPinGlobstarNextToAGroupStaysInTheSegment = "picomatch/6"
TestHegelPinGlobstarSegmentNeedsTheSlashBeforeAnOptionalGroup = "picomatch/7"
TestHegelPinNegatedPosixClassExcludesTheSlash = "picomatch/8"
TestHegelPinPosixClassAfterGlobstarKeepsTheExplicitDot = "picomatch/9"
TestHegelPinNegatedBracketExcludesTheWindowsSeparator = "picomatch/10"
