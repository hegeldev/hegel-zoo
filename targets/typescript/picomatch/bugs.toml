# Bugs found in picomatch by the Hegel properties (see README.md). Each is pinned by the test named in
# `test` (test/hegel.test.mjs), which asserts the documented behaviour (or bash's, where the README
# claims bash semantics) and fails while the bug exists.

[[bug]]
id = "picomatch/1"
title = "scan() stops at a brace group without a comma and reports isGlob false (and no base/glob split) for patterns such as a{b}/*.js"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinScanSeesGlobsAfterALiteralBraceGroup"
found = { commit = "9fab7bf61913ea334c4203ed321c426cfde44a42", version = "4.0.7", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`picomatch.scan('a{b}/*.js')` returns `{isGlob: false, isBrace: true, base: 'a{b}/*.js', glob: ''}`
although `picomatch('a{b}/*.js')` matches `a{b}/c.js` and `scan('a{b}/*.js', {parts: true})` says
`isGlob: true`. In scan.js the brace loop (:98-154) sets `finished = true` and breaks when a `{...}`
closes without a comma or `..` (:137-145) and then, unless scanToEnd is set, breaks out of the main
loop (:149-153), so the `*` after it is never seen. A `{b}` without a comma is literal text (README:
braces are "comma-delimited lists"), so the scan should carry on. Consumers that use scan() to split a
pattern into a static base and a glob (fast-glob and friends) treat such a pattern as a plain path.
'''

[[bug]]
id = "picomatch/2"
title = "A trailing /** does not match the parent segment itself when that segment ends in a star: c*/** rejects cx although cx/**, c?/**, [c]x/** and @(c)x/** all accept it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTrailingGlobstarMatchesTheSegmentAfterAStar"
found = { commit = "9fab7bf61913ea334c4203ed321c426cfde44a42", version = "4.0.7", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`foo/**` matching `foo` is picomatch's own rule (test/globstars.js, api.picomatch.js: `isMatch('a',
'a/**')`) and the regex for `cx/**` is `cx(?:\/...|$)`, as it is for `c?/**`, `[c]x/**`, `@(c)x/**`
and `{c,d}x/**`. For `c*/**`, `*/**`, `a/*/**`, `1**/**` (`1**` is `1*` per the README) and
`_a*/**/**` the `|$` alternative is missing: `c[^/]*?\/(?!\.)...`, so `cx`, `c` and `a/cx` are
rejected while `cx/` is accepted. In parse.js the star branch handles a `**` that ends the pattern
after a slash by wrapping the slash and the globstar as `(?:\/...|$)` (:1201-1212), but only when
`!afterStar` (:1158, :1201), i.e. when the token before the slash is not a star; otherwise the code
falls through to the plain globstar (:1244-1249) and the slash stays mandatory. bash (`shopt -s
globstar`) lists `cx` for `c*/**` when cx is a directory, as it does for `cx/**`.
'''

[[bug]]
id = "picomatch/3"
title = "A star after a leading extglob or brace group that can match the empty string matches dotfiles: *(b)*, ?(b)*, @(b|)* and {b,}* match .a without the dot option"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStarAfterAnEmptyGroupSkipsDotfiles"
found = { commit = "9fab7bf61913ea334c4203ed321c426cfde44a42", version = "4.0.7", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README: "By default, dotfiles are ignored unless a `.` is explicitly defined in the pattern, or
`options.dot` is true". `*` compiles to `(?!\.)(?=.)[^/]*?` at the start of a segment: the no-dot
guard is added only when the previous token is the start of the pattern or a slash (parse.js
:1263-1280). After an extglob or brace group the star is bare, and the extglob's own `(?=.)` guard
only requires some character. So `*(b)*` → `(?=.)(?:b)*[^/]*?` matches `.a`, as do `?(b)*`,
`@(b|)*`, `{b,}*` and `x/*(b)*` on `x/.a`, while `*`, `[b]*` and `+(b)*` (which must consume a `b`
first) do not. bash (without dotglob) matches none of them against `.a`.
'''

[[bug]]
id = "picomatch/4"
title = "scan() treats an escaped \\{ as the start of a brace group: reports isBrace true and, without a closing brace, swallows the rest of the pattern (isGlob false for a\\{b/*.js)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinScanTreatsAnEscapedBraceAsLiteral"
found = { commit = "9fab7bf61913ea334c4203ed321c426cfde44a42", version = "4.0.7", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`picomatch('a\\{b/*.js')` matches `a{b/c.js` (the parser reads `\{` as a literal brace), but
`scan('a\\{b/*.js')` returns `{isGlob: false, base: 'a\\{b/*.js', glob: ''}`, and
`scan('a\\{b}/*.js')` reports `isBrace: true`. In scan.js a backslash followed by `{` sets
`braceEscaped` (:88-96) and the next iteration enters the brace loop because of it (:98); the loop
runs to the closing `}` (setting isBrace, then stopping the scan as in picomatch/1) or, when there is
none, to the end of the input, and the `*` is never examined. Distinct from picomatch/1: that bug is
the early stop after a real brace group, this one is an escaped brace taken for a group.
'''

[[bug]]
id = "picomatch/5"
title = "A ? right after a closing parenthesis is compiled as a regex quantifier instead of a one-character wildcard: @(a)? matches a and rejects ab"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinQuestionMarkAfterAGroupMatchesOneCharacter"
found = { commit = "9fab7bf61913ea334c4203ed321c426cfde44a42", version = "4.0.7", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`picomatch.makeRe('@(a)?')` is `/^(?:(a)?)$/`, so `isMatch('a', '@(a)?')` is true and `isMatch('ab',
'@(a)?')` false; `+(a)?` → `(?:a)+?`, `?(a)?` → `(?:a)??` (a lazy quantifier), `?(xzb|b?)?` matches
`bd`. After `[a]` or `{a,b}` the same `?` is `[^/]` as documented ("Matches any character excluding
path separators one time"), and bash matches `ab` and not `a` with all three. parse.js :1032-1041:
when the previous token is a `paren`, the `?` is pushed as text with output `?` (escaped only when
the parenthesis is an opening one), which the regex engine reads as a quantifier of the group. The
`regex` option documents regex rules for `+` and for `)*`/`]*` only, and is off by default.
'''

[[bug]]
id = "picomatch/6"
title = "** followed by a brace group or an @(...) in the same segment (or preceded by a closing parenthesis) is compiled as a globstar and crosses path separators: **{b,c}x matches a/bx"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGlobstarNextToAGroupStaysInTheSegment"
found = { commit = "9fab7bf61913ea334c4203ed321c426cfde44a42", version = "4.0.7", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README: "`**` will only match path separators when they are the only characters in a path segment.
Thus, `foo**/bar` is equivalent to `foo*/bar`". `**x`, `**[b]x`, `**b?`, `**+(b)x` and `**?(b)x` do
compile to `[^/]*?...`, but `**{b,c}x`, `**{b}x`, `**@(b)x` and `@(a)**` compile to the globstar
`(?:(?:(?!(?:^|\/)\.)[\s\S])*?)`, so `**{b,c}x` and `**@(b)x` match `a/bx` and `@(a)**` matches
`ax/c`; `**{c}` matches `c/cy{c}`. In parse.js the second star of a `**` is demoted to a plain star
unless it is at the start of a segment, after a `paren`, or inside a brace or extglob (:1165-1170),
and what follows the `**` is examined only for `/` (:1173-1242); a `{` or `@(` right after it, or a
`)` before it, leaves the globstar in place (:1244-1249). bash reads all of them as `*`.
'''

[[bug]]
id = "picomatch/7"
title = "a/**/?(b) matches the bare a: the optional slash-globstar-slash lets the pattern end before a group that can match the empty string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGlobstarSegmentNeedsTheSlashBeforeAnOptionalGroup"
found = { commit = "9fab7bf61913ea334c4203ed321c426cfde44a42", version = "4.0.7", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a/**/?(b)`, `a/**/*(b)`, `a/**/{b,}` and `a/**/@(b|)` all match the one-segment path `a`, although
`a/?(b)` and `a/**/b` do not and bash (`shopt -s globstar extglob`) lists nothing for `a/**/?(b)`
when only the directory `a` exists. parse.js :1214-1231 compiles a `/**/` in the middle of a pattern
to `(?:\/<globstar>\/|\/|$)` — the `|$` alternative (:1215, added whenever anything follows) is meant
for the pattern's parent path, but nothing checks that the rest of the pattern requires at least one
character, so a following group that matches the empty string completes the match at the end of the
parent. The same pattern reported by the bash differential: `*[a-d][ba]/**/?(dyy|[ab])` matched `da`.
'''
