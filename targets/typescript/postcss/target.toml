name = "postcss"
language = "typescript"
upstream = "https://github.com/postcss/postcss"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # README.md, CONTRIBUTING.md, .github/ (workflows, funding): no AI policy

[base]
commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d"
date = "2026-09-08"
version = "8.5.28"

[hegel]
version = "0.4.5"

[run]
# lib/ is plain CommonJS, so no build. The runtime dependencies (nanoid, picocolors, source-map-js)
# are installed without dev dependencies; --legacy-peer-deps because the dev tree has a typescript
# peer conflict that npm otherwise refuses even with --omit=dev. Hegel and postcss-parser-tests
# (the upstream parser fixtures, a devDependency) go under .hegel/.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev --legacy-peer-deps",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 postcss-parser-tests@8.10.0",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinAppendedCustomPropertyStaysItself = "postcss/1"
TestHegelPinCustomPropertyEndCoversValue = "postcss/2"
TestHegelPinDetectedColonIsAColon = "postcss/3"
TestHegelPinRootPrependKeepsTheOldFirstNodePlain = "postcss/4"
TestHegelPinAtRuleAtEndOfFileHasAnEnd = "postcss/5"
TestHegelPinValueCleanedOfCommentIsTrimmed = "postcss/6"
TestHegelPinImportantSurvivesTrailingWhitespace = "postcss/7"
