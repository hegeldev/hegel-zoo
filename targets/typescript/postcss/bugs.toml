# Bugs found in postcss by the Hegel properties in hegel.patch. Each is pinned by the test named in
# `test`, which fails while the bug is present.

[[bug]]
id = "postcss/1"
title = "A custom property that ends a block without a semicolon takes the block's closing whitespace into its value, and the stringifier omits exactly that semicolon after a last custom property — so appending `--x: 1` to a parsed rule and parsing the output gives the value \"1\\n\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAppendedCustomPropertyStaysItself"
found = { commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d", version = "8.5.28", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse("a{\\n  --x: 1\\n}").first.first.value` is `"1\\n"`: for custom properties `other()` keeps
the trailing space tokens (the spec says whitespace in a custom property value is significant), and
`decl()` keeps them because there is no `;`. `pushBody` in the stringifier already forces a `;`
after a custom property that has following siblings ("without the semicolon those trailing comments
are folded into … the custom property's value"), but not after a *last* custom property when the
block's `raws.semicolon` is false, so
`parse("a {\\n  color: red\\n}").first.append({prop: "--x", value: "1"})` prints
`a {\\n  color: red;\\n  --x: 1\\n}` and a second `parse` reads `--x` as `"1\\n"`, while `y: 1`
in the same place round-trips as `"1"`. Plugins that append custom properties to existing rules
(theme/variable injection) get an AST that drifts on every pass. Low: the extra whitespace is
harmless to browsers.
'''

[[bug]]
id = "postcss/2"
title = "source.end of a custom property stops at its last non-space token although its value keeps the trailing whitespace: for `a{--x: 1 /*c*/ \\n}` the node's range is `--x: 1 /*c*/` while its raw value is `1 /*c*/ \\n`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCustomPropertyEndCoversValue"
found = { commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d", version = "8.5.28", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Space tokens carry no position, and `decl()` sets `source.end` from `findLastWithPosition(tokens)`,
i.e. the last comment/word token. For ordinary declarations the trailing spaces are not part of the
node, so this is right; for custom properties without a `;` they are part of `value` (postcss/1
shows the same whitespace), so `input.css.slice(start.offset, end.offset)` does not contain
`raws.value.raw` and `rangeBy({word})`/`positionInside` cannot address the end of the value.
Every other node type's range was exact in the sweep (`end.offset` exclusive, `end.line/column`
naming the last character, root ending at the text length).
'''

[[bug]]
id = "postcss/3"
title = "Stringifier.rawColon builds the default `between` from the first declaration's raw between without removing its comment, so after `b/*x:y*/:c` every node without its own raws is printed as `d::e` — CSS that postcss itself rejects with `Double colon`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDetectedColonIsAColon"
found = { commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d", version = "8.5.28", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`rawColon` takes the first declaration with a `raws.between` and keeps whatever is whitespace or
`:` in it (`replace(/[^\\s:]/g, '')`). A comment between the property and the colon —
`b/*x:y*/:c`, `b /*:*/ : c` — contributes its own colons and spaces: the detected `colon` raw becomes
`::` or ` : : `, and it is cached on the root, so `root.first.append({prop: "d", value: "e"})` gives
`a{b/*x:y*/:c;d::e}`; `parse` of that output throws `CssSyntaxError: Double colon`, and browsers
drop the declaration. The same happens to declarations whose `raws.between` was removed with
`cleanRaws()`. The other autodetected raws (`rawBeforeDecl`, `rawIndent`, …) strip everything that
is not whitespace and are not affected. Medium: silently produces invalid CSS from valid input.
'''

[[bug]]
id = "postcss/4"
title = "Root.normalize copies a neighbouring node's raws.before verbatim (Container.normalize keeps only its whitespace), so the `*`/`_` hack prefix of a root-level declaration spreads: `parse(\"color: red; _zoom: 1\").prepend({prop: \"e\", value: \"f\"})` prints `_color: red`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRootPrependKeepsTheOldFirstNodePlain"
found = { commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d", version = "8.5.28", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The parser moves a leading `*` or `_` of a property into `raws.before` (`*zoom: 1` → prop `zoom`,
before `*`). `Container.normalize` gives an inserted node `sample.raws.before.replace(/\\S/g, '')`;
`Root.normalize` (lib/root.js) instead assigns `sample.raws.before` unchanged for append/insert
when the sample is not the first node, and on `prepend` hands the second node's before to the old
first node. With a hack declaration as neighbour, `append` next to `*zoom: 1` prints the new
declaration as `*e: f`, `insertAfter(hackDecl, rule)` prints the rule as `_x {}` (a different
selector), and prepending to `color: red; _zoom: 1` turns the plain `color: red` into `_color: red`,
which browsers ignore. Root-level declarations are what `parse` of a `style` attribute or a
declaration list produces, where `*`/`_` hacks still occur in legacy inline styles.
'''

[[bug]]
id = "postcss/5"
title = "A childless at-rule without params gets no source.end when `}` or the end of the input follows: `parse(\"@charset\").first.source.end` and `parse(\"a{@x}\").first.first.source.end` are undefined, while `@x foo`, `@x;` and `a{@x /*c*/}` have one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAtRuleAtEndOfFileHasAnEnd"
found = { commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d", version = "8.5.28", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`atrule()` records an end at `;`, `{`, or from the last params token when `}` or EOF stops the
loop; with no params there is no token to take it from and the at-rule keeps only `source.start`.
`rangeBy()` then falls back to a one-character range and `node.error()` points at the `@` only,
so a linter reporting "missing semicolon after @import" at the end of a file cannot mark the
statement. The at-rule's own text extent is known (the name token), which is what the pin expects.
'''

[[bug]]
id = "postcss/6"
title = "A comment at the end of a declaration value is removed from `value` but the whitespace before it stays: `x: 1 /*c*/;` has the value \"1 \" and `x: /*c*/;` the value \" \", where `x: 1 ;` gives \"1\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValueCleanedOfCommentIsTrimmed"
found = { commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d", version = "8.5.28", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Declaration.value` is documented as "cleaned of comments" with the original kept in `raws.value`.
`parser.raw()` drops a comment whose neighbour is a space or the end, drops a *last* space token,
but keeps the space token before the dropped comment because it is not last; the value ends in
whitespace that the source never had at the end of the value. Plugins comparing values
(`decl.value === "1"`, `value.split(" ")`, dedupe by value) miss such declarations; the same shape
without the comment is fine. Inner comments leave a double space (`1 /*c*/ 2` → `"1  2"`),
which is at least consistent with how the raw is rebuilt. Custom properties keep all whitespace
by design and are not counted here.
'''

[[bug]]
id = "postcss/7"
title = "`x: none! important ;` — `!` directly after the value, a space before `important`, whitespace before the `;` — is parsed as a plain declaration with the value \"none! important\"; without the trailing whitespace (or without the `;`) it is important with the value \"none\""
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinImportantSurvivesTrailingWhitespace"
found = { commit = "15471986e7e987bc0c5a20a04c545a74d81c3f2d", version = "8.5.28", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In `decl()` the `important` branch walks `for (let j = i; j > 0; j--)` over a copy of the tokens
but takes them with `cache.pop()` from the end. With a space token after `important` the pops lag
one behind the index, and the loop stops (at `j > 0`) before the `!` at index 1 is popped: `str`
is ` important ` (no `!`), so `node.important` stays unset and `! important` is left in the value.
Any of a space before `!`, no space between `!` and `important`, or no trailing whitespace hides
the problem, which is why upstream's fixtures (`important.css`) pass. The text round-trips
byte-exactly, so only consumers of `decl.important`/`decl.value` (cascade analysis, minifiers
that reorder or merge declarations) see it — they treat an `!important` declaration as normal.
'''
