# Bugs found in cron-parser by the Hegel zoo. One [[bug]] per finding; `test` names the pin that
# fails while the bug exists (listed under [expected_failures] in target.toml). The oracle is a
# brute-force model of the expression's fields over wall-clock time in its zone (luxon, the
# library's own dependency, does the zone arithmetic); every entry below was confirmed by hand
# against the README and the source. Upstream has no AI-contribution policy (README,
# CONTRIBUTING.md, .github/ checked 2026-09-17).

[[bug]]
id = "cron-parser/1"
title = "CronFieldCollection.from with a month override keeps day-of-month values pruned for the old month, so stringify() prints a different schedule"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinFromKeepsWildcardDayOfMonth"
found = { commit = "5b08cdf831c94a656def5a6ab7008f1e497d21b2", version = "5.10.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parsing "0 0 * 9 4" (Thursdays in September) prunes the wildcard day-of-month to 1..30 because
September has 30 days (CronDayOfMonth.fromMonth); the field keeps isWildcard = true and prints as
"*". CronFieldCollection.from(fields, {month: [3, 8]}) reuses that field unchanged, so the new
collection has months 3 and 8 with day-of-month values 1..30. In memory it still schedules
Thursdays (the wildcard flag drives the day rules), but stringify() decides "*" by coverage of
the new months' 31 days and prints "0 0 0 1-30 3,8 4", which re-parses as a restricted day of
month: with the day of week also restricted the rules take either, so the printed expression
fires every day 1-30 of March and August. README's "Field Manipulation" section presents
from() + fieldsToExpression() + stringify() as the way to build modified expressions.
'''

[[bug]]
id = "cron-parser/2"
title = "Strict mode rejects `?` in the day fields although `?` is documented as an alias for `*`"
kind = "contract"
severity = "low"
test = "TestHegelPinStrictAcceptsQuestionMarkDay"
found = { commit = "5b08cdf831c94a656def5a6ab7008f1e497d21b2", version = "5.10.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README's field table lists `?` as "Any value (alias for `*`)" and the strict-mode rule as
"prevents the simultaneous setting of both Day Of Month and Day Of Week fields". The check in
CronExpressionParser.parse compares the raw fields to the string "*" only, so
parse("0 0 12 ? * 1-5", {strict: true}) - the Quartz idiom for "weekdays, day of month
unspecified" - throws "Cannot use both dayOfMonth and dayOfWeek together in strict mode!",
while the equivalent "0 0 12 * * 1-5" is accepted. Outside strict mode both parse to the same
fields (isWildcard is true for `?`).
'''

[[bug]]
id = "cron-parser/3"
title = "A whitespace-only expression is rejected while the empty string defaults to `0 * * * * *`"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinWhitespaceExpressionDefaults"
found = { commit = "5b08cdf831c94a656def5a6ab7008f1e497d21b2", version = "5.10.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
#getRawFields substitutes the default "0 * * * * *" for a falsy expression and then trims and
splits the expression on whitespace runs, so " 0 * * * * " and "0  *  * * *" parse fine, but
" " is truthy, trims to "", splits to one empty atom and fails with "Invalid characters, got
value: ". README documents strict mode as rejecting "empty expressions that would otherwise
default to '0 * * * * *'", so the default is the intended non-strict behaviour for an empty
expression; a whitespace-only one is empty once trimmed, as the parser trims everywhere else.
'''

[[bug]]
id = "cron-parser/4"
title = "CronFileParser takes any crontab entry whose command contains `=` for a variable assignment"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinCrontabCommandWithEquals"
found = { commit = "5b08cdf831c94a656def5a6ab7008f1e497d21b2", version = "5.10.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CronFileParser.#parseContent classifies a line as a variable with /^(.*)=(.*)$/ before trying it
as an entry. The greedy match accepts spaces in the name, so the crontab line
"0 5 * * * /usr/bin/backup --level=3" is not parsed as a schedule at all: it becomes
variables["0 5 * * * /usr/bin/backup --level"] = "3" and is absent from `expressions` and
`errors`. Any command with an option value, an environment prefix (FOO=bar cmd) or a shell
comparison is lost silently. A crontab variable line has no whitespace before the "=" (cron(5):
"name = value" is allowed by some crons, never a name with internal spaces).
'''

[[bug]]
id = "cron-parser/5"
title = "CronFileParser splits entries on single spaces, so tab-separated or aligned crontab fields are misread"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCrontabTabsAndAlignedFields"
found = { commit = "5b08cdf831c94a656def5a6ab7008f1e497d21b2", version = "5.10.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CronFileParser.#parseEntry does entry.split(' ') and takes the first five atoms as the
expression and the rest as the command. Crontabs conventionally separate fields with tabs or
align them with runs of spaces (cron(5): "fields are separated by blanks or tabs"). A
tab-separated line "0\t5\t*\t*\t*\t/usr/bin/backup" is one atom, so the whole line including
the command is handed to the expression parser and lands in `errors`. A double space is worse:
"0  5 * * * /usr/bin/backup" splits to ["0", "", "5", "*", "*", ...], the expression "0  5 * *"
has four fields, the parser pads it with defaults and the entry silently becomes "* 0 5 * *"
(every minute of the first hour on the 5th of each month) while the "*" of the real
day-of-week field is swallowed into the command.
'''

[[bug]]
id = "cron-parser/6"
title = "In Australia/Lord_Howe (30-minute DST) next() aborts with \"loop limit exceeded\" on the day DST ends, and skips the gap on the day it starts"
kind = "abort"
severity = "medium"
test = "TestHegelPinLordHoweDstEndDoesNotLoop"
found = { commit = "5b08cdf831c94a656def5a6ab7008f1e497d21b2", version = "5.10.1", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Lord Howe Island shifts by 30 minutes: DST ends on the first Sunday of April (02:00 -> 01:30)
and starts on the first Sunday of October (02:00 -> 02:30). parse("0 3 * * *", {currentDate:
"2026-04-04T00:00:00Z", tz: "Australia/Lord_Howe"}).next() throws "Invalid expression, loop
limit exceeded" instead of returning 03:00 on 2026-04-05 (2026-04-04T16:30:00Z); so do "0 2",
"0 4" and "29 3" - every daily schedule from 02:00 on fails the day before DST ends (prev()
works). On the day DST starts, parse("0 2 * * *", ...).next() from 2026-10-03 returns 02:00 on
October 5th: the occurrence in the gap, which the library moves to the landing time in
one-hour zones (its own tests: "30 2 * * 7" in Europe/Rome gives 03:30), is dropped for a day.
CronDate.applyDateOperation recognises transitions by whole-hour jumps of the local hour
(`advance >= 2` for a gap, a repeated hour on the minute for an overlap), which a 30-minute
shift never produces, so #matchHour's stepping over the transition does not converge. The
zone is real (IANA, ~350 residents) and the library advertises "DST handling" for any IANA
zone; the same 30-minute logic ran fine in Pacific/Chatham (a one-hour shift at 02:45), in
America/Santiago and America/Havana (midnight transitions) and in the usual one-hour zones.
'''
