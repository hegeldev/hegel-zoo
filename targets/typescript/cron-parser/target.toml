name = "cron-parser"
language = "typescript"
upstream = "https://github.com/harrisiirak/cron-parser"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # README, CONTRIBUTING.md, .github/: no AI policy

[base]
commit = "5b08cdf831c94a656def5a6ab7008f1e497d21b2"
date = "2026-09-12"
version = "5.10.1"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript (CommonJS): the setup installs everything under .hegel/ (Hegel, the runtime
# dependency luxon, the compiler and its type packages) and compiles src/ into .hegel/dist with
# hegel/tsconfig.json; the tests require .hegel/dist/index.js. Nothing touches the upstream tree.
setup = [
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5 luxon@3.7.2 typescript@5 @types/node@22 @types/luxon@3",
  "node .hegel/node_modules/typescript/bin/tsc -p hegel/tsconfig.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinFromKeepsWildcardDayOfMonth = "cron-parser/1"
TestHegelPinStrictAcceptsQuestionMarkDay = "cron-parser/2"
TestHegelPinWhitespaceExpressionDefaults = "cron-parser/3"
TestHegelPinCrontabCommandWithEquals = "cron-parser/4"
TestHegelPinCrontabTabsAndAlignedFields = "cron-parser/5"
TestHegelPinLordHoweDstEndDoesNotLoop = "cron-parser/6"
