name = "iconv-lite"
language = "typescript"
upstream = "https://github.com/ashtuchkin/iconv-lite"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, Changelog, .github/ (CODEOWNERS, dependabot, workflows), no CONTRIBUTING: no AI policy

[base]
commit = "2472166ea5a4825ca091b9550713c403852a566b"
date = "2026-08-01"
version = "1.0.0-alpha.2"

[hegel]
version = "0.4.5"

[run]
# iconv-lite has no runtime dependencies and no build; only Hegel is installed, under .hegel/.
# The oracle is Python's codecs module (stdlib, python3 on PATH) and Node's own TextDecoder.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinCESU8TruncatedSequenceDecodesToReplacement = "iconv-lite/1"
TestHegelPinMultiByteStreamKeepsCharactersAfterABadLead = "iconv-lite/2"
TestHegelPinUTF7RunKeepsItsCharactersBeforeABadTail = "iconv-lite/3"
TestHegelPinHexEncoderIsStateful = "iconv-lite/4"
TestHegelPinReplacementCharacterEncodesAsQuestionMark = "iconv-lite/5"
TestHegelPinTruncatedFourByteTailIsOneReplacement = "iconv-lite/6"
TestHegelPinGB18030OutOfRangeFourByteSequenceIsReplaced = "iconv-lite/7"
