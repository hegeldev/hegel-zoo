# Bugs found in iconv-lite by the Hegel property tests in hegel.patch (every codec against
# Python's codecs module and the platform TextDecoder, round trips, streaming against one-shot,
# BOM options, WHATWG labels, hostile input).

[[bug]]
id = "iconv-lite/1"
title = "A CESU-8 stream ending in an incomplete sequence decodes to the digit 0 followed by U+FFFD"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCESU8TruncatedSequenceDecodesToReplacement"
found = { commit = "2472166ea5a4825ca091b9550713c403852a566b", version = "1.0.0-alpha.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`iconv.decode(Buffer.from([0x41, 0xe0, 0x80]), "cesu8")` is `"A0�"`: a "0" that was never
in the input. `InternalDecoderCesu8.prototype.end` in encodings/internal.js starts with
`var res = 0` (a number) and appends the replacement character to it, so the trailing
incomplete sequence yields the string "0�"; when nothing is pending it returns the number
0, which `decode` happens to treat as empty. Node's own UTF-8 decoder rejects surrogate
sequences, so this decoder is the one in use on every supported Node. Reproduced by
`TestHegelUnicodeCodecsAgreeWithPython` on mutated CESU-8 (0.2% of cases).
'''

[[bug]]
id = "iconv-lite/2"
title = "The multi-byte stream decoders drop characters when a chunk boundary falls inside a sequence"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinMultiByteStreamKeepsCharactersAfterABadLead"
found = { commit = "2472166ea5a4825ca091b9550713c403852a566b", version = "1.0.0-alpha.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Decoding Shift_JIS bytes `81 20` in two chunks `[81]` then `[20]` (getDecoder().write twice, or
decodeStream) gives `"�"`; one-shot `decode` gives `"� "`: the space is lost. Valid
input loses characters too: Big5-HKSCS `6f 98 6d 61` (o, an astral character, a) split as
`[6f 98]` `[6d 61]` gives `"o\u{24256}"` without the `a`; GB18030 four-byte characters split
across chunks lose the character after them. `DBCSDecoder.prototype.write` in
encodings/dbcs-codec.js allocates its output as `Buffer.alloc(buf.length * 2)` (two bytes of
UTF-16 per input byte of the new chunk), but the bytes carried over from the previous chunk
(`prevBytes`) produce output in this call as well: a completed astral character is four bytes,
and an invalid sequence is re-parsed from its second byte, one character per byte. Writes past
the end of a Buffer are silently ignored, so the last characters of the chunk vanish. Found by
`TestHegelStreamingMatchesOneShot` and `TestHegelStreamsMatchOneShot` (about 0.5% of chunked
multi-byte cases; every multi-byte codec). The one-shot `decode` is unaffected because it writes
the whole input in one chunk.
'''

[[bug]]
id = "iconv-lite/3"
title = "A UTF-7 base64 run whose length is 1 mod 4 loses the characters decoded before its bad tail"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUTF7RunKeepsItsCharactersBeforeABadTail"
found = { commit = "2472166ea5a4825ca091b9550713c403852a566b", version = "1.0.0-alpha.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`iconv.decode(Buffer.from("+AGEAY-"), "utf7")` is `"�"`; Python's utf-7 codec with
errors=replace gives `"a�"`, and iconv-lite itself gives `"a�"` for `+AGEA-` (a run
of 4) and `"aa�"` for `+AGEAYQB-` (a run of 7). The run `AGEAY` (5 base64 characters, 30
bits) holds the complete code unit U+0061 followed by 14 ill-formed padding bits; the README
says ill-formed input "is replaced with U+FFFD", but `Utf7Decoder._decodeBase64` in
encodings/utf7.js returns the empty string for any run with `(length & 3) === 1` (and the
`atob` path throws for the same lengths), so the whole run is dropped and only the replacement
for the tail survives. Reproduced by `TestHegelUnicodeCodecsAgreeWithPython` on mutated UTF-7
(0.8% of cases); the same shape applies to UTF-7-IMAP.
'''

[[bug]]
id = "iconv-lite/4"
title = "The hex encoder is stateless, so an odd-length chunk in an encode stream loses a nibble"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinHexEncoderIsStateful"
found = { commit = "2472166ea5a4825ca091b9550713c403852a566b", version = "1.0.0-alpha.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`getEncoder("hex")` fed `"0"` then `"1ff"` yields the single byte `1f`; `encode("01ff", "hex")`
yields `01 ff`. `InternalEncoder.prototype.write` in encodings/internal.js is
`Buffer.from(str, this.enc)` per chunk, and Node's hex parser stops at an odd trailing digit,
so every odd-length chunk loses a nibble and the following bytes shift. The base64 encoder in the
same file keeps its incomplete quad between writes (`InternalEncoderBase64`), which is what the
hex encoder needs too. Found by `TestHegelStreamingMatchesOneShot` (every odd chunking).
'''

[[bug]]
id = "iconv-lite/5"
title = "The single-byte encoders map U+FFFD to the code page's undefined byte instead of a question mark"
kind = "contract"
severity = "low"
test = "TestHegelPinReplacementCharacterEncodesAsQuestionMark"
found = { commit = "2472166ea5a4825ca091b9550713c403852a566b", version = "1.0.0-alpha.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`iconv.encode("�", "windows-1252")` is the byte `9d`, an undefined position of that code
page; windows-874 gives `ff`, iso-8859-3 `f0`, cp856 `ed`, and every other table with a hole
gives its (last) hole. The README says untranslatable characters become "?", and Python's
codecs give `3f`. `SBCSCodec` in encodings/sbcs-codec.js builds the encode table from the
decode table's 256 characters, and the tables mark undefined bytes with U+FFFD, so that
character gets a byte of its own. Text that came out of a lenient decode with replacement
characters is thus re-encoded to bytes that strict decoders (Python, TextDecoder with fatal)
reject. Found by `TestHegelTableCodecsAgreeWithPython`.
'''

[[bug]]
id = "iconv-lite/6"
title = "A multi-byte sequence truncated at the end of input is re-parsed byte by byte after the first"
kind = "spec"
severity = "low"
test = "TestHegelPinTruncatedFourByteTailIsOneReplacement"
found = { commit = "2472166ea5a4825ca091b9550713c403852a566b", version = "1.0.0-alpha.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`iconv.decode(Buffer.from([0x41, 0x81, 0x30]), "gb18030")` is `"A�0"`, and `81 30 81` is
`"�0�"`; the platform's `TextDecoder("gb18030")` and Python give `"A�"` and
`"�"`: a four-byte sequence cut off by the end of input is one error, its second byte
(always an ASCII digit) is not text. EUC-JP `8f a1` likewise gives two replacement characters
for one truncated three-byte sequence. `DBCSDecoder.prototype.end` in encodings/dbcs-codec.js
emits a replacement for the pending bytes, drops the first of them and re-decodes the rest as a
fresh input, which turns the second byte of the sequence into a character. Inside the input the
codec follows the WHATWG rule (an invalid later byte is re-read), so only the end differs.
Reproduced by `TestHegelTableCodecsAgreeWithPython` (0.3% of GB18030 cases).
'''

[[bug]]
id = "iconv-lite/7"
title = "GB18030 four-byte sequences outside the defined ranges decode to arbitrary code points or lone surrogates"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGB18030OutOfRangeFourByteSequenceIsReplaced"
found = { commit = "2472166ea5a4825ca091b9550713c403852a566b", version = "1.0.0-alpha.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`iconv.decode(Buffer.from([0xf4, 0x32, 0xc6, 0x33]), "gb18030")` is the two lone low
surrogates `"\udcd1\ude6d"`, an ill-formed UTF-16 string that cannot be re-encoded as UTF-8 or
written to JSON; `e4 30 81 30` gives `"\udc09\ude60"`, `fe 39 fe 39` gives `"\udd55\udf47"`,
and `8f 39 fe 39` (linear pointer 188999, in the gap between the BMP and the supplementary
ranges) gives U+3484B. GB18030 defines four-byte sequences only for the linear pointers
0..39419 (U+0080..U+FFFF) and 189000..1237575 (U+10000..U+10FFFF); the WHATWG decoder, the
platform's `TextDecoder("gb18030")` and Python give one U+FFFD for each of these. In
encodings/dbcs-codec.js the decoder marks every `81-FE 30-39 81-FE 30-39` sequence as
`GB18030_CODE`, computes the pointer and maps it through the ranges table with `findIdx`
without checking the pointer against the table's bounds, so pointers past the last range are
extrapolated beyond U+10FFFF and then split into "surrogates" arithmetically. Found by probing
after `TestHegelTableCodecsAgreeWithPython` reported `f4 32 c6 33` on mutated input.
'''
