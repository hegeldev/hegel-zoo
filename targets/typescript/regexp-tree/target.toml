name = "regexp-tree"
language = "typescript"
upstream = "https://github.com/DmitrySoshnikov/regexp-tree"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-18"  # README, package.json, no CONTRIBUTING, no .github/: nothing about AI

[base]
commit = "06e849a3089196c5640da3c7a64c41c153271cd4"
date = "2026-08-24"
version = "0.1.27"

[hegel]
version = "0.4.5"

[run]
# The published package is dist/ (babel output of src/), but src/ is plain CommonJS that Node 22
# loads as it is, and the library has no runtime dependencies, so nothing is built: the tests
# require src/regexp-tree.js through createRequire. Hegel is installed under .hegel/.
setup = [
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

