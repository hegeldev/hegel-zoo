# Bugs found in regexp-tree 0.1.27 (06e849a3, 2026-08-24). Oracle: V8 (Node 22) through
# `new RegExp`, ECMAScript 2024 with Annex B. File:line references are into src/.

[[bug]]
id = "regexp-tree/1"
title = "In u-mode a lone `{`, `}` or `]` is accepted; V8 rejects it (Lone quantifier brackets)"
kind = "contract"
severity = "low"
test = "TestHegelPinUModeRejectsLoneBrackets"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The lexer's CHAR macro (parser/regexp.bnf:19, `[^*?+\\[()\\\\|]`) lets `{`, `}` and `]` through as
ordinary characters in every state; only the class states have rules for them. `/a{/u`, `/}/u`
and `/]/u` parse as simple Chars while `new RegExp` throws "Lone quantifier brackets" /
"Incomplete quantifier" under the u flag (they are legal without it, Annex B).
"""

[[bug]]
id = "regexp-tree/2"
title = "In u-mode `\\1` without a group, `\\01` and `\\8` are accepted as character escapes; V8 rejects them"
kind = "contract"
severity = "low"
test = "TestHegelPinUModeRejectsLegacyEscapes"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The rules `{ESC}'0'\\d{1,2}`, `{ESC}'0'` and `{ESC}\\d{1,3}` (regexp.bnf:107-109) have no
state guard, so legacy octal and out-of-range decimal escapes are accepted under u, where
only `\\0` (not followed by a digit) and valid backreferences are legal: `/\\1/u` (no group),
`/\\01/u`, `/\\8/u`, `/[\\8]/u` all parse; V8: "Invalid escape" / "Invalid decimal escape".
"""

[[bug]]
id = "regexp-tree/3"
title = "`[\\d-z]` is parsed as a ClassRange from `\\d` to `z`; V8 reads three class atoms (and a SyntaxError under u)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinClassEscapeIsNoRangeEndpoint"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The class grammar builds a ClassRange whenever `ClassAtom DASH ClassAtom` reduces
(regexp.bnf:990-1028) and checkClassRange (regexp.bnf:253-257) only compares codePoints, which
are NaN for `\\d`, `\\w`, `\\s`, `\\p{..}`; so `[\\d-z]`, `[a-\\d]`, `[\\w-\\d]`, `[\\p{L}-a]`
become ranges. In Annex B they are the three atoms `\\d`, `-`, `z`; under u they are a
SyntaxError ("Invalid character class"), which the parser does not raise. The text
round-trips, so only AST consumers (optimizer, interpreter) see it.
"""

[[bug]]
id = "regexp-tree/4"
title = "With named groups present (or under u), `\\k<m>` to an undefined name and `\\k(` are accepted as literal text"
kind = "contract"
severity = "low"
test = "TestHegelPinUndefinedNamedReferenceIsRejected"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
NamedGroupRefOrChars (regexp.bnf:518-611) falls back to a list of Chars (`k`, `<`, `m`, `>`)
whenever the name is not in namedGroups. ECMAScript makes `\\k` an identity escape only when
the pattern has no GroupName at all and no u flag; `/(?<n>a)\\k<m>/`, `/(?<n>a)\\k(b)/`,
`/\\k<x>/u` and `/(?<x>a)[\\k<x>]/` are SyntaxErrors in V8 ("Invalid named reference").
"""

[[bug]]
id = "regexp-tree/5"
title = "A quantified lookahead `(?=a)*` is rejected; V8 accepts it without the u flag (Annex B QuantifiableAssertion)"
kind = "contract"
severity = "low"
test = "TestHegelPinQuantifiedLookaheadIsAccepted"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Term : Assertion` (regexp.bnf:729-731) takes no OptQuantifier, so `/(?=a)*/`, `/(?!a)+/`,
`/(?=a){2}/` are parse errors. Annex B B.1.2 lets a lookahead be quantified in non-u mode and
V8 (Node) implements it. The parser agrees with V8 on the u-mode rejection and on `^*`,
`\\b+` and quantified lookbehinds.
"""

[[bug]]
id = "regexp-tree/6"
title = "Control escapes `\\cA` have no codePoint or symbol, so `[\\cA-\\cZ]` is rejected as out of order"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinControlEscapesHaveCodePoints"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Char() (regexp.bnf:320-393) has cases for decimal, oct, hex, unicode, meta and simple but none
for kind 'control', so `\\cA` is `{type: Char, value: '\\\\cA', kind: 'control'}` with codePoint
and symbol undefined (V8: U+0001). checkClassRange then throws "Range \\cA-\\cZ out of order"
for `/[\\cA-\\cZ]/`, which V8 accepts. Also the optimizer's range sorter gives control chars
the sort value Infinity (see /21).
"""

[[bug]]
id = "regexp-tree/7"
title = "`[\\B]` is rejected; without the u flag it is the identity escape B"
kind = "contract"
severity = "low"
test = "TestHegelPinClassBigBIsAccepted"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The lexer returns ESC_B for `\\B` in every state (regexp.bnf:103) and ClassAtomNoDash
(regexp.bnf:1038-1043) admits ESC_b (backspace) but not ESC_B, so `/[\\B]/` is a parse error.
V8 accepts it in non-u mode (Annex B ClassEscape: identity escape) and rejects it under u,
where the parser happens to agree.
"""

