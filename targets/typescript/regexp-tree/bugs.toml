[[bug]]
id = "regexp-tree/13"
title = "`\\08` is lexed as one NUL character; it is NUL followed by the digit 8"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOctalEscapeStopsBeforeEight"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The rule `{ESC}'0'\\d{1,2}` (regexp.bnf:107) takes decimal digits, and parseInt("08", 8) is 0,
so `/\\08/` and `/\\009/` are a single Char with codePoint 0 and the trailing digit is lost.
Annex B's LegacyOctalEscapeSequence takes octal digits only: `\\0` then `8`, two atoms;
`/\\08/.test("\\u00008")` is true in V8 and `/\\08/.test("\\u0000")` false.
"""

[[bug]]
id = "regexp-tree/14"
title = "A backreference before its group, `\\1(a)`, is parsed as a character; the optimizer folds it into a class"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinForwardReferenceIsABackreference"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
GroupRefOrDecChar (regexp.bnf:434) compares the number with capturingGroupsCount, which
onShift increments for groups already seen, so a forward reference (`/\\1(a)/`, `/(a)\\2(b)/`)
is a Char kind 'decimal'. ECMAScript counts all groups of the pattern: `/\\1(a)/.test("a")` is
true. group-single-chars-to-char-class then treats it as a character: `/(?:[.]|\\1)(9)/`
becomes `/[.\\1](9)/`, which no longer matches "9".
"""

[[bug]]
id = "regexp-tree/15"
title = "A named reference before its group, `\\k<n>(?<n>a)`, is parsed as literal characters; optimize and compatTranspile destroy it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinForwardNamedReferenceIsABackreference"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
NamedGroupRefOrChars (regexp.bnf:522) consults namedGroups at reduce time, before the group
has been seen, so `/\\k<n>(?<n>a)/` is five Chars plus the group where V8 has a Backreference
(`/\\k<n>(?<n>a)/.test("a")` is true). optimize gives `/k<n>(?<n>a)/` (unescaped, matches only
"k<n>a") and compatTranspile `/\\k<n>(a)/` (the group loses its name, the reference stays:
matches the literal text, a SyntaxError under u).
"""

[[bug]]
id = "regexp-tree/16"
title = "`\\c` before a non-letter is parsed as the identity escape `c`; Annex B matches the text `\\c` literally, and optimize gives `/c1/`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinControlEscapeBeforeNonLetterIsLiteral"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The lexer's control rule needs a letter (regexp.bnf:105), so `\\c1` falls to `{ESC}{CHAR}` and
becomes Char 'c' (escaped) + Char '1', matching "c1". Annex B ExtendedAtom `\\ [lookahead = c]`
makes `/\\c1/` match the three characters `\\c1`; inside a class `[\\c1]` is U+0011 and `[\\c_]`
U+001F. char-escape-unescape then produces `/c1/` from `/\\c1/`.
"""

[[bug]]
id = "regexp-tree/17"
title = "Under u a literal astral character is two surrogate Chars: `/😀+/u` quantifies the trail surrogate and `[😀-🙏]` is rejected"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAstralLiteralIsOneCharacterUnderU"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
CHAR (regexp.bnf:19) is one UTF-16 code unit and only escaped surrogate pairs
(`\\uD83D\\uDE00`, `\\u{1F600}`) are combined (regexp.bnf:111, 801-802). `/😀/u` is two Chars
with codePoints 55357 and 56832; `/😀+/u` is Char + Repetition of the trail surrogate (V8
repeats the whole code point); `/[😀]/u` is a class of two lone surrogates; `/[😀-🙏]/u`
throws "Range out of order in character class" while V8 accepts the range.
"""

