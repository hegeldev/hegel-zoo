notes = """
`rt.parse("/\\\\k<\\u03c0>/")`, `/\\k<é>/`, `/\\k<aπ>/`, `/\\k<a\\u200d>/`, `/\\k<π>(?<π>a)/`
(reference before the group) and `/(?<π>\\k<π>)/` (reference inside its own group) spin at
