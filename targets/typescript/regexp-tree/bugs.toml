[[bug]]
id = "regexp-tree/10"
title = "`[\\b]` has symbol \".\" and codePoint null: the backspace case falls through in Char()"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinClassBackspaceIsCodePointEight"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Char() (regexp.bnf:373-382): `case '\\\\b': symbol = '\\b'; codePoint = ...` has no `break`, so
it falls into the `\\0` and `.` cases and the node ends as `{value: '\\\\b', kind: 'meta',
symbol: '.', codePoint: null}` (correct: symbol U+0008, codePoint 8). A range `[\\b-\\x10]` is
built with from.codePoint null.
"""

[[bug]]
id = "regexp-tree/11"
title = "Legacy octal escapes are decoded as decimal: `\\40` has codePoint 40, and the optimizer rewrites it to `\\(`"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinLegacyOctalEscapesAreOctal"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
GroupRefOrDecChar (regexp.bnf:431-444) turns a `\\NN` that is not a backreference into
Char(text, 'decimal'), whose codePoint is Number(value.slice(1)) (regexp.bnf:321-324). In
Annex B these are octal: `\\40` is U+0020, `\\12` is U+000A, `\\101` is `A`, `\\19` is `\\1`
followed by `9`. The AST codePoints are 40, 12, 101, 19, and char-code-to-simple-char turns
`/\\40/` into `/\\(/` (matches "(" instead of " "), `/\\101/` into `/e/`, `/\\77/` into `/M/`.
`\\0NN` goes through the OCT_CODE rule and is decoded correctly.
"""

