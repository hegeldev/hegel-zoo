char-escape-unescape-transform.js:63-77 (and preservesOpening/ClosingCurlyBraceEscape,
:109-162) never look at the flags: `/\\}/u` -> `/}/u` ("Lone quantifier brackets"),
`/\\{/iu` -> `/{/iu`, `/(?:\\{){1,}/iu` -> `/{+/iu`. char-class-to-single-char's shouldEscape
(:91-93) and char-code-to-simple-char's needsEscape (:81-87) omit `]`: `/[\\]]/u` -> `/]/u`,
