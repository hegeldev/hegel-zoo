[[bug]]
id = "regexp-tree/33"
title = "optimize turns `a{0}` and `a{0,0}` into `a*`"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinZeroRepetitionIsNotAStar"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
quantifier-range-to-symbol treats a Range quantifier with from 0 and to 0 like `{0,}`:
`/a{0}b/` -> `/a*b/`, `/a{0,0}b/` -> `/a*b/`, `/(a){0}/` -> `/(a)*/`, `/\\${0,0}e/` -> `/\\$*e/`.
`a{0}` matches the empty string only (`/a{0}b/.exec("ab")` is "b" at index 1); `a*b` matches
"ab" at index 0, and `(a){0}` never sets group 1 where `(a)*` does.
"""

