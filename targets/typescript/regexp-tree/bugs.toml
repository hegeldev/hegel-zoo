[[bug]]
id = "regexp-tree/20"
title = "optimize sorts a class's `^` to the front and negates it: `/[b^]/` becomes `/[^b]/`"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinOptimizeKeepsACaretInsideTheClass"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
char-class-classranges-merge-transform.js:33 sorts the class's expressions (getSortValue,
:98-121) without any notion of the caret's position; a `^` that sorts first turns the class
into a negated one: `/[b^]/` -> `/[^b]/`, `/[a-c^]/` -> `/[^a-c]/`, `/[Z^]/i` -> `/[^z]/i`.
char-escape-unescape (:51-61) keeps `\\^` escaped only at index 0 of a non-negated class and
the later sort moves it: `/[a\\^]/` -> `/[^a]/`, `/(?:\\^|-)/` -> `/[^-]/` (matches everything
but "-" where the original matched "^" and "-").
"""

[[bug]]
id = "regexp-tree/21"
title = "optimize moves characters into a class without re-escaping: `(?:b|[\\]])` gives `[]b]`, `(?:[-a]|\\cA)` gives the invalid `[a-\\cA]`, `(?:\\0|0)` gives `[\\00]`"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinOptimizeReescapesCharsEnteringAClass"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
group-single-chars-to-char-class.js:30-37 builds a CharacterClass from the alternatives'
chars as they are: a `]` that char-escape-unescape had unescaped while it was a top-level char
(`/(?:b|[\\]])/` -> `/[]b]/`, an empty class followed by "b]": "b" no longer matches), a `-`
that becomes a range operator (`/(?:[-a]|\\cA)/` -> `/[a-\\cA]/`, "Range out of order";
