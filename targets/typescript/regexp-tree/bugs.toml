[[bug]]
id = "regexp-tree/29"
title = "The finite-automaton interpreter starts matching in the wrong state: `fa.test('/a*b/', 'b')` is false and `fa.test('/a*b/', '')` true"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDfaStartsAtTheStartState"
found = { commit = "06e849a3089196c5640da3c7a64c41c153271cd4", version = "0.1.27", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
interpreter/finite-automaton/dfa/dfa.js:167 renumbers the DFA states in Object.keys order of
the transition table (integer-like keys — DFA states made of one NFA state — come first),
and matches() (:209) starts at state 1. For `/a*b/` the table is `{"4": {}, "1,2,3": {...},
"2,1,3": {...}}`, so state 1 is the accepting state: "b", "ab", "aab" are rejected and "" is
accepted. Same for `/a?b/`, `/(a|b)c/`, `/(a|b)*c/`. It triggers whenever the start state's
epsilon closure has several NFA states and some other DFA state is a singleton.
"""

