name = "devalue"
language = "typescript"
upstream = "https://github.com/Rich-Harris/devalue"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-18"  # README, .github/ (ci + release workflows), no CONTRIBUTING: nothing about AI

[base]
commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855"
date = "2026-09-17"
version = "5.9.2"

[hegel]
version = "0.4.5"

[run]
# The library is plain JavaScript with no runtime dependencies (index.js re-exports src/*.js), so
# nothing of its own is installed. Hegel and the Temporal polyfill (Node 22 has no Temporal; the
# polyfill is devalue's own devDependency) go under .hegel/ in one install so the lock file stays
# untouched.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 @js-temporal/polyfill@0.5.1",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinAsyncPromiseResolvingToASeenValueIsJson = "devalue/1"
TestHegelPinAsyncPromiseResolvingToUndefinedIsUndefined = "devalue/2"
TestHegelPinAsyncRootPromiseResolvingToANegativeNumber = "devalue/3"
TestHegelPinUnevalViewOverAnOddBufferEvaluates = "devalue/4"
TestHegelPinUnevalOutputWithSixtyFiveThousandNamesEvaluates = "devalue/5"
TestHegelPinUnevalPlaceholderNamesDoNotShadowGlobals = "devalue/6"
TestHegelPinTaggedObjectIsNotAnEmptyArray = "devalue/7"
TestHegelPinOutputIsWellFormedText = "devalue/8"
TestHegelPinErrorPathForUndefinedOrBigIntMapKeyEvaluates = "devalue/9"
TestHegelPinPooledBufferDoesNotLeakItsPool = "devalue/10"
# Properties that find the same bugs (the stringifyAsync property finds 1, 2 and 3).
TestHegelStringifyAsyncMatchesStringify = "devalue/1"
TestHegelViewsOverAnyBufferRoundTrip = "devalue/4"
TestHegelLargeGraphsRoundTrip = { bug = "devalue/5", intermittent = true }
TestHegelTaggedObjectsAreObjectsOrRejected = "devalue/7"
TestHegelOutputIsWellFormedText = "devalue/8"
TestHegelUnserialisableValuesReportTheirPath = { bug = "devalue/9", intermittent = true }
TestHegelBuffersSerialiseOnlyTheirBytes = "devalue/10"
