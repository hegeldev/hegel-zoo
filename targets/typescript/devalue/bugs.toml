# Bugs found in devalue by the Hegel zoo. One [[bug]] per finding; `test` names the pin in
# hegel/hegel.test.mjs that fails while the bug exists (listed under [expected_failures] in
# target.toml). Oracles: JavaScript itself (indirect eval of `uneval` output, JSON.parse of
# `stringify` output, structuredClone as a second implementation of the same value space), a
# canonical rendering that compares identity structure, and devalue's README. No CONTRIBUTING
# file; README and .github/ say nothing about AI (checked 2026-09-18).

[[bug]]
id = "devalue/1"
title = "stringifyAsync writes `[object Promise]` into its output when a promise resolves to a value that was already serialised"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinAsyncPromiseResolvingToASeenValueIsJson"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A promise met during flattening gets an index and its slot holds the promise; when it settles,
`flatten(value, index)` is meant to fill the slot. If the resolved value was flattened before
(the same object reached another way, or a primitive equal to one already written: devalue
dedupes numbers and strings by value), `flatten` returns the earlier index and the slot is never
filled, so the output loop appends String(promise). stringifyAsync({ a: Promise.resolve(1), b:
Promise.resolve(1) }) returns `[{"a":1,"b":2},1,[object Promise]]`, which JSON.parse rejects;
{ s: "x", p: Promise.resolve("x") } and { o: shared, p: Promise.resolve(shared) } do the same.
Two promises resolving to equal strings is an everyday shape (two fetches returning the same
status), so this breaks stringifyAsync for real data. The slot should become a back-reference
to the earlier index (the same treatment a repeated reference gets in the synchronous path).
Found by the stringifyAsync property; the pin uses the two examples above.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/2"
title = "A nested promise resolving to undefined, NaN, Infinity or -0 is serialised as the sentinel number (-1, -3, -4, -6) and parses to that number"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinAsyncPromiseResolvingToUndefinedIsUndefined"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The special values are represented by negative indices in the parent's slot, never as values of
their own. When a promise in a nested position resolves to one of them, the settle callback
stores the sentinel into the promise's own slot (`if (i < 0) stringified[index] = i`), and the
output writes it there as a plain number: stringifyAsync({ a: Promise.resolve(undefined) })
gives `[{"a":1},-1]`, which parses to { a: -1 }; [Promise.resolve(NaN)] parses to [-3] and
[Promise.resolve(-0)] to [-6]. No error anywhere. A root promise is handled (the `i === 0 &&
value < 0` case returns the sentinel alone), nested ones are not: the parent's reference would
have to be rewritten, or the slot should hold a representation that parse understands. Found by
the stringifyAsync property; the pin checks undefined, NaN, -0 and Infinity under a promise.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/3"
title = "stringifyAsync of a promise resolving to a negative number returns the bare number, which parse rejects"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAsyncRootPromiseResolvingToANegativeNumber"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
After awaiting the root promise the loop re-reads its slot and tests `i === 0 && value < 0` to
recognise a sentinel; but the slot now holds the serialised *string* of the value, and the
string "-35" compares below zero. stringifyAsync(Promise.resolve(-35)) returns "-35" where
stringify(-35) returns "[-35]"; parse("-35") throws "Invalid input" because -35 is not a
sentinel. Any negative number (-0.5, -198) at the root, and only at the root. The test should
be `typeof value === "number"`. Found by the stringifyAsync property.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/4"
title = "uneval throws RangeError for a typed array over a buffer whose length is not a multiple of the element size"
kind = "crash"
severity = "medium"
test = "TestHegelPinUnevalViewOverAnOddBufferEvaluates"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
uneval writes a view as `new Uint16Array([...all elements of the buffer...]).subarray(start,
end)`, building the element list with `new Uint16Array(thing.buffer)` over the whole buffer.
That constructor requires the buffer length to be a multiple of the element size, which a
legal view does not: new Uint16Array(new ArrayBuffer(3), 0, 1) is fine, uneval of it throws
"RangeError: byte length of Uint16Array should be a multiple of 2"; new Float64Array(new
ArrayBuffer(20), 8, 1) gives the same for 8. When the buffer is shared and named, the emitted
`new Uint16Array(a)` throws at evaluation time instead. stringify handles the same views (it
writes the buffer as base64 plus offset and length). Found by the odd-buffer views property.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/5"
title = "uneval output with roughly 61 000 to 65 534 repeated values cannot be evaluated: the parameter form overflows the stack before the 65 535 cutoff"
kind = "crash"
severity = "medium"
test = "TestHegelPinUnevalOutputWithSixtyFiveThousandNamesEvaluates"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Repeated values are hoisted into the parameters of an IIFE; above 65534 of them uneval switches
to `var[a,b,...]=arguments[0]` with one array argument because a function may not take more
parameters (#93). But V8 cannot *call* a function with that many arguments either: the
arguments are pushed on the stack, and with Node's default stack a call with about 61 000 or
more arguments throws "RangeError: Maximum call stack size exceeded" (fewer when the stack is
already partly used: 60 000 fails 2 000 frames deep). So uneval of a graph with 65 534 values
referenced twice produces JavaScript that throws when evaluated, while 65 535 works. The array
form works at every size and could simply be used from a few thousand names on. Found by the
large-graph property; the pin evaluates the output for 65 534 shared objects.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/6"
title = "uneval placeholder names shadow Map, Set, URL and NaN in the generated function body for graphs with over 113 000 repeated values"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnevalPlaceholderNamesDoNotShadowGlobals"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Hoisted values are named by counting through the 54 characters [a-zA-Z_$]: name 113 793 is
"Map", 116 733 "NaN", 131 509 "Set", 139 465 "URL" (and far later "Date", "null", "true"). The
list of names avoided covers reserved words only, and the statements inside the function body
build non-repeated values with `new Map(...)`, `new Set(...)`, `new URL(...)` and write NaN as
`NaN`, all of which then resolve to the parameter. With 113 794 objects each referenced twice
and a Map in one of them, evaluating the output throws "TypeError: Map is not a constructor";
with NaN it silently stores an object. The generated names should skip every identifier the
emitted code uses (or the emitted code should not depend on globals). Large but in scope: the
library handles more than 65 534 names on purpose. The pin builds the 113 794-object graph.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/7"
title = "A plain object with a Symbol.toStringTag naming a built-in is serialised as that built-in: tag Array gives [], ArrayBuffer/Set give empty ones, boxed tags give undecodable output"
kind = "silent-corruption"
severity = "low"
test = "TestHegelPinTaggedObjectIsNotAnEmptyArray"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Both stringify and uneval classify a value by Object.prototype.toString, which a plain object
controls through Symbol.toStringTag (own or inherited, enumerable or not), and the plain-object
checks (symbol keys refused, own keys written) run only in the default branch. With the tag
"Array" stringify iterates `length` (undefined) and writes `[]`: { a: 1, b: "two" } tagged
Array comes back as an empty array, no error. "ArrayBuffer" gives an empty buffer in both
functions, "Set" an empty Set in uneval; "Number", "String", "Boolean" and "BigInt" unbox with
valueOf (the object itself) and stringify writes `[["Object",0]]`, a self-reference that parse
rejects with "Invalid input"; "URL", "URLSearchParams" and "Temporal.*" write "[object URL]" and
the like, which parse cannot revive; "Date", "Map", "RegExp" and the typed-array tags throw
TypeErrors from inside rather than the documented DevalueError. structuredClone of the same
objects gives { a: 1, b: "two" }. An enumerable tag is a symbol key, which the README says is
refused; a non-enumerable one leaves a plain object that should be written as one. Found by the
tagged-objects property; the pin uses { a: 1, b: "two" } with a non-enumerable tag "Array".
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/8"
title = "Strings with unpaired surrogates are written raw, so the output is not well-formed text and the string changes once sent as UTF-8"
kind = "contract"
severity = "low"
test = "TestHegelPinOutputIsWellFormedText"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
stringify_string escapes quotes, backslashes, `<`, U+2028/2029 and control characters but
leaves lone surrogates as they are: stringify("\ud800") is `["<U+D800>"]` and uneval the same,
neither .isWellFormed(). The output exists to be embedded in an HTML page or sent over HTTP,
where it is encoded as UTF-8; an unpaired surrogate cannot be, and becomes U+FFFD (or a
TextEncoder/fs error), so the client receives a different string with no indication.
JSON.stringify has escaped lone surrogates as \udXXX since ES2019 ("well-formed
JSON.stringify") for exactly this reason, and uneval already does so for object keys (which go
through JSON.stringify). Found by the well-formed-output property.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/9"
title = "DevalueError.path for a Map entry keyed by undefined or a bigint is `.get(-1)` or `.get([\"BigInt\",\"5\"])` in stringify"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinErrorPathForUndefinedOrBigIntMapKeyEvaluates"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README documents error.path as an expression locating the offending value
(`.object.array[0].get("key")`). stringify builds the Map segment with its own
stringify_primitive, whose job is the *flattened* representation: undefined becomes the
sentinel "-1" and a bigint `["BigInt","5"]`. So stringify(new Map([[undefined, () => 1]]))
reports path `.get(-1)` and a 5n key `.get(["BigInt","5"])`, neither of which finds the
function; uneval writes `.get(void 0)` and `.get(5n)` for the same maps. Other primitive keys
(strings, numbers, booleans, null) are fine. Found by the error-path property (5 of 100 cases).
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "devalue/10"
title = "A Node Buffer from the shared pool is serialised with its whole 8 KiB pool, including other Buffers' bytes"
kind = "security"
severity = "medium"
test = "TestHegelPinPooledBufferDoesNotLeakItsPool"
found = { commit = "8ade61d0e70d935a780e6cb0a69ee2a5383b4855", version = "5.9.2", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A typed array is written as its entire underlying ArrayBuffer (base64 in stringify, an element
list in uneval) plus offset and length, so that views sharing a buffer keep sharing it. In Node,
Buffer.from(string) and Buffer.allocUnsafe below 4 KiB are views into a shared 8 KiB pool, so
stringify(Buffer.from("abc")) is 10 968 characters: `[["Uint8Array",1,3272,3],["ArrayBuffer",
"LwAAAAAAAABleHBvcnQ..."]]`, the base64 of the whole pool, in which the probe could read module
source text and, in the pin, another Buffer's contents allocated just before. A server that
serialises a small Buffer for the client (SvelteKit load data) ships 8 KiB of unrelated process
memory each time. The README's security section does not mention it. Only bytes the view
covers (or that another serialised view shares) should be written. Found by the
Buffers-serialise-only-their-bytes property.
'''

[[bug.observed]]
version = "5.9.2"
commit = "8ade61d0e70d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"
