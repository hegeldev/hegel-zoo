# Bugs found in pathe (unjs/pathe) by the Hegel properties (see README.md). Each is pinned by the
# test named in `test` (test/hegel.test.mjs), which asserts node's `path` behaviour (or the glob
# dialect's, where node's matchesGlob is quirky) and fails while the bug exists.

[[bug]]
id = "pathe/1"
title = "A \"..\" that climbs past a drive or UNC root drops the root: normalize(\"C:\\a\\..\\..\") is \"/\" (node win32: \"C:\\\")"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDotDotStopsAtTheDriveRoot"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`normalizeString(path, allowAboveRoot=false)` (_path.ts:148) treats `C:` and the UNC `server/share`
as ordinary segments, so a `..` at depth zero pops them; `normalize` then sees an empty result for an
absolute input and returns `/`. `normalize('C:\a\..\..')`, `normalize('C:\..')`,
`resolve('C:\a', '..', '..')`, `join('C:/a', '../..')` and `normalize('\\server\share\..\..')`
all give `/`; node's `path.win32` gives `C:\` and `\\server\share\`. A `..` also eats the drive
when it follows a doubled separator: `normalize('D:\/..\.a\')` is `/.a/`. Found by
`TestHegelAgreesWithNodeWin32OnDrivePaths` and `TestHegelPathLaws`.
'''

[[bug]]
id = "pathe/2"
title = "dirname/basename/parse of a drive root lose the drive: dirname(\"C:\\\") is \"/\", basename(\"C:\\\") is \"C:\", parse(\"C:/\") is {root \"C:/\", dir \"/\", base \"C:\"}"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDriveRootHasNoBasename"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`dirname` (_path.ts:255) strips the trailing separators, splits on `/` and drops the last piece,
which for `C:/` is the drive itself: nothing is left and `isAbsolute` makes it `/`. `basename`
(_path.ts:269) returns the last non-empty piece, `C:`. `parse` combines the two: `{root: "C:/", dir:
"/", base: "C:", ext: "", name: "C:"}`, so `dir` does not start with `root` and `format(parse(p))`
is `/C:`. node's win32 gives `C:\`, `` and `{root: "C:\", dir: "C:\", base: ""}`. Found by
`TestHegelAgreesWithNodeWin32OnDrivePaths` (drive roots with any separators).
'''

[[bug]]
id = "pathe/3"
title = "Three or more leading slashes become a UNC prefix: normalize(\"///a\") is \"//a\" (POSIX: \"/a\", win32: \"\\a\"), while normalize(\"//\") is \"/\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinThreeSlashesAreOneRoot"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`_UNC_REGEX = /^[/\\]{2}/` (_path.ts:14) matches any two leading separators, so `///a` and `////a/b`
are re-prefixed with `//` after normalization (`//a`, `//a/b`), and `resolve('///a')` is `//a`.
POSIX collapses three or more slashes to one (`/a`), and Windows only reads exactly two as a UNC
prefix (`path.win32.normalize('\\\a')` is `\a`). pathe keeps exactly two by design (a UNC
root), which the zoo does not count against it. Found by `TestHegelAgreesWithNodePosix`.
'''

[[bug]]
id = "pathe/4"
title = "parse() of a UNC path has root \"/\": the dir \"//server/share\" does not start with the root"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUncParseRootIsThePrefix"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`_PATH_ROOT_RE = /^[/\\]|^[a-zA-Z]:[/\\]/` (_path.ts:19) takes one separator as the root of
`\\server\share\x`, while `dirname` and `normalize` keep `//server/share`; so `parse` returns
`{root: "/", dir: "//server/share", base: "x"}`. node's win32 root is `\\server\share\`.
`format(parse(p))` goes through `resolve(root, dir, base)` and happens to survive. Found by
`TestHegelUncPathsKeepTheirPrefix` (dir must start with root).
'''

[[bug]]
id = "pathe/5"
title = "parse() of a lower-case drive path mixes cases: root \"c:/\" but dir \"C:/\""
kind = "inconsistent"
severity = "low"
test = "TestHegelPinParseKeepsOneDriveLetterCase"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`normalizeWindowsPath` (_internal.ts:12-21) upper-cases a drive letter followed by `:/`, and
`dirname` uses it, but `parse` takes `root` from the raw input (_path.ts:289). `parse('c:/a')` is
`{root: "c:/", dir: "C:/", base: "a"}`: `dir` does not start with `root`, and `normalize('c:/a')`
(`C:/a`) does not start with `parse('c:/a').root`. Found by `TestHegelAgreesWithNodeWin32OnDrivePaths`
and `TestHegelPathLaws`.
'''

[[bug]]
id = "pathe/6"
title = "normalize(\"C:\") is the absolute \"C:/\" while isAbsolute(\"C:\") is false; resolve(\"C:\", \"a\") prepends the cwd; normalize(\"c:\") is \"c:/\" and not idempotent"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinNormalizeKeepsABareDriveRelative"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`normalize` appends `/` to a bare drive (`_DRIVE_LETTER_RE`, _path.ts:52-54), producing a root, but
`_IS_ABSOLUTE_RE` needs a separator after the colon, so `isAbsolute('C:')` is false and
`resolve('C:', 'a')` is `<cwd>/C:/a` (node's win32: `C:\<cwd without drive>\a`, a drive-relative
path). Lower case is not folded on the way: `normalize('c:')` is `c:/`, and normalizing that again
gives `C:/`. Found by `TestHegelPathLaws` (normalization must not change `isAbsolute`).
'''

[[bug]]
id = "pathe/7"
title = "An escaped letter or digit in a glob reaches the RegExp as an escape: \"\\d\" matches \"5\" and not \"d\", \"\\w\" any word character, \"\\s\" a space, \"\\b\" nothing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEscapedLettersAreLiteralInGlobs"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Escaped = match(/\\./, regex)` (_glob.ts:313) turns the two characters of the escape into RegExp
source as they are, so `\d`, `\w`, `\s`, `\b`, `\n`, `\1` keep their RegExp meaning:
`matchesGlob('5', '\d')` is true, `matchesGlob('d', '\d')` false, `matchesGlob('b', '\b')` false
(a word boundary), `matchesGlob(' ', '\s')` true. In every glob dialect a backslash makes the next
character literal (node's `matchesGlob`, bash). Only `\` before a punctuation character is safe.
Found by `TestHegelGlobMatchesItsGrammar`.
'''

[[bug]]
id = "pathe/8"
title = "A numeric range pads to the narrower endpoint: \"{01..3}\" is 1|2|3, so \"a02\" does not match \"a{01..3}\" and \"a2\" does"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNumericRangesPadToTheWiderEndpoint"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`RangeNumeric` (_glob.ts:371-373) pads with `Math.min($1.length, $2.length)`; bash (`echo {01..3}`
→ `01 02 03`, `{001..3}` → `001 002 003`) and node's `matchesGlob` pad every item to the widest
zero-padded endpoint. `matchesGlob('a02', 'a{01..3}')` is false and `matchesGlob('a2', 'a{01..3}')`
true; `{01..10}` matches neither `a010` nor … only unpadded items. Negative endpoints (`{-1..1}`)
are not ranges at all (`\d+`), noted in the README. Found by `TestHegelGlobMatchesItsGrammar`.
'''

[[bug]]
id = "pathe/9"
title = "A bracket expression whose first character is \"]\" is empty: \"[]]\" does not match \"]\", \"[!]]\" matches nothing"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBracketExpressionMayStartWithCloseBracket"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Class` (_glob.ts:359-367) closes at the first `]`, so `[]]` compiles to the empty class `[]` (which
matches nothing) followed by an escaped `]`, and `[]a]` to `[]` + `a]`. POSIX (and node's
`matchesGlob`) read a `]` in first position as a member: `matchesGlob('a/]', 'a/[]]')` should be
true and `matchesGlob('a/b', 'a/[!]]')` too. Found by `TestHegelGlobMatchesItsGrammar`.
'''

[[bug]]
id = "pathe/10"
title = "format() does not ignore root when dir is given: format({root: \"/\", dir: \"a\", base: \"b\"}) is \"/a/b\", node \"a/b\""
kind = "contract"
severity = "low"
test = "TestHegelPinFormatIgnoresRootWhenDirIsGiven"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
node's documentation: "`pathObject.root` is ignored if `pathObject.dir` is provided". pathe's
`format` (_path.ts:263-267) resolves `root`, `dir` and `base` together whenever `root` is set, so a
relative `dir` is rooted: `{root: "/", dir: "a", base: "b"}` → `/a/b`. The same code path also
normalizes (`{root: "/", dir: "/./a", base: "b"}` → `/a/b`, node `/./a/b`), which is pathe's stated
intent and is not counted. Found by `TestHegelFormatAgreesWithNodePosix`.
'''

[[bug]]
id = "pathe/11"
title = "filename(\"..\") is \".\" (parse(\"..\").name is \"..\")"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFilenameOfDotDot"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`filename` (utils.ts:108-122) cuts at the last dot when its index is above 0, so `..` (index 1)
becomes `.`; `filename('a/..')` is `.` too. `parse(p).name`, `basename` and `extname` (`''`) all
treat `..` as a name without an extension. Found by `TestHegelUtilsAgreeWithParse`.
'''

[[bug]]
id = "pathe/12"
title = "resolve() of a path that reduces to a drive root is \"/C:\" or \"C:\": resolve(\"C:/\") is \"/C:\", resolve(\"C:\\a\\..\") is \"C:\""
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinResolveOfADriveRootIsTheDriveRoot"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`resolve` (_path.ts:97-139) appends `/` to each argument, runs `normalizeString` and then, for an
absolute result that `isAbsolute` no longer recognises (`C:` has no separator), prefixes `/`:
`resolve('C:/')` and `resolve('D:\')` are `/C:` and `/D:`. When the input is deeper and collapses
back to the drive (`C:\a\..`, `Z:/_/..`) the result is the bare `C:`/`Z:`, which is drive-relative
and not what `normalize` gives (`C:/`); `relative('C:\x', 'Z:/_/..')` is then `Z:` where node gives
`Z:\`. `normalize` has the `_DRIVE_LETTER_RE` fix-up that `resolve` lacks. Found by
`TestHegelPathLaws` (resolve must return a normalized absolute path).
'''

[[bug]]
id = "pathe/13"
title = "A bracket expression with an out-of-order range throws: matchesGlob(\"a\", \"[a-0]\") raises SyntaxError from the RegExp constructor"
kind = "crash"
severity = "low"
test = "TestHegelPinOutOfOrderBracketRangeDoesNotThrow"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ClassRange` (_glob.ts:347) only recognises `[a-z]-[a-z]` and `[0-9]-[0-9]`; any other `x-y` goes
through `ClassPassthrough` into the RegExp source, where `[a-0]` is "Range out of order in
character class": `matchesGlob('a', '[a-0]')` and `matchesGlob('a', 'x/[z-a]')` throw
`SyntaxError: Invalid regular expression`; so does a negated class that starts with `-` (`[!-.]`),
because the negation is compiled to `[^\/` and the `-` then ranges from `/`. bash and node's
`matchesGlob` return false. (An in-order
mixed range such as `[0-a]` silently becomes a RegExp range.) Found by `TestHegelGlobMatchesItsGrammar`.
'''

[[bug]]
id = "pathe/14"
title = "\"*/**\" at the end of a glob needs a trailing slash: matchesGlob(\"a\", \"*/**\") is false although matchesGlob(\"a\", \"a/**\") is true"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinStarSlashGlobstarMatchesTheSegmentItself"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`StarDouble = match(/\*\/(?!\*\*\/|\*$)/)` (_glob.ts:336) consumes `*/` when the next characters
are `**` at the end of the glob, so the `**` is compiled by `StarStarNone` (`.*?`) instead of
`StarStarEnd` (which allows the segment itself): `matchesGlob('a', '*/**')` is false while
`matchesGlob('a/b', '*/**')`, `matchesGlob('a', 'a/**')` and `matchesGlob('x', '?/**')` are true.
The same happens to `*/**/x` (`a/x` no longer matches). Found by `TestHegelGlobMatchesItsGrammar`.
'''

[[bug]]
id = "pathe/15"
title = "A UNC server name starting with \".\" is rewritten as the device namespace: normalize(\"//.a/c\") is \"//./.a/c\""
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUncServerStartingWithADotIsKept"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`_IS_ABSOLUTE_RE` (_path.ts:15) excludes `//.` from absolute paths (meant for the `//./` device
namespace), and `normalize` then returns `` `//./${path}` `` for any UNC-looking input that is not
absolute (_path.ts:56-59). A server (or first POSIX segment after a doubled slash) whose name starts
with a dot is therefore rewritten: `normalize('//.a/c')` is `//./.a/c`, `normalize('\\\\.srv\\share\\x')`
is `//./.srv/share/x`, and `isAbsolute` is false for the input but true for the result. node's win32 keeps `\\\\.srv\\share\\x`. Found by `TestHegelPathLaws` (normalized form).
'''

[[bug]]
id = "pathe/16"
title = "An escaped character followed by \"**\" at the end of its segment lets the \"**\" cross slashes: matchesGlob(\".y/z/w\", \"\\\\.**/w\") is true (node: false), while \"a**/w\" stays in its segment"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEscapedCharacterBeforeGlobstarStaysInItsSegment"
found = { commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5", version = "2.0.3", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`src/_glob.ts`: the normalizing grammar folds a `**` glued to a preceding character into a plain
`*` with `match(/([^/{[(!])\*\*/, ...)`, but an escape is consumed earlier by `match(/\\./, identity)`
as one token, so the rule cannot see the escaped character and the `**` survives into the
matching grammar, where `StarStarStart = match(/^(\*\*\/)+/)` (or `StarStarNone`, `.*?`, at the
end of the pattern) treats it as a full globstar. So `matchesGlob(".y/z/w", "\\.**/w")`,
`matchesGlob(".y/z", "\\.**")` and `matchesGlob("*y/q/z", "\\***/z")` are true where the pattern's
segment should match one path segment only (node's `path.posix.matchesGlob` and the test's grammar
say false); `\\.**a/w` and `[y]**/w`, where something follows or the escape is a class, behave.
Found by TestHegelGlobMatchesItsGrammar once the rewritten generators drew escapes as atoms of a
segment; the property skips the shape (7 in 20000).
'''
