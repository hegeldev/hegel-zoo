name = "pathe"
language = "typescript"
upstream = "https://github.com/unjs/pathe"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-16"  # README, .github/workflows: no CONTRIBUTING, no AI policy

[base]
commit = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5"
date = "2026-07-08"
version = "2.0.3"

[hegel]
version = "0.4.5"

[run]
# TypeScript sources, dist/ not committed (obuild), package.json pins pnpm (npm cannot install into
# the package itself): Hegel and the TypeScript compiler go under .hegel/ and the harness imports
# Hegel from there. The sources import each other without extensions, so they are compiled to
# CommonJS into .hegel/dist (test/tsconfig.hegel.json) and marked as such with a package.json
# (the package is "type": "module"); the tests require() that build.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 typescript@5.9.3",
  "node .hegel/node_modules/typescript/bin/tsc -p test/tsconfig.hegel.json --noCheck",
  "cp test/hegel-dist-package.json .hegel/dist/package.json",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinDotDotStopsAtTheDriveRoot = "pathe/1"
TestHegelPinDriveRootHasNoBasename = "pathe/2"
TestHegelPinThreeSlashesAreOneRoot = "pathe/3"
TestHegelPinUncParseRootIsThePrefix = "pathe/4"
TestHegelPinParseKeepsOneDriveLetterCase = "pathe/5"
TestHegelPinNormalizeKeepsABareDriveRelative = "pathe/6"
TestHegelPinEscapedLettersAreLiteralInGlobs = "pathe/7"
TestHegelPinNumericRangesPadToTheWiderEndpoint = "pathe/8"
TestHegelPinBracketExpressionMayStartWithCloseBracket = "pathe/9"
TestHegelPinFormatIgnoresRootWhenDirIsGiven = "pathe/10"
TestHegelPinFilenameOfDotDot = "pathe/11"
TestHegelPinResolveOfADriveRootIsTheDriveRoot = "pathe/12"
TestHegelPinOutOfOrderBracketRangeDoesNotThrow = "pathe/13"
TestHegelPinStarSlashGlobstarMatchesTheSegmentItself = "pathe/14"
TestHegelPinUncServerStartingWithADotIsKept = "pathe/15"
