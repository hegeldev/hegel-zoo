notes = '''
`toGamut('hsl')('black')` and `toGamut('hsl')('white')` are `{mode: 'hsl'}`, `toGamut('hsv')({mode: 'rgb', r: 0, g: 0, b: 0, alpha: 0.5})` is `{mode: 'hsv', alpha: 0.5}`, `toGamut('okhsl')('white')` is `{mode: 'okhsl'}`; `formatCss` of the result is `hsl(none none none)`. The API reference says the colour returned "is in the dest color space" and for `p3` or `rgb` the same inputs give proper white and black. In src/clamp.js `toGamut` returns `{...destMode.white, mode: dest}` when the oklch lightness is at or above 1 and `{...destMode.black, mode: dest}` at or below 0; the RGB definitions carry `white` and `black`, the HSL-family definitions have `gamut: 'rgb'` (so `toGamut` accepts them) but no `white`/`black`, so the spread adds nothing. Any colour with lightness beyond the ends, such as `lch(150 0 0)` or `lab(-5 0 0)`, loses its channels too.
'''
