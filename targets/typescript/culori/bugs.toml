# Bugs found in culori (Evercoder/culori) by the Hegel zoo. ids are culori/N; see README.md for the properties.

[[bug]]
id = "culori/1"
title = "parse throws a TypeError on a number followed by an unknown identifier (rgb(1e 0 0), rgb(5px 0 0), hsl(120DEG 50% 50%)) instead of returning undefined"
kind = "crash"
severity = "medium"
test = "TestHegelPinParseReturnsUndefinedForMalformedNumbers"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('rgb(1e 0 0)')`, `parse('rgb(5px 0 0)')`, `parse('rgb(255 0 0 / 1px)')`, `parse('color(srgb 1foo 0 0)')` and `parse('hsl(120DEG 50% 50%)')` all throw `TypeError: Cannot read properties of undefined (reading 'type')`. The API reference says "If no built-in parsers can match the string, the function will return undefined", and every other malformed string does return undefined. In `tokenize` (src/parse.js) the numeric-token consumer `num()` returns `undefined` when the number is followed by an identifier that is not one of `deg`, `rad`, `grad`, `turn`; `tokenize` pushes that `undefined` as a token, and `consumeCoords` then reads `token.type`. Anything that lets user input reach `parse` (or a `converter`, which calls it) can be crashed by a unit typo.
'''

[[bug]]
id = "culori/2"
title = "parse is case-sensitive for CSS function names, keywords and units: RGB(255 0 0), HSL(120, 50%, 50%), Transparent and hsl(120DEG 50% 50%) are rejected"
kind = "contract"
severity = "low"
test = "TestHegelPinParseIsCaseInsensitive"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('RGB(255 0 0)')`, `parse('Rgb(255 0 0)')`, `parse('HSL(120 50% 50%)')`, `parse('HSL(120, 50%, 50%)')`, `parse('COLOR(srgb 1 0 0)')` and `parse('Transparent')` return `undefined`, and `parse('hsl(120DEG 50% 50%)')` throws (culori/1), while `parse('RED')` and `parse('#FF0000')` work. CSS function names, keywords (`transparent`, `none`) and dimension units are ASCII case-insensitive (CSS Syntax Level 3 matches identifiers case-insensitively; CSS Color 4 gives `RGB(...)` as a valid spelling), and browsers, colorjs.io and CSS parsers accept them. The modern-syntax parsers compare `parsed[0] !== 'rgb'` against the identifier as written, the legacy regexes are `^rgba?\\(` and `^hsla?\\(` without the `i` flag, `parseTransparent` is `c === 'transparent'`, and the hue-unit lookup is `huenits[id]` on the identifier as written.
'''

[[bug]]
id = "culori/3"
title = "parse ignores whitespace around a functional colour but not around a hex, named or legacy comma colour ( red , #abc , rgb(255, 0, 0) return undefined)"
kind = "contract"
severity = "low"
test = "TestHegelPinParseIgnoresSurroundingWhitespace"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse(' rgb(255 0 0) ')` and `parse('\\thsl(120 50% 50%)\\n')` parse (the tokenizer starts with `str.trim()`), but `parse(' red ')`, `parse(' #abc ')`, `parse(' transparent')` and `parse(' rgb(255, 0, 0)')` (the legacy comma syntax) return `undefined`: `parseHex`'s regex is anchored, `parseNamed` looks the raw string up in the table, `parseTransparent` compares it with `===`, and the legacy regexes are anchored at `^rgba?\\(`. So a value read from a stylesheet or an attribute with its surrounding whitespace parses or not depending on which notation it uses. CSS ignores whitespace around a value.
'''

[[bug]]
id = "culori/4"
title = "hsl saturation and lightness are clamped to [0, 1] by the legacy comma syntax and not at all by the modern one; CSS Color 4 clamps only a negative saturation"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHslSaturationClampsAlikeInBothSyntaxes"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('hsl(120 150% 50%)')` gives `s: 1.5` and `parse('hsl(120, 150%, 50%)')` gives `s: 1`; `parse('hsl(120 -20% 120%)')` gives `s: -0.2, l: 1.2` and `parse('hsl(120, -20%, 120%)')` gives `s: 0, l: 1`. The same colour written in the two syntaxes CSS Color 4 defines as equivalent parses to two different objects: `parseHslLegacy` clamps `s` and `l` to `[0, 1]`, `parseHsl` clamps nothing. The specification says (section hsl()) "For historical reasons, if the saturation is less than 0% it is clamped to 0% at parsed-value time", and nothing about lightness or saturations above 100% (colours outside the sRGB gamut are allowed). A negative saturation is also what `formatCss` writes for an out-of-gamut colour (culori/6): `hsl(20 -60% 112.5%)`, which a browser reads as a gray.
'''

[[bug]]
id = "culori/5"
title = "nearest(colors)(color, n) never returns more than colors.length - 1 results, so a finite n cannot rank the whole palette"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNearestCanReturnEveryColor"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`nearest(['red', 'lime', 'blue'])('black', 3)` returns two colours, `nearest(['red', 'blue'])('red', 2)` returns `['red']`, and only `n = Infinity` returns all of them. The API reference documents `nearest(colors, metric, accessor) -> function (color, n = 1, tau = Infinity)` as returning "n colors nearest to color"; src/nearest.js clamps `n = Math.max(1, Math.min(n, arr.length - 1))` when `n` is finite, one short of the array. A caller asking for the full ranking of a palette (a common use: sort a palette by distance) silently loses the farthest colour.
'''

[[bug]]
id = "culori/6"
title = "rgb to hsl of a colour outside the sRGB gamut gives a negative or infinite saturation where CSS Color 4 flips the hue; formatCss then writes hsl(20 -60% 112.5%)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRgbToHslFollowsCssColor4OutsideTheGamut"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`hsl({mode: 'rgb', r: 1.2, g: 1.1, b: 1.05})` gives `{h: 20, s: -0.6, l: 1.125}`; the `rgbToHsl` sample code of CSS Color 4 gives `hsl(200 60% 112.5%)` (when the saturation comes out negative it adds 180 to the hue and takes the absolute value). `hsl({mode: 'rgb', r: 1.5, g: 0.5, b: 1})` has lightness exactly 1 and gives `s: Infinity` (`(M - m) / (1 - |M + m - 1|)` with a zero denominator; the specification defines the saturation as 0 when the lightness is 0 or 1). Inside culori the negative form converts back to the same rgb, but `formatCss` writes it as `hsl(20 -60% 112.5%)` or `hsl(... Infinity% 100%)`, which CSS parses as `hsl(20 0% 112.5%)`, a different colour; and `parse` of culori's own string does not give the colour back either (culori/4).
'''

[[bug]]
id = "culori/7"
title = "an interpolation hint of 0 is ignored: interpolate(['red', 0, 'blue']) interpolates linearly, unlike the documented equivalent easingMidpoint(0)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInterpolationHintOfZeroIsHonoured"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The API reference says any number in the colours array is an interpolation hint and that `interpolate(['red', 0.25, 'blue'])` "is equivalent to" `interpolate(['red', easingMidpoint(0.25), 'blue'])`. With the hint `0`, `interpolate(['red', 0, 'blue'])(0.25)` is `{r: 0.75, g: 0, b: 0.25}` (plain linear interpolation) while `interpolate(['red', easingMidpoint(0), 'blue'])(0.25)` is blue, and a hint of `0.0001` gives `{r: 0.099, b: 0.9}`, so the result jumps at 0. In src/interpolate/interpolate.js the hint is stored as a number and looked up as `fns[idx] || fns[0]`, where `0` is falsy and falls through to the (usually absent) global easing.
'''

[[bug]]
id = "culori/8"
title = "removeParser cannot remove the first registered parser function (idx > 0 instead of idx >= 0)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRemoveParserRemovesTheFirstParser"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The API reference: "removeParser(parser): Remove a previously registered parser function or string, including parsers registered by default." With the default import, `parseHsl` is the first parser registered (`parsers[0]`); `removeParser(parseHsl); parse('hsl(120 50% 50%)')` still gives `{mode: 'hsl', h: 120, s: 0.5, l: 0.5}`. src/modes.js: `const idx = parsers.indexOf(parser); if (idx > 0) parsers.splice(idx, 1);` skips index 0. Removing any other parser works, so a program that removes parsers to restrict the accepted syntax silently keeps one.
'''

[[bug]]
id = "culori/9"
title = "filterDeficiencyProt/Deuter/Trit round the severity to tenths: the interpolation between the precomputed matrices is dead code"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDeficiencySeverityIsContinuous"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The severity is documented as a value "in the interval [0, 1]" (with the Machado, Oliveira and Fernandes matrices published at steps of 0.1 and meant to be interpolated between). `filterDeficiencyProt(s)('blue').r` is `-0.137642` for s = 0.5 and 0.549 and `-0.154455` for s = 0.55, 0.551 and 0.6: the result is a step function of the severity with 11 values. In src/deficiency.js the matrix index is `Math.round(tt / 0.1)` and the interpolation weight `Math.round(tt % 0.1)`, which is always 0 since `tt % 0.1 < 0.1`; the `lerp` between neighbouring matrices therefore always returns the nearest one (it should be `i = Math.floor(tt * 10)`, `w = tt * 10 - i`).
'''

[[bug]]
id = "culori/10"
title = "interpolatorSplineNatural with exactly three values does not pass through the middle value"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNaturalSplinePassesThroughThreeValues"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`interpolatorSplineNatural([0, 1, 2])(0.5)` is `1.3333` and `interpolatorSplineNatural([5, 1, 5])(0.5)` is `1.8333`; a natural interpolating spline (the documentation calls them "natural interpolating splines") passes through its knots, so both should be 1, and with four or more values they are (`interpolatorSplineNatural([0, 1, 2, 3])(1/3)` is 1). In src/interpolate/splineNatural.js `solve()` builds the tridiagonal system for the interior control points; for n = 2 (three values) the single interior equation is written as `(6 * v[1] - v[0]) / 4` and never subtracts `v[2]`, because the `i == n - 1` branch that subtracts the last value lives inside a loop that starts at i = 2. The middle control point is off by `v[2] / 4`, so every three-stop gradient using the natural spline (`interpolate([a, b, c], mode, {h: interpolatorSplineNatural})`) misses its middle colour.
'''

[[bug]]
id = "culori/11"
title = "interpolatorSplineNaturalClosed does not pass through its values: it solves the open boundary problem and evaluates it with the periodic basis"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinClosedNaturalSplinePassesThroughItsValues"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`[0, 0.25, 0.5, 0.75, 1].map(interpolatorSplineNaturalClosed([0, 1, 0, 1, 0]))` gives `[0.286, 1, 0, 1, 0.286]` and `[0, 1/3, 2/3, 1].map(interpolatorSplineNaturalClosed([0, 1, 2, 3]))` gives `[0.667, 1, 2, 2.333]`; the open `interpolatorSplineNatural` returns the values themselves at the knots. The documentation describes the closed variants as the same interpolating spline "which considers the values array to be periodic". src/interpolate/splineNatural.js computes the control points with the open-boundary `solve()` (first and last control points fixed to the first and last values) and then feeds them to the periodic basis evaluation, so the end knots are not interpolated; a periodic natural spline needs the cyclic tridiagonal solve.
'''

[[bug]]
id = "culori/12"
title = "interpolateWithPremultipliedAlpha returns the un-premultiplied colour at the ends and then divides it by alpha: rgba(255, 0, 0, 0.5) comes out as r = 2 at t = 0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPremultipliedInterpolationStartsAtTheFirstColor"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`interpolateWithPremultipliedAlpha(['rgba(255, 0, 0, 0.5)', 'blue'])(0)` is `{r: 2, g: 0, b: 0, alpha: 0.5}` while `(1e-9)` is `{r: 0.999999998, ...}`; with positioned stops `[['rgba(255, 0, 0, .5)', 0.2], ['rgba(0, 0, 255, .5)', 0.8]]`, `(0.1)` gives `r: 2` and `(0.9)` gives `b: 2`. An interpolator should return its first colour at t = 0 and its last at t = 1 (and `interpolate` does). In src/interpolate/interpolate.js the early returns `if (t <= positions[0]) return conv_colors[0]` and `if (t > positions[n]) return conv_colors[n]` hand back the converted colours before the pre-mapping (alpha multiplication) was applied to them, and `interpolateWith` then runs the post-mapping (alpha division) on the result, so the ends and everything outside the positioned range are divided by alpha once too often.
'''

[[bug]]
id = "culori/13"
title = "a spline given as the global interpolator is applied to an all-undefined alpha and yields alpha: NaN, so formatHex8 writes a fully transparent colour"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSplineOverrideLeavesAlphaUndefined"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`interpolate(['red', 'blue'], 'rgb', interpolatorSplineBasis)(0.5)` is `{mode: 'rgb', r: 0.5, g: 0, b: 0.5, alpha: NaN}` and `formatHex8` of it is `'#80008000'` (alpha 0); the same with `interpolatorSplineNatural`. With the default (`interpolatorLinear`) or the monotone splines the alpha is left out, as documented for the piecewise interpolators ("If both values are undefined, they are left as-is"). When `overrides` is a function it replaces the interpolator of every channel including `alpha`; the basis and natural splines compute on the `[undefined, undefined]` alpha array and return NaN, and the `if (val !== undefined)` filter in the interpolator's result loop lets NaN through. The documented way of choosing a spline for a whole gradient (`interpolate(colors, mode, interpolatorSplineBasis)`) thus produces colours with an invalid alpha.
'''

