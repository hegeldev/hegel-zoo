`rgb({mode: 'luv', l: 0, u: 0, v: 0, alpha: 0.5})` is `{mode: 'rgb', r: 0, g: 0, b: 0}` and `rgb({mode: 'lchuv', l: 0, c: 0, h: 0, alpha: 0.5})` likewise, while `rgb({mode: 'luv', l: 10, u: 0, v: 0, alpha: 0.5})` keeps `alpha: 0.5`; every other converter passes alpha through, and so does `luv(rgb)` in the other direction. src/luv/convertLuvToXyz50.js returns early for `l === 0` (and for an undefined `l`, which takes the same path) with a black that has no alpha. A transparent black going through Luv becomes opaque black: `rgb(luv({mode: 'rgb', r: 0, g: 0, b: 0, alpha: 0}))` is opaque.
'''

