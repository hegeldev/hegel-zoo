`rgb({mode: 'okhsl', h: 30, s: 0.5, l: 0})` is `{r: NaN, g: NaN, b: NaN}` and `oklab` of it is `{l: 0, a: NaN, b: NaN}`; `rgb({mode: 'okhsv', h: 30, s: 0.5, v: 0})` is black, and Ottosson's reference `okhsl_to_srgb` returns black for `l == 0` just as it returns white for `l == 1` (which src/okhsl/convertOkhslToOklab.js does special-case). For `l = 0` the code computes the chroma bounds `get_Cs(0, ...)`, which divides by `min(L, 1 - L) = 0`. The NaN spreads: `interpolate([...], 'okhsl')` with such a stop, `average`, `toGamut` and `formatHex` (which clamps NaN to 0 quietly) all produce wrong colours, and `displayable` is false. The same happens for an undefined `l`.
'''

[[bug]]
id = "culori/16"
title = "the cubehelix hue is documented in [0, 360) but comes out negative (red: -8.19, blue: -123.06)"
kind = "contract"
severity = "low"
test = "TestHegelPinCubehelixHueIsNormalised"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The Color Spaces page lists the cubehelix hue with the range `[0, 360)` and says the channels "maintain the conventions from D3". `cubehelix('red').h` is `-8.1897`, `cubehelix('blue').h` is `-123.06` and `cubehelix('#123456').h` is `-153.8`. src/cubehelix/convertRgbToCubehelix.js computes `atan2(...) * radToDeg - 120` without normalising; every other cylindrical converter goes through `normalizeHue`, and D3's `cubehelix()` adds 360 when the hue is negative. `random('cubehelix')` draws hues from `[0, 360]`, so a colour converted to cubehelix and a random one are not comparable, and `formatCss` writes `color(--cubehelix -8.1897 ...)`.
'''

