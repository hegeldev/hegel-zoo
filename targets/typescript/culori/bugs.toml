[[bug]]
id = "culori/18"
title = "colour-stop positions are not fixed up in the CSS Images 4 order: a stop positioned before an earlier one, after implicit stops, is left where it is"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinColorStopPositionsAreFixedUpInSpecOrder"
found = { commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a", version = "4.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The API reference says implicit positions follow "the rules from the spec" (CSS Images Module Level 4, colour stop fixup), and src/util/normalizePositions.js describes the three rules including "no position can be smaller than any of the ones preceding it". For `[['red', 0.5], 'lime', ['blue', 0.2], 'black']` the specification first moves blue's 0.2 up to 0.5 and then places lime evenly between 0.5 and 0.5, giving positions `[0.5, 0.5, 0.5, 1]`; culori gives `[0.5, 0.35, 0.2, 1]`, a decreasing sequence, because the implicit position is filled from the smaller later value first and the loop then skips the monotonicity check for that stop. `interpolate([['red', 0.5], 'lime', ['blue', 0.2], 'black'])(0.6)` is `#000080` (blue to black over 0.2..1) where the specification gives `#0000cc`. When the misplaced stop is not preceded by implicit ones, the fixup is right.
'''

