name = "culori"
language = "typescript"
upstream = "https://github.com/Evercoder/culori"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, CONTRIBUTING.md, docs/, no .github/: nothing about AI

[base]
commit = "435a1fc2ca4f7bc6bfd977af872e6d409bc7a25a"
date = "2026-07-02"
version = "4.0.2"

[hegel]
version = "0.4.5"

[run]
# Plain ESM run from src/ with no runtime dependencies and no build. Hegel and the second
# implementation used as an oracle (colorjs.io) go under .hegel/ in one install so the package's
# own lock file stays untouched.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 colorjs.io@0.7.1",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinParseReturnsUndefinedForMalformedNumbers = "culori/1"
TestHegelPinParseIsCaseInsensitive = "culori/2"
TestHegelPinParseIgnoresSurroundingWhitespace = "culori/3"
TestHegelPinHslSaturationClampsAlikeInBothSyntaxes = "culori/4"
TestHegelPinNearestCanReturnEveryColor = "culori/5"
TestHegelPinRgbToHslFollowsCssColor4OutsideTheGamut = "culori/6"
TestHegelPinInterpolationHintOfZeroIsHonoured = "culori/7"
TestHegelPinRemoveParserRemovesTheFirstParser = "culori/8"
TestHegelPinDeficiencySeverityIsContinuous = "culori/9"
TestHegelPinNaturalSplinePassesThroughThreeValues = "culori/10"
TestHegelPinClosedNaturalSplinePassesThroughItsValues = "culori/11"
TestHegelPinPremultipliedInterpolationStartsAtTheFirstColor = "culori/12"
TestHegelPinSplineOverrideLeavesAlphaUndefined = "culori/13"
TestHegelPinLuvBlackKeepsAlpha = "culori/14"
TestHegelPinOkhslBlackConverts = "culori/15"
TestHegelPinCubehelixHueIsNormalised = "culori/16"
TestHegelPinBlendLeavesItsInputsAlone = "culori/17"
TestHegelPinColorStopPositionsAreFixedUpInSpecOrder = "culori/18"
TestHegelPinJzazbzInvertsItself = "culori/19"
TestHegelPinToGamutIntoHslGivesBlackAndWhite = "culori/20"
