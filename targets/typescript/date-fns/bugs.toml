# Bugs found in date-fns/date-fns (pkgs/core) by the Hegel tests in hegel.patch. The reference is
# the Gregorian calendar with the process time zone's rules (ECMAScript's local Date), ISO 8601 and
# the Unicode tokens format/parse document. Reproduce a bug with its pin, from pkgs/core:
# `node --test --test-name-pattern=<test> hegel/hegel.test.mjs`.

[[bug]]
id = "date-fns/1"
title = "formatISO, formatISO9075 and format write years outside 0000-9999 that parseISO and parse cannot read back"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinIsoYearsBeyondFourDigitsRoundTrip"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`formatISO` pads the year to four digits (`addLeadingZeros(year, 4)`), so year 12345 becomes
`12345-06-09T...` and year -5 becomes `-0005-06-09T...`; ISO 8601 writes such years in the
expanded form with a sign and an agreed number of digits (`+012345`), which is the only form
`parseISO` accepts (`additionalDigits`, default 2: `[+-]\\d{6}`), so `parseISO(formatISO(d))` is
Invalid Date for every year outside 0000-9999. `format(d, "yyyy")` likewise writes five digits
and `parse` reads at most four for `yyyy` (`parseNDigits(4)`), so `parse(format(d, f), f)` fails
for the same years; `yyyyy`/`uuuuu` read five. The pin round-trips year 12345 and -5 through
formatISO and 12345 through `yyyy-MM-dd`.
'''

[[bug]]
id = "date-fns/2"
title = "parseISO accepts ISO week 53 in a 52-week year (and parse accepts it for RRRR II), giving a date in the next year"
kind = "contract"
severity = "low"
test = "TestHegelPinIsoWeek53IsRejectedInA52WeekYear"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`validateWeekDate` only checks `week >= 1 && week <= 53` and `dayOfISOWeekYear` rolls over, so
`parseISO("2021-W53-1")` is 2022-01-03 although 2021 has 52 ISO weeks (2020 has 53), while day
366 of a non-leap year is rejected (`validateDayOfYear` uses the year's length). `parse("2021 53",
"RRRR II")` does the same. The pin asks for Invalid Date from both.
'''

[[bug]]
id = "date-fns/3"
title = "parseISO accepts UTC offsets with hours above 23 (+24:00, +99:00)"
kind = "contract"
severity = "low"
test = "TestHegelPinIsoOffsetHoursAreBounded"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`validateTimezone(_hours, minutes)` checks only `minutes >= 0 && minutes <= 59`, so
`2021-06-09T10:18:14+99:00` parses (to 2021-06-05T11:18:14Z). ISO 8601 offsets have an hour
of at most 23 (in practice 14). The pin asks for Invalid Date from `+24:00` and `+99:00`.
'''

[[bug]]
id = "date-fns/4"
title = "parseISO accepts strings outside the ISO 8601 grammar: text after Z or the offset, an empty fraction, an empty time, a time after a reduced date, a fraction on hour 24"
kind = "contract"
severity = "low"
test = "TestHegelPinIsoStringsWithTrailingTextAreRejected"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`splitDateString` takes everything after the time as the time zone and `parseTimezone` returns
0 when the zone string does not match its regex, so `2021-06-09T10:18:14ZZ`, `...14Z+05:30`
and `...14+05:30junk` all parse as UTC (the last one silently dropping the offset). The time regex
makes the fraction digits optional after the point (`2021-06-09T14.Z`), an empty time string
(`2021-06-09T`) gives 0, a time is accepted after a month-only date (`2021-06T10:00Z`; ISO 8601
requires a complete date before a time), and `validateTime` allows hour 24 with a fraction
(`T24.5Z` is 00:30 of the next day). The pin asks for Invalid Date from `...14ZZ`, `...14Z+05:30`,
`...14.Z` and `2021-06-09T`; the property gates the other shapes under this id.
'''

[[bug]]
id = "date-fns/5"
title = "differenceInYears counts no full year from 29 February to the following 28 February although addYears lands there, and intervalToDuration then gives months: 12"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinYearsFromALeapDayAgreeWithAddYears"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`addYears(2020-02-29, 1)` is 2021-02-28 (the day is clamped), but `differenceInYears(2021-02-28,
2020-02-29)` is 0: both dates are moved to 1584 (a leap year) and compared, where 28 February
is before 29 February, so the last year is deemed partial. `intervalToDuration({ start:
2020-02-29, end: 2021-02-28 })` therefore reports `{ months: 12 }` (differenceInMonths does count
12), a duration that is not normalized. The pin checks the three together.
'''

[[bug]]
id = "date-fns/6"
title = "differenceInMonths counts a full month when the later date is the last day of its month even if its time of day is earlier"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMonthsOnAMonthEndRespectTheTimeOfDay"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`differenceInMonths` has a special case for a later date that is the last day of its month
(`isLastDayOfMonth(laterDate)` with `setDate(30)`) which compares dates only, so
`differenceInMonths(2021-02-28T12:00, 2021-01-31T13:00)` is 1 although `addMonths(2021-01-31T13:00,
1)` is 2021-02-28T13:00, an hour after the later date: less than a full month has elapsed. The
model counts full months as the largest n with `addMonths(earlier, n) <= later`.
'''

[[bug]]
id = "date-fns/7"
title = "isExists is false for every date in years 0-99"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIsExistsHandlesTwoDigitYears"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`isExists(year, month, day)` builds `new Date(year, month, day)` and compares `getFullYear()`
with `year`; the Date constructor maps years 0-99 to 1900-1999, so `isExists(50, 0, 1)` is false
and `isExists(0, 1, 29)` (year 0 is a leap year) is false. Everything else in date-fns handles
these years through `setFullYear`.
'''

[[bug]]
id = "date-fns/8"
title = "differenceInBusinessDays is not antisymmetric when an endpoint is a weekend day, and does not invert addBusinessDays"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinBusinessDayDifferencesAreAntisymmetric"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`differenceInBusinessDays(Mon 14 Jun 2021, Sat 12 Jun 2021)` is 0 while `differenceInBusinessDays(Sat
12, Mon 14)` is -1, and `addBusinessDays(Sat 12, 1)` is Mon 14 although the difference back is
0. The function counts whole weeks as 5 and then walks day by day from the earlier date toward
the later one, adding one for each weekday it starts a step from: the range is half-open on the
side it walks toward, so it includes the earlier endpoint in one direction and the later one in
the other, and the two counts differ whenever exactly one endpoint is a weekend day. The
property counts the weekdays in [earlier, later) and gates weekend endpoints under this id.
'''

[[bug]]
id = "date-fns/9"
title = "formatRFC3339 and formatRFC7231 write years below 1000 without padding to four digits, and parseISO cannot read the RFC 3339 output back"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRfcFormatsPadTheYearToFourDigits"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`formatRFC3339` uses `date.getFullYear()` unpadded where every other field goes through
`addLeadingZeros`, so year 8 gives `8-01-01T00:00:00Z` and year 999 `999-01-01T00:00:00Z`; RFC 3339
defines `date-fullyear = 4DIGIT` and `parseISO` rejects both strings. `formatRFC7231` writes
`Tue, 01 Jan 8 00:00:00 GMT` where RFC 7231 has `year = 4DIGIT` (`Date#toUTCString` writes
`0008`). `formatISO` and `formatISO9075` pad correctly.
'''

[[bug]]
id = "date-fns/10"
title = "lastDayOfWeek, eachMonthOfInterval and eachYearOfInterval return 01:00 instead of midnight when the input day starts after midnight (DST at 00:00)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLastDayOfWeekIsMidnightWhenTheInputDayHasNone"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
These three call `setHours(0, 0, 0, 0)` before moving the date (`setDate`/`setMonth`), where
`startOfWeek`, `endOfWeek`, `startOfMonth`, `lastDayOfMonth` and the others move first and zero
the time last. In zones whose DST starts at midnight (America/Havana, America/Santiago, Asia/Beirut,
...), the transition day has no 00:00: `setHours(0)` on it gives 01:00, and the later `setDate`
keeps that time, so in Havana `lastDayOfWeek(Sun 14 Mar 2021 12:00, { weekStartsOn: 0 })` is Sat
20 Mar 01:00 and `eachMonthOfInterval({ start: 14 Mar 2021 12:00, end })` starts at 1 Mar 01:00
(both days have an ordinary midnight). `eachDayOfInterval` re-zeroes the time after each step
and is right.
'''

[[bug]]
id = "date-fns/11"
title = "eachHourOfInterval skips the repeated hour after a DST fall-back"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEachHourOfIntervalCoversTheRepeatedHour"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The loop steps with `date.setHours(date.getHours() + step)`, i.e. by wall clock: from 01:00 EDT
on 7 Nov 2021 in America/New_York it sets hour 2, which the Date resolves to 02:00 EST, skipping
01:00 EST (06:00Z). Six hours from 03:00Z to 09:00Z give six instants instead of seven, and
`differenceInHours` over the same interval is 6 while `eachMinuteOfInterval` (which adds
milliseconds) covers 125 minutes for the two-hour span. The property enumerates the instants at
which the local clock reads a whole hour and gates intervals containing a fall-back under this
id.
'''

[[bug]]
id = "date-fns/12"
title = "startOfHour, startOfMinute, startOfSecond, endOfHour, endOfDay and the setters leave the input's unit at a DST transition: an hour earlier in the repeated hour, after the input where a gap swallows the start of the hour"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStartAndEndOfUnitsStayWithinTheUnit"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
All of these go through the Date setters (`setMilliseconds(0)`, `setMinutes(0, 0, 0)`,
`setHours(23, 59, 59, 999)`), which re-resolve the wall clock and pick the first of two
occurrences. For d = 01:00:00 EST on 7 Nov 2021 in America/New_York (the second 01:00 of the
day, 06:00Z), `startOfSecond(d)`, `startOfMinute(d)`, `startOfHour(d)`, `setMilliseconds(d, 0)`
and `setSeconds(d, 0)` are all 05:00Z, an hour earlier; `endOfHour(d)` and `endOfMinute(d)` are
before d. In America/Santiago on 11 Mar 1995 (fall-back at midnight) `endOfDay(23:00 -04:00)`
and `endOfWeek` are 02:59:59.999Z, an hour before the input. Where a gap swallows the start of
an hour (Pacific/Chatham, 1 Oct 1995: 02:45 -> 03:45), `startOfHour(03:45)` is 04:00, after the
input, and `isSameHour(03:45, 04:54)` is true. The property compares with the instant at which
the unit starts or ends by the local clock and gates these two shapes under this id.
'''

[[bug]]
id = "date-fns/13"
title = "differenceInYears is -1 for a two-minute interval across a DST fall-back, and intervalToDuration gives years: -1 for it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinYearsBetweenTwoMinutesApartIsZero"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`differenceInYears` decides whether the last year is partial by moving both dates to 1584 and
comparing them, which compares wall clocks under one offset. In America/New_York on 27 Oct 1996,
a = 01:00:01 EST (06:00:01Z) is two minutes after b = 01:57:49 EDT (05:57:49Z), `compareAsc(a, b)`
is 1 and `differenceInCalendarYears` 0, but the 1584 copies compare as a < b, so the result is
`1 * (0 - 1) = -1`. `intervalToDuration({ start: b, end: a })` then gives `{ years: -1, months:
11, days: 29, hours: 24, minutes: 2, seconds: 12 }` for a 2-minute interval. The same happens for
any pair within the repeated hour whose wall-clock order is the reverse of their order in time
(Africa/Casablanca's Ramadan fall-back too). The property gates pairs with different offsets.
'''

[[bug]]
id = "date-fns/14"
title = "parseJSON maps years 0000-0099 to 1900-1999"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinParseJsonKeepsYearsBelow100"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parseJSON` builds the result with `new Date(Date.UTC(+year, +month - 1, ...))`, and `Date.UTC`
treats a year 0-99 as 1900-1999, so `parseJSON("0004-10-18T01:07:00.000Z")` is 1904-10-18 while
`parseISO`, `toDate` and `new Date(string)` all give year 4. Years 100-9999 are right.
'''

[[bug]]
id = "date-fns/15"
title = "parse resolves a time on a DST-gap day an hour late when the first minute of its hour is skipped, even with an explicit offset"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinParseKeepsTheHourAfterADstGap"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse` applies its setters one field at a time on a local Date: hours first (`setHours(h)`,
leaving minutes 0), then minutes, seconds, then the offset. Where DST skips a stretch that
crosses an hour boundary at a non-zero minute, the intermediate h:00 does not exist and the
Date resolves it to the next hour, which the later setters keep. In Pacific/Chatham on 1 Oct
1995 (02:45 -> 03:45) `parse("1995-10-01 03:45:00", "yyyy-MM-dd HH:mm:ss")` is 04:45 although
03:45 is exactly when the clocks land, and `parse("1995-10-01 03:45:00 +13:45", "... xxx")` is
15:00Z instead of 14:00Z: the offset token fixes the instant, yet the result is an hour off
because the zone correction (`getTimezoneOffsetInMilliseconds`) is computed from the drifted
local date. America/St_Johns had 00:01 transitions until 2011 with the same effect on 01:xx.
`parseISO` handles both (it builds the instant from the fields at once).
'''

[[bug]]
id = "date-fns/16"
title = "parseISO is a millisecond off for some fractions: 01.023 gives .022 and fractions of dates before 1970 round up"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinParseIsoKeepsTheMilliseconds"
found = { commit = "18cbd436f1428d0f45f89f710df65f62546c42f0", version = "4.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parseTime` computes `seconds * 1000` with `seconds = parseFloat("01.023")`, i.e. 1022.9999999999999,
and `new Date(timestamp + time)` truncates toward zero: `parseISO("1970-01-01T00:00:01.023Z")` is
.022 (`new Date(string)` gives .023). For instants before 1970 the sum is negative and truncation
toward zero rounds the fraction up: `1969-12-31T23:59:59.1234Z` gives .124. The property allows
a 1 ms difference under this id when the string has a fraction.
'''
