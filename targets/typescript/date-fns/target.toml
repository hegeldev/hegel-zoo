name = "date-fns"
language = "typescript"
upstream = "https://github.com/date-fns/date-fns"
subdir = "pkgs/core"
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, CONTRIBUTING, AGENTS.md (agent instructions for the monorepo, no restrictions), .github/ (workflows, issue templates): no AI policy

[base]
commit = "18cbd436f1428d0f45f89f710df65f62546c42f0"
date = "2026-08-30"
version = "4.4.0"

[hegel]
version = "0.4.5"

[run]
# Node 22 runs the TypeScript sources directly (`../src/index.ts`), so nothing is built: the setup
# only installs Hegel under .hegel/ (the package's own node_modules and lock file stay untouched).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --ignore-scripts --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinIsoYearsBeyondFourDigitsRoundTrip = "date-fns/1"
TestHegelPinIsoWeek53IsRejectedInA52WeekYear = "date-fns/2"
TestHegelPinIsoOffsetHoursAreBounded = "date-fns/3"
TestHegelPinIsoStringsWithTrailingTextAreRejected = "date-fns/4"
TestHegelPinYearsFromALeapDayAgreeWithAddYears = "date-fns/5"
TestHegelPinMonthsOnAMonthEndRespectTheTimeOfDay = "date-fns/6"
TestHegelPinIsExistsHandlesTwoDigitYears = "date-fns/7"
TestHegelPinBusinessDayDifferencesAreAntisymmetric = "date-fns/8"
TestHegelPinRfcFormatsPadTheYearToFourDigits = "date-fns/9"
TestHegelPinLastDayOfWeekIsMidnightWhenTheInputDayHasNone = "date-fns/10"
TestHegelPinEachHourOfIntervalCoversTheRepeatedHour = "date-fns/11"
TestHegelPinStartAndEndOfUnitsStayWithinTheUnit = "date-fns/12"
TestHegelPinYearsBetweenTwoMinutesApartIsZero = "date-fns/13"
TestHegelPinParseJsonKeepsYearsBelow100 = "date-fns/14"
TestHegelPinParseKeepsTheHourAfterADstGap = "date-fns/15"
TestHegelPinParseIsoKeepsTheMilliseconds = "date-fns/16"
