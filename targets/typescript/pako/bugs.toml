# Bugs found in pako (nodeca/pako) by the Hegel zoo. ids are pako/N; see README.md for the
# properties. The oracle is Node's bundled zlib (Chromium's fork, which pako's default hash
# matches byte for byte).

[[bug]]
id = "pako/1"
title = "chunkSize: 0 makes inflate loop forever and deflate exhaust the heap instead of being rejected"
kind = "hang"
severity = "medium"
test = "TestHegelPinChunkSizeZeroIsRejected"
found = { commit = "32be8f8e0ead1e6e8a74a1586a34f84734382d01", version = "3.0.2 (2026-09-12)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
Neither wrapper validates `chunkSize`. With `chunkSize: 0`, `Inflate.push` allocates a zero-length output buffer, `zlibInflate` makes no progress, `last_avail_out === 0` sends the loop round again, forever; `Deflate.push` does the same but keeps the empty chunks, so the process dies with "JavaScript heap out of memory". A fractional `chunkSize` (1.5, 0.5) hangs `inflate` the same way (`deflate` happens to throw a RangeError from a typed-array offset), and a negative one throws "Invalid typed array length" from deep inside. The constructor throws for every other bad option (`level: 42`, `windowBits: 7`); `chunkSize` should get the same treatment.
'''

[[bug]]
id = "pako/2"
title = "an empty gzip extra field sets FEXTRA without writing its length, so nothing can read the stream"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmptyExtraFieldWritesItsLength"
found = { commit = "32be8f8e0ead1e6e8a74a1586a34f84734382d01", version = "3.0.2 (2026-09-12)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
In the header writer the flags byte uses `!s.gzhead.extra ? 0 : 4` (an empty Uint8Array is truthy, so FEXTRA is set) but the two XLEN bytes are only written under `if (s.gzhead.extra && s.gzhead.extra.length)`. With `extra = new Uint8Array(0)` the reader takes the first two bytes of the deflate data as XLEN: Node's gunzip fails with "unexpected end of file" and pako's own Inflate with "buffer error", reporting a 51437-byte extra field. zlib writes XLEN = 0 for an empty extra (`extra != Z_NULL`), which is a valid header.
'''

[[bug]]
id = "pako/3"
title = "a gzip header name or comment with a character outside Latin-1 is silently truncated or mangled"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHeaderNameBeyondLatin1IsNotTruncated"
found = { commit = "32be8f8e0ead1e6e8a74a1586a34f84734382d01", version = "3.0.2 (2026-09-12)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The writer emits `name.charCodeAt(i) & 0xff` until that value is 0. A character whose code unit has a zero low byte — U+4E00 一, U+0100 Ā, U+2000 — becomes the terminating NUL, so `name: 'a一b'` is written as `a` and `b` is dropped; any other character above U+00FF is written as an unrelated byte (😀 → 0x3d 0x00 → `=`). The header is well-formed, so the loss is invisible to readers. RFC 1952 says the name is ISO 8859-1; a character that cannot be represented should be rejected (or the field encoded), not cut short.
'''

[[bug]]
id = "pako/4"
title = "a sync or full flush with chunkSize below 7 loops forever"
kind = "hang"
severity = "medium"
test = "TestHegelPinSyncFlushWithASmallChunkSizeReturns"
found = { commit = "32be8f8e0ead1e6e8a74a1586a34f84734382d01", version = "3.0.2 (2026-09-12)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`Deflate.push` guards a Z_SYNC_FLUSH / Z_FULL_FLUSH with "make sure avail_out > 6 to avoid repeating markers": when `avail_out <= 6` it emits what is in the buffer, sets `avail_out = 0` and continues, which allocates a fresh buffer of `chunkSize` bytes — again at most 6 — and trips the guard again. `new Deflate({ chunkSize: 6 }).push(data, Z_SYNC_FLUSH)` never returns and the process dies of heap exhaustion; `chunkSize: 1` does the same for Z_PARTIAL_FLUSH. The existing test covers `chunkSize: 7`, the smallest value that works. Found by the flush-point property, which first killed the whole test process.
'''
