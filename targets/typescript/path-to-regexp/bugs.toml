# Bugs found in path-to-regexp by the Hegel tests in hegel.patch.

[[bug]]
id = "path-to-regexp/1"
title = "An array of more than 256 plain paths is rejected as Too many path combinations"
kind = "contract"
severity = "low"
test = "TestHegelArraysAndGroupsAreAlternatives"
found = { commit = "8877f41873e37a30258d3935feaf1d2679321735", version = "8.4.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`match(["/page0", ..., "/page256"])` (257 paths without a single group) throws
`PathError: Too many path combinations: /page256`; 256 paths are accepted. The limit in
`pathToRegexp` guards the expansion of optional groups (`{...}`, 2^n alternatives), but the
counter `combinations` is shared across every path of an array, so plain paths count against
it too. `match` and `pathToRegexp` document arrays of paths without a limit; Express 5 passes
route arrays straight through. Pin: `TestHegelPinArraysOfPlainPathsHaveNoCombinationLimit`.
'''

[[bug]]
id = "path-to-regexp/2"
title = "The index in a parse error counts code points, not positions in the string"
kind = "contract"
severity = "low"
test = "TestHegelParseAgreesWithTheModel"
found = { commit = "8877f41873e37a30258d3935feaf1d2679321735", version = "8.4.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse("\u{1D6FC}/(")` throws `Unexpected ( at index 2`, but `"\u{1D6FC}/(".indexOf("(")`
is 3: the parser iterates `[...str]` (code points) and reports its position in that array,
so every astral character before the error shifts the reported index by one from the string
position a caller would use to point at it (`Unexpected end at index 2` for the 3-character
string `\u{1D6FC}{`). Pin: `TestHegelPinParseErrorIndexIsAStringIndex`.
'''

[[bug]]
id = "path-to-regexp/3"
title = "compile reads parameters named after Object.prototype members from the prototype"
kind = "contract"
severity = "low"
test = "TestHegelCompileFollowsTheModel"
found = { commit = "8877f41873e37a30258d3935feaf1d2679321735", version = "8.4.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`compile("/:constructor")({})` throws `Expected "constructor" to be a non-empty string`
instead of `Missing parameters: constructor`, and `compile("/x{/:toString}")({})` throws
instead of omitting the optional group and returning `/x`: `tokenToFunction` reads
`data[token.name]` without an own-property check, so a plain params object supplies
`Object.prototype.constructor`, `toString`, `valueOf`, `hasOwnProperty` and `__proto__` as
values. The same names work in `match`, whose params object has a null prototype, so a
`match` result round-trips through `compile` but a hand-built object does not. Pin:
`TestHegelPinCompileReadsOwnParametersOnly`.
'''

[[bug]]
id = "path-to-regexp/4"
title = "stringify does not quote a parameter name when an empty text token precedes text that would extend it"
kind = "roundtrip"
severity = "low"
test = "TestHegelStringifyParseRoundTrip"
found = { commit = "8877f41873e37a30258d3935feaf1d2679321735", version = "8.4.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify({ tokens: [param foo, text "", text "bar"] })` is `:foobar`, which parses as one
parameter `foobar`: `stringifyName` decides whether to quote by looking at the next token
only, and an empty text token (which `match` and `compile` treat as nothing) hides the `bar`
that the parser will absorb into the name. The correct output is `:"foo"bar`. Only custom
token data is affected (`parse` never produces empty text tokens); the Readme documents
custom token arrays as a supported input. Pin: `TestHegelPinStringifyQuotesNamesBeforeEmptyText`.
'''
