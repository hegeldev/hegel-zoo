name = "path-to-regexp"
language = "typescript"
upstream = "https://github.com/pillarjs/path-to-regexp"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # Readme, History, .github/ (workflows only), no CONTRIBUTING: no AI policy

[base]
commit = "8877f41873e37a30258d3935feaf1d2679321735"
date = "2026-08-28"
version = "8.4.2"

[hegel]
version = "0.4.5"

[run]
# The library is a single TypeScript file with no dependencies; it is compiled to dist/ with a
# TypeScript installed under .hegel/ (upstream's build goes through @borderless/ts-scripts).
# recheck (the ReDoS checker upstream uses in its own tests) is installed there too. Nothing
# else is needed.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 typescript@5 recheck@4.5.0",
  ".hegel/node_modules/.bin/tsc src/index.ts --outDir dist --target ES2022 --module commonjs --strict --skipLibCheck",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinArraysOfPlainPathsHaveNoCombinationLimit = "path-to-regexp/1"
TestHegelPinParseErrorIndexIsAStringIndex = "path-to-regexp/2"
TestHegelPinCompileReadsOwnParametersOnly = "path-to-regexp/3"
TestHegelPinStringifyQuotesNamesBeforeEmptyText = "path-to-regexp/4"
