# Bugs found in mutative by the Hegel properties in hegel.patch. Each has a pin
# (TestHegelPin...) in hegel/hegel.test.mjs, listed in target.toml's [expected_failures].

[[bug]]
id = "mutative/1"
title = "A Set draft moved to another key finalizes to its unmodified value: reverse, unshift, sort or reassign-and-delete on an array or object holding a Set loses every add and delete made through the draft"
severity = "high"
kind = "wrong-result"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelCreateMatchesTheModelAndImmer"
pin = "TestHegelPinMovedSetDraftKeepsItsChanges"
notes = """
`create([new Set([1]), 2], d => { d.reverse(); d[1].add(3); })` is `[2, Set{1}]` (immer: `[2, Set{1, 3}]`);
`create({ a: new Set([1]) }, d => { d.b = d.a; delete d.a; d.b.add(3); })` is `{ b: Set{1} }`; the order of
the move and the mutation does not matter, and `d.c.delete("b"); d.c = [d.c]` (the Set draft wrapped into
a new array that replaces it) loses the delete too. Maps, arrays and objects moved the same way keep their
changes. A Set draft records its changes in `setMap` and rebuilds its `copy` only in `finalizeSetValue`,
which runs from the finalizer registered for the draft's original key; when that key no longer holds the
draft, only the assignment callback of `markFinalization` runs, and it takes `proxyDraft.copy` (or the
original) without rebuilding it from `setMap` (src/utils/finalize.ts).
"""

[[bug]]
id = "mutative/2"
title = "A Set draft iterates the -0 it was given where a Set holds +0"
severity = "low"
kind = "contract"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelReadsThroughTheDraftMatchTheModel"
pin = "TestHegelPinSetDraftIteratesZeroForNegativeZero"
notes = """
`create(new Set([1]), d => { d.add(-0); [...d] })` iterates `-0` while the finished state (a real Set,
and immer's draft) holds `+0`: a Set normalises -0 to +0 on insertion (SameValueZero), the draft's
`setMap` is a Map whose *values* keep the -0. `has(0)` and `has(-0)` are both true, so only the iterated
value is off.
"""

[[bug]]
id = "mutative/3"
title = "Assigning the base's own child object back to its key after modifying the child's draft emits a remove patch (and an add inverse) for an unchanged property"
severity = "medium"
kind = "wrong-result"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelPatchesReplayAndInvert"
pin = "TestHegelPinAssigningTheOriginalChildBackEmitsNoRemovePatch"
notes = """
`create({ a: { b: 1 } }, d => { d.a.b = 2; d.a = base.a; }, { enablePatches: true })` gives the state
`{ a: { b: 1 } }` (right) with patches `[{ op: "remove", path: ["a"] }]` and inverse
`[{ op: "add", path: ["a"], value: { b: 1 } }]`, so `apply(base, patches)` is `{}`. immer emits no patch.
The set trap's `currentProxyDraft && isEqual(currentProxyDraft.original, value)` branch marks the key in
`assignedMap` as `false`, which `generatePatchesFromAssigned` reads as a removal (src/draft.ts,
src/patch.ts). Array indexes and Map keys assigned back the same way emit nothing. Also reachable
without modifying the child: reading `d.a` (which drafts it) and then assigning `base.a` while another
property changes.
"""

[[bug]]
id = "mutative/4"
title = "Assigning undefined to a property deleted earlier in the same draft, or to an array index vacated by pop, shift or a shorter length, is ignored when the key existed in the base"
severity = "low"
kind = "wrong-result"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelCreateMatchesTheModelAndImmer"
pin = "TestHegelPinUndefinedAssignedAfterDeleteIsKept"
notes = """
`create({ a: 1 }, d => { delete d.a; d.a = undefined; })` is `{}` (immer 10.2: `{ a: undefined }`, plain
JavaScript likewise); `create([1], d => { d.pop(); d[0] = undefined; })` is `[]` (immer and JavaScript:
`[undefined]`). The set trap returns early when the assigned value equals the current value and either
is not undefined or `has(target.original, key)` (src/draft.ts): the key's presence in the *base* stands in
for its presence in the draft's copy, from which it has been deleted. `push(undefined)` after a pop is
fine because the following `length` write restores the slot. The undefined need not be written by hand:
`create([undefined, 5], d => { d.pop(); d.unshift(true); })` is `[true, <hole>]` (`Object.keys` is
`["0"]`) because unshift moves the base's own undefined into the vacated slot 1.
"""

[[bug]]
id = "mutative/5"
title = "Iterating a Set draft a second time yields null for an array element drafted by the first iteration; forEach, values, keys and entries all do, and current() shows the null"
severity = "high"
kind = "crash"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelCreateMatchesTheModelAndImmer"
pin = "TestHegelPinSetDraftYieldsItsArrayElementOnEveryIteration"
notes = """
`create(new Set([[1]]), d => { [...d][0].push(2); [...d][0].push(3); })` throws
`Cannot read properties of null (reading 'push')`: the first spread drafts the array element, the second
yields `null` for it (`[...d][0] === null`, with or without a modification in between); object, Map and
Set elements are handed out once and stay identical. `current(draft)` of a tree holding such a Set renders
the element as `null` too. The Set iterator (src/set.ts `getNextIterator`) returns
`currentDraft.proxy` for an already drafted element, and for an array draft that field is `null`:
`createDraft` proxies `Object.assign([], proxyDraft)` (src/draft.ts) - a copy of the record taken before
`proxyDraft.proxy = proxy` is set - so the target the trap sees never learns its proxy. immer yields the
same draft on every pass.
"""

[[bug]]
id = "mutative/6"
title = "apply cannot replay the root replace patch that create emits when the draft function returns a Date or another non-draftable object"
severity = "low"
kind = "crash"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelReturnValuesFollowTheRules"
pin = "TestHegelPinApplyReplaysARootReplaceToADate"
notes = """
`create({ a: 1 }, () => new Date(5), { enablePatches: true })` returns the Date with the patches
`[{ op: "replace", path: [], value: Date }]`; `apply({ a: 1 }, patches)` throws `Invalid base state:
create() only supports plain objects, arrays, Set, Map ...`. `apply` takes the root replacement as the new
state and then always calls `create(state, mutate)` even when no patches remain (src/apply.ts); a
primitive or null root passes because the draftability check only fires for objects. immer's
`applyPatches` has the same gap.
"""

[[bug]]
id = "mutative/7"
title = "Returning an untouched child draft after mutating the root or a sibling is accepted and silently drops the mutation, while a modified child or a wrapped child in the same position throws"
severity = "low"
kind = "contract"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelReturnValuesFollowTheRules"
pin = "TestHegelPinReturningAChildDraftAfterMutatingTheRootThrows"
notes = """
`create({ x: { c: 0 }, y: 1 }, d => { d.y = 2; return d.x; })` is `{ c: 0 }`: the write to `y` is lost
without a word. immer throws `An immer producer returned a new value *and* modified its draft`, and so
does mutative for `return { k: d.x }` (`Either the value is returned as a new non-draft value, or only
the draft is modified ...`) and for a *modified* child (`Cannot return a modified child draft`). The
returned-draft branch of `makeCreator` only checks the returned draft's own `operated` flag
(src/makeCreator.ts).
"""

[[bug]]
id = "mutative/8"
title = "current() throws a TypeError when a Set added during the draft holds a draft or a NaN, directly or inside a plain object or array"
severity = "medium"
kind = "crash"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelCurrentAndOriginalDuringTheDraft"
pin = "TestHegelPinCurrentWorksWithAPlainSetHoldingADraft"
notes = """
`create({ a: { b: 1 } }, d => { d.s = new Set(); d.s.add(d.a); current(d); })` throws
`Cannot read properties of undefined (reading 'setMap')`; the same with `d.s.add({ inner: d.a })`, with
`d.s = new Set([d.a])`, and with no draft at all: `d.s = new Set([NaN])`, `new Set([{ x: NaN }])` or
`new Set([[NaN]])`. The finished state is right, and a plain Map, array or object holding the same
values works. `getCurrent` (src/current.ts) copies a Set as `Array.from(proxyDraft.setMap.values())`,
which presumes the Set is a draft; for a plain Set inside the tree `proxyDraft` is undefined, and the
copy is demanded whenever an element "changes" under `current` - a draft element does, and so does a
NaN, which the `newValue !== value` test always takes for a change.
"""

[[bug]]
id = "mutative/9"
title = "Patches for a Set whose element was modified and another element added or removed describe the element twice (by index path and as remove plus add): the inverse fails to apply and a replay on a copy of the base duplicates the element"
severity = "medium"
kind = "wrong-result"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelPatchesReplayAndInvert"
pin = "TestHegelPinSetElementChangePatchesInvertBesideARemoval"
notes = """
`create(new Set([{ a: 1 }, 7]), d => { [...d][0].a = 2; d.delete(7); }, { enablePatches: true })` gives
patches `[replace [0,"a"] 2, remove [0] {a:1}, add [0] {a:2}, remove [1] 7]` and an inverse whose last
step `replace [0,"a"] 1` fails with `Cannot apply patch at '0/a'` after the element was removed and
re-added at the end of the Set. With an add instead of the delete, `apply(new Set([{ a: 1 }]), patches)`
on a fresh copy of the base is `Set{{a:2}, {a:2}, 5}`: the by-path replace modifies the element in place,
the remove by identity (`base.delete(patch.value)`) misses it, the add appends a second copy. A modified
element alone produces only the path patch; `generateSetPatches` (src/patch.ts) compares the original
Set with the finalized copy by identity, and a modified element's finalized object is a new one, so as
soon as the Set itself has a patch to emit the element counts as removed and added. immer emits only the
remove/add pair.
"""

[[bug]]
id = "mutative/10"
title = "An array whose element draft was modified, then moved by its parent's unshift and modified again, emits its element patches under its old index beside the whole-value replace: the inverse patches do not apply"
severity = "medium"
kind = "wrong-result"
status = "open"
found = { commit = "63774685779c5deab712077d173cb3590350ca41", version = "1.3.0", hegel = "0.4.5", date = "2026-09-19" }
property = "TestHegelPatchesReplayAndInvert"
pin = "TestHegelPinMovedArrayPatchesUseItsNewIndex"
notes = """
`create([[new Map([["k", 1]]), 7], true], d => { d[0][0].clear(); d.unshift(1.5); d[1].unshift(new Set([-1])); },
{ enablePatches: true })` gives the patches `replace [0,0] Set{-1}`, `replace [0,1] Map{}`, `add [0,2] 7`,
`replace [0] 1.5`, `replace [1] [Set{-1}, Map{}, 7]`, `add [2] true`: the inner array's own patches carry
its base index 0 although the root's unshift moved it to 1 (they are then overwritten by the whole-value
replace, so the forward replay happens to be right), and the inverse - `replace [0,0] Map{k=>1}`,
`replace [0,1] 7`, `replace [0,"length"] 2`, ... - fails with `Cannot apply patch at '0/0'` because
state[0] is 1.5. Without the modified Map element (an array of primitives, or a read-only element) the
inner patches are not emitted and both directions apply; immer emits whole-value replaces only. `getPath`
(src/utils/draft.ts) walks `target.key` (the base key) and only checks that the parent's copy still has
*a* draft or value at that key.
"""
