name = "mutative"
language = "typescript"
upstream = "https://github.com/unadlib/mutative"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-19"  # README, SECURITY.md, CODE_OF_CONDUCT.md, .github/ (workflows, dependabot), no CONTRIBUTING: nothing about AI

[base]
commit = "63774685779c5deab712077d173cb3590350ca41"
date = "2026-08-14"
version = "1.3.0"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript with a rollup build that inlines the `__DEV__` flag: the setup installs Hegel,
# the two oracles (immer, fast-json-patch), the compiler and @types/node under .hegel/ and compiles
# src/ as CommonJS into .hegel/dist with hegel/tsconfig.json (`importHelpers` off, so no tslib); the
# tests set `globalThis.__DEV__ = true` (the development build, as jest does) and require
# .hegel/dist/index.js. Nothing touches the upstream tree or its yarn.lock.
setup = [
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5 immer@10 fast-json-patch@3 typescript@5 @types/node@22",
  "node .hegel/node_modules/typescript/bin/tsc -p hegel/tsconfig.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinMovedSetDraftKeepsItsChanges = "mutative/1"
TestHegelPinSetDraftIteratesZeroForNegativeZero = "mutative/2"
TestHegelPinAssigningTheOriginalChildBackEmitsNoRemovePatch = "mutative/3"
TestHegelPinUndefinedAssignedAfterDeleteIsKept = "mutative/4"
TestHegelPinSetDraftYieldsItsArrayElementOnEveryIteration = "mutative/5"
TestHegelPinApplyReplaysARootReplaceToADate = "mutative/6"
TestHegelPinReturningAChildDraftAfterMutatingTheRootThrows = "mutative/7"
TestHegelPinCurrentWorksWithAPlainSetHoldingADraft = "mutative/8"
TestHegelPinSetElementChangePatchesInvertBesideARemoval = "mutative/9"
TestHegelPinMovedArrayPatchesUseItsNewIndex = "mutative/10"
TestHegelPinArrayPatchesReplaceZeroWithNegativeZero = "mutative/11"
TestHegelPinMovedUntouchedDraftIsTheBaseObject = "mutative/12"
TestHegelPinAutoFreezeAcceptsARestoredNodeBesideItsModifiedCopy = "mutative/13"
TestHegelPinPatchesOfAContainerReplacedByALeafInvert = "mutative/14"
# Unsteered 2026-10-06 (STYLE.md rule 11): every recorded shape is drawn by default and a mismatch
# with a recorded bug's shape fails naming it ("shape of mutative/N"). The wide properties shrink
# to the smallest shape they hit in the run, so which bug the shrunk case shows varies; each is
# mapped to its most frequent shrink. Patches fails every run (the /1, /3, /4, /5, /9 shapes are
# 5% of its cases together); the other wide properties fail in about half the 100-case runs.
# HEGEL_NO_KNOWN=1 counts and skips such mismatches and skips the narrow properties whole.
TestHegelPatchesReplayAndInvert = "mutative/4" # also shrinks to /3, /9, /1, /5 (and /11, /14 at a few cases in ten thousand)
TestHegelCreateMatchesTheModelAndImmer = { bug = "mutative/5", intermittent = true } # also /4, /1 and /12
TestHegelCurrentAndOriginalDuringTheDraft = { bug = "mutative/5", intermittent = true } # also /1, /4, /8
TestHegelReadsThroughTheDraftMatchTheModel = { bug = "mutative/2", intermittent = true } # also /5
TestHegelFrozenBasesAndAutoFreeze = { bug = "mutative/5", intermittent = true } # also /4, /1, /13
TestHegelReturnValuesFollowTheRules = { bug = "mutative/6", intermittent = true } # the /7 and /5 shapes shrink to /6's smaller case
TestHegelClassInstancesUnderMark = { bug = "mutative/3", intermittent = true } # also /9, /1
TestHegelStrictModeGuardsNonDraftables = { bug = "mutative/5", intermittent = true } # also /1
# One narrow property per bug, over its shape region with random contents: deterministic.
TestHegelMovedSetDraftsKeepTheirChanges = "mutative/1"
TestHegelSetDraftsIterateZeroForNegativeZero = "mutative/2"
TestHegelAssigningTheOriginalChildBackEmitsNoPatch = "mutative/3"
TestHegelUndefinedAssignedToAVacatedKeyIsKept = "mutative/4"
TestHegelSetDraftsYieldTheirArrayElementOnEveryIteration = "mutative/5"
TestHegelApplyReplaysARootReplaceToADate = "mutative/6"
TestHegelReturningAnUntouchedChildDraftAfterAMutationThrows = "mutative/7"
TestHegelCurrentWorksWithAFreshSetHoldingDraftsOrNaN = "mutative/8"
TestHegelSetElementChangePatchesInvertBesideAnAddOrRemoval = "mutative/9"
TestHegelMovedArrayPatchesUseTheirNewIndex = "mutative/10"
TestHegelArrayPatchesTellZeroFromNegativeZero = "mutative/11"
TestHegelMovedUntouchedDraftsFinalizeToTheBaseObject = "mutative/12"
TestHegelAutoFreezeAcceptsARestoredNodeBesideItsModifiedCopy = "mutative/13"
TestHegelPatchesOfAContainerReplacedAfterHoldingADraftInvert = "mutative/14"
