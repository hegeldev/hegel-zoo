name = "mutative"
language = "typescript"
upstream = "https://github.com/unadlib/mutative"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-19"  # README, SECURITY.md, CODE_OF_CONDUCT.md, .github/ (workflows, dependabot), no CONTRIBUTING: nothing about AI

[base]
commit = "63774685779c5deab712077d173cb3590350ca41"
date = "2026-08-14"
version = "1.3.0"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript with a rollup build that inlines the `__DEV__` flag: the setup installs Hegel,
# the two oracles (immer, fast-json-patch), the compiler and @types/node under .hegel/ and compiles
# src/ as CommonJS into .hegel/dist with hegel/tsconfig.json (`importHelpers` off, so no tslib); the
# tests set `globalThis.__DEV__ = true` (the development build, as jest does) and require
# .hegel/dist/index.js. Nothing touches the upstream tree or its yarn.lock.
setup = [
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5 immer@10 fast-json-patch@3 typescript@5 @types/node@22",
  "node .hegel/node_modules/typescript/bin/tsc -p hegel/tsconfig.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinMovedSetDraftKeepsItsChanges = "mutative/1"
TestHegelPinSetDraftIteratesZeroForNegativeZero = "mutative/2"
TestHegelPinAssigningTheOriginalChildBackEmitsNoRemovePatch = "mutative/3"
TestHegelPinUndefinedAssignedAfterDeleteIsKept = "mutative/4"
TestHegelPinSetDraftYieldsItsArrayElementOnEveryIteration = "mutative/5"
TestHegelPinApplyReplaysARootReplaceToADate = "mutative/6"
TestHegelPinReturningAChildDraftAfterMutatingTheRootThrows = "mutative/7"
TestHegelPinCurrentWorksWithAPlainSetHoldingADraft = "mutative/8"
TestHegelPinSetElementChangePatchesInvertBesideARemoval = "mutative/9"
TestHegelPinMovedArrayPatchesUseItsNewIndex = "mutative/10"
