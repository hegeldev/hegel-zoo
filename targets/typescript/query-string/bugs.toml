# Bugs found in query-string (sindresorhus/query-string) by the Hegel zoo. ids are query-string/N; see README.md for the properties.

[[bug]]
id = "query-string/1"
title = "the bracket-separator format decodes an element before splitting it, so an element that contains the separator comes back as several"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinBracketSeparatorElementsMayContainTheSeparator"
found = { commit = "7fd813338963583472586f228a74dcbfb067e785", version = "9.5.1 (main 2026-09-01)", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify({foo: ['a|b', 'c']}, {arrayFormat: 'bracket-separator', arrayFormatSeparator: '|'})` writes `foo[]=a%7Cb|c`, percent-encoding the separator inside the element as it should; `parse` of that string with the same options gives `['a', 'b', 'c']`. The bracket-separator parser decodes the value first (`decode(value, options).split(options.arrayFormatSeparator)` in `case 'bracket-separator'` of base.js) while the `comma` and `separator` parsers split the still-encoded value and decode each piece, which is why `{arrayFormat: 'separator', arrayFormatSeparator: '|'}` round-trips `a|b` (`foo=a%7Cb|c`) and bracket-separator does not. The same happens when the element came from a plain pair: `parse('k=a/b&k[]', {arrayFormat: 'bracket-separator', arrayFormatSeparator: '/'})` is `{k: ['a/b']}`, which stringifies to `k[]=a%2Fb` and parses back as `['a', 'b']`.
'''

[[bug]]
id = "query-string/2"
title = "the index parser throws a TypeError when a key appears both plain and indexed (foo=1&foo[0]=2)"
kind = "crash"
severity = "medium"
test = "TestHegelPinIndexParserAcceptsAPlainAndIndexedKey"
found = { commit = "7fd813338963583472586f228a74dcbfb067e785", version = "9.5.1 (main 2026-09-01)", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('foo=1&foo[0]=2', {arrayFormat: 'index'})` throws `TypeError: Cannot assign to read only property '0' of string '1'`, and `parse('foo&foo[0]=2', {arrayFormat: 'index'})` throws `TypeError: Cannot set properties of null (setting '0')`: the index formatter stores a plain pair as `accumulator[key] = value` and an indexed pair as `accumulator[key][index] = value` after only checking `accumulator[key] === undefined`, so a string or null that is already there is indexed into. Query strings come from the outside, so any URL can make `parse` throw under this format; the other formats treat the same mix gracefully (`bracket` gives `['1', '2']`), and the reverse order `foo[0]=2&foo=1` overwrites without throwing.
'''

[[bug]]
id = "query-string/3"
title = "with sort: false the index format parses arrays as plain objects ({0: 'a', 1: 'b'}), which stringify then writes as [object Object]"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIndexArraysAreArraysWithoutSorting"
found = { commit = "7fd813338963583472586f228a74dcbfb067e785", version = "9.5.1 (main 2026-09-01)", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('foo[0]=a&foo[1]=b', {arrayFormat: 'index', sort: false})` gives `{foo: {0: 'a', 1: 'b'}}` instead of `{foo: ['a', 'b']}`. The index formatter collects the elements in a plain object keyed by index and the conversion to an array (`Object.keys(value).sort(...).map(...)`) lives in the final sorting pass, which `sort: false` returns before (`if (options.sort === false) return returnValue;`). The readme documents `sort: false` only as "disable sorting" of the keys. The object then is not an array for the caller, and `stringify` of the result under the same options writes `foo=%5Bobject%20Object%5D`. A custom sort function is fine: the arrays are built.
'''

[[bug]]
id = "query-string/4"
title = "pick, exclude and stringifyUrl(parseUrl(url)) rewrite a percent-encoded fragment decoded: #a%26b becomes #a&b, #%23 becomes ##, #foo%20bar gets a raw space"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPickKeepsTheFragmentAsWritten"
found = { commit = "7fd813338963583472586f228a74dcbfb067e785", version = "9.5.1 (main 2026-09-01)", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`pick('https://x?a=1&b=2#a%26b', ['a'])` gives `https://x?a=1#a&b`, `pick('https://x?a=1#%23', ['a'])` gives `https://x?a=1##`, and `exclude('https://x?a=1#foo%20bar', ['b'])` gives `https://x?a=1#foo bar` (a raw space in a URL). Both go through `parseUrl(url, {parseFragmentIdentifier: true})`, which decodes the fragment (`decode(hash, options)`), and `stringifyUrl`, which writes `fragmentIdentifier` back with `encodeFragmentIdentifier: false` by default; `stringifyUrl(parseUrl(url, {parseFragmentIdentifier: true}))` changes the URL the same way. The fragment is not the functions' business (they pick query keys) and should come back as written; `pick(url, keys, {encodeFragmentIdentifier: true})` changes nothing, since pick and exclude set the internal symbol-keyed `[encodeFragmentIdentifier]: false` that `stringifyUrl` reads, so there is no option under which they leave a fragment alone.
'''

[[bug]]
id = "query-string/5"
title = "a key whose name ends in an array marker ([], [0], :list) does not round-trip: stringify percent-encodes the brackets and parse decodes the key before looking for markers"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinKeysEndingInArrayMarkersRoundTrip"
found = { commit = "7fd813338963583472586f228a74dcbfb067e785", version = "9.5.1 (main 2026-09-01)", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify({'foo[0]': 'x'}, {arrayFormat: 'index'})` writes `foo%5B0%5D=x` (the brackets are encoded, as for any key), and `parse('foo%5B0%5D=x', {arrayFormat: 'index'})` gives `{foo: ['x']}`: the parser calls the formatter with the decoded key (`formatter(decode(key, options), value, returnValue)`), so a percent-encoded marker counts as a marker and no spelling of the key `foo[0]` parses as a plain key under the index format. The same for `foo[]` under `bracket` and `bracket-separator` (`foo%5B%5D=x` gives `{foo: ['x']}`; `%5B%5D=1` alone gives `{'': ['1']}`) and for `foo:list` under `colon-list-separator` (`foo%3Alist=x` gives `{foo: ['x']}`). The value side is handled the other way round, split before decoding, for the `comma` and `separator` formats, so an encoded separator in a value is literal there.
'''

[[bug]]
id = "query-string/6"
title = "a plus sign as arrayFormatSeparator is written bare and read back as a space, so the array never round-trips"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinPlusIsAUsableSeparator"
found = { commit = "7fd813338963583472586f228a74dcbfb067e785", version = "9.5.1 (main 2026-09-01)", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`arrayFormatSeparator` is documented as any single character ("The character used to separate array elements when using arrayFormat: 'separator'"), and `validateArrayFormatSeparator` accepts `+`. `stringify({foo: ['a', 'b']}, {arrayFormat: 'separator', arrayFormatSeparator: '+'})` writes `foo=a+b`, and `parse` of it with the same options first turns every `+` into a space (`parameter.replace(/\+/g, ' ')`, the W3C rule the readme points at) and then splits on `+`, finding none: the result is `{foo: 'a b'}`. The same under `comma` (with the separator changed) and `bracket-separator`. Either `+` should be refused as a separator or the separator should be looked for before the `+` rule is applied.
'''

[[bug]]
id = "query-string/7"
title = "stringify writes objects, functions, nested arrays and Dates as text ([object Object], the function source) instead of throwing as documented"
kind = "contract"
severity = "low"
test = "TestHegelPinUnsupportedValuesThrow"
found = { commit = "7fd813338963583472586f228a74dcbfb067e785", version = "9.5.1 (main 2026-09-01)", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The readme's `stringify` section says "Throws a TypeError if the value is not a string, number, bigint, boolean, null, or undefined, or an array of those" (objects, functions and Symbols are named as unsupported). `stringify({a: {}})` gives `a=%5Bobject%20Object%5D`, `stringify({a: () => 1})` gives the encoded source of the function, `stringify({a: [[1, 2]]})` gives `a=1%2C2`, and `stringify({a: new Date(0)})` gives the encoded `Date.prototype.toString()` text; only a Symbol throws (from `encodeURIComponent` itself). A caller that passes a nested object by mistake gets a query string with `[object Object]` in it rather than the documented error.
'''
