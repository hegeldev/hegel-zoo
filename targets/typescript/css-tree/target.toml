name = "css-tree"
language = "typescript"
upstream = "https://github.com/csstree/csstree"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-19"  # README.md, CHANGELOG.md, docs/, .github/ (FUNDING.yml, workflows): no AI policy, no CONTRIBUTING

[base]
commit = "f8980154f79110833bf56c391cd45fe5f9205752"
date = "2026-09-16"
version = "3.2.1"

[hegel]
version = "0.4.5"

[run]
# lib/ is plain ESM, so nothing is built. The runtime dependencies (mdn-data, source-map-js) are
# installed without the dev tree; Hegel and @csstools/css-tokenizer (the second CSS Syntax
# tokenizer used as an oracle) go under .hegel/.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 @csstools/css-tokenizer@4.0.1",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinBadStringTokenStopsBeforeTheNewline = "css-tree/1"
TestHegelPinBackslashAtEndOfInputIsAnEscape = "css-tree/2"
TestHegelPinUrlWithOnlyWhitespaceDecodesToEmpty = "css-tree/3"
TestHegelPinNulIsReplacedByTheReplacementCharacter = "css-tree/4"
TestHegelPinVisitDeclarationReachesSupportsPreludes = "css-tree/5"
TestHegelPinPropertyDescriptorIsSharedAcrossSpellings = "css-tree/6"
TestHegelPinDescendantCombinatorHasALocation = "css-tree/7"
TestHegelPinUrlDecodeKeepsAnEscapedTrailingSpace = "css-tree/8"
TestHegelPinGenerateIsIdempotentOnBackslashNewline = "css-tree/9"
TestHegelPinBadUrlTokenStopsAtItsClosingParenthesis = "css-tree/10"
TestHegelPinValidNestedMediaConditionReportsNoParseError = "css-tree/11"
TestHegelPinNestedRuleWithoutNestingSelectorIsARule = "css-tree/12"
TestHegelPinNestedLayerBlockHoldsDeclarations = "css-tree/13"
TestHegelPinGeneratedChildCombinatorAfterDoubleHyphenReparses = "css-tree/14"
TestHegelPinEscapedUrlNameStartsAUrlToken = "css-tree/15"
