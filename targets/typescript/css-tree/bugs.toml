# Bugs found in css-tree by the Hegel properties in hegel.patch. Each is pinned by the test named in
# `test`, which fails while the bug is present.

[[bug]]
id = "css-tree/1"
title = "A bad-string-token swallows the newline that ends it: for a quote, text and a newline, tokenize gives a bad-string-token covering the newline, while CSS Syntax 4.3.5 reconsumes the newline so it becomes the next (whitespace) token"
kind = "spec"
severity = "low"
test = "TestHegelPinBadStringTokenStopsBeforeTheNewline"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Syntax Level 3, 4.3.5 (consume a string token): "newline: This is a parse error. Reconsume the
current input code point, create a <bad-string-token>, and return it." css-tree's `consumeStringToken`
leaves the newline inside the bad-string-token, so `"bad\nstr"` tokenizes as
`bad-string-token("bad\n) ident(str) string(")` instead of `bad-string-token("bad) whitespace(\n)
ident(str) string(")`. @csstools/css-tokenizer follows the spec. Only the token boundary (and the
`end` offset reported to `onToken`/`loc` consumers) is affected; the parser treats the swallowed
newline as part of the bad string, where the spec would treat it as whitespace, which matters for
`a{x:"bad\n}` style recovery only in the token stream.
'''

[[bug]]
id = "css-tree/2"
title = "A backslash at the end of the input is tokenized as a delim-token instead of an escape: tokenize('a\\') gives ident-token delim-token where CSS Syntax 4.3.8/4.3.7 make the backslash a valid escape decoding to U+FFFD, i.e. one ident-token"
kind = "spec"
severity = "low"
test = "TestHegelPinBackslashAtEndOfInputIsAnEscape"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Syntax 4.3.8 (check if two code points are a valid escape) returns false only when the second
code point is a newline, so `\` followed by EOF is a valid escape, and 4.3.7 (consume an escaped
code point) says "EOF: This is a parse error. Return U+FFFD." css-tree's `isValidEscape` treats
EOF (code 0) like a newline, so `a\` tokenizes as `ident(a) delim(\)` and `\` alone as a delim,
where the reference tokenizer gives one ident-token whose value ends in U+FFFD. `ident.decode("a\\")`
consequently returns "a" plus a literal backslash. Only truncated input is affected.
'''

[[bug]]
id = "css-tree/3"
title = "url.decode of a url() whose argument is only whitespace returns a space: url.decode('url( )') is ' ' where the url-token consumes the whitespace and the value is the empty string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUrlWithOnlyWhitespaceDecodesToEmpty"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Syntax 4.3.6 (consume a url token) consumes whitespace after `url(`, and a run of whitespace
followed by `)` ends the token, so `url( )` and `url(   )` are url-tokens with the value "".
`url.decode("url( )")` returns " ": the decoder strips leading whitespace and trailing whitespace
separately and both loops stop at the same single character. `parse("a{b:url( )}")` gives a Url
node with `value: " "`, and `generate` writes `url( )` back, so `parse(generate(ast))` gives a Url
whose value is again " " — the AST claims a URL of one space. The reference tokenizer decodes it to
"". Whitespace-only url() is rare in real style sheets.
'''

[[bug]]
id = "css-tree/4"
title = "U+0000 is not replaced by U+FFFD while tokenizing: tokenize('a<NUL>b') gives ident-token delim-token ident-token instead of one ident-token, against the input preprocessing rule of CSS Syntax 3.3"
kind = "spec"
severity = "low"
test = "TestHegelPinNulIsReplacedByTheReplacementCharacter"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Syntax 3.3 (preprocessing the input stream): "Replace any U+0000 NULL or surrogate code points
with U+FFFD REPLACEMENT CHARACTER." U+FFFD is a non-ASCII code point and so a name code point, so
`a<NUL>b` is one ident-token (value "a\uFFFDb"), as the reference tokenizer reports. css-tree's
`charCodeCategory` files code 0 under "other", so the NUL becomes a delim-token and splits the ident
in three tokens; the same happens inside strings, urls and hashes. `ident.decode`/`string.decode`
also keep the NUL instead of U+FFFD. Real style sheets almost never contain NUL, hence low.
'''

[[bug]]
id = "css-tree/5"
title = "walk with visit: 'Declaration' never enters the declaration inside a @supports (property: value) condition (a SupportsDeclaration node), while walk with a type test, find and findAll reach it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinVisitDeclarationReachesSupportsPreludes"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
docs/traversal.md describes `visit` as a way to restrict `enter`/`leave` to nodes of one type. For
`Declaration` (and `Rule`, `Atrule`) the walker uses a precomputed fast traversal (lib/walker/create.js,
`createFastTraveralMap`) that only descends through the node types on the way to blocks, so the
Declaration that lives in a `SupportsDeclaration` node (`@supports (display: grid) {}`, and
`@import url(x) supports(display: grid)`) is never visited:
`walk(parse("@supports (display: grid) {}"), { visit: "Declaration", enter })` calls `enter` 0
times, `walk(ast, node => node.type === "Declaration" && count++)` and
`findAll(ast, node => node.type === "Declaration")` give 1. Tools that rename or validate
declarations with `visit: "Declaration"` silently skip the ones in @supports conditions.
'''

[[bug]]
id = "css-tree/6"
title = "property() returns a different descriptor for the lower-case spelling when the upper-case spelling of a name was asked first: property('ZOO-PIN-PROPERTY') !== property('zoo-pin-property'), although the cache is meant to share one descriptor per name"
kind = "contract"
severity = "low"
test = "TestHegelPinPropertyDescriptorIsSharedAcrossSpellings"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
lib/utils/names.js `getPropertyDescriptor` lower-cases the name and, when the lower-case spelling is
already cached, stores and returns that descriptor for the new spelling ("re-use result when
possible (the same as for lower case)"). When the descriptor is built for the first time it is stored
under the spelling that was asked only (`properties.set(property, descriptor)`), not under the
lower-case name, so a later request for the lower-case spelling builds a second, deep-equal but
distinct frozen object; asking `property("color")` before `property("COLOR")` shares, the other
order does not. Code that compares descriptors by identity (the cache exists for that) gets
order-dependent results. keyword() has the same structure and the same behaviour.
'''

[[bug]]
id = "css-tree/7"
title = "The descendant combinator has loc: null with positions: true: in parse('a b{}', {positions: true}) every node carries a location except the Combinator whose name is a space"
kind = "contract"
severity = "low"
test = "TestHegelPinDescendantCombinatorHasALocation"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
docs/ast.md documents `loc` as filled for every node when `positions` is on. lib/syntax/scope/selector.js
creates the descendant combinator for whitespace between compound selectors as
`{ type: 'Combinator', loc: null, name: ' ' }` (with a FIXME) instead of taking the location of the
whitespace it stands for, so source-map and lint tools that report positions of combinators (or
walk `loc` on every node) hit a null there and nowhere else; `>`, `+`, `~` and `/deep/`
combinators have a `loc`.
'''

[[bug]]
id = "css-tree/8"
title = "url.decode drops a url whose last character is an escaped space: url.decode('url(a\\ )') returns ' )' instead of 'a ', so url.encode followed by url.decode does not round-trip values ending in whitespace"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUrlDecodeKeepsAnEscapedTrailingSpace"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`url.encode("a ")` gives `url(a\ )` (the space escaped, as CSS Syntax requires inside an unquoted
url). `url.decode("url(a\\ )")` trims trailing whitespace before looking for the closing `)`, so it
cuts the escaped space off, does not find `)` where it expects it, and returns " )": the decoded
value is wrong and the `a` is lost. The reference tokenizer decodes the same token to "a ". Values
ending in a space are unusual in URLs but `url.encode` produces exactly this form for them.
'''

[[bug]]
id = "css-tree/9"
title = "generate is not idempotent on a backslash-newline in a custom property value: generate(parse('a{--x:\\<LF>1}')) inserts a second newline after the backslash, and every further generate(parse(...)) adds another"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGenerateIsIdempotentOnBackslashNewline"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Inside a custom property value css-tree keeps the raw text (`Raw` node) and re-emits it token by
token; a `\` followed by a newline is not a valid escape (CSS Syntax 4.3.8), so it tokenizes as a
delim-token followed by whitespace. lib/generator/create.js inserts whitespace between two tokens
when their concatenation would tokenize differently, and its rule for delim `\` followed by
whitespace adds a newline although the whitespace is already there: `a{--x:\\\n1}` generates as
`a{--x:\\\n\n1}`, which generates as `a{--x:\\\n\n\n1}`, and so on. The value seen by `var()`
consumers changes on every parse/generate pass. Only custom properties (and other Raw values)
containing a backslash before a newline are affected.
'''

[[bug]]
id = "css-tree/10"
title = "A bad-url-token that contains an escape runs past the parenthesis that ends it: tokenize('url(a b\\41)c{d:e}') gives one bad-url-token covering the whole input, and a bad url ending in an escape gets an end offset one past the source"
kind = "spec"
severity = "low"
test = "TestHegelPinBadUrlTokenStopsAtItsClosingParenthesis"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Syntax 4.3.15 (consume the remnants of a bad url) stops at `)` or EOF and consumes each valid
escape with "consume an escaped code point". css-tree's `consumeBadUrlRemnants` loop
(lib/tokenizer/utils.js) sets `offset` to the position returned by `consumeEscaped` and then runs
the loop's own `offset++`, so the code point right after an escape is never examined: when it is
the `)` that ends the bad url, the token continues to the next `)` or the end of the input, and
when the escape is the last thing in the input the token's end offset is `source.length + 1`
(`tokenize("url( (\\31")` reports `bad-url-token@0-10` for 9 characters; the loc of the Raw node
built from it points past the source). `url(a b\41)c{d:e}` should tokenize as a bad-url-token of 11
characters followed by `c`, `{`, `d`, `:`, `e`, `}`; css-tree gives one bad-url-token of 17,
swallowing the following declaration block. Only invalid url() with escapes is affected, which is
why this is low, but the recovery rules exist exactly for such input.
'''

[[bug]]
id = "css-tree/11"
title = "onParseError is called for valid CSS that parses completely: @media ((hover) and (color)) {}, @supports ((color: red)) {}, general-enclosed terms and @import url(x) supports(selector(a)) each report a parse error although the tree has no Raw node"
kind = "contract"
severity = "low"
test = "TestHegelPinValidNestedMediaConditionReportsNoParseError"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
docs/parsing.md: "mistakes in CSS may make it impossible to parse some part... In that case bad
content is wrapping into a Raw node and onParseError is invoking." lib/syntax/node/Condition.js
parses a parenthesised term by trying a feature first and, when that throws, a nested condition and
then a general-enclosed term, through `parseWithFallback`; `parseWithFallback` (lib/parser/create.js)
reports the first attempt's error to `onParseError` whenever it uses the fallback, even when the
fallback is a complete parse. So `@media ((hover) and (color)) {}` (Media Queries 4: a
<media-in-parens> may wrap a <media-condition>) parses into a nested Condition node and still calls
`onParseError` with "Number, dimension, ratio or identifier is expected"; `@media (not (hover))`,
`@supports ((color: red))`, `@supports (not (color: red))`, `@container ((width > 1px) and (height >
1px))`, `@supports foo(bar)` ("Unknown feature foo()", although GeneralEnclosed is the documented
representation) and `@import url(a.css) supports(selector(a))` (atrule/import.js tries a declaration
before a condition) behave the same. Linters and bundlers that surface `onParseError` show errors for
correct style sheets, and a parser run in "strict" mode (`onParseError` throwing) rejects them.
'''

[[bug]]
id = "css-tree/12"
title = "A nested style rule whose selector does not start with & is parsed as a Raw node: parse('a { .x { color: red } }') gives a Rule whose block holds Raw '.x { color: red }' and reports a parse error, although CSS Nesting allows relaxed nesting"
kind = "spec"
severity = "medium"
test = "TestHegelPinNestedRuleWithoutNestingSelectorIsARule"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = "https://github.com/csstree/csstree/issues/268"
fixed_in = ""
notes = '''
CSS Nesting 1 (since the 2023 relaxed syntax, shipped by every browser) lets a nested style rule
start with any selector: the parser tries a declaration first and, when that fails, parses the
content as a rule. lib/syntax/node/Block.js only treats content starting with `&` as a nested rule
and everything else in a style block as a declaration, whose fallback is a Raw node up to the next
`;`, so `a { .x { color: red } }`, `a { b {} }`, `a { :hover {} }`, `a { [x] {} }`, `a { > b {} }` all
give `Block.children = [Raw]` with "Identifier is expected"/"Colon is expected" parse errors, while `a
{ & .x {} }` gives a Rule. The Raw text is written back verbatim by `generate`, so round trips look
fine, but walkers, `find`, the lexer (`lexer.checkStructure`, matching) and selector transforms never
see the nested rules, and minifiers built on css-tree keep them unminified. The CHANGELOG lists "CSS
Nesting support". Reported upstream as #268 (open since 2023-12).
'''

[[bug]]
id = "css-tree/13"
title = "@layer nested in a style rule does not get a style block: parse('a { @layer x { color: red } }') wraps the declaration in a Raw node with a parse error, while @media, @supports, @container, @scope and @starting-style in the same place hold Declarations"
kind = "spec"
severity = "low"
test = "TestHegelPinNestedLayerBlockHoldsDeclarations"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Nesting 1, 3.1 (nesting other at-rules) lets the conditional group rules and `@layer` nest in a
style rule; the nested at-rule's block is then a style block (declarations and nested rules).
lib/syntax/atrule/media.js, supports.js, container.js, scope.js and starting-style.js pass the
`nested` flag to `this.Block(nested)`, but lib/syntax/atrule/layer.js calls `this.Block(false)`, so
inside `a { @layer x { color: red } }` the `color: red` is parsed as a rule prelude, fails
("Identifier is expected", "{ is expected") and becomes Raw. `a { @layer x { & .b {} } }` works,
because a nested rule is also a rule. Cascade layers nested in components (`.card { @layer
overrides { ... } }`) lose their declarations for every css-tree consumer.
'''

[[bug]]
id = "css-tree/14"
title = "generate joins the type or class selector -- and a following child combinator into -->, which tokenizes as a CDC token: generate(parse('-- > b {}')) is '-->b{}', whose parse is a CDC node and a rule for b"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinGeneratedChildCombinatorAfterDoubleHyphenReparses"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`--` is an ident-token (CSS Syntax 4.3.10: two hyphens start an ident), so `-- > b {}` is a rule
whose selector is a type selector `--`, a child combinator and `b`; css-tree parses it that way
(TypeSelector, Combinator, TypeSelector). lib/generator/create.js only inserts whitespace between
tokens whose concatenation would tokenize differently, and its table does not know that ident `--`
followed by `>` forms `-->`, a CDC token, so `generate` writes `-->b{}` and `parse` of that gives
`[CDC, Rule(b)]` — the rule for `--` is gone. `.-- > b {}` becomes `.-->b{}`, which no longer
parses as a selector at all (Raw with a parse error). A `--` type selector is an edge case
(it matches no element), so low; the output of `generate` is otherwise a fixpoint over the
generated corpus.
'''

[[bug]]
id = "css-tree/15"
title = "An escaped url( function name is tokenized as a function-token: for a backslash-escaped u followed by rl(a) tokenize gives function-token ident-token )-token, where CSS Syntax 4.3.4 compares the decoded ident sequence with url and makes it a url-token"
kind = "spec"
severity = "low"
test = "TestHegelPinEscapedUrlNameStartsAUrlToken"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CSS Syntax 4.3.4 (consume an ident-like token): "Consume an ident sequence, and let string be the
result. If string's value is an ASCII case-insensitive match for 'url', and the next input code
point is U+0028, consume it... consume a url token". The ident sequence is the decoded name (4.3.11
appends escaped code points), so `\url(a)`, `\75rl(a)` and `u\rl(a)` all start a <url-token> and
`\url(a b)` is a <bad-url-token>, as the reference tokenizer reports. css-tree's `consumeIdentLikeToken`
compares the raw source text with `url` (`cmpStr`), so an escape anywhere in the name gives a
function-token whose children are then tokenized as ordinary values: `tokenize("\\url(a)")` is
`function-token ident-token )-token`, and `parse("a{b:\\url(x)}")` gives a Function node named
`\url` instead of a Url node. Escaped `url` names are an obscure way to write a url(), hence low.
'''

[[bug]]
id = "css-tree/16"
title = "string.encode and url.encode insert a space after a NUL that follows a control character: encoding tab, NUL, a gives a hex escape, U+FFFD, a space and a, which decodes to a different string (the space belongs right after the hex escape or nowhere)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringEncodeRoundTripsAControlCharacterBeforeNul"
found = { commit = "f8980154f79110833bf56c391cd45fe5f9205752", version = "3.2.1", hegel = "0.4.5", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
lib/utils/string.js `encode` writes U+0001-U+001F and U+007F as hex escapes and sets
`wsBeforeHexIsNeeded`, so that a following hex digit or whitespace gets a separating space; the NUL
branch (`encoded += '�'; continue`) neither clears the flag nor is a hex digit, so the flag
survives to the character after the U+FFFD: `string.encode("\t\0a")` is `"\9� a"` (a space
that was never in the input) and `string.decode` of that is `"\t� a"`, where the documented
round trip (docs/utils.md: decode(encode(s)) is s with NUL replaced by U+FFFD) requires
`"\t�a"`. `url.encode("\t\0a")` = `url(\9� a)` has the same extra space; `ident.encode`
writes `\9 �a` and is correct. Real values with a control character followed by NUL are rare,
hence low; found by CI's first 100-case run of the encoder round trip.
'''
