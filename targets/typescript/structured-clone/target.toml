name = "structured-clone"
language = "typescript"
upstream = "https://github.com/ungap/structured-clone"
subdir = ""
license = "ISC"
ai_policy_checked = "2026-09-20"  # README, .github/workflows/node.js.yml (the only file under .github), no CONTRIBUTING: nothing about AI

[base]
commit = "df3b152a58afe238e6220548439d3fdf50003ad5"
date = "2026-08-27"
version = "1.4.0"

[hegel]
version = "0.4.5"

[run]
# The library is plain JavaScript with no runtime dependencies (esm/index.js, esm/json.js), so
# nothing of its own is installed; Hegel goes under .hegel/ so the lock file stays untouched.
# The oracle is Node's own structuredClone (V8's serializer), so Node 22+ is all the tests need.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

