# Bugs found in @ungap/structured-clone by the Hegel zoo. One [[bug]] per finding; `test` names
# the pin in hegel/hegel.test.mjs that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracles: Node's own structuredClone (V8's serializer, the
# reference implementation of the algorithm the package polyfills), the README (lossy/json
# modes, "serialized values can be safely stringified as JSON"), JSON.stringify for json mode's
# toJSON contract, and a canonical rendering that compares identity structure. No CONTRIBUTING
# file; README and .github/ say nothing about AI (checked 2026-09-20).

[[bug]]
id = "structured-clone/1"
title = "Holes in a sparse array become undefined elements"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinHolesStayHoles"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
serialize.js walks an array with `for (const entry of value)`, which yields undefined for a
hole, so the record holds a VOID entry and deserialize.js pushes undefined: `0 in
structuredClone([, 1])` is true with the polyfill and false natively (the algorithm copies
own properties, so holes stay holes). `Object.keys`, `forEach`, `in` and JSON.stringify all
tell the two apart. Found by the property over the whole value space; the pin uses `[, 1]`.
'''

[[bug]]
id = "structured-clone/2"
title = "An array loses its own non-index properties"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinArraysKeepTheirOwnProperties"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The algorithm copies every own enumerable property of an array, index or not: natively
`structuredClone(Object.assign([1], { foo: 2 })).foo` is 2. The polyfill serializes the
elements only, so `foo` is gone (the same `for ... of` walk as bug 1). Regex match arrays
(`index`, `input`, `groups`) are the everyday case. Found by the property over the whole
value space.
'''

[[bug]]
id = "structured-clone/3"
title = "An Error loses its cause"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinErrorsKeepTheirCause"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
serialize.js records an Error as `{name, message}` and nothing else. Node (V8's serializer)
and the browsers clone the own `cause` property too, recursively: `structuredClone(new
Error("m", { cause: 1 })).cause` is 1 natively and undefined with the polyfill, so an error
chain sent through the polyfill arrives as its last link. Found by the property over the
whole value space.
'''

[[bug]]
id = "structured-clone/4"
title = "An AggregateError comes back with an empty message and an errors list made of the message's characters"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinAggregateErrorsKeepTheirMessage"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
deserialize.js rebuilds every error as `new env[name](message)`. AggregateError's first
parameter is the iterable of errors, not the message, so
`structuredClone(new AggregateError([], "agg"))` is an AggregateError whose `message` is ""
and whose `errors` is `["a", "g", "g"]`. Natively the clone is an Error named "Error" with
message "agg" (AggregateError is not one of the algorithm's error kinds). Found by the
property over the whole value space.
'''

[[bug]]
id = "structured-clone/5"
title = "deserialize constructs whatever global the records name, reachable from serialize through an Error's name"
kind = "security"
severity = "medium"
test = "TestHegelPinRecordsDoNotConstructArbitraryGlobals"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
deserialize.js resolves a type it does not know, and the `name` of an ERROR record, as
`new env[name](init)` with `env` the global object, refusing only Function, Worker,
SharedWorker, eval, setTimeout and setInterval by name. Everything else is fair game, from
records (the json module's `parse` takes them from a string) and from values:
- `deserialize([["Uint8Array", 2 ** 30]])` allocates a gigabyte from 26 bytes of input;
  `[["Buffer", 2 ** 30]]` does the same through Node's deprecated Buffer constructor.
- `deserialize([["WebSocket", "ws://attacker.example/"]])` opens a connection from a
  process with a global WebSocket (Node 22+, every browser); `[["BroadcastChannel", "x"]]`
  keeps the Node process alive.
- Any constructor with side effects that an application has put on globalThis runs.
- An Error whose `name` is a global's is enough on the serialize side, so no crafted input is
  needed: `structuredClone(Object.assign(new Error("3"), { name: "Array" }))` returns
  `["3"]`, `name: "Date"` gives a Date, `name: "Uint8Array"` an empty Uint8Array (and with
  the message "4294967296" a 4 GiB one: the message is the length), `name: "Map"` throws.
  Natively any name outside the seven error kinds clones as an Error named "Error" with the
  message kept.
The algorithm's ERROR kind is a closed list (Error, EvalError, RangeError, ReferenceError,
SyntaxError, TypeError, URIError); resolving names against that list, and record types
against the known typed-array and boxed kinds, would close both doors. The pin installs a
spy class on globalThis and checks that neither a record nor an Error named after it
constructs it, and that an Error named Array stays an Error. The property over the whole
value space finds the Error-name cases.
'''

[[bug]]
id = "structured-clone/6"
title = "A DOMException clones as a plain Error named Error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDOMExceptionsSurvive"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A DOMException is an Error instance whose `name` (AbortError, TimeoutError, ...) is not a
global constructor, so serialize.js records it as an ERROR named AbortError and
deserialize.js, finding no `env.AbortError`, builds `new Error(message)`: the clone's name is
"Error" and it is no DOMException. The algorithm serializes DOMException as its own kind
(name and message kept), which is what Node and the browsers do; code that checks
`err.name === "AbortError"` after a clone no longer recognises an aborted fetch. Found by
the property over the whole value space.
'''

[[bug]]
id = "structured-clone/7"
title = "Objects the algorithm must refuse (Promise, WeakMap, WeakSet, WeakRef, boxed Symbol, arguments) clone as empty plain objects"
kind = "contract"
severity = "low"
test = "TestHegelPinUncloneableObjectsAreRefused"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The algorithm throws DataCloneError for any object with internal slots other than the kinds
it knows (natively `structuredClone(Promise.resolve(1))` throws "#<Promise> could not be
cloned"). serialize.js classifies by Object.prototype.toString tag and treats every unknown
tag as a plain object, so `serialize(Promise.resolve(1))` is `[[2, []]]` and the clone is
`{}`; WeakMap, WeakSet, WeakRef and `Object(Symbol())` do the same and an `arguments` object
becomes `{ "0": ..., "1": ... }`. A promise accidentally left in a payload thus arrives as
`{}` instead of failing loudly. Found by the property over the whole value space.
'''

[[bug]]
id = "structured-clone/8"
title = "A SharedArrayBuffer cannot be cloned: TypeError spread is not iterable"
kind = "crash"
severity = "low"
test = "TestHegelPinSharedArrayBuffersClone"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The tag "SharedArrayBuffer" contains "Array", so serialize.js takes the typed-array branch,
which only special-cases "ArrayBuffer" and "DataView" before spreading the value: `[...sab]`
throws "spread is not iterable". Natively `structuredClone(new SharedArrayBuffer(3))` returns
a SharedArrayBuffer over the same memory. Found by the property over the whole value space.
'''

[[bug]]
id = "structured-clone/9"
title = "A DataView over part of a buffer comes back over the whole buffer"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDataViewsKeepTheirRange"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
serialize.js records a DataView as `new Uint8Array(value.buffer)`, the bytes of the whole
buffer, and deserialize.js builds `new DataView(buffer)` over all of them: the view's
byteOffset and byteLength are lost. `structuredClone(new DataView(new Uint8Array([1, 2, 3,
4]).buffer, 1, 2))` natively has byteOffset 1 and byteLength 2 and `getUint8(0)` is 2; the
polyfill's clone has byteOffset 0, byteLength 4 and `getUint8(0)` is 1, so a header parsed
through a cloned view reads the wrong bytes without any error. (Typed arrays do not have
this problem: they are spread element by element, see bug 11.) Found by the property over
the whole value space.
'''

[[bug]]
id = "structured-clone/10"
title = "Two references to one ArrayBuffer or DataView deserialize as two objects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRepeatedBufferReferencesStayOneObject"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
deserialize.js memoizes every rebuilt object under its record index with `as(out, index)`,
except the ArrayBuffer and DataView cases, which call `as(..., value)` with the byte array
instead of the index. The second reference to the same record therefore misses the memo and
builds a fresh buffer: for `const b = new ArrayBuffer(2)`, `structuredClone([b, b])` gives
`c[0] === c[1]` natively and two distinct buffers with the polyfill (typed arrays are
memoized correctly). Found by the property over the whole value space.
'''

[[bug]]
id = "structured-clone/11"
title = "A typed array is cloned as its elements alone: views over one buffer stop sharing it and lose their offset"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinViewsOverOneBufferShareIt"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The algorithm clones a view's whole ArrayBuffer once and rebuilds each view over the clone at
its offset, so views that share a buffer still share it: for `const b = new ArrayBuffer(4)`,
`structuredClone([new Uint8Array(b), new Uint16Array(b)])` natively gives two views with one
`buffer`, and a write through one is visible through the other. serialize.js writes
`[type, [...view]]`, so each view comes back over a private buffer of exactly its elements:
`byteOffset` is 0, `buffer.byteLength` shrinks, and the two clones no longer alias. The
README's "typed arrays are supported without major issues" is true of the element values,
which do round-trip. Found by the property over the whole value space (the clean-space
property compares views by elements only).
'''

[[bug]]
id = "structured-clone/12"
title = "A plain object with a misleading Symbol.toStringTag is classified by the tag: TypeError or a boxed primitive instead of a plain object"
kind = "crash"
severity = "low"
test = "TestHegelPinTaggedObjectsArePlainObjects"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
serialize.js decides what a value is from `Object.prototype.toString.call(value)`, which any
object can set through Symbol.toStringTag. `{ [Symbol.toStringTag]: "Array", a: 1 }` is
iterated as an array ("value is not iterable"), the tags Map and Set fail the same way,
"Date" calls a missing getTime, "Int8Array" and "Uint8Array" fail to spread, and the tags
Number, Boolean and String take the boxed-primitive branch and return `new Number(object)`
(NaN), `new Boolean(object)` (true) or the string "[object String]". Natively all of them
clone as `{ a: 1 }`: the algorithm looks at internal slots, and a plain object has none.
Class instances that set a toStringTag for nicer logging are the everyday case. Found by
the property over the whole value space.
'''

[[bug]]
id = "structured-clone/13"
title = "json mode calls toJSON unlike JSON.stringify: a non-callable toJSON throws and a toJSON returning the receiver overflows the stack"
kind = "crash"
severity = "low"
test = "TestHegelPinJsonModeToJSONLikeJsonStringify"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `{ json: true }` (and in the json module, which always sets it) serialize.js does
`if (json && ('toJSON' in value)) return pair(value.toJSON())`. JSON.stringify only calls a
toJSON that is callable and replaces the object by the result once; the polyfill calls
whatever the property holds (`{ toJSON: 1, a: 1 }` throws "value.toJSON is not a function",
natively and in JSON it is an ordinary property) and recurses into the result before
memoizing the receiver, so the common `toJSON() { return this }` recurses forever
("Maximum call stack size exceeded"). `'toJSON' in value` also finds inherited members. The
json-module round trip of an object that merely has a property named toJSON fails on the
first case. Found by the json-mode property (JSON.stringify's semantics as the model) and
the json-module round trip.
'''

[[bug]]
id = "structured-clone/14"
title = "serialize(value, null) throws although the options parameter is documented as nullable"
kind = "crash"
severity = "low"
test = "TestHegelPinNullOptionsAreAccepted"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`serialize = (value, {json, lossy} = {}) => ...` defaults the options only for undefined;
`serialize(1, null)` throws "Cannot destructure property 'json' of ... as it is null". The
JSDoc of both serialize and the default export types the parameter as
`{json?, lossy?, transfer?}?`, i.e. nullable, and the default export forwards it unchanged
where there is no native structuredClone (with one, `structuredClone(v, null)` goes to the
native function and works). Found while reading the source; the pin is the call above.
'''

[[bug]]
id = "structured-clone/15"
title = "The json module turns NaN and the infinities into null, and loses the -0 of boxed Numbers and float arrays"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinJsonModuleKeepsNaNAndInfinity"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README says the records "can be safely stringified as JSON", and the serializer encodes
a bare -0 as the record `['-0']` and bigints as strings for that reason, but NaN, Infinity
and -Infinity are written as plain numbers, which JSON.stringify turns into null:
`parse(stringify(NaN))` is null, `parse(stringify({ a: Infinity }))` is `{ a: null }`, a Map
key NaN becomes null. Inside a boxed Number or a Float32Array/Float64Array the -0 record is
not used either, so `parse(stringify(new Number(-0)))` is `Number(0)` and
`parse(stringify(new Float64Array([-0, NaN, Infinity])))` is `[0, 0, 0]` (null elements
read as 0). deserialize(serialize(v)) in memory keeps all of them. Found by the json-module
round trip and the records-through-JSON-text property.
'''

[[bug]]
id = "structured-clone/16"
title = "The json module cannot stringify a BigInt64Array or BigUint64Array"
kind = "crash"
severity = "low"
test = "TestHegelPinJsonModuleStringifiesBigIntArrays"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
A typed array is recorded as `[type, [...view]]`; for the BigInt arrays the elements are
bigints, which JSON.stringify refuses: `stringify(new BigInt64Array([1n]))` throws "Do not
know how to serialize a BigInt", although a bare bigint is encoded as a string precisely so
that the README's "even if there is ... bigint values, typed arrays" holds. The README's
note that only the 8/16/32-bit integer arrays are "safely supported (right now)" covers this
as a known limitation; it is recorded because the failure is a throw from the json module
on a value the in-memory clone handles. Found by the records-through-JSON-text property.
'''

[[bug]]
id = "structured-clone/17"
title = "A -0 that follows a 0 anywhere in the value clones as 0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNegativeZeroAfterZeroStaysNegative"
found = { commit = "df3b152a58afe238e6220548439d3fdf50003ad5", version = "1.4.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
1.4.0's "Fix negative zero" (#27) writes a `['-0']` record for -0, but the check comes after
the identity lookup `if ($.has(value)) return $.get(value)`, and the identity map is a Map,
whose SameValueZero keys make -0 and 0 one key. Once a 0 has been serialized, every later -0
finds it and is written as 0: `structuredClone([0, -0])` gives `[0, 0]` (natively `[0, -0]`),
and `new Map([[1, 0], [2, -0]])` comes back with two +0 values. `[-0, 0]` is fine, since -0
is never memoized. Found by the clone-against-native property (its clean-space variant skips
values with this shape; the pin is `[0, -0]`).
'''
