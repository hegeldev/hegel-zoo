# Bugs found in fflate (101arrowz/fflate) by the Hegel zoo. ids are fflate/N; see README.md
# for the properties. The oracles are Node's bundled zlib and Python's zipfile.

[[bug]]
id = "fflate/1"
title = "gunzipSync reads one member and sizes its output from the last four bytes of the input: zero padding gives empty output, a second member truncates or throws"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinGunzipSyncAcceptsZeroPadding"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`gunzipSync` is `inflt(data.subarray(gzs(data), -8), …, new u8(gzl(data)))`: it takes the output size from the last four bytes of the whole input (ISIZE of the *last* member) and inflates one member. A member followed by zero padding — what gzip(1), zlib and Node's `gunzipSync` accept, and what tar-to-block-device or padded log files produce — has ISIZE 0 there, so `gunzipSync` (and `decompressSync`) return an **empty array with no error** for a stream that decodes to 300 bytes elsewhere. A stream of two members (concatenated gzip, which the streaming `Gunzip` supports since 0.7.3 and Node reads whole) comes back as the first member's data **cut to the second member's length** (`abc…` × 100 + `xyz` → `abc`), or, when the first member is larger than the buffer, throws "offset is out of bounds" from inside the inflater. The streaming `Gunzip` reads every member but rejects zero padding with error 6 "invalid gzip data" (Node accepts it). The second pin is `TestHegelPinGunzipSyncReadsEveryMember`.
'''

[[bug]]
id = "fflate/2"
title = "the Adler-32, CRC-32 and ISIZE trailers are never verified, so corrupted input decodes to silent garbage"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDamagedChecksumIsAnError"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`unzlibSync`, `gunzipSync`, `decompressSync` and the streaming `Unzlib`/`Gunzip`/`Decompress` slice the trailer off and never compute or compare the checksum (fflate has the CRC-32 and Adler-32 code, it uses them when writing). A stream with one flipped bit that still parses as DEFLATE returns different bytes with no error where zlib, Node, pako, Go, Python and every other implementation report "incorrect data check"; in the zoo's runs about nine in ten flipped-bit streams that fflate accepted came back as wrong bytes. Nothing in the README or the JSDoc says the checks are skipped. If this is a deliberate trade for speed it should be documented and, ideally, an option; an integrity check is the one reason the trailer exists.
'''

[[bug]]
id = "fflate/3"
title = "a gzip filename with a character outside Latin-1 (or a NUL) produces a stream nobody can read"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGzipFilenameOutsideLatin1IsNotCorrupting"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`gzh` writes `fn.charCodeAt(i)` into a byte for every UTF-16 code unit and reserves `fn.length + 1` bytes for the field. A character whose code unit's low byte is 0 (U+4E00 一, U+0100 Ā, the low surrogate of many emoji) becomes a NUL in the middle of the field: readers take it as the terminator and read the rest of the name as compressed data — Node fails with "invalid distance too far back" or "invalid stored block lengths"; `gzipSync(data, { filename: 'a一b' })` is unreadable, and so is `filename: 'a\0b'`. Other characters above U+00FF are written as an unrelated byte. RFC 1952 says FNAME is ISO 8859-1: a name that cannot be represented should be rejected (or encoded) rather than written as a corrupt header. Compare pako/3 (pako truncates the name but keeps the stream readable).
'''

[[bug]]
id = "fflate/4"
title = "EncodeUTF8 keeps no state between pushes, so a surrogate pair split across two chunks becomes two U+FFFD"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEncodeUtf8KeepsASplitSurrogatePair"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`EncodeUTF8.push(chunk)` is `this.ondata(strToU8(chunk), final)`: each chunk is encoded on its own. A string cut between a high and a low surrogate (a 😀 whose halves arrive in two pushes — any chunker working in UTF-16 code units will do that) encodes as `ef bf bd ef bf bd` instead of `f0 9f 98 80`. The decoding side (`DecodeUTF8`) does keep the incomplete tail between pushes, so the encoder is the odd one out; it should hold a trailing high surrogate for the next push.
'''

[[bug]]
id = "fflate/5"
title = "a ZIP entry comment longer than 65535 bytes is written without an error and corrupts the central directory"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZipCommentOver65535BytesIsRefused"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`zipSync`/`Zip` check the filename (error 11 "filename too long") and each extra field (error 9) against the 16-bit length fields but not the comment. `wzh` writes the comment length with `wbytes` (32 bits) over the 16-bit field and the disk-number field, then the whole comment: with 70 000 bytes the header says 4464 bytes of comment (70000 mod 65536) on disk 1, and the archive is unreadable — Python's zipfile: "Bad magic number for central directory"; fflate's own `unzipSync`: error 14 "unknown compression type 25443". The comment should get the same check as the name.
'''

[[bug]]
id = "fflate/6"
title = "the Decompress stream drops its input when the first push is shorter than three bytes and never produces anything"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinDecompressStreamKeepsAShortFirstPush"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`Decompress.push` needs three bytes to detect the format. While it has fewer it concatenates the pending bytes with the new chunk: `const n = new u8(this.p.length + chunk.length); n.set(this.p), n.set(chunk, this.p.length);` — and never assigns `n` to `this.p`. So `this.p` stays at the first one or two bytes, `this.p.length > 2` never becomes true, every later chunk is discarded, and the stream ends (even with `final`) having called `ondata` **zero times and thrown nothing**. `new Decompress(cb)` fed a zlib, gzip or raw stream as 1 byte then the rest yields nothing; 3 bytes then the rest yields the data. `AsyncDecompress` shares the code. The fix is `this.p = n`.
'''

[[bug]]
id = "fflate/7"
title = "Unzip: start() on an entry whose compression method has no registered decoder reports error 14 and then throws a TypeError"
kind = "crash"
severity = "low"
test = "TestHegelPinUnzipStartOnAnUnknownMethodOnlyReports"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
In the `UnzipFile` that `Unzip` hands to `onfile`, `start()` does `const ctr = this.o[cmp]; if (!ctr) file.ondata(err(14, 'unknown compression type ' + cmp, 1), null, false); d = sc < 0 ? new ctr(fn) : new ctr(fn, sc, su);` — the error is delivered through `ondata` as designed, but there is no `return`, so `new ctr(...)` follows with `ctr` undefined and "ctr is not a constructor" is thrown out of `start()` (and out of `push()`, since `onfile` runs inside it). An archive with a bzip2 or LZMA entry (Python's zipfile writes them) therefore aborts the whole streaming extraction unless the caller checks `file.compression` before `start()`, and the same happens with method 8 when `UnzipInflate` was not registered. A `return` after the `ondata` call is the fix.
'''

[[bug]]
id = "fflate/8"
title = "a zlib stream cut to under seven bytes, or an empty raw stream, decodes to empty output instead of an error"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTruncatedZlibStreamIsAnError"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`unzlibSync` is `inflt(data.subarray(zls(data), -4), …)`: for an input of 2–6 bytes the slice is empty (or the negative end lands before the start), `inflt` of nothing returns nothing, and the caller gets `Uint8Array(0)` for a stream that was cut off before its first block. `inflateSync(new Uint8Array(0))` returns empty too, where zlib and Node say "unexpected end of file" (a DEFLATE stream has at least one block). One byte more and fflate does raise error 0 "unexpected EOF", so the check exists; it just does not cover the empty case. The streaming `Unzlib` says error 6 "invalid zlib data" for the same bytes, so the two paths disagree.
'''

[[bug]]
id = "fflate/9"
title = "flush(true) — the sync flush added in 0.8.3 — writes a malformed block and the stream is undecodable from there (always at level 0)"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinSyncFlushAtLevelZeroStaysDecodable"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`Deflate.flush(true)` (also through `Zlib`/`Gzip`) is documented to "guarantee all pushed data is immediately decompressible" and to allow concatenating a further DEFLATE stream. At level 0 it never works: `push([1]); flush(true); push([2, 3], true)` writes `00 0100 feff 01 | 00 00 ff ff | 01 0200 fdff 0203` — the empty stored block after the flush lacks its header byte (the `c[0] = this.s.r >> 3` / `wfblk(c, this.s.r, et)` bookkeeping assumes a bit offset that a stored block does not leave), so zlib fails with "invalid stored block lengths" and fflate's own `inflateSync` with "unexpected EOF". At levels 1–9 it fails in other shapes: incompressible input flushed after about 2000 bytes (stored blocks again), 6 KB of long runs at `mem: 12` flushed to 36 bytes zlib rejects, and several dictionary cases; in the zoo's runs about a quarter of the flushes made the prefix or the whole stream undecodable. `flush(false)` was never seen to break a stream.
'''

[[bug]]
id = "fflate/10"
title = "a dictionary of up to 32 bytes with incompressible input over a few hundred bytes gives a stream zlib rejects and fflate itself misreads"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinShortDictionaryOutputIsReadable"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`zlibSync(random1000, { dictionary: new Uint8Array([7]) })` (and `deflateSync`, and the streaming classes) produces output that Node's `inflateSync(out, { dictionary })` rejects with "invalid distance too far back" and that fflate's own `unzlibSync(out, { dictionary })` decodes to *different* bytes. It happens for every dictionary length tried from 1 to 32 bytes with random input of 500 bytes or more (1000 for 32 bytes), never for compressible input, never for a 100-byte random dictionary — but also for a 33-byte dictionary of zeros with 70 000 random bytes at level 1. The `Deflate` constructor places the dictionary at the end of its 32 KiB look-back window (`this.s.i = 32768 - dict.length`) and leaves the bytes before it zero; the matcher then finds matches that begin in the dictionary and run back into that zero-filled region (trivially so when the dictionary itself begins with zeros), at distances the stream does not allow, and the incompressible input is where they surface. Matches must not extend before the dictionary's first byte.
'''

[[bug]]
id = "fflate/11"
title = "the streaming Gunzip ends a truncated stream without an error: nothing out for a cut header, everything out for a cut trailer"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGunzipStreamReportsATruncatedStream"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`new Gunzip(cb).push(stream.subarray(0, 5), true)` — five bytes of a gzip header as the whole input — returns normally having called `cb` with nothing: in `Gunzip.push`, when the header is still incomplete (`s > p.length`) and the push is final, the code falls through instead of raising, and the empty remainder inflates to nothing. `gunzipSync` says error 6 "invalid gzip data" for the same bytes, Node "unexpected end of file". A stream cut inside its 8-byte trailer (the DEFLATE data complete) also ends without an error, the data delivered in full; `gunzipSync` (which slices the trailer off first) says error 0 "unexpected EOF". The raw `Inflate` and `Unzlib` streams do raise "unexpected EOF" on the same cuts, so a truncated download passes silently only through the gzip stream — the most common one.
'''

[[bug]]
id = "fflate/12"
title = "the raw Inflate stream with a dictionary loses the dictionary on an empty first push and decodes the rest to wrong bytes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInflateStreamWithDictionaryAcceptsAnEmptyFirstPush"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`new Inflate({ dictionary }, cb)` given `push(new Uint8Array(0), false)` and then the whole raw stream returns the right number of bytes with the wrong content — no error, as raw DEFLATE has no checksum. In `Inflate.c` after each push the window is kept with `this.o = slc(dt, this.s.b - 32768)`; on the first call nothing has been inflated, `s.b` is the dictionary's length (165 here), and `165 - 32768` is a negative `subarray` start, which counts from the end: the window is replaced by the last few bytes of the buffer, the dictionary is gone, and every back-reference into it resolves elsewhere. Any non-empty first push (even one byte) is fine, as are `Unzlib` (the header is consumed first) and a dictionary of 32 KiB or more. An empty first push is what a pull-based pipe or a fetch body often delivers.
'''

[[bug]]
id = "fflate/13"
title = "at level 0 an input of exactly k × 65535 bytes gets a second final block, and the zlib and gzip output is unreadable"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStoredBlocksOfExactly65535BytesEndTheStream"
found = { commit = "dcb3714a6c25db3a2748641019c5277413d09714", version = "0.8.3 (2026-05-15)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
A stored block holds at most 65535 bytes. `deflateSync(data, { level: 0 })` with 65535 bytes writes `01 ffff 0000 <65535 bytes> 01 0000 ffff`: the first block already has BFINAL set, and an empty block, also final, follows it — the stored-block loop runs once more when the input ends exactly on the boundary. Raw readers stop at the first final block and ignore the five trailing bytes, so `deflateSync` seems fine; with the zlib wrapper (`zlibSync`) the Adler-32 is read where the extra block sits and Node reports "incorrect data check", with gzip (`gzipSync`) the CRC likewise, and the streaming `Zlib`/`Gzip` classes do the same. 131070 and 196605 bytes fail the same way; 65534 and 65536 do not. Level 0 is what fflate's README recommends for already-compressed files in ZIP archives, where `zipSync` uses `deflateSync` (raw, so unaffected), but any 64 KiB-minus-one chunk sent through `zlibSync`/`gzipSync` at level 0 is lost.
'''
