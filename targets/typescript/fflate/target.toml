name = "fflate"
language = "typescript"
upstream = "https://github.com/101arrowz/fflate"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-15"  # README, CONTRIBUTING (none), .github/ISSUE_TEMPLATE: no AI policy

[base]
commit = "dcb3714a6c25db3a2748641019c5277413d09714"
date = "2026-05-15"
version = "0.8.3"

[hegel]
version = "0.4.5"

[run]
# fflate ships tsc's ES5 output and its streaming classes rely on it (`Deflate.call(this)` in
# a constructor fails on a native class), so lib/ is built first, with the pinned TypeScript
# fetched by npx (the dev tree itself is not installed; test/tsconfig.hegel.json drops the
# @types/node reference). The zip properties need python3 with zipfile (stdlib).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev @hegeldev/hegel@0.4.5",
  "npx --yes -p typescript@6.0.3 tsc -p test/tsconfig.hegel.json --noCheck",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinGunzipSyncAcceptsZeroPadding = "fflate/1"
TestHegelPinGunzipSyncReadsEveryMember = "fflate/1"
TestHegelPinDamagedChecksumIsAnError = "fflate/2"
TestHegelPinGzipFilenameOutsideLatin1IsNotCorrupting = "fflate/3"
TestHegelPinEncodeUtf8KeepsASplitSurrogatePair = "fflate/4"
TestHegelPinZipCommentOver65535BytesIsRefused = "fflate/5"
TestHegelPinDecompressStreamKeepsAShortFirstPush = "fflate/6"
TestHegelPinUnzipStartOnAnUnknownMethodOnlyReports = "fflate/7"
TestHegelPinTruncatedZlibStreamIsAnError = "fflate/8"
TestHegelPinSyncFlushAtLevelZeroStaysDecodable = "fflate/9"
TestHegelPinShortDictionaryOutputIsReadable = "fflate/10"
TestHegelPinGunzipStreamReportsATruncatedStream = "fflate/11"
TestHegelPinInflateStreamWithDictionaryAcceptsAnEmptyFirstPush = "fflate/12"
TestHegelPinStoredBlocksOfExactly65535BytesEndTheStream = "fflate/13"
