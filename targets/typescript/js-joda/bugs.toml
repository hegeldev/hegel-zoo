[[bug]]
id = "js-joda/33"
title = "Duration.negated, abs and multipliedBy(-1) throw ArithmeticException at exactly 2^53-1 seconds, a value the type holds"
kind = "crash"
severity = "low"
test = "TestHegelPinNegatingMinSafeSecondsWorks"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`MathUtil.safeMultiply` (src/MathUtil.js) ends with Java's overflow test for `Math.multiplyExact`:
`(x === MIN_SAFE_INTEGER && y === -1) || (y === MIN_SAFE_INTEGER && x === -1)` throws. In Java that
case is real because `Long.MIN_VALUE` has no positive counterpart; in js-joda `MIN_SAFE_INTEGER`
is defined as `-9007199254740991 === -MAX_SAFE_INTEGER`, so the negation is exactly representable
and the check is spurious. `Duration.ofSeconds(-9007199254740991)` constructs fine (the value is
in range, and Java gives PT-2501999792983H-36M-31S too) but `.negated()`, `.abs()` and
`.multipliedBy(-1)` all throw "Multiplication overflows: -9007199254740991 * -1"; the same for
the positive bound multiplied by -1. `Duration.ZERO.minus(d)` works, so the class contradicts
itself on the sign flip. Java's java.time returns PT2501999792983H36M31S. Found by
TestHegelDurationAgreesWithJava, whose seconds generator includes the safe-integer bounds;
that property now counts the case and TestHegelDurationNegationAgreesWithJava carries it.
'''

[[bug.observed]]
