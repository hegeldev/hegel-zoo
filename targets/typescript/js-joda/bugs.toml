is the floor, not the truncation toward zero that `toNanos`, `toMillisPart` and, since JDK 9
(JDK-8184755), `toMillis` perform: `Duration.ofNanos(-1).toMillis()` is -1 (Java 0),
`Duration.ofSeconds(-1, 998999999).toMillis()` is -2 (Java -1). This is the ThreeTen-Backport
(JDK 8) algorithm. Found by the Duration toMillis property.
'''

