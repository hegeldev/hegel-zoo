# Bugs found in @js-joda/core by the Hegel tests, against java.time (JDK 25) as the oracle.
# js-joda is a port of ThreeTen-Backport and "method names and semantics intentionally match
# Java's JSR-310 API" (AGENTS.md). Deliberate, documented limitations (JavaScript Numbers, so no
# values beyond 2^53 and years within -999999..999999; locale text and the tz database in
# separate packages) are not recorded; see the README's notes. Where a behaviour is the JDK 8 /
# ThreeTen-Backport one that later JDKs changed, the notes say so.

[[bug]]
id = "js-joda/1"
title = "plus(n, IsoFields.QUARTER_YEARS) divides by 256 instead of 4: 1000 quarters add 61 years, not 250"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinQuarterYearsAddCorrectly"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
src/temporal/IsoFields.js, the QUARTER_YEARS unit's addTo:
`temporal.plus(MathUtil.intDiv(periodToAdd, 256), YEARS).plus(MathUtil.intMod(periodToAdd, 256) * 3, MONTHS)`.
This is the JDK 8 bug JDK-8033662 (fixed in 8u20 with `/ 4` and `% 4`), preserved in the port.
Correct for |n| < 256 and wrong beyond: `LocalDate.parse("1992-07-01").plus(1000, QUARTER_YEARS)`
gives 2053-07-01 (3 years plus 232 quarters, 61 years) where Java gives 2242-07-01 (250 years);
`plus(300, QUARTER_YEARS)` gives 2004-07-01 instead of 2067-07-01. `until(..., QUARTER_YEARS)` is
right, so `a.plus(a.until(b, QUARTER_YEARS), QUARTER_YEARS)` is not `b`. Found by the
QUARTER_YEARS arithmetic property on LocalDate, LocalDateTime, YearMonth and OffsetDateTime.
'''

[[bug.observed]]
version = "6.1.0"
commit = "ce4665b0930d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "js-joda/2"
title = "DateTimeFormatter.ISO_WEEK_DATE is built from YEAR and ALIGNED_WEEK_OF_YEAR: 2024-12-30 formats as 2024-W53-1 (ISO: 2025-W01-1)"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinIsoWeekDateUsesWeekBasedYear"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
src/format/DateTimeFormatter.js, `_init()`: ISO_WEEK_DATE appends ChronoField.YEAR, the literal
"-W", ChronoField.ALIGNED_WEEK_OF_YEAR (variable width) and DAY_OF_WEEK. Java's formatter uses
IsoFields.WEEK_BASED_YEAR, IsoFields.WEEK_OF_WEEK_BASED_YEAR (two digits) and DAY_OF_WEEK, is
case-insensitive and has an optional offset. js-joda's IsoFields compute the week-based year
correctly; only the formatter is wrong. So 2024-12-30 formats as "2024-W53-1" (Java:
"2025-W01-1"), 2021-01-03 as "2021-W1-7" (Java: "2020-W53-7"), January 1 always as week 1, and
parsing "2025-W01-1" gives 2025-01-06 instead of 2024-12-30; Java cannot parse js-joda's output
(the week is unpadded) and js-joda rejects a lower-case "w". Found by the ISO date-variant
formatter property.
'''

[[bug.observed]]
version = "6.1.0"
commit = "ce4665b0930d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

