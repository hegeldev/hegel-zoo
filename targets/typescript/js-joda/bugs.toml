result = "reproduces"

[[bug]]
id = "js-joda/10"
title = "Duration.toMillis floors negative durations: ofNanos(-1).toMillis() is -1 where java.time gives 0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDurationToMillisTruncatesTowardZero"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
