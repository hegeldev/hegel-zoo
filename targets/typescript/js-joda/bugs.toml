[[bug]]
id = "js-joda/8"
title = "Duration.dividedBy truncates the seconds and the nanoseconds separately: 1.5s / 3 is PT0.499999999S, 33554433s / 40 is PT233H1M0.824999999S"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDurationDividedByIsExactWhereTheQuotientIs"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
src/Duration.js `dividedBy`: `secs = intDiv(seconds, divisor); secsMod = roundDown((seconds /
divisor - secs) * 1e9); nos = intDiv(nanos, divisor); ofSeconds(secs, secsMod + nos)`. Two
independent truncations (plus a floating-point subtraction) where Java divides the total in
BigDecimal and truncates once toward zero. Exact quotients come out a nanosecond short:
`Duration.ofSeconds(1, 500000000).dividedBy(3)` is PT0.499999999S (Java PT0.5S),
`Duration.ofSeconds(33554433).dividedBy(40)` PT233H1M0.824999999S (Java ...0.825S); a negative
quotient rounds away from zero: `Duration.ofSeconds(-1, 500000000).dividedBy(3)` is
PT-0.166666667S (Java PT-0.166666666S); and for seconds around 1e10 the error reaches
microseconds. The doc comment warns of "floating point rounding errors", but the first cases
involve none - the algorithm is wrong. Found by the Duration division property.
'''

[[bug.observed]]
version = "6.1.0"
commit = "ce4665b0930d"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "js-joda/9"
title = "Duration.multipliedBy overflows on the nanosecond part although the result fits: ofMillis(1).multipliedBy(1e10) throws"
kind = "crash"
severity = "medium"
test = "TestHegelPinDurationMultipliedByFitsWhenTheResultFits"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
src/Duration.js `multipliedBy`: `nos = MathUtil.safeMultiply(this._nanos, multiplicand)` - the
nanosecond part times the factor must stay under 2^53 even though only the final seconds need
to. `Duration.ofMillis(1).multipliedBy(10000000000)` throws ArithmeticException ("Calculation
overflows an int: 10000000000000000") where Java gives PT2777H46M40S, ten million seconds;
`Duration.ofNanos(999999999).multipliedBy(10000000)` likewise (Java PT2777H46M39.99S).
`Duration.of(amount, MILLIS)` and `plus(amount, NANOS|MICROS|MILLIS)` go through the same
multiplication of the unit's nanoseconds and fail whenever nanos x amount passes 2^53 (about
9e9 milliseconds, some 104 days), while the result would be a few days of seconds. Found by
the Duration scaling property.
'''

