[[bug]]
id = "js-joda/31"
title = "DayOfWeek.plus is wrong for amounts near the safe-integer limit: Wednesday plus -(2^53 - 1) days is Monday, not Sunday"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDayOfWeekPlusNearTheSafeIntegerLimit"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
