upstream_issue = ""
fixed_in = ""
notes = '''
src/Instant.js: `_microsUntil` adds `secsDiff * 1e6` to `intDiv(end.nano() - this.nano(),
1000)` - two truncations of parts with opposite signs, so the total is floored - and the MILLIS
branch of `until` subtracts `toEpochMilli()` values, which are themselves floored. Java (JDK 9+)
truncates the exact difference toward zero: `Instant.EPOCH.until(Instant.ofEpochSecond(-1, 1),
MICROS)` is -999999 in Java and -1000000 here, `MILLIS` -999 against -1000, and the reverse
direction 999999 against 1000000; `Instant.ofEpochSecond(0, 1).until(Instant.ofEpochSecond(-1,
999999999), MILLIS)` (two nanoseconds) is 0 in Java and -1 here. NANOS and SECONDS and above are
right. Found by the Instant sub-second `until` property.
'''

