[[bug]]
id = "js-joda/4"
title = "ISO_ORDINAL_DATE, ISO_WEEK_DATE and BASIC_ISO_DATE lack Java's optional offset section, on output and on input"
kind = "contract"
severity = "low"
test = "TestHegelPinIsoDateVariantsCarryAnOptionalOffset"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Java's three date-only variants end in an optional offset (`+HH:MM:ss`/`Z`, and `+HHMMss`/`Z`
for BASIC_ISO_DATE), so formatting an OffsetDateTime appends its offset and parsing accepts one:
`ISO_ORDINAL_DATE.format(OffsetDateTime.parse("2021-01-01T00:00+01:00"))` is "2021-001+01:00",
`BASIC_ISO_DATE.format(...)` "20210101+0100", and `LocalDate.parse("20210101+0100",
BASIC_ISO_DATE)` is 2021-01-01. js-joda's formatters (src/format/DateTimeFormatter.js) have no
optional section: the offset is dropped on output and "unparsed text found at index 8" on input.
Found by the ISO date-variant formatter property.
'''

