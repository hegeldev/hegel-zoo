[[bug]]
id = "js-joda/11"
title = "Instant.until in MICROS or MILLIS floors instead of truncating toward zero: EPOCH.until(-999999999ns, MICROS) is -1000000"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinInstantUntilSubSecondUnitsTruncateTowardZero"
found = { commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c", version = "6.1.0", hegel = "0.4.5", date = "2026-09-18" }
