notes = '''
src/MathUtil.js `floorMod(x, y)` is `x - Math.floor(x / y) * y`; for x = -(2^53 - 1) and y = 7
the product `Math.floor(x / y) * y` is -9007199254740995, not representable as a double, and the
rounding puts the remainder off by one. `DayOfWeek.of(3).plus(-9007199254740991)` gives MONDAY
where the arithmetic (and Java with the same long) gives SUNDAY. The input is a safe integer,
inside the range the library documents, and the result is silently wrong rather than an
ArithmeticException. (Month.plus, which uses intMod, is right at the same inputs.)
'''

