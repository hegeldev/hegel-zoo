name = "js-joda"
language = "typescript"
upstream = "https://github.com/js-joda/js-joda"
subdir = "packages/core"
license = "BSD-3-Clause"
ai_policy_checked = "2026-09-18"  # AGENTS.md (an agent overview of the monorepo, no restrictions), README, .github/ (two workflows), no CONTRIBUTING: nothing about AI

[base]
commit = "ce4665b0930da4d7e0bf0b18b97799206c960c9c"
date = "2026-08-24"
version = "6.1.0"

[hegel]
version = "0.4.5"

[run]
# @js-joda/core's src/ is ES modules with extension-less imports, built by rollup + babel
# upstream (dist/ is not committed). The setup installs Hegel and esbuild under .hegel/ and
# hegel/build.mjs bundles src/js-joda.js to .hegel/dist/js-joda.mjs; the tests import that. The
# oracle is java.time itself: hegel/Oracle.java is started once per test file with the JDK's
# source launcher (`java hegel/Oracle.java`, JDK 11+; the CI runner image ships a JDK) and
# answers one line per request.
setup = [
  "npm install --prefix .hegel --ignore-scripts --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5 esbuild@0.28.2",
  "node hegel/build.mjs",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

