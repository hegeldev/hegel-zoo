name = "jsondiffpatch"
language = "typescript"
upstream = "https://github.com/benjamine/jsondiffpatch"
subdir = "packages/jsondiffpatch"
license = "MIT"
ai_policy_checked = "2026-09-15"  # README, docs/, .github: no AI policy (no CONTRIBUTING/AGENTS files)

[base]
commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a"
date = "2026-05-14"
version = "0.7.6"

[hegel]
version = "0.4.5"

[run]
# The repository is an npm workspace root (packages/jsondiffpatch, packages/diff-mcp, demos);
# an `npm install` inside the package would resolve the whole workspace dev tree, so the
# install goes to the root with workspaces off: Hegel, the package's one runtime dependency
# (@dmsnell/diff-match-patch, the lock's 1.1.0), @types/node for the package's tsconfig and
# fast-json-patch 3.1.1 as the RFC 6902 oracle. lib/ is not in the repository: it is built
# with the package's own tsconfig (TypeScript 5.8.2, the lock's version) and the tests import ../lib/.
setup = [
  "npm install --prefix ../.. --no-audit --no-fund --no-save --no-package-lock --omit=dev --workspaces=false @hegeldev/hegel@0.4.5 @dmsnell/diff-match-patch@1.1.0 @types/node@25.6.1 fast-json-patch@3.1.1",
  "npx --yes -p typescript@5.8.2 tsc -p tsconfig.json --noCheck --declaration false",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
PinJsondiffpatch1PrototypePropertyNamesAreMisdiffed = "jsondiffpatch/1"
PinJsondiffpatch2CloneThrowsOnRegExpWithSFlag = "jsondiffpatch/2"
PinJsondiffpatch3PatchTurnsFlaglessRegExpIntoString = "jsondiffpatch/3"
PinJsondiffpatch4PlainInstanceUsesLeakedDiffMatchPatch = "jsondiffpatch/4"
PinJsondiffpatch5ReverseMisplacesNestedItemDeltas = "jsondiffpatch/5"
PinJsondiffpatch6OwnJsonPatchApplierRejectsDashKey = "jsondiffpatch/6"
PinJsondiffpatch7ObjectsWithATPropertyCannotBePatched = "jsondiffpatch/7"
PinJsondiffpatch8EqualRegExpsGetAModificationDelta = "jsondiffpatch/8"
PinJsondiffpatch9RegExpAgainstObjectIsDiffedAsAnEmptyObject = "jsondiffpatch/9"
