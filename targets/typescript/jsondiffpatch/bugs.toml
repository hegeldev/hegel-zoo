# Bugs found in jsondiffpatch (benjamine/jsondiffpatch) by the Hegel zoo. ids are jsondiffpatch/N;
# see README.md for the properties and test/hegel.test.mjs (in hegel.patch) for the pins. The
# oracles are the library's own inverse pairs, an LCS model and fast-json-patch (RFC 6902).

[[bug]]
id = "jsondiffpatch/1"
title = "properties named after Object.prototype members are not diffed, or make diff throw"
kind = "wrong-result"
severity = "medium"
test = "PinJsondiffpatch1PrototypePropertyNamesAreMisdiffed"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`diff({}, {toString: 1})` is `undefined`: the objects filter detects added properties with `typeof left[name] === "undefined"`, and `left.toString` is the inherited function. `diff({constructor: 0}, {})` throws "functions are not supported": the child context compares `0` with `right.constructor`, the inherited `Object`. The same inherited reads make the html and annotated formatters render "cannot format delta type: unknown" for any object that has such a property (they iterate the left object's keys and read `delta[key]`). Any of `constructor`, `toString`, `hasOwnProperty`, `valueOf`, `isPrototypeOf`, `propertyIsEnumerable`, `toLocaleString` does it; JSON.parse produces such objects happily. Found by TestHegelPatchUnpatchAndReverseInvertDiff (about 3% of its cases with the generator's 3% rate of such names).
'''

[[bug]]
id = "jsondiffpatch/2"
title = "clone throws \"Invalid RegExp\" for a RegExp with the s, d or v flag"
kind = "crash"
severity = "low"
test = "PinJsondiffpatch2CloneThrowsOnRegExpWithSFlag"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`clone(/a/s)` throws: `cloneRegExp` parses `re.toString()` with `/^\/(.*)\/([gimyu]*)$/`, which does not know the `s` (dotAll, ES2018), `d` (hasIndices, ES2022) and `v` (unicodeSets, ES2024) flags, so the match fails. `new RegExp(re.source, re.flags)` would clone any RegExp. Found by TestHegelDatesRegExpsAndCloneRoundTrip.
'''

[[bug]]
id = "jsondiffpatch/3"
title = "patch turns a RegExp without flags (or with s, d, v) into its string"
kind = "wrong-result"
severity = "low"
test = "PinJsondiffpatch3PatchTurnsFlaglessRegExpIntoString"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`diff(/a/, /b/)` is `["/a/", "/b/"]` (RegExps are diffed as their strings); `patch(/a/, delta)` rebuilds the RegExp only when the new string matches `/^\/(.*)\/([gimyu]+)$/`, which needs at least one flag and knows none of `s`, `d`, `v` — otherwise the result is the string `"/b/"`. So a RegExp property loses its type on patch unless its new value has a flag from `gimyu`. Found by TestHegelDatesRegExpsAndCloneRoundTrip.
'''

[[bug]]
id = "jsondiffpatch/4"
title = "the diff-match-patch instance is cached process-wide, so plain instances produce text diffs"
kind = "wrong-result"
severity = "low"
test = "PinJsondiffpatch4PlainInstanceUsesLeakedDiffMatchPatch"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`filters/texts.ts` keeps `cachedDiffPatch` at module level: once any instance with `textDiff.diffMatchPatch` (or the `jsondiffpatch/with-text-diffs` entry point) has diffed a long string, `create()` without the option produces `[unidiff, 0, 2]` deltas for long strings too, instead of the documented `[left, right]`. Those deltas make `formatters/jsonpatch.format` throw ("JSONPatch (RFC 6902) doesn't support text diffs, disable textDiff option" — for an instance that never enabled it) and cannot be applied by a consumer without the library. The cache should live on the instance (or be keyed by the library passed). Pinned: the pin primes the cache with the text-diff entry point and diffs with a plain instance.
'''

[[bug]]
id = "jsondiffpatch/5"
title = "reverse misplaces nested item deltas in array deltas with insertions, deletions or moves, so unpatch corrupts the array"
kind = "wrong-result"
severity = "high"
test = "PinJsondiffpatch5ReverseMisplacesNestedItemDeltas"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
With `objectHash: o => String(o.id)`, `a = [{id: 0, v: 1}]`, `b = [{id: 2, v: 0}, {id: 1, v: 0}, {id: 0, v: 1}, {id: 0, v: 2}]`: `diff(a, b)` is `{0: [..], 1: [..], 2: [..], 3: {v: [1, 2]}, _t: "a"}` (three insertions and the matched item changed at index 3). `reverse` puts the item delta at index 1 instead of 0, and `unpatch(b, delta)` returns `[{id: 0, v: 2}, undefined]` instead of `a`. `reverseArrayDeltaIndex` walks the sibling operations and compares each one's index with the *running* `reverseIndex` it is adjusting (`deleteIndex <= reverseIndex`, `Number.parseInt(deltaIndex) <= reverseIndex`, the move conditions) instead of the original index, so from the second sibling on the comparison is off by the adjustments already made. Deletions before the item and moves across it are miscounted the same way, with or without move detection, and a plain modification of a position-matched item (`[old, new]` at a right index, e.g. `{}` → `[]` with `matchByPosition`) is misplaced like a nested delta; `patch(a, reverse(reverse(delta)))` and the JSON-Patch of the reversed delta are wrong for the same cases. Found by TestHegelPatchUnpatchAndReverseInvertDiff and TestHegelArrayDeltasAreLcsMinimalAndWellFormed (about 3% of the cases with objectHash lists).
'''

[[bug]]
id = "jsondiffpatch/6"
title = "the bundled RFC 6902 applier rejects a \"-\" property name as the end-of-array token"
kind = "wrong-result"
severity = "low"
test = "PinJsondiffpatch6OwnJsonPatchApplierRejectsDashKey"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`formatters/jsonpatch.format(diff({}, {"-": 1}))` is `[{op: "add", path: "/-", value: 1}]`, which RFC 6902 reads as adding the property `-` of the root object (`-` is the end-of-array token only when the parent is an array; fast-json-patch applies it); `formatters/jsonpatch.patch({}, ops)` throws "JSONPatch 'add' with '-' requires array target", and `remove`/`replace`/`move` on such a path throw "path cannot end with '-'". The applier should look at the parent's type before treating the last segment specially. Found by TestHegelJsonPatchFormatterMatchesRfc6902.
'''

[[bug]]
id = "jsondiffpatch/7"
title = "objects with a property named _t get a delta that patch refuses"
kind = "wrong-result"
severity = "low"
test = "PinJsondiffpatch7ObjectsWithATPropertyCannotBePatched"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`diff({_t: 1}, {_t: 2})` is `{_t: [1, 2]}`; `patch({_t: 1}, delta)` throws "patch failed": `_t` is the delta format's array marker, so the objects patch filter skips the delta (`_t` is truthy) and the arrays filter refuses it (`_t !== "a"`). `diff` produces it without complaint; the property name is unremarkable JSON. The format should escape such names or `diff` should reject them. Found while probing the delta format's reserved key.
'''

[[bug]]
id = "jsondiffpatch/8"
title = "two equal RegExp objects get a modification delta"
kind = "wrong-result"
severity = "low"
test = "PinJsondiffpatch8EqualRegExpsGetAModificationDelta"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`diff(/a/i, /a/i)` is `["/a/i", "/a/i"]` — a change from a value to itself — because the trivial filter compares RegExps only by reference and then emits their strings unconditionally, while Dates are compared by `getTime`. Any object graph holding a RegExp diffs as changed when compared with a copy of itself (e.g. after `clone`). Found by TestHegelDatesRegExpsAndCloneRoundTrip.
'''

[[bug]]
id = "jsondiffpatch/9"
title = "a RegExp against a plain object is diffed as an empty object"
kind = "wrong-result"
severity = "medium"
test = "PinJsondiffpatch9RegExpAgainstObjectIsDiffedAsAnEmptyObject"
found = { commit = "a60db8a232f92ee4b987c14f43f77402885d1a5a", version = "0.7.6 (2026-05-14)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`diff({}, /a/)` is `undefined` and `diff({x: 1}, /a/)` is `{x: [1, 0, 0]}`, so `patch` gives `{}` for both instead of the RegExp; `diff(/a/, {x: 1})` is `{x: [1]}` and patching it decorates the RegExp with a property. The trivial filter only handles a RegExp when the *left* value is one and the right is also a RegExp (or, for a left RegExp against a non-RegExp, a replacement); a RegExp on the right against a plain object falls through to the objects filter, which sees no enumerable own properties. Dates are handled on either side by the dates filter; RegExps should be too. Found by TestHegelDatesRegExpsAndCloneRoundTrip.
'''
