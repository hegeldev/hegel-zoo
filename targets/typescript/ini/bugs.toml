# Bugs found in ini (npm/ini) by the Hegel zoo. ids are ini/N; see README.md for the properties.

[[bug]]
id = "ini/1"
title = "the strings true, false and null do not round-trip: encode writes them bare and decode turns them into the JSON values"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLiteralStringsBecomeValues"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`safe()` leaves `true`/`false`/`null` unquoted (it quotes only on `=`, CR/LF, a leading `[`, surrounding quotes or outer whitespace) and `decode` JSON-parses exactly those three bare words, so `{a: "true"}` comes back as `{a: true}` — and a config edited by hand cannot say the string `"null"` without quoting it, which the encoder never does. Every other value type is stringly (numbers come back as their decimal text, documented in the README under Not bugs); this one silently changes type.
'''

[[bug]]
id = "ini/2"
title = "a key containing = is quoted by safe() but the decoder splits the line at the first =, so the key and the value are both wrong"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinKeyWithEqualsSplits"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`encode({"a=b": "v"})` writes `"a=b"=v`; `decode`'s line regex is `^([^=]+)(=(.*))?$`, which takes `"a` as the key and `b"=v` as the value, and `unsafe` does not unquote either half. Quoting a key is the encoder's own escaping mechanism, so this is the round trip of the library with itself. Section names with `=` are fine (`["a=b"]` is matched by the section regex first).
'''

[[bug]]
id = "ini/3"
title = "a key ending in [] is read back as an array key, so an object with the key a[] and the value v becomes {a: [v]}"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinKeyEndingInBracketsBecomesAnArray"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`safe()` does not escape or quote a trailing `[]`, which is the encoder's own array marker (`k[]=v`), so any key that happens to end in `[]` is turned into an array under the shorter name by `decode` (with `bracketedArray` on, the default). A quoted key does not help: the check runs on the unquoted key.
'''

[[bug]]
id = "ini/4"
title = "a section whose name contains a dot keeps the backslash escape when it has sub-sections: {'a.b': {c: {...}}} comes back under a key that still carries the backslash escape"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDottedSectionWithChildrenKeepsTheEscape"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`encode` escapes dots in section names as `\.` and joins nested sections with `.` (`[a\.b.c]`); `decode`'s merge pass splits the header on unescaped dots, unescapes only the *last* part (`nl = l.replace(/\\./g, '.')`) and looks the earlier parts up verbatim, so the child lands under a fresh `a\.b` object next to the properly named `a.b` section. A dotted section with only scalars round-trips.
'''

[[bug]]
id = "ini/5"
title = "a backslash before a backslash, semicolon or hash is lost: safe() escapes ; and # but never the backslash itself, and unsafe() eats it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBackslashBeforeSemicolonIsLost"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`safe('x\\;y')` writes `x\\\;y` (the `;` escaped, the original backslash kept as is); `unsafe` reads `\\` + `\;` as an escaped backslash followed by a comment start and stops: the value is `x\\`. Likewise `a\\\\b` (two backslashes) comes back with one and `\\#` loses the backslash. Windows paths and regexes in values are the everyday case; the README documents `safe`/`unsafe` as inverses.
'''

[[bug]]
id = "ini/6"
title = "a section name containing ] cannot be read back: the header line is parsed as a key with the value true"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSectionNameWithBracketIsUnreadable"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`encode` writes `[a]b]` (or `["a]b"]` when quoted for another reason); `decode`'s section regex `^\[([^\]]*)\]\s*$` cannot match a `]` inside, the line falls through to the key regex and becomes the key `[a]b]` with the value `true`, and the section's entries are attached to whatever section came before. `safe()` should quote (or reject) `]` in section names; it quotes `=` and a leading `[` already.
'''

[[bug]]
id = "ini/7"
title = "a null value under a dotted key at the top level is treated as a section and split: a.b = null becomes {a: {b: null}}"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNullUnderDottedKeyBecomesASection"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The merge pass that folds `[a.b]` sections into `a` tests `typeof out[k] !== 'object'` to skip scalars, and `typeof null === 'object'`, so a global `a.b=null` is split on the dot like a section header. Only top-level (section-less) keys are affected; the same key inside a section is left alone.
'''

[[bug]]
id = "ini/8"
title = "a lone single quote becomes the empty string: unsafe(''') strips it as a quoted value and safe() does not quote it"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLoneQuoteBecomesEmpty"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`isQuoted` is true for a one-character `'` (it starts and ends with a quote), so `unsafe` slices it to `''`, fails to JSON-parse the empty string and returns it; `safe` only quotes quoted-looking strings when they are longer than one character. A lone `"` survives (the JSON parse fails and the original is kept). Affects keys and values.
'''

[[bug]]
id = "ini/9"
title = "with bracketedArray off, duplicate keys are counted over the whole file, so a key repeated in another section comes back as an array there"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDuplicateKeysAreCountedAcrossSections"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`decode`'s `duplicates` map is keyed by the raw key only and never reset at a section header, so `a=1` in the globals and `a=2` under `[s]` make the second an array `["2"]` — `encode(decode(x))` of the most ordinary INI file (the same key in several sections, `bracketedArray: false` to match parsers that use repetition for arrays) changes its shape. The README says duplicate names are arrays; it means within a section.
'''

[[bug]]
id = "ini/10"
title = "with bracketedArray off, a repeated key that ends in [] loses its name: the second value lands under the empty key"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRepeatedBracketKeyLosesItsName"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
In the non-bracketed branch `isArray` is set by the duplicate count, and the following `key = isArray && keyRaw.endsWith('[]') ? keyRaw.slice(0, -2) : keyRaw` still strips a trailing `[]` — meant for the bracketed mode — so `k[]=1`, `k[]=2` gives `{"k[]": "1", k: ["2"]}`, and a key that is just `[]` gives the empty key. The bracket check should only run when `bracketedArray` is on.
'''

[[bug]]
id = "ini/11"
title = "a backslash before a dot in a section name is read back as an escaped dot, and a section name ending in a backslash swallows the dot before its sub-sections"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBackslashDotInSectionNameIsAnEscape"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`encode` escapes the dots of a section name as `\.` but leaves the name's own backslashes alone, so `{"a\\.b": {...}}` writes `[a\.b]`, which `decode` reads as the escaped dot of `a.b`, and `{"a\\": {b: {...}}}` writes `[a\.b]` for the nested section, read as one section `a.b`. The `section` option is not escaped at all, so `{section: "s\\"}` does the same. (Leaf keys are fine: only headers are split on dots.)
'''

[[bug]]
id = "ini/12"
title = "an empty key is written as =value, a line the decoder skips"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyKeyIsWrittenUnreadably"
found = { commit = "3c96c74fd42584bd655e17a4e63e2ef0a3b406ee", version = "7.0.0 (v7.0.0+, main 2026-06-18)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`safe('')` returns `''`, so `encode({"": "v"})` writes `=v`; `decode`'s key regex needs at least one character before the `=`, the line matches nothing and is dropped, and the key is gone. `safe` should quote the empty string (`""`), which `unsafe` already reads back as `''`.
'''
