name = "smol-toml"
language = "typescript"
upstream = "https://github.com/squirrelchat/smol-toml"
subdir = ""
license = "BSD-3-Clause"
ai_policy_checked = "2026-09-16"  # README, .github/workflows: no CONTRIBUTING, no AI policy

[base]
commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3"
date = "2026-08-11"
version = "1.8.0"

[hegel]
version = "0.4.5"

[run]
# package.json declares `devEngines.packageManager = pnpm` with onFail = "error", so npm refuses to
# install anything into the package itself: Hegel and the TypeScript compiler go under .hegel/
# (`npm install --prefix`, one line so the second install does not prune the first), and the
# harness imports Hegel from there. The sources import each other as `./x.js`, so they are
# compiled (not type-stripped) into .hegel/dist with the pinned TypeScript; test/tsconfig.hegel.json
# spells out the options of the @tsconfig/* presets upstream extends. The parse properties need
# python3 >= 3.11 (tomllib, stdlib).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 typescript@5.9.3",
  "node .hegel/node_modules/typescript/bin/tsc -p test/tsconfig.hegel.json --noCheck",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinNegativeZeroFloatKeepsItsSign = "smol-toml/1"
TestHegelPinLowercaseZoneDesignatorIsNormalised = "smol-toml/2"
TestHegelPinNullInAnInlineTableIsIgnored = "smol-toml/3"
TestHegelPinUndefinedInAnInlineTableIsIgnored = "smol-toml/4"
TestHegelPinFunctionInAnArrayIsRejected = "smol-toml/4"
TestHegelPinLoneSurrogateIsNotWrittenAsAnEscape = "smol-toml/5"
TestHegelPinQuoteAfterLineEndingBackslashIsKept = "smol-toml/6"
TestHegelPinOnlySpaceAndTabAreWhitespace = "smol-toml/7"
TestHegelPinArrayElementsNeedCommasAfterAComment = "smol-toml/8"
TestHegelPinQuotedKeyWithEqualsIsFollowedByEquals = "smol-toml/9"
