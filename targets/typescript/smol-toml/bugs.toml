# Bugs found in smol-toml by the Hegel properties (see README.md). Each is pinned by the test named in
# `test` (test/hegel.test.mjs), which asserts the documented or specified behaviour and fails while the
# bug exists.

[[bug]]
id = "smol-toml/1"
title = "stringify writes the float -0.0 as 0.0 under numbersAsFloat, so the sign does not round-trip"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinNegativeZeroFloatKeepsItsSign"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
stringify.ts:86 renders an integral number as `val.toFixed(1)` when numbersAsFloat is set (or the
number is outside the safe range); Number.prototype.toFixed drops the sign of -0 ("0.0"). parse reads
`a = -0.0` as -0 (primitive.ts:232, `+value`), so `parse(stringify({a: -0.0}, {numbersAsFloat: true}))`
gives +0 although the README promises "end-to-end type preservation" with numbersAsFloat and TOML
has -0.0. (Without numbersAsFloat -0 is written as the integer 0, which is the documented loss.)
'''

[[bug]]
id = "smol-toml/2"
title = "TomlDate.toISOString() keeps a lowercase z zone designator as authored instead of normalising it"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinLowercaseZoneDesignatorIsNormalised"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
date.ts:61 captures the offset (`match[3]`) before the input is upper-cased at :62, so `new
TomlDate("1979-05-27T07:32:00z").toISOString()` is "1979-05-27T07:32:00.000z" while the same instant
written with "Z" (or a lowercase "t" separator, which is normalised) gives "...000Z"; the override of
Date.prototype.toISOString thus returns a string that is not in the ISO 8601 form the base method
guarantees, and stringify writes the lowercase z back into the document. Valid TOML, so nothing is
lost; inconsistent with the README's examples and with the `t` handling.
'''

[[bug]]
id = "smol-toml/3"
title = "stringify throws a TypeError for a null value in a table written inline (an element of a mixed array) instead of ignoring it"
kind = "crash"
severity = "medium"
test = "TestHegelPinNullInAnInlineTableIsIgnored"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README: "undefined and null values on objects are ignored (does not produce a key/value)".
stringifyTable (stringify.ts:167) does skip them, but stringifyInlineTable (:109-124) does not:
`extendedTypeOf(null)` is "object", stringifyValue dispatches to stringifyInlineTable(null) and
Object.keys(null) throws "TypeError: Cannot convert undefined or null to object".
`stringify({a: [{b: null, c: 1}, 2]})` throws; `stringify({a: [{b: null, c: 1}]})` (an array of
tables, written as [[a]]) works. Same for a null in a table nested in an inline table.
'''

[[bug]]
id = "smol-toml/4"
title = "stringify writes the bare word `undefined` for undefined, function and symbol values in inline tables and arrays, producing a document parse rejects"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinUndefinedInAnInlineTableIsIgnored"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
stringifyValue (stringify.ts:75-107) has no case for the types "undefined", "function" and "symbol"
and returns undefined, which the callers concatenate: `stringify({a: [{b: undefined, c: 1}, 2]})` is
"a = [ { b = undefined, c = 1 }, 2 ]" and `stringify({a: [() => 1]})` is "a = [ undefined ]" — both
rejected by parse ("invalid value"). The README says undefined values on objects are ignored and
functions, classes and symbols are rejected; stringifyTable (:169) does throw the TypeError for a
function at table level, inline tables and arrays do not. A second pin,
TestHegelPinFunctionInAnArrayIsRejected, covers the function/symbol half.
'''

[[bug]]
id = "smol-toml/5"
title = "stringify writes a lone surrogate as a \\uD800 escape, which is not valid TOML and which parse rejects"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinLoneSurrogateIsNotWrittenAsAnEscape"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
formatString (stringify.ts:64) is JSON.stringify, which (well-formed JSON.stringify, ES2019) writes a
lone surrogate code unit as "\ud800". TOML's \uXXXX escape must be a Unicode scalar value, and
parse rejects the escape at primitive.ts:147 ("invalid unicode escape"). A JavaScript string with a
lone surrogate cannot be carried by TOML at all, so stringify should throw (as it does for invalid
dates) or substitute U+FFFD; writing a document its own parser refuses is the worst of the options.
'''

[[bug]]
id = "smol-toml/6"
title = "A quote that follows a line-ending backslash in a multi-line basic string is dropped when it is one of the closing delimiter's extra quotes"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinQuoteAfterLineEndingBackslashIsKept"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a = """x\<LF>""""` must be `x"` (the string ends with four quotes, so the first belongs to the
content; the line-ending backslash trims only whitespace and newlines) and `a = """\<LF>  """""` is
`""`; smol-toml returns `x` and the empty string. In parseString (primitive.ts:111-122) the closing
delimiter is recognised while the parser is still in the whitespace-escape state (state 3); the
"ends with 4-5 quotes" rule then advances ctx.p over the extra quotes (:114-115) but the content is
appended only `if (!state)` (:119), so the extra quotes are lost. Python's tomllib and the
specification agree on `x"`.
'''

[[bug]]
id = "smol-toml/7"
title = "Any JavaScript whitespace after a number or date is accepted: a lone CR, form feed, vertical tab, NBSP, Unicode spaces or a BOM"
kind = "contract"
severity = "low"
test = "TestHegelPinOnlySpaceAndTabAreWhitespace"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
TOML whitespace is space and tab and a newline is LF or CRLF; everything else outside strings and
comments is invalid. parseValue (primitive.ts:208-253) takes the text up to the newline, comma or
closing bracket and calls sliceAndTrimEndOf, whose String.prototype.trimEnd() (:204) strips every
JavaScript whitespace character, so `a = 1\r` (a bare carriage return, also `a = 1\r# c`), `a = 1 `,
`a = 1\f`, `a = 1\v`, `a = 1﻿`, `a = 1979-05-27 ` and `a = [1\r, 2]` parse; the same characters
after a string or boolean are rejected ("each key-value declaration must be followed by an
end-of-line"), and tomllib rejects all of them.
'''

[[bug]]
id = "smol-toml/8"
title = "Inside an array, a comment after a number, date or boolean swallows the following lines up to the next comma or bracket, so a missing comma is not detected and elements (even table headers) are silently dropped"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinArrayElementsNeedCommasAfterAComment"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a = [ 1 # c\n 2 ]` parses as {a: [1]}, `a = [ 1 # c\n 2, 3 ]` as {a: [1, 3]} and `a = [ 1 # c\n
[b]\nx = 1` as {a: [1], x: 1}; all three are invalid TOML (tomllib: "Unclosed array" / missing comma).
parseValue (primitive.ts:208-215) collects the element's text with skipUntil up to the next comma or
closing bracket — skipComment at util.ts:107 skips the comment but the scan carries on across the
newline — and sliceAndTrimEndOf (:193-205) then cuts the slice at its first "#", so everything between
the comment and the next comma or "]" disappears. Elements that are strings, arrays or inline tables
take a different path (parseString/parseArray return at their own delimiter) and are diagnosed
("expected comma or end of structure").
'''

[[bug]]
id = "smol-toml/9"
title = "A quoted key containing \"=\" makes the parser skip to the next \"=\" in the document, accepting arbitrary text and dropping a key/value"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinQuotedKeyWithEqualsIsFollowedByEquals"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`"a=" junk\nb = 1` parses as {"a=": 1} (also `'a=' ]] junk\nb = 1`, and `x = { "a=" junk, b = 1 }`
as {x: {"a=": 1}}); tomllib rejects them ("Expected '=' after a key"). parseKey (struct.ts:43)
locates the end of the key with indexOf("=") before reading it, which lands inside the quoted part;
after parseString the "found extra tokens" check (:68-82) examines the slice from the string's end to
that stale position — empty — and :84-92 then re-searches "=" from the string's end without checking
what lies between, so the rest of the line, the newline and the next line's key are skipped and that
line's value is assigned to the quoted key. `"a=" = 1` itself is fine.
'''

[[bug]]
id = "smol-toml/10"
title = "An array-of-tables header closed by a single \"]\" followed by at most one other character before the line end is accepted instead of rejected"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinArrayOfTablesHeaderNeedsBothClosingBrackets"
found = { commit = "6d0f4774700c40ce8b5794934eb771870a9a93d3", version = "1.8.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`[[a]\n` parses as {a: [{}]} (also `[[a]`, `[[a]\r\n`, `[[a]\n\n`, `[[a]\n# c\n`, `x=1\n[[a]\n`);
`[[a]\r\nb=1\r\n` as {a: [{b: 1}]}, `[[a]\r\n[[a]]\r\n` as {a: [{}, {}]} and `[[a]\r\n[b]\r\n` as
{a: [{}], b: {}}; tomllib rejects all of them ("Expected ']]' at the end of an array declaration"),
and the specification's array-of-tables header is "[[" key "]]". In parse() (parse.ts:144-158)
parseKey(ctx, ']') consumes the key and the first "]"; the array-of-tables check at :150 then tests
toml.charCodeAt(ctx.p - 1) !== 0x5d, which is the "]" parseKey has just consumed, so it never
fires, and ctx.p++ at :157 skips whatever character follows unread: the second "]" when it is
there, otherwise the newline (or the CR of a CRLF, or the first character of a comment or key, or
any other single character: `[[a][\n`, `[[a]X\n`, `[[a]=\n`, `[[a]"\n` and `[[a]X # c\n` all parse as
{a: [{}]}). The end-of-line check that follows (skipVoid(ctx, true) at :184) sees what comes after
the skipped character, which is why `[[a]\nb=1\n`, `[[a]\n[b]\n`, `[[a]  \n`, `[[a]#c\n` and
`[[a]XY\n` are rejected while an LF followed by a blank line, a comment or the end of the document,
a CRLF followed by anything, and one stray character followed by whitespace, a comment or a line
end are accepted. The check should look at ctx.p. Found by the rewritten mutation property's
1000-case run: a deleted "]" in `[[MJJ.Z]]` left a document with three elements of MJJ.Z where
tomllib rejects; a later run met `[[toString][` (a "]" replaced by "[").
'''
