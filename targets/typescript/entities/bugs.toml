# Bugs found in entities by the Hegel properties in hegel.patch. Each is pinned by the test named in
# `test`, which fails while the bug is present.

[[bug]]
id = "entities/1"
title = "encodeHTML/encodeNonAsciiHTML write the C1 controls U+0080–U+009F as &#128;… — references that HTML, and the library's own decoder, read as the windows-1252 characters (€, ‚, ƒ …)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEncodeC1ControlsRoundTrip"
found = { commit = "0b16899dc04e08f7e8d9272c1365f36576f79113", version = "8.1.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The HTML "numeric character reference end state" maps 27 values in 0x80–0x9F to windows-1252
(`&#128;` is U+20AC €, `&#154;` is U+0161 š …; entities' `replaceCodePoint` implements exactly this
table), so no numeric reference can denote U+0080 itself in HTML. `encodeHTML("a\\u0080b")` still
returns `a&#128;b`, which `decodeHTML` (and every browser) turns into `a€b`; the same for
`encodeNonAsciiHTML` and `encode(s, EntityLevel.HTML)`. Only 0x81, 0x8D, 0x8F, 0x90 and 0x9D
survive (they have no remap). `he.encode`, which the readme credits as the inspiration, leaves
these controls as literal characters for this reason. `encodeXML` is unaffected: XML has
no remap and `decodeXML(encodeXML(s))` is the identity. C1 controls in text are rare (usually a
mis-decoded windows-1252 byte, in which case the remap is what the reader wants), hence low.
'''

[[bug]]
id = "entities/2"
title = "EntityDecoder emits the two UTF-16 units of an astral named entity (&Aopf; → 0xD835, 0xDD38) although emitCodePoint is documented as receiving code points, and numeric references arrive as one"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStreamingEmitsCodePoints"
found = { commit = "0b16899dc04e08f7e8d9272c1365f36576f79113", version = "8.1.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The constructor's parameter is described as "the function that is called when a codepoint is
decoded. For named entities that decode to multiple code points, this will be called multiple
times, with the second codepoint, and the same `consumed` value." The trie stores values as UTF-16
units and the streaming path emits them one by one, so every astral named entity (the ~150
mathematical alphanumerics such as &Aopf; &afr; &fopf;) produces two calls with a high and a low
surrogate, while `&#x1D538;` produces one call with 0x1D538 and `&nvlt;` two calls with U+003C and
U+20D2 as documented. A consumer that concatenates `String.fromCodePoint(cp)` gets the right string
(which is why htmlparser2 is unaffected); one that inspects the code point, counts characters or
validates it sees surrogates. The one-shot decoders are not affected.
'''
