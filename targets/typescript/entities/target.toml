name = "entities"
language = "typescript"
upstream = "https://github.com/fb55/entities"
subdir = ""
license = "BSD-2-Clause"
ai_policy_checked = "2026-09-17"  # readme.md, SECURITY.md, .github/ (workflows, dependabot, funding): no AI policy

[base]
commit = "a3b8b1c46533454b7093e94b9bc3a93d8bd70243"
date = "2026-09-18"
version = "8.1.0"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript (upstream builds with tsc); hegel/build.mjs bundles src/index.ts and
# src/decode.ts (the `entities/decode` entry) with the esbuild binary into .hegel/dist/. Hegel,
# esbuild and the second-opinion decoder `he` (a devDependency upstream) go under .hegel/; entities
# has no runtime dependencies.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 esbuild@0.25.9 he@1.2.0",
  "node hegel/build.mjs",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinEncodeC1ControlsRoundTrip = "entities/1"
TestHegelPinStreamingEmitsCodePoints = "entities/2"
