# Bugs found in qs (ljharb/qs) by the Hegel zoo. ids are qs/N; see README.md for the properties.

[[bug]]
id = "qs/1"
title = "the comma arrayFormat writes its separators percent-encoded, so parse with comma: true never splits the array it wrote"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommaArraysAreEncoded"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`stringify({a: ['b', 'c']}, {arrayFormat: 'comma'})` gives `a=b%2Cc` (the joined string goes through the encoder like any value); `parse('a=b%2Cc', {comma: true})` looks for a raw comma in the still-encoded value (`parseArrayValue` runs before decoding) and returns the string `b,c`. The README shows this call producing `a=b,c` and says `commaRoundTrip` makes single-element arrays round-trip 'through a parse'; with the default `encode: true` no array of two or more elements does. Only `encodeValuesOnly: true` (which encodes the elements and leaves the joining commas raw, `a=c%2Cd,e`) or `encode: false` round-trip.
'''

[[bug]]
id = "qs/2"
title = "under iso-8859-1 a plus sign is written bare and read back as a space"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPlusIsBareUnderLatin1"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The iso-8859-1 encoder is `escape()`, which leaves `@*_+-./` alone, so `stringify({a: '1+1'}, {charset: 'iso-8859-1'})` is `a=1+1`; the decoder (both charsets) first turns `+` into a space, so it comes back as `1 1`. The utf-8 encoder writes `%2B`. RFC1738 formatting makes it worse: spaces become `+` and are then indistinguishable from real pluses.
'''

[[bug]]
id = "qs/3"
title = "a lone surrogate in a string is fused with the following code unit into one four-byte sequence, so the next character is swallowed"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLoneSurrogateSwallowsTheNextCharacter"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`utils.encode` treats any code unit in D800-DFFF as the start of a pair and combines it with the next one without checking that it is a low surrogate: `stringify({a: 'x\ud800y'})` gives `a=x%F0%90%81%B9`, which decodes to `x` plus U+10079. A lone low surrogate does the same. `encodeURIComponent` throws URIError here; writing U+FFFD or the WTF-8 bytes would keep the following character.
'''

[[bug]]
id = "qs/4"
title = "a key containing [ or ] cannot be written: the parser turns %5B and %5D back into brackets before splitting keys"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBracketInKeyIsUnwritable"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The encoder writes `[` and `]` as `%5B`/`%5D` like any other reserved character, but `parseValues` starts with `cleanStr.replace(/%5B/gi, '[').replace(/%5D/gi, ']')`, so the escaping is undone before the key is split into segments: `{'a[b': 'v'}` comes back as `{a: {'[b': 'v'}}` and `{c: {'d]e': 'w'}}` as `{c: {d: 'w'}}` (the `]` ends the segment and the rest of the text is dropped). There is no encoding of a key that survives, which the round trip of the library with itself exposes.
'''

[[bug]]
id = "qs/5"
title = "interpretNumericEntities decodes &#N; in values only, so a key written under iso-8859-1 with a character above U+00FF comes back as entity text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEntitiesInKeysAreNotInterpreted"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`stringify({'k✓': 'v✓'}, {charset: 'iso-8859-1'})` writes both the key and the value with `%26%2310003%3B` (the README: characters outside iso-8859-1 become numeric entities). `parse(..., {charset: 'iso-8859-1', interpretNumericEntities: true})` applies `interpretNumericEntities` to `val` only, so the value is `v✓` and the key is the literal `k&#10003;`.
'''

[[bug]]
id = "qs/6"
title = "sort is applied to array indices as strings, so under brackets or repeat an array of eleven or more elements is written out of order"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSortReordersArrays"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`stringify` sorts `Object.keys(obj)` with the user's comparator for arrays too; with a plain string comparison the indices come out `0, 1, 10, 2, ...`. Under `indices` the positions are explicit and the order is harmless; under `brackets` and `repeat` the position is the order of appearance, so `[0..10]` reads back as `['0', '1', '10', '2', ...]`. The comparator is documented for parameter keys; array indices should keep their numeric order (or not be sorted at all).
'''

[[bug]]
id = "qs/7"
title = "with allowEmptyArrays a[]= (an array holding one empty string, as brackets writes it) parses as an empty array"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEmptyStringElementReadsAsEmptyArray"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`parseObject` maps a `[]` segment with an empty leaf to `[]` whenever `allowEmptyArrays` is on (`leaf === ''`, or `null` with strictNullHandling), without distinguishing `a[]` (what `stringify({a: []}, {allowEmptyArrays: true})` writes) from `a[]=` (what it writes for `{a: ['']}` under brackets, or for `{a: ['']}` with comma and commaRoundTrip). The two strings are distinct and only one of them can mean the empty array. `a[0]=` under indices reads back correctly.
'''

[[bug]]
id = "qs/8"
title = "with encodeValuesOnly, encodeDotInKeys writes a dot as %2E once, which the parser percent-decodes to a dot before it splits the key"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDotInKeyIsSingleEncodedWithEncodeValuesOnly"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`stringify({'a.b': '1'}, {encodeDotInKeys: true, encodeValuesOnly: true})` is `a%2Eb=1` (the README's caveat says only dots in keys are encoded then). On the way back `parseValues` percent-decodes the key to `a.b` and then `decodeDotInKeys` (which implies `allowDots`) splits it into `{a: {b: '1'}}`; `decodeDotInKeys` only recognises the double-encoded `%252E` that the default encoding produces. The same happens with `encode: false`.
'''

[[bug]]
id = "qs/9"
title = "with plainObjects or allowPrototypes a [__proto__] segment leaves an empty object where the key was"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinProtoSegmentLeavesAnEmptyObject"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`parse('a[__proto__]=1')` is `{}`: `splitKeyIntoSegments` refuses the key. With `plainObjects: true` (or `allowPrototypes: true`) that guard is skipped and the `__proto__` segment is dropped one level down, in `parseObject`, which leaves `{a: {}}`. The value is (rightly) not assigned, but the empty container is a trace of the rejected key that `stringify` cannot even write back (an empty object produces nothing), so parse is not a normal form there.
'''

[[bug]]
id = "qs/10"
title = "with allowEmptyArrays the k[] of an empty array is written without the encoder, so a key containing & (or =, +, %XX) breaks the query string"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEmptyArrayKeyIsNotEncoded"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`stringify` returns `adjustedPrefix + '[]'` for an empty array, and `adjustedPrefix` is the raw key path (only `encodeDotInKeys` touches it); every other line goes through `encoder`. `stringify({'a&b': []}, {allowEmptyArrays: true})` is `a&b[]`, which parses as `{a: '', b: []}`; `{'a b': []}` is `a b[]` (unencoded space), `{'x=y': []}` splits at the `=`. The README example `foo[]&bar=baz` only shows a safe key.
'''

[[bug]]
id = "qs/11"
title = "encodeDotInKeys re-encodes the dots of the prefix at every level, including the allowDots separator, so nesting three levels deep collapses"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDotSeparatorIsReencodedBelowTwoLevels"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
At each level `stringify` computes `encodedPrefix = prefix.replace(/\./g, '%2E')`, but the prefix it receives from the level above already contains the `.` that `allowDots` inserted as a separator (`a.b`). So `stringify({a: {b: {c: '1'}}}, {allowDots: true, encodeDotInKeys: true})` is `a%252Eb.c=1`, which parses (with `decodeDotInKeys`) as `{'a.b': {c: '1'}}`; `{a: [{b: {c: '1'}}]}` becomes `a%5B0%5D%252Eb.c=1` and reads back as `{a: [{c: '1'}]}`, the key `b` gone. Two-level objects (the README's example) are fine because the top-level prefix has no separator yet.
'''

[[bug]]
id = "qs/12"
title = "under iso-8859-1 with interpretNumericEntities a comma-split value is joined back into one string"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinEntityInterpretationRejoinsCommaArrays"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`parseValues` splits the value on commas (`comma: true`) and decodes the pieces, then runs `val = interpretNumericEntities(String(val))` when the charset is iso-8859-1 and `interpretNumericEntities` is on; `String(['b', 'c'])` is `b,c`, so `parse('a=b,c', {comma: true, charset: 'iso-8859-1', interpretNumericEntities: true})` is `{a: 'b,c'}` where the same call without `interpretNumericEntities` gives `{a: ['b', 'c']}`. The same happens when the charset comes from the `utf8=%26%2310003%3B` sentinel. Elements that contained an encoded comma are merged into their neighbours as well. The entity replacement should be mapped over the array (as the decoder is, with `utils.maybeMap`).
'''

[[bug]]
id = "qs/13"
title = "with comma: true a comma-split value under an empty-bracket key (a[]=x,y) is wrapped before the arrayLimit check, so the inner array escapes the limit"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommaGroupUnderEmptyBracketEscapesArrayLimit"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
notes = '''
`parseValues` (lib/parse.js) wraps the value of an empty-bracket key (`val = isArray(val) ? [val] : val`) before the `options.comma && isArray(val) && val.length > options.arrayLimit` check, so the check sees a one-element outer array and the inner array keeps every element: `parse('a[]=x,y', {comma: true, arrayLimit: 1})` is `{a: [['x', 'y']]}` and with `arrayLimit: 0` it is `{a: {0: ['x', 'y']}}`, where `parse('a[0]=x,y', {comma: true, arrayLimit: 1})` is `{a: [{0: 'x', 1: 'y'}]}` and `parse('a=x,y', ...)` is `{a: {0: 'x', 1: 'y'}}`. With `throwOnLimitExceeded: true` the same input throws (the comma count is checked at the split), so the README's promise that each comma group under `a[]=` holds at most `arrayLimit` elements is kept only in the throwing mode; without it a single parameter builds an array of any length. Found by TestHegelParseIsANormalForm (re-parsed with indices the inner array becomes an object); the old test had seen it about once in 8 000 cases as an unexplained failure.
'''

[[bug]]
id = "qs/14"
title = "with arrayFormat comma and encodeValuesOnly the array elements are encoded without the charset, so under iso-8859-1 a character above U+007F is written as utf-8 bytes instead of an entity"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommaWithEncodeValuesOnlyIgnoresCharset"
found = { commit = "07b1d4d82c8f9301c105ea4b94fa2302cfd6e8b4", version = "6.16.0 (v6.16.0+, main 2026-09-11)", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
notes = '''
`stringify` (lib/stringify.js) pre-encodes the elements of a comma array under `encodeValuesOnly` with `encoder(v)` alone, without the `defaults.encoder, charset, 'value', format` arguments every other value gets, and then passes `null` as the encoder for the joined string. So `stringify({a: ['\u5168']}, {arrayFormat: 'comma', encodeValuesOnly: true, charset: 'iso-8859-1'})` is `a=%E5%85%A8`, where `{a: '\u5168'}` and the same array under `indices` write `a=%26%2320840%3B`; `['\u5168', '\u00e9']` gives `a=%E5%85%A8,%C3%A9` (the Latin-1 character too: `%C3%A9` instead of `%E9`). Parsed back under iso-8859-1 the value is mojibake (`\u00e5\u0085\u00a8`, `\u00c3\u00a9`). The format is unaffected, since the joined string goes through the formatter (`['a b']` is `a=a+b` under RFC1738). Found by TestHegelParseUndoesStringify once its generator stopped excluding every non-Latin-1 string under iso-8859-1.
'''
