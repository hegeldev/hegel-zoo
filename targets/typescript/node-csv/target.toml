name = "node-csv"
language = "typescript"
upstream = "https://github.com/adaltas/node-csv"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, CONTRIBUTING.md, .github/: no AI policy

[base]
commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea"
date = "2026-09-06"
version = "csv-parse 6.8.3, csv-stringify 7.0.2"

[hegel]
version = "0.4.5"

[run]
# packages/csv-parse/lib and packages/csv-stringify/lib are plain ES modules without runtime
# dependencies; only Hegel is installed, under .hegel/. The oracle is Python's csv module (stdlib,
# python3 on PATH).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinLineBreaksInFieldsAreQuoted = "node-csv/1"
TestHegelPinLoneEmptyFieldIsQuoted = "node-csv/2"
TestHegelPinEscapedFormulaPrefixIsEscaped = "node-csv/3"
TestHegelPinFromLineAfterACommentLine = "node-csv/4"
TestHegelPinCRLFInAQuotedFieldIsOneLine = "node-csv/5"
TestHegelPinDelimiterDiscoveryBeyondASCII = "node-csv/6"
TestHegelPinRawHoldsTheWholeRecordDelimiter = "node-csv/7"
TestHegelPinCastLeavesPrefixedNumeralsAlone = "node-csv/8"
TestHegelPinDelimiterDiscoveryOnAnEmptyStream = "node-csv/9"
TestHegelPinStreamWaitsForTheDelimiterAfterAQuote = "node-csv/10"
TestHegelStringifyParseRoundTrip = { bug = "node-csv/1", intermittent = true }
TestHegelStringifyOutputReadByPython = { bug = "node-csv/2", intermittent = true }
TestHegelParseMatchesTheModel = { bug = "node-csv/5", intermittent = true }
TestHegelDelimiterDiscovery = "node-csv/6"
TestHegelHostileInputNeverCrashes = { bug = "node-csv/6", intermittent = true }
TestHegelStreamMatchesOneShot = { bug = "node-csv/10", intermittent = true }
TestHegelFieldsWithBareLineBreaksReadByPython = "node-csv/1"
TestHegelLoneEmptyFieldsReadByPython = "node-csv/2"
TestHegelEscapedFormulasRoundTripWithAnApostropheQuote = "node-csv/3"
TestHegelFromLineAfterACommentLineKeepsTheRecord = "node-csv/4"
TestHegelCRLFInsideAQuotedFieldCountsAsOneLine = "node-csv/5"
TestHegelRawRecordsConcatenateToTheInput = "node-csv/7"
TestHegelCastKeepsPrefixedNumeralsOrTheirValue = "node-csv/8"
TestHegelDelimiterDiscoveryOnAStreamWithoutData = "node-csv/9"
TestHegelStreamCutInsideADelimiterAfterAClosingQuote = "node-csv/10"
