# Bugs found in node-csv (csv-parse and csv-stringify) by the Hegel property tests in
# hegel.patch (the stringify/parse round trip, both interop directions with Python's csv module,
# the parser against a model of its options, streaming against one-shot parsing, delimiter
# discovery, hostile input).

[[bug]]
id = "node-csv/1"
title = "csv-stringify writes a field holding a CR or LF unquoted unless it is the configured record delimiter"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLineBreaksInFieldsAreQuoted"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify([["a\rb", "c"], ["d", "e"]])` gives `a\rb,c\nd,e\n`: the CR is bare because only the
delimiter, the quote and the configured record delimiter ("\n" here) force quoting
(api/index.js, `containsRecordDelimiter = emits_separator(value, record_delimiter)`). RFC 4180
2.6 requires quoting of fields containing line breaks, every other reader splits the record
there (Python's csv.reader gives [["a"], ["b", "c"], ["d", "e"]]), and csv-parse itself, whose
record-delimiter discovery takes the first line ending it meets, reads the output back as a
record delimiter of "\r" and throws CSV_RECORD_INCONSISTENT_FIELDS_LENGTH. With
`record_delimiter: "\r\n"` a field holding "\n" or "\r" alone is bare in the same way.
Reproduced by `TestHegelStringifyParseRoundTrip` and `TestHegelStringifyOutputReadByPython`
(about 3% and 10% of generated record sets).
'''

[[bug]]
id = "node-csv/2"
title = "csv-stringify writes a record of one empty field as an empty line, which is no record at all at the end of the output"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinLoneEmptyFieldIsQuoted"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify([["a"], [""]], {eof: false})` is `a\n`, which csv-parse reads as the single record
["a"] (the last line without characters is skipped): the record [""] is lost. With `eof: true`
the output `a\n\n` reads back only because csv-parse turns the empty line into [""], and
Python's csv.reader (which writes a lone empty field as `""` for this reason) reads it as no
fields. Quoting a lone empty field (`""`), or setting `quoted_empty` by default for single-field
records, would make the output unambiguous. Reproduced by `TestHegelStringifyParseRoundTrip`.
'''

[[bug]]
id = "node-csv/3"
title = "escape_formulas prefixes the apostrophe after the quoting decision, so with quote set to an apostrophe the output cannot be parsed"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinEscapedFormulaPrefixIsEscaped"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify([["=1", "b"]], {escape_formulas: true, quote: "'"})` gives `'=1,b\n`: the `'` prefix
is added after `containsQuote`/`shouldQuote` were computed on the original value
(api/index.js), so it is neither escaped nor does it trigger quoting. csv-parse with the same
quote opens a quoted field at the apostrophe and throws CSV_QUOTE_NOT_CLOSED; with a value that
does need quoting (`'=1'` around a field holding the delimiter) the prefix quote is doubled by
the quote replacement and the parse gives the wrong value. Reproduced by
`TestHegelStringifyParseRoundTrip`.
'''

[[bug]]
id = "node-csv/4"
title = "from_line drops the record at from_line when the line before it is a comment line"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinFromLineAfterACommentLine"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse("a\n#c\nb\nc\n", {from_line: 3, comment: "#"})` gives [["c"]]; without the comment
(`a\nx\nb\nc\n`) it gives [["b"], ["c"]]. In api/index.js the record-emission state is enabled
when a record delimiter ends the line before from_line, but a full comment line takes the
`skipCommentLine` branch first, which never runs that check; the next record delimiter (the one
ending the record on from_line) then enables emission and discards the record it ends.
Reproduced by `TestHegelParseMatchesTheModel`.
'''

[[bug]]
id = "node-csv/5"
title = "A CRLF inside a quoted field advances the line count by two, so info.lines, from_line and to_line are off"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCRLFInAQuotedFieldIsOneLine"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('"a\r\nb",1\r\nc,2\r\n', {info: true})` reports lines 3 and 4 for the two records (2 and
3 expected); `to_line: 2` on the same input returns nothing instead of the first record. In
api/index.js `wasRowDelimiter` is set for every CR or LF byte met; outside quotes the
record-delimiter branch skips the LF of a CRLF, but inside a quoted field both bytes are walked
and each counts as a line. With LF line endings the count is right. Reproduced by
`TestHegelParseMatchesTheModel` (4% of generated documents).
'''

[[bug]]
id = "node-csv/6"
title = "delimiter_auto throws a TypeError on any character beyond U+007E in the sample"
kind = "crash"
severity = "medium"
test = "TestHegelPinDelimiterDiscoveryBeyondASCII"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse("a,é\n1,2\n", {delimiter_auto: true})` and `delimiter_discover("a,é\n1,2\n")` throw
`TypeError: Cannot read properties of undefined (reading 'lines')`. utils/delimiter_discover.js
allocates a 127-entry table (`Array(127)`) indexed by `charCodeAt(i)` and counts every character
of the sample, so any code point above 126 (DEL, accented letters, any non-Latin script) reads
past the table. Reproduced by `TestHegelDelimiterDiscovery` on every sample with a non-ASCII
letter and by `TestHegelHostileInputNeverCrashes`.
'''

[[bug]]
id = "node-csv/7"
title = "raw keeps only the first byte of a multi-byte or multi-character delimiter, record delimiter, quote or escape"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRawHoldsTheWholeRecordDelimiter"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse("a,b\r\nc,d\r\n", {raw: true})` gives raw "a,b\r" and "c,d\r" (with LF endings the raw is
"a,b\n", record delimiter included); `parse("a::b\n", {raw: true, delimiter: "::"})` gives raw
"a:b\n". In api/index.js `rawBuffer.append(chr)` runs once per loop iteration, and the
delimiter and record-delimiter branches advance `pos` past the remaining bytes of a match
without appending them. Reproduced by hand from the streaming property's `raw` comparison.
The same happens to a multi-byte quote or escape: `parse("«a«,b\n", {raw: true, quote: "«"})`
gives raw "\uFFFDa\uFFFD,b\n" (one byte of each two-byte quote survives, and decodes as
U+FFFD), and `parse("\"a§\"b\",c\n", {raw: true, escape: "§"})` gives raw "\"a\uFFFD\"b\",c\n".
`TestHegelRawRecordsConcatenateToTheInput` finds all four.
'''

[[bug]]
id = "node-csv/8"
title = "cast turns a hexadecimal, binary or octal numeral such as 0x10 into the number 0"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinCastLeavesPrefixedNumeralsAlone"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse("0x10,0b11,0o7", {cast: true})` gives [[0, 0, 0]]. `__isFloat` (api/index.js) tests
`value - parseFloat(value) + 1 >= 0`: the subtraction converts "0x10" with Number semantics
(16) while parseFloat stops at the x (0), so the test passes and the field is cast with
parseFloat to 0. The field is either 16 or the string "0x10"; 0 is a silent corruption. The
same happens for "0b11" and "0o7" (Number reads them, parseFloat gives 0). Found by probing the
cast option by hand.
'''

[[bug]]
id = "node-csv/9"
title = "A stream with delimiter_auto that ends without data throws a TypeError"
kind = "crash"
severity = "low"
test = "TestHegelPinDelimiterDiscoveryOnAnEmptyStream"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`new Parser({delimiter_auto: true}).end()` (no write) fails with `TypeError: Cannot read
properties of undefined (reading 'map')`: `_flush` calls `parse(undefined, true, ...)`, the
delimiter-discovery branch in api/index.js takes `delimiterBuf = nextBuf` (undefined) when no
chunk was seen and hands it to `delimiter_discover`, which maps over it. The synchronous
`parse("", {delimiter_auto: true})` returns [] (its data is an empty buffer). Reproduced by
`TestHegelHostileInputNeverCrashes`.
'''

[[bug]]
id = "node-csv/10"
title = "Streaming with a quote of several bytes throws CSV_INVALID_CLOSING_QUOTE when a chunk ends inside a delimiter of several bytes after a closing quote"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinStreamWaitsForTheDelimiterAfterAQuote"
found = { commit = "745f045295f43a77e14a779bd57a4e3c5f51d9ea", version = "csv-parse 6.8.3, csv-stringify 7.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `{quote: "||", delimiter: ":::"}` the one-shot `parse("||a||:::b\n")` gives [["a", "b"]];
the stream fed `||a||::` then `:b\n` errors with CSV_INVALID_CLOSING_QUOTE, and with
`skip_records_with_error` it silently drops the record. The same happens with UTF-8
multi-byte characters as quote and delimiter (`«` and `│`, split inside `│`). In api/index.js
`__needMoreData` waits, while quoting, for `escape + quote` bytes and for `quote + record
delimiter` bytes, but not for `quote + delimiter`; with a one-byte quote the general
`needMoreDataSize` (the longest delimiter) happens to cover the case, with a longer quote the
closing-quote branch runs with a truncated delimiter, `__isDelimiter` says no, and the byte
after the quote is reported as an invalid closing quote. Reproduced by
`TestHegelStreamMatchesOneShot` (0.5% of chunked documents).
'''
