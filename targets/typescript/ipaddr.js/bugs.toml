# Bugs found in ipaddr.js by the Hegel property tests in hegel.patch (parsing, rendering and
# CIDR arithmetic against Python's ipaddress module and glibc inet_aton, the special-range
# table, round trips, hostile input).

[[bug]]
id = "ipaddr.js/1"
title = "An IPv4-compatible address ::a.b.c.d is parsed as the IPv4-mapped ::ffff:a.b.c.d"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIPv4CompatibleAddressIsNotMapped"
found = { commit = "74ee4c5751afbb998247696539065c78d274d631", version = "3.0.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`IPv6.parse("::1.2.3.4").toByteArray()` is `[0 x10, 255, 255, 1, 2, 3, 4]` and its toString is
`::ffff:102:304`; RFC 4291 2.5.5.1 defines `::1.2.3.4` (the deprecated IPv4-compatible form) as
`0:0:0:0:0:0:102:304`, which is what Python, glibc and every other parser read. In
lib/ipaddr.js the `deprecatedTransitional` regex matches `::a.b.c.d` and the parser re-parses
it as `::ffff:a.b.c.d`, so `isIPv4MappedAddress()` is true for it, `process()` unwraps it to
an IPv4 address, `parseCIDR("::1.2.3.4/96")` and `networkAddressFromCIDR` work on the wrong
address, and the string does not round-trip through toString. Reproduced by
`TestHegelIPv6ParseAndRenderAgreeWithPython` (2% of generated addresses) and
`TestHegelCIDRArithmeticAgreesWithPython`.
'''

[[bug]]
id = "ipaddr.js/2"
title = "The embedded IPv4 tail of an IPv6 address accepts hex, octal and zero-padded parts and reads them in decimal"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinEmbeddedIPv4TailIsDottedDecimal"
found = { commit = "74ee4c5751afbb998247696539065c78d274d631", version = "3.0.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`IPv6.isValid("::ffff:08.1.1.1")` and `IPv6.isValid("::ffff:0x10.1.1.1")` are true, and
`IPv6.parse("::ffff:010.1.1.1")` ends in the bytes 10.1.1.1, while `IPv4.isValid("08.1.1.1")`
is false and `IPv4.parse("010.1.1.1")` is 8.1.1.1 (octal, as documented). The transitional
regexes reuse the loose `ipv4Part` pattern (`0?\d+|0x[a-f0-9]+`) but the parser converts the
four parts with `parseInt(match[i])`, which reads a leading zero as decimal and `0x` as hex.
RFC 4291 2.2 defines the tail as dotted decimal; Python rejects `::ffff:010.1.1.1` (leading
zeros not permitted). Reproduced by `TestHegelIPv6RejectionAgreesWithPython` on mutated
addresses.
'''

[[bug]]
id = "ipaddr.js/3"
title = "subnetMaskFromPrefixLength reads its argument with parseInt, so 8abc is /8 and 1e1 is /1"
kind = "contract"
severity = "low"
test = "TestHegelPinPrefixLengthMustBeANumber"
found = { commit = "74ee4c5751afbb998247696539065c78d274d631", version = "3.0.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`IPv4.subnetMaskFromPrefixLength("8abc")` is 255.0.0.0, `("1e1")` is 128.0.0.0 (/1, not /10),
`(" 8")` is /8 and `(8.9)` is /8. Version 2.5.0's changelog says non-numeric prefix lengths
are rejected, but the check is `Number.isNaN(parseInt(prefix))`, which accepts any string
starting with a digit. `match()` on the same library rejects a non-integer prefix
(`ipaddr: invalid CIDR prefix length`), including the string "8". Found by probing.
'''

[[bug]]
id = "ipaddr.js/4"
title = "The constructors and fromByteArray accept non-integer parts, giving addresses whose toString is not an address"
kind = "contract"
severity = "low"
test = "TestHegelPinConstructorsRejectNonIntegerParts"
found = { commit = "74ee4c5751afbb998247696539065c78d274d631", version = "3.0.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ipaddr.fromByteArray([1.5, 0, 0, 0]).toString()` is `"1.5.0.0.0"` and
`new IPv6([1.5, 0, 0, 0, 0, 0, 0, 0]).toString()` is `"1.8::"` (1.5 in hex). The constructors
check only `0 <= part <= 255` (or 0xffff), so fractions pass; the byte-array input is documented
as bytes. Found by probing.
'''

[[bug]]
id = "ipaddr.js/5"
title = "IPv4.isIPv4 throws for a part outside its range or a malformed octal part instead of returning false"
kind = "contract"
severity = "low"
test = "TestHegelPinIsIPv4NeverThrows"
found = { commit = "74ee4c5751afbb998247696539065c78d274d631", version = "3.0.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`IPv4.isIPv4("3.6321632150")` throws `ipaddr: address outside defined range` and
`IPv4.isIPv4("09.1.1.1")` throws `ipaddr: cannot parse 09 as octal`; the README describes the
method as a lightweight pattern check returning true or false. `isIPv4` is `parser(string)
!== null`, and `parser` throws for a two- or three-part value that overflows and for a
zero-led part with a digit 8 or 9 (`parseIntAuto`), while `isValid` wraps the same call in a
try/catch. Reproduced by `TestHegelHostileInputNeverCrashes` (0.4% of mutated strings).
'''
