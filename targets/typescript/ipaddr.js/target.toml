name = "ipaddr.js"
language = "typescript"
upstream = "https://github.com/whitequark/ipaddr.js"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, .github/ (workflows only), no CONTRIBUTING: no AI policy

[base]
commit = "74ee4c5751afbb998247696539065c78d274d631"
date = "2026-09-01"
version = "3.0.0"

[hegel]
version = "0.4.5"

[run]
# lib/ipaddr.js is a plain ES module without dependencies; only Hegel is installed, under
# .hegel/. The oracle is Python's ipaddress module and socket.inet_aton (stdlib, python3 on PATH).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinIPv4CompatibleAddressIsNotMapped = "ipaddr.js/1"
TestHegelPinEmbeddedIPv4TailIsDottedDecimal = "ipaddr.js/2"
TestHegelPinPrefixLengthMustBeANumber = "ipaddr.js/3"
TestHegelPinConstructorsRejectNonIntegerParts = "ipaddr.js/4"
TestHegelPinIsIPv4NeverThrows = "ipaddr.js/5"
