# Bugs found in js-yaml (nodeca/js-yaml) by the Hegel zoo. ids are js-yaml/N; see README.md
# for the properties. The oracle is PyYAML 6 with libyaml (YAML 1.1), held open by the tests.

[[bug]]
id = "js-yaml/1"
title = "dump writes a flow-mapping key longer than 1024 characters as an implicit key, which libyaml rejects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLongFlowKeysAreWrittenExplicitly"
found = { commit = "494400bd45cad078123cfc057e674a9a0a8d9983", version = "5.4.2 (2026-09-13)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
YAML limits an implicit key to 1024 characters on one line (1.2 section 7.4.2 / 7.1.4; 1.1 has the same limit). The presenter knows: `writeBlockMapping` calls `keyIsTooLong` and switches to an explicit `? key` / `: value` entry for a longer key, and `load` reads it back. `writeFlowMapping` has no such check, so `dump({[k]: 1}, {flowLevel: 0})` with a 1025-character `k` gives `{kkkk...: 1}`, which PyYAML/libyaml rejects ("while parsing a flow mapping ... could not find expected ':'"). js-yaml's own loader and eemeli/yaml happen to read it (both enforce the limit only for block keys), so the round trip hides it. Quoting does not help (the limit is on the key text). A flow mapping accepts `{? key : value}`, or the presenter could fall back to a block mapping for that node.
'''

[[bug]]
id = "js-yaml/2"
title = "strings shaped like YAML 1.1 timestamps with out-of-range fields are dumped plain, and YAML 1.1 readers take them for timestamps"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinOutOfRangeTimestampStringsAreQuoted"
found = { commit = "494400bd45cad078123cfc057e674a9a0a8d9983", version = "5.4.2 (2026-09-13)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`canUsePlain` asks the dump schema's `resolveImplicitScalarTag` whether the text would be read as something other than a string. js-yaml's timestamp resolver validates the fields, so "2001-02-30", "2001-13-01", "0000-01-01", "1999-12-31 23:59:60", "2001-12-14T24:00:00Z" and "2001-12-14 21:59:43 +25" resolve to `!!str` and are written plain, unquoted. A YAML 1.1 reader matches them by regexp first: PyYAML/libyaml fails with "ValueError: day is out of range for month" (or "hour must be in 0..23", "offset must be a timedelta strictly between..."), and eemeli/yaml in 1.1 mode reads "2001-02-30" as 2001-03-02 - a different value, silently. DUMP_SCHEMA is documented to quote whatever a 1.1 or 1.2 resolver would take for a non-string, "for maximum compatibility"; a quoted string is what everyone reads back. The regexp form of the timestamp type (not the validated form) is what needs quoting.
'''

[[bug]]
id = "js-yaml/3"
title = "a Date outside years 0000-9999 dumps as a !!timestamp that js-yaml's own load (and PyYAML) rejects"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDatesBeyondFourDigitYearsLoadBack"
found = { commit = "494400bd45cad078123cfc057e674a9a0a8d9983", version = "5.4.2 (2026-09-13)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The timestamp representer uses `toISOString()`, which writes years outside 0000-9999 in the expanded form `+010000-01-01T00:00:00.000Z` / `-000001-01-01T00:00:00.000Z`; `new Date(8.64e15)` (the largest Date) becomes `+275760-09-13T00:00:00.000Z`. That text does not match the timestamp regexp, so the node is written with an explicit tag as `!!timestamp '+010000-01-01T00:00:00.000Z'`, and `load` throws "cannot resolve a node with !<tag:yaml.org,2002:timestamp> explicit tag" - on its own output, with the same schema. PyYAML fails too (its constructor does not match either). An Invalid Date already makes `dump` throw (a bare RangeError "Invalid time value" out of `toISOString`, not a YAMLException); a Date the YAML timestamp type cannot hold deserves a proper refusal (or `skipInvalid`), not text nobody can read.
'''

[[bug]]
id = "js-yaml/4"
title = "a top-level mapping key beginning with '--- ' or '... ' is written plain at column 0, where it is a document marker"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDocumentMarkerKeysAreQuoted"
found = { commit = "494400bd45cad078123cfc057e674a9a0a8d9983", version = "5.4.2 (2026-09-13)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`dump({"--- x": 1})` is `--- x: 1\n` and `dump({"... x": 1})` is `... x: 1\n` (also with `forceQuotes: true`, which only quotes values). At column 0 `--- ` is the document-start marker and `... ` the document-end marker, so js-yaml's own `load` throws "end of the stream or a document separator is expected (1:6)" on the first and returns `{x: 1}` for the second - the key is silently truncated - while PyYAML/libyaml rejects both ("mapping values are not allowed in this context" / "while parsing a block node"). The presenter knows the rule for *values*: `dump("--- x")` is `'--- x'` and `dump({a: "--- x"})` writes `a: --- x` correctly (not at column 0), so the document-marker check is simply missing from the key path; `---x`, `-- x`, `---` alone and `--- ` (trailing space, quoted for that reason) are all fine. A flow mapping (`flowLevel: 0`) quotes the key and is unaffected. Found by the PyYAML direction of the differential on the second run of the committed suite; the round trip had not yet drawn such a key.
'''
