name = "js-yaml"
language = "typescript"
upstream = "https://github.com/nodeca/js-yaml"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-15"

[base]
commit = "494400bd45cad078123cfc057e674a9a0a8d9983"
date = "2026-09-13"
version = "5.4.2"

[hegel]
version = "0.4.5"

[run]
# The oracle is PyYAML with libyaml (Debian/Ubuntu `python3-yaml`); the tests refuse to start
# without it. The default setup (npm install of the runtime deps + Hegel) is enough otherwise.
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinLongFlowKeysAreWrittenExplicitly = "js-yaml/1"
TestHegelPinOutOfRangeTimestampStringsAreQuoted = "js-yaml/2"
TestHegelPinDatesBeyondFourDigitYearsLoadBack = "js-yaml/3"
TestHegelPinDocumentMarkerKeysAreQuoted = "js-yaml/4"
