name = "tough-cookie"
language = "typescript"
upstream = "https://github.com/salesforce/tough-cookie"
subdir = ""
license = "BSD-3-Clause"
ai_policy_checked = "2026-09-20"  # README, CONTRIBUTING (Salesforce CLA for contributors), SECURITY, .github/ (workflows only): no AI policy

[base]
commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4"
date = "2026-09-16"
version = "6.0.2"

[hegel]
version = "0.4.5"

[run]
# lib/ is TypeScript (ESM specifiers with .js, one runtime dependency: tldts); upstream builds
# with tsup. The setup installs Hegel, TypeScript, Node's types and tldts under .hegel/ and
# compiles lib/ to .hegel/dist (ES2020 modules, hegel/tsconfig.json), so the target's
# package.json and lock file stay untouched; the tests import ../.hegel/dist/cookie/index.js.
# The model (hegel/model.mjs) reads the public suffix list from the same tldts. Node 22.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --ignore-scripts --prefix .hegel @hegeldev/hegel@0.4.5 typescript@5 @types/node@22 tldts@7",
  ".hegel/node_modules/.bin/tsc -p hegel/tsconfig.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinMaxAgeDoesNotSlideWithEachRead = "tough-cookie/1"
TestHegelPinIdnDomainAttributeCookiesAreSent = "tough-cookie/2"
TestHegelPinPercentEncodedPathAttributeMatches = "tough-cookie/3"
TestHegelPinIPv4DomainAttributeEqualToTheHostIsAccepted = "tough-cookie/4"
TestHegelPinPublicSuffixDomainEqualToTheHostBecomesHostOnly = "tough-cookie/5"
TestHegelPinTrailingDotHostCookiesAreSent = "tough-cookie/6"
TestHegelPinCanonicalDomainDoesNotParseAUrl = "tough-cookie/7"
TestHegelPinInfiniteMaxAgeDoesNotExpire = "tough-cookie/8"
TestHegelPinValidateReturnsABooleanForSpecialUseDomains = "tough-cookie/9"
TestHegelPinValidateFollowsTheCookieGrammar = "tough-cookie/10"
TestHegelPinToStringKeepsSameSiteNone = "tough-cookie/11"
TestHegelPinToStringIsReadableByParse = "tough-cookie/12"
TestHegelPinFromJSONRejectsInvalidDates = "tough-cookie/13"
TestHegelPinParseTrimsOnlySpaceAndTab = "tough-cookie/14"
TestHegelPinParseDateAcceptsNonLatin1NonDigits = "tough-cookie/15"
TestHegelPinCookiePrefixesAreCaseInsensitive = "tough-cookie/16"
TestHegelPinLocalhostDomainCookiesReachSubdomains = "tough-cookie/17"
