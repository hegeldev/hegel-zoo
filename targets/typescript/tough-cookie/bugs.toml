# Bugs found in salesforce/tough-cookie by the Hegel tests in hegel.patch. The reference is
# RFC 6265 (the README: "RFC 6265 Cookies and CookieJar for Node.js"), with the SameSite
# attribute and cookie prefixes of draft-ietf-httpbis-rfc6265bis where tough-cookie implements
# them. Reproduce a bug with its pin: `node --test --test-name-pattern=<test> hegel/hegel.test.mjs`.

[[bug]]
id = "tough-cookie/1"
title = "A Max-Age cookie's expiry slides forward with every read, so a cookie that is used regularly never expires"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMaxAgeDoesNotSlideWithEachRead"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 6265 S5.2.2 / S5.3: for a Max-Age cookie the expiry-time is the time the cookie was
received plus delta-seconds, fixed once. `Cookie.expiryTime()` computes it from
`this.lastAccessed` instead (`relativeTo = now || this.lastAccessed || new Date()`), and
`CookieJar.getCookies` both filters on `c.expiryTime()` and then sets `cookie.lastAccessed = now`
on every cookie it returns. So each retrieval pushes the expiry of every returned Max-Age cookie
`maxAge` seconds into the future: `a=b; Max-Age=10` set at t=0 and read at t=8 is still sent
at t=16, t=24, ... for as long as reads keep coming. `Expires` cookies are not affected
(absolute time). The pin uses a stopped clock (`Date.now` and `new Date()` replaced) to make
the three instants exact; the jar property sees the same shape whenever a Max-Age cookie has
been sent once before its expiry and a request follows the expiry.
'''

[[bug]]
id = "tough-cookie/2"
title = "A Domain attribute with an IDN label (or an IPv6 address in brackets) is accepted, stored as written, and the cookie is never sent"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIdnDomainAttributeCookiesAreSent"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`setCookie` checks `domainMatch(host, cookie.cdomain(), false)` with the canonicalized (IDNA
ToASCII) form of the Domain attribute, but stores `cookie.domain` as parsed - lower-cased only.
The request host is always canonical (`new URL(url).hostname` gives `xn--xample-9ua.com`), so
`getCookies`' `domainMatch(host, c.domain, false)` and the MemoryCookieStore's index lookup by
domain both miss it: `setCookieSync("a=b; Domain=éxample.com", "http://éxample.com/")` succeeds
and `getCookieStringSync("http://www.éxample.com/")` (or the host itself) is "". The same for
`Domain=[::1]` from `http://[::1]/` (stored as "[::1]", canonical host "::1"; `Domain=::1`
works) and for a domain that keeps a leading dot after the parser removed one (`Domain=..foo.com`).
A host-only cookie from an IDN host works, since `cookie.domain = host` is canonical, and so
does a punycode Domain attribute. RFC 6265 S5.3 step 6 stores "the domain-attribute", which
S5.1.3/S5.1.2 compare in canonicalized form: the stored domain should be `cdomain()`.
'''

[[bug]]
id = "tough-cookie/3"
title = "The request path is percent-decoded before path matching, so a Path attribute with a percent-escape never matches"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPercentEncodedPathAttributeMatches"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`getCookieContext` applies `decodeURI` to the URL's pathname (for setCookie's default-path and
for getCookies' request-path). RFC 6265 S5.1.4 path-matches the uri-path as it is, and the
Path attribute is stored as written, so `Path=/caf%C3%A9` set from `/caf%C3%A9/` is never sent
to `/caf%C3%A9/x` (request path becomes `/café/x`); `Path=/%41` is sent neither to `/%41/y`
nor to `/A/y`. Default paths get decoded too (`/%41/z` -> default path `/A`), so a cookie
without a Path attribute is sent to `/A/y` and to `/%41/y` alike, where the RFC sends it to
`/%41/y` only. Browsers compare the escaped forms byte for byte.
'''

[[bug]]
id = "tough-cookie/4"
title = "Domain=<IPv4 address> from that very address is rejected as a public suffix; the same with an IPv6 address is accepted"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinIPv4DomainAttributeEqualToTheHostIsAccepted"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `rejectPublicSuffixes` (the default) `setCookie` calls `getPublicSuffix(cdomain)`, which
returns undefined for an IP address (tldts has no registrable domain for it), and treats
undefined as "the domain is a public suffix" unless `IP_V6_REGEX_OBJECT` matches: so
`setCookieSync("a=b; Domain=1.2.3.4", "http://1.2.3.4/")` throws "Cookie has domain set to a
public suffix" while `Domain=::1` from `http://[::1]/` is stored. An IP address is not a public
suffix; RFC 6265 S5.1.3 domain-matches identical strings (IP or not) and browsers store the
cookie (as a host cookie). With `rejectPublicSuffixes: false` it is accepted.
'''

[[bug]]
id = "tough-cookie/5"
title = "A Domain attribute that is a public suffix identical to the request host rejects the cookie instead of making it host-only"
kind = "contract"
severity = "low"
test = "TestHegelPinPublicSuffixDomainEqualToTheHostBecomesHostOnly"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 6265 S5.3 step 5: "If the user agent is configured to reject 'public suffixes' and the
domain-attribute is a public suffix: If the domain-attribute is identical to the canonicalized
request-host: Let the domain-attribute be the empty string. Otherwise: Ignore the cookie
entirely". tough-cookie ignores it in both cases: `setCookieSync("a=b; Domain=github.io",
"http://github.io/")` throws "Cookie has domain set to a public suffix", where the RFC (and
browsers) store a host-only cookie for github.io. The same header without the Domain
attribute is stored. Sites served from a public suffix (github.io, co.uk registries' own hosts)
lose every cookie that names their own host.
'''

[[bug]]
id = "tough-cookie/6"
title = "A cookie set from a host with a trailing dot is stored and never sent back to that host"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTrailingDotHostCookiesAreSent"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`setCookieSync("a=b", "http://www.example.com./")` stores a host-only cookie with domain
"www.example.com." (the URL's hostname keeps the dot). `getCookies` asks the store with the same
host, and `MemoryCookieStore.findCookies` looks the index up under `permuteDomain(host)`, which
strips the trailing dot (`domain.slice(0, -1)`) and builds ["example.com", "www.example.com"] -
so the index entry "www.example.com." is never consulted and `getCookieStringSync` for the same
URL is "". The same for a Domain attribute with a trailing dot. Either the dot should be
canonicalized away on both sides or kept on both; storing a cookie that can never be retrieved
is neither.
'''

[[bug]]
id = "tough-cookie/7"
title = "canonicalDomain parses a non-ASCII domain as a URL: userinfo, port and path are stripped (é@evil.com becomes evil.com) and some names throw TypeError"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCanonicalDomainDoesNotParseAUrl"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a name with a character outside U+0001-U+007F, `canonicalDomain` returns
`new URL("http://" + name).hostname`. The URL parser treats the string as an authority and
more: `canonicalDomain("é@evil.com")` is "evil.com" (the é is userinfo), "é.com:80" -> "xn--9ca.com",
"é/x.com" -> "xn--9ca", "é%41.com" -> "xn--a-9fa.com" (percent-decoded), so
`domainMatch("evil.com", "é@evil.com")` is true where the ASCII path (`"a@evil.com"` is
returned unchanged) says false. Names the URL parser refuses throw out of a function whose
contract is a string or undefined: `canonicalDomain("é.1.2.3.4")` and `canonicalDomain("\0")`
throw TypeError "Invalid URL", and so do `Cookie.cdomain()`, `Cookie.validate()` and
`CookieJar.setCookie` for such a Domain attribute (`setCookieSync("a=b; Domain=\0", url)`
throws TypeError rather than reporting an invalid cookie). `url.domainToASCII` is the host
canonicalization the URL standard provides ("" for an invalid host).
'''

[[bug]]
id = "tough-cookie/8"
title = "A cookie with maxAge 'Infinity' expires at the epoch: expiryTime is -Infinity and the jar drops it, while TTL says Infinity"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinInfiniteMaxAgeDoesNotExpire"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`setMaxAge(Infinity)` stores the string "Infinity" ("so it can be serialized to JSON", per its
doc comment). `expiryTime()` then takes `typeof this.maxAge === 'number' ? this.maxAge :
-Infinity`, so the age is -Infinity and the cookie's expiry is -Infinity; `expiryDate()` is
1970-01-01; `CookieJar.setCookieSync(cookie, url)` stores it and the next `getCookies` removes
it as expired. `TTL()` for the same cookie returns Infinity and `isPersistent()` true. One of
the two readings is wrong; the doc comment says the intent is an infinite Max-Age.
'''

[[bug]]
id = "tough-cookie/9"
title = "Cookie.validate() throws for a special-use domain (foo.local, x.test) instead of returning a boolean"
kind = "crash"
severity = "low"
test = "TestHegelPinValidateReturnsABooleanForSpecialUseDomains"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`validate()` ("Useful for 'lint' checking any Set-Cookie headers you generate ... returns a
boolean") calls `getPublicSuffix(cdomain)` with the default options, and getPublicSuffix
throws for a top-level label in its SPECIAL_USE_DOMAINS list when allowSpecialUseDomain is not
set: `new Cookie({ key: "a", value: "b", domain: "foo.local" }).validate()` throws Error
"Cookie has domain set to the public suffix "local" which is a special use domain. To allow
this, configure your CookieJar with ...". The same for `.example`, `.test`, `.invalid` and
`.localhost` domains, which a CookieJar accepts by default (allowSpecialUseDomain: true).
'''

[[bug]]
id = "tough-cookie/10"
title = "Cookie.validate() rejects the empty and the quoted cookie-values the RFC 6265 grammar allows, and accepts paths with control characters"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinValidateFollowsTheCookieGrammar"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 6265 S4.1.1: cookie-value = *cookie-octet / ( DQUOTE *cookie-octet DQUOTE ), so `a=` and
`a="b"` are valid Set-Cookie headers; `validate()` returns false for both (`if (!this.value ||
!COOKIE_OCTETS.test(this.value)) return false`, and COOKIE_OCTETS excludes DQUOTE).
path-value = <any CHAR except CTLs or ";">, but the check `PATH_VALUE.test(this.path)` uses an
unanchored regex (`/[\x20-\x3A\x3C-\x7E]+/`), which any path with one valid character passes:
`new Cookie({ key: "a", value: "b", path: "/x\u0001y" }).validate()` is true. The doc calls
validate "by no means comprehensive", which covers missing checks, not wrong answers.
'''

[[bug]]
id = "tough-cookie/11"
title = "toString() drops SameSite=None, changing the cookie's meaning for browsers that default to Lax"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinToStringKeepsSameSiteNone"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Cookie.parse("a=b; SameSite=None").toString()` is "a=b": toString writes the attribute only
`if (this.sameSite && this.sameSite !== 'none')`. In rfc6265bis (and in Chrome since 2020)
an absent SameSite means "Default" (treated as Lax), while "None" explicitly allows cross-site
sends, so re-emitting a cookie through `toString()` or `CookieJar.getSetCookieStrings()` turns
a cross-site cookie into a same-site one. `toJSON()` keeps `sameSite: "none"`, so the JSON
round trip is faithful and the Set-Cookie round trip is not (the round-trip property counts
this shape).
'''

[[bug]]
id = "tough-cookie/12"
title = "toString() writes attribute values Cookie.parse rejects: Max-Age=1e+21 for a 22-digit Max-Age, Max-Age=-Infinity, years outside 1601-9999"
kind = "roundtrip"
severity = "low"
test = "TestHegelPinToStringIsReadableByParse"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Cookie.parse("a=b; Max-Age=1000000000000000000000")` accepts the value (parseInt gives 1e21)
and `toString()` writes `Max-Age=1e+21` (`String(this.maxAge)`), which the parser's
`/^-?[0-9]+$/` rejects, so parsing the output gives maxAge null: the cookie went from
"expires in 3e13 years" to "session cookie". Likewise `setMaxAge(-Infinity)` writes
`Max-Age=-Infinity` (unparseable; `Infinity` is skipped by a loose `!= Infinity`), and an
`expires` Date before 1601 or after 9999 writes an Expires the cookie-date grammar (2*4DIGIT
years, >= 1601) cannot read. `Cookie.parse("a=b; Domain=..example.com")` has domain ".example.com" (the parser
removes one leading dot, as S5.2.3 says) and writes `Domain=.example.com`, which parses back to
"example.com". In loose mode `Cookie.parse("=", { loose: true })` is a Cookie whose toString is
"", which parses to nothing. toString should either write what parse reads (e.g. clamp Max-Age
to a digit string) or refuse.
'''

[[bug]]
id = "tough-cookie/13"
title = "fromJSON accepts an unparseable date string, giving a cookie whose own toJSON throws RangeError"
kind = "crash"
severity = "low"
test = "TestHegelPinFromJSONRejectsInvalidDates"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Cookie.fromJSON({ key: "a", value: "b", expires: "garbage" })` sets `expires = new
Date("garbage")` (an Invalid Date) without checking it; `JSON.stringify(cookie)` and
`cookie.toJSON()` then throw RangeError "Invalid time value" from `toISOString()`, `toString()`
writes `Expires=Invalid Date`, and `CookieJar.deserialize` of a serialized jar containing such
a cookie produces a jar that cannot be serialized again. The same for `creation` and
`lastAccessed`. fromJSON validates every other field's type; a date that fails to parse
should be rejected like them (or left at "Infinity", as setExpires does for an unparseable
cookie-date).
'''

[[bug]]
id = "tough-cookie/14"
title = "Cookie.parse trims Unicode whitespace (NBSP, U+3000, U+FEFF) from names, values and attribute values; RFC 6265 removes only SP and HTAB"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinParseTrimsOnlySpaceAndTab"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
S5.2 step 3/4 and each attribute: "Remove any leading or trailing WSP characters", WSP being
SP / HTAB (RFC 5234). tough-cookie uses `String.prototype.trim()`, which also strips NBSP
(U+00A0), the U+2000-U+200A spaces, U+2028/2029, U+3000, U+FEFF and more:
`Cookie.parse("a=b ").value` is "b", `Cookie.parse("a=b; Path=/x ").path` is "/x".
Header bytes decoded as Latin-1 (Node's default for HTTP headers) produce U+00A0 for byte 0xA0,
so a value ending in that byte loses it. Browsers strip only SP/HTAB (the parser property
counts this shape; every other trimming of the parser agrees with the model).
'''

[[bug]]
id = "tough-cookie/15"
title = "parseDate rejects a date token followed by a non-digit above U+00FF (09日 Jun 2021 10:18:14), which the grammar's non-digit *OCTET accepts"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinParseDateAcceptsNonLatin1NonDigits"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
S5.1.1: day-of-month = 1*2DIGIT [ non-digit *OCTET ], non-digit = %x00-2F / %x3A-FF, and
likewise for year and time. parseDate's regexes transcribe the octet ranges as UTF-16 code
unit ranges (`[\x00-\x2F\x3A-\xFF][\x00-\xFF]*`), so a character above U+00FF - which is a
sequence of non-digit octets on the wire, and a non-digit in any reading - fails the token:
`parseDate("09日 Jun 2021 10:18:14")` is undefined where the model gives 2021-06-09T10:18:14Z;
the same for "Jun日", "2021日" and "10:18:14日". `\D` (or `[^0-9]`) is the grammar's non-digit.
'''

[[bug]]
id = "tough-cookie/16"
title = "The __Secure- and __Host- prefix checks are case-sensitive, so __SECURE-a and __host-a cookies bypass them"
kind = "contract"
severity = "low"
test = "TestHegelPinCookiePrefixesAreCaseInsensitive"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`isSecurePrefixConditionMet` / `isHostPrefixConditionMet` use `cookie.key.startsWith('__Secure-')`
and `startsWith('__Host-')`. The code comments cite rfc6265bis-02, where the match was
case-sensitive; since draft -05 (2019) and in the current draft (S5.7 steps 13-14: "begins with
a case-insensitive match for the string "__Secure-"") it is case-insensitive, and Chromium and
Firefox implement it so. tough-cookie 6 implements SameSite and the prefixes from the bis
drafts, so `setCookieSync("__SECURE-a=b", "http://example.com/")` should be ignored (no Secure
attribute) and `__host-a=b; Domain=example.com` over https should be ignored (Domain given);
both are stored and sent.
'''

[[bug]]
id = "tough-cookie/17"
title = "Domain=localhost is accepted as a registrable domain at set time but treated as a public suffix at lookup, so the cookie is never sent to *.localhost"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinLocalhostDomainCookiesReachSubdomains"
found = { commit = "0f7ed24de0d7310ef36be45e37c0ef28eb9014b4", version = "6.0.2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With allowSpecialUseDomain (the default), `getPublicSuffix("localhost")` returns "localhost"
(SPECIAL_TREATMENT_DOMAINS), so `setCookieSync("a=b; Domain=localhost", "http://localhost/")`
stores a domain cookie, and `domainMatch("www.localhost", "localhost")` is true. But
`getCookies("http://www.localhost/")` asks the MemoryCookieStore for the permutations of the
host, and `permuteDomain("www.localhost")` stops at the "public suffix"
`getPublicSuffix("www.localhost")` = "www.localhost": the index entry "localhost" is never
consulted and the header is "". The same with "invalid". Either "localhost" is a public suffix
(then the Domain attribute must be rejected, or made host-only per bug 5) or it is registrable
(then its subdomains must receive the cookie); today the cookie is stored and unreachable.
Found by the jar property (a `Domain=.LOCALHOST` cookie set from https://localhost/).
'''
