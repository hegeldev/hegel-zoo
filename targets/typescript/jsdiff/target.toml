name = "jsdiff"
language = "typescript"
upstream = "https://github.com/kpdecker/jsdiff"
subdir = ""
license = "BSD-3-Clause"
ai_policy_checked = "2026-09-15"  # README, CONTRIBUTING.md, .github: no AI policy

[base]
commit = "bb6a976facc89cbd7daa8b5dd29bac864310ea89"
date = "2026-09-19"
version = "9.0.0"

[hegel]
version = "0.4.5"

[run]
# jsdiff has no runtime dependencies and ships tsc output (libesm/, libcjs/) that is not in
# the repository: the ESM build is produced the way upstream's `generate-esm` script does it
# (TypeScript 6.0.2, the version upstream's yarn.lock resolves to) and the tests import ../libesm/.
# The oracles GNU diff, GNU patch and git are on the machine and in CI's ubuntu image.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock @hegeldev/hegel@0.4.5",
  "npx --yes -p typescript@6.0.2 tsc --module nodenext --outDir libesm --target es6 --noCheck",
  "node -e \"fs.writeFileSync('libesm/package.json', JSON.stringify({type:'module',sideEffects:false}))\"",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
PinJsdiff1FileNamesWithOuterSpacesDoNotRoundTrip = "jsdiff/1"
PinJsdiff2IgnoreNewlineAtEofIgnoresOnlyLf = "jsdiff/2"
PinJsdiff3HeaderWithTabIsTruncatedByParsePatch = "jsdiff/3"
PinJsdiff4ApplyPatchThrowsOnAnEmptyPatch = "jsdiff/4"
PinJsdiff5IgnoreWhitespacePatchAppliesToNeitherText = "jsdiff/5"
