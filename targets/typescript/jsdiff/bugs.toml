[[bug]]
id = "jsdiff/4"
title = "applyPatch throws a TypeError on an empty patch"
kind = "crash"
severity = "low"
test = "PinJsdiff4ApplyPatchThrowsOnAnEmptyPatch"
found = { commit = "87c5152b9b3908d8364e875aabce8f4015c7fe0e", version = "9.0.0 (2026-08-24)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`applyPatch("a\nb\n", "")` and `applyPatch("a\nb\n", [])` throw `TypeError: Cannot read properties of undefined (reading 'hunks')`: `parsePatch("")` is `[]`, and `applyPatch` only checks for more than one patch before reading `patches[0]`. A header-only patch (no hunks) returns the source unchanged, and a patch string of garbage returns the source too, so an empty patch is the one input that crashes. Found while probing the empty cases of the patch round trip.
'''

[[bug.observed]]
