[[bug]]
id = "jsdiff/3"
title = "parsePatch truncates a ---/+++ header at its second tab"
kind = "round-trip"
severity = "low"
test = "PinJsdiff3HeaderWithTabIsTruncatedByParsePatch"
found = { commit = "87c5152b9b3908d8364e875aabce8f4015c7fe0e", version = "9.0.0 (2026-08-24)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`createPatch("f", "x\n", "y\n", "h1\th2", "n1\tn2")` writes `--- f\th1\th2`; `parseFileHeader` splits the line with `split('\t', 2)`, whose limit discards the remainder instead of keeping it, so the header comes back as `h1`. Found by TestHegelPatchesApplyParseFormatAndReverse.
'''

