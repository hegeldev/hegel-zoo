commit = "bb6a976facc8"
hegel = "0.4.5"
date = "2026-09-20"
result = "reproduces"
[[bug]]
id = "jsdiff/5"
title = "a patch created with ignoreWhitespace or stripTrailingCr applies to neither text"
kind = "wrong-result"
severity = "medium"
test = "PinJsdiff5IgnoreWhitespacePatchAppliesToNeitherText"
found = { commit = "87c5152b9b3908d8364e875aabce8f4015c7fe0e", version = "9.0.0 (2026-08-24)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`createPatch("f", "a \nb\nc\n", "a\nd\nc \n", undefined, undefined, {ignoreWhitespace: true})` gives the hunk ` a` / `-b` / `+d` / ` c `: context lines are the *new* text's tokens (the diff engine reports the new value for common tokens) while deleted lines are the old text's, so wherever the two differ in the ignored respect the hunk fits neither the old text (`a ` vs `a`) nor the new one (`b` is not there). `applyPatch` returns false — or, when a hunk happens to fit somewhere else, applies it there: `createPatch("f", "\r\n", "x\n", …, {stripTrailingCr: true})` applied to `"\r\n"` gives `"\r\nx"`. GNU `diff -w` / `--strip-trailing-cr` write the old file's lines for context, so their patches apply to the old file. Found by TestHegelPatchesApplyParseFormatAndReverse (about 8% of the cases with either option).
'''

[[bug.observed]]
version = "9.0.0"
commit = "b9d516f36378"
hegel = "0.4.5"
date = "2026-09-16"
result = "reproduces"

