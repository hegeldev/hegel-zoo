hegel = "0.4.5"
date = "2026-09-20"
result = "reproduces"
[[bug]]
id = "jsdiff/2"
title = "ignoreNewlineAtEof ignores a missing LF only, not a missing CRLF"
kind = "wrong-result"
severity = "low"
test = "PinJsdiff2IgnoreNewlineAtEofIgnoresOnlyLf"
found = { commit = "87c5152b9b3908d8364e875aabce8f4015c7fe0e", version = "9.0.0 (2026-08-24)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`diffLines("a\r\nb", "a\r\nb\r\n", {ignoreNewlineAtEof: true})` reports `b` removed and `b\r\n` added: `LineDiff.equals` strips one trailing `\n` from each side, leaving `b\r` against `b`. In a CRLF text the newline at the end of the last line is `\r\n`, so the option (documented as ignoring "a missing newline character at the end of the last line") has no effect on Windows text. Found by TestHegelLineEndingsAndLineOptions against the documented equality.
'''

