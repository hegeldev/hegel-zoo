# Bugs found in jsdiff (kpdecker/jsdiff, npm `diff`) by the Hegel zoo. ids are jsdiff/N; see
# README.md for the properties and test/hegel.test.mjs (in hegel.patch) for the pins. The
# oracles are GNU patch/diff and git diff plus the models in the test.

[[bug]]
id = "jsdiff/1"
title = "file names with leading or trailing whitespace do not survive formatPatch → parsePatch"
kind = "round-trip"
severity = "low"
test = "PinJsdiff1FileNamesWithOuterSpacesDoNotRoundTrip"
found = { commit = "87c5152b9b3908d8364e875aabce8f4015c7fe0e", version = "9.0.0 (2026-08-24)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`createTwoFilesPatch("a ", " b", "x\n", "y\n")` writes `--- a ` and `+++  b` unquoted (`quoteFileNameIfNeeded` quotes control characters, non-ASCII, `"` and `\` but not spaces), and `parsePatch` trims the `---`/`+++` lines, so the names come back as `a` and `b`. Quoting such names (C-style quoting is understood by git, GNU patch and jsdiff's own parser) would make the round trip hold. Found by TestHegelPatchesApplyParseFormatAndReverse.
'''

[[bug.observed]]
