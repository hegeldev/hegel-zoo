name = "temporal-polyfill"
language = "typescript"
upstream = "https://github.com/fullcalendar/temporal-polyfill"
subdir = "polyfill"
license = "MIT"
ai_policy_checked = "2026-09-17"  # AGENTS.md/CLAUDE.md give agents instructions, no contribution restriction; no CONTRIBUTING

[base]
commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083"
date = "2026-09-11"
version = "1.0.5"

[hegel]
version = "0.4.5"

[run]
# A pnpm workspace (polyfill/, utils/, spec/) whose dist/ is not committed. Hegel, the TypeScript
# compiler and the reference implementation (@js-temporal/polyfill 0.5.1, the oracle) go under
# .hegel/; polyfill/src and utils/src are compiled together to CommonJS into .hegel/dist
# (test/tsconfig.hegel.json maps the workspace packages to their sources), the output is marked
# CommonJS, and the compiled utils are made resolvable as `temporal-utils` through a symlink in
# .hegel/dist/node_modules. The tests require() the `full` class API of that build.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 typescript@5.9.3 @js-temporal/polyfill@0.5.1",
  "node .hegel/node_modules/typescript/bin/tsc -p test/tsconfig.hegel.json --noCheck",
  "cp test/hegel-dist-package.json .hegel/dist/package.json",
  "cp test/hegel-utils-package.json .hegel/dist/utils/src/package.json",
  "mkdir -p .hegel/dist/node_modules",
  "ln -sfn ../utils/src .hegel/dist/node_modules/temporal-utils",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinNegativeInstantRoundsTowardThePast = "temporal-polyfill/1"
TestHegelPinPlainTimeRejectsAnInvalidDatePart = "temporal-polyfill/2"
TestHegelPinPlainTimeIgnoresTheCalendarAnnotation = "temporal-polyfill/3"
TestHegelPinYearMonthRejectsUnitsBelowMonths = "temporal-polyfill/4"
TestHegelPinBracketedOffsetHasNoSeconds = "temporal-polyfill/5"
TestHegelPinOffsetHourIsAtMost23 = "temporal-polyfill/6"
TestHegelPinZeroDurationHasNoSign = "temporal-polyfill/7"
TestHegelPinTimeZoneAnnotationComesFirst = "temporal-polyfill/8"
