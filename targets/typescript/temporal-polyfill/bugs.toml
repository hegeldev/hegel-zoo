# Bugs found in temporal-polyfill (fullcalendar/temporal-polyfill, the `polyfill` package) by the
# Hegel zoo's property tests. Each `test` is the pin that asserts the specification's behaviour and
# fails while the bug exists; the properties skip the bug's shape through a `Known` switch.
# The oracle is @js-temporal/polyfill 0.5.1 (the TC39 champions' reference); every divergence was
# adjudicated against the Temporal specification and test262 before being recorded here.

[[bug]]
id = "temporal-polyfill/1"
title = "Directional rounding of a pre-1970 Instant rounds toward 1970 instead of toward the past"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNegativeInstantRoundsTowardThePast"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`new Temporal.Instant(-34959986330n).toString({ smallestUnit: "second" })` (the default rounding
mode of toString is trunc) prints `1969-12-31T23:59:26Z`; the instant is 23:59:25.040013670, so
truncation toward the past gives `23:59:25Z`, which is what the specification (RoundTemporalInstant
on the epoch nanoseconds) and the reference produce. `-1500500000n` with `{ smallestUnit:
"millisecond", roundingMode: "trunc" }` gives `.500` instead of `.499`, `Instant.round({
smallestUnit: "second", roundingMode: "trunc" })` has the same defect, and so has
`ZonedDateTime.prototype.toString` with `roundingMode: "trunc"` on a pre-1970 date
(`1960-12-31T23:59:25.5[UTC]` prints `...25.5` truncated as `23:59:26`). The rounding is applied to
the magnitude of the negative epoch value, i.e. toward 1970; expand and ceil/floor are mirrored
the same way. test262's "rounding down is towards the Big Bang" case passes only for its
particular far-past value. Found by TestHegelInstantLikeTheReference.
'''

[[bug]]
id = "temporal-polyfill/2"
title = "PlainTime.from accepts a string whose date part is not a valid date"
kind = "contract"
severity = "low"
test = "TestHegelPinPlainTimeRejectsAnInvalidDatePart"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Temporal.PlainTime.from("2011-02-30T13:12:50")` returns 13:12:50; `"2011-00-09T13:12:50"` is
accepted too. The specification's ParseISODateTime validates the date part of every string it
parses (RejectDateTime, throwing a RangeError for February 30 or month 0) before the time is
extracted; the reference throws. Found by TestHegelParsesLikeTheReference.
'''

[[bug]]
id = "temporal-polyfill/3"
title = "PlainTime.from rejects a time string carrying a non-ISO calendar annotation"
kind = "contract"
severity = "low"
test = "TestHegelPinPlainTimeIgnoresTheCalendarAnnotation"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Temporal.PlainTime.from("2048-10-24T02:08[u-ca=persian]")` and `PlainTime.from("T02:08[u-ca=discord]")`
throw a RangeError; the specification ignores the calendar annotation of a time string
(ToTemporalTime parses with ParseISODateTime and never looks at the calendar), and test262's
PlainTime/from/argument-string-calendar-annotation asserts that `[u-ca=iso8601]`,
`[!u-ca=iso8601]` and a second `[u-ca=discord]` annotation are all accepted. Only PlainTime is
affected: the same string is a valid PlainDateTime. Found by TestHegelParsesLikeTheReference.
'''

[[bug]]
id = "temporal-polyfill/4"
title = "PlainYearMonth.add/subtract accept units below months next to a year or month part, and a negative mixed duration lands a month early"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinYearMonthRejectsUnitsBelowMonths"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Temporal.PlainYearMonth.from("2040-09").add({ months: 1, days: 1 })` returns 2040-10 and
`.add({ months: -1, days: -1 })` returns 2040-07 (a month too early: the day is subtracted from
the first of the month and the result rolls back); `.add({ years: 1, hours: 1 })` returns 2041-09.
The specification (AddDurationToYearMonth, since the 2024 removal of the calendar protocol)
throws a RangeError for any duration with a nonzero unit below months, and test262's
PlainYearMonth/prototype/add/argument-lower-units and subtract/argument-lower-units assert it.
A duration made only of lower units (`{ days: 1 }`) is rejected correctly. Found by
TestHegelPlainTimeAndMonthTypesLikeTheReference.
'''

[[bug]]
id = "temporal-polyfill/5"
title = "A bracketed UTC offset with seconds ([+05:30:15]) is accepted as a time zone by the Plain types"
kind = "contract"
severity = "low"
test = "TestHegelPinBracketedOffsetHasNoSeconds"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Temporal.PlainDate.from("2052-11-23[+05:30:15]")`, `PlainDateTime.from("2052-11-23T00:00[+05:30:15]")`
and `Instant.from("2052-11-23T00:00Z[+05:30:15]")` succeed. The grammar of the specification is
`TimeZoneIdentifier ::: UTCOffset[~SubMinutePrecision] | TimeZoneIANAName`: a bracketed offset may
have no seconds, so the string is a RangeError (the reference throws). `ZonedDateTime.from`
rejects the same string, so the polyfill's own parsers disagree with each other. Found by
TestHegelParsesLikeTheReference.
'''

[[bug]]
id = "temporal-polyfill/6"
title = "A UTC offset with an hour of 24 or more, or a minute of 60, is accepted by the Plain types"
kind = "contract"
severity = "low"
test = "TestHegelPinOffsetHourIsAtMost23"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Temporal.PlainDate.from("1969-10-20T01:51:57+24:00")` returns 1969-10-20, and so do the same
string with `-24:00`, `+25:00`, `+2400` and `+23:60` in PlainDate, PlainDateTime, PlainYearMonth
and PlainMonthDay. The offset grammar is `UTCOffset ::: ASCIISign Hour[:]MinuteSecond...` with
Hour 00–23 and MinuteSecond 00–59; test262's PlainTime/from invalid-string list carries
`"00:00-24:00"` and `"00:00+24:00"`. Instant, ZonedDateTime and PlainTime throw ("Out-of-bounds
offset") because their offset is used; the Plain date types discard the offset without validating
it. Found by TestHegelParsesLikeTheReference.
'''

[[bug]]
id = "temporal-polyfill/7"
title = "A negative duration that rounds to zero in toString keeps its minus sign: -PT0.000S"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinZeroDurationHasNoSign"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Temporal.Duration.from({ nanoseconds: -5 }).toString({ smallestUnit: "millisecond" })` returns
`-PT0.000S`; `{ milliseconds: -5 }` with `fractionalSecondDigits: 0` returns `-PT0S`, and
`{ nanoseconds: -5 }` with `smallestUnit: "second"` returns `-PT0S`. The specification rounds
first and formats the rounded duration (TemporalDurationToString prints the sign of the rounded
value, which is 0), so the reference prints `PT0.000S` and `PT0S`. In `formatDurationIso` the
rounded fields are spread over the old slots but the old `sign` is kept. Found by
TestHegelDurationLikeTheReference.
'''

[[bug]]
id = "temporal-polyfill/8"
title = "A time zone annotation placed after another annotation ([u-ca=iso8601][UTC]) is accepted by every parser"
kind = "contract"
severity = "low"
test = "TestHegelPinTimeZoneAnnotationComesFirst"
found = { commit = "b28e5a857d337bcac5cb8bb5ef4d49cda57d4083", version = "1.0.5", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Temporal.ZonedDateTime.from("2059-07-23T15:46:00[u-ca=iso8601][UTC]")` returns
`2059-07-23T15:46:00+00:00[UTC]`, and PlainDate, PlainDateTime, PlainTime, PlainYearMonth,
PlainMonthDay and Instant (`...Z[foo=bar][UTC]`) accept the string as well, as they do
`[foo=bar][+01:00]`. In the specification's grammar the time zone annotation is a separate
production that may only follow the date-time directly (`DateTime TimeZoneAnnotation?
Annotations?`); the `Annotations` that follow are `[key=value]` pairs, so `[UTC]` in second
position is a syntax error and the reference throws a RangeError. `[UTC][UTC]` is rejected, so
the check exists but only for a repeated time zone. Found by TestHegelParsesLikeTheReference.
'''
