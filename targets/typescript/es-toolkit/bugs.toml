[[bug]]
id = "es-toolkit/3"
title = "chunk and split lack the iteratee-call guard, so [[1, 2]].map(chunk) gives [[]]"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinChunkAndSplitGuardTheIterateeCall"
found = { commit = "60fe20d333e6bd097640d7a03948e2d67f4c8ffd", version = "1.52.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
lodash's chunk and split detect being called as an iteratee (`isIterateeCall(array, size,
guard)`) and ignore the index: `[[1, 2], [3, 4]].map(_.chunk)` is `[[[1], [2]], [[3], [4]]]` and
`["a-b"].map(_.split)` is `[["a-b"]]`. compat takes the index as the size/separator:
`[[], [[3], [4]]]` and `[[]]`. (times has the same guard in lodash; `[[1]].map(_.times)` differs
too, but that call does not type-check.) Found by a probe from the code survey.
'''

