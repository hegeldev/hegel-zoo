[[bug]]
id = "es-toolkit/35"
title = "An own __proto__ data key becomes the prototype of the result of cloneDeep, clone, omit, pick, mapValues, assign and others"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinOwnProtoKeyStaysAnOwnKey"
found = { commit = "60fe20d333e6bd097640d7a03948e2d67f4c8ffd", version = "1.52.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`JSON.parse('{"__proto__": {"isAdmin": true}, "x": 1}')` has an own data property named
`__proto__`. lodash copies it as an own key (baseAssignValue uses defineProperty for that
name): `_.cloneDeep(o)` has own keys `["__proto__", "x"]`, its prototype is Object.prototype
and `.isAdmin` is undefined. compat assigns `result["__proto__"] = value`, which sets the
prototype of the result: `cloneDeep(o).isAdmin` is true, and the same happens in `clone`,
`omit(o, "x")`, `pick(o, ["x", "__proto__"])`, `pickBy`, `omitBy`, `mapValues`, `mapKeys`,
`assign({}, o)`, `assignIn`, `defaultsDeep({}, o)`, `cloneDeepWith` (nested objects too),
`zipObject(["__proto__"], [v])`, and `groupBy`/`keyBy`/`countBy` of the key `"__proto__"`
(the result's prototype becomes the group array). The result inherits attacker-controlled
properties, `hasOwnProperty` and friends can be shadowed, and the data key is lost. Upstream's
prototype-pollution guard (tests/__proto__.spec.ts) covers `__proto__` path segments in
merge/set/get/unset/zipObjectDeep, not own keys of input objects; merge, mergeWith and defaults
refuse the key (a documented difference, see the README). Found by TestHegelObjectsLikeLodash
and TestHegelPathsLikeLodash.
'''

