[[bug]]
id = "es-toolkit/2"
title = "transform, pickBy, omitBy, shuffle, sample, sampleSize and findLast treat array-like objects as lists"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinArrayLikeObjectsAreObjects"
found = { commit = "60fe20d333e6bd097640d7a03948e2d67f4c8ffd", version = "1.52.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a plain object with a numeric `length` (`{ length: 2, 0: "x", 1: "y", extra: 1 }`) lodash's
object functions iterate its keys: `_.pickBy(o, () => true)` returns all four properties,
`_.transform(o, (acc, v, k) => acc.push(k), [])` gives `["0", "1", "length", "extra"]`,
`_.shuffle`/`_.sampleSize`/`_.sample` draw from `values(o)` (including 2 and 1) and
`_.findLast({ length: 3, 0: "a", 1: "b", 2: "c" }, () => true)` is `"c"`. compat takes the
object as an array-like: `length` and `extra` are dropped, and findLast returns 3 (the value of
`length`). The reverse also happens: `_.some({ length: 0 }, "toString")` is false in lodash (an
empty array-like) and true in compat, which iterates the object's keys (`(0).toString` is a
function); `every` is affected the same way but vacuously agrees. Found by
TestHegelCollectionsLikeLodash.
'''

