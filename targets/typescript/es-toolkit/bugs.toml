lodash parses `"a."` as `["a", ""]` and `".a"` as `["", "a"]`, so `_.get({ a: { "": -3 } }, "a.")`
is `-3`, `_.has` is `true` and `_.unset` deletes the key. compat's `toPath` gives the same
segments and `set`, `update`, `result`, `invoke` and `method` honour them, but `get`, `has`,
`hasIn`, `at`, `property`, `unset`, `pick` and `omit` return `undefined` / `false` / leave the
object alone: their string-path fast path drops the empty segment. The array form `["a", ""]` and
the bracket form `a[""]` work. Found by TestHegelPathsLikeLodash.
'''

