[[bug]]
id = "es-toolkit/15"
title = "merge deep-copies Date, Map, RegExp, typed-array and class-instance sources into plain objects"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinMergeAssignsNonPlainSources"
found = { commit = "60fe20d333e6bd097640d7a03948e2d67f4c8ffd", version = "1.52.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
lodash's baseMergeDeep recurses only into arrays, typed arrays, plain objects and arguments;
any other object value is assigned by reference: `_.merge({ a: {} }, { a: new Date(0) }).a` is
the Date, likewise a Map, a Set, a RegExp, an Error or a class instance. compat treats every
object as mergeable and produces `{ a: {} }` for the Date/Map/Set/RegExp (their own enumerable
keys are none) and a plain `{ 0: 1 }` for `new Uint8Array([1])`. In the other direction a
typed-array source merged into a typed-array target gives a plain Array in lodash and a typed
array in compat. Merging a Buffer into `[]` gives an Array in lodash and a Buffer in compat.
Found by TestHegelObjectsLikeLodash.
'''

