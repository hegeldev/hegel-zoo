id = "es-toolkit/9"
title = "set, setWith, update and updateWith on a primitive throw instead of returning it"
kind = "crash"
severity = "low"
test = "TestHegelPinSetOnAPrimitiveReturnsIt"
found = { commit = "60fe20d333e6bd097640d7a03948e2d67f4c8ffd", version = "1.52.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
lodash's baseSet starts with `if (!isObject(object)) return object`, so `_.set(5, "a", 1)` is 5,
`_.setWith("", "a.b", 1, Object)` is `""`, `_.update(0, "a", () => 1)` is 0 and the same for a
Symbol. compat throws `TypeError: Cannot create property 'a' on number '5'`. The @types/lodash
signatures take `object`, so the call only type-checks through an `object`-typed value that is
a primitive at run time (loosely typed JSON, for instance); upstream may regard it as out of
scope. Found by TestHegelPathsLikeLodash.
'''

