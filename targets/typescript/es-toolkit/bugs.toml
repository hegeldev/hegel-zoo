# Bugs found in es-toolkit/compat (toss/es-toolkit) by the Hegel zoo's property tests. Each `test`
# is the pin that asserts lodash 4.17.21's behaviour (the oracle: compat promises to match lodash
# exactly for migration) and fails while the bug exists; the properties skip the bug's shape through
# a `Known` switch. Upstream's stated scope (.github/CONTRIBUTING.md, docs/compat/intro.md): a
# compat difference counts only when the call compiles against @types/lodash in strict mode or real
# code makes it; implicit type conversions, the sortedUniq family, chaining, modified prototypes and
# realms are out of scope. Everything here compiles against @types/lodash; the out-of-scope
# differences are listed in the README instead. Upstream's AI Usage Policy asks that issue and PR
# descriptions be written by a human.

[[bug]]
id = "es-toolkit/1"
title = "Array functions split a string argument into code points, lodash into UTF-16 units"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStringsAreUtf16Lists"
found = { commit = "60fe20d333e6bd097640d7a03948e2d67f4c8ffd", version = "1.52.0", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
lodash treats a string passed to an array function as an array-like of UTF-16 code units:
`_.compact("😀a")` is `["\ud83d", "\ude00", "a"]`, `_.uniq`, `_.chunk`, `_.take`, `_.drop`,
`_.head`, `_.last`, `_.flatten`, `_.groupBy`, `_.join`, `_.indexOf("😀a😀", "a")` (2) and
`_.split("😀😁", "")` all index by code unit. compat spreads the string (`Array.from`), so the
same calls give `["😀", "a"]`, `_.indexOf` gives 1, `_.split` gives two emoji. `List<T>` accepts
strings in @types/lodash. Found by TestHegelArraysLikeLodash and TestHegelCollectionsLikeLodash.
'''

