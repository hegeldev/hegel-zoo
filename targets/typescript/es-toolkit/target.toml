name = "es-toolkit"
language = "typescript"
upstream = "https://github.com/toss/es-toolkit"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # .github/CONTRIBUTING.md AI Usage Policy: AI use welcome, issue/PR descriptions must be human-written; AGENTS.md/CLAUDE.md give agents instructions

[base]
commit = "82ce4af4f35e4520e54594db9f1bbee03ee56b71"
date = "2026-09-17"
version = "1.52.0"

[hegel]
version = "0.4.5"

[run]
# A yarn 4 workspace whose package `exports` point at the TypeScript sources and whose dist/ is not
# committed. Hegel, the oracle (lodash 4.17.21) and the TypeScript compiler go under .hegel/ (one
# install: a second `--prefix .hegel` install removes the first); src/ is compiled to CommonJS into
# .hegel/dist (hegel/tsconfig.hegel.json rewrites the `.ts` import specifiers) and the output is
# marked CommonJS. The tests require() .hegel/dist/compat/index.js and compare it with lodash.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 lodash@4.17.21 typescript@5.9.3",
  "node .hegel/node_modules/typescript/bin/tsc -p hegel/tsconfig.hegel.json --noCheck",
  "cp hegel/hegel-dist-package.json .hegel/dist/package.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

