name = "immutable"
language = "typescript"
upstream = "https://github.com/immutable-js/immutable-js"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-15"  # README, .github/CONTRIBUTING.md, SECURITY.md: no AI policy

[base]
commit = "686b8baf1dc825419f5ded2968b48e3432644aff"
date = "2026-09-02"
version = "5.1.9"

[hegel]
version = "0.4.5"

[run]
# The package ships no build; upstream bundles src/Immutable.js with rollup (TypeScript plugin,
# then buble so that the classes are callable without `new`). The zoo builds only the ES bundle
# with the same plugins at the lockfile's versions, installed under test/tools (installing them at
# the root with --omit=dev would skip them: they are devDependencies there) into
# test/.hegel/immutable.mjs (a build product, outside the patch), which the tests import. Hegel
# itself installs at the root. The TypeScript plugin's TS5055 "would overwrite input file"
# warnings are harmless (nothing is written next to the sources).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev @hegeldev/hegel@0.4.5",
  "npm install --prefix test/tools --no-audit --no-fund --no-save --no-package-lock rollup@4.59.0 @rollup/plugin-typescript@12.1.2 @rollup/plugin-commonjs@29.0.3 @rollup/plugin-json@6.1.0 @rollup/plugin-buble@1.0.3 typescript@5.7.3 tslib@2.8.1",
  "node test/tools/node_modules/rollup/dist/bin/rollup -c test/tools/hegel-rollup.config.mjs",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
