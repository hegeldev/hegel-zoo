# Bugs found in fast-json-stringify (fastify/fast-json-stringify) by the Hegel zoo. ids are
# fast-json-stringify/N; see README.md for the properties. The oracle is the README's own
# description of the output (a hand-written model) plus ajv validation of the result.

[[bug]]
id = "fast-json-stringify/1"
title = "largeArrayMechanism and largeArraySize passed to one build() apply to every later build(): they are module-level variables"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLargeArrayOptionsDoNotLeakBetweenBuilds"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
After `build(schemaA, { largeArrayMechanism: 'json-stringify', largeArraySize: 1 })`, a plain `build({ type: 'array', items: { type: 'integer' } })` with no options serializes `[1.5, 2.5]` as `[1.5,2.5]` (no integer coercion) and keeps undeclared keys of object items; before that first call it gives `[1,2]`. `build()` in `index.js` assigns `options.largeArrayMechanism`/`largeArraySize` to the module-scoped `largeArrayMechanism` and `largeArraySize` (with the defaults when the option is absent, so a later options-free build silently resets them for everyone), and the generated array code reads those globals at build time. The README presents both as per-build options; two serializers built with different settings in the same process cannot coexist, and the setting of a library that builds a serializer leaks into an application's own. `rounding` does not have this problem: it is read from the context.
'''

[[bug]]
id = "fast-json-stringify/2"
title = "build() modifies the schema it is given: a type array containing null is sorted in place and an inferred type is written into type-less schemas"
kind = "contract"
severity = "low"
test = "TestHegelPinBuildDoesNotRewriteTheSchema"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`const s = { type: ['string', 'null'] }; build(s)` leaves `s.type` as `['null', 'string']`, and `const s = { properties: { a: { type: 'string' } } }; build(s)` leaves `s.type === 'object'`. `buildValue` does `schema.type.sort(...)` on the caller's array (the comparator `t1 => t1 === 'null' ? -1 : 1` moves `null` to the front, so arrays without `null` happen to keep their order) and `schema.type = inferredType` when the type was inferred from `properties`/`items`/... keywords. The library clones the root schema elsewhere (`cloneOriginSchema`) for its own merges, and nothing in the README says the schema is consumed; a schema shared with a validator, a fastify route or a second build() is changed under it. Both edits are visible in `JSON.stringify(schema)` after the call.
'''

[[bug]]
id = "fast-json-stringify/3"
title = "type: ['string', 'array'] serializes an array as a string ('1,2') because the string branch of a type union also matches arrays"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStringArrayUnionSerializesArrays"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: ['string', 'array'], items: { type: 'integer' } })([1, 2])` is `"1,2"`, while `build({ type: ['array', 'string'], items: { type: 'integer' } })([1, 2])` is `[1,2]`: the output depends on the order the types are listed in. The union is compiled to an if/else chain in the listed order, and the `string` condition (`buildSingleTypeSerializer`'s multi-type case) accepts `typeof === 'string'`, `null`, `Date`, `RegExp`, and any object whose own `toString` is not `Object.prototype.toString`, which every array satisfies; so an array reaching the string branch first is `asString(value.toString())`. The same order dependence makes `['string', 'object']` serialize a plain object with a custom `toString` as its string, and `['object', 'string']` serialize a `Date` as `{}`. JSON Schema's `type` is a set, and the README's Date-to-string rule does not mention arrays.
'''

[[bug]]
id = "fast-json-stringify/4"
title = "Tuple items (items: [...]) reject values the same item schema accepts elsewhere: null for integer, numeric strings, nullable, type-less, anyOf/oneOf and const items all throw 'Item at i does not match schema definition'"
kind = "crash"
severity = "medium"
test = "TestHegelPinTupleItemsAcceptWhatTheirSchemaAccepts"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'array', items: { type: 'integer' } })([null, '5'])` is `[0,5]` (the README's null and string coercions), but `build({ type: 'array', items: [{ type: 'integer' }] })([null])` and `(['5'])` throw `Item at 0 does not match schema definition.`; so do `items: [{ type: 'integer', nullable: true }]` with `[null]`, `items: [{}]` with `[1]`, `items: [{ anyOf: [{ type: 'string' }, { type: 'integer' }] }]` with `['a']`, `items: [{ const: 1 }]` with `[1]` and `items: [{ oneOf: [...] }]` with any value. `buildArray` guards every tuple position with `buildArrayTypeCondition(item.type)`, which knows only the seven single type names (an absent `type` gives the condition `undefined`, so the branch is never taken), ignores `nullable`, and for `integer` demands `Number.isInteger` (a `null` is accepted only by the `string` condition, giving `""`). Non-tuple `items`, `additionalProperties`, `properties` and every other position go through `buildValue` with the documented coercions and union/const handling; only tuples are stricter than the schema.
'''

[[bug]]
id = "fast-json-stringify/5"
title = "additionalItems given as a schema is ignored: items beyond the tuple are JSON.stringify'd verbatim, so integer coercion and property filtering do not apply"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAdditionalItemsSchemaIsApplied"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'array', items: [{ type: 'string' }], additionalItems: { type: 'integer' } })(['a', 1.7])` is `["a",1.7]`, and with `additionalItems: { type: 'object', properties: { a: { type: 'integer' } } }` the item `{ a: 1, b: 2 }` is emitted with its undeclared `b`. `buildArray` treats `additionalItems` as a boolean: when truthy, items past the tuple are appended with `JSON.stringify(obj[i])`; the schema itself is never compiled. Draft 7 defines `additionalItems` as the schema for those items, and the same schema under non-tuple `items` gives `1` and `{"a":1}`. Dates in those positions are still serialized (via toJSON), but BigInts throw from JSON.stringify.
'''

[[bug]]
id = "fast-json-stringify/6"
title = "patternProperties patterns are compiled without the u flag, so Unicode property classes (p{L} and friends) match nothing and the keys are silently dropped"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPatternPropertiesUseUnicodeRegexes"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'object', patternProperties: { '^\\p{L}+$': { type: 'integer' } } })({ abc: 1 })` is `{}`. JSON Schema patterns are ECMA-262 regular expressions in Unicode mode (the specification says implementations "SHOULD" use the `u` flag), and ajv, which this library uses to validate anyOf/if branches, compiles them with `u` by default (`unicodeRegExp: true`), so the same pattern matches in the validator and fails in the serializer. `buildExtraObjectPropertiesSerializer` emits `if (/${pattern}/.test(key))` with no flags; without `u`, `\p{L}` is the literal characters `p{L}` and the branch is never taken, so the key falls through to `additionalProperties` (absent: dropped). Patterns with `\u{...}` escapes or astral-plane classes are affected the same way.
'''

[[bug]]
id = "fast-json-stringify/7"
title = "Property names containing a double quote, backslash, line terminator or backtick break the generated code when the property has an anyOf/oneOf/if schema or is a tuple: build() throws SyntaxError"
kind = "crash"
severity = "medium"
test = "TestHegelPinPropertyNamesAreEscapedInGeneratedCode"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'object', properties: { 'quote"d': { anyOf: [{ type: 'string' }, { type: 'integer' }] } } })` throws `SyntaxError: missing ) after argument list`; with the key `new\nline` it is `Invalid or unexpected token`, with a backtick `missing ) after argument list`, and with `back\slash` build succeeds but serialization throws `no schema with key or ref "...#/properties/backslash/anyOf/0"` (the backslash was consumed as an escape). A key with a line terminator and a tuple schema gives `ReferenceError: line is not defined`. The same keys work with plain `type` schemas (`properties`, `required`, `default` all use `JSON.stringify(key)`), so it is the places that splice the JSON-pointer schema reference into the generated source unescaped: `validator.validate("${schemaRef}", ...)` in `buildMultiTypeSerializer`/`buildAllOf`/`buildIfThenElse`, the `// ${schemaRef}` comments before those blocks, and the tuple code. Property names are part of the schema and, in a schema derived from user-facing data (form fields, database columns), a `"` or newline in a name is a code-injection point; at the least the schema should build or be rejected with a clear error.
'''

[[bug]]
id = "fast-json-stringify/8"
title = "Property names containing / (or ~1) under an anyOf/oneOf/if schema build but throw at serialization: the JSON pointer is not RFC 6901 escaped"
kind = "crash"
severity = "low"
test = "TestHegelPinPropertyNamesWithSlashesResolveInValidators"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'object', properties: { 'a/b': { anyOf: [{ type: 'string' }, { type: 'integer' }] } } })({ 'a/b': 'x' })` throws `Error: no schema with key or ref "__fjs_root_N#/properties/a/b/anyOf/0"`; the key `a~1b` fails the same way (it is read back as `a/b`), while `a~b`, `a%b` and `a b` work. The `Location` class builds `jsonPointer` by `${this.jsonPointer}/${propertyName}` without escaping `~` as `~0` and `/` as `~1`, so the reference handed to ajv (`validator.validate("...#/properties/a/b/anyOf/0")`) names a path that does not exist in the schema ajv was given. Every other code path uses the key as a plain string, so only properties whose schema needs the validator fail, and only when a value for them is serialized.
'''

[[bug]]
id = "fast-json-stringify/9"
title = "patternProperties with an empty pattern ('') makes build() throw SyntaxError: the pattern is emitted as a regex literal, and // is a comment"
kind = "crash"
severity = "low"
test = "TestHegelPinEmptyPatternPropertyMatchesEverything"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'object', patternProperties: { '': { type: 'integer' } } })` throws `SyntaxError: Unexpected identifier 'json'`; a pattern containing a line terminator (`'x\ny'`) throws `Invalid regular expression: missing /`. The empty pattern is a valid regular expression that matches every key (ajv accepts it and applies the schema to all properties), and here it should serialize every undeclared property as an integer. `buildExtraObjectPropertiesSerializer` writes `if (/${pattern}/.test(key))`, escaping only `/`, so an empty pattern becomes `//` and comments out the rest of the line, and a line terminator ends the literal. Compiling `new RegExp(pattern)` once outside the generated code (as ajv does) would take any pattern.
'''

[[bug]]
id = "fast-json-stringify/10"
title = "Properties named like Object.prototype members (constructor, toString, hasOwnProperty, ...) read the inherited function when absent from the input: default ignored, string gives 'function Object() { [native code] }', integer throws"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPrototypePropertyNamesReadOwnValuesOnly"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'object', properties: { constructor: { type: 'string' } } })({})` is `{"constructor":"function Object() { [native code] }"}` where `JSON.stringify({})` (and the README: missing non-required fields are not written) gives `{}`; `{ toString: { type: 'integer', default: 7 } }` with `{}` throws `The value "function toString() { [native code] }" cannot be converted to an integer.` instead of writing the default; `required: ['constructor']` never reports the missing property. The generated property code is `const v = obj["constructor"]; if (v !== undefined) ...`, which finds the inherited `Object.prototype.constructor` on any plain object. `constructor`, `toString`, `valueOf`, `hasOwnProperty`, `__proto__` (gives `"[object Object]"`) are ordinary JSON keys (`constructor` is common in data describing classes or components); a `hasOwnProperty`/`Object.hasOwn` check or a null-prototype read would do.
'''

[[bug]]
id = "fast-json-stringify/11"
title = "format: 'time' serializes a Date as HH:MM:SS with no offset, which is not an RFC 3339 time and is rejected by the library's own anyOf/oneOf validation of that format"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinTimeFormatOutputIsAValidTime"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'string', format: 'time' })(new Date(0))` is `"00:00:00"` (in UTC; `asTime` shifts the instant by the local offset and takes `toISOString().slice(11, 19)`). JSON Schema's `time` format is RFC 3339 `full-time`, which requires an offset (`00:00:00Z` or `00:00:00+01:00`), and ajv-formats, which this library installs into the ajv it validates anyOf/oneOf/if branches with, enforces it: feeding the string back through `build({ oneOf: [{ type: 'string', format: 'time' }, { type: 'integer' }] })` throws `The value of '#' does not match schema definition.` The `date-time` output (`toISOString()`) and the `date` output validate; only `time` produces a value the library will not accept as that format. Either appending the offset (`Z` after the local shift is wrong, so `+HH:MM` of the local zone, or serializing in UTC with `Z`) or documenting the output as a local wall-clock time would make the two sides agree.
'''

[[bug]]
id = "fast-json-stringify/12"
title = "A default or const value containing a $ref or $id key, inside an anyOf/oneOf option or if/then/else branch, is read as a schema: build() throws 'Cannot resolve ref' or 'schema.$id.charAt is not a function'"
kind = "crash"
severity = "low"
test = "TestHegelPinRefKeysInsideDefaultsAreData"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ type: 'object', properties: { a: { anyOf: [{ type: 'boolean' }, { type: 'object', properties: { alpha: { type: 'string' }, v: { type: 'object', default: { $ref: 'x' } } }, required: ['alpha'] }] } } })` throws `Error: Cannot resolve ref "x#". Schema with id "x" is not found.`; with `default: { $id: 5 }` it throws `TypeError: schema.$id.charAt is not a function`; `const: { $ref: 'x' }` in the same position throws too. The identical `default`/`const` outside a validated branch (a plain property, `additionalProperties`, `items`) serializes as `{"$ref":"x"}`. When a branch needs ajv, `getSchemaDependencies` walks the option schema for `$ref` strings to register their schemas, and json-schema-ref-resolver walks it for `$id`s; both descend into `default`, `const`, `enum` and `examples`, which hold data, not schema. A default that is a JSON-Reference-shaped object (an API that carries `$ref` links, a JSON-LD `@id`-like field) cannot be used under anyOf.
'''

[[bug]]
id = "fast-json-stringify/13"
title = "Standalone code without inlineValidators validates anyOf/oneOf/if branches with the unconverted schemas, so a Date under type: string no longer matches and the generated serializer throws where the original accepts"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinStandaloneValidatorsAcceptDates"
found = { commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc", version = "7.0.1", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`build({ anyOf: [{ type: 'string' }, { type: 'integer' }] })(new Date(0))` is `"1970-01-01T00:00:00.000Z"`, but the module produced by `build(schema, { mode: 'standalone' })` (the default `inlineValidators: false`), loaded and called with the same `Date`, throws `TypeError: The value of '#' does not match schema definition.`; the same happens for a Date in a `format: 'date'` property of an object option. `Validator.addSchema` converts a clone of each schema for ajv (`type: string` becomes `type: ['string', 'object']` plus the `fjs_type` keyword, which is how Dates and other `toJSON` objects match string branches, PR 441) but records the *unconverted* schema in `_ajvSchemas`; `getState()` serializes those, and `restoreFromState` adds them to a fresh ajv without calling `convertSchemaToAjvFormat`. So the validators the standalone module rebuilds at load time are stricter than the ones `build()` used, and the README's promise that standalone code behaves like the built function does not hold for Dates in unions. `inlineValidators: true` (ajv standalone code generated from the converted schemas) is not affected.
'''
