name = "fast-json-stringify"
language = "typescript"
upstream = "https://github.com/fastify/fast-json-stringify"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, CONTRIBUTING and .github say nothing about AI in this repository; the fastify organisation's CONTRIBUTING rejects "pure-AI contributions with no human in the loop": nothing here is ever reported upstream automatically

[base]
commit = "367c8e0c64163c47cc934ce1ed3c38875a1c22fc"
date = "2026-09-18"
version = "7.0.1"

[hegel]
version = "0.4.5"

[run]
# Plain CommonJS with no build: the tests require ../index.js, so the runtime dependencies (ajv,
# ajv-formats, @fastify/merge-json-schemas, fast-uri, json-schema-ref-resolver, rfdc) are installed
# in node_modules; Hegel goes under .hegel/.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinLargeArrayOptionsDoNotLeakBetweenBuilds = "fast-json-stringify/1"
TestHegelPinBuildDoesNotRewriteTheSchema = "fast-json-stringify/2"
TestHegelPinStringArrayUnionSerializesArrays = "fast-json-stringify/3"
TestHegelPinTupleItemsAcceptWhatTheirSchemaAccepts = "fast-json-stringify/4"
TestHegelPinAdditionalItemsSchemaIsApplied = "fast-json-stringify/5"
TestHegelPinPatternPropertiesUseUnicodeRegexes = "fast-json-stringify/6"
TestHegelPinPropertyNamesAreEscapedInGeneratedCode = "fast-json-stringify/7"
TestHegelPinPropertyNamesWithSlashesResolveInValidators = "fast-json-stringify/8"
TestHegelPinEmptyPatternPropertyMatchesEverything = "fast-json-stringify/9"
TestHegelPinPrototypePropertyNamesReadOwnValuesOnly = "fast-json-stringify/10"
TestHegelPinTimeFormatOutputIsAValidTime = "fast-json-stringify/11"
TestHegelPinRefKeysInsideDefaultsAreData = "fast-json-stringify/12"
TestHegelPinStandaloneValidatorsAcceptDates = "fast-json-stringify/13"
