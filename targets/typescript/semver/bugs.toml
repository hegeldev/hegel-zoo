# Bugs found in semver (npm/node-semver) by the Hegel zoo. ids are semver/N; see README.md for the properties.

[[bug]]
id = "semver/1"
title = "gtr and ltr report a prerelease that the prerelease rule excludes as beyond the range, both at once"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGtrAndLtrBothTrue"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`gtr(version, range)` is documented as 'version is greater than all the versions possible in the range' and `ltr` as lower than all of them. `outside()` returns false only when the version satisfies the range or lies against a bound; a prerelease such as `1.5.0-alpha` does not satisfy `^1.0.0` (the prerelease rule: no comparator has the 1.5.0 tuple) and is neither below `>=1.0.0` nor above `<2.0.0-0`, so both `gtr('1.5.0-alpha', '^1.0.0')` and `ltr('1.5.0-alpha', '^1.0.0')` are true. One-sided cases exist too: `gtr('1.0.0-0', '<10.4.2')` is true although 10.4.1 satisfies the range. Such a version is excluded from the range without being outside its span; both functions should be false for it.
'''

[[bug]]
id = "semver/2"
title = "numeric prerelease identifiers are compared as doubles, so identifiers beyond 2^53 that differ compare equal"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBigNumericIdentifiersCompareEqual"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
The SemVer constructor keeps a numeric identifier above MAX_SAFE_INTEGER as a string, but `compareIdentifiers` converts two numeric strings with `+a`/`+b` before comparing, so `compare('1.0.0-9007199254740993', '1.0.0-9007199254740992')` is 0 and `compare('1.0.0-18446744073709551616', '1.0.0-18446744073709551615')` is 0 where the spec (numeric identifiers are compared numerically) says 1. Comparing the digit strings by length and then lexically (or with BigInt) would be exact.
'''

[[bug]]
id = "semver/3"
title = "simplifyRange sorts the caller's array of versions in place"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSimplifyRangeSortsItsInput"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`ranges/simplify.js` does `versions.sort(...)` on the argument itself, so `simplifyRange(vs, range)` reorders `vs`; `maxSatisfying`, `minSatisfying`, `sort` and `rsort` document or avoid such mutation (`sort` returns the sorted list and is named for it). A caller that passes its version list to `simplifyRange` and then relies on its order (the order of a registry's `versions` array, for instance) is silently affected.
'''

[[bug]]
id = "semver/4"
title = "minVersion ignores includePrerelease: it returns 0.0.0 for * and 2.0.3 for >2.0.2 where 0.0.0-0 and 2.0.3-0 satisfy the range"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinMinVersionIgnoresIncludePrerelease"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`minVersion` tries `0.0.0` before `0.0.0-0`, and for a `>` comparator takes `patch + 1` without a prerelease, so under `includePrerelease` (where `0.0.0-0` satisfies `*` and `2.0.3-0` satisfies `>2.0.2`) it returns a version that is not the lowest possible match. The README defines it as 'the lowest version that can possibly match the given range'.
The same shortcut without includePrerelease: `minVersion('>=0.0.0-pre')` is `0.0.0`, although `0.0.0-pre` satisfies the range through its own tuple and is lower (found by the rewritten membership property, 2026-09-24).
'''

[[bug]]
id = "semver/5"
title = "simplifyRange returns the empty string, which as a range means any version, when no version matches"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSimplifyRangeOfNothingIsEverything"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
With no matching version `ranges/simplify.js` builds no pieces, joins them to `''`, and since `''.length` is shorter than the original returns `''`; `new Range('')` (and `satisfies(v, '')`) means every version. So `simplifyRange(['1.0.0', '2.0.0'], '>3.0.0 <2.0.0')` is `''` and `satisfies('1.0.0', '')` is true, the opposite of the original range on the given versions. Returning the original range (or `<0.0.0-0`) would keep the contract.
'''

[[bug]]
id = "semver/6"
title = "compareBuild returns 0 as soon as two build identifiers are numerically equal but textually different, without looking at the rest"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCompareBuildStopsAtLeadingZeros"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`compareBuild` walks the identifiers and, for two that are not `===`, returns `compareIdentifiers(a, b)` directly; for `001` and `1` that is 0 (both numeric, equal as numbers), so the loop ends with 0 instead of continuing to the next identifier. `compareBuild('1.0.0+001', '1.0.0+1.1')` is 0 while `compareBuild('1.0.0+1', '1.0.0+1.1')` is -1 and `compareBuild('1.0.0+001', '1.0.0+1')` is 0: the relation is not transitive. (Build identifiers may have leading zeros; the same loop in `comparePre` never sees this because numeric prerelease identifiers are converted to numbers first.)
'''

[[bug]]
id = "semver/7"
title = "intersects is asymmetric for an exact prerelease comparator against *: true one way, false the other"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIntersectsIsAsymmetricForPrereleases"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`Comparator.intersects` with the ANY comparator on the left returns true unconditionally, and on the right tests the other comparator's version against `*`, which the prerelease rule fails for `2.0.0-alpha`. So `intersects('*', '2.0.0-alpha')` is true and `intersects('2.0.0-alpha', '*')` is false, while `satisfies('2.0.0-alpha', '*')` is false (so false is the consistent answer without includePrerelease). The range-level property found it as `intersects(a, b) !== intersects(b, a)`.
'''

[[bug]]
id = "semver/8"
title = "gtr and ltr keep the lowest lower bound of a set, so with two lower bounds a version between them is reported as greater than the range"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinGtrTakesTheLowestLowerBound"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`outside()` scans each set for the comparator with the highest version (`high`) and the lowest (`low`) and reads the range's edges off those two, assuming one bound each way. `^3.0.0 >=3.1.2` desugars to `>=3.0.0 <4.0.0-0 >=3.1.2`: `low` is `>=3.0.0`, and since 3.0.0 is not below it `gtr('3.0.0', '^3.0.0 >=3.1.2')` is true although 3.1.2 satisfies the range. Likewise `ltr('2.0.0', '<=2.0 1.2.1')` is true (the range is exactly 1.2.1). The effective bounds are the highest lower bound and the lowest upper bound.
'''

[[bug]]
id = "semver/9"
title = "minVersion returns null when an unsatisfiable alternative carries the lowest lower bound"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMinVersionNullFromAnUnsatisfiableAlternative"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`minVersion` computes a candidate per `||` alternative from its lower bounds, keeps the lowest across alternatives, and returns it only if it satisfies the whole range. For `>2.0.0 <1.0.0 || >=3.0.0` the first alternative is empty but yields 2.0.1, which is lower than 3.0.0 and satisfies nothing, so the result is null although 3.0.0 is the minimum. The per-alternative candidate should be checked against its own alternative (or the search should continue to the next lowest).
'''

[[bug]]
id = "semver/10"
title = "inc past MAX_SAFE_INTEGER returns a version string that valid rejects, instead of null"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIncPastMaxSafeIntegerIsInvalid"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`SemVer.inc` does `this.major++` (minor, patch likewise) with no range check, so `inc('9007199254740991.0.0', 'major')` is `'9007199254740992.0.0'`, which `valid()` and `parse()` reject (the constructor enforces `<= MAX_SAFE_INTEGER`). `inc` otherwise returns null for anything it cannot do.
'''

[[bug]]
id = "semver/11"
title = "simplifyRange's hyphen ranges admit prereleases of their endpoints under includePrerelease that the original range excludes"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSimplifyRangeHyphenAdmitsPrereleases"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
Under `includePrerelease` a hyphen range `a - b` desugars to `>=a-0 <b+1-0` (upstream's fixtures: `1.0.0 - 2.0.0` is `>=1.0.0-0 <2.0.1-0`), so it includes prereleases of `a` that `>=a` does not. `simplifyRange` builds `min - max` from the matching versions, so for the versions `1.0.0-0 1.0.0 1.0.1 2.0.0` and the range `>=1.0.0 <=1.0.1` it returns `1.0.0 - 1.0.1`, which admits the given `1.0.0-0` while the original excludes it; the contract is that the simplified range matches the same given versions.
'''

[[bug]]
id = "semver/12"
title = "a range with a component at MAX_SAFE_INTEGER throws Invalid minor/patch version from the desugaring, so validRange rejects it and satisfies is false for its versions"
kind = "crash"
severity = "low"
test = "TestHegelPinRangeAtMaxSafeIntegerThrows"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`~1.9007199254740991` desugars to `>=1.9007199254740991.0 <1.9007199254740992.0-0`, and the upper bound's constructor throws `Invalid minor version`; `validRange` turns it into null, `satisfies('1.9007199254740991.5', '~1.9007199254740991')` is false, and `minVersion('>1.0.9007199254740991', {includePrerelease: true})` throws `Invalid patch version` out of the library. The versions themselves are valid (components up to MAX_SAFE_INTEGER are accepted); the bound one past the maximum could be treated as unbounded.
'''

[[bug]]
id = "semver/13"
title = "subset and intersects take a set with an exact prerelease comparator and a bound as empty: a subset of everything, intersecting nothing"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSubsetTakesAnExactPrereleaseSetAsEmpty"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`simpleSubset` checks the `=` comparator against the `>=`/`<` bounds one at a time with `satisfies(eq, String(gt))`; for `3.0.3-alpha` against `>=3.0.0` alone the prerelease rule says no (no comparator with the 3.0.3 tuple), so the set is declared null and `subset('3.0.3-alpha >=3.0.0', '>=30.0.0')` is true. But `3.0.3-alpha` does satisfy `3.0.3-alpha >=3.0.0` (the `=` comparator supplies the tuple), and it does not satisfy `>=30.0.0`. `Range.intersects` has the same flaw through `isSatisfiable` (each pair of comparators is tested alone): `intersects('3.0.3-alpha >=3.0.0', '3.0.3-alpha >=3.0.0')` is false, a non-empty range not intersecting itself. The check should test the exact version against the whole set, or use includePrerelease for the bound checks.
The same across two ranges: `intersects('1.2.3-alpha', '^1.2.3-alpha')` is false (the exact comparator of one range is tested alone against the `<2.0.0-0` bound of the other) while `satisfies('1.2.3-alpha', '^1.2.3-alpha')` is true (found by the rewritten membership property, 2026-09-24).
'''

[[bug]]
id = "semver/14"
title = "gtr and ltr with both bounds on one version (1.1.2 - 1.1.2) report a higher version as lower than the range"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLtrWithEqualBounds"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`outside()` picks `high` and `low` with strict comparisons, so when two comparators share a version (`>=1.1.2 <=1.1.2`, what the hyphen range `1.1.2 - 1.1.2` desugars to) the first one is both edges; for `ltr` the edge is then `>=1.1.2`, which is neither a `<` operator nor `<=`, and `ltr('1.1.3', '>=1.1.2 <=1.1.2')` is true. Ties should be broken by operator (the `<`/`<=` comparator is the upper edge).
'''

[[bug]]
id = "semver/15"
title = "inc with identifierBase false and an identifier equal to the current prerelease returns the input unchanged when the prerelease ends in a number (inc('1.2.3-0', 'prerelease', undefined, '0', false) is '1.2.3-0'), where the alphanumeric case returns null"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIncWithAnExistingNumericIdentifierReturnsTheInput"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
notes = '''
`classes/semver.js`, case 'pre': the loop increments the last numeric prerelease identifier first, and only when nothing was incremented (`i === -1`) does the guard `identifier === this.prerelease.join('.') && identifierBase === false` throw "identifier already exists" (which `inc()` turns into null: `inc('1.2.3-alpha', 'prerelease', undefined, 'alpha', false)` is null). When the prerelease ends in a number the guard never runs: `1.2.3-0` becomes `1.2.3-1`, then `isPrereleaseIdentifier(['1'], '0')` is false and the prerelease is reset to `[identifier]` = `['0']`, so `inc('1.2.3-0', 'prerelease', undefined, '0', false)` returns `'1.2.3-0'`, the input itself; likewise `'1.2.3-1'` + `'1'` and `'1.2.3-alpha.1'` + `'alpha.1'`. An increment that is neither null nor higher than its input; the README says inc "simply increments" a prerelease. The guard should run before the increment (or compare against the prerelease as it was).
'''

[[bug]]
id = "semver/16"
title = "intersects is false for a range below a prerelease of 0.0.0 ('<0.0.0-alpha' against itself or '>=0.0.0-0') although 0.0.0-0 satisfies it and minVersion returns 0.0.0-0"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinIntersectsBelowZeroPrerelease"
found = { commit = "6e05b7637396ac66522cff8731f07cfe0ef49a29", version = "7.8.5 (v7.8.5, main 2026-06-19)", hegel = "0.4.5", date = "2026-09-24" }
status = "open"
notes = '''
`classes/comparator.js`, `intersects`, "Special cases where nothing can possibly be lower": without includePrerelease any comparator whose value starts with `<0.0.0` returns false. That is right for `<0.0.0` itself, but `<0.0.0-alpha` admits `0.0.0-0` under the prerelease rule (a prerelease of the comparator's own tuple), and the library agrees elsewhere: `satisfies('0.0.0-0', '<0.0.0-alpha')` is true and `minVersion('<0.0.0-alpha')` is `0.0.0-0`. So `intersects('<0.0.0-alpha', '<0.0.0-alpha')` and `intersects('<0.0.0-alpha', '>=0.0.0-0')` are false: a non-empty range intersecting neither itself nor a range that contains its only version. With includePrerelease the answer is true. The shortcut should apply only to `<0.0.0` (no prerelease) or, as the includePrerelease branch does, to `<0.0.0-0`. Distinct from semver/7 and semver/13, which concern exact prerelease comparators.
'''
