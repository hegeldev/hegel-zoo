name = "dayjs"
language = "typescript"
upstream = "https://github.com/iamkun/dayjs"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # CONTRIBUTING.md and README: no AI policy

[base]
commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3"
date = "2026-09-15"
version = "1.11.22"  # dev head after the v1.11.22 tag; package.json says 0.0.0-development

[hegel]
version = "0.4.5"

[run]
# The published package is built by rollup from src/ (ES modules with a babel-only `export default`
# shape) and dist/ is not committed. Hegel, the oracle (moment 2.31.0 + moment-timezone 0.6.4) and
# esbuild go under .hegel/ (one install: a second `--prefix .hegel` install removes the first);
# hegel/build.mjs bundles src/index.js, every src/plugin/*/index.js and five locales to CommonJS
# in .hegel/dist. The tests require() .hegel/dist/dayjs.cjs and compare it with moment, switching
# process.env.TZ per test case.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 moment@2.31.0 moment-timezone@0.6.4 esbuild@0.28.2",
  "node hegel/build.mjs",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinUtcDefaultFormatIsZ = "dayjs/1"
TestHegelPinTzPre1970KeepsMilliseconds = "dayjs/2"
TestHegelPinOrdinalDateParses = "dayjs/3"
