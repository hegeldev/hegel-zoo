TestHegelPinUtcOffsetSixteenIsMinutes = "dayjs/5"
TestHegelPinParseNamesCaseInsensitive = "dayjs/6"
TestHegelPinDurationDaysStayDays = "dayjs/7"
TestHegelPinFractionalSecondsScale = "dayjs/8"
TestHegelPinFractionalAddSubtractSymmetric = "dayjs/9"
TestHegelPinMixedSignDurationNormalises = "dayjs/10"
TestHegelPinUtcOffsetAcrossHostDst = "dayjs/11"
TestHegelPinEndOfHourInRepeatedHour = "dayjs/12"
TestHegelPinStrictSubsecondTokens = "dayjs/13"
TestHegelPinStrictOffsetToken = "dayjs/14"
TestHegelPinSmallYearsStay = "dayjs/15"
TestHegelPinUtcOffsetKeepLocalFromUtc = "dayjs/16"
