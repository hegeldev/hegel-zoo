# Bugs found in dayjs by the Hegel zoo. One [[bug]] per finding; `test` names the pin that fails
# while the bug exists (listed under [expected_failures] in target.toml). The oracle is moment
# 2.31.0 with moment-timezone 0.6.4 (dayjs's own devDependencies pin moment 2.29.2); every entry
# below was confirmed by hand against dayjs's documentation at day.js.org, not only against moment.
# Upstream has no AI-contribution policy (CONTRIBUTING.md, README checked 2026-09-17).

[[bug]]
id = "dayjs/1"
title = "Default UTC format ends in +00:00 instead of Z once localizedFormat or advancedFormat is loaded"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUtcDefaultFormatIsZ"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs.utc(0).format() is "1970-01-01T00:00:00Z" with the utc plugin alone (documented) and
"1970-01-01T00:00:00+00:00" as soon as localizedFormat or advancedFormat is also extended:
both plugins wrap format() and hand the default template to the core formatter, which does
not know the utc plugin's Z rule. moment prints "Z".
'''

[[bug]]
id = "dayjs/2"
title = "tz() of a pre-1970 instant with milliseconds is a second off and reports a fractional offset"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTzPre1970KeepsMilliseconds"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs(-1500).tz("America/New_York"): utcOffset() is -300.0167, format("Z") is "-05:0.016..."
and the instant is one second early. The timezone plugin splits the value into whole seconds
and milliseconds with `%`, whose result is negative before the epoch, so the millisecond part
is subtracted twice. moment-timezone: -300 and the same instant.
'''

[[bug]]
id = "dayjs/3"
title = "An ISO 8601 ordinal date (2019-048) is parsed as year-month-day"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinOrdinalDateParses"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs("2019-048") is April 8 2019 (the parse regex takes "04" as the month and "8" as the
day); "2019-366" gives nonsense. dayjs documents that it parses ISO 8601 strings; the
ordinal form YYYY-DDD is part of the standard and moment reads it as February 17.
'''

[[bug]]
id = "dayjs/4"
title = "set() of a plugin unit is a no-op and get() of one throws, while the method forms work"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinSetGetPluginUnits"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With quarterOfYear, weekOfYear, isoWeek, weekday and dayOfYear loaded, x.quarter(3) works but
x.set("quarter", 3) returns x unchanged; the same for week, isoWeek, weekday, isoWeekday and
dayOfYear. x.get("dayOfYear") and x.get("isoWeekday") throw TypeError. The getter/setter docs
say get/set accept the same units as the methods.
'''

[[bug]]
id = "dayjs/5"
title = "utcOffset(16) and utcOffset(-16) are treated as hours"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUtcOffsetSixteenIsMinutes"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The docs: an offset "less than 16 and greater than -16" is read as hours, otherwise minutes.
dayjs(0).utcOffset(16).utcOffset() is 960 (16 hours); moment gives 16.
'''

[[bug]]
id = "dayjs/6"
title = "customParseFormat matches month names and meridiems case-sensitively"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinParseNamesCaseInsensitive"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs("3 nov 2018", "D MMM YYYY") and dayjs("3 NOV 2018", ...) are Invalid Date;
dayjs("11 PM", "h a").hour() is 11 (the upper-case meridiem against the lower-case token is
ignored, the hour is not shifted). moment accepts all of these (23 for the last).
'''

[[bug]]
id = "dayjs/7"
title = "duration(n, unit) bubbles days into 365/12-day months; getters and toISOString change"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDurationDaysStayDays"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs.duration(45, "days").toISOString() is "P1M14DT14H" while duration("P45D") and
duration({days: 45}) give "P45D"; duration(7, "week").hours() is 14. The (n, unit) constructor
converts to milliseconds and re-derives the components with a 30.4166-day month, so days()
and hours() report remainders that were never in the input. moment: "P45D", 0.
'''

[[bug]]
id = "dayjs/8"
title = "A fractional second in an ISO string is read as milliseconds by digit count"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinFractionalSecondsScale"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs("2019-01-01T00:00:00.5").millisecond() is 5, ".12" gives 12 and ".05" gives 5: the parse
regex captures the digits after the dot and uses them as an integer millisecond count. With a
Z suffix the string falls through to Date and is right (500). moment: 500, 120, 50.
'''

[[bug]]
id = "dayjs/9"
title = "add(1.5, day) adds two days but subtract(1.5, day) removes one"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinFractionalAddSubtractSymmetric"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Day-and-up units round the amount with Math.round, which rounds halves towards +infinity:
x.add(1.5, "day") is two days later, x.subtract(1.5, "day") (= add(-1.5)) one day earlier;
add(1.5, "month") adds one month. moment rounds halves away from zero (2 and 2).
'''

[[bug]]
id = "dayjs/10"
title = "A duration built from mixed-sign components renders and reports them unnormalised"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinMixedSignDurationNormalises"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs.duration({hours: -1, minutes: 30}) is -30 minutes (asMilliseconds agrees) but
toISOString() is "-PT1H30M" (a duration of -90 minutes), {hours: 100, minutes: -96} renders
as "-PT100H96M" and {days: 1, hours: -1} as "-P1DT1H"; minutes() returns the raw 30.
moment: "-PT30M", -30.
'''

[[bug]]
id = "dayjs/11"
title = "utcOffset(n) is an hour off when the host zone changes offset between the instant and the shifted wall time"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinUtcOffsetAcrossHostDst"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With TZ=Europe/London, dayjs(1585433700000).utcOffset(8) (2020-03-28T22:15Z, the night London
moves to BST) formats as 07:15 +08:00; the instant is 06:15 at +08:00 in every zone. The utc
plugin adds the new offset to the local wall time and re-reads the host offset there, picking
up the transition. The same happens in utc mode and for .tz(zone) and dayjs.tz(string, zone),
which build on utcOffset. moment: 06:15.
'''

[[bug]]
id = "dayjs/12"
title = "startOf/endOf, diff and day arithmetic in a repeated DST hour resolve to the earlier occurrence"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinEndOfHourInRepeatedHour"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With TZ=Europe/Paris, dayjs(1698541200000) is the second 02:00 of 2023-10-29; its
endOf("hour") is 00:59:59Z, an hour before the instant itself, and startOf("hour") and
startOf("second") are an hour early too. dayjs rebuilds instants from wall-clock fields with
the Date constructor, which picks the first of two occurrences; diff(..., "month", true),
add(0, "day"), the setters, endOf("day") on a day whose last hour repeats (Kolkata 1945-10-14)
and tz(zone) when the target wall time is repeated or missing in the host zone show the same
shift. moment: 01:59:59Z.
'''

[[bug]]
id = "dayjs/13"
title = "Strict parsing rejects the documented S and SS fraction tokens"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStrictSubsecondTokens"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs("02:07:27.09/April 2096", "HH:mm:ss.SS/MMMM YYYY", true) is Invalid Date: strict mode
re-formats the parsed date with the same string and format("SS") prints the literal "SS"
(S and SS are parse tokens only), so the round trip never matches. SSS is fine. moment: valid.
'''

[[bug]]
id = "dayjs/14"
title = "Strict parsing with a Z token only accepts a +00:00 offset"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStrictOffsetToken"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs("2020-01-01T00:00:00+02:00", "YYYY-MM-DDTHH:mm:ssZ", true).isValid() is false (true for
"+00:00"): the strict round trip formats the result in the host zone, whose offset differs
from the parsed one. moment: valid.
'''

[[bug]]
id = "dayjs/15"
title = "Years 0-99 come out as 1900-1999 from parsing, startOf/endOf and week getters"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSmallYearsStay"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs("0001-01-01").year() is 1901 and "0099-12-31" is 1999 ("0100-01-01" is 100); for an
instant in the year 50, startOf("year") and endOf("month") land in 1950, isoWeek() is -99112
and format("WW") prints it. The Date constructor's two-digit-year rule is used without
setFullYear. moment: 1, 50, 24.
'''

[[bug]]
id = "dayjs/16"
title = "utcOffset(n, true) on a UTC-mode instant shifts by the host offset"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUtcOffsetKeepLocalFromUtc"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With TZ=Europe/London, dayjs.utc("2020-06-01T00:00:00Z").utcOffset(-5, true).valueOf() is
1590991200000 (06:00Z) instead of 1590987600000 (05:00Z, the kept wall time 00:00 at -05:00);
with TZ=Pacific/Auckland it is off by 11.5 hours. keepLocalTime uses the host offset of the
instant, not the instant's own (UTC) offset. In local mode it agrees with moment.
'''

[[bug]]
id = "dayjs/17"
title = "weekday(n) is shifted by a DST gap that falls on the start of the week"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinWeekdayAcrossDstGap"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With TZ=Australia/Lord_Howe, dayjs(1601824140017) is Monday 2020-10-05 02:09 (+11:00).
weekday(2) is Tuesday 02:39 while day(2), add(1, "day") and moment give 02:09. The weekday
plugin goes to the start of the week first (Sunday 2020-10-04, where 02:09 falls in the
02:00-02:30 gap and becomes 02:39) and adds the days from there, keeping the shifted time.
'''

[[bug]]
id = "dayjs/18"
title = "A negative ISO 8601 duration (-PT1H) loses its sign"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinNegativeIsoDuration"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs.duration("-PT1H").asMilliseconds() is 3600000 and toISOString() "PT1H". The duration
regex captures the leading sign as its first group and the constructor drops that group
before reading the components. "PT-1H" keeps its sign, and dayjs itself emits the "-P..."
form from toISOString(), so its own output does not round-trip. moment: -3600000.
'''

[[bug]]
id = "dayjs/19"
title = "A comma decimal mark in an ISO 8601 duration silently drops the component"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommaDecimalIsoDuration"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs.duration("PT14,75S").asMilliseconds() is 0 and "P327DT100M14,75S" comes out 14.75
seconds short: the regex accepts "," in a number but Number("14,75") is NaN, which the sum
treats as 0. ISO 8601 allows the comma (it is the preferred decimal sign). moment: 14750.
'''

[[bug]]
id = "dayjs/20"
title = "customParseFormat fails when a word token is followed by the dot separator"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinDotAfterWordToken"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs("Nov.2018", "MMM.YYYY"), dayjs("1:04 am.02/06/1941", "h:mm a.DD/MM/YYYY") and
dayjs("1st.11.2018", "Do.MM.YYYY") are Invalid Date, while "," "-" and " " in the same place
work and "2018.Nov" (dot before the word) is fine. The word matcher excludes the other
documented separators but not "." (the docs list "-_:.,()/"), so it swallows "am." and the
meridiem, month or ordinal is unknown. moment parses all three.
'''

[[bug]]
id = "dayjs/21"
title = "A duration with a weeks component has days() 0 and is not added to a date"
kind = "inconsistent"
severity = "high"
test = "TestHegelPinWeeksCountAsDays"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
dayjs.duration("P1W") and duration({weeks: 1}) render as "P7D" and have asDays() 7, but
days() is 0 (duration("P7D").days() is 7; weeks() is 1 for all of them), and
dayjs.utc("2020-01-01").add(dayjs.duration({weeks: 1})) is still 2020-01-01: adding a
duration to a date goes through days() and never looks at weeks. duration(1, "week") is
fine (it is stored as milliseconds). moment: 7 and 2020-01-08.
'''

[[bug]]
id = "dayjs/22"
title = "tz(zone, true) takes the target offset at the original instant, not at the kept wall time"
kind = "wrong-result"
severity = "high"
test = "TestHegelPinTzKeepLocalOffset"
found = { commit = "436bde0bcded312781cbe45dc2b0ef079a36d8e3", version = "1.11.22", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With TZ=America/Los_Angeles, dayjs(1572763980000) is 2019-11-02 23:53; .tz("America/New_York",
true) keeps 23:53 but stamps it -05:00 (New York was still on EDT at 23:53 that Saturday; it
moved to EST at 02:00 Sunday, which is the original instant's UTC time) and its format("z")
says "EDT" against its own "-05:00". valueOf is 1572756780000; moment-timezone gives -04:00
and 1572753180000.
'''
