name = "msgpackr"
language = "typescript"
upstream = "https://github.com/kriszyp/msgpackr"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-18"  # README, SECURITY.md, .github/ (workflows only), no CONTRIBUTING: nothing about AI

[base]
commit = "a9b9f1aa062461b333b48e66288da00e89ca8035"
date = "2026-08-27"
version = "2.1.0"

[hegel]
version = "0.4.5"

[run]
# The library is plain JavaScript (node-index.js re-exports index.js plus the streams); it has no
# runtime dependencies (msgpackr-extract, the optional native addon, is not installed, so the pure
# JS decoder is exercised, as in browsers and Deno). Hegel and the second implementation used as
# an oracle, @msgpack/msgpack, go under .hegel/ in one install so the lock file stays untouched.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 @msgpack/msgpack@3.1.3",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinTypedArrayWithoutMoreTypesIsItsBytes = "msgpackr/1"
TestHegelPinBundledMultibyteStringsRoundTrip = "msgpackr/2"
TestHegelPinLoneSurrogatesAreWrittenAsUtf8 = "msgpackr/3"
TestHegelPinInvalidDateIsAValidTimestamp = "msgpackr/4"
TestHegelPinUnpackrStreamErrorsOnATruncatedTail = "msgpackr/5"
TestHegelPinCoercibleKeysRoundTrip = "msgpackr/6"
TestHegelPinFloat32BoundMatchesTheDocumentation = "msgpackr/7"
TestHegelPinTimestampUsesTheSmallestFormat = "msgpackr/8"
TestHegelPinRoundFloat32ReturnsTheRoundedDecimal = "msgpackr/9"
# Properties that find the same bugs.
TestHegelTypedArraysAreTheirBytesOrTheirType = "msgpackr/1"
TestHegelBundledStringsRoundTrip = { bug = "msgpackr/2", intermittent = true }
TestHegelStringsAreUtf8AndRoundTrip = "msgpackr/3"
TestHegelStreamsReportATruncatedTail = "msgpackr/5"
TestHegelCoercibleKeysKeepTheirNames = "msgpackr/6"
TestHegelFloat32OptionsFollowTheirDocumentation = { bug = "msgpackr/7", intermittent = true }
TestHegelDatesRoundTrip = { bug = "msgpackr/8", intermittent = true }
TestHegelRoundFloat32RoundsToTheFloat32Digits = { bug = "msgpackr/9", intermittent = true }
