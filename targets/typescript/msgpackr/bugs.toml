# Bugs found in msgpackr by the Hegel zoo. One [[bug]] per finding; `test` names the pin in
# hegel/hegel.test.mjs that fails while the bug exists (listed under [expected_failures] in
# target.toml). Oracles: an independent model of the MessagePack specification
# (hegel/msgpack-model.mjs), @msgpack/msgpack 3.1.3 as a second implementation, and msgpackr's
# README. No CONTRIBUTING file; README, SECURITY.md and .github/ say nothing about AI (checked
# 2026-09-18).

[[bug]]
id = "msgpackr/1"
title = "A typed array other than Uint8Array packed without moreTypes becomes a bin of garbage: elements truncated to bytes, then stale buffer contents"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinTypedArrayWithoutMoreTypesIsItsBytes"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Without the moreTypes option an ArrayBufferView is written as MessagePack bin, but the writer
copies `byteLength` *elements* of the view as bytes: pack(new Uint16Array([1, 2])) is
`c4 04 01 02 xx xx` where the last two bytes are whatever the internal buffer held (the probe saw
ae 7f, 00 00, 91 6e on successive runs); pack(new Int32Array([1, -1])) gives 01 ff 00 00 00 00
xx xx (-1 truncated to 0xff), pack(new Float64Array([1.5])) gives 01 00 00 00 00 00 00 00 (1.5
truncated to 1). Neither the values nor the underlying bytes survive, and the output differs
between runs. A Uint8Array/Buffer is fine (its elements are its bytes) and so is any view with
moreTypes (ext 0x74 with the type code). Either the bytes of the view (`new Uint8Array(ta.buffer,
ta.byteOffset, ta.byteLength)`) should be written, or the value should be refused; writing
garbage silently is the worst of the three. Found by the typed-array property; the pin packs
Uint16Array [1, 2, 3] and Float64Array [1.5] and expects their bytes back.
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/2"
title = "bundleStrings corrupts or rejects its own output once a bundle of multi-byte strings exceeds 64 KiB"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinBundledMultibyteStringsRoundTrip"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The string bundle is flushed when it holds more than MAX_BUNDLE_SIZE = 0x5500 *characters*, but
its length field is the 16-bit length of an ext 16 written in *bytes*, and the counter is reset
before the string that triggered the flush is counted. With 3-byte UTF-8 characters 21 760 chars
are 65 280 bytes and the next string overflows the field. new Packr({bundleStrings: true}):
packing an array of 23 strings of 1000 CJK characters (U+4E2D) and unpacking it returns the
wrong strings without any error; 20 strings of 4000 characters throw "Data read, but end of
buffer not reached". Strings of 1- and 2-byte characters (ASCII, Latin, Cyrillic) and 4-byte ones
(emoji, two UTF-16 units each) are fine, so the corruption appears only with CJK or similar text.
Found by the bundled-strings round-trip property; the pin uses the two cases above.
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/3"
title = "Lone surrogates are written as three-byte sequences that are not UTF-8 (and differently in strings of 64 characters or more)"
kind = "contract"
severity = "low"
test = "TestHegelPinLoneSurrogatesAreWrittenAsUtf8"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MessagePack str holds UTF-8. For strings under 64 characters msgpackr's own UTF-8 writer encodes
an unpaired surrogate as the three bytes ED A0 80 .. ED BF BF (WTF-8), which no UTF-8 decoder
accepts: pack("a\\ud800b") is a5 61 ed a0 80 62, TextDecoder in fatal mode rejects the payload,
and msgpackr's own unpack turns it into three U+FFFD ("a\\ufffd\\ufffd\\ufffdb"). Strings of 64
characters or more go through Buffer.utf8Write, which substitutes one U+FFFD, so the same
surrogate is written differently depending on the length of the string around it. Encoding the
surrogate as U+FFFD (what JSON.stringify's well-formed output and Buffer do) would make the bytes
valid and the round trip predictable. Found by the strings property.
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/4"
title = "An invalid Date is written as a 1-byte timestamp extension (d4 ff ff), which is not a MessagePack timestamp"
kind = "contract"
severity = "medium"
test = "TestHegelPinInvalidDateIsAValidTimestamp"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The timestamp extension (type -1) exists in 4-, 8- and 12-byte forms only. pack(new Date(NaN))
produces fixext 1 / type -1 / data ff. msgpackr reads it back as an invalid Date, but every other
implementation rejects the message: @msgpack/msgpack throws DecodeError "Unrecognized data size
for timestamp (expected 4, 8, or 12): 1", and the spec model in the harness likewise. The README
says an invalid date "will be encoded as an invalid timestamp (which decodes with msgpackr back
to an invalid date)"; documented or not, one invalid Date anywhere in a message makes the whole
message unreadable outside msgpackr, silently for the writer. onInvalidDate exists to substitute
a value, but the default should be interoperable (nil, or a throw). Found while checking the
oracle on msgpackr's timestamps.
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/5"
title = "UnpackrStream ends without an error when its input stops inside a message"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinUnpackrStreamErrorsOnATruncatedTail"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
UnpackrStream keeps the bytes of an incomplete message until the next chunk arrives, but it has no
_flush: when the writable side ends with such a remainder pending, the stream emits 'end' with no
error and the partial message is dropped. Writing pack({a: "hello world", b: [1, 2, 3]}) minus
its last two bytes and ending the stream yields no data event and no error; the same after a
complete message delivers the complete one and loses the rest silently. A consumer cannot tell a
truncated transfer from a complete one. Found by the truncated-tail stream property (100 of 100
random truncations end quietly).
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/6"
title = "coercibleKeyAsNumber rewrites keys that merely look numeric (01, 1.0, 1e2, ' 1', '', 0x10) and merges the ones that collide"
kind = "silent-corruption"
severity = "low"
test = "TestHegelPinCoercibleKeysRoundTrip"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With coercibleKeyAsNumber a key is packed as Number(key) whenever that is not NaN, so "01",
"1.0", " 1", "1 " all become the integer 1, "" becomes 0, "1e2" becomes 100, "0x10" becomes 16,
"4294967296" and "9007199254740993" become float 64 (the latter as 9007199254740992). On decoding
the key is the number's string: {"01": "a", "1": "b"} round-trips to {"1": "b"}, {"": 1} to
{"0": 1}. A key should only be coerced when the number's canonical string is the key itself
(String(Number(key)) === key), which is the condition under which the round trip holds. The
option is in index.d.ts but not in the README. Found by the coercible-keys property.
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/7"
title = "useFloat32 applies to numbers up to 2^32, not to those below 2147483648 in absolute value as documented"
kind = "documentation"
severity = "low"
test = "TestHegelPinFloat32BoundMatchesTheDocumentation"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README ("32-bit Float Options"): ALWAYS "will encode non-integers (absolute less than 2147483648)
as 32-bit float". The guard in pack.js is `value < 0x100000000 && value >= -0x80000000`, so
2147483648.5 and 4294967295.5 are written as float 32 (2147483648 and 4294967296 come back)
while -2147483648.5 stays a float 64. Either the bound or the sentence is wrong; the property
follows the README. Found by the float32 options property.
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/8"
title = "Dates with seconds in [2^32, 2^34) are written in the 96-bit timestamp format although the 64-bit one holds them"
kind = "contract"
severity = "low"
test = "TestHegelPinTimestampUsesTheSmallestFormat"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README ("Dates"): "using the smallest of 32-bit, 64-bit or 96-bit format needed to store the
date without data loss". The 64-bit timestamp holds 34 bits of seconds (up to the year 2514), but
pack.js uses it only while seconds < 2^32: pack(new Date(4294967296000)) (2106-02-07) is the
15-byte c7 0c ff 00 00 00 00 00 00 00 01 00 00 00 00 where the 10-byte d7 ff 00 00 00 01 00 00
00 00 encodes the same instant. Also the 32-bit form is skipped for dates whose milliseconds are
zero unless useTimestamp32 is set or the time is exactly 0 (the `ms === 0` check), so most whole
-second dates take 10 bytes instead of 6. Found by the dates property (smallest-format check).
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "msgpackr/9"
title = "roundFloat32 returns float artefacts instead of the rounded decimal for large numbers (200000950442 -> 200000999999.99997)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRoundFloat32ReturnsTheRoundedDecimal"
found = { commit = "a9b9f1aa062461b333b48e66288da00e89ca8035", version = "2.1.0", hegel = "0.4.5", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
roundFloat32 is documented to "round floating point numbers to the maximum significant decimal
digits that can be stored in 32-bit float, just as DECIMAL_ROUND does when decoding". It scales
by a power of ten from a table, rounds, and divides back; for magnitudes where that power is not
exact in binary the result is not a decimal at all: roundFloat32(200000950442) is
200000999999.99997 (7 significant digits would give 200001000000), roundFloat32(-374138971790)
is -374138999999.99994, roundFloat32(1.5611642629958897e+24) is 1.5611639999999998e+24. Below
2^31 the results are clean decimals, so DECIMAL_ROUND decoding (which only applies there) is not
affected; the exported function is. Found by the roundFloat32 property.
'''

[[bug.observed]]
version = "2.1.0"
commit = "a9b9f1aa0624"
hegel = "0.4.5"
date = "2026-09-18"
result = "reproduces"
