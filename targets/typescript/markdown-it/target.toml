name = "markdown-it"
language = "typescript"
upstream = "https://github.com/markdown-it/markdown-it"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # CONTRIBUTING.md: "AI tools may assist, but the submitter must remain the author"; README, docs/, .github/: nothing else. The zoo files no issues and opens no PRs upstream.

[base]
commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3"
date = "2026-09-11"
version = "15.0.2"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript since 15.0.0; node 22 loads it directly with --experimental-strip-types (the
# upstream tests do the same), so there is no build. The runtime dependencies come from the root
# install; Hegel and the oracles go under .hegel/: commonmark.js (the reference implementation),
# micromark with its GFM extensions (tables, strikethrough), and markdown-it 14.3.0, the last
# release before the TypeScript rewrite.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 commonmark@0.31.2 markdown-it@14.3.0 micromark@4.0.2 micromark-extension-gfm@3.0.0",
]
command = "node --experimental-strip-types --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinLeadingBomIsNotText = "markdown-it/1"
TestHegelPinInvalidCharacterReferenceInDestinationBecomesReplacementChar = "markdown-it/2"
TestHegelPinUnclosedFenceAtEofKeepsItsLastLine = "markdown-it/3"
TestHegelPinIndentedQuoteMarkerIsCodeOrLazyText = "markdown-it/4"
TestHegelPinContinuationIndentIsStrippedInsideInlines = "markdown-it/5"
TestHegelPinBracketedDestinationKeepsItsWhitespace = "markdown-it/6"
TestHegelPinBlockAfterTightItemParagraphStartsOnItsOwnLine = "markdown-it/7"
TestHegelPinBlankLinesInsideAnUnclosedFenceKeepTheListTight = "markdown-it/8"
TestHegelPinTableHeaderRowCannotStartAnotherBlock = "markdown-it/9"
TestHegelPinLazyLineAfterDefinitionStaysInTheItem = "markdown-it/10"
TestHegelPinPartialTabAfterQuoteMarkerExpandsToSpaces = "markdown-it/11"
TestHegelPinIndentedLineShortOfItemOffsetIsLazyText = "markdown-it/12"
TestHegelPinDefinitionSurvivesAnEmptyTitleFollowedByText = "markdown-it/13"
TestHegelPinBracketedHostThatIsNotAnAddressIsKept = "markdown-it/14"
TestHegelPinClosingBracketCountsForFlankingInsideLinkText = "markdown-it/15"
TestHegelPinThreeOrMoreTildesDoNotStrike = "markdown-it/16"
# Unsteered 2026-10-07 (STYLE.md rule 11): every recorded shape is drawn by default and a mismatch
# that a recorded bug's gate or normaliser explains fails naming it ("shape of markdown-it/N");
# HEGEL_NO_KNOWN=1 counts and skips such cases and skips the narrow properties. Per 1000 cases the
# commonmark.js differential meets /1 54, /11 138, /4 133, /3 80, /2 39, /15 27, /6 24, /5 18,
# /9 12 ... (29% of its cases; it shrinks to the byte order mark), the utils property meets /2 in
# 11% and shrinks to unescapeAll("&#0;"); the micromark differential reaches /9 about five times.
TestHegelCommonMarkPresetAgreesWithCommonmarkJs = "markdown-it/1" # also /2-/6, /9-/13, /15, /17, /18
TestHegelUtilsMatchTheirModels = "markdown-it/2"
TestHegelDefaultPresetAgreesWithMicromarkGfm = { bug = "markdown-it/9", intermittent = true } # also /1, /4, /11, /16
# One narrow property per bug, over its shape region with random contents: deterministic.
TestHegelALeadingByteOrderMarkIsNotText = "markdown-it/1"
TestHegelInvalidCharacterReferencesOutsideTextDecodeToTheReplacementCharacter = "markdown-it/2"
TestHegelAnUnclosedFenceAtTheEndOfTheDocumentKeepsItsLastLine = "markdown-it/3"
TestHegelAQuoteMarkerIndentedFourColumnsIsCodeOrLazyText = "markdown-it/4"
TestHegelContinuationIndentIsStrippedInsideInlineTagsAndCodeSpans = "markdown-it/5"
TestHegelWhitespaceAtTheEndsOfABracketedDestinationIsPercentEncoded = "markdown-it/6"
TestHegelBlocksAfterATightItemParagraphStartOnTheirOwnLine = "markdown-it/7"
TestHegelBlankLinesEndingAnUnclosedFenceKeepTheListTight = "markdown-it/8"
TestHegelALineStartingAnotherBlockIsNotATableHeaderRow = "markdown-it/9"
TestHegelLinesAfterADefinitionStayInItsParagraph = "markdown-it/10"
TestHegelTheRestOfATabAfterQuoteMarkersCountsAsSpaces = "markdown-it/11"
TestHegelIndentedLineShortOfTheItemOffsetContinuesTheItem = "markdown-it/12"
TestHegelAnEmptyTitleFollowedByTextLeavesTheDefinitionWithoutATitle = "markdown-it/13"
TestHegelBracketsOfAHostThatIsNotAnAddressAreKept = "markdown-it/14"
TestHegelTheClosingBracketOfLinkTextCountsForFlanking = "markdown-it/15"
TestHegelARunOfThreeOrMoreTildesDoesNotStrike = "markdown-it/16"
TestHegelBackslashBeforeALineEndingEndsTheDestination = "markdown-it/17"
TestHegelPinBackslashBeforeLineEndingEndsTheDestination = "markdown-it/17"
TestHegelLinkTextWithALinkInsideAnImageIsNotALink = "markdown-it/18"
TestHegelPinLinkTextWithALinkInsideAnImageIsNotALink = "markdown-it/18"
