name = "markdown-it"
language = "typescript"
upstream = "https://github.com/markdown-it/markdown-it"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-17"  # CONTRIBUTING.md: "AI tools may assist, but the submitter must remain the author"; README, docs/, .github/: nothing else. The zoo files no issues and opens no PRs upstream.

[base]
commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3"
date = "2026-09-11"
version = "15.0.2"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript since 15.0.0; node 22 loads it directly with --experimental-strip-types (the
# upstream tests do the same), so there is no build. The runtime dependencies come from the root
# install; Hegel and the oracles go under .hegel/: commonmark.js (the reference implementation),
# micromark with its GFM extensions (tables, strikethrough), and markdown-it 14.3.0, the last
# release before the TypeScript rewrite.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 commonmark@0.31.2 markdown-it@14.3.0 micromark@4.0.2 micromark-extension-gfm@3.0.0",
]
command = "node --experimental-strip-types --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinLeadingBomIsNotText = "markdown-it/1"
TestHegelPinInvalidCharacterReferenceInDestinationBecomesReplacementChar = "markdown-it/2"
TestHegelPinUnclosedFenceAtEofKeepsItsLastLine = "markdown-it/3"
TestHegelPinIndentedQuoteMarkerIsCodeOrLazyText = "markdown-it/4"
TestHegelPinContinuationIndentIsStrippedInsideInlines = "markdown-it/5"
TestHegelPinBracketedDestinationKeepsItsWhitespace = "markdown-it/6"
TestHegelPinBlockAfterTightItemParagraphStartsOnItsOwnLine = "markdown-it/7"
TestHegelPinBlankLinesInsideAnUnclosedFenceKeepTheListTight = "markdown-it/8"
TestHegelPinTableHeaderRowCannotStartAnotherBlock = "markdown-it/9"
TestHegelPinLazyLineAfterDefinitionStaysInTheItem = "markdown-it/10"
TestHegelPinPartialTabAfterQuoteMarkerExpandsToSpaces = "markdown-it/11"
TestHegelPinIndentedLineShortOfItemOffsetIsLazyText = "markdown-it/12"
TestHegelPinDefinitionSurvivesAnEmptyTitleFollowedByText = "markdown-it/13"
TestHegelPinBracketedHostThatIsNotAnAddressIsKept = "markdown-it/14"
TestHegelPinClosingBracketCountsForFlankingInsideLinkText = "markdown-it/15"
TestHegelPinThreeOrMoreTildesDoNotStrike = "markdown-it/16"
