# Bugs found in markdown-it by the Hegel tests in hegel.patch. Each row's `test` is the pin that
# asserts the correct (CommonMark / GFM) behaviour and fails while the bug exists; the spec version
# is 0.31.2 (the one in test/fixtures/commonmark/spec.txt). commonmark.js 0.31.2 and micromark
# 4.0.2 are the oracles; every row below is a case where both give the spec's answer.

[[bug]]
id = "markdown-it/1"
title = "A leading byte order mark is rendered as text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLeadingBomIsNotText"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`md.render("\\ufeffa\\n")` gives `<p>\\ufeffa</p>` — the U+FEFF stays in the paragraph text.
commonmark.js, micromark and cmark all skip a leading BOM (the spec is silent; every reference
implementation strips it, as text editors write it on Windows). The `normalize` core rule only
rewrites line endings and NUL.
"""

[[bug]]
id = "markdown-it/2"
title = "Invalid numeric character references are left literal in link destinations, titles and info strings"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinInvalidCharacterReferenceInDestinationBecomesReplacementChar"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Spec 6.2: "Invalid Unicode code points will be replaced by the REPLACEMENT CHARACTER (U+FFFD).
For security reasons, the code point U+0000 will also be replaced." The inline `entity` rule does
this, but `utils.unescapeAll` (used for destinations, titles and fence info strings) returns the
match unchanged when `isValidEntityCode` is false, so `[a](&#0;)` links to `&amp;#0;` where the
oracles give `%EF%BF%BD`; `&#x110000;` and `&#xD800;` likewise. (The fixture `fatal.txt` records
the current output for `&#xD800;` under the heading "should not throw", not as the wanted value.)
"""

[[bug]]
id = "markdown-it/3"
title = "An unclosed fence at the end of the document loses its last line's newline (or the line itself)"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnclosedFenceAtEofKeepsItsLastLine"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"```\\na" (no final newline) renders `<pre><code>a</code></pre>`; commonmark.js and micromark give
`<pre><code>a\\n</code></pre>`, as for indented code ("    a" gives `a\\n` in markdown-it too). When
the last line is whitespace only ("```\\n   " or "~~~\\n ") it disappears entirely. Same inside
list items and quotes.
"""

[[bug]]
id = "markdown-it/4"
title = "A '>' indented four columns after a blockquote line is read as another quote marker"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIndentedQuoteMarkerIsCodeOrLazyText"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
">\\n    >" is one empty blockquote; the spec (5.1: a block quote marker is indented 0–3 spaces)
makes the second line an indented code block containing ">", which both oracles produce. With text
in the quote, "> a\\n\\t> b" gives `<p>a\\nb</p>` where the spec gives the lazy continuation
`<p>a\\n&gt; b</p>`. The blockquote rule's continuation check does not compare the marker's
indentation against the 4-column limit.
"""

[[bug]]
id = "markdown-it/5"
title = "Indentation of paragraph continuation lines is kept inside raw HTML tags and code spans"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinContinuationIndentIsStrippedInsideInlines"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Spec 4.8: a paragraph's raw content is its lines with initial whitespace removed. "- <a\\n     b>"
renders `<li><a\\n   b></li>` (the three columns beyond the item's content offset survive inside
the tag); "4. `a\\n    b`" gives `<code>a  b</code>` instead of `<code>a b</code>`. The `newline`
inline rule strips the spaces only for text, not inside `html_inline`/`backticks` matches. At the
top level the oracles differ from each other ("<a\\n    a>" is `<a\\na>` in commonmark.js and
`<a\\n a>` in micromark), so the pin uses the list-item shape where they agree.
"""

[[bug]]
id = "markdown-it/6"
title = "Whitespace inside a <bracketed> link destination is dropped instead of percent-encoded"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBracketedDestinationKeepsItsWhitespace"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Spec 6.3: a destination in pointy brackets may contain spaces and tabs (only line endings and
unescaped < > are excluded). `[a](<x >)` should link to `x%20` (both oracles); markdown-it gives
`x`, and `[a](<x\\ty>)` gives `x` as well — `normalizeLink` runs the URL through mdurl, which trims
whitespace, and the tab case loses everything after the tab. Same for reference definitions.
"""

[[bug]]
id = "markdown-it/7"
title = "A fence or HTML block right after a tight list item's paragraph is glued to the text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBlockAfterTightItemParagraphStartsOnItsOwnLine"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"- a\\n  ```\\n  x\\n  ```" renders `<li>a<pre><code>x` where the oracles (and markdown-it for a
heading, quote or rule in the same place) put a newline after `a`. `Renderer.renderToken` inserts
the newline before a block token that follows a hidden paragraph; the `fence`, `code_block` and
`html_block` renderer rules bypass `renderToken` and never check the previous token. Also
"- a\\n  <div>" gives `<li>a<div>`.
"""

[[bug]]
id = "markdown-it/8"
title = "Blank lines that end an unclosed fence at the end of a list item make the list loose"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinBlankLinesInsideAnUnclosedFenceKeepTheListTight"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"- ```\\n\\n- b" renders the second item as `<li>\\n<p>b</p>\\n</li>`: the blank line inside the
fence's content is counted as a blank line between items. Both oracles keep the list tight
(`<li>b</li>`), as the spec's definition of a loose list only counts blank lines between block
children. With the fence closed ("- ```\\n\\n  ```\\n- b") markdown-it is right.
"""

[[bug]]
id = "markdown-it/9"
title = "A GFM table header row swallows a line that starts a list item, quote, heading or fence"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTableHeaderRowCannotStartAnotherBlock"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
"- a|b\\n-|-" is a table with the cell `- a`; "# a|b\\n-|-" a table with the cell `# a`; the same
for `> a|b`, `1. a|b` and "```a|b". GFM (cmark-gfm, GitHub, micromark) reads the container or leaf
block first and gets a list item, a heading, a quote, a fence. The `table` block rule runs first in
the chain and accepts any line with the right cell count as the header row.
"""

[[bug]]
id = "markdown-it/10"
title = "A lazy continuation line after a link reference definition is dropped from its container"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLazyLineAfterDefinitionStaysInTheItem"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The spec takes definitions out of paragraphs, so the paragraph's lazy continuation lines stay
where the paragraph was: "- [r]: /u\\n x" is `<ul><li>x</li></ul>` and "> [a]: /u\\nx" is a quote
containing `<p>x</p>` (both oracles). markdown-it's `reference` block rule ends at the definition
and the next line closes the item or quote: `<ul><li></li></ul><p>x</p>`. At the top level
"[a]: /u\\n    x" becomes indented code instead of the paragraph `x`.
"""

[[bug]]
id = "markdown-it/11"
title = "The remainder of a tab after blockquote markers is miscounted"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinPartialTabAfterQuoteMarkerExpandsToSpaces"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Spec 2.2: when a tab is partly consumed by a block structure, the rest behaves as spaces (example
6: ">\\t\\tfoo" gives two spaces of code indentation — which markdown-it gets right). Two shapes go
wrong: ">\\t<div>" writes the HTML block line with the raw tab where the oracles write two spaces
(the html_block rule copies source lines verbatim), and ">>  \\ta" loses one column of the code
block's indentation (`<pre><code>a` instead of `<pre><code> a`).
"""

[[bug]]
id = "markdown-it/12"
title = "A line indented four columns but short of the item's content offset ends the list item"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinIndentedLineShortOfItemOffsetIsLazyText"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
" 5)  a\\n    ***": the item's content starts at column 5; the second line is indented 4, so it is
not item content, and as indented code cannot interrupt a paragraph it is a lazy continuation of
`a` (spec 5.2 and 4.8; both oracles give `<li>a\\n***</li>`). markdown-it closes the list and emits
`<pre><code>***`. The list rule's "is this line still ours" test only looks at the item offset.
"""

[[bug]]
id = "markdown-it/13"
title = "A reference definition followed by an empty quoted title and text is rejected entirely"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDefinitionSurvivesAnEmptyTitleFollowedByText"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Spec example 216: when the would-be title line is not a valid title, the definition stands without
a title and the line is a paragraph. "[a]: /u\\n'x' y" is handled that way, but "[a]: /u\\n'' x"
(an empty quoted title followed by text) is no definition at all: `<p>[a]: /u\\n'' x</p>` and a
later `[a]` stays literal, where the oracles give `<p>'' x</p>` and a link. The reference rule
treats the empty title string as "no title parsed" and does not fall back to the destination-only
form.
"""

[[bug]]
id = "markdown-it/14"
title = "The brackets of a host that is not an IPv6 literal are stripped from the href and the link text"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinBracketedHostThatIsNotAnAddressIsKept"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`<http://[x]>` renders `<a href="http://x">http://x</a>`: `normalizeLink` and `normalizeLinkText`
(mdurl.parse's IPv6 handling, extended in 15.0.1 for #1204) drop the brackets of any `[...]` host,
so the visible text changes too; `[t](http://[]/x)` links to `http:///x`. The oracles keep the
characters and percent-encode them (`http://%5Bx%5D`). Valid literals such as `[::1]` are kept
(accepted difference: the oracles encode those brackets as well).
"""

[[bug]]
id = "markdown-it/15"
title = "The closing bracket of link text is not seen when deciding whether a delimiter run can open"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinClosingBracketCountsForFlankingInsideLinkText"
found = { commit = "3c51991c32aaa2b002a52c009334ebe5752c84b3", version = "15.0.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In "[**a_*]()" the final `*` is preceded by `_` and followed by `]`, so it is both left- and
right-flanking, and the rule of three (2 + 1 delimiters) forbids it to close the `**`; the spec
result is the literal `**a_*` inside the link, which both oracles give and markdown-it gives for
"**a_*]" outside a link. Inside link text markdown-it renders `*<em>a_</em>`: the link's inline
content is balanced on its own, and the `]` that follows is treated like the end of the input
(whitespace), which makes the `*` right-flanking only.
"""
