# Bugs found in lru-cache by the Hegel zoo. One [[bug]] per finding; `test` names the pin that fails
# while the bug exists (listed under [expected_failures] in target.toml). The oracle is a model of
# the documented behaviour (typedoc comments in src/index.ts and the README); every entry below was
# confirmed by hand against the documentation and the source. Upstream has no AI-contribution
# policy (CONTRIBUTING.md, README, .github/ checked 2026-09-17).

[[bug]]
id = "lru-cache/1"
title = "An entry whose TTL start time is 0 never expires: the README's perf-mock recipe starting at 0, or set(k, v, { start: 0 })"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinZeroStartExpires"
found = { commit = "16b3a916662ab449d496b7b4b4f04132565d1d28", version = "11.5.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `let myClockTime = 0; new LRUCache({ max: 10, ttl: 1000, perf: { now: () => myClockTime } })`
— the README's "Testing" section verbatim — an entry set while the clock reads 0 is still
returned by get() and has() after myClockTime = 5000, and getRemainingTTL() gives Infinity.
The TTL code uses a start of 0 as the marker for "no TTL" (`starts[index] = ttl !== 0 ? start : 0`,
`isStale = !!t && !!s && now - s > t`, `getRemainingTTL: if (!ttl || !start) return Infinity`), so
a genuine start of 0 is indistinguishable from none. The same happens for set(k, v, { start: 0 })
although `start` is documented as an explicit start time, and for Date.now()-based platforms it
cannot happen, which is why only mocked clocks show it. The ttlAutopurge timer is still armed for
such an entry and finds it never stale, so it re-arms forever. load() can produce the shape by
itself: it re-stamps each dumped start as start - (Date.now() elapsed since dump), so with a
mocked clock reading 1 an entry loaded a millisecond after it was dumped lands on start 0 and
never expires (seen once in a 3000-case sweep; the property skips a load in that window).
'''

[[bug]]
id = "lru-cache/2"
title = "set() of an entry larger than maxSize but within maxEntrySize evicts every entry, drops the new one and leaves calculatedSize negative"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinOversizeEntryRejected"
found = { commit = "16b3a916662ab449d496b7b4b4f04132565d1d28", version = "11.5.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
new LRUCache({ maxSize: 10, maxEntrySize: 20 }); set("a", 1, { size: 8 }); set("b", 2, { size: 15 })
leaves size 0, keys [] and calculatedSize -15. The entry passes the maxEntrySize check, is linked
in and given its size, and #addItemSize then evicts from the head while
`calculatedSize > maxSize - size` — a bound that is negative, so it evicts "a", then the new
entry itself (subtracting its already-recorded size, hence the negative total), and stops only
because the total went below the bound. From then on the cache admits maxSize + 15 of data
before evicting. The constructor accepts maxEntrySize > maxSize without complaint although such an
entry can never fit; either the constructor should reject the combination or set() should treat
the entry like one over maxEntrySize (documented: "will not cache the item or evict any old
items").
'''

[[bug]]
id = "lru-cache/3"
title = "With noDisposeOnSet, the disposeAfter calls for entries evicted by a set() are postponed until some later operation"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinDisposeAfterEviction"
found = { commit = "16b3a916662ab449d496b7b4b4f04132565d1d28", version = "11.5.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
new LRUCache({ max: 1, noDisposeOnSet: true, disposeAfter: log }); set("a", 1); set("b", 2): the
eviction of "a" calls dispose("a", "evict") at once but disposeAfter("a", "evict") only when the
next delete()/clear()/pop()/set() without noDisposeOnSet drains the queue. #set ends with
`if (!noDisposeOnSet && this.#hasDisposeAfter && this.#disposed) drain()`, so the option meant
to "suppress calling the dispose function if the entry key is still accessible within the cache"
(the overwrite case) also holds back the after-callbacks of the evictions the same set() made,
which have nothing to do with an overwrite. disposeAfter is documented as being called "after
the entry is completely removed and the cache is once again in a clean state".
'''

[[bug]]
id = "lru-cache/4"
title = "set(key, sameValue, { size }) keeps the old size (and ignores sizeCalculation) although it does reset the TTL"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinSameValueSetSize"
found = { commit = "16b3a916662ab449d496b7b4b4f04132565d1d28", version = "11.5.2", hegel = "0.4.5", date = "2026-09-17" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
new LRUCache({ maxSize: 100 }); set("k", "v", { size: 5 }); set("k", "v", { size: 50 }) leaves
info("k").size and calculatedSize at 5. In #set the update branch only calls #removeItemSize /
#addItemSize when `v !== oldVal`; for the same value (status "update") the size is computed by
#requireSize (sizeCalculation is called) and discarded, while the TTL is reset unless
noUpdateTTL. The set() docs say the size option "will prevent calling the sizeCalculation
function and just use the specified number", with no exception for an unchanged value, and a
value whose size changed (a mutated object, a resized buffer) is exactly the case where the
same reference is set again with a new size.
'''
