name = "lru-cache"
language = "typescript"
upstream = "https://github.com/isaacs/node-lru-cache"
subdir = ""
license = "BlueOak-1.0.0"
ai_policy_checked = "2026-09-17"  # CONTRIBUTING.md (pledge link only), README, .github/: no AI policy

[base]
commit = "7e71a1f3babdc68dfbadde91f28eaeea919dad9b"
date = "2026-09-18"
version = "11.5.3"

[hegel]
version = "0.4.5"

[run]
# src/index.ts is TypeScript and dist/ is not committed (upstream builds with tshy). Hegel and esbuild
# go under .hegel/; hegel/build.mjs runs the esbuild binary to bundle src/index.ts to
# .hegel/dist/index.mjs, which the tests import. lru-cache has no runtime dependencies.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 esbuild@0.25.9",
  "node hegel/build.mjs",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinZeroStartExpires = "lru-cache/1"
TestHegelPinOversizeEntryRejected = "lru-cache/2"
TestHegelPinDisposeAfterEviction = "lru-cache/3"
TestHegelPinSameValueSetSize = "lru-cache/4"
