'''

[[bug]]
id = "yaml/26"
title = "a flow collection opened directly after a quoted scalar puts the internal FLOW_END marker (U+0018) into the CST, which CST.stringify then writes out"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCstHasNoInternalMarkers"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For the source `- '{'[ x` followed by a line break, concatenating `CST.stringify` over `new Parser().parse(src)` gives the source plus a U+0018 (CANCEL) character; `k: '{'[ x\n...\n` and `- a\n- '{'[ x: 1\n...\n` likewise gain the marker before the `...` or at the end. The lexer emits `FLOW_END` (U+0018, exported from CST as the marker of an unterminated flow collection's end) as an internal token; when the `[` follows a quoted scalar without a separator the parser records the marker as a source token instead of dropping it, and the CST, presented in docs/07_parsing_yaml.md as retaining exactly the input's characters, now contains a control character that was never in the input. A plain scalar before the `[` (`- a [ x`) is unaffected. Found by the CST round trip on mutated documents. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/27"
title = "with an indent option other than 2, a mapping value block scalar whose text starts with spaces is written with indicator 2 but content at the wider indent, so it reads back with extra spaces"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinBlockScalarIndicatorFollowsTheIndentOption"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify({ a: '  x\n' }, { indent: 4 })` is `a: |2` followed by `x` at six spaces; `parse` of it gives `{ a: '    x\n' }`: the indicator says the content starts two columns in, the content was written at the option's four plus the value's two, and the parser keeps the difference as content. `{ indent: 6 }` gives `'      x\n'`, `{ a: { b: '  x\ny\n' } }` with `{ indent: 3 }` gives `'   x\n y\n'` (the second line even loses alignment). With the default indent of 2 the two coincide and the round trip holds, and sequence items (`- |2-`) are written correctly at every indent. src/stringify/stringifyString.ts computes the indicator from the value's leading spaces assuming the content will sit at the parent's indent plus 2 rather than plus the `indent` option. Found by the stringify round trip. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/28"
title = "YAML 1.1 timestamps with a year below 100 parse as years 1900 to 1999"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinTimestampsBeforeTheYear100KeepTheirYear"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('0001-01-01', { schema: 'yaml-1.1' })` is the Date `1901-01-01T00:00:00.000Z`; `0099-12-31T23:59:59Z` becomes 1999, `0000-01-01` becomes 1900, while `0100-01-01` is right. src/schema/yaml-1.1/timestamp.ts builds the value with `Date.UTC(year, month - 1, day, ...)`, and `Date.UTC` maps a year argument from 0 to 99 to 1900 plus that year (the two-digit-year rule of the ECMAScript spec), so every timestamp in the first century is moved by 1900 years; `setUTCFullYear` after construction, or checking the range, avoids it. The stringifier writes such dates back as `0001-01-01`, so a document round trip through a Date changes the value silently. The regex documents four-digit years including 0000. Found by the stringify round trip (its date generator includes the year 1). Also in yaml@2.9.1.
'''

[[bug]]
