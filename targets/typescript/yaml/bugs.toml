fixed_in = ""
notes = '''
`doc = new Document([1, 2, 3]); doc.value.fill(0); doc.value.set(1, 5); doc.toJS()` is `[5, 5, 5]`, expected `[0, 5, 0]`; `doc.value[0] === doc.value[2]`. The override in src/nodes/YAMLSeq.ts converts the value to a node once and passes that node to `Array.prototype.fill`, so the slots share one Scalar, and `set()` on a slot holding a Scalar assigns to that shared node's `value` (docs/05_content_nodes.md: "Non-node values are converted to Node values"). Found by the Document API model. New in v3 (v2 had no `fill`).
'''

