[[bug]]
id = "yaml/24"
title = "with collectionStyle block and indentSeq false an empty sequence value is written on its own line at the key's column, which does not parse"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinBlockStyleWithoutIndentSeqKeepsEmptySequencesParseable"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify({ a0: [] }, { collectionStyle: 'block', indentSeq: false })` is `a0:` followed by `[]` on the next line at column 0, and parsing it gives `MISSING_CHAR` (Implicit map keys need to be followed by map values); `[{ a: [] }]` becomes `- a:` then `  []` at the key's column, with the same error. With `collectionStyle: 'block'` alone the `[]` is indented under the key and parses; with `indentSeq: false` alone the empty sequence stays inline (`a0: []`). An empty sequence cannot be written in block style, so the flow `[]` is emitted, but on the block path the pair puts it on a new line and `indentSeq: false` removes the indentation meant for `- ` items, leaving a flow collection at the key's own indentation. Empty mappings (`{}`) are indented correctly on the same path. Both options are documented (docs/03_options.md). Found by the stringify round trip. Also in yaml@2.9.1.
'''

[[bug]]
