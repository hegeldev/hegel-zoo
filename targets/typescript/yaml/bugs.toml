# Bugs found in yaml (eemeli/yaml, the 3.0.0 prerelease) by the Hegel zoo. ids are yaml/N; see
# README.md for the properties. "also in yaml@2" marks bugs the previous stable release shares;
# the others are regressions of the v3 rewrite. The oracle is the library's own documentation,
# the YAML 1.2 spec, yaml@2.9.1 as a second implementation, and parse(stringify(x)) == x.

[[bug]]
id = "yaml/1"
title = "lex and parseAllDocuments loop forever on a lone carriage return or a U+2028 or U+2029 line separator between tokens"
kind = "hang"
severity = "high"
test = "TestHegelPinLexerTerminatesOnALoneLineTerminator"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`lex(String.fromCharCode(13))`, `lex(String.fromCharCode(0x2028))`, `parseAllDocuments('#c' + CR)` and `parseAllDocuments('a\n...\n' + CR)` never return (the process has to be killed); yaml@2.9.1 returns normally for each. In src/parse/lexer.ts the stream-state regexps `emptyLineOrComment` and `directiveLine` end in `$` with the `m` flag, and JavaScript's multiline `$` matches before a CR, U+2028 or U+2029 as well as before LF; the match is then empty, `pos` does not advance, `newline()` consumes only LF or CRLF, and `stream()` returns to itself. docs/07_parsing_yaml.md: the lexer "should never throw an error, except due to resource exhaustion"; a one-byte input that never terminates is a denial of service for anything that lexes untrusted YAML (YAML 1.2 section 5.4 lists a lone CR as a line break). Found by the fuzzing property when a test run stopped returning; confirmed by a source review.
'''

[[bug]]
id = "yaml/2"
title = "Parser.parse and parseAllDocuments throw RangeError Maximum call stack size exceeded on a few thousand nested explicit keys or sequence items instead of reporting RESOURCE_EXHAUSTION"
kind = "crash"
severity = "medium"
test = "TestHegelPinDeepNestingIsReportedNotThrown"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`[...new Parser().parse('? '.repeat(3000) + 'a\nb: c\n')]` throws `RangeError: Maximum call stack size exceeded` (stack `Parser.pop <- Parser.blockMap <- Parser.step <- Parser.blockMap ...`), and `parseAllDocuments` on the same input throws too instead of returning documents with errors; `'- '.repeat(10000) + 'a\n- b\n'` likewise. yaml@2.9.1's parser handles both (depth 10000) and reports nothing worse than errors. On dedent each closed level recurses through `blockMap`/`blockSequence` -> `pop()` -> `step()` (src/parse/parser.ts), so the recursion depth equals the number of levels closed at once. docs/07_parsing_yaml.md: the Parser "should never throw errors, but may (rarely) include error tokens"; docs/08_errors.md lists `RESOURCE_EXHAUSTION` for exactly this ("document is too deeply nested").
'''

[[bug]]
id = "yaml/3"
title = "the documented uniqueKeys option is ignored: uniqueKeys false still reports DUPLICATE_KEY, and a duplicate key now silently drops the earlier pair from the document"
kind = "contract"
severity = "medium"
test = "TestHegelPinUniqueKeysFalseAllowsDuplicateKeys"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parseDocument('a: b\na: c\n', { uniqueKeys: false }).errors` still holds a `DUPLICATE_KEY` error; in yaml@2.9.1 the option disables the check as docs/08_errors.md still says ("Use the `uniqueKeys` option to disable or customise this check"). The option no longer exists anywhere in src/. The behaviour behind it changed too: the composer now stores pairs through `map.set(pair)` on the Map-backed `YAMLMap.values`, so the second `a` overwrites the first, `doc.value.values.size` is 1 and `doc.toString()` (after clearing the errors) is `a: c\n` where yaml@2 kept both pairs (`a: b\na: c\n`). Same for `{a: 1, a: 2}` and for `? a\n? a`. If the new Map-keyed model is intended, the docs need the option removed and the destruction of source content noted; as it stands a documented option does nothing.
'''

[[bug]]
id = "yaml/4"
title = "the CST puts a stray closing bracket or brace that precedes the first document value before the document, so CST.stringify does not reproduce the source"
kind = "contract"
severity = "low"
test = "TestHegelPinCstKeepsTokenOrderForAStrayBracket"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For the source `&a ]\n` the Parser yields `[error(']'), document]` and concatenating `CST.stringify` over the tokens gives `]&a \n`; likewise `!!str ]\n` -> `]!!str \n`, `---\n]` -> `]---\n`, `&a }\n` -> `}&a \n`. docs/07_parsing_yaml.md presents the CST as retaining "every character of the input, including whitespace", and the library's own yaml-test-suite test checks `CST.stringify` round trips for the error cases too. In `Parser.document()` (src/parse/parser.ts) the unexpected `]`/`}` is pushed straight onto `this.tokens` while the document is still on the stack, so it is emitted first. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/5"
title = "junk after a block scalar header that follows a flow scalar at document level replaces the document value in the CST, losing the earlier characters"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCstKeepsAllCharactersAfterAQuotedScalar"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`new Parser().parse('"a" > b\n')` yields a document whose `value` is the error token and a trailing error token; `CST.stringify` over the tokens gives `b\n`: the characters `"a" > ` are gone from the CST. The same for `*a > b\n`, `"a" | x\n` and `- - \n|+? a}` (-> `a}|+? `). The `default` branch of `Parser.pop()` (src/parse/parser.ts) does `this.pop(); this.pop(token)`, and the second pop reaches `case 'document': top.value = token`, overwriting the value the first pop stored; inside a map or sequence the parent has items, so a new item is appended and nothing is lost, which is why only the document level is affected. The CST's stated purpose (docs/07_parsing_yaml.md: keep the source "in as pristine a condition as possible", every character retained) is defeated for these inputs. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/6"
title = "LineCounter misses the line breaks inside a scalar that follows a finished node on the same line, so linePos and error positions after it are off by those lines"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinLineCounterCountsEveryLineBreak"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parseAllDocuments('"a" "b\nc"\nd: e\n', { lineCounter })` leaves `lineCounter.lineStarts` as `[0, 10, 15]` where the source has line starts `[0, 7, 10, 15]`; `- a\n-b\n c\nd: e\n` gives `[0, 4, 15]` for `[0, 4, 7, 10, 15]`, and `- x\n..\nb\n` gives `[0, 4, 9]` for `[0, 4, 7, 9]`; an unterminated quoted scalar after a finished collection, `&a {}\n'x\n`, gives `[0, 6]` for `[0, 6, 9]`; a block scalar header followed by a directive-like token, `--- | %x\n\n`, gives `[0, 9]` for `[0, 9, 10]`. Every later `linePos(offset)` and every `linePos` in the pretty errors of such a document names a line too early (`line 2` where the brute-force position is `line 3`). `Parser.lineEnd()` (src/parse/parser.ts) stores the extra scalar as a source token in `token.end` without the `onNewLine` loop that `flowScalar()` performs, so its line breaks are never reported to the counter. docs/03_options.md: the lineCounter tracks newlines "to allow for `lineCounter.linePos(offset)` to provide the `{ line, col }` positions within the input". Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/7"
title = "CST.resolveAsScalar rejects a root-level block scalar whose content is not indented (Block scalar values in collections must be indented) although the document parses"
kind = "contract"
severity = "low"
test = "TestHegelPinResolveAsScalarAcceptsARootBlockScalar"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse('|-\na\nb\n')` is `'a\nb'`, but taking the same document's `value` token from `new Parser().parse(...)` and calling `CST.resolveAsScalar(token)` throws `Block scalar values in collections must be indented` (strict mode; with `strict: false` the value is still wrong). The token created by `CST.createScalarToken('a\nb', { indent: 0, type: 'BLOCK_LITERAL' })` (source `|-\na\nb\n`) cannot be resolved either. The composer resolves a root block scalar with the document's indent of -1, while resolveAsScalar uses the token's `indent` of 0 and so demands indented content; the two disagree for every block scalar at the top of a document. docs/07_parsing_yaml.md documents resolveAsScalar as the way to read a scalar token's value. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/8"
title = "CST.createScalarToken with a block type and a whitespace-only value yields a token that resolves to the empty string"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinCreatedBlockScalarTokenKeepsAWhitespaceValue"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CST.createScalarToken(' ', { indent: 2, type: 'BLOCK_LITERAL' })` has the source `|-\n   \n` and `CST.resolveAsScalar` of it is `''` (the same for `BLOCK_FOLDED`): a line of only spaces is an empty line in a block scalar, so the value cannot be represented in that style. docs/07_parsing_yaml.md calls `type` "the preferred type of the scalar token", and the function already falls back for values a block scalar cannot hold in other cases (an empty value becomes `|\n\n`... which resolves to `''` correctly); a whitespace-only value should fall back to a quoted style, as `stringify(' ')` does. `setScalarValue` has the same gap. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/9"
title = "under the JSON schema a null value in a flow mapping is written as nothing after the colon, which the JSON schema cannot read back"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinJsonSchemaWritesNullInFlowMappings"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify({ a: null }, { schema: 'json', collectionStyle: 'flow' })` is `{ "a": }\n`; parsing it with the same options fails with `Unresolved plain scalar ""` (TAG_RESOLVE_FAILED), since the JSON schema has no empty null. Block style writes `"a": null`, and yaml@2.9.1 writes `{ "a": null }` in flow style too. The flow-pair stringifier drops a null value and relies on the plain empty scalar, which only the core and yaml-1.1 schemas resolve. Found by the stringify round trip; the same text is produced with `mapAsMap` and number or boolean keys.
'''

[[bug]]
id = "yaml/10"
title = "YAMLSeq.clone() and the Array methods that create a new array (slice, filter, map, concat, splice results) return a YAMLSeq without a schema, so pushing to it throws"
kind = "crash"
severity = "medium"
test = "TestHegelPinSeqSliceAndCloneKeepTheSchema"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `doc = parseDocument('- 1\n- 2\n- 3\n')`: `doc.value.clone().schema` is `undefined` and `doc.value.clone().push('a')` throws `TypeError: Cannot read properties of undefined (reading 'tags')`; `doc.value.slice().schema` is `3` (the length, passed as the first constructor argument) and `doc.value.slice().push('a')` throws `Cannot read properties of undefined (reading 'find')`; `doc.value.map(x => x.value)` is a `YAMLSeq(3) [1, 2, 3]` holding raw values. YAMLSeq now extends Array (v3) with a `(schema, elements)` constructor but no `Symbol.species`, so `ArraySpeciesCreate` calls `new YAMLSeq(length)`, and `clone()` (src/nodes/YAMLSeq.ts, `YAMLSeq.from(...)`) calls the constructor without a schema. docs/05_content_nodes.md: `clone(schema?)` returns "a deep copy of this collection" and the argument only "allows overwriting the original's schema". `YAMLMap.clone()` keeps the schema; `doc.clone()` works only because it passes one. In yaml@2.9.1 `contents.clone().add('x')` works.
'''

[[bug]]
id = "yaml/11"
title = "set() over an existing tagged scalar keeps the old tag, so a number written over a !!str value comes back as a string (and over !!binary the stringifier throws)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSetReplacesATaggedScalarValue"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`doc = parseDocument('a: !!str x\n'); doc.set('a', 42); doc.toString()` is `a: !!str "42"\n`, which parses to `{ a: '42' }`; `parseDocument('- !!str x\n').set(0, 42)` gives `- !!str "42"\n` -> `['42']`; `parseDocument('a: !!binary aGk=\n').set('a', 'hi'); doc.toString()` throws a TypeError from `Buffer.from(undefined)`. `YAMLMap.set` does `Object.assign(prev.value, pair.value)` and `YAMLSeq.set` does `prev.value = value` (src/nodes), keeping the previous node's `tag` and `format`. docs/05_content_nodes.md explains the node is kept so that comments and anchors survive; keeping an explicit type tag changes the value the caller set. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/12"
title = "map.set and seq.push with a circular JS object overflow the stack, and shared objects are duplicated instead of aliased, because the collection-level node creator has no document"
kind = "crash"
severity = "medium"
test = "TestHegelPinSetHandlesCircularObjects"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`const o = {}; o.self = o; new Document({}).set('x', o)` throws `RangeError: Maximum call stack size exceeded`; `const a = []; a.push(a); new Document([]).value.push(a)` likewise. With a shared (non-circular) object `doc.set('x', [s, s])` writes `x:\n  - k: 1\n  - k: 1\n` without anchor and alias. `new Document(o)` still handles the cycle (`self: &a1 ...`/`*a1`), and yaml@2.9.1's `doc.set('x', o)` writes `x: &a1\n  self: *a1\n`. `YAMLMap.set` and `nodeValue(s)` in YAMLSeq construct `new NodeCreator(this.schema, options)` without a Document, and `NodeCreator.create` then never records `sourceObjects`, so cycles recurse forever. Duplicating shared references may be an intended simplification (the options type omits `aliasDuplicateObjects`), but the crash is not.
'''

[[bug]]
id = "yaml/13"
title = "visit replacing a Pair key leaves YAMLMap.values keyed by the old key, so has/get do not see the new key, and a replacement Pair whose key collides silently vanishes"
kind = "inconsistent"
severity = "medium"
test = "TestHegelPinVisitReplacingAKeyUpdatesTheMap"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
```
const doc = parseDocument('a: 1\nb: 2\n')
visit(doc, { Scalar(k, s) { if (k === 'key' && s.value === 'a') return new Scalar('z') } })
doc.toString()               // 'z: 1\nb: 2\n'
[...doc.value.values.keys()] // ['a', 'b']
doc.value.has('z')           // false ; doc.value.has('a') is true and doc.get('a').value is 1
```
`replaceNode` (src/visit.ts) sets `parent.key = node` on the Pair without re-keying the owning map's `.values` Map that v3 introduced, so the printed document and the lookup API disagree. Related: returning `new Pair(new Scalar('b'), new Scalar(9))` for pair `a` of the same document yields `b: 2` only, the replacement being lost when the entries are rebuilt with `new Map(entries)` and the later duplicate wins. docs/05_content_nodes.md: returning a Node from a visitor replaces the current node. yaml@2.9.1 reports `has('z') === true`.
'''

[[bug]]
id = "yaml/14"
title = "a root-level string starting with spaces is written as a block scalar with indentation indicator 1 and content at column 0, which the parser reads with one space less (or fails to parse when folded)"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinRootBlockScalarWithLeadingSpacesRoundTrips"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify('  code\n  more\n')` is `|1\n  code\n  more\n` and `parse` of that is `' code\n more\n'`; for `' ' + 'word '.repeat(20) + '\nline2'` the folded output puts continuation lines at column 0 and `parse(stringify(v))` throws `Unexpected scalar at node end`. The stringifier (src/stringify/stringifyString.ts) takes the root to be at indent -1 and emits the indicator `1` for content at column 0, while the composer (src/compose/resolve-block-scalar.ts) computes the content indent as `scalar.indent + header.indent` with the root scalar's indent 0, so it strips one more space. Nested values are unaffected (their indicator is `2` and the indents agree). Either side may be the one to change, but `parse(stringify(x))` must be `x` with default options. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/15"
title = "strings with a whitespace-only line are written as block scalars that lose the spaces of that line"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelPinWhitespaceOnlyLinesSurviveBlockScalars"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parse(stringify({ k: ' \n' })).k` is `'\n'` (the text is `k: |+\n   \n`); `stringify({ c: '\n \n', d: ' \n\n', f: ' \n \n' })` reads back as `'\n\n'` for all three; `parse(stringify(' ', { defaultStringType: 'BLOCK_LITERAL' }))` is `''`. A line consisting only of spaces is an empty line inside a block scalar, so such strings cannot use the block styles; the guard in src/stringify/stringifyString.ts (`/\n[\t ]+$/`) only catches whitespace after the last line break. Found by the Document API model (push(' \n')) and the stringify round trip. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/16"
title = "double-quoted folding of a space that both follows and precedes a line break writes an escaped backslash, so the value gains a literal backslash"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinDoubleQuotedFoldingDoesNotAddBackslashes"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For `v = 'a' + BEL + 'x'.repeat(40) + '\n \nb'` (the control character forces double quotes, the length forces folding) `parse(stringify({ k: v })).k` is `'a' + BEL + 'x'.repeat(40) + '\n' + BACKSLASH + '\nb'`: the middle line is written as a doubled backslash followed by a space instead of an escaped space. `parse(stringify(' \n \n ', { doubleQuotedMinMultiLineLength: 1 }))` is `' \n' + BACKSLASH + '\n '`. In `doubleQuotedString` (src/stringify/stringifyString.ts) the branch for a space after a line break appends a backslash, and then the branch for a space before a line break appends `backslash space` again, producing `backslash backslash space`. Also in yaml@2.9.1.
'''

[[bug]]
id = "yaml/17"
title = "folding a double-quoted whitespace-only string in a flow collection writes the text undefined into the document"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinFoldedFlowScalarsDoNotContainUndefined"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify([{ a: [' '] }], { collectionStyle: 'flow', lineWidth: 10 })` contains `"undefined` followed by escaped line breaks, and parsing the output gives `[{ a: ['undefined'] }]`: the single-space string has become the word undefined. In `foldFlowLines` (src/stringify/foldFlowLines.ts) with `FOLD_QUOTED` mode and no escape seen yet, `escStart` is -1 so `j = escStart - 1` is -2 and `text[fold]` indexes past the string, and the `undefined` is concatenated into the output. Any consumer of the YAML sees a different value from the one that was written, without an error on either side. Also in yaml@2.9.1.
