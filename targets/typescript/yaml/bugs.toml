'''

[[bug]]
id = "yaml/19"
title = "a Uint8Array view is serialised as !!binary of its whole underlying ArrayBuffer, ignoring byteOffset and byteLength"
kind = "silent-corruption"
severity = "high"
test = "TestHegelPinBinaryUsesTheViewNotTheWholeBuffer"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`u = new Uint8Array([9, 9, 0, 1, 2, 255]).subarray(2); parse(stringify(u, { version: '1.1' }), { version: '1.1' })` is the six bytes `09 09 00 01 02 ff` instead of `00 01 02 ff`; `new Uint8Array(new ArrayBuffer(8), 2, 3)` is written as eight bytes. src/schema/yaml-1.1/binary.ts does `Buffer.from(buf.buffer)` on the node path (Node 22 has no `Uint8Array.prototype.toBase64`), which wraps the entire ArrayBuffer. Node `Buffer`s from `Buffer.from(string)` or `Buffer.allocUnsafe` are views into a shared 8 KiB pool, so serialising one writes the neighbouring pool contents, other data, into the document. Also in yaml@2.9.1.
'''

[[bug]]
