[[bug]]
id = "yaml/30"
title = "a plain scalar --- or ... on the same line as the document start marker is taken for a second marker: --- --- parses as two empty documents and --- ... as an empty one"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAMarkerLikePlainScalarAfterTheDocumentStartIsAScalar"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parseAllDocuments('--- ---\n')` gives two documents with the values `null, null`; yaml@2.9.1 gives one document with the string `---`. Likewise `--- ...\n` is `null` in v3 and `...` in v2, and `--- --- x\n` is `null, 'x'` against `'--- x'`. Only `---` and `...` at the start of a line are document markers (YAML 1.2 section 9.1.3: `c-directives-end` and `c-document-end` are line-leading productions); after the marker and a space, `---` is an ordinary plain scalar (a `-` may start a plain scalar when not followed by white space), which is how `a: ---`, `- ---` and `--- -x` are still read by v3 itself. The v3 lexer's document-start handling matches the marker again after the separating space (src/parse/lexer.ts), where v2 required the line start. Found by the v2 differential on mutated documents.
'''

[[bug]]
id = "yaml/31"
title = "a string starting with U+FEFF as the root value or the first key is written as a plain scalar at the start of the output, where the parser strips the character as a byte order mark, so the value loses its first character or the document vanishes"
kind = "roundtrip"
severity = "medium"
test = "TestHegelPinAStringStartingWithABomSurvivesStringify"
found = { commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023", version = "3.0.0-2", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`stringify("\ufeff")` is `"\ufeff\n"`, which `parseAllDocuments` reads as no document at all (`parse` gives `null`); `stringify("\ufeffx")` is `"\ufeffx\n"` and reads back as `"x"`; `stringify({ "\ufeffk": 1 })` is `"\ufeffk: 1\n"` and reads back as `{ k: 1 }`. The same strings anywhere else round-trip (`- \ufeffx`, `a: \ufeff`, a second document, a later key), and `stringify(" \ufeff")` is quoted, so only the stream-start position is affected: the lexer takes a U+FEFF there as the byte order mark (YAML 1.2 section 5.2, which also says a BOM inside a document is content and "must not appear inside a document", so the writer has to quote it). `stringifyString` (src/stringify/stringifyString.ts) chooses the plain style for such strings; the check for characters that cannot start a plain scalar does not include U+FEFF or the output position. Also in yaml@2.9.1. v3 alone strips every leading U+FEFF: `"\ufeff\ufeffx\n"` is `"x"` in v3 and `"\ufeffx"` in yaml@2, so the double-BOM output of `stringify("\ufeff\ufeff")` vanishes entirely in v3. Found by TestHegelStringifyThenParseGivesTheValueBack.
'''
