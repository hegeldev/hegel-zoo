name = "yaml"
language = "typescript"
upstream = "https://github.com/eemeli/yaml"
subdir = ""
license = "ISC"
ai_policy_checked = "2026-09-20"  # docs/CONTRIBUTING.md: LLM use in issues, PRs and comments must be declared and pre-approved; the zoo files nothing upstream, so this is a flag for anyone reporting these findings, not an exclusion

[base]
commit = "9fa8098fa40e318b260884f3e7b853ddb3b9f023"
date = "2026-09-20"
version = "3.0.0-2"

[hegel]
version = "0.4.5"

[run]
# TypeScript source: esbuild bundles src/index.ts (the library, no runtime dependencies) and
# src/test-events.ts (the yaml-test-suite event format) into hegel/. yaml@2.9.1, the previous stable
# release, is installed beside Hegel as a second implementation. The yaml-test-suite submodule is
# fetched for the suite check.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 esbuild@0.25.10 yaml@2.9.1",
  ".hegel/node_modules/.bin/esbuild src/index.ts --bundle --format=esm --platform=node --outfile=hegel/yaml3.mjs",
  ".hegel/node_modules/.bin/esbuild src/test-events.ts --bundle --format=esm --platform=node --outfile=hegel/test-events.mjs",
  "git submodule update --init tests/yaml-test-suite",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

