name = "yargs-parser"
language = "typescript"
upstream = "https://github.com/yargs/yargs-parser"
subdir = ""
license = "ISC"
ai_policy_checked = "2026-09-16"

[base]
commit = "913df9d1ddbea131e38516c09c2a81eb15c69968"
date = "2026-09-04"
version = "22.0.0"

[hegel]
version = "0.4.5"

[run]
# TypeScript sources, build/ not committed; the package has no runtime dependencies and its
# tsconfig extends gts's, so Hegel and the TypeScript compiler are installed under .hegel/ (a root
# install would pull the whole dev tree, puppeteer included) and lib/ is compiled to build/ with
# the zoo's own test/tsconfig.hegel.json. The harness imports Hegel from .hegel/node_modules.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 typescript@5.9.3",
  "node .hegel/node_modules/typescript/bin/tsc -p test/tsconfig.hegel.json --noCheck",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinNegativeExponentIsAValue = "yargs-parser/1"
TestHegelPinTrailingDotNumberIsAValue = "yargs-parser/1"
TestHegelPinNoEmptyKey = "yargs-parser/2"
TestHegelPinCoerceResultIsKept = "yargs-parser/3"
TestHegelPinNargDuplicatesAgreeAcrossAliases = "yargs-parser/4"
TestHegelPinShortOptionDoesNotEatDashDash = "yargs-parser/5"
TestHegelPinStripAliasedRemovesTheDashedTwin = "yargs-parser/6"
TestHegelPinArrayFlagInGroupIsEmpty = "yargs-parser/7"
TestHegelPinOneIsAValueNotAnIncrement = "yargs-parser/8"
