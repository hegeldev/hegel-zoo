# Bugs found in yargs-parser (yargs/yargs-parser) by the Hegel properties (see README.md). Each is
# pinned by the test named in `test` (test/hegel.test.mjs), which asserts the README's documented
# behaviour (or the behaviour of the equivalent spelling) and fails while the bug exists.

[[bug]]
id = "yargs-parser/1"
title = "A negative number with an exponent or a trailing dot is not taken as a value: `--num -1e3` sets the flags `1` and `e`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNegativeExponentIsAValue"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`looksLikeNumber("-1e3")` is true and `--num=-1e3` gives `num: -1000`, but standing alone after
its flag the argument must match the parser's `negative` pattern (`^-([0-9]+(\.[0-9]+)?|\.[0-9]+)$`,
yargs-parser.ts:111), which has no exponent and no trailing dot. `parser(["--num", "-1e3"],
{number: ["num"]})` is therefore `{_: [], 1: true, e: 3}` (a short-option group `-1e3`: flag `1`,
then `e` = 3) and `num` is not set at all; `parser(["--x", "-5."])` is `{x: true, 5: true, "":
{"": true}}` (the pin `TestHegelPinTrailingDotNumberIsAValue` covers this form). Expected: the
same value as with `=`: `{num: -1000}`, `{x: -5}`. Found by the intent round trip (a `number`
option assigned a generated negative in exponent form as `--num v`).
'''

[[bug]]
id = "yargs-parser/2"
title = "An argument like `-5.` or `-.` creates the empty key: `{'': {'': true}}`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinNoEmptyKey"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`-5.` is not a negative number to the parser (see /1) and is read as a short-option group: the
letters are `arg.slice(1, -1)` = `5` and the last character, `.`, becomes the final key.
`setArg(".", true)` splits the key on dots into `["", ""]` and dot-notation writes
`argv[""][""] = true`. `parser(["-5.", "-."])` is `{_: [], 5: true, "": {"": true}}`. Expected: no
empty key; `-5.` is either the number -5 or a positional. Found by inspection while pinning /1.
'''

[[bug]]
id = "yargs-parser/3"
title = "The value a `coerce` function returns is number-coerced afterwards: `() => '5'` gives `5`, and a `number` option's coerce returning a word gives NaN"
kind = "contract"
severity = "low"
test = "TestHegelPinCoerceResultIsKept"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README documents `coerce` as "a custom synchronous function that returns a coerced value
from the argument provided". `applyCoercions` (yargs-parser.ts:757) runs
`maybeCoerceNumber(key, coerce(argv[key]))` on the result, so `parser(["--x", "a"], {coerce: {x:
() => "5"}})` is `{x: 5}` (a number, not the returned string), and for a `number`-typed option any
non-numeric return value becomes `NaN`: `parser(["--x", "1"], {number: ["x"], coerce: {x: () =>
"coerced"}})` is `{x: NaN}`. Expected: the returned value as is. Found by the coerce property
(`TestHegelCoerceReturnsTheValue`).
'''

[[bug]]
id = "yargs-parser/4"
title = "With `duplicate-arguments-array: false`, a repeated `narg` option keeps the last value under its name but every value under its aliases and camel-case twin"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinNargDuplicatesAgreeAcrossAliases"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`setKey` resets a repeated nargs key before writing ("nargs has higher priority than duplicate",
yargs-parser.ts:846) but looks the count up as `flags.nargs[key]` on the key being written rather
than through `checkAllAliases`, so only the declared name is reset; its aliases keep
accumulating. `parser(["-f", "1", "-f", "2"], {narg: {foo: 1}, alias: {foo: "f"}, configuration:
{"duplicate-arguments-array": false}})` is `{foo: 2, f: [1, 2]}`; `parser(["--foo-bar", "1",
"--foo-bar", "2"], {narg: {"foo-bar": 1}, configuration: {...}})` is `{"foo-bar": 2, fooBar: [1,
2]}`, and with `narg: 2` the twin holds all four values. Expected: all keys of an option agree
(`f: 2`, `fooBar: 2`). Found by the alias invariant of `TestHegelTypesAndAliasesHold` and the
duplicate-arguments-array law.
'''

[[bug]]
id = "yargs-parser/5"
title = "A short option takes the `--` end-of-options marker as its value: `-x -- a` is `{x: '--', _: ['a']}`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinShortOptionDoesNotEatDashDash"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For a long option the next argument is a value only if it does not start with `-` (or is a
negative number), so `--x -- a` is `{x: true, _: ["a"]}` and `--` ends option parsing. For a
short option the test is `!/^(-|--)[^-]/.test(next)` (yargs-parser.ts:375), which lets `--` (and
`---`) through as a value: `parser(["-x", "--", "a"])` is `{_: ["a"], x: "--"}` and the arguments
after `--` are then parsed as options. Expected: `{_: ["a"], x: true}` like the long form. Found by
the populate-- law (the arguments after `--` were missing from `_`).
'''

[[bug]]
id = "yargs-parser/6"
title = "`strip-aliased` leaves the dashed twin of a camel-case alias in argv"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinStripAliasedRemovesTheDashedTwin"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `configuration: {"strip-aliased": true}` the parser deletes each declared alias and, for a
dashed alias, its camel-case twin (yargs-parser.ts:437). A camel-case alias also gets a dashed
twin (`extendAliases` decamelizes it and lists it in `aliases`), but that twin is not deleted:
`parser(["--x", "1"], {alias: {x: "otherA"}, configuration: {"strip-aliased": true}})` is
`{_: [], x: 1, "other-a": 1}` while `alias: {x: "other-a"}` gives `{_: [], x: 1}`. Expected `{x: 1}`
in both cases. Found by the strip-aliased law.
'''

[[bug]]
id = "yargs-parser/7"
title = "A string or number array flag inside a short group gets a placeholder element: `-bu` gives `b: [undefined]` where `-b -u` gives `[]`"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinArrayFlagInGroupIsEmpty"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In a short-option group every letter but the last is set to its default value by type
(`setArg(letter, defaultValue(letter))`, yargs-parser.ts:358), and `guessType` looks at the
`strings`/`numbers` flags before `arrays`, so an array option declared `{key: "b", number: true}`
gets `undefined` and one declared `{key: "b", string: true}` gets `""`; `setKey` then wraps that
in the array: `parser(["-bu"], {array: [{key: "b", number: true}]})` is `{b: [undefined], u:
true}` and the string form is `{b: [""], u: true}`. `-b -u`, `-ub` and `--b` all give `b: []`, as
does an untyped array. Expected `[]`. Found by the type invariant of
`TestHegelTypesAndAliasesHold`.
'''

[[bug]]
id = "yargs-parser/8"
title = "The value 1 is mistaken for a count increment: `--x 1 --x 1` is `x: 2` and `--x 2 --x 1` is `x: 3`"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinOneIsAValueNotAnIncrement"
found = { commit = "913df9d1ddbea131e38516c09c2a81eb15c69968", version = "22.0.0", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`setKey` recognises a count increment by `value === increment()` (yargs-parser.ts:853), and
`increment()` with no argument returns 1, so any value equal to the number 1 takes the counter
branch `o[key] = increment(o[key])`. `parser(["--x", "1", "--x", "1"])` is `{x: 2}` (with 2
instead of 1 it is `{x: [2, 2]}`), `parser(["--x", "2", "--x", "1"])` is `{x: 3}`, `--x=1 --x=1
--x=1` is `{x: 3}`, `--nest.b 1 --nest.b 1` is `{nest: {b: 2}}`, and the same happens with
`number: ["x"]` or `narg: {x: 1}`. A default of 1 for an array option is not wrapped either:
`parser([], {array: ["b"], default: {b: 1}})` is `{b: 1}` while `default: {b: 2}` gives `{b: [2]}`.
Expected `[1, 1]`, `[2, 1]`, `[1, 1, 1]` and `[1]`. Found by the intent round trip (an array option
whose default was 1 came back unwrapped) and confirmed by hand.
'''
