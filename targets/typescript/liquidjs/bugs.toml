# Bugs found in liquidjs (harttle/liquidjs) by the Hegel zoo. ids are liquidjs/N; see README.md for
# the properties. The oracle is Shopify's Ruby liquid gem (5.5.1), which liquidjs sets out to be
# compatible with; only divergences outside its documented differences are recorded.

[[bug]]
id = "liquidjs/1"
title = "A raw block closed by a whitespace-controlled endraw tag ({%- endraw %}) is not closed: TokenizationError raw not closed, where Shopify renders the template"
kind = "crash"
severity = "medium"
test = "TestHegelPinRawClosesOnWhitespaceControlledEndraw"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`a{% raw %}x{{ y }}{%- endraw %}b` throws `TokenizationError: raw "{% raw %}x{{ y }}{%- endraw %}b" not closed`; Shopify's liquid renders `ax{{ y }}b`, and so does liquidjs for `{% endraw -%}` (trailing whitespace control) and for `{% endraw %}`. `{%- raw -%} x {%- endraw -%}` fails the same way. In `Tokenizer.readEndrawOrRawContent` (src/parser/tokenizer.ts) the scanner jumps to each `{%` and calls `readIdentifier()` to see whether the tag is `endraw`; a leading `-` is not an identifier character, so the identifier read there is empty, the tag is never recognised and the scan runs off the end of the input. Every other tag accepts `{%-`, so a template that trims whitespace around its raw blocks consistently cannot be parsed.
'''

[[bug]]
id = "liquidjs/2"
title = "Unnamed cycle tags with different candidates share one counter: {% cycle a, b %}{% cycle x, y %} repeated gives ayay where Shopify gives axby"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinUnnamedCyclesWithDifferentCandidatesAreIndependent"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's liquid keys an unnamed cycle by its list of candidates (`@name = @variables.to_s`), so `{% cycle "a", "b" %}{% cycle "x", "y" %}{% cycle "a", "b" %}{% cycle "x", "y" %}` renders `axby` and `{% cycle 1, 2 %}{% cycle "1", "2" %}{% cycle 1, 2 %}` renders `112`; the liquidjs documentation for `cycle` describes the same rule (a cycle group is identified by its candidates unless it is named). liquidjs renders `ayay` and `121`: in src/tags/cycle.ts the register key is `'cycle:' + group + ':' + this.candidates.join(',')`, and `candidates` is an array of `ValueToken` objects whose default string form is `[object Object]`, so every unnamed cycle in a template has the key `cycle:undefined:[object Object],[object Object]` (for two candidates) and they all advance one shared index. Named cycles are keyed by name in both engines and agree.
'''

[[bug]]
id = "liquidjs/3"
title = "truncatewords appends the ellipsis to a string that has exactly the requested number of words: 1 2 3 | truncatewords: 3 gives 1 2 3... where Shopify gives 1 2 3"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTruncatewordsKeepsAStringWithExactlyThatManyWords"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's documentation says the ellipsis is appended when the string has more words than the count, and its implementation returns the input unchanged when `wordlist.length <= words`; `{{ "1 2 3" | truncatewords: 3 }}` renders `1 2 3` and `{{ "cherry" | truncatewords: 0 }}` (a count below 1 is treated as 1 by both engines) renders `cherry`. liquidjs (src/filters/string.ts) appends the ellipsis when `arr.length >= words`, so both render with a trailing `...`. The liquidjs test suite fixes this in "should show ellipsis if length is exactly len" (test/integration/filters/string.spec.ts), so it is deliberate or at least accepted, but it is not in the documented list of differences from Shopify's liquid and a template shared between the two engines renders differently.
'''

[[bug]]
id = "liquidjs/4"
title = "modulo of a float loses precision: 0.1 | modulo: 7 gives 0.09999999999999964 where Shopify gives 0.1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinModuloOfAFloatKeepsItsPrecision"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{{ 0.1 | modulo: 7 }}` renders `0.09999999999999964` and `{{ 0.1 | modulo: 3 }}` renders `0.10000000000000009`; JavaScript's own `0.1 % 7` is exactly `0.1`, as is Shopify's result. src/filters/math.ts computes `((v % arg) + arg) % arg` to give the floored (Ruby-style) result for negative inputs, which for a positive remainder adds the divisor and takes it away again in floating point: `(0.1 + 7) % 7` is not `0.1`. Adding the divisor only when the remainder is negative (or when its sign differs from the divisor's) gives the same results for negative inputs (`-1 | modulo: 7` is `6` in both engines) without the rounding. Integer inputs are unaffected.
'''

[[bug]]
id = "liquidjs/5"
title = "cycle emits nothing for a candidate that is 0 or false: {% cycle 0, 1 %} renders an empty string where Shopify renders 0"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCycleEmitsAZeroOrFalseCandidate"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{% cycle 0, 1 %}|{% cycle 0, 1 %}` renders `|1` (Shopify: `0|1`), `{% cycle false, true %}` renders nothing (Shopify: `false`), and `{% cycle z, 1 %}` with `z = 0` renders nothing (Shopify: `0`); the counter still advances, so the values are skipped rather than delayed. The cycle tag (src/tags/cycle.ts) returns the evaluated candidate instead of writing it to the emitter, and the render loop in src/render/render.ts writes a returned value only when it is truthy (`html && emitter.write(html)`), so a numeric 0 or a false candidate is dropped. `{{ 0 }}` and `{{ false }}` print `0` and `false`, as in Shopify. Numeric candidates are common in cycle tags (`{% cycle 0, 1 %}` for alternating offsets, row classes with a 0 index).
'''

[[bug]]
id = "liquidjs/6"
title = "for ... else renders nothing when limit or offset leaves the loop empty: for i in (1..3) limit: 0 ... else ... endfor renders neither branch, where Shopify renders the else"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinForElseRendersWhenLimitOrOffsetEmptiesTheLoop"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's documentation says the `else` branch of a `for` runs when the loop has zero length, and its implementation tests the segment after `limit` and `offset` are applied: `{% for i in (1..3) limit: 0 %}x{% else %}empty{% endfor %}` renders `empty`, as do `{% for i in (1..1) offset: 1 %}x{% else %}empty{% endfor %}` and `{% for i in words offset: 3 %}x{% else %}empty{% endfor %}` with a one-element `words`. liquidjs renders an empty string for all three: src/tags/for.ts renders the else templates only `if (!collection.length)` before the offset/limit/reversed modifiers are applied, and afterwards iterates the (possibly empty) slice with no fallback. A paginated list rendered with `offset: continue` past its end therefore shows nothing instead of its empty-state message.
'''

[[bug]]
id = "liquidjs/7"
title = "Math filters coerce true to 1 where Shopify coerces it to 0: true | plus: 1 gives 2, true | times: 2 gives 2, true | abs gives 1"
kind = "differential"
severity = "low"
test = "TestHegelPinMathFiltersTreatTrueAsZero"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's `Utils.to_number` turns anything that is not a number or a numeric string into 0, so `{{ true | plus: 1 }}`, `{{ true | times: 2 }}` and `{{ true | abs }}` render `1`, `0` and `0`; liquidjs renders `2`, `2` and `1` because `toNumber` (src/util/underscore.ts) is `+toValue(value) || 0` and JavaScript's unary plus turns `true` into 1. `false`, `nil` and non-numeric strings agree (0 in both). The documented differences list (docs/source/tutorials/differences.md) covers truthiness, integer/float distinction and stringification but not this coercion. The shape reaches templates through `default`: `{{ flag | default: 0 | plus: 1 }}` is 2 in liquidjs and 1 in Shopify when `flag` is true.
'''

[[bug]]
id = "liquidjs/8"
title = "A block whose body is only whitespace renders that whitespace, where Shopify renders nothing: {% if true %} {% endif %}x gives a space then x"
kind = "differential"
severity = "low"
test = "TestHegelPinBlockWithOnlyWhitespaceRendersNothing"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's liquid marks a block body "blank" when it holds nothing but whitespace text and blank tags (`assign`, `comment`, `capture`, nested blank blocks; `BlockBody#blank?` in lib/liquid/block_body.rb), and a blank `if`, `unless`, `case` or `for` renders nothing at all: `{% if true %} {% endif %}x` is `x`, `{% for i in (1..2) %} {% endfor %}x` is `x`, `{% if true %} {% assign a = 1 %} {% endif %}x` is `x` (and `{% if false %}a{% else %} {% endif %}x` is ` x`, the block is not blank because of the `a`). liquidjs renders the whitespace: ` x`, `  x`, `  x`. Neither engine documents the rule (Shopify's is an implementation detail that themes nevertheless rely on to keep control structures from leaving blank lines), and it is not in liquidjs's list of differences from Shopify's liquid (docs/source/tutorials/differences.md). Increment/decrement, cycle, raw and output nodes make a body non-blank in both engines, so only whitespace next to blank tags differs.
'''

[[bug]]
id = "liquidjs/9"
title = "Array filters do not flatten nested arrays: [[Fig,apple],[],nil,[Zed]] | reverse | join gives Zed,,,Fig,apple where Shopify gives Zed,,apple,Fig"
kind = "differential"
severity = "medium"
test = "TestHegelPinArrayFiltersFlattenNestedArrays"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's array filters run their input through `InputIterator`, which flattens nested arrays (lib/liquid/standardfilters.rb), so `reverse`, `sort`, `sort_natural`, `join`, `uniq`, `first`/`last` and the rest see `["Fig", "apple", nil, "Zed"]` for the input `[["Fig", "apple"], [], nil, ["Zed"]]`: `reverse | join: ","` is `Zed,,apple,Fig` and `sort | join: ","` is `Fig,Zed,apple,`. liquidjs (src/filters/array.ts) works on the array as given, so `reverse` gives `Zed,,,Fig,apple` (the inner arrays are stringified by `join`) and `sort` compares the arrays. `map: "tags"` over objects whose property is an array is the natural way to reach the shape. Not in liquidjs's list of differences (docs/source/tutorials/differences.md). Found by the differential properties in the 1000-case runs after the generators were rewritten in combinator style (2026-09-23); the shape was reachable by the old generator too. Gated in the generator in the default run; `ZOO_FULL=1` opens it.
'''

[[bug]]
id = "liquidjs/10"
title = "truncatewords rebuilds a string that has fewer words than the count: \"  padded  \" | truncatewords: 8 gives \"padded \" where Shopify returns the string unchanged"
kind = "differential"
severity = "low"
test = "TestHegelPinTruncatewordsUnderTheCountKeepsTheString"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's `truncatewords` returns the input as it is when it has at most `words` words (lib/liquid/standardfilters.rb: `return input if wordlist.length <= words`), whitespace included. liquidjs (src/filters/string.ts, `truncatewords`) does `trimStart().split(/\s+/)`, drops trailing empty strings and joins the words with single spaces even when nothing is truncated, so `"  padded  " | truncatewords: 8` renders `padded ` (one trailing space from the split's empty last element) instead of `  padded  `, and `"a  b" | truncatewords: 5` collapses the double space. liquidjs/3 is the neighbouring shape at exactly the count. Found by the differential properties in the 1000-case runs after the generators were rewritten in combinator style (2026-09-23); the shape was reachable by the old generator too. Gated in the generator in the default run; `ZOO_FULL=1` opens it.
'''

[[bug]]
id = "liquidjs/11"
title = "split with a single space is not awk-style: \" grape\" | split: \" \" | first gives an empty string where Shopify gives grape"
kind = "differential"
severity = "low"
test = "TestHegelPinSplitOnASpaceIsAwkStyle"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Ruby's `String#split(" ")` is awk-style: leading whitespace is skipped and runs of whitespace count as one separator, so Shopify's `split` filter gives `["grape"]` for `" grape" | split: " "` and `["a", "b"]` for `"a  b" | split: " "`. liquidjs (src/filters/string.ts, `split`) uses JavaScript's `split`, which keeps the leading empty string and the empty string between two blanks (it only drops trailing empty strings, matching Ruby's other behaviour), so `first` is the empty string and `size` is 3. Any other separator agrees. Found by the differential properties in the 1000-case runs after the generators were rewritten in combinator style (2026-09-23); the shape was reachable by the old generator too. Gated in the generator in the default run; `ZOO_FULL=1` opens it.
'''

[[bug]]
id = "liquidjs/12"
title = "replace with an empty pattern inserts only between characters: \"Hello\" | replace: \"\", \"a\" gives Haealalao where Shopify gives aHaealalaoa"
kind = "differential"
severity = "low"
test = "TestHegelPinReplaceWithAnEmptyPatternInsertsAtBothEnds"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Ruby's `gsub("", "a")` matches the empty string before every character and at the end of the string, so Shopify renders `"Hello" | replace: "", "a"` as `aHaealalaoa`. liquidjs (src/filters/string.ts, `replace`) does `split(pattern).join(replacement)`, and `"Hello".split("")` is the five characters, so the replacement goes only between them: `Haealalao`. `replace_first` and `replace_last` with an empty pattern differ the same way (Ruby inserts at the start / the end, liquidjs finds index 0 / the last index and inserts nothing). Found by the differential properties in the 1000-case runs after the generators were rewritten in combinator style (2026-09-23); the shape was reachable by the old generator too. Gated in the generator in the default run; `ZOO_FULL=1` opens it.
'''

[[bug]]
id = "liquidjs/13"
title = "escape and escape_once write a double quote as &#34; where Shopify writes &quot;"
kind = "differential"
severity = "low"
test = "TestHegelPinEscapeWritesQuotAsShopify"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's `escape` is `CGI.escapeHTML`, which writes `"` as `&quot;` (and `'` as `&#39;`); liquidjs (src/filters/html.ts) writes `&#34;`. Both are valid HTML, but the rendered text differs, which matters for anything that compares or hashes output, and `escape_once` on Shopify output turns `&quot;` back into itself in both engines while a liquidjs-rendered page carries `&#34;`. Not in the documented differences. Found by the differential properties in the 1000-case runs after the generators were rewritten in combinator style (2026-09-23); the shape was reachable by the old generator too. Gated in the generator in the default run; `ZOO_FULL=1` opens it.
'''

[[bug]]
id = "liquidjs/14"
title = "url_encode leaves ' ( ) ! * unencoded where Shopify's CGI.escape encodes them"
kind = "differential"
severity = "low"
test = "TestHegelPinUrlEncodeEscapesApostropheAndParentheses"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Shopify's `url_encode` is `CGI.escape`, which percent-encodes everything but `a-zA-Z0-9_.-~` (spaces become `+`), so `"it's (x)! *~" | url_encode` is `it%27s+%28x%29%21+%2A~`. liquidjs (src/filters/url.ts) uses `encodeURIComponent` with `%20` turned into `+`, and `encodeURIComponent` leaves `' ( ) ! *` alone: `it's+(x)!+*~`. A URL built from user text differs between the engines exactly in the characters an attacker likes in a query string. Not in the documented differences. Found by the differential properties in the 1000-case runs after the generators were rewritten in combinator style (2026-09-23); the shape was reachable by the old generator too. Gated in the generator in the default run; `ZOO_FULL=1` opens it.
'''

[[bug]]
id = "liquidjs/15"
title = "A for loop with offset: continue that runs twice restarts at 0 the second time where Shopify continues past the end"
kind = "differential"
severity = "low"
test = "TestHegelPinOffsetContinueResumesAcrossLoops"
found = { commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295", version = "10.29.0", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Liquid's `offset: continue` resumes a loop over the same collection from where the previous loop with the same name left off, so `{% for j in words offset: continue %}{{ j }}{% endfor %}` twice over `words = [a, b, c]` renders `abc` and then nothing (`abc|`) in Shopify. liquidjs (src/tags/for.ts) stores the loop's end position for `continue`, but when the loop itself ran with `offset: continue` the stored offset argument is not a number, so `collection.length` is added to it and the next run restarts at 0: `abc|abc`. A loop with a numeric offset followed by one with `offset: continue` agrees. Found by the differential properties in the 1000-case runs after the generators were rewritten in combinator style (2026-09-23); the shape was reachable by the old generator too. Gated in the generator in the default run; `ZOO_FULL=1` opens it.
'''
