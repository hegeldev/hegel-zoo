name = "liquidjs"
language = "typescript"
upstream = "https://github.com/harttle/liquidjs"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # CONTRIBUTING.md and README have no AI-contribution policy; AGENTS.md only instructs coding agents working in the repository

[base]
commit = "a2cdfb8aef7d0000dc474a89d9aca40782d3a295"
date = "2026-09-20"
version = "10.29.0"

[hegel]
version = "0.4.5"

[run]
# TypeScript source with extensionless imports: esbuild bundles src/index.ts into hegel/liquid.mjs
# (tslib is its one runtime import, resolved through NODE_PATH). The oracle is Shopify's Ruby
# liquid gem, pinned at 5.5.1 (the last version whose dependencies need no native build), driven as
# one persistent `ruby hegel/oracle.rb` process; the runner's preinstalled ruby is enough.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 esbuild@0.25.10 tslib@2.8.1",
  "NODE_PATH=.hegel/node_modules .hegel/node_modules/.bin/esbuild src/index.ts --bundle --format=esm --platform=node --outfile=hegel/liquid.mjs",
  "gem install --user-install --no-document liquid -v 5.5.1",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinRawClosesOnWhitespaceControlledEndraw = "liquidjs/1"
TestHegelPinUnnamedCyclesWithDifferentCandidatesAreIndependent = "liquidjs/2"
TestHegelPinTruncatewordsKeepsAStringWithExactlyThatManyWords = "liquidjs/3"
TestHegelPinModuloOfAFloatKeepsItsPrecision = "liquidjs/4"
TestHegelPinCycleEmitsAZeroOrFalseCandidate = "liquidjs/5"
TestHegelPinForElseRendersWhenLimitOrOffsetEmptiesTheLoop = "liquidjs/6"
TestHegelPinMathFiltersTreatTrueAsZero = "liquidjs/7"
TestHegelPinBlockWithOnlyWhitespaceRendersNothing = "liquidjs/8"
