name = "hono"
language = "typescript"
upstream = "https://github.com/honojs/hono"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # docs/CONTRIBUTING.md "AI Usage Policy": AI may be used but "must never waste a maintainer's time"; zoo-only use, nothing is reported upstream automatically

[base]
commit = "52febbcc30bc509d5e4987577e63906fe08fc471"
date = "2026-09-20"
version = "4.13.8"

[hegel]
version = "0.4.5"

[run]
# TypeScript source with extensionless imports and a bun-only build: esbuild bundles the routers
# (hegel/routers-entry.ts -> hegel/routers.mjs) with no other dependency; Hegel and esbuild go
# under .hegel/.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 esbuild@0.25.10",
  ".hegel/node_modules/.bin/esbuild hegel/routers-entry.ts --bundle --format=esm --platform=node --outfile=hegel/routers.mjs",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinRegExpRouterKeepsMiddlewareWithSlashInRegexp = "hono/1"
TestHegelPinSlashSpanningRegexpBeforeParamMatches = "hono/2"
TestHegelPinTrailingWildcardAfterMiddleWildcardMatchesTheParent = "hono/3"
TestHegelPinRoutersAgreeOnEmptySegmentsAgainstWildcard = "hono/4"
TestHegelPinLiteralAfterRegexpParamIsEscaped = "hono/5"
TestHegelPinDuplicateParamNamesTakeTheFirstValue = "hono/6"
TestHegelPinOptionalParamAfterWildcardMatchesOnce = "hono/7"
TestHegelPinRegExpRouterRunsMiddlewareWhereWildcardMeetsLabel = "hono/8"
TestHegelPinRegExpRouterRunsTrailingWildcardBesideSuffixWildcard = "hono/9"
TestHegelPinLiteralAfterSlashSpanningRegexpEndsAtTheSegment = "hono/10"
