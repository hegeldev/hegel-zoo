# Bugs found in hono's routers (honojs/hono, src/router) by the Hegel zoo. ids are hono/N; see
# README.md for the properties. The oracle is a regular-expression model of the documented routing
# rules; the five routers are also compared with each other.

[[bug]]
id = "hono/1"
title = "RegExpRouter silently drops a middleware handler whose path has a regexp parameter containing a slash followed by another segment: ALL /:name{[^/]+}/:x/* never runs"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRegExpRouterKeepsMiddlewareWithSlashInRegexp"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `router.add('ALL', '/:name{[^/]+}/:x/*', 'mw'); router.add('GET', '*', 'h')`, `RegExpRouter.match('GET', '/v2/abc/abc')` returns only `h`; TrieRouter and PatternRouter return `mw` (name=v2, x=abc) then `h`, and with `:name` instead of `:name{[^/]+}` (the same pattern, spelled as the default) RegExpRouter returns both too. A table with only the middleware route returns `[]`. Since `RegExpRouter` is the first router of Hono's default `SmartRouter` and accepts this table, an application using such a middleware never runs it and gets no error. In `add`, a path ending in `*` is a middleware: `buildWildcardRegExp(path)` turns the route path into a regexp and tests it against every registered path string, including the middleware's own, to decide where the handler belongs (`re.test(p) && handlerMap[m][p].push(...)`). The replacement handles the exact text `{[^/]+}` after a label, but the resulting `^/:[^/]+/:[^/]+(?:|/.*)$` is then matched against the raw string `/:name{[^/]+}/:x/*`, whose braces contain a `/`: the first `[^/]+` stops at that slash, the next `/:` is not there, the self-test fails and the handler is pushed nowhere. Any regexp parameter whose pattern contains `/` and is followed by a further segment has the same fate; `/a/:x{[^/]+}/*` happens to pass because the tail `(?:|/.*)` swallows the rest of the string.
'''

[[bug]]
id = "hono/2"
title = "TrieRouter and LinearRouter never match a slash-spanning regexp parameter followed by a dynamic segment: /:id{.+}/:name matches nothing, while RegExpRouter and PatternRouter match it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinSlashSpanningRegexpBeforeParamMatches"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`router.add('GET', '/:id{.+}/:name', 'h')`: `match('GET', '/b/42/foo')` is `[]` in TrieRouter and LinearRouter, `[['h', { id: 'b/42', name: 'foo' }]]` in RegExpRouter and PatternRouter (a regular expression backtracks). The same for `/:x{.+}/*/x.js` against `/abc/a-b/x.js` and `/:y{[a-z]+}/:id{.+}/:name/*` against `/b/42/foo`. The docs present `.+` as the way to capture "including slashes" (`/:filename{.+\\.png}`) and TrieRouter as the router that "supports all patterns"; TrieRouter compiles `:id{.+}` with a lookahead for the next segment only when that segment is a literal (`getPattern(label, next)`: `next[0] !== ':' && next[0] !== '*'`), otherwise the pattern is `^.+$` on the rest of the path, which eats `42/foo` and leaves nothing for `:name`; LinearRouter builds the same lookahead the same way. Since Hono's default SmartRouter falls back to TrieRouter exactly when RegExpRouter rejects a table, an app can see such a route stop matching when an unrelated route makes the table "unsupported" for RegExpRouter.
'''

[[bug]]
id = "hono/3"
title = "A trailing wildcard after a middle wildcard does not match the parent path in TrieRouter and LinearRouter: /*/* does not match /a, though /:x/* matches it and RegExpRouter/PatternRouter match both"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinTrailingWildcardAfterMiddleWildcardMatchesTheParent"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The routers' shared test cases fix that `/path/*` matches `/path` ("Trailing wildcard") and `/:name/*` matches `/abc` ("Trailing wildcard after a label"). With `router.add('GET', '/*/*', 'h')`, `match('GET', '/a')` is `[['h', {}]]` in RegExpRouter and PatternRouter but `[]` in TrieRouter and LinearRouter; `/a/*/*` against `/a/b` behaves the same way. In `Node.search`, the "match the parent when the child is `*`" step (`nextNode.#children['*']` / `child.#children['*']`) is done for literal and parameter children but not for a wildcard child, which is only pushed to the next level. LinearRouter's star branch requires a `/` after the last literal part. Hono's default SmartRouter hands such tables to TrieRouter whenever RegExpRouter refuses them, so the answer depends on the other routes in the app.
'''

[[bug]]
id = "hono/4"
title = "Routers disagree on an empty path segment against a middle wildcard: TrieRouter and LinearRouter match /a//b to /a/*/b, RegExpRouter and PatternRouter do not"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinRoutersAgreeOnEmptySegmentsAgainstWildcard"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`router.add('GET', '/a/*/b', 'h')`: `match('GET', '/a//b')` is `[['h', {}]]` in TrieRouter and LinearRouter, `[]` in RegExpRouter and PatternRouter (both compile a middle `*` to `[^/]+`, which needs one character). The shared test "Empty path segment" fixes that `/u//posts` does not match `/u/:id/posts`; the wildcard case is not fixed, and the four routers split two against two. TrieRouter's `search` accepts the empty part for a `*` pattern (`pattern === '*' || part.startsWith(...)`) where it rejects it for a label (`if (!part && matcher === true) continue`); LinearRouter's star branch only looks for the next literal. Whatever the intended answer, the default SmartRouter gives one or the other depending on which router accepted the table.
'''

[[bug]]
id = "hono/5"
title = "TrieRouter and LinearRouter use the literal segment after a regexp parameter unescaped in a lookahead: /:x{[0-9]+}/$ never matches, and . in the literal matches any character"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLiteralAfterRegexpParamIsEscaped"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`router.add('GET', '/:x{[0-9]+}/$', 'h')`: `match('GET', '/654/$')` is `[['h', { x: '654' }]]` in RegExpRouter and PatternRouter and `[]` in TrieRouter and LinearRouter; the literals `a+b` and `(a)` fail the same way, and `/$/:name` (the shared test "non ascii characters", where the `$` comes first) works everywhere. `getPattern(label, next)` in `utils/url.ts` builds `new RegExp('^' + pattern + '(?=/' + next + ')')` with the next literal segment pasted in verbatim, so `$` means end-of-input, `+`, `(` and `?` are operators and `.` matches any character: `/:v{[0-9]+}/app.js` also matches `/1/appXjs` in TrieRouter (a false positive rather than a miss). LinearRouter builds its lookahead from the same unescaped `parts[j + 1]`. RegExpRouter escapes metacharacters in literals (`regExpMetaChars`), which is why it gets this right.
'''

[[bug]]
id = "hono/6"
title = "Which value a duplicated parameter name gets depends on the router and on the route's shape: /:id/:id takes the first everywhere, but /:id{re}/:id{re} takes the second in TrieRouter and /:n/:n/:n/:x the third in RegExpRouter"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinDuplicateParamNamesTakeTheFirstValue"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The shared test "Duplicate param name > self" fixes `/:id/:id` against `/123/456` to `id = '123'` (the first occurrence), and TrieRouter, RegExpRouter and LinearRouter agree on it (PatternRouter rejects duplicate names as unsupported). Other shapes do not follow that rule: in TrieRouter `/:id{[0-9]+}/:id{[0-9]+}` against `/65/42` gives `id = '42'`, `/:id/:id{[0-9]+}` against `/ab/42` gives `'42'` (RegExpRouter and LinearRouter: `'ab'`), and `/:x/:x/c/a` against `/a/b/c/a` gives `x = 'b'`; in RegExpRouter `/:n/:n/:n/:x` against `/1/2/3/4` gives `n = '3'`. TrieRouter's `#pushHandlerSets` picks `params[key]` for the first possible key only (`params?.[key] && !i ? ... : nodeParams[key] ?? params?.[key]`), so the winner depends on the key's index and on which of the two parameter maps holds it; RegExpRouter's `reduceRight` over the parameter association keeps the last capture. A handler that reads `c.req.param('id')` gets a router-dependent value for such routes.
'''

[[bug]]
id = "hono/7"
title = "An optional parameter after a wildcard makes TrieRouter and PatternRouter return the same handler twice for one request (/foo/*/:y? against /foo/a/b), RegExpRouter once"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinOptionalParamAfterWildcardMatchesOnce"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`router.add('GET', '/foo/*/:y?', 'h')`: `match('GET', '/foo/a/b')` is `[['h', {}], ['h', { y: 'b' }]]` in TrieRouter and PatternRouter and `[['h', { y: 'b' }]]` in RegExpRouter; `/:x{[a-z]+}/*/:y?` behaves the same. `checkOptionalParameter` expands the route into `/foo/*` and `/foo/*/:y`, and the first is now a trailing-wildcard route that also matches `/foo/a/b`, so the handler is registered and matched twice; RegExpRouter registers the `/foo/*` expansion as a route rather than middleware and matches it once. In a Hono app the handler (or middleware) runs twice for the request under TrieRouter, once under RegExpRouter, and the default SmartRouter picks either depending on the rest of the table. Expanding an optional parameter should not turn the shorter route into a catch-all, or the expansions should be de-duplicated at match time.
'''

[[bug]]
id = "hono/8"
title = "RegExpRouter never runs a middleware whose middle wildcard sits where another route has a parameter: GET /*/x.js -> h0; GET /:x/* -> mw returns h0 alone for /foo/x.js, TrieRouter and PatternRouter return both"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRegExpRouterRunsMiddlewareWhereWildcardMeetsLabel"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`router.add('GET', '/*/x.js', 'h0'); router.add('GET', '/:x/*', 'mw')`: `match('GET', '/foo/x.js')` is `[['h0', {}]]` in RegExpRouter and `[['h0', {}], ['mw', { x: 'foo' }]]` in TrieRouter and PatternRouter (LinearRouter rejects the table). Mirrored, `GET /:y/a/x.js -> h0; GET /*/a/* -> mw` on `/foo/a/x.js` is `[['h0', { y: 'foo' }]]` in RegExpRouter and both handlers in the other three. `reg-exp-router/router.ts` attaches a middleware to the routes it covers by testing the middleware's path regexp (`buildWildcardRegExp`) against the other routes' path *text*, in which a middle `*` is a literal star and a `:label` is literal text, so a `*` in one path and a label in the other at the same position never match each other and the middleware is not registered for that route; matching the request then finds the route's own handlers only. SmartRouter picks RegExpRouter for such tables, so a Hono app skips the middleware for these requests. The coverage test should compare patterns, not text.
'''

[[bug]]
id = "hono/9"
title = "RegExpRouter drops the handlers of P/* when P* is also registered: GET /ab/* -> h0; GET /ab* -> h1 returns h1 alone for /ab/x and /ab, the other routers return both"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinRegExpRouterRunsTrailingWildcardBesideSuffixWildcard"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`router.add('GET', '/ab/*', 'h0'); router.add('GET', '/ab*', 'h1')`: `match('GET', '/ab/x')` and `match('GET', '/ab')` are `[['h1', {}]]` in RegExpRouter and `[['h0', {}], ['h1', {}]]` in TrieRouter, PatternRouter and LinearRouter, in either registration order; `/ab*` beside `/abc/*` is fine. Both paths are middleware in RegExpRouter; `compareKey` orders `/ab.*` before `/ab(?:|/.*)`, and the handlers of `/ab*` were gathered by testing `^/ab(?:|/.*)$` against the text `/ab*`, which fails (the same text comparison as hono/8), so the `/ab.*` entry, which wins the match, carries h1 only. A Hono app under the default SmartRouter loses the `/ab/*` handlers for every request under `/ab`.
'''

[[bug]]
id = "hono/10"
title = "TrieRouter and LinearRouter do not match /:y{.+}/ab/:name against /q/ab/abc: the lookahead compiled for the literal after a slash-spanning regexp has no segment terminator, so .+ overshoots"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLiteralAfterSlashSpanningRegexpEndsAtTheSegment"
found = { commit = "52febbcc30bc509d5e4987577e63906fe08fc471", version = "4.13.8", hegel = "0.4.5", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`router.add('GET', '/:y{.+}/ab/:name', 'h')`: `match('GET', '/q/ab/abc')` (or `/q/ab/ab`) is `[]` in TrieRouter and LinearRouter and `[['h', { y: 'q', name: 'abc' }]]` in RegExpRouter and PatternRouter; `/q/ab/q` matches everywhere. `utils/url.ts` `getPattern` compiles a regexp parameter followed by a literal as `new RegExp('^' + re + '(?=/ab)')` (LinearRouter has the same expression), a lookahead with no terminator after the literal, so the greedy `.+` runs to the last place where `/ab` begins - the start of `/abc` - and consumes the literal segment itself; the tree then wants `ab` where `abc` is and fails, without backtracking. The lookahead should be `(?=/ab(?:/|$))`, or the tree should retry shorter matches. Related to hono/2 (a dynamic segment after `.+` never matches) and hono/5 (the literal is pasted unescaped): all three come from the lookahead built in `getPattern`.
'''
