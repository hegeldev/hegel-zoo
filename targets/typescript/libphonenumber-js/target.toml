name = "libphonenumber-js"
language = "typescript"
upstream = "https://github.com/catamphetamine/libphonenumber-js"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-20"  # README, CODE_OF_CONDUCT.md, no CONTRIBUTING/.github: nothing about AI

[base]
commit = "54c020980f83a66f188013cc3bb3d6006cec09c6"
date = "2026-06-19"
version = "1.13.7"

[hegel]
version = "0.4.5"

[run]
# Plain ESM run from source/ with no build. Hegel, the oracle (google-libphonenumber, the Closure
# port of Google's library, compiled with libphonenumber 9.0.28 metadata) and the library's own
# metadata generator go under .hegel/; the metadata both sides use is generated from the
# PhoneNumberMetadata.xml of that same 9.0.28 release, so disagreements are code, not data.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel @hegeldev/hegel@0.4.5 google-libphonenumber@3.2.46 libphonenumber-metadata-generator@2.0.6",
  "curl -sSfL -o hegel/PhoneNumberMetadata.xml https://raw.githubusercontent.com/google/libphonenumber/v9.0.28/resources/PhoneNumberMetadata.xml",
  "node hegel/generate-metadata.mjs hegel/PhoneNumberMetadata.xml hegel/metadata.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

[expected_failures]
TestHegelPinTristanDaCunhaFixedLineIsFixedLine = "libphonenumber-js/1"
TestHegelPinStrictParseAcceptsTelUris = "libphonenumber-js/2"
TestHegelPinStrictParseIgnoresLeadingWhitespace = "libphonenumber-js/3"
TestHegelPinAsYouTypeOutputDoesNotDependOnChunking = "libphonenumber-js/4"
TestHegelPinAsYouTypeNumberDoesNotDependOnChunking = "libphonenumber-js/5"
TestHegelPinPhoneNumberConstructorDerivesTheCountry = "libphonenumber-js/6"
TestHegelPinAsYouTypeKeepsTheNationalPrefixWhenParseDoes = "libphonenumber-js/7"
TestHegelPinAsYouTypeCharsAreTheTypedCharacters = "libphonenumber-js/8"
TestHegelPinExtensionPrefixIsInheritedFromTheMainCountry = "libphonenumber-js/9"
