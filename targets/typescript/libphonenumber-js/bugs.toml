# Bugs found in libphonenumber-js (catamphetamine/libphonenumber-js) by the Hegel zoo. ids are
# libphonenumber-js/N; see README.md for the properties. The oracle is google-libphonenumber 3.2.46
# (libphonenumber 9.0.28) with both sides on metadata generated from the same PhoneNumberMetadata.xml.

[[bug]]
id = "libphonenumber-js/1"
title = "getType() is FIXED_LINE_OR_MOBILE for a country whose metadata has fixed-line numbers and no mobile pattern (Tristan da Cunha), where Google gives FIXED_LINE"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinTristanDaCunhaFixedLineIsFixedLine"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parsePhoneNumber('+2908999').getType()` is `'FIXED_LINE_OR_MOBILE'`; Google's `getNumberType` gives `FIXED_LINE` for the same number on the same metadata, and so does the library's `getExampleNumber('TA', examples).getType()` disagree with Google for its own example. Tristan da Cunha (TA, +290 8xxx) is the one territory whose metadata has a `<fixedLine>` pattern and no `<mobile>` element at all. In `source/helpers/getNumberType.js` a number matching the fixed-line pattern returns `FIXED_LINE_OR_MOBILE` when `metadata.type('MOBILE')` is absent; the comment says the branch is "for backwards compatibility with old metadata" (where an absent entry meant "same pattern as fixed line"), but the current generator also omits the entry when the country has no mobile numbers, and the two cases are indistinguishable to the check. Google treats a missing description as matching nothing.
'''

[[bug]]
id = "libphonenumber-js/2"
title = "extract: false rejects RFC 3966 tel: URIs, including the library's own format('RFC3966') output, so isValidPhoneNumber('tel:+12133734253') is false"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinStrictParseAcceptsTelUris"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parsePhoneNumber('tel:+12133734253')` parses (the default `extract: true`), but `parsePhoneNumber('tel:+12133734253', { extract: false })` is `undefined` (`parsePhoneNumberWithError` throws `NOT_A_NUMBER`), and therefore `isValidPhoneNumber('tel:+12133734253')`, `isPossiblePhoneNumber(...)` and `validatePhoneNumberLength(...)`, which the README documents as "strictly" parsing their input, all reject it: `isValidPhoneNumber('tel:+12133734253') === false` while `isValidPhoneNumber('+12133734253') === true`. The text is exactly what `parsePhoneNumber('+12133734253').format('RFC3966')` (and `getURI()`) produce, so a number formatted by the library does not validate with the library; Google's `parse` accepts tel: URIs in every mode. In `source/parse.js` the RFC 3966 handling (`extractFormattedPhoneNumberFromPossibleRfc3966NumberUri`) is applied around `extractFormattedPhoneNumber`, which under `extract === false` returns the text unchanged, `tel:` prefix and all, and the later viability check fails on the letters.
'''

[[bug]]
id = "libphonenumber-js/3"
title = "extract: false accepts trailing spaces and leading spaces before a digit but rejects a leading space before + and a trailing newline"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinStrictParseIgnoresLeadingWhitespace"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With `extract: false` (and so in `isValidPhoneNumber`, `isPossiblePhoneNumber` and `validatePhoneNumberLength`): `isValidPhoneNumber('+12133734253 ')` is true and `isValidPhoneNumber('  8 (800) 555-35-35', 'RU')` is true, but `isValidPhoneNumber(' +12133734253')` is false, `isValidPhoneNumber('\\t+12133734253')` is false and `isValidPhoneNumber('+12133734253\\n')` is false. Google's `parse` trims all of these to the same number. The README describes `extract: false` as parsing "the input string as if the whole string was a phone number"; whether whitespace around it counts should not depend on which side it is on or on whether the number starts with `+`. In `source/parse.js` the strict path skips the `extractFormattedPhoneNumber` trimming, and the viable-number check then tolerates some whitespace positions (the pattern allows punctuation after the first digit) and not others (nothing before a `+`, no newline at the end).
'''

[[bug]]
id = "libphonenumber-js/4"
title = "AsYouType formats the same characters differently when they are typed one at a time and when they are given at once (+800 12345 vs +800 1234 5; a Chinese number left unformatted)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAsYouTypeOutputDoesNotDependOnChunking"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`new AsYouType().input('+80012345')` is `'+800 1234 5'` (and `formatIncompletePhoneNumber('+80012345')` the same, as is Google's formatter), but feeding the same nine characters one by one, as a text field does, ends at `'+800 12345'`. With default country `CN`, `input('28110746360')` gives `'28 110 746 360'` while typing the digits one at a time gives `'2'`, `'28'`, `'28 1'`, ..., `'28 1107 4636'` and then the unformatted `'28110746360'` on the last digit; `input('28110')` followed by `input('746360')` also ends unformatted. The README documents `input(text)` as "Appends text to the input. Returns the formatted phone number", so the result should be a function of the accumulated input. `source/AsYouTypeFormatter.js` narrows `matchingFormats` as digits arrive (`narrowDownMatchingFormats`) and drops a chosen format once it stops matching, but does not reconsider the formats it discarded earlier, while a whole-string `input` picks the format for the complete number; the two paths therefore end in different states.
'''

[[bug]]
id = "libphonenumber-js/5"
title = "AsYouType.getNumber() typed one digit at a time with default country AI or LC prepends the territory's leading digits to a 10-digit NANPA number (+12645002345678)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAsYouTypeNumberDoesNotDependOnChunking"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
For `new AsYouType('AI')`, `input('5002345678')` gives `getNumber().number === '+15002345678'` (the same as `parsePhoneNumber('5002345678', 'AI')` and Google), but typing the ten digits one at a time gives `getNumber().number === '+12645002345678'`, `getNationalNumber() === '2645002345678'` and `isValid() === false`, a 13-digit national number that no NANPA plan has. The same with `LC`: `6499521118` typed becomes `+17586499521118`. Anguilla and Saint Lucia are non-main countries of calling code 1 whose metadata carries `leadingDigits` (`264`, `758`); the incremental parser (`source/AsYouTypeParser.js`) treats the digits typed so far as a number that must start with those leading digits and at some point inserts them in front of the national number, while the whole-string path does not. The displayed text, `(500) 234-5678`, is the same in both cases, so the formatter and the number it reports disagree.
'''

[[bug]]
id = "libphonenumber-js/6"
title = "new PhoneNumber(e164) leaves country undefined (and isValid()/getType() wrong for non-main countries) where parsePhoneNumber of the same string derives it"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinPhoneNumberConstructorDerivesTheCountry"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README documents constructing a `PhoneNumber` "manually from a number in E.164 format" (`new PhoneNumber('+12133734253')`) and the `country` property as "undefined when no country could be derived from the phone number". `new PhoneNumber('+12133734253', metadata).country` is `undefined` and so is `new PhoneNumber('+2347001234567', metadata).country` (calling code 234 belongs to Nigeria alone), while `parsePhoneNumber` of the same strings gives `US` and `NG` and `getPossibleCountries()` on the constructed object gives `['NG']`. The validity methods then run against the calling code's main country: `new PhoneNumber('+14413701234', metadata)` (a Bermuda mobile number) has `isValid() === false` and `getType() === undefined` where `parsePhoneNumber('+14413701234')` has `country: 'BM'`, `isValid() === true`, `getType() === 'MOBILE'`; `new PhoneNumber('+13101234')` (a US UAN) is likewise invalid when constructed and valid when parsed. In `source/PhoneNumber.js` the constructor splits the E.164 string into calling code and national number with `extractCountryCallingCode` and then calls `getCountryAndCallingCodeFromOneOfThem`, which maps a country to its calling code but never a calling code and national number to a country; `parse` runs `getCountryByNationalNumber` for that.
'''

[[bug]]
id = "libphonenumber-js/7"
title = "AsYouType.getNumber() strips a national prefix that parsePhoneNumber (and Google) keep: 8005553535 in RU becomes the invalid +7005553535"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinAsYouTypeKeepsTheNationalPrefixWhenParseDoes"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parsePhoneNumber('8005553535', 'RU')` is `+78005553535`, valid, a toll-free number (Google agrees); `new AsYouType('RU').input('8005553535')` reports `getNumber().number === '+7005553535'`, `getNationalNumber() === '005553535'`, `isValid() === false`: the leading `8`, which is Russia's national prefix as well as the first digit of every 800 number, is stripped although what remains is not a possible number. Likewise `input('78005553535')` gives `+7005553535` with `getCountry() === undefined`, and in Nigeria `input('003316740')` gives `+23403316740` where `parsePhoneNumber('003316740', 'NG')` and Google give `+234003316740`. The parser (`source/helpers/extractNationalNumber.js`) strips a national prefix only if the number stays possible (or becomes possible), following Google's `maybeStripNationalPrefixAndCarrierCode`; the as-you-type path (`source/AsYouTypeParser.js`) strips it unconditionally, so the number an input field reports differs from what the same digits parse to once submitted.
'''

[[bug]]
id = "libphonenumber-js/8"
title = "AsYouType.getChars() reports an extra + for an international prefix typed in national mode (00 typed with default country DE gives +00 against a template of xx)"
kind = "contract"
severity = "low"
test = "TestHegelPinAsYouTypeCharsAreTheTypedCharacters"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README: "getChars(): Returns the phone number characters: + sign (if present) and the digits" and "getTemplate(): Returns the template that is used to format the phone number characters, + sign (if present) and the digits, which are designated by x-es". With `new AsYouType('DE')`, `input('00')` returns `'00'`, `getTemplate()` is `'xx'`, `isInternational()` is `true`, but `getChars()` is `'+00'`: three characters for a two-x template and a `+` the user never typed. After `input('0044123')` the chars are `'+0044123'` for the displayed `'00 44 123'`. Germany's international prefix `00` is recognised (the number becomes international, which is right, and `getNumber()` is `+44123`), but `getChars()` concatenates the synthetic `+` with the digits including the prefix instead of either the typed characters or the `+`-normalised ones. Countries whose IDD prefix is not plain digits (NG `009`, US `011` typed as such) do not show it because the recognition does not fire in the same way.
'''

[[bug]]
id = "libphonenumber-js/9"
title = "the extension prefix is not inherited from the calling code's main country: +44 Isle of Man and Jersey numbers format as ' ext. ' where GB numbers (and Google) use ' x'"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinExtensionPrefixIsInheritedFromTheMainCountry"
found = { commit = "54c020980f83a66f188013cc3bb3d6006cec09c6", version = "1.13.7", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`parsePhoneNumber('+442079460958')` with `setExt('7')` formats as `+44 20 7946 0958 x7` (the README: "`${number} x${extension}` for the United Kingdom"), but `parsePhoneNumber('+441624756789')` (Isle of Man, `country: 'IM'`, valid) with the same extension formats as `+44 1624 756789 ext. 7`, and Jersey (`+441534...`) likewise; Google formats both as `x7`. In `PhoneNumberMetadata.xml` the `preferredExtnPrefix=" x"` attribute sits on the GB territory only, and the other +44 territories inherit it along with the number formats. `source/metadata.js` inherits `formats()` and the national prefix rules from the calling code's main country (`getDefaultCountryMetadataForRegion`) but `NumberingPlan.ext()` reads `this.metadata[13]` of the territory itself and falls back to the default `' ext. '`, so the inheritance stops short of the extension prefix. A Guernsey number that the library cannot attribute to a country (`country: undefined`) does get `' x'`, because the lookup then goes through the calling code's main plan: the same number formats differently depending on whether its country was recognised.
'''
