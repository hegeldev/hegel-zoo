name = "decimaljs"
language = "typescript"
upstream = "https://github.com/MikeMcl/decimal.js"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-15"  # README, CHANGELOG, test/hypothesis/README.txt: no AI policy (no CONTRIBUTING, no .github)

[base]
commit = "b1d1e311eb272b16f5b2ca0e0d1f4c4fa8558edf"
date = "2026-08-30"
version = "10.6.0"

[hegel]
version = "0.4.5"

[run]
# decimal.js is a single ES module with no dependencies and no build step; the tests import
# ../decimal.mjs. The oracle is Python's decimal module (stdlib; python3 is on the machine and
# in CI's ubuntu image), kept as one child process over two FIFOs (test/hegel-decimal-oracle.py).
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev @hegeldev/hegel@0.4.5",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
PinDecimaljs1ToNearestNegativeNRoundsTheWrongWay = "decimaljs/1"
PinDecimaljs2ToFractionNeverReturnsUnderRoundFloor = "decimaljs/2"
PinDecimaljs3SumMisplacesAFarSmallerAddend = "decimaljs/3"
PinDecimaljs4RandomZeroThrows = "decimaljs/4"
PinDecimaljs5ZeroRemainderLosesTheDividendSign = "decimaljs/5"
PinDecimaljs6RadixStringBinaryExponentIsInexact = "decimaljs/6"
