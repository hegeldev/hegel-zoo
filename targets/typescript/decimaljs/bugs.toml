# Bugs found in decimal.js (MikeMcl/decimal.js) by the Hegel zoo. ids are decimaljs/N; see
# README.md for the properties and test/hegel.test.mjs (in hegel.patch) for the pins. The oracle
# is Python's decimal module (with fractions for the exact parts), see test/hegel-decimal-oracle.py.

[[bug]]
id = "decimaljs/1"
title = "toNearest with a negative n rounds in the opposite direction for ROUND_CEIL/FLOOR/HALF_CEIL/HALF_FLOOR"
kind = "wrong-result"
severity = "low"
test = "PinDecimaljs1ToNearestNegativeNRoundsTheWrongWay"
found = { commit = "b1d1e311eb272b16f5b2ca0e0d1f4c4fa8558edf", version = "10.6.0 (2026-08-30)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`new Decimal(9.499).toNearest(-0.5, Decimal.ROUND_FLOOR)` is `9.5` and `toNearest(0.5, ROUND_FLOOR)` is `9`; the docs promise "the nearest multiple of x in the direction of rounding mode rm", and the multiples of -0.5 are those of 0.5. `P.toNearest` computes `divide(x, y, 0, rm, 1).times(y)`: the quotient 9.499 / -0.5 = -18.998 is negative, ROUND_FLOOR takes it to -19, and -19 × -0.5 = 9.5 lies above x. The same flip hits ROUND_CEIL (9.499 → 9 instead of 9.5) and, on ties, ROUND_HALF_CEIL / ROUND_HALF_FLOOR (`new Decimal(1.25).toNearest(-0.5, ROUND_HALF_CEIL)` is 1, with 0.5 it is 1.5). Symmetric modes (UP, DOWN, HALF_UP, HALF_DOWN, HALF_EVEN) are unaffected. Found by TestHegelRoundingAndFormattingMatchTheModels (about 7% of its cases).
'''

[[bug]]
id = "decimaljs/2"
title = "toFraction never returns when the rounding mode is ROUND_FLOOR"
kind = "crash"
severity = "high"
test = "PinDecimaljs2ToFractionNeverReturnsUnderRoundFloor"
found = { commit = "b1d1e311eb272b16f5b2ca0e0d1f4c4fa8558edf", version = "10.6.0 (2026-08-30)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
With `Decimal.set({ rounding: Decimal.ROUND_FLOOR })` (or a clone so configured), `new Decimal(1.75).toFraction()`, `new Decimal(1).toFraction()`, `new Decimal(0).toFraction()`, `new Decimal(-0.3).toFraction(1000)` … loop forever; the CPU-bound loop cannot be interrupted from JavaScript. `P.toFraction` runs the continued-fraction loop with `external = false`; when the expansion terminates, `d = n.minus(q.times(d2))` is an exact zero, and `P.minus` returns a zero result as `new Ctor(rm === 3 ? -0 : 0)` — under ROUND_FLOOR a -0. The next iteration divides by it: `q = divide(n, d, 0, 1, 1)` is -Infinity (or NaN once n is 0 too), `d2 = d0.plus(q.times(d1))` is -Infinity or NaN, and the exit test `d2.cmp(maxD) == 1` is never true. Every input whose exact denominator is reachable under `maxD` (always, without `maxD`) hangs; only calls that stop early because the denominator bound is hit return (`new Decimal(-1e-2).toFraction(7)` gives `0/1`). The other eight rounding modes give +0 and terminate. Found by TestHegelConstructorRadixAndFractionsAreExact (first as a hung run; the property now skips toFraction under ROUND_FLOOR).
'''

[[bug]]
id = "decimaljs/3"
title = "Decimal.sum misplaces an addend lying far below the running total, so a cancellation exposes a wrong result"
kind = "wrong-result"
severity = "high"
test = "PinDecimaljs3SumMisplacesAFarSmallerAddend"
found = { commit = "b1d1e311eb272b16f5b2ca0e0d1f4c4fa8558edf", version = "10.6.0 (2026-08-30)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
At the default precision 20, `Decimal.sum('1e40', 1, '-1e40')` is `10000000` and `Decimal.sum('1e100', 1, '-1e100')` is `1e+70`; at precision 5, `Decimal.sum('1e21', 1, '-1e21')` is `10000000` and `sum('1e30', 1, '-1e30')` is `100000000000000`. The docs: "Only the result is rounded, not the intermediate summations". `sum` adds with `external = false` (no rounding per step) and finalises once, but `P.plus` caps the alignment of the smaller operand at `max(ceil(precision / 7), words) + 1` base-1e7 words — "Limit number of zeros prepended" — and collapses it to a single word (`d.length = 1`). That cap is sound when the result is rounded to `precision` right away (the misplaced part lies below the rounding position, and sticky behaviour is preserved) but not for an unrounded intermediate: 1e40 + 1 becomes 1e40 + 1e7 at 20 digits, and subtracting 1e40 leaves 1e7. Any sum whose largest and smallest addends are more than about `7 * (ceil(precision / 7) + 1)` orders of magnitude apart and later cancel is affected; `Decimal.sum('1e100', '-1e100', 1)`, cancelling first, is right. `x.plus(y).minus(z)` (rounded per step) gives 0 here, as expected at that precision; the wrong values are only reachable through `sum`. Found by TestHegelArithmeticMatchesPythonDecimal.
'''

[[bug]]
id = "decimaljs/4"
title = "Decimal.random(0) throws although the docs allow 0 decimal places"
kind = "crash"
severity = "low"
test = "PinDecimaljs4RandomZeroThrows"
found = { commit = "b1d1e311eb272b16f5b2ca0e0d1f4c4fa8558edf", version = "10.6.0 (2026-08-30)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`Decimal.random(0)` throws `[DecimalError] Invalid argument: 0`; the API docs for `random([dp])` say "dp: number: integer, 0 to 1e+9 inclusive" and that the value has dp decimal places (or fewer). `random` checks `checkInt32(dp, 1, MAX_DIGITS)`. A value in [0, 1) with no decimal places is 0, so the only sensible answer is `0` (the docs allow "less" decimal places, so 0 is a legitimate result, not a special case). Found by TestHegelExponentLimitsRandomAndMinMaxClamp.
'''

[[bug]]
id = "decimaljs/5"
title = "mod returns +0 for a negative dividend that divides exactly (the docs: the sign of this, as JavaScript's %)"
kind = "wrong-result"
severity = "low"
test = "PinDecimaljs5ZeroRemainderLosesTheDividendSign"
found = { commit = "b1d1e311eb272b16f5b2ca0e0d1f4c4fa8558edf", version = "10.6.0 (2026-08-30)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`new Decimal(-6).mod(3).valueOf()` is `"0"`; JavaScript's `-6 % 3` is `-0`, and the docs for `mod` say that with the default `modulo` mode the result "will have the same sign as this Decimal, and it will match that of JavaScript's % operator". The remainder is formed as `x.minus(q.times(y))`, and a zero result of `minus` takes the sign of the rounding rule (`new Ctor(rm === 3 ? -0 : 0)`), so it is +0 unless the constructor's rounding is ROUND_FLOOR (then -0 even for `6 mod 3`). `new Decimal(-0).mod(3)` is -0 (zero dividends are returned early). Zero-sign only; found by TestHegelArithmeticMatchesPythonDecimal.
'''

[[bug]]
id = "decimaljs/6"
title = "a radix string with a binary exponent (0x…p±N, 0b…, 0o…) is parsed inexactly"
kind = "wrong-result"
severity = "medium"
test = "PinDecimaljs6RadixStringBinaryExponentIsInexact"
found = { commit = "b1d1e311eb272b16f5b2ca0e0d1f4c4fa8558edf", version = "10.6.0 (2026-08-30)", hegel = "0.4.5", date = "2026-09-15" }
status = "open"
notes = '''
`new Decimal('0o1p+104').toFixed()` is `20282409603651670424000000000000` (20 significant digits) instead of 2^104 = 20282409603651670423947251286016; `new Decimal('0b1p-27').toFixed()` is `0.000000007450580596923828` instead of 2^-27 = 0.000000007450580596923828125, and `new Decimal('0b1.01000110011011p-27')` is off in its 18th digit. The value is the same with a constructor of precision 100: `parseOther` applies the exponent with `x.times(Math.abs(p) < 54 ? mathpow(2, p) : Decimal.pow(2, p))` — a JavaScript number, whose shortest string form (`7.450580596923828e-9`) loses the low digits of a negative power of two, or the *base* constructor's `pow` at its own precision (20 by default). Radix strings without an exponent are exact (`0b1.01000110011011` is 1.27508544921875 exactly, `divide(x, divisor, len * 4)` gives every digit). Consequences: `new Decimal(x.toBinary(sd))`, `toOctal(sd)` and `toHex(sd)` (which print with a `p` exponent) do not read back to the printed value, and hexadecimal float literals such as `0x1.8p+1` are exact only while they are short. The constructor is otherwise documented and observed not to round. Found by TestHegelConstructorRadixAndFractionsAreExact (the radix cases read the strings back with the constructor first).
'''
