name = "node-jsonc-parser"
language = "typescript"
upstream = "https://github.com/microsoft/node-jsonc-parser"
subdir = ""
license = "MIT"
ai_policy_checked = "2026-09-16"  # README, SECURITY.md, .github/: Microsoft CLA only, no AI policy

[base]
commit = "dba4356548089b594dd12b324d0547e1c2c5ddb8"
date = "2026-09-18"
version = "4.0.0-next.2"

[hegel]
version = "0.4.5"

[run]
# TypeScript sources, lib/ not committed: install Hegel at the root (the package has no runtime
# dependencies), TypeScript under .hegel/ (it is a devDependency of the package, which --omit=dev
# would prune from the root install), then compile src/main.ts + src/impl into .hegel/dist (ESM,
# const enums preserved) with test/tsconfig.hegel.json; the tests import that build.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --omit=dev @hegeldev/hegel@0.4.5",
  "npm install --no-audit --no-fund --no-save --no-package-lock --prefix .hegel typescript@5.9.3",
  "node .hegel/node_modules/typescript/bin/tsc -p test/tsconfig.hegel.json --noCheck",
]
command = "node --test --test-reporter=tap test/hegel.test.mjs"

[expected_failures]
TestHegelPinLocationMatchesADoubleStarPattern = "node-jsonc-parser/1"
TestHegelPinParseKeepsProtoAsAnOwnProperty = "node-jsonc-parser/2"
TestHegelPinModifyRefusesToRemoveBeyondTheArrayEnd = "node-jsonc-parser/3"
TestHegelPinUnterminatedBlockCommentEndsWithTheText = "node-jsonc-parser/4"
TestHegelPinModifyEditsTheKeyThatParseReads = "node-jsonc-parser/5"
TestHegelPinModifyRemovesTheOnlyPropertyBeforeATrailingComma = "node-jsonc-parser/6"
TestHegelPinLocationInAnArrayElementIsNotAtAPropertyKey = "node-jsonc-parser/7"
TestHegelPinCommentTokenValueIsTheComment = "node-jsonc-parser/8"
TestHegelPinRangeFormattingKeepsTheLinesBeforeTheRange = "node-jsonc-parser/9"
