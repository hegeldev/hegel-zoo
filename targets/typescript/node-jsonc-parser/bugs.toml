[[bug]]
id = "node-jsonc-parser/4"
title = "An unterminated block comment's token is one character longer than the text: getTokenLength() and the UnexpectedEndOfComment error run past the end, and the EOF token has length 1"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinUnterminatedBlockCommentEndsWithTheText"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
scanner.ts:270-296: the block-comment loop stops at `len - 1` for the `*/` lookahead and, when the
comment is not closed, does `pos++` to account for it; for a comment whose last character is already
the last of the text (`/*`, or `[1, /*` in general when the text ends right after the `*`... any
unterminated comment) `pos` ends at `len + 1`. `createScanner('/*').scan()` reports length 3 for a
text of 2; `parse('[1, /*', errors)` reports `UnexpectedEndOfComment` at 4+3 in a text of 6, and the
EOF token that follows has offset 6 and length 1. Found by `TestHegelScannerTilesTheText`.
'''

