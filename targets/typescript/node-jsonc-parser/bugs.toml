[[bug]]
id = "node-jsonc-parser/7"
title = "getLocation() reports isAtPropertyKey inside an array element when the last \"{\" or \":\" before it opened an empty object"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLocationInAnArrayElementIsNotAtAPropertyKey"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parser.ts:64-131: `isAtPropertyKey` is set true on `{` and on `,` inside an object, false on `:`,
and never touched by `[`, `]`, `}` or `,` inside an array. After an empty object nothing resets
it: `getLocation('[{}, 2]', 5)` has path `[1]` and `previousNode.value === 2` but
`isAtPropertyKey === true`; the documentation says "If set, the location's offset is at a property
key." `[{"a":1}, 2]` is correct (the `:` reset it). Completion providers use this flag to offer
keys rather than values. Found by `TestHegelTreeAndLocationsAgree`.
'''

