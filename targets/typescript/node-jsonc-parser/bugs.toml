[[bug]]
id = "node-jsonc-parser/2"
title = "parse() assigns a \"__proto__\" member through the prototype setter: the key vanishes and the object's prototype is the attacker's value (JSON.parse and getNodeValue keep an own property)"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinParseKeepsProtoAsAnOwnProperty"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
parser.ts:171 `currentParent[currentProperty] = value` on a plain `{}`; for the key `__proto__` this
invokes `Object.prototype.__proto__`'s setter. `parse('{"__proto__": {"polluted": 1}}')` returns an
object with no own keys whose prototype is `{polluted: 1}` (`v.polluted === 1`), while
`JSON.parse` returns `{ "__proto__": {polluted: 1} }` as an own property and `getNodeValue(parseTree(text))`
(which builds `Object.create(null)` objects, parser.ts:339) also keeps it as an own property. Any
consumer reading configuration through `parse()` gets an object whose prototype the document
controls. Found by `TestHegelParseAgreesWithJSONParse`.
'''

