[[bug]]
id = "node-jsonc-parser/5"
title = "modify() of a duplicated key edits the first occurrence, which parse() (like JSON.parse) does not read: the value parse() returns is unchanged"
kind = "inconsistent"
severity = "low"
test = "TestHegelPinModifyEditsTheKeyThatParseReads"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`findNodeAtLocation` (parser.ts:290-296) returns the first property with the name; `parse()` and
`getNodeValue()` assign in document order, so the last wins, as in `JSON.parse`. For
`{"a":1,"a":2}`, `modify(text, ['a'], 3, {})` yields `{"a":3,"a":2}`, and `parse()` of that still
gives `a === 2`. Duplicate keys are "should be unique" in RFC 8259, but the library reads and
writes them by different rules. The generator keeps keys unique; the pin covers the shape.
'''

