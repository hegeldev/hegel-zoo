# Bugs found in jsonc-parser (microsoft/node-jsonc-parser) by the Hegel properties (see README.md).
# Each is pinned by the test named in `test` (test/hegel.test.mjs), which asserts the documented
# behaviour (or JSON.parse's) and fails while the bug exists.

[[bug]]
id = "node-jsonc-parser/1"
title = "Location.matches() never matches a pattern that contains \"**\", which the documentation says matches any run of segments or none"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinLocationMatchesADoubleStarPattern"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
main.ts documents `Location.matches`: "'**' will match a sequence of segments of any property name
or index, or no segment." In parser.ts:143-153 the loop advances the pattern index `k` only when
`pattern[k]` equals the segment or is `'*'`; on `'**'` it neither advances nor fails, so `k` stays
put and the final `k === pattern.length` is false. `getLocation('{"a":{"b":1}}', 10)` (path
`["a","b"]`) has `matches(['**'])`, `matches(['**','b'])` and `matches(['a','**'])` all false;
`matches(['*','b'])` is true. Found by `TestHegelTreeAndLocationsAgree` (every "**" pattern built
from a location's own path fails to match).
'''

