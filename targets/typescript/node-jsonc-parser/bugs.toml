[[bug]]
id = "node-jsonc-parser/9"
title = "format() of a range with keepLines deletes the line breaks before the range's first token instead of keeping them"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinRangeFormattingKeepsTheLinesBeforeTheRange"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
format.ts:95-98: with `keepLines` the line breaks before the first token are re-inserted by
`addEdit(repeat(eol, n), 0, 0)` — at document offset 0 rather than `formatTextStart`, and an
insert at (0, 0) never satisfies `addEdit`'s range filter `endOffset > rangeStart` (format.ts:90) —
while the edit that replaces the leading trivia with the indent (format.ts:105) is applied. So
`format('[1,\n\n2]', {offset: 4, length: 1}, {keepLines: true, …})` returns
`[{offset: 4, length: 1, content: ""}]` and the blank line before `2` is gone, where formatting
the whole document keeps it (`[ 1,\n\n  2 ]`). Found by `TestHegelFormatIsLosslessAndIdempotent`
(format a range, then everything ≠ format everything).
'''

