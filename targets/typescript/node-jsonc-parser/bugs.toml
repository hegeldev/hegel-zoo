[[bug]]
id = "node-jsonc-parser/8"
title = "A comment token's value starts one character before the comment, so stripComments(text, replaceCh) grows the text by one character per comment"
kind = "wrong-result"
severity = "medium"
test = "TestHegelPinCommentTokenValueIsTheComment"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
scanner.ts:250 `const start = pos - 1` is taken before `pos` has moved past the `/`, so `value =
text.substring(start, pos)` (scanner.ts:262, 298) includes the character preceding the comment:
for `[1,/*x*/2]` the block comment at offset 3 with length 5 has `getTokenValue() === ",/*x*/"`.
`stripComments` (parser.ts:693) replaces "every none-newline character of comments" in that value,
so `stripComments('[1,/*x*/2]', ' ')` is `[1,      2]` (11 characters for a 10-character input;
the documented purpose of the replacement character is to keep offsets). A comment at offset 0
is unaffected (`substring(-1, …)` clamps). Found by `TestHegelCommentsAndTrailingCommasAreTrivia`
and `TestHegelScannerTilesTheText`.
'''

