[[bug]]
id = "node-jsonc-parser/6"
title = "modify() removing the only property of an object with a trailing comma leaves \"{,}\", invalid under every option"
kind = "wrong-result"
severity = "low"
test = "TestHegelPinModifyRemovesTheOnlyPropertyBeforeATrailingComma"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
edit.ts:52-63: when the removed property is the first (`propertyIndex === 0`) and the only one, the
removal spans from after `{` to the end of the property, leaving the trailing comma:
`modify('{"a": 1,}', ['a'], undefined, {})` turns a document that parses cleanly with
`allowTrailingComma` (VS Code's mode for settings files) into `{,}`, which has errors in every
mode. Removing one of several properties keeps the document valid (the trailing comma stays with
the last one). `modify` has no parse options, so trailing commas are always an unreported error
during its own `parseTree`. The generator never puts trailing commas in a text that modify()
edits; the pin covers the shape.
'''

