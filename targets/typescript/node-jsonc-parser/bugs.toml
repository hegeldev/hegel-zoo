[[bug]]
id = "node-jsonc-parser/3"
title = "modify() asked to remove an array index at or past the end deletes the sole item of a one-element array, and throws a TypeError instead of the documented Error for longer arrays"
kind = "crash"
severity = "medium"
test = "TestHegelPinModifyRefusesToRemoveBeyondTheArrayEnd"
found = { commit = "ca66b23b9126c0806b7f3aa6e32f708635f5b7a1", version = "4.0.0-next.2", hegel = "0.4.5", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
edit.ts:99 guards the removal branch with `parent.children.length >= 0`, which is always true, so
an index beyond the end is never routed to the "Can not remove Array index N as length is not
sufficient" error at edit.ts:135. `modify('[1]', [3], undefined, {})` takes the "only item" branch
(edit.ts:104) and removes the `1`: the document becomes `[]`. `modify('[1,2]', [5], undefined, {})`
reads `parent.children[5].offset` (edit.ts:114) and throws `TypeError: Cannot read properties of
undefined (reading 'offset')`. Negative indices other than -1 do the same. The generator keeps
removals in range; the pin covers the shape.
'''

