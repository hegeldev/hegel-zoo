'''

[[bug]]
id = "jsonrepair/19"
title = "In a single-quoted string an escaped backslash followed by a double quote leaves the quote unescaped, and the output is not valid JSON"
kind = "wrong-result"
severity = "low"
test = "TestHegelRepairedOutputIsValidJSON"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
