`{"a":None[]}`, `{"a":{}[1]}`, `{"a":[][1]}`, `{"a":: []}` and `{"a":true\n[1]}` - the last one
an unclosed object followed by an array on the next line, which the regular implementation
repairs as newline-delimited JSON (`[\n{"a":true},\n[1]\n]`); on the others the regular
implementation throws `Unexpected character "["`. An object after the value (`{"a":1{}}`) makes
both throw, and inside an array (`[1[1]]`) both insert the comma. In the streaming
`parseObjectEnd` the `[` is neither a comma, a closing brace nor the start of a key, and the
repair path re-enters the same state without consuming input. Eleven bytes hang a server that
repairs untrusted text through `jsonrepairTransform` (the loop is synchronous, so no timer
fires). Also `{"cB"NaN:[1]}` (a key followed by junk, a colon and an array). Found because 4 of 30 local
runs of the regular-versus-streaming property hung; the harness now runs the streaming
implementation in a worker thread with a 5 s watchdog (`streamingGuarded` in `hegel/jr.mjs`), so
a hang comes back as a verdict and is gated like any other known bug; the pin uses the same.
Pin: `TestHegelPinStreamingTerminatesOnAnArrayAfterAPropertyValue`.
'''

[[bug]]
id = "jsonrepair/23"
title = "jsonrepairTransform pushes its output in pieces of chunkSize UTF-16 units, so a surrogate pair split between two pieces becomes two replacement characters"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelTransformOutputKeepsAstralCharactersWhole"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-25" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Piping the string `"\u{1d6fc}"` (MATHEMATICAL ITALIC SMALL ALPHA, one astral character) through
`jsonrepairTransform({ chunkSize: 1 })` outputs `"��"`, while `jsonrepair` returns the
character unchanged; any `chunkSize` whose boundary falls between the two halves of a pair does the
same (with the default 65536 that is every 64 Ki UTF-16 units of output). `src/streaming/stream.ts`
slices the output text into `chunkSize` UTF-16 units and pushes each as a string, and the stream
encodes each piece to UTF-8 on its own, so a lone surrogate at the cut is replaced. The input side
has the mirror problem for Buffer chunks (jsonrepair/8). Pin:
`TestHegelPinTransformOutputKeepsSurrogatePairsTogether`.
'''

