upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("'a\\\\\"b'")` (single quotes around `a`, an escaped backslash, a double quote, `b`)
returns `"a\\\\"b"`: the single quotes become double quotes but the embedded double quote is not
escaped, and `JSON.parse` fails with `Unexpected non-whitespace character after JSON`. The same
with `['\\\\"b', 1]` and a trailing `"c`. Without the escaped backslash the quote is escaped
