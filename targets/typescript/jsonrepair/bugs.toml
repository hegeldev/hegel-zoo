upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("callback(undefined);")` returns `"undefined);"` and `jsonrepair("f(abc)")`
returns `"abc)"`, where the JSONP repair gives `null` and `"abc"` for `callback(null);` and
`f("abc")`. `parseUnquotedString` stops at `,[]/{}\n+` and quotes only; `)` and `;` are not
delimiters for it, so inside a function call the unquoted value runs to the end of the text
and the call's closing parenthesis is never seen. Both implementations. Pin:
`TestHegelPinUnquotedStringInsideAFunctionCall`.
'''

[[bug]]
id = "jsonrepair/14"
title = "The streaming implementation throws on a leading comma followed by an ellipsis"
kind = "inconsistent"
severity = "low"
test = "TestHegelStreamingMatchesRegular"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
