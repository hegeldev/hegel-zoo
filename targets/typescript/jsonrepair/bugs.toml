[[bug]]
id = "jsonrepair/30"
title = "A string followed by whitespace and an ellipsis without a comma swallows the rest of the text into the string when more text follows the container"
kind = "wrong-result"
severity = "low"
test = "TestHegelEllipsisAfterAStringWithoutACommaIsSkipped"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-25" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('["a" ...],1')` returns `["a\" ...],1"]`: the string `a` grows to hold the ellipsis,
the closing bracket and the `1`. `["a" ...]` alone gives `["a" ]`, `[1 ...],1` gives
`[\n[1 ],1\n]` (newline-delimited repair) and `["a", ...],1` gives `[\n["a" ],1\n]`. With no comma
after the string the end-quote rule looks past the whitespace, sees `.` and treats the quote as
embedded, and the missing-end-quote fallback then runs to the next quote, which is the one the
repair itself inserts at the end; mid-container the same happens up to the next quote (`["a" ..., "b"]` gives `["a\" ...", "b"]`), while a bracket right after the container is read correctly by the regular implementation (`[["a" ...],1]` gives `[["a" ],1]`) and makes the streaming one throw `Unexpected character "."`. Both implementations. Pin:
`TestHegelPinEllipsisAfterAStringWithoutAComma`.
'''

