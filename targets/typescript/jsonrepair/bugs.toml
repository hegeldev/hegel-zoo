# Bugs found in jsonrepair by the Hegel tests in hegel.patch.

[[bug]]
id = "jsonrepair/1"
title = "Valid JSON whose last string in a container holds an unmatched bracket is rejected or rewritten"
kind = "wrong-result"
severity = "medium"
test = "TestHegelValidJSONIsReturnedUnchanged"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('{"a":"{"}')` throws `Unexpected character "{" at position 6` and
`jsonrepair('["["]')` returns `["",[""]]`, both on valid JSON that `JSON.parse` accepts. When
a closing quote is directly followed by a closing bracket, `parseString` calls
`isInsideUnclosedBracket(str, text[i])`, which counts the opening and closing brackets inside
the string content; an unmatched `{`, `[` or `(` in the content makes it treat the quote as an
embedded one, and the retry in `stopAtDelimiter` mode ends the string at the bracket. Both
implementations (`src/regular/jsonrepair.ts`, `src/streaming/core.ts`) share the check; it was
added to repair `"a (b") c"`. Pin: `TestHegelPinValidJSONWithABracketInItsLastStringIsUnchanged`.
'''

[[bug]]
id = "jsonrepair/2"
title = "An ellipsis in an object followed by a comma and whitespace throws Object key expected"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('{..., "a": 1}')` throws `Object key expected at position 9`, while
`{...,"a":1}` (no space after the comma) and `[..., 1]` are repaired. In the regular
implementation `skipEllipsis` consumes `...` and the comma but not the whitespace after the
comma, so `parseUnquotedString(true)` sees a space, reads an empty key, the real key becomes
the value and the colon that follows fails the next iteration; with a newline after the comma
the key parse fails at once. The streaming implementation skips whitespace at the start of
every step and repairs these. Pin: `TestHegelPinEllipsisFollowedByCommaAndSpaceInAnObject`.
'''

[[bug]]
id = "jsonrepair/3"
title = "A number or unquoted string followed by a special whitespace character keeps it: the number becomes a string"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("[1 ,2]")` returns `["1 ",2]` and `jsonrepair("[undefined﻿,1]")`
returns `["undefined﻿",1]`. The Readme documents that special whitespace characters
(non-breaking space, zero-width space, ideographic space, BOM, ...) are replaced with regular
spaces, and `parseWhitespace` does so; but `atEndOfNumber` only accepts a delimiter or regular
whitespace after a number, so the number falls through to `parseUnquotedString`, and the
trailing-whitespace trim of an unquoted string only removes regular whitespace, so the special
character stays inside the string and `undefined` is no longer recognised as `null`. Both
implementations. Pin: `TestHegelPinNumberBeforeSpecialWhitespaceStaysANumber`.
'''

[[bug]]
id = "jsonrepair/4"
title = "The streaming implementation rejects newline-delimited JSON followed by a redundant closing bracket"
kind = "inconsistent"
severity = "low"
test = "TestHegelStreamingMatchesRegular"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('{"a":1}\n{"b":2}]')` returns `[\n{"a":1},\n{"b":2}\n]` (the redundant `]` is
dropped like at any root), while `jsonrepairTransform` / `jsonrepairCore` with an infinite
buffer throw `Unexpected end of json string at position 15`: in `StackType.ndJson`,
`parseRepairNdJsonEnd` requires the end of the input and throws on anything else, where the
root state skips redundant `}` and `]`. The Readme says the streaming implementation with an
infinite buffer "works the same as the regular implementation" and both run the same test
suite. Pin: `TestHegelPinStreamingAcceptsNDJSONWithARedundantBracket`.
'''

[[bug]]
id = "jsonrepair/5"
title = "Repeated commas are repaired differently by the two implementations, and [1,,2] becomes [[1],2]"
kind = "inconsistent"
severity = "low"
test = "TestHegelStreamingMatchesRegular"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("[1,,2]")` returns `[\n[1],2\n]`: the second comma ends the array (trailing
comma repair, then a missing `]` inserted), and the rest is read as newline-delimited JSON.
`jsonrepair('{"a":1,,"b":2}')` and `jsonrepair("1,,")` throw `Object key expected` /
`Unexpected character ","`. The streaming implementation strips the repeated commas in all
three cases (`[1,2]`, `{"a":1,"b":2}`, `1`), because `parseRepairTrailingComma` and the root's
comma handling loop until no comma is left. Pin: `TestHegelPinRepeatedCommasAreRepairedTheSameWay`.
'''

[[bug]]
id = "jsonrepair/6"
title = "The streaming implementation keeps the trailing whitespace of an unquoted string inside the string"
kind = "inconsistent"
severity = "low"
test = "TestHegelStreamingMatchesRegular"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("[a ,b]")` returns `["a" ,"b"]` and `jsonrepair("[a\t]")` returns `["a"\t]`; the
streaming core returns `["a ","b"]` and `["a\\t"]`. The regular `parseUnquotedString` walks
back over trailing whitespace before quoting the symbol; the streaming
`parseRepairUnquotedString` does not (only `parseUnquotedKey` does), so the whitespace is
quoted and escaped into the value, and `undefined ` is no longer recognised as `undefined`
(`"undefined "` instead of `null`). Pin: `TestHegelPinStreamingTrimsUnquotedStrings`.
'''

[[bug]]
id = "jsonrepair/7"
title = "The streaming implementation throws on a missing comma before a value that does not start like one"
kind = "inconsistent"
severity = "low"
test = "TestHegelStreamingMatchesRegular"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("[1 ...]")` returns `[1 ]` and `jsonrepair("[1 ;x]")` returns `[1, ";x"]`: the
regular array loop inserts the missing comma and parses whatever follows (an ellipsis is
skipped, anything else becomes an unquoted string). The streaming `parseRepairMissingComma`
only inserts a comma when `isStartOfValue` holds (quote, letter, digit, `-`, `[`, `{`), so it
closes the array instead and the root throws `Unexpected character "." at position 3` /
`Unexpected character ";"`. The same before a regular-expression literal: `[1/x/]` and `[true/x/]` give `[1,"/x/"]` and
`[true,"/x/"]` in the regular implementation and `Unexpected character "/"` in the streaming one
(`[/x/]` and `[1,/x/]` agree). Pin: `TestHegelPinStreamingRepairsAMissingCommaBeforeAnyValue`.
'''

[[bug]]
id = "jsonrepair/8"
title = "jsonrepairTransform decodes each Buffer chunk on its own, corrupting a multibyte character split across chunks"
kind = "silent-corruption"
severity = "medium"
test = "TestHegelTransformMatchesRegular"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Writing `Buffer.from('["héllo"]')` to `jsonrepairTransform()` in two chunks split between the
two bytes of `é` outputs `["h��llo"]`. `src/streaming/stream.ts` calls
`chunk.toString()` on every chunk, so a UTF-8 sequence that straddles a chunk boundary decodes
to replacement characters; a `StringDecoder` (or `decodeStrings: false` with `setEncoding`)
would carry the partial sequence over. The Readme's own example pipes `createReadStream` into
the transform, whose 64 KiB chunks fall anywhere, so any non-ASCII document larger than one
chunk risks corruption. Pin: `TestHegelPinTransformDecodesMultibyteCharactersAcrossChunks`.
'''

[[bug]]
id = "jsonrepair/9"
title = "A function call without a parsable argument gives the string ) or an empty, invalid output"
kind = "wrong-result"
severity = "low"
test = "TestHegelRepairedOutputIsValidJSON"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("f()")` and `jsonrepair("NumberLong()")` return `")"` (the closing parenthesis
read as an unquoted string), `jsonrepair("f(}")` and `jsonrepair("f(")` return the empty
string, which is not JSON, and the streaming core on `o (}{  });` produces empty output with no
error, where the regular implementation throws `Unexpected character "{"`. In
`parseUnquotedString` the function-call branch calls `parseValue()` and returns true whatever
it parsed; in the streaming `StackType.functionCall` a failed `parseValue` ends the parse loop
silently. The API promise is repaired JSON or a `JSONRepairError`. Pin:
`TestHegelPinFunctionCallWithoutAnArgumentGivesValidJSON`.
The two implementations also part ways on other texts with a call shape: `{a(a` is `{"a":null}` in
the regular one (the `(` starts a call) and `{"a(a":null}` in the streaming one (part of the key);
`3\r\n[{_X(pN$l : 1, b : null}]` throws `Colon expected` in the regular one and is repaired by the
streaming one. The differential properties attribute any disagreement on a text containing an
identifier followed by `(` to this bug.
'''

[[bug]]
id = "jsonrepair/10"
title = "A bufferSize larger than every string and whitespace run can still throw Index out of range"
kind = "contract"
severity = "low"
test = "TestHegelFiniteBuffersRepairLikeTheRegularImplementation"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The Readme: "The bufferSize must be larger than the length of the largest string and
whitespace in the JSON data, otherwise, and error is thrown". `jsonrepairCore({ bufferSize: 9,
chunkSize: 3 })` on `[1,     "abcdef", 2]` (longest string 8, longest whitespace 5) throws
`Index out of range, please configure a larger buffer size (index: 15)`, and `bufferSize: 6`
on `  false` (longest token 5) throws at index 7. `transform` only guarantees `bufferSize`
characters of lookahead at the start of each `parse()` step, but one step reads the whitespace
before a token, the token, the whitespace after it and peeks one more character (the keyword
boundary, a `+` after a string), so the real requirement is the sum of those, plus one. Pin:
`TestHegelPinBufferLargerThanEveryStringAndWhitespaceRunSuffices`.
'''

[[bug]]
id = "jsonrepair/11"
title = "A missing colon before true, false, null, an unquoted string or a negative number is repaired only in the last property"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('{"a" true}')` returns `{"a": true}` (upstream's own test), but
`jsonrepair('{"a" true, "b": 1}')` throws `Colon expected at position 9`; the same for
`{"a" -1, "b":1}`, `{"a" x, "b":1}` and `{'a' true, 'b': 1}`, while `{"a" 1, "b":1}`,
`{"a" "x", "b":1}` and `{"a" [1], "b":1}` are repaired. After the key's closing quote,
`parseString` accepts the quote as the end only before a delimiter, a quote or a digit; a
letter or `-` makes it treat the quote as embedded and swallow the rest as string content
until the next quote, and only when no quote follows does the missing-end-quote fallback
happen to end the key at the right place. With special whitespace instead of a space between the
key and the value (`{"" \u202ftrue , }`) the repair goes further wrong: the key's closing quote is
taken as embedded and the rest of the document becomes its content. Both implementations. Pin:
`TestHegelPinMissingColonBeforeAKeywordIsRepairedInAnyProperty`.
'''

[[bug]]
id = "jsonrepair/12"
title = "Of two comments without whitespace between them only the first is stripped"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('{"a":1/**//**/,"b":2}')` throws `Object key expected at position 14`,
`jsonrepair("[1/**//**/,2]")` returns `[\n[1],2\n]` and `jsonrepair("/**//**/[1]")` throws
`Unexpected character "["`; with a space between the comments all three are repaired.
`parseWhitespaceAndSkipComments` loops `parseComment` then `parseWhitespace` and stops when
the whitespace step consumes nothing, so a comment directly followed by another (`*//*`,
`*///`) leaves the second in place, and the parser then reads `/` as a delimiter, a regex or
an unexpected character. Both implementations (the streaming one then also diverges, throwing
where the regular one returns). Pin: `TestHegelPinAdjacentCommentsAreBothStripped`.
'''

[[bug]]
id = "jsonrepair/13"
title = "An unquoted string inside a function call swallows the closing parenthesis"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("callback(undefined);")` returns `"undefined);"` and `jsonrepair("f(abc)")`
returns `"abc)"`, where the JSONP repair gives `null` and `"abc"` for `callback(null);` and
`f("abc")`. `parseUnquotedString` stops at `,[]/{}\n+` and quotes only; `)` and `;` are not
delimiters for it, so inside a function call the unquoted value runs to the end of the text
and the call's closing parenthesis is never seen. Both implementations. Pin:
`TestHegelPinUnquotedStringInsideAFunctionCall`.
'''

[[bug]]
id = "jsonrepair/14"
title = "The streaming implementation throws on a leading comma followed by an ellipsis"
kind = "inconsistent"
severity = "low"
test = "TestHegelStreamingMatchesRegular"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("[[, ...], 1]")` returns `[[ ], 1]` and `jsonrepair("[{, ...}, 1]")` returns
`[{ }, 1]`; the streaming core throws `Unexpected end of json string at position 11` and
`Unexpected character "," at position 8`. `parseArrayStart` / `parseObjectStart` skip an
ellipsis and then a leading comma, in that order, so `, ...` leaves the ellipsis for the
element step, which skips it and then repairs a missing `]` / `}` without consuming the real
one; the real bracket then closes the outer container. Pin:
`TestHegelPinStreamingStripsALeadingCommaBeforeAnEllipsis`.
'''

[[bug]]
id = "jsonrepair/15"
title = "A backslash before a raw control character leaves the raw character in the output, which is not valid JSON"
kind = "wrong-result"
severity = "low"
test = "TestHegelRepairedOutputIsValidJSON"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('"a\\\rb"')` (a backslash followed by a raw carriage return inside a string)
returns `"a\rb"` with the raw carriage return, and `JSON.parse` rejects it: `Bad control
character in string literal`; the same for a raw tab, backspace or form feed after a
backslash. `parseString` repairs a backslash before a raw newline into `\n` and treats any
other unknown escape as "invalid escape character: remove it", appending the following
character as is; a raw control character reached without the backslash is escaped correctly.
Both implementations. Pin: `TestHegelPinEscapedRawControlCharacterGivesValidJSON`.
'''

[[bug]]
id = "jsonrepair/16"
title = "Inside a string with HTML-entity or special quotes, an embedded quote followed by a backslash ends the string and the escape then throws"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('&quot;"\\"b&quot;')` (an entity-quoted string holding a quote, an escaped quote and
`b`) throws `Unexpected character "\\" at position 7`; so do `&quot;“\\"a&quot;`, `&quot;“\\na&quot;`,
`&quot;“\\u0041&quot;`, `&#34;“\\"a&#34;`, `“”\\"a”` and `'a'\\"b'`. Without the backslash the
embedded quote is repaired: `&quot;“a\\"b&quot;` gives `"\\"a\\"b"` and `&quot;"b&quot;` gives `"\\"b"`,
and with regular quotes `"“\\"a"` is valid JSON and returned unchanged. `parseString` ends a string
opened with a non-standard quote at any quote-like character of the same class; it then checks
whether the text continues like a string (a letter) to decide that the quote was embedded and
re-parse it as an escaped quote, but a backslash after the embedded quote fails that check, the
string is closed there and the backslash is an unexpected character. Both implementations. Found
by the value-preservation property with entity quotes; the generator's entity style now avoids
special double quotes in the content because `&quot;“a&quot;` is repaired to `"\\"a"` (the
special quote normalised to a regular one: a value change, not counted). Pin:
`TestHegelPinEscapedQuoteAfterAQuoteInAnEntityQuotedString`.
'''

[[bug]]
id = "jsonrepair/17"
title = "A block comment whose body starts with a slash is closed at its own opening asterisk: the regular implementation turns the body into strings, the streaming one throws"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("[1/*/x*/,0]")` returns `[1,"x*","/,0]"]` instead of `[1,0]`: the comment `/*/x*/`
(a block comment whose body is `/x`) is taken to end at its third character, as if the asterisk
that opens it also closed it, so `x*` is parsed as an unquoted string and `/,0]` as a regular
expression literal. `[a/*/x*/,0]` gives `["a","x*","/,0]"]`, `[0 /*/x*/]` gives `[0, "x*","/]"]`,
`/*/x*/[0]` throws `Unexpected character "/"`. The streaming implementation throws `Unexpected
character "/"` on all of them. `/*x*/` and `/* /x*/` are stripped correctly. In `skipBlockComment`
(regular and streaming) the search for `*/` starts at the comment's second character instead of
after the opening `/*`. Pin: `TestHegelPinBlockCommentStartingWithASlashIsStripped`.
'''

[[bug]]
id = "jsonrepair/18"
title = "In newline-delimited JSON a document that starts with an HTML-entity quote is not recognised and throws, while every other quote style is"
kind = "wrong-result"
severity = "low"
test = "TestHegelDocumentedRepairsPreserveTheValue"
found = { commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27", version = "3.15.0", hegel = "0.4.5", date = "2026-09-20" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair('{}\n&quot;a&quot;')` throws `Unexpected character "&" at position 3`, and so do
`1\n&#34;&#x22;`, `"a"\n&quot;b&quot;` and `&quot;a&quot;\n&quot;b&quot;`; `{}\n"a"`, `{}\n'a'`,
`{}\n“a”`, `{}\n\`a\``, `{}\nabc` and `{}\nNone` are all repaired to `[\n{},\n...\n]`, and an
entity-quoted string is accepted as the first document (`&quot;a&quot;\n{}`) and inside an array
(`[&quot;a&quot;]`). The same gap for a document starting with `.` or `$`: `jsonrepair('1\n.5')` and
