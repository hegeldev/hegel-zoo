(`“\\\\"b”` gives `"\\\\\\"b"`). In `parseString` the escape `\\\\` is copied and the next
character is then taken as is, without the check that turns an embedded quote of another kind
into `\\"`. Both implementations. Found by the output-validity property on random text (a
Windows path in single quotes, `'C:\\\\"x"'`, is a natural instance). Pin:
`TestHegelPinEscapedBackslashBeforeAQuoteInASingleQuotedString`.
'''

