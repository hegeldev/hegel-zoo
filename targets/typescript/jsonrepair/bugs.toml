`jsonrepairCore` with an infinite buffer on `{}\n{{}` outputs `[\n{}\n{},{}\n]`, which
`JSON.parse` rejects (no comma between the first two documents); the regular implementation
returns `[\n{},\n{},{}\n]`. The same after any first document (`1\n{{}`, `"g"\n{{}`, `true\n{{}`,
`g\n{{`, and with more documents after it); `{}\n{}{}` and `{}\n{"a":{}` are fine, and `g\n{{}}`
makes the streaming implementation throw `Unexpected end of json string`. The same inside an
array after a value with a missing comma: `[l{{` gives `["l"{},{}]`, and an object whose
special-quoted key and value both need repair loses it too, while `[l{}]`, `[l{,}]` and
`[l{"a" 1}]` keep the comma the regular implementation inserts. The streaming implementation writes the separating comma into its output
buffer and the repair of the following object then edits the buffer at an offset that discards
it. Found by the
regular-versus-streaming property on mutated text. Pin:
`TestHegelPinStreamingKeepsTheCommaBeforeADoubledBraceDocument`.
'''

