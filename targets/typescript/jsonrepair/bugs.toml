notes = '''
`jsonrepairCore({ onData, bufferSize: Infinity })` fed `{"a":1 [1]}` and flushed never returns:
the process spins at 100% CPU until killed. The same for `{"a":1[1]}`, `{"a":"b" [1]}`,
`{"a":None[]}`, `{"a":{}[1]}`, `{"a":[][1]}`, `{"a":: []}` and `{"a":true\n[1]}` - the last one
an unclosed object followed by an array on the next line, which the regular implementation
repairs as newline-delimited JSON (`[\n{"a":true},\n[1]\n]`); on the others the regular
implementation throws `Unexpected character "["`. An object after the value (`{"a":1{}}`) makes
both throw, and inside an array (`[1[1]]`) both insert the comma. In the streaming
`parseObjectEnd` the `[` is neither a comma, a closing brace nor the start of a key, and the
repair path re-enters the same state without consuming input. Eleven bytes hang a server that
repairs untrusted text through `jsonrepairTransform` (the loop is synchronous, so no timer
fires). Also `{"cB"NaN:[1]}` (a key followed by junk, a colon and an array). Found because 4 of 30 local
runs of the regular-versus-streaming property hung; the harness now runs the streaming
implementation in a worker thread with a 5 s watchdog (`streamingGuarded` in `hegel/jr.mjs`), so
a hang comes back as a verdict and is gated like any other known bug; the pin uses the same.
Pin: `TestHegelPinStreamingTerminatesOnAnArrayAfterAPropertyValue`.
'''
