upstream_issue = ""
fixed_in = ""
notes = '''
`jsonrepair("[[, ...], 1]")` returns `[[ ], 1]` and `jsonrepair("[{, ...}, 1]")` returns
`[{ }, 1]`; the streaming core throws `Unexpected end of json string at position 11` and
`Unexpected character "," at position 8`. `parseArrayStart` / `parseObjectStart` skip an
ellipsis and then a leading comma, in that order, so `, ...` leaves the ellipsis for the
