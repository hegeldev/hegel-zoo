name = "jsonrepair"
language = "typescript"
upstream = "https://github.com/josdejong/jsonrepair"
subdir = ""
license = "ISC"
ai_policy_checked = "2026-09-20"  # README, .github/ (workflows only), no CONTRIBUTING: no AI policy

[base]
commit = "4a80ed87fb1155db064945bc2aa4f6b4f4e89c27"
date = "2026-07-03"
version = "3.15.0"

[hegel]
version = "0.4.5"

[run]
# src/ is TypeScript with .js import specifiers and no runtime dependencies; upstream builds with
# Babel. The setup installs Hegel, TypeScript and Node's types under .hegel/ and compiles src/ to
# .hegel/dist (ES2020 modules, hegel/tsconfig.json). The tests import the regular API from
# .hegel/dist/index.js, the streaming core from .hegel/dist/streaming/core.js and the Node
# Transform from .hegel/dist/stream.js. Node 22.
setup = [
  "npm install --no-audit --no-fund --no-save --no-package-lock --ignore-scripts --prefix .hegel @hegeldev/hegel@0.4.5 typescript@5 @types/node@22",
  ".hegel/node_modules/.bin/tsc -p hegel/tsconfig.json",
]
command = "node --test --test-reporter=tap hegel/hegel.test.mjs"

