name = "snakeyaml"
language = "java"
upstream = "https://github.com/snakeyaml/snakeyaml"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-16"  # README "Contribute": file bug reports / mailing list; no CONTRIBUTING.md, nothing about AI (GitHub mirror of codeberg.org/snakeyaml/snakeyaml); the zoo only records bugs

[base]
commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b"
date = "2026-08-30"
version = "2.8-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install org.yaml:snakeyaml into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on it as `snakeyaml.version`). Tests, javadoc, sources and the release checks are skipped.
# The tests also need python3 with PyYAML (`python3-yaml`; libyaml bindings preferred) as the oracle: the
# oracle is started as `python3` from the PATH, so whatever python3 comes first there (in CI the venv that
# holds the jsonschema oracle) must have PyYAML installed.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dgpg.skip=true -Dformatter.skip=true install",
]

[expected_failures]
pinPlainScalarContinuationLinesMayStartWithThreeDashes = "snakeyaml/1"
pinTheNonSpecificTagMakesAString = "snakeyaml/2"
pinTimestampsWithOutOfRangeFieldsAreRejected = "snakeyaml/3"
pinDatesBeforeTheGregorianCutoverAreProleptic = "snakeyaml/4"
pinSexagesimalIntegersDoNotOverflow = "snakeyaml/5"
pinIndentTenIsHonoured = "snakeyaml/6"
pinDoublesDumpAsYaml11Floats = "snakeyaml/7"
pinDumpAsRestoresTheFlowStyleAfterAnError = "snakeyaml/8"
pinNestingDepthCountsCollectionsOnly = "snakeyaml/9"
pinTheBoolTagRejectsOtherWords = "snakeyaml/10"
pinConstructorFailuresAreYamlExceptions = "snakeyaml/11"
pinStringsWithNextLineSurviveADump = "snakeyaml/12"
pinTagsOnTheWrongNodeKindAreYamlExceptions = "snakeyaml/13"
pinBlockScalarsUnderAnIndicatorIndentLoadBack = "snakeyaml/14"
pinQuestionMarksInsideFlowPlainScalarsAreContent = "snakeyaml/15"
pinDeeplyIndentedDoubleQuotedStringsSurviveADump = "snakeyaml/16"
