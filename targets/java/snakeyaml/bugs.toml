[[bug]]
id = "snakeyaml/21"
title = "A folded scalar starting with a space loses that space when its header is emitted past the width with splitLines"
kind = "roundtrip"
severity = "medium"
test = "pinFoldedScalarsKeepTheirLeadingSpace"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
notes = '''
`List.of(List.of(List.of(" a")))` dumped with `setIndent(4)`, `setWidth(10)`, `setSplitLines(true)`
and `setDefaultScalarStyle(FOLDED)` is

    -   -   - >4-
                a

- twelve spaces before the `a`, where the content indentation is 8 + 4 = 12 and the string's own
space would make thirteen - and both SnakeYAML and PyYAML load it as `[[["a"]]]`: the leading
space is gone. `Emitter.writeFolded` (emitter/Emitter.java:1593-1658) writes a run of spaces as one
chunk and, when the chunk is a single space, the column is past `bestWidth` and `split` is on
(`if (start + 1 == end && this.column > this.bestWidth && split)`, Emitter.java:1632), calls
`writeIndent()` instead of writing the space - a fold. At the head of the text the indent has just
been written for the first content line, so `writeIndent()` writes nothing and the space is
dropped; the same test in `writeDoubleQuoted` (Emitter.java:1404) carries the `start != 0` guard
that is missing here (and in `writePlain`, Emitter.java:1730, where a leading space cannot occur). With indent 2 the
header ends at column 9, under the width, and the space survives; `LITERAL` has no such branch;
one level up (`[[" a"]]`) the header stays under the width too. Found by
`dumpedValuesLoadBackAndPyYAMLReadsThem`.
'''

[[bug]]
id = "snakeyaml/22"
title = "A block scalar at the mapping's indentation after an explicit key without a value is taken as that key's value instead of being rejected"
kind = "wrong-result"
severity = "medium"
test = "pinBlockScalarsCannotFollowAnExplicitKeyAsItsValue"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
notes = '''
`load("? a\n>\n  x\n")` gives `{a="x\n"}`, `load("? a\n|\n  x\n")` the same, and
`load("? a\n>\n  x\nb: 1\n")` gives `{a="x\n", b=1}`. An explicit key with no `:` line has an empty
value (`"? a\n? b\n"` is `{a=null, b=null}` everywhere, as the spec wants), and a block scalar
cannot start a mapping entry, so the text is an error: pure-Python PyYAML and libyaml both reject
all three with `ParserError: while parsing a block mapping`. SnakeYAML itself rejects the same
block scalar after an implicit entry (`"a: 1\n>\n  x\n"` is a `ParserException` "while parsing a
block mapping", `"- a\n>\n  x\n"` one "while parsing a block collection"). The mechanism is in
`ParserImpl.ParseBlockMappingValue.produce()` (parser/ParserImpl.java:679-681): when no `ValueToken`
follows the key, a `ScalarToken` next is taken as the value - `else if
(scanner.checkToken(Token.ID.Scalar)) { states.push(new ParseBlockMappingKey()); return
parseBlockNodeOrIndentlessSequence(); }` - instead of the empty scalar the final branch produces;
PyYAML's `parse_block_mapping_value` has no such branch. Only a block scalar reaches it, since a
plain or quoted scalar at that position fails the scanner's simple-key check first (`"? a\nx\n"` and
`"? a\n\"x\"\n"` are `ScannerException`s here and in PyYAML). Found by `mutatedDocumentsLoadLikePyYAML`.
'''
