# Bugs found in SnakeYAML by the zoo's Hegel tests. Every entry has a `pin…` test in
# hegel/src/test/java/zoo/SnakeYamlPinsTest.java that asserts the documented (or YAML 1.1) behaviour and
# fails while the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "snakeyaml/1"
title = "A plain scalar's continuation line starting with `---x` is taken for a document marker and the document fails to parse"
kind = "crash"
severity = "medium"
test = "pinPlainScalarContinuationLinesMayStartWithThreeDashes"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`ScannerImpl.scanPlainSpaces` (scanner/ScannerImpl.java ~2141) ends a multi-line plain scalar when
a continuation line at column 0 starts with a document marker, written as
`if ("---".equals(prefix) || "...".equals(prefix) && Constant.NULL_BL_T_LINEBR.has(reader.peek(3)))`
— the "followed by white space or end" condition binds only to `...`. A line starting with `---x`
(or `----`) is therefore treated as a document start, the scalar ends, and the parser then fails on
the leftover: `load("a\n---x\nb\n")` throws `ParserException: expected '<document start>', but found
'<scalar>'`, while `"a\n...x\nb\n"` gives `a ...x b` as it should and PyYAML/libyaml give `a ---x b`
for both. The same happens in flow context (`[a\n----\n]`) and after a first document (`--- a\n---- b`).
`checkDocumentStart` (~1114) and the quoted-scalar check (~2014) have the parentheses right. Found
by `mutatedDocumentsLoadLikePyYAML`.
'''

[[bug]]
id = "snakeyaml/2"
title = "The non-specific tag `!` is ignored, so `! 123` is an Integer and `! ` (empty) is null instead of strings"
kind = "wrong-result"
severity = "low"
test = "pinTheNonSpecificTagMakesAString"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
YAML 1.1 (and 1.2) define the non-specific tag `!` on a scalar as "resolve to the string tag": `! 123`
is the string "123" and `! ` an empty string. `ScannerImpl.scanTag` (~1563, with the in-source TODO
"SnakeYAML incorrectly ignores c-ns-non-specific-tag right now") and `ParserImpl` treat a bare `!`
like no tag at all: the event's `ImplicitTuple` allows the plain resolution and the `Resolver` makes
`! 123` an `Integer` and `! : v` a mapping with a `null` key (PyYAML gives `{'': 'v'}`). Found by
`mutatedDocumentsLoadLikePyYAML`, whose mutations insert `! `.
'''

[[bug]]
id = "snakeyaml/3"
title = "Timestamps with out-of-range fields are silently normalised instead of rejected (2001-02-30 → March 2, month 13, hour 24, minute 60)"
kind = "wrong-result"
severity = "medium"
test = "pinTimestampsWithOutOfRangeFieldsAreRejected"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`SafeConstructor.ConstructYamlTimestamp` (constructor/SafeConstructor.java ~401-467) matches the
timestamp with a regex that only checks digit counts and then fills a `java.util.Calendar` with
`calendar.set(...)`. The calendar is lenient, so impossible dates and times roll over instead of
failing: `2001-02-30` → 2001-03-02, `2001-13-01` → 2002-01-01, `2001-12-14 24:00:00` → the 15th at
00:00, `2001-12-14 21:60:00` → 22:00. PyYAML raises `ValueError` ("day is out of range for month",
"minute must be in 0..59") for each. The timestamp tag documents the ISO 8601 subset; an invalid
field should be a `ConstructorException`, not a different date. Found by
`plainScalarsResolveLikePyYAML`.
'''

[[bug]]
id = "snakeyaml/4"
title = "Dates before 1582-10-15 are interpreted in the Julian calendar (1500-01-01 loads as 1500-01-10)"
kind = "wrong-result"
severity = "low"
test = "pinDatesBeforeTheGregorianCutoverAreProleptic"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The timestamp constructor uses `Calendar.getInstance(timeZone)` — a `GregorianCalendar` with the
default 1582-10-15 cutover — so year/month/day before the cutover are read as a Julian date:
`load("1500-01-01")` is the `Date` at `1500-01-10T00:00:00Z`, `0001-01-01` is `0000-12-30`, and
`1582-10-04` is `1582-10-14`. ISO 8601 (which the YAML timestamp type follows) is the proleptic
Gregorian calendar; PyYAML's `datetime` is proleptic too and gives 1500-01-01. Setting
`setGregorianChange(new Date(Long.MIN_VALUE))` on the calendar fixes it. Found by
`plainScalarsResolveLikePyYAML` (years 1..9999 are generated).
'''

[[bug]]
id = "snakeyaml/5"
title = "Sexagesimal integers overflow `int` silently: `100000000:0:0` is -777252864"
kind = "wrong-result"
severity = "medium"
test = "pinSexagesimalIntegersDoNotOverflow"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`SafeConstructor.ConstructYamlInt` (constructor/SafeConstructor.java ~283-288) evaluates a base-60
literal (`a:b:c`, YAML 1.1 `!!int`) with `int val` and `int bes` (`bes *= 60`), so any value beyond
2^31 wraps: `100000000:0:0` (= 360 000 000 000) loads as -777252864 and `190000000:0:0:0:0` as
759922688; PyYAML gives the exact values. Decimal, hex, octal and binary literals go through
`createNumber`, which picks Integer, Long or BigInteger by length — only the sexagesimal branch
computes in `int`. Found by `plainScalarsResolveLikePyYAML`.
'''

[[bug]]
id = "snakeyaml/6"
title = "DumperOptions.setIndent accepts 1 and 10 but the Emitter silently uses 2; with an indicator indent of 2 or more the dump does not parse"
kind = "wrong-result"
severity = "medium"
test = "pinIndentTenIsHonoured"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`DumperOptions.setIndent` (DumperOptions.java ~362-370) documents and enforces the range
`Emitter.MIN_INDENT` (1) to `Emitter.MAX_INDENT` (10), but the `Emitter` constructor
(emitter/Emitter.java ~241) copies the value only `if (indent > MIN_INDENT && indent < MAX_INDENT)`,
so 1 and 10 fall back to the default 2 without a word: a block dump with `setIndent(10)` is indented
by two spaces. `Yaml`'s constructor validates `indicatorIndent < indent` against the requested 10,
so `setIndent(10)` with `setIndicatorIndent(4)` passes, and the emitter then writes sequence
indicators four columns deeper than the two-space content: `dump(List.of(Map.of("a", 1)))` gives
text that neither SnakeYAML nor PyYAML can parse (`ParserException: expected '<document start>',
but found '<block mapping start>'`). Found by `dumpedValuesLoadBackAndPyYAMLReadsThem`.
'''

[[bug]]
id = "snakeyaml/7"
title = "Doubles with a positive exponent dump as `1.0E10`, which YAML 1.1 readers (PyYAML, libyaml) load as a string"
kind = "wrong-result"
severity = "medium"
test = "pinDoublesDumpAsYaml11Floats"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`SafeRepresenter.RepresentNumber` (representer/SafeRepresenter.java ~164) writes any non-integral
`Number` with `number.toString()`, i.e. Java's `Double.toString`: `1.0E10`, `1.0E21`, `-2.192E11`.
The YAML 1.1 float production requires a sign in the exponent (`[eE][-+][0-9]+`), so PyYAML and
libyaml resolve `1.0E10` as the string "1.0E10" (a negative exponent, `1.0E-5`, is fine). SnakeYAML
itself reads it back as a float only because its own `Resolver` accepts the unsigned form as an
extension. Emitting `1.0e+10` (as PyYAML does) is valid for every 1.1 and 1.2 reader. Found by
`dumpedValuesLoadBackAndPyYAMLReadsThem`.
'''

[[bug]]
id = "snakeyaml/8"
title = "Yaml.dumpAs leaves the overridden flow style behind when the dump throws"
kind = "contract"
severity = "low"
test = "pinDumpAsRestoresTheFlowStyleAfterAnError"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Yaml.dumpAs(data, rootTag, flowStyle)` (Yaml.java ~341-352) saves the representer's default flow
style, sets the requested one, dumps, and restores the old style — but not in a `finally`. When the
dump fails (for example `dumpAs("\uD800", Tag.STR, FlowStyle.FLOW)` → `YAMLException: invalid
string value has occurred` for a lone surrogate), the `Yaml` instance keeps `FLOW` for good: a later
`dump(map)` that used to produce block output now produces `{a: {b: "x\ny"}}`. `dumpAsMap` has the
same shape. Found while writing `dumpedValuesLoadBackAndPyYAMLReadsThem`.
'''

[[bug]]
id = "snakeyaml/9"
title = "nestingDepthLimit counts scalars as nesting levels, so `[[]]` is accepted and `[[1]]` rejected at limit 1"
kind = "contract"
severity = "low"
test = "pinNestingDepthCountsCollectionsOnly"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`LoaderOptions.setNestingDepthLimit` documents "max depth of nested collections … Aliases/Anchors
are not counted". `Composer.composeNode` (composer/Composer.java ~211) calls `increaseNestingDepth`
for every node including scalars, and the check (`~402-407`) is `nestingDepth > limit` *before* the
increment. With the limit 1: `[1]` loads, `[[]]` loads (two nested collections, no scalar to push
the count over), `[[1]]` throws `YAMLException: Nesting Depth exceeded max 1`, and `{a: [1]}` throws
too. The depth of `[[]]` and `[[1]]` is the same by any definition of "nested collections"; either
both must pass or both fail. Found by probing after the survey.
'''

[[bug]]
id = "snakeyaml/10"
title = "`!!bool` with a word that is not a boolean constructs null instead of failing"
kind = "wrong-result"
severity = "low"
test = "pinTheBoolTagRejectsOtherWords"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`SafeConstructor.ConstructYamlBool` (constructor/SafeConstructor.java ~243-249) returns
`BOOL_VALUES.get(val.toLowerCase())`, a map lookup over yes/no/true/false/on/off, so an explicitly
tagged `!!bool maybe` (or `!!bool 1`) silently becomes `null` where PyYAML raises. Every other
scalar constructor (`!!int abc`, `!!float abc`, `!!timestamp abc`) throws. `toLowerCase()` without a
locale also misreads `TRUE` under the Turkish default locale. Found by probing after the survey.
'''

[[bug]]
id = "snakeyaml/11"
title = "`!!int abc`, `!!float abc` and `!!binary '***'` throw NumberFormatException / IllegalArgumentException instead of a YAMLException"
kind = "contract"
severity = "low"
test = "pinConstructorFailuresAreYamlExceptions"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`ConstructYamlInt`/`ConstructYamlFloat` (constructor/SafeConstructor.java ~252-295, ~347-383) pass
the cleaned text to `Integer.valueOf`/`Long.valueOf`/`new BigInteger`/`Double.valueOf`, and
`ConstructYamlBinary` (~385-394) to the strict `Base64.getDecoder()`. A value that does not parse
escapes as `java.lang.NumberFormatException: For input string: "abc"` or
`IllegalArgumentException: Illegal base64 character 2a` — not `ConstructorException` with the
problem mark that `ConstructYamlTimestamp` throws ("Unexpected timestamp") and that PyYAML gives for
every constructor. `LoaderOptions.wrappedToRootException` (false by default) is the only way to
get a `YAMLException`. Found by `mutatedDocumentsLoadLikePyYAML` (mutations insert `!!int `).
'''

[[bug]]
id = "snakeyaml/12"
title = "A string containing U+0085 (NEL) dumped as a block scalar loads back with `\\n` in its place"
kind = "wrong-result"
severity = "low"
test = "pinStringsWithNextLineSurviveADump"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`SafeRepresenter.RepresentString` switches a plain-style string to `LITERAL` when it matches
`MULTILINE_PATTERN` = `\n|| | `, and `Emitter.analyzeScalar`/`writeLiteral` treat
`` as a line break (`Constant.LINEBR`) and write it verbatim as the break. The scanner then
normalises every line break (`\r`, `\r\n`, ``) to `\n` (`scanLineBreak`, ScannerImpl ~2342),
so `yaml.load(yaml.dump("ab"))` is `"a\nb"`: the dump→load round trip changes the string.
` `/` ` are kept by the scanner and do survive; in double-quoted style NEL is escaped as
`\N` and survives too — a string containing NEL needs a quoted style. PyYAML has the same flaw
(its emitter writes the raw NEL in literal blocks). Found by `dumpedValuesLoadBackAndPyYAMLReadsThem`.

The same code has another face (2026-09-23, found by the rewritten test's long runs): a string
*ending* with NEL, U+2028 or U+2029, dumped as a block scalar, ends the dump with the raw break
instead of the configured line break. `dump("\u2028")` is `|2+`, a line break and the U+2028 with
nothing after it (the text does not end with `DumperOptions.getLineBreak()`); `dump("a\u0085")` is
`|`, a line break, `  a` and the NEL; `dumpAll(["a\u2028", 1])` glues the next entry onto the same
physical line: `- |`, break, `  a`, U+2028, `- 1`. `Emitter.writeLiteral` (Emitter.java:1677-1696)
writes every `Constant.LINEBR` character verbatim through `writeLineBreak(String.valueOf(br))` and,
the text ending in such a break, never reaches the `writeLineBreak(null)` it owes. U+2028/U+2029 are
kept by the scanner, so those strings still load back; only the NEL case changes the value.
'''

[[bug]]
id = "snakeyaml/13"
title = "A standard tag on the wrong node kind (`!!int {a: 1}`, `!!map [1]`, `!!str [1]`) throws ClassCastException"
kind = "crash"
severity = "low"
test = "pinTagsOnTheWrongNodeKindAreYamlExceptions"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The scalar constructors in `SafeConstructor` (`constructScalar((ScalarNode) node)` in
ConstructYamlInt/Float/Bool/Str/Binary/Timestamp) and the collection ones (`(SequenceNode) node`,
`(MappingNode) node` in ConstructYamlSeq/Map/Set) cast the node to the kind their tag implies. An
explicit tag on another kind — `!!int {a: 1}`, `!!seq {a: 1}`, `!!map [1]`, `!!set [1]`,
`!!str [1]`, `!!binary [1]` — therefore fails with `java.lang.ClassCastException: class
org.yaml.snakeyaml.nodes.MappingNode cannot be cast to class …ScalarNode` instead of a
`ConstructorException` ("expected a scalar node, but found mapping", as PyYAML says). Only
`!!omap {a: 1}` checks the kind. Found by `mutatedDocumentsLoadLikePyYAML`.
'''

[[bug]]
id = "snakeyaml/14"
title = "With indicatorIndent > 0, block scalars in sequences that need an indentation indicator are written with the wrong one and do not parse back"
kind = "wrong-result"
severity = "medium"
test = "pinBlockScalarsUnderAnIndicatorIndentLoadBack"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
A block scalar whose first line is empty or starts with a space needs an explicit indentation
indicator (`|2-`), which `Emitter.determineBlockHints` computes from `bestIndent`. With
`DumperOptions.setIndicatorIndent(1)` the emitter writes a sequence entry as ` - |2-` (the dash one
column in) but the content at column 2 — one column deeper than the dash, not the two the indicator
promises — and `load` of the dump fails with `ParserException: while parsing a block collection`:
`dump(List.of("\nx"))` gives ` - |2-\n\n  x\n`, `dump(List.of(" x\ny"))` gives ` - |2-\n   x\n  y\n`.
With `indicatorIndent(0)` the same values round-trip, and inside a mapping (`k: |2-`) they are
fine; `indentWithIndicator(true)` avoids it too. Found by `dumpedValuesLoadBackAndPyYAMLReadsThem`.
'''

[[bug]]
id = "snakeyaml/15"
title = "A question mark inside a plain scalar in flow context ends the scalar"
kind = "crash"
severity = "low"
test = "pinQuestionMarksInsideFlowPlainScalarsAreContent"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`load("[b?c]")` throws `ParserException: while parsing a flow sequence ... expected ',' or ']', but
got '?'` and `load("{a: b?c}")` fails the same way, while `load("b?c")` in block context gives the
string "b?c". YAML 1.1 (and 1.2) make `?` an indicator only where it starts a node and is followed
by white space; inside a plain scalar it is content, in flow context as much as in block context.
`ScannerImpl.scanPlain` stops a flow-context plain scalar at any of `,?[]{}` — the `?` is a
PyYAML-ism the Java port inherited (pure-Python PyYAML fails identically), which libyaml, and so
PyYAML's `CSafeLoader`, do not share: both give ["b?c"]. Found by `mutatedDocumentsLoadLikePyYAML`.
'''

[[bug]]
id = "snakeyaml/16"
title = "Double-quoted scalars indented past the width gain a backslash when dumped"
kind = "wrong-result"
severity = "medium"
test = "pinDeeplyIndentedDoubleQuotedStringsSurviveADump"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
With `DumperOptions.setWidth(10)` and `setIndent(4)`, `dump({a: {b: {c: "x \n y"}}})` (block style)
emits the innermost value as

    c: "x\
            \ \n\
            \\
            \ y"

and loading that back — with SnakeYAML or with libyaml — gives `x \n\  y`: the `\\` at the end of
the third line is an escaped backslash, not a continuation. The trigger is a double-quoted scalar
containing an escape sequence followed by a space, emitted at an indentation column that is already
past the width; `setIndicatorIndent(8)` with `setIndentWithIndicator(true)` at width 10 does it too.
In `Emitter.writeDoubleQuoted` writing an escape sets `start = end + 1`, so the split test
`start >= end` fires as soon as the column is past `bestWidth`: the emitter writes a `\` continuation,
breaks, and — the next character being a space — writes a `\` meant to escape it; on the next
iteration `start == end` still holds and, the indentation alone exceeding the width, it splits again,
writing another `\` right after the first. The constructor only guards `width > bestIndent * 2`,
which ignores nesting and the indicator indent. Pure-Python PyYAML has the same code path and the
same result (`yaml.dump(v, width=10, indent=4)` with `SafeDumper` loads back wrong); libyaml's
emitter does not. Found by `eventsAndNodesSurviveEmitting` and `dumpedValuesLoadBackAndPyYAMLReadsThem`.
'''

[[bug]]
id = "snakeyaml/17"
title = "A string starting with U+FEFF is dumped as a plain scalar (allowUnicode) and the scanner strips it as a byte order mark, so the round trip loses it"
kind = "roundtrip"
severity = "medium"
test = "pinStringsStartingWithABomSurviveADump"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
notes = '''
With the default `allowUnicode = true`, `dump("\ufeff")` is the character U+FEFF followed by a line
break - a plain scalar. `loadAll` of that text yields no document at all and `load` gives null;
`dump("\ufeffx")` loads back as "x"; a map with the key "\ufeff" after another key dumps the raw
character at the start of its second line. Both sides are at fault. `Emitter.analyzeScalar`
(emitter/Emitter.java:1215) counts U+FEFF among the Unicode characters that may be written raw
(`c >= 0xE000 && c <= 0xFFFD`), where PyYAML's `analyze_scalar` excludes `\uFEFF` and so quotes
the string (its dump is `"\uFEFF"`); `writeDoubleQuoted` (Emitter.java:1463) does escape it, but
only once a quoted style has been chosen. YAML 1.2 section 5.2 forbids a byte order mark inside a
document (`nb-char` excludes `c-byte-order-mark`), and `ScannerImpl.scanToNextToken`
(scanner/ScannerImpl.java:1219) strips a U+FEFF at index 0 as the stream's BOM - right for input,
fatal for this output. libyaml goes further and skips a BOM at column 0 of any line, so the map
above is a `ParserError` there. With `setAllowUnicode(false)`, or inside a collection, the string
round-trips. Found by `dumpedValuesLoadBackAndPyYAMLReadsThem`.
'''

[[bug]]
id = "snakeyaml/18"
title = "Directives with no document after them (`%YAML 1.1` and then the end of the stream) load as an empty stream instead of failing"
kind = "wrong-result"
severity = "low"
test = "pinDirectivesNeedADocument"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
notes = '''
`loadAll("%YAML 1.1\n")` and `loadAll("%TAG ! tag:x,2000:\n")` yield no documents and no exception,
and `load` of either gives null; an unknown directive (`%FOO\n`) is the same. YAML 1.2 section 9.1.3
(`l-directive-document ::= l-directive+ l-explicit-document`; 1.1 says the same) requires an
explicit `---` after directives. PyYAML raises `ParserError: expected '<document start>', but found
'<stream end>'`, libyaml `did not find expected <document start>`. In `ParserImpl.ParseDocumentStart`
(parser/ParserImpl.java:237-251) `processDirectives()` consumes the directive tokens, and the
`if (!scanner.checkToken(Token.ID.StreamEnd))` that follows takes the stream end as the end of the
stream rather than as the missing document, so the "expected '<document start>'" branch inside it is
never reached: the directives vanish silently, with whatever they were meant to apply to. Found by
`mutatedDocumentsLoadLikePyYAML`.
'''

[[bug]]
id = "snakeyaml/19"
title = "A tab followed by a space inside a flow collection (`[<TAB> ]`) is a ScannerException, while `[ <TAB>]` and `[<TAB>]` are read"
kind = "wrong-result"
severity = "medium"
test = "pinTabsBeforeSpacesSeparateInFlowContext"
found = { commit = "7b8b171c0dbfa8af665c24a63d91f2b185b8701b", version = "2.8-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
notes = '''
`load("[\t ]")` and `load("[\t a]")` throw `ScannerException: while scanning for the next token
found character ' ' that cannot start any token`; `load("[ \t]")`, `load("[\t]")`, `load("[a\tb]")`
and `load("{\t}")` are read. YAML 1.2 `s-separate-in-line ::= s-white+` - spaces and tabs in any
order - and 1.1 likewise allow tabs as separation in flow context, and libyaml reads all of these
(pure-Python PyYAML rejects every tab in flow context, so libyaml and the spec are the reference).
`ScannerImpl.scanToNextToken` (scanner/ScannerImpl.java:1231-1236) skips spaces first and then, in
flow context, tabs - two loops in that order with no return to the first - so a space after a tab
is left standing where the next token is expected. Found by `mutatedDocumentsLoadLikePyYAML`.
'''

