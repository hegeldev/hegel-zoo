name = "commons-math"
language = "java"
upstream = "https://github.com/apache/commons-math"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-19"  # ASF Generative Tooling Guidance (disclosure on PRs); README.md, CONTRIBUTING.md, .github/: no prohibition

[base]
commit = "7bc81e97e91d3a988e4e569e31b77909af884be1"
date = "2026-08-31"
version = "4.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install the modules the tests use (commons-math4-legacy with its core and exception
# modules, commons-math4-transform) into the local Maven repository at the version the reactor pom
# declares (hegel/pom.xml depends on that version: update `commons-math.version` there when a bump
# changes it). The docs, examples and neural-net modules are left out; tests, javadoc, sources and
# the release checks are skipped.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Drat.skip=true -Dpmd.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true -Djapicmp.skip=true -Dcyclonedx.skip=true -Danimal.sniffer.skip=true -Dspotless.check.skip=true -Drevapi.skip=true -pl commons-math-legacy,commons-math-transform -am install",
]

[expected_failures]
pinEigenDeterminantIncludesComplexEigenvalues = "commons-math/1"
pinRrqrRankOfZeroMatrixIsZero = "commons-math/2"
pinSecantSolverDoesNotReportAFalseRoot = "commons-math/3"
