result = "reproduces"
[[bug]]
id = "commons-math/2"
title = "RRQRDecomposition.getRank reports rank 1 for the zero matrix"
kind = "wrong-result"
severity = "low"
test = "pinRrqrRankOfZeroMatrixIsZero"
found = { commit = "7bc81e97e91d3a988e4e569e31b77909af884be1", version = "4.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
getRank(dropThreshold) is documented to return "the effective numerical matrix rank": the number of
leading diagonal entries of R whose ratio to the first is above the threshold. The loop starts at
rank = 1 and inspects the ratios r[i][i] / r[0][0] for i >= 1 (RRQRDecomposition.java lines
165-181), so it never checks whether r[0][0] itself is zero. For the zero matrix (any shape) it
returns 1, where SingularValueDecomposition.getRank returns 0 and the solver reports the matrix as
singular. new RRQRDecomposition(new Array2DRowRealMatrix(new double[2][2])).getRank(1e-10) == 1.
Found by comparing the rank with the exact rational rank over random sparse integer matrices.
'''

