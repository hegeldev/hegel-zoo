# Bugs found in Apache Commons Math (4.0-SNAPSHOT, the legacy and transform modules) by the Hegel
# zoo. One [[bug]] per finding; `test` names the JUnit pin in hegel/src/test/java/zoo/PinsTest.java
# that fails while the bug exists (listed under [expected_failures] in target.toml). Oracles: exact
# rational (BigInteger) linear algebra, exact integer polynomial arithmetic, exact rational
# statistics, and the O(n^2) definitions of the transforms. Upstream follows the ASF Generative
# Tooling Guidance (disclosure on contributions); no prohibition (README.md, CONTRIBUTING.md,
# .github/ checked 2026-09-19).

[[bug]]
id = "commons-math/1"
title = "EigenDecomposition.getDeterminant ignores the imaginary parts of complex eigenvalues"
kind = "wrong-result"
severity = "medium"
test = "pinEigenDeterminantIncludesComplexEigenvalues"
found = { commit = "7bc81e97e91d3a988e4e569e31b77909af884be1", version = "4.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
EigenDecomposition documents itself as supporting "general real matrices", with complex eigenvalues
returned as (getRealEigenvalues, getImagEigenvalues) pairs, and getDeterminant as "Computes the
determinant of the matrix". The implementation multiplies realEigenvalues[i] only
(EigenDecomposition.java lines 323-329), so for any real matrix with a complex eigenvalue pair
a +- bi the factor contributed is a^2 instead of a^2 + b^2. new EigenDecomposition(
new Array2DRowRealMatrix(new double[][] {{-5, 5}, {-7, -1}})).getDeterminant() is 9 (the
eigenvalues are -3 +- i sqrt(31)); the determinant is 40, as LUDecomposition.getDeterminant
reports. Found by comparing getDeterminant with the exact rational determinant over random small
integer matrices; the property gates the comparison on hasComplexEigenvalues().
'''

