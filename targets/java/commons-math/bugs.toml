result = "reproduces"
[[bug]]
id = "commons-math/3"
title = "SecantSolver reports a point where f is -362 as a root when two iterates happen to be close"
kind = "wrong-result"
severity = "low"
test = "pinSecantSolverDoesNotReportAFalseRoot"
found = { commit = "7bc81e97e91d3a988e4e569e31b77909af884be1", version = "4.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
SecantSolver.doSolve (lines 102-134) stops when |x1 - x0| < max(rtol |x1|, atol), whatever the
function value at x1 is (the function-value test |f1| <= ftol is only an early exit). The class
warns that "convergence is not guaranteed", but that covers not converging (TooManyEvaluations),
not a wrong answer returned as a success: solve() is documented to return "a value where the
function is zero". For p(x) = 2 (x-1)(x-2)(x-6)(x-10) with new SecantSolver(1e-6) over [8, 12.5]
the iteration jumps out to the right and back into a near two-cycle at 8.70509546392202; two
successive iterates land within 1e-6 of each other there and the solver returns 8.705 with
p = -361.9, no exception. With accuracies 1e-9 or 1e-12, or from [8.25, 13.5], the same solver
finds 10. Found by running the open methods from a bracket of a random integer-rooted polynomial
and checking that the answer is near some root or has a small function value.
'''

