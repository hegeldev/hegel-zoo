name = "commons-text"
language = "java"
upstream = "https://github.com/apache/commons-text"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-16"  # ASF Generative Tooling Guidance (disclosure on PRs); README, CONTRIBUTING.md, PR template: no prohibition

[base]
commit = "00be782c2bb48fdc68ad59eda45eed7623758d74"
date = "2026-09-19"
version = "1.15.1-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install the library into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on that version — update `commons-text.version` there when a bump changes
# it). Tests, javadoc, sources and the release checks (rat, pmd, spotbugs, checkstyle, japicmp,
# cyclonedx, enforcer, animal-sniffer) are skipped. Needs Maven >= 3.9 (the rat plugin refuses 3.8).
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Drat.skip=true -Dpmd.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true -Djapicmp.skip=true -Dcyclonedx.skip=true -Danimal.sniffer.skip=true -Dspotless.check.skip=true install",
]

[expected_failures]
pinCosineDistanceRejectsBlankText = "commons-text/1"
pinReplacementsFinderDropsTheTrailingReplacement = "commons-text/2"
pinJaroWinklerOfEqualEmptyBuildersIsOne = "commons-text/3"
pinEqualsIgnoreCaseNullIsFalse = "commons-text/4"
pinIndexOfEmptyStringIsFound = "commons-text/5"
pinGenerateRefusesAnUnsatisfiableRange = "commons-text/6"
pinSubstitutorReaderNeverReadsZeroChars = "commons-text/7"
pinDetailedLevenshteinDistanceIsTheLevenshteinDistance = "commons-text/8"
pinToPatternKeepsCustomFormatsAfterALiteralBrace = "commons-text/9"
pinSubstitutorReaderAgreesWithReplaceWhenPrefixEqualsSuffix = "commons-text/10"
pinLastIndexOfFindsAMatchAtTheStartIndex = "commons-text/11"
pinRoundingAHalfAwayDoesNotThrow = "commons-text/12"
pinSubstitutorReaderAcceptsATrailingEscapeChar = "commons-text/13"
pinValueEndingInDollarDoesNotEscapeTheNextVariable = "commons-text/14"
