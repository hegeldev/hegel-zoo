'''

[[bug]]
id = "commons-text/5"
title = "TextStringBuilder.indexOf(\"\") is -1 on an empty builder and indexOf(\"\", size) is -1, while lastIndexOf(\"\") finds the empty string at size (as String does)"
kind = "wrong-result"
severity = "low"
test = "pinIndexOfEmptyStringIsFound"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`indexOf(String, int)` returns -1 whenever `startIndex >= size`, before it looks at the needle, so
`new TextStringBuilder().indexOf("")` is -1 and `new TextStringBuilder("ab").indexOf("", 2)` is
-1, and `contains("")` is false on an empty builder; `lastIndexOf("")` on the same builders is 0
and 2, `indexOf("")` on a non-empty builder is 0, and `String.indexOf("", 2)` on `"ab"` is 2. The
Javadoc promises "the first index of the string, or -1 if not found" — the empty string is found
everywhere. The `textStringBuilderTracksStringBuilder` property models `String`'s answers and
leaves the empty needle to the pin `pinIndexOfEmptyStringIsFound`.
'''

[[bug]]
id = "commons-text/6"
title = "RandomStringGenerator.generate never returns when no code point of the configuration is acceptable (a surrogate range, a predicate no character of the range satisfies, a selection of surrogates)"
kind = "hang"
severity = "low"
test = "pinGenerateRefusesAnUnsatisfiableRange"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`generate(int)` draws code points and rejects surrogates, private-use and unassigned ones and those
matching none of the `filteredBy` predicates, retrying until `length` characters are collected.
When nothing in the configured range can be accepted the loop never ends:
`RandomStringGenerator.builder().withinRange(0xD800, 0xDFFF).get().generate(1)`,
`builder().withinRange('a', 'z').filteredBy(CharacterPredicates.DIGITS).get().generate(1)` and
`builder().selectFrom('\uD83D').get().generate(2)` all spin forever. The builder validates the
range bounds but not that the combination admits a character; an `IllegalArgumentException` at
build or generate time would be the fitting outcome. The property
`randomStringGeneratorHonoursItsBounds` skips unsatisfiable configurations; the pin
`pinGenerateRefusesAnUnsatisfiableRange` runs one in a daemon thread and fails if it is still
running after three seconds.
'''

[[bug]]
id = "commons-text/7"
title = "StringSubstitutorReader.read(char[], int, int) returns 0 for a positive length when a variable resolves to the empty string, which Reader forbids"
kind = "contract"
severity = "medium"
test = "pinSubstitutorReaderNeverReadsZeroChars"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Reader.read(char[], int, int)` "will block until some input is available, an I/O error occurs, or
the end of the stream is reached" and returns the number of characters read or -1; 0 is only
allowed when `len` is 0. With `new StringSubstitutor(Map.of("b", ""))` and the source `${b}z`, the
first `read(buf, 0, 8)` returns 0 (the substituted variable produced nothing to drain and the
reader returns before reading on); the `z` comes from the next call. Every position where a
variable expands to "" produces such a zero-length read (`z${b}` returns 0 on the second read,
`ab${b}cd${a}` after `ab`). Callers that treat 0 as "nothing more" (or as an error, as some
`Reader` wrappers do) lose the rest of the text. `read()` is unaffected: it loops internally
until it has one character. The property `stringSubstitutorFollowsTheDocumentedSyntax` drains the
reader tolerating zero-length reads and checks the final text; the pin
`pinSubstitutorReaderNeverReadsZeroChars` carries `${b}z`.
'''

[[bug]]
id = "commons-text/8"
title = "LevenshteinDetailedDistance.apply reports a distance above the Levenshtein distance (4 for \"abba\" -> \"baab\", distance 3): the result is the length of a backtrack through the DP matrix that ignores the operation costs"
kind = "wrong-result"
severity = "medium"
test = "pinDetailedLevenshteinDistanceIsTheLevenshteinDistance"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The class Javadoc: "the number of changes needed to change one sequence into another, where each
change is a single character modification (deletion, insertion or substitution)", and `apply`
returns the "result object containing the count of insert, delete and substitute and total count
needed". `LevenshteinDistance.getDefaultInstance().apply("abba", "baab")` is 3 (delete the first
`a`, substitute, insert an `a`), but `LevenshteinDetailedDistance.getDefaultInstance().apply("abba",
"baab")` is `Distance: 4, Insert: 0, Delete: 0, Substitute: 4`; the same for `"abbaaa" ->
"baabaa"` and `"cbb1abbaaa" -> "cbb1baabaa"` (the property's find), and for the threshold form
with a threshold of 5 or 10. `unlimitedCompare`/`limitedCompare` fill the standard matrix, but
`findDetailedResults` then walks back from the corner choosing the neighbour with the smallest value
(diagonal preferred) without checking that the value was reached from that neighbour with the
implied cost, and returns `addCount + delCount + subCount` — the length of that walk — as the
distance instead of the matrix's corner value. So the reported distance can exceed the true one
and the breakdown is not a minimal edit script. The property
`similarityScoresAndDiffsMatchTheTextbookDefinitions` checks only that the detailed distance is at
least the Levenshtein distance and that the counts are consistent; the pin
`pinDetailedLevenshteinDistanceIsTheLevenshteinDistance` carries `("abba", "baab")`.
'''

[[bug]]
id = "commons-text/9"
title = "ExtendedMessageFormat.toPattern() drops every custom format description after a literal '}' in the pattern (\"}{0,upper}\" -> \"}{0}\"), so the pattern no longer formats like the original"
kind = "wrong-result"
severity = "low"
test = "pinToPatternKeepsCustomFormatsAfterALiteralBrace"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`toPattern()` is built by `insertFormats(super.toPattern(), foundDescriptions)`, which rescans the
pattern `MessageFormat` reports (a literal `}` comes back unquoted: `new MessageFormat("'}'{0}")
.toPattern()` is `}{0}`) and tracks the brace `depth`; an unquoted `}` outside any element runs
`depth--`, so from then on every `{n` opens at depth 0 rather than 1 and the custom description is
never inserted. With a registry providing `upper`, `new ExtendedMessageFormat("}{0,upper}", Locale.US,
registry)` formats `"x"` as `}X` but `toPattern()` is `}{0}`, and `new ExtendedMessageFormat(
toPattern(), ...)` formats it as `}x`; the same for `"'}'{0,upper}"`, `"ac}{0,upper}"` and
`"{0,upper}'}'{1,upper}"` (`{0,upper}}{1}` — the element before the brace survives). A literal `}`
is legal in a `MessageFormat` pattern, so the documented round trip through `toPattern()` is broken
for such patterns. The property `formattableUtilsAndExtendedMessageFormatKeepTheirShape` leaves
patterns with a quoted `}` and a custom format to the pin
`pinToPatternKeepsCustomFormatsAfterALiteralBrace`.
'''

[[bug]]
id = "commons-text/10"
title = "StringSubstitutorReader and StringSubstitutor.replace substitute the same text differently when the prefix equals the suffix (\"$%a%%b%\" with %-delimiters: \"%a%%b%\" from replace, \"%a%Y\" from the reader)"
kind = "differential"
severity = "low"
test = "pinSubstitutorReaderAgreesWithReplaceWhenPrefixEqualsSuffix"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`StringSubstitutorReader` "performs string substitution on a source Reader using a
StringSubstitutor" — the streamed text is meant to be what `replace` produces. With
`new StringSubstitutor(Map.of("a", "X", "b", "Y"), "%", "%")` (the `%name%` style, a supported
configuration: the constructor accepts equal prefix and suffix) and the text `$%a%%b%`,
`replace` gives `%a%%b%` (the escape makes `%a%` literal and the scan continues after it, so the
remaining `%b%`'s delimiters pair with what precedes them and nothing else is substituted) while
draining the reader gives `%a%Y`: the reader, working on the buffer it has read so far, resolves
the escape first and then substitutes `%b%`. Without the escape both agree (`%a%%b%` -> `XY`,
`%c%%a%` -> `%c%X`), and with the default `${`/`}` delimiters `$${a}${b}` agrees too. The
property `stringSubstitutorFollowsTheDocumentedSyntax` compares the reader only for distinct
delimiters; the pin `pinSubstitutorReaderAgreesWithReplaceWhenPrefixEqualsSuffix` carries the
example.
'''

[[bug]]
id = "commons-text/11"
title = "TextStringBuilder.lastIndexOf(String, startIndex) misses a match of two or more characters that begins at startIndex: \"abab\".lastIndexOf(\"ab\", 2) is 0 (String: 2), \"aab\".lastIndexOf(\"aa\", 0) is -1"
kind = "wrong-result"
severity = "low"
test = "pinLastIndexOfFindsAMatchAtTheStartIndex"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc: "@param startIndex The index to start at, invalid index rounded to edge. @return The
last index of the string, or -1 if not found" — the same contract as `String.lastIndexOf(String,
int)`, where the match may begin at `startIndex`. For a needle of two or more characters the
backwards loop starts at `startIndex - strLen + 1`, so a match that begins at `startIndex` (and
therefore extends past it) is never tried: `new TextStringBuilder("abab").lastIndexOf("ab", 2)` is
0 where `"abab".lastIndexOf("ab", 2)` is 2, `new TextStringBuilder("aab").lastIndexOf("aa", 0)` is
-1, `new TextStringBuilder("ab").lastIndexOf("ab", 0)` is -1. The one-character overload
`lastIndexOf(char, int)` and `lastIndexOf(String)` without a start index are right, so the
class disagrees with itself: `lastIndexOf("a", 0)` on `"aab"` is 0 but `lastIndexOf("aa", 0)` is
-1. The property `textStringBuilderTracksStringBuilder` leaves out the case where `String`'s answer
is the start index itself; the pin `pinLastIndexOfFindsAMatchAtTheStartIndex` carries it.
'''

[[bug]]
id = "commons-text/12"
title = "DoubleFormat with minDecimalExponent throws ArrayIndexOutOfBoundsException for a value that is a single digit 5 rounded at the position just above it (minDecimalExponent(0) of 0.5, (1) of 5.0, (-1) of 0.05, (2) of 50.0), for all four format types"
kind = "crash"
severity = "medium"
test = "pinRoundingAHalfAwayDoesNotThrow"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`DoubleFormat.PLAIN.builder().minDecimalExponent(0).get().apply(0.5)` (round to a whole number)
throws `java.lang.ArrayIndexOutOfBoundsException: Index -1 out of bounds for length 2` from
`ParsedDecimal.shouldRoundUp`, and so do SCIENTIFIC, ENGINEERING and MIXED, and `5.0` with
`minDecimalExponent(1)`, `0.05` with `-1`, `50.0` with `2`, `500.0` with `3`, `-0.5` with `0`.
`ParsedDecimal.round(roundExponent)` handles the case "rounding directly on the max decimal place"
with `shouldRoundUp(0)`; that method reads `digits[count]` (5) and, since there are no further
digits, decides the half-even tie with `digits[count - 1] % 2` — `digits[-1]`. Values with more
digits (`0.51`, `1.5`, `0.25`) and `maxPrecision` (never called with 0) are fine. The documented
result is the half-even rounding, `0.0` for `0.5` (the tie goes to the even digit 0; `1.5` with
`minDecimalExponent(1)` gives `0.0` already). The property `doubleFormatRoundTripsAndRoundsHalfEven`
skips a lone digit 5 rounded at the position above it; the pin `pinRoundingAHalfAwayDoesNotThrow`
carries `0.5` and `5.0`.
'''

[[bug]]
id = "commons-text/13"
title = "StringSubstitutorReader.read throws StringIndexOutOfBoundsException when the prefix is a single character and the text ends with the escape character (text \"$\" with prefix \"<\")"
kind = "crash"
severity = "low"
test = "pinSubstitutorReaderAcceptsATrailingEscapeChar"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
With `new StringSubstitutor(map, "<", ">")`, reading `new StringSubstitutorReader(new
StringReader("$"), sub)` — or any text ending in `$`, such as `<x1>$<b>$` once the reader reaches
the final `$` — throws `StringIndexOutOfBoundsException: String index out of range: 1` from
`TextStringBuilder.charAt` via `AbstractStringMatcher$CharMatcher.isMatch`. `read` buffers
`prefixEscapeMatcher.size()` (2) characters to test for an escaped prefix; at the end of the input
only the `$` arrives, and `isBufferMatchAt(prefixEscapeMatcher, 0)` runs the `$` + `<` matcher over
a one-character buffer: the single-character `CharMatcher` indexes `buffer.charAt(1)` without a
bounds check (the multi-character `CharArrayMatcher` used for `${` checks the length first, so the
default delimiters are fine: `"$"` reads back as `$`). `replace("$")` returns `$`. The property
`stringSubstitutorFollowsTheDocumentedSyntax` skips the reader for a one-character prefix when the
text ends with `$`; the pin `pinSubstitutorReaderAcceptsATrailingEscapeChar` carries `"$"`.
'''

[[bug]]
id = "commons-text/14"
title = "A variable value (or default) ending in the escape character escapes the variable that follows it in the template: replace(\"${a}${b}\") with a = \"x$\", b = \"y\" is \"x${b}\" instead of \"x$y\""
kind = "wrong-result"
severity = "medium"
test = "pinValueEndingInDollarDoesNotEscapeTheNextVariable"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The escape is a feature of the template ("`$${` ... the escape character ... to output the
prefix literally"); a variable's value is data. `substitute` replaces `${a}` in the buffer by its
value and continues scanning from the end of the value, and the prefix check `chars[pos - 1] ==
escape` then sees the value's last character: with `a = "x$"`, `b = "y"`, `new
StringSubstitutor(vars).replace("${a}${b}")` is `x${b}` — the `$` of the value is deleted as an
escape and `${b}` is left unsubstituted — instead of `x$y`; `${a} ${b}` is `x$ y` as expected.
The same with `setDisableSubstitutionInValues(true)` (the value is not a template, yet its last
character still acts on the template), with a default value (`${z:-x$}${b}` is `x${b}`), through
a nested value (`c = "${a}"`: `${c}${b}` is `x${b}`), and with `setPreserveEscapes(true)`
(`x$${b}`: the value's `$` is kept and `${b}` still not substituted). A value produced by a
lookup (a path, a shell variable, a price) that happens to end in `$` silently swallows the next
variable. The property `stringSubstitutorFollowsTheDocumentedSyntax` skips a case where a
substituted value ending in `$` is directly followed by the prefix; the pin
`pinValueEndingInDollarDoesNotEscapeTheNextVariable` carries `${a}${b}`, the disabled-substitution
variant and `${z:-x$}${b}`.
'''
