[[bug]]
id = "commons-text/1"
title = "CosineDistance.apply throws IllegalArgumentException(\"Invalid text\") for a blank argument instead of returning a distance"
kind = "crash"
severity = "low"
test = "pinCosineDistanceRejectsBlankText"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`new CosineDistance().apply("", "")` and `apply("abc", " ")` throw `IllegalArgumentException:
Invalid text` from the package-private `RegexTokenizer.apply`, which `Validate`s that its input is
not blank. `CosineDistance` implements `EditDistance<Double>` like the other metrics
(`LevenshteinDistance`, `JaccardDistance`, `LongestCommonSubsequenceDistance`, ...), all of which
accept empty strings; its Javadoc documents no exception and no restriction on the input. A
distance of 1.0 (no common terms) — or 0.0 for two blank strings — would follow the class's own
rule for texts without word characters (`apply("!!", "!!")` is 1.0). The property
`similarityScoresAndDiffsMatchTheTextbookDefinitions` skips blank inputs for this metric; the pin
`pinCosineDistanceRejectsBlankText` carries it.
'''

[[bug]]
id = "commons-text/2"
title = "ReplacementsFinder never reports a replacement at the end of the sequences: the handler is only called from a keep command, so trailing insert/delete commands are dropped"
kind = "wrong-result"
severity = "medium"
test = "pinReplacementsFinderDropsTheTrailingReplacement"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The class Javadoc: "The first sequence can be transformed into the second one by replacing each
synchronized sub-sequence of the first sequence by the corresponding sub-sequence of the second
sequence ... calls a user-supplied handler implementing the ReplacementsHandler interface to
process the sub-sequences." `ReplacementsFinder` collects pending insertions and deletions and
hands them to `handleReplacement` only in `visitKeepCommand`; there is no end-of-script flush. So
for `new StringsComparator("ab", "ac").getScript().visit(new ReplacementsFinder<>(handler))` the
handler is never called — the replacement `b -> c` is lost — while `("ab", "cb")` reports
`0:[a]->[c]` as expected. Any pair of strings that differ in their suffix is affected; a caller
applying the reported replacements to the first sequence does not obtain the second. The property
checks the reconstruction only when the edit script ends with a keep command; the pin
`pinReplacementsFinderDropsTheTrailingReplacement` carries `("ab", "ac")`.
'''

[[bug]]
id = "commons-text/3"
title = "JaroWinklerSimilarity.apply is 0.0 for two equal empty non-String CharSequences (1.0 for two empty Strings): the identity short cut compares the CharSequence objects with equals"
kind = "wrong-result"
severity = "low"
test = "pinJaroWinklerOfEqualEmptyBuildersIsOne"
found = { commit = "ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0", version = "1.15.1-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc lists `similarity("", "") = 1.0` and `similarity("foo", "foo") = 1.0`. `apply` wraps
both arguments in `SimilarityInput`s whose `equals` delegates to the underlying `CharSequence`, and
returns 1.0 when they are equal; otherwise it counts matches and returns 0.0 when there are none.
For `StringBuilder`s (identity `equals`) the short cut never fires, so two empty builders — or an
empty `String` and an empty `StringBuilder` — score 0.0 where two empty `String`s score 1.0. Equal
non-empty builders still score 1.0 through the match count. The pin
`pinJaroWinklerOfEqualEmptyBuildersIsOne` carries it; comparing by content
(`CharSequence.compare` / `contentEquals`) or treating two empty inputs as equal would fix it.
'''

