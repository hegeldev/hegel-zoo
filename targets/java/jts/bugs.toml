[[bug]]
id = "jts/1"
title = "WKTWriter with the floating precision model writes at most 16 fraction digits, not 17 significant digits, so ordinates below 1 do not round-trip: POINT (0.14285714285714285 0) prints as POINT (0.1428571428571428 0), 1/3000 as 0.0003333333333333 (13 significant digits) and 1e-17 as 0; WKTWriter.createFormatter passes PrecisionModel.getMaximumSignificantDigits() (16 for FLOATING) to OrdinateFormat.create as the maximum number of *fraction* digits (OrdinateFormat.DEFAULT, with 325 fraction digits, renders all of them exactly)"
kind = "contract"
severity = "low"
test = "pin_wktLosesSmallOrdinates"
found = { commit = "9c995e5383299b6b1596b287871434bf11eabc9f", version = "1.21.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by readersInvertWriters with ordinates such as 1/3 and 1e-7 mixed into random geometries; the property now skips ordinates whose 16-fraction-digit rendering does not read back. Ordinates of magnitude 1 or more with 17 significant digits (123.45678901234568) round-trip, since 16 fraction digits are then more than enough. The floating precision model is documented as full IEEE-754 double precision."

[[bug]]
id = "jts/2"
title = "IsSimpleOp reports a LineString or LinearRing with a repeated interior vertex as non-simple at that vertex (LINESTRING (0 0, 1 1, 1 1, 2 0), LINEARRING (2 -1, -4 0, 0 1, 0 1, 2 -1)), although a zero-length segment is not a self-intersection; the same operation trims repeated *end* points (LINESTRING (0 0, 0 0, 2 0, 2 0) is simple) and some rings with an interior repetition pass (LINEARRING (0 0, 1 0, 1 0, 1 1, 0 0)), and IsValidOp accepts repeated points"
kind = "contract"
severity = "low"
test = "pin_repeatedPointNotSimple"
found = { commit = "9c995e5383299b6b1596b287871434bf11eabc9f", version = "1.21.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "IsSimpleOp.trimRepeatedPoints (operation/valid/IsSimpleOp.java) handles only the start and end of the coordinate array before noding; the noder then finds the zero-length segment intersecting its neighbours at an interior point. Found by measuresAreExact against an exact simplicity check that ignores repeated points; the property skips lines and rings with repeated points."

[[bug]]
id = "jts/3"
title = "MinimumBoundingCircle of a non-empty geometry whose points all coincide (MULTIPOINT ((1 1), (1 1)), LINESTRING (2 3, 2 3)) has a null centre, radius 0 and no extremal points, and getCircle() returns POLYGON EMPTY, while getCentre() is documented to be null only for empty input and a single point gives that point: computeCirclePoints reduces to the convex hull, which is a single POINT, then strips the 'duplicate final point' because hullPts[0] equals hullPts[length - 1], leaving no points"
kind = "contract"
severity = "low"
test = "pin_boundingCircleOfCoincidentPoints"
found = { commit = "9c995e5383299b6b1596b287871434bf11eabc9f", version = "1.21.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by measuresAreExact as a NullPointerException in the test when a MULTIPOINT of two equal points was drawn; the property skips that shape. Any geometry with two or more points all equal is affected (algorithm/MinimumBoundingCircle.java)."

[[bug]]
id = "jts/4"
title = "RelateOp (the default behind Geometry.relate and the predicates) reports the boundary of a polygon meeting the interior of a line in a one-dimensional set when two segments of the line cross each other at a point in the interior of one of the polygon's edges: POLYGON ((0 0, 4 0, 4 4, 0 4, 0 0)) and LINESTRING (1 2, 5 6, 5 2, 1 6) relate as 1021F1102 by RelateOp and 1020F1102 by RelateNG, while the boundary's intersection with the line is MULTIPOINT ((3 4), (4 3)); the same for a MULTILINESTRING of the two crossing segments, and both agree once the crossing is moved off the edge or onto a vertex"
kind = "wrong-result"
severity = "low"
test = "pin_relateOpCountsACrossingOnTheBoundaryAsALine"
found = { commit = "9c995e5383299b6b1596b287871434bf11eabc9f", version = "1.21.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-26" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by predicatesAgree (RelateOp against RelateNG) once the generators drew the recorded shapes by default (the shrunk pair was POLYGON ((-1 -3, 0 0, 0 1, -1 -3)) and LINESTRING (0 0, -1 -2, 1 0, -2 -2), whose segments cross at (-0.5 -1) on the edge from (0 1) to (-1 -3)); reproduced standalone with jshell against the installed jts-core jar. The self-intersection node of the line lies on the polygon's boundary, and the legacy relate graph labels the line's edge at that node as meeting the boundary along a line (operation/relate). The narrow property relateAgreesWhenALineCrossesItselfOnABoundary draws the shape with random polygons and crossing directions; under HEGEL_NO_KNOWN predicatesAgree leaves such pairs out."

[[bug]]
id = "jts/5"
title = "RelateOp (the default behind Geometry.relate and the predicates) relates a line collinear with a segment of a self-crossing line as mostly outside it when the crossing point is not exactly representable: LINESTRING (0 0, 1 -1, 0 -1, 1 1), whose first and last segments cross at (1/3, -1/3), and its own last segment LINESTRING (0 -1, 1 1) relate as 001F001F2 (interiors meeting in a point, the segment's interior partly in the line's exterior, so covers() is false) where RelateNG gives 101F00FF2; the same for the segment reversed, extended past its end, as a MULTILINESTRING part, with the arguments swapped, and for the first segment; the middle segment, a segment not through the crossing, a non-collinear line through the crossing, and a self-crossing line whose crossing point is on the grid (LINESTRING (0 0, 3 -3, 0 -3, 3 3) and LINESTRING (0 -3, 3 3)) agree"
kind = "wrong-result"
severity = "low"
test = "pin_relateOpAlongASegmentOfASelfCrossingLine"
found = { commit = "9c995e5383299b6b1596b287871434bf11eabc9f", version = "1.21.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-26" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by predicatesAgree (RelateOp against RelateNG) in a 1000-case run once the generators drew the recorded shapes by default (the shrunk pair was the one in the title); reproduced standalone with jshell against the installed jts-core jar. The legacy relate graph nodes the self-crossing line at the rounded crossing point, and the collinear segment, noded at the same point, is then not recognised as lying along the split edges (operation/relate). The narrow property relateAgreesAlongASegmentOfASelfCrossingLine draws four random points whose outer segments cross and relates the line with its last segment (reversed or extended at random); under HEGEL_NO_KNOWN predicatesAgree leaves out pairs where a proper self-crossing of one lies on an edge of the other, and the narrow property relates the middle segment instead."
