name = "jts"
language = "java"
upstream = "https://github.com/locationtech/jts"
subdir = ""
license = "EPL-2.0 OR EDL-1.0"
# CONTRIBUTING.md (Eclipse Contributor Agreement, tests with fixes, announce larger work on the jts-dev list),
# DEVELOPING.md, LICENSES.md, FAQ-LICENSING.md, the PR template and .github/ say nothing about AI; no
# CLAUDE.md/AGENTS.md/copilot-instructions.
ai_policy_checked = "2026-09-16"

[base]
commit = "9c995e5383299b6b1596b287871434bf11eabc9f"
date = "2026-09-14"
version = "1.21.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Only jts-core and jts-io-common (GeoJSON) are needed in ~/.m2; the app, lab, example, Oracle and SDE modules
# and their tests, javadoc, sources, signing and the enforcer are skipped.
setup = ["mvn -q -B -ntp -pl modules/core,modules/io/common -am install -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dgpg.skip=true -Dpmd.skip=true -Dspotless.skip=true -Dlicense.skip=true"]

[expected_failures]
# Wide properties: the generators draw the recorded shapes by default (STYLE.md rule 11); each shape is a
# few percent of cases at the default count, so the wide properties pass some runs.
readersInvertWriters = { bug = "jts/1", intermittent = true }
measuresAreExact = { bug = "jts/3", intermittent = true }
# predicatesAgree meets jts/4 and jts/5 at comparable (low) rates; mapped to the basin seen first.
predicatesAgree = { bug = "jts/4", intermittent = true }
# Narrow properties (JtsShapesTest): one per bug, drawing only its shape region with random contents.
ordinatesBelowOneRoundTripThroughWKT = "jts/1"
repeatedInteriorVerticesAreSimple = "jts/2"
boundingCircleOfCoincidentPointsHasACentre = "jts/3"
relateAgreesWhenALineCrossesItselfOnABoundary = "jts/4"
relateAgreesAlongASegmentOfASelfCrossingLine = "jts/5"
# Pins: the regression examples.
pin_wktLosesSmallOrdinates = "jts/1"
pin_repeatedPointNotSimple = "jts/2"
pin_boundingCircleOfCoincidentPoints = "jts/3"
pin_relateOpCountsACrossingOnTheBoundaryAsALine = "jts/4"
pin_relateOpAlongASegmentOfASelfCrossingLine = "jts/5"
