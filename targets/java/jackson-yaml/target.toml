name = "jackson-yaml"
language = "java"
upstream = "https://github.com/FasterXML/jackson-dataformats-text"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-16"  # CLAUDE.md is build/architecture guidance only (no restriction on AI); no CONTRIBUTING.md; README says nothing about contributing or AI; the zoo only records bugs

[base]
commit = "65db46e9d6506a06f704b49c5cc8b7cb5f1fd5a4"
date = "2026-09-19"
version = "3.3.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install the yaml module (and the parent pom) from the pinned tree; jackson-core/databind 3.3.0-SNAPSHOT
# and snakeyaml-engine 3.0.1 come from Maven Central and its snapshot repository (declared in the root pom and in
# hegel/pom.xml). The snapshot dependencies float: a later jackson-core/databind snapshot, or their removal once
# 3.3.0 is released, can change or break this target without any change to the pinned commit (README, "Fragility").
setup = ["mvn -q -B -ntp -pl yaml -am -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dgpg.skip=true install"]

[expected_failures]
pin1_nextLineStringIsQuoted = "jackson-yaml/1"
pin2_emptyDocumentAsEmptyObjectKeepsAContext = "jackson-yaml/2"
pin3_taggedSignAloneIsAnErrorOrAString = "jackson-yaml/3"
pin4_leadingZeroWithNonOctalDigitsUnderCore = "jackson-yaml/4"
pin5_coreNumberStringsAreQuoted = "jackson-yaml/5"
pin6_objectIdBeforeBinary = "jackson-yaml/6"
pin7_aliasInTheTreeModel = "jackson-yaml/7"
pin8_canonicalOutputKeepsTypes = "jackson-yaml/8"
pin9_typeIdOnAScalar = "jackson-yaml/9"
pin10_writeBinaryFromAStream = "jackson-yaml/10"
pin11_mergeKeyIsQuoted = "jackson-yaml/11"
pin12_replayingParserReadsAQuotedMergeKeyString = "jackson-yaml/12"
pin13_leadingByteOrderMarkIsQuoted = "jackson-yaml/13"
