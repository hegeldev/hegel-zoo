# Bugs found in jackson-dataformat-yaml (jackson-dataformats-text, module yaml, 3.x) by the zoo's Hegel tests.
# Every entry has a `pinN_…` test in hegel/src/test/java/zoo/JacksonYamlPinsTest.java that asserts the correct
# behaviour and fails while the bug exists (target.toml `[expected_failures]`). Defects whose root cause is in
# snakeyaml-engine (the YAML processor Jackson wraps) are not recorded here; the README lists them.

[[bug]]
id = "jackson-yaml/1"
title = "MINIMIZE_QUOTES writes a string consisting of U+0085 (NEL) plain, and it reads back as null"
kind = "wrong-result"
severity = "medium"
test = "pin1_nextLineStringIsQuoted"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`StringQuotingChecker.Default.needToQuoteValue` (util/StringQuotingChecker.java ~240) quotes reserved
words and strings with `valueHasQuotableChar` (~130: `[]{},#:` in context, leading `~`), and
`YAMLGenerator._writeString` (~490) picks LITERAL for strings containing `\n`. U+0085 is a YAML line
break too (b-char in 1.1; in 1.2 it is a non-break character but snakeyaml-engine's scanner still
treats it as one), so `""` is written as the plain scalar `--- `, which every reader —
Jackson included — parses as an empty plain scalar, i.e. null. Any string with a NEL at the start,
end or alone loses characters. Found by `treesWrittenByJacksonReadBack`.
'''

