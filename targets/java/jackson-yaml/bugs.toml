[[bug]]
id = "jackson-yaml/7"
title = "The tree model reads an alias as a string holding the anchor's name (`a: &x 1\\nb: *x` gives b = \"x\"; `*nope` gives \"nope\")"
kind = "wrong-result"
severity = "medium"
test = "pin7_aliasInTheTreeModel"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "reported"
upstream = "https://github.com/FasterXML/jackson-dataformats-text/issues/2"
notes = '''
`YAMLParser.nextToken` (YAMLParser.java ~444) turns an `AliasEvent` into VALUE_STRING with the anchor
name as text and sets `isCurrentAlias()`; databind's Object Id handling can resolve it for POJOs
with `@JsonIdentityInfo`, but `readTree`/`readValue(JsonNode.class)` and plain `Map` binding get the
literal string, and an undefined alias (`*nope`) is not an error. A merge key `<<: *x` becomes the
entry `"<<": "x"`. The `YAMLAnchorReplayingFactory` (3.x) is the workaround: it replays the anchored
events and rejects undefined aliases. Upstream issue #2 ("Add support for Object Ids ... via tree
model") is open since 2017; the project's `tofix` tests cover the databind side. Found by probing;
`mutatedDocumentsReadLikeTheEngine` skips anchors and aliases because of it.
'''

