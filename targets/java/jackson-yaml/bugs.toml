[[bug]]
id = "jackson-yaml/9"
title = "writeTypeId before a scalar value is silently dropped"
kind = "wrong-result"
severity = "low"
test = "pin9_typeIdOnAScalar"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`_scalarEvent` (YAMLGenerator.java ~921) passes the pending type id as the scalar's tag but with
`NO_TAGS = ImplicitTuple(true, true)`, which tells the emitter the tag is implicit for both plain and
quoted styles, so it is never written: `writeTypeId("T"); writeString("v")` produces `- "v"`. For
collections (`writeStartObject`/`writeStartArray`) the tag is emitted (`!<T>`), and the in-source
comment ("Not 100% sure why we don't force explicit tags for type id") records the doubt. Type ids on
scalars arise from `@JsonTypeInfo(include = WRAPPER_ARRAY/…)` on scalar-serialized types with native
type ids enabled. Found by probing while writing `generatorCallsAgreeWithTheTreeWriter`.
'''

