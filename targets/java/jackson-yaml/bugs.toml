[[bug]]
id = "jackson-yaml/5"
title = "ALWAYS_QUOTE_NUMBERS_AS_STRINGS knows only the JSON schema's numbers: under the core schema `0x1F`, `0o17`, `.Inf`, `+.inf`, `.NaN` strings are written plain and read back as numbers"
kind = "wrong-result"
severity = "medium"
test = "pin5_coreNumberStringsAreQuoted"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`YAMLGenerator._looksLikeYAMLNumber` (YAMLGenerator.java ~536) combines `PLAIN_NUMBER_P`
(`[+-]?[0-9]*(\.[0-9]*)?`) with the JSON schema's INT/FLOAT regular expressions. A factory built with
`yamlSchema(YAMLSchema.CORE)` reads with the core schema, whose resolver also accepts `0x1F`, `0o17`,
`.Inf`, `+.inf`, `.NaN` (and `+1e3`, `.5`), so with MINIMIZE_QUOTES + ALWAYS_QUOTE_NUMBERS_AS_STRINGS the
string "0x1F" is written `--- 0x1F` and the same mapper reads it back as the integer 31. The check
should use the configured schema's resolver (the parser side already does: `_yamlResolver`). Found
by `treesWrittenByJacksonReadBack`.
'''

