[[bug]]
id = "jackson-yaml/8"
title = "CANONICAL_OUTPUT double-quotes every scalar, so numbers, booleans and nulls read back as strings"
kind = "wrong-result"
severity = "medium"
test = "pin8_canonicalOutputKeepsTypes"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`YAMLGenerator.buildDumperOptions` (~152) sets `DumpSettings.setCanonical(true)`. Canonical YAML writes
every scalar double-quoted *with an explicit tag* — the tag is what keeps `!!int "1"` an integer — but
the generator emits all its scalars with `NO_TAGS = ImplicitTuple(true, true)` (~898/931), so
`{a: [1, "x", true, null, 1.5]}` comes out as `? "a"\n: [ "1", "x", "true", "null", "1.5", ]` and reads
back (in Jackson and in the engine) as five strings. Either the feature should emit tags in canonical
mode or the scalars should stay plain. Found by `treesWrittenByJacksonReadBack`.
'''

