[[bug]]
id = "jackson-yaml/6"
title = "An object id written before writeBinary is dropped from the binary scalar and emitted as the anchor of the next property name"
kind = "wrong-result"
severity = "low"
test = "pin6_objectIdBeforeBinary"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`_writeScalarBinary` (YAMLGenerator.java ~908) builds its own `ScalarEvent(Optional.empty(), TAG_BINARY,
EXPLICIT_TAGS, …)` instead of going through `_scalarEvent`, so the pending `_objectId` (and `_typeId`)
set by `writeObjectId`/`writeTypeId` are neither used nor cleared. They are consumed by the next
`_scalarEvent`, which is the following property name: `{a: <binary>, b: "x"}` with an object id
"anch" on the binary comes out as `a: !!binary |-\n  AQID\n&anch b: "x"` — the anchor sits on the key
`b`. Found by `generatorCallsAgreeWithTheTreeWriter`.
'''

