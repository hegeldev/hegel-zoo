[[bug]]
id = "jackson-yaml/3"
title = "`!!int +` (a lone sign with an explicit int tag) ends the token stream in the middle of a document"
kind = "wrong-result"
severity = "low"
test = "pin3_taggedSignAloneIsAnErrorOrAString"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`_decodeNumberScalar` (YAMLParser.java ~598) returns `null` for a value that is just `+` ("if (len ==
1) return null") and `_decodeScalar` passes that on as the next token; `null` means "end of input"
to every caller, so `a: !!int +\nb: 1` gives START_OBJECT, PROPERTY_NAME a and then nothing — the
rest of the document is silently dropped and `readTree` returns a MissingNode. The same code path
returns VALUE_STRING for other unparsable tagged numbers (`!!int 12abc`), which is what a lone sign
should get too (or an exception). Found by probing after `scalarsTypeLikeTheSchema` showed the
explicit-tag fall-through.
'''

