[[bug]]
id = "jackson-yaml/4"
title = "Under the core schema `08`, `09`, `0128…` throw \"Invalid base-8 number\" instead of reading as decimal integers"
kind = "crash"
severity = "medium"
test = "pin4_leadingZeroWithNonOctalDigitsUnderCore"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
With `YAMLSchema.CORE` the engine's resolver tags `08` as an int (core schema: `[-+]?[0-9]+`), and
`_decodeNumberScalar` (YAMLParser.java ~630) sends every "0 followed by a digit" to
`_decodeNumberIntOctal` when PARSE_OCTAL_NUMBERS is on (its default), which fails in `_decodeInt`
(~788: `Invalid base-8 number ('8'), problem: For input string: "8" under radix 8`). The feature is
meant for YAML 1.1 octals (`017` = 15, deliberate) but a leading zero followed by 8 or 9 is not an
octal in any YAML version; snakeyaml-engine reads `08` as 8, and Jackson itself does with
PARSE_OCTAL_NUMBERS disabled. Signed forms (`-08`, `+0128000000000`) fail the same way. Under the
default JSON schema these scalars are strings, so the bug needs the core schema (or a `!!int` tag).
Found by `scalarsTypeLikeTheSchema`.
'''

