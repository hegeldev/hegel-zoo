[[bug]]
id = "jackson-yaml/11"
title = "MINIMIZE_QUOTES writes the merge key `<<` plain, so a core-schema reader merges it or fails"
kind = "wrong-result"
severity = "low"
test = "pin11_mergeKeyIsQuoted"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`StringQuotingChecker.Default._isReservedKeyword` (util/StringQuotingChecker.java ~82) quotes the YAML
1.1 words (y/n/yes/no/on/off/true/false/null) but not `<<`, the merge key, which the core schema's
resolver (snakeyaml-engine `CoreScalarResolver`, also SnakeYAML and PyYAML) tags `!!merge`. A map with
the string key "<<" (or the string value "<<") written by a `yamlSchema(CORE)` mapper with
MINIMIZE_QUOTES comes out as `<<:\n  y: 2`; the engine with the core schema merges the value's entries
into the parent, and `- <<` as a sequence item fails with "could not determine a constructor for the
tag tag:yaml.org,2002:merge". Jackson's own reader does not implement merges, so it round-trips —
the loss is for every other consumer. `needToQuoteName` should treat `<<` like the reserved words
(the engine's own Representer does quote it). Found by `treesWrittenByJacksonReadBack`.
'''

