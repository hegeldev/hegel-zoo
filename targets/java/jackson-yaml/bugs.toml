[[bug]]
id = "jackson-yaml/2"
title = "EMPTY_DOCUMENT_AS_EMPTY_OBJECT leaves the parser without a read context after its synthetic object, and `---` still reads as null"
kind = "crash"
severity = "low"
test = "pin2_emptyDocumentAsEmptyObjectKeepsAContext"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`YAMLParser.nextToken` (YAMLParser.java ~458) handles the feature on a `StreamEndEvent` when nothing
was read: it calls `_streamReadContext.createChildObjectContext(0, 0)` but discards the result, then
returns START_OBJECT and, on the next call, END_OBJECT with `_streamReadContext` set to null.
`currentName()` / `streamReadContext()` then throw NullPointerException instead of returning null /
the root context. The javadoc promises an empty object "for an empty document"; a document that is
only `---\n` (an explicit empty document, the common case for "empty") is still read as null because
the check is only made at the end of a stream with no document at all. Found by probing.
'''

