[[bug]]
id = "jackson-yaml/10"
title = "writeBinary(InputStream, int) throws UnsupportedOperationException while the byte[] variants work"
kind = "contract"
severity = "low"
test = "pin10_writeBinaryFromAStream"
found = { commit = "b5b62c9b30b854f1a512639e21f0bfb46cb22524", version = "3.3.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`YAMLGenerator` overrides `writeBinary(Base64Variant, byte[], int, int)` (~628) but not
`writeBinary(Base64Variant, InputStream, int)`, so the base class reports "Operation not supported by
`JsonGenerator` of type tools.jackson.dataformat.yaml.YAMLGenerator". The streaming variant is part of
the public `JsonGenerator` API and the JSON generator supports it; the YAML one could read the stream
into a byte[] (it has to base64 the whole value anyway) and delegate. Found by
`generatorCallsAgreeWithTheTreeWriter`.
'''

