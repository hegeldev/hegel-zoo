name = "commons-compress"
language = "java"
upstream = "https://github.com/apache/commons-compress"
subdir = ""
license = "Apache-2.0"
# The pull request template links the ASF Generative Tooling Guidance and asks contributors to disclose AI assistance;
# CONTRIBUTING.md and the README say nothing further; no CLAUDE.md/AGENTS.md/copilot-instructions. Any upstream report
# from this target should say that the tests were written with an AI assistant.
ai_policy_checked = "2026-09-16"

[base]
commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617"
date = "2026-09-07"
version = "1.29.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# The library is installed into the local Maven repository from the pinned tree with everything but compilation skipped
# (Javadoc, sources, enforcer, RAT, SpotBugs, PMD, Checkstyle, JaCoCo, CycloneDX/SPDX, signing, Animal Sniffer,
# japicmp; about a minute). The tests shell out to the system tools GNU tar, cpio, binutils ar, Info-ZIP unzip, gzip,
# bzip2, xz, zstd and Python 3 (tarfile, zipfile, gzip, bz2, lzma, zlib); a missing tool skips its checks.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Drat.skip=true -Dspotbugs.skip=true -Dpmd.skip=true -Dcheckstyle.skip=true -Djacoco.skip=true -Dcyclonedx.skip=true -Dspdx.skip=true -Dgpg.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true install",
]

