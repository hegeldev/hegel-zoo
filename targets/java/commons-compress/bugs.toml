[[bug]]
id = "commons-compress/38"
title = "ar entry names containing spaces are written unterminated, so GNU ar reads them cut at the first space"
kind = "silent-corruption"
severity = "low"
test = "arNamesWithSpacesAreTerminated"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ArArchiveOutputStream` pads short names with spaces and never terminates them: `a b` becomes the header field
`a b             `, which binutils `ar t` lists as `a` (the GNU variant terminates names with `/` — `a b/` — precisely so
that spaces are unambiguous, and BSD ar writes such names in its `#1/N` form). In LONGFILE_BSD mode the writer already
knows the `#1/N` form but only uses it for names longer than 16 characters; names with spaces should use it too (or the
`/` terminator), and in LONGFILE_ERROR mode be refused.
'''
