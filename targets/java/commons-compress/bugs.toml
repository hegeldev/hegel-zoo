# Bugs found in Apache Commons Compress by the Hegel zoo. Pins: hegel/src/test/java/zoo/CommonsCompressPinsTest.java.

[[bug]]
id = "commons-compress/1"
title = "TarArchiveOutputStream refuses a name of exactly 100 bytes in LONGFILE_ERROR mode"
kind = "contract"
severity = "low"
test = "tarNamesOfExactly100BytesAreAccepted"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`TarArchiveOutputStream.putArchiveEntry` tests `name.length >= TarConstants.NAMELEN` before falling back to the long-name
modes, so a name of exactly 100 bytes is reported as "too long ( > 100 bytes)" although ustar's 100-byte name field holds
it without a terminator (POSIX.1-1988: the field "is null-terminated unless every character is non-null"); GNU tar and
Python's tarfile write and read such names in the plain header. The same test refuses 100-byte link names.
'''

[[bug]]
id = "commons-compress/2"
title = "uid, gid, mode and device numbers written in base-256 (BIGNUMBER_STAR) or as large octal are narrowed to int when read"
kind = "silent-corruption"
severity = "high"
test = "tarBase256IdsAreNotNarrowedOnRead"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`TarArchiveEntry.parseTarHeader` reads uid/gid/devmajor/devminor with `parseOctalOrBinaryAsInt`, which casts the parsed
long to int. An entry written by the library itself in BIGNUMBER_STAR mode with uid 4294967295 reads back as
`getLongUserId() == -1`; 2147483648 reads back as -2147483648, 4294967296 as 0. Archives written by GNU tar (`--format=gnu`)
and Python's tarfile with such ids read the same way, while both of those read the library's archive correctly. The pax
(BIGNUMBER_POSIX) path is not affected.
'''

[[bug]]
id = "commons-compress/3"
title = "A GNU long name (LONGFILE_GNU) is truncated to 100 characters on read when the same entry also carries a pax header"
kind = "silent-corruption"
severity = "high"
test = "tarGnuLongNameSurvivesNextToPaxHeader"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
In LONGFILE_GNU mode with BIGNUMBER_POSIX (or setAddPaxHeadersForNonAsciiNames), any entry that needs a pax record — a
sub-second mtime (the default `new TarArchiveEntry(name)` has one), a uid beyond 2097151, ... — is written as a pax
header entry followed by a `././@LongLink` entry and the ustar header. `TarArchiveInputStream.getNextEntry` /
`TarFile` then apply the pax headers after processing the long name and overwrite the name with the 100-byte ustar
field: a 150-character name reads back with 100 characters. Python's tarfile and GNU tar read the full name (the bytes
are right; the reader is wrong). Long link names in the same combination survive.
'''

[[bug]]
id = "commons-compress/4"
title = "User and group names longer than 32 bytes are silently truncated even in POSIX (pax) mode"
kind = "silent-corruption"
severity = "medium"
test = "tarLongOwnerNamesGoIntoPaxHeaders"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`TarArchiveOutputStream` never emits pax `uname`/`gname` records: in LONGFILE_POSIX + BIGNUMBER_POSIX mode a 40-character
user name is cut to the 32-byte ustar field without an error (`TarArchiveEntry.writeEntryHeader` →
`TarUtils.formatNameBytes` truncates). pax (POSIX.1-2001) defines `uname` and `gname` records for exactly this; GNU tar
`--format=posix` writes them and the library's reader already honours them. In the non-pax modes the truncation is a format
limit, but the writer refuses other things the format cannot hold (long names, big numbers) instead of truncating.
'''

[[bug]]
id = "commons-compress/5"
title = "A directory entry with a nonzero size is written without its data and without an error, corrupting the archive"
kind = "silent-corruption"
severity = "medium"
test = "tarDirectoryWithSizeIsRefusedOrReadable"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`TarArchiveOutputStream.closeArchiveEntry` skips the "closed at N before the M bytes specified in the header were
written" check for directory entries (`!entry.isDirectory()` guard), so `new TarArchiveEntry("d/")` with `setSize(5)` and no
data produces a header claiming 5 bytes followed directly by the next header. Reading the archive back fails on the next
entry ("parseOctalOrBinary(): Invalid byte 32 at offset 2 in '44 00000'"); GNU tar and Python skip 512 bytes of "data"
and lose the following entry. Either the size should be written as 0 (GNU tar does so for directories) or the writer
should refuse as it does for files.
'''

[[bug]]
id = "commons-compress/6"
title = "addPaxHeader accepts a key containing '=' and writes an ambiguous record that reads back under a different key"
kind = "contract"
severity = "low"
test = "tarPaxKeysWithEqualsSignAreRefused"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`TarArchiveEntry.addPaxHeader("a=b", "c")` is written as the record `a=b=c`; POSIX pax records are `keyword=value`,
so it reads back as key `a` with value `b=c` (`getExtraPaxHeader("a=b")` is null after a round trip). Keys with `=`
(and empty keys, or keys with a newline) should be rejected on the way in.
'''

[[bug]]
id = "commons-compress/7"
title = "CpioArchiveOutputStream.write(buf, off, len) in FORMAT_NEW_CRC sums buf[0..len) instead of buf[off..off+len)"
kind = "wrong-exception"
severity = "high"
test = "cpioCrcChecksumUsesTheWrittenSlice"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CpioArchiveOutputStream.write(byte[] b, int off, int len)` updates the running checksum with `for (pos = 0; pos < len;
pos++) crc += b[pos] & 0xFF`, ignoring `off`. Any caller that writes from the middle of a buffer (a `BufferedOutputStream`
flush, `IOUtils.copy` with a partially filled buffer, ...) gets "CRC Error" from `closeArchiveEntry` although the entry's
`setChksum` is right — so correct crc-format archives cannot be written that way; `write(buf, 0, len)` works.
'''

[[bug]]
id = "commons-compress/8"
title = "Header values that overflow their field are written with their low digits instead of being refused"
kind = "silent-corruption"
severity = "medium"
test = "cpioOverflowingValuesAreRefused"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CpioArchiveOutputStream.writeAsciiLong` formats the value and keeps the last `length` characters when it is longer
(`tmpStr.substring(tmpStr.length() - length)`), and `writeBinaryLong` masks to 16 bits. A new-format entry with mtime
2^33 is written as mtime 0, a negative mtime -5 as 4294967291, an old-binary entry with uid 65536 as uid 0 — silently.
GNU cpio reads the wrong values back (so does the library). The tar writer refuses values that do not fit (BIGNUMBER_ERROR)
or switches representation; the cpio writer should refuse.
'''

[[bug]]
id = "commons-compress/9"
title = "An entry named TRAILER!!! is written as a normal entry and ends the archive on read"
kind = "silent-corruption"
severity = "low"
test = "cpioTrailerNameIsRefused"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CpioArchiveInputStream.getNextCPIOEntry` treats any header whose name is `TRAILER!!!` as the end-of-archive marker
(as GNU cpio does), but `CpioArchiveOutputStream.putArchiveEntry` accepts the name, so an archive with entries
`TRAILER!!!` and `after` reads back as empty in both the library and GNU cpio. The writer should refuse the reserved name.
'''

[[bug]]
id = "commons-compress/10"
title = "CpioArchiveInputStream.getBytesRead() is one byte short per entry and stops before the end-of-archive padding"
kind = "wrong-result"
severity = "low"
test = "cpioBytesReadCountsEveryByteConsumed"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CpioArchiveInputStream.readEntryName` reads the terminating NUL of every name with `in.read()` without `count(1)`
(`readRange`, used for everything else, counts), so after reading a two-entry archive `getBytesRead()` reports 361 of
the 364 bytes actually taken from the underlying stream (a trailer's name is read the same way). The stream also stops
right after the trailer header: the block padding the writer adds (`ensureBlockSize`, 512-byte blocks) is never consumed,
so `getBytesRead()` under-reports the archive and a stream that continues after the archive is left mid-block
(`skipRemainderOfLastBlock` computes from the wrong count).
'''

[[bug]]
id = "commons-compress/11"
title = "An empty ar archive is written as zero bytes, which ArArchiveInputStream cannot read"
kind = "contract"
severity = "low"
test = "arEmptyArchiveHasTheMagic"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ArArchiveOutputStream` writes the `!<arch>\n` magic lazily on the first `putArchiveEntry`, so closing a stream with no
entries produces an empty file. binutils `ar` writes the 8-byte magic for an empty archive, and the library's own
`ArArchiveInputStream` throws "Premature end of ar archive: Incomplete global header (expected 8 bytes, got 0)" on the
result; `ArchiveStreamFactory.detect` cannot recognise it either.
'''

[[bug]]
id = "commons-compress/12"
title = "ArArchiveOutputStream accepts names the format reserves (/N, #1/N, //) and writes unreadable or vanishing entries"
kind = "silent-corruption"
severity = "medium"
test = "arReservedNamesAreRefused"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The writer copies the name into the 16-byte field unescaped. `/12` reads back as a GNU long-name reference
("Cannot process GNU long file name as no GNU string table was found"), `#1/5` as a BSD long-name marker ("Invalid BSD
long name: File name length (5) exceeds entry length (3)"), and an entry named `//` is taken for the GNU string table
and disappears (binutils `ar t` agrees). Trailing slashes are stripped (`foo/` → `foo`) and surrounding spaces trimmed
(` a` → `a`, `  ` → ``) in LONGFILE_ERROR mode. The writer should refuse names the format cannot represent, as the tar
writer refuses over-long names.
'''

[[bug]]
id = "commons-compress/13"
title = "Non-ASCII ar entry names are written as ? without an error"
kind = "silent-corruption"
severity = "medium"
test = "arNonAsciiNamesAreRefusedOrKept"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ArArchiveOutputStream.writeEntryHeader` encodes the name with `String.getBytes(US_ASCII)` (via `ArchiveUtils.toAsciiBytes`),
which replaces every unmappable character with `?`: an entry named `é` reads back (in the library and in binutils `ar`)
as `?`, and two such names collide. There is no charset option; the writer should at least refuse what it cannot encode.
'''

[[bug]]
id = "commons-compress/14"
title = "ArArchiveOutputStream accepts more bytes than the entry's declared size and writes a corrupt archive"
kind = "silent-corruption"
severity = "medium"
test = "arWriterRefusesMoreDataThanDeclared"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ArArchiveOutputStream.write` does not compare the running count with `entry.getLength()`; only `closeArchiveEntry` checks
for too *few* bytes ("Length does not match entry"). Writing 3 bytes into an entry declared with size 1 succeeds and the
archive (72 bytes: header + 3 bytes + padding) has the extra bytes where the next header should be. TarArchiveOutputStream
throws "Request to write N bytes exceeds size in header" in the same situation.
'''

[[bug]]
id = "commons-compress/15"
title = "An NTFS extra field with zero access and creation times is written for sub-second or out-of-range mtimes, which read back as 1601-01-01"
kind = "wrong-result"
severity = "medium"
test = "zipNtfsExtraDoesNotInventAccessTimes"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
When the modification time needs more than DOS precision (`setLastModifiedTime` with a fraction of a second, or a time
outside 1980–2107), `ZipArchiveOutputStream` adds an X5455 extended timestamp and an NTFS (0x000a) extra field; the NTFS
field is written with atime and ctime set to FILETIME 0 (`X000A_NTFS.setAccessJavaTime(null)` leaves the zero default) although
the entry never had those times. `ZipFile` then reports `getLastAccessTime()` and `getCreationTime()` as
1601-01-01T00:00:00Z instead of null, and Info-ZIP/Windows would restore those timestamps. Either the NTFS field should be
omitted (the X5455 field carries the mtime) or the absent times should not be written as zero.
'''

[[bug]]
id = "commons-compress/16"
title = "setComment accepts an archive comment longer than 65535 bytes and writes an archive no reader opens"
kind = "silent-corruption"
severity = "medium"
test = "zipArchiveCommentTooLongIsRefused"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ZipArchiveOutputStream.writeCentralDirectoryEnd` writes the comment length with `ZipShort.getBytes(data.length)`, which
keeps the low 16 bits, and then the full comment: a 70000-byte comment gives an EOCD record announcing 4464 bytes followed
by 70000, and `ZipFile` fails with "Archive is not a ZIP archive" (Python's zipfile and unzip fail too). Entry comments and
extra fields of that size are refused ("entry comment too long", "invalid extra field length"); the archive comment should
be too.
'''

[[bug]]
id = "commons-compress/17"
title = "ZipFile and ZipArchiveInputStream read the same entry name differently when it contains a backslash"
kind = "inconsistent"
severity = "medium"
test = "zipReadersAgreeOnBackslashNames"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ZipArchiveEntry.setName` replaces `\` with `/` when the entry's platform is FAT and the name has no `/`. `ZipFile`
learns the platform from the central directory's version-made-by (unix for archives written on unix), so it returns
`x\y`; `ZipArchiveInputStream` only sees the local header, assumes FAT and returns `x/y`. Archives written by Python's
zipfile or Info-ZIP on unix with such names (legal, if unwise) therefore have two names depending on the reader; the
library's own writer reproduces it for an entry with a unix mode.
'''

[[bug]]
id = "commons-compress/18"
title = "setUseLanguageEncodingFlag(true) is silently lost when setEncoding is called afterwards, even with UTF-8 restored"
kind = "inconsistent"
severity = "low"
test = "zipLanguageEncodingFlagDoesNotDependOnCallOrder"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ZipArchiveOutputStream.setEncoding` clears `useUTF8Flag` when the new charset is not UTF-8 and never restores it;
`setUseLanguageEncodingFlag` evaluates the current charset at call time. `setUseLanguageEncodingFlag(true);
setEncoding("Cp437"); setEncoding("UTF-8")` writes entries without general purpose bit 11, while the same three settings in
the order `setEncoding(...); setUseLanguageEncodingFlag(true)` set it. The flag should be a request that is applied at
write time.
'''

[[bug]]
id = "commons-compress/19"
title = "SevenZOutputFile accepts an entry name containing U+0000 and writes an archive whose names are shifted"
kind = "silent-corruption"
severity = "medium"
test = "sevenZNamesWithNulAreRefused"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`SevenZOutputFile.writeFileNames` writes each name as UTF-16LE followed by a U+0000 terminator with no check for the
terminator inside the name, so `a\0b` becomes two names and the archive's name count disagrees with its entry count:
`SevenZFile` refuses the result ("Invalid number of file names (3 instead of 2)"). The writer should reject the name.
'''

[[bug]]
id = "commons-compress/20"
title = "Writing data into a 7z entry marked as a directory (or anti-item) silently clears the flag"
kind = "silent-corruption"
severity = "low"
test = "sevenZDirectoryFlagSurvivesWrittenData"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`SevenZOutputFile.closeArchiveEntry` sets `hasStream = true` when bytes were written, and the file-property writer derives
the directory and anti-item flags only for entries without a stream (`writeFileEmptyStreams`/`writeFileEmptyFiles`/
`writeFileAntiItems` cover the empty-stream entries), so an entry with `setDirectory(true)` and 2 bytes of data reads back
as a regular file and an anti-item with data as a plain file. Data written into a directory should be refused, as
ZipArchiveOutputStream does ("Cannot write data to a directory entry").
'''

[[bug]]
id = "commons-compress/21"
title = "GzipCompressorOutputStream.finish() is not idempotent: close() after finish() appends an empty bogus member"
kind = "silent-corruption"
severity = "high"
test = "gzipCloseAfterFinishAddsNothing"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`GzipCompressorOutputStream.finish()` guards with `!deflater.finished()` but then calls `deflater.reset()`, which clears
that flag, so the `finish()` that `close()` performs runs again and writes an empty deflate block plus another 8-byte
trailer (the CRC of the old data and ISIZE 0). The idiomatic `out.finish(); out.close()` therefore produces a 25-byte
member followed by 10 bytes of garbage (35 bytes for "hello"); reading with `decompressConcatenated=true` fails with
"Unexpected data after a valid .gz stream" and GNU gzip warns about trailing garbage. `BZip2CompressorOutputStream.finish()`
guards correctly.
'''

[[bug]]
id = "commons-compress/22"
title = "ZstdCompressorOutputStream.finish() writes nothing; only close() emits the frame"
kind = "contract"
severity = "medium"
test = "zstdFinishWritesTheFrame"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ZstdCompressorOutputStream` does not override `finish()`; the inherited `CompressFilterOutputStream.finish()` only sets
a flag, so after `write(data); finish()` the underlying stream holds 0 bytes and a reader of it fails. The contract
("Finishes writing compressed data to the underlying stream without closing it") holds for every other compressor in the
factory; callers that keep the underlying stream open (multi-member files, tar.zst inside another container) lose the data.
'''

[[bug]]
id = "commons-compress/23"
title = "getUncompressedCount() of the LZ4 and Snappy input streams returns the compressed byte count"
kind = "wrong-result"
severity = "medium"
test = "lz77StreamsReportTheUncompressedCount"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`AbstractLZ77CompressorInputStream` counts the bytes it reads from the underlying stream (`readOneByte`,
`tryToReadLiteral`) and never the bytes produced by back-references; `FramedLZ4CompressorInputStream` and
`FramedSnappyCompressorInputStream` add their frame headers and checksums to the same counter. After decoding 16000 bytes,
`FramedLZ4CompressorInputStream.getUncompressedCount()` is 105, `BlockLZ4CompressorInputStream` 6015, framed Snappy 779,
raw Snappy 761 — while gzip, bzip2, xz and deflate report 16000. `InputStreamStatistics.getUncompressedCount()` is
documented as "the amount of decompressed bytes returned by the stream".
'''

[[bug]]
id = "commons-compress/24"
title = "The raw Snappy preamble's varint is decoded with a 32-bit shift, so lengths of 2^31 and above go negative"
kind = "wrong-result"
severity = "medium"
test = "snappyVarintLengthsAbove2GiBParse"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`SnappyCompressorInputStream.readSize` accumulates `sz |= (b & 0x7f) << index++ * 7` with an int shift that is then
widened, so the 5-byte varint `80 80 80 80 08` (2^31) yields `getUncompressedSize() == -2147483648` and decoding stops
at once; the Snappy format allows lengths up to 2^32-1 (aircompressor's `SnappyDecompressor.getUncompressedLength`
reads 2147483648). Varints longer than 5 bytes wrap the shift modulo 32 as well.
'''

[[bug]]
id = "commons-compress/25"
title = "A gzip member whose OS byte is not one of the 15 known codes cannot be read"
kind = "wrong-exception"
severity = "medium"
test = "gzipUnknownOsBytesAreAccepted"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`GzipCompressorInputStream.init` calls `parameters.setOperatingSystem(code)`, which goes through the strict
`GzipParameters.OS.from(int)` and throws `CompressException: Unknown operating system code: 99`. RFC 1952 assigns codes
0–13 and 255 and says nothing about rejecting others; GNU gzip and Python's gzip decode such members. The lenient overload
`OS.from(code, false)` exists but has no caller.
'''

[[bug]]
id = "commons-compress/26"
title = "Operator precedence in SnappyCompressorOutputStream's offset limits makes copies use longer tags than needed"
kind = "wrong-result"
severity = "low"
test = "snappyCopiesUseTheShortestOffsetForm"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`MAX_OFFSET_WITH_ONE_OFFSET_BYTE = 1 << 11 - 1` is 1024 (intended 2047) and `MAX_OFFSET_WITH_TWO_OFFSET_BYTES = 1 << 16 - 1`
is 32768 (intended 65535), because `-` binds tighter than `<<`. Copies with offsets 1025–2047 are written with the
3-byte tag-2 form instead of the 2-byte tag-1 form, and offsets 32768–65535 with the 5-byte tag-3 form. The output is
valid but larger than the format allows for; three 8-byte matches 1100, 1520 and 2040 bytes back come out as tags
[2, 2, 2] where the specification's encoder writes [1, 1, 1].
'''

