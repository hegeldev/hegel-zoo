[[bug]]
id = "commons-compress/28"
title = ".Z headers with maxbits above 16 are accepted and allocate up to 6 GiB from a three-byte file"
kind = "crash"
severity = "medium"
test = "zMaxBitsAreBoundedTo16"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
