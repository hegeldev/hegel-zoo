[[bug]]
id = "commons-compress/32"
title = "GzipParameters accepts modification times outside the 32-bit MTIME field and writes them truncated"
kind = "silent-corruption"
severity = "low"
test = "gzipMtimeBeyond32BitsIsRefusedOrKept"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`GzipCompressorOutputStream.writeMemberHeader` writes `(int) parameters.getModificationInstant().getEpochSecond()`: an
