[[bug]]
id = "commons-compress/34"
title = "A raw Snappy literal with a 4-byte length field of 0xFFFFFFFF is accepted as an empty literal"
kind = "contract"
severity = "low"
test = "snappyLiteralLengthOverflowIsRejected"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`SnappyCompressorInputStream.readLiteralLength` reads the four-byte length as `(int) ByteUtils.fromLittleEndian(...)`
and returns `length + 1`, so 0xFFFFFFFF becomes 0: the stream `00 FC FF FF FF FF` (declared size 0, then a literal of 2^32
bytes) decodes to nothing instead of failing. Only values that land in the negative range after the +1 are caught.
'''

[[bug]]
id = "commons-compress/35"
title = "XZCompressorOutputStream.close() after finish() throws \"Stream finished or closed\""
kind = "crash"
severity = "medium"
test = "xzCloseAfterFinishDoesNotThrow"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`XZCompressorOutputStream.finish()` forwards to `XZOutputStream.finish()` without recording it, and the inherited
`close()` calls `finish()` again, which XZ for Java rejects with `XZIOException: Stream finished or closed` (empty streams
and streams with data alike). The idiomatic `out.finish(); out.close()` — and any try-with-resources around a stream that
was finished — therefore fails; gzip (see its own bug), bzip2, lzma, deflate and the LZ4/Snappy streams accept it.
'''

[[bug]]
id = "commons-compress/36"
title = "BlockLZ4CompressorOutputStream.finish() on a stream with no data throws IndexOutOfBoundsException"
kind = "crash"
severity = "medium"
test = "lz4BlockFinishThenCloseOnEmptyStream"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`BlockLZ4CompressorOutputStream.finish()` → `writeFinalLiteralBlock`/`Pair` handling indexes the pending list
(`pairs.get(pairs.size() - 1)` or the equivalent) without checking that anything was written, so compressing zero bytes
fails with `java.lang.IndexOutOfBoundsException: Index: 0, Size: 0` from `finish()`/`close()`. An empty LZ4 block
(a single token byte `00`... or an empty output) is legal; the framed LZ4 stream and every other compressor handle empty
input.
'''

