[[bug]]
id = "commons-compress/33"
title = "The FHCRC header checksum is read but never verified"
kind = "contract"
severity = "low"
test = "gzipHeaderCrcIsVerified"
found = { commit = "62f794ce81f80dc2bec2c26efdc5e62a2b94f617", version = "1.29.0-SNAPSHOT (2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
