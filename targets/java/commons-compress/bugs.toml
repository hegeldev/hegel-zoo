notes = '''
`ZCompressorInputStream` takes `maxCodeSize = thirdByte & 0x1f` with no upper bound; `LZWInputStream.initializeTables`
then allocates three arrays of `1 << maxCodeSize` entries (the memory guard only applies when a memory limit was given,
and the one-argument constructor passes -1). compress(1) and gzip accept maxbits 9–16 only; `1f 9d 9e` (maxbits 30) is a
