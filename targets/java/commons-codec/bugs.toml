[[bug]]
id = "commons-codec/4"
title = "Strict quoted-printable encoding emits lines of 77 or 78 characters, over RFC 1521's limit of 76"
kind = "contract"
severity = "medium"
test = "pinStrictQuotedPrintableLinesFitInSeventySix"
found = { commit = "f49b96388c2d97d093d8669cf74f57a5a92e7dff", version = "1.23.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
QuotedPrintableCodec(true) implements rule #5 ("Encoded lines must not be longer than 76
characters, not counting the trailing CRLF"; the soft line break's "=" counts). The encoder adds
bytes while its position is below SAFE_LENGTH = 73 and then encodes one more byte before the soft
break; an escaped byte adds 3 characters, so a position of 72 followed by two escaped bytes gives
71 + 3 + 3 + 1 = 78 characters before the CRLF. 71 'a's followed by two 0xFF bytes and "xyz"
encode to a 78-character first line; roughly 7% of random 100-250 byte inputs hit 77 or 78.
Decoders that enforce the limit (or fixed 76-column buffers) reject such lines.
'''

