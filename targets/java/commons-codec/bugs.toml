[[bug]]
id = "commons-codec/5"
title = "Crypt accepts a malformed \"rounds=\" specification and hashes with the literal salt \"rounds\", which libc rejects"
kind = "contract"
severity = "low"
test = "pinMalformedRoundsSaltIsRejected"
found = { commit = "f49b96388c2d97d093d8669cf74f57a5a92e7dff", version = "1.23.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Crypt.crypt(String, String) promises output "identical with that of the libc implementation" and
an IllegalArgumentException for an invalid salt. Sha2Crypt's salt pattern makes the rounds group
optional ("^\\$([56])\\$(rounds=(\\d+)\\$)?([\\./a-zA-Z0-9]{1,16}).*"), so for
"$6$rounds=abc$xyz" the group does not match, the salt characters "rounds" match the next group
and ".*" swallows "=abc$xyz": the result is "$6$rounds$..." with 5000 rounds and salt "rounds".
libc (glibc 2.39 / libxcrypt, through Python's crypt) returns failure ("*0") for the same string,
as it does for "$6$rounds=$abc" and "$5$rounds=abc$xyz". Well-formed salts, rounds and
verification with a stored hash agreed with libc in every generated case.
'''

