[[bug]]
id = "commons-codec/7"
title = "Nysiis skips its documented final step 8 (collapse repeated characters), so \"Yaay\" encodes to \"YY\""
kind = "contract"
severity = "low"
test = "pinNysiisCollapsesRepeatedLetters"
found = { commit = "f49b96388c2d97d093d8669cf74f57a5a92e7dff", version = "1.23.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The class Javadoc lists the algorithm as nine steps; step 8 "Collapse all strings of repeated
characters" comes after step 5 (drop a final S), step 6 (final AY -> Y) and step 7 (drop a final
A). The implementation only refuses to append a character equal to the previous one while
transcoding (step 4j) and never collapses afterwards, so a key whose step-6 rewrite creates a
double letter keeps it: "Yaay" transcodes to the key YAY, step 6 makes it YY, and encode returns
"YY" (strict and non-strict alike); "MntWkSqYaaIE" gives "MNTWCSGYY". A NYSIIS key never contains a
doubled letter in the reference description the class cites.
'''

