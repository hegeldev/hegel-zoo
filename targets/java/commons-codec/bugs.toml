[[bug]]
id = "commons-codec/3"
title = "Blake3.doFinalize restarts the extensible output at block 0 on every call, so the documented KDF example derives two identical keys"
kind = "contract"
severity = "high"
test = "pinBlake3FinalizeContinuesTheOutputStream"
found = { commit = "f49b96388c2d97d093d8669cf74f57a5a92e7dff", version = "1.23.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Blake3.doFinalize(byte[]) is documented as "Finalizes hash output data that depends on the
sequence of updated bytes preceding this invocation and any previously finalized bytes. Note that
this can finalize up to 2^64 bytes per instance", doFinalize(int) as squeezing bytes "dependent on
the sequence of previously absorbed and squeezed bytes", and the class Javadoc's key-derivation
example calls kdf.doFinalize(txKey) then kdf.doFinalize(rxKey) to obtain two session keys.
Output.rootOutputBytes starts its outputBlockCounter at 0 on every call, so every doFinalize
returns the same first bytes of the output stream: txKey equals rxKey, and two doFinalize(16)
calls return the first 16 bytes twice instead of bytes 0-15 and 16-31 (which a single
doFinalize(32) does return). BLAKE3's reference OutputReader continues the stream across reads.
Anyone following the example derives the same key for both directions.
'''

