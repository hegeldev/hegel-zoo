[[bug]]
id = "commons-codec/2"
title = "Lenient Base32 decoding of a dangling trailing character (length 1 mod 8) emits a phantom byte"
kind = "wrong-result"
severity = "low"
test = "pinLenientBase32IgnoresADanglingCharacter"
found = { commit = "f49b96388c2d97d093d8669cf74f57a5a92e7dff", version = "1.23.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
"MFRGGZDF" is the Base32 of "abcde". Appending one character adds 5 bits, which cannot form a byte:
BaseNCodec's class Javadoc says lenient decoding composes trailing bits "into 8-bit bytes where
possible" and discards the remainder, and Base64 does exactly that for a dangling character
(decode("YWJj" + "Q") is "abc"). Base32.decode("MFRGGZDFA") returns [97, 98, 99, 100, 101, 40]:
the decode switch's "case 1: // 5 bits - either ignore entirely, or raise an exception" calls
validateTrailingCharacters() and then falls through into case 2, which writes a byte from the 5
bits shifted as if 10 were present. Strict mode rejects the input, as documented. The hex
alphabet and custom pads behave the same way.
'''

