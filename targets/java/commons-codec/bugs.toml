[[bug]]
id = "commons-codec/6"
title = "ColognePhonetic's context rules look at punctuation between letters, so \"Brandt-Cohn\" and \"BrandtCohn\" encode differently"
kind = "wrong-result"
severity = "low"
test = "pinColognePhoneticIgnoresPunctuationInContextRules"
found = { commit = "f49b96388c2d97d093d8669cf74f57a5a92e7dff", version = "1.23.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The class documents step 1 as "conversion to upper case, transcription of germanic umlauts,
removal of non alphabetical characters" before the letter rules are applied ("Müller-Lüdenscheidt"
-> "MULLERLUDENSCHEIDT" in its own example). preprocess() only upper-cases and maps the umlauts;
the main loop skips non-letters when they are the current character but reads them as nextChar
for the rules "D, T not before C, S, Z", "P before H" and "C before A, H, K, O, Q, U, X". In
"Brandt-Cohn" the T sees "-" instead of C and is coded 2 (not before C/S/Z) rather than 8, giving
"176246" while "BrandtCohn" and "Brandt Cohn" without the separator give "1762846". Spaces and
apostrophes do the same, and so do letters outside A-Z that the umlaut mapping does not cover:
"téc" is "28" (the T sees É, not C) while "tec" and "tc" are "8".
'''

