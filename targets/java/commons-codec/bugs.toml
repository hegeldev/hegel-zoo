# Bugs found in Apache Commons Codec by the Hegel zoo. One [[bug]] per finding; `test` names the
# JUnit pin in hegel/src/test/java/zoo/CodecPinsTest.java that fails while the bug exists (listed
# under [expected_failures] in target.toml). Oracles: RFC 4648/9285 models of the Base-N codecs,
# libc crypt(3) through Python, reference ports of MurmurHash and xxHash, java.util.zip, JCA, Git's
# object format, and the RFCs and algorithm descriptions the classes cite. Upstream follows the ASF
# Generative Tooling Guidance (disclosure on contributions); no prohibition (README,
# CONTRIBUTING.md, .github/ checked 2026-09-18).

[[bug]]
id = "commons-codec/1"
title = "Base58.getEncodedLength throws ArithmeticException (/ by zero) for every input"
kind = "crash"
severity = "medium"
test = "pinBase58EncodedLengthDoesNotThrow"
found = { commit = "f49b96388c2d97d093d8669cf74f57a5a92e7dff", version = "1.23.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "fixed"
upstream_issue = ""
fixed_in = "1.23.0-SNAPSHOT (7bc15f1cb49e)"
notes = '''
Base58 (new in 1.22.0) accumulates the whole input and converts it with BigInteger arithmetic, so
it configures BaseNCodec with unencoded and encoded block sizes of 0. BaseNCodec.getEncodedLength
computes the length from those block sizes ((n + unencodedBlockSize - 1) / unencodedBlockSize *
encodedBlockSize) and divides by zero. new Base58().getEncodedLength(new byte[] {0, 0, 1, 2, -1})
throws for any array, including the empty one; the public method is inherited and documented
("Calculates the amount of space needed to encode the supplied array") and the other five codecs
answer it. The pin only asks for a number that is at least the actual encoded length.
'''

