name = "commons-codec"
language = "java"
upstream = "https://github.com/apache/commons-codec"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-18"  # ASF Generative Tooling Guidance (disclosure on PRs); README, CONTRIBUTING.md, .github/: no prohibition

[base]
commit = "eec585d1e8215c36b48951b901772837adac4183"
date = "2026-09-17"
version = "1.23.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install the library into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on that version — update `commons-codec.version` there when a bump changes
# it). Tests, javadoc, sources and the release checks are skipped.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Drat.skip=true -Dpmd.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true -Djapicmp.skip=true -Dcyclonedx.skip=true -Danimal.sniffer.skip=true -Dspotless.check.skip=true install",
]

[expected_failures]
pinBase58EncodedLengthDoesNotThrow = "commons-codec/1"
pinLenientBase32IgnoresADanglingCharacter = "commons-codec/2"
pinBlake3FinalizeContinuesTheOutputStream = "commons-codec/3"
pinStrictQuotedPrintableLinesFitInSeventySix = "commons-codec/4"
pinMalformedRoundsSaltIsRejected = "commons-codec/5"
pinColognePhoneticIgnoresPunctuationInContextRules = "commons-codec/6"
pinNysiisCollapsesRepeatedLetters = "commons-codec/7"
