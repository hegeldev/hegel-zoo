# Bugs found in fastutil by the Hegel properties in hegel.patch. Each has a pin (a `pin...` test
# method in hegel/src/test/java/zoo/PinsTest.java) listed in target.toml's [expected_failures].

[[bug]]
id = "fastutil/1"
title = "removeAll with a fastutil collection argument removes only the first occurrence of each element from lists that inherit AbstractIntCollection's implementation: the sub lists of IntArrayList and IntBigArrayBigList keep the duplicates the same call with a HashSet argument removes"
severity = "medium"
kind = "wrong-result"
status = "open"
found = { commit = "46316b125eeb75fe42ab0bfed6e25bf756de8117", version = "8.5.19", hegel = "0.6.0", date = "2026-09-19" }
property = "listsMatchTheJavaUtilModel"
pin = "pinSubListRemoveAllRemovesEveryOccurrence"
notes = """
`new IntArrayList(new int[] {9, 1, -4, 5, 5, 9}).subList(1, 5).removeAll(IntList.of(5, 1))` returns true and
leaves `[-4, 5]`; `removeAll(new HashSet<>(List.of(5, 1)))` on the same sub list leaves `[-4]`, as does
`removeAll(IntList.of(5, 1))` on the `IntArrayList` itself (which overrides the method) and on an
`IntBigArrayBigList` (likewise), while the big list's `subList(1, 5)` keeps the duplicate too.
`AbstractIntCollection.removeAll(IntCollection c)` is `for each x in c: if (rem(x)) changed = true` -
`rem` removes a single occurrence - whereas `removeAll(Collection)` falls through to
`AbstractCollection.removeAll`, which iterates the receiver. Every type-specific abstract collection is
generated from the same template (`drv/AbstractCollection.drv`), so `AbstractLongCollection`,
`AbstractDoubleCollection` etc. share it; `retainAll(IntCollection)` iterates the receiver and is right.
"""

[[bug]]
id = "fastutil/2"
title = "IntIterators.fromTo and IntSpliterators.fromTo with to below from iterate nothing but report negative counts: skip returns to - from, estimateSize is to - from, and IntSets.fromTo throws NoSuchElementException on construction"
severity = "low"
kind = "contract"
status = "open"
found = { commit = "46316b125eeb75fe42ab0bfed6e25bf756de8117", version = "8.5.19", hegel = "0.6.0", date = "2026-09-19" }
property = "iteratorsAndSpliteratorsWalkTheirSequences"
pin = "pinBackwardsFromToIsEmpty"
notes = """
`IntIterators.fromTo(5, 3)` has `hasNext()` false and `hasPrevious()` false, but `skip(1)` returns -2 (the
contract: the number of elements actually skipped); `IntSpliterators.fromTo(5, 3)` iterates nothing and
`tryAdvance` is false, but `estimateSize()` is -2 (`Spliterator` requires a non-negative estimate or
Long.MAX_VALUE) and `trySplit()` returns a spliterator rather than null; `IntSets.fromTo(5, 3)` throws
`NoSuchElementException` from the constructor. `IntStream.range(5, 3)` is empty with size 0. The
interval iterator computes `to - from` without clamping (`IntIterators.IntervalIterator.skip`,
`IntSpliterators.IntervalSpliterator.estimateSize`); `fromTo(3, 3)` is fine. Every type-specific
variant is generated from the same templates.
"""

[[bug]]
id = "fastutil/3"
title = "DoubleArrays.radixSortIndirect and FloatArrays.radixSortIndirect with stable = true reorder equal NaN keys: the quicksort fallback used for arrays and radix buckets below 1024 elements stabilizes with != so a run of NaNs is never sorted by index"
severity = "low"
kind = "contract"
status = "open"
found = { commit = "46316b125eeb75fe42ab0bfed6e25bf756de8117", version = "8.5.19", hegel = "0.6.0", date = "2026-09-19" }
property = "floatingPointSortsOrderLikeJavaUtil"
pin = "pinIndirectRadixSortKeepsNaNTiesInOrder"
notes = """
`radixSortIndirect(perm, a, from, to, stable)` for fewer than `RADIXSORT_NO_REC` (1024) elements runs
`quickSortIndirect` and then `stabilize(perm, a, from, to)`, which delimits runs of equal keys with
`x[perm[i]] != x[perm[curr]]` and sorts each run's indices. NaN != NaN, so every NaN is a run of its own
and the NaN block keeps whatever order quicksort left it in: with 200 elements, a[i] = NaN for i % 3 == 0
and (i * 7919) % 101 otherwise, the identical NaNs come out with index 150 before index 45. Longer arrays
take the same fallback for every radix bucket of fewer than 1024 elements, and NaN's first byte (0x7f
after the sign fix) is shared with +Infinity and the finite values from 2^1020 up: the 1200-element
variant with Double.MAX_VALUE at i % 5 == 0 fails at position 1040, while the 1200-element variant
whose 0x7f bucket holds only NaNs is stable (the bucket is quicksorted as all-equal keys). FloatArrays
shares the template (its stabilize uses != as well); the direct `radixSort(double[])` places NaN like
`Arrays.sort`. Comparing with `Double.compare` in `stabilize`, as `insertionSortIndirect` does, would
fix it.
"""

[[bug]]
id = "fastutil/4"
title = "The singleton iterators report skip(n) = 1 without advancing, and back(n) = 1 without moving back: after IntIterators.singleton(x).skip(1) hasNext is still true and nextInt still returns x; the iterators of IntSets.singleton, IntLists.singleton, IntSet.of(x), IntList.of(x), Int2IntMaps.singleton key sets and ObjectIterators.singleton behave the same"
severity = "low"
kind = "contract"
status = "open"
found = { commit = "46316b125eeb75fe42ab0bfed6e25bf756de8117", version = "8.5.19", hegel = "0.6.0", date = "2026-09-19" }
property = "wrappersAndSingletonsKeepTheContract"
pin = "pinSingletonIteratorSkipAdvances"
notes = """
`IntIterators.singleton(7).skip(1)` returns 1 (one element skipped, per the contract of `skip`) but the
iterator still has `hasNext() == true` and `nextInt()` returns 7; `skip(2)` also returns 1 and leaves the
element in place; after `nextInt()`, `skip(1)` correctly returns 0. `IntArrayList`'s and
`IntOpenHashSet`'s one-element iterators are consumed by `skip(1)`. `IntIterators.SingletonIterator.skip`
is `if (n == 0 || curr > 0) return 0; curr = 0; return 1;`: the assignment should be `curr = 1`, so the
cursor stays before the element while a skipped element is reported. `back` has the mirror-image error
(`if (n == 0 || curr < 1) return 0; curr = 1; return 1;` should store `curr = 0`): after `nextInt()`,
`back(1)` returns 1 yet `hasNext()` stays false and `hasPrevious()` true. All the type-specific
singleton iterators and `ObjectIterators.singleton` come from the same Iterators.drv template.
"""

[[bug]]
id = "fastutil/5"
title = "IntLists.unmodifiable(list).size(n) resizes the wrapped list: the unmodifiable list and big-list wrappers forward size(int) and size(long) to the backing list instead of throwing UnsupportedOperationException"
severity = "medium"
kind = "contract"
status = "open"
found = { commit = "46316b125eeb75fe42ab0bfed6e25bf756de8117", version = "8.5.19", hegel = "0.6.0", date = "2026-09-19" }
property = "wrappersAndSingletonsKeepTheContract"
pin = "pinUnmodifiableListSizeThrows"
notes = """
`IntLists.UnmodifiableList.size(int)` is `list.size(size)`, so
`IntLists.unmodifiable(new IntArrayList(new int[] {1, 2, 3})).size(5)` grows the backing list to
[1, 2, 3, 0, 0] and `.size(1)` truncates it to [1], both visible through the view. Every other mutator of
the wrapper (add, set, removeElements, addElements, setElements, sort, unstableSort, replaceAll,
removeIf, clear) throws UnsupportedOperationException, and `IntLists.singleton`, `IntLists.EMPTY_LIST`
and `IntImmutableList` all throw from `size(int)`. `IntBigLists.UnmodifiableBigList.size(long)` forwards
in the same way. The type-specific and object variants are generated from the same Lists.drv and
BigLists.drv templates.
"""

[[bug]]
id = "fastutil/6"
title = "IntArrayFrontCodedList.hashCode is not repeatable: it is AbstractObjectList's element hash over the int[] arrays get(i) decodes afresh on every call, so the same list returns a different hash code each time and cannot be used as a hash key (the Long, Char, Short and Byte variants too)"
severity = "medium"
kind = "contract"
status = "open"
found = { commit = "46316b125eeb75fe42ab0bfed6e25bf756de8117", version = "8.5.19", hegel = "0.6.0", date = "2026-09-19" }
property = "frontCodedAndImmutableListsReadLikeTheirSource"
pin = "pinFrontCodedListHashCodeIsRepeatable"
notes = """
`IntArrayFrontCodedList` extends `AbstractObjectList<int[]>` and does not override `hashCode`, so the
inherited implementation sums `31 * h + k.hashCode()` over the elements; every `get(i)` builds a new
`int[]` (the class documents that the returned array may be freely modified), and `int[].hashCode()` is
the identity hash, so `l.hashCode() != l.hashCode()` for any non-empty list whose arrays are non-empty
(the list [[1, 2], [1, 3], [2]] with ratio 2 gave 1328695442 then -2099407555). `clone()` returns `this`,
so `l.clone().hashCode() != l.hashCode()` while `l.equals(l.clone())`; a `HashSet` containing the list
does not contain its clone. For the same reason `equals` between two lists built from the same arrays
is false (identity comparison of the decoded arrays). The other array front-coded lists
(`LongArrayFrontCodedList`, `CharArrayFrontCodedList`, ...) come from the same ArrayFrontCodedList.drv
template and behave alike. A hash over `Arrays.hashCode(getArray(i))` (and an `equals` to match) would
make the class usable as a key.
"""
