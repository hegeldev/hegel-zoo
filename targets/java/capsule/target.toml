name = "capsule"
language = "java"
upstream = "https://github.com/usethesource/capsule"
subdir = ""
license = "BSD-2-Clause"
# README, LICENSE and the workflows say nothing about AI assistance; there is no CONTRIBUTING.md, CLAUDE.md, AGENTS.md
# or copilot-instructions. Nothing prohibits AI-written tests; an upstream report should still say how they were made.
ai_policy_checked = "2026-09-16"

[base]
commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b"
date = "2026-09-10"
version = "0.7.3-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# The library is installed into the local Maven repository from the pinned tree (upstream builds with Maven or Gradle;
# the license-header check, JaCoCo and the sources jar are skipped; about half a minute). The tests need nothing else.
setup = [
  "mvn -q -B -ntp -DskipTests -Dlicense.skip=true -Djacoco.skip=true -Dmaven.source.skip=true install",
]

[expected_failures]
mapEntrySetContainsTestsEntries = "capsule/1"
transientPutOfAnEqualValueReturnsTheOldValueInCollisionNodes = "capsule/2"
transientPutAllOfUnchangedMappingsReportsNoChange = "capsule/3"
insertOfASetOntoASingletonCountsEveryTuple = "capsule/4"
transientPutOfTheSameValuesReportsNoChange = "capsule/5"
relationTransientInsertOfPresentValuesReportsNoChange = "capsule/6"
relationPutKeepsTheInverseInSync = "capsule/7"
setOfTwoEqualElementsHoldsOne = "capsule/8"
mapEntryEqualsIsSymmetric = "capsule/9"
transientPutOfNullFailsAtomically = "capsule/10"
arrayViewListIteratorMovesBackwards = "capsule/11"
transientIteratorRemoveFollowsTheContract = "capsule/12"
specialisedSupplierIteratorGetReturnsTheValue = "capsule/13"
specialisedIteratorsThrowNoSuchElementException = "capsule/14"
