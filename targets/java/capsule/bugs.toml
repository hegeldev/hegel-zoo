`AbstractTransientTrieSetMultimap.__put(key, values)` (`:136`) and `__put(key, value)` through it return true whenever the
node reports `REPLACED_PAYLOAD`, and `updatedSingle`/`updatedMultiple` report it unconditionally, also when the new
