'''

[[bug]]
id = "capsule/7"
title = "BinaryRelation __put(key, value) puts into the inverse as well and desynchronises the two sides"
kind = "silent-corruption"
severity = "high"
test = "relationPutKeepsTheInverseInSync"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`PersistentBidirectionalTrieSetMultimap.__put(key, value)` (`:165`) is `wireTuple(key, value, fwd::__put, bwd::__put)`:
the forward multimap replaces all values of `key` by `value` and the inverse replaces all keys of `value` by `key`, two
independent map-semantic operations that do not describe the same relation. `{1→a, 2→a}.__put(3, a)` gives the forward
`{1→a, 2→a, 3→a}` and the inverse `{a→3}`; `{1→a, 1→b}.__put(1, c)` gives the forward `{1→c}` and the inverse
`{a→1, b→1, c→1}`, after which `containsValue(b)` (a lookup in the inverse) is true for a value the relation no longer
holds and a later transient `__remove(1)` leaves an empty relation whose inverse still has `{a→1, b→1}`. The transient
(`:336`) does the same; `freeze()` keeps the desynchronised pair and `equals`/`hashCode` look at the forward side only.
The class deliberately refuses the other map-semantic operations (`__remove(key)` and `__put(key, set)` throw
`UnsupportedOperationException("Map semantic unavailable @ Bidirectional Multi-Map")`); `__put(key, value)` should
either be refused too or remove the old tuples of `key` from the inverse.
'''

[[bug]]
id = "capsule/8"
title = "Set.Immutable.of(a, b) with equal elements builds a two-element set holding the element twice"
kind = "wrong-result"
severity = "high"
test = "setOfTwoEqualElementsHoldsOne"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`PersistentTrieSet.of(key0, key1)` (`PersistentTrieSet.java:71`) guards the duplicate case with a Java `assert` only and
then calls `mergeTwoKeyValPairs`, which recurses to the bottom of the trie and makes a `HashCollisionSetNode` holding the
element twice: `Set.Immutable.of(7, 7)` prints `{7, 7}`, has `size()` 2 and `hashCode()` 14, is not equal to `{7}`, and
`__remove(7)` leaves a set of size 1 that still contains 7. With assertions enabled (`-ea`, as under surefire) the
factory throws an `AssertionError` wrapped in the reflective `DefaultSetFactory`'s `RuntimeException` instead. The
varargs `of(K...)` and `transientOf(K...)` deduplicate, and `AbstractSpecialisedImmutableSet.setOf(a, a)` throws
`IllegalArgumentException`.
'''

[[bug]]
id = "capsule/9"
title = "The specialised maps' Map.Entry compares classes in equals, so it is not equal to an equal entry of another class"
kind = "contract"
severity = "medium"
test = "mapEntryEqualsIsSymmetric"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`AbstractSpecialisedImmutableMap.MapEntry.equals` (`:207`) returns false unless `getClass() == o.getClass()`, while
`java.util.Map.Entry` defines equality by key and value: `entry.equals(new SimpleEntry<>("a", 1))` is false although
`new SimpleEntry<>("a", 1).equals(entry)` is true (asymmetric), and `entry.equals(Map.entry("a", 1))` is false. The
entries come out of `mapOf(...)` maps' `entryIterator()`/`entrySet()` and of the public `entryOf(key, value)`; `hashCode`
follows the contract.
'''

[[bug]]
id = "capsule/10"
title = "Transient map __put(existingKey, null) mutates the node before throwing and leaves the map unusable"
kind = "silent-corruption"
severity = "medium"
test = "transientPutOfNullFailsAtomically"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Null values are refused with a `NullPointerException`, but `TransientTrieMap.__put` (`PersistentTrieMap.java:1972`)
first updates the node in place (`copyAndSetValue` with the transient's mutator token) and only then evaluates
`val.hashCode()`. After `t.__put("a", null)` throws, `t.get("a")` throws (`findByKey` wraps the stored value in
`Optional.of`, `:846`), `t.equals(...)`, `t.__remove("a")` and `t.hashCode()` are broken or stale, and `freeze()` returns
a map printing `{a: null, b: 2}` whose `get("a")` throws. The immutable `__put(key, null)` fails atomically, and a null
value for a new key fails atomically in the transient as well.
'''

[[bug]]
id = "capsule/11"
title = "ArrayView.iterator() is a ListIterator that goes wrong backwards"
kind = "wrong-result"
severity = "low"
test = "arrayViewListIteratorMovesBackwards"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The default `iterator()` of the public interface `io.usethesource.capsule.core.trie.ArrayView` (`ArrayView.java:52`)
returns a `ListIterator` whose `hasPrevious()` is `current >= 0` (true on a fresh iterator), whose `previous()` is
`get(previous = current--)` (the element *after* the cursor, an `ArrayIndexOutOfBoundsException` at the end) and whose
`nextIndex()` is `current + 1` (3 after two `next()` calls on a three-element view). Forward iteration, the only use
inside the library, is correct.
'''

[[bug]]
id = "capsule/12"
title = "Transient iterator remove() before next() throws NullPointerException and a repeated remove() is a silent no-op"
kind = "wrong-exception"
severity = "low"
test = "transientIteratorRemoveFollowsTheContract"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`TransientTrieSet`'s and `TransientTrieMap`'s iterators implement `remove()` as `collection.__remove(lastKey)`
(`PersistentTrieSet.java:1939`, `PersistentTrieMap.java:2098`) without tracking whether `next()` was called: before the
first `next()` the key is null and `__remove` throws `NullPointerException`; after a `remove()` a second `remove()`
silently removes nothing. `java.util.Iterator` specifies `IllegalStateException` for both. Removal during iteration
otherwise keeps size, hash code and content consistent.
'''

