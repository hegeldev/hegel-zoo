[[bug]]
id = "capsule/6"
title = "BinaryRelation transient __insert(key, set) reports a change when nothing was inserted"
kind = "contract"
severity = "low"
test = "relationTransientInsertOfPresentValuesReportsNoChange"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
