# Bugs found in Capsule by the Hegel zoo. Pins: hegel/src/test/java/zoo/CapsulePinsTest.java.

[[bug]]
id = "capsule/1"
title = "entrySet().contains(o) of the trie map and of the multimaps tests containsKey(o)"
kind = "contract"
severity = "medium"
test = "mapEntrySetContainsTestsEntries"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`PersistentTrieMap.entrySet()` (and the transient's, `PersistentTrieMap.java:370` and `:2259`) and
`AbstractTrieSetMultimap.entrySet()` (`AbstractTrieSetMultimap.java:427`) return an `AbstractSet` whose `contains(Object)`
is `containsKey(o)`. So `map.entrySet().contains(Map.entry(k, v))` is false for every entry of the map while
`map.entrySet().contains(k)` is true, `entrySet().containsAll(...)`, `retainAll`, `removeAll` and
`Collections.disjoint` on the view are wrong, and `map.entrySet().equals(hashMap.entrySet())` is false while
`hashMap.entrySet().equals(map.entrySet())` is true. The specialised maps (`Map1`..`Map5`) get this right.
'''

[[bug]]
id = "capsule/2"
title = "Transient map __put of an existing key with an equal value returns null from a hash-collision node"
kind = "inconsistent"
severity = "low"
test = "transientPutOfAnEqualValueReturnsTheOldValueInCollisionNodes"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Map.Transient.__put(key, value)` returns the previous value, like `java.util.Map.put`. In a bitmap node
(`PersistentTrieMap.java:872`) re-putting the same value records `details.updated(currentVal)` and returns it, but
`HashCollisionMapNode.updated` (`:1424`) returns `this` without recording anything when `Objects.equals(currentVal, val)`,
so `TransientTrieMap.__put` (`:1975`) sees no modification and returns null. Two keys whose hash codes collide give
`t.__put(a, 5); t.__put(b, 6); t.__put(a, 5)` → null, while the same on a map without the collision returns 5. The
`put()` override added for `Map.compute` support inherits the difference.
'''

[[bug]]
id = "capsule/3"
title = "Transient map __putAll reports a modification for a mapping that was already present"
kind = "contract"
severity = "low"
test = "transientPutAllOfUnchangedMappingsReportsNoChange"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`TransientTrieMap.__putAll` (`PersistentTrieMap.java:2009`) sets `modified` when `!isPresent || replaced != null`; a
present key re-put with an equal value returns the old value (non-null), so `Map.Transient.of(1, 5).__putAll(Map.of(1, 5))`
is true. `AbstractSpecialisedImmutableMap.__putAll` builds on it and therefore returns a new `PersistentTrieMap` instead of
`this` for an unchanged map.
'''

[[bug]]
id = "capsule/4"
title = "SetMultimap __insert(key, set) of two or more values onto a key holding one value miscounts size()"
kind = "wrong-result"
severity = "high"
test = "insertOfASetOntoASingletonCountsEveryTuple"
found = { commit = "3e0da2d0cf7f0b6a9b9e54a7a18c6c36f4df6d2b", version = "0.7.3-SNAPSHOT (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`PersistentTrieSetMultimap.java:865`, the singleton-to-collection branch of the bitmap node's `insertedMultiple`:
`sizeDelta = 2 * values.size() - mergedValues.size()` where the delta of tuples is `mergedValues.size() - 1`. For
`of().__insert(39, 5).__insert(39, Set.of(15, 18))` the multimap holds three tuples (`get(39)` is `{5, 15, 18}`,
`entryIterator` yields three) but `size()` is 2; with the existing value inside the set (`__insert(1, Set.of(10, 30))`
onto `1 → 10`) `size()` is 3 for two tuples. The cached size is wrong for good: `values().size()`, `entrySet().size()`,
`tupleStream().count()`, `isEmpty()` and `equals` (which compares cached sizes first, in both directions) all disagree
with the content afterwards, so two multimaps with identical tuples are unequal while their hash codes agree. Immutable
and transient (`AbstractPersistentTrieSetMultimap:80`, `AbstractTransientTrieSetMultimap:85`) and the bidirectional
relation's forward side (its inverse counts correctly, so `rel.size() != rel.inverse().size()`). The hash-collision
node's `insertedMultiple` (`:2506`) computes the delta correctly, which is why upstream's `testHashCollisionInsert`
(three keys with `hashCode() == 0`) passes.
'''

[[bug]]
