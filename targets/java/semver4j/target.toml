name = "semver4j"
language = "java"
upstream = "https://github.com/semver4j/semver4j"
subdir = ""
license = "MIT"
# CONTRIBUTING.md (tests for every change, given-when-then, AssertJ, spotless, issue first), README, the
# issue templates and .github/ say nothing about AI; no CLAUDE.md/AGENTS.md/copilot-instructions.
ai_policy_checked = "2026-09-16"

[base]
commit = "bd961f36a9933c463f95880360672ed08f7113ae"
date = "2026-09-01"
version = "0.0.1-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# The pom carries 0.0.1-SNAPSHOT (releases are versioned by tag; the last is v6.0.0, 2025-06-28). Javadoc, sources,
# signing, jacoco, spotless and animal-sniffer are skipped.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Dspotless.skip=true -Djacoco.skip=true -Danimal.sniffer.skip=true install",
  # node-semver, the oracle: hegel/node/package.json pins it; the tests start `node hegel/node/oracle.js`
  "cd hegel/node && npm install --no-package-lock --no-audit --no-fund --loglevel=error",
]

[expected_failures]
pin_longIdentifierCompare = "semver4j/1"
pin_alnumIdentifierOrder = "semver4j/2"
pin_caretKeptBesideComparators = "semver4j/3"
pin_caretZeroWildcard = "semver4j/4"
pin_bareWildcardOperand = "semver4j/5"
pin_ivyMixedBrackets = "semver4j/6"
pin_invalidRangeRefused = "semver4j/7"
pin_trailingOrSection = "semver4j/8"
pin_bigRangeNumber = "semver4j/9"
pin_trailingDotIdentifiers = "semver4j/10"
pin_hyphenIdentifierAboveNumeric = "semver4j/11"
pin_fluentAndAfterOr = "semver4j/12"
