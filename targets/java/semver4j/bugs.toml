# Bugs found in semver4j by the Hegel zoo. Pins: hegel/src/test/java/zoo/Semver4jPinsTest.java.

[[bug]]
id = "semver4j/1"
title = "compareTo throws NumberFormatException when a pre-release identifier has more than 19 digits"
kind = "crash"
severity = "medium"
test = "pin_longIdentifierCompare"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`new Semver("1.0.0-99999999999999999999").compareTo(new Semver("1.0.0-1"))` throws
`NumberFormatException: For input string: "99999999999999999999"`. SemVer 2.0.0 puts no bound on numeric
pre-release identifiers (the parser accepts them: only the core numbers are checked against Integer.MAX_VALUE), but
`internal.Comparator.compareIdentifiers` compares two all-digit identifiers with `Long.parseLong`, and
`checkAlphanumericPrerelease` does the same to the digit run of an alphanumeric identifier
(`1.0.0-rc99999999999999999999` vs `1.0.0-rc1`). node-semver compares both. Every comparison method
(`isGreaterThan`, `satisfies` with such a bound, sorting) inherits the exception. Fix: compare with `BigInteger`
(or by length then lexically, since neither has leading zeros).
"""

[[bug]]
id = "semver4j/2"
title = "Alphanumeric pre-release identifiers containing digits are compared out of ASCII order, and the order is not transitive"
kind = "wrong-result"
severity = "medium"
test = "pin_alnumIdentifierOrder"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
SemVer 2.0.0 section 11: "identifiers with letters or hyphens are compared lexically in ASCII sort order", and
numeric identifiers always have lower precedence than alphanumeric ones. `Comparator.checkAlphanumericPrerelease`,
used whenever both identifiers contain a digit and at least one is not all digits, instead splits them at
letter/digit boundaries, orders by the number of pieces, then by the first digit run as a number, and falls back to
a lexical compare of the remainders. Consequences (semver4j -> spec / node-semver): `1.0.0-a2` < `1.0.0-a10`
(spec: `a2` > `a10`), `1.0.0-1a` < `1.0.0-2` (spec: numeric `2` is lower), and `1.0.0-a1b2` > `1.0.0-b1`,
`1.0.0-b1` > `1.0.0-b`, `1.0.0-b` > `1.0.0-a1b2`: a cycle, so `compareTo` violates the `Comparable` contract and
`Collections.sort`/`TreeSet` over such versions can throw "Comparison method violates its general contract".
The class Javadoc says the implementation "adheres to the SemVer 2.0.0 specification".
"""

[[bug]]
id = "semver4j/3"
title = "A caret, tilde or hyphen range that shares a set with other comparators is dropped from the set"
kind = "wrong-result"
severity = "high"
test = "pin_caretKeptBesideComparators"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
npm ranges are sets of space-separated comparators ORed with `||`, and semver4j lists npm caret, tilde and hyphen
ranges as supported. `RangeExpressionParser.parse` hands each `||` section as a whole to the processors, and
`CaretProcessor`/`TildeProcessor`/`HyphenProcessor` match only when the *whole* section is one range (their patterns
are anchored). `XRangeProcessor` then splits the section on whitespace and silently drops every part its pattern
does not match, which is exactly the caret/tilde/hyphen part. So `^1.0.0 <1.5.0` becomes `<1.5.0` (0.5.0
satisfies it), `~1.2.3 >=1.2.5` becomes `>=1.2.5` (5.0.0 satisfies it), `^1.0.0 ^1.2.0` becomes an empty set that
no version satisfies, and `1.0.0 - 2.0.0 <1.5.0` is read as `=1.0.0 =2.0.0 <1.5.0` (the hyphen and its neighbours
become exact versions). node-semver gives `>=1.0.0 <2.0.0-0 <1.5.0`, `>=1.2.3 <1.3.0-0 >=1.2.5`,
`>=1.0.0 <2.0.0-0 >=1.2.0` and rejects the last. Fix: apply the processors per whitespace-separated comparator
(hyphen ranges first), as node-semver's `parseRange` does.
"""

[[bug]]
id = "semver4j/4"
title = "Caret ranges with major 0 and an open minor or patch (^0.x, ^0.0.x, ^0.0) get the wrong upper bound"
kind = "wrong-result"
severity = "medium"
test = "pin_caretZeroWildcard"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`CaretProcessor` chooses the upper bound with `major > 0`, `minor > 0`, else `patch + 1`, but an x-range component
is represented by -1 (`Utils.X_RANGE_MARKER`). `^0.0.x` (and `^0.0`) therefore becomes `>=0.0.0 <0.0.0`, which no
version satisfies (npm: `>=0.0.0 <0.1.0-0`), and `^0.x` becomes `>=0.0.0 <0.-1.0`, whose second comparator is not a
version and is dropped, leaving `>=0.0.0`: every version, 1.0.0 included, satisfies `^0.x` (npm: `>=0.0.0 <1.0.0-0`).
"""

[[bug]]
id = "semver4j/5"
title = "A wildcard standing for the whole version (x, >=*, ^*, ~*, 1.2.3 - *, >=1.0.0 *) matches nothing or is dropped"
kind = "wrong-result"
severity = "medium"
test = "pin_bareWildcardOperand"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Only the exact text `*` (and the empty range) is handled by `AllVersionsProcessor`. Everywhere else a wildcard in
the major position is -1 (`Utils.X_RANGE_MARKER`) and arithmetic is done on it: `x` and `X` alone become
`>=-1.0.0 <0.0.0` = `<0.0.0` (nothing; npm: `*`), `=*` and `<=*` likewise `<0.0.0`, `>=*` and `<*` become `>=-1.0.0`
which is not a version and is dropped (an empty set: nothing satisfies it), `^*` and `^x` an empty set, `~*`
`<0.0.0`, `1.2.3 - *` `>=1.2.3 <0.0.0` (nothing; npm: `>=1.2.3`), `1 - x` the same, and `>=1.0.0 *` becomes
`>=1.0.0 <0.0.0` (nothing; npm: `>=1.0.0`). node-semver treats every one of them as "any version" (`>*` happens
to come out right as `>=0.0.0`).
"""

[[bug]]
id = "semver4j/6"
title = "Ivy intervals mixing bracket styles ([1.0,2.0), (1.0,2.0], (1.0,2.0)) drop a bound or every version"
kind = "wrong-result"
severity = "medium"
test = "pin_ivyMixedBrackets"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Tokenizers.IVY` accepts `[`, `]` or `(` as the opening and `]`, `[` or `)` as the closing bracket with both bounds
present, and the `IvyProcessor` Javadoc says "Parentheses () ... indicate exclusive bounds". But the translation
only knows the four square-bracket forms and the half-open `[a,)`, `]a,)`, `(,b]`, `(,b[`: `[1.0,2.0)` falls into
the `)` branch and becomes `>=1.0.0` (3.0.0 satisfies it), `(1.0,2.0]` into the `(` branch and becomes `<=2.0.0`
(0.5.0 satisfies it), and `(1.0,2.0)` matches no branch, is returned unchanged, and yields an empty RangeList that
no version satisfies (while `isSatisfiedByAny()` says true). Either translate them as exclusive bounds or reject
them.
"""

[[bug]]
id = "semver4j/7"
title = "Comparators that are not ranges are silently dropped; an empty result still claims isSatisfiedByAny"
kind = "contract"
severity = "low"
test = "pin_invalidRangeRefused"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`RangeExpressionParser.addRanges` keeps only the whitespace-separated parts that match the comparator pattern and
ignores the rest, so `RangeListFactory.create("foo")` and `create(">==1.0.0")` give a RangeList with no sets (no
version satisfies it, yet `isSatisfiedByAny()` is true because `allMatch` over nothing is true), and
`create(">=1.0.0 garbage")` is `>=1.0.0`: a typo in a range widens or empties the match without a word. Versions
are validated (`SemverException`), unknown operators too (`RangeOperator.value` throws IllegalArgumentException),
and node-semver throws `TypeError: Invalid comparator`; ranges should be validated the same way.
"""

[[bug]]
id = "semver4j/8"
title = "A trailing || is ignored while a leading || matches every version"
kind = "wrong-result"
severity = "low"
test = "pin_trailingOrSection"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`RangeExpressionParser.parse` splits on `||` with `String.split`, which discards trailing empty strings. An empty
alternative is "any version" (`AllVersionsProcessor`), so `|| 1.0.0` is satisfied by 2.0.0 but `1.0.0 ||` and
`>=1.0.0 <2.0.0 || ` are not (they are `=1.0.0` and `>=1.0.0 <2.0.0`). node-semver reads all of them as `*`.
`split("\\\\|\\\\|", -1)` keeps the alternative.
"""

[[bug]]
id = "semver4j/9"
title = "A range number above Integer.MAX_VALUE throws NumberFormatException instead of SemverException"
kind = "crash"
severity = "low"
test = "pin_bigRangeNumber"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`new Semver("99999999999.0.0")` throws `SemverException: Value [99999999999] is too big`, but
`RangeListFactory.create(">=99999999999.0.0")`, `create("^99999999999")`, `create("~2147483648")`,
`create("[99999999999,)")` and `create("1.0.0 - 99999999999")` throw `NumberFormatException` from
`Utils.parseIntWithXSupport` (`Integer.parseInt`) in the processors, an exception the API does not declare and
`Semver.satisfies(String)` callers do not expect. The same guard as the version parser's (`BigInteger`, "too big")
would do.
"""

[[bug]]
id = "semver4j/10"
title = "withPreRelease/withBuild drop a trailing dot; \".\" clears the identifiers instead of being refused"
kind = "contract"
severity = "low"
test = "pin_trailingDotIdentifiers"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Modifier.withPreRelease`/`withBuild` split the argument with `String.split("\\\\.")`, which drops trailing empty
strings: `new Semver("1.2.3-alpha+build").withPreRelease(".")` returns `1.2.3+build` (the pre-release is cleared),
`withPreRelease("a.")` returns `1.2.3-a+build` and `withBuild(".")` returns `1.2.3-alpha`, while every other
malformed identifier list (`"a..b"`, `".a"`, `""`) is refused with `SemverException` because the rebuilt version
fails to parse. Validating the argument as `identifier(.identifier)*` (or splitting with limit -1) refuses them all.
"""

[[bug]]
id = "semver4j/11"
title = "A pre-release identifier beginning with a hyphen is ordered below numeric identifiers"
kind = "wrong-result"
severity = "low"
test = "pin_hyphenIdentifierAboveNumeric"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
SemVer 2.0.0 section 11: "Numeric identifiers always have lower precedence than alphanumeric identifiers".
`Comparator.compareIdentifiers` handles two numeric identifiers numerically, then falls back to `String.compareTo`
for a numeric versus an alphanumeric one, which happens to be right only because letters sort after digits in
ASCII; a hyphen (0x2d) sorts before them, so `1.0.0--` < `1.0.0-1` and `1.0.0--a` < `1.0.0-9` where the spec (and
node-semver) say greater. (`1.0.0-1a` vs `1.0.0-2` is wrong for the reason in semver4j/2.)
"""

[[bug]]
id = "semver4j/12"
title = "RangeExpression: an and() after an operand holding several sets starts a new set instead of joining the last"
kind = "wrong-result"
severity = "medium"
test = "pin_fluentAndAfterOr"
found = { commit = "bd961f36a9933c463f95880360672ed08f7113ae", version = "0.0.1-SNAPSHOT (after v6.0.0, 2026-09-01)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The fluent builder appends left to right like the text form (`and` = a space, `or` = `||`; the Javadoc example
`eq("1.0.0").and(less("2.0.0")).or(greaterOrEqual("3.0.0"))` is `=1.0.0 <2.0.0 || >=3.0.0`). `RangeExpression.and`
copies an operand's sets into the pending set, but when the operand has more than one set it flushes after each,
so the pending set is empty afterwards and the next `and` opens a fresh set:
`less("1.0.0").or(less("2.0.0").or(greaterOrEqual("5.0.0"))).and(eq("6.0.0"))` builds
`[[<1.0.0], [<2.0.0], [>=5.0.0], [=6.0.0]]` and 7.0.0 satisfies it, whereas the text
`<1.0.0 || <2.0.0 || >=5.0.0 =6.0.0` parses to `[[<1.0.0], [<2.0.0], [>=5.0.0, =6.0.0]]` and 7.0.0 does not (nor
does it under the algebraic reading `(a or b or c) and d`). The last set of the operand should stay pending.
"""
