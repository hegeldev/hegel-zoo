name = "commons-lang"
language = "java"
upstream = "https://github.com/apache/commons-lang"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-16"  # ASF Generative Tooling Guidance (disclosure on PRs); CONTRIBUTING.md, README, PR template: no prohibition

[base]
commit = "9c94f38ff471b131d02a46434455b214029d9d91"
date = "2026-09-19"
version = "3.21.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install commons-lang3 into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on that version — update `commons-lang.version` there when a bump changes
# it). Tests, javadoc, sources and the release checks are skipped. Needs Maven >= 3.9.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Drat.skip=true -Dpmd.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true -Djapicmp.skip=true -Dcyclonedx.skip=true -Danimal.sniffer.skip=true -Dspotless.check.skip=true install",
]

[expected_failures]
# Wide properties (CommonsLangTest, CommonsLangMoreTest): the generators draw the recorded shapes by
# default and each property is mapped to the bug it shrinks to; a shape drawn in a few percent of
# cases is intermittent at the default count.
stringUtilsSubstringsAndPaddingFollowTheirTables = { bug = "commons-lang/1", intermittent = true }
stringUtilsSearchSplitJoinAndReplaceAgreeWithStringModels = "commons-lang/3"
arrayUtilsFollowsItsClampingRules = "commons-lang/5"
numberUtilsCreateNumberFollowsItsGrammar = { bug = "commons-lang/11", intermittent = true }
fractionArithmeticMatchesBigIntegerRationals = "commons-lang/8"
conversionRoundTripsAndMatchesTheBitOrder = "commons-lang/7"
booleanEnumLocaleAndClassUtilsFollowTheirTables = "commons-lang/2"
buildersMutablesTuplesAndSerializationBehave = "commons-lang/6"
# Narrow properties (CommonsLangShapesTest): one per bug, over its shape region, the deterministic failure.
abbreviateKeepsTheLeftEdge = "commons-lang/1"
generateBitVectorRejectsNullElementsWithIAE = "commons-lang/2"
joinWithAnInvalidRangeThrowsAIOOBE = "commons-lang/3"
replaceEachRepeatedlyConvergesForLongChains = "commons-lang/4"
insertWithoutValuesChecksTheIndex = "commons-lang/5"
negativeRandomStringCountMessageNamesTheCount = "commons-lang/6"
intToHexDigitReturnsUpperCaseAsDocumented = "commons-lang/7"
powOfOneAndMinusOneIsReduced = "commons-lang/8"
normalizeSpaceCollapsesNoBreakSpaces = "commons-lang/9"
shortClassNameOfAnArrayOfADescriptorLetterClass = "commons-lang/10"
createNumberAcceptsAPlusWithTheLongSuffix = "commons-lang/11"
# Pins: the regression examples.
pinAbbreviateKeepsTheLeftEdge = "commons-lang/1"
pinGenerateBitVectorIterableRejectsNullWithIAE = "commons-lang/2"
pinJoinWithRangeThrowsAIOOBEAsDocumented = "commons-lang/3"
pinReplaceEachRepeatedlyConvergesForALongChain = "commons-lang/4"
pinInsertWithoutValuesChecksTheIndex = "commons-lang/5"
pinNegativeRandomStringCountMessageReportsTheCount = "commons-lang/6"
pinIntToHexDigitReturnsUpperCaseAsDocumented = "commons-lang/7"
pinPowReturnsAReducedFraction = "commons-lang/8"
pinNormalizeSpaceIsIdempotent = "commons-lang/9"
pinShortClassNameOfAnArrayOfAClassNamedC = "commons-lang/10"
pinCreateNumberAcceptsAPlusWithTheLongSuffix = "commons-lang/11"
