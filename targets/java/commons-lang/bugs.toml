[[bug]]
id = "commons-lang/1"
title = "StringUtils.abbreviate(str, marker, offset, maxWidth) drops the left-edge character it promises to keep when offset is marker.length() + 1 and maxWidth is at most offset + marker.length()"
kind = "contract"
severity = "low"
test = "pinAbbreviateKeepsTheLeftEdge"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc: "allows you to specify a 'left edge' offset. Note that this left edge is not
necessarily going to be the leftmost character in the result, or the first character following
the replacement marker, but it will appear somewhere in the result." The head branch
`if (offset <= abbrevMarkerLength + 1) return str.substring(0, maxWidth - abbrevMarkerLength) +
abbrevMarker` fires for `offset == abbrevMarkerLength + 1` (and any smaller positive offset)
without checking that the head is long enough to reach the offset: `abbreviate("abcdefghij", "...",
4, 7)` is `"abcd..."` — no `e` — while `abbreviate("abcdefghij", "...", 5, 7)` is `"...f..."`;
`abbreviate("abcdefghij", "~", 2, 3)` is `"ab~"` without the `c` while `(…, "~", 2, 4)` is
`"abc~"`. The property `stringUtilsSubstringsAndPaddingFollowTheirTables` checks the promise on
strings of distinct letters and skips the shape `1 <= offset <= marker.length() + 1 && maxWidth <=
offset + marker.length()`; the pin carries `("abcdefghij", "...", 4, 7)`.
'''

[[bug]]
id = "commons-lang/2"
title = "EnumUtils.generateBitVector(Class, Iterable) throws NullPointerException for a null element where its Javadoc promises IllegalArgumentException (the varargs form throws it)"
kind = "contract"
severity = "low"
test = "pinGenerateBitVectorIterableRejectsNullWithIAE"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`@throws IllegalArgumentException Thrown if enumClass is not an enum class or has more than 64
values, or if any values null.` The Iterable overload validates its elements with
`Objects.requireNonNull(constant, "null elements not permitted")` and so throws
`NullPointerException: null elements not permitted` for `generateBitVector(E.class,
Arrays.asList(E.A, null))`; the varargs overload validates with `Validate.noNullElements` and
throws `IllegalArgumentException: The validated array contains null element at index: 1` for the
same input. Only the exception type is wrong; the pin asserts the documented one.
'''

[[bug]]
id = "commons-lang/3"
title = "StringUtils.join(Object[], String, startIndex, endIndex) documents ArrayIndexOutOfBoundsException for an invalid range but throws IllegalArgumentException for a negative start and nothing at all for start >= length or end > length"
kind = "contract"
severity = "low"
test = "pinJoinWithRangeThrowsAIOOBEAsDocumented"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc of `join(final Object[] array, final String delimiter, final int startIndex, final int
endIndex)` lists `@throws ArrayIndexOutOfBoundsException` for `startIndex < 0`, `startIndex >=
array.length()`, `endIndex < 0` and `endIndex > array.length()`. The body is
`Streams.of(array).skip(startIndex).limit(Math.max(0, endIndex - startIndex))…`, so
`join(new Object[]{"a", "b", "c"}, ",", -1, 2)` throws `IllegalArgumentException: -1` from
`Stream.skip`, and `join(array, ",", 0, 4)`, `join(array, ",", 3, 3)` and `join(array, ",", 5, 9)`
return `"a,b,c"`, `""` and `""` without any exception. The primitive overloads (`join(int[], char,
start, end)`, `join(long[], …)`) throw the documented `ArrayIndexOutOfBoundsException`. The
property uses only valid ranges; the pin asserts the documented exception for `(-1, 2)` and `(0,
4)`.
'''

[[bug]]
id = "commons-lang/4"
title = "StringUtils.replaceEachRepeatedly gives up after a fixed five rounds and throws the \"endless loop\" IllegalStateException for a convergent chain of six replacements"
kind = "wrong-result"
severity = "medium"
test = "pinReplaceEachRepeatedlyConvergesForALongChain"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc: "Replaces all occurrences of Strings within another String. … repeat until there
are no more replacements … `@throws IllegalStateException Thrown if the search is repeating and
there is an endless loop due to outputs of one being inputs to another`". The loop budget is
`DEFAULT_TTL = 5` — a code comment says it is "deliberately independent of the caller-supplied
searchList length" — so `replaceEachRepeatedly("a", {"a","b","c","d","e","f"},
{"b","c","d","e","f","g"})`, a chain that converges to `"g"` in six rounds with no cycle, throws
`IllegalStateException: Aborting to protect against StackOverflowError - output of one loop is the
input of another`, while the five-step chain returns `"f"`. Any acyclic replacement chain longer
than five links is rejected as an endless loop. The property `stringUtilsSearchSplitJoinAndReplaceAgreeWithStringModels`
covers `replaceEach` only; the pin carries the six-link chain.
'''

[[bug]]
id = "commons-lang/5"
title = "ArrayUtils.insert(index, array) with no values returns a clone before the documented IndexOutOfBoundsException check, so an out-of-range index is accepted"
kind = "contract"
severity = "low"
test = "pinInsertWithoutValuesChecksTheIndex"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
Every `insert(final int index, final T[] array, final T... values)` overload documents `@throws
IndexOutOfBoundsException if index < 0 or index > array.length`. The bodies test `if
(ArrayUtils.isEmpty(values)) return clone(array);` before `if (index < 0 || index > array.length)
throw new IndexOutOfBoundsException(...)`, so `ArrayUtils.insert(99, new int[]{1, 2})` returns
`[1, 2]` while `ArrayUtils.insert(99, new int[]{1, 2}, 5)` throws. The property
`arrayUtilsFollowsItsClampingRules` inserts with values; the pin carries the empty case.
'''

[[bug]]
id = "commons-lang/6"
title = "RandomStringUtils.next/random with a negative count reports the end code point instead of the count in \"Requested random string length %,d is less than 0.\""
kind = "wrong-result"
severity = "low"
test = "pinNegativeRandomStringCountMessageReportsTheCount"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`random(int count, int start, int end, boolean letters, boolean digits, char[] chars, Random
random)` throws `new IllegalArgumentException(String.format("Requested random string length %,d
is less than 0.", end))` — `end` where `count` is meant. `RandomStringUtils.insecure().next(-3,
'a', 'z', true, true)` therefore says "Requested random string length 122 is less than 0." (122 is
`'z'`), and `next(-1, 0, 0, true, true)` says "length 0 is less than 0.". The exception type is
right; the message misreports the argument. The pin asserts that the message names the count.
'''

[[bug]]
id = "commons-lang/7"
title = "Conversion.intToHexDigit's Javadoc says \"10 returns 'A' and so on\" but the method returns lower-case digits (Character.forDigit)"
kind = "documentation"
severity = "low"
test = "pinIntToHexDigitReturnsUpperCaseAsDocumented"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc of `intToHexDigit(int nibble)`: "Converts a nibble as an int to a hexadecimal digit …
0 returns '0', 1 returns '1', … 10 returns 'A' and so on". The body is
`Character.forDigit(nibble, 16)`, which yields `'a'`; `intToHex`, `byteToHex`, `longToHex` and
`shortToHex` therefore produce lower-case strings too (their tables say nothing about case), and
`hexDigitToInt` accepts both cases. The `Msb0` twin documents "10 returns '5'" for its
bit-reversed nibble and returns `'5'` as documented. The property
`conversionRoundTripsAndMatchesTheBitOrder` checks the lower-case output against
`Character.forDigit`; the pin asserts the documented `'A'`.
'''

[[bug]]
id = "commons-lang/8"
title = "Fraction.pow(1) returns the fraction itself and pow(-1) its plain inverse, unreduced, although the Javadoc says \"The returned fraction is in reduced form\""
kind = "contract"
severity = "low"
test = "pinPowReturnsAReducedFraction"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`pow(int power)`: "Gets a fraction that is raised to the passed in power. The returned fraction is
in reduced form." The same Javadoc's `@return` then says "`this` if the power is one" — and the
body is `if (power == 1) return this;` and `if (power < 0) return invert().pow(-power);` — so
`Fraction.getFraction(6, 9).pow(1)` is `6/9` and `getFraction(6, 9).pow(-1)` is `9/6`, while
`pow(2)` is `4/9` (reduced) and `pow(-2)` is `9/4`. `equals` compares the stored numerator and
denominator, so `getFraction(6, 9).pow(1).equals(getFraction(6, 9).pow(2).pow(1).multiplyBy(…))`
style identities fail. The documentation contradicts itself; the pin asserts the general
statement (`pow(1)` of `6/9` equals `2/3`). The property `fractionArithmeticMatchesBigIntegerRationals`
checks only the value for `|power| == 1`.
'''

[[bug]]
id = "commons-lang/9"
title = "StringUtils.normalizeSpace turns non-breaking spaces (U+00A0) into spaces without collapsing them, so its output can contain runs of spaces and normalizeSpace is not idempotent"
kind = "wrong-result"
severity = "low"
test = "pinNormalizeSpaceIsIdempotent"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc: "The function returns the argument string with whitespace normalized by using
trim(String) to remove leading and trailing whitespace and then replacing sequences of whitespace
characters by a single space." The loop treats `Character.isWhitespace(c)` characters as
whitespace and, for every other character, writes `actualChar == 160 ? 32 : actualChar` — a
non-breaking space is rewritten to a plain space but counted as a non-whitespace character, so it
is never merged with its neighbours: `normalizeSpace("a\u00a0\u00a0b")` is `"a  b"` (two
spaces), `normalizeSpace("a \u00a0b")` is `"a  b"`, and applying `normalizeSpace` again gives
`"a b"`. Either U+00A0 is whitespace here (then it must collapse) or it is not (then it must be
left alone); the half-way treatment produces "normalized" output that the function itself would
change. The property `stringUtilsSubstringsAndPaddingFollowTheirTables` checks the model and
idempotence on strings without U+00A0; the pin asserts `normalizeSpace(normalizeSpace(x)) ==
normalizeSpace(x)` for `"a\u00a0\u00a0b"`.
'''

[[bug]]
id = "commons-lang/10"
title = "ClassUtils.getShortClassName(\"[LC;\") is \"char[]\": the primitive-descriptor table is applied after the \"L...;\" object encoding has been stripped, so arrays of a class named like a descriptor letter are misreported"
kind = "wrong-result"
severity = "low"
test = "pinShortClassNameOfAnArrayOfAClassNamedC"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`getShortClassName(String className)` handles array encodings: it counts the leading `[`s, then
"strips the object type encoding" `L…;`, and then looks the remainder up in the primitive
abbreviation map (`Z B C D F I J S V`) — also when an `L…;` encoding was just removed. An array
of a class `C` in the default package, `[LC;` (that is `C[].class.getName()`), is reported as
`"char[]"`, `[[LI;` as `"int[][]"`, `[LZ;` as `"boolean[]"`; `[C` (a real `char[]`) is
`"char[]"` as it should be. `Class.getName()` distinguishes the two spellings, so the two arrays
get the same short name. `getPackageName("[LC;")` is right (`""`). The property
`booleanEnumLocaleAndClassUtilsFollowTheirTables` skips array names of a default-package class
`C`; the pin carries `"[LC;"`.
'''

[[bug]]
id = "commons-lang/11"
title = "NumberUtils.createNumber rejects a leading plus sign only when the L type suffix is present: \"+7L\" is \"not a valid number\" while \"+7\", \"-7L\", \"+7f\", \"+7d\", \"+0x7\" and \"+07\" are all accepted"
kind = "wrong-result"
severity = "low"
test = "pinCreateNumberAcceptsAPlusWithTheLongSuffix"
found = { commit = "01a66dd238cb3c6a143da80ca183845a7da747aa", version = "3.21.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`createNumber(String)` accepts an optional sign in front of decimal, hexadecimal and octal
integers, of decimals with an exponent and of the `f`/`F`/`d`/`D` suffixed forms (`"+5"` → 5,
`"+0xF"` is pinned upstream, `"+7f"` → 7.0f, `"+7d"` → 7.0). With the `l`/`L` suffix the plus
sign makes it fail: `createNumber("+7L")` and `createNumber("+7l")` throw
`NumberFormatException: +7L is not a valid number.`, and `isCreatable("+7L")` is false, while
`createNumber("-7L")` is -7L and `createNumber("7L")` is 7L. The `L` branch guards its
`createLong`/`createBigInteger` calls with `numeric.charAt(0) == '-' && isDigits(numeric.substring(1))
|| isDigits(numeric)` — only a minus sign or bare digits pass — and throws the "not a valid
number" exception otherwise, although `createLong` (`Long.decode`) and `createBigInteger` both
accept a leading `+`. The property skips `+` with `l`/`L`; the pin asserts `createNumber("+7L") ==
7L`.
'''
