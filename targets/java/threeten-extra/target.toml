name = "threeten-extra"
language = "java"
upstream = "https://github.com/ThreeTen/threeten-extra"
subdir = ""
license = "BSD-3-Clause"
# No CONTRIBUTING.md, AGENTS.md, CLAUDE.md, copilot-instructions or PR template; README.md and .github/ say nothing
# about AI.
ai_policy_checked = "2026-09-16"

[base]
commit = "7779aa9a721580520af35ebaf299c1452bd17e4b"
date = "2026-09-15"
version = "1.10.1-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Javadoc, sources, checkstyle, PMD, the enforcer and signing are skipped.
setup = ["mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true -Denforcer.skip=true -Dgpg.skip=true install"]

[expected_failures]
