pin_wordBasedHugeHours = "threeten-extra/4"
pin_wordBasedNegativeMonths = "threeten-extra/5"
pin_amountParseOverflowIsParseException = "threeten-extra/6"
pin_ifcPlusWeeksKeepsTheDayOfWeek = "threeten-extra/7"
pin_symmetry454WeeksUntilCountsFiveWeekMonths = "threeten-extra/8"
pin_symmetry010WeeksUntilMatchesTheDays = "threeten-extra/9"
pin_symmetryWithZeroSetsTheField = "threeten-extra/10"
pin_paxPlusMonthsReachesTheLeapDecember = "threeten-extra/11"
pin_symmetryUntilRoundTripsFromTheLeapWeek = "threeten-extra/12"
