# Bugs found in ThreeTen-Extra by the Hegel zoo. Pins: hegel/src/test/java/zoo/ThreetenExtraPinsTest.java.

[[bug]]
id = "threeten-extra/1"
title = "Symmetry454/Symmetry010: leap years before year -2 misjudged, dates before year 0 lose days or throw"
kind = "wrong-result"
severity = "medium"
test = "pin_symmetryDatesBeforeYearZero"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Both chronologies document a year range of -1,000,000 to 1,000,000, and `date(year, 1, 1)` counts the leap weeks
before a negative year correctly (`getLeapYearsBefore` uses `Math.floorDiv`). `isLeapYear` however tests
`52 > (52 * year + 146) % 293` with Java's remainder, which is negative once `52 * year + 146 < 0`, so every year
from -3 backwards is reported as a leap year of 371 days (`isLeapYear(-3)`, `isLeapYear(-6)` are true; the rule gives
remainders 283 and 127). `ofEpochDay` also estimates the year with a truncating division. The two disagree, so
`dateEpochDay(e).toEpochDay() != e` for most days before year 0: `dateEpochDay(-721717)` (the first day of year -6)
returns year -7 day 8 with `toEpochDay()` -721710, `dateEpochDay(-1000000)` returns a date whose `toEpochDay()` is
-999993, and `dateEpochDay(-719527)` (the last day of year -1) throws "Invalid value for DayOfYear ... 0". Day
arithmetic through `plus(n, DAYS)` inherits the errors (`LocalDate.from` of such dates is a week off).
"""

[[bug]]
id = "threeten-extra/2"
title = "Symmetry454/Symmetry010: prolepticYear(era, yearOfEra) and date(era, ...) ignore the BCE era"
kind = "wrong-result"
severity = "medium"
test = "pin_symmetryErasRespected"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Symmetry454Chronology.prolepticYear(era, yearOfEra)` (and the Symmetry010 twin) only checks that the era is an
`IsoEra` and returns `yearOfEra` unchanged, so `prolepticYear(IsoEra.BCE, 5)` is 5 instead of -4 and
`date(IsoEra.BCE, 5, 1, 1)` is `Sym454 CE 5/01/01`. Dates do carry the BCE era with the right year-of-era
(`date(-4, 1, 1)` prints `BCE 5/01/01`), so `date(d.getEra(), d.get(YEAR_OF_ERA), month, day)` does not give back
`d` for any BCE date. Pax, Julian, Coptic, Ethiopic and the British cutover chronology compute `1 - yearOfEra`.
"""

[[bug]]
id = "threeten-extra/3"
title = "Temporals.durationToDoubleSeconds throws ArithmeticException for durations below about -292 years"
kind = "crash"
severity = "low"
test = "pin_negativeDurationToDoubleSeconds"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`durationToDoubleSeconds` takes the fast path `duration.toNanos() / 1e9` whenever `getSeconds() < 1_000_000_000`,
a guard meant to keep `toNanos()` from overflowing that only looks at the positive side. Any duration more negative
than about -9,223,372,036 seconds makes `toNanos()` throw `ArithmeticException: long overflow`
(`durationToDoubleSeconds(Duration.ofSeconds(-10_000_000_000L))`), while the positive twin returns 1.0E10. The
Javadoc documents no exception.
"""

[[bug]]
id = "threeten-extra/4"
title = "AmountFormats.wordBased casts the hour and day counts to int"
kind = "wrong-result"
severity = "low"
test = "pin_wordBasedHugeHours"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`wordBased(Duration, Locale)` builds `int[] values = {(int) hours, ...}` from `duration.toHours()`, and
`wordBased(Period, Duration, Locale)` adds `(int) (totalHours / 24)` to the period's days, so counts beyond an int
wrap silently: `wordBased(Duration.ofHours(2147483648L), ENGLISH)` is "-2147483648 hours" and
`wordBased(Period.ZERO, Duration.ofHours(51539607552L), ENGLISH)` (2^31 days) is "-2147483648 days". `Duration`
holds up to about 2.5e15 hours; `PeriodDuration.toString()` of the same values is correct.
"""

[[bug]]
id = "threeten-extra/5"
title = "AmountFormats.wordBased normalises a negative months-only period into years, but not a positive one"
kind = "wrong-result"
severity = "low"
test = "pin_wordBasedNegativeMonths"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The Javadoc says the year and month "are printed as supplied unless the signs differ, in which case they are
normalized". The sign test is `oppositeSigns(months, years)` = `(months < 0) == (years >= 0)`, which counts zero
years as positive on one side only: `wordBased(Period.ofMonths(-13), ENGLISH)` is "-1 year and -1 month" while
`wordBased(Period.ofMonths(13), ENGLISH)` is "13 months" (`P-1673M-294D` becomes "-139 years, -5 months and -42
weeks"). The same test runs in `wordBased(Period, Duration, Locale)` and `wordBased(PeriodDuration, Locale)`.
"""

[[bug]]
id = "threeten-extra/6"
title = "Days/Weeks/Months/Years/Hours/Minutes/Seconds.parse throw ArithmeticException on overflowing text"
kind = "wrong-exception"
severity = "low"
test = "pin_amountParseOverflowIsParseException"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parsers document only `DateTimeParseException` and wrap `NumberFormatException` in it, but combine the parsed
components with `Math.multiplyExact`/`Math.addExact` outside that handling, so text whose components are each valid
ints but whose sum or negation is not throws `ArithmeticException: integer overflow`: `Days.parse("P2147483647W21D")`,
`Hours.parse("P2147483646DT2H")`, `Months.parse("P2147483647Y3M")`, `Seconds.parse("PT2147483647M21S")` and the
negated minimum `Years.parse("-P-2147483648Y")` (likewise for every class). `Period.parse` and `Duration.parse`
report the same situations as `DateTimeParseException`.
"""

[[bug]]
id = "threeten-extra/7"
title = "InternationalFixedDate.plusWeeks lands a month early when the target is the first week of a month"
kind = "wrong-result"
severity = "medium"
test = "pin_ifcPlusWeeksKeepsTheDayOfWeek"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`plusWeeks` (InternationalFixedDate.java:626-640) adds the count to `getProlepticWeek()`, which is `prolepticMonth * 4
+ (dayOfMonth - 1) / 7 - 1` (:445, note the `- 1`), and rebuilds the date from the week of year; the two offsets do
not cancel when the target falls in the first week of a month and the count is not a multiple of four (those go
through `plusMonths`), and the result is 28 days early: `dateEpochDay(-2)` = 1969/13/28 `.plus(1, WEEKS)` gives
1969/13/07 (21 days back; want 1970/01/07, the next week keeping the day of the week across Year Day),
`date(1970, 1, 25).plus(1, WEEKS)` gives 1970/01/04 (want 02/04), `dateEpochDay(10).minus(1, WEEKS)` gives
1969/13/04 (want 1970/01/04). A sweep of 1966-1973 with |k| <= 400 hit exactly the predicate `k % 4 != 0 &&
((dom - 1) / 7 + k) % 4 == 0` (436 800 cases) and nothing else; `plus(4, WEEKS)` and Discordian are right.
"""

[[bug]]
id = "threeten-extra/8"
title = "Symmetry454Date.until(WEEKS) loses a week for every five-week month it spans"
kind = "wrong-result"
severity = "medium"
test = "pin_symmetry454WeeksUntilCountsFiveWeekMonths"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`getProlepticWeek()` (Symmetry454Date.java:408-410) is `prolepticMonth * WEEKS_IN_MONTH + ...` with four weeks per
month, but the middle month of every Symmetry454 quarter has five weeks (35 days), so `weeksUntil` (:628) undercounts
by one per such month spanned: `date(1970, 1, 1).until(date(1970, 3, 1), WEEKS)` is 8 for a 63-day span (want 9;
`plus(9, WEEKS)` does give 1970/03/01). `until(DAYS)` is right.
"""

[[bug]]
id = "threeten-extra/9"
title = "Symmetry010Date.until(WEEKS) mixes the year-aligned week with the month-aligned day of week"
kind = "wrong-result"
severity = "medium"
test = "pin_symmetry010WeeksUntilMatchesTheDays"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`weeksUntil` (Symmetry010Date.java:610-615) packs `getProlepticWeek() * 8 + getDayOfWeek()`, where the week counts
four per month and the day of week restarts with each 30/31-day month (Symmetry010 months are not whole weeks), so
the difference is off by one in either direction: `date(1970, 2, 1).until(date(1970, 3, 1), WEEKS)` is 3 for 31 days
(want 4), `date(1969, 12, 19).until(date(1970, 1, 15), WEEKS)` is 4 for 26 days (want 3). `until(DAYS)` is right.
"""

[[bug]]
id = "threeten-extra/10"
title = "Symmetry454Date.with and Symmetry010Date.with return the date unchanged for a new value of 0"
kind = "wrong-result"
severity = "medium"
test = "pin_symmetryWithZeroSetsTheField"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Both `with(TemporalField, long)` methods begin `if (newValue == 0) return this;` (Symmetry454Date.java:535,
Symmetry010Date.java:528), so any field set to zero is silently ignored: `dateEpochDay(-2047).with(EPOCH_DAY, 0)`
is still 1964/05/29 (want epoch day 0, 1970/01/04 in Symmetry454), `date(1970, 1, 1).with(YEAR, 0)` stays in 1970,
and the same for `PROLEPTIC_MONTH` and `ERA` (BCE is 0). `LocalDate` and the other chronologies set the field.
"""

[[bug]]
id = "threeten-extra/11"
title = "PaxDate.plusMonths computes month 0 when the target is the leap-year fourteenth month, so plus(MONTHS) and until() throw"
kind = "crash"
severity = "medium"
test = "pin_paxPlusMonthsReachesTheLeapDecember"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`plusMonths` (PaxDate.java:592-602) derives `newMonth = calcMonths - (newYear * 13 + leapYearsBefore(newYear)) + 1`
after "regularising" the month count as if every year had 13 months; when the target is month 14 (the December of a
leap year) the regularised year is already the next one and `newMonth` comes out 0, which `resolvePreviousValid`
rejects: `date(1860, 13, 1).plus(1, MONTHS)` and `date(1861, 1, 1).minus(1, MONTHS)` throw
`DateTimeException: Invalid value for MonthOfYear (valid values 1 - 13/14): 0` (want 1860-14-01; 1860 is a Pax
leap year). `until(ChronoLocalDate)` (:660-668) calls `plusMonths` on the way to its day count and throws for
ordinary pairs: `date(1996, 5, 22).until(date(2000, 1, 7))` throws while `until(..., MONTHS)` = 49 works. A sweep
found the failing set to be exactly the targets in a leap-year month 14 (21 118 cases).
"""

[[bug]]
id = "threeten-extra/12"
title = "Symmetry454/Symmetry010: plus(until(end)) does not reach end from a day of the leap week"
kind = "wrong-result"
severity = "low"
test = "pin_symmetryUntilRoundTripsFromTheLeapWeek"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`doUntil` (AbstractDate.java:331-337) measures the day remainder from `this.plusMonths(totalMonths)`, while
`plus(ChronoPeriod)` adds the years first and then the months; from a day of the leap week (Symmetry010 December
31-37, Symmetry454 December 29-35) the two paths clamp differently (12/37 -> 08/37 -> 08/31 against 12/37 ->
12/30 -> 08/30), so the period does not round-trip: Symmetry010 `date(2004, 12, 37).until(date(2006, 3, 1))` is
P1Y2M2D but `plus(P1Y2M2D)` lands on 2006/03/02; Symmetry454 `date(2004, 12, 35)` gives P1Y2M8D and 2006/03/08.
300 000 random pairs failed only from leap-week start days (Symmetry010 269 of 1012 such pairs, Symmetry454 314).
`LocalDate` documents the same clamping algorithm, but its `until`/`plus` agree with each other.
"""
