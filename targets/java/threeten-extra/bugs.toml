# Bugs found in ThreeTen-Extra by the Hegel zoo. Pins: hegel/src/test/java/zoo/ThreetenExtraPinsTest.java.

[[bug]]
id = "threeten-extra/1"
title = "Symmetry454/Symmetry010: leap years before year -2 misjudged, dates before year 0 lose days or throw"
kind = "wrong-result"
severity = "medium"
test = "pin_symmetryDatesBeforeYearZero"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
Both chronologies document a year range of -1,000,000 to 1,000,000, and `date(year, 1, 1)` counts the leap weeks
before a negative year correctly (`getLeapYearsBefore` uses `Math.floorDiv`). `isLeapYear` however tests
`52 > (52 * year + 146) % 293` with Java's remainder, which is negative once `52 * year + 146 < 0`, so every year
from -3 backwards is reported as a leap year of 371 days (`isLeapYear(-3)`, `isLeapYear(-6)` are true; the rule gives
remainders 283 and 127). `ofEpochDay` also estimates the year with a truncating division. The two disagree, so
`dateEpochDay(e).toEpochDay() != e` for most days before year 0: `dateEpochDay(-721717)` (the first day of year -6)
returns year -7 day 8 with `toEpochDay()` -721710, `dateEpochDay(-1000000)` returns a date whose `toEpochDay()` is
-999993, and `dateEpochDay(-719527)` (the last day of year -1) throws "Invalid value for DayOfYear ... 0". Day
arithmetic through `plus(n, DAYS)` inherits the errors (`LocalDate.from` of such dates is a week off).
"""

[[bug]]
id = "threeten-extra/2"
title = "Symmetry454/Symmetry010: prolepticYear(era, yearOfEra) and date(era, ...) ignore the BCE era"
kind = "wrong-result"
severity = "medium"
test = "pin_symmetryErasRespected"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Symmetry454Chronology.prolepticYear(era, yearOfEra)` (and the Symmetry010 twin) only checks that the era is an
`IsoEra` and returns `yearOfEra` unchanged, so `prolepticYear(IsoEra.BCE, 5)` is 5 instead of -4 and
`date(IsoEra.BCE, 5, 1, 1)` is `Sym454 CE 5/01/01`. Dates do carry the BCE era with the right year-of-era
(`date(-4, 1, 1)` prints `BCE 5/01/01`), so `date(d.getEra(), d.get(YEAR_OF_ERA), month, day)` does not give back
`d` for any BCE date. Pax, Julian, Coptic, Ethiopic and the British cutover chronology compute `1 - yearOfEra`.
"""

[[bug]]
id = "threeten-extra/3"
title = "Temporals.durationToDoubleSeconds throws ArithmeticException for durations below about -292 years"
kind = "crash"
severity = "low"
test = "pin_negativeDurationToDoubleSeconds"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`durationToDoubleSeconds` takes the fast path `duration.toNanos() / 1e9` whenever `getSeconds() < 1_000_000_000`,
a guard meant to keep `toNanos()` from overflowing that only looks at the positive side. Any duration more negative
than about -9,223,372,036 seconds makes `toNanos()` throw `ArithmeticException: long overflow`
(`durationToDoubleSeconds(Duration.ofSeconds(-10_000_000_000L))`), while the positive twin returns 1.0E10. The
Javadoc documents no exception.
"""

[[bug]]
id = "threeten-extra/4"
title = "AmountFormats.wordBased casts the hour and day counts to int"
kind = "wrong-result"
severity = "low"
test = "pin_wordBasedHugeHours"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`wordBased(Duration, Locale)` builds `int[] values = {(int) hours, ...}` from `duration.toHours()`, and
`wordBased(Period, Duration, Locale)` adds `(int) (totalHours / 24)` to the period's days, so counts beyond an int
wrap silently: `wordBased(Duration.ofHours(2147483648L), ENGLISH)` is "-2147483648 hours" and
`wordBased(Period.ZERO, Duration.ofHours(51539607552L), ENGLISH)` (2^31 days) is "-2147483648 days". `Duration`
holds up to about 2.5e15 hours; `PeriodDuration.toString()` of the same values is correct.
"""

[[bug]]
id = "threeten-extra/5"
title = "AmountFormats.wordBased normalises a negative months-only period into years, but not a positive one"
kind = "wrong-result"
severity = "low"
test = "pin_wordBasedNegativeMonths"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The Javadoc says the year and month "are printed as supplied unless the signs differ, in which case they are
normalized". The sign test is `oppositeSigns(months, years)` = `(months < 0) == (years >= 0)`, which counts zero
years as positive on one side only: `wordBased(Period.ofMonths(-13), ENGLISH)` is "-1 year and -1 month" while
`wordBased(Period.ofMonths(13), ENGLISH)` is "13 months" (`P-1673M-294D` becomes "-139 years, -5 months and -42
weeks"). The same test runs in `wordBased(Period, Duration, Locale)` and `wordBased(PeriodDuration, Locale)`.
"""

[[bug]]
id = "threeten-extra/6"
title = "Days/Weeks/Months/Years/Hours/Minutes/Seconds.parse throw ArithmeticException on overflowing text"
kind = "wrong-exception"
severity = "low"
test = "pin_amountParseOverflowIsParseException"
found = { commit = "7779aa9a721580520af35ebaf299c1452bd17e4b", version = "1.10.1-SNAPSHOT (after v1.10.0, 2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The parsers document only `DateTimeParseException` and wrap `NumberFormatException` in it, but combine the parsed
components with `Math.multiplyExact`/`Math.addExact` outside that handling, so text whose components are each valid
ints but whose sum or negation is not throws `ArithmeticException: integer overflow`: `Days.parse("P2147483647W21D")`,
`Hours.parse("P2147483646DT2H")`, `Months.parse("P2147483647Y3M")`, `Seconds.parse("PT2147483647M21S")` and the
negated minimum `Years.parse("-P-2147483648Y")` (likewise for every class). `Period.parse` and `Duration.parse`
report the same situations as `DateTimeParseException`.
"""
