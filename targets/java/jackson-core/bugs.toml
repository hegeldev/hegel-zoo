[[bug]]
id = "jackson-core/3"
title = "The byte-based parsers reject a lone-surrogate \\u escape in a property name, which the UTF-8 generator writes for such a name"
kind = "round-trip"
severity = "medium"
test = "pinByteParsersReadLoneSurrogateEscapeInName"
found = { commit = "104aab73ca8981ac08e37c001143d30fa6eec0e0", version = "3.3.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = """
`{"\\uDC00":1}` and `{"\\uD83Dx":1}` are read by the char-based parser (String/Reader) and the
same escapes are accepted in string values by every parser, but `UTF8StreamJsonParser`,
`UTF8DataInputJsonParser` and the non-blocking parser throw "Unexpected low surrogate in property
name (DC00) without preceding high surrogate" / "Broken surrogate pair in property name: expected
'\\' to start low surrogate, got 0x78". The UTF-8 generator's `writeName("a\\udc00")` (and the
Writer-based one with `ESCAPE_NON_ASCII`) writes exactly `{"a\\uDC00":1}`, so jackson's own output
cannot be read back through a byte source.
"""

