[[bug]]
id = "jackson-core/13"
title = "The DataInput parser silently skips control characters between tokens that every other parser rejects"
kind = "wrong-result"
severity = "low"
test = "pinDataInputRejectsControlCharsBetweenTokens"
found = { commit = "6c2090cda7a87b83138280b7504a140e7472647b", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-17" }
status = "open"
notes = """
The bytes 0x01 0x20 `[]` through `createParser(ctx, DataInput)` read as START_ARRAY, END_ARRAY
with no error; `[] <0x01> []` reads as two root arrays; `[<0x01>[ []]]` as three START_ARRAYs.
Every other parser (byte array, InputStream, String, Reader, non-blocking) throws "Illegal
character ((CTRL-CHAR, code 1)): only regular white space (\\r, \\n, \\t) is allowed between
tokens". `UTF8DataInputJsonParser._skipWS` / `_skipWSOrEnd` treat every byte <= 0x20 as
whitespace — the source says "Could verify validity of WS, but for now why bother" — so any
C0 control character (0x00-0x1F) between tokens or before the first one is accepted; 0x7F is
rejected as elsewhere. Found by `parsersAgreeWithTheReference` (a mutation inserting a control
character before the root value, DataInput source).
"""
