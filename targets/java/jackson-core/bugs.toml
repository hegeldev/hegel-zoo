# Bugs found in FasterXML/jackson-core by the zoo's property tests.

[[bug]]
id = "jackson-core/1"
title = "The DataInput parser fails with an EOF for a root-level number or literal at the very end of the input, and for an empty document"
kind = "crash"
severity = "medium"
test = "pinDataInputRootValueAtEndOfInput"
found = { commit = "104aab73ca8981ac08e37c001143d30fa6eec0e0", version = "3.3.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = """
`createParser(ctx, (DataInput) in)` over `true`, `15` or `1.5` (nothing after the value) throws
`JacksonIOException: N/A` (a wrapped `EOFException`) from `nextToken()`; the same over an empty
input throws instead of returning null. `"a"`, `[1.5]` and `15 ` (trailing whitespace) work, and
every other parser kind reads all of these. The class Javadoc lists the DataInput parser's
differences (no offsets, no whitespace validation) but not this one; `UTF8DataInputJsonParser`
reads one byte past a number or literal to check the root-value separator and does not treat the
end of input as a valid separator there.
"""

