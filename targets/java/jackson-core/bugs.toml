status = "open"
notes = """
The bytes of `"<NUL>a"` (0x22 0x00 0x61 0x22) through `createParser(ctx, byte[])` or an
InputStream, with `JsonReadFeature.ALLOW_UNESCAPED_CONTROL_CHARS` enabled, throw "Unexpected
