[[bug]]
id = "jackson-core/2"
title = "getNumberValueExact() returns a lossy Double when getNumberType() or getDoubleValue() was called first"
kind = "wrong-result"
severity = "medium"
test = "pinNumberValueExactAfterNumberType"
found = { commit = "104aab73ca8981ac08e37c001143d30fa6eec0e0", version = "3.3.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = """
For `123456789.123456789`, `getNumberValueExact()` alone returns the BigDecimal
123456789.123456789 (as documented: "most accurate representation"); after `getNumberType()` it
returns `Double 1.2345678912345679E8`, and for `1e400` `Double Infinity` instead of `1E+400`.
`ParserBase.getNumberValueExact` only asks for a BigDecimal when nothing has been decoded yet
(`_numTypesValid == NR_UNKNOWN`); `getNumberType()` decodes the lexeme as a double first.
Conversely `getNumberType()` reports BIG_DECIMAL after `getNumberValueExact()`.
"""

