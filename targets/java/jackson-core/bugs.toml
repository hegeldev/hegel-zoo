[[bug]]
id = "jackson-core/6"
title = "getLongValue() saturates to Long.MAX_VALUE for a floating-point lexeme whose double is 2^63"
kind = "wrong-result"
severity = "medium"
test = "pinLongValueSaturatesAtTwoToThe63"
found = { commit = "104aab73ca8981ac08e37c001143d30fa6eec0e0", version = "3.3.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = """
`9223372036854775808.5` (or `.0`, or `9223372036854775807.5`) is out of the `long` range, but
`getLongValue()` returns 9223372036854775807 instead of throwing `InputCoercionException`: the
value is converted through its double (exactly 2^63), the range check is `d > (double)
Long.MAX_VALUE` which 2^63 passes since the two are equal as doubles, and the cast saturates.
The `int` path is unaffected because 2^31 is representable and compared correctly.
"""

