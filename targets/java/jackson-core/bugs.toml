[[bug]]
id = "jackson-core/7"
title = "writeString(Reader, len) splits a surrogate pair at its 4000-char read boundary and writes both halves as \\u escapes"
kind = "wrong-result"
severity = "low"
test = "pinWriteStringFromReaderKeepsPairsTogether"
found = { commit = "104aab73ca8981ac08e37c001143d30fa6eec0e0", version = "3.3.0-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = """
`writeString(new StringReader("a" * 3999 + "😀"), -1)` on the UTF-8 generator writes the emoji
as `\\uD83D\\uDE00` (likewise at 7999) while `writeString(String)` writes the 4-byte UTF-8
sequence, `COMBINE_UNICODE_SURROGATES_IN_UTF8` being on. The Reader is read into a 4000-char
buffer; each half of a pair split across two reads is seen as an unpaired surrogate and
escaped. The output is still valid JSON for the same string, so the round trip holds.
"""

