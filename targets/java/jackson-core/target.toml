name = "jackson-core"
language = "java"
upstream = "https://github.com/FasterXML/jackson-core"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-15"  # README, CLAUDE.md (Claude Code guidance only), SECURITY.md, issue template: no AI policy

[base]
commit = "d37d7e25139fc16f83ee193a3e7f2f9bb55dfe13"
date = "2026-09-18"
version = "3.3.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install jackson-core (with the shaded fastdoubleparser; javadoc/sources/enforcer
# skipped) into the local Maven repository at the version the pom declares — hegel/pom.xml
# depends on that version (update `jackson.version` there when a bump changes it).
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true install",
]

[expected_failures]
# Wide properties: each draws the shapes of the recorded bugs by default and shrinks to the
# bug named here (the majority basin of its runs); `intermittent` where the shape is a few
# percent of cases. HEGEL_NO_KNOWN=1 switches the shapes off and every property passes.
generatorEventsReadBackThroughEveryParser = { bug = "jackson-core/1", intermittent = true }
parsersAgreeWithTheReference = { bug = "jackson-core/1", intermittent = true }
numbersDecodeExactlyInEveryParser = "jackson-core/2"
longStringsCrossTheBufferBoundaries = { bug = "jackson-core/7", intermittent = true }
prettyPrinterLayoutIsExact = { bug = "jackson-core/8", intermittent = true }
lenientFeaturesReadTheirSpellingsAsTheStrictValue = { bug = "jackson-core/5", intermittent = true }
# Narrow properties (zoo.JacksonCoreShapesTest): one per bug over its shape region, deterministic.
dataInputParserReadsARootValueAtTheEndOfInput = "jackson-core/1"
numberValueExactIsExactAfterNumberType = "jackson-core/2"
byteParsersReadALoneSurrogateEscapeInAName = "jackson-core/3"
asyncParserKeepsTheSignOfMinusZero = "jackson-core/4"
unescapedNulAtTheStartOfADocumentIsAString = "jackson-core/5"
longValueRejectsAFractionBeyondTheLongRange = "jackson-core/6"
writeStringFromAReaderKeepsSurrogatePairsTogether = "jackson-core/7"
serializedStringWithALoneSurrogateIsEscaped = "jackson-core/8"
byteParsersReadAnEscapedFourByteCharacter = "jackson-core/9"
asyncParserReadsAnEscapedMultiByteCharacter = "jackson-core/10"
asyncParserResumesInsideAnEscapedSurrogatePairInAName = "jackson-core/11"
asyncParserRejectsATrailingCommaAcrossFeeds = "jackson-core/12"
dataInputParserRejectsControlCharactersBetweenTokens = "jackson-core/13"
asyncParserRejectsAnIntegerRunningIntoTheNextRootValue = "jackson-core/14"
# Pins: one fixed regression example per bug.
pinDataInputRootValueAtEndOfInput = "jackson-core/1"
pinNumberValueExactAfterNumberType = "jackson-core/2"
pinByteParsersReadLoneSurrogateEscapeInName = "jackson-core/3"
pinAsyncParserKeepsTheSignOfMinusZero = "jackson-core/4"
pinUnescapedNulAtDocumentStart = "jackson-core/5"
pinLongValueSaturatesAtTwoToThe63 = "jackson-core/6"
pinWriteStringFromReaderKeepsPairsTogether = "jackson-core/7"
pinSerializedStringWithLoneSurrogate = "jackson-core/8"
pinByteParsersEscapedFourByteCharacter = "jackson-core/9"
pinAsyncParserEscapedMultiByteCharacter = "jackson-core/10"
pinAsyncParserSurrogateEscapeSplitInName = "jackson-core/11"
pinAsyncParserRejectsTrailingCommaAcrossFeeds = "jackson-core/12"
pinDataInputRejectsControlCharsBetweenTokens = "jackson-core/13"
pinAsyncParserRejectsAdjacentRootValuesInOneFeed = "jackson-core/14"
