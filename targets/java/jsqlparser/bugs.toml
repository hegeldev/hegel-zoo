[[bug]]
id = "jsqlparser/16"
title = "`a IS NULL COLLATE NOCASE` and `a IS TRUE COLLATE NOCASE` are parse errors while `a > 1 COLLATE NOCASE`, `a LIKE 'x' COLLATE NOCASE`, `a IN (1) COLLATE NOCASE` parse"
kind = "contract"
severity = "low"
test = "pin_collateAfterIsNull"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The postfix COLLATE is accepted after every predicate (comparison, [NOT] LIKE/IN/BETWEEN, IS DISTINCT FROM,
EXISTS) except IS [NOT] NULL/TRUE/FALSE (`Encountered: <S_IDENTIFIER> "NOCASE"`), so `ORDER BY a IS NULL COLLATE
NOCASE` — SQLite accepts it (COLLATE binds tightest: `a IS (NULL COLLATE NOCASE)`) — needs parentheses here. Found by `agreesWithSqlite`.
'''

