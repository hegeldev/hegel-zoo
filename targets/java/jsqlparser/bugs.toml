[[bug]]
id = "jsqlparser/4"
title = "Type names cannot be bare column references: `SELECT int FROM t`, `integer`, `real`, `blob`, `numeric`, `varchar`, `float`, `double`, `decimal`, `number`, `uuid`… are parse errors"
kind = "contract"
severity = "low"
test = "pin_typeNamesAsColumns"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The lexer's `<DATA_TYPE>` token covers the built-in type names, and `RelObjectName` does not admit it, so a
column named like a type fails as a bare reference (`SELECT int, 1 FROM t` → `Encountered: <K_COMMA>`; also
`WHERE int = 1`, `ORDER BY int`), while `t.int`, `1 AS int` and the column definition `int INTEGER` parse. None
of these words is in the documented reserved list (`src/site/sphinx/keywords.rst`); SQLite, PostgreSQL and
MySQL accept `SELECT int FROM t` when such a column exists (`float`, `double`, `decimal`, `number`, `uuid`,
`bigint`, `smallint`, `bool` fail the same way; `text`, `char`, `date`, `time`, `timestamp`, `json`, `boolean`
and `interval` parse or are documented keywords). Found by `agreesWithSqlite`.
'''

