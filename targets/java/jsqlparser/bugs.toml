[[bug]]
id = "jsqlparser/5"
title = "A column named `exclude` in CREATE TABLE is a parse error: `CREATE TABLE n (exclude INTEGER)` → \"Expected exclusion elements or predicate\""
kind = "contract"
severity = "low"
test = "pin_excludeColumn"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The column-definition loop of CREATE TABLE treats a leading `EXCLUDE` as the start of a PostgreSQL EXCLUDE
constraint and fails when no `(` follows. `exclude` is not a reserved word (not in keywords.rst); `SELECT
exclude FROM t`, `1 AS exclude`, `CREATE TABLE exclude (…)` and `CREATE TABLE n ("exclude" INTEGER)` parse.
SQLite, PostgreSQL and MySQL accept the bare column. Found by `agreesWithSqlite`.
'''

