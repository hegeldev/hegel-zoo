[[bug]]
id = "jsqlparser/10"
title = "A row-value SET whose first element is parenthesised is a parse error: `UPDATE t SET (a, b) = ((SELECT 1), 2)`"
kind = "contract"
severity = "low"
test = "pin_rowValueSetStartsWithSubquery"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
After `SET (a, b) = (` the parser commits to the `= (SELECT …)` form when the next token is `(`: `((SELECT 1),
2)` and `((SELECT 1) + 1, 2)` fail at the comma / the `+`, while `(1, (SELECT 2))`, `((1), 2)` and `(SELECT 1, 2)`
parse. SQLite and PostgreSQL accept any expression list. Found by `agreesWithSqlite`.
'''

