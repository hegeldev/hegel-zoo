[[bug]]
id = "jsqlparser/8"
title = "REPLACE INTO / INSERT OR REPLACE take neither RETURNING nor DEFAULT VALUES, which INSERT takes"
kind = "contract"
severity = "low"
test = "pin_replaceLikeInsert"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`INSERT INTO t (a) VALUES (1) RETURNING a` and `INSERT INTO t DEFAULT VALUES` parse, but `REPLACE INTO t (a)
VALUES (1) RETURNING a` (`Encountered: <K_RETURNING>`), `INSERT OR REPLACE INTO t (a) VALUES (1) RETURNING *`
and `REPLACE INTO t DEFAULT VALUES` (`Encountered: <K_DEFAULT>`) do not: the `Replace` production is a separate
grammar path that never got INSERT's tail clauses. SQLite (REPLACE = INSERT OR REPLACE, RETURNING since 3.35)
and MariaDB (`REPLACE … RETURNING`) accept them. Found by `agreesWithSqlite`.
'''

