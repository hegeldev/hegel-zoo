[[bug]]
id = "jsqlparser/2"
title = "A predicate followed by IS [NOT] TRUE/FALSE is a parse error: `a > 0 IS TRUE`, `a IN (1, 2) IS FALSE`, `a IS NULL IS FALSE`"
kind = "contract"
severity = "medium"
test = "pin_predicateIsTrue"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Condition()` reads one predicate suffix after the operand (comparison, BETWEEN, IN, LIKE, IS NULL, IS TRUE…)
and does not loop, so the boolean test `<boolean primary> IS [NOT] TRUE|FALSE|UNKNOWN` (SQL:2016 6.39) applied
to a comparison or another predicate fails with `Encountered: <K_IS>`. `a IS TRUE` and `(a > 0) IS TRUE` parse;
SQLite, PostgreSQL and MySQL accept the unparenthesised form. Found by `agreesWithSqlite`.
'''

