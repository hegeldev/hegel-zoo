[[bug]]
id = "jsqlparser/7"
title = "HexValue keeps the white space after the literal: `parseExpression(\"X'0F'  \").getValue()` is `X'0F'  `, and toString() grows a space per round trip"
kind = "wrong-result"
severity = "low"
test = "pin_hexLiteralTrailingSpace"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The `<S_HEX>` token (or the production building `HexValue`) includes trailing white space in the token image,
so `SELECT X'0F' FROM t` prints as `SELECT X'0F'  FROM t` (two spaces), parsing that gives three, and
`HexValue.getValue()`/`getBlob()` see the padding. Found by the toString() fixpoint check of `agreesWithSqlite`.
'''

