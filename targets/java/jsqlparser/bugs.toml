[[bug]]
id = "jsqlparser/3"
title = "`COLLATE BINARY` and `COLLATE RTRIM` are parse errors (BINARY and RTRIM are keyword tokens after COLLATE)"
kind = "contract"
severity = "low"
test = "pin_collateKeywordNames"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The collation name after COLLATE is read as an identifier; `BINARY` (K_BINARY) and `RTRIM` (a function keyword)
are not accepted there, so two of SQLite's three built-in collations (`BINARY`, `NOCASE`, `RTRIM`) cannot be
written bare — `COLLATE NOCASE` and `COLLATE "BINARY"` parse. MySQL's `COLLATE utf8mb4_bin` and PostgreSQL's
`COLLATE "C"` are unaffected. Found by `agreesWithSqlite` (the generator writes `"BINARY"`/`"RTRIM"` quoted).
'''

