[[bug]]
id = "jsqlparser/14"
title = "`3 .\"id\"` (a RowGetExpression on a number) is accepted and printed as `3.\"id\"`, which does not parse"
kind = "contract"
severity = "low"
test = "pin_rowGetOnNumberReprint"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`SELECT * FROM t WHERE 3 ."id" > 1` parses (the `.field` accessor applies to any primary, a numeric literal
included) and prints as `WHERE 3."id" > 1`; parsing that fails with `Encountered: <S_QUOTED_IDENTIFIER>`
because `3.` now lexes as a double. `RowGetExpression.toString()` should keep the space (or parenthesise a
literal base) so that toString() output parses. Found by `mutationsNeverCrash`.
'''

