[[bug]]
id = "jsqlparser/12"
title = "CAST takes no comparison, predicate or AND/OR as its operand: `CAST(a = 1 AS TEXT)`, `CAST(a IS NULL AS TEXT)`, `CAST(a OR b AS TEXT)`, `CAST(EXISTS (SELECT 1) AS INTEGER)` are parse errors"
kind = "contract"
severity = "medium"
test = "pin_castCondition"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`CastExpression` reads a `SimpleExpression`, so `CAST(a = 1 AS TEXT)` fails at `=`, `CAST(a > 1 AND b < 2 AS
INTEGER)` at `>`, and IS NULL / BETWEEN / IN / LIKE / AND / OR / XOR / EXISTS operands likewise; `CAST((a = 1) AS
TEXT)` and `CAST(NOT a AS TEXT)` parse. The standard's cast operand is a `<value expression>`, which includes
boolean value expressions (SQL:2016 6.13), and SQLite, PostgreSQL and MySQL accept `CAST(a = 1 AS …)`. Found by
`agreesWithSqlite`.
'''

