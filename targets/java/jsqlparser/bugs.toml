[[bug]]
id = "jsqlparser/15"
title = "`DELETE` and `DELETE FROM` without a table are accepted and print as `DELETE null` / `DELETE FROM null`"
kind = "contract"
severity = "low"
test = "pin_deleteWithoutTable"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The `Delete` production makes the table optional, so `DELETE`, `DELETE;` and `DELETE ; FROM t` (the text after
the `;` is ignored by design) parse into a `Delete` with a null table whose toString() is `DELETE null` — which
does not parse. `UPDATE`, `INSERT` and `SELECT` alone are parse errors, as `DELETE` should be. Found by
`mutationsNeverCrash`.
'''

