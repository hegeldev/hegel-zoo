[[bug]]
id = "jsqlparser/11"
title = "A simple CASE whose operand starts with a sign is a parse error: `CASE -1 WHEN a THEN 1 END`, `CASE -a WHEN …`, `CASE +1 * 2 WHEN …`"
kind = "contract"
severity = "medium"
test = "pin_caseSignedOperand"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The CASE production's operand path fails with `Encountered: <K_WHEN>` when the operand begins with `-` or `+`
(`~1`, `NOT a`, `(-1)`, `0 - 1`, `'x'` are fine, and signed values after WHEN/THEN/ELSE are fine). SQLite,
PostgreSQL and MySQL accept any expression as the CASE operand. Found by `agreesWithSqlite`.
'''

