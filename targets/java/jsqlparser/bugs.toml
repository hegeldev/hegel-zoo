[[bug]]
id = "jsqlparser/13"
title = "A typeless column (SQLite) is accepted only when every column is typeless and bare: `CREATE TABLE n (a PRIMARY KEY)`, `(a NOT NULL)`, `(a, b INT)` are parse errors"
kind = "contract"
severity = "low"
test = "pin_typelessColumnConstraints"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`CREATE TABLE n (a, b)` parses, but a typeless column with any constraint (`a PRIMARY KEY`, `a NOT NULL`, `a
UNIQUE`, `a DEFAULT 1`, `a CHECK (…)`, `a COLLATE NOCASE`, `a REFERENCES t`) fails at the constraint keyword, and
mixing typeless and typed columns (`a, b INT`; `a INT PRIMARY KEY, b`) fails too — the column-definition
production expects a type after the name unless the whole list is bare names. SQLite's type name is optional
everywhere (README lists SQLite among the supported dialects). Found by `agreesWithSqlite`.
'''

