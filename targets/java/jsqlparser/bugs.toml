# Bugs found in JSqlParser by the zoo's Hegel tests. Every entry has a `pin_…` test in
# hegel/src/test/java/zoo/JSqlParserPinsTest.java that asserts the behaviour SQLite (and, unless said otherwise,
# PostgreSQL/MySQL and the SQL standard) has, and fails while the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "jsqlparser/1"
title = "Stacked unary operators are a parse error: `SELECT - -1`, `~ ~x`, `+-1`, `-~1`, `- NOT x`"
kind = "contract"
severity = "low"
test = "pin_stackedUnaryOperators"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`PrimaryExpression` in `JSqlParserCC.jjt` takes at most one `NOT`/`!` and one sign (`+`, `-`, `~`) before the
operand, so a unary operator applied to another unary expression fails with `Encountered: <K_SELECT>` (the
error is reported at the statement start after the COMPLEX retry). SQLite, PostgreSQL, MySQL, H2 and the
standard's `<factor> ::= [<sign>] <numeric primary>` with `<numeric primary>` a parenthesised or plain value
all accept `- -1` (the strict SQL grammar needs `-(-1)` only for the literal case); `-(-1)` parses fine here.
Found by `agreesWithSqlite`.
'''

