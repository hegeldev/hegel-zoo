[[bug]]
id = "jsqlparser/6"
title = "A quoted identifier containing a dot is split at the dot: `\"a.b\"` becomes table `\"a\"`, column `\"b\"`; `\".\"` throws RuntimeException(\"Invalid column name\")"
kind = "wrong-result"
severity = "medium"
test = "pin_quotedIdentifierWithDot"
found = { commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459", version = "5.5-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Column`'s name handling (`RelObjectNameList` splitting on `.` after the fact) runs on the quoted text too:
`SELECT "a.b" FROM t` prints as `SELECT "a"."b" FROM t` with `getTable().getName()` = `"a"` and `getColumnName()`
= `"b"`, `"x."` prints as `"x"`, `".y"` as `""."y"`, `CREATE TABLE "." (a INTEGER)` loses its name, and `SELECT
"." FROM t`, `SELECT ".."`, `` SELECT `.` `` throw `RuntimeException: Invalid column name: "."` instead of parsing
(or a `JSQLParserException`). Quoted identifiers are single names in every RDBMS (SQLite, PostgreSQL, MySQL
backticks). `"t"."a.b"` and `"a.b".c` are affected the same way. Found by `agreesWithSqlite`, the RuntimeException
by `mutationsNeverCrash`.
'''

