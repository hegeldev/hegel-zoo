name = "jsqlparser"
language = "java"
upstream = "https://github.com/JSQLParser/JSqlParser"
subdir = ""
license = "Apache-2.0 OR LGPL-2.1"
# README + https://jsqlparser.github.io/JSqlParser/contribution.html (the repo has no CONTRIBUTING.md): tests with
# PRs via assertSqlCanBeParsedAndDeparsed, PMD/CheckStyle, Conventional Commits; nothing about AI; no
# CLAUDE.md/AGENTS.md/copilot-instructions. The issue template asks for sample SQL, version and RDBMS.
ai_policy_checked = "2026-09-16"

[base]
commit = "2fc6e3efbe29adda68c38faea432d8063d2dfa97"
date = "2026-09-20"
version = "5.5-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# The root pom selects a JDK toolchain in [17,24) through the property toolchain.jdk.version; the zoo's JDK is 25,
# so the range is widened on the command line. Tests, javadoc, sources, the enforcer, PMD/CPD, spotless, license
# and signing plugins are skipped: only the jar has to reach ~/.m2.
setup = ["mvn -q -B -ntp '-Dtoolchain.jdk.version=[17,26)' -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotless.skip=true -Dspotless.check.skip=true -Dlicense.skip=true -Dgpg.skip=true -Djacoco.skip=true install"]

[expected_failures]
stackedUnaryOperatorsAgreeWithSqlite = "jsqlparser/1"
predicateIsTrueAgreesWithSqlite = "jsqlparser/2"
collateKeywordNamesAgreeWithSqlite = "jsqlparser/3"
excludeColumnAgreesWithSqlite = "jsqlparser/5"
quotedNamesWithDotsAgreeWithSqlite = "jsqlparser/6"
hexLiteralPrintIsFixpoint = "jsqlparser/7"
replaceWithInsertTailAgreesWithSqlite = "jsqlparser/8"
trailingEmptyStatementSplits = "jsqlparser/9"
rowValueSetStartingWithParenthesisAgreesWithSqlite = "jsqlparser/10"
caseSignedOperandAgreesWithSqlite = "jsqlparser/11"
castConditionAgreesWithSqlite = "jsqlparser/12"
typelessColumnsAgreeWithSqlite = "jsqlparser/13"
rowGetOnNumberReprintParses = "jsqlparser/14"
deleteWithoutTableReprintParses = "jsqlparser/15"
collateAfterIsNullAgreesWithSqlite = "jsqlparser/16"
likeEscapeCollateAgreesWithSqlite = "jsqlparser/17"
substrPredicateArgumentAgreesWithSqlite = "jsqlparser/18"
unsupportedStatementDotNumberReprintIsFixpoint = "jsqlparser/19"
statementsSplit = "jsqlparser/9"
treeMatchesSqlite = { bug = "jsqlparser/7", intermittent = true }
agreesWithSqlite = { bug = "jsqlparser/7", intermittent = true }
mutationsNeverCrash = { bug = "jsqlparser/7", intermittent = true }
tablesAndFeatures = { bug = "jsqlparser/3", intermittent = true }
pin_stackedUnaryOperators = "jsqlparser/1"
