name = "jsqlparser"
language = "java"
upstream = "https://github.com/JSQLParser/JSqlParser"
subdir = ""
license = "Apache-2.0 OR LGPL-2.1"
# README + https://jsqlparser.github.io/JSqlParser/contribution.html (the repo has no CONTRIBUTING.md): tests with
# PRs via assertSqlCanBeParsedAndDeparsed, PMD/CheckStyle, Conventional Commits; nothing about AI; no
# CLAUDE.md/AGENTS.md/copilot-instructions. The issue template asks for sample SQL, version and RDBMS.
ai_policy_checked = "2026-09-16"

[base]
commit = "6312f9e5ea5d0b653ba56e248293f0e1451de459"
date = "2026-09-14"
version = "5.5-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# The root pom selects a JDK toolchain in [17,24) through the property toolchain.jdk.version; the zoo's JDK is 25,
# so the range is widened on the command line. Tests, javadoc, sources, the enforcer, PMD/CPD, spotless, license
# and signing plugins are skipped: only the jar has to reach ~/.m2.
setup = ["mvn -q -B -ntp '-Dtoolchain.jdk.version=[17,26)' -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotless.skip=true -Dspotless.check.skip=true -Dlicense.skip=true -Dgpg.skip=true -Djacoco.skip=true install"]

[expected_failures]
pin_stackedUnaryOperators = "jsqlparser/1"
pin_predicateIsTrue = "jsqlparser/2"
pin_collateKeywordNames = "jsqlparser/3"
pin_typeNamesAsColumns = "jsqlparser/4"
pin_excludeColumn = "jsqlparser/5"
pin_quotedIdentifierWithDot = "jsqlparser/6"
pin_hexLiteralTrailingSpace = "jsqlparser/7"
pin_replaceLikeInsert = "jsqlparser/8"
pin_parseStatementsTrailingEmpty = "jsqlparser/9"
pin_rowValueSetStartsWithSubquery = "jsqlparser/10"
pin_caseSignedOperand = "jsqlparser/11"
pin_castCondition = "jsqlparser/12"
pin_typelessColumnConstraints = "jsqlparser/13"
pin_rowGetOnNumberReprint = "jsqlparser/14"
pin_deleteWithoutTable = "jsqlparser/15"
pin_collateAfterIsNull = "jsqlparser/16"
