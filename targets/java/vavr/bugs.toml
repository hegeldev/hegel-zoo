# Bugs found in Vavr by the zoo's Hegel tests. Every entry has a `pin…` test in
# hegel/src/test/java/zoo/VavrPinsTest.java that asserts the documented behaviour and fails while
# the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "vavr/1"
title = "List.remove(element) and Queue.remove(element) throw NullPointerException when a null precedes the match"
kind = "crash"
severity = "medium"
test = "pinListRemoveToleratesNullElements"
found = { commit = "92f407eb8a91c6ce10bbb01a9934e88c68356edf", version = "2.0.0-SNAPSHOT (2026-09-12)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`List.remove(T element)` (List.java ~1400) collects the elements before the first match in a
`java.util.ArrayDeque` (`preceding.addFirst(head)`), and `ArrayDeque` rejects nulls, so the call
throws `NullPointerException` whenever a null element lies before the match — or anywhere in the
list when the element is absent, since the whole list is then traversed: `List.of(1, null,
2).remove(2)`, `List.of(null, 2).remove(2)` and `List.of(1, null).remove(5)` all throw, while
`List.of(1, null, 2).remove(1)` (null after the match) and `remove(null)` work. `Queue.remove`
delegates to it and throws the same way. Vavr sequences accept nulls (`List.of(1, null)` is
fine, `removeAll`, `removeFirst`, `removeLast`, `removeAt`, `replace`, `update`, `insert`,
`indexOf` and `Vector`/`Array`/`Stream` `remove` all handle them) and `Seq.remove` documents no
exception. `List.permutations()` calls `remove(x)` for every distinct element, so
`List.of(1, null, 2).permutations()` throws too (`Vector.of(1, null, 2).permutations()` is fine).
Found by `sequencesFollowTheirDocumentedRulesAgainstAnArrayListModel`.
'''

[[bug]]
id = "vavr/2"
title = "Traversable.min() of a single null element throws NullPointerException instead of Some(null)"
kind = "contract"
severity = "low"
test = "pinMinOfASingleNullIsSomeNull"
found = { commit = "92f407eb8a91c6ce10bbb01a9934e88c68356edf", version = "2.0.0-SNAPSHOT (2026-09-12)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Traversable.min()` documents (Traversable.java ~794): "@throws NullPointerException if this
Traversable contains 2 or more elements and any of them is null (a single null element is
returned as Some(null) without being compared)". The default implementation (~800-817) folds
`foldLeft(head, (t1, t2) -> comparator.compare(t1, t2) <= 0 ? t1 : t2)` starting from `head`
over *all* elements, so the head is compared with itself and a single null is compared:
`List.of((Integer) null).min()`, and the same for `Vector`, `Array`, `Stream` and `Queue`, throw
`NullPointerException` from `NaturalComparator.compare`. `max()` (via `maxBy`) and
`Iterator.of((Integer) null).min()` honour the rule and return `Some(null)`. Found by the
null-handling branch of `sequencesFollowTheirDocumentedRulesAgainstAnArrayListModel`.
'''

[[bug]]
id = "vavr/3"
title = "Vector.takeRight/dropRight overflow for large negative n and return the wrong end of the vector"
kind = "wrong-result"
severity = "low"
test = "pinVectorTakeRightOfALargeNegativeIsEmpty"
found = { commit = "92f407eb8a91c6ce10bbb01a9934e88c68356edf", version = "2.0.0-SNAPSHOT (2026-09-12)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Vector.takeRight(n)` is `drop(length() - n)` and `Vector.dropRight(n)` is `take(length() - n)`
(Vector.java ~832 and ~1340). For `n < Integer.MIN_VALUE + length()` the subtraction overflows to
a negative number, so `Vector.of(1, 2, 3).takeRight(Integer.MIN_VALUE)` is `Vector(1, 2, 3)`
(documented: n < 0 gives the empty sequence) and `Vector.of(1, 2, 3).dropRight(Integer.MIN_VALUE)`
is `Vector()` (documented: a negative n drops nothing). `takeRight(Integer.MIN_VALUE + 4)` and
`dropRight(Integer.MIN_VALUE + 4)` are correct; the other Seq implementations (`List`, `Array`,
`Stream`, `Queue`, `CharSeq`) handle `Integer.MIN_VALUE` correctly. Found by
`sequencesFollowTheirDocumentedRulesAgainstAnArrayListModel`, whose index generator includes the
int extremes.
'''

[[bug]]
id = "vavr/4"
title = "CharSeq.reverse() keeps surrogate pairs in order, so reverse().head() != last() and CharSeq disagrees with List<Character>"
kind = "contract"
severity = "low"
test = "pinCharSeqReverseReversesItsCharacters"
found = { commit = "92f407eb8a91c6ce10bbb01a9934e88c68356edf", version = "2.0.0-SNAPSHOT (2026-09-12)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`CharSeq.reverse()` is `of(new StringBuilder(back).reverse().toString())` (CharSeq.java ~1005),
and `StringBuilder.reverse` deliberately keeps surrogate pairs in order. A `CharSeq` is a
`Seq<Character>` whose elements are the UTF-16 chars, and `Seq.reverse()` documents "a new Seq
with the order of elements reversed" with no exception for `CharSeq`; for `c = CharSeq.of("c😀")`
the result has chars `[\uD83D, \uDE00, c]`, so `c.reverse().head() != c.last()`,
`c.reverse().get(0) != c.get(c.length() - 1)`, `c.reverse()` is not equal to
`List.ofAll(c).reverse()` or `Vector.ofAll(c).reverse()` (although `CharSeq.equals(List)` holds
for equal char sequences), and it differs from `c.foldLeft(CharSeq.empty(), CharSeq::prepend)`.
Whether the String-like behaviour is intended is not stated anywhere; if it is, `CharSeq.reverse`
should document the deviation from the `Seq` contract. Found by `charSeqMirrorsString`, whose
generated strings contain an emoji and lone surrogates.
'''

[[bug]]
id = "vavr/5"
title = "Stream.slice(b, e) with b < e <= 0 returns the head instead of the empty stream"
kind = "wrong-result"
severity = "low"
test = "pinStreamSliceEndingBeforeTheStartIsEmpty"
found = { commit = "92f407eb8a91c6ce10bbb01a9934e88c68356edf", version = "2.0.0-SNAPSHOT (2026-09-12)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Seq.slice(beginIndex, endIndex)` documents a slice "starting at beginIndex (inclusive) and
ending at endIndex (exclusive)" that never throws, with `List.of(1, 2).slice(-10, 10) = (1, 2)`
and `slice(1, 0) = ()`; every other implementation clamps both bounds into `[0, length]`, so a
slice ending at or before index 0 is empty. `Stream.slice` (Stream.java ~1592) returns `empty()`
only for `beginIndex >= endIndex`; otherwise it clamps `beginIndex` to 0 and emits `head()`
without looking at `endIndex`, so `Stream.of(8, 9).slice(-2, -1)`, `slice(-2, 0)`,
`slice(-5, -3)` and `slice(Integer.MIN_VALUE, -1)` are all `Stream(8)` (the recursion
`tail().slice(0, endIndex - 1)` then stops because `endIndex - 1 < 0`). `List`, `Vector`, `Queue`
and `CharSeq` return the empty sequence for the same arguments. Found by
`sequencesFollowTheirDocumentedRulesAgainstAnArrayListModel` (`Stream[8].slice(-2, -1)`).
'''

[[bug]]
id = "vavr/6"
title = "Array.slice(b, e) with b < e < 0 throws NegativeArraySizeException"
kind = "crash"
severity = "low"
test = "pinArraySliceWithNegativeBoundsIsEmpty"
found = { commit = "92f407eb8a91c6ce10bbb01a9934e88c68356edf", version = "2.0.0-SNAPSHOT (2026-09-12)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Array.slice` (Array.java ~1371) returns `empty()` for `beginIndex >= endIndex`, clamps
`beginIndex` to 0 and computes `length = Math.min(endIndex, length()) - index`; when `endIndex`
is negative that length is negative and `new Object[length]` throws
`NegativeArraySizeException`: `Array.of(8, 9).slice(-3, -1)` and
`Array.of(8, 9).slice(Integer.MIN_VALUE, -1)` throw, while `slice(-2, 0)` is `Array()` and
`slice(0, -1)` is `Array()`. `Seq.slice` documents that it never throws (it is the non-throwing
alternative to `subSequence`) and `List`, `Vector`, `Queue`, `CharSeq` return the empty sequence.
Found while probing bug /5 with the same arguments across the Seq implementations; the sequences
property now generates both-negative bounds 15% of the time.
'''
