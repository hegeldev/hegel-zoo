name = "vavr"
language = "java"
upstream = "https://github.com/vavr-io/vavr"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-16"  # CONTRIBUTING.md "AI-assisted contributions": allowed, stand behind every line, open an issue before non-trivial work; the zoo only records bugs

[base]
commit = "d8c77137bf2aea80fe918ef2861584725e84bf5d"
date = "2026-09-19"
version = "2.0.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install io.vavr:vavr into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on that version — update `vavr.version` there when a bump changes it).
# Tests, javadoc, sources and the release checks are skipped. Needs JDK 21+ and Maven >= 3.9.9.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dgpg.skip=true -Djacoco.skip=true install",
]

[expected_failures]
pinListRemoveToleratesNullElements = "vavr/1"
pinMinOfASingleNullIsSomeNull = "vavr/2"
pinVectorTakeRightOfALargeNegativeIsEmpty = "vavr/3"
pinCharSeqReverseReversesItsCharacters = "vavr/4"
pinStreamSliceEndingBeforeTheStartIsEmpty = "vavr/5"
pinArraySliceWithNegativeBoundsIsEmpty = "vavr/6"
