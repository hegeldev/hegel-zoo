[[bug]]
id = "json-java/11"
title = "XML.toString and JSONML.toString emit non-well-formed XML for keys that are not XML names (a b, \"\", 1a, .a, tab in key, a<b)"
kind = "wrong-result"
severity = "low"
test = "pinXmlToStringIsWellFormedOrRejectsTheName"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
XML.toString validates tag names with XML.noSpace (rejecting an empty name, and JSONML rejects
names containing '<', '>', '/', '&' and quotes), but the check is not applied consistently: a key
"a b" produces <root><a b>1</a b></root>, "" produces <root><>1</></root>, "1a" and ".a" produce
elements whose names may not start with a digit or a dot, and a tab inside the key passes noSpace.
JSONML.toString(new JSONArray(List.of("a<b"))) produces <a&lt;b/>, an escaped name. None of these
can be read back by any XML parser (including XML.toJSONObject). Rejecting the key with a
JSONException, as the other bad names are rejected, would be right. Found by the well-formedness
property (JDK DocumentBuilder as oracle).
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/12"
title = "CDL.rowToString leaves a value that starts with an apostrophe unquoted, and rowToJSONArray then fails or reads a different value"
kind = "roundtrip"
severity = "low"
test = "pinCdlQuotesValuesStartingWithAnApostrophe"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The writer quotes a value only when it contains a comma, a double quote, a newline or a carriage
return. The reader (CDL.getValue) treats a leading ' as an opening quote. So the row ["'", "x"]
is written as ',x and read back with JSONException "Missing close quote"; ["'a' b", "x"]
is written as 'a' b,x and reads back as ["a", ...] after "Bad character" or with the tail lost.
A value beginning with ' must be quoted (or the reader must not accept ' as a quote). Found by
the CDL round-trip property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

