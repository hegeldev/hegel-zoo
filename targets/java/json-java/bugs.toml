# Bugs found in JSON-java (org.json) by the Hegel zoo. One [[bug]] per finding; `test` names the
# JUnit pin in hegel/src/test/java/zoo/PinsTest.java that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracles: RFC 8259 (JSON text, strict mode), Jackson and Gson
# as independent parsers, RFC 6901 (JSON Pointer) and RFC 3986 (its fragment form), the JDK's XML
# parser, and the library's own Javadoc and NOTES.md. Upstream is in maintenance mode and asks for
# bug fixes only; nothing about AI in README, CONTRIBUTING.md, docs/ or .github/ (checked
# 2026-09-18).

[[bug]]
id = "json-java/1"
title = "A \\u escape followed by a sign and three hex digits is accepted (\\u-041, \\u+041)"
kind = "contract"
severity = "low"
test = "pinUnicodeEscapeNeedsFourHexDigits"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
JSONTokener.nextString decodes \\u with Integer.parseInt(next(4), 16), and parseInt accepts a
leading '-' or '+'. new JSONTokener("\\"\\\\u-041\\"").nextValue() returns the string "\\uFFBF"
(the two's complement of -0x41 cast to char) and "\\\\u+041" returns "A"; both must be syntax
errors, in strict and lenient mode alike (RFC 8259 section 7: exactly four HEXDIG). Found by the
mutated-text differential against Jackson.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/2"
title = "Strict mode accepts Java-only number spellings: 0x1.8p1, 1.5f, 1e5D, 01.5, 1.E5"
kind = "contract"
severity = "medium"
test = "pinStrictModeRejectsJavaNumberSyntax"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
JSONParserConfiguration.withStrictMode(true) is documented to make the parser "RFC 8259
compliant". JSONObject.stringToNumber accepts anything Double.valueOf or BigDecimal accept once
the text starts like a number: hexadecimal floating point (0x1.8p1 = 3.0), the f/F/d/D type
suffixes (1.5f, 1e5D), a leading zero before a fraction (01.5) and an empty fraction (1.E5).
new JSONArray("[0x1.8p1]", strict) gives [3.0]; Jackson and every RFC 8259 grammar reject all
five. Lenient mode treating these as numbers is the library's choice; strict mode must not.
Found by the mutated-text differential against Jackson.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/3"
title = "Strict mode treats every control character up to U+0020 as whitespace"
kind = "contract"
severity = "low"
test = "pinStrictModeRejectsControlCharacterWhitespace"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
JSONTokener.nextClean skips any character c <= ' ', so U+0001, form feed, vertical tab and the
other C0 controls are whitespace between tokens and after the document, in strict mode too. RFC
8259 section 2 allows only space, tab, LF and CR. new JSONArray("[\\u0001 1]", strict) parses to
[1]; Jackson rejects it. Found by the mutated-text differential against Jackson.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/4"
title = "JSONPointer unescapes reference tokens twice, so /~01 finds the member \"/\" instead of \"~1\""
kind = "wrong-result"
severity = "medium"
test = "pinPointerTokensAreUnescapedOnce"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The JSONPointer(String) constructor replaces ~1 and ~0 in each token (correct, RFC 6901 section
4), and queryFrom then calls unescape on the already-unescaped token again. So the pointer "/~01"
(the member named "~1") is looked up as "/", and "/a~00b" (member "a~0b") becomes "a~0b" after
the first pass and "a~b" after the second. The same second pass hits the builder: JSONPointer.builder()
.append("~1") is documented as taking raw token text ("no escaping is needed") but queryFrom
turns it into "/". Every member whose name contains "~0" or "~1" is unreachable through the
pointer. Found by the RFC 6901 model with decoy siblings.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/5"
title = "JSONPointer URI fragment form is not RFC 6901 section 6: / and ~ are percent-encoded, decoding runs before splitting, + becomes a space"
kind = "wrong-result"
severity = "medium"
test = "pinUriFragmentFormFollowsRfc6901"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 6901 section 6 says the fragment form is the pointer with ~ and / escaped as ~0 and ~1 and
then percent-encoded per RFC 3986. toURIFragment instead runs URLEncoder.encode over the raw
token, so a token "a/b" becomes "#/a%2Fb" and "~" becomes "#/%7E" (expected "#/a~1b" and "#/~0");
URLEncoder is also form encoding, which turns a space into "+", not "%20". On the way in, the
constructor URLDecoder.decodes the whole fragment before splitting on "/", so "#/a%2Fb" is two
tokens, and a literal '+' in a member name ("#/a+b") is read as a space. Consequences: a pointer
with a "/" in a token does not survive toURIFragment and back, and members named with '+'
cannot be addressed in fragment form. Found by the fragment round-trip property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/6"
title = "JSONPointer accepts 01, +1, -0, 00 and non-ASCII digits as array indexes"
kind = "contract"
severity = "low"
test = "pinArrayIndexTokensFollowRfc6901"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RFC 6901 section 4: an array index is "0" or a digit string without a leading zero ("array-index
= %x30 / ( %x31-39 *(%x30-39) )"). readByIndexToken uses Integer.parseInt, so "/01", "/+1", "/-0",
"/00" and "/\\u0661" (Arabic-Indic one) all select an element of a JSONArray where the RFC (and
other implementations) require a JSONPointerException. Found by the RFC 6901 array-index property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/7"
title = "XML.unescape rejects the numeric character references XML.escape emits for control characters, U+007F-U+009F, lone surrogates and U+FFFF"
kind = "roundtrip"
severity = "medium"
test = "pinUnescapeAcceptsEscapeOutput"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
XML.escape writes "&#x1;" for U+0001 (mustEscape: not an XML Char), "&#x7f;", "&#x85;",
"&#xffff;" and "&#xd83d;" for the others. XML.unescape (and XMLTokener.nextEntity, hence
XML.toJSONObject on text that XML.toString produced) throws JSONException "Invalid numeric
character reference" for every one of them, because unescapeEntity checks the code point against
the same XML Char production. Either escape should not emit references that the library's own
reader refuses, or unescape should accept what escape wrote; as it stands JSON strings containing
a control character (common: form feeds, U+001B in log text) cannot go through XML.toString and
back. Found by the unescape-inverts-escape property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/8"
title = "Every XMLParserConfiguration with* method resets keepStrings to false"
kind = "wrong-result"
severity = "medium"
test = "pinXmlConfigurationBuildersKeepKeepStrings"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
XMLParserConfiguration.clone builds the copy with the private all-arguments constructor, which
hardcodes keepStrings = false (the field was replaced by the xsiTypeMap/keepNumberAsString/
keepBooleanAsString split, but isKeepStrings() and withKeepStrings still exist and are what the
KEEP_STRINGS constant sets). So XMLParserConfiguration.KEEP_STRINGS.withcDataTagName("content")
.isKeepStrings() is false and XML.toJSONObject("<a>null</a>", that) gives JSONObject.NULL where
KEEP_STRINGS alone gives "null"; likewise any withKeepStrings(true) followed by another with*.
Found by the builder order-independence property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

