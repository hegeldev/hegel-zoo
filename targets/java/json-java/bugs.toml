[[bug]]
id = "json-java/14"
title = "HTTP.toJSONObject cannot parse the output of HTTP.toString (CRLF line ends)"
kind = "roundtrip"
severity = "medium"
test = "pinHttpParsesItsOwnOutput"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
HTTP.toString terminates each line with CRLF, as HTTP requires. HTTP.toJSONObject uses
HTTPTokener.nextToken, which ends a token at '\\n' only, so the '\\r' of the first line ends up
in the version token and the next header name, and the parse fails with JSONException "Expected
':' and instead saw ''" (or a header name with a stray \\r). HTTP.toJSONObject(HTTP.toString(o))
throws for every request or response object; upstream's HTTPTest replaces "\\r\\n" with "\\n"
before parsing, working around it. Found by the HTTP round-trip property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

[[bug]]
id = "json-java/15"
title = "JSONML with keepStrings unescapes entities twice (&amp;amp; becomes &)"
kind = "wrong-result"
severity = "low"
test = "pinJsonmlKeepStringsUnescapesOnce"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
JSONML.parse takes text through XMLTokener.nextContent, which already resolves entities, and then
under keepStrings calls XML.unescape on the result again (the non-keepStrings path goes through
stringToValue, which does not). JSONML.toJSONArray("<a>&amp;amp;</a>", true).get(1) is "&" where
false gives the correct "&amp;"; "&amp;lt;b&amp;gt;" becomes "<b>". keepStrings is documented
as only suppressing the conversion of text to numbers and booleans. Found by the JSONML
round-trip property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
