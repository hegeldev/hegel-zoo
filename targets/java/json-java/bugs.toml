[[bug]]
id = "json-java/16"
title = "maxNestingDepth is not applied when parsing JSON text"
kind = "contract"
severity = "medium"
test = "pinNestingDepthLimitAppliesToText"
found = { commit = "874673575807723d58bbec9ff1985668742940ce", version = "20260814", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
JSONParserConfiguration.withMaxNestingDepth is documented as the "maximum nesting depth to when
parsing a JSON document" (default 512), and the JSONObject/JSONArray constructors taking a
JSONTokener and a configuration pass it down. But the recursion-depth check is only made in the
Map/Collection constructors: new JSONArray("[[[[1]]]]", cfg.withMaxNestingDepth(2)) parses fine,
and the property parses depth 48 under a limit of 40. Text is where the limit matters (untrusted
input; deep nesting ends in StackOverflowError otherwise). Found by the nesting-depth property.
'''

[[bug.observed]]
version = "20260814"
commit = "874673575807"
hegel = "0.6.0"
date = "2026-09-18"
result = "reproduces"

