strictModeAgreesWithJacksonOnMutatedText = { bug = "json-java/2", intermittent = true }
builderPointerPrintsAndQueriesPerRfc6901 = "json-java/4"
pointerTextQueriesPerRfc6901 = "json-java/4"
queriesMatchTheModelOnRandomDocuments = { bug = "json-java/4", intermittent = true }
uriFragmentFormRoundTrips = "json-java/5"
arrayIndexTokensFollowRfc6901 = "json-java/6"
unescapeInvertsEscape = "json-java/7"
