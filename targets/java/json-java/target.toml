name = "json-java"
language = "java"
upstream = "https://github.com/stleary/JSON-java"
subdir = ""
license = "Public Domain"
ai_policy_checked = "2026-09-18"  # README, CONTRIBUTING.md, docs/CONTRIBUTING.md, docs/FILES.md, .github/: nothing about AI; maintenance mode (bug fixes welcome)

[base]
commit = "874673575807723d58bbec9ff1985668742940ce"
date = "2026-09-13"
version = "20260814"

[hegel]
version = "0.6.0"

[run]
# Build and install org.json:json into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on that version through `json.version` — update it when a bump changes
# the pom's version). Tests, javadoc, sources and signing are skipped; `clean` first, because the
# moditect plugin refuses to overwrite target/modules/json-*.jar on a second run.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true clean install",
]

[expected_failures]
pinUnicodeEscapeNeedsFourHexDigits = "json-java/1"
pinStrictModeRejectsJavaNumberSyntax = "json-java/2"
pinStrictModeRejectsControlCharacterWhitespace = "json-java/3"
pinPointerTokensAreUnescapedOnce = "json-java/4"
pinUriFragmentFormFollowsRfc6901 = "json-java/5"
pinArrayIndexTokensFollowRfc6901 = "json-java/6"
pinUnescapeAcceptsEscapeOutput = "json-java/7"
pinXmlConfigurationBuildersKeepKeepStrings = "json-java/8"
pinConfigurationBuildersKeepMaxNumberLength = "json-java/9"
pinXmlAttributeNullKeepsStringUnderKeepStrings = "json-java/10"
pinXmlToStringIsWellFormedOrRejectsTheName = "json-java/11"
pinCdlQuotesValuesStartingWithAnApostrophe = "json-java/12"
pinCdlKeepsEdgeWhitespace = "json-java/13"
pinHttpParsesItsOwnOutput = "json-java/14"
pinJsonmlKeepStringsUnescapesOnce = "json-java/15"
pinNestingDepthLimitAppliesToText = "json-java/16"
pinNegativeNestingDepthMeansNoLimit = "json-java/17"
pinInvalidNumberFormatIsAnError = "json-java/18"
