[[bug]]
id = "roaringbitmap/24"
title = "orNot drops the range's last containers when the other bitmap has a full container at or beyond the range's last key"
kind = "wrong-result"
severity = "medium"
test = "pinOrNotKeepsTheRangeWhenTheOtherBitmapHasAFullContainerBeyondIt"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`orNot` (static and in-place, `RoaringBitmap` and the buffer classes) sizes its result up front
(RoaringBitmap.java ~1583): it counts x2's full containers as a `correction` — a full container in
x2 contributes nothing to x1 OR NOT x2 — but the loop breaks only *after* counting the first
container whose key is >= maxKey, so a full container of x2 that lies beyond the range is
subtracted too, and the fill loop stops at `size < maxSize`. `RoaringBitmap.orNot(new
RoaringBitmap(), RoaringBitmap.bitmapOfRange(65536, 131072), 65536)` is empty instead of
[0, 65536) (maxSize is 0, so the method returns a fresh bitmap); `orNot({}, bitmapOfRange(131072,
196608), 131072)` has cardinality 65536 instead of 131072 (the container for key 1 is never
produced); the in-place `new RoaringBitmap().orNot(bitmapOfRange(65536, 131072), 65536)` and
`MutableRoaringBitmap.orNot` behave the same. With x1 owning a container the count comes out
right (`orNot({5}, [65536, 131072), 65536)` is correct).
'''

[[bug]]
id = "roaringbitmap/25"
title = "RangeBitmap queries throw IndexOutOfBoundsException when every row has all value bits set and the container masks are 3 or 5–7 bytes wide"
kind = "crash"
severity = "medium"
test = "pinRangeBitmapOfRowsAtTheMaskAnswersQueries"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`RangeBitmap` stores one mask per 65536-row container with `bytesPerMask = ceil(slices / 8)`
bytes, but `getContainerMask` (RangeBitmap.java:1488) reads 4 bytes for 3-byte masks and 8 bytes
for 5-, 6- and 7-byte masks (`buffer.getInt`/`getLong` … `& mask`). The extra bytes are normally
the following container data; when every row's value has all slice bits set no container is
serialised after the masks, the masks end the buffer, and the read is out of bounds:
`RangeBitmap.appender(131071)` (17 slices, 3-byte masks) with a single row 131071 — `build()`
succeeds (13 bytes) and `lte(0)`, `lt`, `eq`, `between`, `lteCardinality` all throw
java.lang.IndexOutOfBoundsException (`gte`/`gt` take a shortcut and answer). The same for 20, 40
and 48 bits (`appender((1L << 40) - 1)` with row 2^40 - 1), for several rows all equal to the mask,
and for `appender(65536)` with row 131071 (the mask is the next power of two minus one, bug
roaringbitmap/17); 16, 32, 62, 63 and 64 slices (1-, 2-, 4- and 8-byte masks) work.
'''

[[bug]]
id = "roaringbitmap/26"
title = "validate() rejects a run container the library produced by removing a value from a run"
kind = "contract"
severity = "low"
test = "pinValidateAcceptsARunSplitByRemove"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`validate()` ("Validate the content of the bitmap. Useful after deserialization. @return true if
the content is valid") returns false, via `RunContainer.validate` (RunContainer.java:334), for any
run container whose run encoding is larger than the array or bitmap encoding of the same set. The
library itself produces such containers: `b.add(10L, 13L)` builds a run container for {10, 11, 12}
(a tie with the array encoding, accepted) and `b.remove(11)` splits it into two runs holding two
values (10 bytes against 6 for an array) without re-encoding, after which `b.validate()` is false,
and so is `validate()` on a bitmap deserialized from `b`'s own `serialize` output — the bytes are
well-formed by the format specification, which does not require run containers to be the
smallest encoding. The zoo saw the same shape from `flip`/`remove` on run-optimised bitmaps
(`RunContainer/2` at keys 0x8000 and 0xFFFF after a range add and removals). Either `validate()`
is stricter than "valid" or the mutations leave the bitmap in a state the library considers
invalid; the Javadoc does not say.
'''

[[bug]]
id = "roaringbitmap/27"
title = "forEach runs away past 2^31 when a run container at key 0x7FFF ends with the single value 0x7FFFFFFF"
kind = "wrong-result"
severity = "high"
test = "pinForEachStopsAtTheLastRunBeforeTwoToThe31"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The same loop as bug roaringbitmap/2, `for (int l = base; l - le <= base; ++l)` in
RunContainer.forEach (RunContainer.java:2498), with the opposite overflow. For a run of length 0
(a single value) at position 0xFFFF of the container with key 0x7FFF, `base` is
Integer.MAX_VALUE: after the consumer receives it, `++l` wraps to Integer.MIN_VALUE, and with
`le == 0` the condition `MIN_VALUE <= MAX_VALUE` holds, so the loop goes on emitting 2^31, 2^31 +
1, … and stops only once `l` has wrapped all the way round — about 2^31 + 65536 spurious
callbacks. `RoaringBitmap b = new RoaringBitmap(); b.add(0x7FFF0000L, 0x7FFF0010L);
b.add(0x7FFFFFFF); b.forEach(consumer)` (17 values, one run container) calls the consumer more
than 200000 times before the zoo's guard aborts it; with 0x7FFFFFFE present as well (the last run
has length 1) the 18 callbacks are right, and the same run at key 0xFFFF (`add(0xFFFF0000L,
0xFFFF0010L); add(0xFFFFFFFF)`) is fine. Any bitmap whose values happen to isolate 0x7FFFFFFF in
a run container (a `runOptimize()`d one, or one built with `add(long, long)`) makes `forEach`
unusable; iterators, `toArray` and `stream` are unaffected, and `Roaring64NavigableMap.forEach`
goes through the same code for the low 32 bits.
'''
