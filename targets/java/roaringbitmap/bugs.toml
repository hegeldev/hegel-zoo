[[bug]]
id = "roaringbitmap/12"
title = "Roaring64NavigableMap's in-place and/andNot/xor leave empty buckets; first/last then throw and equals fails"
kind = "wrong-result"
severity = "medium"
test = "pinNavigableMapLastAfterAnAndThatEmptiesABucket"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
