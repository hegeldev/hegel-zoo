[[bug]]
id = "roaringbitmap/19"
title = "RoaringBitSet does not interoperate with java.util.BitSet: equals is false for equal bits and BitSet's operations read it as empty"
kind = "contract"
severity = "medium"
test = "pinRoaringBitSetInteroperatesWithBitSet"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`RoaringBitSet extends BitSet` ("A BitSet implementation based on RoaringBitmap") but keeps its
bits in a RoaringBitmap and never populates the inherited word array. Two consequences: (a)
`RoaringBitSet.equals(Object)` returns false unless the argument is a RoaringBitSet, so a plain
BitSet with exactly the same bits is not equal (BitSet's contract: "true if … the two BitSets have
exactly the same set of bits set to true"), and `new BitSet().equals(new RoaringBitSet())` is true
while the reverse is false — an asymmetric `equals`. (b) java.util.BitSet's `or`, `and`, `xor`,
`andNot`, `intersects` and `equals` read the argument's private words directly, so with a
RoaringBitSet argument they see an empty set: `plain.or(roaringBitSet)` leaves `plain` unchanged,
`plain.and(roaringBitSet)` clears it, `plain.intersects(roaringBitSet)` is false. The zoo's
BitSet-vs-RoaringBitSet model diverged on exactly these calls. Neither limitation is documented.
'''

[[bug]]
id = "roaringbitmap/20"
title = "RoaringBitSet/BitSetUtil toByteArray is padded to 64 bytes per word and toLongArray has an extra word below bit 64"
kind = "contract"
severity = "low"
test = "pinRoaringBitSetArraysHaveBitSetsLengths"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
BitSet documents `toByteArray().length == (length() + 7) / 8` and `toLongArray().length ==
(length() + 63) / 64`; `BitSetUtil.toByteArray` ("See BitSet#toByteArray()") allocates
`words.length * Long.SIZE` bytes — Long.SIZE is 64 bits, not 8 bytes — so
`RoaringBitSet` {3, 64, 1000} gives 1024 bytes where BitSet gives 126 (the tail is zeros; the
bytes decode to the right set). `BitSetUtil.toLongArray` computes `lastBit = max(last, 64)` and
then `numBits / 64 + 1` words, so for a set whose last bit is below 64 it returns 2 words instead
of 1 ({5} → 2 words). `RoaringBitSet.toByteArray()`/`toLongArray()` delegate to these.
'''

