decimal representation of that index is included in the result. Such indices are listed in order
from lowest to highest, separated by ", " (a comma and a space) and surrounded by braces" — the
example is "{2, 4, 10}". `RoaringBitSet.toString()` returns the RoaringBitmap's rendering,
"{3,64,1000}" without the spaces (and, for large sets, truncated with "..." after 0x80000
characters). Code that parses or compares BitSet renderings sees a different format from a
drop-in "BitSet implementation".
'''

[[bug]]
id = "roaringbitmap/22"
title = "RoaringBitSet.previousSetBit(-1) returns the last set bit"
kind = "wrong-result"
severity = "low"
test = "pinPreviousSetBitOfMinusOneIsMinusOne"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
BitSet.previousSetBit(fromIndex) allows -1 ("@throws IndexOutOfBoundsException if the specified
index is less than -1") and returns -1 for it. `RoaringBitSet.previousSetBit(int)` is
`(int) roaringBitmap.previousValue(fromIndex)`, and `previousValue` treats its int as unsigned:
-1 is 0xFFFFFFFF, the largest value, so the last set bit is returned — 7 for a RoaringBitSet
holding {7} (BitSet: -1). `previousClearBit(-1)` happens to be -1 unless the bit 0xFFFFFFFF is set.
The other index arguments of the BitSet API are non-negative and agree with BitSet.
'''

[[bug]]
