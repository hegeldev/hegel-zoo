notes = '''
`removeLong` drops a bucket whose RoaringBitmap becomes empty, but the in-place `and`, `andNot`
and `xor` do not. With `m = Roaring64NavigableMap.bitmapOf(5L, (1L << 40) + 1)` and
`m.and(bitmapOf(5L, (1L << 40) + 2))`: `toArray()` is [5] and `getLongCardinality()` 1, but
