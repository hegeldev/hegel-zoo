'''

[[bug]]
id = "roaringbitmap/13"
title = "Roaring64NavigableMap's static or/and/andNot/andCardinality ignore the operands' signed order"
kind = "wrong-result"
severity = "medium"
test = "pinSignedNavigableMapStaticsKeepTheSignedOrder"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The static `or`, `and` and `andNot` create `new Roaring64NavigableMap()` — unsigned order — for
the result and merge the operands' buckets with `Integer.compareUnsigned`, whatever the operands'
`signedLongs`. For two signed maps {-5, 3} and {-7, 4}, `Roaring64NavigableMap.or(a, b).toArray()`
is [3, 4, -7, -5] (unsigned order; the in-place `a.or(b)` gives [-7, -5, 3, 4]), so `first`,
`last`, `select`, `rankLong` and the iterators of the result follow a different order from the
operands'. The merge over signed-ordered bucket iterators also miscounts: `andCardinality` of
signed {-2^32, 7, 2^32} and {-2^33, 2^32} is 0 instead of 1 (both hold 2^32), and in the zoo's
runs `or` of signed maps threw IllegalStateException("Should push only not-existing high") from
`pushBitmapForHigh` when the misordered merge pushed a lower high after a higher one.
'''

[[bug]]
id = "roaringbitmap/14"
title = "Roaring64NavigableMap without cached cardinalities ranks with a signed comparison of the high parts"
kind = "wrong-result"
severity = "medium"
test = "pinUncachedNavigableMapRanksUnsigned"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`rankLongNoCache` (Roaring64NavigableMap.java ~548), used when the map was built with
`cacheCardinalities = false`, sums the buckets with `bitmap.getKey().intValue() > high` — a signed
comparison of the 32-bit high parts, although the map's order is unsigned by default. With
`new Roaring64NavigableMap(false, false)` holding {5}, `rankLong(-1L)` is 0 instead of 1 (-1 is
the largest unsigned long) and `rankLong(Long.MIN_VALUE)` is 0 instead of 1; the cached variant
(the default) and `Roaring64Bitmap` answer 1. Conversely a positive query on a map holding only
values with negative high parts counts them.
'''

[[bug]]
id = "roaringbitmap/15"
title = "Roaring64NavigableMap.deserializePortable silently switches a signed-order map to unsigned order"
kind = "documentation"
severity = "low"
test = "pinDeserializePortableKeepsTheSignedOrder"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`deserializePortable` sets `signedLongs = false` and rebuilds the bucket map with the unsigned
comparator (Roaring64NavigableMap.java ~1701, code comment "Portable format handles only unsigned
longs"); its Javadoc says only "Deserialize (retrieve) this bitmap" and nothing about the order.
A `new Roaring64NavigableMap(true)` that reads the portable bytes of a signed map holding {-5, 3}
ends up with `toArray()` [3, -5], `first()` 3, `last()` -5, `select(0)` 3 and `rankLong(0)` 0 —
the receiver's constructor argument is discarded. `serializePortable` itself does not record the
order, so the format cannot carry it; the receiver's own setting could be kept instead. The
legacy `serialize`/`deserialize` pair does carry the flag.
'''

