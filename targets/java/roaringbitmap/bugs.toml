# Bugs found in RoaringBitmap by the zoo's Hegel tests. Every entry has a `pin…` test in
# hegel/src/test/java/zoo/RoaringPinsTest.java that asserts the documented behaviour and fails while
# the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "roaringbitmap/1"
title = "nextAbsentValue/previousAbsentValue below a container with key >= 0x8000 jump into that container"
kind = "wrong-result"
severity = "medium"
test = "pinNextAbsentValueBelowAHighContainerIsTheValueItself"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`computeNextAbsentValue` and `computePreviousAbsentValue` locate the first container whose key is
>= the key of `fromValue` and then test `if (fromValue < containerKey << 16) return fromValue`
(RoaringBitmap.java ~2962 and ~3005). The comparison is signed: for a container key >= 0x8000 the
shifted key is a negative int, so a non-negative `fromValue` below that container is never
recognised as lying before it, and the search continues inside the container as if `fromValue`
belonged to it. `RoaringBitmap.bitmapOf(0x80000005).nextAbsentValue(100)` is 2147483748
(0x80000064) instead of 100, `nextAbsentValue(0x7fffffff)` is 2147549183, and
`previousAbsentValue(0x7fffffff)` is 2147549183 — larger than the argument. Any bitmap whose only
values are "negative" ints (>= 2^31 unsigned) gives wrong answers for queries at positive values.
Found by the unsigned TreeSet model of `mutationsAndQueriesMatchAnUnsignedSetModel`.
'''

[[bug]]
id = "roaringbitmap/2"
title = "RunContainer.forEach emits nothing for a run at key 0x8000 whose start is below its length"
kind = "wrong-result"
severity = "medium"
test = "pinForEachVisitsARunStartingAtTwoToThe31"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
RunContainer.forEach (RunContainer.java:2493) loops `for (int l = base; l - le <= base; ++l)` with
`base = start | (key << 16)`. For key 0x8000 `base` is Integer.MIN_VALUE + start; when the run's
start is smaller than its length `l - le` underflows to a large positive int on the first
iteration, the condition is false and the run is skipped entirely.
`RoaringBitmap.bitmapOfRange(1L << 31, (1L << 31) + 10).forEach(consumer)` calls the consumer
zero times although the cardinality is 10 (the range constructor builds run containers, so no
`runOptimize()` is needed); `[2^31+3, 2^31+10)` is skipped too, `[2^31+5, 2^31+10)` (start 5 >=
length 4) is visited. Iterators, `toArray`, `stream` and `forEachInRange` are unaffected.
'''

[[bug]]
id = "roaringbitmap/3"
title = "forEachInRange/forAllInRange stop at 2^31"
kind = "wrong-result"
severity = "medium"
test = "pinForEachInRangeReachesTwoToThe31"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`forAllInRange(int uStart, int length, consumer)` documents an unsigned start ("Consume presence
information for all values in the range [start, start + length)") and checks the end against the
unsigned range, but the walk over the containers stops when the range reaches 2^31.
`RoaringBitmap.bitmapOfRange(0x7FFF0000L, 1L << 31).forEachInRange(0x7FFF0000, 0x10000, c)`
visits nothing (65535 for length 0xFFFF); a range across the boundary,
`bitmapOfRange(0x7FFFFFF0L, 0x80000010L).forEachInRange(0x7FFFFFF0, 32, c)`, visits only the 16
values below 2^31. Ranges entirely above 2^31 work.
'''

[[bug]]
id = "roaringbitmap/4"
title = "addOffset by a multiple of 65536 wraps containers that fall outside the 32-bit range, or throws"
kind = "wrong-result"
severity = "medium"
test = "pinAddOffsetByWholeContainersDropsWhatFallsOutside"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc: "Values that would fall outside of the valid 32-bit range are discarded". When the
offset is a whole number of containers (`in_container_offset == 0`, RoaringBitmap.java ~288) the
fast path appends every container under `(char) (key + container_offset)` without the range check
the general path has, so keys wrap modulo 65536: `RoaringBitmap.addOffset(bitmapOf(5), -65536)` is
{4294901765} instead of {}, `addOffset(bitmapOf(5), -2147483648L)` is {2147483653},
`addOffset(bitmapOf(0xFFFF0005), 65536)` is {5}; and when a wrapped key lands below a key already
appended, `RoaringArray.append` throws `IllegalArgumentException("append only: …")` —
`addOffset(bitmapOf(5, 0xFFFF0005), 65536)`. Offsets that are not multiples of 65536 are handled
correctly (`addOffset(bitmapOf(5), -65535)` is {}).
'''

[[bug]]
id = "roaringbitmap/5"
title = "orNot includes the other bitmap's values beyond rangeEnd when this bitmap has no container there"
kind = "wrong-result"
severity = "medium"
test = "pinOrNotStaysWithinTheRange"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`orNot(x1, x2, rangeEnd)` (static and in-place, `RoaringBitmap` and the buffer classes) is
"x1 OR NOT x2" over [0, rangeEnd). In the last container of the range, when only x2 has a
container, the code negates x2's container over [0, lastRun) and keeps the rest of it, so x2's
values at or above rangeEnd within that container appear in the result:
`RoaringBitmap.orNot(new RoaringBitmap(), RoaringBitmap.bitmapOf(1, 77), 1)` is {0,1,77} instead
of {0}; `orNot({}, {1,77}, 3)` is {0,2,77}; `orNot({}, {70000}, 69566)` has cardinality 69567 and
contains 70000. With x1 owning that container the result is right (`orNot({5}, {1,77}, 3)` =
{0,2,5}), and x2's values in containers wholly beyond the range are correctly dropped.
'''

[[bug]]
id = "roaringbitmap/6"
title = "FastAggregation.horizontal_xor leaves an empty container when a key cancels out"
kind = "wrong-result"
severity = "medium"
test = "pinHorizontalXorOfEqualBitmapsIsEmpty"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`FastAggregation.horizontal_xor(bitmapOf(1), bitmapOf(1))` (and `BufferFastAggregation`'s) returns
a bitmap with one empty container: `isEmpty()` is false, `getContainerCount()` is 1,
`getCardinality()` is 0, `toString()` is "{0}", `first()` throws NoSuchElementException("Empty
array"), and it is not `equals` to `new RoaringBitmap()` although `toArray()` is empty. `xor`,
`naive_xor` and `priorityqueue_xor` of the same inputs are properly empty. Any set of operands in
which some key's containers xor to nothing produces such a malformed bitmap.
