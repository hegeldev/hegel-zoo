[[bug]]
id = "roaringbitmap/7"
title = "contains(min, sup) mishandles the supremum's container: false for sup = 2^32, true when it is absent beyond the last key"
kind = "wrong-result"
severity = "low"
test = "pinContainsRangeHandlesTheSupremumsContainer"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`contains(long minimum, long supremum)` (RoaringBitmap, ImmutableRoaringBitmap, MutableRoaringBitmap)
computes `lastKey = highbits(supremum)`. (a) For the documented maximum `supremum = 0xffffffff + 1`
that key is (char) 0x10000 = 0, the span goes negative and the answer is always false:
`bitmapOf(0xFFFFFFFF).contains(0xFFFFFFFFL, 1L << 32)` is false, as is
`bitmapOfRange(0xFFFE0000L, 1L << 32).contains(0xFFFE0000L, 1L << 32)`; `rangeCardinality` and
`intersects` handle the same bounds correctly. (b) When no container exists for `lastKey`,
`getIndex` returns a negative insertion point that is turned into an index (`end = -end - 1`),
`end - begin == span` still holds, and the check of the supremum's low bits is applied to
whatever container sits at that index: none when it is `len` (the guard `end < len` skips it), so
`bitmapOf(0xFFFEFFFF).contains(0xFFFEFFFFL, 0xFFFF0002L)` is true although 0xFFFF0000 and
0xFFFF0001 are absent (likewise `bitmapOf(0x7FFFFFFF).contains(0x7FFFFFFFL, 0x80001B1BL)`); or the
next container present, so `bitmapOf(131071, 196608, 196609).contains(131071L, 131074L)` is true
because the container for key 3 holds its values 0 and 1 while the whole of container 2 is
missing (and `bitmapOf(0x7FFFFFFF, 0xFFFF0000, 0xFFFF0001).contains(0x7FFFFFFFL, 0x80000002L)`).
'''

[[bug]]
id = "roaringbitmap/8"
title = "Equal run-optimised bitmaps can have different hashCodes when a container ties between run and array form"
kind = "contract"
severity = "low"
test = "pinEqualRunOptimisedBitmapsShareAHashCode"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Javadoc of `hashCode` promises: "If the two bitmaps are equal *and* they have the same
hasRunCompression() result, then they have the same hashCode()", and tells users to call
`runOptimize()` on all their bitmaps to satisfy the Java contract. `runOptimize()` does not
normalise a container whose run and array encodings have the same size: three consecutive values
are 6 bytes either way, so `add(15L, 18L)` (a RunContainer) stays a run and `bitmapOf(15, 16, 17)`
(an ArrayContainer) stays an array. With a second, run-compressed container added to both (so that
`hasRunCompression()` is true for both), the two bitmaps are `equals` yet hash to 15807302 and
16284919. `RoaringArray.hashCode` sums the containers' hash codes, which depend on the encoding.
'''

[[bug]]
id = "roaringbitmap/9"
title = "RoaringBitmapWriter.Wizard.initialCapacity refuses 65535 and 65536, so expectedRange over the whole range throws"
kind = "contract"
severity = "low"
test = "pinWriterAcceptsTheWholeRange"
found = { commit = "f2289086f4204df51a1d9c4e494d50ffa3ee8988", version = "1.6.23 (2026-09-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`sanityCheck(int count)` (RoaringBitmapWriter.java:163) rejects `count >= 0xFFFF` with the message
`count + " > 65536"`, so `initialCapacity(65535)` fails with "65535 > 65536" and
`initialCapacity(65536)` — the number of containers of the whole 32-bit range — with
"65536 > 65536". `expectedRange(min, max)` computes `((max - min) >>> 16) + 1` containers, so
`RoaringBitmapWriter.writer().expectedRange(0, (1L << 32) - 1)` throws IllegalArgumentException,
and so does any range covering the last two container keys. A `RoaringBitmap` itself holds 65536
containers without trouble.
'''

[[bug]]
