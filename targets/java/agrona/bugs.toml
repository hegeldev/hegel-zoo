[[bug]]
id = "agrona/2"
title = "parseIntAscii and parseNaturalIntAscii (the DirectBuffer methods and AsciiEncoding.parseIntAscii(CharSequence)) throw AsciiNumberFormatException(\"int overflow parsing\") for any input of more than 10 digits regardless of its value, so a decimal int with leading zeros such as 00000000001 is rejected although it is a valid representation of 1 (parseLongAscii reads the same bytes as 1); parseLongAscii does the same past 19 digits (00000000000000000001); putNaturalPaddedIntAscii(index, 11, 5) itself writes a string that parseNaturalIntAscii(index, 11) cannot read back (parsePositiveIntAsciiOverflowCheck: `if ((end - startIndex) > INT_MAX_DIGITS) throwParseIntOverflowError(...)`)"
kind = "wrong-result"
severity = "low"
test = "pin_leadingZerosParse"
found = { commit = "6a57dd3df11c4ca1d73ebb791218b2499ff8d6b0", version = "2.7.0-SNAPSHOT (2026-08-31)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by intAndLongAsciiRoundTrip parsing back what putNaturalPaddedIntAscii wrote with a field width above 10, then confirmed against Integer.parseInt by asciiParsersMatchTheJdk. Up to 10 characters leading zeros parse fine (0000000001 -> 1). Both properties skip well-formed inputs longer than the digit budget. FIX-style fixed-width fields with leading zeros are exactly what putNaturalPaddedIntAscii produces, so a parser and a writer of the same class disagree."

