[[bug]]
id = "agrona/4"
title = "ExpandableArrayBuffer and ExpandableDirectByteBuffer copying from themselves, putBytes(index, this, srcIndex, length) or getBytes(index, this, dstIndex, length) (which is dstBuffer.putBytes), call ensureCapacity for the destination before srcBuffer.boundsCheck for the source, so when the growth covers the source range a copy from beyond the old capacity succeeds (reading the zeroed extension) instead of throwing the IndexOutOfBoundsException the class javadoc promises for get operations past the current capacity: new ExpandableArrayBuffer(16).getBytes(8, this, 20, 12) grows the buffer to 36 and returns"
kind = "contract"
severity = "low"
test = "pin_expandableSelfCopyChecksSource"
found = { commit = "6a57dd3df11c4ca1d73ebb791218b2499ff8d6b0", version = "2.7.0-SNAPSHOT (2026-08-31)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by buffersMatchAByteArrayModel, whose byte[] model rejects the source range. Copies from another buffer and UnsafeBuffer self copies throw as expected; only the destination-grows-first ordering with dst == src is affected. The property skips self copies whose source lies beyond the capacity of an expandable buffer."

