[[bug]]
id = "agrona/1"
title = "MutableDirectBuffer.putNaturalIntAsciiFromEnd(0, endExclusive) writes nothing and returns endExclusive: the digit loop is `while (remainder > 0)`, so zero, a natural number whose digitCount is 1 and for which the method reserves one byte with ensureCapacity, gets an empty encoding instead of \"0\" at endExclusive - 1 (AbstractMutableDirectBuffer.putNaturalIntAsciiFromEnd; upstream's shouldPutNaturalFromEnd test never uses 0)"
kind = "wrong-result"
severity = "low"
test = "pin_naturalIntFromEndWritesZero"
found = { commit = "6a57dd3df11c4ca1d73ebb791218b2499ff8d6b0", version = "2.7.0-SNAPSHOT (2026-08-31)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by intAndLongAsciiRoundTrip on the first collect round (every buffer implementation shares the code). putNaturalIntAscii(index, 0) and putIntAscii(index, 0) write \"0\" correctly; only the from-the-end variant is affected. Negative values likewise write nothing, but those are outside the documented natural-number domain. The property skips value 0 for this method."

