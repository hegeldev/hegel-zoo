[[bug]]
id = "agrona/3"
title = "ExpandableRingBuffer.append writes a record past the end of its buffer when the free space is split between the end and the front of the ring, the record fits in the total but in neither part, and the ring may not grow (resize returns silently when the next power of two exceeds maxCapacity): the final `alignedLength > newTotalRemaining` check passes and writeMessage puts the header at the tail offset with the payload beyond the capacity, an IndexOutOfBoundsException with bounds checks on and an out-of-bounds write with agrona.disable.bounds.checks=true; new ExpandableRingBuffer(64, 64, false): append 8 bytes, append 32 bytes, consume one message, append 15 bytes -> Range [64, 64 + 15) out of bounds for length 64 (append should return false, or pad and wrap)"
kind = "crash"
severity = "medium"
test = "pin_expandableRingAppendSplitSpace"
found = { commit = "6a57dd3df11c4ca1d73ebb791218b2499ff8d6b0", version = "2.7.0-SNAPSHOT (2026-08-31)", hegel = "0.6.0", date = "2026-09-16" }
status = "fixed"
upstream_issue = ""
fixed_in = "2.7.0-SNAPSHOT (b4858542512f)"
notes = "Found by expandableRingBufferIsAFifo (exception out of append after a refused larger append). The `tailOffset >= headOffset` branch handles the case where the record fits at the front (padding record, then wrap) and otherwise calls resize; nothing handles resize declining. The property recognises the shape from head()/tail()/capacity()/maxCapacity() and skips that append. Aeron uses ExpandableRingBuffer for pending work, usually with maxCapacity far above what is queued."

