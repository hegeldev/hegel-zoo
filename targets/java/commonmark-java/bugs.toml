notes = '''
`` `` `a` `c` ``: the double backtick has no closer and is literal text; `` `a` `` and `` `c` `` are code spans (spec §Code
spans, commonmark.js and cmark give `<p>`` <code>a</code> <code>c</code></p>`). commonmark-java renders `` `c` `` as text.
`BackticksInlineParser` caches the position of the last backtick run of each length while scanning for a closer; once it
has scanned to the end (for the unclosed `` `` ``) it trusts the cache to say whether a closer can exist. But every later
scan overwrites the cache with the positions it passes — the scan that closes `` `a` `` stores the backtick after `a` as the
"last" run of length 1 — so the opener of `` `c` `` finds a cached "last" position before itself and gives up without
scanning. Any paragraph with an unclosed backtick string followed by two code spans of the same length loses the second.
'''
