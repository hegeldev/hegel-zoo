'''

[[bug]]
id = "commonmark-java/12"
title = "Node.insertAfter/insertBefore throw NullPointerException when the receiver has no parent"
kind = "crash"
severity = "low"
test = "pinInsertAfterOnDetachedNode"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Node.java:98-100` and `:113-115` write `sibling.parent.lastChild`/`firstChild` after copying `this.parent`, which is
null for a detached node or a `Document`, so `new Paragraph().insertAfter(new Paragraph())` throws
`NullPointerException` ("Cannot assign field lastChild"). The Javadoc documents no precondition; cmark's
`cmark_node_insert_after` reports failure instead.
'''

[[bug]]
id = "commonmark-java/13"
title = "MarkdownRenderer writes a hard line break at the start of a paragraph as two spaces, which vanish"
kind = "roundtrip"
severity = "medium"
test = "pinRenderedHardBreakAtParagraphStart"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`\\\na` (a backslash hard break, then `a`) renders to Markdown as `  \na`; leading spaces of a paragraph line are
stripped on parsing, so the break is gone (`<p>a</p>` instead of `<p><br />\na</p>`). The same happens inside list items
(`+ \\\n=`), and with two hard breaks in a row (`a  \n \\\na`, `<p>a<br />\n<br />\na</p>`) the second is
written as a line of two spaces — a blank line, which splits the paragraph. The renderer writes the break as trailing
spaces (`CoreMarkdownNodeRenderer.visit(HardLineBreak)`) without considering that nothing precedes it on the line; a
backslash form would survive.
'''

[[bug]]
id = "commonmark-java/14"
title = "MarkdownRenderer glues an info string that starts with the fence character onto the fence"
kind = "roundtrip"
severity = "medium"
test = "pinRenderedInfoStringStartingWithFenceCharacter"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CoreMarkdownNodeRenderer.visit(FencedCodeBlock)` (CoreMarkdownNodeRenderer.java:188-190) writes the fence and then
the info string with nothing between them. `~~~ ~\na\n~~~` has info `~`; it is rendered `~~~~\na\n~~~`, a four-tilde fence
that the three-tilde line does not close, so the block swallows the rest of the document. (With a backtick fence and an
info string starting with a backtick the result is not a fence at all, see commonmark-java/7.)
'''

[[bug]]
id = "commonmark-java/15"
title = "MarkdownRenderer writes nested or adjacent emphasis with the same delimiter character, so the runs merge on re-parse"
kind = "roundtrip"
severity = "medium"
test = "pinRenderedNestedEmphasisSameDelimiter"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CoreMarkdownNodeRenderer.visit(Emphasis)` (CoreMarkdownNodeRenderer.java:320-330) writes `getOpeningDelimiter()`
verbatim whenever it is set (always, for parsed nodes); its "use the other character when nested" fallback is reached
only for hand-built nodes. `__$_ —__` (`<em><em>$</em> —</em>_`) is rendered `__$_ —_\_`, which parses as
`_<em>$</em> —__`; `***a*a*` (`*<em><em>a</em>a</em>`) is rendered `\***a*a*` and parses as `***a<em>a</em>`. The
class Javadoc promises that the output "parsed again and compared against the original AST ... should be the same".
'''

