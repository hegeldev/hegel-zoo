upstream_issue = ""
fixed_in = ""
notes = '''
`*\n  ***` is a bullet list whose item holds a thematic break; the renderer writes `* ***`, and a line of four
asterisks separated by spaces is itself a thematic break (spec §Thematic breaks), so the list disappears:
`<hr />` instead of `<ul><li><hr /></li></ul>`. `visit(ThematicBreak)` writes the original literal (or `***`) without
checking the marker of the enclosing list; `- ---` has the same problem.
