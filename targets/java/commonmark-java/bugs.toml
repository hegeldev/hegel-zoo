[[bug]]
id = "commonmark-java/18"
title = "MarkdownRenderer writes an autolink inside link text as [text](dest), which does not re-parse"
kind = "roundtrip"
severity = "low"
test = "pinRenderedAutolinkInsideLinkText"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`[<a@a>]()` parses as a link whose text holds an autolink (spec: autolinks are not bracketed links, so this nesting
is allowed and commonmark.js agrees). The renderer writes every `Link` as `[text](destination)`, giving
`[[a@a](mailto:a@a)]()`, where the inner link wins and the outer brackets stay text: `<p>[<a href="mailto:a@a">a@a</a>]()</p>`
instead of `<p><a href=""><a href="mailto:a@a">a@a</a></a></p>`. A `Link` whose text equals its destination (or
`mailto:` + text) could be written as `<...>`.
'''

[[bug]]
id = "commonmark-java/19"
title = "MarkdownRenderer writes a thematic break as *** right after a * bullet, which re-parses as one thematic break"
kind = "roundtrip"
severity = "medium"
test = "pinRenderedThematicBreakInBulletItem"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
