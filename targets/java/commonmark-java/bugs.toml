[[bug]]
id = "commonmark-java/10"
title = "Vertical tab (and form feed, CR) count as whitespace between the parts of a link"
kind = "wrong-result"
severity = "low"
test = "pinVerticalTabIsNotLinkWhitespace"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Scanner.whitespace()` (parser/beta/Scanner.java:177-194) accepts `\u000B`, `\f` and `\r` and is used by
`InlineParserImpl.parseInlineDestinationTitle` and `LinkReferenceDefinitionParser`, so `[a](\u000Bb)` is a link to `b`.
Spec §Links: the parts are separated by "spaces or tabs (including up to one line ending)", and U+000B is an ASCII
control character that cannot appear in a destination; commonmark.js leaves the text alone.
'''

[[bug]]
id = "commonmark-java/11"
title = "Link label normalisation strips ASCII control characters at the ends"
kind = "wrong-result"
severity = "low"
test = "pinLabelNormalisationStripsOnlyWhitespace"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
