[[bug]]
id = "commonmark-java/6"
title = "A numeric character reference to a surrogate code point produces a lone surrogate"
kind = "silent-corruption"
severity = "medium"
test = "pinSurrogateCharacterReference"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`Html5Entities.java:31-39` maps only 0 and values above U+10FFFF to U+FFFD; `Character.toChars(0xD800)` succeeds and
yields an unpaired surrogate, so `&#xD800;` (and `&#55296;`, `&#xDFFF;`) puts invalid UTF-16 into the text node and
the HTML. Spec §Entity and numeric character references: "Invalid Unicode code points will be replaced by the
REPLACEMENT CHARACTER (U+FFFD)"; commonmark.js and cmark write U+FFFD.
'''

[[bug]]
id = "commonmark-java/7"
title = "A backtick fence directly followed by a tilde (or a tilde fence by a backtick) is not a code fence"
kind = "wrong-result"
severity = "medium"
test = "pinFenceFollowedByTheOtherFenceCharacter"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`FencedCodeBlockParser.checkOpener` (FencedCodeBlockParser.java:96-124) counts backticks and tildes in one run and
requires the other count to be zero, so ```` ```~ ```` and `~~~`` open no fence: ```` ```~\na\n``` ```` is a paragraph
followed by an empty code block. Spec §Fenced code blocks: the info string of a backtick fence "may not contain any
backtick characters" (tildes are fine) and "Info strings for tilde code blocks can contain backticks and tildes";
commonmark.js gives `<pre><code class="language-~">a`. A space between fence and info avoids it.
'''

[[bug]]
