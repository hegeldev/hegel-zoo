# Bugs found in commonmark-java by the Hegel zoo. Pins: hegel/src/test/java/zoo/CommonmarkPinsTest.java.

[[bug]]
id = "commonmark-java/1"
title = "A blank line after a thematic break, heading, HTML block or indented code block inside a list item does not make the list loose"
kind = "wrong-result"
severity = "medium"
test = "pinLooseListAfterThematicBreak"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`ListItemParser.java:64` only counts a blank line when the active block is a paragraph or a list item
(`hadBlankLine = activeBlock instanceof Paragraph || activeBlock instanceof ListItem`), so `- ***\n\n  foo`, `- # h\n\n  foo`,
`- <!-- x -->\n\n  foo` and `2.     a\n\n   a` (indented code, then a paragraph) render tight (`<li>\n<hr />\nfoo</li>`).
Spec 0.31.2 §Lists: "A list is loose if ... any of its constituent list items directly contain two block-level elements
with a blank line between them." commonmark.js renders `<p>foo</p>`. Fenced code and block quotes are handled.
The flag is also inconsistent: `1.\n   #\n\n\n   1.` (blank first line, two blank lines) parses loose, while
`MarkdownRenderer`'s output for it, `1. # \n   \n   1. `, parses tight — the same structure — so rendering is not a fixed
point (the second rendering loses the blank line), although the HTML of both is the same.
'''

[[bug]]
id = "commonmark-java/2"
title = "A tab partly consumed by the fence indentation or a container marker is kept whole in fenced code and HTML block content"
kind = "wrong-result"
severity = "medium"
test = "pinPartialTabInFencedCode"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
With a fence indented N spaces "up to N spaces of indentation are removed from each line of the content" (spec §Fenced
code blocks), and a tab counts as columns up to the next tab stop (§Tabs): ` ```\n\tx` has content `   x` (three spaces)
in commonmark.js and cmark, `>```\n>\tx` has `  x`. commonmark-java keeps the raw tab (`\tx`): the fenced code block
parser removes indentation by characters (`FencedCodeBlockParser.tryContinue` / `DocumentParser.addLine` for the quote's
optional space) without expanding a partially consumed tab, which indented code blocks do handle (spec example 5).
HTML blocks keep the whole tab too: `>\t<!DOCTYPE html>` is `<blockquote>\n  <!DOCTYPE html>` in commonmark.js (two
columns of the tab remain after the marker's optional space) and `<blockquote>\n\t<!DOCTYPE html>` here; MarkdownRenderer
then writes the literal after its own `> ` prefix, where the tab is wider, and `>>\t<!DOCTYPE html>` re-parses as
indented code.
'''

[[bug]]
id = "commonmark-java/3"
title = "The language class takes the info string up to the first space only, so a tab is part of it"
kind = "wrong-result"
severity = "low"
test = "pinInfoStringFirstWordEndsAtTab"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`CoreHtmlNodeRenderer.java:109` splits the info string with `info.indexOf(" ")`; spec §Fenced code blocks: "The first
word of the info string is typically used to specify the language". `~~~a\tb` renders `class="language-a\tb"`;
commonmark.js and cmark give `language-a`.
'''

[[bug]]
id = "commonmark-java/4"
title = "A link destination with an unbalanced ( is accepted when followed by whitespace or the end of the line"
kind = "wrong-result"
severity = "low"
test = "pinUnbalancedParenthesisInDestination"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`LinkScanner.scanLinkDestinationWithBalancedParens` (LinkScanner.java:119-160) returns true at a space or at the end
of the input without checking that `parens == 0`. `[a](( )` becomes a link with `href="("` and `[a]:(` a reference
definition (so the line vanishes); `[a]: (b\n\n[a]` links to `(b`. Spec §Links: a destination "includes parentheses only
if (a) they are backslash-escaped or (b) they are part of a balanced pair of unescaped parentheses"; commonmark.js
leaves all three as text.
'''

[[bug]]
