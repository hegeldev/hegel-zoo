[[bug]]
id = "commonmark-java/20"
title = "MarkdownRenderer decodes an entity right after an emphasis closer, which is then no longer right-flanking"
kind = "roundtrip"
severity = "low"
test = "pinRenderedEntityAfterEmphasisCloser"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`**.**&AElig;` is `<strong>.</strong>Æ`: the closing `**` is followed by `&`, punctuation, so the run is
right-flanking. The renderer writes the decoded text, `**.**Æ`, where the closer is followed by a letter and preceded
by punctuation and so cannot close: the round trip gives `<p>**.**Æ</p>`. Writing the character as a reference
(`&#198;`) or escaping the delimiters would keep the structure.
'''

[[bug]]
