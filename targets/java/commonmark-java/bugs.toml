[[bug]]
id = "commonmark-java/9"
title = "An inline HTML declaration is only recognised with whitespace after its name"
kind = "wrong-result"
severity = "low"
test = "pinInlineDeclarationWithoutWhitespace"
found = { commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf", version = "0.30.1-SNAPSHOT (2026-08-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`HtmlInlineParser.tryDeclaration` (HtmlInlineParser.java:240-257) returns false when `scanner.whitespace() <= 0`.
Spec 0.31.2 §Raw HTML: "A declaration consists of the string `<!`, an ASCII letter, zero or more characters not
including the character `>`, and the character `>`" (the whitespace requirement was dropped in 0.30). `foo <!A>` and
