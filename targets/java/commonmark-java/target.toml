name = "commonmark-java"
language = "java"
upstream = "https://github.com/commonmark/commonmark-java"
subdir = ""
license = "BSD-2-Clause"
# CONTRIBUTING.md (tests for changes, existing style, separate PRs, discuss big changes first), README, the issue
# template and .github/ say nothing about AI; no CLAUDE.md/AGENTS.md/copilot-instructions.
ai_policy_checked = "2026-09-16"

[base]
commit = "b89e72fdb25948c1b9623d64baa29d35d49f8abf"
date = "2026-08-07"
version = "0.30.1-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# The reactor's modules (core, the ten extensions, test-util; the integration-test module is left out) are installed
# into the local Maven repository with Javadoc, sources, signing and JaCoCo skipped (about half a minute). commonmark.js
# 0.31.2, the reference implementation and oracle, is npm-installed from hegel/node/package.json; the tests start
# `node hegel/node/oracle.js` as a child.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Djacoco.skip=true -pl '!commonmark-integration-test' install",
  "cd hegel/node && npm install --no-package-lock --no-audit --no-fund --loglevel=error",
]

