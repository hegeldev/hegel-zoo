[[bug]]
id = "sbe/3"
title = "OtfMessageDecoder (and so JsonPrinter) decodes a composite field added in a later schema version from the buffer of an older message instead of treating it as not present: decodeComposite passes each member token as both field and type token, so the composite field's own sinceVersion is never compared with the acting version; on a version-0 message of a schema whose version-1 composite field lies past the old block length the printer throws IndexOutOfBoundsException (Range [12, 12 + 2) out of bounds for length 12 for a 4-byte block followed by a 4-byte composite) or prints bytes of the following groups and var data as the composite's members"
kind = "crash"
severity = "medium"
test = "pin_printerSkipsCompositesAddedAfterTheActingVersion"
found = { commit = "89bb53644fad489f145b68b0435fefbb2a8652e1", version = "1.41.0-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by olderMessagesDecodeWithNewerCodecs (59 exceptions and about 40 wrong composites in 100 cases). Primitive, enum, set and var-data fields and groups added later are handled (constOrNotPresentValue compares the field token's version). The C++ OTF decoder (sbe-tool/src/main/cpp/otf/OtfMessageDecoder.h) has the same structure but was not run. The property now chooses the acting version so that every composite field of the message is present."

