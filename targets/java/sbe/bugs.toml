[[bug]]
id = "sbe/1"
title = "JsonPrinter prints uint64 values as signed longs: a uint64 field holding 18446744073709551585 prints as -31 and the uint64 null value 18446744073709551615 as -1 (otf/Types.appendAsJsonString appends buffer.getLong for UINT64, while UINT32 is widened with & 0xFFFF_FFFFL)"
kind = "wrong-result"
severity = "low"
test = "pin_uint64ValuesPrintUnsigned"
found = { commit = "89bb53644fad489f145b68b0435fefbb2a8652e1", version = "1.41.0-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by printerShowsTheEncodedValues with uint64 values above Long.MAX_VALUE; the model records the signed rendering as the expected value (SbeGen.writeOne, case UINT64). Types.getLong has the same signed reading, so enum/set handling of uint64 is consistent with itself."

