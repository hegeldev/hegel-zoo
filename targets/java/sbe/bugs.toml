[[bug]]
id = "sbe/7"
title = "SinceVersionSchemaTransformer (SchemaTransformerFactory \"*:<version>\", SbeTool's sbe.transform.since.version) loses the block length of every group: removeFields copies groups with new Field(field, groupFields), which does not carry the computedBlockLength/computedOffset that XmlSchemaParser computed, and Message(message, newFields) recomputes only the message's own block length, so the IR of the transformed schema has encodedLength 0 for every BEGIN_GROUP (6 and 8 become 0 for a group of int32+int16 with a nested group of int64) and codecs generated from it write group headers with blockLength 0 while placing the fields at their offsets; the offsets of the remaining groups' and var data's tokens likewise stay those of the original layout"
kind = "silent-corruption"
severity = "medium"
test = "pin_transformedSchemasKeepGroupBlockLengths"
found = { commit = "89bb53644fad489f145b68b0435fefbb2a8652e1", version = "1.41.0-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by olderMessagesDecodeWithNewerCodecs, where messages encoded from the transformed schema's IR printed enum fields inside groups as null and the DTO reported unknown enum values (the group blocks overlapped). The property now prunes the XML itself (SbeTest.olderSchema) and checks that the transformer agrees with the pruned schema for messages without groups. Groups' field offsets and the message block length survive."

