[[bug]]
id = "sbe/2"
title = "IrGenerator gives the BEGIN_SET/END_SET tokens of a bit set an Encoding without the schema's byte order (Encoding.Builder default LITTLE_ENDIAN) while the CHOICE tokens carry it, so in a bigEndian schema the IR says the set is little-endian and its choices big-endian; the Go flyweight generator, which formats each token's own byte order, emits Clear()/IsEmpty() with the little-endian helpers and the choice accessors with the big-endian ones (add(SetType, ...) in xml/IrGenerator.java lacks the .byteOrder(schema.byteOrder()) that add(EnumType, ...) and add(SetType.Choice, ...) have)"
kind = "wrong-result"
severity = "low"
test = "pin_setTokensCarryTheSchemaByteOrder"
found = { commit = "89bb53644fad489f145b68b0435fefbb2a8652e1", version = "1.41.0-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found when the model wrote big-endian sets with the set token's byte order and the printer (which reads with the choice tokens) disagreed; the model now writes sets in the schema's byte order (SbeGen.schemaOrder). The Java generator is unaffected (it uses one BYTE_ORDER constant per class from the schema), the C/C++ codecs use memcpy for clear()/rawValue(), Rust and C# read with the schema's order; Clear() writing zero and IsEmpty() comparing with zero are byte-order neutral, so the Go inconsistency is harmless in practice, but the IR is wrong for any consumer that trusts the set token."

