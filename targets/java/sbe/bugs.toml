[[bug]]
id = "sbe/9"
title = "JsonPrinter shows every choice of a bit-set field that is not present in the message (added after the message's acting version) as true: the OTF listener substitutes the encoding's null value for a not-present field, and for a set that is all bits set (255 for uint8, 65535 for uint16), so {\"a\": true, \"b\": true} is printed for a set the sender never wrote, while the generated codecs and DTOs treat the same set as absent/empty"
kind = "wrong-result"
severity = "low"
test = "pin_absentSetsPrintNoChoices"
found = { commit = "89bb53644fad489f145b68b0435fefbb2a8652e1", version = "1.41.0-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by olderMessagesDecodeWithNewerCodecs. Printing the null value for a not-present field is the listener's convention for numbers (-2147483648 for an int32) and enums (the null valid value, or \"null\"), which the model follows; for sets the convention produces a positive statement about every choice, so the model expects all choices true on the printer route and all false on the DTO route (SbeTest.addDefaults)."

