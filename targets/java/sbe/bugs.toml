[[bug]]
id = "sbe/10"
title = "JsonPrinter throws IndexOutOfBoundsException on a message whose last field is a constant enum (presence=\"constant\" valueRef=\"E.Case1\") when the buffer is exactly the message's length: JsonTokenListener.onEnum calls readEncodingAsLong on the buffer before looking at fieldToken.isConstantEncoding(), and the constant field's offset is the block length, so one byte past the message is read (Range [12, 12 + 1) out of bounds for length 12 for an int32 followed by the constant); with a larger buffer the read garbage is ignored and the constant printed"
kind = "crash"
severity = "low"
test = "pin_printerReadsNothingForConstantEnums"
found = { commit = "89bb53644fad489f145b68b0435fefbb2a8652e1", version = "1.41.0-SNAPSHOT (2026-09-09)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = "Found by olderMessagesDecodeWithNewerCodecs, which printed from an exact-length buffer while printerShowsTheEncodedValues used the encoder's larger buffer and never saw it. Constant primitive fields are fine (constOrNotPresentValue returns before any read). Both properties now print from a buffer padded with eight zero bytes. On an older message the constant field is read at its offset in the current schema, which can lie well past the old block (a version-0 message of one char field, printed with a version-3 schema holding a uint64 before the constant: Range [17, 17 + 1) out of bounds for length 17 even with the padding), so olderMessagesDecodeWithNewerCodecs pads to the current schema's block length."

