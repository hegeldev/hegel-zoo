# Bugs found in snakeyaml-engine by the zoo's Hegel tests. Every entry has a `pinN_…` test in
# hegel/src/test/java/zoo/EnginePinsTest.java that asserts the YAML 1.2 behaviour (or the engine's own documented
# behaviour) and fails while the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "snakeyaml-engine/1"
title = "The core schema's float constructor fails on `+.inf` with a NumberFormatException instead of giving +Infinity"
kind = "crash"
severity = "medium"
test = "pin1_plusInfinityUnderTheCoreSchema"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The core schema's resolver (`CoreScalarResolver`, FLOAT `[-+]?\.(inf|Inf|INF)`) tags `+.inf` as a float,
as spec 10.3.2 says, but `ConstructYamlCoreFloat` (constructor/core/ConstructYamlCoreFloat.java) only
lower-cases the value and hands it to `ConstructYamlJsonFloat.construct`, which knows `.inf`, `-.inf`
and `.nan` literally and otherwise strips the sign and calls `Double.valueOf(".inf")` →
`YamlEngineException: java.lang.NumberFormatException: For input string: ".inf"`. `-.inf`, `.Inf` and
`+1.5` work. Found by `scalarsTypeLikeTheSpec` (and, one turn earlier, by the zoo's jackson-yaml target,
whose parser decodes the same text correctly).
'''

[[bug]]
id = "snakeyaml-engine/2"
title = "The double-quoted escapes `\\L` (U+2028) and `\\P` (U+2029) are rejected"
kind = "crash"
severity = "low"
test = "pin2_lineAndParagraphSeparatorEscapes"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
YAML 1.2 (spec 5.7, productions 57–58) defines `\L` as the line separator U+2028 and `\P` as the
paragraph separator U+2029. `ScannerImpl`'s escape table (`ESCAPE_REPLACEMENTS`/`ESCAPE_CODES`) has
`\N`, `\_`, `\/`, `\e`, `\x`, `\u`, `\U` but not `\L` and `\P`, so `"a\Lb"` fails with
`ScannerException: while scanning a double-quoted scalar … found unknown escape character L`.
SnakeYAML 1.1 shares the table; libyaml and PyYAML accept both. The emitter never writes them (it
writes ` `), so only hand-written documents are affected. Found by `writtenDocumentsLoadAsTheirTrees`.
'''

[[bug]]
id = "snakeyaml-engine/3"
title = "`dumpAll` with a `%YAML` directive writes no `...` before the second document's directive, so its own output does not load"
kind = "wrong-result"
severity = "medium"
test = "pin3_severalDocumentsWithADirective"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
A directive may only follow a document end marker (spec 9.1.4, 9.1.5): a stream `%YAML 1.2\n--- a\n%YAML
1.2\n--- 1\n` is invalid, and the engine's own parser says so (`ParserException: expected '<document end>'
before directives, but found '<directive>'`). `Emitter.expectDocumentStart` writes `...` before a
non-first document's directives only when `openEnded` is set (i.e. after a plain top-level scalar),
never merely because the previous document was implicitly ended and a directive follows; with
`DumpSettings.setYamlDirective(...)` and `dumpAllToString` of two or more values whose first is a
collection or a quoted scalar (`{a: 1}` then `[2]`; or two documents through `Present`/
`Serialize.serializeAll`) the stream is unreadable. `setExplicitEnd(true)` is the workaround.
libyaml writes the `...`. Found by the zoo's jackson-yaml target (its multi-root output) and
reproduced here with the engine alone.
'''

[[bug]]
id = "snakeyaml-engine/4"
title = "A block scalar whose content starts with a space or a line break gets the wrong indentation indicator under an indented sequence indicator (`indicatorIndent` without `indentWithIndicator`)"
kind = "wrong-result"
severity = "medium"
test = "pin4_blockScalarsUnderAnIndicatorIndentLoadBack"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Emitter.determineBlockHints` adds an explicit indentation indicator (`|2`) when the content starts
with a space or a line break, sized from `settings.getIndent()`; `writeLiteral`/`writeFolded` then
indent the content by `increaseIndent(...)`, which under `indicatorIndent > 0` (and no
`indentWithIndicator`) puts the content `indent + indicatorIndent` columns in, not `indent`. The
parser honours the indicator: with indent 2 and indicatorIndent 1, `[["\n x"]]` is written as
` -\n   - |2-\n\n     x` and loads back as `["\nx"]` (leading space lost); `[" a\nb"]` becomes
` - |2-\n   a\n  b` and does not parse ("while parsing a block collection"). SnakeYAML 2.x has the same
defect (snakeyaml/14 in the zoo); Jackson's `INDENT_ARRAYS` feature is a common way to hit it. Found by
the jackson-yaml target and reproduced with the engine alone (`dumpedValuesLoadBack` skips the shape).
The shape is wider than a multi-line string: with the default scalar style LITERAL or FOLDED a
single-line string starting with a space is written as a block scalar with an indicator too, so with
indent 4, indicatorIndent 2, LITERAL and the JSON schema `[[" : x"]]` is written `-   - |4-\n         : x`
and fails "while parsing a block collection" (found 2026-09-24 by the rewritten dump property; its
gate now covers the block default styles).
'''

[[bug]]
id = "snakeyaml-engine/5"
title = "`DumpSettingsBuilder` accepts an indicator indent not smaller than the indent, and the dump then does not load back"
kind = "contract"
severity = "low"
test = "pin5_indicatorIndentAtLeastTheIndent"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`setIndicatorIndent` only checks `0 <= indicatorIndent <= 9` (the javadoc says "must be smaller than
the indent"), and nothing relates it to `indent` (SnakeYAML's `DumperOptions` at least clamps). With
`indentWithIndicator` off and `indicatorIndent >= indent` (every such pair from indent 1..4 and
indicatorIndent 1..9 in a grid probe) a block mapping inside a block sequence is written with its
keys level with the `-` indicator:

    k:
      -
      a: [1, 2]

so the dump does not load (`ParserException: while parsing a block node`); a nested block sequence
is written the same way. Flow mappings and `indentWithIndicator = true` are fine, so the plain
`Dump` defaults (flow style AUTO puts short leaf mappings in flow) hide it until a mapping holds a
collection. Either the builder should reject the pair (as it rejects `indent < 1`) or the emitter
should indent the mapping past the indicator. Found by the zoo's jackson-yaml target (Jackson's
`INDENT_ARRAYS_WITH_INDICATOR` off + indicator indent) and pinned here with the engine alone;
`dumpedValuesLoadBack` skips the pair.
'''

[[bug]]
id = "snakeyaml-engine/6"
title = "`Emitter.writeDoubleQuoted` splits a deeply indented scalar into a bare backslash line when the indentation column exceeds the width, and the value changes"
kind = "wrong-result"
severity = "medium"
test = "pin6_deeplyIndentedDoubleQuotedStringsSurviveADump"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
Same code as SnakeYAML's (snakeyaml/16 in the zoo) and PyYAML's pure emitter: after an escape sequence
`writeDoubleQuoted` sets `start = end + 1`, so the split test `start >= end` on the next space fires,
and when the current column (indentation) alone is at or beyond `width` the second split writes `\`
right after the leading-space `\` — the output has a line holding nothing but a backslash, and the
string `"x \n y"` at indent 4, depth 3, width 10 loads back as `x \n\  y` (two backslashes and an
extra space). `DumpSettingsBuilder` does not relate `width` to `indent` (SnakeYAML clamps the width
to `2·indent`, which is not enough either). libyaml writes it correctly. Found by `dumpedValuesLoadBack`
(detected by the textual signature, a line holding only `\`).
'''

[[bug]]
id = "snakeyaml-engine/7"
title = "The failsafe schema resolves empty scalars to `!!null` but has no constructor for it: `a:` fails with ConstructorException and the empty stream with a NullPointerException"
kind = "crash"
severity = "medium"
test = "pin7_theFailsafeSchemaLoadsEmptyScalars"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`FailsafeSchema.getScalarResolver()` says "resolves everything as string", but
`FailsafeScalarResolver` (resolver/FailsafeScalarResolver.java) registers `Tag.NULL` for the empty
scalar (`addImplicitResolver(Tag.NULL, EMPTY, null)`), and `FailsafeSchema.getSchemaTagConstructors()`
has only `!!str`, `!!seq`, `!!map`. So every document with a missing value fails —
`a:`, `- `, `{a: }`, `- \n- x` → `ConstructorException: could not determine a constructor for the tag
tag:yaml.org,2002:null` — and the empty stream (`loadFromString("")`) dies with a raw
`NullPointerException: Cannot invoke "ConstructNode.construct(Node)" because "construct" is null`
(`BaseConstructor.constructSingleDocument` looks up the `!!null` constructor for the missing root and
does not check the result). YAML 1.2 §10.1.2: under the failsafe schema all plain scalars are `!!str`,
so `a:` is `{"a": ""}`. `[a, ]` (flow) happens to work because the parser produces no empty scalar
there. Found by `writtenDocumentsLoadAsTheirTrees` (its failsafe cross-check); the property skips
documents whose failsafe load fails this way.
'''

[[bug]]
id = "snakeyaml-engine/8"
title = "A standard tag on the wrong node kind (`!!int [1]`, `!!map x`, `!!str [1]`) throws ClassCastException instead of a constructor error"
kind = "crash"
severity = "low"
test = "pin8_aStandardTagOnTheWrongNodeKindFailsCleanly"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`ConstructScalar.constructScalar` casts the node to `ScalarNode`, `ConstructYamlSeq`/`ConstructYamlMap`/
`ConstructYamlSet` cast to `SequenceNode`/`MappingNode`, and nothing checks the node kind against the
tag first, so `!!bool [a]`, `!!int [1]`, `!!float {a: b}`, `!!str [1]`, `!!binary [1]`, `!!seq 1`,
`!!map x`, `!!set 1` all fail with `YamlEngineException: java.lang.ClassCastException: class
…SequenceNode cannot be cast to class …ScalarNode` under both the core and the JSON schema — a
wrapped raw exception with an internal-class message where the `!!omap`/`!!timestamp` cases (no
constructor) give a proper `ConstructorException` with the mark. `!!null [1]` is silently `null`.
Sibling of snakeyaml/13 in the zoo (SnakeYAML's constructor has the same casts). Found by
`mutatedDocumentsFailCleanly` (its exception-hygiene check, which now skips this shape).
'''

[[bug]]
id = "snakeyaml-engine/9"
title = "`setIndent(1)` and `setIndent(10)` are accepted (the documented range is 1..10) but the emitter indents by 2"
kind = "contract"
severity = "low"
test = "pin9_theIndentSettingIsHonouredAtTheEndsOfItsRange"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`DumpSettingsBuilder.setIndent` documents "Must be within the range Emitter.MIN_INDENT [1] and
Emitter.MAX_INDENT [10]" and rejects 0 and 11 with `EmitterException`, but the `Emitter` constructor
applies the setting only when `indent > MIN_INDENT && indent < MAX_INDENT` (both strict), so 1 and
10 silently become the default 2: `{a: {b: 1}}` with indent 10 is written `a:\n  b: 1`. The
off-by-one has a consequence beyond the wrong indentation — an indicator indent chosen against the
requested indent (`indent 10, indicatorIndent 3`, legal by the javadoc's "smaller than the indent")
is then not smaller than the effective indent and a block mapping inside a sequence is written level
with the `-` (snakeyaml-engine/5), so the dump does not load. Sibling of snakeyaml/6 in the zoo
(SnakeYAML's `Emitter` has the same strict comparison). Found by `dumpedValuesLoadBack` and
`nodesSurviveSerializeAndCompose` (`indent=10, indicatorIndent=3` dumps that did not load).
'''

[[bug]]
id = "snakeyaml-engine/10"
title = "An explicit `!!int`, `!!float` or `!!binary` tag on a scalar it does not fit leaks a NumberFormatException, StringIndexOutOfBoundsException or IllegalArgumentException; `!!bool maybe` is silently null"
kind = "crash"
severity = "low"
test = "pin10_aStandardTagOnAScalarItDoesNotFitFailsCleanly"
found = { commit = "93ecc0a7cf123e2da61bd794760d8994cd482769", version = "3.2-SNAPSHOT (2026-08-10)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The schema constructors trust the resolver: `ConstructYamlJsonInt`/`ConstructYamlCoreInt` call
`Integer.valueOf`/`new BigInteger` (`!!int abc`, `!!int 1.5`, `!!int 0x` → `YamlEngineException:
java.lang.NumberFormatException: For input string: "abc"`), `ConstructYamlJsonFloat` indexes the
first character (`!!float ''` → `StringIndexOutOfBoundsException: Index 0 out of bounds for length
0`) and then `Double.valueOf` (`!!float abc`, `!!float 1e` → NumberFormatException),
`ConstructYamlBinary` calls `Base64.getDecoder().decode` (`!!binary '***'` → `IllegalArgumentException:
Illegal base64 character 2a`), all surfacing as `YamlEngineException` wrapping the raw exception with
no mark; `ConstructYamlJsonBool` returns null for anything that is not `true`/`false` (`!!bool maybe`
→ null, no error). The core `!!int ''` case shows the intended shape: `ConstructorException: while
constructing an int … found empty value` with the mark. Siblings of snakeyaml/10 and snakeyaml/11
in the zoo. Found by `mutatedDocumentsFailCleanly` (`!!int nul ]` after a mutation; the
exception-hygiene check now skips explicit-tag failures of this kind).
'''
