name = "snakeyaml-engine"
language = "java"
upstream = "https://github.com/snakeyaml/snakeyaml-engine"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-16"  # README "Contribute": bug reports at codeberg.org/snakeyaml/snakeyaml-engine/issues and the mailing list; CONTRIBUTE.md is architecture/testing notes; nothing about AI (GitHub is a mirror of Codeberg); the zoo only records bugs

[base]
commit = "93ecc0a7cf123e2da61bd794760d8994cd482769"
date = "2026-08-10"
version = "3.2-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install org.snakeyaml:snakeyaml-engine into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on it as `engine.version`). Tests, javadoc, sources, the license check and the formatter are skipped.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dgpg.skip=true -Dformatter.skip=true -Dlicense.skip=true install",
]

[expected_failures]
pin1_plusInfinityUnderTheCoreSchema = "snakeyaml-engine/1"
pin2_lineAndParagraphSeparatorEscapes = "snakeyaml-engine/2"
pin3_severalDocumentsWithADirective = "snakeyaml-engine/3"
pin4_blockScalarsUnderAnIndicatorIndentLoadBack = "snakeyaml-engine/4"
pin5_indicatorIndentAtLeastTheIndent = "snakeyaml-engine/5"
pin6_deeplyIndentedDoubleQuotedStringsSurviveADump = "snakeyaml-engine/6"
pin7_theFailsafeSchemaLoadsEmptyScalars = "snakeyaml-engine/7"
pin8_aStandardTagOnTheWrongNodeKindFailsCleanly = "snakeyaml-engine/8"
pin9_theIndentSettingIsHonouredAtTheEndsOfItsRange = "snakeyaml-engine/9"
pin10_aStandardTagOnAScalarItDoesNotFitFailsCleanly = "snakeyaml-engine/10"
