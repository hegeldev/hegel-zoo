[[bug]]
id = "gson/1"
title = "JsonReader.nextInt/nextLong accept values that are not exact ints/longs through their double fallback: 2^63 reads as Long.MAX_VALUE, 123456789012345678.0 as 123456789012345680, 1.00000000000000001 as 1"
kind = "wrong-result"
severity = "medium"
test = "pinLongReadSaturatesOutOfRange"
found = { commit = "8fe077819b2c92a1cbe17557c4655e2c33967711", version = "2.14.1-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-15" }
status = "open"
notes = '''
`JsonReader.nextLong()` documents "If the next token's numeric value cannot be exactly represented
by a Java long, this method throws" (`nextInt()` likewise for int). Only a lexeme `Long.parseLong`
accepts is read exactly; any other lexeme (a fraction, an exponent, a quoted numeric string, or an
integer outside the long range) goes through `Double.parseDouble` and is accepted whenever the
double satisfies `(long) d == d`. Three consequences, all silent, all reached through
`Gson.fromJson(text, long.class)` / `int.class` and the Integer/Long/AtomicLong/... adapters:

- out-of-range values saturate: `9223372036854775808` (2^63) reads as 9223372036854775807 and
  `-9223372036854775809` as Long.MIN_VALUE — as an int, `2147483648` correctly throws because the
  saturated int no longer equals the double, so only the long adapters are affected this way;
- non-integral values whose double is integral are accepted and rounded: `1.00000000000000001`
  reads as 1, `332462415175414378.6` as 332462415175414400, `-993e-801` as 0;
- integral values beyond 2^53 written with a fraction or exponent lose precision:
  `123456789012345678.0` reads as 123456789012345680, `9007199254740993.0` as 9007199254740992
  (the same lexeme without the `.0` reads exactly).

The property `numbersReadIntoTypedFieldsExactly` skips lexemes of that shape (not Long.parseLong-
able, integral as a double, and either not an exact long or different from the double's long);
the pins `pinLongReadSaturatesOutOfRange`, `pinLongReadRoundsNonIntegral` and
`pinLongReadLosesPrecision` carry one example of each. A fix would parse the lexeme with
`BigDecimal`/`longValueExact` (or `new BigDecimal(s).toBigIntegerExact()` after a scale check)
instead of the double.
'''

[[bug]]
id = "gson/2"
title = "JsonParser.parseString/parseReader(Reader) do not report trailing data after a top-level null"
kind = "wrong-result"
severity = "low"
test = "pinParseStringTrailingDataAfterNull"
found = { commit = "8fe077819b2c92a1cbe17557c4655e2c33967711", version = "2.14.1-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-15" }
status = "open"
notes = '''
`JsonParser.parseString` documents "An exception is thrown if the JSON string has multiple
top-level JSON elements, or if there is trailing data", and does throw
`JsonSyntaxException("Did not consume the entire document.")` for `1 1` or `{} {}` — but
`parseReader(Reader)` guards the check with `!element.isJsonNull()`, so `parseString("null 1")`,
`parseString("null null")` and `parseString("null junk")` return `JsonNull.INSTANCE` silently.
(The guard exists so that an empty document, which `Streams.parse` turns into JsonNull for
compatibility, does not trip the check; it also swallows real trailing data.) `Gson.fromJson(String,
…)` has a similar `obj != null` guard, but for `JsonElement.class` the result is `JsonNull.INSTANCE`,
not null, so `new Gson().fromJson("null 1", JsonElement.class)` does throw. The property
`strictReaderAgreesWithTheReference` skips the trailing-data check when the value is null; the pin
`pinParseStringTrailingDataAfterNull` carries it.
'''

[[bug]]
id = "gson/3"
title = "Gson.toJsonTree with an explicit STRICT or LEGACY_STRICT strictness throws \"JSON forbids NaN and infinities: 1E+309\" for a finite BigDecimal/BigInteger beyond the double range, which toJson writes"
kind = "crash"
severity = "medium"
test = "pinToJsonTreeRefusesLargeBigDecimal"
found = { commit = "8fe077819b2c92a1cbe17557c4655e2c33967711", version = "2.14.1-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-15" }
status = "open"
notes = '''
`JsonWriter.value(Number)` trusts `Integer`, `Long`, `Byte`, `Short`, `BigDecimal`, `BigInteger`,
`AtomicInteger` and `AtomicLong` to print valid JSON numbers, so `new
GsonBuilder().setStrictness(Strictness.STRICT).create().toJson(new BigDecimal("1E+309"))` is
`1E+309`. `JsonTreeWriter.value(Number)` — the writer behind `Gson.toJsonTree` — instead checks
`value.doubleValue()` for NaN/Infinity whatever the class, and a BigDecimal of 1E+309 or a
BigInteger of 2^1100 has an infinite double, so with any explicit strictness other than LENIENT
`toJsonTree` throws `IllegalArgumentException("JSON forbids NaN and infinities: 1E+309")`
(from a record field or at the top level). Without an explicit strictness (Gson's legacy
lenient default) both calls succeed, and `fromJson` reads the value back fine in every mode. The
record property skips the tree step for such values when the Gson is not lenient; the pin
`pinToJsonTreeRefusesLargeBigDecimal` carries it.
'''
