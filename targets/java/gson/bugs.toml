[[bug]]
id = "gson/3"
title = "Gson.toJsonTree with an explicit STRICT or LEGACY_STRICT strictness throws \"JSON forbids NaN and infinities: 1E+309\" for a finite BigDecimal/BigInteger beyond the double range, which toJson writes"
kind = "crash"
severity = "medium"
test = "pinToJsonTreeRefusesLargeBigDecimal"
found = { commit = "8fe077819b2c92a1cbe17557c4655e2c33967711", version = "2.14.1-SNAPSHOT (2026-09-14)", hegel = "0.6.0", date = "2026-09-15" }
status = "open"
notes = '''
`JsonWriter.value(Number)` trusts `Integer`, `Long`, `Byte`, `Short`, `BigDecimal`, `BigInteger`,
`AtomicInteger` and `AtomicLong` to print valid JSON numbers, so `new
GsonBuilder().setStrictness(Strictness.STRICT).create().toJson(new BigDecimal("1E+309"))` is
`1E+309`. `JsonTreeWriter.value(Number)` — the writer behind `Gson.toJsonTree` — instead checks
`value.doubleValue()` for NaN/Infinity whatever the class, and a BigDecimal of 1E+309 or a
BigInteger of 2^1100 has an infinite double, so with any explicit strictness other than LENIENT
`toJsonTree` throws `IllegalArgumentException("JSON forbids NaN and infinities: 1E+309")`
(from a record field or at the top level). Without an explicit strictness (Gson's legacy
lenient default) both calls succeed, and `fromJson` reads the value back fine in every mode. The
record property skips the tree step for such values when the Gson is not lenient; the pin
`pinToJsonTreeRefusesLargeBigDecimal` carries it.
'''

