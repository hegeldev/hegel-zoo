[[bug]]
id = "gson/4"
title = "JsonElement equality of parsed numbers is by double value: JsonParser.parseString(\"9007199254740993\") equals parseString(\"9007199254740992\") and 1e-400 equals 0, so JsonArray.remove(Object) and contains take the wrong element"
kind = "wrong-result"
severity = "medium"
test = "pinParsedNumbersOfDifferentValueAreNotEqual"
found = { commit = "854c8255b625cf1e13c701a83ea9ccb4caaa576a", version = "2.14.1-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
notes = '''
`JsonParser.parseString("9007199254740993").equals(JsonParser.parseString("9007199254740992"))` is
true, as are `parseString("1e-400").equals(parseString("0"))`,
`parseString("1.00000000000000011102230246251565404236316680908203125").equals(parseString("1.0"))`
and the same comparisons of arrays and objects holding those numbers; `hashCode` agrees, so the
trees are interchangeable in sets and maps. `JsonPrimitive.equals` compares two `BigDecimal`s with
`compareTo` and two integral boxes by `long`/`BigInteger`, but a parsed number is a
`LazilyParsedNumber`, which is neither, so any comparison involving one falls to the
`getAsDouble()` branch and two different JSON numbers are equal whenever they round to the same
double (`new JsonPrimitive(new BigDecimal("1e-400")).equals(parseString("0"))` and `new
JsonPrimitive(9007199254740993L).equals(parseString("9007199254740992"))` are true too). The
collection methods inherit it: `JsonParser.parseString("[1e-400, 0]").getAsJsonArray().remove(new
JsonPrimitive(0))` removes the first element and leaves `[0]`, and `contains` answers for the wrong
element. Found by the collections property (a `remove(equal element)` probe against a model with
exact equality) once the number lexemes covered tiny exponents; the property now skips the probe
when an earlier element collides as a double. Two parsed numbers should compare by their exact
value, as the `BigDecimal` branch already does.
'''
