name = "gson"
language = "java"
upstream = "https://github.com/google/gson"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-15"  # README, CONTRIBUTING.md, PR/issue templates: no AI policy (maintenance mode)

[base]
commit = "698ba9ebfdbf629ca4ccc393d9cecd69c1e7115f"
date = "2026-09-15"
version = "2.14.1-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install the library (module `gson` and its parent only; javadoc/sources/enforcer
# skipped) into the local Maven repository at the version the pom declares — hegel/pom.xml
# depends on that version (update `gson.version` there when a bump changes it).
setup = [
  "mvn -q -B -ntp -pl gson -am -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true install",
]

[expected_failures]
pinLongReadSaturatesOutOfRange = "gson/1"
pinLongReadRoundsNonIntegral = "gson/1"
pinLongReadLosesPrecision = "gson/1"
pinParseStringTrailingDataAfterNull = "gson/2"
pinToJsonTreeRefusesLargeBigDecimal = "gson/3"
