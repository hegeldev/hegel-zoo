# Bugs found in dnsjava by the Hegel zoo. Pins: hegel/src/test/java/zoo/DnsjavaPinsTest.java.

[[bug]]
id = "dnsjava/1"
title = "LOC prints a negative altitude with a fraction as -99999.-99m"
kind = "roundtrip"
severity = "medium"
test = "pinLocNegativeAltitudeText"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LOCRecord.renderFixedPoint` (LOCRecord.java:182-191) renders `value / 100` and `value % 100` separately and puts the sign
on both halves, so `LOC 42 21 54 N 71 06 18 W -99999.99m 30m 10m 10m` prints as `... -99999.-99m ...`, which
`Record.fromString` refuses. Whole-metre negative altitudes (`-5m`) and all positive altitudes print correctly.
"""

[[bug]]
id = "dnsjava/2"
title = "WKS with no services, or with unsorted ports in text, throws ArrayIndexOutOfBoundsException in toWire/equals/hashCode"
kind = "crash"
severity = "medium"
test = "pinWksEmptyOrUnsortedServices"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`WKSRecord.rrToWire` (WKSRecord.java:689-693) sizes the bitmap from `services[services.length - 1]`, assuming a sorted,
non-empty array. `rdataFromString` stores the ports in text order without sorting, so `WKS 192.0.2.1 6 80 25` makes a
4-byte bitmap and then writes port 80 into it (`Index 10 out of bounds for length 4`); the constructor accepts
`new int[0]` and `toWire`, `equals` and `hashCode` (all via `rrToWire`) then fail with `Index -1`.
"""

[[bug]]
id = "dnsjava/3"
title = "A6 with an IPv4-mapped suffix throws ArrayIndexOutOfBounds in toWire and its text cannot be re-read"
kind = "crash"
severity = "low"
test = "pinA6MappedSuffix"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`A6Record.rdataFromString` (A6Record.java:84) reads the suffix with `st.getAddress(Address.IPv6)`, and `Address.getByAddress`
returns an `Inet4Address` for `::ffff:a.b.c.d`; `rrToWire` (A6Record.java:114) then copies 16 - prefix/8 bytes out of a
4-byte array (`arraycopy: last source index 16 out of bounds for byte[4]`), and `rrToString` prints the dotted quad,
which the IPv6 field refuses on re-read. Same root cause as dnsjava/23.
"""

[[bug]]
id = "dnsjava/4"
title = "base64.fromString accepts characters outside the alphabet and decodes them as garbage"
kind = "contract"
severity = "medium"
test = "pinBase64RejectsForeignCharacters"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`utils.base64.fromString` looks each character up with `Base64.indexOf(c)` and uses the result (-1 for a foreign character)
without checking it, so `"AQ.D"` decodes to `01 ff c3` instead of null; DNSKEY, RRSIG, OPENPGPKEY, CERT and every other
base64 field therefore accept nonsense text. Whitespace is skipped on purpose; only bad lengths return null.
"""

[[bug]]
id = "dnsjava/5"
title = "DNSOutput.writeU8/writeU16/writeU32 accept 2^8, 2^16 and 2^32 and write zero"
kind = "contract"
severity = "medium"
test = "pinDnsOutputRejectsPowerOfTwo"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`DNSOutput.check(val, bits)` computes `max = 1L << bits` and rejects `val > max` instead of `val >= max`, so exactly 2^bits
passes and is truncated to 0 (`writeU8(256)` -> `00`, `writeU16(65536)` -> `00 00`, `writeU32(4294967296)` -> `00 00 00 00`).
Everything routed through the record constructors is checked separately; callers of `DNSOutput` directly (and the SVCB
port parameter, dnsjava/11) are not.
"""

[[bug]]
id = "dnsjava/6"
title = "AAAARecord(Name, int, long, InetAddress) accepts an IPv4 address and produces 4-byte rdata"
kind = "contract"
severity = "medium"
test = "pinAaaaRefusesIpv4"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The `InetAddress` constructor (AAAARecord.java:27) stores `address.getAddress()` without checking the family, unlike
`ARecord`, which throws `IllegalArgumentException("invalid IPv4 address")`; the resulting record has a 4-octet rdata
that other parsers reject as malformed. The `byte[]` constructor does check the length.
"""

[[bug]]
id = "dnsjava/7"
title = "Type bitmaps with window blocks out of order are accepted from the wire and silently re-sorted"
kind = "contract"
severity = "low"
test = "pinTypeBitmapWindowOrder"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`TypeBitmap(DNSInput)` keeps a `lastWindowBlockNumber` variable but the comparison against it is dead, so an NSEC/NSEC3/CSYNC
bitmap with window 1 followed by window 0 parses (RFC 4034 section 4.1.2: "Blocks are present ... in increasing numerical
order") and is re-emitted sorted, so wire -> record -> wire is not the identity; zero-length bitmap blocks are also
accepted and dropped.
"""

[[bug]]
id = "dnsjava/8"
title = "LOC text parsing truncates seconds to whole milliseconds twice and loses the fraction"
kind = "wrong-result"
severity = "medium"
test = "pinLocKeepsMilliseconds"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LOCRecord.parsePosition` converts the seconds field with `(int) (seconds * 1000)` after a `parseDouble`/`intValue`
sequence that has already discarded the fraction, so `0 0 1.001 N` becomes 1 second exactly and prints as `0 0 1 N`;
RFC 1876 gives seconds to millisecond precision (`ss.sss`).
"""

[[bug]]
id = "dnsjava/9"
title = "Records whose base64 field is absent (empty OPENPGPKEY from the wire, RRSIG without a signature) throw NullPointerException in toString/toWire"
kind = "crash"
severity = "low"
test = "pinEmptyBase64FieldsDoNotNpe"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Tokenizer.getBase64()` returns null when the field is missing and `Record.newRecord`/`rrFromWire` keep an empty field as
null (OPENPGPKEY, CERT, DHCID, the HIP public key, the SVCB `ech` value); `base64.toString(null)` then throws
`NullPointerException: Cannot read the array length because "b" is null` from `rrToString`, and `rrToWire` fails the same
way. An RRSIG line without its signature parses and NPEs later instead of being refused.
"""

[[bug]]
id = "dnsjava/10"
title = "NSAP text \"0\" throws StringIndexOutOfBoundsException instead of a parse error"
kind = "wrong-exception"
severity = "low"
test = "pinNsapShortText"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`NSAPRecord.checkAndConvertAddress` tests `address.substring(0, 2)` for the `0x` prefix before checking the length, so a
one-character field escapes as `StringIndexOutOfBoundsException` rather than the `TextParseException` every other malformed
rdata produces.
"""

[[bug]]
id = "dnsjava/11"
title = "The SVCB port parameter is not range-checked: 65536 is written as port 0, negative values are accepted"
kind = "contract"
severity = "medium"
test = "pinSvcbPortRange"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`SVCBBase.ParameterPort.fromString` uses `Integer.parseInt` and keeps the value; `toWire` writes it with `writeU16`, so
`port=65536` becomes `00 00` (through dnsjava/5), `port=-1` is accepted and fails only at wire time, and `port=xyz` escapes
as `NumberFormatException`.
"""

[[bug]]
id = "dnsjava/12"
title = "HIP rendezvous servers ignore the origin, so relative names stay relative and toWire fails"
kind = "wrong-result"
severity = "low"
test = "pinHipRvServersUseOrigin"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`HIPRecord.rdataFromString` reads the rendezvous servers with `st.getName(null)`-style parsing that never applies the
`origin` argument every other name-carrying type uses, so `... rvs` with origin `example.` yields the relative name `rvs`,
and `toWire` throws `IllegalArgumentException` (relative name) when the record is rendered.
"""

[[bug]]
id = "dnsjava/13"
title = "RRSIG/SIG times before 1970 are accepted in text and then fail in toWire with IllegalArgumentException"
kind = "contract"
severity = "low"
test = "pinSigTimesBefore1970"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`FormattedTime.parse` accepts any `YYYYMMDDHHmmSS` and `SIGBase.rdataFromString` stores the resulting `Instant` without
checking that it fits the 32-bit seconds-since-1970 field; `rrToWire` then throws `IllegalArgumentException: -31536000 out
of range for 32 bit value` from `writeU32`. Malformed text should be a `TextParseException` at parse time.
"""

[[bug]]
id = "dnsjava/14"
title = "CAA tags are printed unquoted and unescaped, so a tag with a space or an empty tag cannot be re-read"
kind = "roundtrip"
severity = "low"
test = "pinCaaTagText"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`CAARecord` accepts any tag string in its constructor (RFC 8659 restricts tags to letters and digits) and `rrToString`
prints it bare with `byteArrayToString(tag, false)`, so `new CAARecord(n, IN, ttl, 0, "is sue", "ca.example.net")` prints as
`0 is sue "ca.example.net"`, which parses as tag `is`, value `sue` and an unexpected trailing token. Either the constructor
should refuse the tag or the text should quote it.
"""

[[bug]]
id = "dnsjava/15"
title = "LOC sizes beyond 9e9 metres overflow the exponent nibble and produce unreadable wire data"
kind = "silent-corruption"
severity = "low"
test = "pinLocSizeRange"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`LOCRecord.toLOCformat` keeps dividing by 10 until the mantissa fits in 4 bits without capping the exponent at 9, so a
size of 1e10 m (1e12 cm) produces an exponent of 12, and `Record.fromWire` of the record's own wire form throws
`WireParseException: Invalid LOC Encoding`; the constructor should refuse values RFC 1876 cannot encode. The conversion also
truncates rather than rounds.
"""

[[bug]]
id = "dnsjava/16"
title = "OPTRecord.equals throws ClassCastException when compared with an EmptyRecord of type OPT"
kind = "crash"
severity = "low"
test = "pinOptEqualsForeignRecord"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`OPTRecord.equals` calls `super.equals` (which compares type, class and rdata and so is true for an `EmptyRecord` built by
`Record.newRecord(Name.root, Type.OPT, 4096)`) and then casts the argument to `OPTRecord` to compare the TTL bits, so the
comparison throws `ClassCastException: EmptyRecord cannot be cast to OPTRecord` instead of returning false.
"""

[[bug]]
id = "dnsjava/17"
title = "CERT certificate-type mnemonics are shifted: string(1) is IPKIX and value(\"IPKIX\") is 1"
kind = "wrong-result"
severity = "low"
test = "pinCertTypeMnemonics"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`CERTRecord.CertificateType`'s static initializer registers the mnemonics against the wrong constants, so type 1 prints as
`IPKIX` (RFC 4398 section 2.1: 1 PKIX, 2 SPKI, 3 PGP, 4 IPKIX, 5 ISPKI, 6 IPGP, 7 ACPKIX, 8 IACPKIX, 253 URI, 254 OID) and
`value("IPKIX")` returns 1; `CERT` records written by dnsjava with mnemonics are therefore misread by other software.
"""

[[bug]]
id = "dnsjava/18"
title = "GPOS validates longitude against the latitude range and vice versa"
kind = "wrong-result"
severity = "medium"
test = "pinGposRanges"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`GPOSRecord.validate(longitude, latitude)` checks the longitude against +-90 and the latitude against +-180, the opposite
of RFC 1712, so `GPOS -100.0 45.0 100.0` (longitude -100, fine) is refused with `illegal longitude -100.0` while
`GPOS 45.0 100.0 0.0` (latitude 100, impossible) is accepted.
"""

[[bug]]
id = "dnsjava/19"
title = "SVCB alpn values are unescaped once instead of twice, so RFC 9460's own examples parse wrongly"
kind = "wrong-result"
severity = "medium"
test = "pinSvcbAlpnEscaping"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
RFC 9460 section 7.1.1 defines alpn values as a comma-separated list in which the zone-file escaping is removed first and the
list-level `\\,` escaping second, giving the ids `f\\oo,bar` and `h2` for `alpn="f\\\\\\\\oo\\\\,bar,h2"`.
`SVCBBase.ParameterAlpn.fromString` splits with the regex `(?<!\\\\),` on the raw string and keeps the backslashes, giving
`[f\\\\\\\\oo\\\\,bar, h2]`; a value with a trailing backslash also defeats the look-behind. The wire form differs from
other implementations' for any escaped id.
"""

[[bug]]
id = "dnsjava/20"
title = "SVCB parameter values containing spaces, semicolons or parentheses are printed unescaped; empty alpn ids are accepted and hidden"
kind = "roundtrip"
severity = "low"
test = "pinSvcbValueEscaping"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`SVCBBase.ParameterUnknown.toString` (and the ech/mandatory paths) print values with `byteArrayToString(value, false)`, so
`1 . key999="a b"` prints as `1 . key999=a b`, which re-parses as a parameter `b` (`Expected a valid parameter key for 'b'`).
`alpn=,h2` is accepted with a zero-length id that the text no longer shows.
"""

[[bug]]
id = "dnsjava/21"
title = "SVCB rdata from the wire is not validated: key order, duplicate keys, mandatory self-reference and alias-mode parameters all pass"
kind = "contract"
severity = "low"
test = "pinSvcbWireValidation"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`SVCBBase.rrFromWire` reads the parameters into a `TreeMap` without the checks `rdataFromString` performs (RFC 9460 section
2.2: keys strictly increasing and unique, mandatory keys present and not self-referencing, no parameters in AliasMode), so a
wire record with port before alpn parses as `1 . alpn=h2 port=443` and is silently reordered on re-serialization.
"""

[[bug]]
id = "dnsjava/22"
title = "Empty hex and base32 fields print as nothing and the text cannot be re-read (SSHFP, DS, NSEC3)"
kind = "roundtrip"
severity = "low"
test = "pinEmptyHexFieldText"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
An SSHFP record built from the wire with a zero-length fingerprint (`01 01`) prints as `1 1 ` and `Record.fromString` of
that text fails with `expected hex encoded string`; DS digests and NSEC3 hashes behave the same. Either the wire form
should be refused or the empty field should print in a re-readable way.
"""

[[bug]]
id = "dnsjava/23"
title = "IPv4-mapped IPv6 addresses print as dotted quads in IPv6 fields (IPSECKEY gateway, SVCB ipv6hint, A6)"
kind = "roundtrip"
severity = "low"
test = "pinMappedIpv6Text"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Address.getByAddress`/`InetAddress.getByAddress` turns `::ffff:192.0.2.1` into an `Inet4Address`, whose `getHostAddress()`
is `192.0.2.1`; `IPSECKEY 10 2 2 ::ffff:192.0.2.1 AQID` therefore prints a gateway the type-2 (IPv6) field refuses on
re-read (`Invalid address: 192.0.2.1`). SVCB `ipv6hint` and A6 (dnsjava/3) do the same.
"""

[[bug]]
id = "dnsjava/24"
title = "URI and CAA values longer than 255 octets are read from the wire but their text cannot be re-read"
kind = "roundtrip"
severity = "low"
test = "pinUriLongTargetText"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
RFC 7553 defines the URI target as the remainder of the rdata with no 255-octet limit (RFC 8659's CAA value likewise), and
`rrFromWire` reads it that way; `rdataFromString` reads the value with `byteArrayFromString`, which enforces the
character-string limit, so a record with a 300-octet target prints fine and fails to re-parse with `text string too long`.
"""

[[bug]]
id = "dnsjava/25"
title = "Record.fromString UTF-8-encodes non-ASCII text twice (\"café\" becomes 7 octets)"
kind = "wrong-result"
severity = "low"
test = "pinTxtUtf8Once"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Record.fromString(..., String rdata, ...)` feeds the string to a `Tokenizer` as UTF-8 bytes, and the tokenizer turns each
byte into a `char`, which `Record.byteArrayFromString` encodes as UTF-8 again: `TXT "café"` becomes the 7 octets
`caf\\195\\131\\194\\169` rather than the 5 octets of `café`. `Name.fromString` in the same library keeps single bytes
(`é` -> `\\233`), so the two text paths disagree.
"""

[[bug]]
id = "dnsjava/26"
title = "TTL.parse drops trailing digits without a unit: \"1h30\" parses as 3600 and \"5s5\" as 5"
kind = "wrong-result"
severity = "low"
test = "pinTtlTrailingDigits"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`TTL.parse` accumulates digits into `value` and only adds them on a unit letter; at the end of the string it does
`if (ttl == 0) ttl = value`, so a trailing unitless number after a unit is silently discarded (`1h30` -> 3600, `5s5` -> 5).
BIND rejects such strings; RFC 2308 section 8's syntax is a sequence of number-unit pairs.
"""

[[bug]]
id = "dnsjava/27"
title = "Generator.expand() yields one record too few and repeats the first value"
kind = "wrong-result"
severity = "medium"
test = "pinGeneratorExpand"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Generator.expand()` (and `Master.generators()` through it) loops `for (long i = start; i < end; i += step)` and substitutes
`current` instead of `i`, so `$GENERATE 1-3 host$ A 10.0.0.$` expands to two records both named `host1` instead of
`host1`..`host3`; a single-element range (`1-1`) expands to nothing. `nextRecord()`, which `Master` uses, is correct.
"""

[[bug]]
id = "dnsjava/28"
title = "Message.toWire(max) exceeds max when the OPT record does not fit, and toWire(max, false) does not throw"
kind = "contract"
severity = "medium"
test = "pinToWireHonoursMaxWithOpt"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Message.toWire(DNSOutput, int)` subtracts the OPT (and TSIG) length from the budget for the sections and then appends the
OPT unconditionally, so a message consisting of a header and an 11-byte OPT rendered with `toWire(12)` is 23 bytes; since
no section was truncated TC is not set and `toWire(12, false)` returns the oversized message instead of throwing
`MessageSizeExceededException`. A UDP responder relying on `maxLength` can send more than the client's payload size.
"""

[[bug]]
id = "dnsjava/29"
title = "Message.getTSIG() throws IndexOutOfBoundsException on a truncated message whose ARCOUNT exceeds its records"
kind = "crash"
severity = "low"
test = "pinGetTsigOnTruncatedMessage"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The wire parser tolerates missing records when TC is set (it swallows the `WireParseException`) but leaves the header
counts as received; `getTSIG()` then indexes `sections[ADDITIONAL].get(header.getCount(ADDITIONAL) - 1)` and throws
`IndexOutOfBoundsException: Index 0 out of bounds for length 0` for a 12-byte message with TC and ARCOUNT 1. `isSigned()`
and TSIG verification of such a message fail the same way.
"""

[[bug]]
id = "dnsjava/30"
title = "Zone.removeRecord of a record that is not in the zone removes a single-record RRset anyway"
kind = "wrong-result"
severity = "high"
test = "pinZoneRemoveNonMember"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Zone.removeRecord` (Zone.java:336-340) decides between `rrset.deleteRR(r)` and removing the whole set by
`rrset.size() + rrset.sigSize() > 1` without checking that `r` is a member, so removing `a.example. A 192.0.2.2` from a zone
whose only A record at `a.example.` is `192.0.2.1` deletes the `192.0.2.1` set (and the name). A dynamic-update server
built on `Zone` loses data on a delete of a non-existent record.
"""

[[bug]]
id = "dnsjava/31"
title = "Update(zone, dclass) hardcodes class IN in the zone section"
kind = "wrong-result"
severity = "low"
test = "pinUpdateZoneClass"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Update(Name zone, int dclass)` stores `dclass` for the added records but builds the zone-section question with
`Record.newRecord(zone, Type.SOA, DClass.IN)`, so `new Update(zone, DClass.CH).getQuestion().getDClass()` is 1 (IN) and the
prerequisite/update records disagree with the zone section (RFC 2136 section 2.3: the zone section's ZCLASS is the
zone's class).
"""

[[bug]]
id = "dnsjava/32"
title = "Truncation leaves stale compression entries, so the TSIG owner is written as a pointer into dropped data"
kind = "silent-corruption"
severity = "high"
test = "pinTsigAfterTruncation"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Message.sectionToWire` rewinds the output (`out.jump(pos)`) when an RRset does not fit but does not roll back the
`Compression` table, and `toWire` then renders the TSIG record with that table. When a dropped record's owner equals (or is
a suffix of) the TSIG key name, the TSIG owner becomes a pointer to an offset that no longer holds that name -- in the pin it
points at the TSIG record itself -- and the receiver either fails to parse the additional section (swallowed because TC is
set, leaving no TSIG and hitting dnsjava/29) or verifies the wrong name. Any name that was compressed only inside dropped
records is affected, not just TSIG.
"""

[[bug]]
id = "dnsjava/33"
title = "Cache.addMessage looks at the header rcode only, so a BADVERS response is cached as NXRRSET"
kind = "wrong-result"
severity = "medium"
test = "pinCacheIgnoresExtendedRcode"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Cache.addMessage` reads `in.getHeader().getRcode()` (the low 4 bits) instead of `in.getRcode()` (which includes the OPT
record's extended rcode), so a response with header rcode 0 and extended rcode 1 (BADVERS, 16) with an SOA in the
authority section is treated as a NODATA answer and cached negatively for the SOA minimum.
"""

[[bug]]
id = "dnsjava/34"
title = "ExtendedFlags.CO is 0x8001; RFC 9660 puts the Compact Answers OK bit at 0x4000"
kind = "wrong-result"
severity = "low"
test = "pinCompactAnswersFlag"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`ExtendedFlags.CO = 0x8001` (ExtendedFlags.java:24) is the DO bit (0x8000) plus bit 15, whereas RFC 9660 section 3 assigns
the CO flag to bit 1 of the EDNS flags field, 0x4000. An OPT record built with `ExtendedFlags.CO` sets DO and an
unassigned bit and never signals Compact Answers OK.
"""

[[bug]]
id = "dnsjava/35"
title = "Zone lookups synthesize from a wildcard below an existing closer encloser"
kind = "wrong-result"
severity = "medium"
test = "pinWildcardClosestEncloser"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Zone.findRecordsWithoutLock` tries `name.wild(i)` for every label depth, so with `*.example. A` and `x.sub.example. A` a
query for `y.sub.example. A` is answered from `*.example.`; RFC 4592 section 3.3.1 only allows the wildcard child of the
closest encloser (`sub.example.`, which exists as an empty non-terminal and has no `*.sub.example.`), so the answer is
NXDOMAIN.
"""

[[bug]]
id = "dnsjava/36"
title = "A zone query at an empty non-terminal answers NXDOMAIN instead of NODATA"
kind = "wrong-result"
severity = "medium"
test = "pinEmptyNonTerminal"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Zone` keeps only names that own RRsets, so with `x.sub.example. A` a query for `sub.example. A` finds no entry and falls
through to NXDOMAIN; RFC 4592 section 2.2.2 / RFC 8020 make `sub.example.` an existing name with no data (NODATA, rcode
NOERROR). Resolvers honouring RFC 8020 will then treat everything below `sub.example.` as non-existent.
"""

[[bug]]
id = "dnsjava/37"
title = "A wildcard match without the queried type answers NXDOMAIN instead of NODATA"
kind = "wrong-result"
severity = "medium"
test = "pinWildcardNoData"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
In the wildcard loop of `Zone.findRecordsWithoutLock` a wildcard name that exists but lacks the type falls through to
`SetResponseType.NXDOMAIN`; RFC 4592 section 2.2.1 says the wildcard's presence makes the name exist, so the answer is
NODATA (NXRRSET). With `*.example. A`, `y.example. TXT` is NXDOMAIN instead of NXRRSET; a wildcard CNAME is not followed
either.
"""

[[bug]]
id = "dnsjava/38"
title = "Cache.addRecord cannot replace a negative entry of equal credibility"
kind = "wrong-result"
severity = "medium"
test = "pinCachePositiveReplacesNegative"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Cache.addRecord(Record, int, boolean)` merges into an existing element only when it `instanceof CacheRRset`; when the
existing element is a `NegativeElement` of the same credibility it does nothing, so after `addNegative(x, A, soa, NORMAL)`
an `addRecord(x A 192.0.2.1, NORMAL)` is dropped and `lookupRecords` keeps answering NXRRSET although a positive answer of
equal credibility was seen (`addRRset` replaces in that situation).
"""

[[bug]]
id = "dnsjava/39"
title = "RRset.equals and hashCode depend on insertion order"
kind = "contract"
severity = "low"
test = "pinRRsetEqualsIgnoresOrder"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`RRset.equals` compares the backing `List`s (and `hashCode` hashes them), so `new RRset(a, b)` and `new RRset(b, a)` --
the same set of records -- are unequal with different hashes, although the class documents itself as a set and `addRR`
deduplicates; sets read from two servers in different orders compare unequal.
"""

[[bug]]
id = "dnsjava/40"
title = "$GENERATE widths beyond int range are truncated instead of refused"
kind = "wrong-result"
severity = "low"
test = "pinGeneratorWidthRange"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Generator.substitute` parses the width into a `long` and pads with `(int) width - number.length()` zeros, so
`${0,4294967299,d}` (width 2^32+3) casts to 3 and produces `host001` where an "invalid width" `TextParseException` is due.
"""

[[bug]]
id = "dnsjava/41"
title = "ReverseMap.fromName wraps octets above 255 instead of refusing them"
kind = "wrong-result"
severity = "low"
test = "pinReverseMapOctetRange"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
