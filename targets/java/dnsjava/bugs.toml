[[bug]]
id = "dnsjava/42"
title = "Message.addRecord with an invalid section throws ArrayIndexOutOfBoundsException"
kind = "wrong-exception"
severity = "low"
test = "pinAddRecordSectionRange"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
