[[bug]]
id = "dnsjava/43"
title = "Wire TTLs with the high bit set are kept although text and constructors refuse them"
kind = "inconsistent"
severity = "low"
test = "pinWireTtlHighBit"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Record.fromWire` reads the TTL with `readU32` and stores it, so a record with TTL `ff ff ff ff` has `getTTL()` 4294967295
and prints that number, while `TTL.check` makes every constructor and `Record.fromString` throw for TTLs above 2^31-1 and
`TTL.format` refuses to format it. RFC 2181 section 8 says a received TTL with the high bit set is to be treated as zero.
"""

[[bug]]
id = "dnsjava/44"
title = "$GENERATE modifiers with one or two fields (\"${offset}\", \"${offset,width}\") are rejected as invalid"
kind = "wrong-result"
severity = "medium"
test = "pinGeneratorShortModifiers"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Generator.substitute` reads the offset (and width) digits in loops that stop on `,` or `}` and consume that character, then
requires `str[i + 1] == '}'`, which only holds when a base letter was read last; `host${1}` and `host${1,3}` therefore throw
`TextParseException: invalid modifiers` while `host${1,3,d}` works. BIND's syntax is `${offset[,width[,base]]}` and master
files written for it fail to load. Found by the master-file property.
"""

[[bug]]
id = "dnsjava/45"
title = "toWire(max, false) throws MessageSizeExceededException for any message whose TC flag is already set, even when it fits"
kind = "contract"
severity = "low"
test = "pinStrictToWireWithPresetTc"
found = { commit = "8bed725c19e2c551b421771b27e851d521e16a4f", version = "3.6.6-SNAPSHOT (2026-08-30)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Message.toWire(DNSOutput, int)` reports "completely rendered" as `!Header.getFlag(flags, TC)` where `flags` starts from the
header's own flags, so a message that carries TC (a forwarded truncated response, a message being re-sent over TCP) makes
`toWire(max, false)` throw although nothing was dropped and the result fits in `max`. Found by the message property.
"""
