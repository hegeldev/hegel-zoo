[[bug]]
id = "commons-csv/2"
title = "Escape mode: a value ending in a prefix of a multi-character delimiter that contains one of the letters r n t b f is printed unescaped and misread"
kind = "wrong-result"
severity = "low"
test = "pin_escapedDelimiterPrefixWithEscapeLetters"
found = { commit = "bb0f0fbb0f84de5cf5a0c73a9fa7051fb5135650", version = "1.15.0-SNAPSHOT (after v1.14.1, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`printWithEscapes` escapes every character of a value's trailing prefix of the delimiter (changes.xml f001: "Escape-mode
printer and parser mishandles value ending in multi-char delimiter prefix"), but `isDelimiterStraddleEscapable` switches
that off whenever the delimiter contains `r`, `n`, `t`, `b` or `f`, because `\\n`, `\\t` ... would be read back as control
characters. Nothing else protects those delimiters: with `setQuote(null).setEscape('\\\\').setDelimiter("aba")`,
`format("xab", "y")` is `xababay`, which the parser splits as `x` and `bay`; with the delimiter `nn`, `format("xn", "y")`
is `xnnny` and reads back as `x` and `ny`. The printer emits text its own parser reads as different values; the format
is accepted by the builder without complaint. (The letters' escapes cannot be used, so either the builder should refuse
such delimiters in escape mode or the lexer should recognise `\\` + delimiter character before the control-character
escapes, as `readEscape` already does for the delimiter's characters that are not those letters.)
"""

