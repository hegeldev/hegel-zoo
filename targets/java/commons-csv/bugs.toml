[[bug]]
id = "commons-csv/5"
title = "A header whose names differ only in case passes CSVFormat's duplicate check under ignoreHeaderCase, and CSVParser then rejects the same header"
kind = "inconsistent"
severity = "low"
test = "pin_formatRejectsCaseInsensitiveDuplicateHeader"
found = { commit = "bb0f0fbb0f84de5cf5a0c73a9fa7051fb5135650", version = "1.15.0-SNAPSHOT (after v1.14.1, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`CSVFormat.validate()` checks an explicit header for duplicates with a case-sensitive `HashSet`, so
`setHeader("a", "A").setIgnoreHeaderCase(true).setDuplicateHeaderMode(DuplicateHeaderMode.DISALLOW).get()` builds a format.
`CSVParser.createHeaders()` checks the same names against its case-insensitive header map and throws
`IllegalArgumentException: The header contains a duplicate name: "A" in [a, A]` as soon as the parser is created, whatever
the input. Under `ignoreHeaderCase` the two names are one column (`getHeaderMap()` has a single entry), so the parser is
right to refuse and the format's validation should refuse too; as it is, a format that "builds" cannot parse anything.
"""

