[[bug]]
id = "commons-csv/3"
title = "CSVRecord.isConsistent compares the record size with the number of distinct header names, so it is false for every record when header names repeat"
kind = "wrong-result"
severity = "low"
test = "pin_isConsistentWithDuplicateHeaderNames"
found = { commit = "bb0f0fbb0f84de5cf5a0c73a9fa7051fb5135650", version = "1.15.0-SNAPSHOT (after v1.14.1, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`isConsistent()` is documented as "Tests whether the record size matches the header size" and is implemented as
`headerMap.size() == values.length`. The header map holds one entry per distinct name (the last index wins), so with the
default `DuplicateHeaderMode.ALLOW_ALL` and the header `a,a,b`, the record `1,2,3` (three values for three columns) is
reported inconsistent; so is every record under `ALLOW_EMPTY` when more than one column name is blank (`a,,,b`), since
all blank names share the key `""`. `getHeaderNames()` has the right count. The check should compare with the number of
header names.
"""

