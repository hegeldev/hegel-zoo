# Bugs found in Apache Commons CSV by the Hegel zoo. Pins: hegel/src/test/java/zoo/CommonsCsvPinsTest.java.

[[bug]]
id = "commons-csv/1"
title = "A null string that starts with the comment marker is printed bare, so the record reads back as a comment line"
kind = "wrong-result"
severity = "low"
test = "pin_nullStringStartingWithCommentMarker"
found = { commit = "bb0f0fbb0f84de5cf5a0c73a9fa7051fb5135650", version = "1.15.0-SNAPSHOT (after v1.14.1, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`CSVFormat.print(null, ...)` writes the null string as it is (quoted only in `QuoteMode.ALL`), while a value that starts
with the comment marker is encapsulated in the minimal quote mode and escaped in the escape mode precisely so that the
parser does not take the line for a comment (changes.xml #610, #614, and #629 for the empty value that starts a record).
With `setCommentMarker('#').setNullString("#")`, `format((Object) null, "x")` is `#,x`, and the parser reads that line as
the comment `,x`: the record disappears (`parse` returns no records, the comment lands on the next record or in
`getTrailerComment()`). A null string of `-` with the comment marker `-`, or `%` with `%`, behaves the same. Any
configuration in which the printer's null string can start a line and begins with the comment marker loses every record
whose first value is null.
"""

