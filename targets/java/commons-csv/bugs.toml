[[bug]]
id = "commons-csv/6"
title = "QuoteMode.ALL without a quote character prints the null string between double quotes"
kind = "wrong-result"
severity = "low"
test = "pin_quotelessAllModeNullString"
found = { commit = "bb0f0fbb0f84de5cf5a0c73a9fa7051fb5135650", version = "1.15.0-SNAPSHOT (after v1.14.1, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`CSVFormat.Builder.setQuotedNullString()` builds the quoted null string with `"` when no quote character is set, and
`print(null, ...)` uses it whenever the quote mode is `ALL`, without checking that a quote character exists. With
`setQuote(null).setEscape('\\\\').setNullString("NULL").setQuoteMode(QuoteMode.ALL)`, `format((Object) null, "a")` is
`"NULL",a`; the parser of the same format has no quote character and reads the seven characters `"NULL"` back as the
value (a non-null string containing two double quotes), not as null. Non-null values in that format are written without
any quotes, as the missing quote character says they should be.
"""

