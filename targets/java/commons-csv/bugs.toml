[[bug]]
id = "commons-csv/4"
title = "CSVParser.getFirstEndOfLine ignores the line breaks that end comment lines"
kind = "wrong-result"
severity = "low"
test = "pin_firstEndOfLineAfterComment"
found = { commit = "bb0f0fbb0f84de5cf5a0c73a9fa7051fb5135650", version = "1.15.0-SNAPSHOT (after v1.14.1, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`getFirstEndOfLine()` is documented as "the first end-of-line string encountered". The lexer records the end-of-line
string only in `readEndOfLine`, which handles the line breaks that end records; a comment line is consumed by
`ExtendedBufferedReader.readLine()`, which never records it. For `# c\\r\\na,b\\nc,d\\n` with the comment marker `#`, the
parser reports `\\n` although the first line of the input ends with `\\r\\n` (and `null` for an input that consists of
comment lines only). The method exists so that callers can write the file back with the line breaks it came with.
"""

