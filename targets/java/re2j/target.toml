name = "re2j"
language = "java"
upstream = "https://github.com/google/re2j"
subdir = ""
license = "BSD-3-Clause"  # CONTRIBUTING.md: Google CLA only, no AI policy (checked 2026-09-18)
ai_policy_checked = "2026-09-18"

[base]
commit = "951a6159fdc0a4931593c70442926f86031edf40"
date = "2026-05-22"
version = "1.8"  # build.gradle version, 10 commits after re2j-1.7

[hegel]
version = "0.6.0"

[run]
# No install step: upstream builds with Gradle, so hegel/pom.xml compiles the library's sources
# (java/com/google/re2j, minus module-info.java and the GWT super-sources) as the module's own
# main sources instead of depending on a published artifact.
setup = []

[expected_failures]
pinSplitOfOnlyDelimitersIsEmpty = "re2j/1"
pinByteInputAssertionsSeeThePreviousCharacter = "re2j/2"
pinByteInputEmptyMatchesFallOnCharacterBoundaries = "re2j/3"
pinZeroRepetitionLeavesTheGroupUnset = "re2j/4"
pinUnmatchedNamedGroupReplacesWithNothing = "re2j/5"
pinNamedGroupsSurviveACountedRepetition = "re2j/6"
pinReadingAGroupKeepsTheMatchOnByteInput = "re2j/7"
pinReadingAGroupAfterAPhantomTextStartDoesNotThrow = "re2j/17"
pinFailedFindClearsTheMatch = "re2j/8"
pinMalformedReplacementsAreRejected = "re2j/9"
pinInvalidUtf8BytesDecodeAsReplacementCharacters = "re2j/10"
pinMatchingNeverOverflowsTheStack = "re2j/11"
pinNestedRepeatCountsAreBounded = "re2j/12"
pinDeepNestingIsASyntaxErrorNotAnError = "re2j/13"
pinBracketColonIsAnOrdinaryClass = "re2j/14"
pinCaseInsensitiveClassFoldsAllOfUnicode = "re2j/15"
pinUnexpectedParenIsNotAnInternalError = "re2j/16"
