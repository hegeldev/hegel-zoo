# Bugs found in RE2/J by the Hegel zoo. One [[bug]] per finding; `test` names the JUnit pin in
# hegel/src/test/java/zoo/Re2jPinsTest.java that fails while the bug exists (listed under
# [expected_failures] in target.toml). Oracles: java.util.regex on the syntax the two engines share
# (the documented RE2-vs-Perl differences gated), RE2/J's own char and byte APIs against each other,
# and Go's regexp (the code RE2/J is a port of) consulted by hand for the disputed cases. The
# upstream CONTRIBUTING.md asks only for Google's CLA (checked 2026-09-18).

[[bug]]
id = "re2j/1"
title = "Pattern.split of an input made only of delimiters returns [\"\"] instead of []"
kind = "contract"
severity = "low"
test = "pinSplitOfOnlyDelimitersIsEmpty"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Pattern.split(input, limit) documents java.util.regex's contract ("if limit is zero, trailing
empty strings are discarded") and java.util.regex returns an empty array for ",,,".split(","). The
loop in Pattern.split (Pattern.java:275, `if (limit != 0 || result.isEmpty()) result.add(...)`)
adds the last piece whenever nothing has been kept so far, so an input consisting only of
delimiters gives one empty string: split(",,,") by "," and split("abc") by \w are [""]. Go's
regexp.Split(",,,", -1) is ["", "", "", ""] and there is no limit-0 mode, so the Java contract is
the reference here.
'''

[[bug]]
id = "re2j/2"
title = "Byte (UTF-8) input: empty-width assertions treat every non-ASCII character as text start"
kind = "wrong-result"
severity = "medium"
test = "pinByteInputAssertionsSeeThePreviousCharacter"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MachineInput.UTF8Input.context computes the character before position pos with
`r1 = b[start--]; if (r1 >= 0x80) { ... decode a multi-byte character ... }`
(MachineInput.java:147-148). A Java byte is signed, so r1 >= 0x80 is never true: the multi-byte
branch is dead and the negative lead/continuation byte is handed to Utils.emptyOpContext, whose
`r1 < 0` case means "no previous character" and yields EMPTY_BEGIN_TEXT | EMPTY_BEGIN_LINE. After
any non-ASCII character in a byte[] input, `\A`, `^` and (?m)^ therefore match and `\b`/`\B` are
computed against a phantom text start: Pattern.compile("^x", MULTILINE).matcher(bytes of "éx")
finds a match, `\A` matches at 0 and at 3 in the bytes of "aéb", `\b` on the bytes of "ééx"
reports a boundary at 0 (want 4 and 5 only). The String API and Go are correct; RE2/J's byte API
documents itself as "matching UTF-8 encoded input" with the same semantics.
'''

[[bug]]
id = "re2j/3"
title = "Byte (UTF-8) input: after an empty match, find() advances one byte and matches inside a character"
kind = "wrong-result"
severity = "medium"
test = "pinByteInputEmptyMatchesFallOnCharacterBoundaries"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Matcher.find() steps past an empty match with `if (groups[0] == groups[1]) start++`
(Matcher.java:343-344). For a UTF-8 byte[] input the unit is a byte, so the next attempt starts in
the middle of a multi-byte character: Pattern.compile("x{0}").matcher(bytes of "ſ") finds empty
matches at 0, 1 and 2 (java.util.regex and Go: 0 and 2 — the character boundaries), and the second
empty match of "" on the bytes of "é" starts at 1. Matches that start inside a character also
decode garbage for the rest of the input. Go's regexp advances by the width of the rune at the
match position.
'''

[[bug]]
id = "re2j/4"
title = "A capturing group inside a {0} repetition is reported as matching the empty string at 0"
kind = "wrong-result"
severity = "low"
test = "pinZeroRepetitionLeavesTheGroupUnset"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Simplify turns x{0} into an empty match (Simplify.java:61-62), dropping the capturing groups
inside; the program's capture count (prog.numCap) is computed from the simplified tree while the
matcher's group array is sized from the parser's count. Machine.init resets only the first
prog.numCap slots (`Arrays.fill(matchcap, 0, prog.numCap, -1)`, Machine.java:224), so the dropped
group's slots keep their initial 0: Pattern.compile("(?:b(c)){0}").matcher("xb").find() gives
start(1) == 0, end(1) == 0 and group(1) == "" where java.util.regex and Go report the group as
not participating (-1 / null). With a named group, "-${name}$0" replacement over "x" and
(?P<name>c){0}x gives "-x" in both engines only because the group is empty; the spans differ.
'''

[[bug]]
id = "re2j/5"
title = "Replacement ${name} of a group that did not participate inserts the text \"null\""
kind = "wrong-result"
severity = "medium"
test = "pinUnmatchedNamedGroupReplacesWithNothing"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Matcher.appendReplacement handles a numeric reference $n with a null check (Matcher.java:515-518,
nothing appended when the group did not participate) but the named form ${name} does
`sb.append(group(groupName))` (Matcher.java:537), so group(name) == null becomes the four
characters "null": Pattern.compile("(?P<g>x)|y").matcher("y").replaceAll("[${g}]") is "[null]"
while "[$1]" is "[]". java.util.regex appends nothing in both forms; Go's ${name} expands to "".
'''

[[bug]]
id = "re2j/6"
title = "A repetition at the root of the pattern can lose namedGroups() and group(name)"
kind = "wrong-result"
severity = "medium"
test = "pinNamedGroupsSurviveACountedRepetition"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The parser attaches the name map to the root Regexp node (Parser.java:984,
`stack.get(0).namedGroups = namedGroups`) and RE2.compile copies it from the simplified tree
(RE2.java:201, `re2.namedGroups = re.namedGroups`). Simplify rewrites a counted repetition x{n},
x{n,}, x{n,m} or x{0} into a new node (a concatenation of copies, or an empty match), and builds
a new node for x*, x+, x? whenever their body was rewritten, so when such a repetition is the
whole pattern the new root has no map: Pattern.compile("(?P<x>a){2}").namedGroups() is {}
(groupCount() is still 1), group("x") throws IllegalArgumentException ("no group with name <x>")
and ${x} in a replacement fails. "(?P<x>a){1}", "{1,2}", "{0,2}", "{0}", "(?P<x>a{2})+" and
"(?:(?P<x>a)*)*" behave the same; "(?P<x>a)+" and any concatenation such as "(?P<x>a){2}b" keep
the map because their root survives simplification unchanged. java.util.regex and Go keep the
names (Go's SubexpNames is taken before simplification).
'''

[[bug]]
id = "re2j/7"
title = "Byte (UTF-8) input: reading a group re-runs the match over a truncated window and changes the match"
kind = "wrong-result"
severity = "medium"
test = "pinReadingAGroupKeepsTheMatchOnByteInput"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
find() computes only the overall span; Matcher.loadGroup (Matcher.java:279-303) fills in the
groups lazily by matching again, anchored, over the window [groups[0], groups[1] + 1). For byte
input MachineInput.UTF8Input.context uses the window's own end as the end of text (UTF16Input
looks at the whole string), so `$` and `\z` match at the window's end inside the input and the
second run can find a different match than the first: Pattern.compile("(ab$)|a").matcher(bytes of
"abc").find() gives group() == "a" and end() == 1; after group(1) is read, group() is "ab", end()
is 2 and group(1) is "ab" although "ab$" cannot match inside "abc". The String API returns "a"
and null throughout, as does Go's FindSubmatchIndex.
'''

[[bug]]
id = "re2j/8"
title = "A failed find() or matches() leaves the previous match readable; appendReplacement appends it again"
kind = "contract"
severity = "low"
test = "pinFailedFindClearsTheMatch"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Matcher documents itself as mimicking java.util.regex.Matcher, whose group(), start(), end() and
appendReplacement throw IllegalStateException ("No match found") once find() has returned false.
RE2/J's Matcher.find/matches/lookingAt return false without touching the state of the previous
successful match (Matcher.genMatch only stores on success), so after
m = Pattern.compile("a").matcher("ab"); m.find(); m.find() the calls m.group() == "a", m.start()
== 0 succeed and m.appendReplacement(sb, "X") appends "X" (and the text before the stale match)
again. A loop written the java.util.regex way (find(); ...; while (!find()) ...) reads stale
results instead of failing.
'''

[[bug]]
id = "re2j/9"
title = "Malformed replacement strings (\"$\", \"$x\", trailing backslash) are accepted silently"
kind = "contract"
severity = "low"
test = "pinMalformedReplacementsAreRejected"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Matcher.appendReplacement documents the java.util.regex replacement syntax ($n, ${name}, \\ and \$
escapes), where a lone "$" at the end, "$x" (a non-digit, non-brace after $) and a trailing
backslash are IllegalArgumentExceptions ("Illegal group reference", "character to be escaped is
missing"). RE2/J's scan (Matcher.java:489, loop `i < m - 1` for the last character and no check of
what follows $) copies them literally: Pattern.compile("a").matcher("bab").replaceAll("$") is
"b$b", replaceAll("$x") is "b$xb", replaceAll("a\\") is "ba\\b". Typos in replacement templates
go undetected where the documented API reports them.
'''

[[bug]]
id = "re2j/10"
title = "Byte (UTF-8) input: invalid bytes swallow the following byte or end the input"
kind = "wrong-result"
severity = "medium"
test = "pinInvalidUtf8BytesDecodeAsReplacementCharacters"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MachineInput.UTF8Input.step decodes a multi-byte lead byte by consuming the number of bytes the
lead byte announces without checking that they are continuation bytes, and returns EOF for a byte
it cannot start a character with. Go's regexp (utf8.DecodeRune) decodes every invalid byte as
U+FFFD of width 1 and carries on. Consequences: Pattern.compile(".").matcher(new byte[] {0xC3,
'a'}) finds one match 0-2 whose group is "�a" — the 'a' is swallowed as a bogus continuation
byte — instead of two characters; "." and "\w" over {0xFF, 'a'} or {0x80, 'a'} find nothing at
all because the input is treated as ended at the invalid byte, so Pattern.compile("a").matcher(
{0xFF, 'a'}).find() is false; "." over {'a', 0xC3} finds only 0-1. Matching a pattern against
partially invalid bytes (logs, network data) silently skips the text after the first bad byte.
'''

[[bug]]
id = "re2j/11"
title = "matches() throws StackOverflowError on (?:(?:a?){1000}){10}, a 10 000-instruction program"
kind = "crash"
severity = "medium"
test = "pinMatchingNeverOverflowsTheStack"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The README promises that exceeding "the available stack space and fail[ing] ... will never happen
with RE2/J". Machine.add follows epsilon transitions (ALT, NOP, CAPTURE, EMPTY_WIDTH) by
recursion, so the recursion depth grows with the size of the epsilon closure of one state.
Pattern.compile("(?:(?:a?){1000}){10}") is accepted (each repeat count is within the 1000 limit)
and compiles to about 10 000 instructions whose closure is one long chain; matcher("aaa").matches()
then throws StackOverflowError on the default 1 MB thread stack (Java 21). "(?:a?){1000}" alone
is fine. Go's regexp uses an explicit work list and matches the same pattern; RE2 C++ likewise.
'''

[[bug]]
id = "re2j/12"
title = "Nested repeat counts are not bounded: (a{2}){1000} compiles, ((a{100}){100}){100} is a million instructions"
kind = "contract"
severity = "low"
test = "pinNestedRepeatCountsAreBounded"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parser.repeat checks each {n,m} against 1000 on its own (Parser.java:1029, `min > 1000 || max >
1000`). RE2 and Go's regexp/syntax additionally reject a nested repetition whose product exceeds
1000 (Go's repeatIsValid: "(a{2}){1000}" is "invalid repeat count"), which is what bounds the
program size that a short pattern can demand. RE2/J compiles "(a{2}){1000}" (programSize() 4002)
and "(?:(?:a{100}){100}){100}" (programSize() 1 020 202, about 400 ms and tens of megabytes to
compile) — a 27-character pattern from untrusted input costs a million instructions per match
attempt, which is the kind of input the RE2 limits exist to refuse.
'''

[[bug]]
id = "re2j/13"
title = "Pattern.compile of 20 000 nested parentheses throws StackOverflowError"
kind = "crash"
severity = "low"
test = "pinDeepNestingIsASyntaxErrorNotAnError"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Both the parser's post-processing and Compiler.compile walk the syntax tree recursively, and the
parser has no nesting limit (Go's regexp/syntax refuses more than 1000 nested groups with
"expression nests too deeply"; RE2 C++ has the same limit). Pattern.compile("(" * 20000 + "a" +
")" * 20000) throws StackOverflowError instead of PatternSyntaxException; 5 000 nested "(?:" still
compile. A caller that validates user-supplied patterns by catching PatternSyntaxException is
taken down by an Error instead.
'''

[[bug]]
id = "re2j/14"
title = "[[:] and [[:]] are rejected as \"invalid character class range\""
kind = "wrong-result"
severity = "low"
test = "pinBracketColonIsAnOrdinaryClass"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parser.parseNamedClass looks for the closing ":]" of a POSIX class with `cls.indexOf(":]")`
(Parser.java:1501) from the start of the whole remaining pattern rather than after the "[:" it is
parsing, so for "[[:]" it finds the ":]" that is the class's own "[:" plus the closing bracket,
takes "" as the class name and fails. In RE2 and Go "[[:]" is the class {'[', ':'} (no name
between "[:" and ":]" — the "[:" is not a POSIX class) and "[[:]]" is that class followed by a
literal ']': Go's regexp.MustCompile("[[:]]").MatchString(":]") is true. RE2/J throws
PatternSyntaxException for both. java.util.regex accepts them too (with its own union semantics).
'''

[[bug]]
id = "re2j/15"
title = "(?i)[X] does not case-fold code points above U+1044F while (?i)X does"
kind = "inconsistent"
severity = "low"
test = "pinCaseInsensitiveClassFoldsAllOfUnicode"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Unicode.MAX_FOLD is 0x1044f (Unicode.java:31; Go's unicode.MaxFold is 0x1e943 since the case
tables gained Old Hungarian, Adlam and others in Unicode 8-9), and CharClass.appendFoldedRange
(CharClass.java:135-148) adds no case variants for ranges above MAX_FOLD. The literal path
(Parser.literal via Unicode.simpleFold) has no such cap, so the two spellings of a
case-insensitive single character disagree: Pattern.compile("(?i)\\x{10C80}").matcher(U+10CC0)
.matches() is true and Pattern.compile("(?i)[\\x{10C80}]").matcher(U+10CC0).matches() is false
(Old Hungarian capital/small A); the same for Adlam U+1E900/U+1E922. java.util.regex with
UNICODE_CASE matches both. The property caseInsensitiveLiteralAndClassAgree found it by comparing
the two spellings over random code points.
'''

[[bug]]
id = "re2j/16"
title = "An unbalanced ) is reported as \"regexp/syntax: internal error\""
kind = "wrong-exception"
severity = "low"
test = "pinUnexpectedParenIsNotAnInternalError"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Parser.parseRightParen pops the stack and, finding no matching left parenthesis, throws
PatternSyntaxException(ERR_INTERNAL_ERROR, "stack underflow") (Parser.java:1312-1320), so
Pattern.compile("a)") and Pattern.compile(")") report "regexp/syntax: internal error: stack
underflow". Go's regexp/syntax returns ErrUnexpectedParen ("unexpected )") for the same input, and
RE2/J's own error catalogue has ERR_MISSING_PAREN for the opposite case. A user typo is presented
as a bug in the library.
'''

[[bug]]
id = "re2j/17"
title = "Byte (UTF-8) input: group() throws \"inconsistency in matching group data\" after a match found at a phantom text start"
kind = "crash"
severity = "medium"
test = "pinReadingAGroupAfterAPhantomTextStartDoesNotThrow"
found = { commit = "951a6159fdc0a4931593c70442926f86031edf40", version = "1.8", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Pattern.compile("(^).a").matcher(bytes of "éba").find() returns true with start() == 2 and
end() == 4 (the `^` at byte 2 is the phantom text start of re2j/2: the byte before it is a
negative continuation byte, which UTF8Input.context reads as "no previous character"). Reading
group(1) then throws IllegalStateException("inconsistency in matching group data") from
Matcher.loadGroup (Matcher.java:279-307): the groups are filled in lazily by a second, anchored
run over the window [start, end + 1), and that run does not find the match the scan found, so the
"must match" check fails. `^.a` (no capturing group) returns "ba" from the same bytes without
throwing, and `(^)ba` finds nothing, so the two runs evaluate `^` at byte 2 differently. The
String API and Go find no match in "éba" at all. Found by the byte-input property's 1000-case
run after its generators were rewritten (turn 421); the mechanism is re2j/2's dead multi-byte
branch meeting re2j/7's lazy re-run, but the symptom - an internal-error exception from group()
after a successful find() - is its own.
'''
