name = "jackson-databind"
language = "java"
upstream = "https://github.com/FasterXML/jackson-databind"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-19"  # README, CLAUDE.md (Claude Code guidance only), SECURITY.md, .github/: no AI policy

[base]
commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3"
date = "2026-09-16"
version = "3.3.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install jackson-databind (javadoc/sources/enforcer skipped) into the local Maven
# repository at the version the pom declares - hegel/pom.xml depends on that version (update
# `jackson.version` there when a bump changes it).
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true install",
]

[expected_failures]
pinFindValueFollowsDocumentOrder = "jackson-databind/1"
pinFindValuesAsStringWithContainers = "jackson-databind/2"
pinStringifiedFractionCoercesLikeTheNumber = "jackson-databind/3"
pinStringifiedHugeNumberDoesNotOverflowToInfinity = "jackson-databind/4"
pinMinimumDurationWritesAsTimestamp = "jackson-databind/5"
pinYearMonthKeyWithFiveDigitYearRoundTrips = "jackson-databind/6"
pinFloatingNodesRefuseTheValueJustPastMaxValue = "jackson-databind/7"
pinIntegralFloatBeyondIntRangeConvertsToLong = "jackson-databind/8"
