# Bugs found in FasterXML/jackson-databind by the zoo's property tests.

[[bug]]
id = "jackson-databind/1"
title = "ObjectNode.findValue, findPath and findParent return this node's own property before an earlier match in a descendant, against the documented document order"
kind = "contract"
severity = "low"
test = "pinFindValueFollowsDocumentOrder"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
`JsonNode.findValue` is documented as "finding the first JSON Object field with specified name in this
node or its child nodes ... traversal is done in document order (that is, order in which nodes are
iterated if using `values()`)", and `findValues` follows that order. But `ObjectNode.findValue` looks
the name up in its own children first and only then recurses, so for `{"a":{"c":1},"c":2}`
`findValue("c")` is `2` while `findValues("c")` is `[1, 2]`; `findPath` and `findParent` do the
same (`findParent("c")` is the root, `findParents("c").get(0)` the inner object). `ArrayNode`
recurses in order, so the two answers only differ when an object both holds the name and has an
earlier property whose subtree holds it.
"""

[[bug]]
id = "jackson-databind/2"
title = "findValuesAsString throws when a matching value is an Object or an Array instead of converting it"
kind = "crash"
severity = "low"
test = "pinFindValuesAsStringWithContainers"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
`findValuesAsString(name)` is documented as "similar to `findValues`, but will additionally convert
values into Strings, calling `asText`". In 3.x the conversion is `asString()`, which throws
`JsonNodeException` ("cannot convert value of type ObjectNode to String") for containers, so
`readTree("{\\"a\\":{\\"x\\":1}}").findValuesAsString("a")` throws where `findValues("a")` returns the
object; the same for arrays. Either the container should be skipped or converted (2.x returned
`""`), or the Javadoc should say the method fails.
"""

[[bug]]
id = "jackson-databind/3"
title = "A StringNode holding a number with a fraction or an exponent cannot be coerced with asInt, asLong, asShort or asBigInteger, while the same number as a numeric node truncates"
kind = "contract"
severity = "low"
test = "pinStringifiedFractionCoercesLikeTheNumber"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
`asInt()` is documented to coerce "JSON Floating-point numbers with fractions ... truncated to int"
and "JSON Strings that represent JSON Numbers (stringified numbers)"; `DecimalNode(92.1).asInt()` is
`92`. `StringNode.asInt()` goes through `_tryParseAsInteger`, which is `Integer.parseInt` behind a
`looksLikeValidNumber` check, so `StringNode("92.1").asInt()` throws `JsonNodeException` ("value not
a valid String representation of `int`"), as do `"9.3E+4"`, `"100.0"` and `"1e2"`; `asLong`,
`asShort` and `asBigInteger` behave the same, and `asIntOpt()` is empty where the numeric node's is
present. `asDouble()` and `asDecimal()` do parse these strings, so the string is a valid stringified
JSON number for the floating-point accessors but not for the integral ones.
"""

[[bug]]
id = "jackson-databind/4"
title = "StringNode.asDouble and asFloat return Infinity for a stringified number beyond the double or float range, where the numeric node throws"
kind = "inconsistent"
severity = "low"
test = "pinStringifiedHugeNumberDoesNotOverflowToInfinity"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
`DecimalNode.asDouble()` checks `Double.isFinite` and throws `JsonNodeException` (a range failure)
for `1E+400`; `StringNode("1E+400").asDouble()` is `NumberInput.parseDouble` unchecked and returns
`Infinity`, so `asDoubleOpt()` is present and `asDouble(default)` ignores the default. Likewise
`StringNode(Double.MAX_VALUE.toString()).asFloat()` is `Infinity` where `DoubleNode(MAX_VALUE).asFloat()`
throws. The Javadoc promises the value "if possible to accurately represent" and an exception
otherwise.
"""

[[bug]]
id = "jackson-databind/5"
title = "Duration.ofSeconds(Long.MIN_VALUE) cannot be written as a nanosecond timestamp: the serializer negates it and overflows"
kind = "crash"
severity = "low"
test = "pinMinimumDurationWritesAsTimestamp"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
With `WRITE_DURATIONS_AS_TIMESTAMPS` (and the default `WRITE_DATE_TIMESTAMPS_AS_NANOSECONDS`)
`DurationSerializer._toNanos` takes `duration.abs()` of a negative duration and negates the decimal,
a work-around for modules-java8#165. `Duration.ofSeconds(Long.MIN_VALUE)` has no absolute value, so
`writeValueAsString` throws a raw `java.lang.ArithmeticException: Exceeds capacity of Duration:
9223372036854775808000000000`. `DecimalUtils.toBigDecimal` handles negative seconds itself since
modules-java8#359, and the deserializer reads `-9223372036854775808.000000000` back correctly, so
the work-around is what fails. `Long.MIN_VALUE + 1` seconds and `Long.MIN_VALUE` seconds with a
positive nano adjustment write fine; the text form (`PT-2562047788015215H-30M-8S`) round-trips.
"""

[[bug]]
id = "jackson-databind/6"
title = "A YearMonth map key with a year of 10000 or more is written in a form its key deserializer rejects"
kind = "roundtrip"
severity = "low"
test = "pinYearMonthKeyWithFiveDigitYearRoundTrips"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
`YearMonth` has no key serializer of its own, so a `Map<YearMonth, String>` key is written with
`toString()`: `YearMonth.of(10000, 12)` becomes `"10000-12"` (`YearMonth.toString` only adds the
sign for negative years). `YearMonthKeyDeserializer` parses with a copy of `YearMonth`'s own
strict parser (`appendValue(YEAR, 4, 10, SignStyle.EXCEEDS_PAD)`), which demands `+10000-12`, so
reading `{"10000-12":"x"}` back throws `InvalidFormatException: Cannot deserialize Map key of type
java.time.YearMonth from String "10000-12"`. As a value the same `YearMonth` round-trips, because
`YearMonthDeserializer`'s default pattern is the lenient `u-MM`. Negative years and years up to
9999 are fine as keys.
"""

[[bug]]
id = "jackson-databind/7"
title = "FloatNode accepts 2^31 as an int and DoubleNode 2^63 as a long: the range check compares against MAX_VALUE rounded up to a float or double and the cast saturates"
kind = "wrong-result"
severity = "medium"
test = "pinFloatingNodesRefuseTheValueJustPastMaxValue"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
`FloatNode.inIntRange()` is `_value >= Integer.MIN_VALUE && _value <= Integer.MAX_VALUE`; the bound
is promoted to a float, which rounds `Integer.MAX_VALUE` up to 2^31, so `FloatNode(2147483648f)`
is "in range" and `intValue()`, `asInt()`, `intValueOpt()` return `2147483647` (the saturating
`(int)` cast) with `canConvertToInt()` true. `inLongRange()` does the same with `Long.MAX_VALUE`
as a float or double (2^63): `DoubleNode(9223372036854775808.0).longValue()`, `asLong()` and
`longValueOpt()` give `Long.MAX_VALUE` and `canConvertToLong()` is true; `FloatNode(2^63f).asLong()`
too. `DecimalNode` and `BigIntegerNode` of the same values throw the documented range failure, and
`DoubleNode(2147483648.0).intValue()` throws (2^31 is exact in a double, so the int bound is not
rounded). The minimum values are exact powers of two and are fine.
"""

[[bug]]
id = "jackson-databind/8"
title = "FloatNode.longValue and bigIntegerValue reject an integral float beyond the int range as having a fractional part"
kind = "contract"
severity = "medium"
test = "pinIntegralFloatBeyondIntRangeConvertsToLong"
found = { commit = "2a428d9b569ec1ac28f0b071a71f3296a43fa6a3", version = "3.3.0-SNAPSHOT (2026-09-16)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = """
`FloatNode.hasFractionalPart()` is `_value != Math.round(_value)`, and `Math.round(float)` returns
an `int`, saturating at `Integer.MAX_VALUE`/`MIN_VALUE`. So every float of magnitude 2^31 or more
"has a fractional part": `FloatNode(1e10f).longValue()` throws `JsonNodeException` ("cannot convert
value 1.0E10 to long: value has fractional part"), as does `bigIntegerValue()`; `longValueOpt()` is
empty, `canConvertToLong()` and `canConvertToExactIntegral()` are false, while `asLong()` returns
`10000000000` and `hasFractionalPart()` itself answers true. `DoubleNode` uses `Math.rint` and is
right (`DoubleNode(1e20).bigIntegerValue()` works). `FloatNode(-2147483904f)` and `FloatNode(3e9f)`
fail the same way; floats within the int range and floats beyond the long range (which fail the
range check first) are fine.
"""
