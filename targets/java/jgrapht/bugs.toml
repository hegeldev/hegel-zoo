most 2^maxLevel - 1 edges (3 in a tree of 7 vertices) although a path may be n-1 deep. Tree
0-1-2-3-4-5 plus 0-6 rooted at 0: getLCA(5, 6) = 1 instead of 0. EulerTourRMQ, HeavyPath, Tarjan
and Naive agree with brute force. Property lowestCommonAncestorsMatchTheTree gates on the depth
condition (known jgrapht/9).
'''

[[bug]]
id = "jgrapht/10"
