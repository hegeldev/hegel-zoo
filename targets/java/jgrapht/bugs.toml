[[bug]]
id = "jgrapht/9"
title = "BinaryLiftingLCAFinder returns a wrong ancestor for vertices deeper than 2^floor(log2 n) - 1"
kind = "wrong-result"
severity = "high"
test = "pinBinaryLiftingClimbsTheWholeDepth"
found = { commit = "7580075f92b59ac47516aec5f1b859f459f7ec89", version = "1.6.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
notes = '''
