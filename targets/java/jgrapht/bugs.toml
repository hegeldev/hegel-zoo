found = { commit = "7580075f92b59ac47516aec5f1b859f459f7ec89", version = "1.6.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
notes = '''
The Javadoc says cut "doesn't have any effect if there's no edge between these elements". For
link(0,1); link(1,2); cut(0,2) the method removes the tree from minToTreeMap before it discovers
that there is no edge and throws IllegalArgumentException("Elements {0} and {2} are not
connected"); afterwards connected(0, 2) and cut(0, 1) fail with NullPointerException because the
tree is gone. Cutting existing edges matched brute force over 300 random link/cut sequences.
'''

[[bug]]
id = "jgrapht/5"
title = "TransitiveReduction.reduce() destroys reachability on any graph with a cycle or a self loop"
kind = "wrong-result"
severity = "high"
test = "pinTransitiveReductionKeepsReachabilityOnCycles"
found = { commit = "7580075f92b59ac47516aec5f1b859f459f7ec89", version = "1.6.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
notes = '''
The Javadoc promises to "remove all transitive edges" of a directed graph and states no acyclicity
requirement, but the matrix step pathMatrix[i].andNot(pathMatrix[j]) removes j itself and
everything reachable from it whenever j lies on a cycle. A 2-cycle {0->1, 1->0} and a vertex with a
self loop plus one arc {0->0, 0->1} both reduce to the empty edge set; 197 of 250 random cyclic
digraphs lost reachability. On acyclic graphs the result is minimal and correct (property
connectivityMatchesReachability, which therefore only reduces DAGs).
'''

[[bug]]
id = "jgrapht/6"
