# Bugs found in JGraphT by the Hegel zoo. One [[bug]] per finding; `test` names the JUnit pin in
# hegel/src/test/java/zoo/JGraphtPinsTest.java that fails while the bug exists (listed under
# [expected_failures] in target.toml; two bugs have two pins each). Oracles: brute force on graphs
# of at most nine vertices (Floyd-Warshall, subset enumeration, bitmask dynamic programs, Held-Karp,
# Kruskal on the edge list), the classes' own Javadoc contracts, and the algorithms' textbook
# definitions. Where the code comments or Javadoc fix a convention (the null graph is not Eulerian
# or split; findCyclesContainingVertex is documented as incomplete) the tests follow it and no
# bug is recorded. Upstream states no policy on AI-assisted contributions (CONTRIBUTING.md, the
# wiki's contributor guide, README, .github/ checked 2026-09-18).

[[bug]]
id = "jgrapht/1"
title = "BiconnectivityInspector.isBiconnected() (and GraphTests.isBiconnected) is true for a disconnected graph with isolated vertices"
kind = "wrong-result"
severity = "medium"
test = "pinBiconnectedGraphsAreConnected"
found = { commit = "7580075f92b59ac47516aec5f1b859f459f7ec89", version = "1.6.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
notes = '''
The Javadoc defines biconnected as "a connected graph on two or more vertices having no cutpoints",
but the implementation returns `vertexSet().size() >= 2 && blocks.size() == 1`. Isolated vertices
(and vertices carrying only self loops) never produce a block, so one edge plus an isolated vertex
counts as one block: V = {0, 1, 2}, E = {0-1} -> isBiconnected() = true while isConnected() =
false. GraphTests.isBiconnected delegates to the inspector. The property hit it in about one graph
in twelve; the inspector's getCutpoints, getBridges and getBlocks agree with brute force.
'''

[[bug]]
id = "jgrapht/2"
title = "BiconnectivityInspector.getBridges() reports the antiparallel arcs of a DefaultDirectedGraph as bridges"
kind = "wrong-result"
severity = "medium"
test = "pinAntiparallelArcsAreNotBridges"
found = { commit = "7580075f92b59ac47516aec5f1b859f459f7ec89", version = "1.6.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
notes = '''
A bridge is an edge whose removal "would increase the number of (weakly) connected components".
Directed graphs are inspected through AsUndirectedGraph, and the post-filter that discards parallel
edges from the bridge set runs only when the graph type allows multiple edges. AsUndirectedGraph
keeps the type of a DefaultDirectedGraph (no multiple edges) although 0->1 and 1->0 are parallel in
the undirected view, so E = {0->1, 1->0} yields getBridges() = [(1 : 0)]. The same arcs in a
DirectedPseudograph give the empty set. Related to jgrapht/41.
'''

[[bug]]
id = "jgrapht/3"
title = "KConnectivityFlowAlgorithm.getEdgeConnectivity() ignores the reverse direction on directed graphs"
kind = "wrong-result"
severity = "medium"
test = "pinDirectedEdgeConnectivityLooksBothWays"
found = { commit = "7580075f92b59ac47516aec5f1b859f459f7ec89", version = "1.6.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-18" }
status = "open"
upstream_issue = ""
notes = '''
computeDirectedEdgeConnectivity computes the maximum flow only for pairs (v_i, v_j) with i < j and
never the flow from v_j to v_i, so a graph that is not strongly connected can report a positive
edge connectivity: E = {0->1} gives 1, expected 0. Undirected edge connectivity and both vertex
connectivities agree with brute force.
'''

[[bug]]
id = "jgrapht/4"
title = "TreeDynamicConnectivity.cut(a, b) on a connected but non-adjacent pair throws and corrupts the forest"
kind = "crash"
severity = "medium"
