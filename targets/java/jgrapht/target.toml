name = "jgrapht"
language = "java"
upstream = "https://github.com/jgrapht/jgrapht"
subdir = ""
license = "EPL-2.0 OR LGPL-2.1-or-later"
ai_policy_checked = "2026-09-18"  # CONTRIBUTING.md, the wiki's contribution guide, README, .github/: no policy on AI-assisted contributions

[base]
commit = "7580075f92b59ac47516aec5f1b859f459f7ec89"
date = "2026-08-03"
version = "1.6.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install jgrapht-core into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on that version - update `jgrapht.version` there when a bump changes it).
# Tests, javadoc, sources, the formatter check and signing are skipped.
setup = [
  "mvn -q -B -ntp -pl jgrapht-core -am install -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dformatter.skip=true -Dgpg.skip=true",
]

