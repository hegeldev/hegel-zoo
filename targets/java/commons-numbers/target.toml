name = "commons-numbers"
language = "java"
upstream = "https://github.com/apache/commons-numbers"
subdir = ""
license = "Apache-2.0"
# CONTRIBUTING.md and README.md are the generated Apache Commons templates (ASF contribution rules, ICLA for large
# patches); there is no CLAUDE.md, AGENTS.md, copilot-instructions or PR template, and .github/GH-ROBOTS.txt only
# disables stale-bot. Nothing prohibits AI-written tests; an upstream report should still say how they were made.
ai_policy_checked = "2026-09-16"

[base]
commit = "a2e57b960e2aa300da674a1e4178df0ba390186b"
date = "2026-09-07"
version = "1.4-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# The library modules are installed into the local Maven repository from the pinned tree (about 20 s); checkstyle,
# PMD, SpotBugs, RAT, JaCoCo, the enforcer, javadoc, sources and signing are skipped, and the docs/bom modules are left
# out. The tests also run an mpmath child process (hegel/oracle.py) from a virtual environment created here
# (surefire passes its interpreter as ZOO_PYTHON; without it the tests fall back to `python3` on the PATH).
setup = [
  "python3 -m venv hegel/.venv && hegel/.venv/bin/python -m pip install -q mpmath==1.4.1",
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true -Denforcer.skip=true -Drat.skip=true -Djacoco.skip=true -Dgpg.skip=true -Danimal.sniffer.skip=true -pl '!commons-numbers-docs,!commons-numbers-bom' install",
]

[expected_failures]
intValueIsTheFloor = "commons-numbers/1"
logAndSqrtOfAHugeRealWithASubnormalImaginaryAreFinite = "commons-numbers/2"
expKeepsTheFinitePartWhenTheOtherOverflows = "commons-numbers/3"
nthRootOfIntegerMinValueIsRejected = "commons-numbers/4"
representableFractionResultsDoNotOverflow = "commons-numbers/5"
digammaHasPolesAtTheNegativeIntegers = "commons-numbers/6"
digammaAndTrigammaKeepTheirAccuracyForLargeNegativeArguments = "commons-numbers/7"
combinationsComparatorOrdersLargeUniverses = "commons-numbers/8"
logFactorialDoesNotDependOnTheCache = "commons-numbers/9"
reduceStaysInsideItsInterval = "commons-numbers/10"
normalizersRespectTheLowerBound = "commons-numbers/11"
cosAngleIsScaleInvariant = "commons-numbers/12"
sumFollowsTheIeeeSignOfZero = "commons-numbers/13"
roundAcceptsExtremeScales = "commons-numbers/14"
bigFractionApproximationsAcceptValuesBeyondTheIntRange = "commons-numbers/15"
fromRejectsANonPositiveEpsilonAndNamesIt = "commons-numbers/16"
fromHonoursAnEpsilonBelowTheUlpOfTheValue = "commons-numbers/17"
