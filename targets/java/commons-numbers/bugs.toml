[[bug]]
id = "commons-numbers/12"
title = "CosAngle.value is not scale invariant: the dot product is computed without the scaling the norms use, giving 0 for tiny vectors and infinity for large ones"
kind = "wrong-result"
severity = "medium"
test = "cosAngleIsScaleInvariant"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
CosAngle.value (CosAngle.java:42) is `Sum.ofProducts(v1, v2).getAsDouble() / Norm.L2.of(v1) / Norm.L2.of(v2)`: Norm.L2
scales to avoid overflow and underflow but the dot product does not. CosAngle.value({1e-200, 1e-200}, {1e-200, 1e-200}) is
0.0 and CosAngle.value({1e200, 1e200}, {1e200, 1e200}) is Infinity; both are the cosine of a zero angle, 1.0. Upstream's
extreme-value test only pairs a tiny vector with a huge one, where the products stay representable.
'''

