[[bug]]
id = "commons-numbers/2"
title = "Complex.log and Complex.sqrt return infinity when one part is huge (above ~1e291) and the other subnormal"
kind = "wrong-result"
severity = "medium"
test = "logAndSqrtOfAHugeRealWithASubnormalImaginaryAreFinite"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Complex.log (Complex.java:1458-1471) rescales sub-normal parts by 2^54 to keep the modulus accurate, but the branch
runs after the `x > MAX_VALUE / 2` test was skipped, so for x in (~9.98e291, 8.99e307] with 0 < y < MIN_NORMAL the
scaled x overflows: Complex.ofCartesian(1e300, Double.MIN_VALUE).log() is (Infinity, 0.0) instead of (690.7755..., 0.0).
Complex.sqrt (:1672-1684) has the same shape in both orientations: ofCartesian(1e300, MIN_VALUE).sqrt() and
ofCartesian(MIN_VALUE, 1e300).sqrt() are (Infinity, 0.0). log10 shares log's code. The matched-magnitude extremes
(MAX/MAX, MIN_NORMAL/MIN_NORMAL) upstream tests use do not reach the shape.
'''

