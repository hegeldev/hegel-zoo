[[bug]]
id = "commons-numbers/5"
title = "Fraction arithmetic throws ArithmeticException for results that fit an int: gcd(MIN_VALUE, MIN_VALUE) inside add/multiply/divide, and a numerator overflow when the sign sits in the denominator"
kind = "wrong-exception"
severity = "medium"
test = "representableFractionResultsDoNotOverflow"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Fraction.addSub (Fraction.java:650), multiply(int) (:695), multiply(int, int) (:733-734) and divide(int) (:761) reduce
through ArithmeticUtils.gcd, which throws for gcd(MIN_VALUE, MIN_VALUE) = 2^31: Fraction.of(1, Integer.MIN_VALUE).multiply(Integer.MIN_VALUE)
(exactly 1), Fraction.of(Integer.MIN_VALUE, 3).divide(Integer.MIN_VALUE) (1/3), of(1, MIN_VALUE).add(of(1, MIN_VALUE))
and of(MIN_VALUE, 1).multiply(of(1, MIN_VALUE)) all throw "overflow: gcd(-2147483648, -2147483648) is 2^31". Separately,
Fraction keeps the sign in the denominator (of(219, -75) is 73/-25), so an intermediate numerator can overflow for a
representable value: Fraction.of(1, -1).add(Integer.MIN_VALUE + 1) throws "integer overflow" while Fraction.of(-1).add(Integer.MIN_VALUE + 1)
returns MIN_VALUE. The Javadoc promises ArithmeticException only "if the resulting numerator or denominator cannot be
represented in an int".
'''

