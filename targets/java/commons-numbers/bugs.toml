[[bug]]
id = "commons-numbers/17"
title = "Fraction.from and BigFraction.from(value, epsilon, maxIterations) return fractions farther than epsilon from the value when epsilon is below the ulp of the value"
kind = "contract"
severity = "low"
test = "fromHonoursAnEpsilonBelowTheUlpOfTheValue"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The convergence test `Math.abs(convergent - absValue) > epsilon` (Fraction.java:215, BigFraction.java:200) compares the
convergent p/q as a double with the value, so once epsilon is smaller than ulp(value) any convergent that rounds to the
same double is accepted: BigFraction.from(400000000.2, 1e-12, 100) returns 2000000001/5, which is 1.19e-8 from the double
400000000.19999998807907104 (a BigFraction can hold the exact dyadic value); BigFraction.from(6.0e-4, Double.MIN_VALUE, 100)
returns 23/36131. The Javadoc promises "The resulting fraction is within epsilon of value, in absolute terms"; for
Fraction the honest outcome is the documented failure to converge.
'''

