[[bug]]
id = "commons-numbers/7"
title = "Digamma and Trigamma miss their documented 1e-8 accuracy for negative arguments of large magnitude or close to a pole: the reflection evaluates tan/sin of the rounded product pi*x"
kind = "wrong-result"
severity = "medium"
test = "digammaAndTrigammaKeepTheirAccuracyForLargeNegativeArguments"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Digamma.java:73-77 computes PI / Math.tan(PI * x) and Trigamma.java:67-68 PI^2 / sin(PI * x)^2 from the double product
PI * x, whose rounding error grows with |x| (about 3.5e-16 |x|) and is not reduced. Digamma.value(-1e15 - 0.5) is 35.5425
(exact 34.5388, psi(1e15 + 1.5)); Trigamma.value(-1e15 - 0.5) is 10.877 (exact 9.8696, pi^2 - psi1(1e15 + 1.5));
Digamma.value(-1e12 - 0.5) is off by 8e-4. Near a pole the same residue dominates: at x = -29.999999999999996 the
Trigamma result 1e28 is 30% off and Digamma 10% off (exact -1/(x + 30) and 1/(x + 30)^2). The Javadoc of both promises
1e-8 relative or absolute accuracy without restricting the domain. The properties keep clear of x < 0 with |x| > 1e5 or
within 1e-6 max(1, |x|) of an integer.
'''

