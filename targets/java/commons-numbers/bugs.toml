[[bug]]
id = "commons-numbers/10"
title = "Reduce returns values outside its documented interval [0, |period|): the period itself for tiny negative inputs and negative values for large ones"
kind = "wrong-result"
severity = "medium"
test = "reduceStaysInsideItsInterval"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Reduce.applyAsDouble (Reduce.java:49) is the naive `xMo - period * Math.floor(xMo / period)`. new Reduce(0, 2 pi).applyAsDouble(-1e-30)
returns 6.283185307179586 == 2 pi (the upper bound is documented exclusive), and for large |x| the cancellation in
`period * floor(...)` leaves values outside the interval: applyAsDouble(-4.181732926389338E12) is -4.8828125E-4 (about 1 in
20,000 inputs of that magnitude). Angle's Normalizer works around the first shape itself (Angle.java:318-327) but Reduce
is public API with the interval in its class Javadoc.
'''

