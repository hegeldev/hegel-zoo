fixed_in = ""
notes = '''
BigFraction's continued-fraction constructor (BigFraction.java:156) keeps Fraction's `if (a0 > OVERFLOW)` guard with
OVERFLOW = 2^31 and long convergents, although its parts are BigIntegers: BigFraction.from(1e10, 100) and
BigFraction.from(1e10, 1e-5, 100) throw FractionException "Overflow trying to convert 1.0E10 to fraction (10000000000/1)"
while BigFraction.from(1e10) (the exact conversion) returns 10000000000. The Javadoc documents ArithmeticException only
when "the continued fraction failed to converge".
'''

