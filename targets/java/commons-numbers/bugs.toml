[[bug]]
id = "commons-numbers/11"
title = "The Angle normalizers can return values below their lower bound for arguments of large magnitude"
kind = "wrong-result"
severity = "medium"
test = "normalizersRespectTheLowerBound"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Angle.Normalizer.applyAsDouble (Angle.java:318-327) corrects only the upper bound of the Reduce result (`normalized < hi ?
normalized : Math.max(lo, normalized - period)`), never the lower one, so the cancellation of bug 10 leaks through:
Angle.Rad.WITHIN_MINUS_PI_AND_PI.applyAsDouble(-2.809235633113163E13) is -3.145498903589793 < -pi, against the documented
output interval [lo, lo + 2 pi[. About 1 in 25,000 arguments around 1e13 rad are affected; WITHIN_0_AND_2PI, the Deg and
Turn normalizers and normalizer(lo) share the code.

2026-10-06 (weekly run 37296133806, anglesReduceIntoTheirIntervals): a second shape, an argument a subnormal step below
the lower bound. Reduce's quotient (a - lo) / period rounds to -0 for a period above 2, so the input comes back unchanged
(bug 10's tiny-negative shape, which the Normalizer's upper-bound correction does not cover) and the Normalizer returns it
below lo: Rad.normalizer(0.0).applyAsDouble(-Double.MIN_VALUE) and the Deg normalizer give -4.9E-324 (Turn's period 1
rounds the quotient to -4.9E-324 and lands on 0.0). The narrow property normalizersStayAboveTheLowerBoundForASubnormalStepBelowIt
draws it; the wide property is mapped intermittent.
'''

