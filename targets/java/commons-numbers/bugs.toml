# (CommonsNumbersPinsTest), which asserts the correct behaviour and fails while the bug exists.

[[bug]]
id = "commons-numbers/1"
title = "Fraction and BigFraction intValue()/longValue() truncate towards zero although their Javadoc promises the largest integer not larger than the fraction"
kind = "contract"
severity = "low"
test = "intValueIsTheFloor"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Fraction.java:537 returns `(int) doubleValue()` and :549 `(long) numerator / denominator`; BigFraction.java:649/:659 use
BigInteger.divide (truncating). All four carry the @return text "the largest int value that is not larger than this
fraction", i.e. the floor: Fraction.of(-7, 2).intValue() is -3, the floor is -4. Either the code or the four Javadoc
clauses are wrong; the pin asserts the documented floor (the summary line "Returns the whole number part" suggests the
truncation was intended, so upstream may prefer to fix the documentation).
'''

