[[bug]]
id = "commons-numbers/22"
title = "DD.longValue() returns -1 for -1 + lo (a positive low part), where the documented truncation towards zero gives 0"
kind = "wrong-result"
severity = "low"
test = "longValueOfMinusOnePlusALowPartIsZero"
found = { commit = "30078a2322ce4a958edbb509c60cc191669ac6e3", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DD.longValue() (DD.java:703-766) documents "rounds the value to the closest whole number in the direction of zero ...
(long) -2.75 => -2". For a double-double whose high part is -1.0 and whose low part is positive, a value in (-1, 0) such
as DD.ofSum(-1.0, 1e-20), it returns -1 (intValue() inherits it; bigDecimalValue() is -0.99999...). The code truncates
the high part (a = -1), adds the low part rounded towards zero against the sign of the high part (b = ceil(1e-20) = 1),
and guards the sum against overflow with (sum ^ a) >= 0; the sum 0 differs in sign from a = -1, so the guard takes the
sign change for an overflow and falls back to the high part. The mirrored value DD.ofSum(1.0, -1e-20) gives 0 and
DD.ofSum(-3.0, 1e-20) gives -2, both as documented; floor() and ceil() are right. Reproduced with jshell against the
1.4-SNAPSHOT jars; the three source files are unchanged at upstream HEAD (7 commits past the base). Found by
doubleDoubleArithmeticStaysWithinItsBounds once its draws spread over the interval (the G.in change of 2026-10-07);
the narrow property conversionsOfAValueJustAboveMinusOneTruncateToZero fails every run.
'''

[[bug]]
id = "commons-numbers/23"
title = "RegularizedBeta.derivative loses its range at small x: Infinity at or below 2^-1024 for every a and b, 0 or inaccurate where x^a underflows, NaN for both"
kind = "wrong-result"
severity = "low"
test = "betaDerivativeAtATinyXIsFinite"
found = { commit = "30078a2322ce4a958edbb509c60cc191669ac6e3", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
RegularizedBeta.derivative(x, a, b) = x^(a-1) (1-x)^(b-1) / B(a, b) is BoostBeta.ibetaDerivative (BoostBeta.java:171-213),
which, outside the a = 1 and b = 1 closed forms, calls ibetaPowerTerms(a, b, x, 1 - x, true, 1 / y) with y = (1 - x) x:
the power terms x^a (1-x)^b / B(a, b) are formed first and the division by (1 - x) x comes as a prefix, so at small x
the result loses its range three ways. (1) 1 / y overflows for x at or below 2^-1024 (about 5.6e-309) and the result
is Infinity for every a and b: derivative(2^-1030, 2, 2) is Infinity against the exact 6 x (1 - x) = 5.2e-310,
derivative(MIN_VALUE, 3, 1.5) and derivative(2^-1030, 0.5, 2) likewise, derivative(9.6e-310, 0.001, 2) is Infinity
where mpmath gives 5.1e305; for a = b = 10 and a = b = 316 it is already Infinity at 2^-1020 (exact 3e-2758 and 2e-96600).
(2) Where x^a is subnormal or underflows while x^(a-1) does not, the branch that takes pow((x cgh) / agh, a) gives an
inaccurate result or 0: derivative(2^-990, 1.1, 0.1) = 0 against 1.6e-31, derivative(2^-950, 1.1, 0.1) is 2e-9 off,
while derivative(2^-500, 1.1, 0.1) and derivative(2^-800, 1.5, 0.5) are exact to the ulp. (3) NaN when both happen
(derivative(2^-1030, 1.1, 0.1)). derivative(1e-308, 0.001, 2) just above the overflow threshold is 4.9e304, and the closed
forms are fine (derivative(2^-1030, 2, 1) = 1.7e-310). Boost's ibeta_derivative has the same structure. Reproduced with
jshell against the 1.4-SNAPSHOT jars and checked against mpmath; BoostBeta.java is unchanged at upstream HEAD. Found by
incompleteGammaAndBetaAgreeWithMpmath once G.in spread its draws (2026-10-07); the narrow property
betaDerivativeOfASubnormalXStaysFinite fails every run.
'''

[[bug]]
id = "commons-numbers/24"
title = "Complex.divide loses the bits of a subnormal-sized dividend when the divisor is below 1 (3% error for 3 MIN_VALUE / 6.7e-19)"
kind = "wrong-result"
severity = "low"
test = "divideOfATinyDividendIsAccurate"
found = { commit = "30078a2322ce4a958edbb509c60cc191669ac6e3", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-10-07" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Complex.divide (Complex.java:1101-1129) is the C99 G.5.1 listing: the divisor is scaled by 2^-ilogbw into [1, 2), the
quotient (ac + bd) / denom is formed at the dividend's own magnitude and then scaled by 2^ilogbw. When the dividend
has subnormal size and the divisor is below 1 (ilogbw < 0) the intermediate quotient is subnormal, so bits are lost
that the final, normal result still shows: (4e-320 + 0i) / (1e-200 + 0i) = 3.9996613370553115e-120 against the exact
3.9999554687307321e-120 (7e-5 relative), (0 + 3 MIN_VALUE i) / (0 + 6.6985425985086915e-19 i) = 2.2784756311113742e-305
against 2.2127155507732738e-305 (3%, which Java's own 1.5e-323 / 6.7e-19 gets right), (1e-310 + 2e-310 i) /
(3e-10 + 7e-10 i) 53 ulps-equivalent off; the same dividend over a divisor of magnitude 1 or more gives a subnormal
result whose rounding is legitimate. Scaling the dividend up as well (or forming the quotient after the scaling) would
keep the bits. Reproduced with jshell against the 1.4-SNAPSHOT jars; Complex.java is unchanged at upstream HEAD. Found by
arithmeticAndModulusAreAccurate once G.in spread its draws (2026-10-07; its 4 ulps-equivalent bound); the narrow
property divideOfATinyDividendBySmallDivisorIsAccurate fails every run.
'''

[[bug]]
