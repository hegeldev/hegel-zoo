[[bug]]
id = "commons-numbers/4"
title = "Complex.nthRoot(Integer.MIN_VALUE) returns an empty list"
kind = "contract"
severity = "low"
test = "nthRootOfIntegerMinValueIsRejected"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Complex.nthRoot (Complex.java:3150-3173) documents that only n == 0 throws IllegalArgumentException and that |n|
roots are returned; it loops to Math.abs(n), which is negative for Integer.MIN_VALUE, so Complex.ONE.nthRoot(Integer.MIN_VALUE)
is an empty list. A 2^31-element answer is not sensible either, so the pin asserts the documented exception for an
invalid n.
