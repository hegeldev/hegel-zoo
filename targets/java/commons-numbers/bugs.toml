[[bug]]
id = "commons-numbers/6"
title = "Digamma returns a large finite number at the negative integers instead of a pole"
kind = "wrong-result"
severity = "medium"
test = "digammaHasPolesAtTheNegativeIntegers"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Digamma.value (Digamma.java:73-77) reflects negative arguments with `digamma -= PI / Math.tan(PI * x)`; at a negative
integer Math.tan(PI * x) is a tiny non-zero rounding residue, so Digamma.value(-3) is -8.55e15, Digamma.value(-1) is
-2.57e16 and Digamma.value(-2) is finite too. Trigamma (Trigamma.java:63-65) checks for the poles explicitly and returns
+Infinity; Digamma should return NaN or an infinity, and the documented 1e-8 accuracy cannot hold for a finite answer.
'''

