[[bug]]
id = "commons-numbers/15"
title = "BigFraction.from(double, epsilon, maxIterations) and from(double, maxDenominator) refuse any |value| above 2^31 with an overflow exception"
kind = "wrong-exception"
severity = "medium"
test = "bigFractionApproximationsAcceptValuesBeyondTheIntRange"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
