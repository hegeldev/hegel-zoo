[[bug]]
id = "commons-numbers/8"
title = "Combinations.comparator() computes a lexicographic norm sum(c[i] n^i) in long arithmetic: it throws ArithmeticException for large n and can return a wrong sign before it overflows"
kind = "crash"
severity = "medium"
test = "combinationsComparatorOrdersLargeUniverses"
found = { commit = "a2e57b960e2aa300da674a1e4178df0ba390186b", version = "1.4-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Combinations.LexicographicComparator.lexNorm (Combinations.java:373) does `ret += c[i] * ArithmeticUtils.pow((long) n, i)`:
ArithmeticUtils.pow throws "long overflow" once n^i exceeds a long (Combinations.of(100000, 5).comparator().compare([0,1,2,3,4], [0,1,2,3,5])),
an exception the Javadoc (:325-328, IllegalArgumentException only) does not mention, and the multiplication and the running
sum are unchecked, so for n^i just below 2^63 the comparator can silently order arrays wrongly. A lexicographic comparison
from the last element down needs no norm at all.
'''

