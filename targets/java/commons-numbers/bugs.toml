notes = '''
Fraction.java:309 (and BigFraction.java:330) tests `if (epsilon >= 0)`, so Fraction.from(0.5, 0.0, 10) returns 1/2
while the @throws clause (:295-296) says "epsilon is not positive"; the exception for a negative epsilon reads
"Epsilon must be positive: " + maxIterations (Fraction.java:312, BigFraction.java:333): Fraction.from(0.5, -1.0, 7) reports
"Epsilon must be positive: 7".
'''

