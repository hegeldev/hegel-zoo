name = "caffeine"
language = "java"
upstream = "https://github.com/ben-manes/caffeine"
subdir = ""
license = "Apache-2.0"
# CONTRIBUTING.md asks contributors to sign a CLA (upstream contributions only; the zoo patches its pinned tree);
# .claude/CLAUDE.md, AGENTS.md and .github/copilot-instructions.md are agent guidance with no prohibition on
# analysis or testing; they ask that lossy/best-effort semantics (read-buffer drops, approximate frequencies,
# maintenance timing, best-effort statistics) not be reported as defects, and .claude/docs/ruled-out.md lists
# the standing rulings — the properties and bugs.toml respect both (see README.md).
ai_policy_checked = "2026-09-16"

[base]
commit = "09f5ed51cf738ecbd1bf1055bff4d4428e755c63"
date = "2026-09-15"
version = "3.3.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Nothing to install: upstream builds with Gradle and generates its Node/LocalCache specialisations at build time,
# so hegel/pom.xml is a two-module reactor — hegel/codegen compiles caffeine/src/javaPoet and runs the two
# generators, hegel/tests compiles caffeine/src/main/java (minus module-info.java) plus the generated sources as
# its own main sources and runs the properties against them.
setup = []

[expected_failures]
schedulerIgnoresARejectedSubmission = "caffeine/1"
