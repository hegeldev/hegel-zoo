# Bugs found in Caffeine by the Hegel properties (see README.md). Each is pinned by the test named in `test`
# (CaffeinePinsTest), which asserts the documented behaviour and fails while the bug exists.

[[bug]]
id = "caffeine/1"
title = "Scheduler.forScheduledExecutorService propagates a RejectedExecutionException although its Javadoc promises to ignore a rejected submission"
kind = "contract"
severity = "low"
test = "schedulerIgnoresARejectedSubmission"
found = { commit = "09f5ed51cf738ecbd1bf1055bff4d4428e755c63", version = "3.3.0-SNAPSHOT", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Scheduler.java:73-76 documents the factory: "this implementation will ignore scheduling the task if the executor was
shutdown or the submission was rejected". ExecutorServiceScheduler.schedule (Scheduler.java:118-137) handles only the
first clause (`isShutdown()` -> DisabledFuture) and calls `scheduledExecutorService.schedule(...)` unguarded, so a
ScheduledExecutorService that rejects (a saturated bounded pool, a custom policy) throws RejectedExecutionException out
of Scheduler.schedule. Inside a cache the exception is masked because Caffeine.getScheduler wraps every custom
scheduler in GuardedScheduler (Scheduler.java:150-159), which catches and returns a disabled future; the public factory
on its own does not honour its documentation. Either the catch belongs in ExecutorServiceScheduler or the Javadoc
should drop "or the submission was rejected".
'''

