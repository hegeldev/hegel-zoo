[[bug]]
id = "commons-collections/4"
title = "Putting through a DualTreeBidiMap sub-map view a value that is mapped outside the view breaks the map's value uniqueness"
kind = "wrong-result"
severity = "medium"
test = "pin_dualTreeBidiMapViewPutKeepsValuesUnique"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`DualTreeBidiMap.headMap/tailMap/subMap` return a `ViewMap` built as `new DualTreeBidiMap(subMap, bidi.reverseMap, ...)`:
the forward map is the range view of the parent's `TreeMap` but the reverse map is the parent's *whole* reverse map (the
source comment says "the implementation is not great here"). `put(key, value)` removes the key currently holding `value`
with `normalMap.remove(reverseMap.get(value))` - on the view's *range* map, which does not contain that key when it lies
outside the range - and then overwrites `reverseMap.put(value, key)`. With {1=a, 3=c, 5=e}, `headMap(4).put(2, "e")`
leaves the parent as {1=a, 2=e, 3=c, 5=e}: the value `e` twice, `inverseBidiMap()` = {a=1, c=3, e=2} of size 3 against
size 4, `getKey("e")` = 2 while 5 still maps to `e`. `tailMap(4).put(6, "a")` does the same to {1=a, ...}. A `BidiMap`
promises a one-to-one mapping; the view should remove the old key from the parent (or refuse the put).
"""

