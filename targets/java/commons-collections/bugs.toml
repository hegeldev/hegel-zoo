[[bug]]
id = "commons-collections/10"
title = "PatriciaTrie.lastKey() throws NoSuchElementException when the only key is the empty string"
kind = "crash"
severity = "low"
test = "pin_trieLastKeyWithOnlyTheEmptyKey"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The empty string has zero bits and is stored in the root node itself. `lastEntry()` is `followRight(root.left)`, and
`followRight` returns null when `node.right == null`, which is the root's state while it is the only entry; so after
`put("", 1)` the trie has `size() == 1`, `firstKey()` is "", `keySet()` is [""], but `lastKey()` throws
`NoSuchElementException` ("if this map is empty" per the Javadoc). Adding any other key makes `lastKey()` work again.
`lastEntry()` should fall back to the root when it holds a key and has no right subtree.
"""

