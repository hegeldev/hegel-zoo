[[bug]]
id = "commons-collections/9"
title = "headMap(x).lastKey() of an empty PatriciaTrie returns null instead of throwing NoSuchElementException"
kind = "wrong-result"
severity = "low"
test = "pin_emptyTrieHeadMapLastKey"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`AbstractPatriciaTrie.floorEntry`/`lowerEntry` were rewritten (after 4.5.0) as linear walks; in the branch taken when the
key's bit at the differing index is set, `floor`/`lower` starts as the entry `getNearestEntryForKey` returned, which on an
empty trie is the empty root (key null), and the `isEmpty()` guard present in the other branch is missing. `RangeEntryMap.lastKey`
then takes the root's null key, and since `headMap` has no `fromKey` the range check that would catch it does not run:
`new PatriciaTrie<>().headMap("x").lastKey()` returns null where `SortedMap` requires `NoSuchElementException` (`firstKey()`
and `tailMap("x").lastKey()` throw correctly, as does `TreeMap`).
"""

