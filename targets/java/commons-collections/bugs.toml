[[bug]]
id = "commons-collections/5"
title = "MultiKeyMap's multi-key get and put bypass the decorated LRUMap's recency, so the headline MultiKeyMap-over-LRUMap evicts the wrong key"
kind = "wrong-result"
severity = "low"
test = "pin_multiKeyMapOverLruMapRecency"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
The class Javadoc's example is `MultiKeyMap.multiKeyMap(new LRUMap(50))`. `get(k1, k2)` (and the 3-5 key overloads)
walks the decorated `AbstractHashedMap`'s bucket chain directly and returns the value without calling the decorated map's
`get`, so `LRUMap.moveToMRU` never runs; `put(k1, k2, v)` on an existing key calls `updateEntry` (which LRUMap does move),
but `get` is the common access. With `LRUMap(2)`: `put("a","b",1)`, `put("c","d",2)`, `get("a","b")`, `put("e","f",3)`
evicts `(a, b)` - the most recently used key - and keeps `(c, d)`; the same sequence through `get(new MultiKey("a","b"))`
evicts `(c, d)` as an LRU cache should. The multi-key accessors should go through the decorated map's `get` (or move the
entry themselves).
"""

