[[bug]]
id = "commons-collections/6"
title = "ArrayCountingBloomFilter.clear() does not return the filter to a valid state after an underflow or overflow"
kind = "wrong-result"
severity = "low"
test = "pin_countingBloomFilterClearResetsValidity"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`BloomFilter.clear()` is "Resets the filter to its initial, unpopulated state". `ArrayCountingBloomFilter` records
invalidity in a `state` field (the OR of every updated cell; negative after a subtraction below zero or an addition past
`Integer.MAX_VALUE`), and `clear()` only does `Arrays.fill(cells, 0)`. After `merge({1,2,3})`, `remove({1})`, `remove({1})`
the filter is invalid (as documented); after `clear()` all cells are zero but `isValid()` is still false and every later
`merge`/`add` returns false for ever, although the filter's cells are exactly those of a new filter. `copy()` copies the
stale state too. `clear()` should reset `state` to 0.
"""

