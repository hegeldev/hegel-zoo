[[bug]]
id = "commons-collections/2"
title = "Dual bidi maps: setValue of the value an entry already has throws IllegalArgumentException once the key was re-put with an equal but distinct key object"
kind = "wrong-result"
severity = "low"
test = "pin_dualBidiMapSetValueSameValue"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`AbstractDualBidiMap.MapEntry.setValue` and `BidiMapIterator.setValue` (also `DualTreeBidiMap.BidiOrderedMapIterator.setValue`)
guard with `parent.reverseMap.containsKey(value) && parent.reverseMap.get(value) != last.getKey()` - a reference comparison.
The forward `HashMap` keeps the *first* key object when a key is put again, while the reverse map receives the *new* key
object, so after `put(Integer.valueOf(1000), "v1")` and `put(Integer.valueOf(1000), "v2")` the entry's key and the reverse
map's key are equal but not identical, and `entry.setValue("v2")` (setting the value the entry already has, which the
Javadoc allows) throws "Cannot use setValue() when the object being set is already in the map". The comparison should use
`equals`. Integers up to 127 are cached and hide the problem; larger integers, strings built at runtime and any other
value-equal keys show it.
"""

