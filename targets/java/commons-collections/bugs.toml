[[bug]]
id = "commons-collections/11"
title = "Sub-maps of a PatriciaTrie prefix view (prefixMap(p).headMap/tailMap/subMap) include entries outside the prefix"
kind = "wrong-result"
severity = "medium"
test = "pin_prefixMapSubViews"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`PrefixRangeMap.createRangeMap` builds a plain `RangeEntryMap` from `getFromKey()`/`getToKey()`, which are only filled by
`fixup()` and then hold the entries *next to* the prefix range (the one before the first prefixed key and the one after the
last). `AbstractRangeMap.headMap/tailMap/subMap` do not call `fixup()` first, and `RangeEntrySet.iterator()` uses
`ceilingEntry(fromKey)`, which includes `fromKey`. With {a, pa, pb, pc, z}: `prefixMap("p").headMap("pc")` is {a, pa, pb}
(should be {pa, pb}) and `prefixMap("p").tailMap("pb")` is {pb, pc, z} (should be {pb, pc}); after a `size()` call (which runs
`fixup`) the tail view is right but the head view still includes `a`. A `TreeMap` restricted to the same prefix range
gives {pa, pb}. `subMap` within the prefix happens to be right because both bounds are given.
"""

