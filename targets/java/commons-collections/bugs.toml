[[bug]]
id = "commons-collections/3"
title = "DualTreeBidiMap.previousKey finds the greatest lower key for an absent key while nextKey returns null"
kind = "inconsistent"
severity = "low"
test = "pin_dualTreeBidiMapPreviousKeyOfAbsentKey"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`OrderedMap.nextKey`/`previousKey` are documented as "the next/previous key, null if no match or at end". `DualTreeBidiMap.nextKey`
starts with `if (!normalMap.containsKey(key)) return null` (so for {1, 3, 5} `nextKey(2)` is null, like `TreeBidiMap` and
`PatriciaTrie`), but `previousKey` has no such guard and returns `headMap(key).lastKey()`: `previousKey(4)` is 3. The two
methods of one class disagree on what an absent key means, and `previousKey` disagrees with `TreeBidiMap.previousKey`,
which returns null for both.
"""

