[[bug]]
id = "commons-collections/13"
title = "After remove(), PatriciaTrie's map iterator reports a previous entry and previous() returns a null key"
kind = "wrong-result"
severity = "low"
test = "pin_trieMapIteratorPreviousAfterRemove"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`TrieMapIterator` keeps a `previous` node; `AbstractTrieIterator.remove()` clears `current` but not `previous`, and
`removeEntry` ends by nulling the removed node's key and value (`setKeyValue(null, null)`). After `next()`, `next()`,
`remove()` on {a, b, c} the iterator's `hasPrevious()` is true and `previous()` returns null (the recycled node's key)
instead of "a"; `hasNext()` is then false, so the element `a` is never reachable backwards. An `OrderedMapIterator` should
step back to the entry before the removed one.
"""

