[[bug]]
id = "commons-collections/12"
title = "Emptying a PatriciaTrie prefix view through its entry iterator throws NullPointerException"
kind = "crash"
severity = "low"
test = "pin_prefixViewIteratorRemoveToEmpty"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`PrefixRangeEntrySet.EntryIterator.remove()` re-locates the prefix subtree after a removal (`subtree = subtree(prefix, ...)`)
and then reads `subtree.bitIndex`; `subtree(...)` returns null once no key with the prefix is left. With {a, pa, pb, z},
iterating `prefixMap("p").entrySet()` and removing every entry throws `NullPointerException: Cannot read field "bitIndex"
because "this.subtree" is null` on the second `remove()`. Removing all but one entry works, as does `prefixMap("p").clear()`.
The same code is in 4.5.0.
"""

