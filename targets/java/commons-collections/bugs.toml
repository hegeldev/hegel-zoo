# Bugs found in Apache Commons Collections by the Hegel zoo. Pins: hegel/src/test/java/zoo/CommonsCollectionsPinsTest.java.

[[bug]]
id = "commons-collections/1"
title = "A null key that enters an LRUMap through an eviction is unreachable: get, containsKey and remove miss it, and a second put(null) adds a second null entry"
kind = "wrong-result"
severity = "medium"
test = "pin_lruMapNullKeyAfterEviction"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`AbstractHashedMap` stores null keys as the `NULL` sentinel (`convertKey`) and compares with `isEqualKey(convertedKey,
entry.key)`. `LRUMap.addMapping` reuses the least-recently-used entry when the map is full (`reuseMapping` ->
`AbstractHashedMap.reuseEntry`), and `reuseEntry` writes the *raw* key into the entry (`entry.key = key`), not the
converted one; `createEntry`, used on the non-full path, stores `convertKey(key)`. So `new LRUMap<>(2)` after `put("a", 1)`,
`put("b", 2)`, `put(null, 3)` shows `[b, null]` in `keySet()` but `get(null)` is null, `containsKey(null)` false,
`remove(null)` null; a further `put(null, 4)` creates a second entry, `{null=3, null=4}`. Null keys are otherwise
supported by `LRUMap` (a `put(null, v)` into a map that is not full works). `LRUMap` is the only caller of `reuseEntry`; a
subclass overriding `convertKey` (as `CaseInsensitiveMap` does) would be affected the same way.
"""

