[[bug]]
id = "commons-collections/7"
title = "LayeredBloomFilter.uniqueIndices() repeats the indices held by several layers, out of order"
kind = "wrong-result"
severity = "low"
test = "pin_layeredBloomFilterUniqueIndices"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`IndexExtractor.uniqueIndices()` is documented to return the extractor's indices "without duplicates" in ascending order;
`BloomFilter` overrides it to `return this` with the comment "Most Bloom filters create unique IndexExtractors".
`LayeredBloomFilter.processIndices` runs every layer's `processIndices` in turn and does not override `uniqueIndices()`, so
with two layers {5, 9} and {5, 7} (`advanceOnPopulated`), `uniqueIndices().asIndexArray()` is `[5, 9, 5, 7]` while
`cardinality()` is 3. `CountingBloomFilter.merge(IndexExtractor)` relies on `uniqueIndices()` to count each index once
(`CellExtractor.from` happens to re-aggregate, so that path survives); any other consumer of `uniqueIndices()` sees
duplicates. The layered filter should filter through a `BitSet` (the interface default) or flatten first.
"""

