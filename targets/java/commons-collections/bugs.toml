[[bug]]
id = "commons-collections/14"
title = "After any removal, putting the empty key into a PatriciaTrie hides every other entry from iteration while size() and get() still see them"
kind = "wrong-result"
severity = "medium"
test = "pin_trieIterationAfterRemovalAndEmptyKey"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`put("b", 1)`, `put("a", 2)`, `remove("b")` (through `remove`, `keySet().remove` or an iterator alike), `put("", 0)`: the
trie reports `size() == 2` and `get("a") == 2`, but `keySet()` iterates only `[""]`, `values()` only `[0]`, `entrySet()`,
`toString()`, `equals`, the map iterator and serialization (which writes the iterated entries) all see one entry. With three
keys and one removal the two survivors vanish the same way. Without a prior removal (`put("a")` then `put("")`, or the
reverse) iteration is right, and `remove("b")` followed by `put("c")` instead of `put("")` is right too. The empty key
lives in the root node; `removeInternalEntry` reuses/relinks nodes and apparently leaves the root's own subtree link in a
state that `nextEntry(root)` (used once the root holds a key) no longer follows. The data is in the tree - only the
traversal from the root is broken - so a `TreeMap` twin sees the difference on the next iteration.
"""

