[[bug]]
id = "commons-collections/8"
title = "EnhancedDoubleHasher produces indices outside the filter for a one-bit shape with four or more hash functions, so every merge throws"
kind = "crash"
severity = "low"
test = "pin_enhancedDoubleHasherOneBitShape"
found = { commit = "21d6821190e0325022510393f41faa8ec95b6397", version = "4.6.1-SNAPSHOT (after 4.5.0, 2026-09-07)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = """
`Shape.fromKM(k, 1)` is a legal shape. In `EnhancedDoubleHasher.indices(shape).processIndices`, the `k >= bits` branch keeps
a tetrahedral counter `tet` that starts at 1 and is reset with `if (++tet == bits) tet = 0`; with `bits == 1` the
increment goes 2, 3, ... and the test never holds, so `inc -= tet` leaves `inc` negative once the single `+= bits` correction
is spent and the index grows: for `Shape[k=4 m=1]` every hasher yields `[0, 0, 0, 1]`, for `k=12` `[0, 0, 0, 1, 4, 10, 20,
35, 56, 84, 120, 165]`. `SimpleBloomFilter.merge(hasher)` then throws `IllegalArgumentException: IndexExtractor should only
send values in the range[0,1)` (and `ArrayCountingBloomFilter` "Filter only accepts values in the [0,1) range"), so a
one-bit filter with k >= 4 cannot be populated at all; for `k <= 3` the indices are all 0. Shapes with two or more bits are
fine (checked for m in 2..6, k in 1..12). The counter should be reduced modulo `bits` (or `tet` reset when `bits == 1`).
"""

