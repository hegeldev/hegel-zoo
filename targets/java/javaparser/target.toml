name = "javaparser"
language = "java"
upstream = "https://github.com/javaparser/javaparser"
subdir = ""
license = "Apache-2.0 OR LGPL-3.0-or-later"
ai_policy_checked = "2026-09-16" # CONTRIBUTING.md asks for tests with pull requests and the coding guidelines; nothing about AI; no CLAUDE.md/AGENTS.md/copilot-instructions

[base]
commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e"
date = "2026-09-15"
version = "3.29.0-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# javaparser-core (and the generators it needs) from the pinned tree into the local Maven repository; the tests then
# depend on com.github.javaparser:javaparser-core:3.29.0-SNAPSHOT
setup = ["mvn -q -B -ntp -pl javaparser-core -am -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dgpg.skip=true install"]

