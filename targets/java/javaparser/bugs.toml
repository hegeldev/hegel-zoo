[[bug]]
id = "javaparser/16"
title = "The type of a parsed `TypePatternExpr`/`RecordPatternExpr` in `instanceof` is not the pattern's child: its parent is the `InstanceOfExpr`, `getChildNodes()`/`walk()` miss it and `clone()` differs"
kind = "contract"
severity = "medium"
test = "pin_patternTypeIsChildOfPattern"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
After parsing `o instanceof Bar b`, `pattern.getType().getParentNode()` is the `InstanceOfExpr` and
`pattern.getChildNodes()` is `[b]`; a `clone()` of the unit has two more nodes than the original, because the
clone's pattern owns its type as the metamodel says. Comments attached to the type
(`instanceof final /* c */ Bar b`) are lost by `clone()`, and `walk()` from the pattern never reaches the
type. Patterns in `switch` labels are fine; the grammar's `instanceof` production builds the pattern from a
type it has already attached to the InstanceOfExpr. Found by `cloneEqualsLaws`.
'''

