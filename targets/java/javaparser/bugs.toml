[[bug]]
id = "javaparser/17"
title = "A method reference on a primary cannot be a first operand: `this::m ? 1 : 2` and `this::m * x` are parse errors"
kind = "contract"
severity = "low"
test = "pin_methodReferenceAsOperand"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 15.8/15.13 make a MethodReference a Primary, so it may syntactically stand anywhere a primary may (javac
parses these and rejects them later with "method reference not expected here"). The grammar only accepts a
method reference where an expression ends, so `this::m ? 1 : 2` fails with `Parse error. Found "?"`. Such
programs never type-check, hence low. Found by `agreesWithJavac`. Only a method reference on a primary
(`this`, `Foo.this`, `(e)`, `m()`, `new Foo()`, a literal, `a[i]`) as the first operand is rejected; one on a type
or a name (`Foo::m * x`) parses, and one after an operator (`x * this::m`) is accepted with the wrong scope, which is
bug 23 (the title used to call it a parse error).
'''

