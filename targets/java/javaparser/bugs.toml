[[bug]]
id = "javaparser/23"
title = "A method reference on a primary after a binary operator takes the whole left expression as its scope: `x * this::m` parses as `(x * this)::m`"
kind = "wrong-result"
severity = "low"
test = "pin_methodReferenceAfterOperatorScope"
found = { commit = "98c8b8c43e7a2e6a83e744aa54f245716e0f349c", version = "3.29.0-SNAPSHOT (2026-09-18)", hegel = "0.6.0", date = "2026-09-25" }
status = "open"
notes = '''
JLS 15.13 derives a MethodReference from a Primary, so in `x * this::m` the `::m` belongs to `this` and javac's
parser gives `x * (this::m)` (attribution then rejects it, "method reference not expected here"; no well-typed
program has the shape, hence low). JavaParser accepts the text and returns a `MethodReferenceExpr` whose scope
is the `BinaryExpr` `x * this`: the grammar only takes `::` where an expression ends, so it closes the binary
expression first. `a == this::m` is `(a == this)::m` the same way; with a type or name on the left of `::`
(`x * Foo::m`) the tree is right, and with the method reference as the first operand (`this::m * a`) the text is
rejected (bug 17). The same happens after every binary operator, after a unary prefix operator (`-this::m` is
`(-this)::m`) and after a cast (`(Foo) this::m` is `((Foo) this)::m`), for every primary before `::` (`this`,
`Foo.this`, a parenthesised expression, a method call, `new Foo()`, every literal, an array access, a field access,
a class literal); `super::m`, a type, a name and an annotated or parameterised type before `::` are right, and so
are the branches of `?:`, arguments and assignment right sides. In java.jj only PrimaryPrefix looks ahead for
`AnnotatedType() "::"` and `super ::`; every other `::` is the trailing alternative of Expression(), taken once
the whole expression is closed. Followed by another operator (`x * this::m * y`) the text is rejected, as in bug 17.
Found while unsteering the generators: bug 17's title had claimed `x * this::m` was a parse error; a standalone
probe of the pinned commit showed the wrong tree instead, and the narrow property shrinks to
`class Foo { int a=a== this::m; }`.
'''
