[[bug]]
id = "javaparser/7"
title = "`TextBlockLiteralExpr.asString()` counts white space after the opening delimiter as a content line: `\"\"\"  ⏎x⏎\"\"\"` gives `\"\\nx\\n\"`"
kind = "wrong-result"
severity = "low"
test = "pin_textBlockOpeningLineTrailingSpace"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 3.10.6: the opening delimiter is """ followed by optional white space and a line terminator; the content
starts after the terminator. `TextBlockLiteralExpr.stripIndent()`/`asString()` keeps the white space after the
delimiter as a first (blank) line, so the value gains a leading `\n` (`""" ⏎"""` gives `\n` where Java gives
the empty string). Found by `agreesWithJavac`.
'''

