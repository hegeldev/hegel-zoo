[[bug]]
id = "javaparser/9"
title = "The pretty printer prints a unary `-`/`+` applied to a unary `-`/`+` without a space: `- -x` becomes `--x`"
kind = "wrong-result"
severity = "high"
test = "pin_nestedUnaryPrinting"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`int a = - -x;` parses as MINUS(MINUS(x)); `DefaultPrettyPrinterVisitor.visit(UnaryExpr)` writes the operator
and then the operand with nothing between them, so `toString()` gives `--x` — a pre-decrement, a different
program (and `+ ++x` prints as `+++x`). `~ ~x` and `! !x` are harmless since `~~` and `!!` are not operators.
`ConcreteSyntaxModel` prints the same. Found by `prettyPrintRoundTrip` and `fragmentParsersAgree`.
'''

