[[bug]]
id = "javaparser/19"
title = "`import static x;` and `permits Foo<T>` are accepted although the grammar requires a qualified name and type names without arguments"
kind = "contract"
severity = "low"
test = "pin_rejectsUnqualifiedStaticImportAndPermitsTypeArguments"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 7.5.3: `import static TypeName . Identifier ;` — a static import needs a dot; JLS 8.1.6: `permits TypeName
{, TypeName}` — no type arguments. Both are parsed without a problem (the `permits` list is read as
ClassOrInterfaceTypes) while javac rejects them (`'.' expected`, `'{' expected`). Found by `mutationsNeverCrash`
and by the generator's early versions.
'''

