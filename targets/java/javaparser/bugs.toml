# Bugs found in JavaParser by the zoo's Hegel tests. Every entry has a `pin_…` test in
# hegel/src/test/java/zoo/JavaParserPinsTest.java that asserts the JLS behaviour (or JavaParser's own documented
# behaviour) and fails while the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "javaparser/1"
title = "A cast lambda cannot be the operand of a binary operator: `(Runnable) () -> {} == r` is a parse error"
kind = "contract"
severity = "medium"
test = "pin_castLambdaAsOperand"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 15.16 makes `( ReferenceType ) LambdaExpression` a CastExpression, which is a UnaryExpressionNotPlusMinus
and so an operand of every binary operator; `boolean b = (Runnable) () -> {} == r;` compiles with javac. The
grammar (`java.jj`, the lambda branch of the cast production) parses the cast lambda and then expects the end of
the expression, so `==`, `>=`, `&`, `>>>`… after the lambda's block fail with `Parse error. Found "=="` (or,
in other contexts, "Failed to parse lambda expression! Please create an issue …"). Found by `agreesWithJavac`.
'''

[[bug]]
id = "javaparser/2"
title = "`var` lambda parameters are rejected inside a variable initializer: `Function<A,B> f = (var x) -> x;` gives `\"var\" is not allowed here.`"
kind = "contract"
severity = "medium"
test = "pin_varLambdaParameterInInitializer"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`VarValidator` (ast/validator/language_level_validations/chunks/VarValidator.java) looks for the nearest
`VariableDeclarator` ancestor of every `VarType`; for a lambda parameter inside a field or local variable
initializer it finds the *field's* declarator, then complains that the declarator's parent is not a
`VariableDeclarationExpr` (fields) or that the declaration has several variables or an array type
(`double[] d = …(var x) -> …` even reports `"var" cannot have extra array brackets.`). Only lambdas that
are not under any declarator (`f((var x) -> x)`, `x = (var y) -> y`) are accepted. Java 11 allows `var`
lambda parameters anywhere. Found by `agreesWithJavac`.
'''

[[bug]]
id = "javaparser/3"
title = "Local enum declarations are not parsed: `void m() { enum E { X } }` fails with `Parse error. Found \"{\"`"
kind = "contract"
severity = "medium"
test = "pin_localEnum"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
Java 16 (JEP 395) allows local enums, records and interfaces in a block. The grammar's block-statement
production knows `class`, `interface` (both work) and `record` (`LocalRecordDeclarationStmt`) but not `enum`, so
`enum E { X }` inside a method is taken for a local variable declaration of type `enum`. javac parses and
compiles it. Found by `agreesWithJavac`.
'''

[[bug]]
id = "javaparser/4"
title = "A Unicode-escaped backslash starting an escape sequence in a char literal is a lexical error: `'\\u005c\\u0027'`"
kind = "contract"
severity = "low"
test = "pin_unicodeEscapedBackslashInCharLiteral"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 3.3 translates Unicode escapes before tokenising, and the resulting `\` may start an escape sequence (JLS
3.10.7): `'\u005c\u0027'` is `'\''`. The token manager's character-literal production, after the
`UnicodeEscapeProcessingProvider` has replaced `\u005c` by a backslash, does not accept a following `\u0027`
and fails with `Lexical error … Encountered: "2" … after : "'\\u005c\\u00"`. The string form
`"\u005c\u0022"` tokenises (but see javaparser/6). javac accepts the literal. Found by `agreesWithJavac`
and `mutationsNeverCrash`.
'''

[[bug]]
id = "javaparser/5"
title = "`StringLiteralExpr.asString()` and `CharLiteralExpr.asChar()` turn the `\\s` escape into `s` instead of a space"
kind = "wrong-result"
severity = "medium"
test = "pin_spaceEscape"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`\s` (JLS 3.10.7, Java 15) is the space character; `"a\sb"` is `a b`. `StringEscapeUtils.unescapeJava`
(utils/StringEscapeUtils.java), used by the `LiteralStringValueExpr` subclasses, knows `\n \t \b \r \f \0-\377 \' \"
\\` and Unicode escapes but not `\s`, and its fallback drops the backslash, so the value gains an `s` where the
source has a space. Text blocks are not affected (`"""  a\s  """` gives `a `): their path translates `\s`
itself. Found by `agreesWithJavac` (comparing literal values with javac's).
'''

[[bug]]
id = "javaparser/6"
title = "`StringLiteralExpr.asString()` does not let a Unicode-escaped backslash start an escape sequence: `\"\\u005c\\u0022\"` gives `\\\"`"
kind = "wrong-result"
severity = "low"
test = "pin_unicodeEscapedBackslashInString"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
Java's value of `"\u005c\u0022"` is a lone `"` and of `"\u005c\u005c"` a lone `\` (JLS 3.3: Unicode escapes are
translated first, and the resulting `\` starts an escape sequence). `asString()` translates `\u005c` to a
backslash but then treats it as a literal backslash, giving `\"` and `\\`. Found by `agreesWithJavac`.
'''

[[bug]]
id = "javaparser/7"
title = "`TextBlockLiteralExpr.asString()` counts white space after the opening delimiter as a content line: `\"\"\"  ⏎x⏎\"\"\"` gives `\"\\nx\\n\"`"
kind = "wrong-result"
severity = "low"
test = "pin_textBlockOpeningLineTrailingSpace"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 3.10.6: the opening delimiter is """ followed by optional white space and a line terminator; the content
starts after the terminator. `TextBlockLiteralExpr.stripIndent()`/`asString()` keeps the white space after the
delimiter as a first (blank) line, so the value gains a leading `\n` (`""" ⏎"""` gives `\n` where Java gives
the empty string). Found by `agreesWithJavac`.
'''

[[bug]]
id = "javaparser/8"
title = "A form feed inside a text block is treated as a line terminator by `asString()` and by the printer"
kind = "wrong-result"
severity = "low"
test = "pin_textBlockFormFeed"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 3.4 line terminators are CR, LF and CRLF; a form feed is white space (JLS 3.6). `"""⏎x\f⏎y⏎"""` is
`x\ny\n` in Java. `TextBlockLiteralExpr.stripIndent()` splits the raw text with a pattern that matches the
form feed (`\R`/`\v`-style), so `asString()` gives `x\n\ny\n`, and `DefaultPrettyPrinterVisitor` re-indents the
block line by line with the same split, printing the form feed as a new line — the printed program has a
different value (`prettyPrintRoundTrip` saw the value change; `agreesWithJavac` the `asString()` difference).
'''

[[bug]]
id = "javaparser/9"
title = "The pretty printer prints a unary `-`/`+` applied to a unary `-`/`+` without a space: `- -x` becomes `--x`"
kind = "wrong-result"
severity = "high"
test = "pin_nestedUnaryPrinting"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`int a = - -x;` parses as MINUS(MINUS(x)); `DefaultPrettyPrinterVisitor.visit(UnaryExpr)` writes the operator
and then the operand with nothing between them, so `toString()` gives `--x` — a pre-decrement, a different
program (and `+ ++x` prints as `+++x`). `~ ~x` and `! !x` are harmless since `~~` and `!!` are not operators.
`ConcreteSyntaxModel` prints the same. Found by `prettyPrintRoundTrip` and `fragmentParsersAgree`.
'''

[[bug]]
id = "javaparser/10"
title = "`LexicalPreservingPrinter` prints a method with legacy array dimensions after the parameters, `int m()[]`, as `int ()[]m`"
kind = "wrong-result"
severity = "medium"
test = "pin_lexicalPreservationMethodDims"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`int m()[] { … }` (JLS 8.4: `MethodDeclarator: Identifier ( … ) [Dims]`, deprecated but valid) parses to a method
of type `int[]`; the lexical-preserving printer re-orders the tokens and emits `int ()[]m { … }`, which is not
Java. The default pretty printer prints `int[] m()`. Found by `lexicalPreservationIsIdentity`.
'''

[[bug]]
id = "javaparser/11"
title = "A `TypeParameter`'s range excludes its annotations: in `class A<@B T>` the annotation lies outside its parent's range"
kind = "wrong-result"
severity = "low"
test = "pin_typeParameterRangeIncludesAnnotations"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The `TypeParameter` node for `@B T` has range (col 12)–(col 12), the identifier only, while its child
`MarkerAnnotationExpr` has (col 9)–(col 10): a child outside its parent, which breaks range-based lookups
(`Range.contains`, position queries). The grammar's `TypeParameter` production takes the begin token after
the annotations. Found by `positionsAreConsistent`.
'''

[[bug]]
id = "javaparser/12"
title = "A `TypePatternExpr`'s range excludes its modifiers: in `o instanceof final Bar b` the `final` modifier lies outside its parent's range"
kind = "wrong-result"
severity = "low"
test = "pin_typePatternRangeIncludesModifier"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The pattern `final Bar b` gets the range of `Bar b`; its `Modifier` child (`final`) is before it. Same in switch
case labels (`case final Bar b ->`). Found by `positionsAreConsistent`.
'''

[[bug]]
id = "javaparser/13"
title = "The name of a declarator with legacy array brackets covers the brackets: in `int x[]` the `SimpleName` range is that of `x[]`"
kind = "wrong-result"
severity = "low"
test = "pin_declaratorNameRangeExcludesBrackets"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
For `int x[]` (fields, locals, parameters, for-each variables) the `VariableDeclarator`'s `SimpleName` has the
range of `x[]` (cols 15–17 instead of 15–15) while its identifier is `x`; the text under the range is not the
name. Found by `positionsAreConsistent`.
'''

[[bug]]
id = "javaparser/14"
title = "A catch parameter with a qualified type has a range starting inside the type: `catch (java.lang.Exception e)` starts at `Exception`"
kind = "wrong-result"
severity = "low"
test = "pin_catchParameterRange"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The `Parameter` of `catch (java.lang.Exception e)` has range (col 47)–(col 57) while its type
`java.lang.Exception` has (col 37)–(col 55): the child begins before the parent. With modifiers or a union type
(`catch (final A | b.B x)`) the range is right; method parameters with qualified types are right too. Found by
`positionsAreConsistent`.
'''

[[bug]]
id = "javaparser/15"
title = "Type annotations lie outside the range of the type they annotate: `throws @A Foo`, `List<@A Foo>`"
kind = "wrong-result"
severity = "low"
test = "pin_typeAnnotationInsideTypeRange"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
For `throws @A Foo` the `ClassOrInterfaceType` `@A Foo` has range (col 30)–(col 32), the identifier only, and its
`MarkerAnnotationExpr` child (col 27)–(col 28) is outside it; likewise the type argument `@A Foo` of
`List<@A Foo>`, `new @A Foo()`, casts and bounds. Declaration annotations (`@A Foo x;`) are fine because
they belong to the declaration. Found by `positionsAreConsistent`.
'''

[[bug]]
id = "javaparser/16"
title = "The type of a parsed `TypePatternExpr`/`RecordPatternExpr` in `instanceof` is not the pattern's child: its parent is the `InstanceOfExpr`, `getChildNodes()`/`walk()` miss it and `clone()` differs"
kind = "contract"
severity = "medium"
test = "pin_patternTypeIsChildOfPattern"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
After parsing `o instanceof Bar b`, `pattern.getType().getParentNode()` is the `InstanceOfExpr` and
`pattern.getChildNodes()` is `[b]`; a `clone()` of the unit has two more nodes than the original, because the
clone's pattern owns its type as the metamodel says. Comments attached to the type
(`instanceof final /* c */ Bar b`) are lost by `clone()`, and `walk()` from the pattern never reaches the
type. Patterns in `switch` labels are fine; the grammar's `instanceof` production builds the pattern from a
type it has already attached to the InstanceOfExpr. Found by `cloneEqualsLaws`.
'''

[[bug]]
id = "javaparser/17"
title = "A method reference cannot be an operand: `this::m ? 1 : 2` and `x * this::m` are parse errors"
kind = "contract"
severity = "low"
test = "pin_methodReferenceAsOperand"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 15.8/15.13 make a MethodReference a Primary, so it may syntactically stand anywhere a primary may (javac
parses these and rejects them later with "method reference not expected here"). The grammar only accepts a
method reference where an expression ends, so `this::m ? 1 : 2` fails with `Parse error. Found "?"`. Such
programs never type-check, hence low. Found by `agreesWithJavac`.
'''

[[bug]]
id = "javaparser/18"
title = "An enum constant with an empty class body, `A { }`, is indistinguishable from `A` and is printed without the body"
kind = "wrong-result"
severity = "low"
test = "pin_enumConstantEmptyBody"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`EnumConstantDeclaration.classBody` is a `NodeList`, empty both for `A` and for `A { }`, so the printed form of
`enum E { A { }, B }` is `enum E { A, B }` — `A` no longer has its own (anonymous) class, which changes
`A.getClass()` and `getDeclaringClass()`. `ObjectCreationExpr` models the same distinction with an
`Optional<NodeList>` (`new Foo() { }` is kept). Found by `agreesWithJavac` (javac keeps the body).
'''

[[bug]]
id = "javaparser/19"
title = "`import static x;` and `permits Foo<T>` are accepted although the grammar requires a qualified name and type names without arguments"
kind = "contract"
severity = "low"
test = "pin_rejectsUnqualifiedStaticImportAndPermitsTypeArguments"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 7.5.3: `import static TypeName . Identifier ;` — a static import needs a dot; JLS 8.1.6: `permits TypeName
{, TypeName}` — no type arguments. Both are parsed without a problem (the `permits` list is read as
ClassOrInterfaceTypes) while javac rejects them (`'.' expected`, `'{' expected`). Found by `mutationsNeverCrash`
and by the generator's early versions.
'''
