[[bug]]
id = "javaparser/22"
title = "A relational operator or a second `instanceof` cannot follow an `instanceof`: `a instanceof String p < s` and `a instanceof String p instanceof Object` are parse errors"
kind = "contract"
severity = "low"
test = "pin_relationalAfterInstanceOf"
found = { commit = "98c8b8c43e7a2e6a83e744aa54f245716e0f349c", version = "3.29.0-SNAPSHOT (2026-09-18)", hegel = "0.6.0", date = "2026-09-24" }
status = "open"
notes = '''
JLS 15.20 derives `RelationalExpression < ShiftExpression` and `RelationalExpression instanceof Pattern` from any
RelationalExpression, so `a instanceof String p < s`, `a instanceof R(int x) < s`, `a instanceof final String p >= s`
and `a instanceof String p instanceof Object` are grammatical, and javac's parser accepts them (attribution then
rejects them: the left operand is boolean, so no well-typed program has the shape, as with the method reference
of bug 17). JavaParser's grammar puts `instanceof` above the relational operators (`InstanceOfExpression:
RelationalExpression [instanceof ...]`), so after the pattern it expects an equality or a looser operator:
`Parse error. Found "<", expected one of "!=" "%=" "&" "&&" ... "||"`. `(a instanceof String p) < s`,
`a instanceof String p == s` and `a < s instanceof String` are fine. Without a pattern (`a instanceof String < s`)
javac rejects the text too (it reads `String<` as type arguments). Found by `mutationsNeverCrash` (an insertion
after a pattern binding) in the first review round of the generators' rewrite in combinator style.
'''

