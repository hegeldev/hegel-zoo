[[bug]]
id = "javaparser/2"
title = "`var` lambda parameters are rejected inside a variable initializer: `Function<A,B> f = (var x) -> x;` gives `\"var\" is not allowed here.`"
kind = "contract"
severity = "medium"
test = "pin_varLambdaParameterInInitializer"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`VarValidator` (ast/validator/language_level_validations/chunks/VarValidator.java) looks for the nearest
`VariableDeclarator` ancestor of every `VarType`; for a lambda parameter inside a field or local variable
initializer it finds the *field's* declarator, then complains that the declarator's parent is not a
`VariableDeclarationExpr` (fields) or that the declaration has several variables or an array type
(`double[] d = …(var x) -> …` even reports `"var" cannot have extra array brackets.`). Only lambdas that
are not under any declarator (`f((var x) -> x)`, `x = (var y) -> y`) are accepted. Java 11 allows `var`
lambda parameters anywhere. Found by `agreesWithJavac`.
'''

