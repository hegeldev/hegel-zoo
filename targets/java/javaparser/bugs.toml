[[bug]]
id = "javaparser/5"
title = "`StringLiteralExpr.asString()` and `CharLiteralExpr.asChar()` turn the `\\s` escape into `s` instead of a space"
kind = "wrong-result"
severity = "medium"
test = "pin_spaceEscape"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`\s` (JLS 3.10.7, Java 15) is the space character; `"a\sb"` is `a b`. `StringEscapeUtils.unescapeJava`
(utils/StringEscapeUtils.java), used by the `LiteralStringValueExpr` subclasses, knows `\n \t \b \r \f \0-\377 \' \"
\\` and Unicode escapes but not `\s`, and its fallback drops the backslash, so the value gains an `s` where the
source has a space. Text blocks are not affected (`"""  a\s  """` gives `a `): their path translates `\s`
itself. Found by `agreesWithJavac` (comparing literal values with javac's).
'''

