[[bug]]
id = "javaparser/3"
title = "Local enum declarations are not parsed: `void m() { enum E { X } }` fails with `Parse error. Found \"{\"`"
kind = "contract"
severity = "medium"
test = "pin_localEnum"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
Java 16 (JEP 395) allows local enums, records and interfaces in a block. The grammar's block-statement
production knows `class`, `interface` (both work) and `record` (`LocalRecordDeclarationStmt`) but not `enum`, so
`enum E { X }` inside a method is taken for a local variable declaration of type `enum`. javac parses and
compiles it. Found by `agreesWithJavac`.
'''

