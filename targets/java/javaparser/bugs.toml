# Bugs found in JavaParser by the zoo's Hegel tests. Every entry has a `pin_…` test in
# hegel/src/test/java/zoo/JavaParserPinsTest.java that asserts the JLS behaviour (or JavaParser's own documented
# behaviour) and fails while the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "javaparser/1"
title = "A cast lambda cannot be the operand of a binary operator: `(Runnable) () -> {} == r` is a parse error"
kind = "contract"
severity = "medium"
test = "pin_castLambdaAsOperand"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 15.16 makes `( ReferenceType ) LambdaExpression` a CastExpression, which is a UnaryExpressionNotPlusMinus
and so an operand of every binary operator; `boolean b = (Runnable) () -> {} == r;` compiles with javac. The
grammar (`java.jj`, the lambda branch of the cast production) parses the cast lambda and then expects the end of
the expression, so `==`, `>=`, `&`, `>>>`… after the lambda's block fail with `Parse error. Found "=="` (or,
in other contexts, "Failed to parse lambda expression! Please create an issue …"). Found by `agreesWithJavac`.
'''

