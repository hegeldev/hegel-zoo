[[bug]]
id = "javaparser/20"
title = "An identifier written with Unicode escapes keeps them: `int \\u0041b;` declares `\\u0041b`, not `Ab`"
kind = "wrong-result"
severity = "medium"
test = "pin_unicodeEscapesInIdentifiersAreTranslated"
found = { commit = "98c8b8c43e7a2e6a83e744aa54f245716e0f349c", version = "3.29.0-SNAPSHOT (2026-09-18)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = '''
JLS 3.3: Unicode escapes are translated before the program is tokenised, so `\\u0041b` and `Ab` are the same
identifier (javac's tree has `Ab`; `class \\u0041 {}` declares class `A`). JavaParser's lexer accepts the escape but
`SimpleName.getIdentifier()` returns the raw text `\\u0041b`, the printer prints it back unchanged, and two
spellings of one identifier compare unequal. Found by `mutationsNeverCrash` comparing the tree with javac's
(the mutation `\\u0041` is in its token list).
'''

