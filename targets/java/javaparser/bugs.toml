[[bug]]
id = "javaparser/21"
title = "A qualified type whose first name is `var` (`var.X f;`, `throws var.X`, `extends var.X`) is a ClassCastException reported as a problem instead of a tree"
kind = "crash"
severity = "medium"
test = "pin_qualifiedTypeStartingWithVar"
found = { commit = "98c8b8c43e7a2e6a83e744aa54f245716e0f349c", version = "3.29.0-SNAPSHOT (2026-09-18)", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
notes = '''
`var` is a reserved type name but not a keyword (JLS 3.9): it is a legal package or variable name, so
`var.X` is a well-formed qualified type name and javac parses `class A { var.X f; }`. JavaParser's parser
builds a `VarType` for the first name and then casts it to `ClassOrInterfaceType` to attach the scope:
`ParseResult` carries the problem "class com.github.javaparser.ast.type.VarType cannot be cast to class
com.github.javaparser.ast.type.ClassOrInterfaceType" and no tree. Fields, parameters, `throws`, `extends`
and type arguments are all affected; `var.X.y()` in an expression is fine. Found by `agreesWithJavac` (the
README had noted the exception without a reduced case).
'''

