[[bug]]
id = "javaparser/8"
title = "A form feed inside a text block is treated as a line terminator by `asString()` and by the printer"
kind = "wrong-result"
severity = "low"
test = "pin_textBlockFormFeed"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
JLS 3.4 line terminators are CR, LF and CRLF; a form feed is white space (JLS 3.6). `"""⏎x\f⏎y⏎"""` is
`x\ny\n` in Java. `TextBlockLiteralExpr.stripIndent()` splits the raw text with a pattern that matches the
form feed (`\R`/`\v`-style), so `asString()` gives `x\n\ny\n`, and `DefaultPrettyPrinterVisitor` re-indents the
block line by line with the same split, printing the form feed as a new line — the printed program has a
different value (`prettyPrintRoundTrip` saw the value change; `agreesWithJavac` the `asString()` difference).
'''

