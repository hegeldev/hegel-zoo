[[bug]]
id = "javaparser/6"
title = "`StringLiteralExpr.asString()` does not let a Unicode-escaped backslash start an escape sequence: `\"\\u005c\\u0022\"` gives `\\\"`"
kind = "wrong-result"
severity = "low"
test = "pin_unicodeEscapedBackslashInString"
found = { commit = "a99f4dc25b72d5e2baa8a472487150a410af7b1e", version = "3.29.0-SNAPSHOT (2026-09-15)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
Java's value of `"\u005c\u0022"` is a lone `"` and of `"\u005c\u005c"` a lone `\` (JLS 3.3: Unicode escapes are
translated first, and the resulting `\` starts an escape sequence). `asString()` translates `\u005c` to a
backslash but then treats it as a literal backslash, giving `\"` and `\\`. Found by `agreesWithJavac`.
'''

