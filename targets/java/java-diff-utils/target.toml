name = "java-diff-utils"
language = "java"
upstream = "https://github.com/java-diff-utils/java-diff-utils"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-16"  # no CONTRIBUTING.md, README and issue templates say nothing about AI; the zoo only records bugs

[base]
commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc"
date = "2026-05-16"
version = "4.18-SNAPSHOT"

[hegel]
version = "0.6.0"

[run]
# Build and install io.github.java-diff-utils:java-diff-utils (the core module only) into the local Maven
# repository at the version the pom declares (hegel/pom.xml depends on it as `jdu.version`). Tests, javadoc,
# sources and the release checks are skipped.
setup = [
  "mvn -q -B -ntp -pl java-diff-utils -am -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true -Dgpg.skip=true -Djacoco.skip=true -Dspotless.skip=true -Dspotless.apply.skip=true -Dspotless.check.skip=true -Dcheckstyle.skip=true install",
]

[expected_failures]
pinEmptyHunkRangesAreNumberedWithTheLineBefore = "java-diff-utils/1"
pinNullOriginalNameKeepsTheOriginalLineNumbers = "java-diff-utils/2"
pinVerifyChunkReportsAChunkEndingPastTheTarget = "java-diff-utils/3"
pinReportLinesUnchangedSuppressesInlineMarkup = "java-diff-utils/4"
pinColumnWidthWrappingKeepsInlineTagsIntact = "java-diff-utils/5"
pinWordInlineDiffsTagEachRowSeparately = "java-diff-utils/6"
pinApplyFuzzyFollowsEarlierHunksThatChangedTheLineCount = "java-diff-utils/7"
pinWordInlineDiffsKeepHtmlEntitiesWhole = "java-diff-utils/8"
pinColumnWidthWrappingDoesNotBreakBeforeASupplementaryCharacter = "java-diff-utils/9"
pinMergeConflictOutputHandlesAChunkPastTheEnd = "java-diff-utils/10"
pinReaderRejectsAShortDiffLineWithAParserException = "java-diff-utils/11"
