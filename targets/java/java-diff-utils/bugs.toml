[[bug]]
id = "java-diff-utils/11"
title = "UnifiedDiffReader throws ArrayIndexOutOfBoundsException on a `diff` line with fewer than four words"
kind = "crash"
severity = "low"
test = "pinReaderRejectsAShortDiffLineWithAParserException"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`UnifiedDiffReader.DIFF_COMMAND` matches any line starting with `diff` + whitespace
(UnifiedDiffReader.java ~53) and `processDiff` (~281-288) calls `parseFileNames`, which does
`line.split(" ")` and reads elements 2 and 3 (~223-228) without checking the length. A diff
command line such as `diff x` or `diff a b` (the latter is what `diff a b` prints in some
contexts, and `diff -u a b` has exactly four words only by luck) therefore throws
`ArrayIndexOutOfBoundsException` from inside `parseUnifiedDiff`, not the documented
`UnifiedDiffParserException`. The same happens to any free-text header line that starts with
`diff ` — the reader treats it as the command line — so `UnifiedDiffWriter` output whose header
begins with that word cannot be read back (`UnifiedDiff.from("diff header line", null, file)`).
Found by `unifiedDiffReaderAndWriterRoundTrip`, which now only generates a git-style
`diff --git a/x b/y` header.
'''

