[[bug]]
id = "java-diff-utils/6"
title = "inlineDiffByWord lets tags span rows because the word splitter swallows the line separator"
kind = "wrong-result"
severity = "medium"
test = "pinWordInlineDiffsTagEachRowSeparately"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`generateInlineDiffs` joins the delta's lines with `"\n"`, splits them into pieces, diffs the
pieces and tags each changed run, then splits the tagged text back on `"\n"` (~395-450). The
`wrapInTag` step closes and reopens a tag around every piece equal to `"\n"`, which works for
`SPLITTER_BY_CHARACTER`. `SPLITTER_BY_WORD` splits on `SPLIT_BY_WORD_PATTERN` = `\s+|[,.…]+`
(~73), so a newline adjacent to other whitespace is absorbed into one delimiter piece such as
`"\n  "` — never equal to `"\n"` — and the tag stays open across the line break:
`create().showInlineDiffs(true).inlineDiffByWord(true).decompressDeltas(false).oldTag(f -> f ?
"[-" : "-]")…generateDiffRows([c, "  a"], [b])` gives the first row's old line `[-c` (unclosed)
and the second `  a-]`. Each row then carries unbalanced markup, and an HTML renderer that
treats rows as cells produces invalid nesting. Found by `diffRowsReconstructBothTexts` (the
inline + word + multi-line-change shape is flagged `tagsCrossRows`).
'''

