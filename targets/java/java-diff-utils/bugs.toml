[[bug]]
id = "java-diff-utils/8"
title = "inlineDiffByWord splits HTML entities produced by the line normaliser, so tags land inside `&lt;`"
kind = "wrong-result"
severity = "low"
test = "pinWordInlineDiffsKeepHtmlEntitiesWhole"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`generateInlineDiffs` normalises the lines first (`LINE_NORMALIZER_FOR_HTML` turns `<` into `&lt;`
and `>` into `&gt;`, DiffRowGenerator.java ~90-95) and only then splits them into words with
`SPLIT_BY_WORD_PATTERN`, whose delimiter class contains `&` and `;` (~73). An escaped bracket is
therefore three pieces `&`, `lt`, `;`, and a change of `<` into `>` is a change of the middle
piece only: `create().showInlineDiffs(true).inlineDiffByWord(true).oldTag(f -> f ? "[-" : "-]")
…generateDiffRows([a<b], [a>b])` gives the old line `a&[-lt-];b` — the opening tag sits inside
the entity, which a browser renders as the literal text `&[-lt-];` (or, with the default span
tags, as `&<span …>lt</span>;`). Correct output tags the whole entity: `a[-&lt;-]b`. Splitting
before normalising, or normalising each piece, avoids it. Found by `diffRowsReconstructBothTexts`
(the HTML-normaliser + word + inline shape is skipped by the entity check).
'''

