[[bug]]
id = "java-diff-utils/9"
title = "StringUtils.wrapText inserts a leading or doubled `<br/>` when a break falls between the halves of a surrogate pair"
kind = "wrong-result"
severity = "low"
test = "pinColumnWidthWrappingDoesNotBreakBeforeASupplementaryCharacter"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`StringUtils.wrapText(line, columnWidth)` (StringUtils.java ~49-75) walks break points
`columnWidth`, `2·columnWidth + 5`, … and, when a break would split a surrogate pair
(`isHighSurrogate(charAt(breakPoint - 1)) && isLowSurrogate(charAt(breakPoint))`, ~64), moves
the break one character back — even to position 0 — and then continues counting from the moved
point without re-synchronising, so the next break is only a `<br/>` width away. `create()
.columnWidth(1).lineNormalizer(s -> s).build().generateDiffRows(["😀"], ["😀"])` gives an EQUAL
row whose lines are `<br/>😀` (a break before the first character); `"x😀"` with width 2 gives
`x<br/><br/>😀`. Expected: `😀` and `x<br/>😀` — a break is never useful at position 0 and never
twice in a row. Found by `diffRowsReconstructBothTexts` (the `<br/>` placement check is skipped
for lines containing supplementary characters).
'''

