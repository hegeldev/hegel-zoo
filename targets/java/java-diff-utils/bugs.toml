[[bug]]
id = "java-diff-utils/5"
title = "columnWidth wrapping is applied after inline tagging and splits the tags themselves"
kind = "wrong-result"
severity = "medium"
test = "pinColumnWidthWrappingKeepsInlineTagsIntact"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`generateInlineDiffs` tags the changed segments first and then passes the tagged text to
`StringUtils.wrapText(line, columnWidth)` (DiffRowGenerator.java ~455-470, StringUtils.java
~49-75), which counts every character — tag characters included — and inserts `<br/>` every
`columnWidth` characters. The break can fall inside a tag: with `columnWidth(3)`, tags `[-`/`-]`
and `{+`/`+}`, `generateDiffRows([abcdef], [abXdef])` produces the old line
`ab[<br/>-c-<br/>]de<br/>f` — the opening tag is torn into `[` and `-`, the closing into `-` and
`]`. With the default `<span class="editOldInline">` tags the output is broken HTML whenever a
break lands inside a span tag, which for a 20-character tag and small widths is the common case.
The rows without inline diffs (`buildDiffRow`) wrap the untagged text, so the fix is to wrap
before tagging or to count only text characters. Found by `diffRowsReconstructBothTexts`
(inline + width > 0 flagged `tagsSplit`; balanced-tag and reconstruction checks skipped).
'''

