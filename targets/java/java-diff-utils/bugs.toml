[[bug]]
id = "java-diff-utils/10"
title = "CONFLICT_PRODUCES_MERGE_CONFLICT throws IndexOutOfBoundsException when the conflicting chunk extends past the end of the target"
kind = "crash"
severity = "low"
test = "pinMergeConflictOutputHandlesAChunkPastTheEnd"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Patch.CONFLICT_PRODUCES_MERGE_CONFLICT` (Patch.java ~200-225) builds the git-style conflict block
by removing `delta.getSource().size()` lines at the chunk position from the result
(`result.remove(delta.getSource().getPosition())` in a loop, ~208-212) before inserting the
`<<<<<< HEAD` … `======` … `>>>>>>> PATCH` markers. It checks `result.size() <= position`
(UnsupportedOperationException) but not `position + size <= result.size()`, so a chunk that
starts inside the target and runs past its end throws from `List.remove`:
`diff([a, b, c, d], [a, x, y, z]).withConflictOutput(CONFLICT_PRODUCES_MERGE_CONFLICT)
.applyTo([a, q])` → `IndexOutOfBoundsException: Index 1 out of bounds for length 1`, while the
same call on `[a, q, c]` returns `[a, <<<<<< HEAD, q, ======, b, >>>>>>> PATCH, c]`. The
conflict output exists precisely for targets that do not match, so a short target is a normal
input; the expected result is `[a, <<<<<< HEAD, q, ======, b, c, d, >>>>>>> PATCH]` (or at least
a `PatchFailedException`). Found while modelling the conflict output in
`diffsAreMinimalAndPatchesRoundTrip`, which only exercises same-length targets.
'''

