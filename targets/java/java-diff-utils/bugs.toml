# Bugs found in java-diff-utils by the zoo's Hegel tests. Every entry has a `pin…` test in
# hegel/src/test/java/zoo/DiffPinsTest.java that asserts the documented (or GNU-diff) behaviour and
# fails while the bug exists (target.toml `[expected_failures]`).

[[bug]]
id = "java-diff-utils/1"
title = "generateUnifiedDiff numbers an empty hunk range from the line after the change instead of the line before"
kind = "wrong-result"
severity = "medium"
test = "pinEmptyHunkRangesAreNumberedWithTheLineBefore"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`UnifiedDiffUtils.processDeltas` (UnifiedDiffUtils.java ~225-231) computes both hunk starts as
`position + 1 - contextSize`, clamped to 1, whatever the range's length. In unified-diff format an
empty range (`,0`) is numbered from the line *before* the insertion or deletion point, so a pure
deletion of the whole of `[a, b, c]` must read `@@ -1,3 +0,0 @@` and a pure insertion after line
2 with no context `@@ -2,0 +3,N @@`; the library writes `@@ -1,3 +1,0 @@` and `@@ -3,0 +3,N @@`
— one line too high on the empty side. GNU patch tolerates this for most inputs (it searches),
but the numbers are wrong, and a deletion of the last line of a file gives `-N,1 +N,0` where the
new file has only N-1 lines. The library's own `parseUnifiedDiff` and `UnifiedDiffReader`
subtract one from both starts unconditionally, so the shifted numbers round-trip only because
both sides share the error. Found by `unifiedDiffsAreWellFormedAndParseBack`, whose GNU-style
model (`applyUnified`) skips the check for empty ranges.
'''

