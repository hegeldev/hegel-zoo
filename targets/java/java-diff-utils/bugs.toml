[[bug]]
id = "java-diff-utils/3"
title = "Chunk.verifyChunk reads one line past the target, so applying a patch to a short target throws IndexOutOfBoundsException instead of PatchFailedException"
kind = "crash"
severity = "medium"
test = "pinVerifyChunkReportsAChunkEndingPastTheTarget"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "fixed"
fixed_in = "4.18-SNAPSHOT (06438525cfb1)"
notes = '''
`Chunk.verifyChunk(target, fuzz, position)` (Chunk.java ~110-125) guards the range with
`position + fuzz > target.size() || last() - fuzz > target.size()` where `last()` is
`position + size() - 1`, so a chunk whose last line index equals `target.size()` — one past the
end — passes the guard and the comparison loop calls `target.get(target.size())`:
`new Chunk<>(2, [c, y]).verifyChunk([a, b, c])` throws `ArrayIndexOutOfBoundsException: Index 3
out of bounds for length 3` instead of returning `VerifyChunk.POSITION_OUT_OF_TARGET`. The guard
should be `last() - fuzz >= target.size()`. Consequences: `Patch.applyTo` on a target that is
exactly one line shorter than the patch expects throws the unchecked exception rather than the
documented `PatchFailedException` (`DiffUtils.diff([a, b], [a]).applyTo([a])` → IOOBE), and
`Patch.applyFuzzy`'s position search (`Patch.java ~120-160`) hits the same exception whenever a
probe position lands one line past the end (the chunk's content matches up to the end in both
cases; with a content mismatch earlier the loop reports `CONTENT_DOES_NOT_MATCH_TARGET` first).
Found by `diffsAreMinimalAndPatchesRoundTrip` (truncated-target check, skipped when the victim
chunk has one line) and `unifiedDiffsAreWellFormedAndParseBack` (`applyFuzzy`, exception caught).
'''

