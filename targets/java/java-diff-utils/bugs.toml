[[bug]]
id = "java-diff-utils/4"
title = "DiffRowGenerator.reportLinesUnchanged(true) is ignored by inline diffs, which still wrap the changed lines in tags"
kind = "contract"
severity = "low"
test = "pinReportLinesUnchangedSuppressesInlineMarkup"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
The Builder documents `reportLinesUnchanged` as "Give the original old and new text lines to
Diff Row Generator without any additional processing and without any tags to highlight the
change" (DiffRowGenerator.java ~570). `buildDiffRow` (~355) honours it — no normaliser, no
`wrapText`, no tags — but `generateInlineDiffs` (~392-470), used for every CHANGE delta when
`showInlineDiffs(true)`, only skips the normaliser (`normalizeLines`, ~381) and still calls
`wrapInTag` on the word/character deltas: `create().showInlineDiffs(true)
.reportLinesUnchanged(true).oldTag(f -> "~").newTag(f -> "*").build().generateDiffRows([a],
[b])` gives `[CHANGE,~a~,*b*]` instead of `[CHANGE,a,b]`. Found by `diffRowsReconstructBothTexts`
(the inline + unchanged combination is flagged `markupDespiteUnchanged` and its raw-line check
skipped).
'''

