[[bug]]
id = "java-diff-utils/7"
title = "Patch.applyFuzzy keeps stale positions after a hunk that changed the line count"
kind = "wrong-result"
severity = "medium"
test = "pinApplyFuzzyFollowsEarlierHunksThatChangedTheLineCount"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`Patch.applyFuzzy` (Patch.java ~104-118) applies the deltas forwards and carries
`lastPatchDelta = patchPosition - delta.getSource().getPosition()`, the offset at which the
previous chunk was *found*, into the next chunk's `defaultPosition`. It never accounts for the
line-count change made by the previous chunk itself (target size − source size), which GNU patch
does. So a patch whose first hunk grows or shrinks the file looks for the second hunk at the
wrong offset; if the search fails it falls back to a context-free position or applies at the
default and produces a wrong result without any conflict report. Smallest shape:
`orig = [d]`, `rev = ["a  ", c, d, e]`; the unified diff has two hunks (insert `a  `, `c` before
`d`; insert `e` after it); `parseUnifiedDiff(ud).applyFuzzy(orig, 0)` returns `["a  ", e, c, d]`
instead of `rev` — the second hunk is applied at position 1 (its original position, plus the
zero offset) instead of position 3. `applyTo` (backwards, verified) is unaffected. Found by
`unifiedDiffsAreWellFormedAndParseBack`, whose `applyFuzzy` checks skip patches where a
size-changing hunk precedes another hunk.
'''

