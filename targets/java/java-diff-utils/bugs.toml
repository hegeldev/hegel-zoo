[[bug]]
id = "java-diff-utils/2"
title = "generateUnifiedDiff with a null original name writes `@@ -0,N` for any single-delta patch, and parsing then loses the position"
kind = "wrong-result"
severity = "medium"
test = "pinNullOriginalNameKeepsTheOriginalLineNumbers"
found = { commit = "5e2e5b981533964aaeb19e2ba56d0f53dbd8b2dc", version = "4.18-SNAPSHOT (2026-05-16)", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
notes = '''
`generateUnifiedDiff` (UnifiedDiffUtils.java ~196) passes `newFile = patchDeltas.size() == 1 &&
originalFileName == null` to `processDeltas`, which then sets `origStart = 0` (~222) regardless of
where the delta is. The intent is the `--- /dev/null` / `@@ -0,0 +1,N @@` header of a newly
created file, but the condition does not look at the delta: `diff([a, b, c], [a, x, c])` written
with a null original name gives `@@ -0,1 +2,1 @@` (original range starting at 0 with one line —
line 0 does not exist) instead of `@@ -2,1 +2,1 @@`. `parseUnifiedDiff` then turns the 0 into 1
(~0 → 1 rule) and produces a `ChangeDelta` at position 0 whose source `[b]` does not match line
0 of the original, so the diff no longer applies to the file it was generated from
(`PatchFailedException`), and `applyFuzzy` finds the chunk one line off. With two or more deltas
the same call numbers correctly. Found by `unifiedDiffsAreWellFormedAndParseBack` (the
null-name, single-delta shape is skipped when the original is not empty).
'''

