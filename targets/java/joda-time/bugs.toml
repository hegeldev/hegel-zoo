[[bug]]
id = "joda-time/20"
title = "In a zone with a DST tail rule, previousTransition(Long.MAX_VALUE - 1) names a transition at which the offset does not change, and nextTransition just before it reports no transition: getOffset, nextTransition and previousTransition disagree in the last years before Long.MAX_VALUE"
kind = "contract"
severity = "low"
test = "tailRuleTransitionsAgreeWithOffsetsNearLongMax"
found = { commit = "13691681d373b246cbecb4030a703e3fa60cf1aa", version = "2.14.4", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Reproduction (2.14.4, tz 2026d): America/Chicago, `pt = previousTransition(Long.MAX_VALUE - 1)` = 9223372022947199999,
but `getOffset(pt - 1) == getOffset(pt) == getOffset(pt + 1) == -18000000` (previousTransition documents the
millisecond before the transition, so the offset should change between pt and pt + 1), and `nextTransition(pt - 1)`
returns pt - 1, that is "no further transition". The same inconsistency holds for the 193 zones whose rules keep
recurring after 2038 (a DST tail rule), within about 500 days of Long.MAX_VALUE, where the recurrences of the final
year cannot be computed; zones with a final fixed offset are consistent. Gated in ZoneTest.transitionsAndOffsetsAreConsistent
for instants in the last three years before Long.MAX_VALUE of tail-rule zones (Known.TAIL_RULE_OFFSETS_ARE_WRONG_IN_THE_LAST_YEARS_BEFORE_LONG_MAX);
joda-time/11 and /12 cover the Long.MAX_VALUE endpoint itself.
'''

