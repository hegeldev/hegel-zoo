[[bug]]
id = "joda-time/21"
title = "getOffsetFromLocal and toDateTime resolve the last hours of an overlap to the later instant when the transition crosses the date line (Pacific/Kwajalein 1969-09-30, +11:00 to -12:00), although getOffsetFromLocal documents the offset applicable before the overlap (the earlier instant, as java.time gives)"
kind = "contract"
severity = "medium"
test = "overlapAcrossTheDateLineResolvesToTheEarlierInstant"
found = { commit = "13691681d373b246cbecb4030a703e3fa60cf1aa", version = "2.14.4", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Reproduction (2.14.4): Pacific/Kwajalein changed from +11:00 to -12:00 at the end of 1969-09-30, a 23-hour overlap.
`new LocalDateTime(1969, 9, 30, 23, 0).toDateTime(DateTimeZone.forID("Pacific/Kwajalein"))` is
1969-09-30T23:00:00.000-12:00 and `getOffsetFromLocal` gives -43200000; java.time's `atZone` gives
1969-09-30T23:00+11:00 (valid offsets [+11:00, -12:00]), which is the offset applicable before the overlap that getOffsetFromLocal's
Javadoc promises ("any instant calculated using the offset from an overlap will be in summer time"). Cause: getOffsetFromLocal estimates the offset from the local instant, then adjusts
by looking at the next transition from `instantLocal - offsetLocal`; when the offset changes sign by nearly a day the
adjusted estimate lands after the transition and the later offset is kept. Unlike joda-time/1 (convertLocalToUTC
disagreeing with getOffsetFromLocal east of Greenwich), here getOffsetFromLocal itself is wrong, and only for the
overlap hours that fall past the transition under the new offset. Gated in IsoTest (java.time's valid offsets of
opposite sign) and ZoneTest (Known.OVERLAP_INTO_A_NEGATIVE_OFFSET_RESOLVES_TO_THE_LATER_INSTANT).
'''

