[[bug]]
id = "joda-time/19"
title = "GJChronology rejects February 29 of a Julian leap year whose number is not a Gregorian leap year (300, 1500, BC years) in the four-argument getDateTimeMillis, so new LocalDate(300, 2, 29, gj) throws while new DateTime(300, 2, 29, 0, 0, gj) and the fields accept the day, and plusYears/plusMonths/withYear onto such a date clamp it to the 28th"
kind = "contract"
severity = "medium"
test = "gjAcceptsJulianLeapDaysTheGregorianCalendarLacks"
found = { commit = "13691681d373b246cbecb4030a703e3fa60cf1aa", version = "2.14.4", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Reproduction (2.14.4): `new LocalDate(300, 2, 29, GJChronology.getInstanceUTC())` throws IllegalFieldValueException
"Value 29 for dayOfMonth must be in the range [1,28]: year: 300 month: 2", while `new DateTime(300, 2, 29, 0, 0, gj)`
prints 0300-02-29T00:00:00.000Z, `new LocalDate(300, 3, 1, gj).minusDays(1)` is 0300-02-29 and the plain Julian
chronology accepts the date. Arithmetic clamps as if the day did not exist: `new LocalDate(1988, 2, 29, gj).plusYears(-1688)`
is 0300-02-28 (expected 02-29), and the Buddhist chronology (built on GJ) does the same:
`new LocalDate(2511, 2, 29, BuddhistChronology.getInstanceUTC()).plusYears(-2340)` is 0171-02-28. Cause: GJChronology's
four-argument getDateTimeMillis(year, month, day, millisOfDay) validates the fields with the Gregorian chronology's
month lengths before choosing the Julian side for dates before the cutover; the seven-argument overload takes the
Julian path. Year 0 (1 BC) is a Gregorian leap year too, so it is unaffected; every other BC year and the years
100, 200, 300, 500, ... 1500 are. Found by the rewrite's calendar properties (ChronoTest) and gated there with
Known.GJ_GET_DATE_TIME_MILLIS_REJECTS_JULIAN_LEAP_DAYS.
'''

