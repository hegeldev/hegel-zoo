# Bugs found in Joda-Time by the Hegel properties (see README.md). Each is pinned by the test named in `test`
# (JodaTimePinsTest), which asserts the correct behaviour and fails while the bug exists.

[[bug]]
id = "joda-time/1"
title = "convertLocalToUTC(local, strict) resolves an overlap to the later instant in eastern zones and the earlier in western ones; getOffsetFromLocal always picks the earlier"
kind = "inconsistent"
severity = "medium"
test = "convertLocalToUTCResolvesOverlapsLikeGetOffsetFromLocal"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTimeZone.getOffsetFromLocal documents the overlap rule ("the offset applicable before the [transition]... in
summer time", the earlier instant) and the chronology, LocalDateTime.toDateTime and the three-argument
convertLocalToUTC follow it. The two-argument convertLocalToUTC (DateTimeZone.java:1053) only re-examines the
estimate when `strict || offsetLocal < 0`, so for Europe/Berlin 2023-10-29 02:30 local it returns 01:30Z (the
later, standard-time instant) while `local - getOffsetFromLocal(local)` is 00:30Z; for America/New_York the same
method returns the earlier instant. 273 of the 486 zones with overlaps disagree between the two methods at every
overlap. The hemisphere-dependent behaviour is what the 2.0 notes say was removed from getOffsetFromLocal.
'''

[[bug]]
id = "joda-time/2"
title = "parseLocalDateTime/parseLocalDate/parseLocalTime throw IllegalInstantException for a zone id (ZZZ) whose DST gap contains the parsed local time"
kind = "contract"
severity = "medium"
test = "parseLocalDateTimeIgnoresTheZoneId"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
The Javadoc of parseLocalDateTime says "any parsed time-zone or offset field is completely ignored" and the code
comment reads "always use UTC, avoiding DST gaps" (DateTimeFormatter.java:890), but the ZZZ parser calls
bucket.setZone and DateTimeParserBucket.computeMillis (:478-490) applies iZone.getOffsetFromLocal, which throws for
a local time inside the zone's gap. `DateTimeFormat.forPattern("yyyy-MM-dd HH:mm ZZZ").parseLocalDateTime("2010-03-14
02:30 America/New_York")` throws; the same text with an offset (+05:00) or a non-gap time parses and ignores the zone.
'''

[[bug]]
id = "joda-time/3"
title = "The ZZZ pattern prints fixed-offset zone ids (\"+02:00\") that its own parser rejects"
kind = "roundtrip"
severity = "low"
test = "zoneIdPatternParsesTheIdsItPrints"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTimeFormat.forPattern("yyyy-MM-dd ZZZ").print(new DateTime(0, DateTimeZone.forOffsetHours(2))) is
"1970-01-01 +02:00"; parsing it back fails with `Invalid format: ... is malformed at "+02:00"`, although
DateTimeZone.forID("+02:00") accepts the id. The TimeZoneId parser (DateTimeFormatterBuilder) matches the
available ids only; fixed-offset ids are not among them.
'''

[[bug]]
id = "joda-time/4"
title = "Period.toStandardWeeks/Days/Hours/Minutes/Seconds truncate the smaller fields before adding the whole field, so mixed-sign periods are off by one"
kind = "wrong-result"
severity = "medium"
test = "toStandardUnitsTruncateTheTotal"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Period.toStandardWeeks (Period.java:1399) computes `getWeeks() + (days..millis in millis) / MILLIS_PER_WEEK`: the
remainder is truncated towards zero on its own and then added to the weeks. For P-16W16DT1H-2M-3.994S the total is
-13.7 weeks (-95.96 days), so the documented "number of standard weeks in this period" is -13 (and -95 days), but
toStandardWeeks gives -14 and toStandardDays -96 (toStandardDuration is exact). Same shape in toStandardDays,
toStandardHours, toStandardMinutes and toStandardSeconds whenever the whole field and the rest have opposite signs.
'''

[[bug]]
id = "joda-time/5"
title = "IslamicChronology.withUTC() and withZone() return the 16-based chronology whatever the leap-year pattern, so LocalDate/LocalDateTime silently use the wrong calendar"
kind = "wrong-result"
severity = "high"
test = "islamicChronologyKeepsItsLeapYearPatternInUTC"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
IslamicChronology.withUTC (IslamicChronology.java:264) returns INSTANCE_UTC and withZone (:275) calls
getInstance(zone), both built with LEAP_YEAR_16_BASED. Every LocalDate, LocalDateTime, LocalTime and
DateTime.toLocalDate() call withUTC(), and DateTime.withZone() calls withZone(): a date built with the Indian,
15-based or Habash al-Hasib pattern is computed with the 16-based leap years. `new LocalDate(8, 1, 1,
IslamicChronology.getInstance(UTC, LEAP_YEAR_INDIAN)).year().isLeap()` is false although 8 AH is a leap year in the
Indian pattern (getInstance(UTC, INDIAN).year().isLeap(millis) is true); the three non-default patterns are only
usable through DateTime in a fixed zone. GJChronology.withUTC/withZone, by contrast, keep their cutover.
'''

[[bug]]
id = "joda-time/6"
title = "Days/Weeks/Months/Years/Hours/Minutes/Seconds.dividedBy(-1) of MIN_VALUE returns MIN_VALUE instead of throwing"
kind = "wrong-result"
severity = "low"
test = "singleFieldPeriodsDividedByMinusOneOverflowLoudly"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Days.dividedBy (Days.java:435) is `Days.days(getValue() / divisor)` with no overflow check, so
Days.MIN_VALUE.dividedBy(-1) is Days.MIN_VALUE (Integer.MIN_VALUE / -1 wraps); negated(), plus() and
multipliedBy() use FieldUtils and throw ArithmeticException. The same body is in Weeks, Months, Years, Hours,
Minutes and Seconds.
'''

[[bug]]
id = "joda-time/7"
title = "The ISO period printer folds seconds*1000 + millis into an int, printing a negative or wrapped number of seconds; the parser rejects seconds beyond the int millisecond range"
kind = "silent-corruption"
severity = "low"
test = "isoPeriodFormatPrintsLargeSecondsExactly"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`new Period(0, 0, 0, 0, 0, 0, Integer.MAX_VALUE, 1000).toString()` is "PT-2147483648S" (toStandardDuration is
2147483648000 ms): PeriodFormatterBuilder's seconds-with-millis printer combines the two fields in an int. The
parser has the same limit: "PT2147483647.001S" and "PT-2147483648.999S" are rejected as malformed, so Period.parse
cannot read what toString prints once the millisecond total leaves the int range. Also seen when the seconds field
alone is in range but millis push the total over.
'''

[[bug]]
id = "joda-time/8"
title = "getMaximumValue(ReadablePartial) of dayOfMonth and dayOfYear feed the era-based year into the leap-year rule (Buddhist years, BC years of the Julian and GJ chronologies)"
kind = "wrong-result"
severity = "medium"
test = "partialMaximumValueUsesTheChronologyYear"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
BasicDayOfMonthDateTimeField.getMaximumValue(ReadablePartial) and BasicDayOfYearDateTimeField's take
partial.get(year) as the chronology's internal year: for BuddhistChronology (year = ISO year + 543) the overload
answers 31 for February of BE 2567 (2024 CE) and 366 for its day-of-year, while the instant-based overload and
LocalDate.Property say 29 (the wrapped GJ fields receive the BE year, a Buddhist-offset field is applied twice); for
JulianChronology and GJChronology, 1 BC (Joda year -1, astronomical 0, a leap year) gets 28/365 instead of
29/366. Partial validation goes through this overload: `new Partial({year, monthOfYear, dayOfMonth}, {-1, 2, 29},
JulianChronology.getInstanceUTC())` is rejected ("Value 29 for dayOfMonth must not be larger than 28") although
`new LocalDate(-1, 2, 29, julian)` exists.
'''

[[bug]]
id = "joda-time/9"
title = "LimitChronology fields answer getMaximumValue(ReadablePartial) with the absolute maximum (Islamic, Coptic, Ethiopic day-of-year and day-of-month)"
kind = "wrong-result"
severity = "medium"
test = "limitChronologyMaximaFollowThePartial"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
LimitChronology.LimitDateTimeField (LimitChronology.java:461) overrides getMinimumValue(long)/getMaximumValue(long)
only; the ReadablePartial overloads fall through to BaseDateTimeField's defaults, which return the absolute
maximum. IslamicChronology, CopticChronology and EthiopicChronology wrap themselves in a LimitChronology (lower
limit year 1), so `isl.dayOfYear().getMaximumValue(new LocalDate(1427, 1, 1, isl))` is 355 for a 354-day year and
`isl.dayOfMonth().getMaximumValue(partial)` is 30 for a 29-day month; `withDayOfYear(355)` then throws. The
instant-based overload and LocalDate.Property give 354/29.
'''

[[bug]]
id = "joda-time/10"
title = "minus(MIN_VALUE) on Duration, Instant, Days and the other single-field periods throws ArithmeticException even when the result fits"
kind = "wrong-exception"
severity = "low"
test = "minusOfMinValueOverflowsOnlyWhenTheResultDoes"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
Duration.minus(long) is withDurationAdded(amount, -1), which calls FieldUtils.safeMultiply(Long.MIN_VALUE, -1) and
throws "Multiplication overflows a long"; Days.minus(int) is plus(FieldUtils.safeNegate(days)) and throws
"Integer.MIN_VALUE cannot be negated". `new Duration(-1).minus(Long.MIN_VALUE)` (= Long.MAX_VALUE) and
`Days.days(-1).minus(Integer.MIN_VALUE)` (= Integer.MAX_VALUE) are representable; the Javadoc promises an
ArithmeticException only "if the result overflows". Instant.minus(long) has the same shape; Period.minus does not.
Duration.withDurationAdded(amount, scalar) likewise throws when amount * scalar overflows a long even if the sum
would fit (e.g. a negative duration plus Long.MIN_VALUE * -1 ... = Long.MAX_VALUE - |d|); the properties skip
that shape too.
'''

[[bug]]
id = "joda-time/11"
title = "DateTimeZone.nextTransition(Long.MAX_VALUE) returns an instant before its argument for zones with a DST tail rule"
kind = "contract"
severity = "low"
test = "nextTransitionNeverGoesBackwards"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTimeZoneBuilder.DSTZone.nextTransition (DateTimeZoneBuilder.java:1257) guards overflow with `instant > 0 &&
start < 0` only; Recurrence.next clamps at the chronology's maximum year and yields a positive value smaller than
the argument. Africa/Cairo.nextTransition(Long.MAX_VALUE) is 9223372034834400000 (< Long.MAX_VALUE) instead of
the argument itself ("if the instant returned is exactly the same as passed in, then no changes occur after the
given instant"). 62 zone ids violate `nextTransition(t) >= t` at the extreme (Africa/Cairo, Asia/Jerusalem,
Asia/Beirut, Antarctica/Macquarie, Australia/*, ...).
'''

[[bug]]
id = "joda-time/12"
title = "DateTimeZone.previousTransition(Long.MAX_VALUE) wraps and returns an instant near Long.MIN_VALUE or the last precalculated transition"
kind = "wrong-result"
severity = "low"
test = "previousTransitionAtLongMaxIsTheLastTransition"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTimeZoneBuilder.DSTZone.previousTransition (DateTimeZoneBuilder.java:1298) starts with `instant++`, which
wraps Long.MAX_VALUE to Long.MIN_VALUE; the following `instant < 0` guards then see the corrupted value.
America/New_York.previousTransition(Long.MAX_VALUE) is -9223372030240800001 while previousTransition(Long.MAX_VALUE
- 1) is 9223372022943599999; Europe/London gives 1996-10-27 (its last precalculated transition).
'''

[[bug]]
id = "joda-time/13"
title = "plusMonths past the maximum year is not range-checked: LocalDate/YearMonth leave the supported range or wrap to a negative year"
kind = "wrong-result"
severity = "medium"
test = "plusMonthsRespectsTheMaximumYear"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
BasicMonthOfYearDateTimeField.add(long, int) (BasicMonthOfYearDateTimeField.java:95-160) has no min/max-year check
and computes `thisMonth - 1 + months` in an int; the add(long, long) overload and BasicYearDateTimeField.add throw
("Magnitude of add amount is too large"). `new LocalDate(292278993, 12, 1).plusMonths(1)` is 292278994-01-01, a
date the constructor rejects; `new YearMonth(292278993, 12).plusMonths(Integer.MAX_VALUE)` is -113318085-03.
'''

[[bug]]
id = "joda-time/14"
title = "roundCeiling(Long.MAX_VALUE) and roundFloor(Long.MIN_VALUE) of every field above millis overflow to the other sign"
kind = "wrong-result"
severity = "low"
test = "roundingAtTheLongExtremesOverflowsLoudly"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
PreciseDurationDateTimeField.roundCeiling/roundFloor (PreciseDurationDateTimeField.java:95-120) compute `instant -
instant % unit + unit` unchecked: ISOChronology.getInstanceUTC().secondOfMinute().roundCeiling(Long.MAX_VALUE) is
-9223372036854775616 and roundFloor(Long.MIN_VALUE) is 9223372036854775616, breaking `roundCeiling(t) >= t` and
`roundFloor(t) <= t`; roundHalfEven/roundHalfCeiling inherit it, as do the imprecise year and month fields.
Reachable from DateTime.secondOfMinute().roundCeilingCopy() at the extreme. An ArithmeticException (as FieldUtils
throws elsewhere) is the consistent outcome.
'''

[[bug]]
id = "joda-time/15"
title = "GJChronology reports dayOfMonth maximum 4 for October 1582, though days 15-31 exist and set(31) succeeds"
kind = "wrong-result"
severity = "medium"
test = "gjChronologyOctober1582HasThirtyOneDays"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
GJChronology.CutoverField.getMaximumValue(long) (GJChronology.java:886-901) verifies the Julian maximum by setting
it and, when the result falls into the cutover gap, takes the day before the cutover — assuming the gap removes the
tail of the range. For dayOfMonth the gap (October 5-14, 1582) is interior: `new LocalDate(1582, 10, 4,
gj).dayOfMonth().getMaximumValue()` is 4 and withMaximumValue() is 1582-10-04, while withDayOfMonth(31) and `new
LocalDate(1582, 10, 31, gj)` succeed. (dayOfYear of 1582 = 355 is right, since that gap is at the end of the range.)
'''

[[bug]]
id = "joda-time/16"
title = "appendTwoDigitYear(pivot, lenient) parses a sign followed by a non-digit as a year"
kind = "wrong-result"
severity = "low"
test = "lenientTwoDigitYearRequiresDigits"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTimeFormatterBuilder.TwoDigitYear.parseInto (DateTimeFormatterBuilder.java:1518-1571): after a '-' the length
counter is incremented for the sign alone; when no digit follows, the guards `length == 0` and `hasSignChar ||
length != 2` are passed and `text.charAt(i++) - '0'` reads the next character without a digit check. With
appendTwoDigitYear(2000, true).appendLiteral('#'), "-#" parses as year 13 ('#' - '0' = -13, negated); "-x" consumes
one character and stores year -72. A parse failure is expected.
'''

[[bug]]
id = "joda-time/17"
title = "appendTwoDigitYear(lenient) reports a parse failure after a leading '+' at position 1 instead of 0"
kind = "contract"
severity = "low"
test = "twoDigitYearParseFailurePositionIsTheStart"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
DateTimeFormatterBuilder.java:1529-1531 does `position++` to skip the '+' before the `length == 0` failure return,
so parseInto(..., "+x", 0) returns -2 (~1) while "x" and "-" return -1 (~0). parseInto documents the complement as
"the position where the parse failed"; nothing was consumed successfully.
'''

[[bug]]
id = "joda-time/18"
title = "The ISO basic formatters print five-digit and negative years they cannot parse back"
kind = "roundtrip"
severity = "low"
test = "basicIsoFormatsRoundTripLargeYears"
found = { commit = "b80254120c5b40626a31aefafefba51f6998b8c7", version = "2.14.3", hegel = "0.6.0", date = "2026-09-16" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
ISODateTimeFormat.basicDate/basicDateTime/basicWeekDate/basicOrdinalDate use appendYear(4, 4), whose maxDigits
limits parsing only: basicDate().print(new LocalDate(12345, 6, 30)) is "123450630" and parsing it fails ("malformed
at "0""); -12345 and years beyond 9999 in the other basic variants behave the same, while the extended formats
(date(), ordinalDate(), LocalDate.toString) round trip such years. Borderline: ISO 8601 basic format has no
expanded-year form without prior agreement, so refusing to print (or printing a signed expanded year the parser
accepts) would both be consistent.
'''
