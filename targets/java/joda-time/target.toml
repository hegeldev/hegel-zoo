name = "joda-time"
language = "java"
upstream = "https://github.com/JodaOrg/joda-time"
subdir = ""
license = "Apache-2.0"
# README, SECURITY.md, the issue and PR templates and the workflows say nothing about AI assistance; there is no
# CONTRIBUTING.md, CLAUDE.md, AGENTS.md or copilot-instructions. Nothing prohibits AI-written tests; an upstream report
# should still say how they were made.
ai_policy_checked = "2026-09-16"

[base]
commit = "b80254120c5b40626a31aefafefba51f6998b8c7"
date = "2026-09-13"
version = "2.14.3"

[hegel]
version = "0.6.0"

[run]
# The library is installed into the local Maven repository from the pinned tree. Its pom targets Java 1.5 with a forked
# compiler, which JDK 25 cannot do, so the compiler source/target are overridden to 8; javadoc and sources are skipped.
# The build compiles the bundled tz tables (2026d). About a minute; the tests need nothing else.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.compiler.source=8 -Dmaven.compiler.target=8 -Dmaven.compiler.compilerVersion=8 -Dmaven.compiler.fork=false -Dmaven.javadoc.skip=true -Dmaven.source.skip=true install",
]

[expected_failures]
convertLocalToUTCResolvesOverlapsLikeGetOffsetFromLocal = "joda-time/1"
parseLocalDateTimeIgnoresTheZoneId = "joda-time/2"
zoneIdPatternParsesTheIdsItPrints = "joda-time/3"
toStandardUnitsTruncateTheTotal = "joda-time/4"
islamicChronologyKeepsItsLeapYearPatternInUTC = "joda-time/5"
singleFieldPeriodsDividedByMinusOneOverflowLoudly = "joda-time/6"
isoPeriodFormatPrintsLargeSecondsExactly = "joda-time/7"
partialMaximumValueUsesTheChronologyYear = "joda-time/8"
limitChronologyMaximaFollowThePartial = "joda-time/9"
minusOfMinValueOverflowsOnlyWhenTheResultDoes = "joda-time/10"
nextTransitionNeverGoesBackwards = "joda-time/11"
previousTransitionAtLongMaxIsTheLastTransition = "joda-time/12"
plusMonthsRespectsTheMaximumYear = "joda-time/13"
roundingAtTheLongExtremesOverflowsLoudly = "joda-time/14"
gjChronologyOctober1582HasThirtyOneDays = "joda-time/15"
lenientTwoDigitYearRequiresDigits = "joda-time/16"
twoDigitYearParseFailurePositionIsTheStart = "joda-time/17"
basicIsoFormatsRoundTripLargeYears = "joda-time/18"
