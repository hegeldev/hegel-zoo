name = "json-schema-validator"
language = "java"
upstream = "https://github.com/networknt/json-schema-validator"
subdir = ""
license = "Apache-2.0"
ai_policy_checked = "2026-09-19"

[base]
commit = "2575a025007dca1028df1105bb225e5f4397c3ea"
date = "2026-09-18"
version = "3.0.7"

[hegel]
version = "0.6.0"

[run]
# Build and install the library into the local Maven repository at the version the pom declares
# (hegel/pom.xml depends on that version - update `json-schema-validator.version` there when a bump
# changes it). Tests, javadoc, sources, signing and the release checks are skipped. The tests need a
# python3 with the jsonschema package (4.26+) on PATH as the oracle.
setup = [
  "mvn -q -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Denforcer.skip=true -Drat.skip=true -Dpmd.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true -Djapicmp.skip=true -Dcyclonedx.skip=true -Danimal.sniffer.skip=true -Dspotless.check.skip=true install",
]

[expected_failures]
hegelPinContainsBoundsIgnoreNonArrays = "json-schema-validator/1"
hegelPinUnevaluatedPropertiesHonoursFailFast = "json-schema-validator/2"
hegelPinUniqueItemsIgnoresNonArrays = "json-schema-validator/3"
