# Bugs found in networknt/json-schema-validator (3.0.7) by the Hegel zoo. One [[bug]] per finding;
# `test` names the JUnit pin in hegel/src/test/java/zoo/PinsTest.java that fails while the bug
# exists (listed under [expected_failures] in target.toml). Oracle: Python's jsonschema package
# (4.26, with `referencing`) through a python3 child process, plus the library's own documentation
# (README.md: failFast, typeLoose, output formats). No AI policy in README.md or CONTRIBUTING.md
# (checked 2026-09-19).

[[bug]]
id = "json-schema-validator/1"
title = "contains with maxContains below minContains makes every non-array instance invalid"
kind = "wrong-result"
severity = "medium"
test = "hegelPinContainsBoundsIgnoreNonArrays"
found = { commit = "2575a025007dca1028df1105bb225e5f4397c3ea", version = "3.0.7", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
MinMaxContainsValidator (keyword/MinMaxContainsValidator.java) analyses minContains and
maxContains when the schema is built: a maxContains smaller than minContains (the default
minContains being 1, so any `maxContains: 0`) is remembered as `minContainsVsMaxContains`, and
validate() then emits that analysis as an error for every instance it is asked about, whatever the
instance's type. contains, minContains and maxContains apply to arrays only (drafts 2019-09 and
2020-12, "Validation Keywords for Arrays"), so `{"type": "integer", "contains": true,
"maxContains": 0}` must accept 5; the library reports "minContains must less than or equal to
maxContains" and rejects it (python-jsonschema: valid). Such a schema is legal (the meta-schema
puts no relation between the two bounds; it merely accepts no non-empty array). With both keywords
explicit the analysis is attached to both validators, so the same error is reported twice
(`{"contains": true, "minContains": 2, "maxContains": 1}` on "x" gives two identical errors).
Found by hegelValidationAgreesWithPythonJsonschema and hegelErrorLocationsMatchTheFailingInstances,
which gate on the `minContainsVsMaxContains` keyword.
'''

[[bug]]
id = "json-schema-validator/2"
title = "unevaluatedProperties ignores failFast and reports every offending property"
kind = "contract"
severity = "low"
test = "hegelPinUnevaluatedPropertiesHonoursFailFast"
found = { commit = "2575a025007dca1028df1105bb225e5f4397c3ea", version = "3.0.7", hegel = "0.6.0", date = "2026-09-19" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
README.md documents failFast as "Whether to return failure immediately when an assertion is
generated" (SchemaRegistryConfig and ExecutionConfig). UnevaluatedPropertiesValidator.validate
(keyword/UnevaluatedPropertiesValidator.java, "Save flag as nested schema evaluation shouldn't
trigger fail fast") switches fail-fast off while it validates the unevaluated properties against
its subschema, or adds one error per property for `unevaluatedProperties: false`, and switches it
back on only afterwards - so none of these assertions stops the validation, and all of them are
reported. With failFast on, `{"type": "object", "unevaluatedProperties": {"type": "string"}}`
validated against {"a": 1, "b": 2, "c": 3} returns three errors (/a, /b, /c), and
`"unevaluatedProperties": false` also three, while the sibling keywords additionalProperties and
unevaluatedItems return one. The comment is copied from ContainsValidator, where the nested errors
are discarded; here they are kept. The validity verdict (and so the BOOLEAN and FLAG output
formats, which turn failFast on) is unaffected; the cost is the work and memory failFast is meant
to save. Found by hegelOutputFormatsAgree (at most one error under failFast), which gates on
unevaluatedProperties.
'''

[[bug]]
id = "json-schema-validator/3"
title = "uniqueItems rejects an object whose members have equal values"
kind = "wrong-result"
severity = "medium"
test = "hegelPinUniqueItemsIgnoresNonArrays"
found = { commit = "2575a025007dca1028df1105bb225e5f4397c3ea", version = "3.0.7", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
UniqueItemsValidator.validate (keyword/UniqueItemsValidator.java) never checks that the instance
is an array: it runs `for (JsonNode n : node)` over whatever node it is given and adds an error as
soon as two children share a comparison key. Iterating a Jackson ObjectNode yields its member
values, so `{"uniqueItems": true}` rejects `{"a": 1, "b": 1}` (and `{"a": null, "b": null}`) on
every draft with "must have only unique items in the array", while `{"a": 1, "b": 2}` passes;
scalars iterate nothing and pass. uniqueItems is a "Validation Keyword for Arrays" in every draft
(4 through 2020-12) and must be ignored for other types (python-jsonschema: valid). Found by
hegelValidationAgreesWithPythonJsonschema in the first round after the generators were rewritten
in combinator style (2026-09-23): the shrunk case was the schema `{"uniqueItems": true}` and the
instance `{"a": null, "b": null}`; the old generators could reach the shape but never did in a
hundred cases. hegelErrorLocationsMatchTheFailingInstances sees the same extra uniqueItems error
next to a type error when the schema also says `"type": "array"`. Both gate on a uniqueItems error
whose instance location is not an array.
'''

[[bug]]
id = "json-schema-validator/4"
title = "a count keyword above Integer.MAX_VALUE (minLength, maxItems, ...) is refused as an invalid schema"
kind = "crash"
severity = "low"
test = "hegelPinCountKeywordsAcceptLargeValues"
found = { commit = "2575a025007dca1028df1105bb225e5f4397c3ea", version = "3.0.7", hegel = "0.6.0", date = "2026-09-23" }
status = "open"
upstream_issue = ""
fixed_in = ""
notes = '''
`{"minLength": 4294967296}` is a legal schema (a non-negative integer) that python-jsonschema's `check_schema` accepts and validates as expected (`"a"` is too short), but `SchemaRegistry.getSchema` throws `SchemaException` wrapping Jackson's `intValue()` overflow: `MinLengthValidator`, `MaxLengthValidator`, `Min/MaxItemsValidator`, `Min/MaxPropertiesValidator` and (from draft 6) `ContainsValidator` for `minContains`/`maxContains` read the keyword with `schemaNode.intValue()`, which refuses any value above 2^31-1 and any double outside the int range such as `1e10`, on every draft. A bound larger than any Java string or collection can be should simply hold (max) or fail (min). Found by hegelMetaSchemaValidationAgreesWithCheckSchema in a 1000-case run after the generators were rewritten in combinator style (2026-09-23), a mutation having set `minLength` to `1099511627776`; the property tolerates the `SchemaException` when `hasHugeCount(doc)` finds such a keyword.
'''
