# Pinned Hegel library version per language. Single source of truth: every target's
# hegel.patch must add the dependency at exactly this version (`tools/zoo check` enforces).
# Bump with `tools/zoo bump-hegel <language> <version>`.

[rust]
package = "hegeltest"
version = "0.44.1"

[go]
package = "hegel.dev/go/hegel"
version = "v0.9.6"

[typescript]
package = "@hegeldev/hegel"
version = "0.4.5"

[java]
package = "dev.hegel:hegel"
version = "0.6.0"

[cpp]
package = "hegeldev/hegel-cpp"
version = "v0.12.1"

[ocaml]
package = "hegel"
version = ""
