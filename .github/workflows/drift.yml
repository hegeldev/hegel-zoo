name: drift

# Which targets' pinned base commits are behind their upstream's default branch. Read-only
# (git ls-remote per upstream, no clone, no build); the result is the job summary. Bumping a
# target is a human/agent job (`tools/zoo bump`), landed as a pull request.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

jobs:
  drift:
    name: base commits vs upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -o pipefail
          tools/zoo drift all > drift.txt
          {
            echo '## Targets behind upstream'
            echo
            echo '```'
            grep -E '^(behind|\?)' drift.txt || echo '(none)'
            echo
            tail -1 drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat drift.txt
