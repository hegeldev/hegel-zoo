name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    name: zoo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/zoo check
      - name: TROPHIES.md is up to date
        run: tools/zoo report && git diff --exit-code -- TROPHIES.md

  changed:
    name: list changed targets
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          for lang in rust; do
            list=$(git diff --name-only "$base" HEAD -- "targets/$lang/" tools/ zoo.toml \
              | grep -oE "^targets/$lang/[^/]+" | sort -u | sed "s|targets/||" | jq -R . | jq -sc .)
            # a change to the tool or the pins re-tests everything in that language
            if git diff --name-only "$base" HEAD -- tools/ zoo.toml | grep -q .; then
              list=$(ls targets/$lang | sed "s|^|$lang/|" | jq -R . | jq -sc .)
            fi
            echo "$lang=$list" >> "$GITHUB_OUTPUT"
          done

  rust:
    name: test ${{ matrix.target }}
    needs: changed
    if: needs.changed.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.changed.outputs.rust) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system libraries some upstream suites link against or read
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config liblzma-dev coinor-libcbc-dev tzdata-legacy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work/
          key: ${{ matrix.target }}-${{ hashFiles(format('targets/{0}/target.toml', matrix.target)) }}-${{ hashFiles('zoo.toml') }}
      - run: tools/zoo test ${{ matrix.target }}
