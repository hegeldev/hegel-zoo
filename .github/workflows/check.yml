name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    name: zoo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/zoo check
      - name: TROPHIES.md is up to date
        run: tools/zoo report && git diff --exit-code -- TROPHIES.md

  changed:
    name: list changed targets
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      go: ${{ steps.diff.outputs.go }}
      typescript: ${{ steps.diff.outputs.typescript }}
      java: ${{ steps.diff.outputs.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          for lang in rust go typescript java; do
            # `grep` exits 1 when a language has no changed target; under `pipefail` that
            # would fail the step, so an empty match is made explicit (jq -s of nothing is []).
            list=$(git diff --name-only "$base" HEAD -- "targets/$lang/" tools/ zoo.toml \
              | { grep -oE "^targets/$lang/[^/]+" || true; } | sort -u | sed "s|targets/||" | jq -R . | jq -sc .)
            # a change to the tool or the pins re-tests everything in that language
            if git diff --name-only "$base" HEAD -- tools/ zoo.toml | grep -q .; then
              list=$(ls targets/$lang | sed "s|^|$lang/|" | jq -R . | jq -sc .)
            fi
            echo "$lang=$list" >> "$GITHUB_OUTPUT"
          done

  rust:
    name: test ${{ matrix.target }}
    needs: changed
    if: needs.changed.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.changed.outputs.rust) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system libraries some upstream suites link against or read
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config cmake liblzma-dev coinor-libcbc-dev tzdata-legacy distro-info distro-info-data r-base-core python3-pip python3-debian python3-apt dpkg-dev libdpkg-perl devscripts lintian libtext-glob-perl patchutils quilt busybox-static
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work/
          key: ${{ matrix.target }}-${{ hashFiles(format('targets/{0}/target.toml', matrix.target)) }}-${{ hashFiles('zoo.toml') }}
      - run: tools/zoo test --show-failures ${{ matrix.target }}

  go:
    name: test ${{ matrix.target }}
    needs: changed
    if: needs.changed.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.changed.outputs.go) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4 # go/goldmark's oracles run under node
        with:
          node-version: 22
      - name: reference tools some Go targets test against (lz4, brotli, ruby, gettext, Python jsonschema)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lz4 brotli ruby gettext python3-venv
          # the Python jsonschema oracle in a venv that shadows the runner's python3: the image's own
          # jsonschema is old (no referencing, $recursiveRef ignored) and pip leaves it in place;
          # the venv also needs what target setups import (go/go-yaml, go/yaml: yaml) and the oracle of
          # go/phonenumbers (the Python port at the metadata version of targets/go/phonenumbers), go/miekg-dns (dnspython), go/cascadia (soupsieve + beautifulsoup4), go/xpath (lxml), go/gonja (jinja2), go/gqlparser (graphql-core)
          python3 -m venv "$RUNNER_TEMP/zoo-py" && "$RUNNER_TEMP/zoo-py/bin/pip" install -q 'jsonschema>=4.26' pyyaml 'phonenumbers==9.0.38' 'dnspython==2.8.0' 'soupsieve==2.9.2' 'beautifulsoup4==4.15.0' 'lxml==6.1.3' 'jinja2==3.1.6' 'graphql-core==3.2.12'
          echo "$RUNNER_TEMP/zoo-py/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zoo-py/bin/python3" -c 'import jsonschema, sys; print("python", sys.version.split()[0], "jsonschema", jsonschema.__version__)'
      - run: tools/zoo test --show-failures ${{ matrix.target }}

  typescript:
    name: test ${{ matrix.target }}
    needs: changed
    if: needs.changed.outputs.typescript != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.changed.outputs.typescript) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PyYAML with libyaml, the oracle for js-yaml; venv for parse5's html5lib oracle
        run: sudo apt-get install -y -qq python3-yaml python3-venv
      - run: tools/zoo test --show-failures ${{ matrix.target }}

  java:
    name: test ${{ matrix.target }}
    needs: changed
    if: needs.changed.outputs.java != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.changed.outputs.java) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ matrix.target }}-${{ hashFiles(format('targets/{0}/target.toml', matrix.target)) }}-${{ hashFiles('zoo.toml') }}
      - name: PyYAML with libyaml, the oracle for snakeyaml; Python jsonschema (venv) for json-schema-validator
        run: |
          sudo apt-get install -y -qq python3-yaml python3-venv
          # the Python jsonschema oracle in a venv that shadows the runner's python3 (the image's own
          # jsonschema is old); the tests only need jsonschema and referencing there
          python3 -m venv "$RUNNER_TEMP/zoo-py" && "$RUNNER_TEMP/zoo-py/bin/pip" install -q 'jsonschema>=4.26'
          echo "$RUNNER_TEMP/zoo-py/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zoo-py/bin/python3" -c 'import jsonschema, sys; print("python", sys.version.split()[0], "jsonschema", jsonschema.__version__)'
      - run: tools/zoo test --show-failures ${{ matrix.target }}
