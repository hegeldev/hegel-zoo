name: full run

# Every target, weekly. Failures that are not expected, and expected failures that pass
# (bug fixed upstream?), show in each job's output and in the summary.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  shard:
    name: list targets
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.list.outputs.rust }}
      go: ${{ steps.list.outputs.go }}
      typescript: ${{ steps.list.outputs.typescript }}
      java: ${{ steps.list.outputs.java }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          # split each language's targets into shards of up to 20
          for lang in rust go typescript java; do
            ls targets/$lang 2>/dev/null | sed "s|^|$lang/|" | xargs -n20 echo | jq -R . | jq -sc . \
              | sed "s|^|$lang=|" >> "$GITHUB_OUTPUT"
          done

  rust:
    name: rust shard
    needs: shard
    if: needs.shard.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard.outputs.rust) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system libraries some upstream suites link against or read
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config cmake liblzma-dev coinor-libcbc-dev tzdata-legacy distro-info distro-info-data r-base-core python3-pip python3-debian python3-apt dpkg-dev libdpkg-perl devscripts lintian libtext-glob-perl patchutils quilt busybox-static
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-registry-${{ hashFiles('zoo.toml') }}
      - shell: bash
        run: |
          set -o pipefail
          # 10x Hegel's default budget: the weekly run has the time, and a fresh search per
          # property is the point of re-running targets whose upstream has not moved
          tools/zoo test --show-failures --test-cases 1000 ${{ matrix.shard }} | tee -a "$GITHUB_STEP_SUMMARY"

  go:
    name: go shard
    needs: shard
    if: needs.shard.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard.outputs.go) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4 # go/goldmark's oracles run under node
        with:
          node-version: 22
      - name: reference tools some Go targets test against (lz4, brotli, ruby, gettext, Python jsonschema)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lz4 brotli ruby gettext python3-venv
          # the Python jsonschema oracle in a venv that shadows the runner's python3: the image's own
          # jsonschema is old (no referencing, $recursiveRef ignored) and pip leaves it in place;
          # the venv also needs what target setups import (go/go-yaml, go/yaml: yaml) and the oracle of
          # go/phonenumbers (the Python port at the metadata version of targets/go/phonenumbers), go/miekg-dns (dnspython), go/cascadia (soupsieve + beautifulsoup4), go/xpath (lxml), go/gonja (jinja2), go/gqlparser (graphql-core)
          python3 -m venv "$RUNNER_TEMP/zoo-py" && "$RUNNER_TEMP/zoo-py/bin/pip" install -q 'jsonschema>=4.26' pyyaml 'phonenumbers==9.0.38' 'dnspython==2.8.0' 'soupsieve==2.9.2' 'beautifulsoup4==4.15.0' 'lxml==6.1.3' 'jinja2==3.1.6' 'graphql-core==3.2.12'
          echo "$RUNNER_TEMP/zoo-py/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zoo-py/bin/python3" -c 'import jsonschema, sys; print("python", sys.version.split()[0], "jsonschema", jsonschema.__version__)'
      - shell: bash
        run: |
          set -o pipefail
          tools/zoo test --show-failures --test-cases 1000 ${{ matrix.shard }} | tee -a "$GITHUB_STEP_SUMMARY"

  typescript:
    name: typescript shard
    needs: shard
    if: needs.shard.outputs.typescript != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard.outputs.typescript) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PyYAML with libyaml, the oracle for js-yaml
        run: sudo apt-get install -y -qq python3-yaml
      - shell: bash
        run: |
          set -o pipefail
          tools/zoo test --show-failures --test-cases 1000 ${{ matrix.shard }} | tee -a "$GITHUB_STEP_SUMMARY"

  java:
    name: java shard
    needs: shard
    if: needs.shard.outputs.java != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard.outputs.java) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: PyYAML with libyaml, the oracle for snakeyaml; Python jsonschema (venv) for json-schema-validator
        run: |
          sudo apt-get install -y -qq python3-yaml python3-venv
          # the Python jsonschema oracle in a venv that shadows the runner's python3 (the image's own
          # jsonschema is old); the tests only need jsonschema and referencing there
          python3 -m venv "$RUNNER_TEMP/zoo-py" && "$RUNNER_TEMP/zoo-py/bin/pip" install -q 'jsonschema>=4.26'
          echo "$RUNNER_TEMP/zoo-py/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zoo-py/bin/python3" -c 'import jsonschema, sys; print("python", sys.version.split()[0], "jsonschema", jsonschema.__version__)'
      - shell: bash
        run: |
          set -o pipefail
          tools/zoo test --show-failures --test-cases 1000 ${{ matrix.shard }} | tee -a "$GITHUB_STEP_SUMMARY"
