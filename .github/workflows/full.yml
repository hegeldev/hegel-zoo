name: full run

# Every target, weekly. Failures that are not expected, and expected failures that pass
# (bug fixed upstream?), show in each job's output and in the summary.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  shard:
    name: list targets
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.list.outputs.rust }}
      go: ${{ steps.list.outputs.go }}
      typescript: ${{ steps.list.outputs.typescript }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          # split each language's targets into shards of up to 20
          for lang in rust go typescript; do
            ls targets/$lang 2>/dev/null | sed "s|^|$lang/|" | xargs -n20 echo | jq -R . | jq -sc . \
              | sed "s|^|$lang=|" >> "$GITHUB_OUTPUT"
          done

  rust:
    name: rust shard
    needs: shard
    if: needs.shard.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard.outputs.rust) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system libraries some upstream suites link against or read
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config cmake liblzma-dev coinor-libcbc-dev tzdata-legacy distro-info distro-info-data r-base-core python3-pip python3-debian python3-apt dpkg-dev libdpkg-perl devscripts lintian libtext-glob-perl patchutils quilt busybox-static
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-registry-${{ hashFiles('zoo.toml') }}
      - shell: bash
        run: |
          set -o pipefail
          # 10x Hegel's default budget: the weekly run has the time, and a fresh search per
          # property is the point of re-running targets whose upstream has not moved
          tools/zoo test --test-cases 1000 ${{ matrix.shard }} | tee -a "$GITHUB_STEP_SUMMARY"

  go:
    name: go shard
    needs: shard
    if: needs.shard.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard.outputs.go) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - shell: bash
        run: |
          set -o pipefail
          tools/zoo test --test-cases 1000 ${{ matrix.shard }} | tee -a "$GITHUB_STEP_SUMMARY"

  typescript:
    name: typescript shard
    needs: shard
    if: needs.shard.outputs.typescript != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shard.outputs.typescript) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PyYAML with libyaml, the oracle for js-yaml
        run: sudo apt-get install -y -qq python3-yaml
      - shell: bash
        run: |
          set -o pipefail
          tools/zoo test --test-cases 1000 ${{ matrix.shard }} | tee -a "$GITHUB_STEP_SUMMARY"
